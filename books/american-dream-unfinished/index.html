{"type": "text", "text": "美國在中國的工商業，是經過幾代人經營起來的，日本人卻用壟斷措施、外匯管制和其他全屬非法的手段使之毀於一旦，這是因為日本人要在經濟、金融、政治各方面把工商業領域全部控制起來。……我深深感到日本若仍堅持目前的政策，就等於往礁石直衝。"}, {"type": "text", "text": "——1940年9月2日，"}, {"type": "text", "text": "美國駐東京大使格魯（Joseph C. Grew）日記"}, {"type": "text", "text": "前言"}, {"type": "text", "text": "1937年7月，中日全面戰爭爆發。日本除了持續強化其自九一八事變後即占有滿洲全土的政經控制之外，接著在華北和華中等各個占領區進行經濟擴張與壟斷。日本在中國及東亞的擴張引起美國的關注，美國政府開始策劃從經濟上進行抵制策略。1939年下半年開始，美國政府著手單方面廢除《日美通商航海條約》（簡稱《日美商約》，使日本進入美國的貨品不再享有關稅上的互惠平等，以抵制日本在中國的經濟壟斷 $^{1}$ 。1940年1月，《日美商約》廢止生效。3月，美國政府貸款給中國政府2千萬美元。該年9月，當日本與德、義正式簽定「軸心國」協定後，美國宣布對日本的進一步禁運措施，包括飛機製造等一切軍用技術及備件、生產用機械和戰略物資等。而另一方面，從1940年起，日本在華北實施《產業開發第一次五年計畫修正案》，對華北的煤、鐵、棉等重要產業的生產及營運，以及華北的交通、能源、通訊等設施進行統制及壟斷措施 $^{2}$ 。"}, {"type": "text", "text": "伴隨著華北的緊張情勢及美國政府的遠東政策，引起在華美商的不安。但究竟美國在華企業面對日本日益強大的商業擴張和壟斷有何具體回應和採取怎樣的手段？其與美國政府之對華政策有何關係？中日戰爭時期美國在華企業的經營策略和以往有何不同？過去對於此一題旨並未有較完整的分析。理由或許在於外交史學者著重遠東政策的政治層面，而企業史學者著重美國在華投資等經濟層面的分析；即便以探討中美經貿與外交關係而論，研究1937年中日戰爭爆發至珍珠港事件前夕美國在華投資的相關研究顯然相對不足 $^{3}$ 。高家龍在〈企業、政府與中日戰爭〉一文中，處理以下三個個案：一、中國大企業——申新紡織廠（榮宗敬）與國民黨政府的衝突；二、日本大企業——南滿鐵道株式會社與日本軍方的競爭；三、美國大企業——美孚石油公司（Standard Vacuum Oil Company）與美國國務院與中國的合作，著重1930年代初期 $^{4}$ 。高家龍的這篇文章比較戰時中、日、美三國的大企業及其政府政策的關係，從企業史和政治史的跨域研究，頗具別出新裁之意，但該文與本章著重的華北危機的時間點所突顯的美國遠東政策和經濟利益間的緊張關係，所關懷的問題仍有所不同。"}, {"type": "text", "text": "1 1911年簽訂的《日美商約》為近代美、日關係的第一個平等條約，讓日本取得關稅自主權。1939年7月26日，美國國務院照會日本駐美大使堀內謙介（Horinouchi），表示美國擬廢除1911年2月21日所簽訂之《美日通商條約》，依該條約第17款所規定條約之終止將自照會起始之六個月後生效。The Secretary of State to the Japanese Ambassador Horinouchi, July 26, 1939, FRUS, 1939, Vol. III, pp. 558-559."}, {"type": "text", "text": "3 探討民國時期外人在華投資和中美經貿的相關著作中，多數專著係以1937年作為時間下限。例如侯繼明的研究專書：Hou, Chi-ming. Foreign Investment and Economic Development In China, 1840-1937 (Cambridge, Mass.: Harvard University Press, 1965)。仇華飛，《中美經濟關係研究，1927-1937》（北京：人民出版社，2002）。國民政府前財經顧問楊格（Arthur Young）所著《中國與戰時援助，1937-45》（China and the Helping Hand, 1937-45, Cambridge, Mass: Harvard University press, 1962）主要環繞如何控制通貨膨脹和財政穩定，討論抗戰時期中國向美國及國際社會尋求財政（稅制、貨幣、金本位制問題）、軍事和技術的援助，與本文著重美國企業在中國的活動，重點大為不同。"}, {"type": "text", "text": "2 Li Lincoln, The Japanese Army on North China, 1937-1941, Problems of Political and Economic Control (London: Oxford University, 1975), pp. 122-153. 居之芬、張利民主編，《日本在華北經濟統制掠奪史》（天津：天津古籍出版社，1997），頁153-170。"}, {"type": "text", "text": "4 Sherman Cochran, “Business, Governments, and War in China,” in Akira Iriye & Warren I. Cohen eds., American, Chinese, and Japanese Perspective on Wartime Asia, 1931-1949 (Wilmington: Scholarly Resources Inc., 1990), pp. 117-146. 但後來高家龍的研究興趣轉向消費文化，並未針對此一主題再做進一步的研究。新近巫仁恕的研究《劫後「天堂」：抗戰淪陷後的蘇州城市生活》（台北：台"}, {"type": "text", "text": "在中日戰爭愈趨緊迫而美國政府尚未參戰前夕，美國在華企業面臨區域市場的生存危機，美國大企業在戰爭時期和「日偽」臨時政府的關係究竟該如何看待？其如何反映跨國公司的處境及其與美國政府的關係？繼滿洲國成立後，華北危機成為日本與各國在華利益的新衝突點，再一次考驗美國所宣稱的中國門戶開放政策和維繫遠東和平秩序的誠意。通過中國抗日戰爭時期外國公司在中國的商業活動，將有助於拓展我們對於戰爭史研究中不同國家和人民的不同處境及其行為動機的多元視角。過去的研究較多關注日本在滿洲國的經濟專斷，而對日本在華北經濟的壟斷及其導致相關利益國家的回應，研究成果顯然較少；而從美國的遠東政策而言，它正是日本邁向珍珠港事件（1941年12月）之前的一場硝煙，適足以測試當華北利益傷及美國僑民之際，美國政府的因應之道及其對遠東安全策略的整體布置。本章討論時間主要以1939年下半年起日本在華北勢力的擴大，而美國政府謀思廢除《日美商約》等經濟制裁日本的措施為始，下迄於1941年12月9日珍珠港事變發生。擬以美國在華的兩大跨國公司——大來公司和英美煙公司作為考察對象，探討中日戰爭時期美國在華企業之遭逢。"}, {"type": "text", "text": "一、關閉個案——美國大來青島分行"}, {"type": "text", "text": "(一) 大來分公司在華北"}, {"type": "text", "text": "1940年初，美國駐北京公使詹森（Nelson Trusler Johnson）針對日本進一步執行其在華北的政治與軍事控制計畫，向美國務院做了具體的情勢報告和分析："}, {"type": "text", "text": "日本當局正以其強大的國家政策組織，對於各項重要經濟活動進行全面壟斷，包括運輸、交通、工業、農業和銀行。這些大部分的組織是所謂「臨時政府」（Provisional Government）下成立的「合股公司」（joint-stock companies），可視為中日合資，但是中國的持分遠少於日本，在多數的個案中，中國的資產被日本所接管。雖然有些大型組織仍掛有中國頭銜，實權均掌控在日本人手中。這些組織的立即目標是："}, {"type": "text", "text": "一、為日本軍隊的占領提供運輸和補給。"}, {"type": "text", "text": "二、生產、強行徵收或以低價格購買原料，以提供日本母國工業之所需。"}, {"type": "text", "text": "三、使華北成為日本企業的獨占區，並成為日本剩餘產品的傾銷地。5"}, {"type": "text", "text": "詹森的電報透露對美國在華北利益的不安。他的結論是日本正在華北複製其滿洲經驗，通過對占領區的經濟控制，形成與日本帝國互通聲息的網絡。此舉嚴重違反「門戶開放」政策，除非美國政府有力挑戰，否則無疑將導致美國在華北地區的合法貿易被排擠出來 $^{6}$ 。"}, {"type": "text", "text": "灣大學出版中心，2017），則是透過蘇州的茶館、菜館、旅館與煙館等四種休閒行業的研究，呈現抗戰時期蘇州「畸形繁榮」的城市生活、淪陷區城市仍持續進行的商業化活動，以及蘇州城市社會結構的變遷。該書的導論對戰時上海城市的經濟活動、社會控制和城市文化等面向有較全面的回顧。"}, {"type": "text", "text": "5 The Ambassador in China(Nelson T. Johnson) to the Secretary of State, Jan. 15, 1940, FRUS, 1940, Vol. IV, p. 262."}, {"type": "text", "text": "就在詹森向國務院報告的同時，美國在華最大的貨運公司——大來公司（Robert Dollar Company），在華北的主要營業為木材運輸與經銷，正飽受日本公司在華北的競爭和市場侵吞而面臨關閉。同時美國在華最大煙草公司——英美煙公司在華北市場亦面臨是否與日本企業合作的抉擇。這兩家大企業在華市場的活動有其指標意義。"}, {"type": "text", "text": "大來輪船公司（Dollar Steamship Company，或稱Dollar Line），由勞勃·大來所創始。原為蘇格蘭人。其事業起於1893年購得美國太平洋岸一間鋸木工廠，後來他和兒子史丹利（Stanley Dollar）建立大來輪船公司，經營貨運生意。1902年，該公司開始插足國際運輸業，經營租船航次（chartered voyage）到橫濱和菲律賓。1916年，該公司在加拿大英屬哥倫比亞Roche Point購得一百畝地建造木材工廠即大來頓廠（Dollarton）。1920年代該公司購得美國政府7艘總統型號的輪船，以及接收太平洋郵船公司，成為全球獲利最大的船運公司之一。1929年經濟大恐慌發生，該公司的營運雖受影響，但仍繼續擴張，除購得新輪船，並開闢橫跨太平洋的客輪。同年公司更名為大來輪船有限公司（Dollar Steamship Line Inc. Ltd.）。1930年代初，大來公司向美國政府大筆借款打造「胡佛總統號」（SS President Hoover）、「柯立芝總統號」（SS President Coolidge）為橫跨太平洋的客輪，同時大來公司也成為掛著美國國旗的最大一家貨運與客輪公司 $^{7}$ 。"}, {"type": "text", "text": "勞勃·大來對中國的首航是1901年，他率領「阿拉伯號」（Arab）滿載木材來到中國，然因所載木料不受歡迎而賠本而歸，但他並未灰心，反而更有意探尋中國木材市場和其他商品的生意。大來公司以其雄厚資本、研發特製的木材質量，並以削價競爭等行銷策略，很快地打進中國木材市場，在1920年代幾乎壟斷中國木材進口業 $^{8}$ 。在航運方面，他亦投資中國的內河航行運輸，1920年起懸掛美國國旗的大來號商船開始定期航行於上海、重慶口岸，但長江航運的經營在中國內戰動亂時期充滿風險，利潤不大。1930年代以後，大來在中國內河航運的經營事業沒落，仍以經營大洋航線為主，而大來公司在華北的木材市場始終居於領先地位 $^{9}$ 。"}, {"type": "text", "text": "1941年6月，美國駐青島領事邁爾（Paul W. Meyer）致國務院的密電，透露大來公司青島分行將於該月底關閉。理由是從北美西岸到青島的木材營運，無法和日本公司所享有的優惠貨運費、稅率以及半官方所掌控的組織在青島和整個山東省的木材營運互相競爭 $^{10}$ 。大來青島分行於1924年5月開張，有經理1名及聘僱6名當地職員，辦公室為租賃，由於公司關閉，美國經理將被資遣回國，6名職員也將被解僱 $^{11}$ 。"}, {"type": "text", "text": "7 Robert Dollar, Memoirs of Robert Dollar (San Francisco: Privately published for the author by Schwabacher-Frey, 1918)."}, {"type": "text", "text": "8 阮渭經，〈美商大來洋行在中國的掠奪〉，收入：《淘金舊夢：在華洋商紀實》（北京：中國文史出版社，2001），頁78-96。"}, {"type": "text", "text": "9 David H. Grover, American Merchant ships on the Yangtze, 1920-1941 (Westport, Connecticut: Praeger Publisher, 1992), pp. 75-84. 除航運和木材兩大主要業務之外，大來公司也經營進出口業務，另外，亦設有一家環球無線電公司，以收發無電報為主要業務。大來公司在上海設有總部，於天津、漢口、北京、南京、蕪湖、青島、漢口、重慶、廣州、香港等地設有分支機構。中國人一般稱之為大來洋行。阮渭經，〈美商大來洋行在中國的掠奪〉，頁91。"}, {"type": "text", "text": "6 The Ambassador in China (Nelson T. Johnson) to the Secretary of State, Jan. 15, 1940, FRUS, 1940, Vol. IV, p. 262."}, {"type": "text", "text": "大來公司從加拿大或美國進口的木材貿易長期以來在華北市場占有一枝獨秀的地位，包括原木、地板材料和木板製品等。青島分公司在當地並未經營鋸木工廠，它的地板材料和木材製品主要由加拿大英屬哥倫比亞的大來頓廠供應。從1932年至1940年間，大來青島分行的木材交貨量和當地市場占有率，如表7-1："}, {"type": "text", "text": "由表7-1，可知華北地區當時木材市場需求量頗大，多用於重建各項設施之建材，此外作為鐵路、礦業、房子和公共工程的材料，其市場需求量亦不少。由附錄7-1：大來青島分公司與英、日公司的木材營運比較可知，1937年以前大來公司在華北可謂獨占鰲頭，直到1938年才首度被英國的中華進口公司（China Import Co.）超越。1938年以後日本迅速進入華北的木材營運市場，各家運輸公司競相出頭，使得大來公司青島分行的業務由1939年的 $37.4\\%$ 市場占有率驟減為1940年的 $5.8\\%$ ，不僅落後於英國的中華進口公司 $10.2\\%$ ，且整個市場幾為日本所吞噬。日本最大的一家河田木材公司（Wada Lumber Co.）市場占有率由1939年的 $7.1\\%$ 躍升到1940年的 $41.1\\%$ 。其他日本公司的營運量亦超過英國和美國，而中國在青島的木材航運公司的營運早於1932年即遠不如英、美國家的優勢。"}, {"type": "text", "text": "日本公司之所以能快速控制青島木材市場，主要來自日本政府的經濟壟斷，並以具體手段對進出口、木材經銷和運費進行控制。此外，日本占領華北後，企圖掌控華北金融，於1938年2月11日創辦中國聯合準備銀行（Federal Reserve Bank, FRB）。總行設於北京，另在天津、青島、濟南、開封等地設立辦事處。該行強迫中國銀行、交通銀行、大陸銀行等數家銀行共同出資，並企圖以該行發行的紙幣（聯銀券）變成唯一合法的貨幣，藉此掌控物資流通及外匯 $^{12}$ 。日本在華北木材市場的操盤如下："}, {"type": "text", "text": "10 American consul in Tsingtao (Paul W. Meyer) to the Secretary of States, June 21, 1941. No. 893.5034/404, pp. 1-2. U.S. Department of State, Confidential U.S. State Department central files. China, 1940-1944: Internal Affairs. United States National Archives, Washington D.C. (microform) 以下簡稱 Internal Affairs."}, {"type": "text", "text": "11 American consul in Tsingtao (Paul W. Meyer) to the Secretary of States, June 21, 1941. pp. 1-8. Internal Affairs, No. 893.5034/404."}, {"type": "text", "text": "12 至於聯合準備銀行究竟發揮多大的作用，學界的看法不一。國民政府財經顧問楊格認為1939秋至1940年年中「聯銀券」和法幣在華北的價值相當。但之後法幣逐漸掉價，並在1941愈為惡化。根本原因是「聯銀券」的貶值沒有重慶政府統治區的法幣貶值那樣快速，到1941年聯銀券成為華北日軍占領區最重要的貨幣。China and the Helping Hand, 1937-45, p. 158. 也有學者認為聯合"}, {"type": "text", "text": "對進出口和外匯率，日本進行嚴格管制，木材進口業實際由日本政府建立一套壟斷機制，由指派的四家日本木材公司取得訂單和交貨。他們是三井物產會社（Mitsui Bussan Kaisha）、三菱貿易公司（Mitsubishi Trading Company）、山長建材公司（Yamacho Lumber Company）和田村商店（Tamura Shoten）等四家公司組成的「日美進口公司」（Japan-American Importing Company）。這套制度不僅存在青島，實則全面實施於華北地區。從1940年6月29日開始，日本在華北全面實施木材進口法令，主管部門設於北京，控制從日本本土、東北、韓國和中國所有占領區的木材到中國不同港口，同時也控制從中國占領區木材的再出口；除非獲得日本控制的聯合準備銀行的進口批可，是不可能從日本和中國以外的地區進口木材。在青島還設有「木材運輸協會」（Lumber Importers Association），除非獲得該協會的同意，中國業者不能進口木材或再出口木材，而此一協會完全掌控在當地最大的數家日本木材公司手中 $^{13}$ 。"}, {"type": "text", "text": "此外，青島木材銷售中還有兩個障礙。其一、外匯的支付問題：雖然所有外國輪船公司依照「太平洋西航會議」（Pacific Westbound Conference）均同意遵照航行太平洋海域到東方的木材貨運費率，然而歐美貨運公司長久懷疑日本業者根本逃避這些費率，他們藉由日本輪船公司的名義以當地匯率支付貨運費。如此一來，木材進口到中國的運輸成本不同，在市場上的開價就不同，特別是目前木材進口的貨運費大約是木材成本價格的一成到一成半。這種懷疑基於木材價格在美國的行情及在中國銷售市價的評估，鑑於日本木材商的低售價，應是以當地輪船公司的名義鑽營貨運費的結果。二、為大型建物所需的木材採購，完全操控於日本政府及日本代理商手中，例如鐵路建造等工程。從1940年6月開始，華北地區的鐵路和軍事合同中的木材原料直接經由日本木材商而非透過當地業者。因此當地業者的獲利比起以前約損失80% $^{14}$ 。"}, {"type": "text", "text": "（二）日本航運政策對大來分公司的遮斷"}, {"type": "text", "text": "在航運政策方面，從1937年以後，日本海軍就發表所謂「遮斷航行」宣言，封鎖渤海灣與南方的航路，1937年底又宣布封鎖中國全部領海。1939年9月，日本繼續禁止第三國船隻在中國沿海航行，這樣日本幾乎控制中國的領海權，大大影響各國輪船進出華北各港口。與此同時，日本在華輪船迅速增加，不僅原有的日本郵船、日清汽船、大阪商船、大連汽船等會社繼續擴大航運範圍。此外，為進一步強化航運業，以日本郵船、大阪商船為基礎成立東亞海運株式會社，該會社兼併了往來於中日之間的各家航運公司，專門經營中日、中國沿海及中國與其他國家之間的航運業，使華北各港口的航運業幾乎全被日本掌控。據海關資料顯示1938年進出天津的船隻共5,808隻（5,570,559噸），其中日本船舶有3,203隻（2,292,607噸），占55.5%。1940日本進出港船舶分別占所有船隻和噸位總數的70.70%和65.48%。在青島的情況亦一樣，1938進出青島港的日本船舶占總數的62%，到1940年上升至80%以上；噸位數由1938年的76.5%，到1940年上升至90%左右 $^{15}$ 。"}, {"type": "text", "text": "準備銀行由於在國際貨幣市場沒有價值，且因只能通行於華北，不能直接在日本購買產品進口，其所起的作用有限。再者，由於戰爭局勢的惡化和交通中斷問題，造成通貨膨脹。雖然官方資料的出口統計，日本占領後的出口金額沒有下滑；然而，事實上由於貨幣的貶值，出口價值反為下降。Li Lincoln, The Japanese Army on North China, 1937-1941, Problems of Political and Economic Control, pp. 55, 144. 拙文說明大來公司的報告確係呈現美國企業在青島的進口業務和匯率轉換受制於聯合準備銀行的實情；至於聯合準備銀行對國際金融體系和日本進出口價值所起的實際的作用究竟有多大，則非本文所能一併討論。"}, {"type": "text", "text": "13 American consul in Tsingtao (Paul W. Meyer) to the Secretary of States, June 21, 1941. p. 4. Internal Affairs, No. 893.5034/404."}, {"type": "text", "text": "14 American consul in Tsingtao (Paul W. Meyer) to the Secretary of States, June 21, 1941, pp. 5-6. Internal Affairs, No. 893.5034/404."}, {"type": "text", "text": "如據青島商會的報告，日本船隻裝載貨運量的市場占有率，比中國海關所錄還高。英、美、日各國所占之市場比數，如表7-2："}, {"type": "text", "text": "不惟如此，日本軍方建造新碼頭，且壟斷華北各港口碼頭倉庫，除在天津興建「特三區碼頭」外，1940年8月華北交通公司碼頭完工，共760米長，兩座倉庫總面積達7,500米，為軍用、客貨用及散裝碼頭 $^{16}$ 。日軍在占領青島後，海、陸軍盤據港口碼頭和倉庫，到了1940年後開始更加明顯。據統計1940年後，在31個泊位中，除軍用、定期航班和煤鹽專用泊位外，很少有供貨船使用的泊位，而軍事用途的泊位則達30%，至於倉庫也多為軍隊所占領 $^{17}$ 。日本當局對外宣稱新增二個泊位貨棧供第三國家使用，但事實卻不然，他們甚至在貨棧和碼頭的貯放及搬運上進行刁難，據青島美國商會的報告如下："}, {"type": "text", "text": "1940年1月13日以來，沒有一位外國輪船公司得以使用二個新增的泊位貨棧和夜間作業的權利，事實上日本貨運公司的員工之前就對外宣稱外國輪船不得停泊此二個新增泊位或夜間作業的權利。任何一家貨運公司也不必期待將來有此一可能。這二個新的泊位早已保留給日本輪船公司，並繼續為日本利益所壟斷……許多申請新泊位的卷宗被歸檔，日本政府總是以各種理由拒絕外人使用這二個新泊位。 $^{18}$"}, {"type": "text", "text": "16 1938年8月，日本華北株式會社開始進行「特三區碼頭建設計畫」，它是在天津英、法租界各碼頭的下游，原德租界內，計畫兩年內使其年吞吐能力為100萬至120萬噸，碼頭岸線長約1,200米，可同時停靠2,000噸級船10艘，並另建造倉庫16座，5萬平方米，堆場12萬平方米，及鐵道岔道4條。李華彬，《天津港史》，古近代部分（北京：人民交通出版社，1986），頁214-217。"}, {"type": "text", "text": "17 中村隆英，《戰時日本の華北經濟支配》（東京都：山川出版社，1983），頁244-245。居之芬、張利民主編，《日本在華北經濟統制掠奪史》，頁185。1940年統計，青島港前方倉庫有8座，其中軍用倉庫占2座；後方倉庫16座，軍用倉庫11座。"}, {"type": "text", "text": "15《海關中外貿易統計資料年刊》，轉引自：居之芬、張利民主編，《日本在華北經濟統制掠奪史》（天津：天津古籍出版社，1997），頁185-186。"}, {"type": "text", "text": "18 Tsigtao American Chamber of Commerce, Biweekly Bulletin, No. 32. 上海市檔案館，Q-459-1-257, p. 159."}, {"type": "text", "text": "上述航運政策對大來公司及其他公司的影響，可舉例說明如下。一艘從太平洋岸裝載木材的輪船（Kozui Maru，應是日本貨運公司）於1940年初抵青島口岸，由日本代理商安排停靠第二號碼頭卸貨。這批貨係大來青島公司所託運的木材，就在卸貨之際，日本當局就以處理的速度過慢，因此強迫該船轉到後灣（Back Bay）停泊，並以筏船將貨品運上岸。結果大來公司就得多負擔三倍的卸貨和搬運費用。這種情況在英商亞細亞石油公司（Asiatic Petroleum Co.）和美商德士谷石油公司（Texaco Petroleum Co.）的油輪中也曾發生過，該油輪被迫中斷油管線運輸，只得轉到後灣，等待日本軍方的運輸船卸貨完畢，這樣這批油貨就耽擱了四天之久 $^{19}$ 。"}, {"type": "text", "text": "更有甚者是密西根號（The SS Michigan）的案例，該船為一艘將青島設為停靠港的美國籍貨輪，固定航行已有二年之久。1940年2月14日從太平洋岸載運一批木材抵達青島口岸。該公司的經銷商和美國駐青島領事館聯繫，希望安排二號或三號碼頭，但是竟遭到日方拒絕，儘管碼頭根本是閒置狀態。日方指派一號碼頭供第三國家貨輪使用，該泊位事實上太小，不利於搬運木材；唯一的取代方式，是轉到後灣卸貨，但不僅不便利且又耗損搬運費用 $^{20}$ 。"}, {"type": "text", "text": "相較之下，另一值得注意的事，只有2艘德籍輪船和2艘日籍輪船曾使用後灣卸貨。據非官方的統計數字，1939年度共有1,253艘日籍輪船盤踞所有碼頭，另有118艘中國籍輪船和14艘滿洲輪船使用過青島碼頭。此數字尚不包含頻繁載運日本軍人的小艇21。"}, {"type": "text", "text": "如上述分析，從中日戰爭以來，大來青島木材行的營運在1938年大受打擊，儘管1939年青島分行仍有約2,000,000板材量尺（board feet）的載運量，但隨著日本軍方對華北貿易的控制愈為嚴格，加以日本木材公司得享有優惠的貨運費率，官方及半官方組織直接向生產者下訂單的運作方式進入木材市場，以致大來公司的青島市場削減大半。1939年市場占有量為37.4%，到了1940年市場占有率僅有5.8%，因此，大來分公司不得不於1941年6月關閉青島分公司。美國駐青島領事邁爾只能無奈地表示，這是另一具體事例證明日本挑戰美國在中國的門戶開放政策 $^{22}$ 。由本文所示，1939年以後大來公司在華北的業務日形惡化，木材市場價格悉為日方所操控，且運輸碼頭亦為日本軍方所強占，美國國務院經由領事報告完全掌握和理解此一情況，但是美國政府對於大來公司的華北利益從未能積極處理，導致該公司不得不關閉分公司。"}, {"type": "text", "text": "二、從「觀望」到「合作」個案——英美煙公司在華北"}, {"type": "text", "text": "（一）日本排擠英美煙公司的手段"}, {"type": "text", "text": "1890年代，英、美煙草即進入中國市場，其中美國煙草大王杜克和英國的帝國煙草公司（Imperial Tobacco Company）雙方激烈競爭，最後於1902年合併創建英美煙公司，形成對中國煙草市場的壟斷 $^{23}$ 。據統計1919年英美煙公司的銷售量為309,028箱，是1902年的24倍（1902年為12,682箱）。英美煙公司獨步中國煙卷市場，在1920年代雖有華資的南洋兄弟煙草公司與其激烈競爭，但它在中國煙卷市場始終占有最大銷售量。1934年，英美煙公司在中國成立頤中煙草股份有限公司（Yee Tsoong Tobacco Co.）和頤中運銷煙草有限公司（Yee Tsoong Tobacco Distributors Co.），負責承擔中國市場的煙草製造和銷售業務 $^{24}$ 。在1937年日本入侵中國時，英美煙公司在中國和香港已擁有33家不同的企業，資本總額達28,840萬（8,480萬美元），其在中國各種資產的帳面價值達46,180萬元 $^{25}$ 。"}, {"type": "text", "text": "19 Tsigtao American Chamber of Commerce, Biweekly Bulletin, Feb. 15, 1940. 上海市檔案館，Q-459-1-257, p. 164."}, {"type": "text", "text": "20 Tsigtao American Chamber of Commerce, Biweekly Bulletin, Feb. 15, 1940. 上海市檔案館，Q-459-1-257, p. 164."}, {"type": "text", "text": "21 Tsigtao American Chamber of Commerce, Biweekly Bulletin, Feb. 15, 1940. 上海市檔案館，Q-459-1-257, p. 164."}, {"type": "text", "text": "22 American consul in Tsingtao (Paul W. Meyer) to the Secretary of States, June 21, 1941. pp. 7-8. Internal Affairs, No. 893.5034/404."}, {"type": "text", "text": "1937年7月中日全面戰爭爆發前後，在東北地區，英美煙已與日本東亞煙葉公司（Toa Tobacco Company）協議分占市場的限額 $^{26}$ ，次年12月英美煙公司為保有東北市場的營運，又同意參與組織滿洲煙草公司（Manchou Leaf Tabcco Co.） $^{27}$ 。隨著中日戰局的演變，日本在中國各地占領區，一再複製東北的軍事和經濟統治經驗，而鄰近的華北地區更是首當其衝。日本在華北又一次的軍事和經濟壟斷政策，正適以考驗美國處理遠東危機的決心。"}, {"type": "text", "text": "據資料所示，1938年春，日本軍方已展開排擠外國卷煙公司的計畫，許多日本人的卷煙不交付任何稅，私運到上海。相對的是「外國卷煙製造商，每箱五萬支卷煙要交付統稅約一百元，日本人逃稅後將他們的紙卷煙售與小企業」 $^{28}$ 。約此同時，日本迅速擴大其在華北的煙草市場。他們打算建立河北煙草公司，預計每年以15億支的產量生產。此外，日資河北東亞煙草公司則將一家中國的煙草公司——晉華公司納入附屬公司，年產5億支。在青島亦規劃出一個年產15億支卷煙的新廠。另在天津和秦皇島的兩家日資企業共年產24億支卷煙，且即將邁入30億支。因此華北的日本工廠不久後即可能有年65億支的生產量，而華北的每年卷煙消費量約350億支，雖然英美煙公司在華北尚占有絕大市場，但在長期競爭中，顯然對英美煙公司造成壓力 $^{29}$ 。"}, {"type": "text", "text": "1939年11月，華北日本星期週報（The Japan News Week）的編輯（W. R. Wills）從日人筑井健仁（Kenjin Chikui，或譯筑井賢人）處得知一份極機密訊息，日本軍方正正拉攏英國怡和洋行和日本數家公司正有意簽署一項「聯合貿易公司」（Joint Trading Corporation）的合同。數家日本公司中最有名的當屬王子製紙公司（Oji Paper Company） $^{30}$ 。這份合同首先是由日本軍方南京當局所擬定，據悉出自岡田（Okada）少佐和宇都宮（Utsunomiya）兩人的規劃。該計畫始於《日本星期週報》前任職員Redmond居間聯繫，由他引介筑井和怡和洋行經理Keswick認識。而怡和洋行對此事頗為猶豫，他們非常企盼美國大企業能加入此一聯合貿易公司，特別是英美煙公司，或者再加入美孚石油 $^{31}$ 。"}, {"type": "text", "text": "29《英美煙公司在華企業資料匯編》，頁476。"}, {"type": "text", "text": "23 Sherman Cochran, Big Business in China: Sino-Foreign Rivalry in the Cigarette Industry, 1890-1930 (Cambridge, Mass.: Harvard University Press, 1980), p. 13."}, {"type": "text", "text": "24 上海社會科學院經濟研究所編，《英美煙公司在華企業資料匯編》（北京：中華書局，1983），第1冊（全4冊），〈前言〉，頁3。上海社會科學院經濟科學研究所編撰的這4冊資料，為英美煙公司撤離中國之前的業務紀錄，然其編撰的目錄和編者註記則反映帝國主義國家勾結日偽政權，並壓跨華資企業的民族主義立場和意識形態史觀。雖然如此，這批資料內容和公司業務數據，仍對學界貢獻甚大。"}, {"type": "text", "text": "25 Sherman Cochran, Big Business in China: Sino-Foreign Rivalry in the Cigarette Industry, 1890-1930, p. 199."}, {"type": "text", "text": "26 Memorandum of Agreement by Toa Tobacco Co. and Chi Tung Tob. Co. 1937. 上海社會科學院經濟研究所企業史資料室，《英美煙公司抄檔》，(55) 13-B1-4. p. 0051."}, {"type": "text", "text": "27〈1938年12月英美煙參與組織滿洲煙草公司〉，Approval of Company's participation as shareholder in Manchou Leaf Tobacco Company Litmitted. 上海社會科學院經濟研究所企業史資料室，《英美煙公司抄檔》，(58)13-C-4."}, {"type": "text", "text": "28《英美煙公司在華企業資料匯編》，頁475。"}, {"type": "text", "text": "這數家公司中，英國怡和洋行為老字號跨國集團。英美煙及美孚為美國在華最大的兩家跨國公司。日本王子製紙公司成立於1873年，初名為「抄抵會社」。1893年，以創業地（東京府下王子村）冠名，改稱為「王子製紙」。1933年，與富士製紙及樺太工業合併，成為占日本機製紙總產量80%的公司。涵蓋範圍廣泛，從絲棉日貨、機器、煙草、石油、紙業等商品交易，不一而足；此一合作契約一旦成立，無疑對華北經貿物流市場造成絕大的影響力。"}, {"type": "text", "text": "怡和洋行希望這項合同有美方加入的的理由有二：一、萬一未來英國陷入歐戰泥沼，這項聯合公司的外人利益能有美國的支持；二、萬一上述情況發生，則怡和洋行的財產，例如輪船、船塢等財產，可租給美國人。為求謹慎，這項合約係通過怡和洋行轉達，日方尚未和任何一家美國公司直接聯繫，直到這項合約得以公開或為美國國務院所同意。這項由日本軍方授意起草的合約，涵蓋華北五個省份。由於傳聞汪精衛政權即將於次年1月成立，宇都宮表示汪政權成立後，聯合貿易公司的合同立即可生效，合同一旦簽訂，南京方面會馬上停止在中國占領區的反英風潮。日本顯然也有意以此為誘餌，爭取怡和洋行加入 $^{32}$ 。"}, {"type": "text", "text": "這項合作提議，名義上係為促進華北經濟發展所展開的一項中（日）、美、英的合作計畫。總裁由日人出任，副總裁由外人（英美）出任，在管理上給予英美商人相對副手的地位。而在資本和獲利方面亦提出相對的保障。主要重點如下："}, {"type": "text", "text": "一、合資公司的總部設於天津，支部可能在青島、北平、東京和上海。"}, {"type": "text", "text": "二、合資公司為1千萬聯合準備銀行貨幣資本額的有限公司，由中日占一半，外國占一半。"}, {"type": "text", "text": "三、中日一方所占資本為當地貨幣，英美一方所占資本為英鎊或美元或財產；中日資本額係存放在中日銀行，而外國資本則存放在外國銀行。"}, {"type": "text", "text": "四、公司董事會（Board of Directors）組成分子為：總裁1位由日人出任，副總裁1人由外人出任。執行董事2位，日人和外人各半。6位常任董事和2位公證人，日人和外人各半。"}, {"type": "text", "text": "五、在獲利方面，紅利不應超過本金的10%，其餘額應作為儲備金之用。紅利在外國一方以外匯計算，日本當局並全力支持外匯市場的運作。"}, {"type": "text", "text": "六、兩方同意盡力合作。英（美）一方同意在組織和資產上盡力投注此一新公司，而在日本一方則允諾將爭取日本當局的協助，以促進此一新公司帶動華北的經濟 $^{33}$ 。"}, {"type": "text", "text": "30 The Ambassador in Japan (Joseph C. Grew) to the Secretary of State, Dec. 2, 1939, Internal Affairs, No. 893.5034/381."}, {"type": "text", "text": "31 Memorandum of conversation Nov. 28, 1939, between Mr. Wills and the American Ambassador. Internal Affairs, Enclosure in No. 893.5034/381."}, {"type": "text", "text": "32 Memorandum of conversation, Nov. 28, 1939, between Mr. Wills of Japan News Weeks, Tokyo, and the American Ambassador, Mr. Grew. Nov. 28, 1939, Internal Affairs, No. 893.5034/381."}, {"type": "text", "text": "為確信這項消息來源的可靠性，美國國務院遠東司向英方求證，並探詢英國的態度。英國駐東京大使克雷格（Robert Craigie）給美國國務院的回函相當謹慎，表示無法得知最近的訊息，但這件事早在去年（1939年）10月開始，上海怡和洋行即抵抗日本軍方強迫其合作的要求。當時英國駐東京大使和英國駐上海使領館都認為合作的時機「不成熟，且是個輕率的提議」（premature and ill-advice），使領館已盡其所知和怡和洋行溝通過，而這些公司當然仍可自行採取這種他們認為合宜的措施。他個人同時表示對筑井印象不佳，這項消息來源應謹慎對待 $^{34}$ 。美國遠東司司長洪恩培克（Stanley K. Hornbeck）則表達需掌握筑井和該合作計畫更詳盡的情報，在局勢未明朗化之前，美國政府不宜有任何表示 $^{35}$ 。"}, {"type": "text", "text": "這項擬議中的「聯合貿易公司」，由於美國政府沒有表示肯定意見，而英美煙公司對於這樣的組合也心存疑慮，因此採取觀望態度，這項提議最後未能成局，然而其結果則是坐視該公司在華北業務的惡化。據青島美國商會的報告，1940年2月在所有65,000,000磅煙葉的收成中，預估有15,000,000到20,000,000磅煙草未銷售出，仍在製造商手中；意即所有收成的70%已被購買，實際上它是由日本所獲利，所有的中國買主全是由日本軍方所支配。煙草的價格為每磅72分，預計農曆年後將漲到每磅80分以上，而在中日戰爭之前，華北地域煙葉的平均價格僅有每磅17分。華北地區購買煙草還遭逢另一大困難是缺少鐵路貨運可將煙草送到青島或其他地區再次烘乾，中國買主和外國買主都面臨無車可用的困境，而如上所言，鐵路運輸亦由日本軍方所掌控，春天以後天氣轉暖，煙草如無貨運送出再次烘乾，很快就會敗壞，將造成英美煙公司不小的損失 $^{36}$ 。"}, {"type": "text", "text": "鑑於煙葉價格的持續飆漲，1940年3月日本當局宣稱之前和日本原訂的內地煙葉交易的協議將於該月25日起取消，所有的買主被授意關閉銷售點；消息一公布，華北農民即拋售更多的煙葉，買主便抓緊機會降低內地的煙草價格。此一情況顯示日本當局已完全操作華北地區的煙草買主、農民和煙葉市場的優勢 $^{37}$ 。不唯如此，6月，一名頤中煙草公司的管理人（supervisor）S. J. Kuh（中文不詳）被日本軍方扣留二星期之久。理由是個人資金和公司資金來源的交代不清；然實情不免啟人疑竇。這件消息在青島美國商會的報告中披露出來，受到華北美商的重視 $^{38}$ 。"}, {"type": "text", "text": "（二）從抗拒到妥協"}, {"type": "text", "text": "1940年7月26日，日本在華北恢復實施許可證制度，凡從國外（包括日本、第三國以及偽滿洲等）進口商品，進口商不得以法幣或其他貨幣直接支付，必須從聯合準備銀行買進外匯支付，且該項買進的外匯又必須以出口比該項外匯價高出10%的商品來抵償，方能獲得聯合準備銀行准予輸入物資的「許可證」，才准輸入物資 $^{39}$ 。為了控制貨物不致運入內地和防止貨品到達敵區，日本方面組織一個協會，所有的卷煙必須通過該協會進行交易；協會一旦組成，除了該協會外，其他一律不發給許可證，顯然此一許可證制度是要壟斷卷煙銷售以謀取利益。日本軍方實施制度之初，最早即邀請頤中公司加入這一協會組織。然而，頤中公司認為該公司有權在交付統稅後自由進行貿易，因此不同意加入協會：「這樣做意味著我們將服從該公司的規章制度，其結果，我們對自己的組織將全部失去控制，因此我們不能同意參加該組合」 $^{40}$ 。然而，不加入協會的結果，不到半年之間，英美煙公司及其運銷公司頤中公司的貨品均無法運送到內地，對其業務造成嚴重打擊 $^{41}$ 。情況如表7-3："}, {"type": "text", "text": "33 擬議中的合同草文見：“Tentative draft of the articles of the Joint Trading Corporation.” in the enclosure of The Ambassador in Japan (Joseph C. Grew) to the Secretary of State, Dec. 1, 1939, Internal Affairs, No. 893.5034/381."}, {"type": "text", "text": "34 The British ambassador in Tokyo, Sir Robert Craigie to the American Ambassador, Mr. Grew. very confidential, Dec. 1, 1939, Internal Affairs, No. 893.5034/381."}, {"type": "text", "text": "36 Tsigtao American Chamber of Commerce, Biweekly Bulletin, No. 32. Feb. 22, 1940. pp. 7-8. 上海市檔案館，Q-459-1-257, p162."}, {"type": "text", "text": "35 The Division of Far Eastern Affair, comment, Jan. 30, 1940, Internal Affairs, No. 893.5034/381."}, {"type": "text", "text": "37 Tsigtao American Chamber of Commerce, Biweekly Bulletin, No. 36. Mar. 31, 1940. 上海市檔案館，Q-459-1-257, p. 113."}, {"type": "text", "text": "38 Tsigtao American Chamber of Commerce, Biweekly Bulletin, No. 41. July 1, 1940. 上海市檔案館，Q-459-1-257, p 21."}, {"type": "text", "text": "由於貨品無法運銷到中國內地，英美煙公司不得不填具要求銷售貨物的「申請書」。到了1941年10月1日，北平中國事務局經濟部主管高瀨（Takase）致函北平頤中煙草公司，針對該公司要求銷售貨物的申請書，日方所開列的「批准單」條件如下："}, {"type": "text", "text": "一、該公司必須接受中國事務局推荐之四名顧問。"}, {"type": "text", "text": "二、該公司必須同中國事務局協商實行一項銷售計畫："}, {"type": "text", "text": "(一) 總額 12,000 箱。"}, {"type": "text", "text": "（二）分配至下列稅務管理區的銷售額（含天津、青島、濟南、北京、石家莊、煙台、開封、唐山等區）進行配額銷售。"}, {"type": "text", "text": "（三）產品購買者的姓名、購買數量和品牌都得事先向中國事務局報告，將根據凍結令發給許可證，上述交易和運輸均由中國事務局妥為照料。"}, {"type": "text", "text": "(四)銷售產品的貨價收入則需立即存入聯合準備銀行，提款時批准整數，事後要向中國事務局報告款項用途 $^{42}$ 。"}, {"type": "text", "text": "39 居之芬、張利民主編，《日本在華北經濟統制掠奪史》，頁243。"}, {"type": "text", "text": "40 上海社會科學院經濟研究所編，《英美煙公司在華企業資料匯編》，頁 478-479。關於許可證制度的態度。"}, {"type": "text", "text": "41《英美煙公司在華企業資料匯編》，頁481。不惟是華北的煙草市場受到日本的全面控制，從上海運銷到內地的通路亦然。1940年9月，頤中公司約有價值法幣658,000元的卷煙七千萬支，由於無法運銷內地，已存放庫房數月，再不運出就得全數銷毀，因而被迫向日本軍方經濟局許可證處交涉，經交涉約半年仍未有結果。這份備忘錄見於1941年1月9日上海花旗煙公司備忘錄。提到上海許可證制度實施的時間是1940年6月10日，而在6月10日至9月21日之間尚可由日本代理商昭和公司運銷少量的貨。但此後不論是直接運，或通過運銷公司，或即使是日本代理商都不能運任何貨到內地。"}, {"type": "text", "text": "42 上海社會科學院經濟研究所編，《英美煙公司在華企業資料匯編》，頁481-482。"}, {"type": "text", "text": "上述日方的「批准單」條件，從人事管理、經銷、運輸等項目，可謂全面掌控英美煙公司在華北的業務，連貨價收入亦被日本控制下的北平中國事務局經濟部全面監督。如與1939年11月日方所提議的「聯合貿易公司」條件相較之下，1941年10月的「批准單」足以顯見日本在華北全面壟斷之優勢。"}, {"type": "text", "text": "就在1941年10月日方提議這項條件不久，頤中公司也已配合實施上述措施，但是華北各分處的業務仍受到阻難，其中最緊急的是一批已在天津完稅的二千多箱煙卷，仍無法獲得許可令。頤中公司又和高瀨交涉，提到在日方的凍結令之下，該公司填報聯合準備銀行的各項表格，包括運銷品牌、經銷商、價格等冗長程序，致使該公司業務嚴重延誤，造成巨額損失。他們請求北平中國事務局應立即讓這批已完稅的煙品獲得通行，否則這項提議將失效，因為錯不在該公司 $^{43}$ 。然而日方並不予理會。次年1月起，日軍在華北建立「分銷協會」（Distributing Union），入會者才可分配煙草銷售，頤中公司的華北經銷商不得不正式加入該協會，由日本軍方配給限額經銷煙草，至此，頤中公司等於在日軍管理下恢復銷售業務 $^{44}$ 。"}, {"type": "text", "text": "回顧上述英美煙公司的處境，可見得1939年以後英美煙公司在華北的業務受創劇烈，對於日本所採取的經濟控制的形式和協會壟斷組織，最早英美煙總公司選擇不予形式上的承認，要求美國政府維護其具體利益，甚至不願加入日方提議的協會組織；及至日本進一步頒布「許可證」特許制度，該公司貨品無法運銷到中國內地，造成嚴重滯銷，最後迫使英美煙公司不得不讓步，甚至主動向日本軍方交涉，填具「申請書」，要求日方合理解決屯貨之損失。"}, {"type": "text", "text": "三、美國政府對日本的經濟制裁及其遠東外交策略"}, {"type": "text", "text": "太平洋戰爭之前，羅斯福總統對日本的政策可說是一條不刺激日本的路線，直到1938年以後日本南進政策的積極布局，威脅到美國在太平洋的整體利益，美日雙方關係進入尖銳的衝突，美國政府開始展開禁運等經濟制裁措施 $^{45}$ 。在美國對外貿易中，日本的地位較中國更為重要。1931-1935年的統計中，遠東貿易占美國對外貿易的19%，其中日本占43%，中國（含香港）只占14%，美國在日投資，更是在華投資的三倍以上 $^{46}$ 。美國政府雖不滿意日本自九一八事變以來侵略中國東北的行為，但認為其尚未動搖美國遠東利益，不願因此影響美日貿易關係。因此，儘管羅斯福總統在1937年10月5日發表「隔離演說」（Quarantine Speech），被外界認為針對德、日、義等國之侵略行為而來，但在考量國內輿情與美日關係下，仍不願對日採取強硬政策。即便同年12月美國軍艦潘納號（Panay，也譯作「帕奈號」）及三艘商船在長江被日軍擊沉，亦未採取報復行動，而讓日本賠償了事。潘納號事件的確傷及美日友誼，但當時美國決策者盡可能避免美日關係進一步惡化，避免美、日訴諸戰爭武力解決爭端 $^{47}$ 。"}, {"type": "text", "text": "43 YITD Ltd.（頤中公司）ToTakase, 1941. Oct.（日期不清），上海社會科學院經濟研究所企業史資料室，《英美煙公司抄檔》，(55) 13B1-4, p. 0110."}, {"type": "text", "text": "44 Memorandum of YITD Ltd. 上海社會科學院經濟研究所企業史資料室，《英美煙公司抄檔》，(55) 13B1-4, p. 0130. Resumption of Sales, Shanghai, 26th Jan., 1942, (55) 13B1-4, p. 0114. 在華中地區，太平洋戰爭爆發後，日本陸軍和海軍在上海占領區以強制命令方式，令頤中煙草公司將香煙運交華中煙草公司進行銷售，關於運銷的細節則根據興亞院華中辦公處的指示進行具體安排。上海社會科學院經濟研究所編，《英美煙公司在華企業資料匯編》，頁487。"}, {"type": "text", "text": "45 關於抗戰時期中美關係的研究相當豐富。以中國為主體評述抗戰時期美國的遠東政策，則可詳見齊錫生的兩本代表論著，《舞台邊緣走向中央：美國在中國抗戰初期外交視野中的轉變1937-1941》（台北：聯經出版公司，2017）和《劍拔弩張的盟友：太平洋戰爭期間的中美軍事合作關係（1941-1945）》（台北：聯經出版公司，2011）。英文學界的重要成果多為1970年代左右的著作，主要有：Dorothy Borg, The United States and the Far Eastern Crisis of 1933-1938: From the Manchurian Incident through the Initial Stage of the Undeclared Sino-Japanese War (Cambridge Mass.: Harvard University Press, 1964). Akira Iriye, Across the Pacific (New York: Harcourt, Brace & World, Inc., 1967)."}, {"type": "text", "text": "美國政府在1939年以後面對日本在華北一波波的軍事侵略和經濟控制措施，採取的便是溫和的對日經濟制裁政策，包括廢除1911年《日美商約》及其後的一系列對日出口的削減計畫，直到最後採行禁運石油措施為止。《日美商約》的廢除，意即美國政府擬採取進口關稅的歧視政策，軟性制裁日本，一家美國進口商乃要求對日本貨運採取「貨到付款」的自保政策；為因應美日無商約的狀態，美國政府將採取怎樣的關稅策略猶未可知，因此他們同時要求收貨方可以拒收日本貨運，請求這項指示應在日本貨運公司同意所有貨物先不付款的前提下，以防商場上的萬無一失。據青島美國商會的報告如下："}, {"type": "text", "text": "鑑於美日商約的失效，一家美國大型進口公司指示對所有由日本商船承運的貨物務必做到貨到付款。裝運清單上必須寫明「倘若美國政府以日本無商約地位為由，對日本貨運的商品採取歧視稅率，收貨方可以暫時拒收受到歧視稅率的貨物」。此一指示顯示美國商人已經預測到此類歧視對待的稅率可能發生。因此除非日本貨運公司同意所有貨物先不付款的做法，美國商人可能無法同日方做貨運交易，因其將對此地的託運人帶來生意上的風險。 $^{48}$ （按：「除非」兩字係加大字體，為原文所強調）"}, {"type": "text", "text": "在日本方面，面臨美國所採取的經濟制裁可能造成的衝擊，由日本外務省成立「對美政策審議委員會」等機構，專門負責審議和制訂與美國廢除商約通告相關的對美政策。委員會認為美國的廢約措施證明了美國已經不願和現在的日本保持友好關係，日本應予以反擊，使美國充分認識到日本的實力和貫徹東亞政策的決心，顯然日美關係已進入前所未有的惡化地步。「對美政策審議委員會」也指出日美問題在根本上是對中國新秩序的承認問題，而就當前來看已是通商條約的對策問題；兩者既有輕重之別，又相互緊密聯繫，而解決之道則繫於日本如何調整對華關係及在中國的第三國關係。因此，日本外務省主張對美策略雙管進行：一方面盡全力打破九國公約體制，使美國承認中國的新秩序，另一方面盡力防止日美進入無條約狀態，強調「日本不能暴露出任何動搖跡象」或「給人以我害怕陷入無條約狀態的印象」，營造出一種對美國實施物資禁運的心理準備 $^{49}$ 。"}, {"type": "text", "text": "46 Whitney A. Griswold, Far Eastern Policy of the United States (New York: Harcourt, Brace & Company, Inc., 1938), pp. 468-469."}, {"type": "text", "text": "47 楊凡逸，《美日「帕奈號」（U. S. S. Panay）事件與中美關係，1937-1938》，國立政治大學歷史學系（碩士論文出版），政治大學史學叢書，2002。一向主張維繫美日友好的美國駐日大使格魯（Joseph C. Grew），在1937年12月26日美國接受日本道歉書的當日日記，一方面欣慰美日政府雙方節制情緒接受和平解決，但也同時寫下他的憂慮：「瞻望未來，我絲毫沒有萬事大吉之感。可以肯定，還會出現難關，也許還會更加艱難。美國人民的忍耐不是沒有止境的。僅僅損害甚或摧毀我國在中國的有形利益或侵犯條約破壞我們所維護的原則，尚不至引起日美戰爭，但是，再有某種侵凌美國主權的行為或者屢次三番的公開侮辱，戰爭就很容易挑起了。約瑟夫·C·格魯著，蔣相澤譯，《使日十年》（北京：商務印書館，1992），頁244。"}, {"type": "text", "text": "48 Tsigtao American Chamber of Commerce, Biweekly Bulletin, No. 38. Apr. 30, 1940. 上海市檔案館，Q-459-1-257, pp. 121-122."}, {"type": "text", "text": "美國石油業、鋼鐵和棉織品的禁運輸日，對日本影響最大。日本政府和日本商人聯手阻擋美國採取的禁運措施和經濟制裁手段，據《中國每週評論》（China Weekly Review）的報導，日本政府正動員一些日本大財團，例如三菱、三井、日本郵船株式會社（Nippon Yusen Kabushiki Kaisha）和至少二家在美國的日本商會募集5百萬巨額美金（約值3千萬中國國幣），在美國發起強大的宣傳，要求美國國會廢除或修正一系列不利於日本的中立法案。據美國最新的民意調查，大概只有一成的美國人是對日本的大東亞野心表示同情，有59%的民意是支持中國（另有40%未表態）。這意味著日本必須投入更多的資金來收買和動員美國報紙的宣傳，例如：慫恿美國報紙製造美國商人和傳教士應撤離中國市場，「以免美國捲入東方戰爭」的宣傳。一位美國演說家唐·貝特（Don Bate）就坦承不諱他被紐約的日本商會收買而大力主張美國政府應強制所有美國商人撤離中國，以免美國將被拖向戰爭的言論。一張刊在《聖路易斯郵報》（St. Louis Post-Dispatch）的報紙漫畫——係被日本人收買，指向美國人正掉入中立法案的陷阱中進退維谷，擺明美國應及早脫離遠東危機的困境 $^{50}$ 。（圖7-1）"}, {"type": "text", "text": "日本政府方面對美策略採取軟硬兼施，希望遏止美國實施禁運政策之際，並積極挽救美日關係，通過向來對日本友好的美國駐東京大使格魯（Joseph C. Grew）居中協調。1939年8月30日就任的阿部信行（Abe Nobuyuki）內閣試圖改善和美國的關係。格魯和新任外長野村吉三郎（Nomura Kichisaburo）頻頻接觸，提議日本重新開放長江下游的航行，以換取簽訂新的《日美商約》的談判。格魯亦曾敦促美國政府接受這樣的條件以使日美關係轉向「積極健全的渠道」（a progressively healthy channel）。但華盛頓方面拒絕此一提議，美國國務院給格魯的指示很清楚，一是美國長期以來國家利益的具體維護，包括過去長期以來美國在華權益應獲得保障。二是美日關係可在一個更廣泛的基礎上來進行，但不宜就經濟和財政的具體項目和日本談判，以免產生誤解 $^{51}$ 。國務院的基本立場是不就具體項目和日本談判條件，因為如此一來，可能導致美國在華條約利益受到更大的傷害。同時美方也懷疑阿部內閣究竟任期有多長能實踐此一承諾。果不其然，阿部內閣於1940年1月下台，兩星期後《日美商約》正式終止。美日兩國在珍珠港事變發生以前，果然並未再有機會談判新的商約 $^{52}$ 。一向以「和平使者」為信念（Peacemaker）自許的格魯，他反對美國政府以廢除《日美商約》及採取禁運政策作為經濟制裁日本的手段，擔心過激的手段將使美國捲入一場大戰。後來珍珠港事變發生，美日正式斷交，格魯的大使任期以美日正式宣戰而告終，不免使這位和平使者深感遺憾 $^{53}$ 。"}, {"type": "text", "text": "49 日本政府關於美國廢除《日美通商條約》通告的對策方針，詳見：鹿錫俊，《日本的國際戰略與中日戰爭的國際化——論連接中日戰爭和太平洋戰爭的一個關鍵原因》，《近代史研究》（北京），2007年第6期，頁41-62，內文所引在頁50。另見鹿錫俊，《中國問題與日本1941年的開戰決策——以日方檔案為依據的再確認》，《近代史研究》（北京），2008年第3期，頁90-103。"}, {"type": "text", "text": "50 “Japan Spending U.S. \\$5,000,000 to Block U.S. Embargo Legislation: Neutrality Trap!” The China Weekly Review (1923-1950); Apr. 8, 1939. 該文刊載了《聖路易斯郵報》的諷刺畫。"}, {"type": "text", "text": "在美國駐東京大使格魯與阿部內閣試圖緩和美日關係的同時，外交戰線的另一端則是蔣介石積極要求美國援助中國。就在阿部內閣甫上任的1938年9月，陳光甫抵達華盛頓，開始與美國方面談判桐油借款事宜。10月下旬，中美桐油借款正在磋商之際，日軍攻占武漢和廣州，隨即日本首相近衛發表第二次聲明，公開提出建立「東亞新秩序」。此時日本獨霸東亞的野心使美國加快了援華步伐。11月底，羅斯福批准向華貸款。12月15日，美國國務院宣布由美國進出口銀行貸款給陳光甫任總經理的世界貿易公司2,500萬美元，用以購買美國商品，但附加條件是不得購買軍火、飛機、汽油等重要工業品。12月16日，蔣介石收到孔祥熙轉呈之借款公布電報後，欣然表示「美借款告成，此乃對敵最大之打擊」 $^{54}$ 。1939年2月，中美雙方正式簽訂《桐油借款合同》，規定在5年內中方以22萬噸桐油運美出售，以售款償還本息，由中國銀行擔保。這是中國抗戰開始以來美國向中國提供的第一筆貸款，對於正在艱苦抗戰的中國軍民，這是一個極大的鼓舞。當時擔任駐美大使的胡適認為：「此款成於我國力最倒霉之時，其富於政治意義至顯。」 $^{55}$ 1939年11月30日，汪精衛政權與日本政府簽訂《基本關係條約》的同一天，羅斯福宣布給予中國一億美元的貸款（美東華府時間為11月29日），此即之後的對華金屬貸款與平準基金貸款。根據美元一億元貸款的初步決定，中美於1941年2月4日簽訂《金屬借款合約》，規定美國向中國提供5,000萬美元貸款，年息4釐，中國向美國出售價值6,000萬美元的錫、鎢等金屬，於7年內還清本金。這是美國在1939年以後一面以經濟制裁日本，一面以中立國家的身分釋出對中國的善意和援助行動，就後者而言是奠定珍珠港事件爆發之後中美合作的信任基礎 $^{56}$ 。"}, {"type": "text", "text": "1941年12月7日）的對日政策為「和平外交」（Diplomacy of Pacification）。在他任內極力想調和美、日間的緊張關係，但他的心態是比較同情日本，在政治手段上也比美國政府的立場更加對日讓步。當1937年羅斯福在芝加哥發表隔離演說，譴責德、日的侵略行為時，格魯對美國政府的外交政策持保留態度；後來他反對美國政府以廢除《日美商約》及禁運政策，作為經濟制裁日本的手段，因此與國務院立場時相衝突，而格魯則始終對自己的妥協政策辯護。詳見：Richard Dean Burns and Edward M. Bennett, eds., Diplomats in Crisis: United State-Chinese-Japanese Relations, 1911-1941 (Santa Barbara, Calif.: ABC-Clio, 1974), pp. 65-89."}, {"type": "text", "text": "51 The Secretary of State to the ambassador in Japan (Grew), FRUS, 1940, Vol. IV, June 4, 1940, pp. 344-345."}, {"type": "text", "text": "52 Waldo Heinrichs, \"Franklin D. Roosevelt and the Risk of War, 1939-1941\", pp. 150-151. Waldo Heinrichs, American Ambassador: Joseph C. Grew and the Development of the American Diplomatic Tradition (London: Oxford University Press, 1986)."}, {"type": "text", "text": "53 班奈特（Edward M. Bennett）概括格魯於駐日大使任內（1932年2月19日至"}, {"type": "text", "text": "54 次日（1938年12月17日），蔣介石復致電胡適並轉陳光甫，表示「借款告成，全國興奮，從此抗戰精神必益堅強，民族前途實利賴之，惟望為國珍重，常保康健」。蕭李居編，《事略稿本》，第42冊（台北：國史館，2010年），頁675、677。"}, {"type": "text", "text": "然而，美國以經濟制裁作為抵制日本在遠東擴張的手段，這種成效究竟有多大？也令人質疑。1940年7月2日美國政府所頒布的第一道對日禁運令中，以下三種物資列入需申請許可證範圍。一、所有武器彈藥、軍事裝備；二、非常時期戰略物資，包括鋁、鎂等原料；三、飛機零件、裝備、附件、光學儀器和金屬加工機械。但是對日本至關重要的石油並未包括在內。美國政府處心積慮採取對日經濟制裁，但是他們也擔心禁運措施將使日本更迫切想控制荷屬東印度公司的石油，因此美國政府決定勿跨過一些門檻 $^{57}$ 。無論如何，禁運措施最後卡在石油問題中，也顯現美國政府的軟弱，使得經濟制裁的路徑看似變成一種伎倆。因為日本仍可以獲得廢料和較劣質的石油，而此時美國又已伸出對華貸款的援助措施，這種情況使得美國的對日禁運措施顯得是美國在遠東政治外交上的兩手策略，看來更像一種高明的政治謀略，而這些精打細算的策略當然是以美國國家安全利益為最高考量。由於日本缺乏油源，主要購自美國公司和荷屬東印度群島。在美國採取對日禁運石油政策之前，日本石油運銷公司和美國的美孚、德士谷公司在中國東北和華北激烈搶奪市場，其形成的詭譎畫面則是日本油商向美國買油，然後到中國市場將美國石油排擠出去。石油為戰時飛機、裝甲車等軍需重要燃料，不同於英美煙公司和大來的個案，隨著戰爭情勢的緊繃，美國這兩家石油公司對美國遠東政策的影響力就愈大。"}, {"type": "text", "text": "小結"}, {"type": "text", "text": "1939-1941年間，美國在華企業面臨日本強大的經濟壟斷，美國國務院雖再三申令「門戶開政政策」的精神，或採取廢除《日美商約》和禁運政策等經濟制裁的手段，希望從商業政策上對日本造成懲罰。但對在華企業而言，這些措施對他們是緩不濟急，且亦無直接受惠；在日本占領區軍方的威脅恐嚇或利誘合作等各種手段下，美國在華企業如何維繫他們在中國市場的營運利益才是最實際的。卜正民《通敵》一書指出在中日戰爭時期的日軍占領區江南五城（嘉定、鎮江、南京、上海、崇明等五處），中國人民與日本政府的「合作」（collaboration）甚至更微妙的「共謀」（complicity）關係，他們固然反對日本的作為，卻必須與合作者密切配合，揭示了占領時期為維持城市秩序各方力量的運作、在地社會精英和平民百姓處境的心態 $^{58}$ 。在中日戰爭時期美國尚非交戰國家成員之際，在日本占領區的美國人民財產正遭受破壞或摧毀，美國僑民遭受生命威脅時，美國政府採取的是一條極其保守的外交路線。美國政府甚至坐視美國在華企業倒閉情形，也不願強勢介入日本在淪陷區的壟斷政策和跋扈作為，僅僅採取消極的經濟制裁手段。因而，美國企業不得不有一套自救之道，他們私下和日本軍方打交道，設法與占領機關尋求調適，並做出有利企業本身的抉擇。本文兩個個案一為關閉模式；一為從「觀望」到「合作」模式，兩個個案的形成和處理方式均頗有轉折，可看出戰時美國企業在華的困境及其伴隨著局勢演變所採行的變通策略。"}, {"type": "text", "text": "55 中國社會科學院近代史研究所編，《胡適任駐美大使期間往來電稿》（北京：中華書局，1978年），頁5、8。關於胡適於抗戰時期駐美大使任內的作為評價，詳見：齊錫生，《舞台邊緣走向中央：美國在中國抗戰初期外交視野中的轉變，1937-1941》，第2和3章。"}, {"type": "text", "text": "56 Michael Schaller, The U.S. Crusade in China, 1938-1945 (New York: Columbia University Press, 1971). 吳翎君，〈對美關係〉，收入：呂芳上主編，《中國抗日戰爭史新編·對外關係》（台北：國史館，2015年7月），頁21-70。"}, {"type": "text", "text": "57 Waldo Heinrichs, \"Franklin D. Roosevelt and the Risk of War, 1939-1941.\" in AkiraIriye & Warren I. Cohen eds., American, Chinese, and Japanese Perspective on Wartime Asia, 1931-1949, pp. 154-156."}, {"type": "text", "text": "美國在華企業一方面要求政府堅持門戶開放政策，尋求美國政府的支持，另一方面它們也和日方周旋，試圖仍以自己的銷售網絡保有營運市場。在本文的個案中，1939年以後英美煙公司在華北的業務受創劇烈，對於日本所採取的經濟控制的形式和協會壟斷組織，最早英美煙總公司選擇不予形式上的承認，要求美國政府維護其具體利益，甚至不願加入日方提議的協會組織；及至日本進一步頒布「許可證」特許制度，該公司貨品無法運銷到中"}, {"type": "text", "text": "國內地，造成嚴重滯銷，最後迫使英美煙公司不得不讓步，甚至主動向日本軍方交涉，填具「申請書」，要求日方合理解決屯貨之損失。據統計從1931年至1941年，英美煙公司仍占有中國2/3的卷煙市場（包括東北）。1931-1940年，該公司的利潤達到17,860萬美元，這七年間的資金回報比1935年所估價的該公司在中國的賬面資產總額還多1,880萬美元，直到1941年珍珠港事件爆發後，英美煙公司才終於撤出了它在中國的西方代表，在太平洋戰爭期間中止在中國的業務 $^{59}$ 。而大來公司在青島木材營運業務從1939年市占有量的37.4%，到1940年市場占有率的5.8%，最後不得不於1941年關閉青島經銷處。另據大來公司的員工回憶，天津大來木行的情況則是一面撤退，一面物色一個代理人，珍珠港事變爆發後，他們不得不讓華人員工擔任分銷處經理和日方進行交涉，而總公司則在舊金山遙控，改變市銷為遠洋出口 $^{60}$ 。這些案例，顯現中日戰爭時期美國在華企業的生存之道相當靈活。"}, {"type": "text", "text": "在日本方面，從1939年下半年，由日本軍方提出由日本王子製紙公司和怡和洋行、英美煙公司、美孚石油公司等合作的「聯合貿易公司」計畫，雖未獲得回應，但亦看出日本軍方對於英美大型企業的戰時策略，一方面實施經濟控制，一方面則以攏絡手段，企圖達到雙贏目標；及至1940年下半年，日本已全面掌控華北政經與運輸動脈，美日兩國交手之形勢和日本軍方開列之條件已全然易位。林肯·李（Lincoln Li）對於1937-41日本軍方在華北的政治活動和經濟控制的研究，認為日本私人企業對於華北的煤、鐵開發是比較存疑的，因為投資金額龐大，風險過巨。日本在華北雖有意仿照東北模式，將煤、鐵的工業開發作為日本母國工業的原料地，但並不成功 $^{61}$ 。本章個案則顯示木材運輸和煙葉物流的控制可由日本軍方直接控管，短期操作即可見成效，但石油個案則完全不同，不同經濟物資個案顯示戰爭時期經濟占領與政府政策間的複雜多元面向。"}, {"type": "text", "text": "59 Sherman Cochran, Big business in China, Sino-Foreign Rivalry in the Cigarette Industry, 1890-1930, p. 199. 陳真編，《中國近代工業史資料》（北京：生活·讀書·新知三聯書店，1957），第2卷，頁94、135。汪熙，〈從英美煙公司看帝國主義的經濟侵略〉，《歷史研究》，第4期（1976年8月），頁85-93。"}, {"type": "text", "text": "58 卜正民（Timothy Brook）原著，林添貴譯，《通敵：二戰中國的日本特務與地方菁英》（台北：遠流出版社，2015）。"}, {"type": "text", "text": "60 阮渭經，〈美商大來洋行在中國的掠奪〉，收入：《淘金舊夢：在華洋商紀實》（北京：中國文史出版社，2001），頁78-96。"}, {"type": "text", "text": "本章的研究顯示美國政府無視於日本在華北地區的經濟壟斷，對於美商在華北的個別遭遇予以漠視。特別是針對日本繼滿洲國成立後，再一次複製其在東北的軍政壟斷經驗，肆意挑戰美國門戶開放政策，美國政府並未做出積極的回應。本書第五章曾指出美國在華企業代表是19世紀末美國對華門戶開放政策的催生者，美國政府對保護僑民在華利益不餘遺力，然而這並不意味著美國政府無條件支持美國企業採取各種手段來維護商業利益，即使在1920年代中國排外風潮鼎盛之際，美國政府對如何使用武力保護在華僑民的生命和財產安全亦相當謹慎。在1930年代日本挑起的遠東危機中，美國政府對美國在華企業的利益該如何保護則是始終在避開與日本政府的正面衝突中打轉，美國政府希望他所採取的一連串對日本的經濟制裁能發揮阻遏作用，但最後不僅事與願違，更不斷增長日本人對達成某種妥協的希望及擴大其建立亞洲帝國的雄心。美國政府開始對遠東問題的態度由消極轉向積極，關鍵點在於1939年日本南進政策，而不是日本的侵略中國。"}, {"type": "text", "text": "南進政策最終導致美日關係的尖銳，而南進政策的高峰點——珍珠港事變的爆發，終於迫使美國對日宣戰，使得美國將亞洲戰爭與歐洲戰場聯繫起來，為本身的安全體系而戰 $^{62}$ 。攫取東南亞豐富的自然和勞力資源，成為日本建立和鞏固其亞洲帝國的大戰爭策略，我們將於第八章以戰爭時期的重要物資——石油議題，來說明此一觀察。"}, {"type": "text", "text": "61 Li Lincoln, The Japanese Army on North China, 1937-1941, Problems of Political and Economic Control, pp. 122-153."}, {"type": "text", "text": "62 Akira Iriye, Across the Pacific, An Inners History of American-East Asian Relations (New York: Harcourt, Brace & World, Inc., 1967), pp. 200-211. 第8章「走向珍珠港」。"}, {"type": "note", "text": "1 1911年簽訂的《日美商約》為近代美、日關係的第一個平等條約，讓日本取得關稅自主權。1939年7月26日，美國國務院照會日本駐美大使堀內謙介（Horinouchi），表示美國擬廢除1911年2月21日所簽訂之《美日通商條約》，依該條約第17款所規定條約之終止將自照會起始之六個月後生效。The Secretary of State to the Japanese Ambassador Horinouchi, July 26, 1939, FRUS, 1939, Vol. III, pp. 558-559."}, {"type": "note", "text": "3 探討民國時期外人在華投資和中美經貿的相關著作中，多數專著係以1937年作為時間下限。例如侯繼明的研究專書：Hou, Chi-ming. Foreign Investment and Economic Development In China, 1840-1937 (Cambridge, Mass.: Harvard University Press, 1965)。仇華飛，《中美經濟關係研究，1927-1937》（北京：人民出版社，2002）。國民政府前財經顧問楊格（Arthur Young）所著《中國與戰時援助，1937-45》（China and the Helping Hand, 1937-45, Cambridge, Mass: Harvard University press, 1962）主要環繞如何控制通貨膨脹和財政穩定，討論抗戰時期中國向美國及國際社會尋求財政（稅制、貨幣、金本位制問題）、軍事和技術的援助，與本文著重美國企業在中國的活動，重點大為不同。"}, {"type": "note", "text": "2 Li Lincoln, The Japanese Army on North China, 1937-1941, Problems of Political and Economic Control (London: Oxford University, 1975), pp. 122-153. 居之芬、張利民主編，《日本在華北經濟統制掠奪史》（天津：天津古籍出版社，1997），頁153-170。"}, {"type": "note", "text": "4 Sherman Cochran, “Business, Governments, and War in China,” in Akira Iriye & Warren I. Cohen eds., American, Chinese, and Japanese Perspective on Wartime Asia, 1931-1949 (Wilmington: Scholarly Resources Inc., 1990), pp. 117-146. 但後來高家龍的研究興趣轉向消費文化，並未針對此一主題再做進一步的研究。新近巫仁恕的研究《劫後「天堂」：抗戰淪陷後的蘇州城市生活》（台北：台"}, {"type": "note", "text": "灣大學出版中心，2017），則是透過蘇州的茶館、菜館、旅館與煙館等四種休閒行業的研究，呈現抗戰時期蘇州「畸形繁榮」的城市生活、淪陷區城市仍持續進行的商業化活動，以及蘇州城市社會結構的變遷。該書的導論對戰時上海城市的經濟活動、社會控制和城市文化等面向有較全面的回顧。"}, {"type": "note", "text": "5 The Ambassador in China(Nelson T. Johnson) to the Secretary of State, Jan. 15, 1940, FRUS, 1940, Vol. IV, p. 262."}, {"type": "note", "text": "7 Robert Dollar, Memoirs of Robert Dollar (San Francisco: Privately published for the author by Schwabacher-Frey, 1918)."}, {"type": "note", "text": "8 阮渭經，〈美商大來洋行在中國的掠奪〉，收入：《淘金舊夢：在華洋商紀實》（北京：中國文史出版社，2001），頁78-96。"}, {"type": "note", "text": "9 David H. Grover, American Merchant ships on the Yangtze, 1920-1941 (Westport, Connecticut: Praeger Publisher, 1992), pp. 75-84. 除航運和木材兩大主要業務之外，大來公司也經營進出口業務，另外，亦設有一家環球無線電公司，以收發無電報為主要業務。大來公司在上海設有總部，於天津、漢口、北京、南京、蕪湖、青島、漢口、重慶、廣州、香港等地設有分支機構。中國人一般稱之為大來洋行。阮渭經，〈美商大來洋行在中國的掠奪〉，頁91。"}, {"type": "note", "text": "6 The Ambassador in China (Nelson T. Johnson) to the Secretary of State, Jan. 15, 1940, FRUS, 1940, Vol. IV, p. 262."}, {"type": "note", "text": "10 American consul in Tsingtao (Paul W. Meyer) to the Secretary of States, June 21, 1941. No. 893.5034/404, pp. 1-2. U.S. Department of State, Confidential U.S. State Department central files. China, 1940-1944: Internal Affairs. United States National Archives, Washington D.C. (microform) 以下簡稱 Internal Affairs."}, {"type": "note", "text": "11 American consul in Tsingtao (Paul W. Meyer) to the Secretary of States, June 21, 1941. pp. 1-8. Internal Affairs, No. 893.5034/404."}, {"type": "note", "text": "12 至於聯合準備銀行究竟發揮多大的作用，學界的看法不一。國民政府財經顧問楊格認為1939秋至1940年年中「聯銀券」和法幣在華北的價值相當。但之後法幣逐漸掉價，並在1941愈為惡化。根本原因是「聯銀券」的貶值沒有重慶政府統治區的法幣貶值那樣快速，到1941年聯銀券成為華北日軍占領區最重要的貨幣。China and the Helping Hand, 1937-45, p. 158. 也有學者認為聯合"}, {"type": "note", "text": "準備銀行由於在國際貨幣市場沒有價值，且因只能通行於華北，不能直接在日本購買產品進口，其所起的作用有限。再者，由於戰爭局勢的惡化和交通中斷問題，造成通貨膨脹。雖然官方資料的出口統計，日本占領後的出口金額沒有下滑；然而，事實上由於貨幣的貶值，出口價值反為下降。Li Lincoln, The Japanese Army on North China, 1937-1941, Problems of Political and Economic Control, pp. 55, 144. 拙文說明大來公司的報告確係呈現美國企業在青島的進口業務和匯率轉換受制於聯合準備銀行的實情；至於聯合準備銀行對國際金融體系和日本進出口價值所起的實際的作用究竟有多大，則非本文所能一併討論。"}, {"type": "note", "text": "13 American consul in Tsingtao (Paul W. Meyer) to the Secretary of States, June 21, 1941. p. 4. Internal Affairs, No. 893.5034/404."}, {"type": "note", "text": "14 American consul in Tsingtao (Paul W. Meyer) to the Secretary of States, June 21, 1941, pp. 5-6. Internal Affairs, No. 893.5034/404."}, {"type": "note", "text": "16 1938年8月，日本華北株式會社開始進行「特三區碼頭建設計畫」，它是在天津英、法租界各碼頭的下游，原德租界內，計畫兩年內使其年吞吐能力為100萬至120萬噸，碼頭岸線長約1,200米，可同時停靠2,000噸級船10艘，並另建造倉庫16座，5萬平方米，堆場12萬平方米，及鐵道岔道4條。李華彬，《天津港史》，古近代部分（北京：人民交通出版社，1986），頁214-217。"}, {"type": "note", "text": "17 中村隆英，《戰時日本の華北經濟支配》（東京都：山川出版社，1983），頁244-245。居之芬、張利民主編，《日本在華北經濟統制掠奪史》，頁185。1940年統計，青島港前方倉庫有8座，其中軍用倉庫占2座；後方倉庫16座，軍用倉庫11座。"}, {"type": "note", "text": "15《海關中外貿易統計資料年刊》，轉引自：居之芬、張利民主編，《日本在華北經濟統制掠奪史》（天津：天津古籍出版社，1997），頁185-186。"}, {"type": "note", "text": "18 Tsigtao American Chamber of Commerce, Biweekly Bulletin, No. 32. 上海市檔案館，Q-459-1-257, p. 159."}, {"type": "note", "text": "19 Tsigtao American Chamber of Commerce, Biweekly Bulletin, Feb. 15, 1940. 上海市檔案館，Q-459-1-257, p. 164."}, {"type": "note", "text": "20 Tsigtao American Chamber of Commerce, Biweekly Bulletin, Feb. 15, 1940. 上海市檔案館，Q-459-1-257, p. 164."}, {"type": "note", "text": "21 Tsigtao American Chamber of Commerce, Biweekly Bulletin, Feb. 15, 1940. 上海市檔案館，Q-459-1-257, p. 164."}, {"type": "note", "text": "22 American consul in Tsingtao (Paul W. Meyer) to the Secretary of States, June 21, 1941. pp. 7-8. Internal Affairs, No. 893.5034/404."}, {"type": "note", "text": "29《英美煙公司在華企業資料匯編》，頁476。"}, {"type": "note", "text": "23 Sherman Cochran, Big Business in China: Sino-Foreign Rivalry in the Cigarette Industry, 1890-1930 (Cambridge, Mass.: Harvard University Press, 1980), p. 13."}, {"type": "note", "text": "24 上海社會科學院經濟研究所編，《英美煙公司在華企業資料匯編》（北京：中華書局，1983），第1冊（全4冊），〈前言〉，頁3。上海社會科學院經濟科學研究所編撰的這4冊資料，為英美煙公司撤離中國之前的業務紀錄，然其編撰的目錄和編者註記則反映帝國主義國家勾結日偽政權，並壓跨華資企業的民族主義立場和意識形態史觀。雖然如此，這批資料內容和公司業務數據，仍對學界貢獻甚大。"}, {"type": "note", "text": "25 Sherman Cochran, Big Business in China: Sino-Foreign Rivalry in the Cigarette Industry, 1890-1930, p. 199."}, {"type": "note", "text": "26 Memorandum of Agreement by Toa Tobacco Co. and Chi Tung Tob. Co. 1937. 上海社會科學院經濟研究所企業史資料室，《英美煙公司抄檔》，(55) 13-B1-4. p. 0051."}, {"type": "note", "text": "27〈1938年12月英美煙參與組織滿洲煙草公司〉，Approval of Company's participation as shareholder in Manchou Leaf Tobacco Company Litmitted. 上海社會科學院經濟研究所企業史資料室，《英美煙公司抄檔》，(58)13-C-4."}, {"type": "note", "text": "28《英美煙公司在華企業資料匯編》，頁475。"}, {"type": "note", "text": "30 The Ambassador in Japan (Joseph C. Grew) to the Secretary of State, Dec. 2, 1939, Internal Affairs, No. 893.5034/381."}, {"type": "note", "text": "31 Memorandum of conversation Nov. 28, 1939, between Mr. Wills and the American Ambassador. Internal Affairs, Enclosure in No. 893.5034/381."}, {"type": "note", "text": "32 Memorandum of conversation, Nov. 28, 1939, between Mr. Wills of Japan News Weeks, Tokyo, and the American Ambassador, Mr. Grew. Nov. 28, 1939, Internal Affairs, No. 893.5034/381."}, {"type": "note", "text": "33 擬議中的合同草文見：“Tentative draft of the articles of the Joint Trading Corporation.” in the enclosure of The Ambassador in Japan (Joseph C. Grew) to the Secretary of State, Dec. 1, 1939, Internal Affairs, No. 893.5034/381."}, {"type": "note", "text": "34 The British ambassador in Tokyo, Sir Robert Craigie to the American Ambassador, Mr. Grew. very confidential, Dec. 1, 1939, Internal Affairs, No. 893.5034/381."}, {"type": "note", "text": "36 Tsigtao American Chamber of Commerce, Biweekly Bulletin, No. 32. Feb. 22, 1940. pp. 7-8. 上海市檔案館，Q-459-1-257, p162."}, {"type": "note", "text": "35 The Division of Far Eastern Affair, comment, Jan. 30, 1940, Internal Affairs, No. 893.5034/381."}, {"type": "note", "text": "37 Tsigtao American Chamber of Commerce, Biweekly Bulletin, No. 36. Mar. 31, 1940. 上海市檔案館，Q-459-1-257, p. 113."}, {"type": "note", "text": "38 Tsigtao American Chamber of Commerce, Biweekly Bulletin, No. 41. July 1, 1940. 上海市檔案館，Q-459-1-257, p 21."}, {"type": "note", "text": "39 居之芬、張利民主編，《日本在華北經濟統制掠奪史》，頁243。"}, {"type": "note", "text": "40 上海社會科學院經濟研究所編，《英美煙公司在華企業資料匯編》，頁 478-479。關於許可證制度的態度。"}, {"type": "note", "text": "41《英美煙公司在華企業資料匯編》，頁481。不惟是華北的煙草市場受到日本的全面控制，從上海運銷到內地的通路亦然。1940年9月，頤中公司約有價值法幣658,000元的卷煙七千萬支，由於無法運銷內地，已存放庫房數月，再不運出就得全數銷毀，因而被迫向日本軍方經濟局許可證處交涉，經交涉約半年仍未有結果。這份備忘錄見於1941年1月9日上海花旗煙公司備忘錄。提到上海許可證制度實施的時間是1940年6月10日，而在6月10日至9月21日之間尚可由日本代理商昭和公司運銷少量的貨。但此後不論是直接運，或通過運銷公司，或即使是日本代理商都不能運任何貨到內地。"}, {"type": "note", "text": "42 上海社會科學院經濟研究所編，《英美煙公司在華企業資料匯編》，頁481-482。"}, {"type": "note", "text": "43 YITD Ltd.（頤中公司）ToTakase, 1941. Oct.（日期不清），上海社會科學院經濟研究所企業史資料室，《英美煙公司抄檔》，(55) 13B1-4, p. 0110."}, {"type": "note", "text": "44 Memorandum of YITD Ltd. 上海社會科學院經濟研究所企業史資料室，《英美煙公司抄檔》，(55) 13B1-4, p. 0130. Resumption of Sales, Shanghai, 26th Jan., 1942, (55) 13B1-4, p. 0114. 在華中地區，太平洋戰爭爆發後，日本陸軍和海軍在上海占領區以強制命令方式，令頤中煙草公司將香煙運交華中煙草公司進行銷售，關於運銷的細節則根據興亞院華中辦公處的指示進行具體安排。上海社會科學院經濟研究所編，《英美煙公司在華企業資料匯編》，頁487。"}, {"type": "note", "text": "45 關於抗戰時期中美關係的研究相當豐富。以中國為主體評述抗戰時期美國的遠東政策，則可詳見齊錫生的兩本代表論著，《舞台邊緣走向中央：美國在中國抗戰初期外交視野中的轉變1937-1941》（台北：聯經出版公司，2017）和《劍拔弩張的盟友：太平洋戰爭期間的中美軍事合作關係（1941-1945）》（台北：聯經出版公司，2011）。英文學界的重要成果多為1970年代左右的著作，主要有：Dorothy Borg, The United States and the Far Eastern Crisis of 1933-1938: From the Manchurian Incident through the Initial Stage of the Undeclared Sino-Japanese War (Cambridge Mass.: Harvard University Press, 1964). Akira Iriye, Across the Pacific (New York: Harcourt, Brace & World, Inc., 1967)."}, {"type": "note", "text": "46 Whitney A. Griswold, Far Eastern Policy of the United States (New York: Harcourt, Brace & Company, Inc., 1938), pp. 468-469."}, {"type": "note", "text": "47 楊凡逸，《美日「帕奈號」（U. S. S. Panay）事件與中美關係，1937-1938》，國立政治大學歷史學系（碩士論文出版），政治大學史學叢書，2002。一向主張維繫美日友好的美國駐日大使格魯（Joseph C. Grew），在1937年12月26日美國接受日本道歉書的當日日記，一方面欣慰美日政府雙方節制情緒接受和平解決，但也同時寫下他的憂慮：「瞻望未來，我絲毫沒有萬事大吉之感。可以肯定，還會出現難關，也許還會更加艱難。美國人民的忍耐不是沒有止境的。僅僅損害甚或摧毀我國在中國的有形利益或侵犯條約破壞我們所維護的原則，尚不至引起日美戰爭，但是，再有某種侵凌美國主權的行為或者屢次三番的公開侮辱，戰爭就很容易挑起了。約瑟夫·C·格魯著，蔣相澤譯，《使日十年》（北京：商務印書館，1992），頁244。"}, {"type": "note", "text": "48 Tsigtao American Chamber of Commerce, Biweekly Bulletin, No. 38. Apr. 30, 1940. 上海市檔案館，Q-459-1-257, pp. 121-122."}, {"type": "note", "text": "49 日本政府關於美國廢除《日美通商條約》通告的對策方針，詳見：鹿錫俊，《日本的國際戰略與中日戰爭的國際化——論連接中日戰爭和太平洋戰爭的一個關鍵原因》，《近代史研究》（北京），2007年第6期，頁41-62，內文所引在頁50。另見鹿錫俊，《中國問題與日本1941年的開戰決策——以日方檔案為依據的再確認》，《近代史研究》（北京），2008年第3期，頁90-103。"}, {"type": "note", "text": "50 “Japan Spending U.S. \\$5,000,000 to Block U.S. Embargo Legislation: Neutrality Trap!” The China Weekly Review (1923-1950); Apr. 8, 1939. 該文刊載了《聖路易斯郵報》的諷刺畫。"}, {"type": "note", "text": "1941年12月7日）的對日政策為「和平外交」（Diplomacy of Pacification）。在他任內極力想調和美、日間的緊張關係，但他的心態是比較同情日本，在政治手段上也比美國政府的立場更加對日讓步。當1937年羅斯福在芝加哥發表隔離演說，譴責德、日的侵略行為時，格魯對美國政府的外交政策持保留態度；後來他反對美國政府以廢除《日美商約》及禁運政策，作為經濟制裁日本的手段，因此與國務院立場時相衝突，而格魯則始終對自己的妥協政策辯護。詳見：Richard Dean Burns and Edward M. Bennett, eds., Diplomats in Crisis: United State-Chinese-Japanese Relations, 1911-1941 (Santa Barbara, Calif.: ABC-Clio, 1974), pp. 65-89."}, {"type": "note", "text": "51 The Secretary of State to the ambassador in Japan (Grew), FRUS, 1940, Vol. IV, June 4, 1940, pp. 344-345."}, {"type": "note", "text": "52 Waldo Heinrichs, \"Franklin D. Roosevelt and the Risk of War, 1939-1941\", pp. 150-151. Waldo Heinrichs, American Ambassador: Joseph C. Grew and the Development of the American Diplomatic Tradition (London: Oxford University Press, 1986)."}, {"type": "note", "text": "53 班奈特（Edward M. Bennett）概括格魯於駐日大使任內（1932年2月19日至"}, {"type": "note", "text": "54 次日（1938年12月17日），蔣介石復致電胡適並轉陳光甫，表示「借款告成，全國興奮，從此抗戰精神必益堅強，民族前途實利賴之，惟望為國珍重，常保康健」。蕭李居編，《事略稿本》，第42冊（台北：國史館，2010年），頁675、677。"}, {"type": "note", "text": "55 中國社會科學院近代史研究所編，《胡適任駐美大使期間往來電稿》（北京：中華書局，1978年），頁5、8。關於胡適於抗戰時期駐美大使任內的作為評價，詳見：齊錫生，《舞台邊緣走向中央：美國在中國抗戰初期外交視野中的轉變，1937-1941》，第2和3章。"}, {"type": "note", "text": "56 Michael Schaller, The U.S. Crusade in China, 1938-1945 (New York: Columbia University Press, 1971). 吳翎君，〈對美關係〉，收入：呂芳上主編，《中國抗日戰爭史新編·對外關係》（台北：國史館，2015年7月），頁21-70。"}, {"type": "note", "text": "57 Waldo Heinrichs, \"Franklin D. Roosevelt and the Risk of War, 1939-1941.\" in AkiraIriye & Warren I. Cohen eds., American, Chinese, and Japanese Perspective on Wartime Asia, 1931-1949, pp. 154-156."}, {"type": "note", "text": "59 Sherman Cochran, Big business in China, Sino-Foreign Rivalry in the Cigarette Industry, 1890-1930, p. 199. 陳真編，《中國近代工業史資料》（北京：生活·讀書·新知三聯書店，1957），第2卷，頁94、135。汪熙，〈從英美煙公司看帝國主義的經濟侵略〉，《歷史研究》，第4期（1976年8月），頁85-93。"}, {"type": "note", "text": "58 卜正民（Timothy Brook）原著，林添貴譯，《通敵：二戰中國的日本特務與地方菁英》（台北：遠流出版社，2015）。"}, {"type": "note", "text": "60 阮渭經，〈美商大來洋行在中國的掠奪〉，收入：《淘金舊夢：在華洋商紀實》（北京：中國文史出版社，2001），頁78-96。"}, {"type": "note", "text": "61 Li Lincoln, The Japanese Army on North China, 1937-1941, Problems of Political and Economic Control, pp. 122-153."}, {"type": "note", "text": "62 Akira Iriye, Across the Pacific, An Inners History of American-East Asian Relations (New York: Harcourt, Brace & World, Inc., 1967), pp. 200-211. 第8章「走向珍珠港」。"}]}, {"id": "ch8", "title": "第八章 · 戰爭與石油", "paras": [{"type": "title", "text": "第八章"}, {"type": "text", "text": "戰爭與石油 美國與戰時中國石油問題"}, {"type": "text", "text": "「誰能控制石油，誰就可以控制世界！」在這個強權勝於一切的時候，這句話是千真萬確的。石油不僅是戰爭的賭本，也是和平的基石。一國有了石油，而後資源更足，府庫更充；於是民富國強，無往而不利。"}, {"type": "text", "text": "——李澤彥，〈比黃金還要寶貴的石油〉，"}, {"type": "text", "text": "《東方雜誌》，1943年11月"}, {"type": "text", "text": "前言"}, {"type": "text", "text": "第二次世界大戰期間，中文有句俗諺：「一滴石油，一滴血」或「石油是液體黃金」，價值更勝真金 $^{1}$ 。自1937年到1941年，中國大部分的沿海地區都落入日本的掌控，石油的進口量比戰前掉了50%。日軍轟炸中國鐵路幹線，癱瘓主要運輸系統大動脈，使得卡車及人力運送軍用物資變得更加迫切。1941年以前，中國的石油輸入主要經由香港進口，但1941年12月日軍攻陷香港，而在1940年日軍攻下法屬印度支那之前，聯結雲南昆明和緬甸仰光的滇緬公路，成為「自由中國」（Free China）或「非占領區中國」（unoccupied China）的主要補給運輸線。1942年4月，在仰光失守及滇緬公路相繼關閉的情況之下，石油補給的問題更加嚴峻。中國始終相信陝甘和新疆等地蘊藏豐富的油礦，如果能發掘和開採中國本地的油田，就不必仰賴進口，這應是戰爭時期解決燃眉之急的石油問題最有效可行的方法。然而，中國本身沒有開採的技術，中國需要美國的技術、專家人才，以及美國政府的援手。"}, {"type": "text", "text": "在日本方面，1940年5月及11月日本曾兩度要求荷屬東印度保證對日本供應石油資源，然荷蘭在英國及美國之支持下，拒絕日本的請求。在所謂「ABCD四國（美國、英國、中國、荷蘭）包圍」下，日本不得不與德國合作。雖然如此，日本仍希望能與美國溝通，即便是向來被視為極端保守之平沼騏一郎內閣，仍希望與美國維持友好關係；昭和16年7月近衛文麐再任首相，甚至提議訪問美國，要與羅斯福（Franklin Delano Roosevelt）總統面對面談判 $^{2}$ 。研究石油全球史丹尼爾·耶金（Daniel Yergin）指出荷屬東印度群島當時受到荷蘭流亡政府在倫敦的支配影響之下（荷蘭在1940年5月被德軍占領），日本人突然要求大大增加從荷屬東印度群島獲得的石油，顯示日本非常焦慮ABCD四國將在石油資源上聯合切斷日本的石油供應 $^{3}$ 。石油的短缺匱乏和供給的穩定性，始終是日本對外擴張的「阿奇理斯的腳跟」（Achilles'Heel），1940下半年美國進一步緊縮石油禁運政策之後加速惡化美日兩國在太平洋的緊張關係，最終導致日本轟炸美國在夏威夷海軍基地——引爆珍珠港事變，並由此揭開第二次世界大戰中的太平洋戰爭。"}, {"type": "text", "text": "安德森（Irvine H. Anderson）在他的專書《美孚真空石油公司與美國遠東政策，1933-1941》（The Standard-Vacuum Oil Company and United States East Asian Policy, 1933-1941）闡釋了美孚真空石油公司、殼牌公司（Shell Oil Company），以及英美外交官團體，加速了他們的緊密合作關係——尤其是在日本對滿洲和華北地區實施經濟壟斷之後，因為日本違反了門戶開放政策的基本原則。事實上美國政府的禁運政策，以及日本基於戰略因素的考量，為獲取穩定油源而意圖攻占東印度群島的必要補給線，這些因素使得美國石油公司在珍珠港事變以前必然地捲入美國遠東政策的形成與實施 $^{4}$ 。安德森的研究主要針對九一八事變之後到1941年以前，美孚真空公司與美國政府的遠東決策的關係。此外，日本學者岩間敏的論著主要著重日本政府對石油戰略的備戰、應戰與外交政策，三輪宗弘的研究則針對石油作為戰時物資對日本軍事和經濟動員的一體作用 $^{5}$ 。迄今為止的研究均較少關注到太平洋戰爭時期，以中國為主體，從石油能源的需求、開採和技術援助的重要性，考察戰時中美與遠東危機的關係。"}, {"type": "text", "text": "2 Jonathan G. Utley, Going to War with Japan, 1937-1941 (New York: Fordham University Press, 2005), pp. 172-173; 吉田裕，《アジア·太平洋戰爭》(東京：岩波書店，2007年)，頁13-14。轉引見李朝津，〈中日戰爭與歷史反思〉，《二十一世紀》(香港：香港中文大學)，第142期（2014年4月），頁4-13。"}, {"type": "text", "text": "1 李澤彥，〈比黃金還要寶貴的石油〉，《東方雜誌》，第39卷第18號（1943年11月），頁44-46。對石油價值有「一滴油一滴血」的認識和比喻，西方則早在第一次世界大戰開始使用飛機坦克和潛艇等工業機械化戰爭中即有此一警語。"}, {"type": "text", "text": "3 Daniel Yergin, The Prize: The Epic Quest for Oil, Money, and Power (New York: Simon & Schuster, 1991), pp. 360-388. ABCD四國實際上形成對了對日本的經濟包圍。一旦美國和荷屬東印度群島不供給日本石油，日本在沒有足夠的自身儲備石油供給之下，就勢必要冒著戰爭的風險或者挑起戰爭。"}, {"type": "text", "text": "本章將聚焦於以下兩個相關的議題：一、日本在中國占領區的石油政策。日本在占領區除了開採東北的油田，還實施石油壟斷政策，此一強硬手段，導致在華北石油市場具有長期優勢的美國企業在1940年初感到威脅。究竟日本人如何壟斷中國占領區的石油市場？日本的石油壟斷政策，對美國各家石油公司造成的衝擊為何？而這些石油公司又如何處理與美國政府的關係？二、非占領區的中國石油問題。當國民政府竭力開發中國油田，來自美國的技術援助變得不可或缺。究竟中國政府要如何解決石油的短缺，並順利贏得戰時美國的石油援助和合作？當太平洋戰爭爆發後，美國意識到石油議題對中美聯合戰線之急迫與重要性，它又通過怎樣的手段和組織運作，開展與中國政府的石油合作。"}, {"type": "text", "text": "一、日本在占領區的石油戰略與美國的回應"}, {"type": "text", "text": "（一）美國面臨「霍伯森的選擇」"}, {"type": "text", "text": "1930年代初期，美國石油公司在中國的投資始終受到美國政府的支持。美孚真空石油公司（The Standard-Vacuum Oil Company，另稱Stanvac）在中國的直接投資額為4,300萬美元，不僅是美國在東亞的最大資本額公司，也是與美國政府關係特別緊密的一家跨國企業 $^{6}$ 。在1930年代早期，控制廣東的西南政務委員會企圖限定地方上的營業項目和活動給予華資企業。當時中國正襲捲一股愛用國貨風潮，由於煤油係進口產品，美孚公司惟恐因此挑起抵制洋油的骨牌效應，要求美國政府介入；美孚公司戰戰兢兢，挑起了一場美國石油與中國地方政府之間的「煤油戰」（kerosene war）。最後，美國政府通過南京國民政府財政部長宋子文的協調，使宋子文掌管的財政部對進口石油課徵關稅，而當地華資企業交付的稅則進入了地方政府的口袋，美孚公司獲得在華南生產精煉煤油的許可證後，就以低價方式打擊華資競爭對手 $^{7}$ 。華盛頓當局也替美孚真空石油公司順利爭取到日軍在1937年炸毀帕奈號時毀損的三個油槽的賠償金8。然而隨著1937年以後日本在中國發動一波波的侵略戰爭，當中國危機變得險峻，美國與英國政府較無意願或者不太能支持英美石油公司對抗日本政府為日本石油公司撐腰的壟斷政策。他們正面臨所謂的「霍伯森的選擇」（Hobson's choice）——若展現過於堅決的毅力，可能將迫使日本採取更激烈的手段；若示弱則可能導致英國在中國甚至印度的利益有災難性的後果。美國的政策使得已在前端火線的石油公司孤立無援，且又無法影響日本的政策9。"}, {"type": "text", "text": "4 Irvine H. Anderson, The Standard-Vacuum Oil Company and United States East Asian Policy, 1933-1941 (Princeton, NJ: Princeton University Press, 1975)."}, {"type": "text", "text": "6 美孚真空石油公司係由紐澤西美孚公司（Standard Oil of New Jersey, present-day Exxon）與蘇康尼真空石油公司於1933年合併而來。美孚公司英文名稱標準石油公司（Standard Oil Co.），自1860年代成立之後，早於1870年代即運銷煤油到中國，獨占中國煤油市場，直到跨世紀之交開始和亞細亞石油公司激烈競爭。吳翎君，《美孚石油公司在中國，1870-1933》（上海：上海人民出版社，2017，修訂版）"}, {"type": "text", "text": "5 岩間敏，《アジア・太平洋戦争と石油：戦備・戦略・対外政策》（東京：吉川弘文館，2018）。三輪宗弘，《太平洋戦争と石油——戦略物資の軍事と経済》（東京：日本経済評論社，2004）。"}, {"type": "text", "text": "7 Sherman Cochran, “Businesses, Governments, and War in China, 1931-1949,” in Akira Iriye and Warren Cohen, eds., American, Chinese, and Japanese Perspectives on Wartime Asia, 1931-1949 (Wilmington, Del: SR, 1990), pp. 132-135."}, {"type": "text", "text": "1937年8月日方的不宣而戰（undecared war），將美國大眾分為同情中國的一方與畏懼戰爭的一方。美國政府的決策者面對以下三個因素，難以找出一個援助弱勢中國的理由——國內的孤立主義、歐洲戰略制定的優先性，以及日本的軍事實力。朵洛西·博格（Dorothy Borg）在她研究遠東政策的經典之作中下了一個結論：「美國政府採取的被動程度很有可能是我們之後回想起來，在1930年代的遠東最驚人、最有特色的紀錄。」 $^{10}$"}, {"type": "text", "text": "在太平洋戰爭爆發，美國參戰之前，日本除了開採該國本土的稀少油源——位於本州西北部和北海道中部——之外，在台灣與俄國北薩哈林（North Sakhalin）開挖油田，同時也在滿洲及南薩哈林（South Sakhalin）探勘油田。日本加入第二次世界大戰後，將大部分的重心轉向於東印度群島豐沛油田的改良與開發，以快速供給為征服太平洋地區所需的長程運輸用油料 $^{11}$ 。顯而易見的是，日本的本土油源只能供給於國內需求的極小部分，不足以用來發動一場太平洋戰爭。"}, {"type": "text", "text": "日本在中國占領區的石油壟斷政策引起了美國兩大石油——德士谷石油公司和美孚石油公司的關切，並直接考驗美國政府採取經濟制裁作為反擊手段的外交政策。自1939年後半起，美國準備廢除《美日通商航海條約》（The Commercial Treaty of 1911），用以抗衡日本在中國的經濟壟斷。（關於《美日通商航海條約》參見本書第七章）美國政府更在日本於1940年9月加入軸心國後，加緊了禁運手段，但其禁運的程度則受人質疑 $^{12}$ 。到了1941年7月25日，羅斯福總統始下令凍結日本在美國的資產，使日本無法獲得資金購得物資，尤其是日本緊缺的石油。日本如果想購得美國商品，都必須要獲得美國政府的出口許可。但是美國並非全面停止對日出口石油產品，仍有少量的低辛烷汽油可售予日本，美國此一兩手策略的作法係基於集體安全的自身考量，儘可能避免使日本有入侵荷屬東印度奪取油源的藉口 $^{13}$ 。"}, {"type": "text", "text": "11 Leo W. Stach, “Petroleum Exploration and Production in Western Pacific during World War II,” Bulletin of the American Association of Petroleum Geologists 31 (August 1947), pp. 1384-1403."}, {"type": "text", "text": "8 Thomas A. Breslin, \"Trouble over Oil: America, Japan, and the Oil Cartel, 1934-1935,\" Bulletin of Concerned Asian Scholars. Vol. 7, Vo. 3 (July-Sep., 1975), pp. 41-50."}, {"type": "text", "text": "9 Stephen J. Randall, United States Foreign Oil Policy Since World War I: For Profits and Security (Montreal: McGill-Queen's University Press, 2005), pp. 88-90."}, {"type": "text", "text": "12 美國政府在 1940 年 9 月以後加緊了禁運政策，政府部門對此決策的討論，詳見：FRUS, 1940, Vol. IV: The Far East: China, p. 813, FRUS, 1940, pp. 625-635, 984-992. 但是針對石油禁運的問題，1940 年 9 月以後的幾個月中則仍是混沌不明的。安德森根據美國政府的相關文件顯示，甚至在 1941 年 7 月，羅斯福總統本人僅僅提到減少對日本的石油輸出，因為「此時一旦完全切斷石油，可能加劇太平洋區域的戰爭，並危及英國和澳大利亞、紐西蘭之間的聯繫」。Irvine H. Anderson, The Standard-Vacuum Oil Company and United States East Asian Policy, pp. 175-176."}, {"type": "text", "text": "10 Dorothy Borg, The United States and the Far Eastern Crisis of 1933-1938: From the Manchurian Incident through the Initial Stage of the Undeclared Sino-Japanese War (Cambridge: Harvard University Press, 1964), pp. 539-544."}, {"type": "text", "text": "自1940年2月初，在華北的美孚真空石油公司、德士谷公司，和隸屬於荷蘭皇家殼牌的亞細亞石油公司（Asiatic Petroleum Co.），顯然遭受日本公司分支機構在青島、天津、北京等地的嚴重威脅。在「日本亞洲事務部」（Japanese Asia Affairs）的官方支持之下，一個由主要日本石油進口公司組成的「華北石油協會」進一步成立。根據日本媒體的報導，該協會成立的目的旨在讓日本製成的石油順利進口，並加以統合 $^{14}$ 。"}, {"type": "text", "text": "在擁有3千萬人口的山東省，日本石油公司的煤油進口量，從1936年到1940年間增加了四倍（表8-1）。事實上日本正展開一項計畫，即1939年由日本著名貿易公司三菱株式會社在青島設置的十座總容量高達18,000噸的儲油槽，進而掐緊煤油或其他石油產品在山東市場的優勢利潤。該儲存量等同於英美三大石油公司（美孚、德士谷和亞細亞）在青島所有設施加總起來的60%。在1939年10月，日本油輪聖佩德羅號（San Pedro Maru）的單趟航運，就從美國運來了13萬加侖的汽油、6,000單位的煤油、200桶潤滑油，以及604噸的柴油至青島 $^{15}$ 。"}, {"type": "text", "text": "日本是美國石油的大買家。一場在洛杉磯舉辦的國會聽證會中提及，日本購買的美國石油量約落在每日十萬桶 $^{16}$ 。然而，該購買量包含了日本擴張華北市場的銷量。油品的運送，不僅在日本石油買主的操作之下從美國直接運往中國，還有從日本運往中國的部分——而日本的產油量根本不及消耗量的十分之一。在1938年至1939年間運往青島的主要石油進口量，可見表8-2。"}, {"type": "text", "text": "16 United Press item dated Los Angeles, Jan. 19, 1940, NA, 893.6363/222."}, {"type": "text", "text": "13 入江昭著，李响譯，《第二次世界大戰在亞洲及太平洋的起源》（北京：社會科學文獻出版社，2016），頁178-179。"}, {"type": "text", "text": "14 Tsingtao Shinpo, Jan. 26, 1940. Confidential U.S. State Department Central Files. China, 1940-1944: Internal Affairs, collected by National Archives (以下簡寫為 NA), Samuel Sokobin (American consul at Kobe), “Japanese kerosene and gasoline imports in North China from organization to control distribution and prices,” Feb. 16, 1940, NA, 893.6363/222."}, {"type": "text", "text": "15 Tsingtao's Telegram, May, 19, 1939, NA, 893.6363/210."}, {"type": "text", "text": "（二）美國石油公司在華經營困境"}, {"type": "text", "text": "美國兩家在華最大的石油公司——德士谷公司和美孚石油公司，在1920年代已經在中國主要港口設有油棧和分公司，分公司之上有區域公司和亞洲分部，並和美國總公司形成層層管理的經銷系統，是美國在華最具代表的跨國企業型態 $^{17}$ 。"}, {"type": "text", "text": "1. 德士谷公司"}, {"type": "text", "text": "據德士谷公司 $^{18}$ 在1937年至1941年間的報告，它在中國主要城市及其周邊區域的市場概況如下："}, {"type": "text", "text": "(1) 上海區公司"}, {"type": "text", "text": "中日戰爭爆發後，所有經由日本占領區長江流域運送的煤油和汽油，都必須在日本的控管之下進行安排，自由的商業活動全面中止。即使在寧波、紹興、溫州等未占領區，德士谷公司的經銷商出於對日本侵擾的恐懼，不敢進口大量的石油貯貨。在1940年的第一季，尚有可能藉由鐵路將貨物運出上海，然而鐵路車輛的數量卻不足，主要的水路也遭到關閉，德士谷經銷商的經營備受阻礙。在第二季，德士谷的銷售量慘跌，導因於季節性的銷量下降，且屢遭日本當局因偏袒日本油商所帶來對英美公司的種種限制。在第三季期間，日軍封鎖了海岸線，並嚴格限制貨物運往內陸。德士谷的銷量每下愈況，更曾庫存見底。但在第四季時，走私貿易的規模開始變大。當時石油的走私方式是藉由手推車、獨木舟、腳踏車，或苦力來運送。嚴格來說，所有外國油品都不可能進口至日本占領的內陸口岸，其結果是日本石油公司的銷量因此暴增。這些限制存貨輸送到內陸的行徑日積月累下來，導致石油貨物價格大幅上漲；在零售市場方面，與1940年初相比，漲幅更達到80%至100% $^{19}$ 。"}, {"type": "text", "text": "在南京，「石油管制協會」（Petroleum Control Association）儼然成為最有影響力的組織。其成員包含下列數家的日本公司：出光興產（Idemitsu）、江南（Kiangnan）、淺野物產（Asano Bussan）、三井（Mitsuiyi）、大丸（Dai Maru）等。這些成員在確保允諾的要件下得以用自己公司的名義從上海進口供應物。除了南京石油協會之外，還有一個稱為「南京石油產品小經銷商協會」（Nanking Petroleum Products Small Dealer's Association）的次級組織，該組織由20名日本成員與18名中國成員共同組成 $^{20}$ 。這一組織有中國人參與，可見得戰爭時期日本占領區的社會經濟組織和中日兩國平民共同參與的經濟運作模式，比起我們想像中來得複雜。"}, {"type": "text", "text": "(2) 青島管理處"}, {"type": "text", "text": "據德士谷公司的報告，在海州鐵路與隴海鐵路東段，日本的油品暢通無阻，但所有外國油品都不能運輸通行。日本進口油商以優惠的匯率轉換之便，用低於市場公定價40%的價格出售，導致德士谷公司在許多個據點的經銷系統無法與其競爭或進行重整，尤其是在青島及其鄰近的市場。"}, {"type": "text", "text": "17 關於美孚和德士谷在中國的經銷網系統，筆者在專書中曾繪有這兩家石油公司在華經銷網圖表。可參見：吳翎君，《美孚石油公司在中國，1870-1933》，頁21、165。"}, {"type": "text", "text": "18 德士谷公司於 1902 年由喬瑟·柯利南（Joseph Cullinan）創辦。Marquis James, The Texaco Story: The First Fifty Years, 1902-1952 (New York: Texas Company, 1953)."}, {"type": "text", "text": "19 California Texas Oil Company Limited (New York) to Department of State, March 26, 1941, NA, 893.6363/244, p. 1-2."}, {"type": "text", "text": "20 California Texas Oil Company Limited (New York) to Department of State, March 26, 1941, NA, 893.6363/244, p. 3."}, {"type": "text", "text": "自日本占領後，從芝罘（今煙台市）至內陸的石油運輸就被禁止。1940年1月，一些採購團體在日本官方的控制下成立。這些團體被賦予全然的煤油進口壟斷權，使大量的日本煤油得以進口；另一方面，則是外國產品因無法獲得許可而被排除在外。"}, {"type": "text", "text": "三菱公司在青島建造了一個儲油貨棧，並利用其強大的政商關係來促進運銷。據說這家公司是在「新亞事務局」（New Asia Affairs）幕後操縱之下，該事務局負責所有日本消費產品的配額，並下達了只能購買日本商品的官方指令。且所有購買活動都必須由三菱、出光興產，或其他被官方認定可作為供應商——等級相當於三菱——的日本公司來進行 $^{21}$ 。"}, {"type": "text", "text": "(3) 天津管理處"}, {"type": "text", "text": "天津地區在1940年大幅提高了從鐵路區運送到內陸的貨物限制，針對運往內蒙古的貨物運輸，並附有強烈差別待遇的進口規定。由日本官方機構制定的價格控制方案，在1940年內於各主要城市（北京—天津—山海關線除外）普遍施行。為了增加庫存量，日軍控制了蒙古邊境線地區，並先提高公定價格，讓三家外國公司的經銷商（德士谷、美孚石油、亞細亞石油）大量輸入貨物，而待貨物輸入完成後，旋即降低公定價格，使外國石油公司的經銷商蒙受巨大損失。"}, {"type": "text", "text": "(4) 大連管理處"}, {"type": "text", "text": "在大連，德士谷公司在日本交易管制機構的認可之下，持續以每月定額的方式販售油品。此外，德士谷還成功接到了來自三菱和南滿洲鐵道株式會社的訂單（兩者皆由日本管轄）。其後在大連的銷售狀況完全取決於剩餘庫存量，以及由日本當局管控的外匯金額。"}, {"type": "text", "text": "(5) 華南管理處"}, {"type": "text", "text": "1940年，日本在華南占領區施加貿易限制，並提高對非日資企業的差別待遇。在此情形下，德士谷在江門（廣東地區）、汕頭、廈門三地的貿易皆受到日本的壟斷機制，以及要求有貨物運輸許可證的嚴重影響 $^{22}$ 。"}, {"type": "text", "text": "德士谷公司在報告中指出，他們曾企圖對這種違反美國門戶開放政策的壟斷機制展開抗爭，但這些經由美國領事機構提出的抗議，卻毫無效用 $^{23}$ 。在各淪陷城市中，所有的制約與管控狀況都是類似的，且都在「華北石油協會」的掌握之中。究竟該協會是如何得以操縱這套精心設計的壟斷機制，並讓它在石油市場中有效運作呢？"}, {"type": "text", "text": "「華北石油協會」的總部位在北京，由興亞院（東亞事務機構）的石油部門直接管轄，它們在天津和青島設有支部。協會中的進口部門，由日方欽點的「投資成員」控制，並且與日本支配的大華石油公司、三菱、出光興產等三大勢力合作。他們同時成立了「分配部」來決定協會中每個成員能分配到的配額 $^{24}$ 。"}, {"type": "text", "text": "21 California Texas Oil Company Limited (New York) to Department of State, March 26, 1941, NA, 893.6363/244, pp. 4-6."}, {"type": "text", "text": "22 California Texas Oil Company Limited (New York) to Department of State, March 26, 1941, NA, 893.6363/244, pp. 6-8."}, {"type": "text", "text": "23 California Texas Oil Company Limited (New York) to Department of State, March 26, 1941, NA, 893.6363/244, pp. 6-8."}, {"type": "text", "text": "「華北石油協會」關切的重點為價格的控制，以及日本公司如何將石油從日本進口到華北。新的進口限制，與預料中的價格控制與進口配額，代表著外國石油經銷商只能任憑該協會與「中國事務部北京辦事處」（Peiping officer of the China Affairs Board，該部門屬於「臨時政府」，並接收來自日本官方的命令）的擺布。為了實施新的貿易限制與日圓貿易圈（Yen bloc trade），「中國事務部」監督了所有貿易協會的建立，而這些協會受到日本大公司及天津的日本商會的管轄，1937年1月以後的進口項目（以貨物為基準）更須附上會員申請表。很明顯地非日本公司不可能經由日本在華領事館的註冊取得此一便利，或是在進口協會所掌控的情況下，取得將貨物自日本進口的許可 $^{25}$ 。"}, {"type": "text", "text": "1938年2月11日，日本在華北設置的「聯合準備銀行」（FRB），實施金融統制，發行大量聯銀券，與日元等價，總部設於北京，分支有天津、青島、濟南和開封。在聯合準備銀行的運作之下，日本可以任意拒絕或不批准任何非日圓貿易圈國家企圖進口貨物交易至華北的許可申請 $^{26}$ 。此外，日本人得以利用進口協會的運作利器，驅除在華北的歐美企業與競爭者。這些協會組織的影響力，不僅僅是在華北和滿洲國，甚至在上海亦然 $^{27}$ 。"}, {"type": "text", "text": "2. 美孚真空石油公司"}, {"type": "text", "text": "從1940年7月開始，美孚真空石油公司的天津分公司，也被「聯合準備銀行」要求提供關於該公司過去的詳細商業資訊，以及未來預計所需的貨幣交易量 $^{28}$ 。美孚真空石油公司指控華北石油協會和日本的石油壟斷政策，干預了美國石油公司的獲利。他們擔心日本公司會成為在華北的競爭者，特別是鑑於這一事實——渤海石油公司（Pohai Petroleum Company）、三菱，和大華石油公司等受日本控制的石油公司都在天津與塘沽興建了儲油槽及貨倉以存放油品 $^{29}$ 。"}, {"type": "text", "text": "1941年3月，美孚真空石油公司與德士谷公司的代表知會美國駐神戶的領事館表示，經營中日航空運輸的在華日資公司遇到了無法從上海的英、美著名石油大公司取得汽油的困難。這些難處迫使了這些日資航空運輸公司使用一些「天真怪異」（as interesting as they are naive）的詭計。日本報紙藉機宣傳兩家位於上海的美國公司「受到了美國軍需處（U.S. Board of Munitions）（指示），禁止在未來儲存航空用汽油。」 $^{30}$ 這些宣傳意味著日本擔心在中國的占領區可能無法獲得著名的美國石油公司（意即德士谷和美孚）在上海進口的石油貨量，但對美國大石油公司而言，當時美國政府尚未參戰，兩家公司之詢問領事館帶有一種試探美國政府石油政策的性質。長期關注中國事務的美國駐神戶領事索克斌（Samuel Sokobin），早在1926年擔任藩陽總領事時就對日本在東北的擴張政策甚有警覺。他說目前在中國的日資航空公司它們未來究竟能從美國獲取的石油供應量著實令人關切，他向國務院大力建言應立即調查每個口岸的統計數據以作為評估從美國出口至日本占領區口岸的石油比例 $^{31}$ 。"}, {"type": "text", "text": "24 Texas Oil Company Limited (China) Ltd. Shanghai to the American Ambassador (Peking), Sep. 6, 1941, NA, 893.6363/254. For the Kōain (Asia Development Board), see John Hunter Boyle, China and Japan at War, 1937-1945: The Politics of Collaboration (Stanford, CA: Stanford University Press, 1972), pp. 160-170."}, {"type": "text", "text": "25 Tientsin Dispatches to the Peking Embassy, July 7, 1940, NA, 893.6363/232."}, {"type": "text", "text": "28 Division of Far Eastern Affairs, U.S. Department of Sates, Aug. 6, 1940, NA, 893.6363/232."}, {"type": "text", "text": "26 詳見：Li Lincoln, The Japanese Army on North China, 1937-1941, Problems of Political and Economic Control (London: Oxford University, 1975), pp. 55, 144. 27 Tientsin Dispatches to the Peking Embassy, July 7, 1940, NA, 893.6363/232."}, {"type": "text", "text": "29 Tientsin Consulate General to the Secretary of State, “Activities of the North China Petroleum Association and Japanese Competition in the Trade for Petroleum Products.” July 9, 1940, NA, 893.6363/234."}, {"type": "text", "text": "30《大阪日報》(Osaka Mainichi), March 7, 1941."}, {"type": "text", "text": "在1941年9月，幾乎就在日本擴張軍事侵略的同一時間，受日本掌控的「華北石油協會」適時擴大它的規模。美孚真空石油公司知會美國駐京大使館——該公司的經銷商相信他們將被迫要求加入「華北石油協會」，以取得許可證來經營公司，如此一來協會成員的貿易皆會被嚴格控管；如果該協會依照計畫運行的話——且當它最終發生時，美孚公司要求美國政府的權責機構必須發出有力的抗議。美國大使館相信「華北石油協會」將進一步將英、美石油公司在此一區域的商業利益置於日本掌控之下。但是華府方面坐待結果發展，毫無進一步作為 $^{32}$ 。"}, {"type": "text", "text": "1941年12月，英國亞細亞石油公司計畫將其總部從香港遷至馬尼拉，以避開英國與日本日漸升溫的敵意之中，該公司尚能維持良好的溝通和營運。12月3日，美孚真空石油公司的代表梅伊（A. G. May）詢問國務院是否握有任何資訊，得以為總公司針對其位於上海的華南管理處可能採取的類似預防性措施而辯護。作為回覆，遠東事務部建議他們應該將總部遷往新加坡而非馬尼拉，「不論如何，這個問題應該要引起國務院高層官員的關注」 $^{33}$ 。不久之後，馬尼拉便落入了日本人的掌控之中。"}, {"type": "text", "text": "除了在華北占領區的壟斷政策，日本在東北占領區所能開採利用的油源也極為有限。1931年日本侵略東北以前，中國最大的石油生產來自於撫順的油頁岩蒸餾廠。在日本占領東北的第一年（1931），該油廠產出了44萬桶的原油，1933年以後的原油年產量已超過了59萬桶。1935年，在大連設置了煉油廠。在《日本—滿洲國年鑑》（The Japan-Manchukuo Year Book, 1940）中記載，該煉油廠的年產量為44萬桶原油 $^{34}$ 。此外，日本政府也在滿洲國境內發掘油田。阜新油田發現於1938年，且一開始似乎前景看好，滿洲國政府聲明這個新油田「比蘇聯的巴庫油田稍微小一點，但品質超越了蘇聯石油。」 $^{35}$ 滿洲國總務長官星野直樹說：「無論如何在滿洲能發現石油都是很令人振奮的，跟之前斷言這個國家沒有石油時相比」 $^{36}$ 。儘管如此，在滿洲東北油田並沒有發現較高的辛烷值可以被製成航空汽油或一般汽油 $^{37}$ 。1943年日本占領南太平洋荷屬東印度群島後，阜新的鑽油設備被移往該群島油田，而在阜新的鑽油作業則被擱置直至1945年戰爭結束時，當時已有81座鑽油井完成，但原油的產量非常稀少 $^{38}$ 。"}, {"type": "text", "text": "31 American consulate, Kobe, Japan, March 10, 1941, NA, 893.6363/239. Subject: \"Efforts by the Sino-Japanese Air Transportation Companies in China to Obtain Gasoline.\" 索克斌駐藩陽領總事時大量報導了日本打造鋼煤工業和擴張軍事帝國的舉動，這些報導令國務院一些人感到不安，且產生爭議。然而，正由於他對日本政情的評估，使他被調往日本神戶出任領事。在此之前索克斌在中國豐富的外交經歷如下：1919-20擔任重慶副領事，1921-24年任張家口副領事，1925年升任領事。Roy M. Melbourne, Conflict and Crises: A Foreign Service Story (Lanham, MD: University Press of America, 1993), p. 46."}, {"type": "text", "text": "33 Memorandum of Conversation, Division of Far Eastern Affairs, Department of State, Dec. 3, 1941, NA, 893.6363/261."}, {"type": "text", "text": "34 Helen Smyth, “China’s Petroleum Industry,” Far Eastern Survey 15 (June, 1946), p. 189."}, {"type": "text", "text": "35 Japan Weekly Chronicle (Kobe), May 23, 1940."}, {"type": "text", "text": "32 Richard P. Butrick (Counselor of Embassy in Peking) to the Secretary of State, Sep. 4, 1941, NA, 893.6363/253."}, {"type": "text", "text": "36 Voluntary Report, subject: Importation on petroleum prospecting and discovered in Manchuria. Prepared by A. Bland Calder, Assistant Commercial Attaché, July 9, 1940, NA, 893.6363 Manchuria/318. 滿洲國總務長官星野直樹是策劃對中國東北實行經濟侵略的重要人物，他策劃成立了由日本人控制的滿洲國中央銀行，全面控制滿洲金融命脈，並鼓動日本國內財閥到東北投資。"}, {"type": "text", "text": "對石油匱乏的危機意識，使得日本政府在未和美國正式宣戰之前，即在中國占領區以各種手段希望增加占領區的石油貯備量和實施壟斷政策，直接影響的是美國在華的跨國石油公司。由以上分析可以看出，美孚真空石油公司與德士谷公司都採用了相當保守的政策來解決上海與華北的石油存貨問題，卻又希望能避免倒閉。再者，雖然美國政府意識到身陷遠東危機之中，但就日本在中國占領區的經濟壟斷而言，或更明確地說——至關重要的石油問題——美國除了終止《美日商約》（1911年）之外，並無採取任何反擊措施。在珍珠港事變以前，美國在中國占領區的石油政策可說是孱弱且猶豫的。"}, {"type": "text", "text": "二、非占領區中國的石油問題與美國的石油戰略"}, {"type": "text", "text": "在甘肅開發油田和汽油產品的計畫一旦成功，將會對一直以來，在中國市場供給汽油與其他石油的外國石油公司，造成可觀的財務損失……（然而）此刻，開發（中國）油田的激情正被大大鼓舞，因為迫切需要汽油，才能讓卡車載送軍火和其他主要物資。"}, {"type": "text", "text": "——詹森（Nelson Trusler Johnson）致羅斯福（Franklin Delano Roosevelt），於1941年4月29日。 $^{39}$"}, {"type": "text", "text": "1941年4月底，美國駐重慶的詹森大使提議（1940年9月國民政府遷都重慶），應立即著手開發甘肅油田和汽油產品。這意味著戰時中國依賴本土石油產品及其替代品的重要性，已達到空前嚴重程度。如眾所知甘肅、陝西、四川和新疆等地蘊藏有油田，但卻因中國缺乏資本與先進技術而遲遲無法開採。太平洋戰爭期間，出於戰爭策略而開採新油田和擴充舊油田，在美國提供的先進設備與足夠的運輸設施等協助之下，中國期許最終可以達到石油的自給自足 $^{40}$ 。"}, {"type": "text", "text": "此處必須簡單回溯 1930 年代中國礦業法與石油開採的問題。1931 年國民政府公告的礦業法（1930 年制定），規定外人持有的礦業股份限定於 50%，中國人股份需超過一半以上，半數以上的公司主管必須是中國人，董事會和經理人亦然。儘管中國的礦業法中包含有上述不利外國公司的投資條款，但中國的實業家與銀行家仍比較傾向和外國的石油公司打交道。他們提議，中國可和德士谷公司、美孚真空石油公司、亞細亞石油公司，和上海威廉·杭特公司（William Hunt & Company of Shanghai）合作，畢竟讓中國政府自己來可能會太慢，且中國缺乏這種大型工程所需的技術財力和人力等重要資源 $^{41}$ 。當時美孚真空石油公司急切地想和中國人合作，並表達了「我們應該努力合作，使中國發展本身既有的原油產品」的期許 $^{42}$ 。然而，國民政府新設置的經濟相關部門，卻非常排斥和任何的外國公司合作，並堅持石油發展計畫應完全由中國政府所控制。對中國政府來說，石油產業很嚴格地必須是國營事業，而和外國公司合資、合作的建議也因此被駁回 $^{43}$ 。中國政府既希望吸納足夠的資金用於石油開發，卻又不願外人侵奪本國石油開採權，因而亟須由可靠的國內私人資本出面解決這一兩難問題。在這一情勢之下，當時暫居國內的外交家顧維鈞聯合周作民、錢永銘、嚴恩標等民間投資者向國民政府提出申請，取得了甘肅、新疆、青海三省的石油勘探和開採特權，於1935年建立中國煤油探礦公司（Chinese Petroleum Company）。這是由政府授意，讓民間投資者向國民政府提出申請，取得西北石油勘探和開採的特許權。然而，隨著日本對華侵略威脅加深，國民政府決心由中央政府統籌開發西北油田，以應付迫切需求的石油問題，因此又收回了顧維鈞等人的石油開採特權 $^{44}$ 。抗戰期間，資源委員會全權接管了中國的石油開發。"}, {"type": "text", "text": "37 U.S. Foreign Service, American Consulate, Darien, May 12, 1941, NA, 893.6363 Manchuria/319."}, {"type": "text", "text": "39 U.S. Embassy (Chungking) to the Secretary of State, April 29, 1941, NA, 893.6363/241."}, {"type": "text", "text": "40 Helen Smyth, \"China's Petroleum Industry,\" pp. 187-190."}, {"type": "text", "text": "38 申力生主編，《中國石油志》（台北：中國石油公司，1976），pp. 901-902."}, {"type": "text", "text": "41 U.S. Embassy (Chungking) to Secretary of State, 29 Apr., 1941, NA, 893.6363/241. 這些報告雖是1941年，但回溯了1930年代中國的礦業法規定。"}, {"type": "text", "text": "（一）中國各地油田概況與石油輸入途徑"}, {"type": "text", "text": "在1937年至1941年間，中國各地的油田發展情形如下："}, {"type": "text", "text": "1. 甘肅"}, {"type": "text", "text": "1930年代以前，中國一直都沒有充足的地質調查來確定正確的石油存量。1936年11月，凡爾登（G. S. Walden）和派克（P. W. Parker）——美孚真空石油公司的駐華代表，分別給美國國務院的備忘錄中，提到美孚真空石油公司與一個握有西北中國探勘權的華資企業的談判紀錄。受到中國礦業法的限制性，美孚真空石油公司無法假定他們能有一個積極的參與角色；但在這家華資企業的邀請之下，美孚真空石油公司派出兩個美國地質學家，協同這家華資企業派出的專有技術人員，於1937年至1939年間在甘肅省展開更大規模的地質調查 $^{45}$ 。這家華資企業亦即前面提及的顧維鈞與華資企業家創設的「中國煤油探礦公司」，兩位美國地質學家是韋勒（Marvin Weller）和蘇頓（F. W. Sutton）。"}, {"type": "text", "text": "在地質勘查中，一個選點是甘肅玉門附近石洋河（Shih-You-Ho）背斜層。玉門位於甘肅西部，長久以來作為絲綢之路上的重要驛站而聞名，玉門油田被劃為一個有希望的鑽探點。自從中日戰爭情勢愈來愈為危急，情況變得不允許讓私人華資企業在如此偏遠的地方從事探勘工作，必須由中央政府扛起這項國家級的動員計畫，第一口位於石洋河背斜層的油井在1939年開鑽 $^{46}$ 。當時仍有不少人主張邀請外國石油公司，與國家資源委員會並肩合作的基礎下，協助鑽井和甘肅石油工業的發展 $^{47}$ 。"}, {"type": "text", "text": "42 Department of State, Memo of Conversation, 23 Nov., 1943, NA, 893.6363/299."}, {"type": "text", "text": "43 1935年間，美國商人阿爾脫鍾斯曾多次申請勘探甘肅、新疆、陝西、四川等地的油礦，並願出資至少一千五百萬美金，但均被國防設計委員會以種種理由駁回。皇甫秋實、賈欽涵，〈顧維鈞與中國西北石油開發〉，《復旦學報（社會科學版）》2017年第1期，頁74。"}, {"type": "text", "text": "44 皇甫秋實、賈欽涵，〈顧維鈞與中國西北石油開發〉，頁71-79。顧維鈞通過加拿大友人何生（Harry Hussey）積極與美孚石油公司接洽合作，委派美國地質學家韋勒和蘇頓前往中國西北勘探油田。這一開採西北油田的事業，到了1938年由經濟部收回，當時也僅止於探勘油田階段，未曾實際開發。"}, {"type": "text", "text": "45 Department of State, Memo of Conversation, 23 Nov., 1943, with Enclosure: Memo of Standard-Vacuum, 19 Nov., 1943, NA, 893.6363/299."}, {"type": "text", "text": "46 詳見：張力，〈陝甘地區的石油工業（1903-1949）〉，收錄於中央研究院近代史研究所編，《中國現代化論文集》（台北：中央研究院近代史研究所，1991"}, {"type": "text", "text": "1941年2月，國家資源委員會接收了來自一家美國公司的探鑽和煉油機械。然而，如何將這些機具運到玉門，則是個迫切的難題。先運到海參崴，經由歐亞大鐵路移動到阿拉木圖（Alma Ata），再透過卡車經烏魯木齊和哈密送到玉門的這個方法被認為是可行的。然而蘇聯很不願意提供經由歐亞大鐵路輸送貨物的許可，因為這些貨物並不是在蘇聯境內購買的 $^{48}$ 。由此可見西北油田開發所牽涉的機具運送問題的複雜性。"}, {"type": "text", "text": "2. 陕西"}, {"type": "text", "text": "在陝西北部有兩座油田：一座在延長、一座在永平。第一座油井鑽於1907年。美孚石油公司和袁世凱政府曾在1914年至1915年間訂有合約，合作挖掘陝西北部的油田。但由於中國內部政治動盪，再加上日本的抗議和干預，這項計畫終告失敗。美孚公司的探勘報告，宣稱陝北油田為淺苗油田，開採價值不高；對於美孚的說法，中國方面有人以為這是美孚公司故意讓中國產不出石油，以保有美孚在中國市場優勢的陰謀論，這一說法甚至在1930年代初期仍有地方官員持有此論 $^{49}$ 。"}, {"type": "text", "text": "1934年3月，實業部將陝北石油礦區劃歸國營，共劃分兩礦區：延長縣張家園、雷家灘一帶，共計410公頃4公畝；延長縣永平鎮一帶礦區約688公頃44公畝，不久成立陝北油礦探勘處，由孫越崎任處長（後由嚴爽代理）。1935年4月，陝北油礦探勘處改隸資源委員會統籌接管，當時延長原油年產量不過一、兩千加侖，中國所需主要仍靠各類洋油進口 $^{50}$ 。1935年10月，延長油田所在地被中國共產黨占領接管，且在國家資源委員會的工程師撤離之後，國民政府無法持續在陝西發展石油資源的計畫；因此，國民政府將大部分的重心都放在甘肅的油田。1936年12月，西安事變後國共再度合作，中共中央經濟部遷往延安，接手整理油礦。抗戰以後中共陝甘寧邊區政府建設廳接管延長油礦，重新清理和修復延長油礦。陝甘寧邊區建設廳到1937年年底共投資10,574元，對個別油井進行了清理修復，並準備新建4號油井。然延長油礦由於探勘技術落後、缺乏技術人員、設備不完善和意外事故頻傳等等因素，生產量雖有增長，但仍不理想。從1939年到1945年，陝甘邊區石油產量，原油產品總計僅有136,920桶（1桶12.5公斤），汽油產量總計11,156桶 $^{51}$ 。此一數據，如和以下將述及的非占領區中國的石油總輸入量（表8-3）相比，可見得陝甘邊區石油出產量對抗戰時期中國的石油供應需求，實屬微少之數，且油品等級低劣，根本無法生產航空汽油或高級汽油。"}, {"type": "text", "text": "年3月），頁477-505。"}, {"type": "text", "text": "「陰謀論」說，並不可靠。最主要原因是美孚當時急於在亞洲各地區發挖油田，以配合其打造鑽井、煉油、經營與銷售等垂直多層的一體化跨國企業王國。詳見：吳翎君，《美孚石油公司在中國》，第3章〈與中國政府的合作〉，頁84-110。"}, {"type": "text", "text": "47 U.S. Embassy (Chungking) to Secretary of State, 29 Apr., 1941, NA, 893.6363/241. 48 U.S. Embassy (Chungking) to Secretary of State, 29 Apr., 1941, NA, 893.6363/241."}, {"type": "text", "text": "49 1932年西安綏靖公署駐京辦事處處長胡逸民向實業部呈請改良及擴充陝北延長油礦，指出過去延長油礦未能發展的種種原因，包括交通運輸困難、缺乏中外技術專家、不能充分購得各項機器、無充分兵力保護開採礦務之進行等因素之外，甚至指責美孚石油公司「恐此礦油開發，將盡奪美油之營業」，故美孚蓄意開採不力。《西北文化日報》，1932年5月11日，頁3。筆者認為"}, {"type": "text", "text": "50 張力，〈陝甘地區的石油工業（1903-1949）〉，頁490-491。"}, {"type": "text", "text": "51 王晉林，〈抗日戰爭時期陝甘寧區的石油工業〉，《中國石油大學學報》，第3期，2012年6月，18卷，頁74-79。該文認為抗戰時期陝甘寧邊區石油工業的建立和發展為抗戰勝利創造物質基礎，也對戰後新中國石油工業的建設和發展有重要貢獻。但筆者從該文作者整理的石油產量提到1940年原油產出3,859桶，1941年為12,437桶。1940年汽油產出188桶，1941年為953桶（1"}, {"type": "text", "text": "3.四川"}, {"type": "text", "text": "1938年10月，經濟部國家地質調查所和四川省地質調查所，共同組成石油調查團，在預估藏有石油的四川省威遠和榮縣地區進行探勘。除了這項工程之外，國家資源委員會從1940年會計年度開始，得到每年150萬（中國國幣）的預算，用於鑽探四川的其他地區，尤其是巴縣和達州地區。但很不幸地是這項工程太晚開始，且預算不足 $^{52}$ 。"}, {"type": "text", "text": "1939年，永利化工有限公司（Yungli Chemical Industries Limited Company）僱用富有經驗的美國工程師哈蒙德（William S. Hammond），負責探勘油田。永利化工原設置於天津，由於日本占領天津，該公司迫遷到四川五通橋。由於永利公司在五通橋的地利之便，因而由該公司出面交涉開採另外三個可能鑽到油的油田，當時約有250噸的設備從紐約運出，中國政府支給永利公司一筆價值450萬美金的外匯券以支持這項計畫，並承諾將再給這家公司另外的500萬美金 $^{53}$ 。由此可見中國政府亟需開採本地油田。"}, {"type": "text", "text": "4. 新疆"}, {"type": "text", "text": "一些地質學家相信新疆油礦是巴庫油田的延續。新疆主要的油田位於烏蘇，天山山脈坡段上。另一個油田在迪化，位於山脈的北面，產油不多。1933-1944年間新疆控制在盛世才手中，並與蘇聯維持密切關係，使國民政府不太可能在該省開展石油業。在1943年1月蘇聯勢力退出新疆以前，新疆北部油田的探勘和發展主要由俄國人進行。1944年末，烏蘇油田共有26座油井和一座煉油廠 $^{54}$ 。"}, {"type": "text", "text": "總而言之，甘肅西北部的探勘與發展，是所有中國油田中最有希望的一個選項，並且在國家資源委員會的監督之下，石油開採計畫和抗戰政策緊密結合。據1937-1943《中國年鑑》（China Handbook）所記，如以1940年為基準，並將基準值設為100，則甘肅的原油產量在1940年至1941年成長了876%，更在1942年成長了7,408%。1941年的汽油產量較1940年成長了286%，且在1942年成長了2,425%。煤油的產量在1941年成長了332%，而在1942年則成長了1,616% $^{55}$ 。"}, {"type": "text", "text": "很明顯地，中國本身油田的產量和品質並不足以應付中國的需要。在1940至1941年間，非占領區中國的大部分石油來源有三條途徑：一、穿越印度支那（Indochine）從寧波和華南口岸入口；二、經由仰光的進口貨運；三、來自緬甸當地生產的石油裝運輸入（表8-3）。1941年，因為滇緬公路突然關閉，交通運輸的中斷，讓非占領區中國經歷一場更嚴重的補給短缺。在此一情況之下，勢必又更加依賴中國當地產出的石油產品。"}, {"type": "text", "text": "桶12.5公斤）。從這項數據，筆者以為，陝甘寧邊區的石油是有增加，然若和國民政府1940-1941在非占領區的進口石油量總數（表8-3）之需求相比，可看出陝甘寧邊區產出石油量對抗戰時期中國的需求和消耗量而言，乃極其微少之數。1加侖等於3.785公升。"}, {"type": "text", "text": "52 U.S. Embassy (Chungking) to Secretary of State, 29 Apr., 1941, NA, 893.6363/241."}, {"type": "text", "text": "53 Hammond的薪水由美國雇主「國營石油供應公司」（the National Supply Company）支付，派遣他到中國來，是希望中國的公司能及時發現石油的商業利益，並成為購買美國公司產品的重要代理人。NA, 893.6363/228."}, {"type": "text", "text": "54 Smyth, “China’s Petroleum Industry,” p. 190. 太平洋戰爭前，國民政府曾嘗試取回新疆，但未果。1942年，新疆總督盛世才和蘇聯關係絕裂，並和國民政府展開諒解。1944年盛世才被任命為農林部長，國民政府勢力復進入新疆。高素蘭，〈戰時國民政府勢力進入新疆始末（1942-1944）〉，《國史館館刊》，第17期（2008），頁129-165。"}, {"type": "text", "text": "55 The China Handbook: 1937-1943, A Comprehensive Survey of Major Developments in China in Six Years of War (New York: Macmillan, 1943), p. 484."}, {"type": "text", "text": "根據任職於中國財政部的美國技術顧問邁爾斯（D. F. Myers）曾報告，每月有10萬加侖的汽油從香港，經由大鵬灣輸入非占領區中國；在1940年中國政府更設法用走私方式，使得經由這條路線的石油進口量提升至每月20萬加侖。油商冒著非法貿易的風險，使得石油價格變得不尋常地高。當油品抵達英國殖民地香港時，由於必須在香港繳稅而使得石油價格又再拉高一次，但如果以走私運至中國，油品運出時並不會被退稅（所以油價變高）。汽油會藉由小船從大鵬灣運往內陸，再利用鐵路送到桂林 $^{56}$ 。在1941年12月25日香港尚未陷落於日軍之前，這條經由香港的石油輸入途徑，包括正常運輸和走私方式，更加說明了戰爭時期中國政府運輸石油之艱困。"}, {"type": "text", "text": "此外，石油產品經由滇緬公路、寧波、蘇聯進入非占領區中國。但從緬甸進口的汽油很大一部分都消耗在從邊界運往昆明和重慶的路途中。寧波是個更適合進口的港埠，因為桶裝石油可透過水路運輸以大幅減少汽油的消耗。來自蘇聯的汽油則須面臨最艱困的一條路線，因為只送到西北的蘭州為止，並且大多都用於航空用途。當時沒有任何數據能說明汽油的每月平均輸入量 $^{57}$ 。"}, {"type": "text", "text": "56 U.S. Embassy (Chungking, Nelson Trusler Johnson) to Secretary of State, 4 Dec., 1940, Subject: Gasoline imports into Free China, NA, 893.6363/237."}, {"type": "text", "text": "57 U.S. Embassy (Chungking, Nelson Trusler Johnson) to Secretary of State, 4 Dec., 1940, Subject: Gasoline imports into Free China, NA, 893.6363/237."}, {"type": "text", "text": "（二）美國參戰後的中美石油策略"}, {"type": "text", "text": "1. 動員美國石油公司"}, {"type": "text", "text": "抗戰時期國民政府資源委員會支撐起戰時相關的鋼鐵、電力、石油的重工業發展。資源委員會投入中國石油調查工作，並仔細調查緬甸汽油產量及荷印石油產額的情報，作為評估戰時太平洋戰區的石油供給問題 $^{58}$ 。1941年12月美國參戰之後，國家資源委員會建議在印度不急著使用的相關石油設施，應盡快投入於甘肅的油田作業。1942年，美國駐華大使高思（Clarence E. Gauss）建議甘肅油礦局——隸屬於國家資源委員會，購買兩座美孚真空石油公司位於重慶的兩座油池。這項協議包括一、美孚油池讓售之後，一俟重慶至長江下游水位恢復正常時，仍在原地由該公司重建原油量之油池，並且由油礦局向重慶市政府和海關監督請准發給重建油池的許可證件；二、中國政府應該為購買油池支付押金，而押金的金額由美孚真空石油公司以重建油池所需的花費來試算；三、任何協議的達成都必須經由大使館協商，簽署的協議的副本須給大使館一份。事實上，這項事務是由何應欽上將與美國准將馬格魯德（John Magruder）在3月間安排的 $^{59}$ 。這個訊息在5月送到位於重慶的美國大使館，之後順利地簽署了協議。箇中原因是中國很急切地想解決石油儲存槽的問題，同時也因為這項協議是既合理又慷慨的。舉例來說，該協議特別提及中國政府需負擔重建油池的費用，然而如果實際的花費低於預估值，美孚公司將會退還差額。資源委員會的檔案中提到該年4月間甘肅油礦局報告該局設備原極簡陋，重慶美孚石油公司在渝南原有之油池兩座（一具為直徑93呎、高35呎，可容油5,400噸；另一具為直徑50呎、高35呎，可容油1,570噸）質料俱佳，頗合應用，經與該公司洽商讓售，希望請外交部儘速請美大使館令飭該公司依外交手續辦理，並請重慶市政府和重慶海關分別預先發給該公司重建這二座油池的許可證 $^{60}$ 。當時已遷到重慶的中央政府與美國方面火速處理美孚重慶公司這兩座頗具規模的油池，可見得戰時石油問題燃眉之急。"}, {"type": "text", "text": "1943年4月，國家資源委員會聘任加州德士谷公司工作的一名鑽油專家布希（Sam Bush），負責監督玉門油井和煉油廠——太平洋戰爭期間中國最大的產油區。在同一時間，美孚真空石油公司賣給國家資源委員會一座高產能的煉油廠。事實上，國家資源委員會已經有好長一段時間想買這座煉油廠了，但美孚真空石油公司一直不賣，因為他們認為甘肅當地的管理狀況還不足以勝任運作該煉油廠。在美國政府的建議和積極介入之下，美孚真空石油公司終於改變立場，賣掉那座煉油廠 $^{61}$ 。令美孚真空石油公司改變心意的可能因素是因為布希的聘用，這名德士谷公司的工程師被聘為甘肅石油生產的管理者。德士谷公司來勢洶洶的參與程度，已威脅到了美孚真空石油公司作為開發中國油田的先鋒角色（因為美孚公司從1910年代開始，就和中國政府有陝西油田等合作計畫），於是美孚公司更密切地和美國政府合作，藉由賣出他們的儲油槽和煉油廠，並派出更多的美國鑽探工到中國來 $^{62}$ 。"}, {"type": "text", "text": "58 Embassy of the United States of America (Chungking) to the Secretary of State, April 29, 1941, NA, 893.6363/241. Foreign Trade Office of National Resources, Chinese Government, New York Brand, 1941 June 11th, K. Y. Yin's (Yin Zhongrong) summary for the article by Leo W. Stach, \"Petroleum exploration and production in western Pacific during World War II.\" 函呈卡森 (Lester M. Carson) 著中國石油問題一文。〈緬甸汽油產量及荷印石油產額報告〉，資源委員會檔案，國史館藏，典藏號003-010306-0020。本章表8-3資料亦為其中一項。 59 U.S. Embassy (Chungking) to Secretary of State, 28 May, 1942, NA, 893.6363/268."}, {"type": "text", "text": "60〈甘油礦局、軍政部購美孚行油池〉，國家發展委員會檔案管理局藏，《外交部檔案》，A303000000B/0031/432.4/0002。頁4-5。"}, {"type": "text", "text": "61 U.S. Embassy (Chungking) to Secretary of State, 15 Apr., 1943, NA, 893.6363/280；國史館藏，《資源委員會檔案》，003-0207000-605。"}, {"type": "text", "text": "美國政府強烈鼓勵美國石油公司參與中國油田的探勘與挖掘。例如，美孚真空石油公司在1942年10月22日和經濟部甘肅油礦局和國家資源委員會煉油管理處達成協議，將該公司分別位於湖南長沙、湘潭、衡陽的5個儲油槽賣出 $^{63}$ 。甘肅油礦局的負責人孫越崎報告1943年5月該局有3座油井，原本希望在9月底可增加到7個，但缺乏煉油設備的問題無法解決；若有來自美國的工程協助，煉油產量可望增加 $^{64}$ 。到了1943年7月，因太平洋戰事軍需之急用，美國陸軍總部直接向資源委員會接洽，甘肅油礦局價購美孚油公司長沙、湘潭、衡陽的3座油池擬請轉讓於美國陸軍部使用（原合同有5座，但因2座由甘肅油礦局拆用，故為3座），資源委員會函電欣然配合，提到：「既同為增加抗戰利用，所有原給該公司之重建許可證，仍予有效無需退還」。惟應由油礦局和美孚石公司對於此項辦法正式交換函件 $^{65}$ 。也就是1943年下半年起美國陸軍部為配合作戰之需要，由美國陸軍替代甘肅油礦局使用美孚石油公司重建之油池，等於由美國軍方接管美孚這3座在華煉油事業的一種軍事動員。"}, {"type": "text", "text": "美孚的地質學家貝爾茲（E. W. Belts），對甘肅油田的豐富蘊量始終半信半疑，他認定在鑽探設備有限的情況下，甘肅油田的生產和經營將會是困難的。美國司鑽費德（W. C. Filed）、萊納（F. U. Rhyner）、布希（Mike Bush）等人，也表示甘肅油礦並不令人完全滿意 $^{66}$ 。到了1943年，在開發新疆油田方面有一新進展，透過美國駐重慶使館的引介，美孚真空石油公司得到一個探勘新疆油田的機會 $^{67}$ 。當時盛世才已和國民政府達成政治諒解，美孚真空石油公司有意將對甘肅的寄望移轉到鑽探新疆蘊藏的原油——之前美孚駐華董事代表派克（Philo Parker）就曾和美國政府機關洽議此事。然而，新疆各地礦區的產油量也一樣不樂觀 $^{68}$ 。"}, {"type": "text", "text": "2. 美國戰時石油管理局與中國政府的合作"}, {"type": "text", "text": "太平洋戰爭爆發後，美國華府關注於日益嚴重的中國石油問題，直屬於「戰時石油管理局」（Petroleum Administration for"}, {"type": "text", "text": "62 H. K. Fenn (Office of Censorship, Chief Cable Censor, U.S.A.) to George A. Gordon (Acting Chief, Division of Foreign Activity Correlation, Department of State), 26 Apr., 1943, NA, 893.6363/284-1/2."}, {"type": "text", "text": "65〈甘油礦局、軍政部購美孚行油池〉，國家發展委員會檔案管理局藏，《外交部檔案》，A303000000B/0031/432.4/0002。必須說明的是：油礦局和美孚公司的價購合同，係有5座油池，後來因2座由油礦局拆用，但原訂讓購合同並未變更，其餘3座乃轉行撥讓於美軍。"}, {"type": "text", "text": "63〈甘油礦局、軍政部購美孚行油池〉，國家發展委員會檔案管理局藏，《外交部檔案》，A303000000B/0031/432.4/0002。事由：轉送美孚洋行讓售長沙、湘潭、衡陽三地草訂合約五份請完成簽印手續後分別提送還由。U.S. Embassy (Chungking) to Secretary of State, 11 June, 1943, Enclosure: Chinese version of this agreement, NA, 893.6363/288."}, {"type": "text", "text": "66 U.S. Embassy (Chungking) to Secretary of State, 31 July, 1943, NA, 893.6363/290."}, {"type": "text", "text": "67 U.S. Embassy (Chungking) to Secretary of State, 15 Oct., 1943, NA, 893.6363/298."}, {"type": "text", "text": "64 U.S. Embassy (Chungking) to Secretary of State, 24 May, 1943, NA, 893.6363/286."}, {"type": "text", "text": "68 Department of State, Memo of Conversation, 23 Nov., 1943, Enclosure: Memo of Standard-Vacuum, 19 Nov., 1943, NA, 893.6363/299. 很可惜的是報告中，並未引用數據說明。"}, {"type": "text", "text": "War, PAW）的「美國對外石油委員會」（U.S. Foreign Petroleum Committee），全面衡量了石油供給和如何運送油品到中國的重要性，他們在1943年決定建立一個常駐附屬委員會來商討中國石油問題。該小組委員會——即中國石油委員會（Chinese Petroleum Committee）與「中國國防物資供應公司」（The China Defense Supplies Corporation, CDS，簡稱「國防供應公司」）密切聯繫以提供所有可能的援助；不僅是技術建議，還透過不同的機構，對中國石油問題提出有效的解決方案。戰時石油管理局的泰瑞·杜斯（J. Terry Duce）成為中國石油委員會和美國對外石油委員會之間的聯絡官 $^{69}$ 。"}, {"type": "text", "text": "「中國國防物資供應公司」於1941年5月1日宣告成立，它是國民政府和華府交涉軍援物資的最重要機構之一。這家公司係在美國德拉瓦州（Delaware）註冊的一家股份制商業公司，實際上是由國民政府獨資設立，資本金額與日常營運開支由宋子文主持的中國銀行墊付，並由宋子文出任董事長。最初在美國尚未參戰之際，通過這條非體制內的平台將中美兩國政府聯繫起來。國防供應公司組建有航空事務、軍需用品、通訊器材、雜項物資等五個技術委員會，統籌規劃國民政府在美接洽各類租借物資之事宜 $^{70}$ 。美國參戰之後，到了1943年5月，國防物資供應公司和戰時石油管理局下屬的中國石油委員會，雙方開始有一個協調合作的運作機構，規劃具體的石油合作項目。根據石油管理處代表戴維斯（Ralph K. Davies）的備忘錄，聯合合作委員會的目的，係向「對外石油委員會」負責，並確保石油與其輸往中國的產品供給"}, {"type": "text", "text": "69 Letter of J. H. Thacher, Jr. (Executive Secretary, Foreign Petroleum Committee) to Joseph W. Ballantine inviting him to be a committee member of the Chinese Petroleum Committee, 15 May, 1943, NA, 893.6363/284; George A. Gordon to H. K. Fenn, 8 May, 1943, NA, 893.6363/284-1/2."}, {"type": "text", "text": "70 1941年3月美國國會通過「租借法案」，授權美國總統可決定哪些國家為反法西斯侵略國家，而予以提供物資和勞務方面的援助。中國也名列34個反侵略國家之一，根據這項法案，蔣介石立即指派宋子文代表中國，和美國接洽一切有關軍備物資事宜，因而有「中國國防物資供應公司」的成立。這是間登記在法律顧問柯科倫（Thomas G. Corcoran）所成立的一間特許公司，柯科倫曾是羅斯福總統「新政」時期重要的法律顧問，時已離開政府部門，可說是美國最早一批所謂對華政策的院外集團（Lobbist）。詳見：曹嘉涵，《抗戰時期中美租借援助關係》（上海：東方出版中心，2015），頁75-127。"}, {"type": "text", "text": "一、輸往中國的石油供給量將是贏得遠東戰役愈來愈重要的因素。"}, {"type": "text", "text": "二、輸往中國的石油供給來源將會增加，且以數個不同的路徑進入。這項要求必須由各個補給中國戰區的機構共同協商。"}, {"type": "text", "text": "三、由於中國邊界的地形極為崎嶇，在處理這項補給作業時，將會遇到諸多技術問題。屆時可以透過尋求民間專家提供對運輸系統的配置和維護的建設性意見，將補給運入中國。 四、與這項石油補給關切的是，中國境內的煉油廠設備和中國當地石油產量是其中最嚴重的問題，應該由一個技術委員會針對每一問題提出建言。"}, {"type": "text", "text": "五、該技術委員會與中國國防物資供應公司持續地交流，以確保所有可能的援助得延伸於各個機構，有效處理官方對中國石油問題的處理。71"}, {"type": "text", "text": "基於這個決定，所有在印度被認為非必要的、可用在中國幫助其提升產量的油田和煉油設備，都被立即轉移到中國。美國對外石油委員會主席任命了一個石油補給的常駐附屬委員會去解決中國國防需要。這套縝密機制的建立，說明了美國政府力圖解決中國石油的供給問題，並且作為考量贏得遠東戰略的必要措施。然而，這個時間對中國而言卻是姍姍來遲，直到1943年才看到美"}, {"type": "text", "text": "另一方面，從具體中英文資料看來，既然石油作為戰時物資如此重要，但是1941年國防供應公司在美國成立之初和美國交涉軍事物資時，並未專門針對卡車汽油或航空汽油等油品援華上有特定的交涉，主要包裹在軍事援華項目中，反而是經濟資源委員會針對石油短缺的相關具體問題更加投入。一直到1943年5月以後，國防物資供應公司始在美國租借援華的支配主導下，和美國戰時石油管理局展開上述直接聯繫，投入石油採購、運輸和補給，甚至技術支援。國防供應公司在石油合作交涉上與美方的具體作為似不多，有兩處資料紀錄如下：一、1942年甘肅油礦局委員曾委託「中國國防物資供應公司」通訊器材組組長尹仲容洽聘曾在美商德士谷石油公司國內外油田主持鑽井工作多年的鑽井師布希，和美籍司鑽蘭諾（Reninnor）、費德二人協同鑽井，這些外籍顧問約滿即回美國 $^{72}$ 。而當時尹仲容的職務則是國家資源委員會國際貿易事務所紐約分所主任，兼任「中國國防物資供應公司」通訊器材組組長；二、1944年，國防供應公司的業務快結束之前，曾協助資源委員會向美國索取設備，以實現甘肅油田年產5百萬加侖乃至於更多汽油的目標 $^{73}$ 。"}, {"type": "text", "text": "國防供應公司原為體制外的單位，它的命運並不長。1944年7月1日國防供應公司正式關閉，未竟之事移交給「中國物資供應委員會」（China Supplies Commission, CSC） $^{74}$ 。不久，該年（1944）11月16日，國民政府在重慶成立了戰時生產局，作為統籌戰時經濟生產的最高機構，由經濟部長翁文灝兼任局長。這一機構的成立受到1942年9月來華訪問的美國「戰時生產委員會」（War Production Board, WPB，1942年成立）局長納爾遜（Donald Marr Nelson）對蔣介石的建言與讚賞。納爾遜回美之後向羅斯福闡述美國如何幫助中國增加戰時生產的五大建議，包括加強美國駐重慶經濟辦事處的力量、建立中美聯合生產委員會協調兩國民生供應事宜等，羅斯福對此表示同意 $^{75}$ 。由此，抗戰時期軍需用品和民生經濟的協調統合納入重慶中央政府，而且更加仰賴美國政府的經濟援助。總之，經濟部轄下的資源委員會和美國政府及美國石油公司的交涉，包括油田探勘、油料、煉油、購買油槽等等事宜投入最多，而資源委員會的技術專家在戰後也順勢承接了中國石油公司的建立。"}, {"type": "text", "text": "72 張力，〈陝甘地區的石油工業（1903-1949）〉，頁497。"}, {"type": "text", "text": "71 Memo for Ralph K. Davies (Deputy Petroleum Administration), 5 May, 1943, NA, 893.6363/284."}, {"type": "text", "text": "73 楊雨青，〈宋子文與中國國防物資供應公司〉，《抗日戰爭研究》，2006年第4期，頁121。"}, {"type": "text", "text": "74 國防供應公司董事長宋子文於 1941 年 12 月繼任外交部長，隨即以外交部長身分交涉英美援華借款等外交交涉。1944 年夏，駐美大使魏道明接管了國防供"}, {"type": "text", "text": "1941年12月美國參戰以後，雖然不斷協助中國開採本身蘊藏的油源，但也直到1943年下半年以後太平洋戰事的膠著和困境，美國政府始針對中國石油問題有明確的協調機構和具體做法。至於非占領區中國的原油產量，在1940和1945年究竟成長了多少？兩個數據如下：一、根據《石油與天然氣期刊》（Oil & Gas Journal）的報導，1940年非占領區中國的原油年產量，官方報告為10,456桶；二、據The Oil Weekly在1945年1月29日的報導中提及，當時非占領區中國的年油產量約為6萬桶，歸功於1942年以後甘肅油田的努力開採，使產量提升 $^{76}$ 。另外，根據南京國民政府財政顧問楊格（Arthur N. Young）所記，太平洋戰爭時期國民政府統治地區面對巨大艱難，實現了一次戰時生產的「大躍進」，就戰前、1941年和1944年（僅上半年統計數字）石油產品增長情況如表8-4。楊格在1960年代初期回顧戰時美國對華援助時，主要強調抑制通膨對戰時經濟和實現戰後經濟體制的急迫性，這件事當時都被中美雙方所低估，而最後造成1949年失去中國的無可彌補的政策失誤。楊格也認為如果美國早在1937年中國對日抗戰開始就積極援助中國，可能對日本後來的冒進侵略產生遏制作用，可惜當時美國的視線焦點主要放在歐洲，援華的重要性往往被忽略 $^{77}$ 。"}, {"type": "text", "text": "應公司，該年7月1日新成立的「中國物資供應委員會」取代了國防供應公司的所有業務。「中國物資供應委員會」由駐美大使魏道明出任委員會主席，下設航空、軍火、工礦、公共衛生、交通通訊、電影部等。楊雨青，《美援為何無效——戰時中國經濟危機中美應對之策》（北京：人民出版社，2011）。"}, {"type": "text", "text": "75 戰時生產局成立後，駐美大使兼任的「中國物資供應委員會」成為聯繫的平台，並不直接參與採購清單。曹嘉涵，《抗戰時期中美租借援助關係》，頁180。林美莉，《戰時生產局的成立與活動——以租界法案的配合為中心》，《國史館館刊》，復刊第15期（1993年12月），頁165-183。"}, {"type": "text", "text": "76 Helen Smyth, \"China's Petroleum Industry,\" p. 190."}, {"type": "text", "text": "77 Arthur N. Young, China and the Helping Hand, 1937-1945 (Cambridge, Mass.: Harvard University Press, 1963), pp. 206-214."}, {"type": "text", "text": "太平洋戰爭後期中國石油量的運輸得以增加，與一道長1,800英里、自印度加爾各答至中國的油氣管至為相關。這道油氣管完成於1945年初，使得戰爭後期輸往中國的汽油和其他油品量大幅增加，重慶政府得以供應石油補給，調派軍事作戰。有資料對這條輸油管工程的描述如下，1943年8月，英美參謀長聯席會批准從印度阿薩姆建一條4吋輸油管直抵昆明，再從加爾各答建一條6吋輸油管到達阿薩姆。但是
