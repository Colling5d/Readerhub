<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美國人未竟的中國夢：企業、技術與關係網</title>
<style>
  :root{
    --bg:#f7f5f0;
    --panel:#ffffff;
    --ink:#2b2b2b;
    --ink-soft:#6b6b6b;
    --accent:#8a3b2e;
    --accent-soft:#efe5df;
    --line:#e2ddd4;
    --sidebar-w:290px;
    --lang-head:#f0ebe2;
    --zh:#7a1313;
    --en:#133b7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,serif;
    font-size:17px;
    line-height:1.85;
  }
  .app{display:flex;height:100vh;overflow:hidden}

  /* ===== Sidebar ===== */
  .sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:#fbfaf7;
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .sidebar .brand{
    padding:18px 18px 14px;
    border-bottom:1px solid var(--line);
    background:var(--accent);
    color:#fff;
  }
  .sidebar .brand h1{font-size:19px;margin:0 0 2px;letter-spacing:.5px}
  .sidebar .brand p{font-size:12px;margin:0;opacity:.85;line-height:1.4}
  .toc{flex:1;overflow-y:auto;padding:10px 0 30px}
  .toc .toc-top{
    font-size:12px;color:var(--ink-soft);text-transform:uppercase;
    letter-spacing:1.5px;padding:8px 18px;
  }
  .toc-group{margin-bottom:4px}
  .toc-item{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:7px 18px;cursor:pointer;font-size:14.5px;font-family:inherit;
    color:var(--ink);border-left:3px solid transparent;line-height:1.35;
  }
  .toc-item:hover{background:var(--accent-soft)}
  .toc-item .sub{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:1px}
  .toc-item.active{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
  .toc-item.active .sub{color:var(--accent)}
  .toc-sep{border-top:1px solid var(--line);margin:8px 14px}

  /* ===== Search ===== */
  .search-box{position:relative;padding:12px 14px;border-bottom:1px solid var(--line)}
  .search-box #search-input{
    width:100%;box-sizing:border-box;padding:9px 11px;
    border:1px solid #d8d0c0;border-radius:6px;background:#fff;
    font-size:13.5px;font-family:inherit;color:var(--ink);outline:none;
  }
  .search-box #search-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(160,120,70,.15)}
  .search-results{
    position:absolute;left:14px;right:14px;top:calc(100% - 4px);
    background:#fff;border:1px solid #ddd4c2;border-radius:8px;
    box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:50;
    max-height:min(46vh,420px);overflow-y:auto;display:none;
  }
  .search-results.open{display:block}
  .search-results .sr-head{
    font-size:11px;color:var(--ink-soft);text-transform:uppercase;
    letter-spacing:1px;padding:8px 12px 4px;border-bottom:1px solid var(--line);
  }
  .sr-item{padding:7px 12px;cursor:pointer;border-bottom:1px solid #f1ece2}
  .sr-item:hover{background:var(--accent-soft)}
  .sr-item .sr-meta{font-size:11px;color:var(--ink-soft);margin-bottom:2px}
  .sr-item .sr-meta b{color:var(--accent);font-weight:600}
  .sr-item .sr-text{font-size:12.5px;line-height:1.45;color:var(--ink)}
  .sr-item .sr-text mark{background:#ffe9a8;color:#5a3d00;border-radius:2px;padding:0 1px}
  .sr-empty{padding:12px;font-size:12.5px;color:var(--ink-soft);text-align:center}

  /* ===== Main ===== */
  .main{flex:1;display:flex;overflow:hidden}
  .col{flex:1;overflow-y:auto;padding:0 44px 120px}
  .col.en{border-right:1px solid var(--line)}
  .col-head{
    position:sticky;top:0;z-index:5;padding:16px 44px;
    background:var(--lang-head);border-bottom:1px solid var(--line);
    font-size:13px;letter-spacing:2px;text-transform:uppercase;
    font-family:"Helvetica Neue",Arial,sans-serif;font-weight:600;
  }
  .col.zh .col-head{color:var(--zh)}
  .col.en .col-head{color:var(--en)}
  .article{max-width:760px;margin:0 auto}
  .chapter-title{
    font-size:28px;font-weight:700;line-height:1.35;margin:36px 0 6px;
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,serif;
  }
  .chapter-sub{font-size:16px;color:var(--ink-soft);margin:0 0 28px;font-style:italic}
  .p{margin:0 0 1.25em;text-align:justify}
  .p.title{font-size:22px;font-weight:700;margin:2.2em 0 .6em;color:var(--accent)}
  .col.zh .p.title{color:var(--zh)}
  .col.en .p.title{color:var(--en)}
  .p.txt-marker{color:var(--ink-soft);font-size:13px;text-align:center;letter-spacing:3px;margin:3em 0}
  .notes-head,.bib-head{
    font-size:24px;font-weight:700;margin:34px 0 16px;
  }
  .note{font-size:15px;line-height:1.7;margin:0 0 .9em;color:#3a3a3a}

  /* Para-level follow: highlight the matched paragraph in the paired column */
  [data-lang] {transition:background-color .18s ease}
  [data-lang]:hover{background:rgba(180,160,120,.10);cursor:pointer;border-radius:3px}

  /* EN column serif italic look */
  .col.en{font-family:"Source Serif Pro",Georgia,serif;font-size:16.5px;color:#1f1f1f}
  .col.en .p{line-height:1.7}

  /* Scrollbar */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfc8bc;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  /* Progress */
  @media (max-width:1200px){
    .sidebar{--sidebar-w:240px;width:240px;flex-basis:240px}
    .col{padding:0 28px 100px}
    .col-head{padding:14px 28px}
  }
  @media (max-width:900px){
    /* ---- 手机上保持 中英左右两栏对照 ---------------- */
    html,body{height:100%;overscroll-behavior:none}
    html{-webkit-text-size-adjust:100%}
    html,body{margin:0}
    .app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
    body{background:var(--bg)}

    /* 侧边栏：顶部紧凑（宽度方向不占正文） */
    .sidebar{position:relative;transform:none;width:100%;flex:none;max-height:44vh;min-height:0;
             border-right:none;border-bottom:1px solid var(--line);overflow-y:auto;
             box-shadow:none}
    .sidebar .brand{padding:8px 12px}
    .sidebar .brand h1{font-size:16px}
    .sidebar .brand p{font-size:11px}
    .toc{padding:4px 0 12px}
    .toc-item{padding:5px 12px;font-size:13px}
    .search-box{padding:8px 12px}
    .search-results{max-height:150px}

    /* 主体：左右两栏，各占一半，自有滚动 */
    .main{flex:1;display:flex;min-height:0;overflow:hidden}
    .col{flex:1 1 0;min-width:0;width:auto;height:auto;position:static;
         overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 90px;
         -webkit-user-select:text;-webkit-touch-callout:none}
    .col .p{-webkit-user-select:text;user-select:text}
    .col.en{border-right:1px solid var(--line)}
    .col-head{position:static;font-size:12px;padding:8px 10px}
    .col .p{font-size:13.5px;line-height:1.6;text-align:justify;margin:0 0 .55em;hyphens:auto}
    .col.en .p{font-size:12.5px;line-height:1.55}
    .chapter-title{font-size:19px;margin:16px 0 3px}
    .chapter-sub{font-size:12px;margin-bottom:12px;line-height:1.4}
    .article{max-width:100%}

    /* 笔记面板 / 工具栏 小屏适配 */
    #note-panel{left:10px;right:10px;width:auto;top:auto;bottom:12px;max-height:60vh}
    #note-toolbar{max-width:97vw;flex-wrap:wrap}
    #note-toast{bottom:16px}
    .makenote{bottom:14px;right:14px}
  }

  /* ===== 笔记：画线/高亮 ===== */
  .hlmark{padding:0 1px;border-radius:2px}
  .ulnote{text-decoration:underline;text-decoration-thickness:2px;-webkit-text-decoration-color:#e8504a;text-decoration-color:#e8504a}
  #note-toolbar{position:fixed;display:none;z-index:9999;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.16);padding:6px 8px;gap:4px;font-family:inherit}
  #note-toolbar .nt{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:4px;border:1px solid var(--line);cursor:pointer;margin:0 2px;font-size:12px;color:#555;background:#fff}
  #note-toolbar .nt:hover{border-color:var(--accent)}
  #note-toolbar .nt.ul{width:auto;padding:0 8px;font-weight:bold;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#e8504a}
  #note-toolbar .nt.colors{width:auto;padding:0 4px}
  #note-toolbar .hlc{width:18px;height:18px;border-radius:3px;border:1px solid rgba(0,0,0,.18);cursor:pointer;margin:0 1px;display:inline-block}
  #note-toolbar .nt.cpy{width:auto;padding:0 9px;font-size:12px}
  /* 句子高亮：临时（选中句子时） */
  .senthl{background:#f5e660;border-radius:2px;padding:0 1px}
  /* 跨语言对应句高亮 */
  .peer-sent{background:#a7d3ff;border-bottom:2px solid #2f6fb3;border-radius:2px;cursor:pointer}
  .makenote{position:fixed;bottom:22px;right:22px;z-index:9998;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:13px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);font-family:inherit}
  .makenote:hover{filter:brightness(1.1)}
  #note-panel{position:fixed;top:16px;right:16px;width:320px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);z-index:10000;display:none;font-family:inherit;font-size:13px}
  #note-panel.np-open{display:block}
  #note-panel .np-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
  #note-panel .np-head b{font-size:15px}
  #note-panel .np-head button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:2px 6px}
  #note-panel .np-item{border-bottom:1px solid var(--line);padding:9px 14px;cursor:pointer}
  #note-panel .np-item:hover{background:#faf7f2}
  #note-panel .np-item .np-meta{font-size:11px;color:var(--mute);margin-bottom:3px;display:flex;gap:6px;align-items:center}
  #note-panel .np-text{line-height:1.55;color:var(--ink);word-break:break-word}
  #note-panel .np-empty{padding:24px;color:var(--mute);text-align:center}
  #note-toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;z-index:10001;opacity:0;transition:opacity .25s;pointer-events:none}
  #note-toast.nt-show{opacity:1}
  /* sync jump */
  .go-en,.go-zh{cursor:pointer;color:var(--accent)}

  /* ===== 目录折叠交互 (SIDEBAR-TOGGLE) ===== */
  /* 贴在侧栏右缘的竖向把手（经典折叠面板样式），不会遮挡任何内容 */
  .sidebar-toggle{
    position:fixed;z-index:9990;top:50%;
    left:calc(var(--sidebar-w) - 15px);transform:translateY(-50%);
    width:22px;height:52px;border-radius:0 8px 8px 0;
    border:1px solid var(--line);border-left:none;
    background:#fbfaf7;color:var(--accent);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;line-height:1;padding:0;
    box-shadow:2px 0 6px rgba(0,0,0,.06);
    transition:left .22s ease, background .15s ease, color .15s ease;
  }
  .sidebar-toggle:hover{background:var(--accent);color:#fff}
  /* 折叠后把手贴到最左 */
  .app.sidebar-collapsed .sidebar-toggle{left:0}

  /* 侧栏折叠动画 */
  .sidebar{transition:margin-left .22s ease}
  .app.sidebar-collapsed .sidebar{margin-left:calc(-1 * var(--sidebar-w))}

  /* 手机端：顶栏折叠，把手改为右上角小圆钮 */
  @media (max-width:900px){
    .sidebar-toggle{
      top:8px;right:8px;left:auto;transform:none;
      width:30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.4);
      background:rgba(0,0,0,.2);color:#fff;box-shadow:none;font-size:14px;
    }
    .sidebar-toggle:hover{background:rgba(0,0,0,.35);color:#fff}
    .app.sidebar-collapsed .sidebar-toggle{left:auto;right:8px;background:var(--accent);border-color:transparent}
    /* 手机上折叠=顶栏收起 */
    .app.sidebar-collapsed .sidebar{max-height:0;min-height:0;border-bottom:none;overflow:hidden}
  }

  /* ===== 阅读主题 / 字体 / 章节 HUD (READER-THEME-HUD) ===== */

  /* --- 主题：通过 data-theme 覆盖 CSS 变量 --- */
  html[data-theme="sepia"]{
    --bg:#f3ead8;
    --panel:#faf3e3;
    --ink:#43382a;
    --ink-soft:#7d6f58;
    --accent:#8a5a2b;
    --accent-soft:#ece0c6;
    --line:#ddcfb0;
    --lang-head:#ebdfc5;
    --zh:#7a3a13;
    --en:#3a4a2f;
  }
  html[data-theme="dark"]{
    --bg:#1d2024;
    --panel:#26292e;
    --ink:#dfe3e8;
    --ink-soft:#98a0aa;
    --accent:#c98b6b;
    --accent-soft:#33383f;
    --line:#3a3f46;
    --lang-head:#2b2f35;
    --zh:#e6a08a;
    --en:#8fb6e8;
  }
  html[data-theme="night"]{
    --bg:#0e0f11;
    --panel:#16181b;
    --ink:#c9ccd1;
    --ink-soft:#7d838c;
    --accent:#b0785c;
    --accent-soft:#202327;
    --line:#26292e;
    --lang-head:#181a1d;
    --zh:#d99a84;
    --en:#84a9d6;
  }
  html[data-theme="dark"],html[data-theme="night"]{color-scheme:dark}
  html[data-theme="dark"] body,html[data-theme="night"] body{background:var(--bg);color:var(--ink)}
  html[data-theme="dark"] .sidebar,html[data-theme="night"] .sidebar{background:var(--panel)}
  html[data-theme="dark"] .sidebar .brand,html[data-theme="night"] .sidebar .brand{color:#fff}
  html[data-theme="dark"] .search-box #search-input,
  html[data-theme="night"] .search-box #search-input{background:var(--bg);color:var(--ink);border-color:var(--line)}
  html[data-theme="dark"] .search-results,
  html[data-theme="night"] .search-results{background:var(--panel);border-color:var(--line)}
  html[data-theme="dark"] .sr-item,html[data-theme="night"] .sr-item{border-bottom-color:var(--line)}
  html[data-theme="dark"] .sr-item:hover,html[data-theme="night"] .sr-item:hover{background:var(--accent-soft)}
  html[data-theme="dark"] .col.en,html[data-theme="night"] .col.en{color:var(--ink)}
  html[data-theme="dark"] .note,html[data-theme="night"] .note{color:var(--ink-soft)}
  html[data-theme="dark"] #note-toolbar,html[data-theme="dark"] #note-panel,
  html[data-theme="night"] #note-toolbar,html[data-theme="night"] #note-panel{background:var(--panel);color:var(--ink);border-color:var(--line)}
  html[data-theme="dark"] #note-panel .np-head,html[data-theme="night"] #note-panel .np-head{background:var(--panel);border-bottom-color:var(--line)}
  html[data-theme="dark"] #note-panel .np-item:hover,html[data-theme="night"] #note-panel .np-item:hover{background:var(--accent-soft)}
  html[data-theme="dark"] #note-toolbar .nt,html[data-theme="night"] #note-toolbar .nt{background:var(--bg);color:var(--ink);border-color:var(--line)}
  html[data-theme="dark"] .sidebar-toggle,html[data-theme="night"] .sidebar-toggle{background:var(--panel);color:var(--accent)}
  html[data-theme="dark"] ::-webkit-scrollbar-thumb,html[data-theme="night"] ::-webkit-scrollbar-thumb{background:#4a4f57}
  html[data-theme="sepia"] .sidebar{background:#faf3e3}

  /* ===================================================================
     趣味主题（与首页 add_home_theme.py 保持一致）：配色 + 纹样 + 装饰
     阅读器变量集：--bg --panel --ink --ink-soft --accent --accent-soft
                   --line --lang-head --zh --en
     =================================================================== */

  /* 动漫 */
  html[data-theme="anime"]{
    --bg:#fdf2f6;--panel:#ffffff;--ink:#3b2c3a;--ink-soft:#6f5266;
    --accent:#e26d9c;--accent-soft:#fbe0ec;--line:#f3d3e0;
    --lang-head:#fbe7f0;--zh:#a83a66;--en:#255f80;
    --rv-radius:18px;
    --rv-pattern:
      radial-gradient(circle at 12% 18%, rgba(255,183,206,.55) 0 6px, transparent 7px),
      radial-gradient(circle at 82% 62%, rgba(170,208,255,.5) 0 5px, transparent 6px),
      radial-gradient(circle at 40% 84%, rgba(255,214,102,.45) 0 4px, transparent 5px),
      radial-gradient(circle at 66% 12%, rgba(255,183,206,.4) 0 4px, transparent 5px);
    --rv-pattern-size:520px 520px,460px 460px,600px 600px,480px 480px;
  }
  /* 像素 */
  html[data-theme="pixel"]{
    --bg:#1a1c2c;--panel:#2b2d42;--ink:#f4f4f4;--ink-soft:#a7acce;
    --accent:#41e0a0;--accent-soft:#22303a;--line:#3b3f5c;
    --lang-head:#222436;--zh:#86f0c2;--en:#8fb6e8;
    --rv-radius:0px;--rv-font:"Courier New",ui-monospace,monospace;
    --rv-pattern:
      linear-gradient(rgba(65,224,160,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(65,224,160,.09) 1px, transparent 1px);
    --rv-pattern-size:22px 22px;color-scheme:dark;
  }
  /* 赛博朋克 */
  html[data-theme="cyber"]{
    --bg:#07070f;--panel:#101024;--ink:#d8e6ff;--ink-soft:#95a2d0;
    --accent:#00e5ff;--accent-soft:#161a3a;--line:#2a2f5c;
    --lang-head:#131634;--zh:#7df3ff;--en:#ff9ce8;
    --rv-radius:6px;--rv-font:ui-monospace,"SFMono-Regular",Menlo,monospace;
    --rv-pattern:
      repeating-linear-gradient(0deg, rgba(0,229,255,.07) 0 1px, transparent 1px 42px),
      repeating-linear-gradient(90deg, rgba(255,0,200,.07) 0 1px, transparent 1px 42px);
    --rv-pattern-size:auto;color-scheme:dark;
  }
  /* 水墨 */
  html[data-theme="ink"]{
    --bg:#f6f3ec;--panel:#fbf9f3;--ink:#20201d;--ink-soft:#57544b;
    --accent:#9c2b25;--accent-soft:#ece5d8;--line:#d8d2c4;
    --lang-head:#efe9dc;--zh:#8a2a22;--en:#3f4a55;
    --rv-radius:4px;--rv-font:"STKaiti","Kaiti SC","KaiTi",serif;
    --rv-pattern:
      radial-gradient(ellipse 55% 38% at 8% 12%, rgba(40,40,40,.07), transparent 70%),
      radial-gradient(ellipse 42% 30% at 92% 82%, rgba(40,40,40,.055), transparent 72%),
      radial-gradient(ellipse 30% 22% at 72% 22%, rgba(156,43,37,.05), transparent 70%);
    --rv-pattern-size:auto;
  }
  /* 森林 */
  html[data-theme="forest"]{
    --bg:#f1f5ee;--panel:#ffffff;--ink:#243024;--ink-soft:#5b6a55;
    --accent:#3f7d4f;--accent-soft:#e0eede;--line:#cfe0cb;
    --lang-head:#e8f2e5;--zh:#2f6a3c;--en:#4a5f7a;
    --rv-radius:14px;--rv-font:"Yuanti SC","PingFang SC",serif;
    --rv-pattern:
      radial-gradient(circle at 20% 30%, rgba(104,160,104,.14) 0 14px, transparent 15px),
      radial-gradient(circle at 70% 70%, rgba(104,160,104,.1) 0 20px, transparent 21px),
      radial-gradient(circle at 88% 18%, rgba(160,140,90,.12) 0 10px, transparent 11px);
    --rv-pattern-size:600px 600px,700px 700px,500px 500px;
  }
  /* 海洋 */
  html[data-theme="ocean"]{
    --bg:#eef6fb;--panel:#ffffff;--ink:#14313f;--ink-soft:#4d7183;
    --accent:#1273a8;--accent-soft:#dcecf6;--line:#c9e0ee;
    --lang-head:#e3f1f9;--zh:#0d5f8a;--en:#2b6a8f;
    --rv-radius:16px;--rv-font:"Yuanti SC","PingFang SC",serif;
    --rv-pattern:
      repeating-radial-gradient(circle at 50% 120%, rgba(18,115,168,.07) 0 2px, transparent 2px 26px);
    --rv-pattern-size:auto;
  }
  /* 复古报纸 */
  html[data-theme="news"]{
    --bg:#f2ede1;--panel:#fbf7ec;--ink:#23211c;--ink-soft:#5c5849;
    --accent:#8c2d22;--accent-soft:#e7e0d1;--line:#cbc3b0;
    --lang-head:#eee8da;--zh:#8c2d22;--en:#3f4a55;
    --rv-radius:2px;--rv-font:"Times New Roman",Georgia,serif;
    --rv-pattern:
      repeating-linear-gradient(90deg, rgba(60,55,40,.05) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(0deg, rgba(60,55,40,.05) 0 1px, transparent 1px 4px);
    --rv-pattern-size:auto;
  }
  /* 糖果 */
  html[data-theme="candy"]{
    --bg:#fff7f0;--panel:#ffffff;--ink:#3d2f3a;--ink-soft:#6f5866;
    --accent:#e85c37;--accent-soft:#ffe6de;--line:#ffd0bf;
    --lang-head:#fff0ea;--zh:#b23a1a;--en:#255f80;
    --rv-radius:20px;--rv-font:"Yuanti SC","PingFang SC",serif;
    --rv-pattern:
      repeating-conic-gradient(from 0deg at 20% 25%, rgba(255,196,102,.16) 0deg 8deg, transparent 8deg 45deg),
      repeating-conic-gradient(from 0deg at 78% 72%, rgba(120,200,255,.14) 0deg 10deg, transparent 10deg 50deg);
    --rv-pattern-size:auto;
  }
  /* 热血漫画 */
  html[data-theme="manga"]{
    --bg:#fbfbfb;--panel:#ffffff;--ink:#111111;--ink-soft:#4a4a4a;
    --accent:#e0a800;--accent-soft:#f5eccd;--line:#d8d8d8;
    --lang-head:#f2f2f2;--zh:#8a5f00;--en:#333333;
    --rv-radius:4px;--rv-font:"Impact","Haettenschweiler","Arial Black",sans-serif;
    --rv-pattern:radial-gradient(circle at 1px 1px, rgba(0,0,0,.16) 1.2px, transparent 0);
    --rv-pattern-size:13px 13px;
  }
  /* 樱花夜 */
  html[data-theme="sakura"]{
    --bg:#1b1430;--panel:#241a3d;--ink:#f0e6ff;--ink-soft:#b3a5d6;
    --accent:#ff9ecb;--accent-soft:#312348;--line:#3a2c58;
    --lang-head:#211838;--zh:#ffb6d5;--en:#b9a7ff;
    --rv-radius:16px;
    --rv-pattern:
      radial-gradient(circle at 16% 22%, rgba(255,158,203,.22) 0 5px, transparent 6px),
      radial-gradient(circle at 68% 58%, rgba(180,160,255,.2) 0 4px, transparent 5px),
      radial-gradient(circle at 42% 82%, rgba(255,158,203,.16) 0 6px, transparent 7px);
    --rv-pattern-size:420px 420px,520px 520px,600px 600px;color-scheme:dark;
  }
  /* 蒸汽波 */
  html[data-theme="vapor"]{
    --bg:#241b4a;--panel:#2e2360;--ink:#f7e9ff;--ink-soft:#c3b3f0;
    --accent:#ff77e1;--accent-soft:#3a2a6b;--line:#453678;
    --lang-head:#2a1f57;--zh:#ffa4ec;--en:#8fd8ff;
    --rv-radius:8px;--rv-font:"Trebuchet MS","PingFang SC",sans-serif;
    --rv-pattern:
      repeating-linear-gradient(0deg, rgba(0,229,255,.13) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(255,119,225,.13) 0 1px, transparent 1px 34px);
    --rv-pattern-size:auto;color-scheme:dark;
  }

  /* --- 侧栏跟随主题面板色（原书硬编码 #fbfaf7，这里统一改为 --panel） --- */
  html[data-theme] .sidebar{background:var(--panel)}

  /* --- 趣味主题：所有暗色系通用覆盖（保持正文可读） --- */
  html[data-theme="pixel"] body,html[data-theme="cyber"] body,
  html[data-theme="sakura"] body,html[data-theme="vapor"] body{background:var(--bg);color:var(--ink)}
  html[data-theme="pixel"] .sidebar,html[data-theme="cyber"] .sidebar,
  html[data-theme="sakura"] .sidebar,html[data-theme="vapor"] .sidebar{background:var(--panel)}
  html[data-theme="pixel"] .sidebar .brand,html[data-theme="cyber"] .sidebar .brand,
  html[data-theme="sakura"] .sidebar .brand,html[data-theme="vapor"] .sidebar .brand{color:var(--ink)}
  html[data-theme="pixel"] .search-box #search-input,html[data-theme="cyber"] .search-box #search-input,
  html[data-theme="sakura"] .search-box #search-input,html[data-theme="vapor"] .search-box #search-input{
    background:var(--bg);color:var(--ink);border-color:var(--line)}
  html[data-theme="pixel"] .search-results,html[data-theme="cyber"] .search-results,
  html[data-theme="sakura"] .search-results,html[data-theme="vapor"] .search-results{
    background:var(--panel);border-color:var(--line)}
  html[data-theme="pixel"] .sr-item:hover,html[data-theme="cyber"] .sr-item:hover,
  html[data-theme="sakura"] .sr-item:hover,html[data-theme="vapor"] .sr-item:hover{background:var(--accent-soft)}
  html[data-theme="pixel"] #note-toolbar,html[data-theme="cyber"] #note-toolbar,
  html[data-theme="sakura"] #note-toolbar,html[data-theme="vapor"] #note-toolbar,
  html[data-theme="pixel"] #note-panel,html[data-theme="cyber"] #note-panel,
  html[data-theme="sakura"] #note-panel,html[data-theme="vapor"] #note-panel{
    background:var(--panel);color:var(--ink);border-color:var(--line)}
  html[data-theme="pixel"] #note-panel .np-item:hover,html[data-theme="cyber"] #note-panel .np-item:hover,
  html[data-theme="sakura"] #note-panel .np-item:hover,html[data-theme="vapor"] #note-panel .np-item:hover{
    background:var(--accent-soft)}
  html[data-theme="pixel"] .sidebar-toggle,html[data-theme="cyber"] .sidebar-toggle,
  html[data-theme="sakura"] .sidebar-toggle,html[data-theme="vapor"] .sidebar-toggle{
    background:var(--panel);color:var(--accent)}
  html[data-theme="pixel"] ::-webkit-scrollbar-thumb,html[data-theme="cyber"] ::-webkit-scrollbar-thumb,
  html[data-theme="sakura"] ::-webkit-scrollbar-thumb,html[data-theme="vapor"] ::-webkit-scrollbar-thumb{
    background:#4a4f57}
  html[data-theme="pixel"] .col.en,html[data-theme="cyber"] .col.en,
  html[data-theme="sakura"] .col.en,html[data-theme="vapor"] .col.en{color:var(--ink)}

  /* --- 趣味主题：纹样背景层（固定在正文之后） --- */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:var(--rv-pattern,none);background-size:var(--rv-pattern-size,auto);
    opacity:.95;
  }
  /* 保证正文在纹样之上 */
  .app,.sidebar,.main,.article{position:relative;z-index:1}

  /* --- 趣味主题：装饰（圆角 / 字体族 / 阴影） --- */
  html[data-theme="anime"] .sidebar,html[data-theme="forest"] .sidebar,
  html[data-theme="ocean"] .sidebar,html[data-theme="candy"] .sidebar,
  html[data-theme="sakura"] .sidebar{box-shadow:inset -1px 0 0 var(--line)}
  html[data-theme="pixel"] body{font-family:"Courier New",ui-monospace,monospace}
  html[data-theme="ink"] .chapter-title,html[data-theme="ink"] .p.title{letter-spacing:3px}
  html[data-theme="news"] .chapter-title{letter-spacing:1px;text-transform:uppercase}
  html[data-theme="manga"] .hlmark,html[data-theme="manga"] .senthl{box-shadow:0 0 0 1px #111}
  html[data-theme="cyber"] .chapter-title{text-shadow:0 0 10px rgba(0,229,255,.55),0 0 20px rgba(255,0,200,.35)}
  html[data-theme="cyber"] .reader-settings-btn{background:var(--accent);color:#07070f;border-color:var(--accent);
    box-shadow:0 0 14px rgba(0,229,255,.6)}
  html[data-theme="pixel"] .reader-settings-btn,html[data-theme="pixel"] .reader-settings .rs-opt,
  html[data-theme="pixel"] .reader-settings .rs-sw{border-radius:0}
  html[data-theme="pixel"] .reader-settings-btn{box-shadow:3px 3px 0 #0f1020}
  html[data-theme="manga"] .reader-settings-btn{box-shadow:3px 3px 0 #111}

  /* --- 字体族切换：--reader-font 由 JS 设置 --- */
  body{font-family:var(--reader-font, "Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,serif)}
  .chapter-title,.chapter-sub,#note-panel,.makenote,.toc-item,.search-box{font-family:var(--reader-font, inherit)}
  /* EN 栏保留衬线，但跟随所选字体族（楷/黑体时也统一） */
  body[data-font="sans"] .col.en{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}

  /* --- 字号：--reader-scale 缩放两栏正文 --- */
  .col{font-size:calc(17px * var(--reader-scale,1))}
  .col.en{font-size:calc(16.5px * var(--reader-scale,1))}
  .col.en .p{font-family:inherit}
  .chapter-title{font-size:calc(28px * var(--reader-scale,1))}
  .chapter-sub{font-size:calc(16px * var(--reader-scale,1))}
  .p.title{font-size:calc(22px * var(--reader-scale,1))}
  .note{font-size:calc(15px * var(--reader-scale,1))}

  /* --- 目录当前章节：强化高亮 --- */
  .toc-item.active{background:var(--accent-soft)!important;border-left-color:var(--accent)!important;
    color:var(--accent);font-weight:700}

  /* --- 设置面板（齿轮） --- */
  .reader-settings-btn{
    position:fixed;z-index:9991;bottom:22px;left:22px;
    width:auto;padding:10px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--accent);cursor:pointer;font-family:inherit;
    font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.18);
  }
  .reader-settings-btn:hover{filter:brightness(1.06)}
  .reader-settings{
    position:fixed;z-index:10002;bottom:70px;left:22px;width:340px;
    max-height:78vh;overflow:auto;
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.28);
    padding:14px 16px 16px;display:none;font-family:var(--reader-font,inherit);font-size:13px;
  }
  .reader-settings.open{display:block}
  .reader-settings h4{margin:0 0 10px;font-size:13px;letter-spacing:1px;color:var(--accent);
    text-transform:uppercase}
  .reader-settings .rs-row{margin-bottom:14px}
  .reader-settings .rs-row:last-child{margin-bottom:0}
  .reader-settings .rs-label{font-size:11px;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.5px}
  .reader-settings .rs-opts{display:flex;flex-wrap:wrap;gap:6px}
  .reader-settings .rs-opt{
    padding:5px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer;
    background:var(--bg);color:var(--ink);font-size:12.5px;font-family:inherit;line-height:1.2;
  }
  .reader-settings .rs-opt:hover{border-color:var(--accent)}
  .reader-settings .rs-opt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .reader-settings .rs-swatches{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:15px}
  .reader-settings .rs-sw{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);
    cursor:pointer;position:relative;overflow:hidden}
  .reader-settings .rs-sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .reader-settings .rs-sw span{position:absolute;bottom:-15px;left:-4px;right:-4px;text-align:center;
    font-size:10px;color:var(--ink-soft);white-space:nowrap}
  .reader-settings .rs-sw .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:16px;line-height:1}

  /* --- 当前章节 HUD（侧栏折叠时出现）：紧凑、自动隐去、不遮挡 --- */
  .chapter-hud{
    position:fixed;z-index:9992;top:10px;right:14px;transform:translateY(-10px);
    max-width:min(60vw,420px);
    background:color-mix(in srgb, var(--panel) 82%, transparent);
    -webkit-backdrop-filter:saturate(1.2) blur(6px);backdrop-filter:saturate(1.2) blur(6px);
    color:var(--ink-soft);border:1px solid var(--line);
    border-radius:999px;padding:3px 12px;font-size:12px;line-height:1.5;
    font-family:var(--reader-font,inherit);
    box-shadow:0 3px 12px rgba(0,0,0,.10);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chapter-hud .ch-hud-tag{color:var(--accent);font-weight:600;flex:none;opacity:.85}
  .chapter-hud .ch-hud-name{overflow:hidden;text-overflow:ellipsis;max-width:42vw}
  /* 仅在侧栏折叠时可见/可交互 */
  .app.sidebar-collapsed ~ .chapter-hud{pointer-events:auto}
  .app.sidebar-collapsed ~ .chapter-hud.ch-hud-show{opacity:1;transform:translateY(0)}
  .chapter-hud:hover{opacity:1!important;color:var(--ink);border-color:var(--accent)}

  /* 手机端：设置按钮与 HUD 适配 */
  @media (max-width:900px){
    .reader-settings-btn{bottom:14px;left:14px;padding:8px 12px;font-size:12px}
    .reader-settings{left:10px;right:10px;width:auto;bottom:58px}
    .chapter-hud{top:8px;right:10px;bottom:auto;max-width:calc(100vw - 100px);font-size:11px;padding:3px 10px}
    .chapter-hud .ch-hud-name{max-width:52vw}
  }

  /* ===== 脚注悬浮提示 (FOOTNOTE-TOOLTIP) ===== */
  .fnmark{cursor:help;color:var(--accent);font-weight:600;padding:0 1px}
  .fnmark:hover{text-decoration:underline;text-underline-offset:2px}
  #fn-tip{
    position:fixed;z-index:10060;max-width:min(440px,82vw);
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.28);
    padding:10px 13px;font-size:13px;line-height:1.65;
    font-family:var(--reader-font,inherit);
    display:none;pointer-events:none;
  }
  #fn-tip.on{display:block}
  #fn-tip .fn-tip-num{font-size:11px;color:var(--accent);font-weight:700;
    letter-spacing:.6px;margin-bottom:5px}
  #fn-tip .fn-tip-body{max-height:42vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
  #fn-tip .fn-tip-alt{color:var(--ink-soft,#8a8a8a);font-style:italic}

/* ==== MONOLINGUAL (zh-only) ==== */
.main{display:flex !important;flex-direction:column !important;overflow:hidden}
.col.zh{display:none !important}
.col.en{flex:1 1 auto;min-height:0;height:100%;overflow-y:auto;border-right:none !important;max-width:840px;width:100%;margin:0 auto;box-sizing:border-box}
.col.en .col-head{display:none !important}
.p.table{margin:1.2em 0;text-align:center}
.p.table img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px}
</style>
</head>

<!-- ======= SIDEBAR / TOC ======= -->

/* ============ BOOK DATA (injected by build) ============ */
const EN = /*__EN__*/[{"id": "intro", "title": "緒章", "paras": [{"type": "title", "text": "表目次"}, {"type": "text", "text": "表4-1：中美直接往來貿易對照表，1864-1928 153 表4-2：旅華各國人民與行號統計表，1912-1922 155 表4-3：1921年美國對華出口貨品與價值 181 表4-4：據《美國對華貿易法案》而成立的美商公司（上海）及其營業項目，1928年 186 表5-1：1927年「中國美國商會」董事名單 224 表6-1：1922年出席「中美工程師協會」年會之重要名單 262 表7-1：大來公司青島分行木材交貨量和市場占有率，1932-1940 312 表7-2：各國輪船公司由青島至美國及加拿大載貨量比率，1936-1938 316 表7-3：英美煙公司及代理商頤中公司之卷煙裝運數（支），1939-1940 327 表8-1：日本在山東的煤油進口量和市場占有率，1936-1939 350 表8-2：日本石油產品在青島的進口量及市場占有率，1938-1939 351 表8-3：非占領區中國的石油裝運量輸入表（Petroleum Shipments into Unoccupied China），1940-1941 369 表8-4：國民政府統治區石油產品增長狀況 379"}, {"type": "text", "text": "緒章"}, {"type": "text", "text": "托辣斯實20世紀之驕兒，必非以人力所能摧沮，此今世稍有識者所周知也。自今以往且由國內托辣斯進為國際托辣斯，而受害最劇者必在我中國，然則我輩不能以對岸火災視此問題也明矣。"}, {"type": "text", "text": "——梁啟超，1903"}, {"type": "text", "text": "一、研究源起"}, {"type": "text", "text": "1825年橫跨紐約州北部，長達365英里的伊利運河完工，使五大湖和紐約市之間的貨物運輸暢通無阻，運河沿岸的重要城市應運而生。當時紐約州長德懷特·克林頓（DeWitt Clinton）預言說，這條運河將使紐約市成為「世界的糧倉、商業世界的中心、製造業的場所、重要金融運行的焦點」。懷特·克林頓的預言在不到一百年的時間果然實現，到了1890年代紐約成為美國托辣斯（Trust）集團和大企業的中心。不惟如此，一次大戰前後，美國大型管理一體化的企業通過大規模生產和分銷系統，向世界市場銷售標準化與品牌化的商品，使美國大企業在全球競爭中獨樹一幟。1920年代的紐約早已是全球金融和工商業中心，以至於1929年華爾街股市震盪，造成全球經濟大恐慌效應 $^{1}$ 。"}, {"type": "text", "text": "20世紀之初，梁啟超赴新大陸旅行。1903年4月，在紐約目睹華爾街大資本家掌控托辣斯之盛況，梁啟超稱「此怪物者產於紐約，而其勢力及於全美國且駕駸乎及於全世界」，使美國之資本在托辣斯支配下十之占八，且使美國成為世界第一之資本國，初識資本主義市場的梁啟超頗表「嘻！豈不異哉，豈不偉哉！」 $^{2}$ 但梁啟超更焦慮的是美國托辣斯可望演進成國際托辣斯；果如此，中國廣大市場將受其禍害，中國人絕對不能有隔岸觀火的僥倖心態。美國大企業在一次大戰後大舉向全球擴展，它對中國市場的經濟活動以及由此而產生的中美經濟貿易的逆差和改變，確是前所未有的。然而，美國大企業對中國經濟發展的衝擊，其結果未必如梁啟超所言將由托辣斯集團引爆禍患慘劇，但梁啟超可能是中國最早實地考察美國華爾街，受邀為紐約商業鉅子座上賓，並為文呼籲中國不能不予以重視托辣斯的知識分子。本書研究關懷的起點，莫不是梁任公遊記中的大哉問，但作為嚴謹的學術著作，本書所致意關切者，則更須從歷史脈絡，上下而求索。"}, {"type": "text", "text": "美國因受益於第二次工業革命之惠，在技術研發不斷創新的基礎上，以及美國大企業所創建的官僚化企業管理組織、管理單位的專業化、高效率和薪資差距等特色，使得美國大企業得以向全球輸出，成為全球最早擁有最多跨國企業的國家，跨國企業是美國成為世界政治經濟霸主並向全球輸出的最大特色之一。美國跨國企業向海外擴張的歷史，以及伴隨著美國跨國企業的入侵而帶動的全球商品同質化（homogenization）或美國化（Americanization）的過程，早為諸多經濟史大家所討論，近年來也有不少學者認為美國跨國企業事實上並未帶來全球化，同時美國化是一種建構的概念，世界並未美國化，也未全球化 $^{3}$ 。然而，英文學界迄今的研究成果中，極少留意到跨國企業或大企業在近代中國的發展；如有，也多屬全球化議題的宏觀論述而非具體對近代中國的實證研究。當今中美兩國作為世界最重要的兩大經濟實體國家，它們在中國本土的最初相遇以及在全球化網絡意義下的中美交會，是帶領筆者一步步追蹤和探索此一題旨的研究動力。"}, {"type": "text", "text": "1 相關研究可參見：Stanely Buder, Capitalizing on Change: A Social History of American Business (Chapel Hill: University of North Carolina Press, 2009)."}, {"type": "text", "text": "2 梁啟超，《新大陸遊記》（台北：文海，1967年版），頁13-19，詳細介紹美國托辣斯的歷史濫觴起於1882年石油大王洛克菲勒（原書稱：洛奇佛拉）開創，接著有棉花、蒸餅、製糖等托辣斯，甚至縷列了美國1899年以後設立的托辣斯資本表。提到托辣斯在美國被視為怪物妖魔，美國政府立法禁止托辣斯之舉措，又言美國「政府務所以摧抑掃除，殆與現時中國政府之謀摧新黨者（指：維新派）無以異」，頁18。"}, {"type": "text", "text": "3 這方面英文專書的代表著作，如：Alfred D. Chandler Jr., The Visible Hand: The Managerial Revolution in American Business (The Belknap Press of Harvard University Press, 1977); Alfred D. Chandler Jr. and Bruce Mazlish, eds., Leviathans: Multinational Corporations and the New Global History (Cambridge: Cambridge University Press, 2005). 中文學界的代表著作可參考：王立新，《躊躇的帝國：美國崛起後的身分困惑與秩序追求，1913-1945》（北京：中國社會科學出版社，2015年）。"}, {"type": "text", "text": "2012年筆者所著《美國大企業與近代中國的國際化》出版之際，這本書已悄然蘊釀。而且立意要有不同的視野來完成中國邁向國際化的續篇，現在這本書已經呈現在讀者面前，距離前本書已有七年的時間了。事實上我對「企業、技術與關係網」的關注和相關論文的撰述則早已超過十年。本文一些章節由於無法融入前本書的架構而必須割捨，但也因為這樣的割捨使得自己的研究必須持續往前推進。近代中美之間的發展有種特殊關係（special relationships）或美國人相較於其他歐洲和日本國家可謂一種改良的帝國主義者（ameliorative imperialist），此一想法韓德（Michael Hunt）等學者早已提出一些精闢的學術論述，筆者不能掠人之美。在學術大家輩出的中美關係史研究的基礎上，筆者嘗試從多元原始材料找出別具意義的研究主題和不同的研究路徑。前本書《美國大企業與近代中國的國際化》，著重於清末到1920年代中美兩國商務關係的建立和各種投資類型（跨國大企業的實業投資、國際大財團鐵路開發、人道主義工程投資、跨世紀的無線電業工程及南方大港等等）。這本書則是聚焦於美國人如何改變中國及其相關網絡的連結。如何在中國的廣大市場獲得更大的利益，固然為驅使美國大企業前來的動力，但大企業帶來商品、技術、管理方式、組織變革等等衝激；伴隨著大企業前進的各種關係網絡——政治、經濟、文化和技術等層面所交織的改變效應，我們看到美國人對近代中國確實有種「改變中國」的夢想。本書探討的時間上限，在美國一方為南北戰爭之後，美國開展國家大重建計畫（Reconstruction），並探索美國在國際秩序中的初定位；在中國則為清末以來的自強運動，在「以夷制夷」的國家治理概念下，開展地對待「米夷」（美國）關係。下限則為太平洋戰爭結束後，美國崛起為世界經濟和政治霸主，有意在戰後新條約和美國主導的新國際秩序架構下，貫徹其對自由市場的主張和理念。簡而言之，本書探討1870年代以來美國人打開中國市場，並歷經第一次和第二次世界大戰，美國大企業及其關係網在中國的遭逢、美國人如何改變中國的夢想，以及中國人如何通過中美兩國的合作和交往案例，走向近代中國的國際化之夢 $^{4}$ 。"}, {"type": "text", "text": "近十年來國際史的研究更加勃興，特別是以跨國和全球視角的經濟史著作不停推陳出新，有些著作容或觀點是新穎，但沒有扎實的文獻和材料為基礎，徒託空言，並非歷史學者的職志。本書的撰述過程中儘可能網羅多元材料，立論於史料基礎，同時希望將中美關係放置於一個更大的國際交往範疇，希望通過逐一個案的具象考察，將研究視角放入近代中美交往中的企業、技術活動和國家治理的意義。因此，本書緒章中先概述近二十餘年來關於跨國史和國際史的研究趨勢，以及此一研究取徑對中美關係史研究上的突破口，接著介紹本書研究架構的安排，以使讀者清楚理解本書撰寫之旨趣。"}, {"type": "text", "text": "4 關於近代中國的國際化相關論述，尚可參考徐國琦的三本代表作。Xu Guoqi, China and the Great War: China's Pursuit of a New National Identity and Internationalization (Cambridge, UK and New York: Cambridge University Press, 2005) Xu Guoqi, Olympic Dreams: China and Sports, 1895-2008 (Cambridge, MA: Harvard University Press, 2008), Xu Guoqi, Strangers on the Western Front: Chinese Workers in the Great War (Cambridge, MA: Harvard University Press, 2011)."}, {"type": "text", "text": "二、從跨國史和國際史視野研究近代中美關係"}, {"type": "text", "text": "1990年代以後歐美歷史學界興起了一股全球史（Global History）風潮，在關注如何書寫「全球時代的世界史」（World History in Global Ages）之際，一種強調跨越民族國家邊界的跨國史（Transnational History）研究視角也因應而生，許多研究著作將「全球史」和「跨國史」兩者聯繫起來 $^{5}$ 。跨國史是一種研究取徑，在地的（local）、國家的、帝國的和世界的歷史不僅是地緣政治上的相互影響，並且是一種跨越國境的聯繫網絡；探求不同國家和社會相互連接的紐帶，包括跨國網路、生產和貿易、制度、思想和過程等等，都是跨國史研究的範疇。近十年來跨國史研究聲勢在歐美頂尖學者的領軍之下，有不少令人矚目的學術成果，可說是史學界繼「文化轉向」（cultural turn）的研究後，新一波的「跨國轉向」（transnational turn）研究，對於當前史學觀念、史學方法和歷史知識的產生有重大影響 $^{6}$ 。"}, {"type": "text", "text": "近二十餘年來，也有愈來愈多的外交史學者呼籲學界擴大研究視野，以國際史（international history）取代傳統外交史的研究典範逐漸勝出。長期任教哈佛大學、學術聲望卓譽的外交史學者梅野（Ernest R. May, 1928-2009），早在1971年就提出「外交史的衰落」（The Decline of Diplomatic History），呼籲外交史同行要擴大研究的視野，否則該領域有「瀕臨消失」的危機 $^{7}$ 。美國外交史學界對於外交史研究的何去何從，近年來歷經不斷的辯論和反思，最大的變革關鍵便是跳出傳統外交史的框架，改變美國外交史為國際史，打破以美國為軸心的研究方法。一些外交史學家同時也意識到傳統政治外交史過度重視政府角色、軍事和外交談判，而忽略文化、經濟、科技、媒界、信息等重要因素。入江昭（Akira Iriye）在1989年美國歷史學會（American Historical Association）主席就職演說〈國際史〉（“The internationalization of History”）中，指出國際史是一種全方位的歷史研究法，它拓展了傳統國際關係史一味強調政府之間的交涉和談判，將非政府層次的跨國交往也引入考察之列，並以整個國際體系作為參照，強調國家間的政治、文化等多重交流、對話及互動 $^{8}$ 。"}, {"type": "text", "text": "5 詳見Akira Iriye and Rana Mitter, eds., Palgrave Macmillan Transnational Series, 2007-2017. Journal of International & Global Studies, http://www.lindenwood.edu/jigs/about.cfm（下載日期：2017年4月15日）。Akira Iriye, Global and Transnational History: The Past, Present and Future (Basingstoke: Palgrave Macmillan, 2013). 中文著作中，針對全球史的研究趨勢，特別是新文化史到全球史的文化轉向，詳見：蔣竹山，《當代史學研究的趨勢、方法與實踐——從新文化史到全球史》（台北：五南圖書出版股份有限公司，2012），該書以物質文化、商品、飲食、醫學、環境和知識傳播等議題為主的分析。蔣竹山，《超越民族國家的歷史書寫：試論近來全球史研究中的「空間轉向」》，《新史學》，第23卷第3期（2012年9月），頁199-228。蔣竹山編，《當代歷史學新趨勢》（台北：聯經出版公司，2019）收錄的相關論文。"}, {"type": "text", "text": "4-23。吳翎君，〈英文學界關於「跨國史」研究新趨勢與跨國企業研究〉，《新史學》，第28卷第3期（2017年9月），頁207-240。該文回顧了目前跨國史的代表著作，大抵以19世紀中葉所謂近代民族國家建立的時期為開始，而且許多富有創意的研究議題係來自經濟史和政治史學者不斷拓展學術邊界的對話合作。"}, {"type": "text", "text": "6 關於跨國史研究趨勢，已有不少專文討論，本文不擬詳述。詳見王立新，《跨國史興起與20世紀世界史的重新書寫》，《世界歷史》，2016年第2期，頁"}, {"type": "text", "text": "7 Erest R. May, \"The Decline of Diplomatic History,\" in George A. Billias and Gerald N. Grob eds., American History: Retrospect and Prospect (New York: Free Press, 1971), pp. 339-430."}, {"type": "text", "text": "8 Akira Iriye, \"The Internationalization of History,\" The American Historical Review 94, no. 1 (1989), p. 4."}, {"type": "text", "text": "入江昭作為第二次世界大戰以後研究國際關係史的一代大師，早期從地緣政治和華盛頓體系（Washington System）的建立探討美國在東亞的崛起及太平洋戰爭的起源，由此奠定在美國國際關係史的學術地位 $^{9}$ 。到了1990年代他開始大力倡議國際史的研究旨趣，呼籲拓展傳統外交史的研究視野，將國家與非國家行為者的跨國交往領域都納入國際史範疇，可謂近三十年來領導國際史研究最具代表的人物 $^{10}$ 。然而，入江昭近年來在其編撰的著作中轉而使用「跨國史」一詞（並非否定「國際史」一詞的內涵，而是「跨國史」一詞所具有的包容範疇，更在國際史之上，詳下）。在他看來，當前全球化時代中各個國家和社會人群無可避免地捲入各種紐帶關係和連鎖效應，跨國史的書寫視角將有助於因應全球化時代中人類共有的過去，從歷史理解現在，並走向未來。他強調跨國經驗的共有與交流是人類歷史的重要資產，特別是過去較忽略的人權、文化、情感、環境、疾病控制和經濟資源等議題，有必要以跨國史視野重新書寫，而多元身分的知識視野將有助於未來世界秩序的和諧 $^{11}$ 。"}, {"type": "text", "text": "2013年，入江昭出版《全球與跨國史：過去、現在與未來》(Global and Transnational History: The Past, Present and Future)一書，大力推崇使用「跨國史」一詞，在研究視角上更加自由揮灑；該書回顧他自己從國際關係史、國際史到跨國史研究，在研究方法上不斷推進的反省。他提到國際史和跨國史作為一種研究方法，兩者確是有相通旨趣，但跨國史研究具有超越民族國家（beyond national state）的更大視角，比起國際史視角具有國家之間（inter-nation）的特性略有不同。儘管「國際史」將政府與非政府、個人和群體都納入國際交往的範疇，但它仍有以國家作為國際社會的實體和國家邊界的概念／精神所局限。「跨國」（trans-national），則帶有「穿越和超越民族國家」（across and beyond national state）的意味，它不以民族國家為中心（nation-centered）的概念，且不意味著「去國家化」（denationalization） $^{12}$ 。同時，入江昭認為「跨國史」豐富了我們對於國家歷史（national history）和國際史的理解，全球史和跨國史研究觀點也對當代的歷史研究帶來了全新視角。因此，從這角度而言，他認為1990年代以來經歷了一場「史學改造」（historiographical transformation）"}, {"type": "text", "text": "9 關於入江昭的治學，可參見：入江昭著，楊博雅譯，《我與歷史有個約會：入江昭治史心得》（北京：北京大學出版社，2013）。劉克倫、石之瑜，《入江昭對世界與中國的中間主義立場——一種多元身分的知識視野》（台北：國立台灣大學政治學系中國大陸暨兩岸關係教學與研究中心，2010）。入江昭早期關於美國與東亞關係的代表著作有：After Imperialism: The Search for a New Order in the Far East, 1921-1931、Across the Pacific: An Inner History of American-East Asian Relations、Pacific Estrangement: Japanese and American Expansion, 1897-1911。入江昭從遠東各國的多角視野，例如美、日、蘇和中國的交叉視角闡釋遠東關係，展現他對冷戰中期國際秩序低盪緩解的現實關注。"}, {"type": "text", "text": "11 Akira Iriye, Global and Transnational History, pp. 9-12."}, {"type": "text", "text": "10 關於國際史研究方法和範列，筆者曾有專文討論，本文不贅。詳見：吳翎君，〈從徐國琦新著 Strangers on the Western Front: Chinese Workers in the Great War 談國際史的研究方法，《新史學》，第22卷第4期（2011年12月），頁183-215。王立新，〈試析全球化背景下美國外交史研究的國際化與文化轉向〉，《美國研究》，第1期，2008。"}, {"type": "text", "text": "12 在 Global and Transnational History 一書第三章，入江昭列舉他個人認為可作為全球史與跨國史的顯著案例，及其如何重塑我們對過去歷史的理解，討論的議題包括環境、不同族群和文化的碰撞、移民、人權、經濟和文化的全球化、地緣政治現象中的文化維度（例如戰爭、區域社群、非政府組織等議題）。Akira Iriye, Global and Transnational History, ch. 3, pp. 36-68."}, {"type": "text", "text": "的歷程 $^{13}$ 。"}, {"type": "text", "text": "跨國史和國際史視角不僅可以運用於多邊國家和區域之間，也適用於兩國關係。入江昭在倡導國際史的同時，也以中日兩國在國際社會的互動角色考察近代以來的中日關係。他將1989年在「賴世和講座」（The Edwin O. Reischauer Lectures）的系列演講彙整為《全球視域下的中國與日本》（China and Japan in the Global Setting），可說是開啟國際史研究應用於中日關係的範例。他從「實力、文化和經濟」（Power, Culture and Economic）三個議題論述全球化脈絡下中日關係發展的三個階段：第一階段為1880年代到一戰的國際競爭下，中日兩國在軍備軍力和戰略上的競爭；第二階段為一戰到二戰期間中日兩國同受1920年代文化思潮與國際主義（internationalism）的震撼影響。基於一次大戰對人類文明帶來的巨大破壞，戰後中日藝文交流相當緊密，且日本政界不乏有人提出中日互存共榮的主張，反對用武力達到國家目的。他認為如果文化國際主義和經濟力在1930年代持續繁榮，可能就不會發生遠東危機。第三階段為冷戰迄今，經濟的角色日益重要。探討中日兩國在全球化影響下的經濟、貿易、投資和移民問題，最後強調中日兩國的未來和平將繫於兩國在文化上的互相依賴（cultural interdependence）和相互理解 $^{14}$ 。這本書儘管只有一百餘頁，但備受學術界肯定。該書從全球視域中探尋近代中日兩國在「實力、文化和經濟」的跨領域對話，使筆者在構思本書架構的三大區塊時深受啟發，特別是入江昭所詮釋的1920年代以後華盛頓會議所打造的國際合作體系的瓦解、日本對東亞和平角色的責任，以及經濟活動和文化國際組織究竟應扮演怎樣的和平力量等研究議題的開展。"}, {"type": "text", "text": "入江昭的弟子徐國琦在2014年9月於哈佛大學出版社出版了《中國人與美國人：一個共有的歷史》（Chinese and Americans: A Shared History）。徐國琦於〈緒論〉闡述該書要旨：「共有的歷史」可以是個人或群體分享同一段歷史事件的經歷，共有的歷史包含正面與負面的所有經歷，和平或衝突、合作或對抗、互惠或戰鬥等內涵；過去中美關係史的研究側重中美間的衝突、對抗與分歧，他則以個人或群體作為調和中美政治與文化關係的信使，探討跨越國境的文化理解和合作，並陳述中美不同文化脈絡下的共同願望和協力行動。不同者在於入江昭以文化國際主義作為實踐和平世界的方法，以宏觀論述見長，而徐國琦則將國際史的文化轉向用於中美關係，從具體微觀的個案來詮釋中美共享的歷史旅程。徐著以「共有的歷史」詮釋中美關係，對半個世紀以來中美關係史的研究可謂另闢學術蹊徑。筆者曾為文討論美國外交史學界有關中美關係史的研究轉向，並介紹徐著書如何將具體個案置於宏觀的國際史和中美關係史視野，以此闡述「共有的歷史」的研究取徑及其意義 $^{15}$ 。中美關係史的發展是一部中美共有的歷程，不僅是文化議題，其他包括經濟、商業、技術的交流，甚至傳統政治外交的議題，都可藉由「共有的歷史」研究取徑，鋪陳故事新說。"}, {"type": "text", "text": "13 Akira Iriye, Global and Transnational History, pp. 16-17."}, {"type": "text", "text": "14 Akira Iriye, China and Japan in the Global Setting (Cambridge, MA: Harvard University Press, 1992)."}, {"type": "text", "text": "15 筆者認為從冷戰時代初期費正清（John K. Fairbank, 1907-1991）《美國與中國》（The United States and China, 1948），到1971年孔華潤（Warren I. Cohen）《美國對中國的反應》（America's Response to China），在其交錯與接替的中美關係史論述中，費正清以「中國回應美國」，到孔華潤提出的「美國回應中國」，後續尚有柯文（Paul A. Cohen）論述「在中國發現歷史」（Discovering History in China）、柯偉林（William C. Kirby）闡釋「中國的國際化」，均致意於扭轉美國學界側重某一研究取徑的自我批判。姑不論徐國"}, {"type": "text", "text": "三、中國與美國——企業、技術與關係網"}, {"type": "text", "text": "美國研究國際關係的學者中，有一派特別強調經濟因素。這一派學者強調19世紀末以後美國的經濟擴張和金元外交是美國成為世界霸主的重要動力，特別是1960年代，美國學界在批判越戰聲浪中具代表意義的新左派學者強調經濟利益的解釋，認為美國外交完全以經濟利益的擴張為依歸，並受到大資本家的左右 $^{16}$ 。經濟史領域中也有一批學者留意到政治因素的重要性，將國家和權力的重要性放入特定研究的個案。儘管經濟史學者和國際關係史學者在研究方法和研究關懷上各有側重，但兩者向來重視檔案實證和多元材料，在這一波歷史研究的全球化轉向中，有關跨國企業、技術擴張、跨國聯繫及其全球化網絡的研究成果中，經濟史學者和國際史學者在共通議題上互相發明，為跨國史研究注入新"}, {"type": "text", "text": "視域 $^{17}$ 。"}, {"type": "text", "text": "經濟史大家劉廣京早於1963年撰述的《美國人與中國人——歷史文獻目錄》（American and Chinese: A Historical Essay and A Bibliography），這本小書現已罕為人知，劉廣京是經濟史大家，這本小書是極重要的一本從跨領域研讀中美關係史的參考書。該書的前半段有40頁專文，闡釋重新評價美中關係的歷史研究必須聚焦於更廣義的美國人（individual）和組織（organizations）在中國的活動，提到貿易、傳教士，科學家、教師、商人企業、職業社團、學校、醫院、學術和慈善基金會，他提到這些個人或群體比起美國政府的直接活動來得更具影響力，強調非政府範疇和性質中的美中關係研究之必要。劉廣京對於西方技術產品（鐵路、電報、輪船）、西方企業制度及其與中國傳統商會和制度之開創研究，特別是他的《英美航運勢力在中國的競爭，1862-1874》一書 $^{18}$ ，迄今仍是探討跨國企業在中國的活動的極具分量的學術專論。"}, {"type": "text", "text": "高家龍（Sherman Cochran）著《大公司與關係網》（Encountering Chinese Networks） $^{19}$ 使用了「中國關係網」（Chinese Networks）一詞，中文版譯成「關係網」。高家龍的專書選擇了英、美、日本與中國共六家著名的代表企業，分析19世紀後期至"}, {"type": "text", "text": "琦新著選擇的個案或解釋觀點是否具有說服力，「共有的歷史」企圖挑戰半世紀以來中美關係史研究視野的企圖心昭然可揭。詳見：吳翎君，〈從徐國琦 Chinese and Americans: A Shared History 談美國學界對中美關係史研究的新取徑〉，《台大歷史學報》，55期（2015年6月），頁219-249。"}, {"type": "text", "text": "16 新左派健將拉費伯爾（Walter LaFeber）著有 The New Empire: An Interpretation of American Expansion, 1860-1898。1960 年代越戰升高後新左派史家勢力大增，反省美國外交政策成為主流，其中以 William A. Williams, The Tragedy of American Diplomacy 和 Denna F. Fleming, The Cold War and Its Origins, 1917-1960。兩書為嚆矢。"}, {"type": "text", "text": "17 更深入的討論，詳見：吳翎君，《英文學界關於「跨國史」研究新趨勢與跨國企業研究》，《新史學》，第28卷第3期（2017年9月），頁207-240。"}, {"type": "text", "text": "18 Kwang-Ching Liu, Anglo-American Steamship Rivalry in China, 1862-1874 (Cambridge, Mass.: Harvard University Press, 1962)."}, {"type": "text", "text": "19 Sherman Cochran, Encountering Chinese Networks: Western, Japanese and Chinese Corporations in China, 1880-1937 (CA: University of California Press, 2000)."}, {"type": "text", "text": "20世紀前期西方、日本和中國大公司在中國市場遭遇「關係網」的經歷。本書雖用了「關係網」一詞，但筆者所指涉的關係網並非專指中國本土關係網，而是指涉中美兩國交往中的多層次關係網絡，比較接近國際史研究所指涉的多層次交往及其與近代世界體系的形構紐帶。本書更多借鏡的想法來自羅生寶（Emily S. Rosenberg）的研究，例如：Financial Missionaries to the World: the Politics and Culture of Dollar Diplomacy, 1900-1930。雖然這本書提到中國的部分少之又少，該書主要從美國的角色看待美國金元外交中的政治和文化。之後羅生寶編撰的《世界聯繫》（World Connection）專書以國際史和跨國史研究視野重新探討1870年迄於二次世界大戰的全球政治和經濟網絡。羅氏撰述的長論“Transnational Currents in a Shrinking World”（2014年以專書出版），宏觀第一次世界大戰後文化國際主義（Cultural Internationalism）的發展（不僅是國際聯盟，包括各種藝術、文化和體育活動成為全球普世文化的重要指標）、社會網絡及其聯繫、各種展示和博覽會、專家網絡（科學家、工程家和測量家等專家的全球移動）、世界都會化等趨勢現象，使世界的板塊變得愈來愈小 $^{20}$ 。"}, {"type": "text", "text": "國際史學者和經濟史學者同樣著重多元資料和國際體系的宏觀論述，在這一波史學全球化的學術轉向中，打破單一學科互相借鑑，對形塑當前全球網絡的共同議題上有更多的交流和對話。上述提到的英文學界對全球史和跨國史的豐富研究成果對於我們研究19世紀後半葉第二波工業革命發生以後全球企業移動、技術躍升及其關係網絡的全球大交流提供了一個宏觀背景。然而，這些著作鮮少是以19世紀後半以來的近代中國作為主體，並將實證研究納入國際史／跨國史研究視角的學術著作。此外，對於企業史的研究長期受到學者的重視，迄今已有不少優秀的成果，但主要仍集中於華資企業或中國商會史的研究 $^{21}$ 。將跨國企業、技術引進及其產生的內外效應，打破政治史和經濟史的研究藩籬，統整納入中國內部與國際交往的視野中的研究，迄今研究成果相對是不足的 $^{22}$ 。"}, {"type": "text", "text": "本書主軸分為以下三大主線："}, {"type": "text", "text": "第一部分，企業活動、國家治理與中美關係。這部分聚焦於19世紀到一次大戰期間，中國所開展的自強運動的兩個代表事業——江南機器製造局和輪船招商局，它們與美國政府與大企業間的交往，探討清政府在國家治理的內政外交與美國方面的聯結。此外，探討清末開眼看世界過程中的知識產權問題。美國人特別重視知識產權的權益有其立國文化的背景。涉外版權之爭，在中國而言，主要關係西方知識和教育文化的傳布問題，而非保護洋人智慧財產權的命題，中西雙方認知大有差異。中國從國內法、國際公約和雙邊條約的規範上均取得自由譯印西書的權利，不必受美國約束，且在華洋公廨會審中屢獲勝訴，此為清末民初外交上極少有的現象。此一版權交涉過程，儘管對美國是挫敗的歷程，卻是中國認識西方知識產權和國際版權功能的一個開始。"}, {"type": "text", "text": "21 關於華資企業史或中國民族企業的成果可謂相當豐碩，為免掛一漏萬，不擬敘述。新近中文成果論文集，可參見：李培德編，《近代中國的商會網絡及社會功能》（香港：香港大學出版社，2009）。李培德編，《商會與近代中國政治變遷》（香港：香港大學出版社，2009年）。英文學界有關中國企業史的研究，則可參見：卞歷南（Morris Bian），〈西方學界最近四十年對於中國企業史研究的述評〉，《經濟社會史評論》（天津：天津師範大學），2018年第4期，頁104-127。"}, {"type": "text", "text": "22 近年有關跨國企業在華活動的研究成果，尚可參見：中央研究院近代史研究所的張寧對於中國冷凍蛋品工業的研究。張寧，《跨國公司與中國民族資本企業的互動：以兩次世界大戰之間在華冷凍蛋品工業的發展為例》，《中央研究院近代史研究所集刊》，第37期（2002月6日），頁187-227。張寧，《技術、組織創新與國際飲食變化：清末民初中國蛋業之發展》，《新史學》，第14卷第1期（2003年3月），頁1-43。張寧近年關於上海殖民社會與文化活動的系列研究，不僅是上海城市生活史的面貌，並比較外人在華活動與母國文化的移植與變異等面向，具有全球史的宏觀意義。"}, {"type": "text", "text": "20 Emily S. Rosenberg, Financial Missionaries to the World: the Politics and Culture of Dollar Diplomacy, 1900-1930 (Cambridge, Mass.: Harvard University Press, 1999), Emily S. Rosenberg ed., A World Connecting, 1870-1945 (Cambridge, MA: Harvard University Press, 2012), Emily S. Rosenberg, Transnational Currents in a Shrinking World (Cambridge, MA: Harvard University Press, 2014)."}, {"type": "text", "text": "第二部分，商人團體、技術組織與關係網。探討一次大戰在中美關係的重大轉折。過去學界較偏重門戶開放政策在中美關係的意義，但筆者認為門戶開放政策為對華政策的指導原則之宣示，而就從實質關係而言，一次大戰在中美經濟關係的意義更加重要。一個專屬美國在華商人的團體建立於一次大戰，他們不僅將中國市場推向美國，乃至中國與世界的聯繫，則為作者所關注。再者，一次戰後有一波留美學生的歸國熱潮，他們所帶動新式企業的管理、專業技術和工程知識的推動及其形成的關係網絡，與近代中國的發展關係至鉅。此其時，一個史無前例的中美工程師的合作團體——「中美工程師協會」肇建於1919年。因此，這一部分探討一次大戰以後中美兩國何以會有一種多元關係的友好契機，以及兩個具代表的精英組織——美國在華商人團體和中美工程師協會在華活動軌跡及作用。這兩個團體在中國的會務活動因1941年太平洋戰爭的爆發而中止。"}, {"type": "text", "text": "第三部分，企業、戰爭與外交。聚焦於中國抗戰初期日本在華北實施的經濟壟斷措施對美國在華跨國企業造成的影響以及美國政府採取的相應措施。其次，戰爭時期石油為重要軍火，美國如何通過跨國公司如美孚和德士谷公司的合作策略，增加其在太平洋戰場中國戰區的安全力量。以及中國人又如何在戰爭過程中理解到中國有能力開採本土石油之夢，成為自給自足的能源國家。最後，戰後1946年中美商約的簽訂，反映了在華美商急欲重返中國市場；同時隨著二次大戰以後美國大國勢力的展現，中美商約的談判呈現中美雙方對自由市場的不同期待，對內則反映國內左右派系在不同意識形態的角力。此後，隨著國民黨政權失去大陸，中美商約所建立的條約基礎——意欲實現美國人對戰後中國自由市場及中美經濟關係的擘劃藍圖，終究成為一場夢幻。"}, {"type": "text", "text": "本書三大主軸企圖展現的是以將近代中美關係的多層次書寫，將政治、經濟、商人團體、工程技術和國際組織等元素融於一爐，各章節呼應連貫仍是一個近代中國在國家治理上內外策略的考察——特別針對美國在近代中國的國際交往中所展現的特殊關係。研究中美關係的學者不能不關心當今現實政治秩序，但歷史學的任務係從史料中實事求是，不為現實服務，讓材料自己說話，讀者若從本書感受到千秋之筆，則甚幸焉！"}, {"type": "text", "text": "企業活動、國家治理 與中美關係"}, {"type": "text", "text": "第一部分"}, {"type": "note", "text": "1 相關研究可參見：Stanely Buder, Capitalizing on Change: A Social History of American Business (Chapel Hill: University of North Carolina Press, 2009)."}, {"type": "note", "text": "2 梁啟超，《新大陸遊記》（台北：文海，1967年版），頁13-19，詳細介紹美國托辣斯的歷史濫觴起於1882年石油大王洛克菲勒（原書稱：洛奇佛拉）開創，接著有棉花、蒸餅、製糖等托辣斯，甚至縷列了美國1899年以後設立的托辣斯資本表。提到托辣斯在美國被視為怪物妖魔，美國政府立法禁止托辣斯之舉措，又言美國「政府務所以摧抑掃除，殆與現時中國政府之謀摧新黨者（指：維新派）無以異」，頁18。"}, {"type": "note", "text": "3 這方面英文專書的代表著作，如：Alfred D. Chandler Jr., The Visible Hand: The Managerial Revolution in American Business (The Belknap Press of Harvard University Press, 1977); Alfred D. Chandler Jr. and Bruce Mazlish, eds., Leviathans: Multinational Corporations and the New Global History (Cambridge: Cambridge University Press, 2005). 中文學界的代表著作可參考：王立新，《躊躇的帝國：美國崛起後的身分困惑與秩序追求，1913-1945》（北京：中國社會科學出版社，2015年）。"}, {"type": "note", "text": "4 關於近代中國的國際化相關論述，尚可參考徐國琦的三本代表作。Xu Guoqi, China and the Great War: China's Pursuit of a New National Identity and Internationalization (Cambridge, UK and New York: Cambridge University Press, 2005) Xu Guoqi, Olympic Dreams: China and Sports, 1895-2008 (Cambridge, MA: Harvard University Press, 2008), Xu Guoqi, Strangers on the Western Front: Chinese Workers in the Great War (Cambridge, MA: Harvard University Press, 2011)."}, {"type": "note", "text": "5 詳見Akira Iriye and Rana Mitter, eds., Palgrave Macmillan Transnational Series, 2007-2017. Journal of International & Global Studies, http://www.lindenwood.edu/jigs/about.cfm（下載日期：2017年4月15日）。Akira Iriye, Global and Transnational History: The Past, Present and Future (Basingstoke: Palgrave Macmillan, 2013). 中文著作中，針對全球史的研究趨勢，特別是新文化史到全球史的文化轉向，詳見：蔣竹山，《當代史學研究的趨勢、方法與實踐——從新文化史到全球史》（台北：五南圖書出版股份有限公司，2012），該書以物質文化、商品、飲食、醫學、環境和知識傳播等議題為主的分析。蔣竹山，《超越民族國家的歷史書寫：試論近來全球史研究中的「空間轉向」》，《新史學》，第23卷第3期（2012年9月），頁199-228。蔣竹山編，《當代歷史學新趨勢》（台北：聯經出版公司，2019）收錄的相關論文。"}, {"type": "note", "text": "4-23。吳翎君，〈英文學界關於「跨國史」研究新趨勢與跨國企業研究〉，《新史學》，第28卷第3期（2017年9月），頁207-240。該文回顧了目前跨國史的代表著作，大抵以19世紀中葉所謂近代民族國家建立的時期為開始，而且許多富有創意的研究議題係來自經濟史和政治史學者不斷拓展學術邊界的對話合作。"}, {"type": "note", "text": "6 關於跨國史研究趨勢，已有不少專文討論，本文不擬詳述。詳見王立新，《跨國史興起與20世紀世界史的重新書寫》，《世界歷史》，2016年第2期，頁"}, {"type": "note", "text": "7 Erest R. May, \"The Decline of Diplomatic History,\" in George A. Billias and Gerald N. Grob eds., American History: Retrospect and Prospect (New York: Free Press, 1971), pp. 339-430."}, {"type": "note", "text": "8 Akira Iriye, \"The Internationalization of History,\" The American Historical Review 94, no. 1 (1989), p. 4."}, {"type": "note", "text": "9 關於入江昭的治學，可參見：入江昭著，楊博雅譯，《我與歷史有個約會：入江昭治史心得》（北京：北京大學出版社，2013）。劉克倫、石之瑜，《入江昭對世界與中國的中間主義立場——一種多元身分的知識視野》（台北：國立台灣大學政治學系中國大陸暨兩岸關係教學與研究中心，2010）。入江昭早期關於美國與東亞關係的代表著作有：After Imperialism: The Search for a New Order in the Far East, 1921-1931、Across the Pacific: An Inner History of American-East Asian Relations、Pacific Estrangement: Japanese and American Expansion, 1897-1911。入江昭從遠東各國的多角視野，例如美、日、蘇和中國的交叉視角闡釋遠東關係，展現他對冷戰中期國際秩序低盪緩解的現實關注。"}, {"type": "note", "text": "11 Akira Iriye, Global and Transnational History, pp. 9-12."}, {"type": "note", "text": "10 關於國際史研究方法和範列，筆者曾有專文討論，本文不贅。詳見：吳翎君，〈從徐國琦新著 Strangers on the Western Front: Chinese Workers in the Great War 談國際史的研究方法，《新史學》，第22卷第4期（2011年12月），頁183-215。王立新，〈試析全球化背景下美國外交史研究的國際化與文化轉向〉，《美國研究》，第1期，2008。"}, {"type": "note", "text": "12 在 Global and Transnational History 一書第三章，入江昭列舉他個人認為可作為全球史與跨國史的顯著案例，及其如何重塑我們對過去歷史的理解，討論的議題包括環境、不同族群和文化的碰撞、移民、人權、經濟和文化的全球化、地緣政治現象中的文化維度（例如戰爭、區域社群、非政府組織等議題）。Akira Iriye, Global and Transnational History, ch. 3, pp. 36-68."}, {"type": "note", "text": "13 Akira Iriye, Global and Transnational History, pp. 16-17."}, {"type": "note", "text": "14 Akira Iriye, China and Japan in the Global Setting (Cambridge, MA: Harvard University Press, 1992)."}, {"type": "note", "text": "15 筆者認為從冷戰時代初期費正清（John K. Fairbank, 1907-1991）《美國與中國》（The United States and China, 1948），到1971年孔華潤（Warren I. Cohen）《美國對中國的反應》（America's Response to China），在其交錯與接替的中美關係史論述中，費正清以「中國回應美國」，到孔華潤提出的「美國回應中國」，後續尚有柯文（Paul A. Cohen）論述「在中國發現歷史」（Discovering History in China）、柯偉林（William C. Kirby）闡釋「中國的國際化」，均致意於扭轉美國學界側重某一研究取徑的自我批判。姑不論徐國"}, {"type": "note", "text": "琦新著選擇的個案或解釋觀點是否具有說服力，「共有的歷史」企圖挑戰半世紀以來中美關係史研究視野的企圖心昭然可揭。詳見：吳翎君，〈從徐國琦 Chinese and Americans: A Shared History 談美國學界對中美關係史研究的新取徑〉，《台大歷史學報》，55期（2015年6月），頁219-249。"}, {"type": "note", "text": "16 新左派健將拉費伯爾（Walter LaFeber）著有 The New Empire: An Interpretation of American Expansion, 1860-1898。1960 年代越戰升高後新左派史家勢力大增，反省美國外交政策成為主流，其中以 William A. Williams, The Tragedy of American Diplomacy 和 Denna F. Fleming, The Cold War and Its Origins, 1917-1960。兩書為嚆矢。"}, {"type": "note", "text": "17 更深入的討論，詳見：吳翎君，《英文學界關於「跨國史」研究新趨勢與跨國企業研究》，《新史學》，第28卷第3期（2017年9月），頁207-240。"}, {"type": "note", "text": "18 Kwang-Ching Liu, Anglo-American Steamship Rivalry in China, 1862-1874 (Cambridge, Mass.: Harvard University Press, 1962)."}, {"type": "note", "text": "19 Sherman Cochran, Encountering Chinese Networks: Western, Japanese and Chinese Corporations in China, 1880-1937 (CA: University of California Press, 2000)."}, {"type": "note", "text": "21 關於華資企業史或中國民族企業的成果可謂相當豐碩，為免掛一漏萬，不擬敘述。新近中文成果論文集，可參見：李培德編，《近代中國的商會網絡及社會功能》（香港：香港大學出版社，2009）。李培德編，《商會與近代中國政治變遷》（香港：香港大學出版社，2009年）。英文學界有關中國企業史的研究，則可參見：卞歷南（Morris Bian），〈西方學界最近四十年對於中國企業史研究的述評〉，《經濟社會史評論》（天津：天津師範大學），2018年第4期，頁104-127。"}, {"type": "note", "text": "22 近年有關跨國企業在華活動的研究成果，尚可參見：中央研究院近代史研究所的張寧對於中國冷凍蛋品工業的研究。張寧，《跨國公司與中國民族資本企業的互動：以兩次世界大戰之間在華冷凍蛋品工業的發展為例》，《中央研究院近代史研究所集刊》，第37期（2002月6日），頁187-227。張寧，《技術、組織創新與國際飲食變化：清末民初中國蛋業之發展》，《新史學》，第14卷第1期（2003年3月），頁1-43。張寧近年關於上海殖民社會與文化活動的系列研究，不僅是上海城市生活史的面貌，並比較外人在華活動與母國文化的移植與變異等面向，具有全球史的宏觀意義。"}, {"type": "note", "text": "20 Emily S. Rosenberg, Financial Missionaries to the World: the Politics and Culture of Dollar Diplomacy, 1900-1930 (Cambridge, Mass.: Harvard University Press, 1999), Emily S. Rosenberg ed., A World Connecting, 1870-1945 (Cambridge, MA: Harvard University Press, 2012), Emily S. Rosenberg, Transnational Currents in a Shrinking World (Cambridge, MA: Harvard University Press, 2014)."}]}, {"id": "ch1", "title": "第一章 · 清末輪船招商局與美商旗昌洋行的交易", "paras": [{"type": "title", "text": "第一章"}, {"type": "text", "text": "清末輪船招商局與 美商旗昌洋行的交易"}, {"type": "text", "text": "布（普）法之戰兩國商船多售於他國，易旗駛行，事後仍復原主。若暫行租賃，則非實在轉售，他國必不能保護，此萬國通行之公例也。"}, {"type": "text", "text": "——李鴻章，1884"}, {"type": "text", "text": "前言"}, {"type": "text", "text": "1873年由李鴻章負責成立的輪船招商局，是晚清洋務運動的「官督商辦」企業中，最早引進西方技術和管理模式的最大航運企業。輪船招商局成立的主要目的為藉由民間投資、政府經營，用以發展中國內河和沿海的航運運輸，免得中國航權和利益始終掌控於外人手中 $^{1}$ 。招商局成立以後和美國旗昌洋行有兩次重大的交易。一是，1877年順利盤購旗昌輪船公司，使得招商局成為航行中國內河和沿海最大規模的輪船公司，擁有船隻量甚至超逾任何一家外國在華經營的輪船公司。二是1884-1885年清法越南戰爭中，李鴻章鑑於中國海防危急，將招商局所有船隻全部轉讓給旗昌洋行，改懸美國國旗，雙方密約待戰事結束後，船隊始歸還招商局。關於招商局與旗昌的交易，過去的研究主要針對1877年招商局成立之初盤購旗昌輪船公司案的經過及其與英美輪船公司在中國內河的航運競爭 $^{2}$ 。至於清法戰爭期間的這場中美交易，並未有學者深入研究。如間有提及者也多囿於中國民族主義觀點的負面評述，反映了二、三十年前史學研究的時代局限 $^{3}$ 。在清法戰爭期間，兩國的輪船交易是否純為商人企業的私人交易？在國際關係上，這件交易攸關已進入近代國際秩序的國家主權者對於國際戰爭採取怎樣相應國家行為的認知和處置。"}, {"type": "text", "text": "自海運開通以來，中國民間船隻為逃避海盜或為逃避重複徵稅等問題，屢有懸掛外國旗幟接受保護的情形。然而，招商局為清季洋務運動中標舉自辦輪船企業用以抵制長期掌控中國內河航運的英美輪船公司，如何能懸掛外國國旗並接受其保護？此事攸關中國初起步的航運事業之成敗毀譽，其和一般商船懸掛洋旗的性質大大不同。當時招商局何以選擇旗昌洋行換旗，或是旗昌洋行何以接受這項交易？其間不僅牽涉兩個企業間長期的交往關係，更與清法戰爭時期中美兩國政府的聯繫有關。這件懸掛美國國旗的輪船交易案本身已頗不尋常，同時也突顯戰爭期間外人在華各個條約口岸的貿易投資和航行內河等權益該如何處置的問題。本章利用總理衙門檔案，美國政府檔案和《北華捷報》（North China Herald）等資料，探討此一輪船交易案在中美關係上的意義，並從企業活動、國家治理與對外關係的相應，探討近代中國尋求富強之路的特別遭逢。"}, {"type": "text", "text": "2 過去對於輪船招商局的成立及1877年盤購旗昌輪船公司的案例，已相當充分，本文不擬詳述。最重要的研究為劉廣京，《中國境內英美輪船競爭》，該書主要探討了美商旗昌洋行、英商怡和洋行、太古洋行在中國航運市場的活動，以及中國成立輪船招商局以後與這些外輪的競爭。Kwang-Ching Liu, Anglo-American Steamship Rivalry in China, 1862-1874 (Cambridge, Mass.: Harvard University Press, 1962)。其次，黎志剛，《中國近代的國家與市場》（香港：香港教育圖書公司，2003年）及其有關招商局相關論文。此外，陳潮的研究探討1877年盤購旗昌輪船的交涉過程，側重負責此案交涉的李鴻章、徐潤和盛宣懷等人。陳潮，〈輪船招商局盤購旗昌輪船公司述論〉，《史林》，1988年第1期，頁51-58。聶寶璋和易惠莉的研究或從買辦角色或從商"}, {"type": "text", "text": "1 詳見：黎志剛，〈輪船招商局經營管理問題，1872-1901〉，《中央研究院近代史研究所期刊》，第19期（1990年6月），頁67-108。"}, {"type": "text", "text": "戰論，探討併購旗昌輪船公司案。聶寶璋，〈從美商旗昌輪船公司的創辦與發展看買辦的作用〉，《歷史研究》，1964年第2期，頁91-110。易惠莉，〈招商局併購美商旗昌輪船案與商戰論〉，《史林》，2009年第4期，頁41-53。易惠莉，〈唐廷樞、徐潤與招商局之籌建與改組〉，收入：香港中文大學中國文化研究所文物館、香港中文大學歷史系合編，《買辦與近代中國》（香港：香港三聯書店，2009年11月），頁194-221。"}, {"type": "text", "text": "3 例如：從中國民族主義的立場批判招商局的虛假出售案，稱：「控制招商局的官僚買辦資階級是外國侵略勢力豢養的附庸」。張國輝，〈中國近代航運業的醞釀和輪船招商局的產生〉，易惠莉、胡政主編，《招商局與近代中國研究》（北京：中國社會科學出版社，2005），頁211。"}, {"type": "text", "text": "一、美商旗昌洋行和招商局的早期歷史"}, {"type": "text", "text": "旗昌洋行（Russell and Company）發跡於廣州十三行時代，1824年由撒母耳·羅素（Samuel Russell, 1789-1862）所成立，主要經銷茶葉、絲和鴉片，在華的商業合夥人主要是廣州十三行富商伍秉鑑。1834年東印度公司對華貿易的壟斷被廢除後，旗昌洋行成為僅次於英商怡和洋行（Jardine Matheson & Co.）及顛地洋行（Dent & Co.）之後的第三大鴉片走私商。當時美國在華貿易量雖不大，但集中在瓊記洋行（Augustine Heard & Co.）和旗昌洋行等大洋行手中。1840年代波士頓商人福布斯（Robert Bennet Forbes, 1804-1889）掌控公司大股，福布斯家族（Forbes Family）成員福士（Paul Siemen Forbes, 1806-1886）於1844年出任美國駐廣州口岸領事 $^{4}$ 。該行經理兼合夥人金能亨（Edward Cunningham 1823-1889年）於1852年任上海副領事，並曾任上海工部局董事，是遊走政商界的風雲人物 $^{5}$ 。清法戰爭期間廈門美副領事哮哈(J. J. Howard) 也是旗昌洋行的合夥人 $^{6}$ 。旗昌洋行的股東與波士頓商業集團及華盛頓政要均有密切關係，且其洋行經理或合夥人出任美國駐中國主要通商口岸的領事職位，是一家代表美國對華商業利益集團的典型大企業。"}, {"type": "text", "text": "金能亨看到中國航運界的商機潛力，在1861年2月，向旗昌洋行董事會力薦，成立一家開闢長江航運的輪船公司。他同時利用個人的關係募集華人買辦和英國商人資金合計70萬關兩，再加上公司的挹注，以一百萬關兩（約美金1,358,000）為起步，該年3月27日旗昌輪船公司（The Shanghai Steam Navigation Company）創立。這是美國資本在華設立的第一家輪船公司，很快稱霸於中國長江水域，並獲得巨大利益。旗昌輪船公司於1867年有12艘船，1869年成長為15艘船；到了1872年有18艘船，該年帳面載明的股本是225萬兩，此外共有現金儲備100萬兩 $^{7}$ 。由於中國內河輪船航運業務的利潤不斷增加，1870年代初期外資輪船紛紛投入，旗昌洋行在輪船航運業的龍頭地位因而發生動搖。它的對手有較早成立的英國公正輪船公司（Union Steam Navigation Co.）、資金雄厚的太古輪船公司（The China Navigation Co. Ltd.）和成立於1873年由英商怡和洋行創辦的華海輪船公司（The China Coast Steam Navigation Company） $^{8}$ 。"}, {"type": "text", "text": "問題，詳見：吳翎君，《美國大企業與近代中國的國際化》，（台北：聯經出版公司，2012。北京：社會科學文獻出版社，2014），第1章。"}, {"type": "text", "text": "6〈總署收總稅務司赫德呈〉，光緒10年3月22日（1884年4月17日）《中美關係史料·光緒朝二》（台北：中央研究院近代史研究所，1988），頁1029。"}, {"type": "text", "text": "4 關於旗昌洋行在中國的早期歷史發展，可參閱：He Sibing, “Russell and Company, 1818-1891, America’s Trade and Diplomacy in Nineteen-Century” Miami University, Department of History, 1997 (Ph. D. dissertation) 該文主要從美國在華貿易與外交的視角探討旗昌在中國的活動，但並未探討清法戰爭期間招商局和旗昌的交易。"}, {"type": "text", "text": "7 香港上海匯豐銀行（The Hongkong and Shanghai Banking Corporation Limited, HSBC）於1864年成立之初，看中旗昌在中國市場的影響力，積極拉攏旗昌大股東福布斯家族（Forbes Family），後來福布斯（William Howell Forbes, 1837-1896）於1879-1880年出任匯豐銀行第11屆董事會總裁（Chairman），可見旗昌洋行在遠東市場的動見觀瞻。詳見：Ji Zhaojin, A History of Modern Shanghai Banking: The Rise and Decline of China Finance Capitalism (Armonk, New York: London, M. E. Sharpe, 2003)。波士頓商人福布斯家族檔案收存於美國波士頓麻省歷史學會（Massachusetts Historical Society）。詳見http://www.masshist.org/collection-guides/view/fa0269。"}, {"type": "text", "text": "5 不僅是旗昌洋行合夥人，甚至雇員也出任美國駐中國口岸領事，例如：任職旗昌洋行且不通曉漢語的畢理格（William Breck，又譯為別列子或柏賴克），於1863年出任漢口領事。中央研究院近代史研究所編，《中美關係史料·同治朝》（台北：中央研究院近代史研究所，1988），頁52。美國商人兼領事的"}, {"type": "text", "text": "1872年李鴻章主導的官督商辦企業招商局成立，招商局享有漕糧運輸上等種種優惠，而且所承運的貨品還免徵釐金，成立之初即對英美輪船在中國內河水域的航行優勢造成威脅。在招商局創立之初，朱其昂、盛宣懷和徐潤各為會辦，「朱道其昂、盛道宣懷管理招商、運米等事。唐丞廷樞、徐郎中潤管理輪船、攬載等事，皆熟諳生意，殷實幹明」9。招商局早期的經營對招股方式、官利分派、人事和財務管理、攬載和保險等方式的成效，特別是唐廷樞和徐潤兩人重視資本籌集、銷售策略和拓展局務等能力，使局務蒸蒸日上。招商局的資本額由1872年的6萬兩，到1877年增加到75萬1千兩，到1880年擴資到1百萬兩，1882年又增加到2百萬兩10。"}, {"type": "text", "text": "招商局成立後，旗昌洋行為因應業務競爭，一方面與英國輪船公司合手傾擠招商局，另一方面英美輪船之間也不惜跌價競爭，結果旗昌節節敗退。1873年以前旗昌股東每年可分得12%以上的紅利，但1874年每年紅利跌到7% $^{11}$ 。此時適值美國南北戰爭結束後開展大重建計畫，基礎建設和交通事業大有榮景，一些股東乃有意將資本轉向美國市場，因此旗昌輪船公司面臨經營和轉型抉擇，要不投下更大的技術和設備投資，力戰中國市場，要不就轉回美國本土。旗昌輪船公司原有22,500股資本額，每股100兩，到了1876左右市值跌到每股60-66兩，這次交易招商局以高於市值的每股103兩買入，股東大會拍手稱慶，不僅拿回成本，還略有小賺 $^{12}$ 。1877年，旗昌公司將16艘船隻、碼頭和棧房等全數產業，總計作價222萬兩，出清賣給招商局。使得招商局原有17艘輪船（11,706淨噸）增加到33艘（23,967淨噸），規模增加一倍，成為中國水域最大的航運公司 $^{13}$ 。"}, {"type": "text", "text": "在1877年盤購旗昌輪船公司案的拍板，主要由盛宣懷與唐廷樞、徐潤具稟北洋大臣李鴻章和兩江總督沈葆楨，最後奏功。李鴻章反復分析得失利弊，指出八弊之後，權其利害，有裨於通商大局者固多，仍主張歸併。其中最主要原因在於和英國在華輪船公司的競爭「旗昌既並之後，我局聲名大振，太古怡和決不肯再添資本，與我爭已定之局」、「旗昌甘心歸併而我恝置之，或為太古怡和所並，或另為洋商所並，則彼以生力軍與我相抗，年復一年既不能制人，必至為人所制，前功盡棄，後患無窮，其不歸併之害又如此」 $^{14}$ 。李鴻章和沈葆楨等人認為此事「關係中國收回利權之舉」，事機倉猝，斷非招股所能應手；對盤購旗昌的資金籌措如何以「官照商力」做出具體建議。歸併之事，由政府籌款。「以後資本二百二十萬，除旗昌向有華商舊存股本銀二十萬兩，可以勸令仍充股份外……，奏明各省籌撥官本銀一百萬兩，發交商局，免其繳利，分作十年拔本。」 $^{15}$ 因此，在1877年順利盤購旗昌輪船公司案得以成功，仍在於「官照商力」主其事者以國家力量主導了整個盤購案，希望發達中國民族輪船工業，使其勿受制於外國輪船公司。"}, {"type": "text", "text": "8 公正輪船公司早於1860年代成立，是資本較小的企業。太古輪船公司為一家在英國集股的大企業，創辦資本36萬英鎊，由史懷爾（John Samuel Swire, 1825-1898）於1872年在倫敦籌集。由怡和洋行創辦的華海輪船公司，除原本怡和洋行的資金外，另有部分資金來自中國口岸的中國買辦商人和英國小洋行的認股。劉廣京，《中英輪船航運競爭，1872-1885》，收入氏著，《經世思想與新興企業》（台北：聯經出版公司，1990），頁528-531。"}, {"type": "text", "text": "11 劉廣京，〈中英輪船航運競爭，1872-1885〉，《經世思想與新興企業》，頁525-565。"}, {"type": "text", "text": "12 Mr. Seaward to Mr. Fish, Jan. 30, 1877, Papers Relating to the Foreign Relations of the United States (簡稱 FRUS，以下同) 1877-1878, p. 90."}, {"type": "text", "text": "9 同治12年11月13日（1874年1月1日），《李文忠公全集·朋僚函電》（台北：文海出版社，1962）第13卷，頁24。"}, {"type": "text", "text": "10 黎志剛，〈輪船招商局經營管理問題，1872-1901〉，《中央研究院近代史研究所期刊》，第19期（1990年6月），頁75。"}, {"type": "text", "text": "13 1887年時招商局投入營運的輪船只有28艘；甚至在1914年該局也只有30艘輪船，因此，併購旗昌輪船公司案，可說是中國早期輪船工業的一次重大發展。費維愷（Albert Feuerwerker）著，虞和平譯，《中國早期的工業化》（China's Early Industrialization, Harvard University, 1958）（北京：中國社會科學出版社，1990），頁233。"}, {"type": "text", "text": "旗昌輪船公司退出中國內河航運，結束了美國在長江航運業的風光時代，這事令美國駐華領館相當重視。1877年1月，美國駐華特命全權公使（Envoy Extraordinary and Minister Plenipotentiary）熙華德（George Frederick Seward, 1840-1910）在電報中提到招商局會辦唐廷樞（唐景星，電報原件稱 Tong King Sing）居間交涉這事，擬從部分海關所得支付這次交易。熙華德提到中國招商局享有運送漕運和稅率上的優惠，且招商局更有意打算訓練自己的經理人、職員、技術人員、創辦船政學校，意圖將外國輪船勢力驅逐出帝國。熙華德說如果在公平競爭的條件下中國人是不可能擠垮像旗昌這樣長期經營中國內河航線的公司，但他不敢斷言清政府這種大力介入的方式，是否具有能力來管理招商局，並能充分讓招商局股東和人民感到滿意？熙華德當然是以美國自由市場的理念來看待中國企業的發展；因為招商局所享有的特權不僅是企圖將外國運輸業的競爭者排擠出去，而且也阻止了任何潛在的中國競爭者進入這一市場。他直言如果中國的企業是自主發展，並由中國人民取得這種商業成就，美國人可能覺得自在一些。他寄望中國市場愈來愈走向自由開放和競爭 $^{16}$ 。"}, {"type": "text", "text": "招商局盤購旗昌洋行之後，既受到政府大力扶持，卻在數年之間，由勝轉衰，失去初創時的聲勢。這是何故？據劉廣京所研究的結果，招商局盤購旗昌輪船公司後，雖有政府在貨運噸位和補助方面的優勢，但是不僅未能擠下英國輪船在中國長江航運的優勢，招商局內部的管理行政弊端卻日形嚴重。緣於1883上海發生金融風暴，而同年法國在安南的行動導致兩國劍拔弩張的形勢，市場耳語更助長這次的金融恐慌，上海78家錢莊竟有68家倒閉。上海錢莊倒閉事件，使得原本擔任招商局局董的徐潤因挪借招商局資金用於個人房產等多項投資，以致周轉不靈，不僅徐潤個人破產，也導致招商局的大虧空 $^{17}$ 。另位官董唐廷樞也因大膽盜用招商局資金而被撤去局董職務。這一波金融風暴，導致招商局在1884-1885年間的人事大改組，也使得李鴻章弟子馬建忠和幕僚盛宣懷順利入主招商局 $^{18}$ 。據海關總稅務司赫德（Robert Hart, 1865-1911）的函電，在談判清法和約的同時，李鴻章還曾拜託天津海關稅務司德璀琳（Gustav von Detring，1842-1913，英籍德國人），除了協助他注意談判和約的細節外，還要研究招商局的事務，「設法使這垂死的企業復蘇。」在電文中所指的即是招商局內部人事和經營管理的腐敗問題 $^{19}$ 。當時盛宣懷在天津，在上海的招商局的會辦馬建忠便成為清法戰爭期間的輪船招商局和旗昌洋行的交易案的第一線主導人物。"}, {"type": "text", "text": "14 北洋通商大臣李鴻章函總署1877年1月20日（光緒2年12月7日），《總理各國事務衙門檔案》，中央研究院近代史研究所檔案館藏，01-05-010-03-006。（以下同）另見，中央研究院近代史研究所編，《海防檔·甲買船炮（三）》（台北：中央研究院近代史研究所，1957），頁952-956。"}, {"type": "text", "text": "15 由江南各庫局（五省）籌借50萬。「……事機倉猝，斷非招股所能應手。欲求大局持久，似非官照商力不妥。擬懇由江南籌借五十萬。浙江江西湖北四川山東五省合籌五十萬，可否免支利息分作十年，由該局每年繳還十萬，一定不移」。《總理各國事務衙門檔案》，01-05-010-03-006，1877年1月20日（光緒2年12月7日），照錄覆南洋大臣兩江督院沈諮稿。另見：中央研究院近代史研究所編，《海防檔·甲買船炮（三）》，頁939-947。"}, {"type": "text", "text": "16 Mr. Seward to Mr. Fish, Jan. 30, 1877, FRUS, 1877-1878, pp. 88-91."}, {"type": "text", "text": "17 劉廣京，〈1883年上海金融風暴〉，收入劉廣京著，《經濟世思想與新興企業》，頁571-593。卜永堅，〈徐潤與晚清經濟〉，收入：香港中文大學中國文化研究所文物館、香港中文大學歷史系合編，《買辦與近代中國》，頁221-232。"}, {"type": "text", "text": "二、清法戰爭時期招商局輪船懸掛美國國旗的買賣"}, {"type": "text", "text": "1883年12月，法軍進攻駐紮在越南紅河三角洲北圻的清軍，一般所謂清法戰爭以此為爆發點，在此之前清法已為越南問題爭議甚久。清法戰爭先從陸戰開端，接著有海戰和台澎戰場。早在1883年8月間，清廷就希望美國公使楊約翰（John Russell Young, 1840-1899）出面調停，賠款可由美使酌議。美國國務卿弗裡林海森（Frederick Theodore Frelinghuysen, 1817-1885）指示「除非中法兩國都認可美國駐華使館的斡旋，美國不應介入這場爭端；但是如果中法都同意美國斡旋，那麼美國將盡全力促成和平」，美國國務院顯然不願積極介入調停 $^{20}$ 。主和派的直隸總督李鴻章在交涉和議的同時，火速處理移轉招商局財產。這時與李鴻章頗有私誼的美國駐華公使楊約翰則居中扮演關鍵人物促成了這樁買賣。數年前楊約翰曾伴隨美國第18屆總統格蘭特（Ulysses S Grant）卸任後的環球世界之行，他到訪中國時對李鴻章甚有好感，讚譽這位素有「東方俾斯麥」（The Bismarck of East）之稱的李鴻章「充滿睿智和身段圓融的本領，以漢人（China man）受到韃靼王朝（Tartar dynasty）的尊崇，位高而權重」。後來格蘭特便向美國第21屆總統亞瑟（Chester Alan Arthur）推薦楊約翰出任駐華公使（任期1882-1885） $^{21}$ 。"}, {"type": "text", "text": "1884年李鴻章於5月11日受命代表與法國簽定《中法簡明條款》（天津條約）。待條約細目確定後再決定撤兵之日 $^{22}$ 。就在細則交涉之中，清法又發生北黎衝突事件（觀音橋事件），以致和談破局，不久再度交火。7月法國兵船八艘進逼福建口岸「欲踞地為質」：而留屯於煙台口外的三艘法國兵艦「每日生火作欲動之勢」顯係威嚇 $^{23}$ 。旅順、大沽、北塘各口岸之防護吃緊，南北洋覆稱「無船可撥」，避戰之聲四起。李鴻章意識到若真動兵閩口外，「不足當（擋）鐵艦，內河多船，亦無大用，儻被擄奪便損威」 $^{24}$ 。李鴻章的幕僚馬建忠擬議將招商局的輪船公司「名義上」賣給旗昌洋行，以此保護招商局的船隻免遭法國艦隊炮擊和劫掠。這項交易是在密約的情況下進行。馬建忠稱曾徵詢過英國商人的意向：「……局船必難盡避，即盡避，閑擱經費，經費不支，售英商，英律苛細，美律簡易，可售旗昌。」在馬建忠初擬的奏摺中，謀策出「換公司、換旗，不論限皆權自我操」的「假買賣」，使「局產可保，公私款皆存，並有無須有實在出入之款」。函電中提到不能令法國人知有「轉移之法，以不能確知開釁而預換旗，設不開釁必來物議，確知釁端始行換旗，物議雖免，法已無益」 $^{25}$ 。"}, {"type": "text", "text": "20 Jules Davids ed., American Diplomatic and Public Papers, Series 2: The United States, China, and Imperial Rivalries, 1861-1893. Vol. 6, The French-China War (Wilmington, Del.: Scholarly Resources Inc., 1979), pp. 170-171."}, {"type": "text", "text": "18 招商局的這次大改組是盛宣懷日後長期掌控招商局的一個起點，盛在1885-1902成為招商局的督辦，實際掌控了招商局。黎志剛，〈輪船招商局經營管理問題，1872-1901〉，頁67-108。費維愷（Albert Feuerwerker）著，虞和平譯《中國早期的工業化》，頁192-240。"}, {"type": "text", "text": "21 楊約翰著有 Around the World with General Grant (American News Company, 1879)，記錄了前總統格蘭特訪問歐洲、亞洲和非洲各國的見聞及美國對外政策的想法。書中提到有趣的比較是格蘭特將軍崛起於美國南北戰爭，此其時李鴻章所練的淮軍則是平定太平天國之亂，李鴻章自負地說：「格蘭特將軍和我鎮壓了歷史上最知名的叛亂」，還開玩笑說他姓李，格蘭特的對手也姓李（指：李將軍，Robert Edward Lee, 1807-1870）。見該書，頁371-372。"}, {"type": "text", "text": "19 陳霞飛編，《中國海關密檔：赫德和金登干的往來函電彙編》（北京：中華書局，1990），第4冊，頁555。1884年6月4日。"}, {"type": "text", "text": "22 中國近代史叢書編寫組，《中法戰爭》，第7冊（上海：上海人民出版社，1972），頁719。"}, {"type": "text", "text": "此一換旗交涉，為何不能讓法國知悉？除了李鴻章等主和派認為中國海防不足以抵禦法國輪船大炮，法國公使巴德諾正在向中國漫天要價，並要求中國限期答覆。一旦招商局和美國旗昌洋行的暗盤交易公開，肯定遭到法方批評，且可能導致法、美關係的緊張。事實上從美國的檔案則有另解，美國方面更在意的是如果中法處於交戰狀態，美國必須保持中立就不能介入此事。加以，負責和議大任的李鴻章不僅火速安排與旗昌洋行密約，並打算請美國出面調停和議金額，因此，和旗昌換旗一事就必須更加機密。"}, {"type": "text", "text": "李鴻章與在京的招商局經理唐景星商議，最擔心的是此一合約萬一不夠詳備，將使招商局受制於人。李在一日之間發了二次電報。第一次電報中提到「局本共計五百餘萬，旗昌應給新股票一百萬歸局統售，其餘舊股二百萬聽商自換存款借項，二百餘萬均歸旗昌接認，方可交盤。換旗另立暗約代辦」，最重要的是「無論早遲，事定仍還伊銀票，收回局產，轉華商名，換華旗，註銷明約，如此乃為權自我操，望妥密籌，議勿稍含混」 $^{26}$ 。當日，李又再電「此事糾葛甚多」，可先訂簡約電商換旗，但詳細方案則應俟唐道（唐廷樞）回到上海後會商定議，該份電報提到法國要求清廷需於8月1日（農曆6月11日）前議定恤金。次日，馬建忠偕同招商局委任律師英國人擔文（William Venn Drummond（?1842-1915）和旗昌洋行老闆面商後，由擔文起草售契和新公司章程。由於清法戰事緊急，為避免生枝節，決定11日押定，並馬上申告美總領事電令各領事換旗 $^{27}$ 。"}, {"type": "text", "text": "7月30日李鴻章給招商局馬建忠的電報更清楚看出招商局換旗一事的急迫性，而美國公使楊約翰居中斡旋，尚派遣天津領事赴上海責成此事："}, {"type": "text", "text": "巴（按：法使巴德諾）昨與曾宮保（按：曾國荃）議不合……初十不允償仍即動兵，是展延之說不確。楊使（按："}, {"type": "text", "text": "23〈寄譯署〉，光緒10年6月初4（1884年7月25日）午刻。《李文忠公全集·電稿》，第3卷，頁64。"}, {"type": "text", "text": "24〈寄閩防張會辦〉，光緒10年6月初4（1884年7月25日）申刻。《李文忠公全集·電稿》，第3卷，頁64。"}, {"type": "text", "text": "25〈馬道由滬局來電〉，光緒10年6月初5（1884年7月26日）。《李文忠公全集·電稿》，第3卷，頁64。"}, {"type": "text", "text": "26〈寄滬招商局馬道〉，光緒10年6月初6（1884年7月27日）午刻。《李文忠公全集·電稿》，第3卷，頁65。"}, {"type": "text", "text": "27〈寄滬招商局馬道〉，光緒10年6月初6（1884年7月27日）申刻。《李文忠公全集·電稿》，第3卷，頁65。"}, {"type": "text", "text": "美使楊約翰）謂於十一日前交盤不宜有暗約，尊電換收回先於領事處押賣契。所重尤在他日事平回收一節，弟須獨擔，責成津美領事已為此事赴滬，事急期促，務望妥辦，勿貽後悔。28"}, {"type": "text", "text": "「他日事平回收」一節尤其重要，李鴻章自陳獨擔後果。文中提到的是參與上海和談的兩江總督兼南洋通商大臣曾國荃，李鴻章對索賠一事早有「先允恤，再緩磨數目，似是一定層次」、「否則決裂，船廠萬不可保，他處亦兵連禍結奈何」 $^{29}$ 。福州將軍同日函電法軍鐵船雷、魚雷船和大小兵船環伺江口逼其開釁，閩口海防恐不保 $^{30}$ 。然而，曾國荃為求和局速成起見，遽許法國恤銀50萬，又遭法方嚴詞拒絕，朝中乃有「於事無補，徒貽笑柄」之聲 $^{31}$ 。李鴻章擔心一旦清法在閩開戰，福州船政局肯定不保，因此未戰即計謀撤離：「我自度兵船不敵，莫如全調他往，騰出一座空廠，彼即暫據。事定必仍原物交還，否則一經轟毀，從此海防根本掃盡難興」 $^{32}$ 。於此可見李鴻章對中國開辦不久的新興輪船工業的重視，如果福州船政局保不住，至少可守住輪船招商局。"}, {"type": "text", "text": "在李鴻章而言，旗昌洋行換旗之事乃急急如火，決定8月1日在美領事押券，共計525萬，分期攤還銀票，在上海的既有8艘船隻馬上辦理，其他停在各口岸的招商局船隨即照辦 $^{33}$ 。後來清法談判中，法國一再抬高議價，有300萬兩或350萬兩（或英鎊100萬鎊）不等，步步進逼 $^{34}$ 。總理衙門對賠款的有限讓步引起主戰派的嚴厲申斥，對外談判氣氛緊張中，宮中又有備戰之爭；主戰派既主開戰，招商局輪船為運輸主力，當然不可能同意換旗 $^{35}$ 。1884年8月26日（光緒10年7月初6日）內閣奉上諭頒布對法宣戰的同一天（但未召見各國公使遞送正式照會，詳下），李鴻章接獲總理衙門密電斥以「現聞招商局售於美國，李鴻章何以未經具奏等因」。李鴻章奉旨「伏讀之下，悚惕莫名」，他上奏稱法人開釁情況危急：「輪船恐被劫奪，乃與商董密籌照西國通例，暫售於美國旗昌洋行，以保成本」，電報中也首次披露了李鴻章認為清法未宣戰以前「換旗」之舉並不違反國際各國成法。在此之前李鴻章和馬建忠的函電往來中，並未提到這一理由：「查招商局本西國公司之意，雖賴官為扶助一切，張弛緩急，事宜皆由商董經營，至於外人交涉權變之處，官法所不能繩者，尚可援西例之相維持。」此處西例所指為何？李鴻章提到招商局所僱英國律師擔文的解釋如下："}, {"type": "text", "text": "28〈寄滬招商局馬道〉，光緒10年6月初9（1884年7月30日）申刻。《李文忠公全集·電稿》，第3卷，頁66。"}, {"type": "text", "text": "33〈馬道來電〉，光緒10年6月初10（1884年7月31日）。酉刻到，《李文忠公全集·電稿》，第3卷，頁67。"}, {"type": "text", "text": "34〈寄譯署〉，光緒10年6月18日（1884年8月8日）酉刻，《李文忠公全集·電稿》，第3卷，頁70。"}, {"type": "text", "text": "29〈寄上海曾宮保〉，光緒10年6月初9（1884年7月30日）午刻。《李文忠公全集·電稿》，第3卷，頁66。"}, {"type": "text", "text": "30〈福州將軍等致譯署〉，光緒10年6月初9日（1884年7月30日）酉刻到，《李文忠公全集·電稿》，第3卷，頁66。"}, {"type": "text", "text": "31〈曾宮保來電〉，光緒10年6月初9日已刻到（1884年7月30日）。〈譯署致曾宮保〉，光緒10年6月11日丑刻到，《李文忠公全集·電稿》，第3卷，頁66-67。"}, {"type": "text", "text": "32〈寄譯署〉，光緒10年6月初10（1884年7月31日）。午刻，《李文忠公全集·電稿》，第3卷，頁67。"}, {"type": "text", "text": "35〈醇親王致翁同龢函稿第五十六〉，光緒10年6月初8（1884年7月29日），翁萬戈輯，《翁同龢文獻叢編》，四（台北：藝文印書館，2002），頁155-157。編者翁萬戈為翁同龢後人。奕訢所指揮的軍機處因處理清法戰爭，和戰不定，清軍履遭敗退，慈禧太后藉口「委靡因循」，於1884年3月罷去奕訢一切職務，令其居家養疾，同時由禮親王世鐸、醇親王取而代之，以慈禧為首的中樞改組。然朝廷內部因和戰問題仍紛擾不止。醇親王奕譞受命為總理海軍事務，名義上為清末海軍及北洋水師最高統帥，實際上指揮權屬於李鴻章及淮軍丁汝昌。清法戰爭中的主戰派以清流派代表翁同龢為首。"}, {"type": "text", "text": "細查各國律例成案，凡本國商船改用他國旗幟須在兩國未開釁以前。黑海之戰俄商皆懸美國之旗，有二艘換旗在戰事，三月前遂為法人所奪。復有二艘易旗於戰前，特立售回據亦為美國所奪。布（普）法之戰兩國商船多售於他國，易旗駛行，事後仍復原主。若暫行租賃，則非實在轉售，他國必不能保護，此萬國通行之公例也。 $^{36}$"}, {"type": "text", "text": "這份奏摺不僅提到「實在轉售」，他國始能保護；也首度提到唐廷樞在上海原有意和怡和洋行接洽，但英律繁苛難罄，美律簡易，「美與中國交情較厚，應換美旗為妥適」。同時陳述馬建忠和律師擔文如何確保所押契據銀行期票與收票等細節，「交涉彼此全憑信義，律師即援西例擔保，而官長卻未便主議」，「外侮橫加，商情惶迫，數千人身家關係，而官無法以保護之」；將此事定位為商人設法保全成本，「官尤不便抑勒」。李鴻章為此舉反覆辯解，強調「戰前商船換旗出售為各國常有之事，中國雖屬創見而眾商為時事所迫，亦屬萬不得已」。電報中也吐露美國官商之隱諱助力：「法人四處偵探總疑商局輪船並非實售與美國，尚思援西例以乘間攫拿俾為軍用，美國官商亦惴惴焉，相與隱諱，竭力保護」 $^{37}$ 。這份奏摺充分顯示了招商局作為官督商辦企業在政商關係的庇護依存特性，而李鴻章又將整件換旗案抬高到比附西方國家在開戰前私人商船之保護成例，以保住商人出資認股／政府委派官員管理的中國招商局事業。"}, {"type": "text", "text": "換旗之後，海關總稅務司赫德函電招商局詢問旗昌洋行是否可享有原來政府補貼的運糧水腳及二成貨物之免稅優惠。李鴻章清楚說明「所有格外優益，斷不能讓與他國商人」。「局船暫交旗昌經管運漕，毋庸免二成貨稅。俟收回時仍復商局舊章，庶無窒礙」。最重要的是「美旗雖是局船，然只當論旗不論船，守定約章，以免藉口。將來商局收回後，該關再查照舊章辦理，界限自清。」 $^{38}$ 至於招商局房屋產權售與美商旗昌洋行後，應否令其搬移界內，也做出權變辦法「暫從緩議」以免轂轉相應。因為事平之後，招商局的輪船棧房碼頭仍當「照議收回」 $^{39}$ 。"}, {"type": "text", "text": "李鴻章賣船在數日內火速拍板，出於對美國的信任，訂立密約。這次交易雖和1877年盤購旗昌洋行案未有直接關連，但是招商局和旗昌洋行長久的特殊關係亦應有助於這次交易的信賴基礎。就在1884年8月，廣州地方當局曾支付旗昌洋行一筆8,993美金，作為該洋行倉庫在1883年廣東動亂中被暴民毀損的補償金 $^{40}$ 。這筆金額據悉是當時諸多索賠中唯一有結果的，美國駐廣州領事喜默（Charles Seymour，生卒不知）的努力不懈，固有其功；但也於此可見旗昌洋行與清政府的特殊交誼 $^{41}$ 。"}, {"type": "text", "text": "37〈直隸總督李鴻章奏法人開釁招商局輪船擬暫售與美國旗昌洋行折〉，王彥威編，《清季外交史料》，第45卷之15，頁845。"}, {"type": "text", "text": "36〈直隸總督李鴻章奏法人開釁招商局輪船擬暫售與美國旗昌洋行折〉，王彥威編，《清季外交史料》，第45卷之15，（台北：文海出版社，1985），頁844-"}, {"type": "text", "text": "38 總署直隸總督李鴻章函，1885年5月23日（光緒11年04月10日），《總理各國事務衙門檔案》，01-13-007-06-005。"}, {"type": "text", "text": "39 總署收南洋大臣曾國荃文，1884年11月13日（光緒10年09月26日），《總理各國事務衙門檔案》，01-18-002-01-039。"}, {"type": "text", "text": "三、宣戰、局外中立與中美關係"}, {"type": "text", "text": "招商局和旗昌輪船的交易在清法戰爭期間來回轉手，戰爭時期船務運輸在供應煤料和軍火和物資無一不重要，因此招商局和旗昌輪船的買賣就不只是一樁普通交易，它牽涉到列強如何看待中法之間是否處於國際秩序中國家之間的戰爭行為及其法律效果。從19世紀中葉以後歐美各國對近代國際秩序中宣戰行為的法律程序愈來愈為成熟，「宣戰」往往被視為武裝敵對行為的開始並依此構成戰爭時期國際社會中交戰國和非交戰國所依循的法律行為的基礎和效果，包括外交關係、條約承認、商務關係、財產貨物、船舶航運等等 $^{42}$ 。清法戰爭是否有正式的「宣戰」之事，還是一場「不宣之戰」（undeclared war）？如果中法已處於列強所認知具戰爭狀態的國際武力敵對行為，列強駐華使團最關注的便是各國是否需保持中立原則，以及如何中立的問題？其中與輪船最直接的便是港口封鎖（blockade）和戰時違禁品（contraband of war）的管制——交戰國要求中立國家不得資助交戰國家的運輸措施。"}, {"type": "text", "text": "1884年初清法戰爭期間，清政府準備阻塞廣州口岸，英美國家熱烈討論對他們在廣州的龐大貿易利益該採取怎樣的保護措施，如果中法處於交戰狀態，那麼清廷或廣州當局是否有權利自行關閉條約口岸？因為廣州為條約口岸，其他條約口岸恐將面臨一致的作法。如果中法未正式宣戰，但基於防衛上的必要，那麼中國是否有權利阻塞或自行封鎖條約口岸？此一舉措如果對在條約口岸貿易的國家造成經濟損失，他國是否有權提出抗議？如果中法處於戰爭狀態，那麼各國領事是否應嚴加禁止該國的輪船不得幫忙中法兩國運送貨品，免得有介入戰爭之嫌？這些外交問題使得旗昌與招商局的交易成為清法戰爭時期美國對華政策的一道試金石。"}, {"type": "text", "text": "針對中法危機中的中國條約口岸是否影響外人在華利益問題，美國駐倫敦公使勞威爾（James Russell Lowell, 1819-1891）與英國外交大臣格朗維勒（Granville Leveson-Gower, 2nd Earl"}, {"type": "text", "text": "40 Mr. Young to Mr. Frelinghuysen, Nov. 8, 1883 (received Jan. 9, 1884), FRUS, 1884-1885, p. 46. Mr. Seymour to Mr. Young, Sep. 10, 1883, FRUS, 1884-1885, pp. 46-47. 這次廣東動亂的起源是1883年9月航行於廣州和香港的英船「漢口號」(Hankow)停靠在廣州時發生的一起事件。該船葡籍水手可能是蓄意或意外將一名中國平民推下船，致其溺斃，因而引起廣東人民的忿怒。數名暴民試圖燒掉船隻和碼頭，接著群聚的中國人民大肆破壞廣州沙面的洋人居留區住宅、設施建築和工廠，從新建成的Raven工廠開始，一路破壞掠奪，甚至連廣州英國公使館東側和鄰近的旗昌洋行，也無一倖免。廣州人的憤怒其來有自，因為之前發生的一名喝醉酒的英國公民（叫作Logan）謀殺一名無辜的中國人，廣州人的忿怒尚未平息，接著又發生英船「漢口號」事件，乃有這次的廣東動亂。"}, {"type": "text", "text": "41 Mr. Young to Mr. Frelinghuysen, Aug. 12, 1884, FRUS, 1884-1885, p. 103."}, {"type": "text", "text": "42 19世紀末國際間因為「不宣而戰」導致國際危機不斷，例如：1700-1870年"}, {"type": "text", "text": "間尚發生107次未經宣戰的敵對行為，使得「宣戰」程序愈來愈受重視。迄於20世紀初以前國際間「不宣而戰」仍是普遍現象。1906年「國際法學會」（International Law Association）通過決議，主張國際間非先提出宣戰書或最後通牒，即不得開始戰爭，1907年第二次海牙和平會議正式接納此項主張，制訂《戰爭開始條約》（Convention on the Opening of Hostilities）。丘宏達，《現代國際法》（台北：三民書局，1993年，10版），頁677-694。"}, {"type": "text", "text": "Granville, 1815-1891）為此進行晤談。1884年1月22日，美國國務卿弗裡林海森給美國駐北京公使楊約翰的訓令：「不論法國或中國封閉通商口岸均不得認為正當，惟後者為了必要的保衛而封閉時則另當別論；假若法國絕對同意（而非有條件地）不會攻擊通商口岸，那麼美國政府將對中國阻塞港口的行動提出抗議。當中國政府認為有防衛上的必要而探取此一措施，美國將不提出抗議」 $^{43}$ 。"}, {"type": "text", "text": "美國駐京公使楊約翰給美國務院的報告中，提到兩個立即必須處理的問題："}, {"type": "text", "text": "第一：根據1858年中美簽訂的天津條約第26款，當中國與他國交戰時。美國船隻可以自由出入通商口岸。條約又稱：「倘日後另有別國與中國不和，中國止應禁阻不和之國不准來各口交易，其大合眾國人自往別國貿易，或販運其國之貨物前來各口，中國應認明大合眾國旗號，便准入港」云云。但是關於這一問題牽涉到條約是在1858年訂的，自從那時候起進攻及防禦的方法即發生徹底地改變。美國內戰時將裝載石頭的船隻堵住查理斯敦港（Charleston）的水路，以獲致有效的封鎖。德國最近同法國作戰時，用水雷保護它在波羅的海諸港口。「如果我企圖說服總署說：『德國及美國所認為是光榮的戰爭方法，對中國人是不許可的』的話，我當要感到一些煩惱。」楊約翰提到當時國際法正在改變，美國和普魯士在戰爭時期也曾封鎖港口，希望國務院有明確的主張和指示44。"}, {"type": "text", "text": "第二：中國當局在和平的時候，採取一個交戰行為，來反對友邦的商務；假若我們在廣州容許這個行為的話，這行為將成為封閉中國所有通商口岸的先例。關於這一問題楊約翰擔心總督是一個兩省的地方官，假若容許阻塞廣州而不提出一個迅速的、斷然的抗議的話，那麼現任政府或後來的政府，兩廣總督或其他省分執政者，就沒有理由不可以阻塞或封閉中國所有的通商口岸了。無論如何，他覺得應慎重些，即在向總署做任何表示以前，請美國國務院就他所引用的條款和美國主張的權利問題，做進一步訓示 $^{45}$ 。"}, {"type": "text", "text": "1884年9月中旬，北京外交使團多次詢問總署中法目前是否處於實際戰爭狀態，但總理衙門顯然將使此事定調為「國內事件」（domestic incident），係中國對越南宗主權的問題，因此毋須照會外交使團。然而，清廷總理衙門卻拜託日本領事要日本人千萬不能幫法國人載運燃煤，英美領事也曾收到這樣的請求。在法國方面也表明未正式宣戰，法國總理茹費理（Jules Ferry, 1832-1893）向歐洲各國政要表示中法並未開戰，法國駐上海總領事李梅（Victor-Gabriel Lemaire, 1839-1907）亦對外如此宣稱。然而攻占基隆的法軍卻以中法處於「交戰行為」（belligerent act）而強令阻止德國商船上岸卸貨。這種混亂不明各說各話的情勢，令美國駐華領事感到不知所措。美國駐天津領事詢問國務院是否可准許美國商船為中國運送軍火，駐廈門領事也詢問美國人可否替法國輪船領航。美國公使楊約翰提到德國領事電詢德相俾斯麥（Otto Eduard Leopold von Bismarck, 1815-1898）意見，除非中法正式宣戰，德國領事認為沒有必要履行中立國家的義務。美國公使楊約翰又再次請示國務院美國在華人民在此不悅的戰爭事件中是否應保持明確中立，依他所見除非戰爭狀態存在，否則美國人民沒有保持中立的義務，假如法國或中國希望美國表態中立，應通過他們兩國在華盛頓公使館進行交涉 $^{46}$ 。"}, {"type": "text", "text": "43 Mr. Frelinghuysen to Mr. Young, Jan. 22, 1884, FRUS, 1884-1885, p. 64."}, {"type": "text", "text": "44 Mr. Young to Mr. Frelinghuysen, Feb. 11, 1884, FRUS, 1884-1885, pp. 66-69."}, {"type": "text", "text": "45 Mr. Young to Mr. Frelinghuysen, Feb. 11, 1884, FRUS, 1884-1885, pp. 66-69."}, {"type": "text", "text": "到了10月，英公使巴夏禮（Harry Smith Parkes, 1828-1885）針對清廷禁止英國商民將煤油食物軍火運濟法船一事，表示清廷未將「中法業已開仗一事明布英國朝廷」，而法國駐京公使也表示無開戰之宣示，英商天祥洋行以煤斤濟法自不能視為違犯局外之例，要求清廷准許英國商民得以運煤前往各個口岸，以免有礙商務 $^{47}$ 。基於對中國口岸利益的維護，最後美國國務院的立場與英國一致。7月楊約翰正式照會總署，因法國並未明確主張宣戰一事，福建總督堵塞馬尾口岸，則與條約不合。「中國若非為保護疆土，斷不作此事，以致有損於貿易」。美國國務院更向清廷揭示宣戰程序的重要性意義，「按戰事常例，兩國必於有約之各國，均須先將開仗之事早行聲明，然後可以開仗也」 $^{48}$ 。由此可見，中法衝突究竟屬於國際法上的真正戰爭行為的界定，牽涉到同屬歐美較早進入國際法規範體系的法國，以致西方各國得以採取怎樣相應外交措施，而清廷未正式遞送宣戰照會，就成為攸關各國得在中國繼續合法保有自由出入條約口岸貿易和通商的理由。"}, {"type": "text", "text": "清廷沒有正式宣戰，總理衙門卻照會各國務須嚴守中立，並封鎖中國港口。1884年7月，總署通告美國及各國領事略述諒山之役係法國挑釁，如今法國兵船滋擾中國口岸，以致貿易阻滯，財產損傷，「一切應由法國獨認賠補，絲毫與中國無涉，各國並應禁止各處商民，不得私自接濟軍前一切攻戰食用物件，以守公法」 $^{49}$ 。此外，兩廣總督張之洞曾數次照會葡萄牙駐澳門官員務必嚴守「局外公法」：「貴國與我國和好日久，此次中法戰事，諒必守公法局外之義，凡法船所需米穀牛羊、甜水、煤炭以及軍車軍裝一切應用等物，務不可接濟，以敦友誼」 $^{50}$ 。清廷是否藉此將清法戰爭造成外人在華條約口岸的貿易投資和航行內河等權益完全攤在各國眼前，或許可讓各國干預或進行調停？此一外交謀略，"}, {"type": "text", "text": "46 Legation of United States (Mr. Young) to the Secretary of United States (Mr. Frelinghuysen), Sep. 16, 1884, FRUS, 1884-1885, pp. 103-104."}, {"type": "text", "text": "47〈英國公使巴夏禮照會署〉，光緒10年08月16日；1884-10-04，《總理各國事務衙門檔案》，越南檔，01-24-013-03-013。這份照會也提到英國輪船亦有裝運軍火接濟台灣華軍之事，英國領事「實無權力禁止」。此外，次年（1885年）2月法國曾一度宣布將運往廣州以北的大米作為違禁品，企圖切斷中國漕米的供應，遭到英國反對。因為大部分運送米糧的船隻係懸掛英國國旗，指摘法國此舉違反中立國權利。但法國的禁運並未實施，因戰事不久即告終。關於英國對法國行動的反應，詳見：林學忠，《從萬國公法到公法外交》（上海：上海古籍出版社，2009），頁270-272。美國政府檔案中亦收有法國照會各國駐上海領事代表宣布自2月26日起大米運送為違禁品，美國政府對此亦表抗議。Mr. Young to Mr. Byard, March 13, 1885. “Rice to be considered contraband of war,” FRUS, 1884-1885, p. 161."}, {"type": "text", "text": "史料·光緒朝二》，頁1047。Mr. Young to Mr. Frelinghuysen, Sep. 16, 1884, FRUS, 1884-1885, p. 104."}, {"type": "text", "text": "49 總署致美使楊約翰照會，1884年7月19日（光緒10年閏5月27日）。《中美關係史料·光緒朝二》，頁1043-1044。"}, {"type": "text", "text": "50〈照會澳門羅大臣嚴守局外公法〉，1884年8月24日（光緒10年7月初4日），《張文襄公全集》，引自：《中法戰爭資料》（四），頁438。1885年2月21日，張之洞又照會澳門官府阻止法人借地屯兵，亦援引萬國公法「凡局外之國，均不得在境內准交戰之國招募兵勇，置辦戰具，並不准戰船入口及借地屯兵等事，……深知貴大臣必援公法，自守局外之義，堅持不許」。〈照會澳門羅大臣阻止法人借地屯兵〉，1885年2月21日（光緒11年正月初7日），《張文襄公全集》，引自：《中法戰爭資料》（四），頁441。"}, {"type": "text", "text": "48 總署收美使楊約翰照會，1884年7月29日（光緒10年6月初5），《中美關係"}, {"type": "text", "text": "證諸總理衙門檔案係有此可能。"}, {"type": "text", "text": "清法戰爭進行時日，清廷遲遲未向法國正式宣戰，即使其他各國公使頻頻詢問宣戰之舉。直到1884年8月馬尾海戰後福建水師幾全軍覆滅，1884年8月26日（光緒10年7月初6日）清廷頒發詔令對法國宣戰（對內下詔，但未對外有外交照會）。之後總署再次照會各國飭令其各行各礦商人「不准出售煤斤接濟法國兵船，以守局外之例」 $^{51}$ 。同時，清廷對外宣告保護各國商民，下令閩省「將堵塞水路，保護口岸。所有各國兵商各船自宜暫緩出入」 $^{52}$ 。但是清廷仍未依循西方近代國際社會的宣戰程序——通過法國駐華公使致達正式宣戰照會，並通告各國公使中國向法國宣戰一事。法國一方亦未明示對清宣戰，清法戰爭乃有「不宣而戰」之說 $^{53}$ 。"}, {"type": "text", "text": "清法和談之際，總理衙門曾尋求德國和美國的幫助進行戰事調停。出使德法等國公使的李鳳苞曾向德國代理外相探詢德國是否肯助清攻法或居間協調。德國外相明言德國正因法國在越南和埃及問題以致法國深懼德國趁機報復，甚至因德取回亞爾薩斯和洛林兩省，將不願順服德國之兩省人民驅逐出境，以致邊界人心洶洶，又言「德君衰老，不得不保泰持盈，不願與法有事」。顯然德國不願介入中法問題，恪守局外之分 $^{54}$ 。清廷也自知中國未和其他國家有所謂協約盟友關係，外國自可不必相助。更令清廷擔心的是德國垂涎台灣已久，德國首任駐京公使巴蘭德（Max von Brandt, 1835-1920）又要求內地通商，萬一德國「肯助我而索贗，是直以暴易暴耳。」 $^{55}$ 總理衙門又多次照會美使「中美兩國友誼素最睦」，商請美國居中轉寰，並要求楊約翰親赴上海與法國巴使面商調停 $^{56}$ 。法國方面顯然不接受美使的調停，李鳳苞函文中提到「惟調停者不宜請美國，因係民主，且歐洲各國不喜其干預也」 $^{57}$ 。法國果以「礙難允准」回復美國，和局無可再商 $^{58}$ 。"}, {"type": "text", "text": "51〈請飭各行商不得接濟法船煤斤〉，1884年8月28日（光緒10年7月8日）。出自：廣西師範大學出版社編，《中美往來照會集，1846-1931》（桂林：廣西師範大學出版社，2006），第6冊，頁346。此份文件亦即美國國家檔案館1996年出版之Selected Records of the U.S. Legation in China, 1849-1931. 編號T898，共20卷之微卷影本。"}, {"type": "text", "text": "54 出使大臣李鳳苞函總署，1884年10月20日（光緒10年09月02日），《總理各國事務衙門檔案》，01-24-014-4-012。李鳳苞為出使德國、法國、奧國、荷蘭、義大利公使。"}, {"type": "text", "text": "55 出使大臣李鳳苞函總署抄檔，諭旨飭鳳苞，1884年10月20日（光緒10年09月02日），《總理各國事務衙門檔案》，01-24-014-4-012。"}, {"type": "text", "text": "52〈閩省將堵塞水路兵商船暫緩出入〉，1884年8月27日（光緒10年7月7日），〈因法人渝盟沿海各省督撫奉旨一律保護各國商民〉，1884年9月3日（光緒10年7月14日）。廣西師範大學出版社編，《中美往來照會集，1846-1931》，第6冊，頁347、348。"}, {"type": "text", "text": "56 這篇函電中提到楊約翰的善意「我兩國友誼素最睦，無論何事何時，如有關中國強盛及致與天下相和之處，本館自必樂於為之盡力也」。總署收美使楊約翰照會，1884年8月15日（光緒10年6月25日），《中美關係史料·光緒朝二》，頁1056。Jules Davids ed., American Diplomatic and Public Papers, Series 2: The United States, China, and Imperial Rivalries, 1861-1893. Vol. 6, The French-China War. pp. 231-232."}, {"type": "text", "text": "53〈光緒十年對法宣戰詔書〉（光緒10年7月初6日），上論·光緒皇帝。引用文獻見：https://zh.wikisource.org/zh-hant/。法國對於「不宣而戰」的見解，詳見：Lewis M. Chere, The Diplomacy of the Sino-French War, 1883-1885: Global Complications of an Undeclared War (Notre Dame, Ind: Cross Cultural Publications, Cross Roads Books. 1988)."}, {"type": "text", "text": "57 出使大臣李鳳苞函總署，1884年10月20日（光緒10年09月02日），《總理各國事務衙門檔案》，01-24-014-4-012。"}, {"type": "text", "text": "58 總署致美使楊約翰照會，1884年8月18日（光緒10年6月28日），《中美關係史料·光緒朝二》，頁1057。Jules Davids ed., American Diplomatic and"}, {"type": "text", "text": "四、招商局收回輪船——「正當交易」風波"}, {"type": "text", "text": "美國駐京公使楊約翰當然理解到上述清法戰爭時期西方各國對「宣戰」或中立國家應採取怎樣的國際法相應措施。特別是美國南北內戰結束後，1872年阿拉巴馬仲裁案（The Alabama Claims Arbitration）的結果引起歐美各國矚目。緣於美國內戰期間，南部邦聯在英國利物浦建造了一艘名叫「阿拉巴馬」的戰艦，該船在內戰期間充當搜捕艦，擊毀多艘北方商船。戰後美國聯邦政府就阿拉巴馬號和其他戰艦擊毀美國多艘船舶所造成的損失向英國提出賠償請求。1871年英美兩國訂立《華盛頓條約》（Treaty of Washington），將該案提交設於日內瓦的仲裁法庭裁決。仲裁結果認定英國對於國際法的中立國家義務未能盡到「相當注意」，並應向美國支付1,550萬美元的金幣作為損害賠償。阿拉巴馬仲裁案的重要性在於促成日後歐美各國在戰爭期間遵守有關中立國家的義務規則所適用的國際法依據之必要性，更引導了1899和1907年兩次海牙保和會對戰爭國際法的重視。為此，美國政府還編印了一份厚達五百五十餘頁相關檔案文件以昭後世 $^{59}$ 。阿拉巴馬號事件在當時轟動國際社會，甚至連清政府官員恭親王奕訢都知悉此事 $^{60}$ ，儘管內戰和國際戰爭的情況有所不同，但都攸關戰爭期間中立國家的行為義務及其國際法適法原則，美國國務院官員和外交官對此不可能不有警惕。美國駐京公使楊約翰於1885年5月卸任公使不久，招商局要買回旗昌洋行的這批輪船時，在美國方面引起不少困擾和爭議。美國國務院如何看待此事，參與其事的駐華使領又如何自圓其說，此事亦引起在華外人的討論。在中法交戰之際，它屬於「正當交易」（bona fide transaction）嗎？如果它是一樁假買賣而美國政府知情的話，這種行為是否得當？"}, {"type": "text", "text": "1885年6月9日《中法新約》簽訂，清法戰爭結束。李鴻章和盛宣懷等早在該年4月間即積極籌思收回招商局船業。清政府本來盤算的即是商局輪船棧房碼頭售與美商旗昌洋行「代為經管事，定仍當照議收回」 $^{61}$ 。4月23日會見旗昌船東士米德（C.V.Smith，生卒不詳）預籌此事，雙方於6月6日議定擬於6月21日起換旗換契，船隻有去上海較遠而不及調回者，即在別埠換旗。至7月初1日將輪船棧房碼頭各項產業悉照原盤收回，仍歸商局員董自辦。「旗昌原給銀票依舊付還，其原立售契密約帶回上海，於各項收清後，彼此交還銷廢。至旗昌代商局墊付款項帳目亦即分別核算清結」。旗昌洋行看似保有義氣，力踐前約，實則船東士米德由招商局以5千兩的年薪僱用為總查董事三年「遇事相助」，「以資酬答，期滿後或去或留，悉聽局中眾商主持，不致再有轅轎」 $^{62}$ 。"}, {"type": "text", "text": "Public Papers, The French-China War. pp. 92-93. 關於清法戰爭期間美國的調停，另可參見：Robert Hopkins Miller, United States and Vietnam, 1787-1941 (Washington, DC: National Defense University Press, 1990), pp. 102-103."}, {"type": "text", "text": "巴馬號事件發生時，美國駐華公使蒲安臣（Anson Burlingame）曾致函給總理衙門表示，由於阿拉巴馬號船艦在太平洋攻擊和掠奪聯邦政府的商船，希望清政府勿要讓該艦停靠在中國口岸。恭親王不僅答應，而且表示美國內戰的情況如同當時的太平軍叛亂，美國的處境和清政府非常相似，自當樂意配合美國的要求。"}, {"type": "tex
