理工學院珍藏手稿圖書館、瑞士日內瓦聯合國檔案館等地蒐集原始文件和書信。這些多元檔案資料的利用，是充實本書最根本的研究地基。"}, {"type": "text", "text": "本書的完成也得益於諸多師長和學術同好的鼓勵，首先必須感謝的是提供本書資料、提供意見或協助訪問的師友，包括：李達嘉、張力、王成勉、康培德、吳淑鳳、楊雨青、林玉茹、朱嘉明、金光耀、唐啟華、王建朗、臧運祜、朱蔭貴、胡成、馬軍、馬建標、應俊豪、洪紹洋、蔡維屏、皇甫秋實、張志雲、張岩、Neil Rollings、Pierre Eichenberger、Katja Schmidtpott、Jan Schmidt、Alain Beltran等諸君的協助。這些年來研究助理們的鼎力協助，特別是洪才登、王鵬竣、陳頌閔、林晉葳、陳穎毅、張祐融、王麒瑋等諸位同學，還有就讀師大博士班的陳鴻明同學提供陳光甫的資料，在此表達謝意。本書各章節的部分內容曾以中英文發表於國內外期刊；然而作為專書寫作，本書各章節與單篇論文在架構和書寫文脈上已迥然不同，幾乎是全面改寫；特別是本書第二部分的內容擴充，與發表過的專文字數相較達三倍之多。一些研究觀點和想法也受益於匿名審查者提供的寶貴意見，在此致上作者十二萬分之謝愜。本書各章前言對既有成果詳加描述，雖然有些朋友建議為使本書更具普及意義，或許可予以刪除，但作者認為文獻回顧是對前人研究成果的肯定。本書儘管主要利用一手材料，但對於某一論點若為前人所發明，則不敢掠人之美；將來我們的研究可能只是別人研究中的某個腳註而已，先行者的研究貢獻有必要載入文獻徵引，予以厚道誠懇的評述。這些議題的文獻回顧，希望也能對後來者從事相關議題有按圖索驥之用。"}, {"type": "text", "text": "數年前筆者受法國科學研究國家中心（National Center for Scientific Research）研究部主任阿藍·貝爾特蘭（Alain Beltran）教授邀請，赴巴黎參加石油史國際會議，當年會議主題是「石油與戰爭」（Oil and War），這次會議讓筆者更加體認石油作為全球史的國際視野。筆者提交的論文從「企業、政府與中日戰爭」的連繫點，這篇英文文章發表於重要學術期刊《美國東亞關係》（Journal of American-East Asian Relations, 19: 2012）亦即本書第八章的最早版本，這次經改寫後納入專書一章。在探討《美國對華貿易法案》問題時，筆者面臨到一些關鍵問題，必須求教於研究美國海外經濟史聲譽卓著的蜜拉·威爾金斯，老教授已年近九十歲，對我提出的問題竟然寫了二千餘字的回信。筆者在2018年世界經濟史會議與她僅有一面之緣，她的解惑展現了大師級學者對知識的純然好奇與執著，予筆者莫大的鼓舞。筆者在探討美國海外企業擴展史的學思之路中，威爾金斯教授的系列專書是啟發我走入美國跨國企業史最具關鍵的書，在此向她致意。此外，特別感謝香港大學徐國琦教授，因為彼此都是從事中美關係的同好，他在國際史方面的研究視角於我個人受益甚大。我因藉他出版的兩本英文書，撰述兩篇長文，探索從方法論上如何研究國際史和中美關係史而照見自己的困惑；作為教學者深深感受到不能在方法和觀念上固守原地，但同時也不能失卻歷史學者對材料的不停挖掘、解讀和廣開視域的自我規範。感謝學術伴侶政治大學彭明輝教授（吳鳴）對我在歷史書寫上力求文字流暢的鞭策，本書書名是我反覆思量下的取捨決定，因最契合筆者所關懷的題旨，然而適是他最不欣賞的雙截棍方式（二段標題），在此只好做此申明。"}, {"type": "text", "text": "我曾任教的國立東華大學歷史系和目前服務的國立師範大學歷史系，都提供了筆者一個自由和諧的學術條件和環境，在此深致謝意。在大學任教多年，除了擔任了自己最專長的中美關係史專題課程，還同時開授了歷史系的美國史、中國近代史和世界文明史，是教學生涯的一大奇緣。初執教席時，備課頗感辛苦，但多年積累下來，令人得以悠游東西文明世界，暢讀天下奇書。一些看似奇妙跳躍的課程因緣，成就了萬事互相效力，讓自己深感宇宙知識之浩瀚、個人能力的局限，即使傾一生之力，也只是渺滄海之一粟，寄蜉蝣於天地罷了；甚且在這變動不居的時代，一本書的研究取徑和傳遞的想法，可能不到十年很快就被汰換了。然而，人文學者莫非是這種「知其不可而為之」的純真追尋，始能一步步地堅持下去。"}, {"type": "text", "text": "1996年返回花蓮故鄉任教之時，當時各種研究資訊和圖書資料在偏鄉學校取得不易，恩師張玉法院士嘗以書信鼓舞，喻野地中必有芬芳的花朵，為鼓勵弟子在山中好好修行練功，老師和師母還在百忙之中親自走訪了我任教的花蓮師範學院。遠在溫哥華的杜維運教授和師母孫雅明女士則視我如家人，杜公時時賜我充滿鼓勵文字的典雅翰墨，如今杜公已仙逝多年，杜師母時時捎來充滿開朗豁達的人生話語，令我受用無窮。本書撰寫的最後階段，2018年3月初家父不幸病逝，父親對我的疼愛、包容和鼓勵，始終是我人生之路的最大支柱，父親掛在我斗室書房的書法條幅「世界無窮願無盡，海天寥廓立多時」，在夜深人靜時總是警醒和激勵我必須持續向前，更不能懷憂喪志。書稿完成之際，與在天河彼岸的父親心靈上最為相通，無限思念化為生命恩典的記號。謹將本書獻給摯愛的父親吳福隆先生（1931.9.24-2018.3.3）。"}, {"type": "text", "text": "吴翎君 2019年12月24日"}, {"type": "text", "text": "《美國人未竟的中國夢：企業、技術與關係網》曾發表之相關資訊"}, {"type": "text", "text": "本專書原為科技部學術專書寫作計畫之成果，計畫名稱為：「中國和美國——企業、技術與關係網」，各章曾以論文發表之相關資訊如下："}, {"type": "text", "text": "電子信箱：linking@udngroup.com"}, {"type": "text", "text": "行政院新聞局出版事業登記證局版臺業字第0130號"}, {"type": "text", "text": "聯經網址：www.linkingbooks.com.tw"}, {"type": "text", "text": "國家圖書館出版品預行編目資料"}, {"type": "text", "text": "美國人未竟的中國夢：企業、技術與關係網/吳翎君著。"}, {"type": "text", "text": "初版．新北市．聯經．2020年6月．504面．14.8×21公分"}, {"type": "text", "text": "ISBN 978-957-08-5522-7（精裝）"}, {"type": "text", "text": "1.國際經濟關係 2.中美關係 3.美國外交政策"}]}];

// Build a search index once: for each section, for each para, keep en+zh text
let searchIndex = null;
function buildSearchIndex(){
  searchIndex = EN.map(sec=>{
    const zsec = ZH.find(x=>x.id===sec.id) || {paras:[]};
    const zhMap = {};
    zsec.paras.forEach((z,i)=>zhMap[i]=z&&z.text?z.text:'');
    const items = sec.paras.map((p,i)=>{
      const en = (typeof p==='object'?p.text:p)||'';
      const zh = zhMap[i]||'';
      return {i, en, zh, type:(typeof p==='object'?p.type:'text')};
    });
    return {id:sec.id, title:secTitle(sec.id), items};
  });
}
function countMatches(q, text){
  if(!q || !text) return 0;
  let c=0, idx=text.toLowerCase().indexOf(q.toLowerCase());
  while(idx!==-1){ c++; idx=text.toLowerCase().indexOf(q.toLowerCase(), idx+q.length); }
  return c;
}
function highlight(text, q){
  if(!q) return esc(text);
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  let out='', last=0, idx=lower.indexOf(ql);
  while(idx!==-1){
    out += esc(text.slice(last,idx)) + `<mark>${esc(text.slice(idx,idx+ql.length))}</mark>`;
    last = idx+ql.length;
    idx = lower.indexOf(ql, last);
  }
  out += esc(text.slice(last));
  return out;
}
function snippet(text, q, maxLen){
  maxLen = maxLen||120;
  if(!q) return (text.length>maxLen? text.slice(0,maxLen)+'…': text);
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  let pos = lower.indexOf(ql);
  if(pos===-1) pos = 0;
  else pos = Math.max(0, pos - maxLen/3);
  let s = text.slice(pos, pos+maxLen);
  return (pos>0?'…':'')+s+(pos+maxLen<text.length?'…':'');
}
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchTimer=null, searchOpen=false;
function closeSearch(onClicking){
  searchOpen=false;
  searchResults.classList.remove('open');
  if(!onClicking) searchInput.blur();
}
function runSearch(){
  const q = searchInput.value.trim();
  if(!q){ closeSearch(); return; }
  if(!searchIndex) buildSearchIndex();
  // gather matches across all sections, cap overall
  const MAX_TOTAL = 60, PER_SEC = 14;
  let results = [], total=0;
  for(const sec of searchIndex){
    if(total>=MAX_TOTAL) break;
    let hit={sec, items:[]};
    for(const it of sec.items){
      const cm = countMatches(q, it.en);
      const cz = countMatches(q, it.zh);
      if(cm||cz){ hit.items.push(it); }
      if(hit.items.length>=PER_SEC){ break; }
    }
    total += hit.items.length;
    if(hit.items.length) results.push(hit);
  }
  searchResults.innerHTML='';
  if(!results.length){
    searchResults.innerHTML = '<div class="sr-empty">未找到相关内容</div>';
  } else {
    const head=document.createElement('div');
    head.className='sr-head';
    head.textContent = `${total} 处匹配 · ${q}`;
    searchResults.appendChild(head);
    results.forEach((hit,k)=>{
      // section header row
      const sh=document.createElement('div');
      sh.className='sr-item';
      sh.style.cursor='default';
      sh.innerHTML = `<div class="sr-meta" style="font-size:11.5px;color:var(--accent);font-weight:600">▸ ${esc(hit.sec.title)}</div>`;
      searchResults.appendChild(sh);
      hit.items.forEach((it)=>{
        const row=document.createElement('div');
        row.className='sr-item';
        row.innerHTML =
          `<div class="sr-meta"><b>${esc(hit.sec.title)}</b> · 段 ${it.i+1}</div>` +
          `<div class="sr-text">${highlight(snippet(it.en,q),q)}</div>` +
          (it.zh?`<div class="sr-text" style="color:#6a6044">${highlight(snippet(it.zh,q),q)}</div>`:'');
        row.addEventListener('click',(ev)=>{ ev.stopPropagation(); openResult(hit.sec.id, it.i); });
        searchResults.appendChild(row);
      });
    });
  }
  searchResults.classList.add('open');
  searchOpen=true;
}
function openResult(sectionId, paraIdx){
  closeSearch(true);
  goTo(sectionId);
  // align both scroll containers to that paragraph (滚动定位，不加整段高亮)
  setTimeout(()=>{
    ['en','zh'].forEach(lang=>{
      const pair = colPair(lang);
      const top = paraScrollTop(pair, paraIdx);
      if(top !== null){
        pair.scroll.scrollTop = Math.max(0, top);
      }
    });
  }, 30);
}

/* ============ Scroll sync: scrolling one column precisely parks the
   other column on the SAME paragraph (matched by data-i) ============ */
// Pairs of (scroll container, content container) for each column.
// In the real layout the SCROLL container is the <section class="col">
// (overflow-y:auto); the <div id="article-*"> is just content inside it.
function colPair(lang){
  return {
    scroll: document.getElementById(lang==='en'?'scroll-en':'scroll-zh'),
    content: document.getElementById(lang==='en'?'article-en':'article-zh')
  };
}
// Height of the sticky column header (so a paragraph's first line isn't hidden under it).
function headerOff(pair){
  var h = pair.scroll.querySelector('.col-head');
  if(!h) return 0;
  try{
    var cs = getComputedStyle(h).position;
    if(cs==='sticky' || cs==='fixed') return h.offsetHeight;
  }catch(e){}
  return 0;
}
// Absolute top (in scroll pixels) of a paragraph within its scroll container.
function paraScrollTop(pair, i){
  var tgt = pair.content.querySelector('[data-i="'+i+'"]');
  if(!tgt) return null;
  var sRect = pair.scroll.getBoundingClientRect();
  var pRect = tgt.getBoundingClientRect();
  // Align the paragraph's FIRST LINE just below the sticky header (so it's visible),
  // instead of tucking it underneath and showing later lines.
  return (pRect.top - sRect.top) + pair.scroll.scrollTop - headerOff(pair);
}
// Index of the paragraph currently at the top area of the scroll container.
// 平滑滚动到目标列（用于句级对齐时把对侧滚到对应句所在段）。
var animActive = false;  // 是否正在播放平滑滚动动画
var animCancel = null;   // 取消动画的令牌
var SAVED_POS = null;    // last reading position (section + both scroll tops)

// Smoothly scroll a column to targetTop.
function smoothGoto(scrollEl, targetTop){
  var start = scrollEl.scrollTop;
  var delta = Math.max(0, targetTop) - start;
  if(Math.abs(delta) < 3){ return; }
  if(animCancel) animCancel.cancelled = true;
  var tok = {cancelled:false}; animCancel = tok;
  animActive = true;
  var dur = Math.min(280, 150 + Math.abs(delta)*0.05);
  var t0 = null;
  function step(ts){
    if(tok.cancelled){ animActive = false; return; }
    if(t0 === null) t0 = ts;
    var p = Math.min(1, (ts - t0)/dur);
    var ease = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
    scrollEl.scrollTop = start + delta*ease;
    if(p < 1){ requestAnimationFrame(step); }
    else { animActive = false; animCancel = null; }
  }
  requestAnimationFrame(step);
}
// 仅滚动目标列到该段（不加整段高亮），用于句级对齐时只突出对应句
function scrollToPara(otherLang, i){
  var other = colPair(otherLang);
  var top = paraScrollTop(other, i);
  if(top === null) return;
  smoothGoto(other.scroll, top);
}

var BOOK_KEY = 'readerhub_notes_american-dream-unfinished';

function loadNotes(){ try{ return JSON.parse(localStorage.getItem(BOOK_KEY))||[]; }catch(e){ return []; } }
function saveNotes(){ try{ localStorage.setItem(BOOK_KEY, JSON.stringify(NOTES)); }catch(e){ showToast('笔记保存失败'); } }
function articleFor(lang){ return document.getElementById(lang==='en'?'article-en':'article-zh'); }
function escText(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* 重新渲染一个段落的标记（textContent 是原始未标记文本，稳定） */

var TEMP = null;   // 当前本栏选中句 {lang,i,from,to}
var PEER = null;   // 当前跨语言对应句高亮 {lang,i,ranges:[[s,e],...]}

/* 底层按句号切分一段文本（不用于展示，仅用于定位"选中的那一句"） */
function splitSentences(text){
  // 底层按句末标点切分（不用于展示）；支持中英文句末标点 + 紧随的引号/括号
  text=String(text);
  var list=[], start=0, i;
  function flush(end){ var t=text.slice(start,end); if(t){ list.push({start:start,end:end,text:t}); } start=end; }
  for(i=0;i<text.length;i++){
    var c=text[i];
    if('.!?；。！？…'.indexOf(c)>=0){
      var j=i+1;
      while(j<text.length && /[\"''””』」）)\]’”]/.test(text[j])) j++;
      flush(j); i=j-1;
    }
  }
  if(start<text.length) flush(text.length);
  return list;
}
var __SENT_CACHE = {};
function sentsFor(lang,i){
  var key=lang+':'+i;
  if(__SENT_CACHE[key]) return __SENT_CACHE[key];
  var el=articleFor(lang).querySelector('[data-i="'+i+'"]');
  var list = el ? splitSentences(el.textContent) : [];
  __SENT_CACHE[key]=list;
  return list;
}
function sentenceAt(lang, i, from){
  var list=sentsFor(lang,i);
  for(var k=0;k<list.length;k++){ if(from>=list[k].start && from<=list[k].end){ return list[k]; } }
  for(var j=list.length-1;j>=0;j--){ if(list[j].start<=from){ return list[j]; } }
  return list[0];
}

/* 清除所有临时句子高亮 + 跨语言对应高亮 */
function clearTempHL(){
  TEMP=null; PEER=null;
  var marks=document.querySelectorAll('.senthl,.peer-sent');
  for(var k=0;k<marks.length;k++){ var p=marks[k].closest('[data-i]'); if(p) renderMarks(p); }
}
function renderMarks(el){
  if(!el || el.getAttribute('data-i')==null) return;
  var lang=el.getAttribute('data-lang'), i=el.getAttribute('data-i');
  var list=NOTES.filter(function(n){return n.lang===lang && n.i===+i;})
                .sort(function(a,b){return a.from-b.from;});
  var text=el.textContent, html='', pos=0;
  list.forEach(function(n){
    var f=Math.max(pos,n.from), t=Math.min(text.length,n.to);
    if(f>pos) html+=escText(text.slice(pos,f));
    if(t>f){
      if(n.type==='hl') html+='<mark class="hlmark" style="background:'+n.color+'">'+escText(text.slice(f,t))+'</mark>';
      else html+='<u class="ulnote">'+escText(text.slice(f,t))+'</u>';
    }
    pos=Math.max(pos,t);
  });
  // 临时句子高亮（本栏选中句，可叠加在持久标记之上）
  if(TEMP && TEMP.lang===lang && TEMP.i===+i){
    var f=Math.max(pos,TEMP.from), t=Math.min(text.length,TEMP.to);
    if(f>pos) html+=escText(text.slice(pos,f));
    if(t>f) html+='<mark class="senthl">'+escText(text.slice(f,t))+'</mark>';
    pos=Math.max(pos,t);
  }
  // 跨语言对应句高亮（另一栏对齐到的那些句）
  if(PEER && PEER.lang===lang && PEER.i===+i){
    var pr=PEER.ranges.slice().sort(function(a,b){return a[0]-b[0];});
    pr.forEach(function(rg){
      var f=Math.max(pos,rg[0]), t=Math.min(text.length,rg[1]);
      if(f>pos) html+=escText(text.slice(pos,f));
      if(t>f) html+='<mark class="peer-sent">'+escText(text.slice(f,t))+'</mark>';
      pos=Math.max(pos,t);
    });
  }
  if(pos<text.length) html+=escText(text.slice(pos));
  el.innerHTML=html;
}
function renderAllMarks(){
  ['en','zh'].forEach(function(lang){
    var art=articleFor(lang);
    if(!art) return;
    var set={};
    NOTES.forEach(function(n){ if(n.lang===lang) set[n.i]=1; });
    for(var k in set){ var el=art.querySelector('[data-i="'+k+'"]'); if(el) renderMarks(el); }
  });
}

/* 点 (node,off) 在段落内的字符偏移（用 Range 计文本长度，自然兼容嵌套 mark） */
function pointOffsetInPara(para, node, off){
  try{
    var r=document.createRange();
    r.selectNodeContents(para);
    r.setEnd(node, off);
    return r.toString().length;
  }catch(e){ return 0; }
}

/* 从当前选区构建一条笔记；要求选区落在同一段内 */
function buildNote(){
  var sel=window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return null;
  var r=sel.getRangeAt(0);
  var root=r.commonAncestorContainer.nodeType===1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  var lang = root.closest('#article-en') ? 'en' : (root.closest('#article-zh') ? 'zh' : null);
  if(!lang) return null;
  var startPara=r.startContainer.nodeType===3 ? r.startContainer.parentElement : r.startContainer.closest('[data-i]');
  var endPara=r.endContainer.nodeType===3 ? r.endContainer.parentElement : r.endContainer.closest('[data-i]');
  if(!startPara || !endPara || startPara!==endPara) return null;
  var a=pointOffsetInPara(startPara, r.startContainer, r.startOffset);
  var b=pointOffsetInPara(endPara, r.endContainer, r.endOffset);
  var from=Math.min(a,b), to=Math.max(a,b);
  if(to-from<=0) return null;
  return {lang:lang, i:+startPara.getAttribute('data-i'), from:from, to:to,
          text:startPara.textContent.slice(from,to)};
}

/* 工具栏显隐 */
function moveNoteToolbar(){
  var sel=window.getSelection(), tb=document.getElementById('note-toolbar');
  if(!sel.rangeCount||sel.isCollapsed){ tb.style.display='none'; return; }
  var r=sel.getRangeAt(0), rect=r.getBoundingClientRect();
  tb.style.left=Math.max(8, Math.min(window.innerWidth-tb.offsetWidth-8, rect.left+rect.width/2-tb.offsetWidth/2))+'px';
  tb.style.top=Math.max(8, rect.top-tb.offsetHeight-10)+'px';
  tb.style.display='flex';
}
function hideToolbar(){ var tb=document.getElementById('note-toolbar'); if(tb) tb.style.display='none'; }

function bindToolbar(){
  var tb=document.getElementById('note-toolbar');
  HL_COLORS.forEach(function(c){
    var b=document.createElement('span');
    b.title='高亮·'+c.name; b.className='nt hlc'; b.style.background=c.hex;
    (function(hex){ b.onmousedown=function(ev){ ev.preventDefault(); applyNote('hl',hex); }; })(c.hex);
    tb.appendChild(b);
  });
  var ul=document.createElement('span');
  ul.title='画线'; ul.textContent='划线'; ul.className='nt ul';
  ul.onmousedown=function(ev){ ev.preventDefault(); applyNote('ul',null); };
  tb.appendChild(ul);
  var cp=document.createElement('span');
  cp.title='复制选中内容'; cp.textContent='复制'; cp.className='nt cpy';
  cp.onmousedown=function(ev){ ev.preventDefault(); copySelection(); };
  tb.appendChild(cp);
}
function copySelection(){
  var sel=window.getSelection();
  var txt = (sel && !sel.isCollapsed) ? sel.toString()
          : (TEMP ? currentSentenceText() : '');
  if(!txt){ showToast('没有可复制的内容'); return; }
  var ok=false;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ showToast('已复制 '+txt.length+' 字'); },
      function(){ fallbackCopy(txt); });
    ok=true;
  } else { fallbackCopy(txt); }
  if(ok) window.getSelection().removeAllRanges();
  hideToolbar();
}
function currentSentenceText(){
  if(!TEMP) return '';
  var el=articleFor(TEMP.lang).querySelector('[data-i="'+TEMP.i+'"]');
  return el ? el.textContent.slice(TEMP.from,TEMP.to) : '';
}
function fallbackCopy(txt){
  try{
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('已复制 '+txt.length+' 字');
  }catch(e){ showToast('复制失败'); }
}

function applyNote(type,color){
  var note=buildNote();
  window.getSelection().removeAllRanges();
  hideToolbar();
  if(!note){ showToast('请在同一段内选择文字'); return; }
  if(type==='ul'){ note.type='ul'; note.color=null; }
  else { note.type='hl'; note.color=color||HL_COLORS[0].hex; }
  var idx=findNoteIndex(note);
  if(idx>=0) NOTES.splice(idx,1);
  NOTES.push(note);
  saveNotes();
  var el=articleFor(note.lang).querySelector('[data-i="'+note.i+'"]');
  if(el) renderMarks(el);
  showToast((type==='ul'?'已划线':'已高亮'+(colorName(note.color)||''))+'，已保存到笔记');
  refreshPanel();
}
function findNoteIndex(n){
  for(var i=0;i<NOTES.length;i++){ var x=NOTES[i];
    if(x.lang===n.lang&&x.i===n.i&&x.from===n.from&&x.to===n.to) return i; }
  return -1;
}
function colorName(hex){ var r=''; HL_COLORS.forEach(function(c){ if(c.hex===hex) r=c.name; }); return r; }
function noteText(n){
  var el=articleFor(n.lang).querySelector('[data-i="'+n.i+'"]');
  return el? el.textContent.slice(n.from,n.to) : '';
}

/* 笔记面板 */
function togglePanel(){
  var p=document.getElementById('note-panel');
  p.classList.toggle('np-open');
  if(p.classList.contains('np-open')) refreshPanel();
}
function refreshPanel(){
  var p=document.getElementById('note-panel');
  var html='<div class="np-head"><b>📝 我的笔记 ('+NOTES.length+')</b><span>';
  html+='<button id="np-clear" style="color:#c0392b">清除全部</button> <button id="np-close" style="color:var(--accent)">关闭</button></span></div>';
  if(!NOTES.length) html+='<div class="np-empty">还没有笔记。<br>在正文里选中文字，即可「高亮」或「划线」。</div>';
  else{
    var shown={};
    for(var i=NOTES.length-1;i>=0;i--){
      var n=NOTES[i];
      var key=n.lang+':'+n.i;
      shown[key]=(shown[key]||0)+1;
      if(shown[key]>1) continue;           // 同一段只列一条（可合并）
      var t=noteText(n)||'…';
      var lang=n.lang==='en'?'英':'中';
      var mark=n.type==='hl'
        ? '<span style="background:'+n.color+'">&nbsp;&nbsp;&nbsp;</span>'
        : '<span style="text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#e8504a">&nbsp;&nbsp;&nbsp;</span>';
      html+='<div class="np-item" data-lang="'+n.lang+'" data-i="'+n.i+'">'
           +'<div class="np-meta"><b>段 '+n.i+'</b><span style="color:var(--mute)">'+lang+'</span>'+mark
           +(n.type==='ul'?'<span style="font-size:10px;color:#888">划线</span>':'<span style="font-size:10px;color:#888">高亮</span>')
           +'</div><div class="np-text">'+escText(t)+'</div></div>';
    }
  }
  p.innerHTML=html;
}
function clearAllNotes(){
  var b=document.createElement('button');
  b.style.cssText='background:none;border:none;color:#c0392b;cursor:pointer;font-size:13px;padding:2px 6px';
  b.textContent='确认全部清除？'; b.id='np-clear-act';
  b.onclick=function(){
    NOTES=[]; saveNotes(); renderAllMarks(); refreshPanel(); showToast('已清除全部笔记');
  };
  var old=document.getElementById('np-clear-act'); if(old) old.remove();
  document.getElementById('np-clear').replaceWith(b);
  setTimeout(function(){ var x=document.getElementById('np-clear-act'); if(x){ x.textContent='清除全部'; x.style.cssText=''; x.onclick=function(){refreshPanel();}; } },2500);
}
function showToast(msg){
  var t=document.getElementById('note-toast');
  t.textContent=msg; t.classList.add('nt-show');
  clearTimeout(t.__t);
  t.__t=setTimeout(function(){ t.classList.remove('nt-show'); },1700);
}

/* 选中句子 → 自动高亮本句（本语言）+ 跨语言对应段落 */



var SENT_ALIGN={};
// 定位位置 pos 落在哪一句（offs 是 [[s,e],...] 按序）
function sentIdxAt(offs, pos){
  if(!offs) return -1;
  for(var k=0;k<offs.length;k++){ if(pos>=offs[k][0] && pos<=offs[k][1]) return k; }
  for(var j=offs.length-1;j>=0;j--){ if(offs[j][0]<=pos) return j; }
  return -1;
}
function applySentenceSel(){
  var sel=window.getSelection();
  // 先清除旧的临时高亮
  clearTempHL();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return;
  var r=sel.getRangeAt(0);
  var node=r.startContainer, startPara=node.nodeType===3?node.parentElement:node.closest('[data-i]');
  var endNode=r.endContainer, endPara=endNode.nodeType===3?endNode.parentElement:endNode.closest('[data-i]');
  if(!startPara || !endPara || startPara!==endPara) return;
  var lang = startPara.getAttribute('data-lang');
  if(lang!=='en' && lang!=='zh') return;
  var i=+startPara.getAttribute('data-i');
  var a=pointOffsetInPara(startPara, r.startContainer, r.startOffset);
  var b=pointOffsetInPara(startPara, r.endContainer, r.endOffset);
  var from=Math.min(a,b), to=Math.max(a,b);
  var peerLang = lang==='en'?'zh':'en';
  var peerPara=articleFor(peerLang).querySelector('[data-i="'+i+'"]');
  // 句级对齐数据：以"当前章节/段落号"为键
  var entry = (typeof SENT_ALIGN!=='undefined' && SENT_ALIGN) ? SENT_ALIGN[current+'/'+i] : null;
  if(entry && entry[lang] && entry[peerLang] && peerPara){
    var si = sentIdxAt(entry[lang], from);
    if(si!==-1){
      // 本栏整句（用于复制）
      TEMP={lang:lang, i:i, from:entry[lang][si][0], to:entry[lang][si][1]};
      // 找对齐到这句的对侧句子
      var tr=[];
      var m=entry.m||[];
      for(var k=0;k<m.length;k++){
        var src = (lang==='en')?m[k][0]:m[k][1];
        var dst = (lang==='en')?m[k][1]:m[k][0];
        if(src===si && entry[peerLang][dst]) tr.push(entry[peerLang][dst]);
      }
      if(!tr.length && entry[peerLang][si]) tr.push(entry[peerLang][si]);
      if(tr.length){
        PEER={lang:peerLang, i:i, ranges:tr};
        renderMarks(peerPara);           // 在另一栏画出对应句高亮
        scrollToPara(peerLang, i);       // 滚动对侧栏到对应句所在段
        var pm=peerPara.querySelector('.peer-sent');
        if(pm){ try{ pm.scrollIntoView({block:'center'}); }catch(e){} }
      }
      return;
    }
  }
  // 没有句级对齐数据：不整段高亮，仅记录来源选区（跨栏联动仅依赖句子对应）。
  // 注意：不重建本栏段落 DOM，以免破坏当前选区（「高亮/划线」笔记按钮依赖选区）。
}

/* 初始化与事件 */
(function(){
  bindToolbar();
  var open=document.getElementById('note-open');
  open.onclick=function(){ togglePanel(); };

  function onPickLang(){
    setTimeout(moveNoteToolbar, 30);
    setTimeout(applySentenceSel, 60);       // 自动句子高亮 + 跨语言对应（延迟保证选择已完成）
  }
  document.addEventListener('mouseup', onPickLang, false);
  // 移动端：触摸抬起后同样触发句子对应（iOS/安卓拖选文字不总抛 mouseup）
  document.addEventListener('touchend', function(e){
    if(!e.target || !e.target.closest) return;
    if(e.target.closest('#note-toolbar,#note-panel,.makenote,.nt,#soverlay')) return;  // 忽略工具按钮点击
    clearTimeout(window.__pickT);
    window.__pickT = setTimeout(onPickLang, 120);   // 让系统完成文本选择后再读
  }, {passive:true});
  // 兜底：选择变化且稳定后也触发（覆盖 iOS 长按拖选等极端情况）
  document.addEventListener('selectionchange', function(){
    clearTimeout(window.__slT);
    window.__slT = setTimeout(function(){
      var s=window.getSelection();
      if(s && !s.isCollapsed) onPickLang();
    }, 450);
  }, false);
  document.addEventListener('keydown', function(e){           // Esc 收起 + 清除临时高亮
    if(e.key==='Escape'){ hideToolbar(); clearTempHL(); }
  });


  document.getElementById('note-panel').addEventListener('click', function(e){
    var clearBtn=e.target.closest && e.target.closest('#np-clear');
    if(clearBtn){ clearAllNotes(); return; }
    var item=e.target.closest && e.target.closest('.np-item');
    if(item){ openResult(item.getAttribute('data-lang')==='zh'?'zh':'en', +item.getAttribute('data-i')); hideToolbar(); }
  }, false);

  renderAllMarks();
})();

/* 切换章节后重新套用标记 */
var __origGoTo = goTo;
goTo = function(){
  __origGoTo.apply(null, arguments);
  renderAllMarks();
};

/* ============ 记忆阅读位置：自动回到上次结束的地方 ============ */
var POS_KEY = 'readerhub_pos_american-dream-unfinished';
function readStoredPos(){
  try{ SAVED_POS = JSON.parse(localStorage.getItem(POS_KEY)); }
  catch(e){ SAVED_POS = null; }
  return SAVED_POS;
}
function writeStoredPos(){
  if(!current) return;
  var scE = document.getElementById('scroll-en');
  var scZ = document.getElementById('scroll-zh');
  try{
    localStorage.setItem(POS_KEY, JSON.stringify({
      section: current,
      en: scE ? scE.scrollTop : 0,
      zh: scZ ? scZ.scrollTop : 0
    }));
  }catch(e){}
}
function onPosNow(){ clearTimeout(window.__posT); window.__posT = setTimeout(writeStoredPos, 180); }

// 默认加载：若存有上次位置则恢复，否则从导言开始
(function initLaunch(){
  readStoredPos();
  document.getElementById('scroll-en').addEventListener('scroll', onPosNow, {passive:true});
  document.getElementById('scroll-zh').addEventListener('scroll', onPosNow, {passive:true});

  var sec = (SAVED_POS && SAVED_POS.section) ? SAVED_POS.section : "intro";
  goTo(sec);                       // goTo override 已包含 renderAllMarks()
  if(SAVED_POS){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        var scE = document.getElementById('scroll-en');
        var scZ = document.getElementById('scroll-zh');
        if(scE && SAVED_POS.en) scE.scrollTop = SAVED_POS.en;
        if(scZ && SAVED_POS.zh) scZ.scrollTop = SAVED_POS.zh;
        // fresh first-visit -> save a baseline (also keeps mark listener warm)
        if(!SAVED_POS.en && !SAVED_POS.zh) writeStoredPos();
      });
    });
  }
})();
</script>
<script>
/* ============ 目录折叠交互 (SIDEBAR-TOGGLE) ============ */
(function(){
  var KEY = 'readerhub_sidebar_collapsed';
  var app = document.querySelector('.app');
  if(!app) return;
  function getCollapsed(){
    try{ return localStorage.getItem(KEY) === '1'; }catch(e){ return false; }
  }
  function setCollapsed(v){
    app.classList.toggle('sidebar-collapsed', !!v);
    try{ localStorage.setItem(KEY, v ? '1' : '0'); }catch(e){}
    var btn = document.getElementById('sidebar-toggle');
    if(btn){
      btn.innerHTML = v ? '&#10095;' : '&#10094;';   // 折叠时 ›（展开），展开时 ‹（收起）
      btn.setAttribute('aria-expanded', String(!v));
    }
  }
  // 初始
  setCollapsed(getCollapsed());
  var btn = document.getElementById('sidebar-toggle');
  if(btn){
    btn.addEventListener('click', function(e){ e.stopPropagation(); setCollapsed(!app.classList.contains('sidebar-collapsed')); });
  }
  // 快捷键：反斜杠 \  切换
  document.addEventListener('keydown', function(e){
    if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
    if(e.key === '\\' || e.key === '|'){ setCollapsed(!app.classList.contains('sidebar-collapsed')); }
  });
})();
</script>
<script>
/* ============ 连续滚动（跨章节）(CONTINUOUS-SCROLL) ============ */
(function(){
  if(typeof EN === 'undefined') return;

  var enEl = document.getElementById('article-en');
  var zhEl = document.getElementById('article-zh');
  var scE  = document.getElementById('scroll-en');
  var scZ  = document.getElementById('scroll-zh');
  if(!enEl || !zhEl || !scE || !scZ) return;

  // 章节顺序：优先 tocOrder，其次 EN 顺序
  var ORDER = (typeof tocOrder !== 'undefined' && tocOrder)
    ? tocOrder.filter(function(id){ return EN.some(function(s){ return s.id===id; }); })
    : EN.map(function(s){ return s.id; });
  // 补上不在 ORDER 里的章节
  EN.forEach(function(s){ if(ORDER.indexOf(s.id)<0) ORDER.push(s.id); });

  // 书本脚本启动时已渲染过单章，这里清空后重绘为「整本连续长文」
  enEl.innerHTML = '';
  zhEl.innerHTML = '';

  var ENMAP = {}; EN.forEach(function(s){ ENMAP[s.id]=s; });
  var ZHMMAP = {}; (typeof ZH!=='undefined'?ZH:[]).forEach(function(s){ ZHMMAP[s.id]=s; });

  // 章节标题（短名 + 英文原名）：从已生成的目录按钮文本推断
  function labelsFor(id){
    var btn = document.querySelector('.toc-item[data-sec-id="'+id+'"]');
    var cn = '', en = '';
    if(btn){
      var span = btn.querySelector('span');
      cn = (span ? span.textContent : btn.textContent) || '';
      cn = cn.replace(/\s+/g,' ').trim();
    }
    var s = ENMAP[id];
    en = s ? s.title : id;
    return {cn: cn, en: en};
  }

  // ------- 渲染所有章节（一次） -------
  var gi = 0;
  ORDER.forEach(function(id, si){
    var sec = ENMAP[id]; if(!sec) return;
    var zsec = ZHMMAP[id] || {paras:[]};
    var zmap = {}; zsec.paras.forEach(function(z,k){ zmap[k] = z && z.text ? z.text : ''; });

    [enEl, zhEl].forEach(function(root){
      var anchor = document.createElement('span');
      anchor.className = 'sec-anchor';
      anchor.setAttribute('data-sec-anchor', id);
      root.appendChild(anchor);

      if(si > 0){
        var hr = document.createElement('hr');
        hr.className = 'sec-divider';
        root.appendChild(hr);
      }
      var lb = labelsFor(id);
      var head = document.createElement('div');
      head.innerHTML = '<p class="chapter-title" data-sec="'+id+'">'+ lb.cn +'</p>'
                     + '<p class="chapter-sub" data-sec="'+id+'">'+ esc(lb.en) +'</p>';
      root.appendChild(head);
    });

    sec.paras.forEach(function(p, i){
      var myGi = gi++;
      var enHtml;
      if(p.type==='table'){
        enHtml = '<figure class="p table" data-lang="en" data-sec="'+id+'" data-i="'+i+'" data-gi="'+myGi+'"><img loading="lazy" src="'+(p.text||'')+'" alt="表格"></figure>';
      } else {
        var enCls = p.type==='title' ? 'p title' : (p.type==='note' ? 'note' : 'p');
        enHtml = '<p class="'+enCls+'" data-lang="en" data-sec="'+id+'" data-i="'+i+'" data-gi="'+myGi+'">'+(p.text||'')+'</p>';
      }
      enEl.insertAdjacentHTML('beforeend', enHtml);

      var zt = zmap[i];
      var zhHtml;
      if(p.type==='title'){
        zhHtml = '<p class="p title" data-lang="zh" data-sec="'+id+'" data-i="'+i+'" data-gi="'+myGi+'">'+esc(zt||'')+'</p>';
      } else if(p.type==='note'){
        zhHtml = '<p class="note" data-lang="zh" data-sec="'+id+'" data-i="'+i+'" data-gi="'+myGi+'">'+esc(zt||'')+'</p>';
      } else if(zt){
        zhHtml = '<p class="p" data-lang="zh" data-sec="'+id+'" data-i="'+i+'" data-gi="'+myGi+'">'+esc(zt)+'</p>';
      } else {
        var mirror = (id==='notes' || id==='backmatter' || id==='biblio' || id==='index') ? (p.text||'') : '';
        if(mirror){
          zhHtml = '<p class="p" style="color:#3a3a3a" data-lang="zh" data-sec="'+id+'" data-i="'+i+'" data-gi="'+myGi+'">'+esc(mirror)+'</p>';
        } else {
          zhHtml = '<p class="p" style="color:#b6b0a6" data-lang="zh" data-sec="'+id+'" data-i="'+i+'" data-gi="'+myGi+'">（尚未翻译）</p>';
        }
      }
      zhEl.insertAdjacentHTML('beforeend', zhHtml);
    });
  });

  var TOTAL_GI = gi;

  // ------- 滚动定位 / 当前章节 -------
  var giToSec = {};   // gi -> section id
  enEl.querySelectorAll('[data-gi]').forEach(function(el){
    var g = +el.getAttribute('data-gi');
    if(!(g in giToSec)) giToSec[g] = el.getAttribute('data-sec');
  });
  enEl.querySelectorAll('[data-sec-anchor]').forEach(function(el){});
  var secEls = {};    // section id -> anchor element (en column)
  enEl.querySelectorAll('[data-sec-anchor]').forEach(function(a){
    secEls[a.getAttribute('data-sec-anchor')] = a;
  });

  function headerOff(scrollEl){
    var h = scrollEl.querySelector('.col-head');
    if(!h) return 0;
    try{ var cs=getComputedStyle(h).position; if(cs==='sticky'||cs==='fixed') return h.offsetHeight; }catch(e){}
    return 0;
  }
  function anchorTop(scrollEl, contentEl, id){
    var a = contentEl.querySelector('[data-sec-anchor="'+id+'"]');
    if(!a) return null;
    var sRect = scrollEl.getBoundingClientRect();
    var aRect = a.getBoundingClientRect();
    return (aRect.top - sRect.top) + scrollEl.scrollTop - headerOff(scrollEl) - 8;
  }
  function paraTop(scrollEl, contentEl, g){
    var t = contentEl.querySelector('[data-gi="'+g+'"]');
    if(!t) return null;
    var sRect = scrollEl.getBoundingClientRect();
    var tRect = t.getBoundingClientRect();
    return (tRect.top - sRect.top) + scrollEl.scrollTop - headerOff(scrollEl);
  }

  // 当前可见章节（各栏顶部下方第一个段落所属章节），以 EN 栏为准
  function topSection(scrollEl, contentEl){
    var y = scrollEl.scrollTop + headerOff(scrollEl) + 12;
    var cur = null;
    var anchors = contentEl.querySelectorAll('[data-sec-anchor]');
    for(var k=0;k<anchors.length;k++){
      var aTop = (anchors[k].getBoundingClientRect().top - scrollEl.getBoundingClientRect().top) + scrollEl.scrollTop;
      if(aTop <= y + 2) cur = anchors[k].getAttribute('data-sec-anchor');
      else break;
    }
    return cur || (ORDER[0]||null);
  }

  function setCurrent(id){
    var changed = (id && id !== window.__csCurrent);
    window.__csCurrent = id;
    if(typeof current !== 'undefined'){ try{ current = id; }catch(e){} }
    // 目录高亮
    if(window.__markChapterActive) window.__markChapterActive(id);
    if(window.__updateChapterHud) window.__updateChapterHud();
    // 滚动到新章节时，短暂浮现章节药丸提醒
    if(changed && window.__flashChapterHud) window.__flashChapterHud();
  }

  var raf = null;
  function onScroll(){
    if(raf) return;
    raf = requestAnimationFrame(function(){
      raf = null;
      var id = topSection(scE, enEl);
      setCurrent(id);
    });
  }
  scE.addEventListener('scroll', onScroll, {passive:true});

  // ------- 左右两栏滚动同步（按段落锚点对齐）-------
  // 中英文段落一一对应（同 gi），把「来源栏顶部可见的那一段」在目标栏也对齐到
  // 相同相对位置，使两栏始终并排对应。用锁避免回弹循环。
  var syncLock = false;
  var syncPending = {en:false, zh:false};
  function topAnchorGi(scrollEl, contentEl){
    var y = scrollEl.scrollTop + headerOff(scrollEl) + 8;
    var ps = contentEl.querySelectorAll('[data-gi]');
    if(!ps.length) return null;
    var best = null;
    // 二分查找最后一个 offsetTop <= y 的段落
    var lo = 0, hi = ps.length - 1;
    while(lo <= hi){
      var mid = (lo + hi) >> 1;
      if(ps[mid].offsetTop <= y){ best = ps[mid]; lo = mid + 1; }
      else hi = mid - 1;
    }
    if(!best) best = ps[0];
    return best;
  }
  function syncFrom(srcScroll, srcContent, dstScroll, dstContent){
    var srcEl = topAnchorGi(srcScroll, srcContent);
    if(!srcEl) return;
    var g = srcEl.getAttribute('data-gi');
    var dstEl = dstContent.querySelector('[data-gi="'+g+'"]');
    if(!dstEl) return;
    // 源栏内「视口顶端相对该段的偏移」
    var srcOff = (srcScroll.scrollTop + headerOff(srcScroll)) - srcEl.offsetTop;
    // 目标栏中把同一段也放在同样的相对位置
    var dstTop = dstEl.offsetTop + srcOff;
    var maxTop = dstScroll.scrollHeight - dstScroll.clientHeight;
    dstTop = Math.max(0, Math.min(maxTop, dstTop));
    if(Math.abs(dstScroll.scrollTop - dstTop) < 2) return;
    syncLock = true;
    dstScroll.scrollTop = dstTop;
    // 下一帧释放锁（等浏览器应用滚动）
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ syncLock = false; }); });
  }
  // 尾随重同步：快速滚动时每帧跟进，直到对齐
  var syncRafE = null, syncRafZ = null;
  var settleTimer = null;
  function scheduleSync(which){
    if(which==='en'){
      if(syncRafE) return;
      syncRafE = requestAnimationFrame(function(){ syncRafE = null;
        if(syncLock) return;
        syncFrom(scE, enEl, scZ, zhEl);
        bumpSettle('en');
      });
    } else {
      if(syncRafZ) return;
      syncRafZ = requestAnimationFrame(function(){ syncRafZ = null;
        if(syncLock) return;
        syncFrom(scZ, zhEl, scE, enEl);
        bumpSettle('zh');
      });
    }
  }
  // 停止滚动后再补一次同步（保证最终完全对齐）
  window.__csLastSrc = 'en';
  function bumpSettle(which){
    window.__csLastSrc = which;
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function(){
      if(syncLock){ bumpSettle(window.__csLastSrc); return; }
      if(window.__csLastSrc==='zh') syncFrom(scZ, zhEl, scE, enEl);
      else syncFrom(scE, enEl, scZ, zhEl);
    }, 90);
  }
  scE.addEventListener('scroll', function(){
    if(syncLock){ syncPending.en = true; return; }
    scheduleSync('en');
  }, {passive:true});
  scZ.addEventListener('scroll', function(){
    if(syncLock){ syncPending.zh = true; return; }
    scheduleSync('zh');
  }, {passive:true});

  // goTo -> 滚动到章节
  var __prevGoTo = window.goTo;
  window.goTo = function(id){
    if(!ENMAP[id]) id = ORDER[0];
    // 同步两栏滚到该章顶部
    var tE = anchorTop(scE, enEl, id);
    var tZ = anchorTop(scZ, zhEl, id);
    if(tE !== null) scE.scrollTop = Math.max(0, tE);
    if(tZ !== null) scZ.scrollTop = Math.max(0, tZ);
    setCurrent(id);
    return undefined;
  };
  // 覆盖全局 goTo（书本脚本用全局名调用）
  try{ goTo = window.goTo; }catch(e){}

  // 覆盖 paraScrollTop（原函数按 data-i 查找，现在需按 data-gi）
  try{
    paraScrollTop = function(pair, g){
      var isEn = pair.scroll === scE || pair.content === enEl;
      return paraTop(pair.scroll, pair.content, g);
    };
  }catch(e){}

  // 覆盖 openResult（检索结果跳转）：按 章节 + 章内段号定位
  window.openResult = function(sectionId, paraIdx){
    try{ closeSearch && closeSearch(true); }catch(e){}
    // 找到该章该段的 gi
    var el = enEl.querySelector('[data-sec="'+sectionId+'"][data-i="'+paraIdx+'"]');
    if(!el){ window.goTo(sectionId); return; }
    var g = +el.getAttribute('data-gi');
    var tE = paraTop(scE, enEl, g), tZ = paraTop(scZ, zhEl, g);
    if(tE !== null) scE.scrollTop = Math.max(0, tE);
    if(tZ !== null) scZ.scrollTop = Math.max(0, tZ);
    setCurrent(sectionId);
  };
  try{ openResult = window.openResult; }catch(e){}

  // ------- 笔记：改用 data-gi 定位 + 兼容旧数据 -------
  // 旧笔记只有 {lang,i,from,to,text}（i 为章内段号，无章节信息）。
  // 迁移：优先匹配「章内段号 i 相同 + 文本包含」的段落（最可靠），
  // 其次退回到纯文本匹配。
  (function migrateNotes(){
    if(typeof NOTES === 'undefined' || !NOTES) return;
    var changed = false;
    NOTES.forEach(function(n){
      if(n.gi != null) return;
      var root = (n.lang==='zh') ? zhEl : enEl;
      var cands = root.querySelectorAll(n.lang==='zh' ? '[data-lang="zh"]' : '[data-lang="en"]');
      var el = null;
      // 1) 段号 i 相同 且 包含片段
      if(n.i != null){
        var byI = root.querySelectorAll('[data-i="'+n.i+'"]');
        for(var k=0;k<byI.length;k++){
          if(!n.text || byI[k].textContent.indexOf(n.text)>=0){ el = byI[k]; break; }
        }
      }
      // 2) 纯文本匹配
      if(!el && n.text){
        for(var j=0;j<cands.length;j++){
          if(cands[j].textContent.indexOf(n.text) >= 0){ el = cands[j]; break; }
        }
      }
      if(el){
        n.gi = +el.getAttribute('data-gi');
        n.sec = el.getAttribute('data-sec');
        changed = true;
      }
    });
    if(changed && typeof saveNotes === 'function'){ try{ saveNotes(); }catch(e){} }
  })();

  function paraByGi(lang, g){
    var root = (lang==='zh') ? zhEl : enEl;
    return root.querySelector('[data-gi="'+g+'"]');
  }

  // renderMarks：按 gi 找笔记
  window.renderMarks = function(el){
    if(!el || el.getAttribute('data-gi')==null) return;
    var lang = el.getAttribute('data-lang'), g = el.getAttribute('data-gi');
    var list = NOTES.filter(function(n){ return n.lang===lang && +n.gi===+g; })
                   .sort(function(a,b){ return a.from-b.from; });
    var text = el.textContent, html='', pos=0;
    list.forEach(function(n){
      var f=Math.max(pos,n.from), t=Math.min(text.length,n.to);
      if(f>pos) html += escText(text.slice(pos,f));
      if(t>f){
        if(n.type==='hl') html += '<mark class="hlmark" style="background:'+n.color+'">'+escText(text.slice(f,t))+'</mark>';
        else html += '<u class="ulnote">'+escText(text.slice(f,t))+'</u>';
      }
      pos=Math.max(pos,t);
    });
    if(typeof TEMP!=='undefined' && TEMP && TEMP.lang===lang && +TEMP.gi===+g){
      var f=Math.max(pos,TEMP.from), t=Math.min(text.length,TEMP.to);
      if(f>pos) html += escText(text.slice(pos,f));
      if(t>f) html += '<mark class="senthl">'+escText(text.slice(f,t))+'</mark>';
      pos=Math.max(pos,t);
    }
    if(typeof PEER!=='undefined' && PEER && PEER.lang===lang && +PEER.gi===+g){
      var pr = PEER.ranges.slice().sort(function(a,b){ return a[0]-b[0]; });
      pr.forEach(function(rg){
        var f=Math.max(pos,rg[0]), t=Math.min(text.length,rg[1]);
        if(f>pos) html += escText(text.slice(pos,f));
        if(t>f) html += '<mark class="peer-sent">'+escText(text.slice(f,t))+'</mark>';
        pos=Math.max(pos,t);
      });
    }
    if(pos<text.length) html += escText(text.slice(pos));
    el.innerHTML = html;
  };
  try{ renderMarks = window.renderMarks; }catch(e){}

  // clearTempHL：用 [data-gi] 查找段落
  window.clearTempHL = function(){
    try{ TEMP = null; PEER = null; }catch(e){}
    var marks = document.querySelectorAll('.senthl,.peer-sent');
    for(var k=0;k<marks.length;k++){
      var p = marks[k].closest('[data-gi]');
      if(p) window.renderMarks(p);
    }
  };
  try{ clearTempHL = window.clearTempHL; }catch(e){}

  window.renderAllMarks = function(){
    ['en','zh'].forEach(function(lang){
      var root = (lang==='zh') ? zhEl : enEl;
      var set = {};
      NOTES.forEach(function(n){ if(n.lang===lang && n.gi!=null) set[n.gi]=1; });
      for(var g in set){ var el = root.querySelector('[data-gi="'+g+'"]'); if(el) window.renderMarks(el); }
    });
  };
  try{ renderAllMarks = window.renderAllMarks; }catch(e){}

  // applyNote：原实现用 [data-i] 重绘，改为按 gi 重绘
  window.applyNote = function(type, color){
    var note = window.buildNote();
    try{ window.getSelection().removeAllRanges(); }catch(e){}
    hideToolbar();
    if(!note){ showToast('请在同一段内选择文字'); return; }
    if(type==='ul'){ note.type='ul'; note.color=null; }
    else { note.type='hl'; note.color=color||HL_COLORS[0].hex; }
    var idx = window.findNoteIndex(note);
    if(idx>=0) NOTES.splice(idx,1);
    NOTES.push(note);
    saveNotes();
    var el = paraByGi(note.lang, note.gi);
    if(el) window.renderMarks(el);
    showToast((type==='ul'?'已划线':'已高亮'+(colorName(note.color)||''))+'，已保存到笔记');
    refreshPanel();
  };
  try{ applyNote = window.applyNote; }catch(e){}

  // refreshPanel：笔记列表按 gi/sec 定位
  window.refreshPanel = function(){
    var p = document.getElementById('note-panel');
    var html = '<div class="np-head"><b>📝 我的笔记 ('+NOTES.length+')</b><span>';
    html += '<button id="np-clear" style="color:#c0392b">清除全部</button> <button id="np-close" style="color:var(--accent)">关闭</button></span></div>';
    if(!NOTES.length) html += '<div class="np-empty">还没有笔记。<br>在正文里选中文字，即可「高亮」或「划线」。</div>';
    else{
      var shown = {};
      for(var i=NOTES.length-1;i>=0;i--){
        var n = NOTES[i];
        var key = n.lang+':'+n.gi;
        shown[key] = (shown[key]||0)+1;
        if(shown[key]>1) continue;
        var t = window.noteText(n) || '…';
        var lang = n.lang==='en' ? '英' : '中';
        var mark = n.type==='hl'
          ? '<span style="background:'+n.color+'">&nbsp;&nbsp;&nbsp;</span>'
          : '<span style="text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#e8504a">&nbsp;&nbsp;&nbsp;</span>';
        html += '<div class="np-item" data-lang="'+n.lang+'" data-gi="'+n.gi+'">'
             +  '<div class="np-meta"><b>'+(n.sec||'')+' · '+(n.i+1)+'</b><span style="color:var(--mute)">'+lang+'</span>'+mark
             +  (n.type==='ul'?'<span style="font-size:10px;color:#888">划线</span>':'<span style="font-size:10px;color:#888">高亮</span>')
             +  '</div><div class="np-text">'+escText(t)+'</div></div>';
      }
    }
    p.innerHTML = html;
  };
  try{ refreshPanel = window.refreshPanel; }catch(e){}

  // 笔记面板点击：接管 .np-item 跳转（按 gi）、np-close 关闭
  var npEl = document.getElementById('note-panel');
  if(npEl){
    npEl.addEventListener('click', function(e){
      var item = e.target.closest && e.target.closest('.np-item');
      if(item){
        e.stopImmediatePropagation();
        var g = +item.getAttribute('data-gi');
        var lang = item.getAttribute('data-lang')==='zh' ? 'zh' : 'en';
        var tE = paraTop(scE, enEl, g), tZ = paraTop(scZ, zhEl, g);
        if(tE!==null) scE.scrollTop = Math.max(0, tE-40);
        if(tZ!==null) scZ.scrollTop = Math.max(0, tZ-40);
        var el = paraByGi('en', g);
        if(el) setCurrent(el.getAttribute('data-sec'));
        e.stopPropagation();
        hideToolbar();
        return;
      }
      var closeBtn = e.target.closest && e.target.closest('#np-close');
      if(closeBtn){
        e.stopImmediatePropagation();
        document.getElementById('note-panel').classList.remove('np-open');
      }
    }, true);
  }

  // buildNote：记录 gi + sec
  window.buildNote = function(){
    var sel = window.getSelection();
    if(!sel || sel.rangeCount===0 || sel.isCollapsed) return null;
    var r = sel.getRangeAt(0);
    var root = r.commonAncestorContainer.nodeType===1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
    var lang = root.closest('#article-en') ? 'en' : (root.closest('#article-zh') ? 'zh' : null);
    if(!lang) return null;
    var startPara = r.startContainer.nodeType===3 ? r.startContainer.parentElement : r.startContainer.closest('[data-gi]');
    var endPara = r.endContainer.nodeType===3 ? r.endContainer.parentElement : r.endContainer.closest('[data-gi]');
    if(!startPara || !endPara || startPara!==endPara) return null;
    var a = pointOffsetInPara(startPara, r.startContainer, r.startOffset);
    var b = pointOffsetInPara(endPara, r.endContainer, r.endOffset);
    var from = Math.min(a,b), to = Math.max(a,b);
    if(to-from<=0) return null;
    return {lang:lang, gi:+startPara.getAttribute('data-gi'), sec:startPara.getAttribute('data-sec'),
            i:+startPara.getAttribute('data-i'), from:from, to:to,
            text:startPara.textContent.slice(from,to)};
  };
  try{ buildNote = window.buildNote; }catch(e){}

  window.findNoteIndex = function(n){
    for(var k=0;k<NOTES.length;k++){ var x=NOTES[k];
      if(x.lang===n.lang && +x.gi===+n.gi && x.from===n.from && x.to===n.to) return k; }
    return -1;
  };
  try{ findNoteIndex = window.findNoteIndex; }catch(e){}

  window.noteText = function(n){
    var el = paraByGi(n.lang, n.gi);
    return el ? el.textContent.slice(n.from, n.to) : '';
  };
  try{ noteText = window.noteText; }catch(e){}

  // sentsFor：按 gi 取段落文本
  window.sentsFor = function(lang, g){
    var key = lang+':'+g;
    if(__SENT_CACHE[key]) return __SENT_CACHE[key];
    var el = paraByGi(lang, g);
    var list = el ? splitSentences(el.textContent) : [];
    __SENT_CACHE[key] = list;
    return list;
  };
  try{ sentsFor = window.sentsFor; }catch(e){}

  // applyNote 里用 articleFor(...).querySelector('[data-i=..]') 重绘，
  // 用 gi 覆盖：直接在此重新实现 applyNote 的收尾（已通过 renderMarks 覆盖）。
  // applySentenceSel 需要按 gi 找对侧段落，使用章内 i 访问 SENT_ALIGN。
  window.applySentenceSel = function(){
    var sel = window.getSelection();
    try{ clearTempHL(); }catch(e){}
    if(!sel || sel.rangeCount===0 || sel.isCollapsed) return;
    var r = sel.getRangeAt(0);
    var node = r.startContainer, startPara = node.nodeType===3 ? node.parentElement : node.closest('[data-gi]');
    var endNode = r.endContainer, endPara = endNode.nodeType===3 ? endNode.parentElement : endNode.closest('[data-gi]');
    if(!startPara || !endPara || startPara!==endPara) return;
    var lang = startPara.getAttribute('data-lang');
    if(lang!=='en' && lang!=='zh') return;
    var g = +startPara.getAttribute('data-gi');
    var i = +startPara.getAttribute('data-i');
    var sec = startPara.getAttribute('data-sec');
    var a = pointOffsetInPara(startPara, r.startContainer, r.startOffset);
    var b = pointOffsetInPara(startPara, r.endContainer, r.endOffset);
    var from = Math.min(a,b), to = Math.max(a,b);
    var peerLang = lang==='en' ? 'zh' : 'en';
    var peerPara = paraByGi(peerLang, g);   // 左右两栏 gi 一一对应
    var entry = (typeof SENT_ALIGN!=='undefined' && SENT_ALIGN) ? SENT_ALIGN[sec+'/'+i] : null;
    if(entry && entry[lang] && entry[peerLang] && peerPara){
      var si = sentIdxAt(entry[lang], from);
      if(si!==-1){
        TEMP = {lang:lang, gi:g, from:entry[lang][si][0], to:entry[lang][si][1]};
        var tr = [];
        var m = entry.m || [];
        for(var k=0;k<m.length;k++){
          var src = (lang==='en') ? m[k][0] : m[k][1];
          var dst = (lang==='en') ? m[k][1] : m[k][0];
          if(src===si && entry[peerLang][dst]) tr.push(entry[peerLang][dst]);
        }
        if(!tr.length && entry[peerLang][si]) tr.push(entry[peerLang][si]);
        if(tr.length){
          PEER = {lang:peerLang, gi:g, ranges:tr};
          window.renderMarks(peerPara);
          // 平滑滚动对侧栏到对应段
          var t = paraTop(peerLang==='zh'?scZ:scE, peerLang==='zh'?zhEl:enEl, g);
          if(t!==null) smoothGoto(peerLang==='zh'?scZ:scE, t);
        }
        return;
      }
    }
  };
  try{ applySentenceSel = window.applySentenceSel; }catch(e){}

  // ------- 阅读位置记忆：连续滚动直接存 scrollTop -------
  function savePos(){
    var id = window.__csCurrent || ORDER[0];
    try{
      localStorage.setItem(POS_KEY, JSON.stringify({
        section: id, en: scE.scrollTop, zh: scZ.scrollTop, at: Date.now()
      }));
    }catch(e){}
  }
  scE.addEventListener('scroll', function(){ clearTimeout(window.__csPosT); window.__csPosT=setTimeout(savePos,200); }, {passive:true});
  scZ.addEventListener('scroll', function(){ clearTimeout(window.__csPosT); window.__csPosT=setTimeout(savePos,200); }, {passive:true});

  // ------- 恢复上次位置 -------
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); }catch(e){}
  var startSec = (saved && saved.section) ? saved.section : (ORDER.indexOf('introduction')>=0 ? 'introduction' : ORDER[0]);
  window.goTo(startSec);
  if(saved){
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      // 连续滚动下直接用像素位置恢复更准确；若还原偏差过大再退回章节顶部
      if(saved.en) scE.scrollTop = saved.en;
      if(saved.zh) scZ.scrollTop = saved.zh;
      var id = topSection(scE, enEl); setCurrent(id);
    });});
  }
  setTimeout(function(){ window.__csCurrent = window.__csCurrent || startSec; }, 0);

  // 首次渲染后套用笔记标记
  if(window.renderAllMarks) window.renderAllMarks();
  if(window.__updateChapterHud) window.__updateChapterHud();
})();
</script>
<script>window.BOOK_META={"id": "chinese-americans-shared-history", "title": "Chinese and Americans: A Shared History", "titleZh": "中国人与美国人——一部共有的历史", "titleEn": "Chinese and Americans: A Shared History", "subtitle": "《中国人与美国人——一部共有的历史》", "author": "徐国琦", "authorZh": "徐国琦", "authorEn": "Xu Guoqi", "publisher": "哈佛大学出版社", "publisherEn": "Harvard University Press", "publishYear": "2014"};</script>
<script>
/* ============ 笔记删除 + 批量导出 (NOTES-EXPORT) ============ */
(function(){
  if(typeof EN === 'undefined') return;

  var META = window.BOOK_META || {};
  function bookTitle(){ return META.title || ''; }
  function bookAuthor(){ return META.author || ''; }

  /* 引文行：中文与英文两套格式 */
  function citation(lang){
    var t, a;
    if(lang === 'zh'){
      t = META.titleZh || META.title || '';
      a = META.author || '';
      var pub = META.publisher || '';
      var yr  = META.publishYear || '';
      // ——作者：《书名》，出版社，年份
      var tail = [];
      if(pub) tail.push(pub);
      if(yr)  tail.push(yr);
      var s = '——' + a;
      s += '：《' + t + '》';
      if(tail.length) s += '，' + tail.join('，');
      return s;
    }
    // 英文：Author, *Title* (Publisher, Year).
    t = META.titleEn || META.title || '';
    a = META.authorEn || META.author || '';
    var pubE = META.publisherEn || META.publisher || '';
    var yrE  = META.publishYear || '';
    var s2 = (a ? a + ', ' : '') + (t ? '*' + t + '*' : '');
    if(pubE || yrE){
      var par = [];
      if(pubE) par.push(pubE);
      if(yrE)  par.push(yrE);
      s2 += ' (' + par.join(', ') + ')';
    }
    s2 = s2.replace(/^\s+|\s+$/g,'');
    if(s2) s2 += '.';
    return s2;
  }

  /* 每条笔记：正文 + 出处（去重后的引文行） */
  function noteBlock(n, ordinal){
    var txt = (window.noteText ? (window.noteText(n) || '') : '').replace(/\s+$/,'');
    var head = (n.sec || '') + (n.i != null ? (' · 段 ' + (n.i + 1)) : '');
    var kind = (n.type === 'ul') ? '划线' : '高亮';
    var lang = (n.lang === 'en') ? 'en' : 'zh';
    var cite = citation(lang);
    var out = '';
    out += '### ' + ordinal + '. ' + head + '（' + kind + '）\n\n';
    out += '> ' + txt.replace(/\n/g, '\n> ') + '\n\n';
    if(cite) out += '> ' + cite + '\n\n';
    return out;
  }

  function sortedNotes(){
    // 按 章（sec 出现顺序）-> 段 -> 起始偏移 排序；同段同偏移合并为一条
    var secOrder = {};
    (typeof EN !== 'undefined' ? EN : []).forEach(function(s, k){ secOrder[s.id] = k; });
    var arr = NOTES.slice();
    // 去重：同 lang+gi+from+to 只保留一条（笔记模型本身可含重复）
    var seen = {};
    arr = arr.filter(function(n){
      var k = n.lang + '|' + n.gi + '|' + n.from + '|' + n.to;
      if(seen[k]) return false; seen[k] = 1; return true;
    });
    arr.sort(function(a, b){
      var oa = (secOrder[a.sec] != null) ? secOrder[a.sec] : 9999;
      var ob = (secOrder[b.sec] != null) ? secOrder[b.sec] : 9999;
      if(oa !== ob) return oa - ob;
      if((a.gi||0) !== (b.gi||0)) return (a.gi||0) - (b.gi||0);
      return (a.from||0) - (b.from||0);
    });
    return arr;
  }

  function buildMarkdown(){
    var arr = sortedNotes();
    if(!arr.length) return '';
    var out = '# ' + (bookTitle() || '阅读笔记') + ' · 高亮笔记\n\n';
    var c0 = citation('zh');
    if(c0) out += c0.replace(/^——/, '') + '\n\n';
    out += '共 ' + arr.length + ' 条\n\n---\n\n';
    // 按章分组
    var lastSec = null, idx = 0;
    arr.forEach(function(n){
      if(n.sec !== lastSec){
        lastSec = n.sec;
        out += '## ' + (n.sec || '（未分章）') + '\n\n';
      }
      idx++;
      out += noteBlock(n, idx);
    });
    return out;
  }

  function buildText(){
    var arr = sortedNotes();
    if(!arr.length) return '';
    var out = (bookTitle() || '阅读笔记') + ' · 高亮笔记\n';
    var c0 = citation('zh');
    if(c0) out += c0 + '\n';
    out += '共 ' + arr.length + ' 条\n\n';
    var lastSec = null, idx = 0;
    arr.forEach(function(n){
      if(n.sec !== lastSec){ lastSec = n.sec; out += '\n【' + (n.sec || '（未分章）') + '】\n'; }
      idx++;
      var txt = (window.noteText ? (window.noteText(n) || '') : '').replace(/\s+$/,'');
      var kind = (n.type === 'ul') ? '划线' : '高亮';
      out += '\n' + idx + '. ' + txt + '\n';
      var lang = (n.lang === 'en') ? 'en' : 'zh';
      var cite = citation(lang);
      if(cite) out += '   ' + cite + '\n';
    });
    return out;
  }

  function buildJSON(){
    var arr = sortedNotes().map(function(n){
      var lang = (n.lang === 'en') ? 'en' : 'zh';
      return {
        section: n.sec || null,
        paraIndex: (n.i != null ? n.i : null),
        globalIndex: (n.gi != null ? n.gi : null),
        lang: lang,
        type: (n.type === 'ul') ? 'underline' : 'highlight',
        color: n.color || null,
        text: (window.noteText ? (window.noteText(n) || '') : ''),
        citation: citation(lang)
      };
    });
    return JSON.stringify({
      book: { title: bookTitle(), author: bookAuthor(),
              publisher: META.publisher || '', publisherEn: META.publisherEn || '',
              year: META.publishYear || '' },
      exportedAt: new Date().toISOString(),
      count: arr.length,
      notes: arr
    }, null, 2);
  }

  /* ---------- 下载 ---------- */
  function download(filename, content, mime){
    try{
      var blob = new Blob([content], {type: (mime || 'text/plain') + ';charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 120);
      return true;
    }catch(e){ return false; }
  }
  function safeName(){
    var t = (bookTitle() || 'notes').replace(/[\\/:*?"<>|]+/g, '_').trim();
    var d = new Date();
    function p(x){ return (x<10?'0':'') + x; }
    return t + '_笔记_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '.md';
  }
  function doExport(kind){
    var arr = sortedNotes();
    if(!arr.length){ if(window.showToast) showToast('还没有笔记可导出'); hideExport(); return; }
    var ok = false;
    if(kind === 'md')   ok = download(safeName(), buildMarkdown(), 'text/markdown');
    if(kind === 'txt')  ok = download(safeName().replace(/\.md$/, '.txt'), buildText(), 'text/plain');
    if(kind === 'json') ok = download(safeName().replace(/\.md$/, '.json'), buildJSON(), 'application/json');
    if(kind === 'copy' || !ok){
      // 兜底：复制到剪贴板
      var txt = (kind === 'json') ? buildJSON() : buildMarkdown();
      copyText(txt);
    } else {
      if(window.showToast) showToast('已导出 ' + arr.length + ' 条笔记');
    }
    hideExport();
  }
  function copyText(txt){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        if(window.showToast) showToast('已复制到剪贴板');
      }, function(){ fallback(txt); });
    } else fallback(txt);
  }
  function fallback(txt){
    try{
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      if(window.showToast) showToast('已复制到剪贴板');
    }catch(e){ if(window.showToast) showToast('导出失败'); }
  }

  /* ---------- 导出浮层 ---------- */
  function ensureExportMenu(){
    var m = document.getElementById('np-export');
    if(m) return m;
    m = document.createElement('div');
    m.id = 'np-export';
    m.innerHTML =
      '<button data-k="md">导出 Markdown（.md）</button>' +
      '<button data-k="txt">导出纯文本（.txt）</button>' +
      '<button data-k="json">导出 JSON（.json）</button>' +
      '<div class="np-exp-sep"></div>' +
      '<button data-k="copy">复制全部（含出处）</button>';
    document.body.appendChild(m);
    m.addEventListener('click', function(e){
      var b = e.target.closest && e.target.closest('button[data-k]');
      if(!b) return;
      e.stopPropagation();
      doExport(b.getAttribute('data-k'));
    });
    return m;
  }
  function showExport(anchor){
    var m = ensureExportMenu();
    m.classList.add('on');
    var r = anchor.getBoundingClientRect();
    var mw = m.offsetWidth, mh = m.offsetHeight;
    var left = Math.min(window.innerWidth - mw - 8, Math.max(8, r.right - mw));
    var top = r.bottom + 6;
    if(top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
    m.style.left = left + 'px';
    m.style.top = top + 'px';
  }
  function hideExport(){ var m = document.getElementById('np-export'); if(m) m.classList.remove('on'); }
  document.addEventListener('click', function(e){
    var m = document.getElementById('np-export');
    if(!m || !m.classList.contains('on')) return;
    if(e.target.closest && e.target.closest('#np-export')) return;
    if(e.target.closest && e.target.closest('.np-exp')) return;
    hideExport();
  });
  window.addEventListener('scroll', hideExport, true);
  window.addEventListener('resize', hideExport);

  /* ---------- 单条删除 ---------- */
  function deleteNote(n){
    // 精确定位：lang + gi + from + to；移除所有匹配项
    var removed = 0;
    for(var k = NOTES.length - 1; k >= 0; k--){
      var x = NOTES[k];
      if(x.lang === n.lang && +x.gi === +n.gi && x.from === n.from && x.to === n.to){
        NOTES.splice(k, 1); removed++;
      }
    }
    if(!removed) return false;
    try{ saveNotes(); }catch(e){}
    try{ renderAllMarks(); }catch(e){}
    // 该段可能已无任何笔记：renderAllMarks 不会重绘它，导致残留 <mark>。
    // 因此这里显式重绘被删除笔记所在的那一段（清掉标记）。
    try{
      var root = (n.lang==='zh') ? document.getElementById('article-zh') : document.getElementById('article-en');
      var el = root && root.querySelector('[data-gi="'+n.gi+'"]');
      if(el && typeof window.renderMarks === 'function') window.renderMarks(el);
    }catch(e){}
    try{ refreshPanel(); }catch(e){}
    if(window.showToast) showToast('已删除该条笔记');
    return true;
  }
  /* ---------- 点击正文里的高亮/划线 → 直接删除 ----------
     需求：不用打开「笔记」面板，直接点那段彩色文字就能删掉这条高亮。
     做法：
       1) 包裹 renderMarks，在每枚 mark.hlmark / u.ulnote 上写入 data-nf/data-nt
          （段内起止偏移），使「被点的标记 → 对应笔记」可精确对应；
       2) 在 document 上监听 click，命中标记则按 lang+gi+from+to 删除该条；
       3) 区分「单击」与「拖选」：按下与抬起位置基本重合、且没有选中文字时才算点击，
          避免用户拖拽选词时误删。
     同时提供一个可选开关（默认开启）：window.__clickDeleteHighlight。 */
  window.__clickDeleteHighlight = (window.__clickDeleteHighlight !== false);

  // 1) 包裹 renderMarks：给高亮/划线标记打上偏移信息
  function tagMarks(root){
    if(!root || !root.querySelectorAll) root = document;
    var ms = root.querySelectorAll('mark.hlmark, u.ulnote');
    for(var i=0;i<ms.length;i++){
      var m = ms[i];
      if(m.getAttribute('data-nf')!=null) continue;
      // 该标记在段落纯文本中的起止偏移（跳过已处理的其它标记，逐枚累加）
      var para = m.closest('[data-gi]');
      if(!para) continue;
      var off = textOffsetWithin(para, m);
      var len = (m.textContent||'').length;
      m.setAttribute('data-nf', off);
      m.setAttribute('data-nt', off+len);
    }
  }
  function textOffsetWithin(para, node){
    // 用一个 Range 测 node 起点相对 para 内容的字符偏移
    try{
      var r = document.createRange();
      r.selectNodeContents(para);
      r.setEndBefore(node);
      return r.toString().length;
    }catch(e){ return 0; }
  }
  if(typeof window.renderMarks === 'function'){
    var __rm2 = window.renderMarks;
    window.renderMarks = function(el){
      var r = __rm2.apply(this, arguments);
      try{ tagMarks(el); }catch(e){}
      return r;
    };
    try{ renderMarks = window.renderMarks; }catch(e){}
  }
  // 全文重绘后再补标一次
  if(typeof window.renderAllMarks === 'function'){
    var __ram = window.renderAllMarks;
    window.renderAllMarks = function(){ var r=__ram.apply(this,arguments); try{ tagMarks(document); }catch(e){} return r; };
    try{ renderAllMarks = window.renderAllMarks; }catch(e){}
  }
  // 首屏已有标记也补标
  setTimeout(function(){ try{ tagMarks(document); }catch(e){} }, 400);

  // 2) 点击删除（含拖选保护）
  var _downX=0,_downY=0,_downT=0;
  document.addEventListener('mousedown', function(e){
    _downX=e.clientX; _downY=e.clientY; _downT=Date.now();
  }, true);
  document.addEventListener('click', function(e){
    if(window.__clickDeleteHighlight === false) return;
    var t = e.target;
    if(!t || !t.closest) return;
    var m = t.closest('mark.hlmark, u.ulnote');
    if(!m) return;
    var para = m.closest('[data-gi]');
    if(!para) return;
    // 拖选保护：位移过大 / 耗时过长 → 视为选词，不删
    var dist = Math.abs(e.clientX-_downX) + Math.abs(e.clientY-_downY);
    var dt = Date.now() - _downT;
    var sel = window.getSelection && window.getSelection();
    var hasSel = sel && !sel.isCollapsed && String(sel).length>0;
    if(dist > 6 || hasSel && dt > 120) return;
    var lang = para.getAttribute('data-lang') || (para.closest('#article-zh') ? 'zh' : 'en');
    var gi = +para.getAttribute('data-gi');
    var from = +m.getAttribute('data-nf');
    var to = +m.getAttribute('data-nt');
    var target = findNoteByKey(lang, gi, from, to);
    if(!target){
      // 兜底：同段内取包含点击位置的最近一条
      var cands = NOTES.filter(function(x){ return x.lang===lang && +x.gi===gi; });
      target = cands.sort(function(a,b){ return Math.abs(a.from-from)-Math.abs(b.from-from); })[0];
    }
    if(!target) return;
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation) e.stopImmediatePropagation();
    var removed = target;
    lastDeleted = JSON.parse(JSON.stringify(removed));
    deleteNote(target);
    if(window.showToast) showToast('已删除这条' + (removed.type==='ul' ? '划线' : '高亮') + '（按 Ctrl/⌘+Z 撤销）');
  }, true);

  // 误删保护：记录最近一次删除，支持 Ctrl/⌘+Z 恢复
  var lastDeleted = null;
  document.addEventListener('keydown', function(e){
    if(!lastDeleted) return;
    if((e.ctrlKey || e.metaKey) && (e.key==='z' || e.key==='Z')){
      var n = lastDeleted; lastDeleted = null;
      // 避免重复恢复
      var dup = NOTES.some(function(x){ return x.lang===n.lang && +x.gi===+n.gi && x.from===n.from && x.to===n.to; });
      if(!dup){
        NOTES.push(n);
        try{ saveNotes(); }catch(e2){}
        try{ renderAllMarks(); }catch(e2){}
        try{
          var root=(n.lang==='zh')?document.getElementById('article-zh'):document.getElementById('article-en');
          var el=root&&root.querySelector('[data-gi="'+n.gi+'"]');
          if(el) window.renderMarks(el);
        }catch(e2){}
        try{ refreshPanel(); }catch(e2){}
        if(window.showToast) showToast('已恢复刚才删除的笔记');
      }
      e.preventDefault();
    }
  }, true);

  // 供面板构建时取到「当前显示的这条」：用 data 属性和 noteText 反查
  function findNoteByKey(lang, gi, from, to){
    for(var k=0;k<NOTES.length;k++){
      var x=NOTES[k];
      if(x.lang===lang && +x.gi===+gi && x.from===+from && x.to===+to) return x;
    }
    return null;
  }

  /* ---------- 面板重建 ----------
     原阅读器 refreshPanel 同一段（lang+gi）只渲染“最新一条”，
     导致同段多条高亮时：列表里看不到其余条目、✕ 删的也不是显示的那条。
     这里整段重写：逐条列出每一枚高亮/划线，各自带 ✕，
     并用索引精确定位要删的笔记（不依赖 gi/from/to 去猜）。 */
  function hexOf(n){ return n.color || '#ffe58a'; }

  function buildPanel(){
    var p = document.getElementById('note-panel');
    if(!p) return;
    // 按「章 -> 段 -> 段内位置」排序，列表更稳
    var order = NOTES.map(function(n,i){ return i; });
    order.sort(function(a,b){
      var A=NOTES[a], B=NOTES[b];
      if((A.sec||'') !== (B.sec||'')) return (A.sec||'') < (B.sec||'') ? -1 : 1;
      if(+A.gi !== +B.gi) return +A.gi - +B.gi;
      if(A.lang !== B.lang) return A.lang < B.lang ? -1 : 1;
      return (A.from||0) - (B.from||0);
    });

    var html = '<div class="np-head"><b>📝 我的笔记 ('+NOTES.length+')</b>'
             + '<span class="np-tools">'
             + '<button class="np-exp">导出</button>'
             + '<button id="np-clear" class="clr">清除全部</button>'
             + '<button id="np-close">关闭</button></span></div>';

    if(!NOTES.length){
      html += '<div class="np-empty">还没有笔记。<br>在正文里选中文字，即可「高亮」或「划线」。</div>';
    }else{
      for(var k=0;k<order.length;k++){
        var idx = order[k];
        var n = NOTES[idx];
        var t = '';
        try{ t = window.noteText ? window.noteText(n) : ''; }catch(e){}
        if(!t) t = '…';
        var lang = n.lang==='en' ? '英' : '中';
        var mark = n.type==='hl'
          ? '<span style="background:'+hexOf(n)+'">&nbsp;&nbsp;&nbsp;</span>'
          : '<span style="text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#e8504a">&nbsp;&nbsp;&nbsp;</span>';
        html += '<div class="np-item" data-idx="'+idx+'" data-lang="'+n.lang+'" data-gi="'+n.gi+'" data-from="'+(n.from||0)+'" data-to="'+(n.to||0)+'">'
             +  '<div class="np-meta"><b>'+escText(n.sec||'')+' · '+((+n.i||0)+1)+'</b>'
             +  '<span style="color:var(--mute)">'+lang+'</span>'+mark
             +  (n.type==='ul'?'<span style="font-size:10px;color:var(--mute)">划线</span>':'<span style="font-size:10px;color:var(--mute)">高亮</span>')
             +  '<button class="np-del" data-idx="'+idx+'" title="删除这条笔记">✕</button>'
             +  '</div><div class="np-text">'+escText(t)+'</div></div>';
      }
    }
    p.innerHTML = html;

    var exp = p.querySelector('.np-exp');
    if(exp) exp.addEventListener('click', function(e){ e.stopPropagation(); showExport(exp); });
    var clr = p.querySelector('#np-clear');
    if(clr) clr.addEventListener('click', function(e){ e.stopPropagation(); clearAll(); });
    var cls = p.querySelector('#np-close');
    if(cls) cls.addEventListener('click', function(e){ e.stopPropagation(); closePanel(); });
  }

  function escText(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function clearAll(){
    if(!NOTES.length) return;
    if(!window.confirm('确定清除全部 '+NOTES.length+' 条笔记？')) return;
    NOTES.length = 0;
    try{ saveNotes(); }catch(e){}
    try{ renderAllMarks(); }catch(e){}
    try{ refreshPanel(); }catch(e){}
    if(window.showToast) showToast('已清除全部笔记');
  }

  function closePanel(){
    var p = document.getElementById('note-panel');
    if(p) p.style.display = 'none';
    if(typeof window.hidePanel === 'function'){ try{ window.hidePanel(); }catch(e){} }
  }

  /* ✕ 删除：document 捕获阶段监听，抢在面板自身的 .np-item 跳转
     （捕获 + stopImmediatePropagation）之前处理。 */
  document.addEventListener('click', function(e){
    var del = e.target && e.target.closest && e.target.closest('#note-panel .np-del');
    if(!del) return;
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation) e.stopImmediatePropagation();
    var idx = +del.getAttribute('data-idx');
    if(isNaN(idx) || idx<0 || idx>=NOTES.length){
      // 兜底：用 data 属性反查
      var item = del.closest('.np-item');
      if(item){
        var lang = item.getAttribute('data-lang')==='zh'?'zh':'en';
        var gi = +item.getAttribute('data-gi');
        var from = +item.getAttribute('data-from');
        var to = +item.getAttribute('data-to');
        idx = -1;
        for(var k=0;k<NOTES.length;k++){
          var x=NOTES[k];
          if(x.lang===lang && +x.gi===gi && (+x.from||0)===from && (+x.to||0)===to){ idx=k; break; }
        }
      }
    }
    if(idx<0 || idx>=NOTES.length){ if(window.showToast) showToast('未找到该笔记'); return; }
    deleteNote(NOTES[idx]);
  }, true);

  /* 覆盖 refreshPanel：改为逐条列出全部笔记 */
  window.refreshPanel = buildPanel;
  try{ refreshPanel = window.refreshPanel; }catch(e){}

  // 初始化时若面板已存在也重建一次
  buildPanel();

  window.__notesExport = { markdown: buildMarkdown, text: buildText, json: buildJSON, citation: citation };
})();
</script>
  <button class="reader-settings-btn" id="reader-settings-btn" title="阅读主题与字体" aria-label="阅读主题与字体">&#9881; 主题</button>
  <div class="reader-settings" id="reader-settings" role="dialog" aria-label="阅读设置"></div>
  <div class="chapter-hud" id="chapter-hud" title="点击展开目录"><span class="ch-hud-tag">当前位置</span><span class="ch-hud-name"></span></div>
<script>
/* ============ 阅读主题 / 字体 / 章节 HUD (READER-THEME-HUD) ============ */
(function(){
  var THEME_KEY = 'readerhub_theme';        // 共用
  var FONT_KEY  = 'readerhub_font';         // 共用
  var SCALE_KEY = 'readerhub_scale';        // 共用

  // group: reading = 阅读主题；fun = 趣味主题（与首页一致）
  var THEMES = [
    {id:'light',  name:'亮色',   bg:'#f7f5f0', ink:'#2b2b2b', group:'reading', ico:'☀'},
    {id:'sepia',  name:'护眼',   bg:'#f3ead8', ink:'#43382a', group:'reading', ico:'📖'},
    {id:'dark',   name:'深色',   bg:'#1d2024', ink:'#dfe3e8', group:'reading', ico:'🌙'},
    {id:'night',  name:'夜间',   bg:'#0e0f11', ink:'#c9ccd1', group:'reading', ico:'🌑'},
    {id:'anime',  name:'动漫',   bg:'#fdf2f6', ink:'#3b2c3a', group:'fun', ico:'🌸'},
    {id:'pixel',  name:'像素',   bg:'#1a1c2c', ink:'#f4f4f4', group:'fun', ico:'👾'},
    {id:'cyber',  name:'赛博朋克', bg:'#07070f', ink:'#d8e6ff', group:'fun', ico:'🛰'},
    {id:'ink',    name:'水墨',   bg:'#f6f3ec', ink:'#20201d', group:'fun', ico:'🖌'},
    {id:'forest', name:'森林',   bg:'#f1f5ee', ink:'#243024', group:'fun', ico:'🌲'},
    {id:'ocean',  name:'海洋',   bg:'#eef6fb', ink:'#14313f', group:'fun', ico:'🌊'},
    {id:'news',   name:'报纸',   bg:'#f2ede1', ink:'#23211c', group:'fun', ico:'📰'},
    {id:'candy',  name:'糖果',   bg:'#fff7f0', ink:'#3d2f3a', group:'fun', ico:'🍬'},
    {id:'manga',  name:'漫画',   bg:'#fbfbfb', ink:'#111111', group:'fun', ico:'💥'},
    {id:'sakura', name:'樱花夜', bg:'#1b1430', ink:'#f0e6ff', group:'fun', ico:'🌸'},
    {id:'vapor',  name:'蒸汽波', bg:'#241b4a', ink:'#f7e9ff', group:'fun', ico:'🎴'}
  ];
  var FONTS = [
    {id:'serif',   name:'宋体', css:'"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,serif'},
    {id:'kai',     name:'楷体', css:'"Kaiti SC","STKaiti","KaiTi","Source Han Serif SC",serif'},
    {id:'sans',    name:'黑体', css:'"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif'},
    {id:'system',  name:'系统', css:'-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif'}
  ];
  var SCALES = [
    {id:'0.9',  name:'小'},
    {id:'1',    name:'中'},
    {id:'1.15', name:'大'},
    {id:'1.3',  name:'特大'}
  ];

  function get(k, d){ try{ return localStorage.getItem(k) || d; }catch(e){ return d; } }
  function set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

  var curTheme = get(THEME_KEY, 'light');
  var curFont  = get(FONT_KEY,  'serif');
  var curScale = get(SCALE_KEY, '1');

  // 书页现已支持全部 15 套主题（4 阅读 + 11 趣味），与首页完全一致。
  // 兼容旧数据：若 localStorage 里是未知/已废弃的主题 id，回退到亮色。
  function themeMeta(id){ for(var i=0;i<THEMES.length;i++) if(THEMES[i].id===id) return THEMES[i]; return THEMES[0]; }
  function normalizeTheme(id){ for(var i=0;i<THEMES.length;i++) if(THEMES[i].id===id) return id; return 'light'; }
  function fontMeta(id){ for(var i=0;i<FONTS.length;i++) if(FONTS[i].id===id) return FONTS[i]; return FONTS[0]; }

  function applyTheme(id, persist){
    // 书页支持全部 15 套主题。
    // persist=true 时才写回 THEME_KEY（用户手动选择时）。
    id = normalizeTheme(id);
    curTheme = id;
    if(id === 'light'){ document.documentElement.removeAttribute('data-theme'); }
    else{ document.documentElement.setAttribute('data-theme', id); }
    // 顶部/lang-head 品牌色仍用 accent；手机端状态栏色调（支持的浏览器）
    try{
      var m = document.querySelector('meta[name="theme-color"]');
      if(!m){ m = document.createElement('meta'); m.name='theme-color'; document.head.appendChild(m); }
      m.content = themeMeta(id).bg;
    }catch(e){}
    // 用户手动选择时覆盖共用 key；首屏回退应用时不写，保留主页的趣味主题。
    if(persist) set(THEME_KEY, id);
  }
  function applyFont(id){
    curFont = id;
    var f = fontMeta(id);
    document.documentElement.style.setProperty('--reader-font', f.css);
    document.body.setAttribute('data-font', id);
    set(FONT_KEY, id);
  }
  function applyScale(id){
    curScale = String(id);
    document.documentElement.style.setProperty('--reader-scale', curScale);
    set(SCALE_KEY, curScale);
  }

  // ---- 首屏尽早应用（避免闪烁）----
  applyTheme(curTheme, false);  // 首屏不写回 key（避免无谓写入）
  applyFont(curFont);
  applyScale(curScale);

  // ---- 设置面板 ----
  var panel = document.getElementById('reader-settings');
  var btn = document.getElementById('reader-settings-btn');

  function swatch(t){
    var light = (t.ink === '#2b2b2b' || t.ink === '#43382a' || t.ink === '#20201d' ||
                 t.ink === '#243024' || t.ink === '#14313f' || t.ink === '#23211c' ||
                 t.ink === '#3d2f3a' || t.ink === '#3b2c3a' || t.ink === '#111111');
    return '<div class="rs-sw'+(t.id===curTheme?' on':'')+'" data-theme-pick="'+t.id+'" '
      +  'title="'+t.name+'" style="background:'+t.bg+'">'
      +  '<span style="color:'+(light?'#666':'#bbb')+'">'+t.name+'</span>'
      +  '<i class="ico" style="font-style:normal">'+t.ico+'</i></div>';
  }
  function renderPanel(){
    var html = '<h4>阅读设置</h4>';
    html += '<div class="rs-row"><div class="rs-label">阅读主题</div><div class="rs-swatches">';
    THEMES.filter(function(t){return t.group==='reading';}).forEach(function(t){ html += swatch(t); });
    html += '</div></div>';
    html += '<div class="rs-row"><div class="rs-label">趣味主题</div><div class="rs-swatches">';
    THEMES.filter(function(t){return t.group==='fun';}).forEach(function(t){ html += swatch(t); });
    html += '</div></div>';
    html += '<div class="rs-row"><div class="rs-label">字体</div><div class="rs-opts">';
    FONTS.forEach(function(f){
      html += '<button class="rs-opt'+(f.id===curFont?' on':'')+'" data-font-pick="'+f.id+'" style="font-family:'+f.css+'">'+f.name+'</button>';
    });
    html += '</div></div>';
    html += '<div class="rs-row"><div class="rs-label">字号</div><div class="rs-opts">';
    SCALES.forEach(function(s){
      html += '<button class="rs-opt'+(s.id===curScale?' on':'')+'" data-scale-pick="'+s.id+'">'+s.name+'</button>';
    });
    html += '</div></div>';
    panel.innerHTML = html;
  }

  function togglePanel(force){
    var open = (typeof force==='boolean') ? force : !panel.classList.contains('open');
    if(open) renderPanel();
    panel.classList.toggle('open', open);
  }

  btn.addEventListener('click', function(e){ e.stopPropagation(); togglePanel(); });
  panel.addEventListener('click', function(e){
    e.stopPropagation();
    var sw = e.target.closest('[data-theme-pick]');
    if(sw){ applyTheme(sw.getAttribute('data-theme-pick'), true); renderPanel(); return; }
    var fo = e.target.closest('[data-font-pick]');
    if(fo){ applyFont(fo.getAttribute('data-font-pick')); renderPanel(); return; }
    var sc = e.target.closest('[data-scale-pick]');
    if(sc){ applyScale(sc.getAttribute('data-scale-pick')); renderPanel(); return; }
  });
  document.addEventListener('click', function(e){
    if(panel.classList.contains('open') && !e.target.closest('#reader-settings') && !e.target.closest('#reader-settings-btn'))
      togglePanel(false);
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') togglePanel(false);
  });

  // ---- 目录项与章节 id 建立映射，修正高亮 + 供 HUD 使用 ----
  // 原书用 `el.textContent.includes(labelOf(id))` 判断高亮，对多数章节失效。
  // 这里改用「TOC 生成顺序 = tocOrder」建立 data-sec-id，按 id 精确高亮。
  var SEC_IDS = [];
  (function stampTocIds(){
    var order = (typeof tocOrder !== 'undefined' && tocOrder) ? tocOrder : null;
    var items = [].slice.call(document.querySelectorAll('.toc-item'));
    if(order && typeof EN !== 'undefined'){
      var ids = order.filter(function(id){ return EN.some(function(s){ return s.id === id; }); });
      if(ids.length === items.length){
        for(var k=0;k<items.length;k++){
          items[k].setAttribute('data-sec-id', ids[k]);
          SEC_IDS.push(ids[k]);
        }
        return;
      }
    }
    // 兜底：没有 tocOrder 时按 EN 顺序
    if(typeof EN !== 'undefined'){
      EN.forEach(function(s, idx){
        if(items[idx]){ items[idx].setAttribute('data-sec-id', s.id); SEC_IDS.push(s.id); }
      });
    }
  })();

  function markActive(id){
    var items = document.querySelectorAll('.toc-item');
    var hit = null;
    for(var k=0;k<items.length;k++){
      var on = items[k].getAttribute('data-sec-id') === id;
      items[k].classList.toggle('active', on);
      if(on) hit = items[k];
    }
    // 让当前章节在目录中保持可见（侧栏未折叠时）
    if(hit && hit.scrollIntoView){ /* 仅在目录自身可滚动时轻推，不移动正文 */ }
    return hit;
  }

  // ---- 当前章节 HUD ----
  var hud = document.getElementById('chapter-hud');
  var hudName = hud.querySelector('.ch-hud-name');
  var hudTimer = null;
  function activeTocLabel(){
    var el = document.querySelector('.toc-item.active');
    if(!el) return '';
    var sub = el.querySelector('.sub');
    var main = el.querySelector('span');
    var t = (main ? main.textContent : el.textContent) || '';
    if(sub && sub.textContent) t = t + ' · ' + sub.textContent;
    return t.replace(/\s+/g,' ').trim();
  }
  function flashHud(){
    hud.classList.add('ch-hud-show');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(function(){ hud.classList.remove('ch-hud-show'); }, 2600);
  }
  function updateHud(){
    hudName.textContent = activeTocLabel();
  }
  window.__updateChapterHud = updateHud;
  window.__flashChapterHud = flashHud;
  window.__markChapterActive = markActive;
  hud.addEventListener('click', function(){
    var app = document.querySelector('.app');
    if(app && app.classList.contains('sidebar-collapsed')){
      var tgl = document.getElementById('sidebar-toggle');
      if(tgl) tgl.click();
    }
  });
  setTimeout(updateHud, 60);

  // goTo() 之后：按 id 精确高亮 + 同步 HUD（兼容原有 __origGoTo 包装）
  function afterGoTo(id){
    if(id) markActive(id);
    updateHud();
    flashHud();
  }
  var __prevGoTo = window.goTo;
  if(typeof __prevGoTo === 'function'){
    window.goTo = function(id){
      var r = __prevGoTo.apply(null, arguments);
      setTimeout(function(){ afterGoTo(id); }, 0);
      return r;
    };
    // 折叠状态变化时短暂展示当前章节（让用户知道现在读到哪）
    var tgl = document.getElementById('sidebar-toggle');
    if(tgl) tgl.addEventListener('click', function(){ setTimeout(function(){ updateHud(); flashHud(); }, 60); });
    // 确定初始章节：优先 localStorage 记忆的位置，其次当前 active 项
