t", "text": "59 美國政府編印阿拉巴馬仲裁案和1871年《華盛頓條約》的相關文件，詳見：Papers Relating to the Treaty of Washington, Geneva Arbitration Tribunal, United States Dept. of State, Government Print Office, 1872."}, {"type": "text", "text": "60 Prince Kung to Anson Burlingame, March 15, 1864, FRUS, 1864, III, p. 377. 阿拉"}, {"type": "text", "text": "61 總署收南洋大臣曾國荃文，1884年11月13日（光緒10年09月26日），中央研究院近代史研究所藏，《總理各國事務衙門檔案》，01-18-002-01-039。"}, {"type": "text", "text": "換旗轉回招商局之事，清政府方面從4月籌議，到7月初原盤收回，看似平靜；但在美國方面卻為如何兼顧美國政府的立場及其人民在中國的私人利益該如何劃清界限，反復討論。早在旗昌洋行轉售案之前，福州領事榮日德約瑟（Joseph C. A. Wingate, 1830-1905）曾致電領事館詢問美國三藩市有一家公司願意賣給中國爆炸物資，要求駐華使館的指示。楊約翰建議廣州領事盡可能將這家企業的請求書送給某家商店，讓商務走商務的途徑，不去管它。假若一位領事能夠向中國當局推薦一個美國企業，或解釋它的優點或保證它的信用，用以促進某一美國的商務利益的話，是沒有理由不能這樣做，但是同時必須適當地注意到這一行動的官方性質。因此「目前我願意避免向中國方面推薦任何工業品如火藥或火器之類或任何其他物力，可以用作軍事目的來反對法國的。我們同法國的關係是友好的。我希望所有領事官不必做——甚至連非正式都應避免——任何可以被認為是破壞嚴格中立的事情。」 $^{63}$ 至於如有美國船員在中國水域替法國軍艦服勤，美國政府也善意規勸美國公民盡可能不必捲入交戰的一方；但是如有美國公民不聽規勸，那麼必須很清楚他們的行為是私人契約，這絕非受僱於美國政府的國家行為，他們和美國政府完全無涉 $^{64}$ 。從這些函電看來，美一方面要保護美國人民在中國通商口岸的通商貿易等權利，但基於和清、法兩國的友好關係，也不願擔負違反中立國家應盡義務之名，最好的方式便是敬告美國公民私人契約須自行承擔風險。"}, {"type": "text", "text": "旗昌洋行「再轉售」給招商局的事，關係到私人企業和政府交往的正當程序，且一年內來回周折，美國政府首要宣示的便是中立立場。美國新任國務卿貝爾德（Thomas Francis Bayard, 1828-1898）於1885年4月致電致代理公使石米德（Enoch J. Smithers, 1828-1895） $^{65}$ 表示他同意前任公使楊約翰給駐福州領事榮日德約瑟的指令。有鑑於美國與中法兩國的關係俱為友好，領事官員應避免做出冒犯任何嚴守中立（the strictest neutrality）的行為，即使是任何非正式的手段（informal manner）。因此，對於在上海的美國公民賣輪船給中國的事，其狀況也和福州領事呈報的情形相似，國務院對上海總領事司塔立（Julius H. Stahel, 1825-1912）採取一致的立場和指示 $^{66}$ 。"}, {"type": "text", "text": "國務卿貝爾德在回覆上海領事司塔立詢問「美國人可賣輪船給中國人嗎？」因司塔立交代不清，國務院要他留意幾個重點，因為每個選項牽涉不同國際法的適用。一、這些有疑問的輪船係註冊為美國船隻往返美國口岸和中國口岸嗎？或它們是航行於中國水域的外國輪船，通過正當（bona fide）的交易成為美國公民的財產？二、這些輪船的船東住在中國或非中國司法管轄地？三、這些輪船是要賣給中國政府或中國平民？四、這些輪船是被註冊為戰爭使用的船隻或是中國平民的私人武裝船或是政府的運輸船？是在開放口岸合法貿易的商船或是偷渡船？國務院提醒不論這四種情況如何，任何有美國官方的指示去介入這件輪船或財產的交易都極為不適當，因為美國政府應當在似有戰爭目的或交戰傾向的狀態中，維持一種中立態度。假如這樁交易肯定帶有平和並且不論在任何方面看來都不具有敵視目的，那麼領事館介入去註銷這些輪船的事才不違反美國政府的國際義務。國務卿要求上海領事採取最慎重的態度處理這樁交易，指示這樁交易必須有顯明而肯定的合法程序，若有任何疑慮，領事館就應拒絕介入 $^{67}$ 。6月初，美國國務院還下了一道指示，說明美國對清法戰爭時任何懸掛美國國旗的輪船從事戰時違禁品（contraband of war）的立場。國務院表示清、法兩國都和美國都處於友好和平狀態，警告美國輪船盡可能不要從事戰時違禁品，美國人民將冒著被交戰國家捕獲的風險。另一方面，美國政府也表示沒有理由禁止美國人民在通商口岸的航運通商，就算美國貨品被交戰一方攔截或沒收，也不應被擴大解釋為美國政府破壞國際法的中立原則 $^{68}$ 。"}, {"type": "text", "text": "62〈商局船業全數收回折〉，光緒11年6月初8日。《李文忠公全集·奏稿》，第54卷，頁33。"}, {"type": "text", "text": "63 Mr. Young to Wingate, Feb. 14, 1885, FRUS, 1885-1886, p. 157."}, {"type": "text", "text": "64 Mr. Bayard to Mr. Young, March 11, 1885, American Diplomatic and Public Papers, The French-China War. p. 460."}, {"type": "text", "text": "65 楊約翰於4月10日卸任，由原任鎮江領事石米德署領，田貝（Charles Denby）於10月1日接任。《清季中外使領年表》（北京：中華書局，1997，2版），頁61。"}, {"type": "text", "text": "66 Mr. Bayard to Mr. Smithers, Apr. 20, 1885, FRUS, 1885-1886, p. 170."}, {"type": "text", "text": "旗昌洋行將輪船轉回招商局之後，事已定局。8月7日，《北華捷報》於同一天刊出兩份訊息，一是署名為旗昌洋行代表W. V. Drummond（William Venn Drummond，亦即前述招商局所聘用的英國籍法律顧問擔文）指控《北華捷報》對這項交易的不實報導，因該報說旗昌洋行將名下一批輪船改掛中國旗，「明顯意含」（evidently mean to infer）旗昌洋行並非這些輪船的產權者，只是掛在美國國旗下的中國輪船。又說該報的一位原非正式天津通訊記者也曾指稱這份交易僅是「掛名和虛構的」（nominal and fictitious）。擔文表示不論是去年招商局賣船給旗昌是「正當交易」（bona fide transaction），現在旗昌洋行也是在「沒有義務、法律和道德（obligation, legal and moral）之下，將輪船再賣給招商局」；要求該報務必澄清並道歉，否則將採取法律行動控告《北華捷報》涉及誹謗罪 $^{69}$ 。二是同一天《北華捷報》編輯部刊出「拒絕道歉」聲明，說明擔文指涉該報「明顯意含」的指控說法是不正確的，他們絕未有此意圖。該報使用的是「經理」（manage）和「再轉讓」（retransfer）是正確用法，不僅完全駁斥擔文的指控，且提到清法戰爭適已結束，招商局和旗昌的交易案有必要公開向社會大眾解釋清楚。主編提到他們早收到一些質疑說該報壓制了無數個攻擊旗昌洋行的訊息報導，好像在幫旗昌洋行埋單一樣。該報嚴正說他們毋需道歉，也拒絕道歉 $^{70}$ 。"}, {"type": "text", "text": "上述涉及誹謗之事也逼得招商局必須出面回應。8月21日，《北華捷報》刊出招商局給主編的英文聲明，招商局先以案主身分澄清這事。表示招商局「換旗與再換旗」（transfer and retransfer）絕對是「正當交易」，是依照美國政府法律程序所完成的私人交易，雙方當事人是互相獨立的，任何一方都不受對方控制或影響。首先，強調楊約翰公使是負責之人，不可能用法律來壓制像旗昌這樣有信譽的企業。再者，招商局指出擔文不僅是旗昌代表，也兼有招商局非正式法律顧問的身分，他實際參與了這次招商局馬道台（馬建忠）的合約簽署。當他說輪船已交易並付款之後，楊約翰公使才能擔保這是「誠實的交易」(an honest transaction)。擔文比楊約翰更清楚這是筆「正當的交易」 $^{71}$ 。招商局的用意主要是不願讓前公使楊約翰捲入這場風波，而是讓英籍律師擔文扛起所有責任，以免讓美國政府難堪。然而，也有人為文說前公使楊約翰是精通世故的人，當他處理這筆龐大交易時說是「誠實的買賣」，但涉及換旗一事時又宣稱這是美國人給招商局船隻在戰時接受保護的恩典，這種兩面說法不具有公信力 $^{72}$ 。"}, {"type": "text", "text": "67 Mr. Bayard to Mr. Stahel, Apr. 14, 1885, FRUS, 1885-1886, pp. 170-171."}, {"type": "text", "text": "68 Mr. Bayard to Mr. Smithers, June 1, 1885, FRUS, 1885-1886, pp. 172-173. 國務院給代理駐華公使石米德的指示。"}, {"type": "text", "text": "69 \"W. V. Drummond to the Editor,\" The North China Herald and Supreme Court & Consular Gazette, Aug. 7, 1885, p. 152."}, {"type": "text", "text": "70 No Title, The North China Herald and Supreme Court & Consular Gazette, Aug. 7, 1885. p. 152."}, {"type": "text", "text": "8月21日，《北華捷報》也有一長文討論「中法戰爭期間的美國中立問題」（The United Neutrality in the Franco-Chinese War），認為1884年招商局輪船賣給旗昌洋行這件事如果說是「正當買賣」，那麼旗昌洋行「再度賣給」（resale）招商局這件事就需要更周全的解釋。他認為美國政府對於招商局換旗一事務必宣稱所有程序都是按照美國法律。中法宣戰之前所做的交易，儘管可被解讀為旗昌洋行的私下領域（private side）的交易，但這件事所具有公共層面（public side）的意義，不能被忽略。因為換旗一事關係戰爭期間的中立和國際法，不僅牽涉到美國與法國的關係，並且也將美國與其他國家的關係開了先例。他質疑旗昌洋行代表擔文所宣稱「沒有義務、法律和道德」條件下的再轉賣，指涉的理由不夠充分，對於李鴻章方面給予怎樣的壓力更是語為不詳，使得美國政府必須冒險破壞清法戰爭的中立立場。如果美國政府在此一特殊的政治情況下贊成「再交易」這件事，從國際"}, {"type": "text", "text": "觀點看來勢將愈為複雜 $^{73}$ 。"}, {"type": "text", "text": "這件事情引發的爭議風波，見諸於美國國務院給駐華公使館的指示，很清楚美國政府從一開始即不願介入任何可能違反中立的事情，但又不願限制美國人民的商業活動，而將類似美國公民在中國口岸的活動定調為私人企業的風險。至於李鴻章經歷這次換旗買賣後，深慶招商局得以保全輪船，等到清日甲午戰爭時也仿照前例，寄託給德國洋行接受保護，事後德國洋行再將財產轉回中國 $^{74}$ 。"}, {"type": "text", "text": "小結"}, {"type": "text", "text": "招商局與旗昌洋行在清法戰爭中的輪船交易，突顯歐美各國對於中法兩國武力衝突是否已屬國際法認知的戰爭狀態及各國應採取的相應外交行動。為了保護在中國通商口岸的權益免受中國地方政府和中央政府的干擾，歐美國家以兩國未正式宣戰為由，不需遵守戰爭國家中對港口封鎖、軍火供應和航行運輸的一些禁令。而清朝政府未曾宣示開戰，卻封鎖廣州口岸，同時又要求各國嚴守局外中立，宣告外國輪船不得運送敵船軍火物資，有意將情勢拉高到影響各國在華的口岸貿易和利益，可以說是總理衙門在外交上的成功謀略。當時李鴻章等主和派理解到清政府無法抵擋擁有現代武裝設備的法國蒸汽輪船，不僅向關係一向友好的美國尋求調和，也指望與法國交惡的德國調停，但德國並無意願，美國乃成為李鴻章最冀盼的調停國家。然而，法國根本不願美國出面調停，歐洲列強在1892年始將它們駐華盛頓的外交使節由公使升格為大使，到一次大戰前夕美國至多是徘徊於強權體系邊緣的國家，歐洲主要國家並不把美國視為影響國際權力均衡的一個砝碼 $^{75}$ 。"}, {"type": "text", "text": "73 \"The United Neutrality in the Franco-Chinese War,\" The North China Herald and Supreme Court & Consular Gazette, Aug. 21, 1885, p. 219."}, {"type": "text", "text": "74 例如1894年至少有以下兩件報導："}, {"type": "text", "text": "一、9月份Ph. Lieder購買招商局3船（Haean, Hsinchi, Hsinfung），懸掛德旗，並重新命名為（Kungyi, Shengyi, Mingui），洋行為Messrs. H. Mandl & Co. 見：The North China Herald and Supreme Court & Consular Gazette, Sep. 28, 1894, p. 512."}, {"type": "text", "text": "71 \"The China Merchant's N. Co.,\" The North China Herald and Supreme Court & Consular Gazette, Aug. 21, 1885, p. 220."}, {"type": "text", "text": "72 “Minster and Interviewee. The China Merchant’s N. Co.,” The North China Herald and Supreme Court & Consular Gazette, Aug. 21, 1885, p. 220."}, {"type": "text", "text": "二、11月招商局將4艘船隻（Hsinyü, Haeting, Fungshun, Meifoo）寄存德商B. Schmacker的禮和洋行（Messrs, Carlowitz & Co.）名下，改掛德國旗幟，並更名為（Leeyü, Leeting, Leeshun, Leefoo）。見：The North China Herald and Supreme Court & Consular Gazette, Nov. 2, 1894, p. 716."}, {"type": "text", "text": "近代以來中國被迫加入國際秩序，此一時間也是19世紀後半葉帝國主義國家因殖民侵略而發動大小戰役不斷，因而國際間開始積極謀求如何補救國際法上無開戰規則的缺點。戰爭時期中立國家被要求遵守戰時國際法之措施，即使是民間輪船亦必須遵守軍火禁運和輪船運濟，更何況具有半官方性質的輪船企業。從這一角度而言，清法戰爭的不宣而戰性質，是實踐國際法的外交歷程及適法性的探索，受到各國駐華公使的重視。事實上，當時國際法對於戰爭或敵對行為的開始及其法律效果仍有所爭議，如同前文提到清法戰爭時期美國楊約翰公使曾提出中國或有權利封鎖廣州口岸的疑問，希望國務院能有明白指示，因為南北戰爭及普法戰爭都曾有類似封鎖本國口岸的情形。旗昌洋行與招商局的交易是否妥切的疑慮，得以延伸為一樁公眾討論事件，可能令美國朝野聯想起記憶猶新的「阿拉巴馬仲裁案」，得以使美國人重新思考美國對華政策如何能有內外一致，自圓其說的法律見解。但是不論如何，歐美各國係以保有它們在中國的條約權利為考慮，中法「並未宣戰」的理由最能保有歐美各國保護他們在中國條約口岸的最大權益。"}, {"type": "text", "text": "這樁交易中的美國案主旗昌洋行在華的龐大利益，是19世紀後半葉商人利益主導下美國對華政策的投射，通過美國在華使領館與商人集團間的緊密合作得以順利操縱這樁敏感的跨國交易案，也說明了早期中美關係中美國政府如何在國家利益和私人大企業間左右逢源。輪船賣給招商局一事是否有損美國的中立？美國駐華領事館該如何對外解釋此事，並以此事評價美國政府在清法戰爭的中立政策？面對這些疑問，美國政府既為保有其商人在華的商務權益，又避免美國政府被質疑違反戰時中立的立場，最好方式便是將商人的投資風險定調為一種與政府無涉的私人契約。旗昌洋行和招商局的長期交往所奠定的信任基礎和利益互惠，加以楊約翰公使與李鴻章的私誼，均說明清法戰爭時期這樁「真買賣、假交易」的輪船交易案頗不尋常，也再度印證了早期中外關係中美國人時時贏得中國朝野所謂「最為恭順」讚語的特殊關係。"}, {"type": "text", "text": "清末官督商辦的統治機制最後造成的人事制度的弊端，長期為學者所詬病 $^{76}$ 。然而，在清法戰爭的特殊時期正是因為官督商辦機制，由李鴻章和其幕僚親信馬建忠精心策劃的這場政治布局才得以如此順利。招商局是李鴻章一手促成以收回中國內河航行利權的事業，因清法戰爭的爆發，使得招商局不得不和外國輪船公司合作接受保護。如何以密約的形式讓輪船招商局在戰後可以收回自己的財產，李鴻章很快就做出決定這項協約對當時上海的通商團體和投資者以保密方式進行，更將這件交易的法律見解援引到西方各國商船在開戰前之成例，而其交涉細則有英國籍律師擔文為之看守，不論李鴻章的奏摺或李鴻章掌控下的招商局在《北華捷報》聲明中都特別強調整件事情係由律師出面交涉的私人契約。"}, {"type": "text", "text": "75 Paul Kennedy, The Rise and Fall of the Great Powers (London: Unwin Hyman Limited, 1988), pp. 194, 248-249."}, {"type": "text", "text": "76 黎志剛，《輪船招商局經營管理問題，1872-1901》，《中央研究院近代史研究所期刊》第19期（1990年6月），頁67-108。黎志剛，《李鴻章與近代企業：輪船招商局（1872-1885）》，收入：易惠莉、胡政主編，《招商局與近代中國研究》，頁434-471。作者從管理角度對1872年至1901間輪船招商局從艱難起步到步入全盛、又由盛跌入泥淖的歷程，進行了全面和詳盡的分析，指出"}, {"type": "text", "text": "這場交易略帶有李鴻章個人的「托孤」性質，同時是李鴻章個人的政治風險，萬一戰事結束後旗昌洋行抬高身價反為美商所制，或者旗昌翻臉不認密約不願回售，將造成招商局的巨大損失。設想若是招商局當時為主戰派——「清流派」所攬，可能就有不一樣的結果。然而，再細究之，換旗一事也為李鴻章自嘲的「裱糊匠」事業再添一樁，只能東補西貼、虛有其表。李鴻章處理的僅僅是換旗的政治操作及保住招商局幾艘輪船和財產，如此小格局實為敷衍一時而已，並未從招商局的經營定位和人事制度等問題全盤規劃如何扶植民族企業以及「官督商辦」問題所面臨的真正難題。就在換旗之前招商局人事弊端已現，而換旗之後李系人馬徹底接掌了招商局，除了人事管理的舞弊之外，更加走向官僚資本的保護機構，在與外國的競爭、資本的不足、技術的落後和缺乏活力等方面，限制了中國早期工業化企業的發展 $^{77}$ 。"}, {"type": "text", "text": "本章所討論的政治外交因素深刻影響清法戰爭時期招商局與旗昌洋行的這次交易，拓展了我們對於戰爭時期企業活動和外交決策的理解。也可以說政治動盪和戰爭因素始終是近代中國經濟發展過程中的重大障礙，以及必須考慮到的國家治理層面如何影響了近代中國經濟的發展和停滯。有學者將招商局與日本明治維新的國家干預政策做一比較，「三菱·日本郵船會社」自1875年受日本政府發展輪船航運業政策的大力扶植，將其視為「殖產興業」總體戰略的一環。在1880年代中期三菱會社也和招商局一樣經歷了一次重大的人事改組，1885年三菱會社與共同運輸會社合併成為「日本郵船株式會社」，其後順利轉型，並快速取得在東亞水域的傲然航運成就 $^{78}$ 。對照之下，李鴻章去世的1901年，招商局已陷入勉力維持的窘境，招商局的革新成敗固然非李鴻章一人之責，但在清法戰爭時期殫精竭慮保住招商局事業的李鴻章，確實未能及時把握可利用的權力資源來革新整頓招商局的機會，以推動具有長遠且競爭力的經營方式，清帝國所暴露的國家治理危機及其內外相聯的因素也由此可見。"}, {"type": "text", "text": "77 費維愷著，虞和平譯《中國早期的工業化》，頁 185-192〈舞弊問題〉和第 7 章〈結論：走向官僚資本〉，頁 312-321。"}, {"type": "text", "text": "78 朱蔭貴的研究深入比較了招商局與日本明治維新時期同時起步的三菱·日本郵船會社，提出中日兩國政府在政策措施、資金補助、管理型態和動員民間資金上的不同，更深層的差異則是學習西方器械和文化上的認知，因此決定了招商局和三菱·日郵船社的不同命運。詳見：朱蔭貴，《國家干預經濟與中日近代化——輪船招商局與三菱·日本郵船會社的比較研究》（修訂版），（北京：社會科學文獻出版社，2017），頁167-192。甲午戰爭後日本輪船企業在中國水域的航運經營取得飛躍發展，到1903年日本已是世界第九大航運國。至於一戰以後日本航運業的研究，尚可參考：蕭明禮，《「海運興國」與「航運救國」：日本對華之航運競爭（1914-1945）（台北：台灣大學出版中心，2017）。"}, {"type": "text", "text": "導致這一切變化的根本原因在於管理不善，而「管理不善」又與中國社會結構內的官商關係和商人人際關係網有著直接的關係，從而為中國近代化延誤的原因提出新的解釋。"}, {"type": "note", "text": "2 過去對於輪船招商局的成立及1877年盤購旗昌輪船公司的案例，已相當充分，本文不擬詳述。最重要的研究為劉廣京，《中國境內英美輪船競爭》，該書主要探討了美商旗昌洋行、英商怡和洋行、太古洋行在中國航運市場的活動，以及中國成立輪船招商局以後與這些外輪的競爭。Kwang-Ching Liu, Anglo-American Steamship Rivalry in China, 1862-1874 (Cambridge, Mass.: Harvard University Press, 1962)。其次，黎志剛，《中國近代的國家與市場》（香港：香港教育圖書公司，2003年）及其有關招商局相關論文。此外，陳潮的研究探討1877年盤購旗昌輪船的交涉過程，側重負責此案交涉的李鴻章、徐潤和盛宣懷等人。陳潮，〈輪船招商局盤購旗昌輪船公司述論〉，《史林》，1988年第1期，頁51-58。聶寶璋和易惠莉的研究或從買辦角色或從商"}, {"type": "note", "text": "1 詳見：黎志剛，〈輪船招商局經營管理問題，1872-1901〉，《中央研究院近代史研究所期刊》，第19期（1990年6月），頁67-108。"}, {"type": "note", "text": "戰論，探討併購旗昌輪船公司案。聶寶璋，〈從美商旗昌輪船公司的創辦與發展看買辦的作用〉，《歷史研究》，1964年第2期，頁91-110。易惠莉，〈招商局併購美商旗昌輪船案與商戰論〉，《史林》，2009年第4期，頁41-53。易惠莉，〈唐廷樞、徐潤與招商局之籌建與改組〉，收入：香港中文大學中國文化研究所文物館、香港中文大學歷史系合編，《買辦與近代中國》（香港：香港三聯書店，2009年11月），頁194-221。"}, {"type": "note", "text": "3 例如：從中國民族主義的立場批判招商局的虛假出售案，稱：「控制招商局的官僚買辦資階級是外國侵略勢力豢養的附庸」。張國輝，〈中國近代航運業的醞釀和輪船招商局的產生〉，易惠莉、胡政主編，《招商局與近代中國研究》（北京：中國社會科學出版社，2005），頁211。"}, {"type": "note", "text": "問題，詳見：吳翎君，《美國大企業與近代中國的國際化》，（台北：聯經出版公司，2012。北京：社會科學文獻出版社，2014），第1章。"}, {"type": "note", "text": "6〈總署收總稅務司赫德呈〉，光緒10年3月22日（1884年4月17日）《中美關係史料·光緒朝二》（台北：中央研究院近代史研究所，1988），頁1029。"}, {"type": "note", "text": "4 關於旗昌洋行在中國的早期歷史發展，可參閱：He Sibing, “Russell and Company, 1818-1891, America’s Trade and Diplomacy in Nineteen-Century” Miami University, Department of History, 1997 (Ph. D. dissertation) 該文主要從美國在華貿易與外交的視角探討旗昌在中國的活動，但並未探討清法戰爭期間招商局和旗昌的交易。"}, {"type": "note", "text": "7 香港上海匯豐銀行（The Hongkong and Shanghai Banking Corporation Limited, HSBC）於1864年成立之初，看中旗昌在中國市場的影響力，積極拉攏旗昌大股東福布斯家族（Forbes Family），後來福布斯（William Howell Forbes, 1837-1896）於1879-1880年出任匯豐銀行第11屆董事會總裁（Chairman），可見旗昌洋行在遠東市場的動見觀瞻。詳見：Ji Zhaojin, A History of Modern Shanghai Banking: The Rise and Decline of China Finance Capitalism (Armonk, New York: London, M. E. Sharpe, 2003)。波士頓商人福布斯家族檔案收存於美國波士頓麻省歷史學會（Massachusetts Historical Society）。詳見http://www.masshist.org/collection-guides/view/fa0269。"}, {"type": "note", "text": "5 不僅是旗昌洋行合夥人，甚至雇員也出任美國駐中國口岸領事，例如：任職旗昌洋行且不通曉漢語的畢理格（William Breck，又譯為別列子或柏賴克），於1863年出任漢口領事。中央研究院近代史研究所編，《中美關係史料·同治朝》（台北：中央研究院近代史研究所，1988），頁52。美國商人兼領事的"}, {"type": "note", "text": "8 公正輪船公司早於1860年代成立，是資本較小的企業。太古輪船公司為一家在英國集股的大企業，創辦資本36萬英鎊，由史懷爾（John Samuel Swire, 1825-1898）於1872年在倫敦籌集。由怡和洋行創辦的華海輪船公司，除原本怡和洋行的資金外，另有部分資金來自中國口岸的中國買辦商人和英國小洋行的認股。劉廣京，《中英輪船航運競爭，1872-1885》，收入氏著，《經世思想與新興企業》（台北：聯經出版公司，1990），頁528-531。"}, {"type": "note", "text": "11 劉廣京，〈中英輪船航運競爭，1872-1885〉，《經世思想與新興企業》，頁525-565。"}, {"type": "note", "text": "12 Mr. Seaward to Mr. Fish, Jan. 30, 1877, Papers Relating to the Foreign Relations of the United States (簡稱 FRUS，以下同) 1877-1878, p. 90."}, {"type": "note", "text": "9 同治12年11月13日（1874年1月1日），《李文忠公全集·朋僚函電》（台北：文海出版社，1962）第13卷，頁24。"}, {"type": "note", "text": "10 黎志剛，〈輪船招商局經營管理問題，1872-1901〉，《中央研究院近代史研究所期刊》，第19期（1990年6月），頁75。"}, {"type": "note", "text": "13 1887年時招商局投入營運的輪船只有28艘；甚至在1914年該局也只有30艘輪船，因此，併購旗昌輪船公司案，可說是中國早期輪船工業的一次重大發展。費維愷（Albert Feuerwerker）著，虞和平譯，《中國早期的工業化》（China's Early Industrialization, Harvard University, 1958）（北京：中國社會科學出版社，1990），頁233。"}, {"type": "note", "text": "14 北洋通商大臣李鴻章函總署1877年1月20日（光緒2年12月7日），《總理各國事務衙門檔案》，中央研究院近代史研究所檔案館藏，01-05-010-03-006。（以下同）另見，中央研究院近代史研究所編，《海防檔·甲買船炮（三）》（台北：中央研究院近代史研究所，1957），頁952-956。"}, {"type": "note", "text": "15 由江南各庫局（五省）籌借50萬。「……事機倉猝，斷非招股所能應手。欲求大局持久，似非官照商力不妥。擬懇由江南籌借五十萬。浙江江西湖北四川山東五省合籌五十萬，可否免支利息分作十年，由該局每年繳還十萬，一定不移」。《總理各國事務衙門檔案》，01-05-010-03-006，1877年1月20日（光緒2年12月7日），照錄覆南洋大臣兩江督院沈諮稿。另見：中央研究院近代史研究所編，《海防檔·甲買船炮（三）》，頁939-947。"}, {"type": "note", "text": "16 Mr. Seward to Mr. Fish, Jan. 30, 1877, FRUS, 1877-1878, pp. 88-91."}, {"type": "note", "text": "17 劉廣京，〈1883年上海金融風暴〉，收入劉廣京著，《經濟世思想與新興企業》，頁571-593。卜永堅，〈徐潤與晚清經濟〉，收入：香港中文大學中國文化研究所文物館、香港中文大學歷史系合編，《買辦與近代中國》，頁221-232。"}, {"type": "note", "text": "20 Jules Davids ed., American Diplomatic and Public Papers, Series 2: The United States, China, and Imperial Rivalries, 1861-1893. Vol. 6, The French-China War (Wilmington, Del.: Scholarly Resources Inc., 1979), pp. 170-171."}, {"type": "note", "text": "18 招商局的這次大改組是盛宣懷日後長期掌控招商局的一個起點，盛在1885-1902成為招商局的督辦，實際掌控了招商局。黎志剛，〈輪船招商局經營管理問題，1872-1901〉，頁67-108。費維愷（Albert Feuerwerker）著，虞和平譯《中國早期的工業化》，頁192-240。"}, {"type": "note", "text": "21 楊約翰著有 Around the World with General Grant (American News Company, 1879)，記錄了前總統格蘭特訪問歐洲、亞洲和非洲各國的見聞及美國對外政策的想法。書中提到有趣的比較是格蘭特將軍崛起於美國南北戰爭，此其時李鴻章所練的淮軍則是平定太平天國之亂，李鴻章自負地說：「格蘭特將軍和我鎮壓了歷史上最知名的叛亂」，還開玩笑說他姓李，格蘭特的對手也姓李（指：李將軍，Robert Edward Lee, 1807-1870）。見該書，頁371-372。"}, {"type": "note", "text": "19 陳霞飛編，《中國海關密檔：赫德和金登干的往來函電彙編》（北京：中華書局，1990），第4冊，頁555。1884年6月4日。"}, {"type": "note", "text": "22 中國近代史叢書編寫組，《中法戰爭》，第7冊（上海：上海人民出版社，1972），頁719。"}, {"type": "note", "text": "23〈寄譯署〉，光緒10年6月初4（1884年7月25日）午刻。《李文忠公全集·電稿》，第3卷，頁64。"}, {"type": "note", "text": "24〈寄閩防張會辦〉，光緒10年6月初4（1884年7月25日）申刻。《李文忠公全集·電稿》，第3卷，頁64。"}, {"type": "note", "text": "25〈馬道由滬局來電〉，光緒10年6月初5（1884年7月26日）。《李文忠公全集·電稿》，第3卷，頁64。"}, {"type": "note", "text": "26〈寄滬招商局馬道〉，光緒10年6月初6（1884年7月27日）午刻。《李文忠公全集·電稿》，第3卷，頁65。"}, {"type": "note", "text": "27〈寄滬招商局馬道〉，光緒10年6月初6（1884年7月27日）申刻。《李文忠公全集·電稿》，第3卷，頁65。"}, {"type": "note", "text": "28〈寄滬招商局馬道〉，光緒10年6月初9（1884年7月30日）申刻。《李文忠公全集·電稿》，第3卷，頁66。"}, {"type": "note", "text": "33〈馬道來電〉，光緒10年6月初10（1884年7月31日）。酉刻到，《李文忠公全集·電稿》，第3卷，頁67。"}, {"type": "note", "text": "34〈寄譯署〉，光緒10年6月18日（1884年8月8日）酉刻，《李文忠公全集·電稿》，第3卷，頁70。"}, {"type": "note", "text": "29〈寄上海曾宮保〉，光緒10年6月初9（1884年7月30日）午刻。《李文忠公全集·電稿》，第3卷，頁66。"}, {"type": "note", "text": "30〈福州將軍等致譯署〉，光緒10年6月初9日（1884年7月30日）酉刻到，《李文忠公全集·電稿》，第3卷，頁66。"}, {"type": "note", "text": "31〈曾宮保來電〉，光緒10年6月初9日已刻到（1884年7月30日）。〈譯署致曾宮保〉，光緒10年6月11日丑刻到，《李文忠公全集·電稿》，第3卷，頁66-67。"}, {"type": "note", "text": "32〈寄譯署〉，光緒10年6月初10（1884年7月31日）。午刻，《李文忠公全集·電稿》，第3卷，頁67。"}, {"type": "note", "text": "35〈醇親王致翁同龢函稿第五十六〉，光緒10年6月初8（1884年7月29日），翁萬戈輯，《翁同龢文獻叢編》，四（台北：藝文印書館，2002），頁155-157。編者翁萬戈為翁同龢後人。奕訢所指揮的軍機處因處理清法戰爭，和戰不定，清軍履遭敗退，慈禧太后藉口「委靡因循」，於1884年3月罷去奕訢一切職務，令其居家養疾，同時由禮親王世鐸、醇親王取而代之，以慈禧為首的中樞改組。然朝廷內部因和戰問題仍紛擾不止。醇親王奕譞受命為總理海軍事務，名義上為清末海軍及北洋水師最高統帥，實際上指揮權屬於李鴻章及淮軍丁汝昌。清法戰爭中的主戰派以清流派代表翁同龢為首。"}, {"type": "note", "text": "37〈直隸總督李鴻章奏法人開釁招商局輪船擬暫售與美國旗昌洋行折〉，王彥威編，《清季外交史料》，第45卷之15，頁845。"}, {"type": "note", "text": "36〈直隸總督李鴻章奏法人開釁招商局輪船擬暫售與美國旗昌洋行折〉，王彥威編，《清季外交史料》，第45卷之15，（台北：文海出版社，1985），頁844-"}, {"type": "note", "text": "38 總署直隸總督李鴻章函，1885年5月23日（光緒11年04月10日），《總理各國事務衙門檔案》，01-13-007-06-005。"}, {"type": "note", "text": "39 總署收南洋大臣曾國荃文，1884年11月13日（光緒10年09月26日），《總理各國事務衙門檔案》，01-18-002-01-039。"}, {"type": "note", "text": "40 Mr. Young to Mr. Frelinghuysen, Nov. 8, 1883 (received Jan. 9, 1884), FRUS, 1884-1885, p. 46. Mr. Seymour to Mr. Young, Sep. 10, 1883, FRUS, 1884-1885, pp. 46-47. 這次廣東動亂的起源是1883年9月航行於廣州和香港的英船「漢口號」(Hankow)停靠在廣州時發生的一起事件。該船葡籍水手可能是蓄意或意外將一名中國平民推下船，致其溺斃，因而引起廣東人民的忿怒。數名暴民試圖燒掉船隻和碼頭，接著群聚的中國人民大肆破壞廣州沙面的洋人居留區住宅、設施建築和工廠，從新建成的Raven工廠開始，一路破壞掠奪，甚至連廣州英國公使館東側和鄰近的旗昌洋行，也無一倖免。廣州人的憤怒其來有自，因為之前發生的一名喝醉酒的英國公民（叫作Logan）謀殺一名無辜的中國人，廣州人的忿怒尚未平息，接著又發生英船「漢口號」事件，乃有這次的廣東動亂。"}, {"type": "note", "text": "41 Mr. Young to Mr. Frelinghuysen, Aug. 12, 1884, FRUS, 1884-1885, p. 103."}, {"type": "note", "text": "42 19世紀末國際間因為「不宣而戰」導致國際危機不斷，例如：1700-1870年"}, {"type": "note", "text": "間尚發生107次未經宣戰的敵對行為，使得「宣戰」程序愈來愈受重視。迄於20世紀初以前國際間「不宣而戰」仍是普遍現象。1906年「國際法學會」（International Law Association）通過決議，主張國際間非先提出宣戰書或最後通牒，即不得開始戰爭，1907年第二次海牙和平會議正式接納此項主張，制訂《戰爭開始條約》（Convention on the Opening of Hostilities）。丘宏達，《現代國際法》（台北：三民書局，1993年，10版），頁677-694。"}, {"type": "note", "text": "43 Mr. Frelinghuysen to Mr. Young, Jan. 22, 1884, FRUS, 1884-1885, p. 64."}, {"type": "note", "text": "44 Mr. Young to Mr. Frelinghuysen, Feb. 11, 1884, FRUS, 1884-1885, pp. 66-69."}, {"type": "note", "text": "45 Mr. Young to Mr. Frelinghuysen, Feb. 11, 1884, FRUS, 1884-1885, pp. 66-69."}, {"type": "note", "text": "46 Legation of United States (Mr. Young) to the Secretary of United States (Mr. Frelinghuysen), Sep. 16, 1884, FRUS, 1884-1885, pp. 103-104."}, {"type": "note", "text": "47〈英國公使巴夏禮照會署〉，光緒10年08月16日；1884-10-04，《總理各國事務衙門檔案》，越南檔，01-24-013-03-013。這份照會也提到英國輪船亦有裝運軍火接濟台灣華軍之事，英國領事「實無權力禁止」。此外，次年（1885年）2月法國曾一度宣布將運往廣州以北的大米作為違禁品，企圖切斷中國漕米的供應，遭到英國反對。因為大部分運送米糧的船隻係懸掛英國國旗，指摘法國此舉違反中立國權利。但法國的禁運並未實施，因戰事不久即告終。關於英國對法國行動的反應，詳見：林學忠，《從萬國公法到公法外交》（上海：上海古籍出版社，2009），頁270-272。美國政府檔案中亦收有法國照會各國駐上海領事代表宣布自2月26日起大米運送為違禁品，美國政府對此亦表抗議。Mr. Young to Mr. Byard, March 13, 1885. “Rice to be considered contraband of war,” FRUS, 1884-1885, p. 161."}, {"type": "note", "text": "史料·光緒朝二》，頁1047。Mr. Young to Mr. Frelinghuysen, Sep. 16, 1884, FRUS, 1884-1885, p. 104."}, {"type": "note", "text": "49 總署致美使楊約翰照會，1884年7月19日（光緒10年閏5月27日）。《中美關係史料·光緒朝二》，頁1043-1044。"}, {"type": "note", "text": "50〈照會澳門羅大臣嚴守局外公法〉，1884年8月24日（光緒10年7月初4日），《張文襄公全集》，引自：《中法戰爭資料》（四），頁438。1885年2月21日，張之洞又照會澳門官府阻止法人借地屯兵，亦援引萬國公法「凡局外之國，均不得在境內准交戰之國招募兵勇，置辦戰具，並不准戰船入口及借地屯兵等事，……深知貴大臣必援公法，自守局外之義，堅持不許」。〈照會澳門羅大臣阻止法人借地屯兵〉，1885年2月21日（光緒11年正月初7日），《張文襄公全集》，引自：《中法戰爭資料》（四），頁441。"}, {"type": "note", "text": "48 總署收美使楊約翰照會，1884年7月29日（光緒10年6月初5），《中美關係"}, {"type": "note", "text": "51〈請飭各行商不得接濟法船煤斤〉，1884年8月28日（光緒10年7月8日）。出自：廣西師範大學出版社編，《中美往來照會集，1846-1931》（桂林：廣西師範大學出版社，2006），第6冊，頁346。此份文件亦即美國國家檔案館1996年出版之Selected Records of the U.S. Legation in China, 1849-1931. 編號T898，共20卷之微卷影本。"}, {"type": "note", "text": "54 出使大臣李鳳苞函總署，1884年10月20日（光緒10年09月02日），《總理各國事務衙門檔案》，01-24-014-4-012。李鳳苞為出使德國、法國、奧國、荷蘭、義大利公使。"}, {"type": "note", "text": "55 出使大臣李鳳苞函總署抄檔，諭旨飭鳳苞，1884年10月20日（光緒10年09月02日），《總理各國事務衙門檔案》，01-24-014-4-012。"}, {"type": "note", "text": "52〈閩省將堵塞水路兵商船暫緩出入〉，1884年8月27日（光緒10年7月7日），〈因法人渝盟沿海各省督撫奉旨一律保護各國商民〉，1884年9月3日（光緒10年7月14日）。廣西師範大學出版社編，《中美往來照會集，1846-1931》，第6冊，頁347、348。"}, {"type": "note", "text": "56 這篇函電中提到楊約翰的善意「我兩國友誼素最睦，無論何事何時，如有關中國強盛及致與天下相和之處，本館自必樂於為之盡力也」。總署收美使楊約翰照會，1884年8月15日（光緒10年6月25日），《中美關係史料·光緒朝二》，頁1056。Jules Davids ed., American Diplomatic and Public Papers, Series 2: The United States, China, and Imperial Rivalries, 1861-1893. Vol. 6, The French-China War. pp. 231-232."}, {"type": "note", "text": "53〈光緒十年對法宣戰詔書〉（光緒10年7月初6日），上論·光緒皇帝。引用文獻見：https://zh.wikisource.org/zh-hant/。法國對於「不宣而戰」的見解，詳見：Lewis M. Chere, The Diplomacy of the Sino-French War, 1883-1885: Global Complications of an Undeclared War (Notre Dame, Ind: Cross Cultural Publications, Cross Roads Books. 1988)."}, {"type": "note", "text": "57 出使大臣李鳳苞函總署，1884年10月20日（光緒10年09月02日），《總理各國事務衙門檔案》，01-24-014-4-012。"}, {"type": "note", "text": "58 總署致美使楊約翰照會，1884年8月18日（光緒10年6月28日），《中美關係史料·光緒朝二》，頁1057。Jules Davids ed., American Diplomatic and"}, {"type": "note", "text": "Public Papers, The French-China War. pp. 92-93. 關於清法戰爭期間美國的調停，另可參見：Robert Hopkins Miller, United States and Vietnam, 1787-1941 (Washington, DC: National Defense University Press, 1990), pp. 102-103."}, {"type": "note", "text": "巴馬號事件發生時，美國駐華公使蒲安臣（Anson Burlingame）曾致函給總理衙門表示，由於阿拉巴馬號船艦在太平洋攻擊和掠奪聯邦政府的商船，希望清政府勿要讓該艦停靠在中國口岸。恭親王不僅答應，而且表示美國內戰的情況如同當時的太平軍叛亂，美國的處境和清政府非常相似，自當樂意配合美國的要求。"}, {"type": "note", "text": "59 美國政府編印阿拉巴馬仲裁案和1871年《華盛頓條約》的相關文件，詳見：Papers Relating to the Treaty of Washington, Geneva Arbitration Tribunal, United States Dept. of State, Government Print Office, 1872."}, {"type": "note", "text": "60 Prince Kung to Anson Burlingame, March 15, 1864, FRUS, 1864, III, p. 377. 阿拉"}, {"type": "note", "text": "61 總署收南洋大臣曾國荃文，1884年11月13日（光緒10年09月26日），中央研究院近代史研究所藏，《總理各國事務衙門檔案》，01-18-002-01-039。"}, {"type": "note", "text": "62〈商局船業全數收回折〉，光緒11年6月初8日。《李文忠公全集·奏稿》，第54卷，頁33。"}, {"type": "note", "text": "63 Mr. Young to Wingate, Feb. 14, 1885, FRUS, 1885-1886, p. 157."}, {"type": "note", "text": "64 Mr. Bayard to Mr. Young, March 11, 1885, American Diplomatic and Public Papers, The French-China War. p. 460."}, {"type": "note", "text": "65 楊約翰於4月10日卸任，由原任鎮江領事石米德署領，田貝（Charles Denby）於10月1日接任。《清季中外使領年表》（北京：中華書局，1997，2版），頁61。"}, {"type": "note", "text": "66 Mr. Bayard to Mr. Smithers, Apr. 20, 1885, FRUS, 1885-1886, p. 170."}, {"type": "note", "text": "67 Mr. Bayard to Mr. Stahel, Apr. 14, 1885, FRUS, 1885-1886, pp. 170-171."}, {"type": "note", "text": "68 Mr. Bayard to Mr. Smithers, June 1, 1885, FRUS, 1885-1886, pp. 172-173. 國務院給代理駐華公使石米德的指示。"}, {"type": "note", "text": "69 \"W. V. Drummond to the Editor,\" The North China Herald and Supreme Court & Consular Gazette, Aug. 7, 1885, p. 152."}, {"type": "note", "text": "70 No Title, The North China Herald and Supreme Court & Consular Gazette, Aug. 7, 1885. p. 152."}, {"type": "note", "text": "73 \"The United Neutrality in the Franco-Chinese War,\" The North China Herald and Supreme Court & Consular Gazette, Aug. 21, 1885, p. 219."}, {"type": "note", "text": "74 例如1894年至少有以下兩件報導："}, {"type": "note", "text": "一、9月份Ph. Lieder購買招商局3船（Haean, Hsinchi, Hsinfung），懸掛德旗，並重新命名為（Kungyi, Shengyi, Mingui），洋行為Messrs. H. Mandl & Co. 見：The North China Herald and Supreme Court & Consular Gazette, Sep. 28, 1894, p. 512."}, {"type": "note", "text": "71 \"The China Merchant's N. Co.,\" The North China Herald and Supreme Court & Consular Gazette, Aug. 21, 1885, p. 220."}, {"type": "note", "text": "72 “Minster and Interviewee. The China Merchant’s N. Co.,” The North China Herald and Supreme Court & Consular Gazette, Aug. 21, 1885, p. 220."}, {"type": "note", "text": "二、11月招商局將4艘船隻（Hsinyü, Haeting, Fungshun, Meifoo）寄存德商B. Schmacker的禮和洋行（Messrs, Carlowitz & Co.）名下，改掛德國旗幟，並更名為（Leeyü, Leeting, Leeshun, Leefoo）。見：The North China Herald and Supreme Court & Consular Gazette, Nov. 2, 1894, p. 716."}, {"type": "note", "text": "75 Paul Kennedy, The Rise and Fall of the Great Powers (London: Unwin Hyman Limited, 1988), pp. 194, 248-249."}, {"type": "note", "text": "76 黎志剛，《輪船招商局經營管理問題，1872-1901》，《中央研究院近代史研究所期刊》第19期（1990年6月），頁67-108。黎志剛，《李鴻章與近代企業：輪船招商局（1872-1885）》，收入：易惠莉、胡政主編，《招商局與近代中國研究》，頁434-471。作者從管理角度對1872年至1901間輪船招商局從艱難起步到步入全盛、又由盛跌入泥淖的歷程，進行了全面和詳盡的分析，指出"}, {"type": "note", "text": "77 費維愷著，虞和平譯《中國早期的工業化》，頁 185-192〈舞弊問題〉和第 7 章〈結論：走向官僚資本〉，頁 312-321。"}, {"type": "note", "text": "78 朱蔭貴的研究深入比較了招商局與日本明治維新時期同時起步的三菱·日本郵船會社，提出中日兩國政府在政策措施、資金補助、管理型態和動員民間資金上的不同，更深層的差異則是學習西方器械和文化上的認知，因此決定了招商局和三菱·日郵船社的不同命運。詳見：朱蔭貴，《國家干預經濟與中日近代化——輪船招商局與三菱·日本郵船會社的比較研究》（修訂版），（北京：社會科學文獻出版社，2017），頁167-192。甲午戰爭後日本輪船企業在中國水域的航運經營取得飛躍發展，到1903年日本已是世界第九大航運國。至於一戰以後日本航運業的研究，尚可參考：蕭明禮，《「海運興國」與「航運救國」：日本對華之航運競爭（1914-1945）（台北：台灣大學出版中心，2017）。"}, {"type": "note", "text": "導致這一切變化的根本原因在於管理不善，而「管理不善」又與中國社會結構內的官商關係和商人人際關係網有著直接的關係，從而為中國近代化延誤的原因提出新的解釋。"}]}, {"id": "ch2", "title": "第二章 · 清末民初中美版權之爭", "paras": [{"type": "title", "text": "第二章"}, {"type": "text", "text": "清末民初中美版權之爭"}, {"type": "text", "text": "是盜也，是有傷通商道德，是直以汙泥擲人而詛之也，其能生法律上之權利否耶？此案被告既不侵擾權利，亦未違犯公理，乃竟請公堂罰之，諭之，禁之，是實斷不可准行。"}, {"type": "text", "text": "——中方辯護律師，1911"}, {"type": "text", "text": "前言"}, {"type": "text", "text": "1903年10月8日（光緒29年8月18日）《中美續議通商行船條約》（以下簡稱清末《中美商約》）簽訂，此一條約是一個純粹以商業性質為主，規範兩國之間通商貿易的條約，有別於過去割地賠款為主的政治條約。其中涉外版權和專利問題，亦首度由美國提出，形成此後中外有關版權問題的依據。從清末到民國初期，美國人出版的書籍被盜印的情況至為嚴重，引起的版權紛爭亦最多起，而中美之訴訟及判決所依據的條約亦即援用清末中美商約中所允諾的保護條款及其適用範圍。"}, {"type": "text", "text": "清末中美首度交涉版權互保的同時，世界第一部國際版權公約——1886年於瑞士伯爾尼簽訂的《保護文學和藝術作品伯爾尼公約》（Berne Convention for the Protection of Literary and Artistic Works，簡稱《伯爾尼公約》），在20年後才在中國的《外交報》披露出來，中國人開始理解到國際社會對各國作品的保護制度，清政府雖然意識到版權問題的重要性，並因此催化了國內對版權問題的重視和相關法令的頒布。但是對於涉外版權則關係著洋文載體作為「中國開眼看世界」——開啟西方知識之門的鑰匙。清政府雖同意美方予版權互惠，但卻將保護範圍嚴予限定，等於讓中國得以享有幾乎不受限制翻譯洋文書的權利。而美國方面在無法索取英文版權的同時，則勸說中國加入國際版權同盟，以制約中國的盜印問題，美國書商亦費盡心思以保有版權。從清末到民初美國政府嘗試以各種策略解決在中國的版權問題，終歸徒然，在1946年中美商約簽字之前，中國從條約上即享有擅自翻印西書的合法權利，而中國始終未能在版權規範上滿足美方的需求。 版權概念與印刷術的發展息息相關，中國宋代因印刷術盛行，已有版權保護的告示，發展至清代亦有類似版律的頒布。然而，近代西方所謂智慧財產權或知識產權（Intellectual Property Rights）對各類藝文創作、設計等人類精神活動成果的保護概念和法制化，中國相對而言，不論在觀念、制度和立法保護等方面，遠不及西方完備 $^{1}$ 。現今對智慧財產權的保護已是國際公約中重要的文明化指標，台海兩岸亦分別於1990年代初期加入國際版權組織 $^{2}$ 。回顧這段早期由美國所啟動的中外版權交涉之議題，不論就近代中美關係史或中國的國際化歷程均具有深意。本文探討清末中美商約簽訂以後至1920年代，中美雙方在版權紛爭的個案交鋒，並分析在雙邊交涉未能奏效之際，美方如何以多邊組織之影響力來約束中國，中國又以怎樣的策略回應美方索取版權之要求？有別於清末民初中國對外交涉多以挫敗告終，中美兩國間的版權紛爭則呈現不同的面貌，而其結果又牽涉近代中國與世界的交往在經濟立法、教育文化和政治外交等多重面向的意義。"}, {"type": "text", "text": "1 清末民初中國發生的個案主要為商標、版權、專利三者，尚未使用現今「智慧財產權」一詞所界定的廣泛範疇——包含商標、著作權、工業專利、藝術創作、工藝設計和產地標誌等人類精神活動之成果。在美國國務院國家檔案館有關中國內部事務檔案（Records of Department of State Relating to Internal Affairs of China, 1919-29, 1930-39 和 1940-44，以下簡稱 NA）的編目分類中，在經濟事務（economic matters）項目有關資產（Property）條目下，最先是有形的土地房屋產權，最後為無形資產：即商標、版權、專利的交涉。而在中國政府的外交檔案中，版權交涉被歸檔為教育文化檔，由此亦看出中國關注的是教育文化問題，而美國關注的則是保護無形資產的創作權，兩者有不同的價值觀。"}, {"type": "text", "text": "2 台灣於1992年加入國際版權公約，成為會員之一。中華人民共和國於1990年制定《著作權法》，1992年加入國際版權同盟，2001年加入WTO。1990年代以後引起中外學界研究改革開放後中國版權貿易和盜版問題的熱潮，相關著作甚多。例如：鄭成思，《版權公約、版權保護與版權貿易》（北京：中國人民大學出版社，1992）。張美娟，《中外版權貿易比較研究》（北京：北京圖書館出版社，2004）。Andrew C. Mertha, The Politics of Piracy: Intellectual Property in Contemporary China (Ithaca, N. Y.: Cornell University, 2005). Martin K. Dimitrov, Piracy and the State: The Politics of Intellectual Property Rights in China (Cambridge, UK and New York: Cambridge University Press, 2009)."}, {"type": "text", "text": "過去關於中國近代版權史問題，以探討中國版權制度之演變的通論性著作居多，且對於近代中國是否有「智慧財慧權」的本土論述，中外學者的觀點並不一致 $^{3}$ 。中村元哉的研究，則環繞近代以來中國著作權法的演進與中日版權問題交涉中所呈現的東亞內部的國際關係 $^{4}$ 。以上論著儘管間有涉及本文探討的個案，但均未能使用本文所引用的中美雙方政府的交涉檔案，此為一大缺陷，且與本文側重中美關係與國際化因素的研究視野有所不同。"}, {"type": "text", "text": "一、清末《中美商約》對涉外版權的首度約定"}, {"type": "text", "text": "中美商約係根據《辛丑和約》第11條的約定，中國得與各國商議修改通商行船之條約。清政府曾建議舉行圓桌會議，與各國共同籌議商約，但因列強各有盤算，最後分別與英、美、日、葡、德等國簽訂商約。《中美商約》第9、10、11款條文，首度規範了美國商標、版權和專利在中國應有的保護 $^{5}$ 。而在此之前，商標條約問題首先見諸於1902年〈中英續議通商行船條約〉（中英商約），清政府於1904年頒布「商標試辦章程」，為中國近代商標法邁出第一大步 $^{6}$ 。版權和專利問題，則為中英商約所無，係由中美商約交涉過程中首先由美國提出，其後中日商約中亦列有版權問題，引起中國朝野的一致反對7。因此，近代中國對商標、版權和專利的保護和相關法律制定的最初，可說主要是在外人的催促和壓力下完成的，而美國在此一過程中扮演著極為重要的角色。"}, {"type": "text", "text": "3 李明山主編，《中國近代版權史》（鄭州：河南大學出版社，2003），為開創性的通論研究，該書認為至少中國宋代就產生了版權概念，而清末以來在借鑑東西方發達國家的著作概念時，中國在法律條文中將「版權」和「著作權」視為相同內涵而交互使用，形成具有中國特色的版權和著作權概念。該書第7章提到涉外版權糾紛時，仍多以中國民族主義論述帝國主義在華活動，認為巴黎和會以後帶來反帝運動的高潮，以致涉外版權糾紛相對減少。見該書頁147-164。William P. Alford, To Steal a Book Is an Elegant Offense: Intellectual Property Law in Chinese Civilization (Stanford, CA: Stanford University Press, 1995)，該書共分六章，溯自清帝國時期中國為何無相應的智慧財產權的歷史、晚清船堅砲利下對西方智慧財權的引進、民國以來對於中國特色的智慧財產權立法化的演進、1949年後台灣與中華人民共和國在相關法案的演進，並對近年美國催促中國相關立法及因應之道有具體的分析。該書作者認為由於政治文化的因素，清代中國始終未能發展出相當於西方智慧財權的本土論述或是具體的立法措施，清末民初的中國知識分子對西方智慧財產權的引介亦是失敗的，因為他們從未想將西方模式施行於中國，一如作者的書名「竊書為高貴的冒犯」。近年中文著作尚有：王蘭萍，《近代中國著作權法的成長，1903-1910》（北京：北京大學出版社，2006）、李雨峰，《槍口下的法律：中國版權史研究》（北京：知識產權出版社，2010）。"}, {"type": "text", "text": "china-waseda.jp/japanese\\_studies\\_of\\_contemporary\\_china\\_2009/mokuji.html。日文版發表於：《中国—社会と文化》，第22号（2007年6月），日本中國社會文化學會，頁217-239。該文作者從三方面：一、清末民國時期的《著作權》與翻譯權；二、關於清末民國時期外文書籍的國際關係；三、清末民國時期的外文書籍與國內外反應，從以上研究視角探討中國本身的著作權法的演變、比較國際版權法規、中日版權糾紛與東亞內部關係，最後闡述1949迄今中國著作權問題的延續和演變。"}, {"type": "text", "text": "5 根據《辛丑和約》第11條：「大清國國家允定，將通商行船各條約內諸國視為應行商改之處，及有關通商各地事宜，均行商議，以期妥善簡易。」中美商約的研究，詳見：吳翎君，《美國大企業與近代中國的國際化》，第2章〈中美商務關係的里程碑——清末中美商約〉，頁69-107。王爾敏，《晚清商約外交》（香港：中文大學出版社，1998），頁175-195。此外，本書探討中英、中美、中日、中葡、中德等商約交涉和簽訂過程。"}, {"type": "text", "text": "4 中村元哉，〈圍繞近現代東亞外文書籍問題的國際關係——以中國為中心〉，《日本當代中國研究》（東京：2009），頁51-68。網路版，詳見：http://www."}, {"type": "text", "text": "6〈中英續議通商行船條約〉第7款，由「南北洋大臣在各管轄境內設立牌號註冊局所一處，派歸海關管理其事」。于能模編，《中外條約彙編》（上海：商"}, {"type": "text", "text": "在中國的涉外版權和專利問題為何由美國率先提出？首先，率涉美國本身的歷史發展，美國憲法第1條第8款第8項：「國會有權……為促進科學和實用技藝的進步，對作家和發明家的著作和發明，在一定期限內給予專利權的保障」。美國專利制度被譽為世界最完善者之一，最早可溯自英國殖民時期在麻州（Massachusetts）已有由州授予專利的案例。美國第一部專利法於1790年問世，美國專利局於1802年成立，當時為國務院直屬部門，承擔專利相關事務。19世紀初，商標事務亦納入專利局的轄權範圍。論者普遍認為美國工商業的快速發展和其獎勵專利制度關係密切 $^{8}$ 。其次，早期美國傳教士抵華後創辦報紙，倡導西學，翻譯西書，以達到宣教目的，而當時編譯之報章書籍即屢見盜印情事。美國傳教士林樂知（Young John Allen）在《萬國公報》倡導版權，並有以地方官府名義刊載的〈嚴禁翻刻新著書籍告示〉，敬告民眾：「爾等須知教士所著前項書籍，煞費經營，始能成編行世，既曾登明告白，不准翻印，爾等何得取巧翻版，希圖漁利」。為遏止中國的翻版圖利，林樂知倡導由民間各書局成立版權公會，以約東西書被盜刻的情況 $^{9}$ 。再者，清末以來中美之間逐漸形成的「特殊友好關係」，美國人相對於其他帝國主義國家來得友善許多，尤其是美國退回庚子賠款作為留美學生之基金後，中美文化交流日益密切，使得美國書籍容易成為翻印的對象。1903年《中美商約》首度在條約上規範版權問題，顯現美國政府對版權問題的重視，即使到現在美國對於中美著作權的保護仍是不遺餘力，從歷史溯源而言，可謂其來有自。"}, {"type": "text", "text": "為了應付商約談判，清政府特任命兩江總督劉坤一、湖廣總督張之洞為督辦商務大臣，實際主持談判事務的為工部尚書呂海寰、左侍郎盛宣懷。美方代表則為為駐京公使康格（Edwin H. Conger）、上海總領事古納（John Goodnow）和同孚洋行（Wisner & Co.）商董希孟（John F. Seaman）。1902年交涉之初，美方交來的通商行船條約草案第32條，針對版權的條文如下："}, {"type": "text", "text": "務印書館，1936），頁27。《中英續議通商行船條約》，於1902年9月5日簽訂，次年7月28日換文。左旭初，《中國近代商標簡史》（上海：學林出版社，2003），頁18-23。"}, {"type": "text", "text": "7《中美商約》於1903年11月23日於華盛頓互換約文。《中日商約》於11月24日在北京互換。另據王爾敏教授的考證，《中美商約》於該年10月8日（農曆8月18日）簽於北京，日本在得知美約即將達致協議時，即趕在與《中美商約》同日簽字，所以《中日商約》簽約上的呂海寰、盛宣懷為現場簽署，而伍廷芳因在北京，其所簽字為日後補簽，此事顯現日本欲與美國爭鋒，因而有意留下美、日兩約同日簽定的紀錄。美國早於1902年交涉之初提出草約32款時即列有版權條款。王爾敏，《晚清商約外交》，頁216-217。"}, {"type": "text", "text": "8 這方面的研究相當多，如經典之著：Frank I. Schechter, The Historical Foundations of the Law Relating to Trade Marks (New York: Columbia University"}, {"type": "text", "text": "Press, 1925). 新近成果如 Alain Pottage and Brad Sherman, Figures of Invention: A History of Modern Patent law (New York: Oxford University Press, 2010), pp. 1-18; 45-65。美國專利局網站（United States Patent and trademark office）http://www.uspto.gov/。"}, {"type": "text", "text": "9〈嚴禁翻刻新著書籍告示〉，《萬國公報》97卷上，光緒23年1月（1897年2月）。〈擬立版權公會〉，載《大公報》，1904年3月6日。"}, {"type": "text", "text": "無論何國若以所給本國人民版權之利益一書施諸美國人民者，美國政府亦允將美國版權律例之利益給予該國人民。中國政府今允，凡書籍、地圖、印件、鐫件或譯成華文之書籍，係經美國人民所著作或為美國人民之物業者，由中國政府援照所允保護商標之辦法及章程極力保護，俾其在中國境內所印售此等書籍、地圖、鐫件或譯本之專利。（底線為作者所加）"}, {"type": "text", "text": "這份最初的美方草案不僅索取原文書版權，且包含譯本之版權。1902年9月交涉之初，中國代表盛宣懷表示版權問題，恐怕會使書價提高，窮人更買不起書，表示反對。對於保護版權的年限，古納曾提出14年之說，張之洞主張訂為5年，雙方後來妥協為10年 $^{10}$ 。"}, {"type": "text", "text": "美方索取洋文版權一事，引起京師大學堂的反對。管學大臣張百熙代表中國最高學府京師大學堂致書商約大臣呂海寰、盛宣懷，萬勿允許美國於商約中索取洋文版權，因各國必將援請利益均露，如此則各國書籍，中國譯印種種為難，其結果勢必阻滯國人譯印及探究西學。「現在中國振興教育，研究學問，勢必廣譯東西書，方足以開民智，……似此甫見開通，遽生阻滯，久之將讀西書者，日見其少，各國雖定版權，究有何益。」 $^{11}$ 管學大學堂發兩江總署張之洞電文，亦提到「各國之有版權會，原係公例，但今日施之中國，殊屬無謂。使我國多譯數種西書，將來風氣大開，則中國各種商務，自當日進，西書亦日見暢行。不立版權，其益更大」 $^{12}$ 。張百熙是晚清政府中思想較開明的官員，他亦體認到歐西各國注重版權，但中國還沒有加入版權會的條件。他在中美商約中反對予以洋文版權，係站在中國科技文化相對落伍，無法履行國際版權條約的立場，但對於國內他卻主張中國應訂立版權辦法，嚴禁翻印，以鼓勵苦心編譯者 $^{13}$ 。"}, {"type": "text", "text": "劉坤一復電提到中國非廣譯東西書不可，由於同時交涉的《中日商約》亦有索取版權之事，劉坤一主張約文中宜限定適用範圍。「日本現訂約款，只聲明日本特為中國備用，以中國語文著作書籍及地圖應得一書保護。其東文原書，及東文由中國自譯，或採取東文另行編輯者，不在版權之列」 $^{14}$ 。對於中國應保有東西文的翻譯權，以廣開民智，呂海寰、盛宣懷亦深表認同。「東西書皆可聽我翻譯，惟彼人專為我特著之書，先已自譯及自印售者，不得翻印，即我翻刻必究之意」。「既欲廣開民智，無論中外人特著一書及自譯自印者，應准註冊專利若干年，方免遏斷新機，餘皆不在禁例」 $^{15}$ 。中國代表一方面體認到歐西各國定有版律，條約中必須應允保護版權，但不論如何需保有中國的譯書權。1903年4月初，中國代表建議，增加「除以上所指明各書籍地圖等件不准照樣翻印外，其餘均不得享此版權之利益。又彼此言明，不論美國人所著何項書籍，可聽華人任便自行翻譯華文，刊印售賣」。8月，中方代表又提出，在准許中國人翻譯、刊印、售賣的「書籍」之後，增加「地圖」二字 $^{16}$ 。"}, {"type": "text", "text": "12〈外務部（代大學堂）發兩江總署張之洞電〉，《中美關係史料·光緒朝五》，頁3271-3272。"}, {"type": "text", "text": "10 海關總署研究室編譯，《辛丑和約訂立以後的商約談判》（北京：中華書局，1994），頁160-161。"}, {"type": "text", "text": "11〈外務部（代大學堂）發商約大臣呂海寰、盛宣懷電〉，中央研究院近代史研究所編，《中美關係史料·光緒朝五》（台北：中央研究院近代史研究所，1988），頁3271。"}, {"type": "text", "text": "13 張百熙曾在大公報發表〈管學大臣批答廉惠卿部郎呈請明定版權由〉，主張中國國內應訂版權法。《大公報》，1903年6月4日。。"}, {"type": "text", "text": "14〈前江督劉坤一復電〉，周林、李明山主編，《中國版權史研究文獻》（北京：中國方正出版社，1999），頁42。"}, {"type": "text", "text": "15 呂（海寰）、盛（宣懷）兩欽使復電，《中國版權史研究文獻》，頁43。"}, {"type": "text", "text": "由於版權問題的討論，在《中美商約》談判中遠不如裁釐加稅、通商口岸的開放、礦業開採與修築鐵路等議題來得重要，因此談判過程美國政府頗多讓步。1903年10月8日《中美商約》於上海簽署，最後全文共17款。關於版權的部分，已與美方最初提出的版本差異甚大。美方原本希望洋文原著或譯著均能取得版權保護，但由於中方堅持，最後商約第11款，針對書籍、地圖、譯本之版權條文如下："}, {"type": "text", "text": "中國政府今欲中國人民在美國境內得獲版權之利益，是以允許凡專備中國人民所用之書籍、地圖、印件、鐫件者或譯成華文之書籍係經美國人所著作或為美國人民之物業者，由中國政府援照所允保護商標之辦法及章程，極力保護十年。以註冊之日為始，俾其在中國境內，有印售此等書籍、地圖、鐫件或譯本之專利。除以上所指明各書籍、地圖等件，不准照樣翻印外，其餘均不得享此版權之利益。又，彼此明言，不論美國人所著何項書籍地圖，可聽華人任便自行翻譯華文，刊印售賣。（底線為作者所加）"}, {"type": "text", "text": "美方在簽約之後，已感懊悔，由於中美商約為十年換約，尚未達換約期之前，美方即提出修改商約或另訂版權協議。1907年（光緒33），美國政府針對第11款保護版權之事行文：「本國政府不能滿意，囑請中國政府允將此款商改或另訂版權條約」，希望中國政府派全權大臣與美國駐華公使柔克義（William Woodville Rockhill, 1854-1914）會商，但清政府以期限未到拒絕討論 $^{17}$ 。"}, {"type": "text", "text": "清末《中美商約》係予以外人著作權極有限度的保護，除非是「凡專備中國人民所用」才在保護之列。「除以上所指明……」等文字，又更加確認清政府得「任便自行翻譯華文，刊印售賣」的權利；即使是「專備中國人民所用」，需向中國商標局註冊，始受中國政府保護十年。條約中的「專備」、「照樣翻印」、「任便自行」和註冊程序等文字，字字關鍵，顯現清政府為維護中國探究西學的權利，力圖保護國人的譯印權，在條約用字上的著力。然則「專備」兩字，在此後中美著作權的交涉過程中影響最大，也爭議最多。"}, {"type": "text", "text": "民國建立之初，1913年5月美國署理公使衛理（Edward Thomas Williams, 1854-1944）曾探詢外交部意向可否仿照1906年美、日兩國簽訂之版權條約，簽訂中美版權同盟，美日版權條約內容只有三款，一、互相保障；二、譯書；三、批准及交換程序。第一、二款如下："}, {"type": "text", "text": "第一款：兩國人民之文藝著作及照相等件在締約國境內對於不法之翻印，均享有版權保障，其保障之根據兩國係屬同等，惟第二款條文所載不在此列。"}, {"type": "text", "text": "16《辛丑和約訂立以後的商約談判》，頁200-201。"}, {"type": "text", "text": "17 外務部發農工商部咨，〈美使請允改商約第十一款版權一事即酌核見復由〉，光緒33年3月15日。中央研究院近代史所，《外務部檔案》，02-13-021-04-005。"}, {"type": "text", "text": "第二款：兩國人民不待特許，可在締約國境內翻譯書籍、論說、劇本、樂譜及各種著作之件，並印行此種譯件。18"}, {"type": "text", "text": "美日版權條約中，日本仍保有譯印權，但約文第一款對於文藝著作（literature and art）和照相（photographs）的不法翻印則是互允保護，條文顯然比《中美商約》所謂「專備」等條件尊重原著。中國外交部理解清末《中美商約》對我之優勢，並未應允，僅答以異日再行 $^{19}$ 。"}, {"type": "text", "text": "在中美商約簽訂之後，1905年清政府商部擬定版權律，但遲未公布，直到1910年12月（宣統2年11月）清政府始頒布〈大清著作權律〉共有通則、權利、呈報義務、權利限制和附則等5章55條，為近代中國第一部著作權法，將著作和版權保護納入法制化的開始，民初仍暫行沿用 $^{20}$ 。即使中國已有著作權法，然而，外國人在華著作權保護，係根據條約規定，並不受國內法的約束。民國初年秦瑞玠的《著作權律釋義》中就說「本律（指中國著作權法）於外國人之著作權，既無明文規定，而民律現方編訂，外國人得享有一切私權與否，亦尚無條律可援。是則苟非有特約之國，非在特約所規定範圍內，固宜不得享有本律之保護者也」 $^{21}$ 。"}, {"type": "text", "text": "然而，美國書商卻認知，既然《中美商約》已互允保護，中國政府應有保護外人版權之責。從清末到民國時期，中美之間有關版權和盜版糾紛的案例始終不斷。"}, {"type": "text", "text": "二、美國控告中國書商與索取版權之案例"}, {"type": "text", "text": "清末民初中美版權糾紛案不斷，最重要者約有三起：一、《邁爾氏通史》（General History by P. V. N. Myers. A. M.）翻印案（1911）；二、《各國老幼書》（Big People and Little People of other Lands）等書籍案（1912-1919）；三、《韋氏大學字典》（Webster's Collegiate Dictionary）案（1923）。其中，《邁爾氏通史》翻印案與《韋氏大學字典》案係發生於上海會審公廨（The Mixed Court）的法律訴訟案件。美商如果能夠勝訴，則可能成為判例，將可以大大彌補商約條款對美方版權保護的不足。《各國老幼書》則是符合《中美商約》中「專備中國人民之用」的規定，美商循外交管道討回公道的交涉案例。"}, {"type": "text", "text": "(一)《邁爾氏通史》翻印案"}, {"type": "text", "text": "1905年（光緒31），上海商務印書館呈請學務處批准出版一批翻印的英文書籍目錄。上海商務印書館商人夏瑞芳稟稱趁著美國商約版權未定之先，湊集巨股擇要翻印洋文書籍，廉價出售，以俾各省學堂易於購讀開錄。這批英文書目錄共有185本，含英文文法、英文字典、天文、化學、物理、地理、各國歷史、小說等各類書目，學務處批准後咨呈外務部的公文提到上海商務印書館，「志在價廉售廣，以惠學者，所呈書目發交本大臣學堂洋文教習詳細察閱，據稱合學堂課本之用」 $^{22}$ 。商務印書館的大舉出版動向立即引起美國出版商的矚目。其中《邁爾氏通史》出版後，美商經恩公司（Gim & Co.，或譯「金恩公司」）委請律師於上海會審公廨控告商務印書館侵犯該公司的版權，該公司在上海的代理商為英國人伊凡斯（Edward Evans）。他宣稱6年前即在上海從事代理經恩公司的版權，該書銷售情況頗佳，直到商務印書館以廉價翻印此書，致使經恩公司及其本人的代理權蒙受損失。上海會審公廨於1911年3月29日開庭，被告商務印書館委任禮明（W.S.Fleming）和丁斐章（Alexander Ting，又名丁榕）兩位律師和原告經恩公司委任律師T.B.Jernigan和S.Fessenden進行辯護。《字林西報》（North China Daily News）曾以大篇幅刊載雙方的辯論全文，可見得此事受到外人的關注 $^{23}$ 。會審公廨審理結果認為該書並非1903年《中美商約》第11款所載「專為中國人民所用之書籍」，不肯裁決原告美商勝訴。美國駐上海總領事維禮德（Amos P.Wilder）表示這件案子顯現《中美商約》中有關版權的限令很明顯對美商的保護極其脆弱，希望美國國務院和中國政府重開版權問題的協議 $^{24}$ 。"}, {"type": "text", "text": "18 外交部收美館函，1913年5月27日，《鈔送美日合訂版權條約由》，《外交部檔案》，03-43-013-03-002。中文及外文。"}, {"type": "text", "text": "19 外交部致教育部、工商部，1913年7月8日，《美使擬訂版權條約事復達查照由》，《外交部檔案》，03-43-013-03-006。"}, {"type": "text", "text": "20 王蘭萍，《近代中國著作權法的成長，1903-1910》，頁76-83。民國以後1915和1928年曾修定著作權法，係在〈大清著作權律〉的基礎上修訂法條。李明山主編，《中國近代版權史》，頁124-127。"}, {"type": "text", "text": "21《著作權律釋義》為民初針對仍沿用的《大清著作權律》的釋義著作，在有關著作權律與國際條約的關係上，秦瑞玠認為著作權是個人私權，從國際的範"}, {"type": "text", "text": "圍來，亦應該是僑寓外人所有私權中的一種。但在《中美》、《中日商約》中並未明文賦予外人有這項私權。秦瑞玠編，《著作權律釋義》，於民國初年由上海商務印書館印行，全書收錄於《中國版權史研究文獻》，頁98-130。所引見頁102-103。"}, {"type": "text", "text": "會審公廨呈上海道文，陳述被告商務印書館確有售賣經恩公司圖書之事實，但這件案子為「有損害而無過犯」之案件，陳請上海道處理。會審公廨從三方面論述可規範被告商務印書館的法律：一、中國本國之法律：按中國法律向無版權專條，宣統2年（1910）清政府始頒布《大清著作權律》，「中國人之文藝著作始有著作權，若他人則可酌示通融，而不能借口爭執……然則此案，商務印書館既無假冒字號之事，則翻印售賣邁爾史，按律固無應得之咎」。二、中國並未加入國際版權聯盟。因此，中國之著作者，在中國地方出版發行之著作物，一入外國，即不能授有版權協約及其國之著作律，以求保護；而外國之著作者，在中國亦不能藉口於中國著作例之利益。三、1903年《中美商約》第11款和《中日商約》第5款有關版權的規定，美約係以「專為中國人民教育之用」為限制，其餘皆不得援以為例。至於《日約》第5款限制尤嚴，非以華文著作者，礙難保護，《邁爾氏通史》更非其比，而《日約》中亦列有專為中國人民之用之字樣。會審公廨呈文：「且我國版權之限制，乃純為教育前途起見，實有不得不然之勢。教育未能普及之先，亟宜采有用之書，而以賤價售之務，使盡人能購而後已。否則我國生童，勢不能不以重價求書於外洋……」。會審公廨從法律和公理層面支持被告商務印書館的翻印無罪 $^{25}$ 。"}, {"type": "text", "text": "由於會審公廨美籍陪審官詹美森（J. Paul Jameson）在此案中並未站在保護美國人版權的立場，和美國駐上海總領事維禮德態度迥然不同，雙方激烈爭執，詹美森給駐京公使嘉樂恆（Walliam J. Calhoun）長達16頁的電報中提到上海總領事意圖施壓，他表明並不是不願意保護經恩公司的版權利益，他個人非常同情經恩公司的處境，經恩公司為一卓有信譽的美國公司，但此事非關同情或商業道德，而是從法律層面而言，據《中美商約》11條的解釋，經恩公司出版之書籍確「非專為中國人而製」，因此不在保護之列 $^{26}$ 。"}, {"type": "text", "text": "22〈外務部學務處批准商務印書館稟請立案翻印洋文書籍目錄〉，NA, 893.544943/2。"}, {"type": "text", "text": "23 North China Daily News, March 30; April 3, 1911."}, {"type": "text", "text": "24 American Consulate-General (Shanghai) to the Secretary of State, Apr. 10, 1911, NA, 893.544943/1."}, {"type": "text", "text": "25 周林、李明山主編，《中國版權史研究文獻》（北京：中國方正出版社，1999），頁180-181。"}, {"type": "text", "text": "商務印書館律師禮明的辯護詞，提到按照條約只有兩種書籍在保護之列，一係專為中國人民所用之書籍、地圖、印件、鑄件者，二係為譯成華文之書籍，條約所許之版權利益。《邁爾氏通史》全書為英文，共800頁，提到中國歷史者僅9頁，倘該書果專為中國人民教育之用，應採用華文而非英文。又說：中美所訂之條約為版權之依據，「條文有不愜之處，原告應請其國之外部，與中國政府別立一條約，冀可擴充版權之利益，不得率請公堂就原有之條約而為之改良也」、「非法律條約所承認之權利，被人違占更不能請公堂代之判斷」。因此從法律上的權利而言，原告在中國並未享有保護之權力，而竟指責商務印書館「是盜也，是有傷通商道德，是直以汙泥擲人而詛之也，其能生法律上之權利否耶？此案被告既不侵擾權利，亦未違犯公理，乃竟請公堂罰之，諭之，禁之，是實斷不可准行」 $^{27}$ 。由於美駐上海總領事不服此項判決，並通過英使朱爾典（John Jordan）共同施壓，但外務部立場堅定，認其非為中國特著，並無禁止翻印之條文可據。但希望原告與被告雙方「自行商妥，以期和平了結」 $^{28}$ 。商務印書館回覆「果金（經）恩公司自知，此事本為條約所許，商議係由特別通融，所開辦法，果屬和平，敝公司亦無不願和平了結也」 $^{29}$ ，此一案件中，從學務處、會審公廨、上海道和外務部，均從條約規範的層面大力支持商務印書館。"}, {"type": "text", "text": "商務印書館於1910年7月曾印製該館出版目錄《華英書目提要》（Descriptive Educational Catalogue, Chinese and Foreign Textbook）118頁，約有數百本以上的教科書，主要為原書翻印，其次為中文節譯，亦有少量的德、法、日原文書，價格在0.15至2元之間，有的還冠上英文“Approved by the Board of Education of China”（經學部處批准）的字樣。由於取價甚廉，當然對合法西文書的代理商造成巨額損失 $^{30}$ 。同年，紐約美國圖書公司（American Book Company）和其他公司一再呼籲美國政府重視美商在華的版權利益，他們表示德、法等歐洲國家的書籍被盜用的情況相當稀少，不太可能和美方立場一致，要求國務院與英國聯手向中國施壓 $^{31}$ 。版權問題並未列於1902年《中英商約》，由於英約修約期限將屆，1911年6月駐京公使嘉樂恆乃尋求英國公使朱爾典的合作，希望解決西文書的版權問題 $^{32}$ 。8月嘉樂恆和中國政府曾針對版權問題交換意見，但這項交涉因辛亥革命爆發而中止 $^{33}$ 。民國初年商務印書館更推出一系列西洋史教科書，書頁中明白可見「教育部審定批詞」，以及訂價約一冊一元取價極廉，為「研究東西史者必備之書」之廣告。（圖2-1）"}, {"type": "text", "text": "26 J. Paul Jameson to W. J. Calhoun, May 4, 1911, NA, 893.544943/2. 27 禮明的辯護詞，中文見：周林、李明山主編，《中國版權史研究文獻》，頁186-187。英文版見：American Consulate-General (Shanghai) to the Secretary of State, May 15, 1911, NA, 893.544943/1. enclosure “In the International Mixed Court in Shanghai”。中文版的文氣略為激動，以本文所引文末的結語對照可知：‘Crying piracy and charging lack of commercial morality, throwing mud and heaping abuse will not create a right where none exists by law. Certainly the Mixed Court cannot be asked to punish or enjoin the defendants where no right been infringed and no wrong has been committed.’"}, {"type": "text", "text": "28 外務部復英朱使照會，清宣統3年（1911）5月21日。外務部至上海道函，清宣統3年（1911）7月17日。周林、李明山主編，《中國版權史研究文獻》，頁190-191。"}, {"type": "text", "text": "29 商務印書館復上海道函，清宣統3年（1911）8月23日。《中國版權史研究文獻》，頁192。"}, {"type": "text", "text": "30《華英書目提要》，見於NA,893.544943/3有完整的一份118頁的目錄和介紹。"}, {"type": "text", "text": "31 American Book Company to the Secretary of State, March 14, 1910, NA, 893.5440Am2/5."}, {"type": "text", "text": "（二）《各國老幼書》等書籍案"}, {"type": "text", "text": "1912年底，美國圖書公司呈請國務院，希望通過美駐京公使館直接向北京政府索取《各國老幼書》在中國發行的版權，該書以華文釋義，並同時向中國海關註冊，且符合商約「專備中國人民之用」的規定，該書在中國的經銷商為英人伊凡斯。嘉樂恆於次年1月向北京政府正式提出此一要求，稱此項書籍確係依照《中美商約》第11款刊印，得以在中國享有完全之保護 $^{34}$ 。結果外交部通商司認為「該公司所印書籍如能有助於中國治安，自應給予版權，以符條約，惟學堂應用書籍向由學部核定」 $^{35}$ 。1913年6月教育部始給外交部公函，「是書為便於東方人士初學起見，用意甚善，惟其所言社會風俗情形間涉陳舊，於民國現有學堂殊難適用，惟聽願讀者自行購買，至給予版權向歸內務部辦理」 $^{36}$ 。外交部很快又將此案轉到內務部詢問是否准予註冊，俾享有版權之利益 $^{37}$ 。內務部竟拖延到1914年2月答覆外交部「查各國老幼書樣本係以華文釋義似可認為專備中國人民所用之書籍……自應按照條約辦理，惟查原約所定保護方法係載明援照商標辦法及章程辦理」，但內務部又稱前清商部訂定之章程諸多窒礙，農商部暫緩施行，目前正研擬新法，因此現在並無商標辦法可以援照，只好將美商書樣暫予留部存案，俟農商部將商標章程訂定公布後再行援照辦理 $^{38}$ 。《各國老幼書》一書對美國書商而言突顯一個嚴重問題，亦即在完全符合《中美商約》版權互保的原則，亦無法獲得中國政府允諾對美商在中國的版權保護。從北京外交部、內政部、學部，最後再到農工商部近二年的時間，最後是「現無商標法可辦」，因而無法註冊的踢皮球方式。"}, {"type": "text", "text": "34 American Book Company to the Secretary of State, Nov. 12, 1912, NA, 893.544Am3. 外交部收美使館函，1913年1月8日，〈紐約書籍公司新出書籍請予版權由〉，中央研究院近代史所，《外交部檔案》，03-43-013-02-001。"}, {"type": "text", "text": "35 外交部致教育部函，1913年1月13日，《美公司所印書籍請給予版權希核辦見復由》，《外交部檔案》，03-43-013-02-002。"}, {"type": "text", "text": "32 American Legation (Peking) to the Secretary of State, June 22, 1911, NA, 893.544843/4. 嘉樂恆提到中國的高等學府、技術學院和教會大學對於西文教科書的需求愈為普遍，使得原文書盜印的情況非常嚴重，不僅侵犯作者著作權和書商版權，且由於取價較廉，使得代理美商和美國出版商蒙受巨額損失。"}, {"type": "text", "text": "33 J. B. Moore (Counselor of State Department) to American Book Company, July 20, 1913, NA, 893.544Am3/2."}, {"type": "text", "text": "36 外交部收教育部函，1913年6月21日，《紐約圖書公司所印之各國老幼書用意雖善不適用於學堂至給予版權向歸內務部辦理請轉復由》，《外交部檔案》，03-43-013-02-004。"}, {"type": "text", "text": "37 外交部致內務部函，1913年6月27日。〈紐約書籍公司請給予版權希核辦見復由〉，《外交部檔案》，03-43-013-02-007。"}, {"type": "text", "text": "1915年11月又有美國萬國函授學校（International Correspondence School）通過美駐京公使芮恩施（Paul Samuel Reinsch）要求中國政府出示暫行保護令 $^{39}$ 。萬國函授學堂所著英文課本1-5冊宣稱該書係為中國人而作，由於該書商代表人海格（英文不詳）曾於該年1月向內務部稟請註冊，擬分冊發行，內務部要求美商如欲繼續發行各本，應續送內務部審查批示，不宜由美使以公文程式送達，因此未便批示。內政總長朱啟鈐稱由於目前既無商標章程可以援照，內政部特定一種臨時辦法准予存案，「存案云者即對於該書認為合於條約之規定，而予以保護之」 $^{40}$ 。不論是《各國老幼書》或函授學校書籍，儘管已符合商約11款的要求，但中國政府仍含混其詞，或以商標法未定，或以存案即為保"}, {"type": "text", "text": "護之諉詞，令美商心生不滿。"}, {"type": "text", "text": "英美煙公司（British American Tobacco Company，簡稱BAT）律師肯列退（W. B. Kennett）曾有文提到他對中國保護商標和版權的看法。因科學書銷售日廣，華人侵犯版權之事日見增加，依他的看法1903年《中美商約》的規定，中國政府有責保護美商所售關於華人通用及教育圖冊版權，但英美科學小說，原非關於華人通用及教育者，自不在保護之例。因此，美商只要於書目書明其種類，「於北京內務部註冊，或海關臨時商標註冊處註冊」即應獲得保護 $^{41}$ 。也就是說英文書籍中凡涉及華人通用及教育者，例如科學書應受保護，他的看法為民初英美人士的一般認知。此一認知顯然與華人書商大不相同。"}, {"type": "text", "text": "1919年美國商會（American Chamber of Commerce）給上海總商會一公函，指稱中華書局和商務印書館等華人印刷局翻印美國課本數量之多，令人駭異。「以性質高尚之印刷局，竟有此種行為，更為可訝，今此事已呈明美國駐京公使與北京政府磋商辦法，呈警告各印刷局，倘不再停止翻印，其違犯法律，遭受困難，必有更甚於今日者，請將此意，通告各印刷廠」。美國商會的這項指控有責問及恐嚇之意，引起上海書業商會的聯合抗議，並向外交部呈明「洋商矇請版權懇請據約駁拒」，呈文中提到按照條約凡為中國特著之書方能禁止翻印，其非為中國特著者，約章並無禁止翻印之條。上海書業商會提及之前經恩公司的敗訴案例說明美商欲矇請版權，請外交部務必拒絕 $^{42}$ 。此案是美國書商在求償無門下，通過美國公使館和商會的力量來解決問題；但中國著名圖書公司則依恃過去勝訴案的前例，通過上海書業商會的集體力量，反控洋商矇混版權，要求外交部堅持不讓。"}, {"type": "text", "text": "38 外交部收內務部函，1914年2月7日，〈美人刊印書籍請求版權應援商標章程辦理現將樣本留部存查俟該章程公布再行核辦由〉，《外交部檔案》，03-43-013-02-008。"}, {"type": "text", "text": "39 外交部收美芮使函，1915年11月26日。〈美國函授學校課本請求註冊〉，《外交部檔案》，03-43-013-06-006。"}, {"type": "text", "text": "40 外交部收內務部函，1915年12月15日。〈美國函授學校請求版權案按公文程式未便批示請轉致美使由〉，《外交部檔案》，03-43-013-06-008。"}, {"type": "text", "text": "41〈中國商標版權之保護問題〉，主講者英美煙公司律師肯列退先生。《東方雜誌》，第16卷第9號（1919），頁162-163。"}, {"type": "text", "text": "42 外交部收上海書業商會呈，1919年5月9日，〈洋商矇請版權懇請據約駁拒〉，《外交部檔案》，03-43-014-02-001。"}, {"type": "text", "text": "（三）《韋氏大學字典》案"}, {"type": "text", "text": "1923年6月11日，美商米林公司（G. & C. Merriam Company）於上海會審公廨控告商務印書館譯印《韋氏大學字典》侵犯該公司權利。有別於前述個案僅有版權問題，本案同時控告商務印書館侵犯版權和商標。商務印書館所發行的英漢雙解辭典，號召35名中國學者編譯，歷四年餘始完成，當時已售出4,563部預約書，正待發行。米林公司一狀告到上海會審公廨，商務印書館委託的辯護律師仍是《邁爾氏通史》侵權案中的禮明和丁斐章。審訊官為陸仲良襄讞、美籍陪審官為阿爾門（Norwood F. Allman）。原告米林公司指稱被告商務印書館犯有以下12項情節："}, {"type": "text", "text": "一、原告係英文韋氏大學字典的著作權者。"}, {"type": "text", "text": "二、原告獲有一種商標權，該商標括有一花圈，圈內有意匠式之W字，圈下有Webster's（韋氏）字樣，而併括於大圓圈之內。（圖2-2）"}, {"type": "text", "text": "三、該商標曾在美國及中國註冊，自1898年以來，由原告繼續使用於其出版各種字典之封面上。"}, {"type": "text", "text": "四、該商標曾在上海美領事署註冊，並按照中國暫行商標註冊章程辦理。"}, {"type": "text", "text": "五、該字典係以重大之經費勞力在美國編輯而成。"}, {"type": "text", "text": "六、原告曾將該字典在中國境內售賣甚廣。"}, {"type": "text", "text": "七、被告曾發行一種字典，其名為“Webster's Collegiate"}, {"type": "text", "text": "Dictionary with Chinese Translation”（英漢雙解韋氏大學字典）。"}, {"type": "text", "text": "八、被告曾發出一種傳單，將印行該書事項通告公眾，招人購買，並曾獲有若干預約。"}, {"type": "text", "text": "九、被告曾模仿原告之商標，其模仿之情形足以欺騙常人，使誤信被告發行之字典與原告發行者相同，僅加入中國譯文一項。"}, {"type": "text", "text": "十、被告確曾照原告之字典，一一抄襲，僅將中國譯文加入。"}, {"type": "text", "text": "十一、被告此種行為侵害原告著作權及商標權之利益。"}, {"type": "text", "text": "十二、被告編輯該字典並不擔負經費，故其取價較廉。"}, {"type": "text", "text": "原告米林公司訴請如下：一、由公堂頒發永久禁諭，不許被告發行及售賣《英漢雙解韋氏大學字典》一書，且不許使用原告認為商標之一種圖案；二、由公堂諭令將該書圖版紙版及其他侵害原告權利之物一律銷毀；三、由公堂禁止被告售賣或交付上述字典，並諭令被告賠償原告損失及堂費。"}, {"type": "text", "text": "被告商務印書館於答辯中承認印行該字典，並曾發出該書之傳單，獲得若干訂單與預約，但原訴狀中所指其他各節則為商務印書館所否認。該館答辯該書籌備四年，且聘學者專家編譯，費國幣15萬元，明知不能獲利，但為求教育大計，乃不惜成本。而該書的訂價24元，亦較原告出版之英文本定價12.25元高昂，係因翻譯漢文工本至鉅，並非原告所言被告編輯不負擔經費 $^{43}$ 。"}, {"type": "text", "text": "1923年9月21日法庭判決結果如下：在版權部分，由於《韋氏大學字典》並非專為華人教育之用，所以不在版權保護之列。在商標部分，由於商務印書館的封面設計及說明書仍借用該公司的圖樣和商標，法庭認為「此一廣告方法頗為巧妙或足以矇蔽公眾」，因此被判定侵犯商標權。會審公廨宣判被告「不得將前項說明書再行散布，並不得將說明書內圖記用於所印各種字典，所有此項版模及印成未曾散布之說明書一併銷毀」，對於說明書內的圖樣及字典上之商標造成原告信譽損害部分，商務印書館得賠償被告1,500銀兩 $^{44}$ 。"}, {"type": "text", "text": "本案經數次開庭，在法庭上一來一往，引起中外關注。英文報《大陸報》於8月23日節錄法庭之辯論經過，包括原案在版權上不能成立之理由、前此美國經恩公司敗訴之案例（即邁氏通史案），以及商務印書館經理王顯華（以被告證人身分出庭）的證詞表示該書並非如原告所指稱編輯該字典，該書局並不擔負經費等情事 $^{45}$ 。在法庭之外，中華教育改進社上書外交部認為此案關係全國文化，決請外交部「據約力保條約上譯書利益」，同時亦致電江蘇省長暨上海交涉使尋求支持 $^{46}$ 。全案經兩次審理，未宣判前，江蘇交涉員許沅亦致電外交部，援引中國未加入版權同盟及《中美商約》第11款，並和陸讞員聯繫，表示被告商務印書館「可期勝訴」 $^{47}$ 。"}, {"type": "text", "text": "此案原告為美國出版家，在華之代理商則為英國人，因此，商務印書館在答辯時，亦特別強調英美兩國人民對於著作權限項，均不能自詡在道德上較中國高尚。理由是自美國初建以迄於1891年採行國際著作權法之時，美國出版家皆可隨意翻印，且經實行翻印外國著作家及出版家之作品，其在英國則在1886年以前亦如是，英美兩國所以將著作權推及外國人者，「其原因不在夫倫理的見解或道德上之主義，而在夫商業上的便利」。會審公廨之判決書則提到「雖原告謂此種行為有損於道德，然被告為應中國學生之需要起見，不得不盡天職從事譯印，要與該商約並無違背云云，原告對於此點不能提出充分證據，證明其在中美兩國內獲有版權，本公堂自應駁回不理，至於道德如何，本公堂意為非本案法律範圍內應研究之問題，可無庸置議」 $^{48}$ 。上海會審公廨純依《中美商約》的保護範圍做出裁決，而判定商務印書館在版權上勝訴，至於米林公司所指控的道德層次問題，則不予評論。"}, {"type": "text", "text": "收於《外交部檔案》，03-43-015-01-007。NA, 893.543M55/至893.543M55/7，則為全案交涉之經過。"}, {"type": "text", "text": "45〈大陸報字典案之辯護〉，見：周林、李明山主編，《中國版權史研究文獻》，頁200-202。"}, {"type": "text", "text": "43 商務印書館呈外交部，1923年10月24日，《洋商藉用商標陰圖保護版權籲懇嚴加防制以維教育而保商業》，《外交部檔案》，03-43-015-01-007。本卷宗收有商務印書館申辯狀、判決書及節略。有中英文各一式，譯文45頁，英文44頁。美籍陪審官給駐上海領事的報告見：N. F. Allman to American Consul General, Oct. 5, 1923, NA, 893.543M55/1。"}, {"type": "text", "text": "46 外交部收中華教育改進社函，1923年8月26日。〈上海會審公廨訊理韋氏字典關係全國文化請據約力爭〉，《外交部檔案》，03-43-015-01-003。"}, {"type": "text", "text": "44〈韋氏大學字典案被告申辯狀，附本案判決書〉1923年9月21日，頁43-45。"}, {"type": "text", "text": "47 外交部收江蘇交涉署電，〈美商控商務印書館預約出售韋氏字典一案業經會審公廨審理兩次據被告方面告及可期勝訴〉，1923年9月10日。《外交部檔案》，03-43-015-01-005。"}, {"type": "text", "text": "對於商標權的判決結果，商務印書館表示不服，認為米林公司以商標矇請版權，對我國譯印事業極其不利，提出據《中美商約》第9款所謂「商標」係指「普通物品」而言，至書籍版權則需按照商約第11款，如非專備中國人民所用，即不能援引保護商標。再者，美商以著作人姓名Webster's作為商標註冊，即不准他人使用，也予以譯印人極大障礙，「則是明為保護商標，實為陰實把持版權，實與我國文化前途影響甚大」。同時上海書業公會亦呈請商部預防洋商將普通姓名、書名作書籍商標，矇混註冊 $^{49}$ 。米林公司為保護其權利，確實於1923年4月18日提告前將其書面所有之圖案作為商標形式向中國海關註冊，其形式係用花圈一個內有N和W兩字組合而成之記號，而此一記號事實上亦即該公司在美國專利局註冊之商標。此外，他們同時向中國海關註冊另外三種名字作為「商標」（即：Webster's；Webster's Collegiate；Webster's New International）。商務印書館的張元濟為此於10月及11月兩度向外交部陳情謂米林公司以書名人名用作商標矇請註冊，要外交部依約駁斥 $^{50}$ 。米林公司的作為，應和上海會審公廨的判決中已有不少外商打贏商標仿冒侵權案有關 $^{51}$ 。"}, {"type": "text", "text": "在美國方面，美駐上海總領事邁爾（Ferdinand Mayer）亦一再催促外交總長沈瑞麟出示對韋勃斯脫等字樣商標的保護令，要求按照《中美商約》第9條之所載，擔承由該管機關頒發有法律同等效力之布告，禁止商務印書館繼續假冒 $^{52}$ 。外交部於1925年5月致函美領事邁爾，只有大圈內花園W字正商標是合法，可以核准。其餘三種字樣商標因非特殊形式，「審查認為未盡合法，未予批准，此時如由官廳示禁他人仿用，不特官廳有違反法律之嫌，即按照條約載諸手續亦有未合，自屬欠難照辦」 $^{53}$ 。"}, {"type": "text", "text": "儘管1915年11月中國政府曾公布版權法，次年2月公布了版權登記法，但是在外人版權問題應依照中外條約規定，並不適用中國國內法的前提下，美商仍受限於《中美商約》的限制，在版權問題上無所進展。由於商標勝訴案已有前例，因此外人多以商標案來矇混版權，甚至有美國書商將普通姓名、書名作書籍商標，矇混註冊的情況。《韋氏大學字典》一案中，中國堅持只有一種商標圖案為合法，其餘均為字樣，不能當作商標。該案在外交部和實業部力挺之下，不受美方指稱Webster's等字樣為商標之限制。在譯印權部分，由於《中美商約》中的「專備中國人民之用」條件，加以商務印書館並非「照樣翻印」，因此可以繼續發行《韋氏大字典》 $^{54}$ 。"}, {"type": "text", "text": "50 外交部收商務印書館張元濟函，1924年10月3日，〈關於敝館譯印美國米林公司韋氏大學字典一事備述與該公司交涉經過情形祈轉知農商部知照商標局查以保利權〉。《外交部檔案》，03-43-015-02-001。外交部收商務印書館張元濟函，1924年11月4日，〈美國米林公司以書名人名用作商標矇請註冊請依約駁斥〉。《外交部檔案》，03-43-015-02-006。"}, {"type": "text", "text": "51 據英美煙公司律師肯列退的說法，約1919年上海會審公廨有二案，一為寶威藥房（Burrough Mellcome & Co.）控告南洋大藥房仿冒商標案；二為白克公司（A. R. Burkill）控告新大號經售仿製肥皂案，均獲勝訴。〈中國商標版權之保護問題〉，《東方雜誌》，第16卷第9號（1919），頁163。"}, {"type": "text", "text": "48〈韋氏大學字典案被告申辯狀，附本案判決書〉1923年9月21日，頁14、44。收於《外交部檔案》，03-43-015-01-007。"}, {"type": "text", "text": "49 外交部收江蘇交涉員呈，〈美商所請保護用於書籍字典之韋勃斯脫等字商標恐礙我國譯印權利祈鑑核轉咨示遵由〉，1924年10月4日。《外交部檔案》，03-43-015-02-005。"}, {"type": "text", "text": "52 Ferdinand Mayer to Shen Jui-Lin, May 18, 1925.〈關於美商請發布告保護商標一事請按約轉知該機關注意頒發由〉，《外交部檔案》，03-43-015-02-014。"}, {"type": "text", "text": "53 外交部致美梅代使（邁爾），1925年5月25日，〈示禁宥用米林公司商標事歉難照辦〉，《外交部檔案》，03-43-015-02-015。"}, {"type": "text", "text": "《韋氏大學字典》是民初喧騰一時的中外版權糾紛案，判決的結果也讓美國人深刻體認到除非改定商約，否則很難獲得中國給予版權保護，此亦是1920年代中期以後很少再看到美方控訴版權案的緣故。值得留意的是本案中的美籍陪審官阿爾門於1924年在上海出版了一本英文小冊《在中國的保護商標、專利和版權指南》（Handbook on the Protection of Trademarks, Patents, Copyrights and Trade-Names in China）旨在告知英美人士在中國獲得的商標版權和專利之保護極為有限，並非等同於外人對治外法權的認知和保護，中國與英美人士關於版權等專利問題最重要的依據是清末《中英》、《中美商約》。這本小冊也可說明儘管阿爾門對於外人在華的專利保護權相當不滿，但他作為華洋會審公廨的陪審官必須就法言法的立場。該文也強烈批評1923年中國商標法第6條關於商標註冊的審查程序，希望美國政府能通過法律交涉途徑加以解決 $^{55}$ 。"}, {"type": "text", "text": "1924年4月，上海東吳法學院編印的《中國法律評論》刊出美國人博良（Robert T. Bryan, Jr. 1892-） $^{56}$ 的文章〈美國貿易——商標、貿易名稱、版權和專利在中國〉（American Trademarks, Trade Names, Copyright and Patents in China） $^{57}$ ，博良為1918年起即在上海執業的美國律師，該文為作者從法律觀點評論中國的商標、版權和專利法案。在版權上，他建議旨在為中國人使用和教育的知識產權的擁有者在其作品上印製或刻上如下文字「專用於中國人民的使用和教育」，此外，亦建議應寫上「已依1903年中美條約在內務部進行登記」，以作為商標、版權和專利被侵犯時的救濟方式 $^{58}$ 。"}, {"type": "text", "text": "pp. 1-21. 上海圖書館徐家匯藏書樓藏。"}, {"type": "text", "text": "56 博良（Robert T. Bryan, Jr.）1892年生於上海，為浸會大學（後改名為滬江大學）校長美籍傳教士萬應遠（Robert Thomas Bryan, 1855-1946）之子。1918-1941年間曾任上海執業律師、東吳大學法學院教授、上海工部局法律顧問等職。太平洋戰爭爆發後一度被日軍囚禁。1946年回到上海繼續執業，曾任美國駐華大使館及駐上海總領事館法律顧問，並參與《中美商約》的談判。此後又被中共指控為間諜而遭逮捕，直到1952年才被釋放返美。撰有：“A Revolution in Reverse, Some truth about Chinese Communism”, in American Bar Association Journal, Oct., 1953, Vol. 39, pp. 881-882. 參考：上海市檔案館編，《上海租界志》（上海：上海社會科學院出版社，2001年版），頁626。"}, {"type": "text", "text": "57 博良，〈美國商標、商標名稱、版權和專利在中國〉，收錄於：王健編，《西法東漸——外國人與中國法的近代變革》（北京：中國政法大學出版社，2001），頁259-267。"}, {"type": "text", "text": "54 1928年1月實業部在審查該批字樣商標後，亦認為仍難依美方之意照辦。實業部致外交部函，1928年1月9日，《美商請保護關於書籍字典之韋勃斯脫等字商標》，《外交部檔案》，03-43-015-02-016。"}, {"type": "text", "text": "55 Norwood F. Allman, Handbook on the Protection of Trademarks, Patents, Copyrights and Trade-Names in China (Shanghai: Kelly & Walsh Limited, 1924),"}, {"type": "text", "text": "58 博良，〈美國商標、商標名稱、版權和專利在中國〉，頁266-267。文末作者的結論是：「儘管中國二十年前在條約中允諾進行保護外國商標方面的足夠立法，但直到如今也沒有頒布讓外國滿意的法律。」但該文仍呼籲美國和外國商人向中國政府註冊，並詳細介紹了註冊的要件和程序。"}, {"type": "text", "text": "三、國際版權同盟與上海「萬國出版協會」"}, {"type": "text", "text": "中美版權交涉之際，另一平行發展的歷史脈絡為國際版權會議及組織在中國的引進。國際（或萬國）版權同盟的起源肇始於1886年伯爾尼公約及1896年的巴黎改正會議，而中國一直到1902年中美交涉版權問題時，始介紹上述兩次國際版權會議的歷史。 上海《外交報》於1902年第1期至第3期首度翻譯了國際版權會議的條文，同年上海官書局印行的《皇朝續艾文編》，也收錄了國際版權會議的規章及附件 $^{59}$ 。商務印書館於1903年翻印英美人士合撰的《版權考》，亦詳加介紹歐美主要國家的版權制度與文藝昌盛之關連，並詳述萬國版權同盟的歷史，該書〈序言〉提到商標、專利和版權「關係於文明之進步者，獨以版權為最駁」，該書出版目的係因應已簽訂之《中美》、《中日商約》中的版權問題，供清政府商部參考。「況今者美日兩國，皆要以判權列入商約，使不及早訂定專律，吾恐懷鉛握槩之士，皆將踵商人掛洋旗持三聯單之為，以托庇於他人之宇下。我國家甯必驅魚爵而入淵叢乎？」 $^{60}$ 。由此可知，中國朝野於清末中美、中日交涉版權問題時，因體認涉外版權問題的重要性，開始留意西方各國的版權制度和國際版權組織的發展，為各國要求涉外版權的趨勢預做因應之道。"}, {"type": "text", "text": "在美國商約索取洋文版權的同時，事實上進一步催化中國朝野正視國內日愈嚴重的盜版問題。戶部和管學大臣正針對國內出書日廣，要求嚴定規條，申明版權「以杜偽亂，而維學界事」。當時有文明書局所出版之《蒙學讀本》等印製之書籍，「擬請由管學大臣明定版權，許以專利，並咨行天下大小學堂，官私局所概不得私行翻印，或截取割裂，以滋遺誤而干例禁，則學術有所統歸而人才日以奮迅矣」。由此可知當時翻印情況之嚴重，官私局皆有 $^{61}$ 。現今仍出現於中文版權頁標誌的「版權所有，翻印必究」，據研究可能出自於1904年商務印書館出版的嚴復譯本《英文漢詁》 $^{62}$ 。同年美國傳教士林樂知又於《萬國公報》發表〈版權之關係〉，闡述「夫版權者，西國以保護著書者、印書者之權利」，強調版權對一國文化興衰之重要 $^{63}$ 。光緒29年（1903）清政府曾有版權布告謂「凡譯書院譯印官書，均不許他人翻印」。由於譯書院翻譯東西圖書，「考訂詳實，校訂精美……從前雖經存案，誠恐書賈射利，故智復萌，妄行翻印，貽誤非淺」 $^{64}$ 。接著，8年（光緒34）又曾頒布「毋許將千傾堂印售中西江通醫書五種，翻印漁利，違干查究」的保護版權布告 $^{65}$ 。凡此，均可見《中美商約》簽訂前後，中國朝野關注涉外版權和國際版權同盟的發展之際，亦催化中國朝野正視國內盜版問題的嚴重性，只是朝野認為中國並無條件加入版權同盟。"}, {"type": "text", "text": "59 于寶軒編，《皇朝續艾文編》，卷73，學術五（上海官書局，光緒28[1902]）收錄有兩次會議的規章及附件。見：周林、李明山主編，《中國版權史研究文獻》，頁25-38。"}, {"type": "text", "text": "不食其報，蓋未有不廢。」"}, {"type": "text", "text": "於頁50。該書序言提到：「所謂Trademark商標、Patent專利、Copyright版權"}, {"type": "text", "text": "之律以成，關係於文明之進步者。獨以版權為最駁。其說者，謂風氣初開，"}, {"type": "text", "text": "著作未盛，若成一書必禁人翻印，則行之不遠。受其譯者少，不如無版權。"}, {"type": "text", "text": "61 管學大臣的批示中提到文明書局出版之《原富》諸書「橫絕譯林，只譯單詞皆同環寶矣」。允諾嗣後文明書局所出各書，由管學大學堂加蓋審定圖章，並嚴禁書商謀毀版權。〈廉部郎上管學大臣論版權事〉，周林、李明山主編，《中國版權史研究文獻》，頁45-46。"}, {"type": "text", "text": "之為愈也，不知著述之士，大抵窮愁發憤者多，積年累月，耗竭心力，得稿"}, {"type": "text", "text": "62 李明山主編，《中國近代版權史》，頁56。"}, {"type": "text", "text": "盈寸，持以問世，而射利之輩乃遽襲為己有，以分其錙銖之微。徒任其勞，"}, {"type": "text", "text": "63 林樂知，〈版權之關係〉，原載《萬國公報》，卷183。收於《中國版權史研究文獻》，頁81-82。"}, {"type": "text", "text": "64〈清政府保護版權布告之一〉，《中國版權史研究文獻》，頁48-49。"}, {"type": "text", "text": "商約簽定後的第二年，即1904年（光緒30年）美國圖書館協會（American Library Association）曾於聖路易斯（St. Louis）召開「萬國書籍會」（International Library Conference），「欲聚晰各國書籍會情形，並欲考究各國各經理書籍館，攸關各國之要法」，此次會議主要針對各國圖書管理的議題，與版權雖不直接，但亦看出美國政府對書籍文化事業的重視。當時美駐華公使康格曾邀請慶親王奕劻派員參加，後來則由駐美公使梁誠選派美使館員參加 $^{66}$ 。"}, {"type": "text", "text": "1908年（光緒34）9月20日在柏林召開的「萬國保全文藝及美術權利公會」可能是中國首次獲邀參加國際版權同盟組織的開始。該年農曆3月初6，德國駐華公使雷克司（Grasf von Rex）致慶親王弈勛的照會中正式向中國提出這項邀請，照會中提到該次會議源自瑞士京城伯諾（即1886年伯爾尼會議），歷經巴黎改良會議（1896年），此次在柏林公會甚為關鍵「在訂一新章以邏近發明版權新理為依據，並聯合迤前在伯諾及巴黎兩處所各條」。其後雷克司亦照會外務部提出正式邀請。外務部與學部會商後，決定派駐德大臣孫寶琦派員前往 $^{67}$ 。到了該年8月，可能因電報延擱，中國駐德國官員向柏林和會表示對此事尚無所悉，以致德國再度照會清政府「開會之日期臨迫，應請設法即刻使貴國駐德大使得其應得之命令」，不久孫寶琦電悉屆時將派員前往 $^{68}$ 。究竟清政府官員赴會後的心得如何，因文獻不足，不知結果，但至少在20世紀之初，中國已受邀參與國際版權同盟之組織。"}, {"type": "text", "text": "本文第一節曾提到1913年5月美國曾提議與中國簽訂版權同盟，外交部堅不應允，此事經一年交涉，美方始暫緩提議。交涉期間，1914年上海書會商會由會董俞復、陸費達、狄葆賢三人具稟反對中國加入中美版權同盟，理由為「版權同盟本為保護著作人權利，並國際間人民互享之利益之計而設，必視乎本國之文化及其著作物之流布於國外者與各國相等，方以加入同盟為有利，否則加入版權同盟嗣後各國圖書我國人即一概不得翻印，而吾國人著作，外國人絕無翻印之必要，徒為片面利益，自窒文明之進步，殊為失計」。該文提到日本於明治32（1899年）始加入萬國版權聯盟；明治39年（1906年）始與美國締結保護著作權條約，因日本學術進行與歐美各國國際間處處立於對等的地位，且以改正條約之故，不得已而加入。然美、日條約中「但禁翻印而不禁翻譯，尤證其力保利權不甘全行放棄」 $^{69}$ 。"}, {"type": "text", "text": "67〈德國萬國保全文藝及美術權利公會·德駐華公使雷克司致慶親王弈劻照會〉，光緒34年3月初6日，中國第一歷史檔案編印，《晚清國際會議》，頁4364-4376。該項照會亦提到「凡未入會之委員可如前在巴黎集會之時，依然任便旁聽或條陳意見。」中國是否曾收到之前巴黎集會之邀請，因未有相關文件之佐證，不知詳情，但至少柏林會議中國確有收到是項邀請，並電派駐德使臣孫寶琦參加。另據筆者查閱《總理各國事務衙門》和《外務部檔案》，01-27-001-01-001，《各國賽會公會》亦未看到巴黎集會之相關文件。"}, {"type": "text", "text": "65〈清政府保護版權布告之二〉，《中國版權史研究文獻》，頁48-49。"}, {"type": "text", "text": "66〈美國聖路易斯萬國書籍會·為西曆十月在聖路易斯設萬國書籍會請員事〉光緒30年2月21日。〈為請會同駐美臣於館內遴派數員赴萬國書籍會事〉，光緒30年2月23日。中國第一歷史檔案館編，《晚清國際會議》（揚州市：廣陵書社，2008），頁2461-2464。"}, {"type": "text", "text": "68〈德國萬國保全文藝及美術權利公會·為駐貴國大使已於上月電復屆時派員赴柏林保全文藝及美術權利公會事〉，光緒34年8月23日，《晚清國際會議》，頁4395-4396。"}, {"type": "text", "text": "由於中國不願附和美方提議簽訂版權同盟，美國書商為進一步獲得版權保障，乃有一批英美人士於上海成立萬國出版協會（The International Publishers' Association）。1914年7月間，上海英文《字林西報》和《大陸報》（China Press）報導上海「萬國出版協會」的訊息，後者小標題「為防止盜印，已有百分之八十華人加入此行動」，由於外交部尚未收到正式公函，乃要求滬海道尹兼特派江蘇交涉員查明此事預籌對策 $^{70}$ 。經查明後確有此事，但對於報載已有華人書業高達80%加入該會，上海書業商會澄清絕無此事，表示此為英美人士捏造之訊息，目前並無一人入會 $^{71}$ 。"}, {"type": "text", "text": "英美人士籌組之「萬國出版協會」，事實上不同於源自《伯爾尼公約》的國際版權同盟，而是以美國人為首，為抵制中國書商侵權而成立的組織。英文名為“The International Publisher’ Association, Limited”，中文稱為協會，實則為一家公司。為避開中國政府的管理，未向中國海關註冊，而是在香港註冊，等於受英國保護。授權資本額為5萬上海通用幣。公司會址設於上海北京路6號，主席為哈汀公司（Harding & Co.）的史考特（Scott）、負責人阿斯考夫（F. Ayscough）、經理主任為諾伯理（F. J. Norbury）、祕書兼總經理為甘寧（L. E. Canning）、銷售經理為ZI VI Yoong（中文名不詳，應為華人） $^{72}$ 。「萬國出版協會」的成立布告云：「中國政府毫無保護外人版權之規定，於是華人翻印西書而賤售之者，自以為是其應享之權利」。文中特別提到美國書商向中國政府抗議版權侵奪案但毫無成效，「西方書商觀於此事甚不平允，遂決議在取得公允辦法之前將西方新書之供給停止，本會發起人與東西兩方出版人聯絡，並聲稱知東方書商之意欲抄錄西書原稿而不以剽竊論也……因與倫敦、紐約、中國等處各重要書商議就一策，不獨各方面利益因之穩固，即著作者之利益亦可安全」。「此會之組織於中國文化進行有莫大之補助，報界教育會商會等亦竭力輔助焉」。其成立宗旨錄之如下："}, {"type": "text", "text": "一、係為保護運書來華出售或將原稿以中文印行之外國著作人暨出版人有版權而設之機關。"}, {"type": "text", "text": "二、遵照香港條例（法令）按照有限公司註冊，凡會員納上海通用幣五十元之入會會費者，得享有規定之一利權。"}, {"type": "text", "text": "三、著作人出版人售賣書籍事宜由本會經理，並設法保護版權。"}, {"type": "text", "text": "四、與本會訂有合同或本會會員之著作人暨出版人得將會中憑照（或圖章）印於其所出書前後之空頁上，以證明其著作權並聲明禁止翻印。"}, {"type": "text", "text": "五、本會延聘譯員均係極有聲望之文學家，不論何種教科書"}, {"type": "text", "text": "69 外交部收上海書業商會稟，1914年7月27日，《外國書商要求享有版權妨礙教育工商前途懇請駁拒由》，《外交部檔案》，03-43-013-04-001。"}, {"type": "text", "text": "70 外交部飭滬海道尹兼特派江蘇交涉員，1914年8月10日，《英美書商在上海設出版協會有無其事希查復由》，《外交部檔案》，03-43-013-04-004。"}, {"type": "text", "text": "71 外交部收江蘇特派員函，1914年9月9日，《查復報載英美書商在滬設萬國出版協會情形由》，《外交部檔案》，03-43-014-04-006。《字林西報》，July 4, 1914,《大陸報》（China Press），July 5, 1914。"}, {"type": "text", "text": "72 The International Publisher' Association Limited. 錄自外交部收江蘇特派員函，1914年3月9日，〈查復報載英美書商在滬設萬國出版協會情形由〉，附件英文及譯文。《外交部檔案》，03-43-014-04-006。"}, {"type": "text", "text": "文學書可譯成極佳之華文。"}, {"type": "text", "text": "六、本會評議委員會對於英文及其他外國文字書籍之宜否出售或應否譯成華文應表示意見。翻譯印刷售賣書籍各事宜如欲由本會任行代為經理可另議新法，以便情事。"}, {"type": "text", "text": "七、本會將會員書籍暨他種出版稿製分類書目發行並將該項書籍按月編製附冊。"}, {"type": "text", "text": "該協會的成立辦法對於審查、評選、送交樣書的形式、出版形式的報告書（格式合賣與否、是否加注中文、是否應逹譯中文並繫以洋文解釋）和收費等均有詳細說明。至於出版後的分銷系統，該協會亦甚有信心：「為調和各重要代派人（按：distributor）暨會中人之利益起見而組織代派事業。因之西方出版人所得之銷場計有支店六十，代理人三千五百，而其主顧之學校教育學會等在三萬五千以上。」並宣稱各經銷代理人之資本總計有5百萬兩之多 $^{73}$ 。如從其成立宗旨看來，事實上是通過該組織意圖掌握西文書籍在上海的編輯（或編譯）、出版和行銷的一套作業，可說是英美書商面對中國盜版橫行的自救之道。"}, {"type": "text", "text": "《字林西報》報導此事時提到之前受到美國書商敗訴個案的影響，西方出書人曾一度決定停止供給新書，然此種消極政策現已取消，因目前已有較妥且確實的辦法，亦即「萬國出版協會」的設立，該會由歐人、美人、華人共同組織。《字林西報》和《大陸報》都一致報導華人書業入會者已達80%，宣稱在會華人同意不論直接或間接，均不得妨害已在會中註冊者之版權 $^{74}$ 。"}, {"type": "text", "text": "「萬國出版協會」對外宣稱華人書業共襄盛舉，隨即遭到上海書業商會的否認，且上書教育部表示反對。上海書業商會表示此事不但超出《中美商約》的內容，且各國必將援例，將使凡屬外國人著作無一冊可以翻印，與加入版權同盟無異，要求教育部予以駁拒，「況既許其享有著作權，則其著作物必俟其行世十年以後方得自由譯印，則十年內除少數人能讀其原著作外，學者更無從得新知識輸入之益，此就妨礙教育喪失權利也」。上海書業商會的呈文，亦從經濟層面加以分析說，「外國貨物近來入口者日多，利權外溢深可寒心，幸而工業漸進，印刷改良，如能翻印外國圖書，方謂此後可以藉此稍能抵制外貨，杜塞漏卮」。對於上海「萬國出版協會」的成立，「若使外國人得將其為該國自著之書設肆中國境內，即享有著作權並加保護是無異自行遏絕生機，此又妨礙工商業者也」，「實有百害而無一利」。甚且「今吾國收回領事裁判權尚無把握，似不宜先以此曲徇其要求」，此一分析雖未必正確，但其意見為教育部所接受，希望外交部行文美國政府予以駁拒75。農商總長張謇咨外交部求證是否英美人士擬組「萬國出版協會」一事，亦呼應「百害而無一利」的說法76。"}, {"type": "text", "text": "據查外交部檔案，英美公使並未向外交部正式交涉此事，外交部同日回覆教育部和農商部的咨文提到「尚未准各該國公使到部提議，礙難遽向駁拒」。外交部同時表示版權一事見於《中美》、《中日商約》，將來免釐加稅問題解決後，如英美要求實行，自難置成約於不顧 $^{77}$ 。顯然就版權一事而言，外交部認為中國政府尚未急迫到需立即解決，因《中美商約》的條款對我有利。"}, {"type": "text", "text": "74 North China Daily News, July 4, 1914.《外交部檔案》，03-43-014-04-006。"}, {"type": "text", "text": "73 上海萬國出版協會的成立、組織與宗旨，譯文錄自：外交部收江蘇特派員函，1914年3月9日，〈查復報載英美書商在滬設萬國出版協會情形由〉，此份文件含英文與譯文共有77頁之多。《外交部檔案》，03-43-014-04-006。"}, {"type": "text", "text": "75 外交部收教育部咨，1914年8月3日，《美國要求加入版權同盟事能否設法駁拒請查核見覆由》，《外交部檔案》，03-43-013-04-003。"}, {"type": "text", "text": "76 外交部收農商部咨，1914年8月5日，《咨詢名人書商要求在吾國享有著作權有無其事由》，《外交部檔案》，03-43-013-04-004。"}, {"type": "text", "text": "上海書業商會於1919年再度呈請外交部駁拒給予洋商版權，以及反對中國加入版權同盟。所持理由除前述提到的美國史書並各種教科書，其原書本非專備中國人民之用外，更稱商務印書館之舉為普及教育之善行，且中國未入版權同盟，商家翻印書既非有違條約，自屬無憑禁止。他們認為版權同盟本為保護著作人權利，並國際間人民互享利益之計而設，必視本國文化及其著作物之流布於國外者與各國相等，始有加入的條件，而美國立國之初亦毫無節制翻印英國書籍，因此並未加入萬國同盟。後因著作日多，工商發達，堪與歐洲國家相提比論時，始加入版權同盟 $^{78}$ 。"}, {"type": "text", "text": "上海「萬國出版協會」的成立消息，引起中國知識圈熱烈討論國際版權同盟的熱潮，上海書業、教育部及農商部均持反對態度，知識圈則有少數持異議者，楊端六和武堉幹先後於《東方雜誌》發表文章表示中國應參加國際版權同盟，特別是武堉幹更主張積極加入。楊端六〈國際版權同盟〉一文，首先概述1886年國際版權組織的成立和歷史演進。對於輿論將加入版權同盟等同於「文化封鎖」甚不以為然。認為「我國苟欲於世界政治占一地位，對於此等公共事業應積極的干預，不得終世處於消極地位也。」 $^{79}$ 武堉幹〈國際版權同盟與中國〉一文，呼應楊端六文章的結語，主張中國應積極參與此一國際公共事業，以提高在國際的地位。武堉幹首先探討二個問題：一是版權的性質和基礎；二是國際版權的由來和經過，此外，從學理上分析版權作為著作人或承讓人的專有財產權。最後申論中國有必要加入國際版權同盟的重要性。他將當時反對加入國際版權者分為兩種，第一說是理論上反對，亦即中國尚無條件加入同盟，如加入同盟等於翻譯事業將受到限制，對中國文化前途的封鎖。他認為中國若擔心加入同盟後翻譯事業受到拘束，可仿照1906年柏林會議中保留條件的批准，例如日本即是。第二說則是根本上否認版權的存在，此在法學上站不住腳。武堉幹從文化運動的宣傳、國際地位的提升和世界潮流的趨勢，闡述中國有加入國際版權同盟的必要。他認為就國際聯合會的發展趨勢而言，不僅是政治經濟，且文化學術上亦然，顯示從國家主義（Nationalism）走向國際主義和世界主義（Cosmopolitanism）的傾向，中國既然是國際社會的成員，應順從時代精神和環境調適，纔不致流為時代的落伍者 $^{80}$ 。楊端六和武堉幹的言論在當時頗為新潮，呼應一戰以後中國知識圈希望藉由參與各種國際組織以提高中國的國際地位，樹立新中國形象的想法。但加入國際版權同盟的主張未獲教育部和外交部的呼應。教育部的立場如前所述，為廣開智識，振興新知，加入版權同盟並不利於我；而外交部則從實務外交著眼，《中美商約》的條款既有利於中國譯印西書，自不考慮加入國際版權同盟。"}, {"type": "text", "text": "77 外交部咨教育部，外交部咨農商部，1914年10月15日，《英美書商在滬設萬國版權協會未准各使到部提議譯送西報暨該協會布告備核由》，《外交部檔案》，03-43-013-04-007、03-43-013-04-009。"}, {"type": "text", "text": "78 外交部收上海書業商會呈，1919年5月9日，《洋商矇請版權懇請據約駁拒》《外交部檔案》，03-43-014-02-001。"}, {"type": "text", "text": "79 端六（楊端六），〈國際版權同盟〉，《東方雜誌》，第17卷第24號（1920年"}, {"type": "text", "text": "12月25日），頁4-5。"}, {"type": "text", "text": "80 武堉幹，〈國際版權同盟與中國〉，《東方雜誌》，第18卷第5號（1921年3月10日），頁7-17。"}, {"type": "text", "text": "小結"}, {"type": "text", "text": "清末民初中美版權之爭訟過程，中國得以勝訴的理由有以下三個重點。一、中國的國內法：清末《邁爾氏通史》案，提到中國無版權專法可援照，然即使是清末《大清著作律》（1910）或民初（1915年）著作權法頒布後，中國又推諉相關註冊程序未立，或從法理上認定國內法不及於外國人；二、國際公約：中國無加入國際版權同盟，因此不受規範。此亦所以美方一再希望中國參加國際版權會議，或在上海組織「萬國版權會議」希望通過多邊國際力量來制約中國；三、最關鍵的焦點：《中美商約》第11款中版權保護的限定範圍，予以中國政府在翻譯和翻印上享有極大的便利。由於中方堅持不願修改《中美商約》，美方為單純化版權問題，曾援以1906年美日簽訂版權同盟為底本，希望簽訂中美版權同盟，但中國政府則基於清末商約上的版權條款上有利於我方而婉拒之。"}, {"type": "text", "text": "除了條約的相關規範之外，清末民初中美版權交涉過程中商務印書館、上海同業書會、教育部，均從《中美商約》的版權釋義認為中國持有任意翻印和譯印西書的權利，且認為中國文化條件相對不足，不能以道德層次指責中國有盜竊和欺騙行為；如同前述商務印書館的委任律師禮明所言「中國既未侵擾權利，亦未違犯公理」，外人指控中國有傷通商道德為「直以汙泥擲人而詛之也？」另一方面，上海華洋會審公廨會審亦從《中美商約》11條「專備中國人民所用之書籍」的法理性和適用範圍，認定中國「有損害而無過犯」，判定美國書商敗訴。美籍陪審員就法論法，迴避道德層次的討論，且未以美國政府為後盾橫加干涉。這些因素均使得清末民初中美版權的交涉，中國不僅取得法理上的勝訴，且以「振興西學、嘉惠學子」的理由取得「合法盜版」的正義——所謂「竊書不為偷也」；中國方面同時在法理與公理上的全面獲勝，為清末民初外交上極少有的現象。"}, {"type": "text", "text": "有鑑於清末版權案敗訴的案例，民國以後一些美國書商通過駐華使館直接向中國政府索取版權，這些書籍或有註明「專備為中國人民之用」的字樣，或以華文釋義，但最後仍告失敗。中國書商指稱美商以標誌「專備為中國人民之用」的方式矇混版權，實則並非專為中國人所寫的書籍。然而《各國老幼書》以華文釋義，在形式上已具備保護條件時，學務部竟表示該書思想陳舊不適學堂閱讀，內務省又以商標法未立而不願出示版權保護令，北京外交部只好據實婉拒美國政府之請求。由於涉外商標案的勝算較大，美商在《韋氏大字典》案中同時控告華商侵犯商標與版權，這件案子亦出動美國駐上海美領事關切，美方最終以商標案獲得賠償，但在版權案上仍為敗訴，商務印書館得以如願發行該書。"}, {"type": "text", "text": "這些美方版權交涉案的失敗案例，使得美商不得不再尋求他法，於是美國書商聯合英國人士在上海成立「萬國出版協會」，並吸納一部分華人書商，意欲掌控原文書在中國的編譯、翻印和發行。但消息曝光後，這些華人書商紛紛澄清並未加入該協會。中國華人書商仍自成一股強大勢力來抵制英美書商，且上書教育部反對「萬國出版協會」的成立。上海書業商會持論「萬國出版協會」一旦成立，各國必將援例跟進，其結果將使中國無可譯印之西書。中國書商憑恃清末《中美商約》中給予譯印洋文書籍的「通行證」，在商約第11款關於版權的保護傘之下，幾乎得以任意翻印和翻譯西書，打開中國博覽「天下奇書」的方便之門，為近代中國知識的傳播與新思想的引介開了一道大門，也成就清末民"}, {"type": "text", "text": "初譯印事業的欣欣向榮 $^{81}$ 。"}, {"type": "text", "text": "清末民初的版權交涉，儘管對美方是挫敗的歷程，卻是帶動中國與國際版權公約互動的開始。《中美商約》簽訂前後，世界第一部版權公約——伯爾尼公約首度為中國人知悉，世界各國的版權制度亦被引介到中國來。美國方面則是通過各項變通之道，向中國索取版權，一方面希望中國加入版權同盟受到約束，另一方面英美書商則在上海籌組小型「萬國出版協會」。雖然此一協會並非真正的國際版權協會，可說是英美人士為保障版權的自力救濟組織，然此事卻引發中國知識圈討論中國應否加入版權同盟的熱潮。中國書商和教育部為保護譯印權益主張不加入國際版權同盟，但少數知識分子已意識到加入國際版權同盟有助於中國國際地位的提升，主張中國走向世界潮流。"}, {"type": "text", "text": "儘管美方對版權條約的不滿，也意識到惟有修改清末商約才可能獲得在中國較充分的版權保護，但改訂商約一事，不僅僅涉及版權問題，尚有其他諸多條款和複雜政治層面問題需一併考量。南京政府成立以後，雖曾於1933-34年提出修訂《中美商約》，但最後未能正式磋商 $^{82}$ ，直到二次大戰結束後簽訂的1946年《中美商約》才又重啟版權和專利問題的討論，但其結果仍令美方不滿，特別是版權一事；美國國會在批准戰後《中美商約》時加入「保留及了解」條文：「……關於文學及藝術作品禁止翻譯之保護之規定，在未就翻譯事項另有談判及協定前，將依1903年《中美商約》之規定解釋之。」（參見本書第9章）由此可見清末《中美商約》與1946年商約相較之下，美國認為中國歷經四十餘年並未在智慧財產權上有多大進步意義，只得仍沿用清末《中美商約》的解釋條款。由此更可見1903年《中美商約》在近代涉外版權史的重要性。"}, {"type": "text", "text": "81 如本文所舉侵權案的多起被告商務印書館。成立於 1897 年的商務印書館，以一間小小的工作坊，逐步發展為民國初期中國首屈一指的出版和文化機構。在商務印書館早期的開展事業中，譯印西書和編寫各類教科書為其重要項目。關於商務印書館的較新研究，詳見：李家駒，《商務印書館與近代知識文化的傳播》（香港：中文大學，2007），頁 15-48。"}, {"type": "text", "text": "82 在清末《中美商約》訂立的第三個10年期滿，由駐法國公使顧維鈞首先提出修約建議。1934年1月外交部照會美國國務院提出修改商約之議，但雙方最後未能達成修約共識。有關1933年南京政府之修約，原始資料參見中國第二歷史檔案館編，《中華民國史檔案資料匯編》，第5輯，第1編，「財政金融」，頁78-85。"}, {"type": "note", "text": "1 清末民初中國發生的個案主要為商標、版權、專利三者，尚未使用現今「智慧財產權」一詞所界定的廣泛範疇——包含商標、著作權、工業專利、藝術創作、工藝設計和產地標誌等人類精神活動之成果。在美國國務院國家檔案館有關中國內部事務檔案（Records of Department of State Relating to Internal Affairs of China, 1919-29, 1930-39 和 1940-44，以下簡稱 NA）的編目分類中，在經濟事務（economic matters）項目有關資產（Property）條目下，最先是有形的土地房屋產權，最後為無形資產：即商標、版權、專利的交涉。而在中國政府的外交檔案中，版權交涉被歸檔為教育文化檔，由此亦看出中國關注的是教育文化問題，而美國關注的則是保護無形資產的創作權，兩者有不同的價值觀。"}, {"type": "note", "text": "2 台灣於1992年加入國際版權公約，成為會員之一。中華人民共和國於1990年制定《著作權法》，1992年加入國際版權同盟，2001年加入WTO。1990年代以後引起中外學界研究改革開放後中國版權貿易和盜版問題的熱潮，相關著作甚多。例如：鄭成思，《版權公約、版權保護與版權貿易》（北京：中國人民大學出版社，1992）。張美娟，《中外版權貿易比較研究》（北京：北京圖書館出版社，2004）。Andrew C. Mertha, The Politics of Piracy: Intellectual Property in Contemporary China (Ithaca, N. Y.: Cornell University, 2005). Martin K. Dimitrov, Piracy and the State: The Politics of Intellectual Property Rights in China (Cambridge, UK and New York: Cambridge University Press, 2009)."}, {"type": "note", "text": "3 李明山主編，《中國近代版權史》（鄭州：河南大學出版社，2003），為開創性的通論研究，該書認為至少中國宋代就產生了版權概念，而清末以來在借鑑東西方發達國家的著作概念時，中國在法律條文中將「版權」和「著作權」視為相同內涵而交互使用，形成具有中國特色的版權和著作權概念。該書第7章提到涉外版權糾紛時，仍多以中國民族主義論述帝國主義在華活動，認為巴黎和會以後帶來反帝運動的高潮，以致涉外版權糾紛相對減少。見該書頁147-164。William P. Alford, To Steal a Book Is an Elegant Offense: Intellectual Property Law in Chinese Civilization (Stanford, CA: Stanford University Press, 1995)，該書共分六章，溯自清帝國時期中國為何無相應的智慧財產權的歷史、晚清船堅砲利下對西方智慧財權的引進、民國以來對於中國特色的智慧財產權立法化的演進、1949年後台灣與中華人民共和國在相關法案的演進，並對近年美國催促中國相關立法及因應之道有具體的分析。該書作者認為由於政治文化的因素，清代中國始終未能發展出相當於西方智慧財權的本土論述或是具體的立法措施，清末民初的中國知識分子對西方智慧財產權的引介亦是失敗的，因為他們從未想將西方模式施行於中國，一如作者的書名「竊書為高貴的冒犯」。近年中文著作尚有：王蘭萍，《近代中國著作權法的成長，1903-1910》（北京：北京大學出版社，2006）、李雨峰，《槍口下的法律：中國版權史研究》（北京：知識產權出版社，2010）。"}, {"type": "note", "text": "china-waseda.jp/japanese\\_studies\\_of\\_contemporary\\_china\\_2009/mokuji.html。日文版發表於：《中国—社会と文化》，第22号（2007年6月），日本中國社會文化學會，頁217-239。該文作者從三方面：一、清末民國時期的《著作權》與翻譯權；二、關於清末民國時期外文書籍的國際關係；三、清末民國時期的外文書籍與國內外反應，從以上研究視角探討中國本身的著作權法的演變、比較國際版權法規、中日版權糾紛與東亞內部關係，最後闡述1949迄今中國著作權問題的延續和演變。"}, {"type": "note", "text": "5 根據《辛丑和約》第11條：「大清國國家允定，將通商行船各條約內諸國視為應行商改之處，及有關通商各地事宜，均行商議，以期妥善簡易。」中美商約的研究，詳見：吳翎君，《美國大企業與近代中國的國際化》，第2章〈中美商務關係的里程碑——清末中美商約〉，頁69-107。王爾敏，《晚清商約外交》（香港：中文大學出版社，1998），頁175-195。此外，本書探討中英、中美、中日、中葡、中德等商約交涉和簽訂過程。"}, {"type": "note", "text": "4 中村元哉，〈圍繞近現代東亞外文書籍問題的國際關係——以中國為中心〉，《日本當代中國研究》（東京：2009），頁51-68。網路版，詳見：http://www."}, {"type": "note", "text": "6〈中英續議通商行船條約〉第7款，由「南北洋大臣在各管轄境內設立牌號註冊局所一處，派歸海關管理其事」。于能模編，《中外條約彙編》（上海：商"}, {"type": "note", "text": "務印書館，1936），頁27。《中英續議通商行船條約》，於1902年9月5日簽訂，次年7月28日換文。左旭初，《中國近代商標簡史》（上海：學林出版社，2003），頁18-23。"}, {"type": "note", "text": "7《中美商約》於1903年11月23日於華盛頓互換約文。《中日商約》於11月24日在北京互換。另據王爾敏教授的考證，《中美商約》於該年10月8日（農曆8月18日）簽於北京，日本在得知美約即將達致協議時，即趕在與《中美商約》同日簽字，所以《中日商約》簽約上的呂海寰、盛宣懷為現場簽署，而伍廷芳因在北京，其所簽字為日後補簽，此事顯現日本欲與美國爭鋒，因而有意留下美、日兩約同日簽定的紀錄。美國早於1902年交涉之初提出草約32款時即列有版權條款。王爾敏，《晚清商約外交》，頁216-217。"}, {"type": "note", "text": "8 這方面的研究相當多，如經典之著：Frank I. Schechter, The Historical Foundations of the Law Relating to Trade Marks (New York: Columbia University"}, {"type": "note", "text": "Press, 1925). 新近成果如 Alain Pottage and Brad Sherman, Figures of Invention: A History of Modern Patent law (New York: Oxford University Press, 2010), pp. 1-18; 45-65。美國專利局網站（United States Patent and trademark office）http://www.uspto.gov/。"}, {"type": "note", "text": "9〈嚴禁翻刻新著書籍告示〉，《萬國公報》97卷上，光緒23年1月（1897年2月）。〈擬立版權公會〉，載《大公報》，1904年3月6日。"}, {"type": "note", "text": "12〈外務部（代大學堂）發兩江總署張之洞電〉，《中美關係史料·光緒朝五》，頁3271-3272。"}, {"type": "note", "text": "10 海關總署研究室編譯，《辛丑和約訂立以後的商約談判》（北京：中華書局，1994），頁160-161。"}, {"type": "note", "text": "11〈外務部（代大學堂）發商約大臣呂海寰、盛宣懷電〉，中央研究院近代史研究所編，《中美關係史料·光緒朝五》（台北：中央研究院近代史研究所，1988），頁3271。"}, {"type": "note", "text": "13 張百熙曾在大公報發表〈管學大臣批答廉惠卿部郎呈請明定版權由〉，主張中國國內應訂版權法。《大公報》，1903年6月4日。。"}, {"type": "note", "text": "14〈前江督劉坤一復電〉，周林、李明山主編，《中國版權史研究文獻》（北京：中國方正出版社，1999），頁42。"}, {"type": "note", "text": "15 呂（海寰）、盛（宣懷）兩欽使復電，《中國版權史研究文獻》，頁43。"}, {"type": "note", "text": "16《辛丑和約訂立以後的商約談判》，頁200-201。"}, {"type": "note", "text": "17 外務部發農工商部咨，〈美使請允改商約第十一款版權一事即酌核見復由〉，光緒33年3月15日。中央研究院近代史所，《外務部檔案》，02-13-021-04-005。"}, {"type": "note", "text": "18 外交部收美館函，1913年5月27日，《鈔送美日合訂版權條約由》，《外交部檔案》，03-43-013-03-002。中文及外文。"}, {"type": "note", "text": "19 外交部致教育部、工商部，1913年7月8日，《美使擬訂版權條約事復達查照由》，《外交部檔案》，03-43-013-03-006。"}, {"type": "note", "text": "20 王蘭萍，《近代中國著作權法的成長，1903-1910》，頁76-83。民國以後1915和1928年曾修定著作權法，係在〈大清著作權律〉的基礎上修訂法條。李明山主編，《中國近代版權史》，頁124-127。"}, {"type": "note", "text": "21《著作權律釋義》為民初針對仍沿用的《大清著作權律》的釋義著作，在有關著作權律與國際條約的關係上，秦瑞玠認為著作權是個人私權，從國際的範"}, {"type": "note", "text": "圍來，亦應該是僑寓外人所有私權中的一種。但在《中美》、《中日商約》中並未明文賦予外人有這項私權。秦瑞玠編，《著作權律釋義》，於民國初年由上海商務印書館印行，全書收錄於《中國版權史研究文獻》，頁98-130。所引見頁102-103。"}, {"type": "note", "text": "22〈外務部學務處批准商務印書館稟請立案翻印洋文書籍目錄〉，NA, 893.544943/2。"}, {"type": "note", "text": "23 North China Daily News, March 30; April 3, 1911."}, {"type": "note", "text": "24 American Consulate-General (Shanghai) to the Secretary of State, Apr. 10, 1911, NA, 893.544943/1."}, {"type": "note", "text": "25 周林、李明山主編，《中國版權史研究文獻》（北京：中國方正出版社，1999），頁180-181。"}, {"type": "note", "text": "26 J. Paul Jameson to W. J. Calhoun, May 4, 1911, NA, 893.544943/2. 27 禮明的辯護詞，中文見：周林、李明山主編，《中國版權史研究文獻》，頁186-187。英文版見：American Consulate-General (Shanghai) to the Secretary of State, May 15, 1911, NA, 893.544943/1. enclosure “In the International Mixed Court in Shanghai”。中文版的文氣略為激動，以本文所引文末的結語對照可知：‘Crying piracy and charging lack of commercial morality, throwing mud and heaping abuse will not create a right where none exists by law. Certainly the Mixed Court cannot be asked to punish or enjoin the defendants where no right been infringed and no wrong has been committed.’"}, {"type": "note", "text": "28 外務部復英朱使照會，清宣統3年（1911）5月21日。外務部至上海道函，清宣統3年（1911）7月17日。周林、李明山主編，《中國版權史研究文獻》，頁190-191。"}, {"type": "note", "text": "29 商務印書館復上海道函，清宣統3年（1911）8月23日。《中國版權史研究文獻》，頁192。"}, {"type": "note", "text": "30《華英書目提要》，見於NA,893.544943/3有完整的一份118頁的目錄和介紹。"}, {"type": "note", "text": "31 American Book Company to the Secretary of State, March 14, 1910, NA, 893.5440Am2/5."}, {"type": "note", "text": "34 American Book Company to the Secretary of State, Nov. 12, 1912, NA, 893.544Am3. 外交部收美使館函，1913年1月8日，〈紐約書籍公司新出書籍請予版權由〉，中央研究院近代史所，《外交部檔案》，03-43-013-02-001。"}, {"type": "note", "text": "35 外交部致教育部函，1913年1月13日，《美公司所印書籍請給予版權希核辦見復由》，《外交部檔案》，03-43-013-02-002。"}, {"type": "note", "text": "32 American Legation (Peking) to the Secretary of State, June 22, 1911, NA, 893.544843/4. 嘉樂恆提到中國的高等學府、技術學院和教會大學對於西文教科書的需求愈為普遍，使得原文書盜印的情況非常嚴重，不僅侵犯作者著作權和書商版權，且由於取價較廉，使得代理美商和美國出版商蒙受巨額損失。"}, {"type": "note", "text": "33 J. B. Moore (Counselor of State Department) to American Book Company, July 20, 1913, NA, 893.544Am3/2."}, {"type": "note", "text": "36 外交部收教育部函，1913年6月21日，《紐約圖書公司所印之各國老幼書用意雖善不適用於學堂至給予版權向歸內務部辦理請轉復由》，《外交部檔案》，03-43-013-02-004。"}, {"type": "note", "text": "37 外交部致內務部函，1913年6月27日。〈紐約書籍公司請給予版權希核辦見復由〉，《外交部檔案》，03-43-013-02-007。"}, {"type": "note", "text": "38 外交部收內務部函，1914年2月7日，〈美人刊印書籍請求版權應援商標章程辦理現將樣本留部存查俟該章程公布再行核辦由〉，《外交部檔案》，03-43-013-02-008。"}, {"type": "note", "text": "39 外交部收美芮使函，1915年11月26日。〈美國函授學校課本請求註冊〉，《外交部檔案》，03-43-013-06-006。"}, {"type": "note", "text": "40 外交部收內務部函，1915年12月15日。〈美國函授學校請求版權案按公文程式未便批示請轉致美使由〉，《外交部檔案》，03-43-013-06-008。"}, {"type": "note", "text": "41〈中國商標版權之保護問題〉，主講者英美煙公司律師肯列退先生。《東方雜誌》，第16卷第9號（1919），頁162-163。"}, {"type": "note", "text": "42 外交部收上海書業商會呈，1919年5月9日，〈洋商矇請版權懇請據約駁拒〉，《外交部檔案》，03-43-014-02-001。"}, {"type": "note", "text": "收於《外交部檔案》，03-43-015-01-007。NA, 893.543M55/至893.543M55/7，則為全案交涉之經過。"}, {"type": "note", "text": "45〈大陸報字典案之辯護〉，見：周林、李明山主編，《中國版權史研究文獻》，頁200-202。"}, {"type": "note", "text": "43 商務印書館呈外交部，1923年10月24日，《洋商藉用商標陰圖保護版權籲懇嚴加防制以維教育而保商業》，《外交部檔案》，03-43-015-01-007。本卷宗收有商務印書館申辯狀、判決書及節略。有中英文各一式，譯文45頁，英文44頁。美籍陪審官給駐上海領事的報告見：N. F. Allman to American Consul General, Oct. 5, 1923, NA, 893.543M55/1。"}, {"type": "note", "text": "46 外交部收中華教育改進社函，1923年8月26日。〈上海會審公廨訊理韋氏字典關係全國文化請據約力爭〉，《外交部檔案》，03-43-015-01-003。"}, {"type": "note", "text": "44〈韋氏大學字典案被告申辯狀，附本案判決書〉1923年9月21日，頁43-45。"}, {"type": "note", "text": "47 外交部收江蘇交涉署電，〈美商控商務印書館預約出售韋氏字典一案業經會審公廨審理兩次據被告方面告及可期勝訴〉，1923年9月10日。《外交部檔案》，03-43-015-01-005。"}, {"type": "note", "text": "50 外交部收商務印書館張元濟函，1924年10月3日，〈關於敝館譯印美國米林公司韋氏大學字典一事備述與該公司交涉經過情形祈轉知農商部知照商標局查以保利權〉。《外交部檔案》，03-43-015-02-001。外交部收商務印書館張元濟函，1924年11月4日，〈美國米林公司以書名人名用作商標矇請註冊請依約駁斥〉。《外交部檔案》，03-43-015-02-006。"}, {"type": "note", "text": "51 據英美煙公司律師肯列退的說法，約1919年上海會審公廨有二案，一為寶威藥房（Burrough Mellcome & Co.）控告南洋大藥房仿冒商標案；二為白克公司（A. R. Burkill）控告新大號經售仿製肥皂案，均獲勝訴。〈中國商標版權之保護問題〉，《東方雜誌》，第16卷第9號（1919），頁163。"}, {"type": "note", "text": "48〈韋氏大學字典案被告申辯狀，附本案判決書〉1923年9月21日，頁14、44。收於《外交部檔案》，03-43-015-01-007。"}, {"type": "note", "text": "49 外交部收江蘇交涉員呈，〈美商所請保護用於書籍字典之韋勃斯脫等字商標恐礙我國譯印權利祈鑑核轉咨示遵由〉，1924年10月4日。《外交部檔案》，03-43-015-02-005。"}, {"type": "note", "text": "52 Ferdinand Mayer to Shen Jui-Lin, May 18, 1925.〈關於美商請發布告保護商標一事請按約轉知該機關注意頒發由〉，《外交部檔案》，03-43-015-02-014。"}, {"type": "note", "text": "53 外交部致美梅代使（邁爾），1925年5月25日，〈示禁宥用米林公司商標事歉難照辦〉，《外交部檔案》，03-43-015-02-015。"}, {"type": "note", "text": "pp. 1-21. 上海圖書館徐家匯藏書樓藏。"}, {"type": "note", "text": "56 博良（Robert T. Bryan, Jr.）1892年生於上海，為浸會大學（後改名為滬江大學）校長美籍傳教士萬應遠（Robert Thomas Bryan, 1855-1946）之子。1918-1941年間曾任上海執業律師、東吳大學法學院教授、上海工部局法律顧問等職。太平洋戰爭爆發後一度被日軍囚禁。1946年回到上海繼續執業，曾任美國駐華大使館及駐上海總領事館法律顧問，並參與《中美商約》的談判。此後又被中共指控為間諜而遭逮捕，直到1952年才被釋放返美。撰有：“A Revolution in Reverse, Some truth about Chinese Communism”, in American Bar Association Journal, Oct., 1953, Vol. 39, pp. 881-882. 參考：上海市檔案館編，《上海租界志》（上海：上海社會科學院出版社，2001年版），頁626。"}, {"type": "note", "text": "57 博良，〈美國商標、商標名稱、版權和專利在中國〉，收錄於：王健編，《西法東漸——外國人與中國法的近代變革》（北京：中國政法大學出版社，2001），頁259-267。"}, {"type": "note", "text": "54 1928年1月實業部在審查該批字樣商標後，亦認為仍難依美方之意照辦。實業部致外交部函，1928年1月9日，《美商請保護關於書籍字典之韋勃斯脫等字商標》，《外交部檔案》，03-43-015-02-016。"}, {"type": "note", "text": "55 Norwood F. Allman, Handbook on the Protection of Trademarks, Patents, Copyrights and Trade-Names in China (Shanghai: Kelly & Walsh Limited, 1924),"}, {"type": "note", "text": "58 博良，〈美國商標、商標名稱、版權和專利在中國〉，頁266-267。文末作者的結論是：「儘管中國二十年前在條約中允諾進行保護外國商標方面的足夠立法，但直到如今也沒有頒布讓外國滿意的法律。」但該文仍呼籲美國和外國商人向中國政府註冊，並詳細介紹了註冊的要件和程序。"}, {"type": "note", "text": "59 于寶軒編，《皇朝續艾文編》，卷73，學術五（上海官書局，光緒28[1902]）收錄有兩次會議的規章及附件。見：周林、李明山主編，《中國版權史研究文獻》，頁25-38。"}, {"type": "note", "text": "不食其報，蓋未有不廢。」"}, {"type": "note", "text": "於頁50。該書序言提到：「所謂Trademark商標、Patent專利、Copyright版權"}, {"type": "note", "text": "之律以成，關係於文明之進步者。獨以版權為最駁。其說者，謂風氣初開，"}, {"type": "note", "text": "著作未盛，若成一書必禁人翻印，則行之不遠。受其譯者少，不如無版權。"}, {"type": "note", "text": "61 管學大臣的批示中提到文明書局出版之《原富》諸書「橫絕譯林，只譯單詞皆同環寶矣」。允諾嗣後文明書局所出各書，由管學大學堂加蓋審定圖章，並嚴禁書商謀毀版權。〈廉部郎上管學大臣論版權事〉，周林、李明山主編，《中國版權史研究文獻》，頁45-46。"}, {"type": "note", "text": "之為愈也，不知著述之士，大抵窮愁發憤者多，積年累月，耗竭心力，得稿"}, {"type": "note", "text": "62 李明山主編，《中國近代版權史》，頁56。"}, {"type": "note", "text": "盈寸，持以問世，而射利之輩乃遽襲為己有，以分其錙銖之微。徒任其勞，"}, {"type": "note", "text": "63 林樂知，〈版權之關係〉，原載《萬國公報》，卷183。收於《中國版權史研究文獻》，頁81-82。"}, {"type": "note", "text": "64〈清政府保護版權布告之一〉，《中國版權史研究文獻》，頁48-49。"}, {"type": "note", "text": "67〈德國萬國保全文藝及美術權利公會·德駐華公使雷克司致慶親王弈劻照會〉，光緒34年3月初6日，中國第一歷史檔案編印，《晚清國際會議》，頁4364-4376。該項照會亦提到「凡未入會之委員可如前在巴黎集會之時，依然任便旁聽或條陳意見。」中國是否曾收到之前巴黎集會之邀請，因未有相關文件之佐證，不知詳情，但至少柏林會議中國確有收到是項邀請，並電派駐德使臣孫寶琦參加。另據筆者查閱《總理各國事務衙門》和《外務部檔案》，01-27-001-01-001，《各國賽會公會》亦未看到巴黎集會之相關文件。"}, {"type": "note", "text": "65〈清政府保護版權布告之二〉，《中國版權史研究文獻》，頁48-49。"}, {"type": "note", "text": "66〈美國聖路易斯萬國書籍會·為西曆十月在聖路易斯設萬國書籍會請員事〉光緒30年2月21日。〈為請會同駐美臣於館內遴派數員赴萬國書籍會事〉，光緒30年2月23日。中國第一歷史檔案館編，《晚清國際會議》（揚州市：廣陵書社，2008），頁2461-2464。"}, {"type": "note", "text": "68〈德國萬國保全文藝及美術權利公會·為駐貴國大使已於上月電復屆時派員赴柏林保全文藝及美術權利公會事〉，光緒34年8月23日，《晚清國際會議》，頁4395-4396。"}, {"type": "note", "text": "69 外交部收上海書業商會稟，1914年7月27日，《外國書商要求享有版權妨礙教育工商前途懇請駁拒由》，《外交部檔案》，03-43-013-04-001。"}, {"type": "note", "text": "70 外交部飭滬海道尹兼特派江蘇交涉員，1914年8月10日，《英美書商在上海設出版協會有無其事希查復由》，《外交部檔案》，03-43-013-04-004。"}, {"type": "note", "text": "71 外交部收江蘇特派員函，1914年9月9日，《查復報載英美書商在滬設萬國出版協會情形由》，《外交部檔案》，03-43-014-04-006。《字林西報》，July 4, 1914,《大陸報》（China Press），July 5, 1914。"}, {"type": "note", "text": "72 The International Publisher' Association Limited. 錄自外交部收江蘇特派員函，1914年3月9日，〈查復報載英美書商在滬設萬國出版協會情形由〉，附件英文及譯文。《外交部檔案》，03-43-014-04-006。"}, {"type": "note", "text": "74 North China Daily News, July 4, 1914.《外交部檔案》，03-43-014-04-006。"}, {"type": "note", "text": "73 上海萬國出版協會的成立、組織與宗旨，譯文錄自：外交部收江蘇特派員函，1914年3月9日，〈查復報載英美書商在滬設萬國出版協會情形由〉，此份文件含英文與譯文共有77頁之多。《外交部檔案》，03-43-014-04-006。"}, {"type": "note", "text": "75 外交部收教育部咨，1914年8月3日，《美國要求加入版權同盟事能否設法駁拒請查核見覆由》，《外交部檔案》，03-43-013-04-003。"}, {"type": "note", "text": "76 外交部收農商部咨，1914年8月5日，《咨詢名人書商要求在吾國享有著作權有無其事由》，《外交部檔案》，03-43-013-04-004。"}, {"type": "note", "text": "77 外交部咨教育部，外交部咨農商部，1914年10月15日，《英美書商在滬設萬國版權協會未准各使到部提議譯送西報暨該協會布告備核由》，《外交部檔案》，03-43-013-04-007、03-43-013-04-009。"}, {"type": "note", "text": "78 外交部收上海書業商會呈，1919年5月9日，《洋商矇請版權懇請據約駁拒》《外交部檔案》，03-43-014-02-001。"}, {"type": "note", "text": "79 端六（楊端六），〈國際版權同盟〉，《東方雜誌》，第17卷第24號（1920年"}, {"type": "note", "text": "12月25日），頁4-5。"}, {"type": "note", "text": "80 武堉幹，〈國際版權同盟與中國〉，《東方雜誌》，第18卷第5號（1921年3月10日），頁7-17。"}, {"type": "note", "text": "81 如本文所舉侵權案的多起被告商務印書館。成立於 1897 年的商務印書館，以一間小小的工作坊，逐步發展為民國初期中國首屈一指的出版和文化機構。在商務印書館早期的開展事業中，譯印西書和編寫各類教科書為其重要項目。關於商務印書館的較新研究，詳見：李家駒，《商務印書館與近代知識文化的傳播》（香港：中文大學，2007），頁 15-48。"}, {"type": "note", "text": "82 在清末《中美商約》訂立的第三個10年期滿，由駐法國公使顧維鈞首先提出修約建議。1934年1月外交部照會美國國務院提出修改商約之議，但雙方最後未能達成修約共識。有關1933年南京政府之修約，原始資料參見中國第二歷史檔案館編，《中華民國史檔案資料匯編》，第5輯，第1編，「財政金融」，頁78-85。"}]}, {"id": "ch3", "title": "第三章 · 民初江南造船所成功打造美國萬噸巨輪", "paras": [{"type": "title", "text": "第三章"}, {"type": "text", "text": "民初江南造船所 成功打造美國萬噸巨輪"}, {"type": "text", "text": "遠航洋海，恰如去家之兒，孤子無依。設無保護者，遙臨其後，必受人欺凌，任人愚弄。"}, {"type": "text", "text": "——〈神州航業談〉，1918"}, {"type": "text", "text": "形勢已轉變了，證明中國人已經有能力做到以前必須仰賴外人才做得到的事。由此寫下中國工業發展史的新篇章。"}, {"type": "text", "text": "——江南造船所副所長鄺國華，1918"}, {"type": "text", "text": "前言"}, {"type": "text", "text": "江南造船所成立於1865（清同治4年），由兩江總督曾國藩，江蘇巡撫李鴻章奏請於上海虹口創設機器製造局，並造船礮。1867年移高昌廟，營建新廠。但官辦船廠成效不彰，直到1905年改以局、塢分立（江南製造局和江南船塢），江南船塢經大力整頓後，情況開始轉變。1912年更名為江南造船所，歷年充實設備，各項造船輪機和工具機等設備已頗具規模，並建有動力廠、碼頭和船塢 $^{1}$ 。一戰爆發後，全球航運供不應求，中國民族輪船工業得以利用此一契機，成功開拓國際市場。"}, {"type": "text", "text": "19世紀末美國積極擴張海權，造船工業技術發達，但其國際貿易之商船仍仰賴英國。一次大戰爆發後，由於運送士兵和物資的急迫需求，使得各參戰國兵艦和輪船供不應求，造船業成為一種戰爭實業。大戰之初美國採取中立政策，適可得以全力發展海事和輪船工業，然而，美國太平洋岸的海運運輸卻發生船舶嚴重短缺現象。蒲嘉錫（Noel H. Pugach）稱1914-1916為美國輪船業的危機時刻 $^{2}$ 。儘管中國市場占美國整體對外貿易的比重不大，但美國政府必須解決太平洋航運的不足問題。面對日益重要的中美貿易和遠東市場，如果能與正在興起的中國輪船工業建立合作關係，無疑是最便捷的方式之一。"}, {"type": "text", "text": "從中國而言，由於大戰時期歐洲勢力在華的消退，中國從政府到民間都試圖向比較友善的美國接洽，藉由購船或其他技術合作方式，來發展中國的航運實業；在此一情況下，大戰期間中美曾有數次海運事業的交易與合作。本章論述一戰爆發之初中美在太平洋航運的合作機遇，論析「江南造船所」順利承造美國四艘巨輪案所牽涉的企業、技術合作與政府外交層次的運作，藉此回顧民國初年中美實業合作上一次罕見的成功案例及其意義。"}, {"type": "text", "text": "一、穿越太平洋的中美海運的合作機遇"}, {"type": "text", "text": "（一）大戰時期美國太平洋海運船舶的短缺"}, {"type": "text", "text": "1890年代著名的美國海權論者馬漢（Alfred Thayer Mahan）出版《海權對歷史的影響力》（The influence of Sea Power Upon History, 1890）和《海權對法蘭西革命與帝國的影響》二卷（1892）。海權中心論成為美國擴張主義的理論基礎之一，建立強大的海軍和商船隊則是控制海洋、海洋作戰和擴張商業以建立富強國家的必要條件。美西戰爭後，美國取得夏威夷、薩摩亞群島、菲律賓和加勒比海的海軍基地，使用海軍船艦在拉丁美洲扮演「國際員警」，以及1907年羅斯福派遣「白色大艦隊」（Great White Fleet）環遊世界的壯舉，在在重申海權的重要性。1890年，美國海軍的經費僅2,300萬美元，占聯邦總支出的6.9%，1914年便上升到13,900萬元，占聯邦政府總支出的19%。儘管美國海軍的規模遠比英國海軍小，無畏型戰艦數量也比德國少，但美國在1914年已堪稱世界第三大海軍強國 $^{3}$ 。"}, {"type": "text", "text": "1 王志毅，《中國近代造船史》（北京：海洋出版社，1986），頁80-86。據該書所記，江南製造局成立40年間，造船偏廢，在1905年以前僅造了8艘輪船、7隻小艇。一戰期間力求開拓商業航運市場。關於清末自強事業中江南製造局和造船廠的演變歷史及其與近代中國早期工業化的研究，研究成果專書或論文均相當豐富，本文不擬贅述。"}, {"type": "text", "text": "2 Noel H. Pugach, \"American Shipping Promoters and the Shipping Crisis of 1914-1916: The Pacific. & Eastern Steamship Company,\" The American Neptune, 35: 3 (1985), pp. 166-182."}, {"type": "text", "text": "然而，美國用於國際貿易的商船卻無法和其海軍建置規模相稱。美國自南北戰爭結束後，努力弭平內部分裂和大力建設連繫全國的公共工程，鐵路等大眾運輸事業欣欣向榮，但從事於海外貿易之船舶量並未有突破之進展。直到一次大戰之前，美國國際貿易的商船主要來自國外，其中英國占90%，美國自製商船主要航行本土、沿岸和鄰近國家 $^{4}$ 。"}, {"type": "text", "text": "1914年8月大戰全面爆發後，美國意識到美國的國際商船明顯不敷使用。8月18日美國國會制定了「緊急船舶登錄法」（Emergency Ship Registry Act），容許外國建造之輪船登錄為美國船。法案頒布後，截止1915年7月1日，共有148艘外國船登錄為美國船籍。同時，美國政府又於財政部（Treasury Department）下成立「戰時急難保險局」（War Risk Insurance Bureau）以保護商船一旦遭到地雷和潛艇攻擊的損失。然而，因戰時造船原物料價格昂貴，加以戰爭風險過大，美國造船企業仍躊躇不進，並未受到鼓舞。"}, {"type": "text", "text": "1915年5月7日英國客輪露西坦尼亞號（Lusitania）在愛爾蘭附近被德國潛艇擊沉，內載128名美國乘客。因此，威爾遜總統決定採取更強硬措施。1916年9月，美國公布「船舶法案」（Shipping Act），使美國政府得以租用、管理和監控所有從事於國內外貿易之船舶，並成立美國船政局（United States Shipping"}, {"type": "text", "text": "Board）在戰時及其後五年內由美國政府統籌一切船舶事宜 $^{5}$ 。為因應德國於1917年2月採行的無限制潛艇作戰，4月16日又於美國船政局組織下轄設立「急難船隊公司」（Emergency Fleet Corporation, EFC），主要目的為調度、維持和實施美國所有輪船與其國家防衛政策和國內外商業發展之協調配合 $^{6}$ 。"}, {"type": "text", "text": "一戰爆發之初，美國太平洋海運船舶嚴重短缺。1915年間航行於太平洋線的美籍船舶甚至幾乎停擺。原因之一是，既有之輪船因大西洋岸需求量暴增和運費價格較高，紛紛轉向大西洋運輸。例如：擁有13艘行駛太平洋的商船的「太平洋郵船公司」（The Pacific Mail Steamship Company），突然宣布放棄太平洋業務，賣出2艘給一家原和他競爭的日本著名船舶公司——東洋汽船會社（Toyo Kisen Kaisha），以及5艘賣給另一家美國公司——大西洋運輸公司（The Atlantic Transport Company）。同時，航運實業家勞勃·大來（Robert Dollar, 1844-1932，也譯作羅伯特·大來）因在加拿大設廠投資，為獲得更大的利潤乃將旗下多數船舶改為加拿大籍 $^{7}$ 。加以，1915年11月生效的La Follette Seamen's Act（又稱「水手權利法案」，由參議員羅伯特·拉福萊特〔Robert M."}, {"type": "text", "text": "5 James D. Ciment and Thaddeus Russell eds., The Home Front Encyclopedia: United States, Britain, and Canada in World Wars I and II, Vol. I, pp. 457-458."}, {"type": "text", "text": "6 http://en.wikipedia.org/wiki/United\\_States\\_Shipping\\_Board（2015年3月12日下載）。"}, {"type": "text", "text": "3 Paul Kennedy, The Rise and Fall of The Great Powers (London: Unwin Hyman Publishers Limited, 1988), p. 247."}, {"type": "text", "text": "4 James D. Ciment and Thaddeus Russell eds., The Home Front Encyclopedia: United States, Britain, and Canada in World Wars I and II, Vol. I (Santa Barbara, Calif.: ABC-CLIO, 2007), p. 458."}, {"type": "text", "text": "7 航運實業家勞勃·大來曾於1910-1911訪問中國，大力促進中美貿易。勞勃·大來的事業起於1893年購得美國太平洋岸一間鋸木工廠，後來他和兒子史丹利（Stanley Dollar）建立大來輪船公司（Dollar Steamship Company，或稱Dollar Line），經營貨櫃運輸生意。有關大來公司在中國的活動，詳見本書第七章。Robert Dollar, Memoirs of Robert Dollar (San Francisco: Privately published for the author by Schwabacher-Frey, 1918)."}, {"type": "text", "text": "La Follette] 提案），本意為提升和保障美國輪船船員和碼頭工人的福利法案，由於限制以廉價工資僱用中國水手，有中國水手之船無法駛入美岸之說，其結果增加了太平洋航運的成本。這些多重因素使得一戰爆發初期美國的太平洋航運奄奄不振 $^{8}$ 。"}, {"type": "text", "text": "對於從事中美貿易的美國商人而言，儘管美國最初為中立國家，大戰期間還受到協約國家的航運管制問題。而且，由於中美航運愈加仰賴英國和日本的商船，在戰時更是困難重重，乃成為惡性循環。理由有二：首先，英國實施「協約國敵國貿易法案」（Allied Enemies Trading Act，1915年12月23），限制並檢查與交戰敵國的航海貿易等措施。特別是英國要求在中國出口的貨品不得運往德奧敵國，因此要求從事中美貿易的美國公司出具證明檔。儘管這些美國公司的貨品係運送至美國本土，但仍被英國領事在證明文件上予以刁難，以致延誤交貨，甚至有些美國公司還被英國列為拒運的黑名單，以至於「中國美國商會」（American Chamber of Commerce of China，簡稱AmCham）希望美國政府能循外交途徑解決此事。其次，日本對本國國民有貨運費的優惠，相形之下美國在華公司的航運成本提高，出口業務受到波及9。上述一戰初期美國在太平洋航運的危機谷底，正醞釀著迫切改變現狀的動機理由及其新契機。"}, {"type": "text", "text": "（二）民初中國發展遠洋航運的動機"}, {"type": "text", "text": "在中國方面，不論民間或政府，在大戰期間都深刻感受到國內外航運的急迫需求：「交戰國商船既多應徵他去。無暇營業。中立國船亦多奔走於列
