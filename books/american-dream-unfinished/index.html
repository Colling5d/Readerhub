University, 1990), p. 96."}, {"type": "note", "text": "76 美國政府並通過此一外交協議等於承認甫成立的南京政府。1928年9月11日，國務院致電馬慕瑞：「你可聲明北京公使館已授權與南京政府在完全承認（full recognition）的基礎上發展正式關係。」詳見：吳翎君，《美國與中國政治》，頁198-199、245-247。"}, {"type": "note", "text": "77 \"Shanghai American and British Chambers Hold Annual Meetings,\" The China Weekly Review (1923-1950), Apr. 28, 1928."}, {"type": "note", "text": "處，但絕對不願對外借款受到各國「共同拘束」。陳嘉璈提到原本愛文和諾多瑪兩氏原本打算在第五屆大會正式會議有對華不利的政治演說，會場上正反意見各執一方，形勢緊張。後來進行討論會之前會長畢蘭諾先和他私下見面，表達對中國代表之尊重，將原設之中國問題委員會取消，婉謝愛文諾多瑪二氏之演說。"}, {"type": "note", "text": "78「國際商會第五屆大會中國代表團報告書」，〈國際商會暨參加美國世界博覽會籌委會規程〉，《國民政府》，國史館藏，數位典藏號：001-110020-00008-001。代表團主席張嘉璈陳述國民政府不願為行政經費與無計畫之借款，亦不願各國有共同拘束之財政援助，明白揭示中國開展中外合作之意願且獲得益"}, {"type": "note", "text": "79「國際商會關於中國之會議席上——美國代表團主席拉蒙脫氏之致辭」〈國際商會暨參加美國世界博覽會籌委會規程〉，《國民政府》，國史館藏，數位典藏號：001-110020-00008-001。"}, {"type": "note", "text": "82 胡紀常，《國際商會概論》（上海：商務印書館，1933），頁88-89。中國參與國際商會雖有政府為後盾兼具民間外交性質，財政部並補助中國全國商會聯合會及該會中國分會之出席費用，但中國民族企業最初並不熱中參與。「國際商會催繳中國分會會費暨出席1938年、1945年國際商會大會案」。中央研究院近代代史研究所檔案館，《經濟部檔案》，8-23-00-145。"}, {"type": "note", "text": "80 育幹，〈國際大會與中國〉，《東方雜誌》，第26卷第15號，頁6-9。另據《張公權先生年譜》（上），頁92。"}, {"type": "note", "text": "81 關於中國參與國際商會的詳細經過，可參見朱英，《中國商會走向國際舞台的新步幅——中國商會加入國際商會的歷程及影響》，《近代史學刊》，2001年第2期，頁6-16。本文不擬贅述。"}, {"type": "note", "text": "83 關於陳光甫的研究可參見：陳鴻明，《游走政商：陳光甫與國民黨政權（1927-1949）》，國立暨南國際大學歷史學研究所碩士論文，2015。郭秉文為哥大教育學博士，也是中國第一位教育學博士，著有《中國教育沿革史》一書。歸國後曾任南京高等師範學校（後改建為國立東南大學）教務長、校長，被稱為「東南大學之父」。1931年郭秉文出任國際貿易局局長，參與銀行金融界。紐約「華美協進社」（China Institute in America, 1926-）創辦人，一生提倡中美文化交流不遺餘力。"}, {"type": "note", "text": "84 “Trade-Council Got Start in 1934, Now Live Organization,” The China Press, Nov. 20, 1936. 到了 1936 年，委員改為 12 名，中美代表各 6 名。"}, {"type": "note", "text": "及專家談話會之召集；二、考察組：籌劃內地各處參觀之路程、沿途招待員嚮導及議員之委派、各地歡迎會談話會演說會之接洽；三、會序組：負責考察團在京滬時各種集會訪問參觀時間、讌會茶會遊園會、聘請招待人員和各項娛樂節目之籌備；四、宣傳組：集中發表考察團抵滬後之行動與言論、考察團往內地時記者之遣派、各演說會談話會速記員之遣派；五、事務組：臨時人員之聘請或僱用事項、銀錢出納及記帳事項、文書郵電之撰擬與收發事項、一切庶務事項。〈美國經濟考察團招待處組織大綱〉，天津市檔案館藏，《天津商會檔》，401206800-J128-2-003080-003。"}, {"type": "note", "text": "85 美國遠東經濟考察團，於 1935 年出版官方報告：Report of the American Economic Mission to the Far East: American Trade Prospects in the Orient (New York: National foreign trade council, 1935), pp. v-viii."}, {"type": "note", "text": "86 執行委員會設置各組如下：一、議事組，關於中美貿易問題之研究、中美貿易進展之提議、徵集國內對於該考察團之意見、中美經濟論文之撰寫、各界"}, {"type": "note", "text": "87 “American Economic Mission Arrives in Shanghai,” The China Weekly Review (1923-1950), Apr. 27, 1935, p. 295. “The American Asiatic Association and History,”福布斯曾於1909-1913年間任美國駐菲律賓總督、1930-32年間任美國駐日公使。"}, {"type": "note", "text": "88 “American Economic Mission Arrives in Shanghai,” The China Weekly Review (1923-1950), Apr. 27, 1935.《申報》，1935年4月24日，第3版。"}, {"type": "note", "text": "89 Report of the American Economic Mission to the Far East: American Trade Prospects in the Orient (New York: National foreign trade council, 1935). 關於日本的報告，在頁1-16；關於中國，頁17-60；關於菲律賓，頁61-69。"}, {"type": "note", "text": "90 1935年「遠東經濟訪問團」贊助名單如下（金額不詳）：American Chamber of Commerce of America, Inc., The Chase National Bank of New York, Chemical Construction Corporation, Colgate-Palmolive-Peet Company, Dibrell Brothers, Inc., Dollar Steamship Lines, G. Ellsworth Huggins, International General Electric Company, International Telephone & Telegraph Corporation, Millers National Federation, National City Bank of New York, Standard-Vacuum Oil Company, The"}, {"type": "note", "text": "Texas Company, United States Steel Products Company. 資料來源：Report of the American Economic Mission to the Far East: American Trade Prospects in the Orient, p. IV."}, {"type": "note", "text": "91 \"American Chamber Celebrates 21st Anniversary on Aug. 20,\" The China Press (1925-1938), May 23, 1936."}, {"type": "note", "text": "92 \"American Chamber of Commerce Meeting,\" The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Feb. 26, 1941."}, {"type": "note", "text": "93 司戴德6歲喪父，母親帶著他和姊姊到日本教人學英文，以維持生計；9歲時母親也因病去世。母親的美國好友將他帶回美國教養成人。筆者曾撰有司戴德專文，吳翎君，〈司戴德與清末民初中國〉，「辛亥革命暨南臨時政府成立國際學術討論會」，南京：南京大學，2011年10月16-17日。（未正式出版論文集） 94 Herbert David Croly, Willard Straight (New York: Macmillan Company, 1924), pp.168-170."}, {"type": "note", "text": "95 Herbert David Croly, Willard Straight, pp. 190, 195."}, {"type": "note", "text": "96 Herbert David Croly, Willard Straight, introduction, XI; XIII. 柯羅里所寫的傳記主要運用司戴德日記為文本，圖文並茂厚達569頁。彼德·巴克（Peter Buck）研究康乃爾大學中國留學生創建的「中國科學社」時，也特別強調司戴德牽繫起康乃爾大學最早一批中國留學生的貢獻。Peter Buck, American Science and Modern China, 1876-1936 (Cambridge: Cambridge University, 1980), pp.89-90."}, {"type": "note", "text": "97 Herbert David Croly, Willard Straight, \"introduction,\" XI."}, {"type": "note", "text": "98 該文主要選用司戴德的日記，並配有他親筆所繪的插圖和照片，內容止於1912年司戴德回到紐約。Asia: Journal of American Asiatic Association, 1920 Sep. to 1921 May，這9篇文章後來輯為專書出版，更名為：《司戴德在東方》（Willard Straight in Orient: with illustrations from his sketch-books, [New York: Asia Publishing Company, 1922]）。司戴德畢生文件收藏於康乃爾大學。"}, {"type": "note", "text": "John McCook Roots, “Chinese Head and Chinese Heart,” Asia: Journal of the American Asiatic Association, 1927, VOL XXVII, No. 2, Feb., 1927, pp. 91-97. Owen Lattimore, “The Chinese as a Dominant Race,” Asia: Journal of the American Asiatic Association, 1928, VOL XXVIII, No. 6, June, 1928, pp. 450-457. John Earl Baker,” Chinese Views of Truth and Justice,” Asia: Journal of the American Asiatic Association, 1928, VOL XXVIII, No. 7, July, 1928, pp. 532-539."}, {"type": "note", "text": "99 “The American Asiatic Association and History,” The American Asiatic Association, Printed for the Annual Meeting, Oct. 21, 1937, New York, 1937, pp. 28-29. 改版之初，該協會會員頗不知悉 “Asia” 與該組織的關連，編輯部於 1918 年 8 月 15 日起，又冠上 “Bulletin of the American Asiatic Association,” 的小字編號。"}, {"type": "note", "text": "102 Pearl S. Buck, “A Chinese Woman Speaks. A Story,” Asia: Journal of the American Asiatic Association, 1926, VOL XXVI, No. 4, April, 1926, pp. 304-310. Pearl S. Buck, “Chinese Woman Speaks.-II. A Story,” Asia: Journal of the American Asiatic Association, 1926, VOL XXVI, No. 5, May, 1926, pp. 413-419."}, {"type": "note", "text": "100 \"Some Of The Activities of the American Asiatic Association Since Its Organization,\" The American Asiatic Association, Printed for the Annual Meeting, Oct. 21, 1937, New York, 1937, p. 11."}, {"type": "note", "text": "103 \"The American Asiatic Association and History,\" The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 31."}, {"type": "note", "text": "101 Edward II. Hume, “Science and the Chinese Mind,” Asia: Journal of the American Asiatic Association, 1927, VOL XXVII, No. 7, July, 1927, pp. 562-567."}, {"type": "note", "text": "104 \"The American Asiatic Association and History,\" The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 32."}, {"type": "note", "text": "107 \"Some Of The Activities of the American Asiatic Association Since Its Organization,\" pp. 12-14."}, {"type": "note", "text": "108 “The American Asiatic Association and History,” The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 32."}, {"type": "note", "text": "105 “The American Asiatic Association and History,” The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 29."}, {"type": "note", "text": "106 \"The American Asiatic Association and History,\" The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 31."}, {"type": "note", "text": "109 Robert Karl Reischauer, “Japan’s Road To War,” Asia: Journal of the American Asiatic Association, 1937, VOL XXXVII, No. 2, February, 1937, pp. 80-82。賴世和（1910-1990）於1939年獲哈佛博士學位，並在哈佛任教。1961-1966年出任美國駐日大使。他與知名漢學家費正清在哈佛合開東亞文明課程，可說是美國研究東亞文明的奠基者，1973年創辦哈佛大學日本研究所。"}, {"type": "note", "text": "110 “The American Asiatic Association and History,” The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 18."}, {"type": "note", "text": "111 例如創始於1910年卡內基和平基金會（Carnegie Endowment for International Peace），在一戰以後會務迅速壯大。其他法治主義團體、國際主義和平團體、基督教團體等等，在一戰後更以倡導將美國的法治概念推廣到世界、戰爭非法化和世界和平等理想，並通過跨國活動來推行其主張。關於一戰以後美國本土非政府組織所倡議的跨國共同體理想和具體活動。詳見：王立新，《躊躇的帝國：美國崛起後的身分困惑與秩序追求，1913-1945》（北京：中國社會科學出版社，2015年），第6章，頁373-478。"}, {"type": "note", "text": "112 詳見：Karl Gerth, China Made: Consumer Culture and the Creation of the Nation, (Cambridge, Mass.: Harvard University, 2004). 中文版有：《製造中國：消費文化與民族國家的創建》（北京：北京大學出版社，2007）。"}]}, {"id": "ch6", "title": "第六章 · 在華技術組織的成立與演變", "paras": [{"type": "title", "text": "第六章"}, {"type": "text", "text": "在華技術組織的成立與演變 中美工程師協會"}, {"type": "text", "text": "以商立國者英國是也，以工程實業建國者美國是也……。美國賴以發達其天然之富有，工藝工程也。故工藝之巧，工程之精，各國中當推美國為第一。"}, {"type": "text", "text": "——朱庭祺（留美學生），1911"}, {"type": "text", "text": "前言"}, {"type": "text", "text": "1919年「中美工程師協會」於北京成立，為中美兩國工程師所組成的友好組織。創建之初受到中美兩國政府的支持，榮譽會員含括北京政府交通部官員和美國駐華公使，而其主要會員則投身於中國的公共工程建設，如鐵路、公路、水利、礦務和電報等，亦有少數大學教授參與，此一組織堪稱一次大戰後中美兩國工程師精英的跨國合作，並為1920年代以後的中國國家建設做出重要貢獻。該協會有出版英文刊物《中美工程師協會月刊》，完整保存於北京國家圖書館和美國密西根大學（University of Michigan），該協會最興盛的時間正是大戰結束，創立初的十年，顯現一戰後中美合作與帶領中國走向國際化的強烈願望，然而過去並未有人注意到「中美工程師協會」的重要性。這一批跨國工程師群體在中國邁向現代國家過程中扮演多元且重要角色，在國家公共工程、工業和經濟建設、人才培育、引介學科知識和中美關係等層面的活動網絡，過去鮮少為人所知。本章除利用該協會出版的官方期刊，並利用上海檔案館、大英博物館、麻省理工學院收藏之工程師文件等原始檔案和報紙期刊，釐清此一協會在華軌跡。"}, {"type": "text", "text": "外，新近有學者探討港際工程的技術個案或從工礦地質學科的引進探討近代工程學科的奠基，或是研究中國本土工程師組織。但是關於跨國工程師組織在中國的活動及其作用，則仍未有學者深入討論 $^{2}$ 。本章以中美工程師協會的發展為主軸，探討一次大戰後這群技術專家如何與中國政府合力推動中國工業化建設，引介工程知識和開創建設思路，並分析其對中美兩國和走向世界的聯結作用。"}, {"type": "text", "text": "關於近代中國工程建設的研究有愈來愈受到關注之勢，不少學者從國家治理、工程師專業化，以及技術專家對形塑現代國家的作用等視角提出有意義的見解，其中較具代表的當屬大衛·佩茲（David A. Pietz）所著關於17世紀中葉以後二百年來的黃河水利治理和民國時期淮河治理（1927-1937）的兩本學術專書 $^{1}$ 。此"}, {"type": "text", "text": "Nationalist China, 1927-1937 (New York and London: Routledge, 2002). David A. Pietz, The Yellow River: The Problem of Water in Modern China (Cambridge, Mass.: Harvard University Press, 2014). Pierre-Etienne Will, Bureaucracy and Famine in Eighteenth-Century China (Stanford, Calif.: Stanford University Press, 1990) and Nourish the People: The State Civilian Granary System in China, 1650-1850 (Ann Arbor: University of Michigan Center for Chinese Studies, 1991)."}, {"type": "text", "text": "2 Shellen Xiao Wu, Empires of Coal: Fueling China's Entry into the Modern World Order, 1860-1920 (Stanford, Calif.: Stanford University Press, 2015) 一書，考察19世紀以來近代地質學家以及採礦學和近代工程學科的建立。朱瑪瓏，〈「港際」工程：1875年來自日本的兩位荷蘭水利工程師對上海吳淞內沙的調查〉，《中央研究院近代史研究所集刊》，第90期（2015年12月），頁55-93。對「中國工程師學會」較新的研究有：房正，《近代工程師群體的民間領袖——中國工程師學會研究，1912-1950》（北京：經濟日報出版社，2014）。此外，Shirley Ye, “Business, Water, and the Global City: Germany, Europe, and China, 1820-1950,” Ph. D. thesis, Harvard University, 2013著重德國水利工程對近代中國的城市建設和經濟全球化的研究視角。筆者另有專文討論以英國工程師為主，1901年在上海創立的跨國工程師組織——「中華國際工程學會」（The Engineering Society of China）。參見：WU Lin-chun, “Foreign Engineers’ Activities in China and the Process of China’s Internationalization: the Case of ‘The Engineering Society of China’, 1901-1941,” María Dolores Elizalde & Wang Jianlang eds., Chinas Development from a Global Perspective (Newcastle: Cambridge Scholars Publishing, 2017), pp. 375-403."}, {"type": "text", "text": "1 David A. Pietz, Engineering the State: The Huai River and Reconstruction in"}, {"type": "text", "text": "一、創立宗旨與會務運作"}, {"type": "text", "text": "1914年8月歐洲大戰方酣之際，15日巴拿馬運河通航，當時美國尚未參戰，急欲向世界各國展示美國在科技和工藝上的優異領先地位。次年9月20-25日，第一屆國際工程大會（First International Engineering Congress）在舊金山由美國土木工程師學會（American Society of Civil Engineers）等機構盛大舉辦，這次會議以慶祝巴拿馬運河的通航象徵國際各國工程師的通力合作為號召，而事實上係向全球宣告美國工程界和國家團隊的勝利時刻 $^{3}$ 。從2月22至12月4日，美國以持續十個月之久的時間在舊金山舉辦巴拿馬太平洋萬國博覽會，希望藉由此一占地635英畝、匯聚各國工藝參展的賽會活動，向各國展示主辦城市舊金山自1906年大地震廢墟中重生的嶄新面貌，並且通過林立宏偉的現代化都會建築和先進工藝器械的展示，證明美國已是傲踞全球的工業科技強國 $^{4}$ 。當時中國實業界在農商部籌辦下組團參加，由陳琪出任巴拿馬賽會事務局局長，這次活動不僅為拓展中國對外貿易並與世界交流，也為增加中美之間商業網絡和技術交流的機遇 $^{5}$ 。而就在巴拿馬運河竣工之後，原擔任巴拿馬運河管理局（Panama"}, {"type": "text", "text": "Canal Board）的賽伯特上校（William Luther Sibert, 1860-1935）通過紅十字會的居中牽線，則是參與了整治中國大運河和導淮工程 $^{6}$ 。在此一脈絡之下，「中美工程師協會」的創建及其宗旨，可說是賦予美國政府一種引領中國走向美國所打造的工業技術帝國的想像和使命感。"}, {"type": "text", "text": "一次大戰後「中美工程師協會」的出現，除了體現中美兩國在知識文化上的合作意義之外，也顯現歸國留美學人對建立具有近代意義的知識社群之作用。如同任鴻雋於1916年「中國科學社」的致詞稱知識社群對於傳播近代西方科學方法的重要性：「譬如外國有好花，為吾國所未有。吾人欲享用此花，斷非一枝一葉搬運回國所能為力，必得其花之種子及其種植之法而後可。今留學生所學彼此不同，如不組織團體互相印證，則與一枝一葉運回國中無異；如此則科學精神，科學方法，均無移植之望，而吾人所希望之知識界革命，必成虛願」7。留美學生對實用知識和技術專業化的強調，樹立技術性的路數（A Technical Approach），建立專業化（professional specialization）的身分認同；並且認為學習實學是為了促進實業，「實業救國」是當時留美學生的流行語8。不少留美學人認為美國是應用科學技術致富的典型，中國土地形勢和物產豐饒又與美國最為相近，是故中國應以美國為模本：「以商立國者英國是也，以工程實業建國者美國是也……。美國賴以發達其天然之富有，工藝工程也。故工藝之巧，工程之精，各國中當推美國為第一」9。留美學生中具理工背景者，回國後也多成為「中美工程師學會」的骨幹成員（下詳），正如創建「中國科學社」的知識精英所持的理想抱負，成立於一次大戰之後的「中美工程師協會」，欲藉由學術性社團的推動，將理念轉化為行動，匯聚知識與實務，並且通過中美兩國政府層次上的合作意義，更加發揮此一具有近代意義的工程師社團對國家建設的力量。"}, {"type": "text", "text": "3 International Engineering Congress, Transactions of the International Engineering Congress, San Francisco, CA. Sep. 20-25, 1915."}, {"type": "text", "text": "6 關於美國巴拿馬運河工程師團隊及紅十字會參與中國導淮計畫，詳見：吳翎君，《美國大企業與近代中國的國際化》，第5章〈人道主義工程投資案〉，頁179-215。"}, {"type": "text", "text": "4 Sarah J. Moore, Empire on Display: San Francisco's Panama-Pacific International Exposition of 1915 (Norman, OK: University of Oklahoma Press, 2013)."}, {"type": "text", "text": "5 梁碧瑩，〈民初中國實業界赴美的一次經濟活動——中國與巴拿馬太平洋萬國博覽會〉，收入：顧雲深、石源華、金光耀主編，《鑑往知來：百年來中美經濟關係的回顧與前瞻》（上海：復旦大學出版社，1999），頁323-344。謝輝、林芳，《陳琪與近代中國博覽會事業》（北京：國家圖書館出版社，2009），頁132。"}, {"type": "text", "text": "7〈常年會紀事〉，為1916年「中國科學社」之社務會議記事，《科學》第3卷第1期（1917年1月），頁72。關於「中國科學社」的創建歷史，詳見：張劍，《賽先生在中國——中國科學社研究》（上海：上海科學技術版社，2018）。Peter Buck, American Science and Modern China, 1876-1936 (Cambridge: Cambridge University, 1980), Ch. 5, pp. 91-122."}, {"type": "text", "text": "8 葉維麗（Ye Weili）著，周子平譯，《為中國尋找現代之路——中國留學生在美國，1900-1927》（北京：北京大學出版社，2017年2版），頁56-67。"}, {"type": "text", "text": "「中美工程師協會」於1919年11月22日在北京成立，其宗旨有：一、促進工程學的知識與實務經驗；二、維繫工程師專業水準，培養同儕合作精神，樹立工程專業規範；三、為中國正開展的工程建設所遭遇的問題尋求可行之解決方案。次年（1920年）9月發行機關報《中美工程師協會月刊》，榮譽會長前內閣總理熊希齡於創刊序言強調留美學生對中國工程界的貢獻，以及美國工程師出任北京政府公共工程顧問及承擔各項工程要職，顯現中美友好之情誼。他提到「工程師」（engineer）與中國傳統「工匠」（artisan）有所不同，前者是伴隨著近代工業革命以後工程學的誕生所形成的一個知識創新與技術勞動的職業群體，略謂傳統工藝技術與現代科學的最大不同在於對知識方法論的整理和進步精準，中國缺乏近代工業革命後的工程專業技術人員，封閉的中國必須與世界接軌，而「中美工程師協會」的成立適逢第一次大戰重大國際衝突後的重建工作，中美兩國工程師的相互扶持和鼓勵，揭示了中國知識分子寄望戰後「新中國」黎明的到來 $^{10}$ 。"}, {"type": "text", "text": "1922年該會第三屆年會於上海召開時，正會長顏德慶（外交官顏惠慶之胞弟）因有事未能與會，由副會長楊豹靈主持並宣讀會長演說詞，演說詞中也特別強調華盛頓會議後中國可望有一新氣象，而工程師的責任可謂任重道遠：「華會現既閉幕，遠東將有一新氣象，中國即將達於健康與經濟發展時期，而工程學在其中，非僅有小部分也」。演說詞中陳述該會有三種必要之旨趣：一、工程學識及練習之精進；二、高尚之職業基礎之維持；三、合作與群誼精神之培養。楊豹靈和顏德慶為留美學人，楊於1911年返國從事水利工程，顏於1902年返國專擅鐵路工程，兩人的職業身分正是該協會最為熱中的項目 $^{11}$ 。"}, {"type": "text", "text": "就在一戰爆發之後，一批留學美國學習工程的青年學生，有感於工業化潮流的必然，而於1918年於美國東部組織「中國工程學會」。「中國工程學會」的主要成員為「中國科學社」骨幹，該社係1914年由康乃爾大學為主的一批留學生為發起人，首任會長為任鴻雋，而康乃爾大學正是庚款留美學生的大本營，各種知識社團相當蓬勃 $^{12}$ 。「中國工程學會」與「中國科學社」這兩個留美學生組織成員，回國後與「中美工程師協會」的關係密切。「中美工程師協會」在創刊之初便詳加介紹了清華大學校長金邦正——同時也是「中國科學社」發起人，於1920年9月接任清華校長的訊息和照片 $^{13}$ 。康乃爾大學的歸國學人在「中美工程師協會」始終居有重要地位，例如曾於土木工程系進修的孫多鈺於1923年任職交通部次長時即出任該「中美工程師協會」會長 $^{14}$ 、工程學博士鄭華於1936年出任該協會會長 $^{15}$ 、水利專家李書田1937年出任協會會長 $^{16}$ 。"}, {"type": "text", "text": "10 Hsiung his-ling, “Introduction,” Journal Association of Chinese and American Engineers (hereafter cited as JACAE), Vol. I, No. 1, Sep., 1920, pp. 1-3."}, {"type": "text", "text": "11《申報》，1922年4月5日，第3張。"}, {"type": "text", "text": "9 朱庭祺，〈美國留學界〉，留美學生會編，《庚戌年留美學生年報》（1911年6月）。頁11-12。"}, {"type": "text", "text": "12 胡光廌，《波逐六十年》（台北：新聞天地社，1976），頁163-164。據胡光廌所記，1918年8月，在美東的「中國工程學會」與「中國科學社」在康乃爾大學舉行聯合年會，因為一半以上的會員參加兩個學會。關於「中國科學社」的演變和歷史，詳見：張劍，《科學社團在近代中國的命運——以中國科學社為中心》（濟南：山東教育出版社，2005），頁1-14。"}, {"type": "text", "text": "一批早期留學美國學習工程的學生於1920年代陸續返華，成為中國現代化實業建設的先鋒，特別是因工程學背景相近，且可用英語溝通，有不少人加入「中美工程師協會」。就以1922年《中美工程師協會月刊》載有的名錄，康乃爾大學留學生就有孫多鈺、施肇祥和楊豹靈，另有曾於哥倫比亞大學深造的凌鴻勛和畢業於麻省理工學院胡光廌（Hu, Kuang-Piao, 1897-1993）等人 $^{17}$ 。1924年會員名錄有普渡大學（Purdue University）的程孝剛、理海大學（Lehigh University）的顏德慶、北俄亥俄大學（Ohio Northern University）的鄧益光等 $^{18}$ ；這些早期的中國工程界精英，他們和外籍工程師群體組織的關係及其建立的社會人脈網絡，不僅意含著跨國人才的流動、技術的擴張和中西文明的觸媒，亦對彼此的知識觀念和工程技術經驗帶來新的動力。"}, {"type": "text", "text": "「中美工程師協會」成立之初，會員約百人。創會後的慣例是現任交通部和現任美國公使為固定榮譽會員。1920年有榮譽會員7名，這7名榮譽會員中中國人4名，美國人3名：有前內閣總理熊希齡、駐華公使柯蘭、交通總長葉恭綽、美國廣益投資公司副總裁亨利（Philip W. Henry, 1864-1947）、大運河疏浚局副總裁兼全國水利局副總裁（署理總裁）潘復、美國著名河工專家費禮門（John R. Freeman, 1855-1932）、中國交通部鐵路技司司長沈琪（慕韓）。創刊號和第三期分別介紹了榮譽會員前內閣總理熊希齡和交通部長葉恭綽的經歷 $^{19}$ 。不久，著名的史蒂文生（John F. Stevens, 1853-1943）受邀擔任榮譽會員，他當時即是以建造美國大北鐵路（The Great Northern Railway）和擔任巴拿馬運河首席工程師（1905-1907年）而享譽國際工程界，協會還特別介紹了他的經歷 $^{20}$ 。1922年美籍榮譽會員增加為6名，除了新加入的史蒂文生，再加入著名河工專家溫德爾（John Alexander L. Waddell, 1854-1938, 一般縮寫J. A. L. Waddell），美國公使則更換為舒爾曼（Jacob Gould Schurman）；中國籍榮譽會員6名為：熊希齡、葉恭綽、潘復、沈琪、王景春（新任交通總長）和張謇，均具有鐵路交通工程之背景及任職交通部或財經部門之經歷。這些中美人士的榮譽會員延攬了美國駐華前後公使、中國鐵路和水利官員，以及美國最著名的工程界人士，此一黃金隊伍打響該組織的名號，1922年會員數激增為239名會員 $^{21}$ ，1924年再增加到270名會員 $^{22}$ 。在「中美工程師協會」創辦初期，在行政奧援上除了有北京政府交通部的大力支持，駐華時間不長的美國駐華公使柯蘭功不可沒。柯蘭於1920年3月到1921年7月初擔任駐華公使，抵華後對推動中國的經濟發展和工業建設不遺餘力，費禮門和陶德（Oliver J. Todd, 1880-1974，或譯作塔德）等重要河工專家均受他的大力支持而成就日後對中國水利工程的事功 $^{23}$ 。柯蘭、溫德爾和亨利等三位長期擔任該會的榮譽會員，據1938年會員名錄中這三人仍保有此一頭銜 $^{24}$ 。"}, {"type": "text", "text": "13 “The President of Tsing Hua College,” JACAE, Vol. I, No. 4, Dec., 1920, pp. 8-9. 14 “Hon. T. C. Sun” JACAE, Vol. IV, No. 8, Oct., 1923, 照片夾頁和說明，無頁碼。 15 鄭華於 1917 年取得康乃爾大學工程學博士學位後，曾在麻里蘭和賓州從事鐵路和橋梁工程，於 1919 年回國，進入交通部鐵路司承擔津浦鐵路和山海關橋梁等工事。“PhooHwa Cheng,” JACAE, Vol. XVII, No. 4, July-Aug., 1936。附照片。"}, {"type": "text", "text": "16 “Li ShuTien,” JACAE, Vol. XVIII, No. 3, May-June, 1937. 附照片。李書田係康乃爾大學工學博士，1927年返回中國後出任順直水利委員會祕書長、北洋大學教授。他於1928年後參與中國水利工程學會的成立並任副會長。曾任國立交通大學唐山土木工程學院院長、國立北洋工學院院長，建立了中國最早的水利專業和水利系。1938年榮任「中美工程師協會」會長。"}, {"type": "text", "text": "18 “List of Members of the Association,” JACAE, Vol. V, No. 1, Jan., 1924, pp. 4-15."}, {"type": "text", "text": "20 “John F. Stevens,” JACAE, Vol. I, No. 4, Dec., 1920, pp. 1-2."}, {"type": "text", "text": "17 “List of Members of the Association,” JACAE, Vol. III, No. 8, Sep., 1922, pp. 2-9."}, {"type": "text", "text": "19 “List of Members of the Association,” JACAE, Vol. I, No. 1, Sep., 1920, pp. 38-43. 鄺景揚（K. Y. Kwong）名字出現於頁38。第三期人物介紹是交通部長葉恭綽，見於JACAE, Nov., 1920, p. 1."}, {"type": "text", "text": "「中美工程師協會」採會員制，據會章分為榮譽會員（Honorary Members）、正會員（Members）和副會員（Associate"}, {"type": "text", "text": "Members）的階層制度，有資深領導新進人員的意味。正會員和副會員享有投票權，僅有正會員有資格擔任會務職務，任何正會員一旦成為榮譽會員得保留正會員的權益。正會員必須曾在美國的學院或大學研讀，並有五年的工程實務經驗；惟畢業自美國工程相關的學院或大學者可抵兩年實務經驗。副會員的規定則較寬鬆，只要從事工程實務即可入會。榮譽會員必須是在其專業領域或工程領域卓有成就者，人數不超過十位。該協會機關刊務雖保存完整，但並非每年都刊有會員名冊。從姓名研判華籍工程師人數從創刊開始人數始終勝於美籍工程師 $^{25}$ 。首屆協會會長為京綏鐵路總工程師鄺景揚（又名鄺孫謀，留美幼童出身），第一副會長為膠濟鐵路代理總工程師蘇利文（Murray Sullivan），第二副會長為直隸水利局的楊豹靈。首屆協會會務從會長、副會長、理事、各個委員會（財務、出版、活動）等職掌，均以任職於交通部成員的中美兩國工程師為核心（附錄：6-1），且幾乎由中美人士各司其半職務。從會務運作而言，係以中美合作為目的，並落實於會務職掌和活動。"}, {"type": "text", "text": "創立之初，參與年會大會需繳交註冊費10至15美元不等，參觀旅費自付 $^{26}$ 。協會董事會議每月第三星期開會一次，機關刊物年繳5美元，單本50分美元。1922-1927年間為該組織人數最多且維持在250人左右。1924年以後，「中美工程師協會」會員擴及不駐地會員（nonresident member / absent），到1930年非駐地正會員28人中（有一位來自東京，一位神戶，其他都居住在美國）。1930年後會員總數不如創刊初期，總人數快速下滑，到1931減到163名。1934年初設立終身會員，共有29名終身會員，終身會費為100美元 $^{27}$ 。為擴充該刊的影響力，1936年以後不僅有終身會員、不駐地會員，另增加附屬會員（Affiliate member）。1936年終身會員增加到38名，但並沒能重振該會之聲勢，總會員數降到139名 $^{28}$ 。受中日戰爭影響，1941年發行5-6雙月號後即未預警停刊 $^{29}$ 。該協會的全盛時期從創立到1930年代中期，之後開始式微，原因容後分析。（會員人數，見附錄6-2）"}, {"type": "text", "text": "21 “List of Members of the Association,” JACAE, Vol. III, No. 8, Sep., 1922, pp. 2-9."}, {"type": "text", "text": "22 “List of Members of the Association,” JACAE, Vol. V, No. 1, Jan., 1924, pp. 4-15. 1924年的榮譽會員為13名，其中12名延續自1922年，王景春雖卸下交通部長職務，但仍擔任榮譽會員，增加的這一名即現任交通部長，但因北京內閣更迭不斷，因此名錄中僅有交通部長頭銜而未出現名字。"}, {"type": "text", "text": "23 柯蘭具有廣泛的歐洲和中東遊歷經驗。在1915年前是名繼承家業柯蘭公司的成功商人，此後他辭去公司總裁投入自己感興趣的科學與教育事業，曾任麻省Woods Hole海洋生物實驗室（Marine Biological Laboratory at Woods Hole）主席，投入土耳其伊士坦丁堡女子教育，並有俄國遊歷經驗。獲威爾遜總統邀請擔任巴黎和會國際委員會中對土耳其問題的美國代表，此後才奉派擔任駐華公使。JACAE, Vol. I, No. 4, Dec., 1920, pp. 1-2."}, {"type": "text", "text": "25 “Association of Chinese and American Engineers, Constitution,” JACAE, Vol. III, No. 8, Sep., 1922, pp. 10-11. 早期會員名單均為英文姓名，許多華人名字只有簡稱或特殊拼音，較難以得知其正確中文名字。1931年後的會員名錄始有中英文姓名並列。"}, {"type": "text", "text": "24 “List of Members of the Association,” JACAE, Vol. XIX, No. 2, Mar.-Apr., 1938, pp. 95-102。溫德爾逝世於1938年。"}, {"type": "text", "text": "26 這份資料來自1922年4月在上海召開年會的財務報告。本次大會，上海會員註冊費為15元，上海以外的會員交10元註冊費。亦需支付參觀旅費和聚宴費。“The Financial Report of the Spring Convention,” JACAE, Vol. III, No. 4, Apr.-May, 1922, p. 6."}, {"type": "text", "text": "「中美工程師協會」會員亦有本書第四章提到的1920年代新式企業工廠興起後所聘用的商業工程師（為推動科學化管理，由廠長一工程師制，取代傳統企業的工頭制）或者任職於私人工廠的專家工程師，但如前所述，此一組織的會員主要以中國交通部聘用的中美兩國工程師會為主，民間企業的工程師並非此一組織中的核心會員。雖然一些服務於交通部的工程師也可能身兼他職或自營工程，但是會務職務的運作主要以交通部成員為骨幹。此外，據名冊所錄姓氏，該協會基本上是男性工程師，會員合影僅有1922年4月出現一位女士（見圖6-2前排中央），但應該不是會員。該年大會紀要並無特別提到這位女士的名字 $^{30}$ 。"}, {"type": "text", "text": "27 “Report of Council,” JACAE, Vol. XV, No. 4, July, 1934, pp. 3-4. 由王景春（C. Y. Wang）出任會長。"}, {"type": "text", "text": "28 “List of Members of the Association,” JACAE, Vol. XVII, No. 2, Mar.-Apr., 1936, pp. 104-111. 這38名終身會員中，從姓名研判華籍應有31名，較著名者如鄭華、程孝剛、胡光廌、金濤、李國普、李國鈞、李書田、王金職、凌鴻勛、孫家錄、顏德慶、楊豹靈等人都是較早入會的會員，一般會員如薛卓斌、薩福鈞、高大剛、施肇祥、徐世大、王正黻、王寵佑等人，也都是工程界的重要人物。"}, {"type": "text", "text": "29 北京國家圖書館所收最後一期為1940年發行11-12月號。密西根大學藏有1941年5-6月號，卷22，第3號。"}, {"type": "text", "text": "據《申報》所記出席1922年「中美工程師協會」大會的重量級會員名單如下："}, {"type": "text", "text": "表6-1，看出「中美工程師協會」的首要成員來自鐵道部和水利局，文中提到的工程師塔德，亦即著名水利專家和交通部顧問陶德（詳下）。當時陶德同時擔任美商亞洲建業公司總工程師，負責山東河務局和該公司簽訂的堵合宮家壩決口承包工程 $^{31}$ 。允元公司係同時在紐約和上海註冊，登記為美國公司，據胡光廌的說法，其中有一些從麻省理工學院和哈佛畢業的留學生任職該公司。由於當時租界內的工程，大都被洋行和洋人勢力所壟斷，中國人還沒有經營工程的公司，只有少數由洋行訓練出來的繪圖員能設計圖樣，但不為租界當局認可，亦不發給准建執照，允元公司是最早一批有中國人參加的工程公司 $^{32}$ 。高大綱後來在1930-32年擔任上海「中華國際工程學會」（The Engineering Society of China，詳下）委員會職務，可能是第一位在該學會有重要職務的華籍會員。高大綱曾加入這二個跨國工程師組織學會，也說明了分踞北京和上海的這兩個國際工程學會的互動關係 $^{33}$ 。"}, {"type": "text", "text": "為具體了解「中美工程師協會」的會務活動，茲以1922年會務蓬勃期為例說明之。本次年會官方發布日期為4月3日至4月7"}, {"type": "text", "text": "31 1921年7月，黃河在山東自境內利津、宮家壩等處決口，山東北部遭受重大水災。據山東省大事記，1922年11月22日，美商亞洲建業公司承包宮家壩堵合工程，費用為120萬銀元。1923年5月，堵口工程竣工。http://lishi.zhuixue.net/2016/1202/51185.html（下載日期2018年9月30日）。"}, {"type": "text", "text": "30 “The Shanghai Convention,” JACAE, Vol. III, No. 4, Apr.-May, 1922, pp. 1-3. 這次會議紀要並無特別提到照片中的女性。《申報》（1922年4月4-5日）詳述本次會議的經過，亦無提到這位女士的姓名。筆者雖試圖臆測這位女士可能是美國駐華機構（使領館、商務代辦的職員或夫人）或是活躍於上海美國人俱樂部的婦女，惟仍存疑。"}, {"type": "text", "text": "32 胡光廌，《波逐六十年》，頁219。允元公司創辦人為格萊因斯（Stanley E. Glines），據胡光廌的說法該公司有不少麻省理工學院和哈佛畢業的中國校友，主要業務為工程設計和進口機器物料。關於允元公司，筆者曾有文討論，詳見：吳翎君，《美國大企業與近代中國的國際化》，頁269、281-285。"}, {"type": "text", "text": "33 “Council for Session 1930-31,” “Council for Session 1931-32,” Engineering Society of China, report and proceeding, 1930-31, 1931-1932。高大綱係於1923年加入中華國際工程學會，當時他也是「中美工程師協會」會員。"}, {"type": "text", "text": "日（中文報章記為4月4日至4月8日），會議到場者有近五十人，開會之外，考察上海及鄰近之工廠，受到報章媒體關注，《申報》每日皆發文報導。該協會年會的參訪活動可謂精心布置，開幕宴報到後，先安排實務參訪，最後才是召開會員大會。4月4日在亞東旅館舉行開幕宴，在未開宴之前先往四川路青年會簽名報到。4日4-5日的參訪地點包括工廠、企業和上海工部局電氣廠等現代化設施、兩所重要大學（一為美國教會聖公會創辦的聖約翰大學，另一為理工科見長的交通大學），演講活動則是關乎中國重要城市口岸上海和廣州的基礎建設，以及工礦學科之專業演說。4月5日參訪的上海萬國檢驗所（Shanghai International Testing House），位於上海香港路10號，係中美絲商為改善輸美生絲品質而合作籌設，由美國紐約生絲檢驗所派員監督，引進現代檢驗設備和理念並訓練一批檢測技術人才，被譽為近代中國第一所完善的生絲檢驗機構 $^{34}$ 。溝渠整理試驗場則為關係交通設施和上海公共衛生的汗水處理工程。接著6日晚間十時乘輪赴南通，4月7日赴實業家張謇（張季直）及南通商會之宴，8日自南通抵上海召開大會。由參訪內容的安排，可見得中美工程師團體和新式資本家攜手關注中國現代化技術、提升生產質量、科學化管理和城市公共文明等理念，兩者之間關係緊密。他們和1920年代中國美國商會成員及關注的議題頗有相通之處，形成一種交織相映的關係網絡。（參見第五章）"}, {"type": "text", "text": "「中美工程師協會」創立之初獲得北京政府交通部的財政資助，由1925年11月公布的年度財務報表（1924年10月1日至1925年10月31日）顯現正會員年費收入1,046美元，副會員會費273美元，不駐地會費收入101.35美元，出售刊物所得僅22美元，而來自交通部支付的廣告刊登費用就高達2,000美元，為該會主要收入 $^{35}$ 。機關刊物《中美工程師協會月刊》最早為月刊，"}, {"type": "text", "text": "34 Lillian M. Li, China's Silk Trade, Traditional Industry in the Modern World, 1842-1937 (Cambridge, MA: Harvard University Press, 1981), p. 181. 上海萬國生絲檢驗所雖是中美絲商對生絲檢驗的國際合作範本，引入現代化檢驗設備和技術人才，但在創立之初，美國絲商團體和生絲出口洋行之間亦頗多攻訐。這一組織在1920年代後期中國民族主義昂揚，收回國權運動意識高張後，被視為對國民政府統一檢驗權的侵奪，關係著中國國體主權問題，直到1929年始由國民政府接收。詳見：宋時磊，〈檢權之爭：上海萬國生絲檢驗所始末〉，《中國經濟史研究》（北京），2017年第6期，頁115-126。"}, {"type": "text", "text": "35 “Financial Statement,” JACAE, Vol. VII, No. 1, Jan., 1926, p. 41."}, {"type": "text", "text": "1929年出刊時間略混亂，該年9月才發行第一號，10月至12月回復正常月刊，1932年以後改為雙月刊。該刊為英文發行，早期鮮少有華人學者提交專業學術論文，直到1930年代華人學者始踴躍發表專業論文。每年年會和研討會則有中美兩方的工程師熱烈加入討論，此外留美學人像梅貽琦、胡適、張維藩等人皆非會員，偶或參加該會活動，可見得該會年會亦為留美學生互相聯誼之聚會 $^{36}$ 。據1935-38年「中美工程師協會」的會員名冊，有來自中央和地方各省的工程師加入該學會，其會員分布於中國境內，甚至有來自雲南和福建的中國籍會員 $^{37}$ 。該會設有天津、青島、上海南京等地的通訊員，串聯起中國各地的工程師通報國內與國外最新的工程知識訊息。"}, {"type": "text", "text": "二、中美工程師群體的關係網"}, {"type": "text", "text": "「中美工程師協會」創立之初即和美國本土工程學會進行跨國聯結，不僅榮譽會員擔任美國各項工程學會要職，《中美工程師協會月刊》也常報導美國本土最具規模的「工程協會」（Association of Engineering Societies）訊息。該學會於1880年12月4日成立於芝加哥，於次年1月起發行刊物，最早由四個工程師團體發起成立，後加入各地工程師分會 $^{38}$ 。《中美工程師協會月刊》創刊第一年12月號，就有文章介紹美國「工程協會」的組織，也報導了「美國土木工程師學會」的歷史，不僅是和美國相關學會的聯繫，更有打開世界知識之窗的作用 $^{39}$ 。"}, {"type": "text", "text": "「中美工程師協會」的成員之間有聯誼合作關係，但也不免有衝突。民國初年擔任導淮和運河整治工程的全國水利局總裁兼導淮總裁的張謇，亦是「中美工程師協會」的榮譽會員。張謇對於導淮整治的專業意見與美國河工專家費禮門（兼協會榮譽會員）歧異頗大，但兩人主要是治水理念的不同，私人關係並未交惡。不似民國初年張謇曾和一位由紅十字會派遣的美籍水利工程師詹美森（Charles Davis Jameson, 1855-1927）有激烈摩擦，甚至暗指後者有道德品格上的惡習，不願與其合作 $^{40}$ 。姑不論張謇和費禮門兩人在工程方案之見解孰為高下，相對於張謇受人肯定，費禮門對治理中國水患的貢獻似為中美雙方所忽略。費禮門是「美國土木工程師學會」會員長達40年，曾榮任會長，鼓吹美國應成立國家級的水力實驗室（National Hydraulic Laboratory），發表過不少重要學術論文。1932年費禮門過世，美國國家科學院有專文表彰其對美國工程界及工程教育上的貢獻，在這篇16頁的文章中，提到費氏在中國的活動僅有6行，扼要陳述費禮門在1917-20年擔任改善大運河和整治黃淮水患的工程顧問，曾在1919年來華考察，並為中國選派一批工程師從事調查工作 $^{41}$ 。可見得中國工程的險峻和費氏對中國水利的重要貢獻也未必為美國國家科學院所熟知，原因之一是當時的中國對多數的美國科學院士而言不僅遙遠陌生，而且在白種人優越意識中不受到重視。儘管費禮門實際待在中國本土的考察時間不長，但他回美國後仍持續參與和關注中國水利和工程現代化問題，他和華洋義賑總會的陶德不斷通信，始終關注如何解決中國的水患問題。費禮門於1922年重新設計過的導淮工程圖，於1930年代為國民政府所選用 $^{42}$ 。"}, {"type": "text", "text": "36〈科學新聞〉，《科學》，第21卷第6期（1937），頁485-486。1937年4月19日在北平華語學校召開第17屆年會有：關祖章，金濤，唐化成，楊豹靈，王子文，丁寅及黃河水利會顧問英人塔德（即陶德O.J.Told）等三十餘人參加。共有四位會員宣讀論文，中美學人各占一半，為：金濤〈平綏鐵路修養執道述要〉、可克（W.E.Cooke）〈過灣風流之阻礙〉、王宛佑〈以種種方法採礦物水油〉和陶德〈工程師之地位〉討論熱烈。會後有參訪製皮廠、玻璃廠、觀崂山風景和遊頤和園等活動，晚間在歐美同學會聚餐。惟這份資料提到當時該會有永久會員73人，正會員33人，副會員34人。人數與筆者據該協會1937年名冊有所出入（見附錄6-2），應以筆者據協會正式名錄為核，而每人每年交會費5元，永久會費100元，則是相同。"}, {"type": "text", "text": "38 發起成立美國「工程協會」的四個團體為：Western Society of Engineers, Civil Engineers' Club of Cleveland, Engineers' Club of St. Louis, Boston Society of Civil Engineers，後擴及全國各地。北京國家圖書館藏有「工程協會」出版的多數官方期刊，收藏的第一本為1895，係由哈佛大學於1939年贈予北京國家圖書館。"}, {"type": "text", "text": "39 “Recent development in the Organization of the Engineering in the United States,” JACAE, Vol. I, No. 4, Dec., 1920, pp. 3-4. “American Society of Civil Engineers Meeting,” JACAE, Vol. VI, No. 10, Oct., 1925, pp. 83-87."}, {"type": "text", "text": "37 “List of Members of the Association,” JACAE, Vol. XIX, No. 2, Mar.-Apr., 1938, pp. 96-97. 林輯西（來自福建州協和建築部），彭炳祿（來自雲南府永固建築廠）。"}, {"type": "text", "text": "40 民國初年張謇在治理導淮工程期間，與美方技術人員頗多合作，亦有所衝突，其中和詹美森的嫌隙最大，不僅是治河方案的不同，亦牽涉張謇認為詹美森性情狡黠，有私德瑕疵。詳見：吳翎君，《美國大企業與近代中國的國"}, {"type": "text", "text": "《中美工程師協會月刊》在1933年1月刊出費禮門逝世專刊，熊希齡以書法題詞稱費氏在華功蹟如同古代大禹治水，遺愛永垂。陶德以及多位留美華籍會員楊豹靈、鄭泰、薛卓斌發表專文表彰費禮門在工程學上的創見和貢獻 $^{43}$ 。駐華公使柯蘭特撰「費禮門為中國做了什麼？」（What John R. Freeman did for China）表彰費氏對中國的貢獻。美國胡佛（Herbert Hoover）總統出席費氏出生地普羅維登斯（Providence）的工程學會稱頌費氏是「最頂尖的美國工程師和來自普羅維登斯最好的希望大使」（Theforemost of American Engineer and the finest ambassador of good will from Providence) $^{44}$ 。費禮門提攜的工程師陶德後來全力投入中國水利工程，被喻為「河流馴師」（River Tamer），他於1930年代長期擔任中美工程師協會祕書、財務長，亦曾出任會長，成為此一協會的靈魂人物 $^{45}$ 。"}, {"type": "text", "text": "際化》，頁202-205，本書不再贅述。"}, {"type": "text", "text": "41 Vannevar Bush, “Biographic Memoir of John Ripley Freeman, 1855-1932,” JACAE, Vol. XIV, No. 1, Jan., 1933, pp. 171-187. 關於費禮門在中國的活動，在頁177。"}, {"type": "text", "text": "42 另據，中國水利部，黃河委員會官網。http://www.yellowriver.gov.cn/hhyl/hhjs/mgsq/201108/t20110812\\_95205.htm（2018年5月19日下載）。也提到1929年德國漢諾佛大學教授方修斯（Otto Franzius, 1878-1936）曾任導淮委員會顧問工程師，並在他創辦的漢諾佛水工及土工試驗所作過兩次黃河試驗。1929年來華，在參與起草〈導淮計畫〉之餘還致力於黃河研究，返德後發表了〈黃河及其治理〉一文，認為「黃河之所以為患，在於洪水河床之過寬」，與美國費禮門的見解相近。"}, {"type": "text", "text": "43 熊希齡，〈費禮門先生像贊〉，刊於 JACAE, Vol. XIV, No. 1, Jan., 1933，夾頁照片，無頁碼。O. J. Todd, “In Memoriam,” JACAE, Jan., 1933, pp. 1-6. Yang Pao Ling, “Mr. John R. Freeman,” JACAE, Jan., 1933, pp. 7-8. Chen Tan, “Memories of John R. Freeman,” JACAE, Jan., 1933, pp. 9-12. Hsueh C. P., “A Source of Inspiration,” JACAE, Jan., 1933, pp. 13-14."}, {"type": "text", "text": "費禮門的文件收藏於麻省理工學院特藏圖書館，關於中國的文件共有六大盒數千張往來文件和各種水利工程圖表，以及各界人士向他詢問工程專業問題或推薦來華的工程師人選。費禮門本人對這些來往文件相當重視，甚至保留當事者的名片，一絲不苟的性格由此可見，更看出他對中國充滿激情的敦促善意。1919年他到中國考察時，由運河工程局外籍總工程師李伯來（Joseph Ripley）在天津利順德飯店擔任東道主的宴客名單中，有總理運河總督辦熊希齡（前國務總理）、直隸省長曹健亭、美國駐華使領館員、美商公司經理人、北洋大學工礦相關領域學者和中外記者等社會名流，名單中還赫然出現了正在中國講學的美國著名學者杜威（John Dewey），宴客之前由費氏先發表如何控制中國黃淮水患的演說，提到三年前他初訪中國（時為芮恩施公使任內），就感覺到中國必須培養中國本土工程師之必要，文中稱「中國工程上之事，亟有待中國少年工程師整理者，實重且大」 $^{46}$ 。費禮門在1920年返美後給熊希齡的私人文件中，熱情邀約即將訪美的熊希齡若能偕同張謇來美尤佳，他很樂意擔任兩人的嚮導，帶他們參訪舊金山各地工廠及各地築堤之機器，更主動提出俄亥俄州邁阿密（Miami）水利總工程師亦是他的好友，他可以安排他們參訪該處的防洪工程 $^{47}$ 。在這批文件中令人驚奇的是厚生紗廠創辦人，也是第一位翻譯美國人泰勒《科學管理法》的穆藕初（本書第四章），曾在1920年寫信給費禮門（時任普羅維登斯公司火險公司）詢問可否提供他有關工廠保險（factory insurance）之類的指導手冊，費氏的回信中首先客氣地說很遺憾在他1920年1月離開上海之前兩人未能碰面，但他很希望有機會去參觀厚生紗廠，並能盡其多年實務經驗提出對工廠管理的建言。費禮門說他沒有具體針對工廠火險管理的一份手冊，但他提供了好幾頁摘自火險管理實務的手冊內容，頁內並有重點畫線加記。在這封回信的複本中，費氏還夾有張穆藕初（湘玥）的名片。（如圖6-5）由此件小事可知，費禮門個人在中國的活動網絡不僅限於工程界，還包括政商名流，如張謇和穆藕初等人。"}, {"type": "text", "text": "44 Charles R. Crane, “What John R. Freeman did for China,” JACAE, Vol. XIV, No. 1, Jan., 1933, pp. 18-20. “John R. Freeman, World Famous Engineer-praise by Hoover,” JACAE, Jan., 1933, p. 21，原刊於 Providence Journal, Oct. 7, 1932."}, {"type": "text", "text": "45 陶德在1923年獲聘為「華洋義賑救災總會」（China International Famine Relief Commission）首任總工師，負責規劃大型工程與賑災計畫，直到1935年才光榮下台。George Gorman, “Major O. J. Todd,” in O. J. Todd, Two Decades in China (Peking: The Association of Chinese and American Engineers, 1938), pp. 1-6."}, {"type": "text", "text": "46〈民國8年李伯來君在天津利德飯店恭讌費禮門君來賓名次〉。MIT Library, Institute Archives & Special Collections. J. R. Freeman papers, MC 51, Box127, F. 104."}, {"type": "text", "text": "47 \"Freeman to Hsiung Hsi Ling, July 20, 1920,\" MIT Library, Institute Archives & Special Collections. J. R. Freeman papers, MC 51, Box128, F.131."}, {"type": "text", "text": "清末民初外人在華工程師團體，尚有1901年1月由英國工程師毛里遜（Gabriel James Morrison, 1840-1905）所倡議成立於上海的「中華國際工程學會」（當時只有英文名稱The Shanghai Society of Engineers & Architect），這是在中國本土最早成立的工程師協會。毛里遜並擔任首任學會會長，初始會員有85人 $^{48}$ 。該學會創立之際正是維多利亞女王（1819-1901）時代結束，這是歷經二次工業革命之後的大英帝國在海外進行擴張的巔峰年代，同時另一對照則是「辛丑和約」後的中國，外人取得在華開發和開礦的更多權利。在歷經義和團事件外人飽受驚嚇之餘，此一外人在華協會的成立，也揭示當時中國初萌芽的現代化工程對外籍工程師的吸引力。上海租界的特殊背景，使得這一國際工程師群體在創建之初抱持將上海打造成為一個「摩登上海」的現代化城市，使其向中國其他口岸展示西方先進工程的櫥窗及示範作用，並很早就注意到培育中國本土技職工人以維持現代化城市的施工品質。「中華國際工程學會」的歷屆會長多任職於上海工部局或中國海關，以及從事上海水利工程、煤氣公司、滬寧鐵路、黃浦江疏浚局和上海電話公司等等公共工程。這一組織在1901年創建之初即發行機關報刊，刊物名稱在1940年後略有變更 $^{49}$ 。"}, {"type": "text", "text": "48 The North China Herald, Jan. 23, 1901。毛里遜為1876年由英商集資建築上海吳淞鐵路時的總工程師。該鐵路通行未及半年，因火車壓死一個行人，激起附近中國居民的反對。幾經交涉後由清政府出資將這條鐵路收買，最後將鐵路拆除。毛氏於1902年退休返英，1905年病逝英國。“The Late Mr. G. J. Morrison-Engineers’ and Architects’ Tribute,” The North China Herald, Feb. 17, 1905。"}, {"type": "text", "text": "49「中華國際工程學會」創建之初，即發行機關報刊。最初名稱為：Engineering Society of China, Report and Proceeding, 1901-1939，保存於上海市徐家匯藏書樓和大英博物館。1939年10月起改名為Journal of Engineering Society of China，目前查到的最後一冊為May, 1941, Vol. II, No. 1. 藏於大英博物館。"}, {"type": "text", "text": "事實上，「中華國際工程學會」自創建以後並未取有中文名稱，直到1939年更名為“Engineering Society of China”，始同時有中文命名——中華國際工程學會 $^{50}$ 。中文報刊在其未有中文命名之前則多稱之為「上海工程會」 $^{51}$ 。上海租界的新式建築和現代化等公共設施成長快速，使上海成為各國工程師精英匯聚之處，該組織順勢成長。1916年該學會會員已逾200人，會員擴大到歐美、日本和中國等國籍。1920年會員有254人，1924年成長到276人。在排外風潮激烈時期的1924-1928年間，會員人數仍有三百人之譜。1937年日軍攻陷上海，但對會務影響不大，會員約有347人，1939年會員中甚至有埃及人國籍。到了1940年會員達415人，太平洋戰爭前夕有456人 $^{52}$ 。"}, {"type": "text", "text": "「中華國際工程學會」的第一位華籍會員是詹天佑，他於1905年加入該會，拓展了他與世界各國工程師接觸的機會，此一起點也成為詹天佑日後建立中國本土的工程師協會——「中華工程師學會」（1913）的參考藍本。有「中國鐵路之父」、「中國近代工程之父」的詹天佑，是中國首批留美幼童之一，畢業自耶魯大學土木工程學系，過去對他的研究中並未有人提到詹天佑曾是上海「中華國際工程學會」的第一位華人會員 $^{53}$ ，他成為會員之際（1905）正值擔任京張鐵路會辦兼總工程師。京張鐵路全長220公里，須穿越長城內外的燕山山脈，爆破、興築隧道和橋梁工程，面臨很大的工程挑戰；該線在資金和工程涉及各國在華競爭鐵路事業的複雜問題，當時直隸總督袁世凱決定全由中國人自辦。後來京張鐵路的完工被喻為成功打下中國人自行修建鐵路的開端，1907年京張鐵路八達嶺山洞和居庸關山洞相繼打通後，二名外國工程師考察該工程，對詹天佑至表佩服 $^{54}$ 。詹天佑加入上海國際工程學會的學習和跨國交往說明了詹天佑時時觀摩西方先進工程技術的進展，而工程實務和理論的相互發明，也促使他後來創辦中國本土工程師學會的想法。"}, {"type": "text", "text": "詹天佑病逝於1919年4月「中美工程師學會」創建前夕，當然無緣加入該工程組織，但詹天佑曾加入中華國際工程師學會及其與外國工程師群體的聯繫合作，顯然長期以來被人忽略了。詹天佑過世後，留美的沈琪（慕韓）扛起交通部鐵路技術委員會的重要職務，同時擔任起「中美工程師協會」的榮譽顧問，1921年初「中美工程師協會」期刊詳細介紹了榮譽顧問沈慕韓的各項經"}, {"type": "text", "text": "50 最初名稱為 “The Shanghai Society of Engineers & Architect”。到了1912年，有鑑於近代工程學愈趨於專業和精細化，建築師們決定另組學會以和工程師專業區隔，該協會於1912年改為 The Engineering Society of Shanghai，當時並未取有中文名稱。Presidential address by N. W. B. Clarke, Journal of the Engineering Society of China, 1940-41, pp. 1-2, 9-13. 倫敦大英圖書館藏。"}, {"type": "text", "text": "51 鄭保三，〈外國工師論我國工程學生之教練法〉，《教育與職業》，第12期（1919年12月），頁1。"}, {"type": "text", "text": "52 “Note of History of the Society,” Journal of the Engineering Society of China, 1940-1941, pp. 15-50. 關於上海「中華工程師學會」的歷史，詳見：WU Linchun, “Foreign Engineers’ Activities in China and the Process of China’s Internationalization: the Case of ‘The Engineering Society of China’, 1901-1941,” pp. 375-403. 吳翎君，〈打造摩登城市與中國的國際化——「中華國際工程學會」在上海，1901-1941〉。收入：蘇智良、蔣杰主編，《從荒野蘆灘到東方巴黎——法租界與近代上海》（上海：上海社會科學院出版社，2018年12月），頁187-204。"}, {"type": "text", "text": "53 筆者據下述資料所發現。“Note of History of the Society,” Journal of the Engineering Society of China, 1940-1941, p. 20."}, {"type": "text", "text": "54 詳見茅家琦、高宗魯，《詹天佑傳》（南京：江蘇古籍出版社，1987），詹天佑於耶魯大學的學士論文是〈碼頭起重機的研究〉（Review of Large wharf Crane），頁16、104。"}, {"type": "text", "text": "歷55。"}, {"type": "text", "text": "「中美工程師協會」的舵手陶德曾撰述〈中國的現代公路〉（Modern Highway in China）一文，道破外籍工程師在中國奮鬥中的種種艱難處境。其一，作為外國工程師在中國所面臨的困境是以現代科技投入的這個領域在中國並無前例可循，這是一個全新的領域，並無同道前輩可分享其經驗。此外，這個新領域阻礙年輕工程師在中國的發展，特別是建造公路，因為社會大眾對於公路的開拓並無明顯感受到好處，例如多數農民認為公路的開通是搶了農民耕作的良田，而讓商人和官員受益。他同時抱怨中國不誠實的地方官員在工程設施上的收受回扣，而外國工程師實在不擅於此道 $^{56}$ 。比較張謇和費禮門、詹天佑和陶德的事蹟，可以發現外籍工程師對中國的貢獻長期以來被中國民族主義所譽揚的「愛國工程師」勞苦功高的事蹟所淹沒，乃至於跨國工程師群間的合作，在歷史集體記憶的傳遞中被有意或無意地忽略了。"}, {"type": "text", "text": "在北京的中美工程師協會係以中美兩國在北京政府交通部服務的工程專家為主要會員（兼有少數商業工程師），而在上海由英人創立的「中華國際工程學會」其組織和歷屆會長則是以洋人為主導的工程師群體，僅有少數華人。兩個組織均以促進中國的工程近代化和提升工程師的專業能力為宗旨，在中國分踞南北，並都發行具有學術性質的刊物。這兩個組織深有聯繫，彼此轉載文章或交換圖書或聯誼活動 $^{57}$ ，上海聖約翰大學校長伊利（John A."}, {"type": "text", "text": "Ely）甚且擔任「中華國際工程學會」會長（1933-1936）和「中美工程師協會」會長（1938-1940） $^{58}$ 。"}, {"type": "text", "text": "前述1918年由美東工程界留學生所籌組的「中國工程學會」與詹天佑創立的「中華工程師學會」（1913年創立），此兩會於1931年於南京舉行合併聯合年會，通過合併案更名為「中國工程師學會」 $^{59}$ 1930年代在中國本土的華人工程師群體的合流與成功重整，使得以華人工程師認同的工程師團體聲勢蒸蒸日上 $^{60}$ 。並且，南京政府統一之後通過國家力量的操作，將各種工程技術專業人員有效地吸納到政府體制之中，尤其是以關乎國家基礎建設的鐵路工程與水利工程最為明顯，使得中國本土工程師群體的陣容和自我認同感愈來愈堅固。華北水利委員會往往同時邀請尚未合併的兩個中國本土工程師學會和「中美工程師協會」共同出席討論水利工程之新學理與經驗，以促進水利建設之實施，但獨缺上海「中華國際工程學會」，也可見中美工程師協會與中央政府的特殊友好關係 $^{61}$ 。"}, {"type": "text", "text": "55 “Mr. M. H. Shen,” JACAE, Vol. II, No. 1, Jan., 1921, pp. 1-2."}, {"type": "text", "text": "該年會發表，於1928年1月被《中美工程師協會月刊》轉載，JACAE, Vol. IX, No. 1, Jan., 1928, pp. 20-23."}, {"type": "text", "text": "58 “John. A. Ely,” JACAE, 1938, Vol. XIX, No. 3, May-June, p. 137."}, {"type": "text", "text": "59 吳承洛，〈三十年來中國之工程師學會〉，收於周開慶主編，《三十年來之中國工程》，下冊（台北：華文書局，1969），頁9-13。"}, {"type": "text", "text": "60「中國工程師學會」在1931年的普通會員有2,169人，1936年有3,069人，1940年有3,290人（另加上26個團體會員）。房正，《近代工程師群體的民間領袖——中國工程師學會研究，1912-1950》，〈中國工程師學會會員人數統計表，1931-1949〉，頁61。"}, {"type": "text", "text": "56 此文最初發表於 1926 年 9 月號出版的《中美工程師協會月刊》（Journal Association of Chinese and American Engineers），後收錄於：O. J. Todd, Two Decades in China, pp. 218-222。內文所引見：頁 219。"}, {"type": "text", "text": "57 例如：中華工程師學會的文章 “Engineering and Economic” 為 Dr. H. Charley 於"}, {"type": "text", "text": "61〈公牘·函中國工程學會、中華工程師學會、中美工程師協會，請分函貴會水利專家出席華北水利討論會由〉，《華北水利會月刊》，第3卷第2期（1930），頁54。"}, {"type": "text", "text": "由以上分析，我們可以看出中國本土工程師團體和「中美工程師協會」之間形成一個微妙的關係網絡，並且有著技術合作和政治權力的關係，亦和上海英人創立的「中華國際工程學會」南北相映。中國第一代工程師如詹天佑等人最早受益於上海的「中華國際工程會」，許多歸國留美學人也在北京「中美工程師協會」中逐步成熟，但在1930年代中國本土工程師團體逐漸壯大，並形成一股工程界的「本土化」（internalization）風潮（詳下）。此一過程對雄踞南北的兩個工程師協會造成了不同的影響，在北京的「中美工程師協會」會務和聲勢逐漸沒落；然而，以上海為主要根據地且吸納不同國籍的「中華國際工程學會」的會務並不受影響。甚且在1937年以後，上海淪陷，日軍尚未占領公共租界中、西區和法租界時，大量人力和資本進入而形成一度畸形繁榮的「上海孤島」時期，「中華國際工程學會」的會務仍穩定成長。上海租界的特殊地位使得「中華國際工程學會」得以運用其國際化（internationalization）因素持續發揮影響力。其後隨著太平洋戰爭的爆發，「中美工程師協會」和「中華國際工程學會」的會務都不得不被迫中止 $^{62}$ 。"}, {"type": "text", "text": "三、聯結中國與國際工程知識的橋梁"}, {"type": "text", "text": "早在一戰之後，中國本土的知識界報刊已留心轉載外籍工程師對中國如何培育工程師人才的文章，例如《東方雜誌》於1918年連續二期刊有法國工程師賴福萊（英文不詳）應震旦學院之邀，介紹世界各國之中學教育和高等專門學校如何培育工程師養成法 $^{63}$ 。1919年12月號的《教育與職業》雜誌，則以十頁篇幅譯介任職於滬寧和滬杭甬鐵路的總工程師克禮雅（A. C. Clear）及其助手顧烈斐（D. P. Griffith）合力發表的〈中國工程學生之教練〉一文，指出中國學生最大缺點即不能應用其由書本得來之知識於實際，又有多數學生其本質不合置身工程而學校不加阻止，一經任事則失敗隨之。「外國工程師多出世家，幼年時代觸目皆工事，常眩迷於機械事物，其遊戲品為引擎或火車或雛形機械……中國學生泰半來自詩禮之家，藐視戶外工作而不屑。顏色淡白，指爪纖長，可見其少受日光未會作手工也」。又提到中國學校教育制度專重記憶，而工程學必須著重數學思考，理論與實驗並進 $^{64}$ 。《中美工程師協會月刊》除簡要報導會務會訊之外，亦非常重視中國工程教育和人才培育等等議題，該學會討論的議題從工程學基本原理、工程實務經驗，延伸到中國工程界應用技術的標準化（standardization）和產品規格化（specification）、在中國技術專利的保護和推廣，均為該組織所深切關懷。近代中國高等教育中的工程學專業學科的奠基和工程師人才之培育並非本文之目的，本節偏重此一協會所扮演的聯結中國本土與國際工程知識的橋梁。"}, {"type": "text", "text": "62「中華國際工程學會」會員在1935年有250人，1936年更打破300人之譜。為因應孤島時期快速興建的城市大樓和公共設施，此一組織大力倡導學徒制，通過和上海工部局的合作認證，以培育合格工程人才來保證上海公共租界的專業施工品質。詳見：吳翎君，〈打造摩登城市與中國的國際化——「中華國際工程學會」在上海，1901-1941〉，頁187-204。"}, {"type": "text", "text": "63 法國工程師賴福萊，〈工程師養成法〉，《東方雜誌》，第15卷第7號，頁99-105；第15卷第8號，頁115-118。"}, {"type": "text", "text": "64 A. C. Clear and D. P. Griffith, “Chinese students in Engineering, Education and Training,” Engineering Society of China, report and proceeding, 1916-1917. pp. 254-255. 1917-1918, p. 240。原文係發表於上海「中華國際工程學會」。鄭保三，〈外國工師論我國工程學生之教練法〉，《教育與職業》，第12期（1919年12月），頁1-10。"}, {"type": "text", "text": "（一）倡議工業標準化"}, {"type": "text", "text": "「標準化」為歐洲第二波工業革命以後的產物，奠基於標準化零件可相互轉換的便利性，使得近代工廠得以操作大量生產方式。19世紀末工業競爭愈為劇烈，獲利邊際越來越難，企業主乃採取更有效率的科學管理，使物資、勞力和機械三者作最有效的利用。標準化和科學化管理的結合，更進一步推動了近代工廠的「生產裝配線」運作，在歐美等先進國家開啟了工業化時代的新紀元。尤其是美國科學管理之父泰勒倡議科學管理法以提高有效的工作方法和生產效率，施行標準化原理（例如工具標準化、操作標準化、勞動動作標準化等理念），並且使勞資雙方在科學化管理中共同受惠的主張，在歐美國家大受歡迎。學者普遍認為1880年代以前，美國為工業技術革新所做的貢獻不大，但在企業和工廠管理方面，美國卻是真正的先行者。大批生產標準化的商品物件，這些具有互換性的零件，隨時可進行簡單組裝，成就了「美國製造體系」的世代。美國聯邦政府首先將這種體系應用到兵工企業的生產，後來又廣泛運用到整個美國製造業，最終傳播到全世界的製造行業 $^{65}$ 。1920年擔任商務部部長（Secretary of Commerce）的胡佛（1929年出任美國總統），因出身自工程企業家及其對工業化時代的深刻體認，在擔任部長任內更是指揮商務部轄下的「國家標準局」（The National Bureau of Standards）大力"}, {"type": "text", "text": "推動工業標準化 $^{66}$ 。"}, {"type": "text", "text": "「中美工程師協會」的會員——不論是一戰以後陸續歸國的留美學生或美籍工程師，都是見證美國推動工業標準化風潮並帶動美國工商製造業而有所感知的一批專業人士。而留美企業家穆藕初則是最早將泰勒“The Principles of Scientific Management”一書譯為《學理的管理法》，並引進中國的第一人（參見本書第四章）。工業標準化和科學化管理，這兩件關乎近代中國工程和新式企業的革新，莫不與工程師群體和商人團體的引進息息相關。"}, {"type": "text", "text": "工業標準化在中國的實施，最早係由一批外籍工程師在上海租界首倡電力標準化為始，然後逐漸擴展到鐵路等其他事業。1914年1月，在兩位工程師威廉斯（R. A. Williams）和古柏（J.S.S. Cooper）的力促下，上海「中華國際工程學會」首次成立「電力標準化委員會」。此一委員會自許能在中國有所作為：「這是電力工程的歷史時刻，如果委員會可以成功推動此事，不僅只是對中國造成影響，更是走在歐美國家之前，無庸置疑標準化將是世界的趨勢」 $^{67}$ 。後來由於第一次世界大戰爆發，1917年中國參戰且加入協約國（Allies）方面，位於上海租界的「中華國際工程學會」乃英國人所創，以英人為首的協約國家會員便以此一理由要求敵對的國家會員退出該組織，造成該學會的首次分裂，電力標準化"}, {"type": "text", "text": "66 美國國家標準局1901年經美國國會提案而設置成立，最早功能是測量標準的檢驗室。1903年正式隸屬商務部，推進標準，促進技術，並以獎勵技術革新帶動美國在國際的工商業競爭力成為目標。胡佛出任商務部長的職位後，更是標準化的大推手，他甚至直接召集工業家齊聚一堂開會，商討合力推動標準化的細節。Daniel Immerwahr, How to Hide an Empire: A History of the Greater United States (New York: Farrar Straus and Giroux, 2019), pp. 300-306. 67 Engineering Society of China, report and proceeding, 1915-1916, p. 171."}, {"type": "text", "text": "65 J. R. McNeill and William H. McNeill, The Human Web: A Bird's-Eye View of World History (W. W. Norton & Company Inc., 2003), p. 242."}, {"type": "text", "text": "的合作運動也因而中斷 $^{68}$ 。"}, {"type": "text", "text": "一次大戰後在華盛頓會議所倡導的合作精神之下，1920年代「中美工程師協會」與上海「中華國際工程學會」同時倡議「標準化」。不同的是上海「中華國際工程學會」關注的是電力標準化，而「中美工程師協會」則較關注鐵路標準化。可能是由於前者的會務以上海租界設施為主，電力設備攸關上海外人生活的便利和各式新式工廠的運轉，而「中美工程師學會」的會員則多任職交通部，中國鐵路統一和鐵路標準化議題最為所重，顯現兩個學會的不同關懷。「中美工程師協會」在1920年11月曾有專文探討「標準化」的重要性，此後一再闡釋標準化與鐵路統一對近代中國工業化的必要性 $^{69}$ 。然而不論電力標準化或鐵路標準化均有賴於中國與各國的通力合作，特別是後者關係近代以來各國在華築路所涉的路權和規格化問題，這一目標若非有一強而有力的中央政府之推動，勢難達成。"}, {"type": "text", "text": "就中國政府而言，最早關注的「工業標準化」是從鐵路標準化工程開始，然後逐步向其他經濟生產和科學管理擴散開來的。南京政府成立後，曾宣布統一全國度量衡標準，直到1931年南京政府始在經濟部管轄下成立工業標準委員會，始有初步的成果 $^{70}$ 。曾任實業部度量衡局首任局長（1930年），並大力推動工業標準化的吳承洛定義「工業標準化」，亦即「實業合理化運動」（the movement for industrial rationalization），包括管理科學化、組織協作化和物料標準化。他特別提到中國的標準化運動始於歐戰期間交通部之整理鐵道會計，統一統計，曾邀請美國專家擔任顧問 $^{71}$ 。可以說工業標準化在中國的推動，一開始就受到美國方面的影響。"}, {"type": "text", "text": "工業標準化運動關乎南京政府對內推動工業建設的成效，也攸關中國要與世界先進國家的工業化標準接軌的重大意義。事實上，直到1926年國際標準化協會（International Federation of the"}, {"type": "text", "text": "69 “Standardization,” JACAE, Vol. I, Vol. I, No. 11, Nov., 1920, pp. 3-7."}, {"type": "text", "text": "70《中國工程師學會會務特刊》，1942年第9卷第1期，頁7。"}, {"type": "text", "text": "71 吳承洛，〈中國工業標準化之回顧及今後應採途徑之擬議〉，《工程》，1943年第5期，頁9-27。內文所引在第12頁。該文並介紹英、美、法、比、德國、蘇聯、日本等國工業標準之系統分析，論述中國必須實施工業標準化及設置相關機構。吳承洛（1892-1955）係留美背景的化工學家，南京政府成立後曾任實業部度量衡局局長、中央工業試驗所所长長、經濟部工業司司長和商標局局長等職，關於他與近代中國工業標準化的推動，可參見吳淼，《吳承洛與中國近代化進程》（上海：復旦大學出版社，2011年），頁107-133。"}, {"type": "text", "text": "68 Journal of Engineering Society of China, Vol. II. No. 1, May, 1941, pp. 4-6."}, {"type": "text", "text": "National Standardizing Associations，簡稱ISA）始正式成立。南京政府工業標準委員會對標準化的認識和推動完全順應當時世界工業發展的潮流，時間並不算晚。1930年代國際標準化協會促進各國求取以下工業標準化議題，例如：公差長度和配合度之國際系統（International system of tolerance limits and fits）、自動車之零件、螺釘螺帽規格、農產品輸出分類等級、汽管嘴和節氣鑰之形式、航空發火器之樣式、標準數用於檢定機械標準之大小、工藝製圖之國際規則等等議題，緊鑼密鼓展開，可惜後來因為第二次世界大戰爆發而停擺 $^{72}$ 。戰後在聯合國標準協調委員會（United Nations Standards Coordinating Committee，簡稱UNSCC）的提議之下，成立一個新的全球標準團體。1946年10月，ISA和UNSCC來自25個國家的代表齊聚倫敦，同意聯合起來創建新的國際標準組織（International Organization for Standardization，ISO），1947年2月正式開始運作 $^{73}$ 。而也在同年（1947）年3月，南京政府工業標準委員會與全國度量衡局合併，成立經濟部中央標準局，逐步朝向與國際標準化體系的接軌 $^{74}$ 。工業標準化在全球各國的推動都是來自工程師及其團體，在中國的發展亦是如此，而其最後的一致目標則必須仰賴全球的國際合作。"}, {"type": "text", "text": "（二）借鑑國際經驗——鐵路工程和水利工程之推動"}, {"type": "text", "text": "「中美工程師協會」的重要成員均為交通部官員或美國顧問專家，兩大公共工程議題最受關注：一、鐵路工程；二、水利工程。1920年2月間，交通部連續召開第一次公共工程會議和第一次機械工程會。創刊號刊出這二次會議的開幕致詞，特別強調中國統一全國鐵路的擘劃應該借鑑於同有廣大領土的美國其建造鐵路之經驗 $^{75}$ 。該會認為20世紀初美國在鐵路標準化的設計和實務領先其他國家，而此一優勢主要來自數個不同工程技術學會和獨立組織的合力研究成果，期許「中美工程師協會」亦應在中國發揮同一作用 $^{76}$ 。沈慕韓和熊希齡於該協會的致詞中再三強調標準化對中國統一鐵路工程的重要性，而北京政府已延攬了一批重要的技術顧問來協助建設中國鐵路，顯現北京政府交通部銳意推動現代化工程的決心 $^{77}$ 。1923年該協會的通訊中提到交通部內部檢討當時中央政府所掌控的數段鐵路標準不一，不利於國防和經濟發展 $^{78}$ 。由於清末以來中國鐵路的路權掌握在不同國家銀行和財團手中，鐵路規格和貨運計算等標準的不一致，加深中國交通的效率和管理統一工作，因而此一工作的推動則有賴於各國的通力合作。由協會的報導可看出北京交通部技術官僚的深具國際視野，但當時中國鐵路統一議題除了列強在華的利益嫌隙之外，尚有中國官場無法化解的政治派系對立因素，該協會的學理論辯並不受用 $^{79}$ 。次年該協會邀請南洋大學汽車工程學教授江超西演講，題為「建築中國道路可以發達在華萬國工程市場」，提出「振興交通，以築鐵路為最佳。但鐵路成本雄厚。現國庫空虛，徒興力不從心之歎。故今最易辦之法，當推建築道路」。不論如何，交通事業為中國亟需發展之實業 $^{80}$ 。"}, {"type": "text", "text": "75 “An Opening of First Civil Engineering Conference in Peking,” Speech by the Minister of Communication, JACAE, Vol. I. No. 1, Sep., 1920, pp. 14-15. (創刊號)"}, {"type": "text", "text": "76 “The Commission on Railway Technics,” JACAE, Vol. I. No. 1, Sep., 1920, p. 10。本文提到的協力單位有：The Master Car Builders’ Association, the American Railway Master Mechanics’ Association, The American Railway Engineering Association, the American Society for Testing Materials, The Railway Signal Associations等。"}, {"type": "text", "text": "72 維翰（譯），〈1934年國際標準化會議概況〉，《工業標準與度量衡月刊》，第2卷第3期（1935），頁27-30。"}, {"type": "text", "text": "73 International Organization for Standardization (ISO), 官網 https://www.iso.org/home.html (2018年10月1日下載)。"}, {"type": "text", "text": "77 1918年1月交通部成立鐵路技術委員會，延聘中外技術專家，討論各項技術標準化，鐵路標準化為首要工作。沈慕韓（沈琪）任鐵路技術委員會會長。“The Commission on Railway Technics,” JACAE, Vol. I. No. 1, Sep., 1920, pp. 6-8. “Speech by the Minister of Communication,” JACAE, Vol. I. No. 1, Sep., 1920, pp. 14-15."}, {"type": "text", "text": "74 中央標準局，《中央標準局概況目錄》（南京：中央標準局，1947），頁1。"}, {"type": "text", "text": "78 \"Standardization of Government Railways,\" JACAE, Vol. IV, No. 10, Dec., 1923, pp. 26-28."}, {"type": "text", "text": "「中美工程師協會」可說扮演了聯結中國與國際工程知識的橋梁。1921年3月，有一華人會員參加「美國機械工師學會」（American Society of Mechanical Engineers）年會，並報導了此次會議的重點，他山之石，可以攻玉，文末評述如何將美國經驗轉換於中國。鑑於大戰後美國鐵路發還私營，民間企業與政府管理法規的爭執不斷，如何有效管理運輸的問題成為該次會議的討論焦點；中國作為鐵路工業尚在起步的後發國家，他認為中國的鐵路事業或應由政府統一建造或掌管，但鐵路管理的內部權責則必須分開且有效管理，避免各單位事權衝突 $^{81}$ 。「中美工程師協會」的榮譽會員溫德爾是黃河鐵橋的工程專家，他於1921年會主題發言中比較了中美兩國鐵路發展的不同，稱道中國現今鐵路事業的情況就如同50年前的美國，惟有一明顯的例外，亦即美國鐵路是聯結偏鄉與都市的運輸系統，以交通帶動經濟開發和人口遷移，但中國的鐵路線係建造在人口稠密的都市，美國鐵路往往要營業多年後才開始賺回本金，在中國則不然，鐵路通車後很快就有經營利潤。他建言中國鐵路事業在快速獲利之下更應注意鐵路管理與發展規劃等長遠效益 $^{82}$ 。溫德爾於1921年返美任職紐約市的國際工程顧問及其他部門，活躍於國際工程界。1928-30年間他再次被國民政府交通部所延攬，擔任鐵路技司部門顧問。溫德爾在華盛頓美國工程學會（American Association of Engineer）和美國國家福利工程學組織（The National Welfare Engineering Organization of United States）的支持下出版一本書《工程專業指導》（Vocation Guidance in Engineering Line），邀集了世界著名工程師和學者撰述參與大型工程計畫的專業考察和實務經驗的分享，是一本針對年輕工程師的教戰手冊，共有52作者參與，厚達550頁之多，含50張全開的工程圖片，該書編寫計畫從1926年著手，直到1933年才發行。「中美工程師協會」於1933和1935年兩度介紹溫德爾其人和該書撰述目的，陶德至為推崇本書的重要貢"}, {"type": "text", "text": "79 太平洋會議前後中國嚴重陷入派系政爭風潮，鐵路統一之正反爭議，成為親美研究系（贊成）和親日交通系（反對）互相詆毀的帽子，親日和親美派系雙方都對中國主權有所論述，但因派系恩怨淹沒理性的政策論辯，以致無法平心靜氣討論中國鐵路該如何統一的方案。吳翎君，《美國大企業與近代中國的國際化》，頁170-175。「中美工程師協會」年會的討論議題係從學理上論辯中國必須有統一的鐵路規劃，但其管理上並非交通系所指稱中國鐵路將以「統一」之名而淪為列強共管。"}, {"type": "text", "text": "80 江超西時兼有滬太汽車公司顧問工程師並道路協會編輯部名譽幹事，〈中美工程師會月會江超西之演辭〉，《申報》，1924年3月22日，汽車增刊第2-3版。"}, {"type": "text", "text": "81 “The Annual Meeting of the American Society of Mechanical Engineers,” JACAE, Vol. II, No. 3, Mar., 1921, pp. 8-11."}, {"type": "text", "text": "82 “Address by Dr. Waddell,” JACAE, Vol. II, No. 6, June, 1921, pp. 1-12. 關於黃河鐵橋工程案，詳見吳翎君，《美國大企業與近代中國的國際化》第7章〈技術團隊投資案——美國工程顧問公司與黃河鐵橋投標案〉，本文不贅。"}, {"type": "text", "text": "獻83。"}, {"type": "text", "text": "黃河和淮河水患問題為中國數千年黎民之苦艾，中國水利工程的進展和世界最新工程技術相關訊息，是「中美工程師協會」創刊之初的另一關注焦點。清末以來中國與西方的接觸，使得外籍工程師得以將西方水利技術與經驗轉移至中國；20世紀以後因交通資訊的便捷和人道救援問題，中國黃淮流域的治理受到國際救援團體的關注，不僅有美國紅十字會派員前來，1921年更成立跨越國際的非政府組織——中國華洋義賑會（China International Famine Relief Commission, IFRC）的成立 $^{84}$ 。華洋義賑會的成立時間和中美工程師協會相近，不同的是前者關注國際協力賑災，以更加科學化和專業化的中外合作方式，統籌財力、人力和物力，期使建立更為有效的全國賑災網絡和急難救助的經營組織；而後者——「中美工程師協會」則著重引進防災工程、實務操作的方法、解決工程挑戰和困難。該協會偶亦報導華洋義賑會的活動，反映了彼此的資訊互流 $^{85}$ 。"}, {"type": "text", "text": "1928年南京政府成立後建設委員會的設置，統籌和強化了淮河水利的中央管理，次年成立導淮委員會，並引進國際技術和金融組織參與淮河治理。1930年代初在「國聯與中國技術合作委員會」（Committee of the Council for Collaboration between the League of Nations and China）的協助下又有一批工程專家協助各地水利工程，導淮工程事實上轉由國際聯盟接手，派遣外籍技術專家成為南京政府和國聯具體合作的重要項目 $^{86}$ 。1931年中國第一"}, {"type": "text", "text": "83 溫德爾為美國橋梁工程界的重要人物，曾參與加拿大、日本、古巴、蘇俄和紐西蘭的大橋計畫，於民國初年曾擔任黃河鐵橋工程顧問委員會的委員，負責審查招標事宜。1916年溫德爾曾撰有一本工程學專書，暢言世界各地興建大型橋梁工程之心得和經驗，從工程學理論到建造個案的研究，共兩大冊80章節。1933年則為總編最新的工程學專書。“Vocation Guidance in Engineering Line,” JACAE, Vol. XIV, No. 5, Sep., 1933, pp. 4-6; C. Calor Mota, “Dr. J. A. L. Waddell,” JACAE, Vol. XVI, No. 6, Nov.-Dec., 1935, pp. 340-343."}, {"type": "text", "text": "84 關於華洋義賑會的研究，參見：Andrew James Nathan, The History of the China International Famine Relief Commission (Cambridge, Mass.: Harvard University Press, 1965). 黃文德，《非政府組織與國際合作在中國：華洋義賑會之研究》（台北：秀威資訊，2004）。"}, {"type": "text", "text": "85 “China International Famine Relief Commission, Extract from the Annual Report,” JACAE, Vol. V. No. 4, Apr., 1924, pp. 9-20."}, {"type": "text", "text": "86 張力，《國際合作在中國——國際聯盟角色的考察，1919-1946》（台北：中央研究院近代史研究所，1999），頁 154-163。本書提到國聯專家所考察之水"}, {"type": "text", "text": "個民間水利學術組織——中國水利工程學會成立，李儀祉被推選為會長。李儀祉於1916年自歐洲遊學回國後即投入黃淮水利和水利人才培育，1933年出任黃河水利委員會委員長兼總工程師後，延攬了一批自歐美回國的水利技術專家。李儀祉所率領的工程團隊借鑑並再次研究了美國紅十字會（1914）、江淮水利局（1919）、安徽水利局（1919）、費禮門（1920）、全國水利局（1925）等各種治淮方案，並提出整治中國水利的調查報告 $^{87}$ 。中國整治水利的工程學和技術問題始終是《中美工程師月刊》的重要訊息，可以看出許多工程技術人員是在實施工程中成長起來的，著名的河工專家溫德爾和陶德常發表他們在中國各地考察工程進度的文章。中國水利專家李書田（該協會終身會員）和北洋大學教授汝人鶴（Ju Jen-Hao）於1934年9月共同於該刊宣告中國成立第一個水利實驗室的歷史經過和雄圖目標的長文 $^{88}$ 。可惜的是黃淮水利工程於1937年春國民黨政府為了阻止日軍從東北南下，蔣介石下令炸開河南花園口的黃河大堤，河水整治工程最後中斷於對日戰爭中的國家軍事目的，此一犧牲數十萬無辜村民被淹死的慘劇，究竟為抵擋日軍侵略之成功戰略或者過當手段引起不同爭議 $^{89}$ 。此後太平洋戰爭的加劇和隨後爆發的國共內戰，以致基礎建設難以開展，一些工程師率領勞工冒著生命危險搶通交通運輸的情形，成為戰爭中驚險英偉的故事 $^{90}$ 。"}, {"type": "text", "text": "四、國際合作與中國工程師團隊的形成"}, {"type": "text", "text": "19、20世紀之交，工程師的全球移動已非常普遍，以協會創刊時的榮譽顧問史蒂文生而言，他是建造美國大北鐵路公司和巴拿馬運河總工程師（1905-1907）。1917年俄國大革命後，以美國技術委員會主席身分協助俄國臨時政府整頓西伯利亞鐵路（Trans-Siberia），臨時政府垮台後擔任協約盟國技術委員會（Inter-Allied Technical Board）的會長，負責中東鐵路和西伯利亞鐵路的管理和運作 $^{91}$ 。1921年1月，該協會刊出美國廣益投資公司副總裁亨利（該協會榮譽會員）的專文談論〈工程師的合作〉，廣益投資公司為一戰後由美國華爾街大財團組成的全球投資公司，中國市場為其目標之一。這篇文章的主旨強調「中美工程師協會」應拋棄個人成見以該組織的團體力量改造中國 $^{92}$ 。"}, {"type": "text", "text": "利工程有：一、導淮工程；二、華北水利；三、黃河水利；四、揚子江水利；五、綏遠灌溉工程；六、陝西灌溉工程；七、山西水利工程。國聯方面的檔案，收藏於：League of Nations Archives, Geneva. “Technical Collaboration with Chinese Government: Transit Question,” No. 50-22799-610."}, {"type": "text", "text": "87 David A. Pietz, Engineering the State: The Huai River and Reconstruction in Nationalist China, 1927-1937, Ch. 3, pp. 45-46. 李儀祉曾在柏林大學和丹斯哥大學學習，1916年回國，先後在多個部門任職，包括張謇創辦的河海工程專門學校。擔任導淮委員會總工程師後延攬了一批水利工程師，包括曾於德勒斯登頓技術學院接受水利工教育的沈怡，後來沈怡成為全國資源委員會的核心成員。來自漢諾威大學的水利工程教方修斯任導淮委員會工務處的技術問，提交淮河流域的調查報告。"}, {"type": "text", "text": "89 David A. Pietz, Engineering the State: The Huai River and Reconstruction in Nationalist China, 1927-1937, pp. 116, 120-121."}, {"type": "text", "text": "90 陶德於1940年代重返中國參與聯合國戰後救濟總署（UNRRA）的黃河水利和救災工程，因為該工程艱巨而重要，且因國共內戰不斷，以致工程時而被迫中斷，過程充滿驚險。Jonathan D. Spence（史景遷），To Change China: Western Advisers in China (New York: Penguin books, 1980, reprinted in 2002), pp. 205-216。"}, {"type": "text", "text": "88 “The First National River Hydraulic Laboratory of China,” by Li Shu-Tien and Ju Jen-Hao, JACAE, Vol. XV, No. 5, Sep., 1934, pp. 39-46."}, {"type": "text", "text": "91 “John F. Stevens,” JACAE, Dec., Vol. I, No. 4, 1920, pp. 1-2."}, {"type": "text", "text": "作為工程技術團體組織，該協會的活動和發表的期刊論文有一特點是談論「國際主義」（internationalism）、國際合作（international cooperation）以及對工程師的社會責任和自我期許，這一想法貫穿該協會在華歷史並形成該協會以工程建設改變中國的理想主張，特別是在創刊初期有多篇文章論述此一觀點。為何創刊初期特別強調國際合作和知識文化上的國際主義？此一情況呈現大戰後知識分子對於國際和平的渴盼，工程師的跨國活動經驗更讓他們體認藉由工程合作來消弭各國人民之間的仇恨與對立。會員美國都市計畫專家與工程師古德里奇（Ernest P. Goodrich, 1874-1955）於1921年2月所撰〈國際主義在工程界〉（Internationalism in Engineering）一文最能代表歐戰後工程師群體對科技文明所帶來的戰爭破壞的焦慮感，冀盼各國工程師對戰後各國的迅速重建有更大的責任感，對於以跨國合作來減緩軍國主義的復甦寄予希望 $^{93}$ 。"}, {"type": "text", "text": "1922年美國工程理事會（American Engineering Council）由斯泰潘內克（Bedrick Stepaneck）提議成立世界工程學基金會（World Engineering Foundation），通過以國家為單位代表各國來召集國際工程大會的構想，而且此一組織將以每一國家只能有一個工程學會作為國家代表會員 $^{94}$ 。成立「工程師世界聯盟」（The World's Federation of Engineers）構想終於在1929年10月29日在東京舉辦為期十天的「萬國工程會議」（World Engineering Congress，或譯「萬國工業會議」）受到廣泛的重視，這次會議由日本工程學會（Nihon Kogakkai）所籌劃，是東方與西方暨全球工程師互相合作的一次具指標意義的大會。各國代表承諾朝此一目標努力，喊出「團結將使我們站立，分裂就倒下」（United We stand, Divided We fall） $^{95}$ 。萬國工程會議是主要以國家為單位的國際會議，「中美工程師協會」儘管標榜國際合作，但不具有代表單一國家的象徵身分，而在這次會議中國工程界的代表——「中國工程學會」在政府支持下派出二十餘人參加，與會者深深感到參與國際頂尖工程組織的榮耀 $^{96}$ 。然而，「中美工程師協會」的成員並沒有缺席這次東京的萬國工程會議，現任會長陶德、前會長施肇基和兩位富有聲望的榮譽會員費禮門和溫德爾等人都參與了這次盛會，施肇基還在《中美工程師協會月刊》記載此次國際工程師盛會的情形 $^{97}$ （圖6-8）。大會中美國代表著名的發明企業家史派瑞（Elmer A. Spery, 1860-1930）發表文章，對當前工程師的社會地位終於獲得社會肯定表示欣慰，也意味著工程師對全世界的人類福祉有更高的使命 $^{98}$ 。"}, {"type": "text", "text": "94 Oct. 16, 1935, Presidential Address by J. A. Fly, Engineering Society of China, Report and Proceeding, 1935-36, p. 6."}, {"type": "text", "text": "92 Philip W. Henry (Vice-President, American International Corporation), \"Cooperation Among Engineers,\" JACAE, Vol. II, No. 1, Jan., 1921, pp. 3-4."}, {"type": "text", "text": "93 Ernest P. Goodrich, “Internationalism in Engineering,” JACAE, Vol. II, No. 2, Feb., 1921, pp. 3-5. Goodrich 在 1905 年獲美國工程學會頒給 35 歲以下的年輕工程師的獎項柯靈烏（Collingwood Prize）。1910-16 年於紐約曼哈頓公共部門，此後曾在上海和南京，參與黃埔江擴充計畫，1930 年創辦交通工程師協會（Institute of Traffic Engineers），於 1930-1932 年間擔任會長。此人與中美工程師協會中 1927 年天津通訊員 R. D. Goodrich（任職河北水利委員會）為不同人。"}, {"type": "text", "text": "95 Engineering Society of China, Report and Proceeding, 1935-36, p. 7. Proceedings: World Engineering Congress, Tokyo, 1929, published by Tokyo: World Engineering Congress, 1931."}, {"type": "text", "text": "96〈中國工程學會將參加萬國工程會議〉，《申報》，1928年8月28日，第14張。〈本會在國際間之榮譽〉，《中國工程學會會務月刊》，1930年5期，頁5。"}, {"type": "text", "text": "97 S. C. Thomas Sze, “The World Engineering Congress, Tokyo, 1929” JACAE, Vol. X, No. 4, Dec., 1929, pp. 3-5. 由於中美工程師協會係以英文發行，英文誤將李書田的姓打成 Liu。照片合影的中文名字均為筆者比對，故以英文在前，中"}, {"type": "text", "text": "1930年代中國本土工程組織在南京政府的扶植下愈來愈為壯大，加深了對中國本土工程團體的認同之際，而一批留學美國的工程師同樣也參與了中國本土工程師協會，當然分散了中國工程師對於「中美工程師協會」的向心力，因此參與活動的人數逐年下降。更重要的是「中美工程師協會」樂見中國成立本身專屬的工程學會，培育和提升中國工程人才本來就是該協會創建宗旨之一，他們與中國工程師協會之間並無一種競爭關係。1929年工商部咨議建設委員會派代表參加東京7月19日舉行的世界動力會議（World Power Conference），並由財政部撥款籌組世界動力會議中國分會（Chinese National Committee of Word Power Conference）；在擬組成的中國分會名單中除鐵道部等政府機構、大學教育單位和中央研究院之外，民間社團就是中國科學社、中國工程學會和中國礦冶工程學會 $^{99}$ 。1931年在德國柏林舉行的「世界動力協會會議」由「中國工程師學會」上海分會會長黃柏樵帶領會員參加。1936年在華盛頓舉行第三次「世界動力協會會議」和世界第二次巨壩會議，「中國工程師學會」積極派員參加，中國工程師以國家代表隊身分參與國際工程大會的成軍，大大提升中國本土工程學會的國際知名度 $^{100}$ 。"}, {"type": "text", "text": "誠如柯偉林（William Kirby）所指出1928-37是中國邁向「工程國家」或「技術官僚治國」的誕生階段，中國開始由一批技術專家來規劃中國的基礎建設，這一理想固然和孫中山的實業計畫藍圖有所淵源，但是在南京政府時期通過建設委員會、資源委員會等組織，並尋求國際聯盟技術專家的合作，積極推動全國大型建設和公共工程，國外技術團體的人脈和資源被有效整合到中央政府內部，逐步完成國家基礎建設的藍圖 $^{101}$ 。從1930-1935年「中美工程師協會」的主要幹部由任職交通部鐵路司、經濟資源委員會、黃埔江水利局、華洋義賑會或華北水利會等會員分任（附錄6-3），可顯現南京中央政府與「中美工程師協會」會員的統合密切關係。"}, {"type": "text", "text": "99 工商部咨建設委員會，〈本部提出請代出席東京會議及組織萬國動力協會中國分會議案已奉令修正通會相應咨請查照由〉，附「世界動力協會中國分會組織大綱」，1929年7月3日。中央研究院近代史研究所藏，《建設委員會檔案》，23-25-00-017-01。"}, {"type": "text", "text": "文在後呈現。"}, {"type": "text", "text": "98 Elmer A. Spery, \"Recongnition of the Engineer and the American Engineering Societies,\" JACAE, Vol. X, No. 4, Dec., 1929, p. 22."}, {"type": "text", "text": "100〈中國工程師學會二十四年度會務總報告：關於推派代表參加世界動力協會會議事項〉，《工程週刊》，第5卷第10期（1936），頁3。"}, {"type": "text", "text": "「中美工程師協會」的組織動員和活力在1930年代以後已不如創刊之初，使得該協會在1935年以後刊物改為半年刊，會員數下滑到130人左右。1930年代「中美工程師協會」的會長和委員不乏由學者擔任，學者特質反映在此一時期的刊物上，強調培養工程教育人才和教育機構的重要性，並闡揚工程師應具有人文精神的涵養。1932年7月《中美工程師協會月刊》刊出美國胡佛總統擔任商務部長時所撰的一篇〈向工程師致意〉（“A Tribute to the Engineers”）文章，美國胡佛總統年輕時曾任大清帝國工程師，靠採礦起家並由此致富。胡佛提及美國當時約有20萬名訓練有素的工程師，他個人覺得工程師的地位在美國愈來愈崇高，幾乎已等同於「紳仕」（gentleman）；期許美國工程師團隊以工程專業把握機會改變時代，並應積極為社會發聲 $^{102}$ 。"}, {"type": "text", "text": "1935年「中美工程師協會」舉辦「為何要加入一個工程師學會討論會」（Why Join an Engineering Society-A Symposium），再度強調加入學術社群的重要意義。由溫德爾擔任主持和引言人，引言題目「機會」（Advantages），強調工程師對世界的進步負有積極責任，尤其是該組織的中美會員多位居中國政府公共工程的要職，掌握建設中國為工程國家的命運，如果沒有工程師的巧手和睿智，就沒有發展和進步。交通部王景春的致詞則強調工程師的人道主義關懷，期勉年輕工程師全心投入國家改造的建設 $^{103}$ 。1936年於國立北平圖書館召開第16屆年會，會長丁恩（S. M. Dean）時任華北工程技術學校校長（North China School of Engineering Practice），在開會致詞中表示將邀請美國四大工程師學會成為「中美工程師協會」之組織會員，同時「中美工程師協會」會員也可以加入美國四大工程學會，以壯大協會的聲勢 $^{104}$ 。次年第17屆年會決議函請美國各大學及工程專家成立中美工程師協會分會，並且每年設置工程論文獎學金200元，以在華就讀工程學院的大學四年級生中，徵求論文比賽 $^{105}$ 。然而「中美工程師協會」在華的光輝時代已結束，1938年會員數僅138人 $^{106}$ 。"}, {"type": "text", "text": "101 柯偉林探討經濟資源委員會和國聯技術顧問的技術合作對重建南京新政府的工業生產戰略和建設目標的作用，並提出南京政府時期工程專家的形成如何影響戰後台海兩岸工業建設方針的宏觀解釋。William C. Kirby, “Joint Ventures, Technology Transfer and Technocratic Organization in Nationalist China,” Republican China, 12, no. 2 (April 1987). Kirby, William C. “Engineering China: Birth of the Developmental State, 1928-37,” in Wen-hsin Yeh ed., Becoming Chinese (Berkeley: University of California Press, 2000). pp. 137-160. William C. Kirby, “Engineers and the State in Modern China,” in William P. Alford, William Kirby and Kenneth Winston, eds., Prospects for the Professions in China (Routledge Studies on Civil Society in Asia. London: Routledge, 2010), pp. 283-313."}, {"type": "text", "text": "102 Herbert Hoover, “A Tribute to the Engineers,” JACAE, Vol. XIII, No. 4, July, 1932, pp. 24-29."}, {"type": "text", "text": "103 “Why Join an Engineering Society-A Symposium,” JACAE, Vol. XVI, No. 5, Sep.-Oct., 1935, pp. 268-274."}, {"type": "text", "text": "104 這四大學會指的是：美國土木工程學會、美國礦冶工程師學會、美國機械工程師協會和美國電機工程學會。《時事月報》，第14卷第6期（1936），頁36-37。此次會議由鄭華當選會長，李書田為第一副會長，史篤培（美籍）為第二副會長。"}, {"type": "text", "text": "105《時事月報》，第16卷第6期（1937），頁33-34。"}, {"type": "text", "text": "筆者認為創建於一次大戰後的「中美工程師協會」見證了跨國工程師群體如何在南京政府成立後被有效地吸納到國家基礎建設的行列中，而該協會不僅見證此一過程，且大力協助中國培養自己的工程團隊。1929年陶德已在中國服務近十年，這位「中美工程師協會」和華洋義賑會的靈魂人物感於十年前和他一起來華的美籍工程師多已返美，中國的公共建設從鐵路、公路和河水整治都需要有資深工程師的帶領，而目前亟待開展的各項公共建設急需有工程專業的人才投入。他積極呼籲中國應培養自己的本土工程師，讓從歐美回國的中國年輕工程師從實地考察中累積實務經驗，而他也大力促成他的母校密西根大學遣送工程畢業生來華參與中國政府的各項基礎建設；他強調引進西方最新的工程方法改善中國人的生活，可能成就一場偉大而務實的教育運動 $^{107}$ 。雖然就「中美工程師協會」內部文獻未見到會員們對會務沉寂趨勢的具體回應，但我們可以看到一種跨越國境的高度胸襟，主張工程師群體應堅守專業回饋社會和人群；更重要的是這些訊息不論來自中國或美國會員，均透露「工程師」在中國已然形成一種專業身分的認可，且與國家建設和社會責任的期許連結一氣。可以說「中美工程師協會」在參與建設中國藍圖的同時，也展現了一種世界主義對人類共同進步的追求高度。"}, {"type": "text", "text": "小結"}, {"type": "text", "text": "創建於一次大戰後的「中美工程師協會」一方面是中美政府友好關係下的產物，由一批留美歸國的工程學精英和美籍工程師為主要會員的群體組織；另一方面也呈現一戰以後文化國際主義全力發展的時代，大戰的毀滅性破壞，促使歐美知識精英和藝文人士期望從教育、文化和藝術展演等方面，取代國際政治和軍備的競爭 $^{108}$ 。此一組織與「美國工程學會」的關係相當密切，該學會榮譽會員也都是美國工程界的領軍人物。《中美工程師協會月刊》除討論工程專業文章之外，亦常於會訊報導正進行的中美政府合作工程的進度和困難，同時對於國際工程界的最新訊息亦深為關注。不論就該協會刊載的學術刊物或工程訊息或推動標準化等主張，均與全球技術革命同聲共息，可說中國直接受惠於歐洲19世紀中葉以後第二次工業革命的技術成果與技術觀念的創新。"}, {"type": "text", "text": "隨著南京政府大力運用國家力量和中央資源，國外技術團體的人脈和資源被有效整合到政府內部和國家策略目標，以及1930年代「中國工程師學會」的專業功能愈來愈為完備並且以國家代表隊身分參與國際活動，而以國家為單位的國際工程組織如「萬國工程會議」也適時成立，在國族主義大纛下更加鞏固了本土工程師的自我認同感。原本以中美友好和文化國際主義為號召的「中美工程師協會」之功能和作用，在此一情勢之下逐漸退場。儘管如此，迄於太平洋戰爭爆發前夕，「中美工程師協會」始終扮演了工程專家及群體組織之間的橋梁，且與中央政府的國家建設工程聯結起來，讓這些工程專家得以匯聚和交換他們的專業知識參與建設國家工程的梯隊。該協會所發行的近三十年機關報刊因而提供了一個歷經北洋政府到南京政府時期，中國如何建設工程國家的思維理路，以及與世界接軌的具體圖像。"}, {"type": "text", "text": "106 “List of Members,” JACAE, Vol. XIX, No. 2, Mar.-Apr., 1938, pp. 95-102. 此外，《時事月報》，第16卷第6期（1937），頁33，提到第17屆年會會員有四百餘人，係有誤。"}, {"type": "text", "text": "107 O. J. Todd, “A Practical Educational Movement,” The China Weekly Review, Jan. 26, 1929, Reprinted in Two Decades in China, pp. 316-319."}, {"type": "text", "text": "108 Akira Iriye, Cultural Internationalism and World Order (Baltimore: The John Hopkins University Press, 1997), p. 184. Akira Iriye, “Culture and Power: International Relations as Intercultural Relations,” Diplomatic History 3, no. 3 (1979), p. 115."}, {"type": "text", "text": "北洋政府時代參酌了美國剛完成的巴拿馬運河工程經驗而提出紅十字會的導淮報告和費禮門方案，當時的報告偏重水利防洪。到了1929-1931年，導淮水利工程計畫在管理上則參考了美國政府田納西流域治理的大型計畫經驗，不僅僅是水利防洪的根本問題，還要著重水力發電、航運和灌溉，以發達國家水利管理的指導原則，30年間的水利建設思路已出現不同的演進。就此而言，刊載於《中美工程師協會月刊》的水利報告乃成為記錄中國水利建設思路的軌跡。"}, {"type": "text", "text": "太平洋戰爭爆發之後，將中美技術人才的培育合作，推進到一個極為特殊的階段，一批南京政府派遣赴美培訓的技術工程人才，對於戰後中國的重建和戰後台灣也有重要貢獻 $^{109}$ 。當時「中美工程師協會」已停止活動，非本文討論範疇。但值得留意的是在美國允諾之下，南京政府派遣工礦電業諸種技術人才赴美實習，以精進技術能力與學識專業，最主要的電力人才實習地點亦即是田納西河流域管理局（Tennessee Valley Authority, TVA） $^{110}$ 。一直到冷戰時代的台灣，在美援技術委員會的支持下，1956年4月1日創辦了《中美技術》雜誌，從技術合作及其背後的政治文化意義等諸多層面而言，係與一次大戰後創建的《中美工程師協會月刊》理念一脈相承。"}, {"type": "text", "text": "109 太平洋戰爭時期美方協助中國技術人才赴美訓練，由資源委員會派遣工、礦、電業各單位之高級技術人員，分批赴美。戰後尚有「揚子江三峽計畫」和「西屋電氣公司」（Westinghouse Electric Corporation）派遣人才赴美訓練合作計畫。程玉鳳編著，《資源委員會技術人員赴美實習史料——民國三十一年會派》，上冊，（台北：國史館，1988），頁5。"}, {"type": "text", "text": "資源委員會對台電之接收（1945-1952）——以技術與人才為中心》，《中央研究院近代史研究所集刊》，第79期（2013年3月），頁87-135。1943年4月4日於美國田納西州諾克斯威爾（Knoxville Tenn.）召開了TVA區中國留美工程師第一次學術會議，由TVA負責培訓。太平洋戰爭發生後，南京政府派送人員赴美訓練，在電力方面的技術幹部主要都安排在TVA實習，像俞恩瀛、謝佩和、王平洋、蔡同璣、張光斗、孫運璿等人。這些技術人才像孫運璿等人隨國民政府來台，直接參與了台灣電力公司的接收與重建。程玉鳳編著，《資源委員會技術人員赴美實習史料——民國三十一年會派》，上冊，收錄赴美人員在TVA的照片與文字紀錄。"}, {"type": "text", "text": "110 這批赴美技術專家對戰後台灣的影響和貢獻，可參見：林蘭芳，〈戰後初期"}, {"type": "text", "text": "企業、戰爭 與外交"}, {"type": "text", "text": "第三部分"}, {"type": "note", "text": "關於近代中國工程建設的研究有愈來愈受到關注之勢，不少學者從國家治理、工程師專業化，以及技術專家對形塑現代國家的作用等視角提出有意義的見解，其中較具代表的當屬大衛·佩茲（David A. Pietz）所著關於17世紀中葉以後二百年來的黃河水利治理和民國時期淮河治理（1927-1937）的兩本學術專書 $^{1}$ 。此"}, {"type": "note", "text": "Nationalist China, 1927-1937 (New York and London: Routledge, 2002). David A. Pietz, The Yellow River: The Problem of Water in Modern China (Cambridge, Mass.: Harvard University Press, 2014). Pierre-Etienne Will, Bureaucracy and Famine in Eighteenth-Century China (Stanford, Calif.: Stanford University Press, 1990) and Nourish the People: The State Civilian Granary System in China, 1650-1850 (Ann Arbor: University of Michigan Center for Chinese Studies, 1991)."}, {"type": "note", "text": "2 Shellen Xiao Wu, Empires of Coal: Fueling China's Entry into the Modern World Order, 1860-1920 (Stanford, Calif.: Stanford University Press, 2015) 一書，考察19世紀以來近代地質學家以及採礦學和近代工程學科的建立。朱瑪瓏，〈「港際」工程：1875年來自日本的兩位荷蘭水利工程師對上海吳淞內沙的調查〉，《中央研究院近代史研究所集刊》，第90期（2015年12月），頁55-93。對「中國工程師學會」較新的研究有：房正，《近代工程師群體的民間領袖——中國工程師學會研究，1912-1950》（北京：經濟日報出版社，2014）。此外，Shirley Ye, “Business, Water, and the Global City: Germany, Europe, and China, 1820-1950,” Ph. D. thesis, Harvard University, 2013著重德國水利工程對近代中國的城市建設和經濟全球化的研究視角。筆者另有專文討論以英國工程師為主，1901年在上海創立的跨國工程師組織——「中華國際工程學會」（The Engineering Society of China）。參見：WU Lin-chun, “Foreign Engineers’ Activities in China and the Process of China’s Internationalization: the Case of ‘The Engineering Society of China’, 1901-1941,” María Dolores Elizalde & Wang Jianlang eds., Chinas Development from a Global Perspective (Newcastle: Cambridge Scholars Publishing, 2017), pp. 375-403."}, {"type": "note", "text": "1 David A. Pietz, Engineering the State: The Huai River and Reconstruction in"}, {"type": "note", "text": "3 International Engineering Congress, Transactions of the International Engineering Congress, San Francisco, CA. Sep. 20-25, 1915."}, {"type": "note", "text": "6 關於美國巴拿馬運河工程師團隊及紅十字會參與中國導淮計畫，詳見：吳翎君，《美國大企業與近代中國的國際化》，第5章〈人道主義工程投資案〉，頁179-215。"}, {"type": "note", "text": "4 Sarah J. Moore, Empire on Display: San Francisco's Panama-Pacific International Exposition of 1915 (Norman, OK: University of Oklahoma Press, 2013)."}, {"type": "note", "text": "5 梁碧瑩，〈民初中國實業界赴美的一次經濟活動——中國與巴拿馬太平洋萬國博覽會〉，收入：顧雲深、石源華、金光耀主編，《鑑往知來：百年來中美經濟關係的回顧與前瞻》（上海：復旦大學出版社，1999），頁323-344。謝輝、林芳，《陳琪與近代中國博覽會事業》（北京：國家圖書館出版社，2009），頁132。"}, {"type": "note", "text": "7〈常年會紀事〉，為1916年「中國科學社」之社務會議記事，《科學》第3卷第1期（1917年1月），頁72。關於「中國科學社」的創建歷史，詳見：張劍，《賽先生在中國——中國科學社研究》（上海：上海科學技術版社，2018）。Peter Buck, American Science and Modern China, 1876-1936 (Cambridge: Cambridge University, 1980), Ch. 5, pp. 91-122."}, {"type": "note", "text": "8 葉維麗（Ye Weili）著，周子平譯，《為中國尋找現代之路——中國留學生在美國，1900-1927》（北京：北京大學出版社，2017年2版），頁56-67。"}, {"type": "note", "text": "10 Hsiung his-ling, “Introduction,” Journal Association of Chinese and American Engineers (hereafter cited as JACAE), Vol. I, No. 1, Sep., 1920, pp. 1-3."}, {"type": "note", "text": "11《申報》，1922年4月5日，第3張。"}, {"type": "note", "text": "9 朱庭祺，〈美國留學界〉，留美學生會編，《庚戌年留美學生年報》（1911年6月）。頁11-12。"}, {"type": "note", "text": "12 胡光廌，《波逐六十年》（台北：新聞天地社，1976），頁163-164。據胡光廌所記，1918年8月，在美東的「中國工程學會」與「中國科學社」在康乃爾大學舉行聯合年會，因為一半以上的會員參加兩個學會。關於「中國科學社」的演變和歷史，詳見：張劍，《科學社團在近代中國的命運——以中國科學社為中心》（濟南：山東教育出版社，2005），頁1-14。"}, {"type": "note", "text": "13 “The President of Tsing Hua College,” JACAE, Vol. I, No. 4, Dec., 1920, pp. 8-9. 14 “Hon. T. C. Sun” JACAE, Vol. IV, No. 8, Oct., 1923, 照片夾頁和說明，無頁碼。 15 鄭華於 1917 年取得康乃爾大學工程學博士學位後，曾在麻里蘭和賓州從事鐵路和橋梁工程，於 1919 年回國，進入交通部鐵路司承擔津浦鐵路和山海關橋梁等工事。“PhooHwa Cheng,” JACAE, Vol. XVII, No. 4, July-Aug., 1936。附照片。"}, {"type": "note", "text": "16 “Li ShuTien,” JACAE, Vol. XVIII, No. 3, May-June, 1937. 附照片。李書田係康乃爾大學工學博士，1927年返回中國後出任順直水利委員會祕書長、北洋大學教授。他於1928年後參與中國水利工程學會的成立並任副會長。曾任國立交通大學唐山土木工程學院院長、國立北洋工學院院長，建立了中國最早的水利專業和水利系。1938年榮任「中美工程師協會」會長。"}, {"type": "note", "text": "18 “List of Members of the Association,” JACAE, Vol. V, No. 1, Jan., 1924, pp. 4-15."}, {"type": "note", "text": "20 “John F. Stevens,” JACAE, Vol. I, No. 4, Dec., 1920, pp. 1-2."}, {"type": "note", "text": "17 “List of Members of the Association,” JACAE, Vol. III, No. 8, Sep., 1922, pp. 2-9."}, {"type": "note", "text": "19 “List of Members of the Association,” JACAE, Vol. I, No. 1, Sep., 1920, pp. 38-43. 鄺景揚（K. Y. Kwong）名字出現於頁38。第三期人物介紹是交通部長葉恭綽，見於JACAE, Nov., 1920, p. 1."}, {"type": "note", "text": "21 “List of Members of the Association,” JACAE, Vol. III, No. 8, Sep., 1922, pp. 2-9."}, {"type": "note", "text": "22 “List of Members of the Association,” JACAE, Vol. V, No. 1, Jan., 1924, pp. 4-15. 1924年的榮譽會員為13名，其中12名延續自1922年，王景春雖卸下交通部長職務，但仍擔任榮譽會員，增加的這一名即現任交通部長，但因北京內閣更迭不斷，因此名錄中僅有交通部長頭銜而未出現名字。"}, {"type": "note", "text": "23 柯蘭具有廣泛的歐洲和中東遊歷經驗。在1915年前是名繼承家業柯蘭公司的成功商人，此後他辭去公司總裁投入自己感興趣的科學與教育事業，曾任麻省Woods Hole海洋生物實驗室（Marine Biological Laboratory at Woods Hole）主席，投入土耳其伊士坦丁堡女子教育，並有俄國遊歷經驗。獲威爾遜總統邀請擔任巴黎和會國際委員會中對土耳其問題的美國代表，此後才奉派擔任駐華公使。JACAE, Vol. I, No. 4, Dec., 1920, pp. 1-2."}, {"type": "note", "text": "25 “Association of Chinese and American Engineers, Constitution,” JACAE, Vol. III, No. 8, Sep., 1922, pp. 10-11. 早期會員名單均為英文姓名，許多華人名字只有簡稱或特殊拼音，較難以得知其正確中文名字。1931年後的會員名錄始有中英文姓名並列。"}, {"type": "note", "text": "24 “List of Members of the Association,” JACAE, Vol. XIX, No. 2, Mar.-Apr., 1938, pp. 95-102。溫德爾逝世於1938年。"}, {"type": "note", "text": "26 這份資料來自1922年4月在上海召開年會的財務報告。本次大會，上海會員註冊費為15元，上海以外的會員交10元註冊費。亦需支付參觀旅費和聚宴費。“The Financial Report of the Spring Convention,” JACAE, Vol. III, No. 4, Apr.-May, 1922, p. 6."}, {"type": "note", "text": "27 “Report of Council,” JACAE, Vol. XV, No. 4, July, 1934, pp. 3-4. 由王景春（C. Y. Wang）出任會長。"}, {"type": "note", "text": "28 “List of Members of the Association,” JACAE, Vol. XVII, No. 2, Mar.-Apr., 1936, pp. 104-111. 這38名終身會員中，從姓名研判華籍應有31名，較著名者如鄭華、程孝剛、胡光廌、金濤、李國普、李國鈞、李書田、王金職、凌鴻勛、孫家錄、顏德慶、楊豹靈等人都是較早入會的會員，一般會員如薛卓斌、薩福鈞、高大剛、施肇祥、徐世大、王正黻、王寵佑等人，也都是工程界的重要人物。"}, {"type": "note", "text": "29 北京國家圖書館所收最後一期為1940年發行11-12月號。密西根大學藏有1941年5-6月號，卷22，第3號。"}, {"type": "note", "text": "31 1921年7月，黃河在山東自境內利津、宮家壩等處決口，山東北部遭受重大水災。據山東省大事記，1922年11月22日，美商亞洲建業公司承包宮家壩堵合工程，費用為120萬銀元。1923年5月，堵口工程竣工。http://lishi.zhuixue.net/2016/1202/51185.html（下載日期2018年9月30日）。"}, {"type": "note", "text": "30 “The Shanghai Convention,” JACAE, Vol. III, No. 4, Apr.-May, 1922, pp. 1-3. 這次會議紀要並無特別提到照片中的女性。《申報》（1922年4月4-5日）詳述本次會議的經過，亦無提到這位女士的姓名。筆者雖試圖臆測這位女士可能是美國駐華機構（使領館、商務代辦的職員或夫人）或是活躍於上海美國人俱樂部的婦女，惟仍存疑。"}, {"type": "note", "text": "32 胡光廌，《波逐六十年》，頁219。允元公司創辦人為格萊因斯（Stanley E. Glines），據胡光廌的說法該公司有不少麻省理工學院和哈佛畢業的中國校友，主要業務為工程設計和進口機器物料。關於允元公司，筆者曾有文討論，詳見：吳翎君，《美國大企業與近代中國的國際化》，頁269、281-285。"}, {"type": "note", "text": "33 “Council for Session 1930-31,” “Council for Session 1931-32,” Engineering Society of China, report and proceeding, 1930-31, 1931-1932。高大綱係於1923年加入中華國際工程學會，當時他也是「中美工程師協會」會員。"}, {"type": "note", "text": "34 Lillian M. Li, China's Silk Trade, Traditional Industry in the Modern World, 1842-1937 (Cambridge, MA: Harvard University Press, 1981), p. 181. 上海萬國生絲檢驗所雖是中美絲商對生絲檢驗的國際合作範本，引入現代化檢驗設備和技術人才，但在創立之初，美國絲商團體和生絲出口洋行之間亦頗多攻訐。這一組織在1920年代後期中國民族主義昂揚，收回國權運動意識高張後，被視為對國民政府統一檢驗權的侵奪，關係著中國國體主權問題，直到1929年始由國民政府接收。詳見：宋時磊，〈檢權之爭：上海萬國生絲檢驗所始末〉，《中國經濟史研究》（北京），2017年第6期，頁115-126。"}, {"type": "note", "text": "35 “Financial Statement,” JACAE, Vol. VII, No. 1, Jan., 1926, p. 41."}, {"type": "note", "text": "36〈科學新聞〉，《科學》，第21卷第6期（1937），頁485-486。1937年4月19日在北平華語學校召開第17屆年會有：關祖章，金濤，唐化成，楊豹靈，王子文，丁寅及黃河水利會顧問英人塔德（即陶德O.J.Told）等三十餘人參加。共有四位會員宣讀論文，中美學人各占一半，為：金濤〈平綏鐵路修養執道述要〉、可克（W.E.Cooke）〈過灣風流之阻礙〉、王宛佑〈以種種方法採礦物水油〉和陶德〈工程師之地位〉討論熱烈。會後有參訪製皮廠、玻璃廠、觀崂山風景和遊頤和園等活動，晚間在歐美同學會聚餐。惟這份資料提到當時該會有永久會員73人，正會員33人，副會員34人。人數與筆者據該協會1937年名冊有所出入（見附錄6-2），應以筆者據協會正式名錄為核，而每人每年交會費5元，永久會費100元，則是相同。"}, {"type": "note", "text": "38 發起成立美國「工程協會」的四個團體為：Western Society of Engineers, Civil Engineers' Club of Cleveland, Engineers' Club of St. Louis, Boston Society of Civil Engineers，後擴及全國各地。北京國家圖書館藏有「工程協會」出版的多數官方期刊，收藏的第一本為1895，係由哈佛大學於1939年贈予北京國家圖書館。"}, {"type": "note", "text": "39 “Recent development in the Organization of the Engineering in the United States,” JACAE, Vol. I, No. 4, Dec., 1920, pp. 3-4. “American Society of Civil Engineers Meeting,” JACAE, Vol. VI, No. 10, Oct., 1925, pp. 83-87."}, {"type": "note", "text": "37 “List of Members of the Association,” JACAE, Vol. XIX, No. 2, Mar.-Apr., 1938, pp. 96-97. 林輯西（來自福建州協和建築部），彭炳祿（來自雲南府永固建築廠）。"}, {"type": "note", "text": "40 民國初年張謇在治理導淮工程期間，與美方技術人員頗多合作，亦有所衝突，其中和詹美森的嫌隙最大，不僅是治河方案的不同，亦牽涉張謇認為詹美森性情狡黠，有私德瑕疵。詳見：吳翎君，《美國大企業與近代中國的國"}, {"type": "note", "text": "際化》，頁202-205，本書不再贅述。"}, {"type": "note", "text": "41 Vannevar Bush, “Biographic Memoir of John Ripley Freeman, 1855-1932,” JACAE, Vol. XIV, No. 1, Jan., 1933, pp. 171-187. 關於費禮門在中國的活動，在頁177。"}, {"type": "note", "text": "42 另據，中國水利部，黃河委員會官網。http://www.yellowriver.gov.cn/hhyl/hhjs/mgsq/201108/t20110812\\_95205.htm（2018年5月19日下載）。也提到1929年德國漢諾佛大學教授方修斯（Otto Franzius, 1878-1936）曾任導淮委員會顧問工程師，並在他創辦的漢諾佛水工及土工試驗所作過兩次黃河試驗。1929年來華，在參與起草〈導淮計畫〉之餘還致力於黃河研究，返德後發表了〈黃河及其治理〉一文，認為「黃河之所以為患，在於洪水河床之過寬」，與美國費禮門的見解相近。"}, {"type": "note", "text": "43 熊希齡，〈費禮門先生像贊〉，刊於 JACAE, Vol. XIV, No. 1, Jan., 1933，夾頁照片，無頁碼。O. J. Todd, “In Memoriam,” JACAE, Jan., 1933, pp. 1-6. Yang Pao Ling, “Mr. John R. Freeman,” JACAE, Jan., 1933, pp. 7-8. Chen Tan, “Memories of John R. Freeman,” JACAE, Jan., 1933, pp. 9-12. Hsueh C. P., “A Source of Inspiration,” JACAE, Jan., 1933, pp. 13-14."}, {"type": "note", "text": "44 Charles R. Crane, “What John R. Freeman did for China,” JACAE, Vol. XIV, No. 1, Jan., 1933, pp. 18-20. “John R. Freeman, World Famous Engineer-praise by Hoover,” JACAE, Jan., 1933, p. 21，原刊於 Providence Journal, Oct. 7, 1932."}, {"type": "note", "text": "45 陶德在1923年獲聘為「華洋義賑救災總會」（China International Famine Relief Commission）首任總工師，負責規劃大型工程與賑災計畫，直到1935年才光榮下台。George Gorman, “Major O. J. Todd,” in O. J. Todd, Two Decades in China (Peking: The Association of Chinese and American Engineers, 1938), pp. 1-6."}, {"type": "note", "text": "46〈民國8年李伯來君在天津利德飯店恭讌費禮門君來賓名次〉。MIT Library, Institute Archives & Special Collections. J. R. Freeman papers, MC 51, Box127, F. 104."}, {"type": "note", "text": "47 \"Freeman to Hsiung Hsi Ling, July 20, 1920,\" MIT Library, Institute Archives & Special Collections. J. R. Freeman papers, MC 51, Box128, F.131."}, {"type": "note", "text": "48 The North China Herald, Jan. 23, 1901。毛里遜為1876年由英商集資建築上海吳淞鐵路時的總工程師。該鐵路通行未及半年，因火車壓死一個行人，激起附近中國居民的反對。幾經交涉後由清政府出資將這條鐵路收買，最後將鐵路拆除。毛氏於1902年退休返英，1905年病逝英國。“The Late Mr. G. J. Morrison-Engineers’ and Architects’ Tribute,” The North China Herald, Feb. 17, 1905。"}, {"type": "note", "text": "49「中華國際工程學會」創建之初，即發行機關報刊。最初名稱為：Engineering Society of China, Report and Proceeding, 1901-1939，保存於上海市徐家匯藏書樓和大英博物館。1939年10月起改名為Journal of Engineering Society of China，目前查到的最後一冊為May, 1941, Vol. II, No. 1. 藏於大英博物館。"}, {"type": "note", "text": "50 最初名稱為 “The Shanghai Society of Engineers & Architect”。到了1912年，有鑑於近代工程學愈趨於專業和精細化，建築師們決定另組學會以和工程師專業區隔，該協會於1912年改為 The Engineering Society of Shanghai，當時並未取有中文名稱。Presidential address by N. W. B. Clarke, Journal of the Engineering Society of China, 1940-41, pp. 1-2, 9-13. 倫敦大英圖書館藏。"}, {"type": "note", "text": "51 鄭保三，〈外國工師論我國工程學生之教練法〉，《教育與職業》，第12期（1919年12月），頁1。"}, {"type": "note", "text": "52 “Note of History of the Society,” Journal of the Engineering Society of China, 1940-1941, pp. 15-50. 關於上海「中華工程師學會」的歷史，詳見：WU Linchun, “Foreign Engineers’ Activities in China and the Process of China’s Internationalization: the Case of ‘The Engineering Society of China’, 1901-1941,” pp. 375-403. 吳翎君，〈打造摩登城市與中國的國際化——「中華國際工程學會」在上海，1901-1941〉。收入：蘇智良、蔣杰主編，《從荒野蘆灘到東方巴黎——法租界與近代上海》（上海：上海社會科學院出版社，2018年12月），頁187-204。"}, {"type": "note", "text": "53 筆者據下述資料所發現。“Note of History of the Society,” Journal of the Engineering Society of China, 1940-1941, p. 20."}, {"type": "note", "text": "54 詳見茅家琦、高宗魯，《詹天佑傳》（南京：江蘇古籍出版社，1987），詹天佑於耶魯大學的學士論文是〈碼頭起重機的研究〉（Review of Large wharf Crane），頁16、104。"}, {"type": "note", "text": "55 “Mr. M. H. Shen,” JACAE, Vol. II, No. 1, Jan., 1921, pp. 1-2."}, {"type": "note", "text": "該年會發表，於1928年1月被《中美工程師協會月刊》轉載，JACAE, Vol. IX, No. 1, Jan., 1928, pp. 20-23."}, {"type": "note", "text": "58 “John. A. Ely,” JACAE, 1938, Vol. XIX, No. 3, May-June, p. 137."}, {"type": "note", "text": "59 吳承洛，〈三十年來中國之工程師學會〉，收於周開慶主編，《三十年來之中國工程》，下冊（台北：華文書局，1969），頁9-13。"}, {"type": "note", "text": "60「中國工程師學會」在1931年的普通會員有2,169人，1936年有3,069人，1940年有3,290人（另加上26個團體會員）。房正，《近代工程師群體的民間領袖——中國工程師學會研究，1912-1950》，〈中國工程師學會會員人數統計表，1931-1949〉，頁61。"}, {"type": "note", "text": "56 此文最初發表於 1926 年 9 月號出版的《中美工程師協會月刊》（Journal Association of Chinese and American Engineers），後收錄於：O. J. Todd, Two Decades in China, pp. 218-222。內文所引見：頁 219。"}, {"type": "note", "text": "57 例如：中華工程師學會的文章 “Engineering and Economic” 為 Dr. H. Charley 於"}, {"type": "note", "text": "61〈公牘·函中國工程學會、中華工程師學會、中美工程師協會，請分函貴會水利專家出席華北水利討論會由〉，《華北水利會月刊》，第3卷第2期（1930），頁54。"}, {"type": "note", "text": "62「中華國際工程學會」會員在1935年有250人，1936年更打破300人之譜。為因應孤島時期快速興建的城市大樓和公共設施，此一組織大力倡導學徒制，通過和上海工部局的合作認證，以培育合格工程人才來保證上海公共租界的專業施工品質。詳見：吳翎君，〈打造摩登城市與中國的國際化——「中華國際工程學會」在上海，1901-1941〉，頁187-204。"}, {"type": "note", "text": "63 法國工程師賴福萊，〈工程師養成法〉，《東方雜誌》，第15卷第7號，頁99-105；第15卷第8號，頁115-118。"}, {"type": "note", "text": "64 A. C. Clear and D. P. Griffith, “Chinese students in Engineering, Education and Training,” Engineering Society of China, report and proceeding, 1916-1917. pp. 254-255. 1917-1918, p. 240。原文係發表於上海「中華國際工程學會」。鄭保三，〈外國工師論我國工程學生之教練法〉，《教育與職業》，第12期（1919年12月），頁1-10。"}, {"type": "note", "text": "66 美國國家標準局1901年經美國國會提案而設置成立，最早功能是測量標準的檢驗室。1903年正式隸屬商務部，推進標準，促進技術，並以獎勵技術革新帶動美國在國際的工商業競爭力成為目標。胡佛出任商務部長的職位後，更是標準化的大推手，他甚至直接召集工業家齊聚一堂開會，商討合力推動標準化的細節。Daniel Immerwahr, How to Hide an Empire: A History of the Greater United States (New York: Farrar Straus and Giroux, 2019), pp. 300-306. 67 Engineering Society of China, report and proceeding, 1915-1916, p. 171."}, {"type": "note", "text": "65 J. R. McNeill and William H. McNeill, The Human Web: A Bird's-Eye View of World History (W. W. Norton & Company Inc., 2003), p. 242."}, {"type": "note", "text": "69 “Standardization,” JACAE, Vol. I, Vol. I, No. 11, Nov., 1920, pp. 3-7."}, {"type": "note", "text": "70《中國工程師學會會務特刊》，1942年第9卷第1期，頁7。"}, {"type": "note", "text": "71 吳承洛，〈中國工業標準化之回顧及今後應採途徑之擬議〉，《工程》，1943年第5期，頁9-27。內文所引在第12頁。該文並介紹英、美、法、比、德國、蘇聯、日本等國工業標準之系統分析，論述中國必須實施工業標準化及設置相關機構。吳承洛（1892-1955）係留美背景的化工學家，南京政府成立後曾任實業部度量衡局局長、中央工業試驗所所长長、經濟部工業司司長和商標局局長等職，關於他與近代中國工業標準化的推動，可參見吳淼，《吳承洛與中國近代化進程》（上海：復旦大學出版社，2011年），頁107-133。"}, {"type": "note", "text": "68 Journal of Engineering Society of China, Vol. II. No. 1, May, 1941, pp. 4-6."}, {"type": "note", "text": "75 “An Opening of First Civil Engineering Conference in Peking,” Speech by the Minister of Communication, JACAE, Vol. I. No. 1, Sep., 1920, pp. 14-15. (創刊號)"}, {"type": "note", "text": "76 “The Commission on Railway Technics,” JACAE, Vol. I. No. 1, Sep., 1920, p. 10。本文提到的協力單位有：The Master Car Builders’ Association, the American Railway Master Mechanics’ Association, The American Railway Engineering Association, the American Society for Testing Materials, The Railway Signal Associations等。"}, {"type": "note", "text": "72 維翰（譯），〈1934年國際標準化會議概況〉，《工業標準與度量衡月刊》，第2卷第3期（1935），頁27-30。"}, {"type": "note", "text": "73 International Organization for Standardization (ISO), 官網 https://www.iso.org/home.html (2018年10月1日下載)。"}, {"type": "note", "text": "77 1918年1月交通部成立鐵路技術委員會，延聘中外技術專家，討論各項技術標準化，鐵路標準化為首要工作。沈慕韓（沈琪）任鐵路技術委員會會長。“The Commission on Railway Technics,” JACAE, Vol. I. No. 1, Sep., 1920, pp. 6-8. “Speech by the Minister of Communication,” JACAE, Vol. I. No. 1, Sep., 1920, pp. 14-15."}, {"type": "note", "text": "74 中央標準局，《中央標準局概況目錄》（南京：中央標準局，1947），頁1。"}, {"type": "note", "text": "78 \"Standardization of Government Railways,\" JACAE, Vol. IV, No. 10, Dec., 1923, pp. 26-28."}, {"type": "note", "text": "79 太平洋會議前後中國嚴重陷入派系政爭風潮，鐵路統一之正反爭議，成為親美研究系（贊成）和親日交通系（反對）互相詆毀的帽子，親日和親美派系雙方都對中國主權有所論述，但因派系恩怨淹沒理性的政策論辯，以致無法平心靜氣討論中國鐵路該如何統一的方案。吳翎君，《美國大企業與近代中國的國際化》，頁170-175。「中美工程師協會」年會的討論議題係從學理上論辯中國必須有統一的鐵路規劃，但其管理上並非交通系所指稱中國鐵路將以「統一」之名而淪為列強共管。"}, {"type": "note", "text": "80 江超西時兼有滬太汽車公司顧問工程師並道路協會編輯部名譽幹事，〈中美工程師會月會江超西之演辭〉，《申報》，1924年3月22日，汽車增刊第2-3版。"}, {"type": "note", "text": "81 “The Annual Meeting of the American Society of Mechanical Engineers,” JACAE, Vol. II, No. 3, Mar., 1921, pp. 8-11."}, {"type": "note", "text": "82 “Address by Dr. Waddell,” JACAE, Vol. II, No. 6, June, 1921, pp. 1-12. 關於黃河鐵橋工程案，詳見吳翎君，《美國大企業與近代中國的國際化》第7章〈技術團隊投資案——美國工程顧問公司與黃河鐵橋投標案〉，本文不贅。"}, {"type": "note", "text": "83 溫德爾為美國橋梁工程界的重要人物，曾參與加拿大、日本、古巴、蘇俄和紐西蘭的大橋計畫，於民國初年曾擔任黃河鐵橋工程顧問委員會的委員，負責審查招標事宜。1916年溫德爾曾撰有一本工程學專書，暢言世界各地興建大型橋梁工程之心得和經驗，從工程學理論到建造個案的研究，共兩大冊80章節。1933年則為總編最新的工程學專書。“Vocation Guidance in Engineering Line,” JACAE, Vol. XIV, No. 5, Sep., 1933, pp. 4-6; C. Calor Mota, “Dr. J. A. L. Waddell,” JACAE, Vol. XVI, No. 6, Nov.-Dec., 1935, pp. 340-343."}, {"type": "note", "text": "84 關於華洋義賑會的研究，參見：Andrew James Nathan, The History of the China International Famine Relief Commission (Cambridge, Mass.: Harvard University Press, 1965). 黃文德，《非政府組織與國際合作在中國：華洋義賑會之研究》（台北：秀威資訊，2004）。"}, {"type": "note", "text": "85 “China International Famine Relief Commission, Extract from the Annual Report,” JACAE, Vol. V. No. 4, Apr., 1924, pp. 9-20."}, {"type": "note", "text": "86 張力，《國際合作在中國——國際聯盟角色的考察，1919-1946》（台北：中央研究院近代史研究所，1999），頁 154-163。本書提到國聯專家所考察之水"}, {"type": "note", "text": "利工程有：一、導淮工程；二、華北水利；三、黃河水利；四、揚子江水利；五、綏遠灌溉工程；六、陝西灌溉工程；七、山西水利工程。國聯方面的檔案，收藏於：League of Nations Archives, Geneva. “Technical Collaboration with Chinese Government: Transit Question,” No. 50-22799-610."}, {"type": "note", "text": "87 David A. Pietz, Engineering the State: The Huai River and Reconstruction in Nationalist China, 1927-1937, Ch. 3, pp. 45-46. 李儀祉曾在柏林大學和丹斯哥大學學習，1916年回國，先後在多個部門任職，包括張謇創辦的河海工程專門學校。擔任導淮委員會總工程師後延攬了一批水利工程師，包括曾於德勒斯登頓技術學院接受水利工教育的沈怡，後來沈怡成為全國資源委員會的核心成員。來自漢諾威大學的水利工程教方修斯任導淮委員會工務處的技術問，提交淮河流域的調查報告。"}, {"type": "note", "text": "89 David A. Pietz, Engineering the State: The Huai River and Reconstruction in Nationalist China, 1927-1937, pp. 116, 120-121."}, {"type": "note", "text": "90 陶德於1940年代重返中國參與聯合國戰後救濟總署（UNRRA）的黃河水利和救災工程，因為該工程艱巨而重要，且因國共內戰不斷，以致工程時而被迫中斷，過程充滿驚險。Jonathan D. Spence（史景遷），To Change China: Western Advisers in China (New York: Penguin books, 1980, reprinted in 2002), pp. 205-216。"}, {"type": "note", "text": "88 “The First National River Hydraulic Laboratory of China,” by Li Shu-Tien and Ju Jen-Hao, JACAE, Vol. XV, No. 5, Sep., 1934, pp. 39-46."}, {"type": "note", "text": "91 “John F. Stevens,” JACAE, Dec., Vol. I, No. 4, 1920, pp. 1-2."}, {"type": "note", "text": "94 Oct. 16, 1935, Presidential Address by J. A. Fly, Engineering Society of China, Report and Proceeding, 1935-36, p. 6."}, {"type": "note", "text": "92 Philip W. Henry (Vice-President, American International Corporation), \"Cooperation Among Engineers,\" JACAE, Vol. II, No. 1, Jan., 1921, pp. 3-4."}, {"type": "note", "text": "93 Ernest P. Goodrich, “Internationalism in Engineering,” JACAE, Vol. II, No. 2, Feb., 1921, pp. 3-5. Goodrich 在 1905 年獲美國工程學會頒給 35 歲以下的年輕工程師的獎項柯靈烏（Collingwood Prize）。1910-16 年於紐約曼哈頓公共部門，此後曾在上海和南京，參與黃埔江擴充計畫，1930 年創辦交通工程師協會（Institute of Traffic Engineers），於 1930-1932 年間擔任會長。此人與中美工程師協會中 1927 年天津通訊員 R. D. Goodrich（任職河北水利委員會）為不同人。"}, {"type": "note", "text": "95 Engineering Society of China, Report and Proceeding, 1935-36, p. 7. Proceedings: World Engineering Congress, Tokyo, 1929, published by Tokyo: World Engineering Congress, 1931."}, {"type": "note", "text": "96〈中國工程學會將參加萬國工程會議〉，《申報》，1928年8月28日，第14張。〈本會在國際間之榮譽〉，《中國工程學會會務月刊》，1930年5期，頁5。"}, {"type": "note", "text": "97 S. C. Thomas Sze, “The World Engineering Congress, Tokyo, 1929” JACAE, Vol. X, No. 4, Dec., 1929, pp. 3-5. 由於中美工程師協會係以英文發行，英文誤將李書田的姓打成 Liu。照片合影的中文名字均為筆者比對，故以英文在前，中"}, {"type": "note", "text": "99 工商部咨建設委員會，〈本部提出請代出席東京會議及組織萬國動力協會中國分會議案已奉令修正通會相應咨請查照由〉，附「世界動力協會中國分會組織大綱」，1929年7月3日。中央研究院近代史研究所藏，《建設委員會檔案》，23-25-00-017-01。"}, {"type": "note", "text": "文在後呈現。"}, {"type": "note", "text": "98 Elmer A. Spery, \"Recongnition of the Engineer and the American Engineering Societies,\" JACAE, Vol. X, No. 4, Dec., 1929, p. 22."}, {"type": "note", "text": "100〈中國工程師學會二十四年度會務總報告：關於推派代表參加世界動力協會會議事項〉，《工程週刊》，第5卷第10期（1936），頁3。"}, {"type": "note", "text": "101 柯偉林探討經濟資源委員會和國聯技術顧問的技術合作對重建南京新政府的工業生產戰略和建設目標的作用，並提出南京政府時期工程專家的形成如何影響戰後台海兩岸工業建設方針的宏觀解釋。William C. Kirby, “Joint Ventures, Technology Transfer and Technocratic Organization in Nationalist China,” Republican China, 12, no. 2 (April 1987). Kirby, William C. “Engineering China: Birth of the Developmental State, 1928-37,” in Wen-hsin Yeh ed., Becoming Chinese (Berkeley: University of California Press, 2000). pp. 137-160. William C. Kirby, “Engineers and the State in Modern China,” in William P. Alford, William Kirby and Kenneth Winston, eds., Prospects for the Professions in China (Routledge Studies on Civil Society in Asia. London: Routledge, 2010), pp. 283-313."}, {"type": "note", "text": "102 Herbert Hoover, “A Tribute to the Engineers,” JACAE, Vol. XIII, No. 4, July, 1932, pp. 24-29."}, {"type": "note", "text": "103 “Why Join an Engineering Society-A Symposium,” JACAE, Vol. XVI, No. 5, Sep.-Oct., 1935, pp. 268-274."}, {"type": "note", "text": "104 這四大學會指的是：美國土木工程學會、美國礦冶工程師學會、美國機械工程師協會和美國電機工程學會。《時事月報》，第14卷第6期（1936），頁36-37。此次會議由鄭華當選會長，李書田為第一副會長，史篤培（美籍）為第二副會長。"}, {"type": "note", "text": "105《時事月報》，第16卷第6期（1937），頁33-34。"}, {"type": "note", "text": "106 “List of Members,” JACAE, Vol. XIX, No. 2, Mar.-Apr., 1938, pp. 95-102. 此外，《時事月報》，第16卷第6期（1937），頁33，提到第17屆年會會員有四百餘人，係有誤。"}, {"type": "note", "text": "107 O. J. Todd, “A Practical Educational Movement,” The China Weekly Review, Jan. 26, 1929, Reprinted in Two Decades in China, pp. 316-319."}, {"type": "note", "text": "108 Akira Iriye, Cultural Internationalism and World Order (Baltimore: The John Hopkins University Press, 1997), p. 184. Akira Iriye, “Culture and Power: International Relations as Intercultural Relations,” Diplomatic History 3, no. 3 (1979), p. 115."}, {"type": "note", "text": "109 太平洋戰爭時期美方協助中國技術人才赴美訓練，由資源委員會派遣工、礦、電業各單位之高級技術人員，分批赴美。戰後尚有「揚子江三峽計畫」和「西屋電氣公司」（Westinghouse Electric Corporation）派遣人才赴美訓練合作計畫。程玉鳳編著，《資源委員會技術人員赴美實習史料——民國三十一年會派》，上冊，（台北：國史館，1988），頁5。"}, {"type": "note", "text": "資源委員會對台電之接收（1945-1952）——以技術與人才為中心》，《中央研究院近代史研究所集刊》，第79期（2013年3月），頁87-135。1943年4月4日於美國田納西州諾克斯威爾（Knoxville Tenn.）召開了TVA區中國留美工程師第一次學術會議，由TVA負責培訓。太平洋戰爭發生後，南京政府派送人員赴美訓練，在電力方面的技術幹部主要都安排在TVA實習，像俞恩瀛、謝佩和、王平洋、蔡同璣、張光斗、孫運璿等人。這些技術人才像孫運璿等人隨國民政府來台，直接參與了台灣電力公司的接收與重建。程玉鳳編著，《資源委員會技術人員赴美實習史料——民國三十一年會派》，上冊，收錄赴美人員在TVA的照片與文字紀錄。"}, {"type": "note", "text": "110 這批赴美技術專家對戰後台灣的影響和貢獻，可參見：林蘭芳，〈戰後初期"}]}, {"id": "ch7", "title": "第七章 · 中國抗戰初期美國在華跨國企業的遭逢", "paras": [{"type": "title", "text": "第七章"}, {"type": "text", "text": "中國抗戰初期 美國在華跨國企業的遭逢"},
