由於英美兩國對於緬甸戰爭的規模始終反覆不定，以致輸油管計畫遭到多次修改。輸油管工程終於在1944年6月開工，並於1945年3月10日完工，全長1,760公里，到1945年7月為止，這道輸油管一共運輸了300萬噸汽油。雖然輸油管不像公路那樣容易受惡劣天氣干擾，它的功效依然難以令人滿意；在1945年5月達到高峰後，運油量就開始下降 $^{78}$ 。這筆資料說明了這條輸油管固為抗戰後期重要石油補給線，但也不宜過度強調它的作用。"}, {"type": "text", "text": "小結"}, {"type": "text", "text": "在1940年9月美國採取「事實的禁運」(de facto embargo)"}, {"type": "text", "text": "政策之前，日本是美國石油的大買家。油源短缺的日本石油公司被迫向美國公司或荷屬東印度群島尋求貨源，而所有針對石油的限令都可透過日本的經銷狀況反映出來。當抗日戰爭爆發時，日本的經銷商在中國接應的貨品都成了戰爭資源；此外，日本購買的美國石油，同時也包含了日本人在華北拓展銷售以及日本控制下的占領區經濟生活之所需。因此，這形成了一個獨特而諷刺的情況——日本人向美國人買石油，這些油就成了「日本油」，但緊接著日本人又轉而擠掉進口至中國占領區的美國石油。這樣通過「華北石油株式會社」的微妙操作機制，日本人壟斷了華北占領區的石油市場。美國政府忽視了美孚石油和德士谷中國分公司的抗議，因此這些美國石油公司別無選擇，只好勉強加入華北石油株式會社會以保住他們的事業。這是在美國參戰之前華北淪陷區美國石油企業遭遇的情況。"}, {"type": "text", "text": "如同學者海因里希斯（Waldo Heinrichs）所稱，在1939年至1941年之間，美國施加於日本的經濟壓迫，其效果是較小的；惟在1940年1月廢除《美日商約》以抵制日本在中國的經濟壟斷時，曾短暫生效。也就是說，美國展開了一個持續削減對日出口量的壓迫計畫，希望最終導致停止油品運送。日本在1940年末暫緩了行動，但美國仍沒有停止這項計畫的打算，反而每隔一兩個月就有新的禁運貨品列表出現。美國官方依賴這項壓迫來遏止日本的行為，但同時也擔心石油禁運會使日本狗急跳牆，奪取荷屬東印度群島的油源，這使美國政府決定不跨過這道界線。然而，禁運政策卡在石油問題上，這個關鍵性的問題暴露出一個弱點——亦即美國採取的經濟壓迫路線，看來更像一種操弄的詭計。再者，日本仍可將品質較差的廢料和燃氣湊合著用，所以美國的"}, {"type": "text", "text": "78 齊錫生，《劍拔弩張的盟友：太平洋戰爭期間的中美軍事合作關係（1941-1945）》（台北：聯經出版公司，2011），頁415。這條輸油管線的起源也可能和下述事情相關，太平洋戰爭前宋子文和國防供應公司打算在緬甸北部臘戍至昆明段鋪設輕便運輸管，以代替卡車運油。1942年10月在殼牌石油公司工程師霍爾（J. H. Hall）的協助勘查下，向蔣介石提交一份路線勘查報告，在蔣的批准下，國防供應公司向美國提交了滇緬油管的訂購清單。美國陸軍部迅速派工程部隊（Engineer Corp）人員對油管計畫進行可行性研究，經反覆測試認係可行，並請工程部隊為國防物資供應公司訂購相關器材。參見：曹嘉涵，《抗戰時期中美租借援助關係》，頁107、168。"}, {"type": "text", "text": "禁運政策只有象徵性的效果 $^{79}$ 。"}, {"type": "text", "text": "在1937年至1941年太平洋戰爭爆發以前，美國對中國市場的石油政策缺乏主動性，反映了美國對東亞政策的觀望政策。美國政府在1941年底參戰之後，美國石油公司配合政府動員，幫助中國探勘甘肅、四川和新疆偏遠地區的油田，並且擴充和改良既有油池，以作為石油戰略計畫的一部分。太平洋戰爭期間，中國油田的發展由國家資源委員會掌握，在新式機械的到來和安裝之下，中國油田計畫的成功，無庸置疑地取決於油田的運作以及是否能獲得美國的人力技術協助。此外，在石油補給問題上，一直到1943年，美國戰時石油管理局和中國國防物資供應公司之間才成立一套縝密的運作合作機制，確保了石油的供給和運輸系統的建立。即便那個時候，因為技術不足，使得中國油田開採的石油品質和產量都無法令人滿意；然而，不論如何仍激發了中國人民在面臨戰爭存亡之際，懷抱著有朝一日能實現自給自足的「石油夢」。"}, {"type": "text", "text": "二次大戰期間國民政府徹底了解到戰時石油補給的重要性，開始有創立國營石油企業的構想。日本投降後，國民政府接收了原日本人在中國占領區管理的油田和工廠，包括滿洲和台灣，台灣油礦探勘處接收了日本遺留的石油事業。國家資源委員會並和美國環球石油公司（Universal Oil Products Company）簽訂技術合作合約，美方派出技術專家到高雄煉油廠訓練專家 $^{80}$ 。二次大戰結束後，國民政府為了強化國家戰略與經濟地位，一家國有的石油企業——中國石油股份有限公司（CPC）在國家資源委員會的指導之下，於1946年6月在上海創立。中國石油公司不僅負責鑽探和煉油，並向美國的石油公司購買原油——包含美孚石油公司、德士谷公司，以及位於加州的聯合石油公司。除此之外，國家資源委員會選派技術專員，赴美孚石油公司在美國的煉油廠受訓 $^{81}$ 。甘肅油礦局更名為甘青分公司，負責督導甘肅玉門的油田和新發現的青海油田，這兩處原油年產量加總達8萬噸 $^{82}$ 。"}, {"type": "text", "text": "中美間的石油問題顯然十分複雜，尤其是在美國介入國共內戰後。儘管各界聲浪皆同意外國企業在內戰期間協助中國發展工業，但中國人自己卻不願意給任何外國企業有利的待遇，一些投資限令對中國境內的美國石油公司頗為不利。國民黨和共產黨也都十分了解石油產品的重要性，且兩者都企圖對石油產品進行國有策略的壟斷。當國民黨政府被共產黨擊敗，撤退到台灣，中國石油公司也於1949年遷往台灣，隨後成為台灣最重要的國營事業之一。同一時期中華人民共和國燃料工業部於1949年10月建立，到了1988年一家國營的燃料生產公司——中國石油天然氣集團創立，它是中華人民共和國最大的石油與天然氣整合公司，不久成為一家整合原油生產及供應商的國際能源公司。「石油夢」的完成也已不再是擺脫對進口洋油依賴或自給自足的層次，而是石化工業已與世界經濟網絡和全球化實力聯繫起來，成為能源需求與國防安全的另一種型態的博弈爭戰。"}, {"type": "text", "text": "〈国家と石油開発政策—1950-1970年台湾における中国石油公司を例に〉，"}, {"type": "text", "text": "收入：堀和生、萩原充編，《世界の工場への道》（京都：京都大學出版會，2019），第13章，頁373-399。"}, {"type": "text", "text": "79 Waldo Heinrichs, “Franklin D. Roosevelt and the Risk of War, 1939-1941,” in Akira Iriye and Warren I. Cohen, eds., American, Chinese, and Japanese, pp. 154-156."}, {"type": "text", "text": "81《資源委員會檔案》，國史館藏，典藏號003-010602-0444；典藏號003-020600-1853。"}, {"type": "text", "text": "80 顏昌晶，〈近代中國石油工業發展之研究〉，中壢：中央大學碩士論文，2000年，第4章。關於戰後台灣石油事業的啟動，最新的研究可參見：洪紹洋，"}, {"type": "text", "text": "82 孫越崎，〈記甘肅玉門石油的創建和解放〉，《西北近代工業》（蘭州：甘肅人民出版社，1989），頁174。"}, {"type": "note", "text": "2 Jonathan G. Utley, Going to War with Japan, 1937-1941 (New York: Fordham University Press, 2005), pp. 172-173; 吉田裕，《アジア·太平洋戰爭》(東京：岩波書店，2007年)，頁13-14。轉引見李朝津，〈中日戰爭與歷史反思〉，《二十一世紀》(香港：香港中文大學)，第142期（2014年4月），頁4-13。"}, {"type": "note", "text": "1 李澤彥，〈比黃金還要寶貴的石油〉，《東方雜誌》，第39卷第18號（1943年11月），頁44-46。對石油價值有「一滴油一滴血」的認識和比喻，西方則早在第一次世界大戰開始使用飛機坦克和潛艇等工業機械化戰爭中即有此一警語。"}, {"type": "note", "text": "3 Daniel Yergin, The Prize: The Epic Quest for Oil, Money, and Power (New York: Simon & Schuster, 1991), pp. 360-388. ABCD四國實際上形成對了對日本的經濟包圍。一旦美國和荷屬東印度群島不供給日本石油，日本在沒有足夠的自身儲備石油供給之下，就勢必要冒著戰爭的風險或者挑起戰爭。"}, {"type": "note", "text": "4 Irvine H. Anderson, The Standard-Vacuum Oil Company and United States East Asian Policy, 1933-1941 (Princeton, NJ: Princeton University Press, 1975)."}, {"type": "note", "text": "6 美孚真空石油公司係由紐澤西美孚公司（Standard Oil of New Jersey, present-day Exxon）與蘇康尼真空石油公司於1933年合併而來。美孚公司英文名稱標準石油公司（Standard Oil Co.），自1860年代成立之後，早於1870年代即運銷煤油到中國，獨占中國煤油市場，直到跨世紀之交開始和亞細亞石油公司激烈競爭。吳翎君，《美孚石油公司在中國，1870-1933》（上海：上海人民出版社，2017，修訂版）"}, {"type": "note", "text": "5 岩間敏，《アジア・太平洋戦争と石油：戦備・戦略・対外政策》（東京：吉川弘文館，2018）。三輪宗弘，《太平洋戦争と石油——戦略物資の軍事と経済》（東京：日本経済評論社，2004）。"}, {"type": "note", "text": "7 Sherman Cochran, “Businesses, Governments, and War in China, 1931-1949,” in Akira Iriye and Warren Cohen, eds., American, Chinese, and Japanese Perspectives on Wartime Asia, 1931-1949 (Wilmington, Del: SR, 1990), pp. 132-135."}, {"type": "note", "text": "11 Leo W. Stach, “Petroleum Exploration and Production in Western Pacific during World War II,” Bulletin of the American Association of Petroleum Geologists 31 (August 1947), pp. 1384-1403."}, {"type": "note", "text": "8 Thomas A. Breslin, \"Trouble over Oil: America, Japan, and the Oil Cartel, 1934-1935,\" Bulletin of Concerned Asian Scholars. Vol. 7, Vo. 3 (July-Sep., 1975), pp. 41-50."}, {"type": "note", "text": "9 Stephen J. Randall, United States Foreign Oil Policy Since World War I: For Profits and Security (Montreal: McGill-Queen's University Press, 2005), pp. 88-90."}, {"type": "note", "text": "12 美國政府在 1940 年 9 月以後加緊了禁運政策，政府部門對此決策的討論，詳見：FRUS, 1940, Vol. IV: The Far East: China, p. 813, FRUS, 1940, pp. 625-635, 984-992. 但是針對石油禁運的問題，1940 年 9 月以後的幾個月中則仍是混沌不明的。安德森根據美國政府的相關文件顯示，甚至在 1941 年 7 月，羅斯福總統本人僅僅提到減少對日本的石油輸出，因為「此時一旦完全切斷石油，可能加劇太平洋區域的戰爭，並危及英國和澳大利亞、紐西蘭之間的聯繫」。Irvine H. Anderson, The Standard-Vacuum Oil Company and United States East Asian Policy, pp. 175-176."}, {"type": "note", "text": "10 Dorothy Borg, The United States and the Far Eastern Crisis of 1933-1938: From the Manchurian Incident through the Initial Stage of the Undeclared Sino-Japanese War (Cambridge: Harvard University Press, 1964), pp. 539-544."}, {"type": "note", "text": "16 United Press item dated Los Angeles, Jan. 19, 1940, NA, 893.6363/222."}, {"type": "note", "text": "13 入江昭著，李响譯，《第二次世界大戰在亞洲及太平洋的起源》（北京：社會科學文獻出版社，2016），頁178-179。"}, {"type": "note", "text": "14 Tsingtao Shinpo, Jan. 26, 1940. Confidential U.S. State Department Central Files. China, 1940-1944: Internal Affairs, collected by National Archives (以下簡寫為 NA), Samuel Sokobin (American consul at Kobe), “Japanese kerosene and gasoline imports in North China from organization to control distribution and prices,” Feb. 16, 1940, NA, 893.6363/222."}, {"type": "note", "text": "15 Tsingtao's Telegram, May, 19, 1939, NA, 893.6363/210."}, {"type": "note", "text": "17 關於美孚和德士谷在中國的經銷網系統，筆者在專書中曾繪有這兩家石油公司在華經銷網圖表。可參見：吳翎君，《美孚石油公司在中國，1870-1933》，頁21、165。"}, {"type": "note", "text": "18 德士谷公司於 1902 年由喬瑟·柯利南（Joseph Cullinan）創辦。Marquis James, The Texaco Story: The First Fifty Years, 1902-1952 (New York: Texas Company, 1953)."}, {"type": "note", "text": "19 California Texas Oil Company Limited (New York) to Department of State, March 26, 1941, NA, 893.6363/244, p. 1-2."}, {"type": "note", "text": "20 California Texas Oil Company Limited (New York) to Department of State, March 26, 1941, NA, 893.6363/244, p. 3."}, {"type": "note", "text": "21 California Texas Oil Company Limited (New York) to Department of State, March 26, 1941, NA, 893.6363/244, pp. 4-6."}, {"type": "note", "text": "22 California Texas Oil Company Limited (New York) to Department of State, March 26, 1941, NA, 893.6363/244, pp. 6-8."}, {"type": "note", "text": "23 California Texas Oil Company Limited (New York) to Department of State, March 26, 1941, NA, 893.6363/244, pp. 6-8."}, {"type": "note", "text": "24 Texas Oil Company Limited (China) Ltd. Shanghai to the American Ambassador (Peking), Sep. 6, 1941, NA, 893.6363/254. For the Kōain (Asia Development Board), see John Hunter Boyle, China and Japan at War, 1937-1945: The Politics of Collaboration (Stanford, CA: Stanford University Press, 1972), pp. 160-170."}, {"type": "note", "text": "25 Tientsin Dispatches to the Peking Embassy, July 7, 1940, NA, 893.6363/232."}, {"type": "note", "text": "28 Division of Far Eastern Affairs, U.S. Department of Sates, Aug. 6, 1940, NA, 893.6363/232."}, {"type": "note", "text": "26 詳見：Li Lincoln, The Japanese Army on North China, 1937-1941, Problems of Political and Economic Control (London: Oxford University, 1975), pp. 55, 144. 27 Tientsin Dispatches to the Peking Embassy, July 7, 1940, NA, 893.6363/232."}, {"type": "note", "text": "29 Tientsin Consulate General to the Secretary of State, “Activities of the North China Petroleum Association and Japanese Competition in the Trade for Petroleum Products.” July 9, 1940, NA, 893.6363/234."}, {"type": "note", "text": "30《大阪日報》(Osaka Mainichi), March 7, 1941."}, {"type": "note", "text": "31 American consulate, Kobe, Japan, March 10, 1941, NA, 893.6363/239. Subject: \"Efforts by the Sino-Japanese Air Transportation Companies in China to Obtain Gasoline.\" 索克斌駐藩陽領總事時大量報導了日本打造鋼煤工業和擴張軍事帝國的舉動，這些報導令國務院一些人感到不安，且產生爭議。然而，正由於他對日本政情的評估，使他被調往日本神戶出任領事。在此之前索克斌在中國豐富的外交經歷如下：1919-20擔任重慶副領事，1921-24年任張家口副領事，1925年升任領事。Roy M. Melbourne, Conflict and Crises: A Foreign Service Story (Lanham, MD: University Press of America, 1993), p. 46."}, {"type": "note", "text": "33 Memorandum of Conversation, Division of Far Eastern Affairs, Department of State, Dec. 3, 1941, NA, 893.6363/261."}, {"type": "note", "text": "34 Helen Smyth, “China’s Petroleum Industry,” Far Eastern Survey 15 (June, 1946), p. 189."}, {"type": "note", "text": "35 Japan Weekly Chronicle (Kobe), May 23, 1940."}, {"type": "note", "text": "32 Richard P. Butrick (Counselor of Embassy in Peking) to the Secretary of State, Sep. 4, 1941, NA, 893.6363/253."}, {"type": "note", "text": "36 Voluntary Report, subject: Importation on petroleum prospecting and discovered in Manchuria. Prepared by A. Bland Calder, Assistant Commercial Attaché, July 9, 1940, NA, 893.6363 Manchuria/318. 滿洲國總務長官星野直樹是策劃對中國東北實行經濟侵略的重要人物，他策劃成立了由日本人控制的滿洲國中央銀行，全面控制滿洲金融命脈，並鼓動日本國內財閥到東北投資。"}, {"type": "note", "text": "37 U.S. Foreign Service, American Consulate, Darien, May 12, 1941, NA, 893.6363 Manchuria/319."}, {"type": "note", "text": "39 U.S. Embassy (Chungking) to the Secretary of State, April 29, 1941, NA, 893.6363/241."}, {"type": "note", "text": "40 Helen Smyth, \"China's Petroleum Industry,\" pp. 187-190."}, {"type": "note", "text": "38 申力生主編，《中國石油志》（台北：中國石油公司，1976），pp. 901-902."}, {"type": "note", "text": "41 U.S. Embassy (Chungking) to Secretary of State, 29 Apr., 1941, NA, 893.6363/241. 這些報告雖是1941年，但回溯了1930年代中國的礦業法規定。"}, {"type": "note", "text": "42 Department of State, Memo of Conversation, 23 Nov., 1943, NA, 893.6363/299."}, {"type": "note", "text": "43 1935年間，美國商人阿爾脫鍾斯曾多次申請勘探甘肅、新疆、陝西、四川等地的油礦，並願出資至少一千五百萬美金，但均被國防設計委員會以種種理由駁回。皇甫秋實、賈欽涵，〈顧維鈞與中國西北石油開發〉，《復旦學報（社會科學版）》2017年第1期，頁74。"}, {"type": "note", "text": "44 皇甫秋實、賈欽涵，〈顧維鈞與中國西北石油開發〉，頁71-79。顧維鈞通過加拿大友人何生（Harry Hussey）積極與美孚石油公司接洽合作，委派美國地質學家韋勒和蘇頓前往中國西北勘探油田。這一開採西北油田的事業，到了1938年由經濟部收回，當時也僅止於探勘油田階段，未曾實際開發。"}, {"type": "note", "text": "45 Department of State, Memo of Conversation, 23 Nov., 1943, with Enclosure: Memo of Standard-Vacuum, 19 Nov., 1943, NA, 893.6363/299."}, {"type": "note", "text": "46 詳見：張力，〈陝甘地區的石油工業（1903-1949）〉，收錄於中央研究院近代史研究所編，《中國現代化論文集》（台北：中央研究院近代史研究所，1991"}, {"type": "note", "text": "年3月），頁477-505。"}, {"type": "note", "text": "「陰謀論」說，並不可靠。最主要原因是美孚當時急於在亞洲各地區發挖油田，以配合其打造鑽井、煉油、經營與銷售等垂直多層的一體化跨國企業王國。詳見：吳翎君，《美孚石油公司在中國》，第3章〈與中國政府的合作〉，頁84-110。"}, {"type": "note", "text": "47 U.S. Embassy (Chungking) to Secretary of State, 29 Apr., 1941, NA, 893.6363/241. 48 U.S. Embassy (Chungking) to Secretary of State, 29 Apr., 1941, NA, 893.6363/241."}, {"type": "note", "text": "49 1932年西安綏靖公署駐京辦事處處長胡逸民向實業部呈請改良及擴充陝北延長油礦，指出過去延長油礦未能發展的種種原因，包括交通運輸困難、缺乏中外技術專家、不能充分購得各項機器、無充分兵力保護開採礦務之進行等因素之外，甚至指責美孚石油公司「恐此礦油開發，將盡奪美油之營業」，故美孚蓄意開採不力。《西北文化日報》，1932年5月11日，頁3。筆者認為"}, {"type": "note", "text": "50 張力，〈陝甘地區的石油工業（1903-1949）〉，頁490-491。"}, {"type": "note", "text": "51 王晉林，〈抗日戰爭時期陝甘寧區的石油工業〉，《中國石油大學學報》，第3期，2012年6月，18卷，頁74-79。該文認為抗戰時期陝甘寧邊區石油工業的建立和發展為抗戰勝利創造物質基礎，也對戰後新中國石油工業的建設和發展有重要貢獻。但筆者從該文作者整理的石油產量提到1940年原油產出3,859桶，1941年為12,437桶。1940年汽油產出188桶，1941年為953桶（1"}, {"type": "note", "text": "桶12.5公斤）。從這項數據，筆者以為，陝甘寧邊區的石油是有增加，然若和國民政府1940-1941在非占領區的進口石油量總數（表8-3）之需求相比，可看出陝甘寧邊區產出石油量對抗戰時期中國的需求和消耗量而言，乃極其微少之數。1加侖等於3.785公升。"}, {"type": "note", "text": "52 U.S. Embassy (Chungking) to Secretary of State, 29 Apr., 1941, NA, 893.6363/241."}, {"type": "note", "text": "53 Hammond的薪水由美國雇主「國營石油供應公司」（the National Supply Company）支付，派遣他到中國來，是希望中國的公司能及時發現石油的商業利益，並成為購買美國公司產品的重要代理人。NA, 893.6363/228."}, {"type": "note", "text": "54 Smyth, “China’s Petroleum Industry,” p. 190. 太平洋戰爭前，國民政府曾嘗試取回新疆，但未果。1942年，新疆總督盛世才和蘇聯關係絕裂，並和國民政府展開諒解。1944年盛世才被任命為農林部長，國民政府勢力復進入新疆。高素蘭，〈戰時國民政府勢力進入新疆始末（1942-1944）〉，《國史館館刊》，第17期（2008），頁129-165。"}, {"type": "note", "text": "55 The China Handbook: 1937-1943, A Comprehensive Survey of Major Developments in China in Six Years of War (New York: Macmillan, 1943), p. 484."}, {"type": "note", "text": "56 U.S. Embassy (Chungking, Nelson Trusler Johnson) to Secretary of State, 4 Dec., 1940, Subject: Gasoline imports into Free China, NA, 893.6363/237."}, {"type": "note", "text": "57 U.S. Embassy (Chungking, Nelson Trusler Johnson) to Secretary of State, 4 Dec., 1940, Subject: Gasoline imports into Free China, NA, 893.6363/237."}, {"type": "note", "text": "58 Embassy of the United States of America (Chungking) to the Secretary of State, April 29, 1941, NA, 893.6363/241. Foreign Trade Office of National Resources, Chinese Government, New York Brand, 1941 June 11th, K. Y. Yin's (Yin Zhongrong) summary for the article by Leo W. Stach, \"Petroleum exploration and production in western Pacific during World War II.\" 函呈卡森 (Lester M. Carson) 著中國石油問題一文。〈緬甸汽油產量及荷印石油產額報告〉，資源委員會檔案，國史館藏，典藏號003-010306-0020。本章表8-3資料亦為其中一項。 59 U.S. Embassy (Chungking) to Secretary of State, 28 May, 1942, NA, 893.6363/268."}, {"type": "note", "text": "60〈甘油礦局、軍政部購美孚行油池〉，國家發展委員會檔案管理局藏，《外交部檔案》，A303000000B/0031/432.4/0002。頁4-5。"}, {"type": "note", "text": "61 U.S. Embassy (Chungking) to Secretary of State, 15 Apr., 1943, NA, 893.6363/280；國史館藏，《資源委員會檔案》，003-0207000-605。"}, {"type": "note", "text": "62 H. K. Fenn (Office of Censorship, Chief Cable Censor, U.S.A.) to George A. Gordon (Acting Chief, Division of Foreign Activity Correlation, Department of State), 26 Apr., 1943, NA, 893.6363/284-1/2."}, {"type": "note", "text": "65〈甘油礦局、軍政部購美孚行油池〉，國家發展委員會檔案管理局藏，《外交部檔案》，A303000000B/0031/432.4/0002。必須說明的是：油礦局和美孚公司的價購合同，係有5座油池，後來因2座由油礦局拆用，但原訂讓購合同並未變更，其餘3座乃轉行撥讓於美軍。"}, {"type": "note", "text": "63〈甘油礦局、軍政部購美孚行油池〉，國家發展委員會檔案管理局藏，《外交部檔案》，A303000000B/0031/432.4/0002。事由：轉送美孚洋行讓售長沙、湘潭、衡陽三地草訂合約五份請完成簽印手續後分別提送還由。U.S. Embassy (Chungking) to Secretary of State, 11 June, 1943, Enclosure: Chinese version of this agreement, NA, 893.6363/288."}, {"type": "note", "text": "66 U.S. Embassy (Chungking) to Secretary of State, 31 July, 1943, NA, 893.6363/290."}, {"type": "note", "text": "67 U.S. Embassy (Chungking) to Secretary of State, 15 Oct., 1943, NA, 893.6363/298."}, {"type": "note", "text": "64 U.S. Embassy (Chungking) to Secretary of State, 24 May, 1943, NA, 893.6363/286."}, {"type": "note", "text": "68 Department of State, Memo of Conversation, 23 Nov., 1943, Enclosure: Memo of Standard-Vacuum, 19 Nov., 1943, NA, 893.6363/299. 很可惜的是報告中，並未引用數據說明。"}, {"type": "note", "text": "69 Letter of J. H. Thacher, Jr. (Executive Secretary, Foreign Petroleum Committee) to Joseph W. Ballantine inviting him to be a committee member of the Chinese Petroleum Committee, 15 May, 1943, NA, 893.6363/284; George A. Gordon to H. K. Fenn, 8 May, 1943, NA, 893.6363/284-1/2."}, {"type": "note", "text": "70 1941年3月美國國會通過「租借法案」，授權美國總統可決定哪些國家為反法西斯侵略國家，而予以提供物資和勞務方面的援助。中國也名列34個反侵略國家之一，根據這項法案，蔣介石立即指派宋子文代表中國，和美國接洽一切有關軍備物資事宜，因而有「中國國防物資供應公司」的成立。這是間登記在法律顧問柯科倫（Thomas G. Corcoran）所成立的一間特許公司，柯科倫曾是羅斯福總統「新政」時期重要的法律顧問，時已離開政府部門，可說是美國最早一批所謂對華政策的院外集團（Lobbist）。詳見：曹嘉涵，《抗戰時期中美租借援助關係》（上海：東方出版中心，2015），頁75-127。"}, {"type": "note", "text": "72 張力，〈陝甘地區的石油工業（1903-1949）〉，頁497。"}, {"type": "note", "text": "71 Memo for Ralph K. Davies (Deputy Petroleum Administration), 5 May, 1943, NA, 893.6363/284."}, {"type": "note", "text": "73 楊雨青，〈宋子文與中國國防物資供應公司〉，《抗日戰爭研究》，2006年第4期，頁121。"}, {"type": "note", "text": "74 國防供應公司董事長宋子文於 1941 年 12 月繼任外交部長，隨即以外交部長身分交涉英美援華借款等外交交涉。1944 年夏，駐美大使魏道明接管了國防供"}, {"type": "note", "text": "應公司，該年7月1日新成立的「中國物資供應委員會」取代了國防供應公司的所有業務。「中國物資供應委員會」由駐美大使魏道明出任委員會主席，下設航空、軍火、工礦、公共衛生、交通通訊、電影部等。楊雨青，《美援為何無效——戰時中國經濟危機中美應對之策》（北京：人民出版社，2011）。"}, {"type": "note", "text": "75 戰時生產局成立後，駐美大使兼任的「中國物資供應委員會」成為聯繫的平台，並不直接參與採購清單。曹嘉涵，《抗戰時期中美租借援助關係》，頁180。林美莉，《戰時生產局的成立與活動——以租界法案的配合為中心》，《國史館館刊》，復刊第15期（1993年12月），頁165-183。"}, {"type": "note", "text": "76 Helen Smyth, \"China's Petroleum Industry,\" p. 190."}, {"type": "note", "text": "77 Arthur N. Young, China and the Helping Hand, 1937-1945 (Cambridge, Mass.: Harvard University Press, 1963), pp. 206-214."}, {"type": "note", "text": "78 齊錫生，《劍拔弩張的盟友：太平洋戰爭期間的中美軍事合作關係（1941-1945）》（台北：聯經出版公司，2011），頁415。這條輸油管線的起源也可能和下述事情相關，太平洋戰爭前宋子文和國防供應公司打算在緬甸北部臘戍至昆明段鋪設輕便運輸管，以代替卡車運油。1942年10月在殼牌石油公司工程師霍爾（J. H. Hall）的協助勘查下，向蔣介石提交一份路線勘查報告，在蔣的批准下，國防供應公司向美國提交了滇緬油管的訂購清單。美國陸軍部迅速派工程部隊（Engineer Corp）人員對油管計畫進行可行性研究，經反覆測試認係可行，並請工程部隊為國防物資供應公司訂購相關器材。參見：曹嘉涵，《抗戰時期中美租借援助關係》，頁107、168。"}, {"type": "note", "text": "〈国家と石油開発政策—1950-1970年台湾における中国石油公司を例に〉，"}, {"type": "note", "text": "收入：堀和生、萩原充編，《世界の工場への道》（京都：京都大學出版會，2019），第13章，頁373-399。"}, {"type": "note", "text": "79 Waldo Heinrichs, “Franklin D. Roosevelt and the Risk of War, 1939-1941,” in Akira Iriye and Warren I. Cohen, eds., American, Chinese, and Japanese, pp. 154-156."}, {"type": "note", "text": "81《資源委員會檔案》，國史館藏，典藏號003-010602-0444；典藏號003-020600-1853。"}, {"type": "note", "text": "80 顏昌晶，〈近代中國石油工業發展之研究〉，中壢：中央大學碩士論文，2000年，第4章。關於戰後台灣石油事業的啟動，最新的研究可參見：洪紹洋，"}, {"type": "note", "text": "82 孫越崎，〈記甘肅玉門石油的創建和解放〉，《西北近代工業》（蘭州：甘肅人民出版社，1989），頁174。"}]}, {"id": "ch9", "title": "第九章 · 戰後中美新經濟關係的建立", "paras": [{"type": "title", "text": "第九章"}, {"type": "text", "text": "戰後中美新經濟關係的建立"}, {"type": "text", "text": "1946年《中美商約》"}, {"type": "text", "text": "20世紀在很大程度上必須是一個美國世紀……隨著美國精力旺盛地登上世界舞台，我們首先要做的是尋求和呈現一種作為世界強國的美國式眼光，我們需要的是呈現這樣一種想像力……它將指引我們去創造一個正宗的20世紀——我們的世紀。"}, {"type": "text", "text": "——《時代雜誌》創辦人亨利·魯斯（Henry Luce），〈美國世紀〉，1941"}, {"type": "text", "text": "前言"}, {"type": "text", "text": "1945年8月15日（日本時間），昭和天皇向全國廣播了「終戰詔書」，意味著第二次世界大戰亞洲戰事正式結束。戰爭焦土時期美國在華多數企業或關閉或撤退，隨著戰爭結束，美國大企業急欲重返中國市場，並希望在戰後新秩序中保護既有的投資和貿易等商業權益。二次大戰後簽訂的《中美商約》，隨著美國在華領事裁判權等條約權利的消失，標誌著一個新時代中美關係的來臨。當時《紐約時報》（New York Times）讚揚這是戰後中美兩國訂定的第一個互惠友善的條約，基於平等互惠（reciprocity）和最惠國待遇（most favored-national treatment）的原則，展現了美國對華門戶開放政策的一種修正 $^{1}$ 。"}, {"type": "text", "text": "1946年11月4日，《中美友好通商航海條約》（Sino-American Treaty of Friendship, Commerce and Navigation，以下簡稱《中美商約》）簽訂。它是根據1943年《中美關於取消美國在華治外法權及處理有關問題條約》（以下簡稱《中美平等新約》）第7條規定：中美商約應在戰爭結束6個月後進行談判。根據1946年《中美商約》第29條第1款：「本約一經生效，應即替代（supersede）中華民國與美利堅合眾間下列條約中尚未廢止（terminate）之各條款」，共有9項條約 $^{2}$ 。第2款，說明該約中任何規定，不得解釋為對於1943年所簽訂的「關於取消美國在華治外法權及處理有關問題條約及所附換文所給予之權利、優例及優惠，加以任何限制」。因此，從條約精神而言，《中美商約》一方面是1943年《中美平等新約》的延續和實踐；另一方面它是替代《望廈條約》以來有關中美通商航海的相關條約。"}, {"type": "text", "text": "然而，商約內容公布之後，引起輿論諸多討論。金融界、航業界、工商界及經濟學者，褒貶不一。商約簽訂日不久，國民大會在國共談判僵局中即將登場（11月12日），中共抨擊此約無異於「廿一條要求」之國恥，主張立即廢約。蘇聯《真理報》（Pravda）則與中共唱和，指控商約將使中國攀附美國強權之下，讓美國披著援助中國戰後復原的外衣，全面染指中國經濟，使中國倒退至「半殖民」的激烈言論 $^{3}$ 。1948年11月30日，該約生效的同時，國共形勢已見逆轉，與之相應的則是美、蘇兩大強權帶領的不同意識形態陣營也已壁壘分明。此後中華人民共和國成立，不承認「美蔣賣國商約」，美國經貿勢力亦伴隨美國對華政策撤離中國市場。"}, {"type": "text", "text": "關於 1946 年商約的研究成果中英文均相當豐富，中文著作主要為辯證商約為形式上的平等或實質意義的不平等，受限於政治意識形態居多 $^{4}$ 。西方學界早期對《中美商約》的探討亦呈現冷戰思維下資本主義和社會主義兩大陣營國家相互敵視的情結，1980年代以後的研究視角逐漸擴大到戰後中美兩國對市場經濟理念的歧異與政府政策的制定，而始有突破口。相關研究均指出戰後美國期待中國市場自由化的想法，適與傾向建立計畫經濟的國民黨政府背道而馳；對美國而言，在放棄治外法權之後，一種新的中國與世界經濟交往的基礎必須在條約關係中加以解決，對中國而言，它反映國民黨政府如何想有效利用外資，幫助完成其國家政策的特定目標 $^{5}$ 。"}, {"type": "text", "text": "（中美天津條約續增條約）；五、1880年（光緒6），中美續修條約；六、1880年（光緒6），中美續約附款；七、1903年（光緒29），中美續議通商行船條約；八、1920年（民國9），在華盛頓簽訂之修改通商進口稅則補約；九、1928年（民國17），中美兩國關稅關係之條約。"}, {"type": "text", "text": "1 Bertram D. Hulen, \"U.S.-China Treaty Of 'Mutual' Trade and Amity Signed,\" New York Times, Nov. 4, 1946. Henry R. Lieberman, \"China Pact Shows Open Door Change,\" New York Times, Nov. 5, 1946."}, {"type": "text", "text": "2 九項條約如下：一、1844年（道光24），中美望廈條約（或稱中美五口貿易章程）；二、1858年（咸豐8），中美天津條約；三、1858年（咸豐8），中美上海條約（中美通商章程善後條約）；四、1868年（同治7），中美續增條約"}, {"type": "text", "text": "3 “Soviet Writer Denounces U.S.-China Treaty; Declares Our Aim Is Economic Domination”, New York Times, Dec. 20, 1946. M. E. Orlean, “The Sino-American Commercial Treaty of 1946,” The Far Eastern Quarterly, 7.4 (Aug., 1948): 354-367. 針對中共所宣稱1946年商約為國恥，以及蘇聯《真理報》刊出署名Markov的一篇激烈抨擊商約的專論，奧爾蘭（M. E. Orlean）就條約內容逐一加以反駁。"}, {"type": "text", "text": "對於 1946 年《中美商約》的考察，在戰後國共關係的激化對立及政治情勢的遽變之下，黨派歧見掩蓋了實質內容和歷史意義的討論。迄今關於中美談判經過、中美雙方立場，乃至於戰後中美經貿關係的研究，如上所述已有相當的成果；然而對於戰後商約的重要性及其歷史意義的命題，則仍缺乏較全面的論述。本章將以戰後美商急欲重返中國市場之呼籲作為討論的起點，探討中美兩國談判時的交鋒與妥協，最後從條約權益、經濟立法與近代中國的國際化視角，重探戰後《中美商約》的歷史意義。"}, {"type": "text", "text": "一、渴望重返中國市場的美國企業與商約之提出"}, {"type": "text", "text": "根據1943年1月11日《中美關於取消美國在華治外法權及處理有關問題條約》（以下簡稱《中美平等新約》）第7條規定：《中美商約》應在戰爭結束6個月後進行談判。約文並說明「將以現代國際程序與中國政府及美國政府近年來與他國政府所締結之近代條約中，所表現之國際公法原則與國際慣例為根據」 $^{6}$ 。然而對日戰爭何時結束猶未可知，關於商約的非正式磋商即已開展。該年2月美國遠東司司長漢密爾頓（Maxwell M. Hamilton）和中國外交部長宋子文針對原則問題交換意見 $^{7}$ 。"}, {"type": "text", "text": "4 中文成果以大陸學者的研究居多。任東來根據南京第二歷史檔案館所藏外交文件，最早撰寫〈試論1946年中美友好通商航海條約〉《中共黨史研究》，4（北京，1989年），頁20。其他主要研究有：陶文釗，〈1946年中美商約：戰後美國對華政策經濟因素個案研究〉，《近代史研究》（北京），1993年第2期，頁237-258。王建朗，《中國廢除不平等條約的歷程》（江西：江西人民出版社，2000年），頁356-360。李育民，《中國廢約史》（北京：中華書局，2005年），頁959-970。"}, {"type": "text", "text": "5 Robert R. Wilson, “Postwar Commercial Treaties of the United States,” The American Journal of International Law (Cambridge: Cambridge University Press), Vol. 43, No. 2 (Apr., 1949), pp. 262-287. 從國際法的視角比較了戰後《中美商約》和美國與其他各國（主要是義大利）所簽訂的商約內容及歷史脈絡，強調戰後商約基於平等和不歧視原則等現代國際法原則，不論如何比起戰前的條約更加完善，文末寄望美國所領導下的聯合國組織以及各國通力合作，消弭國際間自由貿易的障礙。Julia Fukuda Cosgrove, Unites Foreign Economic Policy Toward China, 1943-1946: From the End of Extraterritoriality to the Sino-American Commercial Treaty of 1946 (New York & London: Garland Publishing, Inc. Inc., 1987), Ch. 6, pp. 166-203. 作者從美國戰後對華經貿政策的形成，以及美國企業界對中國廣大「自由市場」的殷切期待；甚至舉證馬歇爾使華時拿美援作文章，要求國民黨政府儘快批准商約一事，論析美國朝野對中國市"}, {"type": "text", "text": "場的一致需求。魏楚雄從中國國家主義（nationalism）與美國經濟自由主義（economic liberalism）之間的緊張關係探索《中美商約》的交涉，特別針對1943年治外法權消失後，外人在中國必須遵守中國政府的立法，而美國本身亦有為促進美商來華貿易的《1922年對華貿易法案》，雙方對於戰後中國市場的期待與經濟理念各有不同，因此，美商在中國註冊為「外國公司」的立法問題，在1943-1946年間的中美政治經濟關係中變得敏感而尖銳。C. X. George Wei, Sino-American Economic Relations, 1944-1949 (Westport, CT and London: Greenwood Press, 1997). William C. Kirby, “China Unincorporated: Company Law and Business Enterprise in Twentieth-Century China,” The Journal of Asian Studies, 54.1 (Feb., 1995): 43-63."}, {"type": "text", "text": "6 世界知識出版社編，《中美關係資料彙編》，下冊（北京：世界知識出版社，"}, {"type": "text", "text": "由於《中美》、《中英平等新約》同樣列有簽訂商約的規定，美國法律顧問專家韋羅貝（Woodbury Willoughby）領導的「商業政策和合約處」（Division of Commercial Policy and Agreement）乃與英國駐美使館首席祕書海特（W. G. Hayter）等人針對商約內容交換意見，英國方面表示戰後局勢仍不明朗而有所保留，他們認為如果太早簽訂商約，是否會和聯合國規劃的穩定國際貨幣的相關組織有所牴觸。同時他們也擔心戰後商約可能和英美大憲章宣言（1941年8月14日）、聯合國宣言（1942年1月1日）和對華租界法案（1942年6月2日）第7款的規定有所衝突 $^{8}$ 。美國各部會很早就啟動商約談判，而《中英商約》的交涉則是一波三折，雙方歧見頗深，最後又卡在香港問題而最後未能簽訂 $^{9}$ 。"}, {"type": "text", "text": "《中美平等新約》簽訂後，儘管對日戰爭仍在進行，但對於廢除治外法權後，如何確保美國在華的工商利益，已為美國朝野所關注。美國工商團體早在《中美平等新約》簽訂前後，已開始籌劃如何重返中國市場，經過與中美兩國政府官員和工商人士的一系列洽商，1943年10月1日中美工商業協進會（China-American Council of Commerce & Industry）成立於紐約。首任理事會主席為國際商用機器公司總經理沃森（Thomas J. Watson），會長為美國前商務部次長柏德生（Richard C. Patterson Jr.）。中美工商業協進會是一個由美國各個行業的私營工商企業自發組織的非營利性組織，最初由36家在華從事經貿活動的企業創立，在短短三年之內，其會員就發展到近400家美國公司 $^{10}$ 。他們的行業遍及美國主要城市，涵括銀行業、進出口商、製作商、工程建築和承包商、保險公司、海空運大公司等等領域。赫赫知名的跨國大企業更是動見觀瞻，諸如：花旗銀行、大通銀行、美孚公司、國際商用機器公司、英美煙公司、發施登汽車輪胎公司、可口可樂公司、柯達公司、泛美航空公司、波音公司、《時代》週刊社等。該會總部設在紐約，在華盛頓設有辦事處，以便與政府有關部門聯繫，在新英格蘭、中西部和舊金山、西雅圖、波特蘭等地設有地區委員會 $^{11}$ 。"}, {"type": "text", "text": "1943年底，美國駐華大使高思就中國戰時經濟政策和戰後經濟計畫的發展向國務院建議，愈早談判對美國愈有利。美國對外貿易協會和中美工商業協進會為重建戰後在華市場優勢，高度關注國民政府當時正起草的「公司法」，並遊說美國政府出面反對該法草案對外國人在中國設立分公司做出限制的規定——只有確實在其本國營業的公司，才可以在中國設立分公司。美方極力反對中國「公司法」中有關外國公司必須在其本國「營業」的限制，其原因可追溯自1922年的美國「對華貿易法」的頒布。此一法案係美國聯邦政府為鼓勵美商來華投資而專為在中國營業的美國公司所專門設立的，其基本內容是特准美國公民依照此一法案，在美國本土向聯邦政府登記在法律上作為美國的國內公司，但總、分公司都設在中國境內，亦即不必在美國境內有營業的事實而專門在中國營業的美國公司，可享有美國聯邦政府豁免稅捐的一些優惠待遇 $^{12}$ 。當時國民政府正在起草的「公司法」中有關外國公司在華營業的規定，肯定對這一些依據美國《對華貿易法案》而設置的美國公司，造成最大的利益衝突。"}, {"type": "text", "text": "1957年），頁541。"}, {"type": "text", "text": "7 Memorandum of Conversation, by the Chief of Division of Far Eastern Affairs, Feb. 23, 1943. Papers Relating to the Foreign Relations of the United States, Washington, D. C.: Government Printing Office (以下簡稱 FRUS), 1943, p. 710."}, {"type": "text", "text": "8 Memorandum of Conversation, by Woodbury Willoughby of the Division of Commercial Policy and Agreement, May 7, 1943, FRUS, 1943, pp. 712-713."}, {"type": "text", "text": "9 1943年平等新約簽訂之後，最初英國並不熱中隨即交涉商約草案，認為可以稍待時日再談，但在美國展開談判後，英國也開始關注此一議題。《中英商約》最後未能簽訂，相關研究成果並不多。馮琳，〈二戰後「中英商約」交涉失敗之研究〉，《近代中國研究》，2011年11月14日。（北京：中國社會科學院近代史研究所）。http://jds.cass.cn/Item/21913.aspx"}, {"type": "text", "text": "10 皇甫秋實，〈中美工商業協進會與戰後中美經濟關係〉，《中國經濟史研究》2018年第5期，第30-45頁。"}, {"type": "text", "text": "11 Directory of the China-America Council of Commerce and Industry. A Guide to Nearly 400 American Companies Interested in Developing Trade Between China and the USA, p. 6, 陶文釗,〈1946年《中美商約》: 戰後美國對華政策中經濟因素個案研究〉,《近代史研究》(北京), 1993年第2期,頁237-258。但該文提到中美工商業協進會創立成員為26間為筆誤,據查應為36間。"}, {"type": "text", "text": "戰後商約的簽訂，不僅受到美國跨國大財團的關注，因「美國對華法案」而設置的公司，更是關注其未來可否持續獲得美國政府減稅的權益。根據1946年一份在上海的美國企業資料，大約有282間的美國企業和團體登錄，包括像美孚真空、大來公司等大資本家、進出口企業（有的並非是對華貿易而成立）或是因對華法案而成立的專屬對華貿易公司，另有少數教會或文化教育團體。其中因《對華貿易法案》而在上海成立的公司已較1928年登錄的14間，增加到40間。除了1920年代以後持續增加的動力汽車進口、房地產、零件進出口等行業，這40間「對華法案」公司營業項目還包括了影片、無線電訊、煙草、皮革業、汽水、藥妝品等消費服務商品（表4-4；附錄9-1），而這僅僅是上海一地的情況 $^{13}$ 。因而美商很早就關注如何在戰後簽訂的商約中保護他們的利益。"}, {"type": "text", "text": "《中美商約》洽談之際（1946年3月）中美工商業協進會任命了熟悉對華經濟和法律事務的施芳蘭（Addie Viola Smith）在上海設立中國總部，她曾任美國駐滬商務專員（Trade Commissioner in Shanghai）、上海美國駐華法院的事務律師（solicitor），並早在1923年就擔任了美國《對華貿易法案》的註冊官（China Trade Act Registrar），是第一位被美國政府任命擔任對外貿易事務的女性，具二十餘年在中國從事商務交涉和商事訴訟的豐富經歷。施芳蘭的雀屏中選，來華籌備中美工商業協進會在上海的總部，也意味著美國企業對《中美商約》中討論的外國公司在華地位及其商務利害關係的深刻重視 $^{14}$ 。"}, {"type": "text", "text": "13 Americans and American Firms in China, Directory, published by the Shanghai Evening Bost & Fhexcurg, 1946。上海市檔案館藏，編號 W1-OF-91。"}, {"type": "text", "text": "14 施芳蘭（Addie Viola Smith, 1893-1975），1920年10月奉派至北京協助美國駐北京商務專員。在此之前，她曾短暫任職美國勞工部。1922年被拔擢為美國駐上海助理商務專員，1928年再升任為商務專員。1923年1月英文報紙即提到她擔任美國對華法案註冊官，見：American Chamber Sends Delegation to Visit Nanking, The Weekly Review (1922-1923); Jan. 27, 1923。1934年任職於上海公共租界美領館內的「美國駐華法院」（United States Court for China）。她在1930年代活躍於上海社交圈，是上海美國婦女俱樂部（American Woman Club）和城市俱樂部（City Club）會員，《密勒氏評論報》在報導上海的婦女活動和駐華法院訊息中常可見到她的相關報導。1942年返回華府，任美國政府經濟專家顧問，後來並且參與中美工商協進會。1950-60年代初期，積極參與國際婦女法學會（International Federation of Women Lawyers）。Alexandra Epstein, “International Feminism and Empire Building between the Wars: the case of Viola Smith,” Woman's History Review, 2008, Vol. 17, No. 5, pp. 699-719."}, {"type": "text", "text": "12 有關美國《對華貿易法案》，詳見本書第四章。"}, {"type": "text", "text": "第二次大戰結束前，1945年4月2日駐重慶美國使館將商約草案30條遞交國民政府，但國民政府對於此事並不如美方急迫，甚至表示將在4月25日-6月26日於舊金山召開的聯合國國際組織會議結束後才會討論此事 $^{15}$ 。此次舊金山與會的中國代表暨國防最高委員會祕書長王寵惠、中國代表團技術顧問（暨條約司司長）王化成、代表團法律顧問吳經熊均與美方有所接觸，前兩者表示尚未細看過商約草案無法表示意見，而吳經熊則關注中國人民在美國是否能享有房地產投資等互惠原則 $^{16}$ 。至6月13日外交部長宋子文始通知美方將任命駐美大使館商務參贊李幹在華盛頓和美方展開先期談判 $^{17}$ 。"}, {"type": "text", "text": "美國政府對於戰後儘速簽定一份商約以促進美商在中國的發展有熱切的期待。商務政策處在國務院的同意下，敦促來華調停國共談判的馬歇爾將軍直接向蔣介石要求儘速討論商約草案，以保障取消治外法權後美國人在中國的利益 $^{18}$ 。在一份美國國務院的法律顧問團與韋羅貝針對商約草案提出的意見中，反映美國意識到一旦取消在華治外法權後，中國的經濟和制度相對落後，外人在華的權益如果牽就於中國的國內法，勢必無法保障美國人的利益，因此，美方提出的整體意見如下："}, {"type": "text", "text": "一、關於國民待遇（National Treatment） $^{19}$ ：兩國間的國民待遇原則應基於對雙方國民的互惠和保護而產生的更大利益，並以此作為達成未來國際交流自由化的起點。但是由於中美兩國在政治經濟的結構差異太大，名義上互惠卻不切實際的「國民待遇」和「無條件最惠國」條款，很難在兩國目前的狀態中獲得滿意的表述。因此，美國提出關於國民待遇的條款肯定遭到批評。"}, {"type": "text", "text": "二、草約的弱點在於過度表述美國對世界各國的經濟政策原則，但中國一點都不適用美國和其他各國所簽商約的標準條款文句。目前草案無法解決戰後美國對華貿易的重要問題，商約草案內容將會因中國沒有相應的國內立法而導致延宕。他們也特別提到中國明顯正朝向計畫型經濟國家的發展趨勢，這種趨勢將削弱國民待遇原則的益處。此外，鑑於中國國內日正茁壯的極端民族主義（ultra-nationalism）和仇外主義（anti-foreignism），因此有必要從條約內容更加保護美國人的利益 $^{20}$ 。"}, {"type": "text", "text": "15 Memorandum by the Associate Chief of the Division of Commercial Policy (Willoughby) to the Assistant Secretary of State (Acheson), Apr. 5, 1945, FRUS, 1945, China, p. 1314."}, {"type": "text", "text": "19 國民待遇是國際法中重要的原則，國家准許外國人入境後，外國人就和當地國的人民一樣在其管轄之下有權利也有義務，但許多國家對外國人的權利與義務也有特別規定。一般而言，國民待遇指一國給予外國公民、企業、船舶在民事方面與本國公民、企業、船舶所享有的同等待遇，通常以國民待遇條款的形式列入貿易條約。國民待遇是當今許多世界貿易組織協議的一個組成部分。再如：當地國可以限制外國人從事某種業務；不得強迫外國人服兵役，除非外國人的本國同意，亦是國民待遇的一般內容。參見：https://en.wikipedia.org/wiki/National\\_treatment（下載時間2018/12/24）。丘宏達，《現代國際法》（台北：三民書局，2000），頁736-737。"}, {"type": "text", "text": "16 Memorandum of Conversation, by the Deputy Director of the Office of Far Eastern Affairs (Stanton). San Francisco, May 29, 1945, FRUS, 1945, China, p. 1316. May 30, 1945, FRUS, 1945, China, p. 1317."}, {"type": "text", "text": "17 The Acting Secretary of State to the Ambassador in China(Hurley), June 18, 1945, FRUS, 1945, China, p. 1318."}, {"type": "text", "text": "18 Memorandum to General of the Army George C. Marshall, Special Representative of President Truman to China, Nov. 30, 1945, FRUS, 1945, China, p. 1325."}, {"type": "text", "text": "20 C. K. Moser to I. V. Slepak, \"Draft of the Proposed Treaty of Friendship, Commerce, and Navigation with China,\" Aug. 9, 1944, pp. 1-5. Office of the Legal Advisor: Treaty, No. 136213. Box 1. RG. 59, U.S. Department of State, National Archives II. Washington D. C."}, {"type": "text", "text": "總之，美國國務院法律顧問團認為「國民待遇原則」並不能作為美國在華權利的有效基礎。為提供美國人在華貿易的實際保護，而又能免於對所謂平等互惠原則的傷害，他們認為國際標準待遇（international standard of treatment） $^{21}$ 的一些原則精神也應被納入考量，美國有必要強調行諸於文明國家的國際性和國際法原則，如此一來亦可避免美國被指責將該國的法律標準強行推銷於中國。他們也提到將國際主義的原則推展到中國肯定被認為過於天真而被否絕，但這個商約可能是戰後美國簽訂的第一個商約，它可能建立一種新的範例，而非跟隨著過去的條約模式。例如：該文提到中國儘管於1935中華民國憲草中頒布公民權的保護，但並不及於對外國人權利。因此有必要以「國際人權法典」（international bill ofrights）來規範中國 $^{22}$ 。顯然這是擔心在治外法權取消後，外人在中國的法律地位如何受到保護的問題。"}, {"type": "text", "text": "二、條約平等互惠原則和中美談判交鋒"}, {"type": "text", "text": "1945年2月，美國國務院完成長達58頁，總計30條《中美商約》草案，並請駐華大使提出進一步修改意見，於4月向中方遞交 $^{23}$ 。1946年2月5日，《中美商約》開始談判，中方首席代表是外交部條約司司長王化成，美方首席代表是駐華使館領事羅伯特·史密司（Robert L. Smyth）。在重慶和南京前後談判了27次，直到1946年8月31日雙方才拿出議定稿，據議定稿再逐條商議。由於商約內容廣泛，涉及人民投資往來、金融交易、教育文化和移民等議題，經濟部、資源委員會、交通部、財政部、教育部、僑委會等單位，均針對相關利益有深入的見解，顯現國府技術官僚對戰後國家建設與美國政府的角色參與至為重視；特別是經濟部洞察戰後中國必須有效利用外資，由中央政府主導工商發展的主張，在商約談判中與條約司的互動最多 $^{24}$ 。"}, {"type": "text", "text": "1945年7月9日駐美使館商務參贊李幹等人銜命先期交涉的內容很能代表國民政府最初的想法。李幹表示重慶政府的兩個立場：一、堅守平等原則，廢除治外法權之後，必須立基於平等互惠關係；二、必須考慮到中國未來的經濟發展政策：任何承諾及"}, {"type": "text", "text": "21 國家對待外國人的標準，如果與本國人一樣，但低於國際標準，是否在遭受損害時，當地國仍應負責，此一問題在西方國家與亞、非、拉丁美洲國家交涉時，往往有所爭議。後者（拉美國家）以對抗帝國主義、殖民主義國家的干涉為由，較多堅持國民待遇原則，認為應以此原則決定國家是否應負國家責任；前者（西方國家）則主張國際標準（international standard），一國不能憑其國內法之規定而解除其國際責任。據丘宏達的研究，1930年國際聯盟召開的海牙國際法編纂會議時，中國曾提案對保護外人所屬國之國家責任，以其對待本國國民的標準來決定。此案受到巴西、智利等南美國家和埃及的支持，但澳大利亞、加拿大、英、法、德、美等歐美主要國家則反對，因此這一提案未被採納。參考：丘宏達，《現代國際法》，頁736。值得注意的是戰後《中美商約》的最後版本（第6條第1款）則是提到依據國際法原則的充分保護。詳見本章內文的討論。"}, {"type": "text", "text": "23 草案內容見：FRUS, 1945. Vol. VII. pp. 1310-1314."}, {"type": "text", "text": "24《外交部「中美商約案」》，中央研究院近代史研究所藏，11-10-06-01-018，11-10-06-01-020。收有中美會談中英文紀錄。11-10-06-01-019，則是中國各部會的意見。例如：中方提出刪除「金融」二字和希望中國人享有在美國「本州待遇」的意見，主要是經濟部擬出的意見。有關移民條款和教育文化議題，則是教育部和僑委會的意見。航海運輸及空中交通，則為交通部意見。另可見：《〈中美商約〉談判記錄（英文稿）》，《〈中美商約〉談判過程文件》，中國第二歷史檔案館藏國民政府外交部檔案（十八）3033。"}, {"type": "text", "text": "22 C. K. Moser to I. V. Slepak, \"Draft of the Proposed Treaty of Friendship, Commerce, and Navigation with China,\" Aug. 9, 1944, pp. 5-6."}, {"type": "text", "text": "含意都須極謹慎，中國不希望未來因應經濟發展的政策被綁住手腳。基於上述理由，李幹指明商約草案並不完全對等，例如：（一）第3和第4款中關於「法人和團體」的條款，中國希望草案中對於「公司、法人和團體」的權力應有所限制，希望這些公司須在美國有「營業」的事實才能進入中國營業；（二）第3款和第2款提到的「金融業」在美國各州內對於非本州註冊的銀行原本就有歧視性規定，亦即非本州註冊的銀行通常不允許在本州營業（只有少數例外），因此中方希望關於「金融業」的這一條文是否可以刪除，因為這些情況將使得「國民待遇」的互惠條款是不平等的。談判顧問劉大中查閱美國各州關於金融業法規，提到美國有30個州是不允許他州立案的銀行到本州營業，在這種情況下中國只能享有他州待遇，沒有獲得相對優惠。關於第3、4款「法人和團體」條款，中方提到萬一中國不接受，美國可否退而求其次仿照美國和挪威條約或1944年4月14日《中加新約》所適用的國民待遇的情況。美方表示如果退而求其次，採用挪威的相似條款，將使美國的商人對中國的投資感到失望。至於「最惠國條款」問題。中國認為無條件或有條件的最惠國待遇應視中國政府的需求而定。"}, {"type": "text", "text": "美方代表表示中國經歷戰爭破壞，在中國的營業比其他國家更充滿風險，《中美商約》的滿意條款可望吸引美商的投資。此外，對於草約中第15條提到「對於國際貿易的獨占性之限制」，中方表示這項規定應只能作為美國商業政策的宣告，不應被視為中國政府的承諾。因為中國對未來的經濟發展政策，包括對私人資本的政策，都不希望受到商約中提及的壟斷性限制之約束 $^{25}$ 。顯然國民政府希望中國戰後的經濟政策既能得到美方的優惠，但又不應受到《中美商約》的限制。這次非正式的先期協商中的歧見，一方面顯示中美雙方對戰後中國是否走向自由市場的理念各"}, {"type": "text", "text": "25 此次先期談判，中方出席者包括駐美使館商務參贊李幹、商務參贊祕書劉大中（Ta-chung Liu），資源委員會在美採購團之經濟研究部主任（Kung-tu Sun），美國方面則有Willoughby, Granville O. Woodard, Everett F. Drumright, Robert R. Wilson等人。Memorandum of Conversation, by Mr. C. Thayer White of the Division of Commercial Policy, July 9, 1945, FRUS, 1945, China, pp. 1319-1323. 正文所指《中加新約》，全稱為《中加為廢除在中國治外法權及處理有關事件條約》。第1條：「本約中『公司』一詞應解釋為分別依照中華民國或加拿大國法律所組成之有限公司及其他公司合夥暨社團。」第2條：「……加拿大國人民及公司在中國應依照國際公法之原則及國際慣例受中華民國政府之管轄」。參見台北故宮網站原件電子檔：http://www.npm.gov.tw/exh100/diplomatic/zoom\\_ch056.html"}, {"type": "text", "text": "據一方，另一方面顯示美國對如何保護美國企業在中國的投資爭取更大的保障，最重要的是外國公司在中國的法律地位，成為後來正式談判中的焦點。"}, {"type": "text", "text": "《中美商約》在重慶和南京前後經歷多次協商，到了1946年11月4日，始由中國外交部長王世杰和美國新任駐華大使約翰·司徒雷登（J. Leighton Stuart）等人簽字，內容共30條。2至5條為工商業的經營問題。6至14條，為人身及財產的保障（例如移民、購置房產、宗教信仰、免除兵役問題等等）。15至20條為貿易與匯兌的基本原則（關稅稅率、進出口貨品、金融交易等）。21至24條為航業及航權的保護問題。25至26條為過境、進出口貨品之問題。27至30條為條約性質、適用範圍。另有議定書10項，對條約限制和保留條款的說明 $^{26}$ 。（以下提到《中美商約》條款不另加注）"}, {"type": "text", "text": "就《中美商約》的條款及議定書的文本而言，不論是享有國民待遇原則或享有不低於第三國待遇原則，係依照近代國際法的平等互惠原則締結。中美雙方爭執的中心是以下三個問題：外國公司的法律地位、國民待遇的去留、最惠國條款的解釋。"}, {"type": "text", "text": "（一）第3條2款有關外國公司的法律地位。美國對中方要增加外國公司須在本國「經營」方能「認許」這一限制表示不能接受。在美國的堅持和經濟援助的壓力下，1946年3月，國防最高會議和立法院最後取消了「營業」和「營業者」的限制 $^{27}$ 。美方之所以反對《新公司法》中規定「應在本國設立登記並實際營業」的條文，主要是因為如果該條款實行，將妨礙美國人在華投資和對華貿易之發展。更進一步言，它事實上是用釜底抽薪的方法奪去了大部分在中國的美國公司的合法基礎。例如，以美商為首的一大批註冊於本國，但在本國又沒有營業的外國公司，如著名的美商上海電力公司、上海電話公司、加州德克薩斯石油公司等等，就將不得不依照中國的《公司法》註冊為中國公司，並受中國《公司法》的管轄 $^{28}$ 。早在商約草稿交涉之初李幹即指出：「第3、4條中，外國公司的國民待遇、銀行權利以及第15條中的自由貿易原則，均是中國不能不加以認真考慮的。儘管中國為重建和經濟發展需要美國資本，有關優惠條款是必要的，但有些條款執行起來將完全不是互惠的，中國政府因而難以接受」 $^{29}$ 。"}, {"type": "text", "text": "（二）第3條3款外國公司法人和團體的國民待遇 $^{30}$ 。美方提出，一方國民和公司法人在對方領土應享受與對方國民和公司法人同等待遇。國民政府各部在收到美方草約，開始正式談判之前，即對此表示異議，財政部認為：「不能給予漫無限制之國民待遇」，經濟部主張金融機構的國民待遇應予刪除。外交部綜合各部意見後指出，由於美國是聯邦制國家，各州有保護本州的法規。中方在美享受的國民待遇只能限聯邦司法規定的範圍之內，實際上至多享受「他州待遇」，中美雙方並不平等互惠，因此建議刪除美方草約中有關國民待遇。但在談判中，美國毫不退讓。最後國民政府讓步，雙方同意相互給予國民待遇，但中方要求加上「另有法律規定除外」的限制。美國最初不予同意，在中方堅持之下，最後同意了這一限制，中方則認可了「他州待遇」，並放棄了刪除公司活動範圍中「金融」一項的主張 $^{31}$ 。"}, {"type": "text", "text": "26 本文所引《中美友好通商航海條約》，均錄自：外交部編印，《中外條約輯編》（台北：外交部，1958年初版，1963年增編再版），中英文對照，頁688-718。由於條款中文字數即多達一萬六千餘字，除非特別需要加注，本文不再另行加注出處。"}, {"type": "text", "text": "28 William C. Kirby, \"China Unincorporated: Company Law and Business Enterprise in Twentieth-Century China\", pp. 43-63."}, {"type": "text", "text": "27 有關新公司法之相關研究，可參閱張肇元編著，《新公司法》（台北：中華文化出版事業委員會，1957），頁231-244。"}, {"type": "text", "text": "29 Memorandum of Conversation, by Mr. C. Thayer White of the Division of Commercial Policy, July 9, 1945, FRUS, 1945, China, pp. 1319-1323."}, {"type": "text", "text": "30 根據 1946 年商約第 3 條：「法人及團體」字樣，係指依法組成之官廳所施行之有關法律規章業已或將來創設或組織之有限責任或無限責任，及營利或非營利之法人、公司、合夥及其他團體。"}, {"type": "text", "text": "（三）第15條「無條件和無限制的」最惠國待遇。美方要求在條約前言「中美商約」一句之後加上「普遍基於無條件的最惠國待遇」 $^{32}$ 。中方表示不能同意，並稱「中國事實上已經實行了無條件形式的最惠國待遇」。如果中國公開表示接受這一原則，其他各國必將效仿美國，等於開了不好的先例。美方指出，最惠國待遇條款不只適用於商品，而且也適合於廠家社團和航海，如果美國放棄這一條款，就會被認為是在提倡自由貿易政策上退了一步；它堅持條約中的所有最惠國條款，除非有特別說明外，均應屬於無條件的。國防最高委員會10月9日的常務會議中，對於美方主張「無條件最惠國待遇」一點，曾一度建議「擬在談判紀錄中附一聲明，使他國無法援例，即凡美國允予中國者，中國亦允予美國。此點倘奉通過，即可簽約」 $^{33}$ 。中美雙方對此爭論最久，由於中方態度堅決，並表示願意在事實上給予無條件的最惠國待遇，美國最終讓步，同意從條約中刪除「無條件的最惠國待遇」的文字。"}, {"type": "text", "text": "最後，中國代表認識到中國在經濟和技術上相對落後，尚不能輕予外人智識產權，俾使中國得以不受條約限制向西方學習或複製其知識和技術成果。《中美商約》條款關於智識產權的條文較為廣泛，美國方面對於翻譯事項始終不滿意。後來美國參議院在1948年6月2日同意批准商約之決議案中載有保留及了解。「美利堅合眾國政府不接受議定書第五項（丙）關於文學及藝術作品禁止翻譯之保護之規定」，並載有此項保留條款及了解，內容為：「美利堅合眾國在此方面之利益，在未就翻譯事項另有談判及協定前，將依光緒二十九年八月十八日即公曆一千九百零三年十月八日在上海簽訂之續議通商行船條約之規定解釋之」。事實上，1903年的《中美商約》條文便是賦予中國在譯印西書和技術專利等知識產權上的一種權宜方便，可說是美方的讓利，不必受美方約束 $^{34}$ 。歷40年後的1946年《中美商約》，中國方面仍無法予以事實要件上的保護，美方在未有完善的方案之前，仍維持1903年的版本，等待日後進一步修正。"}, {"type": "text", "text": "三、劍拔弩張的輿論戰"}, {"type": "text", "text": "如上所述，《中美商約》在談判過程中，經過多次協商和妥協，並非一帆風順。美國華府方面也意識到將引起一場輿論大戰，在商約公布之際還對外表示不希望這份商約被視為有意強化蔣介石政府與共產黨打內戰；表示商約是因應現實上的需求，沒有任何政治意義 $^{35}$ 。《中美商約》公布之後，各方意見果然沸沸揚揚。在輿論界頗具影響力的兩大刊物——《大公報》和標榜民主進步「第三道路」的代表刊務《觀察雜誌》，除少數言論表示肯定之外，多表負面評價。分屬國共兩黨的黨營報紙《中央日報》與《解放日報》則是旗幟鮮明，立場迥異。這些輿論不僅反映了對於戰後中國經濟政策的看法，中國本身的經濟條件和立足點何在？戰後中國是否迎向美國為主導的自由經濟市場？同時也呈現國共對立複雜情勢下，不同意識形態及思想陣營的劍拔弩張。"}, {"type": "text", "text": "31「經濟部對中美友好通商航海條約草案意見書」，外交部「中美商約案」，中央研究院近代史研究所藏，11-10-06-01-019。"}, {"type": "text", "text": "32「照抄本部上行政院呈文」，外交部「中美商約案」，外交部「中美商約案」，中央研究院近代史研究所藏，11-10-06-01-018。"}, {"type": "text", "text": "33 國防最高委員會常務會議第206次會議，1946年10月9日。收入：中國國民黨中央委員會黨史委員會編印，《國防最高委員會常務會議紀錄》，第8冊（台北：近代中國出版社，1996），頁6。"}, {"type": "text", "text": "34 關於 1903 年商約與中美知識產權問題，詳見本書第三章。"}, {"type": "text", "text": "中共方面的宣傳報猛批《中美商約》為賣國契約。商約交涉之際，國共內戰停停打打，共產黨指責美國持續援助國民黨政府造成中國內戰的加劇，使國民黨毫無忌憚地不願和平解決國內政治問題，共產黨人並藉由《中美商約》的簽訂，將國民政府描繪成美國帝國主義的走狗，製造反美敵意成為共產黨贏得人心戰略的一部分。《解放日報》稱：「蔣介石簽訂賣國商約，全國輿論譁然反對。該約是中國人民的賣身契，是美帝國主義奴役中國的工具，它比廿一條還凶，它使中國陷入殖民地的苦淵」 $^{36}$ 。又稱：「我內河航權全部斷送」 $^{37}$ 。《解放日報》轉引《大公報》11月6日社評嚴苛的結論作為標題：「不平等的江寧條約（南京條約）今日重現，又將支配中國今後百年命運」 $^{38}$ 。《文匯報》，以「互惠葬送主權」為題批判商約 $^{39}$ 。作為文宣回擊，國民黨宣傳報《中央日報》於11月6日社評，從中美戰後合作的角度宣告：「中美新商約的簽訂是中外貿易史上一個嶄新的開始，也標示我國與世界各國所有的貿易關係已隨不平等條約的廢除而告結束。而從中美新商約的內容而觀，其充滿了平等互惠的精神。且加強與美的合作，可因應戰後中國急需工業化的要求」 $^{40}$ 。"}, {"type": "text", "text": "除了共產黨人的口誅筆伐，正、反方意見還延燒到當時在華英文報刊。《密勒氏評論報》（The China Weekly Review）客觀陳述國、共雙方立場，「兩黨對話毫無進展」。也提到自由派人士的同聲譴責 $^{41}$ 。當時輿論集中在工商貿易、航海及移民條款的討論。"}, {"type": "text", "text": "35 Bertram D. Hulen, “U.S.-China Treaty Of ‘Mutual’ Trade and Amity Signed,” New York Times, Nov. 4, 1946."}, {"type": "text", "text": "無疑問地，以這《中美商約》始的平等新約，又將支配中國今後的百年命運」。11月16日，另有社論約二千餘字〈評蔣美商約〉。"}, {"type": "text", "text": "39《文匯報》，1946年11月5日。"}, {"type": "text", "text": "40《中央日報》（湖南版），1946年11月6日，2版。11月30日《中央日報》社論，〈論中美商約保留條款〉引用外交部條約司司長王化成對外聲明稿，進一步申論外界對商約之疑慮。《中央日報》（湖南版），1946年11月30日，2版。"}, {"type": "text", "text": "41 “Sino-American Trade Pact Signed; No Progress In Bi-Party Talks,” Nov. 9, 1946, The China Weekly Review, Nov. 9, 1946.《密勒氏評論報》1946年11月16日刊出多篇讀者投書的不同立場，“Treaty”報導《大公報》、《申報》、《文匯報》等各方意見。“Audacious And Hasty?”讀者Chang Fa Yuan投書認為國民黨選在國民大會召開前急著簽商約，實為操之過急，並質疑未顧及中國市場如何不被美國所主導操控等意見。“Jumping The Gun,”呼籲大家平心靜氣逐條檢視條款內容，不必過早推斷。以上三文，見The China Weekly Review, Nov. 16, 1946. Tseng Yuhao, “An Analysis And Interpretation Of The New Sino-American Pact,”則從正面立場肯定商約，舉出該約具有九大平等互惠的特色：一、廢除治外法權和領事裁判權；二、國民生命財產受到法律和人道保障；三、海關進出口及稅則；四、航海和運輸貿易；五、移民規定；六、最惠國待遇；七、知識產權保護；八、外交和領事代表職責與權利；九、宗教與教育自由的保障。The China Weekly Review, Dec. 21, 1946."}, {"type": "text", "text": "36《解放日報》，1946年11月13日，1版標題。同年12月7日，1版。標題：「通電力爭廢除辱國條約」。"}, {"type": "text", "text": "37《解放日報》，1946年10月10日，1版標題。"}, {"type": "text", "text": "38《解放日報》，1946年11月13日，1版。轉引上海《大公報》之社評結論原文為：「以江寧條約為始的不平等條約，曾支配中國一百年的半殖民地命運；"}, {"type": "text", "text": "1. 工商貿易條款"}, {"type": "text", "text": "經貿條款引起的討論最多，批評者主要針對中美兩國經濟條件大不同，商約名為互惠，實際仍為片面，結果是造成中國市場對美國的全面開放。"}, {"type": "text", "text": "11月6日上海《大公報》的社評針對條約內容逐一討論，且語多激忿：「形式上確為平等。但中美國力截然不同，其所發生的利害關係也就兩樣了。就利害關係言，即在實質上我們覺得它幾乎是一個新的不平等條約……有好多條款是針對中國可怕的將來而載入的」；然而社評對條文的解釋頗多斷章取義之處，例如該文提到："}, {"type": "text", "text": "第十款規定課稅標準，此國人應與彼國人一樣，不論「稅金、規費或費用」皆「不得異於或高於」彼國國民。最重要的是第十六條，其第一項是不論輸出品或輸入品，概不可「禁止」。其第二項是所課關稅及稅收方法，應與本國人民享有同樣待遇。……這樣中美關係一面倒，而中國的關稅自主，在這種規定下是不能採取保護關稅的了。42"}, {"type": "text", "text": "據商約第10條第2款的文字是：締約此方之國民、法人及團體，不得課以異於或高於在締約彼方領土內依法組成之官廳所施行之法律規章現在或將來對於任何第三國之國民、居民、法人及團體所課之任何內地稅、規費或費用。」（底線為筆者所加）因此關稅決定權仍在本國。商約第16條亦有限制條款：「締約此方對締約彼方任何種植物、出產物或製造品之輸入、銷售、分配或使用，或對輸往締約彼方領土之任何物品之輸出，不得加以任何禁止或限制；但對一切第三國之同樣種植物、出產物或製造品之輸入、銷售、分配或使用，或對輸往一切第三國之同樣物品之輸出，亦同樣加以禁止或限制者，不在此限」。對此一問題，外交部條約司司長王化成有所回應（詳下）。"}, {"type": "text", "text": "相對於《大公報》社論的文氣沸揚，同樣刊於《大公報》署名盛慕傑的評析，則較為持平。該文亦認為兩國經濟力量有高下之別，「文字上的平等互惠，在實際上的平等是畸型的，互惠是片面的」。在逐一分析商約條款對中方之利弊，該文總評貿易和匯兌的條款較為得宜，因權力仍在中國手中：「對於貿易和匯兌問題，對於中國大體上沒有什麼不利，因為關稅方面可以提高稅率；貿易方面可以採用數量管制，獨占或公營。匯兌方面，可以設金融管制。雖然彼此共有的權利，但是中美間的貿易不平衡非常顯著」。該文亦從戰後中國經濟政策著眼，認為：「商約中以自由貿易和自由匯兌為宗旨，但是中國是長期遭受戰爭的國家，假定對於貿易和匯兌一點也不限制，實在和戰後經濟復興的要求相反」 $^{43}$ 。"}, {"type": "text", "text": "較肯定商約平等互惠精神的工商界知識精英，例如中央銀行監事會主席暨上海市銀行公會理事長李馥蓀說：「鄭重深信……其有利於兩國人民者，當更可漸臻遠大地步。值得一提者，即中美兩國實力不同，故對商約規定權利之享受能力，目前當然不同。惟商約本身之平等互惠性質，固屬毫無疑問」。中央銀行經濟處處長冀朝鼎認為：「美國固然需要中國以容納其過剩的資本和商品，但中國尤需要美國的財力、物力與技術的援助。兩國的經濟關係既屬如此密切，自然需要一個平等互惠的商約以為依據。對於條文中規定中美兩國國民在對方應享受國民待遇，他抱以樂觀，認為中美經濟關係仍受公司法限制，採礦權部分只要中國今後不以採礦權與他國，自亦不必給予美國，認為國人不必過度擔心 $^{44}$ 。"}, {"type": "text", "text": "42《大公報》（上海），1946年11月6日。同文刊於《大公報》（天津），1946年11月7日，2版社論。"}, {"type": "text", "text": "43 盛慕傑，〈中美商約內容研究〉，《大公報》（上海），1946年11月13日，6版。"}, {"type": "text", "text": "經濟學者多從戰後中國經濟重建的角度，認為計畫經濟有其必要，然而《中美商約》的簽訂，將造成美貨的傾銷和壟斷，美貨將以壓倒性的優勢在中國市場出現，要求政府採取保護民族工業和農業的政策。復旦大學教授夏炎德在《觀察雜誌》為文批評：「美國……想以她的力量為主幹而推行世界的自由貿易。最近與我國簽訂的《中美友好通商航海條約》，即是本是項原則，這完全是本著美國的要求而訂立的，中國純粹屬於被動的地位；然而我們必須知道任何國家的經濟發展必須循一定的歷史階段，而不能逾越。中國目前正需學美國當初保護本國產業的辦法，而現在卻輕易跟人家談自由，試問中國有什麼條件跟人家談自由，這未免太大膽太不自量了。」 $^{45}$"}, {"type": "text", "text": "曾任北京大學經濟學教授的馬寅初發表多篇反對《公司法》及《商約》，且抨擊官僚資本的尖刻文字，在〈我何以反對新訂的中美商約〉一文中，從美國欲以國際貿易自由主義，取代戰前德國的大集體主義（貿易不自由）的觀點著手。他認為美國如欲實施此項政策，則應效法羅斯福總統於其草擬之《大西洋憲章》中主張國際貿易自由，徹底廢除外匯統制、定額分配制、關稅壁壘等，果真如此，自由貿易之理想方能實現；但事實正好相反，「美國既因國內困難，不能廢除自由貿易之種種障礙為眾先導，安能引導各國走上國際自由貿易之路？中美商約是依據上述不合理基礎而訂立的，名雖屬平等互惠，其實能予中國實惠為何殊為懸殊」。「中美交易的條件終是於美國有利，中國的外匯頭寸，不旋踵即耗盡。為自衛計，中國不能不加以種種限制……」46。中國農村經濟研究會負責人孫曉村（中國民主革命同盟成員）認為：「以中美兩國國民經濟發展程度的不同，所謂平等其實就是不平等。美國可以根據條約做到百分之百，而我們則只有接受，無法還手，其結果是美國的資本商品，以及商業生產等組織源源而來，中國的經濟建設恐怕連最低限度的發展都不可能」47。這一說法站在中國經濟發展水平確實和美國落差極大，而中國廣大鄉村將無法受益於美國資本商品入侵的經濟思維。"}, {"type": "text", "text": "2. 航權條款"}, {"type": "text", "text": "輪船業工會祕書長李雲良表示，從第21條規定可明白看出：內河沿海航權操諸於國人手中，不必過度憂慮，但他認為《中美商約》航海部分第22條規定對於締約國船舶徵收之各種稅捐及費用，不得高於本國船舶。第23條第2項規定：凡由本國船舶輸出及輸入物品所給予之獎勵金退稅及其他任何名目之優惠待遇，亦應同樣給予締約國之船舶。此兩點約束本國對於國籍商船及國際貿易之獎助，極不利於產業及航業幼弱之國家；希望在實施上加以警惕，以免招致損害之後果。"}, {"type": "text", "text": "46 馬寅初，〈我何以反對新訂的中美商約〉，該文為在上海大夏大學的演講。原載《文匯報》（上海），1946年12月30日。收入：馬寅初著，《馬寅初全集》，第12卷（杭州：浙江人民出版社，1999年），頁390-397。馬寅初在《經濟周報》第3卷20期（1946年11月14日），另有短文〈中美商約條文內容空泛，利權喪失無可避免〉，收入：《馬寅初抨擊官僚資本》，頁197。中華人民共和國成立後，馬寅初曾擔任北大校長一職，中共建國初期對穩定物價、防止通貨膨脹和人口政策等方面提出重大建言。"}, {"type": "text", "text": "44《大公報》（上海），民35年11月6日，4版。"}, {"type": "text", "text": "45 夏炎德，〈論中美經濟關係之前途〉，《觀察雜誌》，1卷，19期（1947年1月4日），頁6。"}, {"type": "text", "text": "47《大公報》（上海），1946年11月6日，4版。中共建國初期任政務院財政經濟委員會委員、財經計畫局副局長、北京農業大學校長等職。"}, {"type": "text", "text": "對於有言論指稱商約締訂後中國不復保全內河及沿海航行權，李雲良認為此係一種誤解，「國際航行自十六世紀確立公海制及商業革命，打破閉關自守之舊規，以後則為各國所通行，除因軍事上之理由外，鮮有禁阻者。」從戰後中美經濟合作的角度，他更希望中國現當善後救濟及復興建設之時，需要美國運來大批機器物資，而桐油生棉茶葉豬鬃藥材等土產亦亟待推廣輸出。他主張《中美商約》實施後，對於兩國經濟合作，應更加強。「美國能以其剩餘之船舶及造船設備，以優惠之條件轉讓我國，以助我建立新式商船艦隊，此為全國航業界所迫切企望於美國朝野者也。」 $^{48}$"}, {"type": "text", "text": "3. 移民條款"}, {"type": "text", "text": "對於《中美商約》第2條第4款關於移民問題的規定，並未能徹底取消美國對中國人入境的種種不合理的限制，或作出重大的修正，引起輿論的失望不滿 $^{49}$ 。由於中國法律對美國人來華，並未設定任何不合理的限制。但美國移民法規，卻特別對中國人仍保留著極不公平的待遇。以往專為中國人制訂並已施行多年的若干「排華律」，雖經美國國會通過，並於1943年12月17日由羅斯福總統批准廢止其一部或全部，但依美國「有關移民入境之現行法規」，中國人想要進入「美國」，仍蒙受種種極苛刻的限制，遠不能與第三國國民所享受的待遇相提並論。《中美商約》第2條第4款前段的規定：「本約中任何規定，不得解釋為影響締約任何一方有關入境移民之現行法規……」。這種規定可說是一種「但書」規定，因為這一款所加的限制，不僅是為著前3款的規定而設，而是為著全部的條約而設，雖然，第4款末段曾規定：「且1917年2月5日為限制入境移民而劃分若干地帶之美國入境移民律第三節之各項規定，亦不得解釋為阻止中國人及中國人之後裔進入美國」。然條約的適用之範圍，既如此廣泛，不免令人疑慮。"}, {"type": "text", "text": "1943年美國國會通過，將1882年以後的一切排華律廢止。該法案分為三點：一、列舉自1882年以後之17種排華律宣告廢止；二、修改1940年之國民法（Nationality Act of 1940），使中國人有歸化資格；三、修改1924年之移民律第13條C項，使該條排斥無權歸化之一切人等，不再適用於中國人。因此中國人得用移民額分配法（該法不適用於無權歸化之人民），每年准許之105名中國移民進入美國，永久居住，將來並得依法歸化。1943年美國國會通過的廢止排華律一案，列舉多種專門排斥華人的法律，宣告廢止，卻未將1917年移民律第3條列入，該條曾將中國移民大部分劃在排禁區之內。因此，排華律雖廢止，而1917年之移民律，仍為有效之法律 $^{50}$ 。外交部發言人曾對外說明：「此種註明，亦可為中國人應不受歧視之一種保障」 $^{51}$ 。然而，不滿之聲仍難以消弭。以宣傳民主進步思想自許的《觀察雜誌》評論：「如果我們在商約中還承認這種法規繼續對中國人適用，而不受影響，則從我們中國國民的立場說，不特商約中第三條前三款所規定的那些進入、居住、經商等等權利以及所謂最惠國待遇，多將成為一邊倒的片面享受，就是整個商約的價值，恐怕也將因此被沖淡了不少。」 $^{52}$ 針對大公報刊出「如同江寧條約的不平等條約」。中國駐美使館商務參贊李幹率先回應關稅主權乃操之在我：「對於我國將來採用何種關稅或貿易政策，我國有全權決定權，美方決不能藉口約文加以干預。現時中美兩國出口貿易失去平衡，自有其內在之理由，俱與商約無關」 $^{53}$ 。其後面對蜂湧而至的輿論質疑，外交部條約司司長王化成，於11月28日發出正式聲明稿三千餘字，從國民之職業之保障、法人及團體之保障、關稅自主、移民條約之規定、最惠國待遇，逐一闡釋條款內容對本國國民之保障殆無疑義。這份聲明稿內容相當重要，擇其重點製表如下 $^{54}$ 。（底線為"}, {"type": "text", "text": "其所享受之待遇，應與現在或將來任何第三國國民進入、旅行與居住於該領土，以經營該締約彼方與該第三國間之貿易，或從事於與該貿易有關之商務事業所享受之待遇，同樣優厚。"}, {"type": "text", "text": "48《大公報》（上海），1946年11月6日，4版。"}, {"type": "text", "text": "49 第2條第4款內容如下：本約中任何規定，不得解釋為影響締約任何一方有關入境移民之現行法規，或締約任何一方制訂有關入境移民法規之權利，但本款之規定，不得阻止締約此方之國民進入、旅行與居住於締約彼方之領土，以經營中華民國與美利堅合眾國間之貿易，或從事於任何有關之商務事業，"}, {"type": "text", "text": "筆者所加）"}, {"type": "text", "text": "50 沈作乾，〈中美商約中的移民條款〉，《大公報》（天津版），1946年12月28日第3版。Julia Fukuda Cosgrove, Unites Foreign Economic Policy Toward China, 1943-1946: From the End of Extraterritoriality to the Sino-American Commercial Treaty of 1946, p. 188."}, {"type": "text", "text": "51 見《大公報》（上海版），1946年11月16日，外交部之聲明。"}, {"type": "text", "text": "52 韓德培，〈評中美商約中的移民規定〉，《觀察》，第1卷第24期（1947年2月8日），頁15-17。"}, {"type": "text", "text": "53《大公報》（上海），1946年11月8日，2版。"}, {"type": "text", "text": "54 大公報（天津版），1946年11月9日第3版。11月29日該報刊出約三千餘字王化成的聲明稿。"}, {"type": "text", "text": "事實上，共產黨人和民間輿論所質疑的商約施行之結果，將導向美方利益的傾斜，中央政府各部會從未否認此點。商約草稿交涉中，李幹也向美方代表直言「儘管中國為重建和經濟發展需要美國資本，有關優惠條款是必要的，但有些條款執行起來將完全不是互惠的」 $^{55}$ 。經濟部函外交部文件中直接說：「草案各條款中對予兩締約國人民公司社團之權利待遇保障雖屬平等互惠，惟兩國經濟實力懸殊過甚，商約實行後兩方所獲取之利益勢難均等」；經濟部更坦言美國資金、技術和外交援助對當前國民政府的迫切性，而且是國民政府有求於美國者多。「就兩國經濟關係而論，我賴於美者急，而美所求於我則緩，故研議本約自應權衡國家整個需要，就全面利益著眼」 $^{56}$ 。當時簽訂條約的外交部長王世杰的日記最能道出這一矛盾難堪的情緒，他寫道：「蓋彼此雖承認依平等互惠之原則訂立此約，然因中美經濟情況不同，所訂互惠實際上仍易成為片面之惠」 $^{57}$ 。外交部對於中美經濟力量的不平衡，容易形成「形式上之平等」早有察悉，中美經濟條件的不同，為一種事實狀態，有其內在歷史的長期積累因素，非商約本身之罪。因此，條約司在文字上字字推敲，求其對己方最有利，而美方也適時對草約做出若干善意讓步，才有最後獲致的版本。"}, {"type": "text", "text": "《中美商約》簽訂後，美國國會直到1948年6月2日才批准此約，部分原因是美國商業團體對若干條款仍不滿意，如前文所言"}, {"type": "text", "text": "特別是知識專利產權的部分，對於美國藝文出版和技術發明的條文並不完備，在國會聽證會議中引起辯論，最後在議定書加上「保留和了解」文字才予以批准 $^{58}$ 。美國在華治外法權的消失、中國新擬定的外國公司法，以及上海左派文宣持續宣傳和發酵的仇外反美風潮等等事態，都對上海美商帶來生意上和心理的不安 $^{59}$ 。同時，美國政府愈來愈陷入國共內戰的泥沼，而國民黨在軍事和經濟上的一再失敗，乃至於鋪天蓋地而來各種不利國民黨的傳聞，在美國國會批准商約之際，國會內部對於美國對華政策的不同見解——是否持續提供美援給予國民黨政府，如何擺脫調停國共內戰的困境，在美國國會中激辯不休。從《中美商約》草案的提出到美國國會批准的三年多時間，正是美國政府在中國動盪的政治激流中舉旗不定，並沒有積極利用美國對華事務具指導力的正面發展因素。儘管1948年美國國會通過緊急特別撥款的援華法案，但援華法案能給國民黨政府喘息的作用不僅有限，且為時已晚。1948年下半年起，國共內戰進入決戰階段，中美雙方於1948年11月30日在南京互換《中美商約》批准書的同時，國共情勢已大大逆轉 $^{60}$ 。更不幸的是《中美商約》的簽訂，一再成為共產黨人公開譴責美國帝國主義和不得人心的國民黨政府的紐帶關係，煽動起前所未見且廣泛的反美運動。《中美商約》意謂著「不平等」乃成為中國一個世代人的歷史記憶。"}, {"type": "text", "text": "55 FRUS, 1945, China, pp. 1261-1300, 1319-1323."}, {"type": "text", "text": "58 Hearings before a Subcommittee of the Committee on Foreign Relations, United States Senate, 80th Cong., 2nd Sess., on a Treaty of Friendship, Commerce and Navigation between the United States of America and the Republic of China, together with a Protocol Thereto, signed at Nanking on November 4, 1946 (May 26, 1948), pp. 66-69."}, {"type": "text", "text": "56「經濟部對中美友好通商航海條約草案意見書」，甲、對於原草案之一般觀察。《外交部「中美商約案」》，中央研究院近代史研究所藏，11-10-06-01-019。"}, {"type": "text", "text": "59 Henry R. Lieberman, \"Americans Feeling Shanghai Change,\" New York Times, Nov. 26, 1946."}, {"type": "text", "text": "57《王世杰日記》，第5冊（台北：中央研究院近代史研究所，1990），頁417-418。"}, {"type": "text", "text": "60 關於戰後美國政府調停國共內戰、國會援華法案的反覆決策、在華美國官員對中國政治的主張，以及評述美國對華政策如何導致「喪失」中國的結果，相關研究非常豐富，迄今仍具代表性的著作為：Tang Tsou, America's Failure"}, {"type": "text", "text": "四、條約權利、經濟立法與國際化命題的思考"}, {"type": "text", "text": "隨著國共內戰情勢的惡化及1949年中國政權的大轉換，美國商人和企業再次遭遇如同太平洋戰爭時期退出中國的命運，戰後《中美商約》對中國本土廣大市場究竟帶來怎樣的效益，成為一個無法檢驗的課題。然則，1946年《中美商約》的歷史意義仍需加以審視。"}, {"type": "text", "text": "條約，原為中外交涉的法律依據，須為立約國家所信守，亦即近代國際法上「契約神聖性」（sanctity of contract）以及「條約必須遵守」（pactasuntservanda）的基本原則。然而如從近代中外商務往來的案例，可知許多條約規範未必被簽約國家所遵守，加以條約內容的不夠精準，亦使中外各自尋找有利的條約解釋。而列強為維護條約口岸利益又往往採取砲艦外交的恫嚇手段，在既有的外人特殊權利中又擴大了條約解釋的範圍 $^{61}$ 。1943年治外法權消失後，為避免近代以來中外條約時時發生詮釋上的爭議糾紛，戰後《中美商約》條款的界定和說明「清楚與不含糊」（clear and unambiguous），較符合現代國際條約之訂定原則。舉例而言，近代中美有關內河航權之條約，語多模糊，以致列強加以曲解或延伸解釋，造成中國沿海貿易權和航權的喪失 $^{62}$ 。《中美商約》第21至24款的文字，精準規範兩國通商航海之自由，但沿海貿易權和內河航權應操諸本國，或另有法律規定之，並應給予互惠 $^{63}$ 。"}, {"type": "text", "text": "在中美爭議最大的《外國公司法》議題上，從中國的經濟立法而言，一直到1946年商約談判之際，中國始在《公司法》中加入《外國公司法》，這是近代中國對外經濟立法中的一大變革。近代中國的公司法自1904年的《公司律》首開其端，然而有關外國公司在中國境內的營業以及作為民事責任的主體地位，或者說法人地位一直沒有相應的法律條文加以明確規定。由此而造成「自通商以來，各國在華所設立公司，從未向吾國官廳註冊」的奇特局面。1914北洋政府〈頒行公司條例〉，1929年國民政府曾修訂和頒布新的《公司法》，但均未有外國公司法的規定 $^{64}$ 。1946年商約中儘管美商取得不必在本國營業即可在華執業的權利，但其仍受中國《公司法》中關於「外國公司」法條的管理。在1946年中國頒布《公司法》的最後版本中，雖然刪除外國公司必須在其本國營業的規定；但同時也規定凡是在中國境內營業的外國公司分公司，都必須到中國政府的主管部門進行登記註冊，非經認證許可，不得在中國境內營業或設立分公司。外商註冊的內容包括：該公司簡史、公司所在地、公司章程、業務負責人、董事會成員、在中國之營業計畫書、在華事務代理人和訴訟人、公司資本額與股本等項目 $^{65}$ 。因此，就近代中國的經濟立法而言，1946年的公司法是外國企業首次在中國取得法人資格，必須依照中國政府的法律規範來從事商業活動，而1946年《中美商約》第3條則是中國條約史上首次以「法人及團體」來規範外國企業在中國從事商業營利活動，其重要性自不待言。"}, {"type": "text", "text": "in China (Chicago: University of Chicago Press, 1963)."}, {"type": "text", "text": "62 于能模，〈外人在華享有內河航行與沿海貿易權之條約依據〉。《東方雜誌》，第28卷第22號（1931年11月），頁13。"}, {"type": "text", "text": "63 1946年《中美商約》第24款第2項：「……締約任何一方之沿海貿易及內河航行，不在國民待遇之列，而應由該締約一方有關沿海貿易及內河航行之法律規定之。締約雙方同意，締約此方之船舶，在締約彼方領土內，關於沿海貿易及內河航行所享受之待遇，應與對任何第三國船舶所給予之待遇，同樣優厚」。"}, {"type": "text", "text": "61 這一觀點的具體案例論述，可參閱吳翎君，《美國大企業與近代中國的國際化》一書，第一章〈條約制度與清末美國在華商務的開展〉，頁25-68。"}, {"type": "text", "text": "64 1931年6月實業部公布的〈公司登記規則〉明文規定，「對總公司不在中國境內的外國公司在中國境內設立第一家分公司，應由所在地向該國領事館證明並附具公司章程，向中國政府有關部門呈請登記註冊」。1944年在戰時陪都重慶，對外商登記變通為「準由該商本店所在地之州政府予以證明」。但是在中國的公司法正文中，仍沒有增設關於外國公司的專章或條款。詳見：張忠民，《艱難的變遷——近代中國公司制度研究》（上海：社會科學院出版社，2002），頁91、348-351。"}, {"type": "text", "text": "此外，戰後《中美商約》所反映的國際主義精神值得肯定。美方除了標舉自由市場的原則以鼓舞美國大企業重返中國之外，法律顧問團一再強調以國際主義的原則保護美國人民在華權益，更看重一旦治外法權取消後，中國司法制度仍不建全，而中國與世界的交往應納入中國與國際交往的關係中；因此，國際法原則、國際標準亦為美方所關注。事實上，國家給予外國人何種待遇，國際法上並無統一規定，而是得由各國自行決定或者通過國家之間在平等基礎上簽訂雙邊條約作出規定。儘管國際社會對這些原則的認識頗多分歧，在實踐過程中也頗多爭議，然而寫入平等互惠的條約便是一種依據。《商約》第6條第1款「締約此方之國民，在締約彼方領土全境內，關於其人身及財產，應享受最經常之保護及安全；關於此點，並應享受國際法所規定之充分保護及安全。」此即原本美國法律顧問團所最在意的美國人民在華的法律問題尚可尋求某種國際標準的人權保護。並且，中華民國為聯合國創始會員國，中華民國代表張彭春參與起草了《世界人權宣言》，這是第一份在全球範圍內表述所有人類都應該享有基本權利的一份重要文件。聯合國通過的世界人權宣言也是一項國際標準，國家違反該宣言的規定，侵害外國人權益自應付國家責任 $^{66}$ 。戰後《中美商約》通過友好協議予以締約國人民之間的這項規定，揭示兩國國民在彼方之領土受「國際法所規定之充分保護及安全」，呼應了二戰以後民主國家注重人權（不論是對本國人或外國人的保護）的國際趨勢。"}, {"type": "text", "text": "就近代中國參與國際貨幣體系相關組織的歷程而言，早在1903年《中美商約》簽訂之際，美國政府曾條陳美、墨（墨西哥銀圓）匯價，並與其他用銀各國商議金銀匯兌之準價，但並未有成果。抗戰時期國民政府深切體認到外匯管制與金融問題的急迫性，在爭取英美援助時，成立了中美英平準基金委員會（Stabilization Board of China, 1941），國民政府且在1941年9月15"}, {"type": "text", "text": "65 上海檔案館保存1946年美商向中國政府註冊認證的大量文件，其中每一案例均有該商何時向中國政府註冊商標的歷史。僅舉一卷宗下：「上海社會局關於美商慎昌洋行股有限公司登記問題與經濟部的來文書卷，呈為公司係外國公司依照中華民國公司法聲請認件由」，1946年12月30日。檔號Q6-1-6780，上海市檔案館。"}, {"type": "text", "text": "66 1948年12月10日聯合國大會全體一致通過的《世界人權宣言》，直接原因是對第二次世界大戰的反省。在1949年5月聯合國國際法委會通過的《國家權利義務草案》第13條，更進一步規定了「各國有一秉信履行由條約與國際法其他淵源而產生之義務，並不得藉口其憲法或法律之規定而不履行此種義務」，許多國際性的判決或裁決均支持此一原則。關於人權史議題的國際史發展，可參見：Akira Iriye, Petra Goedde, and William I. Hitchcock, eds., Human Right Revolution: A International History (Oxford: Oxford University Press, 2012)."}, {"type": "text", "text": "日成立外匯管理委員會（Exchange Control Commission），以強化外匯行政管理。到了1944年中美、中英平準基金委員會陸續宣告撤銷，如何規劃戰後中國貨幣和銀行體系問題，成為國民政府實現戰後經濟體制和穩固財政計畫的重要議程 $^{67}$ 。1946年《中美商約》第26條規範「本約中任何規定，不得解釋為阻止下列措施之採用施行……依照1945年12月27日所簽訂之國際貨幣基金協定之條款，對於匯兌加以限制」。國際貨幣基金組織（International Monetary Fund, IMF）為二戰後經濟重建計畫的一部分，職責是監察貨幣匯率和各國貿易情況、提供技術和資金協助，確保全球金融制度運作正常：該組織總部設於華盛頓，中華民國亦為創始會員國之一 $^{68}$ 。對於國際金融交易，1946年《商約》第19條第1款「締約此方之政府，如對國際支付方法或國際金融交易，設立或維持任何方式之管制時，則在此種管制之各方面，對締約彼方之國民、法人及團體與商務，應給予公允之待遇」。1948年5月，中國加入《關稅及貿易總協定》（General Agreement on Tariffs and Trade, GATT），GATT是在布雷頓森林體系（Bretton Woods Agreements）——以美元為中心的國際貨幣協定中，為了規範和促進國際貿易和發展而締結的國際協定。GATT的原則是自由、非歧視（最惠國待遇、國民待遇）、多元化，在這三項原則下進行自由貿易往來 $^{69}$ 。就此而言，從1903年《商約》到1946年《中美商約》關於貨幣金準的規範，正是中國被納入以美元為主導的國際貨幣體制的重要階段。儘管戰後中國仍是計畫經濟型的國家，但中國經濟被正式納入了以美國為領導的世界經濟體系之中，直到中華民國政府遷台，在美國的影響下仍延續此一與世界經濟交往的基本架構。"}, {"type": "text", "text": "小結"}, {"type": "text", "text": "不可諱言，1946年《商約》談判過程中，美方始終居於支配和主動地位。由於戰後國民黨政府極須獲得美國財力和技術援助來實踐國家建設的計畫，加以國共內戰全面爆發，國民政府在談判過程中不得不在若干條款有所退讓，在急盼獲得美援的政治考量下，轉而順從美方堅持自由貿易市場規則的想法。然而，中方談判人士如李幹、條約司司長王化成等人對美國聯邦法律和國際法深入研究，汲汲爭取有利中方的條文，中國政府方面並非毫無斬獲。《商約》第15款「締約雙方，對於得由志願相同之所有其他國家參加之方案，而其宗旨及政策，在廣大基礎上擴充國際貿易，並求消滅國際商務上一切歧視待遇及獨占性之限制者，重申其贊同之意」。這一條文的精神在於國際自由貿易的對等性原則，並沒有針對國內之壟斷企業或國營企業有任何約束之條文，符合國民政府欲動員國家力量實施計畫經濟的想法。此外，戰後商約並非一面完全倒向美國利益，美國方面對若干細節亦有所不滿，從草案提出、議定書擬定、美國國會表決，每一程序中美雙方就文字細節一再修改，雙方可謂互有妥協。外交部在交涉過程中堅持刪除「無條件的最惠國待遇」的文字，應給予肯定。在知識產權和專利問題上，美國仍持續對中國讓利的作法，也是一種妥協。較令人遺憾的應屬移民條款中對中國僑民的歧視內容，1943年《排華律》廢除後，美國移民法規中仍有不少對待華人入境及移民的不合理待遇，直到1948年以後美國國會始陸續提案修正。"}, {"type": "text", "text": "67 據國民政府財政顧問楊格所記，在1945年5月他為國民政府所做的50頁的財政備忘錄中，分析了戰前中國的貨幣體系、適合中國的戰後貨幣和銀行體系體制。Arthur N. Young, China and the Helping Hand, 1937-1945, p. 357. 關於中美、中英平準基金委員會詳見：吳景平，《美國和抗戰時期中國的平準基金》，《近代史研究》（北京），1997年第5期，頁78-108。楊雨青，《中美英平準基金的運作與中國戰時外匯管理》，收入楊天石、侯中軍編，《戰時國際關係》（北京：社會科學文獻，2011年），頁308-337。"}, {"type": "text", "text": "68 IMF官方網站http://www.imf.org/external/about/history.htm（下載時間2012年4月2日）。"}, {"type": "text", "text": "69 http://en.wikipedia.org/wiki/General\\_Agreement\\_on\\_Tariffs\\_and\\_Trade（下載時間2012年4月2日）。"}, {"type": "text", "text": "當時輿論頗多苛責中美兩國經濟地位的懸殊，指《商約》的互惠開放原則，將對中國社會經濟帶來更大的實質負面效益。然而，《中美商約》對美國市場的較全面開放，是否就會扼殺中國民族工業的競爭力和發展；或循此對外市場的開放更將有利於中美經濟合作，加強戰後中國市場的經濟復興？在這一場擾攘喧騰的《中美商約》輿論戰中，戰後中國經濟走向和如何利用外資外力的重大議題，被掩沒在黨派政治和意識形態之爭中，更糾纏著近代中國受帝國主義壓迫的心結，而無法有一理性論辯。"}, {"type": "text", "text": "戰後《中美商約》的簽訂迄今已超過70年之久，似仍難以擺脫汙名化的罪名。1946年《中美商約》係第二次世界大戰結束後中美兩個戰勝國家的通商友好協議，此一重大的外交協議享有現代國際法的主權在我、不受歧視之保障和平等互惠等原則，是中國在簽署平等新約（1943年）之後開展的第一個重大外交協議，也是中國真正擺脫所謂百年不平等條約的起點。由於國共內戰導致的結果，《商約》對中國實際發揮的效力不大，然而，卻成為中華民國政府來台後與美國政府所建構的經濟關係的法律基礎，對戰後台灣的生存和發展至關重要。1978年中華人民共和國開始推動一系列的改革開放政策，1979年中美建交，又重新定義了20世紀這兩大國家的雙邊關係。然而，迄今為止中共歷史對1946年《中美商約》的評價仍停留在「舊外交的屈辱」；不論就條約權益、經濟立法和國際化歷程等面向，1946年《中美商約》所具有跨時代的歷史意義，宜還其公允之歷史評價。"}, {"type": "note", "text": "（中美天津條約續增條約）；五、1880年（光緒6），中美續修條約；六、1880年（光緒6），中美續約附款；七、1903年（光緒29），中美續議通商行船條約；八、1920年（民國9），在華盛頓簽訂之修改通商進口稅則補約；九、1928年（民國17），中美兩國關稅關係之條約。"}, {"type": "note", "text": "1 Bertram D. Hulen, \"U.S.-China Treaty Of 'Mutual' Trade and Amity Signed,\" New York Times, Nov. 4, 1946. Henry R. Lieberman, \"China Pact Shows Open Door Change,\" New York Times, Nov. 5, 1946."}, {"type": "note", "text": "2 九項條約如下：一、1844年（道光24），中美望廈條約（或稱中美五口貿易章程）；二、1858年（咸豐8），中美天津條約；三、1858年（咸豐8），中美上海條約（中美通商章程善後條約）；四、1868年（同治7），中美續增條約"}, {"type": "note", "text": "3 “Soviet Writer Denounces U.S.-China Treaty; Declares Our Aim Is Economic Domination”, New York Times, Dec. 20, 1946. M. E. Orlean, “The Sino-American Commercial Treaty of 1946,” The Far Eastern Quarterly, 7.4 (Aug., 1948): 354-367. 針對中共所宣稱1946年商約為國恥，以及蘇聯《真理報》刊出署名Markov的一篇激烈抨擊商約的專論，奧爾蘭（M. E. Orlean）就條約內容逐一加以反駁。"}, {"type": "note", "text": "4 中文成果以大陸學者的研究居多。任東來根據南京第二歷史檔案館所藏外交文件，最早撰寫〈試論1946年中美友好通商航海條約〉《中共黨史研究》，4（北京，1989年），頁20。其他主要研究有：陶文釗，〈1946年中美商約：戰後美國對華政策經濟因素個案研究〉，《近代史研究》（北京），1993年第2期，頁237-258。王建朗，《中國廢除不平等條約的歷程》（江西：江西人民出版社，2000年），頁356-360。李育民，《中國廢約史》（北京：中華書局，2005年），頁959-970。"}, {"type": "note", "text": "5 Robert R. Wilson, “Postwar Commercial Treaties of the United States,” The American Journal of International Law (Cambridge: Cambridge University Press), Vol. 43, No. 2 (Apr., 1949), pp. 262-287. 從國際法的視角比較了戰後《中美商約》和美國與其他各國（主要是義大利）所簽訂的商約內容及歷史脈絡，強調戰後商約基於平等和不歧視原則等現代國際法原則，不論如何比起戰前的條約更加完善，文末寄望美國所領導下的聯合國組織以及各國通力合作，消弭國際間自由貿易的障礙。Julia Fukuda Cosgrove, Unites Foreign Economic Policy Toward China, 1943-1946: From the End of Extraterritoriality to the Sino-American Commercial Treaty of 1946 (New York & London: Garland Publishing, Inc. Inc., 1987), Ch. 6, pp. 166-203. 作者從美國戰後對華經貿政策的形成，以及美國企業界對中國廣大「自由市場」的殷切期待；甚至舉證馬歇爾使華時拿美援作文章，要求國民黨政府儘快批准商約一事，論析美國朝野對中國市"}, {"type": "note", "text": "場的一致需求。魏楚雄從中國國家主義（nationalism）與美國經濟自由主義（economic liberalism）之間的緊張關係探索《中美商約》的交涉，特別針對1943年治外法權消失後，外人在中國必須遵守中國政府的立法，而美國本身亦有為促進美商來華貿易的《1922年對華貿易法案》，雙方對於戰後中國市場的期待與經濟理念各有不同，因此，美商在中國註冊為「外國公司」的立法問題，在1943-1946年間的中美政治經濟關係中變得敏感而尖銳。C. X. George Wei, Sino-American Economic Relations, 1944-1949 (Westport, CT and London: Greenwood Press, 1997). William C. Kirby, “China Unincorporated: Company Law and Business Enterprise in Twentieth-Century China,” The Journal of Asian Studies, 54.1 (Feb., 1995): 43-63."}, {"type": "note", "text": "6 世界知識出版社編，《中美關係資料彙編》，下冊（北京：世界知識出版社，"}, {"type": "note", "text": "1957年），頁541。"}, {"type": "note", "text": "7 Memorandum of Conversation, by the Chief of Division of Far Eastern Affairs, Feb. 23, 1943. Papers Relating to the Foreign Relations of the United States, Washington, D. C.: Government Printing Office (以下簡稱 FRUS), 1943, p. 710."}, {"type": "note", "text": "8 Memorandum of Conversation, by Woodbury Willoughby of the Division of Commercial Policy and Agreement, May 7, 1943, FRUS, 1943, pp. 712-713."}, {"type": "note", "text": "9 1943年平等新約簽訂之後，最初英國並不熱中隨即交涉商約草案，認為可以稍待時日再談，但在美國展開談判後，英國也開始關注此一議題。《中英商約》最後未能簽訂，相關研究成果並不多。馮琳，〈二戰後「中英商約」交涉失敗之研究〉，《近代中國研究》，2011年11月14日。（北京：中國社會科學院近代史研究所）。http://jds.cass.cn/Item/21913.aspx"}, {"type": "note", "text": "10 皇甫秋實，〈中美工商業協進會與戰後中美經濟關係〉，《中國經濟史研究》2018年第5期，第30-45頁。"}, {"type": "note", "text": "11 Directory of the China-America Council of Commerce and Industry. A Guide to Nearly 400 American Companies Interested in Developing Trade Between China and the USA, p. 6, 陶文釗,〈1946年《中美商約》: 戰後美國對華政策中經濟因素個案研究〉,《近代史研究》(北京), 1993年第2期,頁237-258。但該文提到中美工商業協進會創立成員為26間為筆誤,據查應為36間。"}, {"type": "note", "text": "13 Americans and American Firms in China, Directory, published by the Shanghai Evening Bost & Fhexcurg, 1946。上海市檔案館藏，編號 W1-OF-91。"}, {"type": "note", "text": "14 施芳蘭（Addie Viola Smith, 1893-1975），1920年10月奉派至北京協助美國駐北京商務專員。在此之前，她曾短暫任職美國勞工部。1922年被拔擢為美國駐上海助理商務專員，1928年再升任為商務專員。1923年1月英文報紙即提到她擔任美國對華法案註冊官，見：American Chamber Sends Delegation to Visit Nanking, The Weekly Review (1922-1923); Jan. 27, 1923。1934年任職於上海公共租界美領館內的「美國駐華法院」（United States Court for China）。她在1930年代活躍於上海社交圈，是上海美國婦女俱樂部（American Woman Club）和城市俱樂部（City Club）會員，《密勒氏評論報》在報導上海的婦女活動和駐華法院訊息中常可見到她的相關報導。1942年返回華府，任美國政府經濟專家顧問，後來並且參與中美工商協進會。1950-60年代初期，積極參與國際婦女法學會（International Federation of Women Lawyers）。Alexandra Epstein, “International Feminism and Empire Building between the Wars: the case of Viola Smith,” Woman's History Review, 2008, Vol. 17, No. 5, pp. 699-719."}, {"type": "note", "text": "12 有關美國《對華貿易法案》，詳見本書第四章。"}, {"type": "note", "text": "15 Memorandum by the Associate Chief of the Division of Commercial Policy (Willoughby) to the Assistant Secretary of State (Acheson), Apr. 5, 1945, FRUS, 1945, China, p. 1314."}, {"type": "note", "text": "19 國民待遇是國際法中重要的原則，國家准許外國人入境後，外國人就和當地國的人民一樣在其管轄之下有權利也有義務，但許多國家對外國人的權利與義務也有特別規定。一般而言，國民待遇指一國給予外國公民、企業、船舶在民事方面與本國公民、企業、船舶所享有的同等待遇，通常以國民待遇條款的形式列入貿易條約。國民待遇是當今許多世界貿易組織協議的一個組成部分。再如：當地國可以限制外國人從事某種業務；不得強迫外國人服兵役，除非外國人的本國同意，亦是國民待遇的一般內容。參見：https://en.wikipedia.org/wiki/National\\_treatment（下載時間2018/12/24）。丘宏達，《現代國際法》（台北：三民書局，2000），頁736-737。"}, {"type": "note", "text": "16 Memorandum of Conversation, by the Deputy Director of the Office of Far Eastern Affairs (Stanton). San Francisco, May 29, 1945, FRUS, 1945, China, p. 1316. May 30, 1945, FRUS, 1945, China, p. 1317."}, {"type": "note", "text": "17 The Acting Secretary of State to the Ambassador in China(Hurley), June 18, 1945, FRUS, 1945, China, p. 1318."}, {"type": "note", "text": "18 Memorandum to General of the Army George C. Marshall, Special Representative of President Truman to China, Nov. 30, 1945, FRUS, 1945, China, p. 1325."}, {"type": "note", "text": "20 C. K. Moser to I. V. Slepak, \"Draft of the Proposed Treaty of Friendship, Commerce, and Navigation with China,\" Aug. 9, 1944, pp. 1-5. Office of the Legal Advisor: Treaty, No. 136213. Box 1. RG. 59, U.S. Department of State, National Archives II. Washington D. C."}, {"type": "note", "text": "21 國家對待外國人的標準，如果與本國人一樣，但低於國際標準，是否在遭受損害時，當地國仍應負責，此一問題在西方國家與亞、非、拉丁美洲國家交涉時，往往有所爭議。後者（拉美國家）以對抗帝國主義、殖民主義國家的干涉為由，較多堅持國民待遇原則，認為應以此原則決定國家是否應負國家責任；前者（西方國家）則主張國際標準（international standard），一國不能憑其國內法之規定而解除其國際責任。據丘宏達的研究，1930年國際聯盟召開的海牙國際法編纂會議時，中國曾提案對保護外人所屬國之國家責任，以其對待本國國民的標準來決定。此案受到巴西、智利等南美國家和埃及的支持，但澳大利亞、加拿大、英、法、德、美等歐美主要國家則反對，因此這一提案未被採納。參考：丘宏達，《現代國際法》，頁736。值得注意的是戰後《中美商約》的最後版本（第6條第1款）則是提到依據國際法原則的充分保護。詳見本章內文的討論。"}, {"type": "note", "text": "23 草案內容見：FRUS, 1945. Vol. VII. pp. 1310-1314."}, {"type": "note", "text": "24《外交部「中美商約案」》，中央研究院近代史研究所藏，11-10-06-01-018，11-10-06-01-020。收有中美會談中英文紀錄。11-10-06-01-019，則是中國各部會的意見。例如：中方提出刪除「金融」二字和希望中國人享有在美國「本州待遇」的意見，主要是經濟部擬出的意見。有關移民條款和教育文化議題，則是教育部和僑委會的意見。航海運輸及空中交通，則為交通部意見。另可見：《〈中美商約〉談判記錄（英文稿）》，《〈中美商約〉談判過程文件》，中國第二歷史檔案館藏國民政府外交部檔案（十八）3033。"}, {"type": "note", "text": "22 C. K. Moser to I. V. Slepak, \"Draft of the Proposed Treaty of Friendship, Commerce, and Navigation with China,\" Aug. 9, 1944, pp. 5-6."}, {"type": "note", "text": "25 此次先期談判，中方出席者包括駐美使館商務參贊李幹、商務參贊祕書劉大中（Ta-chung Liu），資源委員會在美採購團之經濟研究部主任（Kung-tu Sun），美國方面則有Willoughby, Granville O. Woodard, Everett F. Drumright, Robert R. Wilson等人。Memorandum of Conversation, by Mr. C. Thayer White of the Division of Commercial Policy, July 9, 1945, FRUS, 1945, China, pp. 1319-1323. 正文所指《中加新約》，全稱為《中加為廢除在中國治外法權及處理有關事件條約》。第1條：「本約中『公司』一詞應解釋為分別依照中華民國或加拿大國法律所組成之有限公司及其他公司合夥暨社團。」第2條：「……加拿大國人民及公司在中國應依照國際公法之原則及國際慣例受中華民國政府之管轄」。參見台北故宮網站原件電子檔：http://www.npm.gov.tw/exh100/diplomatic/zoom\\_ch056.html"}, {"type": "note", "text": "26 本文所引《中美友好通商航海條約》，均錄自：外交部編印，《中外條約輯編》（台北：外交部，1958年初版，1963年增編再版），中英文對照，頁688-718。由於條款中文字數即多達一萬六千餘字，除非特別需要加注，本文不再另行加注出處。"}, {"type": "note", "text": "28 William C. Kirby, \"China Unincorporated: Company Law and Business Enterprise in Twentieth-Century China\", pp. 43-63."}, {"type": "note", "text": "27 有關新公司法之相關研究，可參閱張肇元編著，《新公司法》（台北：中華文化出版事業委員會，1957），頁231-244。"}, {"type": "note", "text": "29 Memorandum of Conversation, by Mr. C. Thayer White of the Division of Commercial Policy, July 9, 1945, FRUS, 1945, China, pp. 1319-1323."}, {"type": "note", "text": "30 根據 1946 年商約第 3 條：「法人及團體」字樣，係指依法組成之官廳所施行之有關法律規章業已或將來創設或組織之有限責任或無限責任，及營利或非營利之法人、公司、合夥及其他團體。"}, {"type": "note", "text": "31「經濟部對中美友好通商航海條約草案意見書」，外交部「中美商約案」，中央研究院近代史研究所藏，11-10-06-01-019。"}, {"type": "note", "text": "32「照抄本部上行政院呈文」，外交部「中美商約案」，外交部「中美商約案」，中央研究院近代史研究所藏，11-10-06-01-018。"}, {"type": "note", "text": "33 國防最高委員會常務會議第206次會議，1946年10月9日。收入：中國國民黨中央委員會黨史委員會編印，《國防最高委員會常務會議紀錄》，第8冊（台北：近代中國出版社，1996），頁6。"}, {"type": "note", "text": "34 關於 1903 年商約與中美知識產權問題，詳見本書第三章。"}, {"type": "note", "text": "35 Bertram D. Hulen, “U.S.-China Treaty Of ‘Mutual’ Trade and Amity Signed,” New York Times, Nov. 4, 1946."}, {"type": "note", "text": "無疑問地，以這《中美商約》始的平等新約，又將支配中國今後的百年命運」。11月16日，另有社論約二千餘字〈評蔣美商約〉。"}, {"type": "note", "text": "39《文匯報》，1946年11月5日。"}, {"type": "note", "text": "40《中央日報》（湖南版），1946年11月6日，2版。11月30日《中央日報》社論，〈論中美商約保留條款〉引用外交部條約司司長王化成對外聲明稿，進一步申論外界對商約之疑慮。《中央日報》（湖南版），1946年11月30日，2版。"}, {"type": "note", "text": "41 “Sino-American Trade Pact Signed; No Progress In Bi-Party Talks,” Nov. 9, 1946, The China Weekly Review, Nov. 9, 1946.《密勒氏評論報》1946年11月16日刊出多篇讀者投書的不同立場，“Treaty”報導《大公報》、《申報》、《文匯報》等各方意見。“Audacious And Hasty?”讀者Chang Fa Yuan投書認為國民黨選在國民大會召開前急著簽商約，實為操之過急，並質疑未顧及中國市場如何不被美國所主導操控等意見。“Jumping The Gun,”呼籲大家平心靜氣逐條檢視條款內容，不必過早推斷。以上三文，見The China Weekly Review, Nov. 16, 1946. Tseng Yuhao, “An Analysis And Interpretation Of The New Sino-American Pact,”則從正面立場肯定商約，舉出該約具有九大平等互惠的特色：一、廢除治外法權和領事裁判權；二、國民生命財產受到法律和人道保障；三、海關進出口及稅則；四、航海和運輸貿易；五、移民規定；六、最惠國待遇；七、知識產權保護；八、外交和領事代表職責與權利；九、宗教與教育自由的保障。The China Weekly Review, Dec. 21, 1946."}, {"type": "note", "text": "36《解放日報》，1946年11月13日，1版標題。同年12月7日，1版。標題：「通電力爭廢除辱國條約」。"}, {"type": "note", "text": "37《解放日報》，1946年10月10日，1版標題。"}, {"type": "note", "text": "38《解放日報》，1946年11月13日，1版。轉引上海《大公報》之社評結論原文為：「以江寧條約為始的不平等條約，曾支配中國一百年的半殖民地命運；"}, {"type": "note", "text": "42《大公報》（上海），1946年11月6日。同文刊於《大公報》（天津），1946年11月7日，2版社論。"}, {"type": "note", "text": "43 盛慕傑，〈中美商約內容研究〉，《大公報》（上海），1946年11月13日，6版。"}, {"type": "note", "text": "46 馬寅初，〈我何以反對新訂的中美商約〉，該文為在上海大夏大學的演講。原載《文匯報》（上海），1946年12月30日。收入：馬寅初著，《馬寅初全集》，第12卷（杭州：浙江人民出版社，1999年），頁390-397。馬寅初在《經濟周報》第3卷20期（1946年11月14日），另有短文〈中美商約條文內容空泛，利權喪失無可避免〉，收入：《馬寅初抨擊官僚資本》，頁197。中華人民共和國成立後，馬寅初曾擔任北大校長一職，中共建國初期對穩定物價、防止通貨膨脹和人口政策等方面提出重大建言。"}, {"type": "note", "text": "44《大公報》（上海），民35年11月6日，4版。"}, {"type": "note", "text": "45 夏炎德，〈論中美經濟關係之前途〉，《觀察雜誌》，1卷，19期（1947年1月4日），頁6。"}, {"type": "note", "text": "47《大公報》（上海），1946年11月6日，4版。中共建國初期任政務院財政經濟委員會委員、財經計畫局副局長、北京農業大學校長等職。"}, {"type": "note", "text": "其所享受之待遇，應與現在或將來任何第三國國民進入、旅行與居住於該領土，以經營該締約彼方與該第三國間之貿易，或從事於與該貿易有關之商務事業所享受之待遇，同樣優厚。"}, {"type": "note", "text": "48《大公報》（上海），1946年11月6日，4版。"}, {"type": "note", "text": "49 第2條第4款內容如下：本約中任何規定，不得解釋為影響締約任何一方有關入境移民之現行法規，或締約任何一方制訂有關入境移民法規之權利，但本款之規定，不得阻止締約此方之國民進入、旅行與居住於締約彼方之領土，以經營中華民國與美利堅合眾國間之貿易，或從事於任何有關之商務事業，"}, {"type": "note", "text": "50 沈作乾，〈中美商約中的移民條款〉，《大公報》（天津版），1946年12月28日第3版。Julia Fukuda Cosgrove, Unites Foreign Economic Policy Toward China, 1943-1946: From the End of Extraterritoriality to the Sino-American Commercial Treaty of 1946, p. 188."}, {"type": "note", "text": "51 見《大公報》（上海版），1946年11月16日，外交部之聲明。"}, {"type": "note", "text": "52 韓德培，〈評中美商約中的移民規定〉，《觀察》，第1卷第24期（1947年2月8日），頁15-17。"}, {"type": "note", "text": "53《大公報》（上海），1946年11月8日，2版。"}, {"type": "note", "text": "54 大公報（天津版），1946年11月9日第3版。11月29日該報刊出約三千餘字王化成的聲明稿。"}, {"type": "note", "text": "55 FRUS, 1945, China, pp. 1261-1300, 1319-1323."}, {"type": "note", "text": "58 Hearings before a Subcommittee of the Committee on Foreign Relations, United States Senate, 80th Cong., 2nd Sess., on a Treaty of Friendship, Commerce and Navigation between the United States of America and the Republic of China, together with a Protocol Thereto, signed at Nanking on November 4, 1946 (May 26, 1948), pp. 66-69."}, {"type": "note", "text": "56「經濟部對中美友好通商航海條約草案意見書」，甲、對於原草案之一般觀察。《外交部「中美商約案」》，中央研究院近代史研究所藏，11-10-06-01-019。"}, {"type": "note", "text": "59 Henry R. Lieberman, \"Americans Feeling Shanghai Change,\" New York Times, Nov. 26, 1946."}, {"type": "note", "text": "57《王世杰日記》，第5冊（台北：中央研究院近代史研究所，1990），頁417-418。"}, {"type": "note", "text": "60 關於戰後美國政府調停國共內戰、國會援華法案的反覆決策、在華美國官員對中國政治的主張，以及評述美國對華政策如何導致「喪失」中國的結果，相關研究非常豐富，迄今仍具代表性的著作為：Tang Tsou, America's Failure"}, {"type": "note", "text": "in China (Chicago: University of Chicago Press, 1963)."}, {"type": "note", "text": "62 于能模，〈外人在華享有內河航行與沿海貿易權之條約依據〉。《東方雜誌》，第28卷第22號（1931年11月），頁13。"}, {"type": "note", "text": "63 1946年《中美商約》第24款第2項：「……締約任何一方之沿海貿易及內河航行，不在國民待遇之列，而應由該締約一方有關沿海貿易及內河航行之法律規定之。締約雙方同意，締約此方之船舶，在締約彼方領土內，關於沿海貿易及內河航行所享受之待遇，應與對任何第三國船舶所給予之待遇，同樣優厚」。"}, {"type": "note", "text": "61 這一觀點的具體案例論述，可參閱吳翎君，《美國大企業與近代中國的國際化》一書，第一章〈條約制度與清末美國在華商務的開展〉，頁25-68。"}, {"type": "note", "text": "64 1931年6月實業部公布的〈公司登記規則〉明文規定，「對總公司不在中國境內的外國公司在中國境內設立第一家分公司，應由所在地向該國領事館證明並附具公司章程，向中國政府有關部門呈請登記註冊」。1944年在戰時陪都重慶，對外商登記變通為「準由該商本店所在地之州政府予以證明」。但是在中國的公司法正文中，仍沒有增設關於外國公司的專章或條款。詳見：張忠民，《艱難的變遷——近代中國公司制度研究》（上海：社會科學院出版社，2002），頁91、348-351。"}, {"type": "note", "text": "65 上海檔案館保存1946年美商向中國政府註冊認證的大量文件，其中每一案例均有該商何時向中國政府註冊商標的歷史。僅舉一卷宗下：「上海社會局關於美商慎昌洋行股有限公司登記問題與經濟部的來文書卷，呈為公司係外國公司依照中華民國公司法聲請認件由」，1946年12月30日。檔號Q6-1-6780，上海市檔案館。"}, {"type": "note", "text": "66 1948年12月10日聯合國大會全體一致通過的《世界人權宣言》，直接原因是對第二次世界大戰的反省。在1949年5月聯合國國際法委會通過的《國家權利義務草案》第13條，更進一步規定了「各國有一秉信履行由條約與國際法其他淵源而產生之義務，並不得藉口其憲法或法律之規定而不履行此種義務」，許多國際性的判決或裁決均支持此一原則。關於人權史議題的國際史發展，可參見：Akira Iriye, Petra Goedde, and William I. Hitchcock, eds., Human Right Revolution: A International History (Oxford: Oxford University Press, 2012)."}, {"type": "note", "text": "67 據國民政府財政顧問楊格所記，在1945年5月他為國民政府所做的50頁的財政備忘錄中，分析了戰前中國的貨幣體系、適合中國的戰後貨幣和銀行體系體制。Arthur N. Young, China and the Helping Hand, 1937-1945, p. 357. 關於中美、中英平準基金委員會詳見：吳景平，《美國和抗戰時期中國的平準基金》，《近代史研究》（北京），1997年第5期，頁78-108。楊雨青，《中美英平準基金的運作與中國戰時外匯管理》，收入楊天石、侯中軍編，《戰時國際關係》（北京：社會科學文獻，2011年），頁308-337。"}, {"type": "note", "text": "68 IMF官方網站http://www.imf.org/external/about/history.htm（下載時間2012年4月2日）。"}, {"type": "note", "text": "69 http://en.wikipedia.org/wiki/General\\_Agreement\\_on\\_Tariffs\\_and\\_Trade（下載時間2012年4月2日）。"}]}, {"id": "concl", "title": "結論", "paras": [{"type": "text", "text": "本書關注近代中國從19世紀末，對應一個初崛起於世界舞台邊緣的美國，到二次大戰後美國成為世界舞台的中心，藉由數項重要主題探討近代中國在國家治理的內外策略，以及美國人如何通過企業、技術及相關的多元渠道，將中國拉入國際化的進程。從清法戰爭的海防危急、一次大戰提供的經濟發展契機、二次大戰中的國家存亡關鍵，歷經清末、北洋到民國政府，不同政權一次次把握機會，利用各種手段與美國人互相利用（mutual exploitation）和互相合作，以拯救中國正待開展的自強事業或是化解一場國際危機。清法戰爭之際，美國正從建國以來最大的一場國家分裂戰爭中重建甦醒不久，藉由對中國事務的參與，不僅滿足了美國政府和民間向歐洲國家顯示美國作為新興國家對它在中國權益的表態，也考驗著美國人如何看待自己如何遵守歐洲列強所規範的國際法秩序。這也是本書將清法戰爭作為本書的起點，此後經歷20世紀上半葉的兩次大戰，逐步樹立了美國在國際間大國地位及其對中國事務的影響。"}, {"type": "text", "text": "美國以工商立國，大資本家和政府之間本來就有微妙難解的政商關係。19世紀末美國對華政策的主要指導者是一批從事對華貿易的商人，他們是1898年美國宣告門戶開放政策的催生者。美國資本家始終對中國的廣大市場帶有一種美好想像，儘管1920年代以前美國對華貿易整體量不大，但在個別的企業投資上（如煤油、航運、菸草、零件進口等）仍有不可忽視、甚且幾乎壟斷中國市場的影響力。一戰以後，美國躍升為國際強權，出於地緣政治上的考量，太平洋地區對維繫其國際強權地位愈為重要，美國國務院始積極推動對華門戶開放政策，用力敲開中國大門，並由華盛頓政治精英將美國國家安全的競爭披上良善道德主義的外交詞令（先不論其動機好壞）。在近代中美關係發展的任何階段，美國商人及後來形成的院外集團（lobby）都是影響美國對華政策中極具分量的利益團體。更有甚者，隨著美國對華商業活動的增加及其帶來的各種內外效應，對美國人而言更由此激發了一種改變中國的巨大圖像，這種巨大的想像貫穿於本書各個章節。1920年1月《密勒氏評論報》，刊出經營機械進口的美商慎昌洋行的巨幅廣告，很貼切地反映了一戰以後美國人拿著一把巨大的工程（engineering）鎖匙，期待用造橋、鋪軌、設廠、河川整治、發展航運等工業化科技，來改變「孔老夫子」國度的旺盛企圖心 $^{1}$ 。"}, {"type": "text", "text": "1 說明：這張跨頁巨圖，由於報紙裝訂太厚，中間未能顯示的英文字為「engineering」。該圖曾裁切移位，並加工設計後，置於作者《美國大企業與近代中國的國際化》（繁體版）封面。本書這張圖則為原圖。這張廣告頻繁出現於1920年1月到2月的《密勒氏評論報》。圖下方還引用了《論語·衛靈公》：「工欲善其事，必先利其器」。"}, {"type": "text", "text": "本書第一部分「企業活動、國家治理與中美關係」，探討清末自強運動以來中國與美國交往的極具代表性案例，審視兩國間如何開展一段頗不尋常的交往旅程。在清法戰爭時期通過李鴻章的運籌帷幄，私底下將招商局賣給美國旗昌洋行，使中國初新興的招商局輪船得以維持。這件事在中美兩個國家的內政外交上都有特殊的意義。歐洲列強在1892年始將它們駐華盛頓的外交使節由公使升格為大使，當時對歐洲主要國家而言，美國尚是一個次級邊緣國家，而中國則是一個衰敗的帝國，在清法戰爭時期的這樁買賣，美國政府很機巧地協助中國，且將旗昌的合約定義為私人企業間的行為，可說是兩個次等國家在清法戰爭時期進行的一樁奇特的軍工事業合作。另一樁成功的案例，則是一戰爆發之初中美兩國均未參加大戰，但美國人也深受英國實施「協約國敵國貿易法案」（1915年12月23）的限制和影響。此時中美兩國出於太平洋航運中急缺商船的快速需求，而讓江南造船廠成功為美國人打造了四艘巨輪，而簽約之日中國已成為協約國家陣營的一員，美國人更順勢將此約高舉為中國對協約國家打造輪船的貢獻。"}, {"type": "text", "text": "在近代中外交涉中為何時常聽到美國人索取知識產權之事？儘管美國人建國之初也頻頻偷取曾為殖民母國大英帝國的發明財產權，但美國人非常保護本國人民的創制發明權利，且寫入美國憲法修正案中，美國人特別保護個人藝文創作和企業家創新精神其來有自，成為美國社會中一種尊重知識產權的共識價值。當世界第一部國際版權公約《伯爾尼公約》1886年於瑞士簽訂，中國人惶然不知此約為何；對19世紀到20世紀初的中國人而言，版權關乎中國人如何開眼看世界的途徑。中文版權頁標誌的「版權所有，翻印必究」在清末出現時，它更多的目的是在保護中國出版商而非個人的創造發明。近代中國的追尋富強之路，從物資科技而言很大程度上是向西方取經的「竊書不為偷」——魯迅筆下主人翁孔乙己的偷書自辯之詞，然而在清末民初的中美版權交涉中，中國依據《中美商約》的規定取得法理正義的一方，並未有過錯；在華洋會審公廨開庭的結果，中國人總是勝訴的一方，成為清末民初中外交涉中極為罕見的勝局。本書探討的清末以來的中美版權之爭，看出美國在1903年和1946年兩次商約談判中均對中國做出較大的讓利，比起對日本的商約條件也更加寬厚，甚至1946年談判中關於知識產權的內容因中方無法達到美國提出的條件，最後仍依照1903年的商約為規範。從20世紀初到第二次大戰結束，間隔四十餘年的條約交涉歷程，中國堅持尚無給予外人保護知識產權的條件而獲得學習西學的方便之門；儘管如此，保護國際知識產權的概念也逐漸為中國人所知悉。值得注意的是一戰後五四新文化運動的氛圍中，已有知識分子意識到若能妥善處理知識產權問題，將有助於提升中國的國際地位，也有人呼籲應加入國際版權組織來證明中國是決決大國。遲至1990年代台海兩岸始加入國際版權公約成為會員，回溯清末民初中美版權之爭所顯現的文化傳遞、碰撞、妥協，以及中國如何迎向世界的大道歷程，迄今仍值得深思。"}, {"type": "text", "text": "本書第二部分「商人團體、技術組織與關係網」，探討中美之間由企業和技術所帶動的多元層次關係網和國際合作的機遇。中國所缺乏的新興工業技術、工廠管理和西方工程知識，諸如工廠科學管理（Scientific management）、工業標準化（Industrial standardization）推動、公共工程的規劃、商品品管檢驗和城市衛生的檢測等等觀念和實務，在中美之間它們又是通過怎樣的具體管道和組織建立起來？美國人在中國有許多不同類型的精英組織，通過這些組織拉起中美兩國人民的關係，它們在華活動也有多種面向，不僅僅局限於政治經貿活動，它們擴大了共同關注的議題。本書提出1920年代以後中美工程師組織、美國商會和中國新式資本家通過組織運作，對中國現代化技術、生產質量提升、科學化管理和城市公共文明等方面相互推進，形成一種交織相映的關係網絡。這兩個組織也可以說是標誌一戰以後在教育文化的跨國交流上頗具行動力的組織；也引領了中國商會和工程師組織在1930年代得以積極參與國際相關組織（例如國際商會、萬國工程師大會、世界動力會議組織等等），一方面展現中國作為國際社會的平等國家一員，同時也向世界展現中國市場和地理條件的特殊性。"}, {"type": "text", "text": "「美國亞洲協會」成立於1898年，在上海設有分會，是美國人在中國最早成立的商會，它同時在日本和菲律賓等地設有分會，但中國事務為其所重視，成立之初就是對華門戶開放政策的主要推手。一戰爆發以後，美國設置了在中國的單獨商會——「中國美國商會」，美國在華商人終於有一個總體發聲的組織喉舌。第一次世界大戰帶來的巨大浩劫，如何避免戰爭的重演和實現持久的和平成為戰後國際社會面臨的共同挑戰，一些民間人士也組建各種非政府組織來促進國際合作，到了1920年代「美國亞洲協會」逐漸轉型為文化活動組織。美國工商界倡導自由貿易和競爭開放的市場，深信國家之間經濟的聯繫可以帶來繁榮與和平，不論是「亞洲協會」或「中國美國商會」都傳達了以美國自由市場為主導的國際主義者理念，也傳播新式管理思想和技術知識的革新。此外，從美國在華商人的機關報《美國亞洲協會期刊》的報導，可看出該協會對中國國民精神充滿正面評價及凝聚中美友好的言論。這不僅只是出於中國龐大市場的想像，而是寄望於中國可能成為一個新興工業國家，為中國的崛起做好準備。該刊的言論和主張，推進了一戰時期美國政府和民間開拓中國市場的積極作為，而其關注的議題，則涵蓋中國社會接納以美國所代表的西方科學和技術的條件和適應性。"}, {"type": "text", "text": "成立於1919年的「中美工程師協會」，則是共同受到中美兩國政府支持而成立的一個組織，這個群體對一戰之後中國大型公共工程和基礎建設的投入有很大的貢獻。該協會不僅和美國本土工程學會進行跨國聯結，與英人在上海創辦的「中華國際工程學會」形成南北互相輝映的組織，並且和中國本土工程師學會有微妙的互動關係。中美工程師協會在中國的活動，呈現此一群技術專家組織與中國政府合力推動中國工業化建設，引介工程知識和開創建設思路，並推動中國工業建設與世界接軌的國際化歷程。不惟如此，1920年代中國本土的「中國工程師學會」的聲勢愈來愈壯大後，「中美工程師協會」更是樂見其成，認為中國人必須有自己的技術和研究團隊，期待中國工程師承擔起社會責任和強化專門技術以促使中國走向真正的工程國家。在1920年代這個組織的榮譽會員和一般會員，囊括了美國工程界最頂尖優秀的人才，並且與美國土木工程師學會往來互動；加上中國第一次大戰後留美學生的歸國熱潮，共同合力推動了1920年代到太平洋戰爭前中國的鐵路和水利建設。中國特殊地理環境和條件對於外籍工程師提供一種特殊的挑戰機遇，這群外籍工程專家們奔勞於中國窮山惡水，與險峻的地形氣候和艱難的工程搏鬥，除了極少數像美籍工程師費禮門和陶德較活躍於中國社交和知識圈，多數的工程師並不擅於文字書寫來面對文化媒體，亦不常參與社交活動，加以工程學的專業知識較難和社會大眾有直接對話，以致較不為人所知。事實上，通過「中美工程師協會」友好組織的運作，得以引介了近代西方工業技術，並傳播近代工程學知識。正是中外工程師／群體的交會合作，且跨越不同政權的輪替與經驗傳承，使中國得以進入國際工程學和科技的舞台，甚至可說翻轉了近代中國的工程命運。"}, {"type": "text", "text": "原為商人團體創辦的《美國亞洲協會期刊》在一戰後轉型為致力介紹亞洲各國文化特色，並且高舉亞洲各國應相互了解、和平共榮的旗幟。「中美工程師協會」則以重整一次大戰對文明破壞，提升生活品質的工業文明作為現代工程師的職責。很不幸的是，這兩個非政府組織在戰間期（一戰到二戰之間）所致力的知識傳遞和文化理解的和平力量，最後因世界大戰的重演而幻滅，特別是《亞洲》文化刊務早在1930年代即敲響日本侵華的警鐘，旗幟鮮明地站在中國人的抗日立場。如果美國政府及早聽從像「亞洲協會」等這些非政府組織的呼籲，對日本在亞洲的侵略有所防範，或許美國就不需為後來對遠東的整體防禦和太平洋戰爭付出巨大的代價，亞洲的安全秩序也可能有所改觀。然而，這或許也說明了戰前期美國在華非政府組織的活動和影響力仍是有限的，美國對華政策有更多受到國內外現實政治的考量與掣肘。"}, {"type": "text", "text": "現實與理想往往被視為美國對外關係的天秤，各踞美國外交的兩端，當面對國內與國外情勢的重大壓力時，兩端往往相互牽引，顯示美國外交利他主義與現實主義的兩重性格。本書第三部分「企業、戰爭與外交」，探討中國抗戰及太平洋戰爭時期，美國在華企業的遭遇及戰後美國人如何急欲重返中國市場而率先簽訂商約。美國商人的務實精神反映在發生國家衝突的政治危機中是否損及其商業利益，如同美國陸軍部長史汀生（Henry Stimson）在太平洋戰爭時的發言「如果你要說服一個資本主義國家參加戰爭……你一定得讓商業界從這個過程中發財」²。在中國投資的美國商人在日本發動侵華戰爭，而美國政府尚未宣戰之際，它們很清楚如何在中國危機中以各種手段存活下來。在戰爭時期重要的軍火物資——石油，則考驗著美國對華物資援助的底線以及美國參戰後總體戰略的考量，美國大石油公司被動員到國家戰爭中的一環，戰爭與石油企業成為一種「軍工複合體」形式，石油企業與美國政府的合作關係更加密切。本文研究的結果，美國並不是在太平洋戰爭爆發後就積極提供中國石油補給措施，事實上是在1943年下半年開始，不論是對中國石油技術的援助和補給路線才有一套縝密妥善的規劃。戰時石油嚴重匱乏，由此激起了中國人必須發展自給自足的「石油夢」，中國石油公司建立於1946年，戰後隨著國民黨政府來台，而中華人民共和國也在建國後成立國營石油企業。"}, {"type": "text", "text": "1946年《中美商約》係根據1943年《中美平等新約》的規定而簽訂，從條約史的意義是中國以主權平等國家的身分進入國際法社會之後，首次進行的一場極其重要的國際談判的里程碑，而且是在艱苦抗日終獲勝利後的努力果實，然而很諷刺的是，這部商約卻在國內遭致各種嚴苛的批評；尤其被共產黨人指為賣國商約，用以激起國內反美聲浪的藉口——正是因為美國帝國主義持續援助一個無能崩壞的國民黨政府，以致國共內戰持續延燒和加速擴大。戰後《中美商約》的交鋒，不僅是中美兩國之間對戰後中國市場如何開放的意識形態之爭，同時也是中國內部對治理國家的意識形態及黨派權力之爭，戰後商約的內部爭議正是長期以來中國人慣將內政與外交纏鬥綑綁的又一具體代表案例。中國市場是否應對外開放，特別是通過近代以來與中國親密友善的美國來對世界市場開放？或戰後中國如何以平等之姿融入國際市場的經濟體系？當時輿論的交鋒大多顯現的是內戰情緒下敵對陣營各擁其主的忿激對立，無法針對上述核心問題，展開對實質議題的理性論辯。平心而論，1946年《商約》係標誌中美在戰後重新建立一套新的國際關係基礎的開始，同時也是美國人再次貫徹其自由主義市場和「門戶開放政策」的一貫主張，在二次大戰後推展美國資本、技術和生活價值，並有意將中國市場拉入美國主導的全球經濟體系架構之中；實現世界範圍內的自由貿易和各國經濟的普遍發展，成為戰後美國對自由市場和國際經濟秩序的一種理念。對中國本身而言，戰後《中美商約》從條約權益、經濟立法與近代中國的國際化等各個層面，標誌了跨時代的意義。然而，隨著1949年國民黨政府在大陸的全面潰敗，也意味著美國人企圖通過企業、技術與多元關係的渠道來改變中國的想法，包括本書中提到的美國商人、工程師群體或留美歸國學人等社會精英團體所欲傳播的西方科學文明和精神價值，也因著1949年中華人民共和國共產政權的建立及其後冷戰格局所深化的壁壘屏障，終究是一場美國人未竟的中國夢。2019年是中華人民共和國建國70週年，中國大陸改革開放已歷40年；此其時也應是重新審視國共兩黨對半個世紀前《中美商約》討論的核心實質——中國市場與美國主導下的世界交往關係，予歷史事實（truth）與真實（reality）的客觀評論。"}, {"type": "text", "text": "2 轉引自 Eric Foner, Give Me Liberty, An American History, Fourth Edition (New York: W. W. Norton & Company, Inc., 2014), p. 853."}, {"type": "text", "text": "美國跨國企業的投資和技術擴張，顯然是和美國的全球主義環環相扣的。放在以中國作為主體的全球／國際視野，怎樣來看待這一段歷史？作者更加著意的是從中美兩國的交往進程中探索一種相互依賴（interdependency）的關係，以及這種關係在19和20世紀愈來愈趨於緊密的全球關連（global connection）。當今世界幾乎所有權力中心的內部都發生重大的變化，具有不同文化、歷史和傳統秩序理論的各個地區如何能維護世界共同體系的合法性？1971年首次訪問北京，重新打開中國市場，牽繫中美建交之路的美國前國務卿季辛吉（Henry Kissinger），在2011年出版的《論中國》（On China）一書中，省思自他首度訪問中國，30年後的中國已經成為一個超級經濟大國和塑造全球政治秩序的重要力量，美國雖贏得了冷戰，但美中關係成為爭取世界和平與全球福祉的核心要素。他認為美中關係對全球穩定與和平至關重要，美中關係不必也不應成為零和博弈，亞洲未來的和平將取決於中國和美國的遠見，以及兩國在多大程度上認同對方的地區歷史角色，寄望構建一個太平洋共同體的協商合作 $^{3}$ 。接著季辛吉在《世界秩序》一書，慨陳「自由」與「秩序」是世界秩序長治久安的兩條真理，它們有時被視為人類歷史經驗中的兩個極端，其實兩者應被視為一種相互依賴的關係：第一：沒有自由的秩序即使靠一時的鼓噪得以維持，最後也會製造出反對自己的力量；第二，沒有一個維持和平的秩序框架，就不會有自由。建立在此種意義的世界秩序必須靠長期培育，不能強加任何人，在即時通信和政治劇變的時代尤其如此 $^{4}$ 。"}, {"type": "text", "text": "近年來，隨著中國改革開放後的經濟奇蹟，「中國崛起」成為全球話題，論者多從衝突著眼，特別是針對中美兩大強權勢必走向「修昔底德斯陷阱」（The Thucydides's Trap）一決勝負的憂懼。而在台灣近年來對於19世紀中葉到1949年以前的中美關係的集體記憶，似乎停格在1979年1月台美斷交而產生的愛憎交加的不安情結中。在美國與兩岸關係如此密切的時代，兩岸對早期中美關係的學術研究似都出現一種不可言明的消沉態勢。隨著近十年來英文學界在國際史和跨國史著作的響亮問世，如何以一種超越國境的心態來擴大國際關係史的研究視角，將非政府與政府關係融於一體，在全球化時代，這樣的研究視域尤其必要。本書側重企業、技術及群體組織等非政府力量在中美關係間扮演極其重要的角色，並且在很大程度上和兩國政府的國家治理的內外因素聯繫一起；在本書的具體個案中顯示兩國政府把握契機或錯失機會，由此更加突顯決策者的睿智或無能或只是一時機巧，但不論如何，非政府網絡在中美雙邊關係中，尤其是平和互惠的力量居多。"}, {"type": "text", "text": "3 Henry Kissinger, On China (New York: Penguin Press, 2011), pp. 514-530."}, {"type": "text", "text": "4 Henry Kissinger, \"Introduction: The Question of World Order,\" World Order (New York: Penguin Press, 2014), pp. 1-8."}, {"type": "text", "text": "美國著名政治學家米爾斯海默（John J. Mearsheimer）在《大國政治的悲劇》（The Tragedy of Great Power Politics）一書中，提出「進攻性現實主義」（offensive realism），認為大國為了捍衛自身存在和既得利益，只能對潛在對手先發制人；在國際政治體系中沒有守夜人，一旦成為大國更需時時提高警覺，確保其大國地位，以取得國際政治的支配地位 $^{5}$ 。果真大國如此作為，小國在國際關係中的生存就愈加艱難，和平更是遙遙無期。除非塑造一個真正具有理想的世界公民社會及合理的和平秩序框架，否則政治悲劇可能一再地重演。誠如美國前歷史學會會長入江昭教授近年來在其系列著作一再倡導的公民社會（Civil Society）係以全人類作為共有利益及普遍性原則，如果非國家行為者持續發揮提升人類共同意識的安定力量，建立起不同個體和群體間「相互依賴」（interdependency）的感知情境，21世紀有可能建構出公民社會的世紀。這也是為何入江昭著意於「慈善與公民社會」（Philanthropy and Civil Society）兩股力量在二戰結束後的美日關係和對亞洲的諒解上扮演了相互理解和對話的重要角色 $^{6}$ 。"}, {"type": "text", "text": "崛起後的中國將對國際秩序造成怎樣的震盪，這世界是否仍能維持「美國統治下的和平」（Pax Americana）？中國崛起究竟是對外輸出福祉或是一場災難？世界是否有「中美共治」（Chinamerica）的可能？中美兩大強權的未來發展肯定是左右國際秩序的關鍵因素。從事國際關係的學者擅於分析自由主義和現實主義在權力政治上的邏輯行為而提出一套見解或知識理論，而歷史學者的責任則是從歷史進程中找尋對當下有意義的對話。本書系統考察了百年來中美兩國在企業交往、技術轉讓、知識引進的具體案例，在全球化時代，這些議題是考察國家行為的一個至關重要的窗口。作者從非政府與政府的關係探討百年來中美關係的多元面向，乃至於美國與戰後台灣發展的淵源，更著意於中美雙邊關係中的合作共榮，而非一面倒地強調衝突與競爭，期待歷史予人以智慧。"}, {"type": "text", "text": "5 John J. Mearsheimer, The Tragedy of Great Power Politics (New York: W. W. Norton & Company, 2001)."}, {"type": "text", "text": "6 詳見Akira Iriye, Global Community: The Role of International Organizations in the Making of the Contemporary World (Berkeley: University of California Press, 2002). Akira Iriye, “The role of Philanthropy and civil Society in U.S. Foreign Relations”, in Yamamoto Tadashi, Iriye Akira and Iokibe Makoto eds., Philanthropy and Reconstruction: Rebuilding Postwar U.S.-Japan Relations (Tokyo and New York: Japan Center for International Exchange, 2006), pp. 57-60."}, {"type": "note", "text": "1 說明：這張跨頁巨圖，由於報紙裝訂太厚，中間未能顯示的英文字為「engineering」。該圖曾裁切移位，並加工設計後，置於作者《美國大企業與近代中國的國際化》（繁體版）封面。本書這張圖則為原圖。這張廣告頻繁出現於1920年1月到2月的《密勒氏評論報》。圖下方還引用了《論語·衛靈公》：「工欲善其事，必先利其器」。"}, {"type": "note", "text": "2 轉引自 Eric Foner, Give Me Liberty, An American History, Fourth Edition (New York: W. W. Norton & Company, Inc., 2014), p. 853."}, {"type": "note", "text": "3 Henry Kissinger, On China (New York: Penguin Press, 2011), pp. 514-530."}, {"type": "note", "text": "4 Henry Kissinger, \"Introduction: The Question of World Order,\" World Order (New York: Penguin Press, 2014), pp. 1-8."}, {"type": "note", "text": "5 John J. Mearsheimer, The Tragedy of Great Power Politics (New York: W. W. Norton & Company, 2001)."}, {"type": "note", "text": "6 詳見Akira Iriye, Global Community: The Role of International Organizations in the Making of the Contemporary World (Berkeley: University of California Press, 2002). Akira Iriye, “The role of Philanthropy and civil Society in U.S. Foreign Relations”, in Yamamoto Tadashi, Iriye Akira and Iokibe Makoto eds., Philanthropy and Reconstruction: Rebuilding Postwar U.S.-Japan Relations (Tokyo and New York: Japan Center for International Exchange, 2006), pp. 57-60."}]}, {"id": "appendix", "title": "附錄", "paras": [{"type": "title", "text": "附錄"}, {"type": "title", "text": "4-1：中美直接往來貿易統計表，1864-1928"}, {"type": "table", "text": "tables/tbl_01_35181c3adfbb0b8077bcc0e787b4e646810cef8cd84cae6331d10e7f7ffa0a61.jpg"}, {"type": "table", "text": "tables/tbl_02_1f779dda7ff158ad08acf3c583568831d9550b4585dad8acd78f10511cab530b.jpg"}, {"type": "title", "text": "4-2：上海美國大學俱樂部歷屆主席，1912-1935"}, {"type": "table", "text": "tables/tbl_03_3b7fd61ed04f60b616c59f5b092ded0f65b2cdffc88a59dfdb3519cea849360d.jpg"}, {"type": "title", "text": "5-1：美國亞洲協會歷屆主席，1898-1939"}, {"type": "table", "text": "tab
