強之間以求厚利，所餘者僅敷該國人之自用」，因而中國勢必發展民族航業 $^{10}$ 。日本航業的進步概況亦為中國知識界重視，呼籲國人宜急起直追，利用大戰乘機振興中國航業 $^{11}$ 。《東方雜誌》刊有〈神州航業談〉一文申述國內外航業和航路的重要性，在內河行輪方面，呼籲國人合群力群資設立航業公司，與外輪奮勇直追。在遠洋航路方面，則呼籲政府投注以巨大資本、專門人才和國家保護，以自製巨艦發展遠洋航路；建造巨艦則必須有人才，初航之時無妨聘用外國專家，但最後仍必須培育中國本身的海事人才。該文作者強調，必須以政府的力量來發展並保護遠洋航運：「政府宜以國權之全力，以護衛商艦」，「遠航洋海，恰如去家之兒，孤子無依。設無保護者，遙臨其後，必受人欺凌，任人愚弄」 $^{12}$ 。"}, {"type": "text", "text": "一戰前後美國造船業的突飛猛進受到中國官方和民間的矚目。《東方雜誌》曾謂「近二年來，美國造業船發達之速，無異僑僂之侏儒，一躍而為昂藏之丈夫」；此一情況係受益於一次大戰：「至一九一六年。美國沿岸及內地各船廠。無不擁擠不堪……於是因戰事之影響，造船業素未發達之美國，遂一躍而與世界第一造船國相並矣。然上所指之數，僅商船而已，若合海軍軍艦計之，猶不止此。」 $^{13}$ 這篇文章提到大戰爆發最初二年美國造船業（特別指商船）發達，與事實略有出入。一戰前後美國的造船工業技術無疑已雄踞全球之前列，但也如同前文所述，一戰爆發後，美國國際商船仍明顯不敷使用，太平洋商船業尤其蕭條 $^{14}$ 。"}, {"type": "text", "text": "8 Noel H. Pugach, \"American Shipping Promoters and the Shipping Crisis of 1914-1916: The Pacific. & Eastern Steamship Company,\" pp. 166-167. Philip B. Kennedy, The Seamen's Act, Annals of the American Academy of Political and Social Science, Vol. 63 (1), National Industries and the Federal Government (Jan., 1916), pp. 232-243."}, {"type": "text", "text": "9 1916年8月「美國中國商會」在上海召開首次年會，討論的焦點即為大戰期間船隻載運不敷使用，必須借助英船與日船所衍生出的相關問題。 First Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, Aug. 18, 1916. pp. 1-2, 52-57. 參見本書第四章。"}, {"type": "text", "text": "10〈中國宜乘機振興航業〉，《東方雜誌》，第15卷第1號（1918年1月15日），頁145。"}, {"type": "text", "text": "11〈日本航業鉅觀〉，《東方雜誌》，第15卷第1號（1918年1月15日），頁167。"}, {"type": "text", "text": "12〈神州航業談〉，《東方雜誌》，第15卷第1號（1918年1月15日），頁177-181。"}, {"type": "text", "text": "當時的北洋政府敏銳感受到歐洲大戰爆發後西洋航輪銳滅，歐洲國家無暇顧及中國情勢，中國正可利用此一機會，振興中國航運。交通部長梁士詒密電袁世凱：「……現值歐洲戰事，洋商之運銷華貨日稀，若不趁此時機，趕緊組織商輪，航行各國，自運華貨出洋銷售，恐輸出且將益減，不足以謀自立而資補救。」 $^{15}$ 惟組織商輪需有龐大資金，政府財政艱難，尚無力經營及此，向來對中國友善的美國公使芮恩施適時扮演了重要橋梁。"}, {"type": "text", "text": "在美國駐華公使芮恩施的引介下，由美國麻里蘭州麥登斯新士公司（Metherns & Sons Co.）與中國簽定組織一輪船公司，該公司派出代表腓力曼新（Philip Manson）於1915年7月29日與梁士詒商定合同條件，並與農商部正式簽訂一項合同，中美雙方同意組織「東方太平洋輪船公司」（Eastern & Pacific Steamship Co.），據梁士詒所記「購備船隻，掛中國旗，道經巴拿馬運河，往來中國海岸、大西洋及美國海岸等處，純為商辦公司，股本二百萬，中美各占其半。」籌足資本之法，決定發賣美金3百萬元債票，以該公司所有財產為初次保押品，雙方各任發行債票之半數。由債票所得之現款，用以買船、裝船、租船 $^{16}$ 。這項合作內容利益甚多，不僅可減輕運費、不必受洋商束縛，有利於商業競爭之用途，亦對於培育中國航海職員及機器師各項專業人才大有裨益。中國政府隨時有權查核該公司之帳目，該公司之財政報告需呈報中國政府，且開辦3年之後，中國即有權逐步買回。所有每年應付之債票利息6釐和4釐的減債基金，如該公司淨利不足支付，應由中國政府擔保補足其所差之數，此為中國政府應盡之責 $^{17}$ 。該合同債票利息比起國內公債或戰前其他各國的鐵路合同還要優惠 $^{18}$ 。"}, {"type": "text", "text": "據梁士詒所記，中美合辦「東方太平洋輪船公司」案的簽約時間為1915年7月29。如據美方資料，腓力曼新於1915年4月25日抵華，在芮恩施的大力促成之下，於1915年5月29日簽訂合約，成立「東方太平洋輪船公司」，該公司為在美國註冊，懸掛美國國旗，並非梁士詒所言懸掛中國旗。這一部分因筆者尚未查到相關資料無法詳加考證。其他內容如：股本2百萬，發行債票共值美金3百萬元，中國允諾負擔債票利息6釐，大致相同。腓力曼新未顧及戰時不斷上升的物價和全球船隻嚴重短缺，離華之前答應6個月內以4艘輪船開辦此一業務 $^{19}$ 。"}, {"type": "text", "text": "13 引自：愉之，〈美國造船業之發達〉《東方雜誌》，第15卷第2號（1918年2月15日），頁50-51。相關文章尚有：君實，〈美國海運界之過去現在及將來〉，《東方雜誌》，第16卷第3號（1919年3月），頁45；〈美國之造船事業〉，《東方雜誌》，第16卷第3號（1919年3月），頁194-195。"}, {"type": "text", "text": "14 君實，〈最近世界海運之大勢〉，《東方雜誌》，第17卷第10號（1920年10月），頁16-19，刊有1914年6月世界之商船噸數之排名，依序為英、德、法、美、日，可看出英國商船噸位數遙遙領先各國；一戰之後1918年12月的數據，各國商船噸數的排名次序為英、美、德、日、法，美國排名由第四擠進前二位。"}, {"type": "text", "text": "16《民國梁燕孫先生士詒年譜》，頁282。"}, {"type": "text", "text": "17《民國梁燕孫先生士詒年譜》，頁282-285。收有完整合同及交涉經過。"}, {"type": "text", "text": "15 鳳岡及門弟子謹編，《民國梁燕孫先生士詒年譜》（台北：臺灣商務印書館，1978），頁284。"}, {"type": "text", "text": "18 民國以後國內公債利率歷年遞增，大戰期間內債有六釐至七釐，甚至更多。而戰前中國與各國的鐵路外債合同，利率以五釐居多，多者有六釐、六釐半、七釐半、墊款及短期借款至高至八釐。張瑞德，《近代鐵路事業管理的研究——政治層面的分析，1876-1937》（台北：中央研究院近代史研究所專刊，1991），頁11-12。"}, {"type": "text", "text": "這項合約最後並未達成，梁士詒稱其任命馬小進經營此事，「進行漸次成功，耗資亦鉅，原本預訂冬間開航」，「不幸帝制發生，干戈擾攘至新事業於焉中斷」 $^{20}$ 。另據美國駐華公使芮恩施記載，「美國政府同意提供該項合同中三百萬美元的保證金，不幸的是，這個合同遭到了美國在中國的企業通常遇到的命運，即沒有實行」 $^{21}$ 。二人的說法都語焉不詳。如比對相關資料大概還有以下其他因素。腓力曼新在美國輪船工業界的資歷和地位並不高，僅曾任職大西洋海岸輪船公司（Atlantic Coast Steamship Company）的經理。而且，當時美國幾個大輪船公司都反對「水手權利法案」，腓力曼新和參議員羅伯特·拉福萊特站在一線，將自己視為「水手權利法案」的捍衛者，惹毛了這些大船東。更重要的是「東方太平洋輪船公司」發行債票乏人問津，該公司亦無法提供半數的資金和債券擔保，而他所允諾以4艘船舶開辦業務，更是遙遙無期 $^{22}$ 。由於腓力曼新遲遲未能交貨，導致對華一向友好的芮恩施不滿，要美國國務院催促此事，同時芮恩施也和其他公司接觸，並接洽華美商品交易公司（Chinese American Products Exchange Company, CAPEC）接手此案，但卒無所成。「東方太平洋輪船公司」於1920年就沒有營運的事實，據資料所見1924年後沒有登記，且並未擁有任何一艘商船，此後沒沒無名 $^{23}$ 。總之，中美合辦「東方太平洋輪船公司」案子最後石沉大海，中國政局的不穩定，固為投資者所卻步，但也有來自美國本身的因素，並非僅如梁士詒所言帝制發生以致該事業中斷。"}, {"type": "text", "text": "據北京政府駐舊金山領事的電報，1915年10月有一批在美華僑合資成立「中華郵船公司」（英文名為China Mail Steamship Company），該公司係向美國太平洋郵船公司購得一船從事來往太平洋航運 $^{24}$ 。這家公司中文報刊譯為「中國郵船公司」。《申報》1915年10月14報導了舊金山華僑組織一航務公司，向太平洋郵船公司購定「中國號」（China），而該船來往太平洋已三十餘年，駛行250次 $^{25}$ 。1917年3月《東方雜誌》刊出以「黃華」署名來自美國的投稿，這篇文章事實上為「中國郵船有限公司董事局」擴大招募華商入股的一篇文告。該文詳加記載了該公司之緣起、開辦之資金和營運狀況、公司之股東成員、公司現況和擴充之計畫。該文首先力陳華商自籌資本興辦民族航運企業的緣由。據云由於大戰爆發後時英國勢力退出太平洋航線，幾乎由日本獨占市場。自日本提出21條要求後，在美華人會館即有抵制日貨之舉，而日人則以反抵制對待華人。迨美國太平洋郵船公司停辦，在美華人乃風起泉湧，投資集股成立公司，向美國太平洋郵船公司買一船，名「中國」者，於1915年11月1日，由美洲作第一次之航行，「是為吾人之五色旗飄揚於太平洋之始。」 $^{26}$"}, {"type": "text", "text": "24〈華僑擬組織太平洋輪船公司案〉，舊金山領事電外交部，民國4年8月28"}, {"type": "text", "text": "25《申報》，1915年10月21日。"}, {"type": "text", "text": "1916: The Pacific. & Eastern Steamship Company,\" p. 174."}, {"type": "text", "text": "23 Kenneth J. Blume, Historical Dictionary of the U.S. Maritime Industry (Lanham, Md.: Scarecrow Press, 2012), p. 375. CAPEC的老闆為歐文（Clarence J. Owen），首席顧問則是曾任密爾沃基（Milwaukee）市長的羅司（David Rose）。羅司於1916初銜命來華，不僅想處理「東方太平洋輪船公司」的合約轉讓問題，更想擴大在中國的棉花和茶葉貿易，最後羅司雖未能解決「東方太平洋輪船公司」的後續問題，但此行他和上海總商會相談甚歡，並於次年率領羅司實業團訪華，造成一時轟動。關於1917年羅司實業團訪華，可詳見賈中福，《中美商人團體與近代國民外交》（北京：中國社會科學出版社，2008），頁95-102。"}, {"type": "text", "text": "19 Noel H. Pugach, “American Shipping Promoters and the Shipping Crisis of 1914-1916: The Pacific. & Eastern Steamship Company,” p. 172."}, {"type": "text", "text": "20《民國梁燕孫先生士詒年譜》，頁285。"}, {"type": "text", "text": "21 Paul S. Reinsch, An American diplomat in China (Garden City/N.Y., Toronto: Doubleday, Page & Company, 1922) p. 164."}, {"type": "text", "text": "22 Noel H. Pugach, \"American Shipping Promoters and the Shipping Crisis of 1914-"}, {"type": "text", "text": "日。《外交部檔案》，03-06-020-01-001。"}, {"type": "text", "text": "黃華的文章也提到美國太平洋郵船公司之停航，係因受「水手權利法案」波及之故，「水手例者則一律不用華人是也」。事實上，此一法案並非不用華人，而是保障一般水手基本薪資和福利，在此一情況下，原本華人水手以低廉工資而進用，由此有中國水手之船被禁止駛入美國海港的說法。這家公司初開辦時資金定為250萬，而開辦時僅得五、六十萬而已，原本擬以香港作總公司，但港中人士於投資不甚踴躍，漠然視之，屆辦之期，港中集資遠不如舊金山華人，始以舊金山為總部。公司成立之初以30萬美金向美國太平洋郵船公司購買一船，名曰「中國號」。「中國號」重10,200噸，長480尺，堪稱規模不小的運輸輪。總理為陸潤卿（廣東銀行之總理），副總理為鄭晉卿。這家公司為華商籌備，究竟為何選擇在美國註冊受他國保護，據云有六大苦衷，例如：「政府辦事素緩，一呈察、一批查，可延擱至二三年之久，而時機不可失，不能久待」。還有創辦時間正值帝制風潮初發生之時，憂心袁政府「對於僑民，殊無好感」 $^{27}$ 。是以「中國號」船尾懸掛美國旗，而中華民國之五色旗則在中桅，為不得已之原因。本文收錄該公司董事會於1916年5月刊載擴大招收第二期股之廣告，呼籲「我同胞諸君，再發愛群愛國之熱誠，踴躍附股，以期擴張航權發展商業，毋使外人笑我，便為厚幸」 $^{28}$ 。"}, {"type": "text", "text": "「中國郵船公司」以歐戰仍在進行，持續向國人招募資金，期望訂製新船與外人競爭，不久即獲得成效。據相關資料比對，大戰末期「中國郵船公司」已有2艘設備新穎的運輸輪，中國號（China）、南京號（Nanking）航行太平洋，這兩艘輪船均有萬噸規模，每星期五內可航行太平洋一次。該公司另有一尼祿號（Nero）租借給英國政府使用，所以已擁有3輪。《申報》記載，「中國郵船公司」南京號新船於1918年7月26日抵滬並舉辦招待會，觀者約8百至1千人。船長480英尺，寬48英尺，重15,000噸，能載貨4,500噸，可容頭等客132人，二等客100人，散艙客500人。船上設備完善，地鋪厚瓊，衣櫥、電風扇、閱書電燈、浴室、公共休閒室和大餐廳等設備齊全。最令觀者矚目的是船上設有醫院，病榻21張，布置設備均甚講究，據稱「如遇必要時，有外科醫生可施行開割之手續，除應有器械一律備置外，且有看護婦二人」 $^{29}$ 。"}, {"type": "text", "text": "「南京號」係以美金90萬元購自美國康格萊斯號（Congress）被燬之船殼及機器，重新修葺裝備。由於修理費用竟高達340萬元，「中國郵船公司」為解決龐大財務問題，不得不為擴充資本，發行債券150萬元。惟據該公司之章程，發行債券需有股東2/3之票決，由於華人股東散處四方，乃聽從律師之建議，另成立一家新公司以解決發行債券問題。這家新公司為中美合資，由美國資本家三人，中國資本家二人合組之，然此一舉動引起部分華人股東的嚴重不滿，內部沸沸揚揚，以致「中國郵船公司」一再澄清該公司「純屬華人營業之性質，彼反對者係出於誤會」 $^{30}$ 。「南京號」籌措過程中固有中美合資和華人股東內部之間的爭議，但不論如何這艘豪華氣派的「南京號」為當時中美民間人士所合夥投資。"}, {"type": "text", "text": "29〈中國輪船公司新船抵滬續誌〉，《申報》，1918年7月27日，第3張。"}, {"type": "text", "text": "26 黃華，〈記中國郵船公司〉，《東方雜誌》，第14卷第3號（1917年3月），頁"}, {"type": "text", "text": "27 黃華，〈記中國郵船公司〉，頁41-42。"}, {"type": "text", "text": "28 黃華，〈記中國郵船公司〉，頁44。"}, {"type": "text", "text": "據曾任北洋政府交通總長葉恭綽的記載，由於中美間往來船隻甚少，「中國郵船公司」三輪，皆得各國之信用，每次客貨各艙，無不滿載，營業之盛，傳播一時。並提到該公司成立的確切時間為1915年10月1日，由旅美華僑籌資創建，為我國汽船通行太平洋之始。交通部為獎勵遠洋船業起見，以該公司每年所納噸鈔，由交通部發還，移作獎金。1916年已經核准。自該公司船隻到關納鈔之日起，扣足一年，提及補助金5萬元，每船即1萬2千5百元核給，以三年為限 $^{31}$ 。吾人雖不知在北京政府財政短絀的情況下，這筆補助款項1916以後是否確實核給。然而，由此事可看出北京政府鼓勵國人開展遠洋航運的作為。就在一戰大戰結束後，1920年北京政府頒布〈航業獎勵條例〉14條，以獎勵金或其他方式鼓勵在中國政府註冊之遠洋船舶，體現北京政府重視遠洋航運之政策 $^{32}$ 。"}, {"type": "text", "text": "上述可知一戰時期美國太平洋岸航運輪船不足的各項背景因素。時值美國政府有意擴張遠東政治和貿易版圖之際，不得不解決和正視太平洋航運之問題。與此同時，中國政府和民間都強烈感受到太平洋航運和輪船事業的重要性。中美兩國自近代以來的特殊友好關係，使美國成為中國在跨太平洋航運業中較可信賴的友好合作者。大戰爆發之初，即有中國交通部主動提議和美國企業界合作，在美僑商則雄心勃勃投資太平洋輪船事業，不論以購買美國輪船或其他中美合資形式，但也特別標榜有華人營業和民族資本之性質。此一圖像說明一戰時期中美太平洋航運的相互需求，在此一機遇下「江南造船所」自製承造美國輪船案格外有意義。"}, {"type": "text", "text": "二、「江南造船所」承造美國四艘巨輪案"}, {"type": "text", "text": "(一) 合作源起"}, {"type": "text", "text": "1917年8月美國太平洋輪船公司協同美國國際大財團「廣益公司」(American International Corporation, AIC)意圖和北京政府談判一筆重組整頓上海江南造船所的合約，此事獲得美國政府的支持，但尚未簽定正式合約。廣益公司成立於1915年11月，是一次大戰爆發後由一群美國銀行家和實業家為促進美國在海外投資所成立的國際大財團 $^{33}$ 。"}, {"type": "text", "text": "30 由於新成立的中美合資公司，資本額有1千萬，在表面上觀之，組織新公司者似已收買舊公司，若干舊金山華人抱此疑慮，提出嚴重抗議；指斥修船費用過高，有人從中漁利，要求停發債券，美人三名脫離新公司之關係。股東大會的內部風波也見諸於報章，《中國輪船公司新船抵滬續誌》，《申報》，1918年7月27日，第3張。《中國輪船公司公司股東會記》，《申報》，1918年8月28日。《中國輪船公司公司股東會續記》，《申報》，1918年8月29日，第3張。"}, {"type": "text", "text": "31 葉恭綽，〈五十年來中國之交通〉，收入：《遐庵匯稿》（上海：上海書店，1990。民國叢書第2編，綜合類），中編，詩文，頁283。"}, {"type": "text", "text": "32 葉恭綽，《遐庵匯稿》上篇，公牘，〈釐訂船業獎勵條例請明令公布文，民國九年〉、〈附航業獎勵條例〉，頁67-69。"}, {"type": "text", "text": "英國外交部得知此事後，表達關切。在英國外交部致美國國務院的電報顯示，英國表示假使江南造船所需要重整，必須考慮英國公司的利益，因為英國長期以來協助中國政府從事江南造船所的整頓計畫，該廠數年來已僱用不少英國人擔任主管。英方表達，因正值大戰時期，英國打算利用江南造船所的船塢來建造貨船，由於英國正受困於德國的無限制潛艇作戰，商船損失極其嚴重，希望所有可資利用的造船資源都將發揮到最大效用，因而英國政府急於知道英國提出的整頓江南造船所規劃是否可被優先考量。英方認為重整江南造船所方案有賴於日本政府所控制的漢陽鋼鐵廠的生鐵，必定先確保生鐵來源無虞；雖然日本明白表示不樂見此一方案落於非日本的外國利益，但為了因應戰時緊急情況，他們準備支援英國方面與日本資本家合作建造貨船。因此，英國向美國明白表示美國政府此時不僅不宜插手，更應指示美國駐京代表回絕太平洋輪船和廣益公司或其他公司參與江南造船所的整頓計畫。而英國外交部就此事詢問北洋政府時，北洋政府則正式答覆英方，因北京政治不穩定，此次中美合作是否能成，仍有待北京度過這波新舊國會和派系政爭引發的政治危機 $^{34}$ 。"}, {"type": "text", "text": "「江南造船所」承辦美船交涉之初，受到同為協約國家的英國和日本的反對。在英日可能合作的情況下，當時美國駐華公使芮恩施擔心北京政爭不斷，如果親日派掌權將對美國在華投資案造成不利影響。例如1917年11月傳出曹汝霖和陸宗輿可能組閣，芮恩施即致電美國國務院這一波親日派掌權的情勢對正與北京政府洽商合同的貝里咸鋼鐵公司（Bethlehem Steel Company）以及東方礦業有限公司（The Orient Mines Limited）的開採鐵礦計畫有所不利 $^{35}$ 。據筆者過去的研究也印證一次大戰時期儘管英美日同為參戰國家，但各國關係相當微妙，為保有在華投資之既有權利，並不因戰時合作關係而舒緩在華的競爭張力，甚至因大戰的關係惟恐國際秩序驟變慌亂，各國愈是殫精竭力保護在華既有利益 $^{36}$ 。"}, {"type": "text", "text": "1917年4月美國參戰後，急於蒐集在上海可供造船的各式情報，駐上海副領事亞當斯（Walter A. Adams）於1917年6月提供一份八頁的詳細報告，提到目前上海共有三家有能力製造輪船的公司如下：一、中國江南造船所（Kiangnan Dock and Engineering Works）；二、英商耶松有限公司（The Shanghai Dock and Engineering Works Co. Ltd.）；三、英商瑞榕機器造船公司（The"}, {"type": "text", "text": "33 廣益公司的董事成員囊括美國最大財團和實業家，包括：摩根（Morgan）企業、美孚公司（Standard Oil Co.）、杜邦公司（F. I. DuPont）、美國電話電報公司（American Telephone and Telegraph）、通用電器公司（General Electric）和紐約花旗銀行（National City Bank of New York）等等。關於廣益公司的歷史，詳見吳翎君，《美國大企業與近代中國的國際化》（北京：北京社會科學文獻，2014），頁121-125。"}, {"type": "text", "text": "34 British Foreign Office to the Secretary of US, Aug. 14, 1917, United States National Archives (Microfilms), Washington, D. C. Records of Department of State Relating to Internal Affairs of China, 1910-1929. (hereafter cited as NA.) 893.642/6."}, {"type": "text", "text": "35 Paul S. Reinsch to the Secretary of State, Nov. 30, 1917, NA, 8963.642/7."}, {"type": "text", "text": "36 例如列強在華的鐵路投資和電報事業的競爭激烈，各國之間各有盤算。詳見：吳翎君，《美國大企業與近代中國的國際化》，第4章和第6章。"}, {"type": "text", "text": "New Engineering and Ship-buliding Works, Ld.)。三家公司中，英商耶松有限公司據其經理自稱該公司的經營「極其保守」（ultra-conservative），「自1889年以來沒有打造一艘船」。至於另一家英屬英商瑞榕機器造船公司稱可造六艘木船，如果木材原料來源無虞。至於排名第三的江南造船所為原江南製造局的一部分，能造商船及軍艦，目前設備齊全可提供造船。這份報告詳加分析造船梁木（timber）在大戰爆發後價格昂貴，柚木（teak）價格卻比戰前便宜，但木料的進口因大戰運輸困難，難以保證是否能進口足夠的木料來造船。報告中對於中國人勤快、學習有效率，又有木工技術，讚譽有佳。一位上海美孚公司油輪主管就向他遊說上海至少可以找到數百位能繪製輪船圖的一流人才和技術木工 $^{37}$ 。"}, {"type": "text", "text": "但副總領事亞當斯的這份報告書不知何故竟被上海總領事忽略，並未馬上送到美國國務院。1917月12月5日，江南造船所總工程師毛根（Robert Buchanan Mauchan, 1868-1936）向上海總領事自薦該所樂意承造美國輪船的熱切誠意，並陳述該所技術先進，足以承造大型輪船的能力，檔案中提到該局同時可以承造2艘5,000噸級或3艘3,000噸級的鋼質船，中國工人足以承擔這件工作，而且保證品質優良。毛根說：「如果美國政府需要3千噸級的輪船，無疑本局工人可以打造出不輸於世界任何地方的一等輪船」 $^{38}$ ，這封郵件連同前述上海副領事於1917年6月所做的8頁調查報告，到了1917年12月13日才一併送交美國國務院。國務院收到上海總領事的報告後，非常不悅，質疑上海副領事亞當斯為何將如此重要的情報延宕半年之久，要他解釋公文延宕的理由。此事最後不了了之 $^{39}$ 。蘇格蘭工程師毛根於1905年起擔任關於江南造船所的技術顧問和「商業代理人」，與江南造船所建立有效的經營合作關係，毛根也因成功交涉承造美艦案獲得劉冠南所長的信任，雖然有人評論毛根濫用職權，然而他在劉冠南擔任所長任內（1916-1925）彼此默契良好，為促進造船所現代化、承攬外國訂單和防止外國勢力控制該廠等議題有所貢獻。據資料顯示，江南造船所在毛根主持監督下，1912年製造的「光華輪」已打破上海一地出廠船隻的噸位 $^{40}$ 。"}, {"type": "text", "text": "1917年12月13日，上海總領事西蒙斯（Thomas Sammons）"}, {"type": "text", "text": "39 The Secretary of States to Thomas Sammons, Jan. 29, 1918, NA, 893.642/8."}, {"type": "text", "text": "40 毛根亦延攬其弟在該廠工作，因而有小大毛根之稱。1926年在全中國的排外罷工運動中，大毛根辭職，次年返英，於1936年病故。其弟小毛根則於1927-45年間仍服務於江南造船所，但其權位和威望遠不如其兄。詳見：（法）科爾耐著，黃慶華譯，〈大毛根與江南造船所（1905-1927）——中外合作一例〉，《國外中國近代史研究》（北京：中國社會科學院近代史研究所），第24輯（1994年），頁120-132。科爾耐對大毛根在1887年來上海之前的經歷較不清楚，筆者據1936年其過世後《南華早報》（South China Morning Post）的報導簡略補充如下：他在1882-1887年曾在蘇格蘭鄧巴頓（Dumbarton）從事高壓鍋爐的工作，1887年進入李鴻章創辦的輪船招商局，1894年進入英商和記洋行（Boyd & Co.），向中國口岸正興起的新式工廠推銷蒸汽機器。1895-1900投入上海正新興的新式紡織業推銷縑絲機器，後來成為上海英商耶松船廠的一員，負責修理1904年日俄戰爭後破損的俄國船隻。1905年受中國政府之請加入江南船塢所，迅速擴充船廠規模。DOCK MANAGER DIES: Well-Known Identity Of Shanghai Waterfront MR. R. B. MAUCHAN, South China Morning Post (1903-1941); Mar. 24, 1936; ProQuest Historical Newspapers: South China Morning Post. p. 2."}, {"type": "text", "text": "37 Vice Consul Walter A. Adam (Shanghai) \"Facilities and Materials at Shanghai for the Construction of Wooden Vessels of Standardized Parts Thereof,\" June 15, 1917, NA, 893.642/8."}, {"type": "text", "text": "38 R. B. Mauchan to Thomas Sammons (American Consul-general, Shanghai), 5th Dec., 1917, NA, 893.642/8."}, {"type": "text", "text": "轉給國務院關於「在上海造艦的可能性」（Shipbuilding Possibilities at Shanghai）時，除陳述中英三家可供造船的公司之外，他也推薦江南造船所比起其他二家英國公司更適合與美國政府合作。但他又加上個人評述，認為目前原料價格如此高昂，在中國造船要仰賴進口木料和原料，如果造價是美國政府的主要考量，那麼中國市場的廉價勞力和昂貴的進口原料將兩相抵銷，這項交易並不划算；除非美國政府有意通過與江南造船所的合作來促進中美友好關係 $^{41}$ 。"}, {"type": "text", "text": "1918年7月初美國船政局長赫爾利（Edward N. Hurley, Chairman of the Board）請求國務院指示是否批准江南造船所的申請書，因其轄下的「急難船隊公司」已收到江南造船所提出申請，盼為美國政府打造數艘輪船，希望美國方面能供應所需造船原料。該局表示由於美國造船工業目前大量需要原料供給，以該局的政策並不贊同在美國境外建造輪船，但是此一合約是和中國政府的船廠增加關係的可能機會 $^{42}$ 。美國國務院很快批示「國務院出於政治立場（political standpoint）認為和江南造船所簽訂的這項合約是件好事」。國務院提及美國船政局目前和日本境內的船廠也有類似的合同，而據駐華領事報告也顯示江南造船所具造船的良好裝備和能力，國務院認為「美國船政局應極盡可能利用此一機會促成此事，並可在此一時機促進中美友好，由此顯示美國在這一合約中並無歧視，排除似偏愛日本船廠的疑慮」 $^{43}$ 。一戰時期美國在海外的造船計畫不僅是兵商用途，其原料管制和造艦需求均和國防外交聯繫一體。美國最初確係為解決戰時中美航線之需求而與中方有所接觸，然但孰料戰時原物料一再上升，美國政府最後同意江南造船所的案件主要係基於向中國表示友好，且對中國表示和日本並無差別待遇之意。"}, {"type": "text", "text": "為不致延遲此案，且因往返電報商議殊難詳盡。1918年4月8日江南造船所所长劉冠南建請中國海軍部派工程師毛根赴美與美國政府直接交涉此案 $^{44}$ 。毛根於該年5月9日啟程赴美商談此事 $^{45}$ 。7月13日，美國船政局轉請美國政府致電美國駐上海總領事「告訴江南（造船所），合同條款規定其可全力以赴」 $^{46}$ 。但美國船政局合約司經理費瑞斯（Merris D. Ferris, Manager, Contract Division）顯然有所疑惑，以密件詢問國務院遠東司司長衛理（Edward Thomas Williams）這件在中國的造船合同是否係「特殊條約或外交文書」（a Special Treaty of Diplomatic Correspondence，原文為大寫），國務院是否要在合約中加上特殊的子句 $^{47}$ 。遠東司長很快回覆這件在中國的造船合同並非所謂外交條約或外交文書，此約由船政局代表、毛根、大來公司代表羅司（Ross W. Smith）於遠東司洽談，遠東司衷心樂見此一結果 $^{48}$ 。這件事美國政府等於扮演居中角色，讓中美企業作為雙邊合作的主人，且又能以促成此一合同展現中美邦友。紐約《布魯克林鷹報》（The Brooklyn Daily Eagle, New York）次日即引述華府的善意說詞，稱中國成為以造船來協助擊潰德國的國家成員，此一合同是大戰以來中美關係最受矚目的成果之一，中國也通過此事展現中國試圖發揮參戰國一員的作用 $^{49}$ 。"}, {"type": "text", "text": "44 海軍部致駐美顧公使（維鈞）函，1918年4月8日。《外交部檔案》，03-12-010-03-001."}, {"type": "text", "text": "45 江南造船所所长劉冠南致駐美顧公使，1918年5月8日。《外交部檔案》，03-12-010-03-006."}, {"type": "text", "text": "41 “Shipbuilding possibilities at Shanghai”, December 13, 1917, NA, 893.642/8."}, {"type": "text", "text": "42 Edward N. Hurley to the Secretary of States, July 1, 1918, NA, 893.642/13."}, {"type": "text", "text": "46 “inform Kiangnan that contract is concluded to take up full capacity of their works.” The United States Shipping Board to the Secretary of States, July 13, 1918, NA, 893.642/17."}, {"type": "text", "text": "43 Alvey A. Adee (Second Assistant Secretary of the Secretary of State) to the United States Shipping Board, July 3, 1918, NA, 893.642/13."}, {"type": "text", "text": "47 Merris D. Ferris (Manager, Contract Division) to Edward T. Williams (Chief of Division of the Far Eastern Affairs), July 18, 1918, NA, 893.642/21."}, {"type": "text", "text": "48 Edward T. Williams (Chief of Division of the Far Eastern Affairs) to Merris D."}, {"type": "text", "text": "（二）合約議訂——中國如何替美國造船？"}, {"type": "text", "text": "1918年7月25日，中美簽訂正式合同17款（共18頁）。由美國船政局祕書伯恩（S. N. Bourne）、局長赫爾利、中國駐美公使顧維鈞、江南造船所總工程師毛根共同簽署。議訂造船材料由美國船政局幫忙購買，江南造船所按美國政府擬定之價給付，限自每艘材料到齊上海後6個月內造竣，載重1萬噸之船4艘，每艘定價1,950,000美金，4艘共約800萬美金，分7期交付。第一期之款限於合同簽字後15日內付，餘隨建造進行情形續交，至船抵美時付訖。第17款提到雙方理解並同意（understand and agree）未來兩年內（1919月7月10日）船主可指派合約人通過經理人後續訂購至多八艘輪船。值得注意的是大來公司為合約人所任命之經理人和收款方，付款支票將寄給大來公司，而勞勃·大來正是從清末到民初催促美國政府重視太平洋航運和貿易的重要牽線人 $^{50}$ 。這份合約雖是訂購4艘輪船，但日後得以增加到12艘，為未來的合作預留了更大的空間。合約簽定之後，美國船政局局長赫爾利轉來賀電，對中國造船工業的進步表示祝賀，並將此約視為中國得以與協約國一致共同對抗敵對國家，使中美傳統友誼更加鞏固 $^{51}$ 。"}, {"type": "text", "text": "8月4日，北洋政府海軍部給駐美公使顧維鈞的電報中，除了對顧維鈞促成此事之功表示感謝外，更進一步希望毛根設法招徠讓福州船政局也能接到美國訂單，顧維鈞收文後批示「約毛工程師來見」，但後續如何因相關資料不足，不知結果。由海軍部的這份電報可知中國政府甚盼美方繼續向中國政府購買輪船的企圖，不僅僅是江南造船廠而已，福州船政局亦能勝任，希望藉此打開中國輪船在美國市場的版圖，希望顧維鈞向美國航業部總理遊說，使中國各廠均有發達。電文中也提到「際此德奧戰事方殷，我國既加入參戰，凡有應盡義務之處自當黽勉為之」，中國替美國造船一事，亦是善盡協約國之責任義務 $^{52}$ 。"}, {"type": "text", "text": "Ferris (Manager, Contract Division), July 20, 1918, NA, 893.642/21."}, {"type": "text", "text": "國博覽會的盛事。吳翎君，《美國大企業與近代中國的國際化》，頁304-307。 51 為使讀者清楚理解美國國務院這份電文的意義，照錄原文如下：“This happy arrangement enabled Chinese industry to become more effective in support of our splendid armies who are now advancing toward their assured victory. By making ships, China will be directly making war upon the common enemy. The occasion is one of good augury of future industrial and commercial cooperation between your great country and the United States, and confidently believed will more firmly cement the traditional friendship between the two peoples.”（底線為筆者所加）The United States Shipping Board to the Secretary of States, July 26, 1918, NA, 893.642/19."}, {"type": "text", "text": "49 “China to build Four Ships for the United States”, The Brooklyn Daily Eagle, New York, Sunday, July 14, 1918. http://bklyn.newspapers.com/image/54538122/（2015年4月12日點閱）。"}, {"type": "text", "text": "50 顧公使函外交部，1918年7月28日。《外交部檔案》，03-12-010-03-008.收有7月10的英文草約。勞勃·大來於1910-1911曾兩度率領美國實業團來華訪"}, {"type": "text", "text": "52 海軍部致駐美顧公使（維鈞）函，1918年8月4日。《外交部檔案》，03-12-010-03-010。這份電報中也收錄次日江南造船所所长劉冠南給美船政局長的感謝函。"}, {"type": "text", "text": "顧維鈞之回憶錄並未提到經辦江南造船所之事，但他在給中國外交部陳述這件合約之所以奏捷卻居功不諱，文中提到他和毛根如何向美國船政局吹噓，該局初尚有猶豫，嗣經向美外部示意，大致謂美擬助華各舉多成畫餅，未免可惜，美國可藉由這次造船合約作為兩國邦交敦篤之機 $^{53}$ 。這項江南造船所的案例確實為民初美國協助中國實業的少數成功案例，當時美國對華交涉的案例中，例如美孚石油公司協助石油開採、合眾電信公信參與中國無線電案，都遇到了瓶頸 $^{54}$ 。這次造船廠案的條款內容中的付款辦法亦格外通融，以免江南造船所籌墊為難。顧維鈞的電報也說明了美國官方內部文獻提到的美國船政局正與日本訂造船隻的事情，而江南造船所取得的價格亦比美國向日本訂造之船每噸多美金30元。此外，待這批船隻造好時「如空船來美時，准其裝貨，更係暗中貼補美政府我感情本佳」，顧維鈞認為這次優惠的合同確係展現美國有意聯絡中國的友好情誼 $^{55}$ 。"}, {"type": "text", "text": "當時中國報刊很快就刊載這份合約的好消息，並非如同北京政府時期一些對外實業借款對外界有所隱。8月9日《申報》報導了這項合約，消息來源取自上海的英文報《大陸報》，稱「江南造船所承造美船四艘現已開始籌備擴張規模，務使此船廠不獨為遠東一支大塢，亦當為中國造船界中之巨擘」。預計在船廠西角圈入新地30畝，政府委員已由京抵滬，辦理續劃官地，以供廠用之事，此外復購買民地。如能有成，則廠中可得容留1萬噸大船6艘之地。而全廠工事進行，先事預備，各工廠改革尤多 $^{56}$ 。對於合約原料和機器提到第一批不出三個月可望提用，「大約再閱八個月，第一艘大貨船當可下水……船各載重一萬噸，此種大船固屬中國境內從未造過，即美國航務部所已造者，亦無如是之大。」對於這批輪船的圖式、規模、速度和設備也詳加介紹：「將依照美國造船局所規定之圖式，並由美政府督工監造，按照圖式，船長四百三十九英呎，闊五十英呎，吃水二十六英呎，有甲板三層，皆以鋼為之，船桅有四，每桅有起重機二，又有輔助起重機二，共計船上有起重機十、繳車十。船之前後皆有雙底，以備裝油，船之燃料非油即煤，船中亦有煤艙也。船中機械皆係最新式，有汽鍋三，其作用壓力約為兩百磅，速率為每小時十海里半至十一海里。」又提到「此項新船係貨船式，全船皆用鋼製，用木之處甚少，一切裝置皆須依照美國造船局與督工員之需要。」 $^{57}$ 8月30日，《申報》刊出〈江南造船成績優美〉一文，提到江南造船所近日承攬的各家造船公司的訂單，包括為中國海濱公司所造和美孚公司所造，買主均大為讚賞 $^{58}$ 。10月9日，《申報》提到這項工程船料近日可運達，且已在江南製造局西砲台隙地工作 $^{59}$ 。"}, {"type": "text", "text": "江南造船所承造美國輪船一事，受到上海中外媒體的關注，"}, {"type": "text", "text": "56〈江南造船所承造美船之籌備〉，《申報》，1918年8月9日，第3張。"}, {"type": "text", "text": "57〈江南造船所承造美船之籌備〉，《申報》，1918年8月9日，第3張。"}, {"type": "text", "text": "53 外交部收顧公使函件，1919年1月6日。但這份電文中顧維鈞的報告為1918年7月28日所寫。《外交部檔案》，03-18-103-03-001."}, {"type": "text", "text": "58〈江南造船所成績優美〉，《申報》，1918年8月30日，第3張。「中國海濱公司所造載重一千兩百噸之新船：上海第二號，昨日下午試験之後，購主甚為滿意，該船長兩百零三尺，闊二十九尺，吃水約十一尺，所用機械均係最新式者，將由贊賜公司經理，來往於香港、新加坡間」。又為美孚石油公司新式燃油船美南號，試験順利：「該船長一百四十四尺，闊二十七尺，吃水八、九尺，每小時能行十海哩半，造者與購者對於該船均頗得意云。」"}, {"type": "text", "text": "54 詳見：吳翎君，《美國大企業與近代中國的國際化》，第3章和第6章。"}, {"type": "text", "text": "55 外交部收顧公使函件，1919年1月6日。《外交部檔案》，03-18-103-03-001."}, {"type": "text", "text": "59〈造船所承造美國運艦近訊〉，《申報》1918年10月9日，第3張。"}, {"type": "text", "text": "且江南造船廠亦藉此事大事炫耀。江南造船所副所長鄺國華（K. H. Kwong），係1875年10月赴美之第四批留美幼童。他於1918年11月23日在《密勒氏評論報》（Millard's Review）以一張半版面的英文刊出這項值3千萬關兩合約的訊息，並有簽約照片（如圖3-1）。文章標題：〈中國如何替美國造船〉（How China Plans to Builds Ships for America!），強調此次造船案乃史無前例，美國如此海權大國竟然尋求中國來建造合乎他們需求的大船，可見得江南造船所的造船技術已可媲比歐美先進國家。該文簡述了江南機器製造局自曾國藩創制以來的變革歷史，強調中國海軍軍艦和商船過去多購自英、美、日等國；自民國肇建以後，江南船塢改稱江南造船所，經整頓後造船技術日進千里，不僅只是承擔維修輪船，還能建造軍艦和商船共計約316艘。鄺國華誇示該所不僅幫中國政府造船，中國商人及各國在華船主的訂單源源不絕，甚至也為俄國人造船。此外，宣稱這項承造美國萬噸巨船案需動員技術與非技術工人約2,500人、蒐購25畝地以上，此船為該船所造第317號船，裝有三聯式發動機，所有建築工程與發動機及汽鍋均在中國製造，惟獨鋼料由美國供給之。作者表示，「除日本不計外，乃為遠東從來所造最大之船四艘中之第一艘。」這件合約的重要意義顯示「形勢已轉變了，證明中國人已經有能力做到以前必須仰賴外人才做得到的事。由此寫下中國工業發展史的新篇章」 $^{60}$ 。這篇鄺國華署名的英文文章的中文版〈江南造船廠承造美國一萬噸船四艘記〉，不久於《東方雜誌》1919年2月號刊出，但無作者名稱，亦無簽約照片 $^{61}$ 。"}, {"type": "text", "text": "鄺國華接連又於《上海泰晤士報》（Shanghai Times）工業版聖誕節增刊以英文題為〈江南造船所建造美艦之擘劃〉（Kiangnan Dock Making Ready to Build American Ships）整版文章詳述該所經造之輪船的效率、技術和品質，並附上該船所工廠全景和設施照片二張，以及該所出廠為亞細亞油輪、美孚油輪等打造的四張輪船圖片 $^{62}$ 。另一文為〈中國民族造船企業〉（Chinese Enterprisein Shipping）由Nicholas Tsu Engineering and Shipping Works署名，詳述該廠自製的號稱中國自製第一艘蒸汽船“Mylie”號於1918年10月22日下水的消息，訂購者為Haichow Steamship Company。這二個訊息都向西方人展示中國造船業技術上的突飛猛進 $^{63}$ 。"}, {"type": "text", "text": "60 H. K. Kwong, \"How China Plans to Builds Ships for America!\" Millard's Review, Nov. 23, 1918."}, {"type": "text", "text": "61〈江南造船廠承造美國一萬噸船四艘記〉，《東方雜誌》，第16卷第2號（1919年2月），頁195-197。"}, {"type": "text", "text": "62 H. K. Kwong（原文拼音如此，但以目前書寫應為K. H. Kwong), “Kiangnan Dock Making Ready to Build American Ships,” Shanghai Times, Industrial Section, Supplement to Xmas Issue, 1918. 四張圖片為亞細亞油輪Anlan、美孚"}, {"type": "text", "text": "1920年6月3日，為美國建造的4艘運輸船中的第一艘「官府號」（Madarin）舉行下水典禮，《申報》於6月2日預誌此事，3日刊出近年上海所建之4艘船並繪有樣式圖比較大小。官府號之排水量14,750噸，比1918年江南造船所之江華輪（4,100噸）大三倍，比起上海英國瑞榕船廠所製挪威定造之3,100噸大五倍，比起英國耶松船廠所製英國定造之標準C型輪（7,200噸）大二倍（1919年下水），官府號無疑為近年上海所製最大輪船 $^{64}$ 。4日又刊出官府號下水典禮之盛況和照片。共有中外貴賓四百餘人參加，包括海軍總長劉冠雄、中國巴黎和會專使王正廷、美國在華法庭法官及法學家羅炳吉（Charles S. Lobingier）、美國駐華公使柯蘭（Charles R. Crane, 1858-1939）夫婦和駐上海總領事柯銀漢（Edwin S. Cunningham）等重要人士相繼演說互勉邦交。劉冠南所長及美國駐華公使立於船艦中間，柯蘭夫人以中文致簡要祝詞，並命其名為「官府號」，圍觀者歡呼之聲，歷久不絕 $^{65}$ 。《密勒氏評論報》於6月5日刊載同一消息，也引用了同樣的4張輪船圖樣，噴噴稱奇不已 $^{66}$ 。這件江南造船所承造美船案，由1917展開交涉，次年簽約，到1920年6月完成合約之第一艘船下水；其餘3艘，西勒斯號（Celestial）、奧連討號（Oriental）、客賽號（Cathay）亦皆於1921年間完成，美國航運部致函表示極為滿意 $^{67}$ 。1921年12月以後這4艘船為大來公司所購得，投入該公司的全球航運事業 $^{68}$ 。"}, {"type": "text", "text": "在承造美國輪船案的遊說中，富機敏手腕的關鍵人物毛根也因此獲得江南造船所長劉冠南的信任，在劉冠南擔任所長期間（1916-1925）雙方具有良好的合作默契。在承造美國船政局四艘輪案之後，毛根曾為怡和洋行打造一巨輪，又因應美國政府航行長江上游的需求打造了六艘砲艦。毛根於1936年病故英國，《南華早報》（South China Morning Post）的訃聞中特別提到毛根對該廠有二大貢獻：一、首要之事亦即1918年獲得承造美國船政局四艘輪船合同，使作為協約國一員的中國對大戰做出貢獻；二、打造出60艘蒸汽船確保長江流域上游的貿易不為外輪所壟斷。他擔任江南船政所總工程師兼經理一職任內，帶來3千萬關兩淨值（net profits）的龐大收入，不僅為江南造船所的現代化經營打下基礎，也參與了中國民族造船工業崛起於世界舞台的關鍵時刻。儘管毛根於1920年代的中國排外革命勢力中，被迫憤而辭職。但他對江南船政所的經營策略也反映了一戰前後中外技術與企業合作的成功案例 $^{69}$ 。"}, {"type": "text", "text": "油輪 Meitanf、Gas producer Moter “Vigan”，Ice Breaker “Mei Ling”。"}, {"type": "text", "text": "66 Millard's Review, June 5, 1920."}, {"type": "text", "text": "63 Nicholas Tsu Engineering and Shipping Works, “Chinese Enterprise in Shipping,” Shanghai Times, Industrial Section, Supplement to Xmas Issue, 1918."}, {"type": "text", "text": "64〈造船所承造美艦第一艘下水預誌〉，《申報》，1920年6月2日，第3張。〈上海近年造船之比較〉，《申報》，6月3日，第3張。"}, {"type": "text", "text": "67 美國航運部曾函監造人謂：「各船成績優美，駕乎自造各輪之上」。此據王世詮，〈三十年來中國之造船工程〉，頁275所引。筆者認為此說雖不免有禮貌客套之詞，但以美國商人之務實，如未達一定造船水準，亦不可能有此一讚詞。"}, {"type": "text", "text": "65〈造船所承造美艦舉行下水禮〉，《申報》，1920年6月4日，第3張。《申報》將美國公使譯為「克蘭」，其中文官方名為柯蘭。"}, {"type": "text", "text": "68 大戰結束後，美國政府將戰時徵用的部分運輸船發回民營，大來也因此購得江南造船廠出廠的4艘船及日本淺野（Asano）公司出廠的「東方商船號」（Eastern Merchant）。Memoirs of Robert Dollar（San Francisco, Priv. Pub. for the author by W.S. Van Cott & Co. 1922, Second Edition），pp. 143-144。"}, {"type": "text", "text": "小結"}, {"type": "text", "text": "本章所探討的中美航運合作事業，說明政府、企業和技術工業在中美兩國交往進程中的重要意義。一戰時期中美航運的合作和努力，一方面顯現中國意圖借重傳統友好的美國，達到穿越太平洋的航運企圖，並向西方展現新式中國造船工業的成就；另一方面也顯現美國欲藉由商業和交通上參與中國的工業化，拓展在中國和遠東的影響力。從中國利用外力和外資的角度而言，北洋政府時代儘管軍閥內戰不斷，內閣更易頻繁，但民初的實業建設也在一批交通部技術官僚的領導下奠立基礎，中國政府確實也積極尋求通過對華友善的美國尋求實業合作的機會。在中美合作海運事業中，我們看到的是一種多元交錯的關係網，通過中國官方和民間力量在各個層次的努力，協力拓展了中國民族輪船工業的發展。"}, {"type": "text", "text": "一戰爆發後，輸送戰時物資之迫切需求，使得輪船不敷使用，其後又受德國無限制潛艇之攻擊，海上船隻銳減，各國想盡辦法以最便捷最合宜的方式建造輪船，而中國正興起已略具規模的輪船工業，正滿足此一需求，因而英美日有意投資中國輪船事業或與中國合作造船事業。然則，戰時物價騰貴，購船造艦價格一再上揚，買賣雙方都得精心盤算有利於己之條件。對於中國政府與民間而言，也敏銳感受大戰的爆發提供中國民族航運業的發展機會，而由梁士詒展開運籌帷幄與「東方太平洋輪船公司」簽訂合約，然由於種種因素此約功敗垂成。同時，一批在美華商也感受到一戰時期中國輪船工業的發展契機而有積極的作為，希望趁著歐洲戰事緊急，中國民族輪船業正可趁勢而起，爭取太平洋航運。當時「中國郵船公司」購得的美國輪船已有萬噸規模，設備均相當先進新穎，且北京政府交通部還予以獎勵，藉此鼓舞海內外華人發展民族遠洋航業。"}, {"type": "text", "text": "中國政府試圖仰賴西方先進科技以發展實業建設的努力，係延續自清末以來變法圖強和如何走向世界的主張，江南造船廠的蛻變便是展現了從清末作為官督商辦的製造局一再蛻變為現代化造船廠的歷程。「江南造船所」藉由順利承造美國萬噸輪船，超越此前該廠出產的造船噸位，並且在中外媒體大肆宣傳此一創舉。從技術上而言，當時江南造船廠的造船水準已不輸於英國在上海的各家輪船公司，在航速和噸位上也快速直追西方造船工業 $^{70}$ 。江南造船所藉由承造美國輪船案展現中國航運工業起飛的新形象，此一旺盛的企圖心，如同一戰結束後中國極欲加入巴黎和會等國際組織的國族情緒，要求國際社會平等待我，希望世界各國認同新中國的強烈願望是一致的 $^{71}$ 。"}, {"type": "text", "text": "69《南華早報》提到1926年控有上海的軍方當局要他上繳的數額，足以壓垮江南船政所的支出，以致他憤而辭職。DOCK MANAGER DIES: Well-Known Identity Of Shanghai Waterfront MR. R. B. MAUCHAN, South China Morning Post (1903-1941); Mar. 24, 1936; ProQuest Historical Newspapers: South China Morning Post. p. 2. 計聞報導尚有：OBITUARIES AND FUNERALS: Mr. R. B. Mauchan, The North-China Herald and Supreme Court & Consular Gazette (1870-1941); Mar. 18, 1936; ProQuest Historical Newspapers: Chinese Newspapers Collection, p. 488，說法一致。然對於毛根的辭職也有異論，如本文前引科爾耐，黃慶華譯，〈大毛根與江南造船所（1905-1927）——中外合作一例〉，由於其個人的濫用職權等因素，在排外風潮中一切中外合作的形式又加深了中國人的反感，江南造船所的工人甚至衝進毛根辦公室抗議。"}, {"type": "text", "text": "70 1901年英國愛德華號（King Edward）無畏艦下水，長250.5英尺（76.4米），"}, {"type": "text", "text": "民初美國政府所參與的北京政府公共工程投資案，如無線電報、鐵路、水利建設等設施，多因北京中央政府派系政爭與外國在華勢力的交相糾纏，且因投資金額過於巨大，美國銀行不願擔保，最後多以失敗收場。其中，中國本身的不利因素也使得美國政府較難有立場去推動中美企業與技術上的合作。1918年「江南造船所」順利簽訂承造美國4艘萬噸商輪的合約，實為民初美國在華投資中相當罕見的成功案例。先備條件是中國本身已具有相當水準的造船技術和能力，美國政府有立場來促成此事。在江南造船廠一案英日阻撓在先，但美國政府全力主導，在資金和材料來源上全力支持美國大企業提供擔保。雖然美國船政局認為造船原料由美國方面幫忙購買進口到中國，並不划算，然而美國政府基於向中國表示友好，比照對待日本船廠建造美船的案例，表示對中國沒有歧視，而大力促成此事。"}, {"type": "text", "text": "就一戰時期的中外關係而言，特別是中國參戰後，藉由承造美國輪船，中國因而有與協約國家站在同一陣線對抗德國的重大意義。4艘萬噸商輪交貨時間已在大戰結束之後，而其開端則和一次大戰提供的合作機遇息息相關。南京政府成立後，出於中國軍事和國防上的內外需求，屬於海軍部管轄的江南造船廠以製造軍艦為主要目標，然而製造軍艦費時更久，技術裝備更加艱難，並非如製造萬噸運輸船或商船，時間或八個月可成。更遺憾的是江南造船所一度輝煌的造船成果，因人事管理、技術升級的缺失，1930年代之後所造軍艦之噸位、武裝、速率，皆不足現代巡洋艦隊標準，可謂重蹈半世紀前輪船招商局失敗的宿命，加以中國內政和外交上的激烈動盪，未能賡續下去 $^{72}$ 。"}, {"type": "text", "text": "寬30.1英尺（9.2米），航速20.48節。1909年同是江南船塢（Kiangnan Dock）所造的Kan Chuan船，長120英尺，寬20英尺，航速9節。1920年江南造船所承造的「官府號」長439英尺（130.76米），寬50英尺（16.76米），航速12.09節，仍不敵歐美最先進的運輸艦，但從中國近代造船史的發展而言，一戰期間的發展技術確是一大躍升。The Enclosure in the American Legation (Peiking) to the Secretary of US. June 1, 1918, NA, 893.642/19."}, {"type": "text", "text": "71 詳見徐國琦兩本關於中國與大戰的專書，Xu Guoqi, China and the Great War: China's Pursuit of a New National Identity and Internationalization (Cambridge, UK and New York: Cambridge University Press, February 2005). Xu Guoqi, Strangers on the Western Front: Chinese Workers in the Great War (Cambridge, Mass.: Harvard University Press, 2011)."}, {"type": "text", "text": "72 1936年所造之「平海號」軍艦為歷年所造最大，但其噸位、武裝、速率，皆不足現代巡洋艦隊標準。中日戰爭爆發後，1938年該所又為日軍所占。王世詮，〈三十年來中國之造船工程〉，收入：周開慶主編，《三十年來之中國工程》（台北：華文書局，1969），頁173-175。王志毅，《中國近代造船史》（北京：海洋出版社，1986）。"}, {"type": "text", "text": "商人團體、技術組織 與關係網"}, {"type": "text", "text": "第二部分"}, {"type": "note", "text": "1 王志毅，《中國近代造船史》（北京：海洋出版社，1986），頁80-86。據該書所記，江南製造局成立40年間，造船偏廢，在1905年以前僅造了8艘輪船、7隻小艇。一戰期間力求開拓商業航運市場。關於清末自強事業中江南製造局和造船廠的演變歷史及其與近代中國早期工業化的研究，研究成果專書或論文均相當豐富，本文不擬贅述。"}, {"type": "note", "text": "2 Noel H. Pugach, \"American Shipping Promoters and the Shipping Crisis of 1914-1916: The Pacific. & Eastern Steamship Company,\" The American Neptune, 35: 3 (1985), pp. 166-182."}, {"type": "note", "text": "5 James D. Ciment and Thaddeus Russell eds., The Home Front Encyclopedia: United States, Britain, and Canada in World Wars I and II, Vol. I, pp. 457-458."}, {"type": "note", "text": "6 http://en.wikipedia.org/wiki/United\\_States\\_Shipping\\_Board（2015年3月12日下載）。"}, {"type": "note", "text": "3 Paul Kennedy, The Rise and Fall of The Great Powers (London: Unwin Hyman Publishers Limited, 1988), p. 247."}, {"type": "note", "text": "4 James D. Ciment and Thaddeus Russell eds., The Home Front Encyclopedia: United States, Britain, and Canada in World Wars I and II, Vol. I (Santa Barbara, Calif.: ABC-CLIO, 2007), p. 458."}, {"type": "note", "text": "7 航運實業家勞勃·大來曾於1910-1911訪問中國，大力促進中美貿易。勞勃·大來的事業起於1893年購得美國太平洋岸一間鋸木工廠，後來他和兒子史丹利（Stanley Dollar）建立大來輪船公司（Dollar Steamship Company，或稱Dollar Line），經營貨櫃運輸生意。有關大來公司在中國的活動，詳見本書第七章。Robert Dollar, Memoirs of Robert Dollar (San Francisco: Privately published for the author by Schwabacher-Frey, 1918)."}, {"type": "note", "text": "8 Noel H. Pugach, \"American Shipping Promoters and the Shipping Crisis of 1914-1916: The Pacific. & Eastern Steamship Company,\" pp. 166-167. Philip B. Kennedy, The Seamen's Act, Annals of the American Academy of Political and Social Science, Vol. 63 (1), National Industries and the Federal Government (Jan., 1916), pp. 232-243."}, {"type": "note", "text": "9 1916年8月「美國中國商會」在上海召開首次年會，討論的焦點即為大戰期間船隻載運不敷使用，必須借助英船與日船所衍生出的相關問題。 First Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, Aug. 18, 1916. pp. 1-2, 52-57. 參見本書第四章。"}, {"type": "note", "text": "10〈中國宜乘機振興航業〉，《東方雜誌》，第15卷第1號（1918年1月15日），頁145。"}, {"type": "note", "text": "11〈日本航業鉅觀〉，《東方雜誌》，第15卷第1號（1918年1月15日），頁167。"}, {"type": "note", "text": "12〈神州航業談〉，《東方雜誌》，第15卷第1號（1918年1月15日），頁177-181。"}, {"type": "note", "text": "13 引自：愉之，〈美國造船業之發達〉《東方雜誌》，第15卷第2號（1918年2月15日），頁50-51。相關文章尚有：君實，〈美國海運界之過去現在及將來〉，《東方雜誌》，第16卷第3號（1919年3月），頁45；〈美國之造船事業〉，《東方雜誌》，第16卷第3號（1919年3月），頁194-195。"}, {"type": "note", "text": "14 君實，〈最近世界海運之大勢〉，《東方雜誌》，第17卷第10號（1920年10月），頁16-19，刊有1914年6月世界之商船噸數之排名，依序為英、德、法、美、日，可看出英國商船噸位數遙遙領先各國；一戰之後1918年12月的數據，各國商船噸數的排名次序為英、美、德、日、法，美國排名由第四擠進前二位。"}, {"type": "note", "text": "16《民國梁燕孫先生士詒年譜》，頁282。"}, {"type": "note", "text": "17《民國梁燕孫先生士詒年譜》，頁282-285。收有完整合同及交涉經過。"}, {"type": "note", "text": "15 鳳岡及門弟子謹編，《民國梁燕孫先生士詒年譜》（台北：臺灣商務印書館，1978），頁284。"}, {"type": "note", "text": "18 民國以後國內公債利率歷年遞增，大戰期間內債有六釐至七釐，甚至更多。而戰前中國與各國的鐵路外債合同，利率以五釐居多，多者有六釐、六釐半、七釐半、墊款及短期借款至高至八釐。張瑞德，《近代鐵路事業管理的研究——政治層面的分析，1876-1937》（台北：中央研究院近代史研究所專刊，1991），頁11-12。"}, {"type": "note", "text": "24〈華僑擬組織太平洋輪船公司案〉，舊金山領事電外交部，民國4年8月28"}, {"type": "note", "text": "25《申報》，1915年10月21日。"}, {"type": "note", "text": "1916: The Pacific. & Eastern Steamship Company,\" p. 174."}, {"type": "note", "text": "23 Kenneth J. Blume, Historical Dictionary of the U.S. Maritime Industry (Lanham, Md.: Scarecrow Press, 2012), p. 375. CAPEC的老闆為歐文（Clarence J. Owen），首席顧問則是曾任密爾沃基（Milwaukee）市長的羅司（David Rose）。羅司於1916初銜命來華，不僅想處理「東方太平洋輪船公司」的合約轉讓問題，更想擴大在中國的棉花和茶葉貿易，最後羅司雖未能解決「東方太平洋輪船公司」的後續問題，但此行他和上海總商會相談甚歡，並於次年率領羅司實業團訪華，造成一時轟動。關於1917年羅司實業團訪華，可詳見賈中福，《中美商人團體與近代國民外交》（北京：中國社會科學出版社，2008），頁95-102。"}, {"type": "note", "text": "19 Noel H. Pugach, “American Shipping Promoters and the Shipping Crisis of 1914-1916: The Pacific. & Eastern Steamship Company,” p. 172."}, {"type": "note", "text": "20《民國梁燕孫先生士詒年譜》，頁285。"}, {"type": "note", "text": "21 Paul S. Reinsch, An American diplomat in China (Garden City/N.Y., Toronto: Doubleday, Page & Company, 1922) p. 164."}, {"type": "note", "text": "22 Noel H. Pugach, \"American Shipping Promoters and the Shipping Crisis of 1914-"}, {"type": "note", "text": "日。《外交部檔案》，03-06-020-01-001。"}, {"type": "note", "text": "29〈中國輪船公司新船抵滬續誌〉，《申報》，1918年7月27日，第3張。"}, {"type": "note", "text": "26 黃華，〈記中國郵船公司〉，《東方雜誌》，第14卷第3號（1917年3月），頁"}, {"type": "note", "text": "27 黃華，〈記中國郵船公司〉，頁41-42。"}, {"type": "note", "text": "28 黃華，〈記中國郵船公司〉，頁44。"}, {"type": "note", "text": "30 由於新成立的中美合資公司，資本額有1千萬，在表面上觀之，組織新公司者似已收買舊公司，若干舊金山華人抱此疑慮，提出嚴重抗議；指斥修船費用過高，有人從中漁利，要求停發債券，美人三名脫離新公司之關係。股東大會的內部風波也見諸於報章，《中國輪船公司新船抵滬續誌》，《申報》，1918年7月27日，第3張。《中國輪船公司公司股東會記》，《申報》，1918年8月28日。《中國輪船公司公司股東會續記》，《申報》，1918年8月29日，第3張。"}, {"type": "note", "text": "31 葉恭綽，〈五十年來中國之交通〉，收入：《遐庵匯稿》（上海：上海書店，1990。民國叢書第2編，綜合類），中編，詩文，頁283。"}, {"type": "note", "text": "32 葉恭綽，《遐庵匯稿》上篇，公牘，〈釐訂船業獎勵條例請明令公布文，民國九年〉、〈附航業獎勵條例〉，頁67-69。"}, {"type": "note", "text": "33 廣益公司的董事成員囊括美國最大財團和實業家，包括：摩根（Morgan）企業、美孚公司（Standard Oil Co.）、杜邦公司（F. I. DuPont）、美國電話電報公司（American Telephone and Telegraph）、通用電器公司（General Electric）和紐約花旗銀行（National City Bank of New York）等等。關於廣益公司的歷史，詳見吳翎君，《美國大企業與近代中國的國際化》（北京：北京社會科學文獻，2014），頁121-125。"}, {"type": "note", "text": "34 British Foreign Office to the Secretary of US, Aug. 14, 1917, United States National Archives (Microfilms), Washington, D. C. Records of Department of State Relating to Internal Affairs of China, 1910-1929. (hereafter cited as NA.) 893.642/6."}, {"type": "note", "text": "35 Paul S. Reinsch to the Secretary of State, Nov. 30, 1917, NA, 8963.642/7."}, {"type": "note", "text": "36 例如列強在華的鐵路投資和電報事業的競爭激烈，各國之間各有盤算。詳見：吳翎君，《美國大企業與近代中國的國際化》，第4章和第6章。"}, {"type": "note", "text": "39 The Secretary of States to Thomas Sammons, Jan. 29, 1918, NA, 893.642/8."}, {"type": "note", "text": "40 毛根亦延攬其弟在該廠工作，因而有小大毛根之稱。1926年在全中國的排外罷工運動中，大毛根辭職，次年返英，於1936年病故。其弟小毛根則於1927-45年間仍服務於江南造船所，但其權位和威望遠不如其兄。詳見：（法）科爾耐著，黃慶華譯，〈大毛根與江南造船所（1905-1927）——中外合作一例〉，《國外中國近代史研究》（北京：中國社會科學院近代史研究所），第24輯（1994年），頁120-132。科爾耐對大毛根在1887年來上海之前的經歷較不清楚，筆者據1936年其過世後《南華早報》（South China Morning Post）的報導簡略補充如下：他在1882-1887年曾在蘇格蘭鄧巴頓（Dumbarton）從事高壓鍋爐的工作，1887年進入李鴻章創辦的輪船招商局，1894年進入英商和記洋行（Boyd & Co.），向中國口岸正興起的新式工廠推銷蒸汽機器。1895-1900投入上海正新興的新式紡織業推銷縑絲機器，後來成為上海英商耶松船廠的一員，負責修理1904年日俄戰爭後破損的俄國船隻。1905年受中國政府之請加入江南船塢所，迅速擴充船廠規模。DOCK MANAGER DIES: Well-Known Identity Of Shanghai Waterfront MR. R. B. MAUCHAN, South China Morning Post (1903-1941); Mar. 24, 1936; ProQuest Historical Newspapers: South China Morning Post. p. 2."}, {"type": "note", "text": "37 Vice Consul Walter A. Adam (Shanghai) \"Facilities and Materials at Shanghai for the Construction of Wooden Vessels of Standardized Parts Thereof,\" June 15, 1917, NA, 893.642/8."}, {"type": "note", "text": "38 R. B. Mauchan to Thomas Sammons (American Consul-general, Shanghai), 5th Dec., 1917, NA, 893.642/8."}, {"type": "note", "text": "44 海軍部致駐美顧公使（維鈞）函，1918年4月8日。《外交部檔案》，03-12-010-03-001."}, {"type": "note", "text": "45 江南造船所所长劉冠南致駐美顧公使，1918年5月8日。《外交部檔案》，03-12-010-03-006."}, {"type": "note", "text": "41 “Shipbuilding possibilities at Shanghai”, December 13, 1917, NA, 893.642/8."}, {"type": "note", "text": "42 Edward N. Hurley to the Secretary of States, July 1, 1918, NA, 893.642/13."}, {"type": "note", "text": "46 “inform Kiangnan that contract is concluded to take up full capacity of their works.” The United States Shipping Board to the Secretary of States, July 13, 1918, NA, 893.642/17."}, {"type": "note", "text": "43 Alvey A. Adee (Second Assistant Secretary of the Secretary of State) to the United States Shipping Board, July 3, 1918, NA, 893.642/13."}, {"type": "note", "text": "47 Merris D. Ferris (Manager, Contract Division) to Edward T. Williams (Chief of Division of the Far Eastern Affairs), July 18, 1918, NA, 893.642/21."}, {"type": "note", "text": "48 Edward T. Williams (Chief of Division of the Far Eastern Affairs) to Merris D."}, {"type": "note", "text": "Ferris (Manager, Contract Division), July 20, 1918, NA, 893.642/21."}, {"type": "note", "text": "國博覽會的盛事。吳翎君，《美國大企業與近代中國的國際化》，頁304-307。 51 為使讀者清楚理解美國國務院這份電文的意義，照錄原文如下：“This happy arrangement enabled Chinese industry to become more effective in support of our splendid armies who are now advancing toward their assured victory. By making ships, China will be directly making war upon the common enemy. The occasion is one of good augury of future industrial and commercial cooperation between your great country and the United States, and confidently believed will more firmly cement the traditional friendship between the two peoples.”（底線為筆者所加）The United States Shipping Board to the Secretary of States, July 26, 1918, NA, 893.642/19."}, {"type": "note", "text": "49 “China to build Four Ships for the United States”, The Brooklyn Daily Eagle, New York, Sunday, July 14, 1918. http://bklyn.newspapers.com/image/54538122/（2015年4月12日點閱）。"}, {"type": "note", "text": "50 顧公使函外交部，1918年7月28日。《外交部檔案》，03-12-010-03-008.收有7月10的英文草約。勞勃·大來於1910-1911曾兩度率領美國實業團來華訪"}, {"type": "note", "text": "52 海軍部致駐美顧公使（維鈞）函，1918年8月4日。《外交部檔案》，03-12-010-03-010。這份電報中也收錄次日江南造船所所长劉冠南給美船政局長的感謝函。"}, {"type": "note", "text": "56〈江南造船所承造美船之籌備〉，《申報》，1918年8月9日，第3張。"}, {"type": "note", "text": "57〈江南造船所承造美船之籌備〉，《申報》，1918年8月9日，第3張。"}, {"type": "note", "text": "53 外交部收顧公使函件，1919年1月6日。但這份電文中顧維鈞的報告為1918年7月28日所寫。《外交部檔案》，03-18-103-03-001."}, {"type": "note", "text": "58〈江南造船所成績優美〉，《申報》，1918年8月30日，第3張。「中國海濱公司所造載重一千兩百噸之新船：上海第二號，昨日下午試験之後，購主甚為滿意，該船長兩百零三尺，闊二十九尺，吃水約十一尺，所用機械均係最新式者，將由贊賜公司經理，來往於香港、新加坡間」。又為美孚石油公司新式燃油船美南號，試験順利：「該船長一百四十四尺，闊二十七尺，吃水八、九尺，每小時能行十海哩半，造者與購者對於該船均頗得意云。」"}, {"type": "note", "text": "54 詳見：吳翎君，《美國大企業與近代中國的國際化》，第3章和第6章。"}, {"type": "note", "text": "55 外交部收顧公使函件，1919年1月6日。《外交部檔案》，03-18-103-03-001."}, {"type": "note", "text": "59〈造船所承造美國運艦近訊〉，《申報》1918年10月9日，第3張。"}, {"type": "note", "text": "60 H. K. Kwong, \"How China Plans to Builds Ships for America!\" Millard's Review, Nov. 23, 1918."}, {"type": "note", "text": "61〈江南造船廠承造美國一萬噸船四艘記〉，《東方雜誌》，第16卷第2號（1919年2月），頁195-197。"}, {"type": "note", "text": "62 H. K. Kwong（原文拼音如此，但以目前書寫應為K. H. Kwong), “Kiangnan Dock Making Ready to Build American Ships,” Shanghai Times, Industrial Section, Supplement to Xmas Issue, 1918. 四張圖片為亞細亞油輪Anlan、美孚"}, {"type": "note", "text": "油輪 Meitanf、Gas producer Moter “Vigan”，Ice Breaker “Mei Ling”。"}, {"type": "note", "text": "66 Millard's Review, June 5, 1920."}, {"type": "note", "text": "63 Nicholas Tsu Engineering and Shipping Works, “Chinese Enterprise in Shipping,” Shanghai Times, Industrial Section, Supplement to Xmas Issue, 1918."}, {"type": "note", "text": "64〈造船所承造美艦第一艘下水預誌〉，《申報》，1920年6月2日，第3張。〈上海近年造船之比較〉，《申報》，6月3日，第3張。"}, {"type": "note", "text": "67 美國航運部曾函監造人謂：「各船成績優美，駕乎自造各輪之上」。此據王世詮，〈三十年來中國之造船工程〉，頁275所引。筆者認為此說雖不免有禮貌客套之詞，但以美國商人之務實，如未達一定造船水準，亦不可能有此一讚詞。"}, {"type": "note", "text": "65〈造船所承造美艦舉行下水禮〉，《申報》，1920年6月4日，第3張。《申報》將美國公使譯為「克蘭」，其中文官方名為柯蘭。"}, {"type": "note", "text": "68 大戰結束後，美國政府將戰時徵用的部分運輸船發回民營，大來也因此購得江南造船廠出廠的4艘船及日本淺野（Asano）公司出廠的「東方商船號」（Eastern Merchant）。Memoirs of Robert Dollar（San Francisco, Priv. Pub. for the author by W.S. Van Cott & Co. 1922, Second Edition），pp. 143-144。"}, {"type": "note", "text": "69《南華早報》提到1926年控有上海的軍方當局要他上繳的數額，足以壓垮江南船政所的支出，以致他憤而辭職。DOCK MANAGER DIES: Well-Known Identity Of Shanghai Waterfront MR. R. B. MAUCHAN, South China Morning Post (1903-1941); Mar. 24, 1936; ProQuest Historical Newspapers: South China Morning Post. p. 2. 計聞報導尚有：OBITUARIES AND FUNERALS: Mr. R. B. Mauchan, The North-China Herald and Supreme Court & Consular Gazette (1870-1941); Mar. 18, 1936; ProQuest Historical Newspapers: Chinese Newspapers Collection, p. 488，說法一致。然對於毛根的辭職也有異論，如本文前引科爾耐，黃慶華譯，〈大毛根與江南造船所（1905-1927）——中外合作一例〉，由於其個人的濫用職權等因素，在排外風潮中一切中外合作的形式又加深了中國人的反感，江南造船所的工人甚至衝進毛根辦公室抗議。"}, {"type": "note", "text": "70 1901年英國愛德華號（King Edward）無畏艦下水，長250.5英尺（76.4米），"}, {"type": "note", "text": "寬30.1英尺（9.2米），航速20.48節。1909年同是江南船塢（Kiangnan Dock）所造的Kan Chuan船，長120英尺，寬20英尺，航速9節。1920年江南造船所承造的「官府號」長439英尺（130.76米），寬50英尺（16.76米），航速12.09節，仍不敵歐美最先進的運輸艦，但從中國近代造船史的發展而言，一戰期間的發展技術確是一大躍升。The Enclosure in the American Legation (Peiking) to the Secretary of US. June 1, 1918, NA, 893.642/19."}, {"type": "note", "text": "71 詳見徐國琦兩本關於中國與大戰的專書，Xu Guoqi, China and the Great War: China's Pursuit of a New National Identity and Internationalization (Cambridge, UK and New York: Cambridge University Press, February 2005). Xu Guoqi, Strangers on the Western Front: Chinese Workers in the Great War (Cambridge, Mass.: Harvard University Press, 2011)."}, {"type": "note", "text": "72 1936年所造之「平海號」軍艦為歷年所造最大，但其噸位、武裝、速率，皆不足現代巡洋艦隊標準。中日戰爭爆發後，1938年該所又為日軍所占。王世詮，〈三十年來中國之造船工程〉，收入：周開慶主編，《三十年來之中國工程》（台北：華文書局，1969），頁173-175。王志毅，《中國近代造船史》（北京：海洋出版社，1986）。"}]}, {"id": "ch4", "title": "第四章 · 一種特殊機遇與多元關係網", "paras": [{"type": "title", "text": "第四章"}, {"type": "text", "text": "一種特殊機遇與多元關係網"}, {"type": "text", "text": "謇嘗謂太平洋兩岸大陸中美若兄弟，而共和之輩分中美若師弟，以其關係之切，自應有提絜之親。"}, {"type": "text", "text": "——實業家張謇，1919"}, {"type": "text", "text": "前言"}, {"type": "text", "text": "1914年8月兩件世紀大事，對美國的海外投資發生革命性的影響，同時對中國市場而言，中國亦通過美國加速了中國與國際市場的接軌。一是8月15日，美國開鑿的巴拿馬運河正式通航，縮短了大西洋和太平洋的距離，使得如何打開遠東市場成為重要而迫切的命題。二是，一次世界大戰的爆發，歐洲主要國家都捲入了這場戰爭。美國最初未參加大戰，美國資本家醞釀成立「廣益投資公司」，藉機拓展美國在海外市場的影響力，而中國市場正是他們有意移轉部分歐洲資金進入的地區之一 $^{1}$ 。不論就中美進出口貿易的增加或美國私人企業的在華投資或歐美國家的技術引進中國，在第一次大戰爆發以後都呈現特別的繁榮景況，此與中美兩國的經濟活動、技術引進和人才交流所形成的關係網，環環相扣。這些關係網內包括一戰後留美歸國的實業家，他們建立現代化新式企業，並和美國方面有密切的交往，促進了中美間的聯繫。不少中美交流組織亦扮演重要角色，例如：「美國大學俱樂部」（American University Club of China, AUC）、「中美工程師協會」（Association of Chinese and American Engineer）和美國商人團體——「美國亞洲協會」和「中國美國商會」。這些中美商人、技術組織和知識群體的互聯和發展動向，都是前所未見的。"}, {"type": "text", "text": "過去研究19世紀末20世紀初中美關係的學者，普遍認為1898年門戶開放政策的提出是美國對華關係的一大轉折，並且形成美國對華政策的最高指導原則，這是從美國對華政策以及政治作用的意義而言。韓德的經典著作《一種特殊關係的形成——1914年前的美國與中國》，將門戶開放政策放在18世紀獨立後的美國初次與中國接觸以來到一次大戰以前兩國在不同利益集團下所形成的相互作用，這些利益集團主要是商人、傳教士和外交官等決策者所形成的一種特殊關係 $^{2}$ 。筆者以為第一次大戰對近代中美關係史有種實質改造（transformation）的特殊作用，遠遠大於19世紀末作為一種政治宣示意義的門戶開放政策。誠然門戶開放政策自提出後，歷經不同時代已形塑美國人對華政策的一種政治價值和理念，且迄今奉行不衰。然而，筆者更加重視一次大戰以後中美兩國建立所打造的多元特殊關係網的落實，以中國為主體在各個層面的重大轉折及深遠影響。"}, {"type": "text", "text": "本章主要論述一次大戰所提供中美兩國經濟發展的機遇，是哪些多元的渠道造就一戰後中美兩國的特殊關係？這些多元渠道如何影響了中國本身及其與世界接軌的意義？針對上述議題做一宏觀論述。"}, {"type": "text", "text": "2 Michael Hunt, The Making of a Special Relationship: The United States and China to 1914 (New York: Columbia University Press, 1983). 該書以具體案例闡釋一戰以前中美交互作用下所形成的特殊關係，主線有兩個：第一、美國政治人物（外交官）、商人、傳教士和公眾群體對於美國決策的影響。對華門戶開放政策是這些群體的共同信念；第二、中國決策者對美國的政治主張和外交策略。中國朝廷大員李鴻章、張之洞等人，對中美合作戰略興致勃勃，提出聯美制英的手段。"}, {"type": "text", "text": "1 關於美國「廣益投資公司」在華活動，可參見吳翎君，《美國大企業與近代中國的國際化》（台北：聯經出版公司，2012），第4章〈國際大財團投資案——廣益公司與1,500英里鐵路計畫〉，頁143-178。"}, {"type": "text", "text": "一、第一次世界大戰與中美經濟關係的轉捩點"}, {"type": "text", "text": "19世紀末以前美國對華貿易量占其外貿的比重極其微少。在1897-1901年僅有1.0%，1902-1906年為2.0%，此後又下降到1.0%左右，直到一次世界大戰後（1916-1920）從1.1%上升到1921-1925年的2.4%，1926-1930為2.3%，到1931為4.0%³。據海關資料「中美直接往來貿易對照表，1864-1928」（表4-1），可以看出不論就洋貨輸自美國或華（土）貨輸往美國的價值，在一次大戰以前數量不大。值得重視的是1898年以前華貨輸往美國的價值均高於美貨輸華的價值，1898年以後才逆轉為美貨輸華價值較高，這也顯示美國對華貿易逐漸起色。一戰期間的1915-1918年華（土）貨輸往美國的價值一度回升，超越美貨輸華，然一次大戰結束後的1919年美貨輸華價值又重占上風。就在1919年，不論美貨輸華或華貨輸美的價值均已突破上億關兩，從數據上說明了中美貿易往來的重大進展，由此可見一次大戰在中美經貿關係上具有樞紐的轉折意義。此後，中美進出口貿易穩定成長，到了1928年洋貨輸自美國突破2億關兩，至於華貨輸往美國，在1927-28年則約有1億2千萬關兩⁴。值得注意的是1915-1918年華貨輸美一度超出美貨輸華的價值，也說明了大戰時期美國貨品通過大西洋輸往戰地歐洲的現象，而使得中國物資通過太平洋運輸得以填補美國貨品內銷或外銷的供需缺口，顯現中美兩國的貿易往來在大戰時期全球物資移動中的意義。這也使得一戰期間的輪船運輸異常重要，儘管大西洋航線向為美國所重，但也因這場大戰爭更加突顯了太平洋航線在一戰期間的補給任務和船隻的供不應求。（參見本書第三章）"}, {"type": "text", "text": "如將一戰時期中美進出口貿易的進展，置於整個中國對外經濟關係中，更能突顯歐戰對中美經濟關係的深度影響。海關年度報告提到戰爭發生之初其實中國國際貿易深受打擊。1915年海關年度報告認為進出口貿易深受歐戰之牽連，中國變更國體或日本提出21條要求所引起的政治動盪，都比不上歐戰率連，「如無歐戰，運貨船隻連翩而至。」且由於戰時運輸輪船減少，影響進口 $^{5}$ 。1916年海關報告再次提到「歐戰阻礙，本年殆有甚焉。」同樣提到運貨船少的問題，以及受到歐洲交戰國家的經濟封鎖政策之波及，進口之貨不准轉運別國，影響中國出口。到了1918年歐洲主要戰場淪為焦土，事實上中國貿易亦為之阻塞。加以國內又有軍閥內戰、派系政爭和土匪擾攘等因素，使各種貿易俱受影響。"}, {"type": "text", "text": "3 Peter Schran, “The Minor Significance of Commercial Relations between the United States and China, 1850-1931,” in Ernest R. May & John K. Fairbank, eds., America’s China Trade in Historical Respective, the Chinese and American Performance (Cambridge, Mass.: Harvard University Press, 1986), pp. 239-240."}, {"type": "text", "text": "4 表4-1之數據，詳見附錄：4-1。需說明的是表格中1905年美貨輸華暴增的現象，係因受到1903-1904年中國民間發動的反美華工禁約運動的回彈；在這二年美貨輸華儘管下降，但是積存的訂單貨號在反美風潮降溫後陸續抵達中國，反而造成1905年美國輸華貨品激增的現象。"}, {"type": "text", "text": "歐洲戰爭三年以來，舉凡秩序，失其作用，……夫全球之擾攘既如此，而國內又有流血之政爭，每見繁榮之都，變為蹂躪之地，瘡痍滿目，不勝其數，加之土匪縱橫，火車間亦不敢駛行，受其害者，實有多處。6"}, {"type": "text", "text": "從海關報告看來，歐戰時期中外貿易俱受其害，而此時中美貿易卻能脫穎而出，不僅是近代中美經濟關係史的一個轉捩階段，就中外經濟關係史亦是一段相當特殊的時期。海關資料亦可看出一戰期間原本占有中國進出口貿易大宗的英、法、德等國家捲入戰爭，歐洲國家對華貿易銳減（特別是1917年中國對德宣戰中德絕交後，德國在華行號撤退，1918年尚有75間，1919年僅剩2家），而戰爭初期處於中立的美國，其對華貿易則有增長，在華行號和人數亦隨之快速增加。以美、英、法、德、日而言，大戰時期美國在華行號和人數增加比率快速，從1913到1918年美國在華行號增加1.7倍之多，其總數雖仍不如英、日兩國，更難望日本之項背，但個別的美國在華跨國大企業則大有起色，甚至在中國市場呼風喚雨（見表4-2）。一戰期間，英法困於歐洲戰爭，對華貿易大量減少。中國對德宣戰後，德僑返國，在滬企業或關或歇。美國和日本資本趁勢而起，在上海進行大批投資。有一資料顯示，美商在上海進出口貿易比重，1913年為13.5%，由1894年的第四位爬升到第二位。戰後的1919年為27.5%，取代英國而獨占鰲頭 $^{7}$ 。"}, {"type": "text", "text": "5 國史館重印，《中華民國海關華洋貿易總冊》（台北：國史館史料處，"}, {"type": "text", "text": "1982），民國4年（1915），第1卷，頁12。「本年貿易情形，雖因日本要求條"}, {"type": "text", "text": "件（指21條要求），恐與大局有關，商家不敢放膽交易，復因創議變更國"}, {"type": "text", "text": "體，又恐惹動風潮。有此兩層，則與商務一道，誠有阻礙，但牽及之甚，則"}, {"type": "text", "text": "在歐戰，如無歐戰，運貨船隻連翩而至。水腳運價並不過昂，則本年進口洋貨逆料必能異常發達。」"}, {"type": "text", "text": "6 國史館重印，《中華民國海關華洋貿易總冊》，民國7年（1918），頁19。"}, {"type": "text", "text": "7 王垂芳主編，《洋商史，1894-1956》（上海：上海社會科學出版社，2007），頁111。"}, {"type": "text", "text": "美國大企業於一戰時期在中國快速擴張，並成為首批具有近代科層管理的在華跨國公司。例如1870年創於紐約的美孚石油公司，1885年在上海設立第一家代理公司，1914年美孚開始設置直銷網由紐約總部直接控制，除了中國上海總部外，香港公司為第二層領導，區域公司則設於天津、漢口、東北等處，並且在各中國條約港口和河岸設立分公司。到了1919年，美孚石油公司有6個區域公司，20家分公司，和500名經銷商遍布全中國 $^{8}$ 。著名的慎昌洋行也於大戰時期崛起。慎昌洋行的創辦人馬易爾（Vilhelm Meyer）為丹麥人，1902年來華，初任職上海寶隆洋行（East Asiatic Co., Ld），1906年在上海創辦慎昌洋行，主要進口紡織機、軋棉機等各式機器和零件。1915年該洋行改組為美國公司，此後慎昌洋行代理奇異公司（General Electric）電燈，占有進口燈市場的60%優勢。1917年美國奇異公司的附屬企業——中國奇異愛迪生有限公司（China General Edison Co. Inc.）成立。慎昌洋行除代理奇異公司產品外，在洋樹浦設有慎昌機器工廠，並從事各式進出口業務，至1920年代已甚具規模 $^{9}$ 。該公司的廣告很明顯帶有以先進秀異的美國工商發明來拯救落後中國的表徵，在1920年代初頻繁出現於在華英文報刊（如圖4-1、4-2）。另外，1902年在華合併創建的英美煙公司，靠著大規模資本、先進技術、廉價原料、廣告宣傳、效率管理和經銷網（最初利用中國買辦制度而開展起點）等競爭手段，快速滲透中國市場，成為壟斷中國菸草市場的美國大企業。據統計：1902年英美煙公司在華銷售量為12,682箱，到1919年為309,028箱，足足增加了24倍。1919年，英美煙公司在華企業資本已達12,479萬元，較其最初投資增加了590倍有餘 $^{10}$ 。"}, {"type": "text", "text": "8 吳翎君，《美孚石油公司在中國，1870-1933》（台北：稻鄉出版社，2001），第1章〈市場經營與銷售〉，頁1-59。"}, {"type": "text", "text": "9 Christopher Bo Bramsen（白慕申），Open Doors, Vilhelm Meyer and the Establishment of General Electric in China (Richmond, Surrey: Curzon Press, 2001), pp. 95-107. 作者白慕申為慎昌洋行創辦人馬易爾的外孫，曾任丹麥駐中華人民共和國大使（1995-2001）、丹麥駐西班牙大使（2001-2004）。"}, {"type": "text", "text": "10 1890年代，英、美煙草即進入中國市場，其中美國煙草大王杜克（James B. Duke, 1856-1925）和英國的帝國煙草公司（Imperial Tobacco Company）兩方競爭激烈，最後於1902年合併創建英美煙公司。上海社會科學院經濟研究所編，〈前言〉，《英美煙公司在華企業資料匯編》（北京：中華書局，1983）第1冊，頁3；Sherman Cochran, Big Business in China: Sino-Foreign Rivalry in the Cigarette Industry, 1890-1930 (Cambridge, Mass.: Harvard University Press, 1980), p. 13."}, {"type": "text", "text": "以各國對華貿易而言，美國對華貿易在1931年以後大大成長，如排除英、日分別在香港和東北等特殊地區的數據，美國對華貿易在1931年後已高居各國第一，該年占18.85%。1932年為21.16%，1933年為20.80%，1934年再上升為23.34%，超過日本（含台灣，但未含東三省之統計）、英國（不包括香港）和德國 $^{11}$ 。另據蜜拉·威爾金斯（Mira Wilkins）的研究，從第一次世界大戰到太平洋戰爭爆發，美國在中國的投資領域不斷擴大，1930年達到高峰。即使中日戰爭期間，美商在日軍占領區內仍持續運作，直到美國加入第二次大戰才急遽往下滑落。據她的估算：1900年美國企業在中國的投資約有1,750萬美元，1914年約4,200萬美元，1929年約11,380萬美元，1930年再上升至15,510萬美元（一說是12,930萬美元），1936年則為9,060萬美元，1941年降為4,060萬美元 $^{12}$ 。"}, {"type": "text", "text": "就中國國內的新興企業發展而言，從1914至1922年間由中國民族資本所創辦的紗布廠總共有54家，其中1920至1922年間所開設的即達39家，這三年的發展已超過1914年以前二十餘年間中外商人所開設的31家紗廠總數。新廠的增設加之原有老廠的擴充，全國的紗錠數由1913年的484,192枚猛增至1922年的1,506,634枚，布機則由1913年的2,016台增至1922年的6,767台。中國的麵粉工業是在20世紀初才開始發展的，基礎十分薄弱，國內所需麵粉一向多仰給進口洋麵。但到了一戰期間，歐美各國麵粉產量不足，開始向中國購買麵粉，中國由麵粉入超國變為出超國。其結果又刺激了麵粉工業的發展，新設立的麵粉廠如雨後春筍；從1896至1913年總計約53家，資本總額862.2萬元，到1921年則有123家，資本總額達4,000萬元，麵粉廠數增加了一倍多，資本總額增加了四倍多 $^{13}$ 。1918-1920年間，每年華資民族工業增長率達到13.8%。上海是這波工業化浪潮的主要發源地，領軍的產業是棉紡織業，上海華資紗錠數從1913年14.7萬枚，到1921年增加至50萬枚，成長顯著。其中具代表性的企業家，如有留美背景穆藕初（1876-1943），他與1915年在上海創立紡織廠和申新公司的榮宗敬，都各自擁有十餘萬枚紗錠 $^{14}$ 。"}, {"type": "text", "text": "12 Mira Wilkins, “The Impact of American Multinational Enterprise on American-Chinese Economic Relations, 1786-1949,” in Ernest R. May & John K. Fairbank eds., America’s China Trade in Historical Respective: the Chinese and American Performance (Cambridge, Mass.: Harvard University Press, 1986), pp. 285-287."}, {"type": "text", "text": "11 周新，〈23年度我國之對外貿易〉，《東方雜誌》，第32卷第12號（1935年12月），頁15。"}, {"type": "text", "text": "13 唐力行，《商人與中國近世社會》（台北：臺灣商務印書館，1997），頁304。"}, {"type": "text", "text": "誠如白吉爾（Marie-Claire Bergere）等學者所言，第一次大戰爆發提供中國新興企業一次「千載難逢的機會」：1915-1927年間，由於戰爭提供的市場機會、中國市場的開放和國家力量的較少介入及其他經濟因素，造就一批中國資本家的興起；此時也是國際資本與外國技術熱絡於中國市場的時間，從而形成民族企業與外國企業的微妙複雜關係 $^{15}$ 。白吉爾的關懷主要在於一戰以後由於中國軍閥混戰的無政府狀態，中央力量的削弱，政府威信的低落，使得1915-1927年成為中國資產階級鼎盛發展的階段，也使中國企業家卓有成效地開拓了通往現代化的通道。然則，筆者以為我們也必須注意歐戰初期中國進出口貿易事實上是呈現整體蕭條之慘境，而中國新興企業卻能在此一凋弊衰象中迅速找到出口，1916年海關報告就提到「近年仿製貨物，進步速極最顯見者，棉貨、自來火，幾與外來之品，能以相敵。」 $^{16}$ 這一情況我們必須留意歐戰時期國際因素的互為消長，而中美進出口貿易在中外經濟蕭條中卻能脫穎而出：同時，國家力量的較少介入，是比起過去相對開放的自由市場。從具體事實仍可看到中國的中央政府財經部和交通部，仍舊扮演非常重要的角色，並且與中美經濟交往的網絡相聯互動，彼此輝映。"}, {"type": "text", "text": "二、中美經濟活動中的關係網絡"}, {"type": "text", "text": "一戰以後在上海從事棉紡工業，並由此發跡的代表性企業家莫如穆藕初。他曾在德州農業與機械學院（Texas A&M）學習植棉與紡織，獲碩士學位，譯有泰勒（Frederick Winslow Taylor, 1856-1915）《科學管理法》（The Principles of Scientific Management），為中國引入泰勒科學化管理法的第一人 $^{17}$ 。1914年7月底，也就是大戰發生前夕，穆藕初回到上海，應邀至江蘇省教育會及各地演講，分享留美心得。同時開始投身於棉紡業，先後集資創設上海德大、厚生紗廠，又與人聯合發起鄭州豫豐紗廠之創建。他辦的紗廠採用泰勒的經營管理法，成為同業觀摩的對象 $^{18}$ 。穆藕初除引進新管理法經營紗廠外，亦著力於引進、推廣美國棉種與農學知識傳播。1915年起，他在德大紗廠附近建立60畝的穆氏棉作試驗場，自美國喬治亞州引進各式棉花試種，並發布試驗報告 $^{19}$ 。穆藕初與中央政府所聘請之美籍棉業專家喬勃生（英名不詳）有所往來，討論美棉於中國之栽培 $^{20}$ 。一戰期間（1917）穆藕初與另一著名棉紡企業家聶雲台（聶其傑，1880-1953）等人曾組織中華植棉改良社、華商紗廠聯合會，大力推廣美棉栽植。1919年華商紗廠聯合會曾聘請美國顧克（英文名不詳）博士來華協助技術改良 $^{21}$ 。聶雲台亦曾赴美留學，1915年以中國實業團（Chinese Commercial Mission）副團長身分赴美考察，此次考察行程係應去年（1914）來華之太平洋商業代表團（Pacific Commercial Commission）邀請，參訪舊金山之巴拿馬賽會（Panama-Pacific International Exposition），並考察美國各大城埠，期間聶氏力邀美國棉業專家來華調查並擔任顧問，協助改良中國的棉花種植 $^{22}$ 。"}, {"type": "text", "text": "14 丁日初，《上海近代經濟史》（上海：上海人民出版社，1994）第2卷，頁104、123。關於劉鴻生的最新研究，可參見：Sherman Cochran & Andrew Hsieh, The Lius of Shanghai (Cambridge, Mass.: Harvard University Press, 2013)."}, {"type": "text", "text": "15 白吉爾，《中國資產階級的黃金時代》（上海：上海人民出版社，1994），頁75-80。"}, {"type": "text", "text": "17 穆藕初於1909年赴美留學，1913年取得伊利諾大學（University of Illinois）農學學士學位。其後入德州農業與機械學院學習紡織工業，1914年獲碩士學位；參見“Mu Hsiang-yueh,” in Howard L. Boorman eds., Biographical Dictionary of Republican China (New York: Columbia University Press, 1967-1979), Vol. 3, pp. 38-40。穆藕初將泰勒書名譯為《學理的管理法》，於1915年11月至1916年3月於《中華實業界》連載，1916年6月由上海中華書局刊行；參見穆家修等編，《穆藕初先生年譜（1876-1943）》（上海：上海古籍出版社，2006），頁62-63、84-85。"}, {"type": "text", "text": "16 國史館重印，《中華民國海關華洋貿易總冊》，民國5年（1916），第1卷，頁"}, {"type": "text", "text": "18 穆家修等編，《穆藕初先生年譜（1876-1943）》，頁59-62、64、196。1920年美國議院團來訪時，亦曾參觀厚生紗廠。"}, {"type": "text", "text": "穆藕初在一篇關於中美工業與商業的專文中，曾闡述一戰以後中國進口美國機械對近代中國實業開展的重要性，並特別強調留美歸國人士開辦的新式工廠在引進新技術方面的貢獻。在1917-1919年間，穆藕初從美國就買進了共750,000枚紗錠（含他名下工廠所需與受他人委託採購在內）；此外，他相當推崇畢業自麻省理工學院的唐炳源（星海），此君於1923年歸國，在1930年代已是慶豐紡織印染股份有限公司董事、九豐麵粉公司董事、潤豐荳油公司董事等職 $^{23}$ 。美方資料亦顯示，1918年中國粗棉產量約250萬包（bale, 1包為500磅），美國約年產1,200萬包。中國棉紡織業在質與量上都進步快速，這和美國專家的技術引進頗有關係，金陵大學農學系則是扮演了培育相關人才的重要地位 $^{24}$ 。"}, {"type": "text", "text": "一次戰後是一批上海的新興企業家崛起的時間，此時也適逢一批清末留美公費生歸國，投入中國初起步的現代新式工業和現代銀行業等新興企業。這批新興企業家，他們引進西方現代管理的方法和經營型態，並且結合新的一批華人同業工會組織。為擴展成員間的訊息，引進新觀念，他們出版專業雜誌，介紹新的管理方法和生產技術，分析國外市場等。1920年的上海中國總商會的領導層選舉中，一批新興的企業家拱出42歲的棉紡企業家聶雲台打敗了傳統買辦朱葆三（1848-1926），成為上海總商會的新總會長。在這次改選中，一批在第一次世界大戰期間和戰後成長起來的工業資本家、航運業資本家、銀行家成員加入上海總商會，並有不少成為領導層；這次上海總商會改選的結果，體現一批近代企業家所組成的新陣容意欲取代原有的紳商領導體制的作為 $^{25}$ 。1920年代以後愈來愈多的華資企業試圖進行企業管理體制的變革，確立以廠長—工程師制、標準工作法、新式財會簿記制、產品成本核算等一系列的新制度和方法，替代原來的工頭制為核心的舊式管理體制。代表的著名創新企業：慶豐紡織廠、榮家企業、上海美亞織綢廠和劉鴻生創辦的火柴企業等等，將這些新式管理和科技力量移植落實於企業界的先驅者，不少具有留美背景，即非留美背景，但均受到泰勒科學化管理革新的影響 $^{26}$ 。"}, {"type": "text", "text": "19 穆藕初，〈報告美棉遷地之效驗〉，收入穆湘玥著，《藕初五十自述（下）》，《中國現代自傳叢書》（台北：龍文出版社，1989，為據商務印書館1926年版印行），第1輯第10冊，頁46-49。"}, {"type": "text", "text": "20 穆家修等編，《穆藕初先生年譜（1876-1943）》，頁106、111。"}, {"type": "text", "text": "21 A. R. Burt, J. B. Powell and Carl Crow eds., Biographies of Prominent Chinese (Shanghai: Biographical Publishing Company Inc., 1925), p. 66; 穆家修等編，《穆藕初先生年譜（1876-1943）》，頁106-111、147、154。"}, {"type": "text", "text": "22 據江紹貞，〈聶雲台〉，收入中國科學院近代史研究所中華民國史組編，《中華民國史資料叢稿：人物傳記（徵求意見稿）》（北京：中華書局，1976），第3輯，頁110-115，「聶雲台是聶緝機的第三子，少年時隨父住上海，跟外國人學英語，兼學土木、電氣、化學等科。後來到美國去留學，加入過留美學生組織的「大衛與約那甬」（David and Jonathan）的兄弟會組織。」雖然該書1980年出版之版本已無赴美留學及加入兄弟會之語，但其曾跟隨外人學習，且英文流利則為確認。另可參見江紹貞，〈聶雲台〉，收入李新、孫思白主編，《中華民國史資料叢稿：民國人物傳》（北京：中華書局，1980），第2卷，頁249-255；聶雲台於1904年在上海組建復泰公司，承包華盛紡織總局。"}, {"type": "text", "text": "1909年收購華盛全部股份，改名恆豐紡織新局，親任總經理。"}, {"type": "text", "text": "23 Mou H. Y., “Commerce and Industry,” in American University Men in China (Shanghai: The Comacrib Press, 1936), pp. 119-120. 唐炳源於 1947 年遷居香港，翌年創立南海紗廠，有「紡織大王」之稱。"}, {"type": "text", "text": "24 Julean Arnold, “Chinese Products of Interest to American,” in Julean Arnold and Various American Consular Officers eds., Commercial Handbook of China, Vol. II (Washington: Government Printing Office, 1919), p. 321."}, {"type": "text", "text": "新興企業家社群中有許多是「美國大學俱樂部」的成員，像穆藕初於1923年擔任該俱樂部主席。該組織由畢業自美國大學的中美人士組成，自承以知識分子的使命，推動中美友好關係為宗旨。大戰時期的國際情勢分析與和平秩序的建立始終為該組織所關注，例如1918年該俱樂部餐會中討論的主題即是〈戰爭中的道德士氣〉（The Morality of War） $^{27}$ 。「美國大學俱樂部」成立於1902年，但其於1908年始接納華人為會員，因此一般誤以為成立於1908年。自成立初期到1912年間，主席皆由美國駐上海總領事出任。唐紹儀（1862-1938）曾於1913和1919年出任兩屆主席，創華人出任此一職位之先例。美國人出任俱樂部主席者有：上海聖約翰大學教授F. L. Hawks（1864-1947, 1915年主席）、美孚石油公司的W. W. Stephens（1916年主席）、美國在華商務參贊阿諾德（Julean Arnold, 1875-1946）於1918年任主席。《密勒氏評論報》（Millard's Review）的鮑威爾（John Benjamin Powell, 1888-1947）則曾於1917年擔任祕書。「美國大學俱樂部」歷任主席皆由頗具社會威望的中美人士擔任，可見得此一組織標舉中美友誼的意義。俱樂部中的華人成員在1920年代以後，更活躍中國政商、工程和教育文化界，在各領域位居要職，例如：財政金融界的孔祥熙（1880-1967）和宋子文（1894-1971）。畢業自密西根大學的許建屏則早在1925年任職財政部時即出任俱樂部主席（1934年出任財政部總務司司長）。學者群中胡適（1891-1962）、外交家王正廷（1882-1961）亦為該會的活躍人士。理工領域則有鐵路界的凌鴻勛（1894-1981）、顏德慶（1878-1942）和陳祖貽（1901-1985），水利界的孫輔世（1901-2004）、張含英（1900-2002）等，氣象學的竺可楨（1890-1974）等人。這批歸國學生帶回的新技術和知識觀念，與近代中國科學化和實業化的開展息息相關。（「美國大學俱樂部」歷屆主席名冊，參看附件：4-2）"}, {"type": "text", "text": "25 徐鼎新、錢小明，《上海總商會史，1902-1929》（上海：上海社會科學院出版社，1991），頁245。富有改革精神的錢莊經理、上海錢業公會會長秦潤卿（名祖澤，1877-1966）則當選為副會長。拙文此處主要說明的是新興企業家開始投入上海總商會領導層的活動，並占有一席之地。另據李達嘉的研究，1920年上海總商會領導層選舉的競爭，不能僅以新舊派系、浙江幫或非浙江幫等幫派觀點一分為二，還受外在經濟環境競爭、南北政治分裂和軍閥戰爭的影響。上海總商會領導層的選舉受外在勢力影響頗大，不能附會為新舊或幫派之爭。李達嘉，《上海商會領導層更迭問題的再思考》，《中央研究院近代史研究所集刊》，第49期（2005年9月），頁41-92。李達嘉，《商人與共產革命，1919-1927》（台北：中央研究院近代史研究所，2015年7月）。"}, {"type": "text", "text": "26 徐鼎新，《中國近代企業的科技力量與科技效應》（上海：上海社會科學院出版社，1995），頁44-48。從麻省理工學院取得管理碩士學位歸國的唐星海，回國後試圖改革家族企業慶豐紡織廠，同時留美礦冶碩士薛桂倫被延攬至廠擔任電氣工程師，但該廠在企業化革新過程中，遭到內部工頭勢力和家族長老勢力的反對。榮家集團無錫申新三廠大力推行泰勒的科學化管理，總工程師汪孚禮則是留日背景。上海美亞織綢廠為莫觴清獨資創設，其女婿蔡聲白畢業自美國麻省理工大學，蔡主持廠務後，順利廢除工頭制，建立科學管理化管理。被喻為「天才企業家」從事煤炭和火柴企業的劉鴻生，則是將成本"}, {"type": "text", "text": "會計視為實施科學管理的重要環節。科學化管理在1920年代為新興企業所採行，但或多或少都遇到舊勢力的抵制。關於1920年代中國新式企業的研究至為豐富，非本文題旨，最新的相關研究介紹，可參見：卞歷南（Morris Bian），〈西方學界最近四十年對於中國企業史研究的述評〉，《經濟社會史評論》（天津：天津師範大學），2018年第4期，頁104-127。"}, {"type": "text", "text": "27 American University Men in China (Shanghai: The Comacrib Press, 1936), pp. 19-26. 該組織於1930年共有10名終身會員，196名一般會員，其中有97名中國人。1933終身會員大幅增加到76名，會員總數達383名，共有207名中國籍會員。1935年，共有106名終身會員，會員總數396名，其中有204名中國籍會員。工程界的成員描述參見該書，頁90-106。"}, {"type": "text", "text": "一次大戰後，同時也是各國科學家和工程師積極組織跨國機構，以促進科學專業化和工程技術合作的時代。1919年7月，第一屆國際研究大會（International Research Council）成立於布魯塞爾，共有11個創始國（含日本），超過200個會員代表，其中美國有21個會員代表 $^{28}$ 。雖然英國早於1901年即於上海創建「中華國際工程學會」，但該組織成員主要以負責上海公共租界工程為主，與創建於北京的「中美工程師協會」之承攬北京政府的大型公共工程略有不同 $^{29}$ 。「中美工程師協會」成立於大戰結束後的"}, {"type": "text", "text": "1919年11月22日，成員主要為在華從事鐵路、公路、開礦、電訊、電力、電車和機械動力相關之工程，亦有少數大學教授參與。該協會以增進工程知識和實務經驗、維持高度專業和培養團隊合作之精神為宗旨，並出版英文刊物《中美工程師協會月刊》(Journal Association of Chinese and American Engineers)。該協會的會員許多也是「美國大學俱樂部」成員，甚至有些美籍會員享譽國際工程界，地位相當崇高，例如：美國工程專家古德里奇(R. D. Goodrich)、曾任紐約水利局的資深工程師暨中國大運河署理工程師威京（Thomas H. Wiggin）、美國著名橋梁工程專家溫德爾（John Alexander L. Waddell, 1854-1938）、水利專家費禮門（John R. Freeman, 1855-1932，中文或譯為「傅禮門」）。他們承攬工程和投資的區域範圍，從美國本土、中國延伸到日本等遠東各國，甚至遠達歐洲 $^{30}$ 。「中美工程師協會」與國際研究大會於同年先後誕生，說明在華中美工程師群體對中國工程學的知識化和科學化的熱誠與世界各國相比，毫不遜色。"}, {"type": "text", "text": "歐戰爆發初期，在中國方面，1915年著名華商張振勳（張弼士，1840-1916）等人，為發展國際貿易，特聯絡美國商人在中國組織中美銀行，額定股本1000萬，同年10月5日經財政部批准立影攝念紀之時美在團業實美游國中案。張振勳且組織游美實業團赴巴拿馬萬國博覽會並考察美國商會，當時《東方雜誌》刊出游美實業團在美活動盛事之大合影 $^{31}$ 。事實上，張振勳此次組織實業團訪美的起源可溯自清末宣統2年10月美國航運資本家大來和穆爾訪問上海所促成的幾項友好協議，當時張振勳代表廣州商會被推舉為華方會長，美方議長則是穆爾，協議結果包括設立中美銀行、兩國商會互設品物陳列、互派商務調查員和議設中美輪船公司的主張 $^{32}$ ，可惜不久革命爆發，這些協議來不及實施，然而，中美兩國實業家的斡旋合作並未隨著中國政治動亂而中斷。北洋政府時期曾與美國政府訂有不少中美合辦實業的案例，例如開採石油、合辦無電線訊、導淮工程和電氣工程等事業 $^{33}$ 。延續此一中美實業合作的特殊傳統，以從事實業為職志的張謇（1853-1926），即稱中美同屬共和，其輩分情誼「若師弟」，美國應有「提絜之親」。他於1919年致信給對中國至為親善的美國公使芮恩施的信函說："}, {"type": "text", "text": "28 Emily S. Rosenberg eds., A World Connecting, 1870-1945 (Cambridge, Mass., London, England: The Belknap Press of Harvard University Press, 2012), p. 932. 參見 Report of the Meetings of the International Research Council and of the Affiliated Unions Held at Brussels, July 18-28, 1919. 創始國有：比利時、加拿大、法國、不列顛聯合王國、義大利、日本、紐西蘭、波蘭、羅馬尼亞、塞爾維亞、美國等。"}, {"type": "text", "text": "China's internationalization: the case of ‘The Engineering Society of China’, 1901-1941.” in María Dolores Elizalde & Wang Jianlang eds., Chinas Development from a Global Perspective (Newcastle: Cambridge Scholars Publishing, 2017:8), pp. 375-403."}, {"type": "text", "text": "http://www.ncbi.nlm.nih.gov/pmc/articles/PMC1084535/?page=1（2015/01/01點閱）。"}, {"type": "text", "text": "29 詳見：Wu Lin-chun, “Foreign Engineers’ Activities in China and the Process of"}, {"type": "text", "text": "30 據 1922 年的會員名冊，除榮譽會員 10 人，共有一般會員 147 人，美國籍占 87 人，中國籍 60 人。另有準會員（associated member）23 人，美籍占 5 人，中國籍 18 人。1922 年的 10 名榮譽會員中，中美各占 5 名。參見 Journal Association of Chinese and American Engineers, Vol. 5, 1922."}, {"type": "text", "text": "謇嘗謂太平洋兩岸大陸中美若兄弟，而共和之輩分中美若師弟，以其關係之切，自應有提絜之親。公與赫綏君及貴國諸君，若更以感情及地位，進而謀兩國實際上之互助，其大有利於兩國，行卜如旭日之方升也。34"}, {"type": "text", "text": "是年芮恩施陪同美國政商人士訪問團訪華，芮恩施和赫綏君表示將招攬一批美實業資本團與中國人士合組發展工商業，張謇對於中美兩國如何組織合作和進行方針，望之甚殷，而有此一信函。"}, {"type": "text", "text": "31〈中國游美實業團在美時之紀念攝影〉，《東方雜誌》，第12卷第8號（1915年8月），收入王雲五主持，《重印東方雜誌全部舊刊五十卷》（台北：臺灣商務印書館，1971-1976），頁28957。張振勳經商南洋事業有成，曾有「東南亞首富」之稱。另外重要事蹟有：在煙台創辦張裕葡萄釀酒公司、1890年代初期曾任中國駐新加坡總領事。"}, {"type": "text", "text": "32〈中美商團會議筆記〉，天津市檔案館藏，《天津商會檔》，401206800-J128-2-003100-001。Robert Dollar, Private Diary of Robert Dollar on His Recent Visits to China, Published 1912."}, {"type": "text", "text": "33 詳見吳翎君，《美國大企業與近代中國的國際化》，在這些個案中1913年到任的美國駐華公使芮恩施涉入甚深。此外，1918年6月，北京政府交通部曾與美國西方電氣公司、日本電氣公司議定合辦中華電氣公司，資本額100萬元。參見李玉，《北洋政府時期企業制度結構史論》（北京：社會科學文獻出版社，2011），頁620-621。"}, {"type": "text", "text": "圖4-3：中國游美實業團在美時之紀念攝影"}, {"type": "text", "text": "資料來源：《東方雜誌》，第12卷第8期（1915年8月），台北重印版，頁28957。"}, {"type": "text", "text": "34 張謇，《為組中美實業復芮恩施博士函》（1919），收入張謇研究中心編，《實業》（南京：江蘇古籍出版社，1994），《張謇全集》，第3卷，頁803。赫綏君之英文名不詳。"}, {"type": "text", "text": "芮恩施於1913年出任美國駐華公使，使華期間努力促成中美兩國在經濟、投資和文化交流等各方面的友好合作關係，因此在1919年卸任後被邀請出任北洋政府外籍顧問，年薪高達二萬美金，且得在美國行使職務，惜其於1923年病逝於上海 $^{35}$ 。"}, {"type": "text", "text": "為了促進大戰期間美國對華貿易，1915年6月19日，除了原本的「美國亞洲協會」的組織外，美國在華商人進一步於上海成立「中國美國商會」，商會組織雖屬民間性質，宣稱為一非營利、非黨派色彩的組織，主張自由貿易、市場開放、私有企業和資訊自由交流等原則。然而該會成立之初即帶有官方色彩，不僅成立大會由美國駐上海總領事西蒙斯所號召，名譽委員則包含美國駐京公使和使館代辦（Chargé d'Affaires）、美國上海領事館總領事和美國資深副領事，可見得美國在華企業和美國政府間的密切關連。首次執行委員會議年會於1916年8月18日召開，本次會議中討論的焦點為大戰期間船隻載運不敷使用，必須借助英船與日船所衍生出的相關問題。由於戰時英國實施「協約國敵國貿易法案」限制並檢查與交戰敵國的航海貿易等措施，以及日本對本國國民貨運費的優惠，使在華美國公司的出口業務受到波及。特別是英國對於在中國出口的貨品不得運往至德奧敵國要求出具證明文件，儘管這些美國公司的貨品係運送至美國本土，但仍被英國領事在證明文件上予以刁難，以致延誤交貨，甚至有些美國公司還被英國列為拒運的黑名單，「中國美國商會」希望美國政府能循外交途徑解決此事 $^{36}$ 。"}, {"type": "text", "text": "一戰以後，美國在華商會和上海外商總會間開始有密切的交流。首任「中國美國商會」會長麥克邁克爾（J. H. McMichael）呼籲在華美商必須主動和華商建立交誼和拓展社會網絡，而有中美商人團體踏出友好的第一步。1918年4月，「中國美國商會」邀集時任San Francisco Chamber of Commerce副主席的大來輪船公司老闆羅伯特·大來（即勞羅·大來，曾任Merchant's Exchange of San Francisco主席）和甫從美國宣揚進軍中國市場歸來的商務代表阿諾德等人與中國實業界名人聚餐。大來言詞激動地談到如何喚起美國人重視中國市場的方案及步驟：首先是訪問美國各地商會，其次是邀請中國代表赴美訪問。當時在舊金山才剛成立中國俱樂部（San Francisco the China Club），人數並不多。羅伯特·大來提及「美國外貿協會」（Foreign Trade States）上次聚會共有1,500人參加，與會人士最關注的是南美貿易，經由他本人和其他人的鼓動，美國投資者始將中國放入市場版圖的規劃之中。在「中國美國商會」這次的聚會中，駐滬外交部特派江蘇交涉員朱兆莘（甫被任命為中國駐舊金山總領事，1879-1932）也向在座的中美商人表示，中美之間應有更多的經貿交流和經濟合作。此次聚會，出席的中國工商企業家則有：中國銀行的張嘉璈（1889-1979）、L. F. Chai（代表華興麵粉公司，不知中文名）、聶雲台（聶其傑，代表華豐紡織公司）、沈敦和（代表華安合群保壽股份有限公司，1866-1920） $^{37}$ 。同年4月15日，上海總商會會長朱葆三，副會長沈聯芳（1870-1947）邀請「中國美國商會」第二屆主席伯恩（W. A. Burns）、美國駐華公使芮恩施、上海總領事西蒙斯、美國在華法庭法官羅炳吉、美國亞洲協會主席弗萊明（W. S. Fleming）與中美商人晚宴。雙方興致高昂討論如何促進中美商務發展，宴會大廳中精心布置協約國國家的國旗、鮮花和各式彩燈，顯示中方對此次交誼的重視 $^{38}$ 。"}, {"type": "text", "text": "35 芮恩施著有使華回憶錄，Paul S. Reinsch, An American Diplomat in China (Garden City/N.Y., Toronto: Doubleday, Page and Company, 1922)."}, {"type": "text", "text": "36 “An American Chamber of Commerce,” The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Jun. 12, 1915. 刊載了正式成立大會之前"}, {"type": "text", "text": "的聚會討論。"}, {"type": "text", "text": "37 Second Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, April, 1918, pp. 17-18."}, {"type": "text", "text": "1918年4月「中國美國商會」召開的第二次執行委員會議年會中，首先表明去年（1917）以來對商會最重大的事件（the most momentous event）即是美國參加大戰，此一舉動勢必使得美國政府調整其商業事務，但強調美國和協約國國家為同一目標而合作努力的同時，仍需謹守創建「中國美國商會」的基本原則，亦即擴大美國在中國的貿易；不論現在或戰後，美國在華商會在戰事的壓力下，都必須確保對華貿易得以持續。這次執行委員會中亦提到美國對華出口價值的快速增加：大戰爆發前六年平均值約3,500萬海關兩，過去十年的平均值為4,300萬海關兩，過去四年的平均值為4,800萬海關兩，而1917年的數據則是6,100萬海關兩，顯現中國市場對美國愈趨重要 $^{39}$ 。為因應戰爭局勢，此次會議中亦討論與英、法等協約國家在華商會和僑民的合作問題，但他們更強調的是美國商會必須保持和「美國亞洲協會」的合作串聯。會議紀錄中特別提到過去二年來美國兩間私人企業在華的快速成長：一為以生產蛋品類為主的阿蒙鳥禽公司（Amos Bird"}, {"type": "text", "text": "Co.），一為奇異電器公司（American General Edison Corporation of China）。這兩家公司靠著中國的廉價勞工快速獲利，不僅提供中國市場的需求，且外銷全球，堪為美國其他製造業的榜樣，紀錄中也提到美國資金和製造業的進駐中國，對於中美雙方都是互惠互利的雙贏策略 $^{40}$ 。"}, {"type": "text", "text": "1918年11月《美國亞洲協會期刊》刊出〈中國近代工業的努力〉（China's effort in Modern Industry）一文，指出中國民間企業和新式工廠正欣欣向榮，但美國人多關注北京政爭的演變，而忽略了中國這股蓬勃發展的民間力量。該文配有一幅照片，內容為一群在工廠大門前的中國工人，照片說明稱這些工人工資少、工時長，但卻勤快認真，這在美國是不可能的事。文中特別提到中國新式工業的振興，可歸功於清末湖北張之洞創辦漢陽鋼鐵廠，而張謇踵繼其後。最後亦提到留美學生引介新式機器的作用、中國棉紡織工業的興起，以及中國迫切需要外國的投資來發展實業 $^{41}$ 。這篇文章正說明了美國商人對於大戰結束後中國工業化市場的美好圖像。"}, {"type": "text", "text": "如上所述，上海華人新興的企業家中，特別是棉紡織業，有不少人具有留學美國背景。他們適巧於一次大戰後回到中國，將美國棉紡織業和科學管理方法引介進中國正新興的棉紡織產業。不惟新興企業如此，據胡光廌（1897-1997）的說法，一次大戰後在美國學習工程的中國留學生，也基於改造中國的想法，回國參與一次戰後中國急起直追的實業建設。這批學習工程的留學生，不少在租界裡從事工程設計和進口機器物料。而胡光廌本人也是「中美工程師協會」的會員 $^{42}$ 。另一幅相應的圖像則是在華美國商人同樣展現了對中國市場的企圖心，在上海的「中國美國商會」在大戰以後更加積極爭取中國市場，利用中國廉價勞工，引進資金和設廠投資，並且與上海華商主動交流，爭取更多的進出口貿易和市場訂單。據《申報》記載，1917年2月曾有羅司（David S. Rose, 1856-1932）實業團訪華。羅司曾任威斯康新州密爾沃基市市長（Mayor of Milwaukee, Wisconsin, 1898-1906, 1910-1912），是美國全國商會聯合會組織的會員，曾於1916年遊歷北京、上海，並調查中國商業情形，由於這次訪問他和上海總商會成員相談甚歡，乃促成1917年2月率領美國實業團體再度訪華之舉 $^{43}$ 。當時曾醞釀成立「中美國際商會聯合會」，希望通過中美兩國各地商會的攜手合作設立一個促進中美貿易的聯合組織，此一提議曾於上海總商會中有所討論 $^{44}$ 。"}, {"type": "text", "text": "38 Second Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, April, 1918, pp. 18-21. “Chinese Chamber of Commerce Entertains Americans,” Millard's Review of the Far East (1917-1919); Apr. 20, 1918. 據該報的報導此次聚會時間為4月15日。"}, {"type": "text", "text": "39 Second Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, April, 1918, pp. 1-3, 5."}, {"type": "text", "text": "40 Second Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, April, 1918, p. 11."}, {"type": "text", "text": "41 \"China's effort in Modern Industry,\" Asia: Journal of the American Asiatic Association, Nov., 1918, pp. 963-967."}, {"type": "text", "text": "就在一次大戰行將結束之際，在上海中美兩國商人團體也曾討論過組織「協約國聯合商會」的構想，一來力圖保持協約國家在戰時的合作以謀求世界經濟的復甦，二來共同抵制戰後德奧等同盟國在遠東商場恢復其舊有之競爭力，並認為上海的特殊商業地位最為適宜設置此一組織 $^{45}$ 。「中美國際商會聯合會」和「協約國聯合商會」的構想和組織於戰後並未馬上付諸行動，抵制協約國家的行為只聞樓梯響未見影蹤。然則，我們必須留意到一戰之後，不僅是中美在華商會的交流，在國際商會之間有更大的跨國合作企圖。1920年6月在美、英、法、比、意等五國的列名發起下，以恢復歐洲各國經濟繁榮和促進各國合作的非政府國際組織——「國際商會」（International Chamber of Commerce, ICC）宣告成立，成立時有45名國家，自諛為「和平的商人」（the merchants of peace）。一戰時期的敵對國家——德國，要到1925年始被批准入會。中國則是考量自身國際地位與列強有所差距並未加入「國際商會」，直到1931年，國際商會中國分會始告正式成立。"}, {"type": "text", "text": "一戰結束後，受到歐美在華商人矚目的另一件大事，則是黃浦江的整治和上海國際大港的開發計畫。緣於上海自清末開港以來，黃浦江的淤塞情形對於外國輪船的進出造成很大的阻礙，各國外交使團要求修築上海港及疏浚通往該港河道的意見始終不斷。攸關口岸貿易利益的上海萬國商會，曾擬於1911年提出暫行章程與中國交涉，惟不久辛亥革命爆發。1912年袁世凱政府訂立「浚浦局暫行章程」，其規定組織、營運、經費共12款；內容規定該局由上海通商交涉使、上海稅務司、上海港務局三者組成（第1款），另外規定組成顧問局（Whangpoo Conservancy Consultative"}, {"type": "text", "text": "42 胡光廌，《波逐六十年》（台北：新聞天地社，1967），頁214-220。"}, {"type": "text", "text": "43〈總商會歡迎美實業家紀盛〉，《申報》（上海），1916年6月17日，第3張。關於1917年羅司實業團訪華，可詳見賈中福，《中美商人團體與近代國民外交》（北京：中國社會科學出版社，2008），頁95-102。"}, {"type": "text", "text": "44〈組織中美國際商會之函稿〉，《申報》（上海），1917年4月23日，第3張。滬商對於加上「國際」兩字與原案未甚符合，冀再提全國商會討論；參見〈滬商會對於組織中美國際商會聯合國之意見〉，《申報》（上海），1917年5月17日，第3張。"}, {"type": "text", "text": "45〈組織協約國商會之主義〉，《申報》（上海），1918年9月29日，第3張。據該報之引述：「此議首倡為英國某著名銀行家，美人商會即援其義，首先向中國商會之代表作公共之討論，中國商會極以為然，而其他商人團體之代表，亦表贊同」；〈組織協約國聯合商會之贊同〉，《申報》（上海），1918年10月7日，第3張。"}, {"type": "text", "text": "Board），其局員由擁有出入上海船舶的大噸位之五個國家——英、美、法、日、荷各派一名，中國方面則由上海總商會推派一名。整治計畫在上海浚浦局總工程師瑞典人海德生（H. Von Heidenstam）策劃下展開，基本上維持了航道之需求 $^{46}$ 。大戰爆發之後，上海港的航道和領港問題儘管有國際管理上的困難（因敵對國家的嫌隙），但也如前所述中國口岸進出口貿易量的急遽增加，上海港航道勢需勉力維持，而浚浦工程由海德生督率辦理仍認真進行中。大戰甫一結束後，上海港的迫切整頓立即受到萬國商會的關注而提出數種解決方案。《申報》記載「浚浦局已經外交團議准撥用銀三十萬兩，以供從外國招致極有資格之專家來華詳細測量神灘與杭州灣經費，他日測量後將有報告書從工程學觀察點斷定可否行此計畫」 $^{47}$ 。《申報》也為此詳加報導西人工程師海登斯丹氏（即海德生）與波威爾氏（工程學碩士，英文不詳）的不同。前者大略為變黃浦江口為一大湖，後者大致為在揚子江角之西的杭州灣口設一新港，現有淺河與黃浦江口相通 $^{48}$ 。"}, {"type": "text", "text": "黃浦江的疏浚及浚浦局的管理顯然攸關美國在華航運的進展，1920年代以後美國商船在長江沿岸的航運業大有進展，美孚公司、大來（Dollar Line）、捷江輪船公司（Yangtze Rapid Steamship）為最主要業主 $^{49}$ 。1921年，上海港口技術顧問委員會成立，由中、英、美、日、法、荷及浚浦局總工程師海德生參加，並邀請各國海港專家到滬商討上海航道水深問題，專家一致認為黃浦江航道應繼續挖深，使之能通過吃水10米的船隻。美國駐上海總領事柯銀漢詳細報導了上海港口技術顧問委員會、各國商會代表和外交使團之間的反覆討論細節，顯現一戰結束後上海港計畫受到美國政府的高度關注 $^{50}$ 。1922年4月初於上海召開的「中美工程師協會」年會海德生提交的論文題目正是〈上海港發展〉（Shanghai Harbor Development） $^{51}$ 。海德生自1920年提出的「黃浦江維持改善計畫」，1923年完成第3版修訂，這份計畫共有八十餘頁，柯銀漢稱海德生計畫書的五大標題（地理特色、港口容量和聯結、港口的經濟商業活動、港口的行政管理、港口的要件）提供上海發展為國際港的最有價值訊息，清楚向美國國務院傳達支持改善黃浦江航道水深的看法 $^{52}$ 。將上海港發展成為國際大港的計畫在一戰以後成為美國商會、工程師和美國政府共同凝聚目光的焦點。"}, {"type": "text", "text": "46 辛丑和約（1901）之附件中達成設置「上海浚浦局」之專責機構，並訂有關營運、組織、經費之相關章程。但由於該局委員雖包含上海道台，但仍以洋人居多，而疏浚經費究係由中外各半，亦頗多爭論。光緒31年（1905年）又有「改訂修治黃浦河道條款」，確定成立浚浦機構，由江海關道（上海道台兼任）和英籍海關稅務司組建浚浦工程總局，施工一度順暢，開工數年之後，因經費不足於1911年中止疏浚工作。詳見：森田明著，鄭樑生譯，《清末民初的江南三角洲水利與帝國主義統制——上海「浚浦局」之設置》，《清代水利社會史研究》（台北：國立編譯館），頁249-278。"}, {"type": "text", "text": "48〈西人振興上海口岸計畫〉，《申報》，1919年3月27日，第3張。"}, {"type": "text", "text": "47《申報》，1919年3月27日，第3張。即有二文提到上海疏浚工程。一篇為〈萬國商會歐戰後大會記〉。一篇為〈西人振興上海口岸計畫〉。前者提到〈萬國商會該議期中所擬版法有（一）在口外神灘開挖峽道深至最低潮流時40英尺為度；（二）在黃埔築壩；（三）在吳淞設立船塢三層。大眾意見黃埔築壩似不可行，因上海溝渠排泄與飲水接濟及航行需要皆將大受影響。吳淞設塢有鐵路直通上海一層乃可行之辦法，但挖深神灘一層須先經極有經驗之專家從事研究，俟得其意見，然後始能討論此經費甚鉅之計畫也。"}, {"type": "text", "text": "49 關於美國商船在中國長江口岸的活動，詳見：David H. Grover, American Merchant Ships on the Yangtze, 1920-1941 (Praeger Publishers: Westport, 1992), pp. 63-85."}, {"type": "text", "text": "50 “Whangpoo Conservancy Board: Reports of the Consulting Engineers,” Edwin S. Cunningham to the Secretary of States, Oct. 20, 1922. United States National Archives (Microfilms) Washington D. C., Records of Department of State Relating to Internal Affairs of China, 1910-1929. (本書簡稱NA) 893.811/476."}, {"type": "text", "text": "51 Journal Association of Chinese and American Engineers, April and May, 1922, p. 2."}, {"type": "text", "text": "以上各個面向都說明一次戰後美國在華商人團體、工程界和美國駐上海領事館，均共同參與一個重新出發的中國市場及打造上海成為國際大港，引領中國面向世界市場的願望，並交織出一個具有新氣象、新企業思想的社會關係網以及國際市場的巨大圖像，每一環結同時在中美經濟交往中發揮重要的聯繫作用。"}, {"type": "text", "text": "三、美國政府的作用——1922年《美國對華貿易法案》"}, {"type": "text", "text": "一次大戰期間美國駐華使領和商務參贊以及美國國務院之間對中國的商業發展和工業化進程極為熱中，並和美國資本家、工商團體組織相互攜手。1915年美國在華商會的誕生固然由於大戰爆發後商人團體的自發性組織，但是美國駐中國各地口岸使領均是重要推手，美國駐華各個商會的成立大會地點甚至是在領事館召開，口岸領事在成立大會代表美國官方致達祝賀詞，美國商人則以美國領事館舍作為美商活動聚點，他們更催促美國在上海應有一幢氣派豪華的領事館得以匹配在華美商的高段身分，並藉此突顯美國對中國利益的重視 $^{53}$ 。1916年美國駐上海新領事館在黃埔路 13-14 號上啟用，這棟價格不菲的建築物，其美輪美奐足以傲視各國駐上海領事館建築，它的開幕也象徵著美國逐漸從太平洋的另一岸走向遠東舞台的中央。"}, {"type": "text", "text": "為鼓勵美國商人來華投資，指引美商理解中國口岸城市的各種現況，美國政府動員口岸領事和學者專家深入調查中國經濟、地理和文化，並出版了一份圖文並茂「中國全景式」的官方出版品。1919年，美國商務部（Department of Commerce）出版《中國商務手冊》（Commercial Handbook of China），這份手冊由商務代辦阿諾德擔任主編，手冊分為上下二大巨冊，上冊629頁，下冊467頁。上冊參與編撰者包括領事館人員，先介紹中國各省發展概況、中國進出口貿易和中美貿易的一般情況，其次就條約口岸各領事區域商業發展的調查，包括廣州、香港、奉天、上海、天津、廈門、安東、芝罘、大連、福州、南京、汕頭、青島等口岸，並配有五十餘幅照片和地圖。縷述中國各口岸的位置、人口、行政組織、教育、農產、礦產、交通電訊、公共事業、進出口貿易、旅遊設施、商業組織、美國利益和各地領事館的建議。下冊撰稿者涵蓋中美兩國人士，照片和地圖有二十餘張，首先以24頁介紹中國歷史，從上古到民國肇建，略古詳今。其次，介紹中國政府的組織。接著依主題介紹中美之間的關係，包括中美商約、領事裁判、美國法院在中國、版權和專利、美商在中國可能遇到的各種問題之處置（運貨、發票、護照、婚姻、生與死、財產擁有等等）、海關稅收、中國鐵路發展、中國政府的財政稅收、各地銀行、中國的行會和商會、中國物產與美國利益相關者（含礦業、畜牧業、林業、絲工業、製造業、糖業、棉織品等）、在中國的宣傳、勞工和生活水平，對美國製造業和商人的一些建議、進出口貿易、可能的遠景、訓練美國人認識亞洲的建議（包括學習語文、合作和理解、建立學校和提供獎學金等等）、美國在華學校的概況和中國留美學生的介紹。這兩大巨冊可謂教導美商如何洞悉中國市場現況、分析投資環境、各項商情蒐集和理想願景的教戰手冊，其中並要求美國駐華各領事館以更務實政策與美商共同合作，以促進美國在中國的利益。美國商務部自諛這套書對中國商務概況介紹之詳盡為「空前未有」，大有裨益於美商理解中國的投資環境和文化風俗 $^{54}$ 。"}, {"type": "text", "text": "52 美國國務院所收錄海德生的上海港改善計畫及報告書詳見：“Whangpoo Conservancy Board”, Edwin S. Cunningham to the Secretary of States, May 16, 1923, NA, 893.811/526. 正文有81頁，另有附錄。"}, {"type": "text", "text": "53 \"Some Of The Activities of the American Asiatic Association Since Its Organization,\" The American Asiatic Association, Printed for the Annual Meeting, Oct. 21, 1937, New York, 1937, p. 7."}, {"type": "text", "text": "1922年9月19日，美國國會通過了《對華貿易法案》（China Trade Act），該法係為在中國營業的美國公司所專門設立的，其基本內容是特准美國公民依照此一法案，在美國本土向聯邦政府登記在法律上作為美國的國內公司，但是總、分公司都必須設在中國境內，並且在中國境內營業，其可享有聯邦政府稅捐的豁免權。按照該法規定所組織之「美國聯邦股分有限公司」（Fed. Inc. U.S.A.）所有人（股東）悉在華居住者（營業），免徵全部公司所得稅，其他各公司亦得按照在華所有人之比率免除部分公司所得稅。該法案為鼓勵投資又放寬公司資本不必按照成例，以往美國方面的資本至少占公司資本金額的51%，現改為只須該公司董事美國人占有多數，以及經理、祕書和財務等重要主管均由美國人出任，鬆綁股本所有者的國籍限制 $^{55}$ 。在華商務部國內外商業局（Bureau of Foreign and domestic Commerce, BFDC）局長克來恩(Julius Klein) 說明《對華貿易法案》的基本精神在於提供美國商人從事對華貿易的「急需紓困」(urgently needed relief)而制定該法案。值得重視的是這一法案不是專為美國大財團和大企業量身定做，而是更為了鼓舞一些中小型企業來華投資貿易。這份官方文件中指出歐戰以前美國在華的重要企業不過三到四家，以中國對外貿易總量而言，美國僅有6%，遠遜於英、德、法、日等國。但是歐戰期間美國在歐洲市場的削減並與歐洲國家在遠東市場的競逐結果，美國商人已在中國對外貿易中占有立足之地，在法案頒布之前上升到中國對外貿易的17%，1921年突破了二億美元(\\$200,000,000)。上海美國商會會員（含個人會員與企業會員）由1915年的48位到1921年增加為412位，主要以從事鋼鐵製造、礦產石油、棉紡原料、機器進出口等企業。1921年美國對華出口貨品與價值的統計分布如表4-3："}, {"type": "text", "text": "54 Julean Arnold and Various American Consular Officers, Commercial Handbook of China, Vol. I, II (Washington: Government Printing Office, 1919)."}, {"type": "text", "text": "55 China Trade Act, 1922: With regulations and forms. Trade Information Bulletin, No. 74.《1922年對華貿易法案》內容也牽涉股本和稅制的複雜計算，本文僅列其最主要內容和精神。此外，英國政府曾於1915年針對在華從事貿易的英國公司予以減稅優惠，美國的1922年《對華貿易法案》亦採用相似減稅措施。"}, {"type": "text", "text": "克來恩這份解說的最後一句是「中國的經濟發展正在甦醒中，中國市場快速且迫切需求美國製造的每件商品。」 $^{56}$ 1922年《美國對華貿易法案》的頒布，說明了一次大戰結束後，美國政府大力支持對華投資和擴張商業的具體作為，並對日後美國在華投資產生了重大影響。上述美國政府公告的美國對華出口數字和本章第一節提到中國海關進口美國貨品的統計數字差距不大（美方資料顯示1918年1海關兩約值1.193美元） $^{57}$ ，都同樣說明一件事，即大戰期間中美貿易的數量、價值和商品項目的大幅進展。"}, {"type": "text", "text": "《對華貿易法案》公告不久，便出現一些法律與現實上的落差，有更多的聲音是希望再放寬法案，理由是美國在華各大公司之多數，其資本幾完全為居住美國國內之股東所有，這些公司因所得稅免除僅限於在華居住（營業）之股權，多未能按照對華貿易法變更其組織，所以他們並未真正享受到《對華貿易法案》的免稅優惠。1923年1月美國眾議員戴爾（L. C. Dyer）來華訪問——此人原本就是美國對華法案的主要支持者，1月17日在上海的歡迎聚會約有百餘位美國僑民和美國官員出席，由美國中國商會主席哈洛德·大來（J. Harold Dollar）和美國亞洲協會主席芬德萊（W. T. Findley）共同接待戴爾，這些與會人士更精準表達修正對華法案的心聲 $^{58}$ 。《密勒氏評論報》記者兼主編鮑威爾（J."}, {"type": "text", "text": "B. Powell，他同時也是商會成員）緊盯著戴爾訪華行程，積極和美國駐華商務代辦李亞（Frank Rhea）聯繫，爭取安排美國商會團體得以在上海和戴爾暨美駐華官員面對面表達意見，將他們的心聲直接傳到美國國會 $^{59}$ 。戴爾訪華期間《密勒氏評論報》真切反映了在華美商要求擴大法案的需求，另對戴爾而言，《對華貿易法案》的意義不僅只是對美商一方有利，而是他堅信美國參與中國市場的開發將有利於兩國友誼，他特別提到美國退還庚子賠款的金額已達到一千五百萬關兩（G. 15,000,000），希望中國政府能好好利用這筆善款做基礎交通建設，使偏遠中國內陸儘早開發 $^{60}$ 。"}, {"type": "text", "text": "1924年美國國會修正《對華貿易法案》涉及12項條文，其中最重要的修正即是原法案中的股份所得稅規定，使該法案下設置的美國公司稅之免除，不獨限於在華股東之所有者（美國在華居住公民），即在美之股東亦享有同等之權力；同時依據該法案下設置的美國公司，不論是個人或公司的持股均得以享有減免稅捐 $^{61}$ 。"}, {"type": "text", "text": "(1922-1923); Jan. 20, 1923. 戴爾係聖路易州（St. Louis）選區的眾議員代表，曾在1920年首次訪華，頗知曉中國市場對美國的吸引力，催促《對華貿易法案》。《對華法案》通過後，戴爾在1922年12月到馬尼拉訪問，途經上海停留數小時，次年1月返美途中又停留上海聽取美商對貿易法案的意見。“Congressman Dyer Returns to Study Conditions in China,” The Weekly Review (1922-1923), Dec. 23, 1922."}, {"type": "text", "text": "56 China Trade Act, 1922: With regulations and forms. No. 74 by United States. Bureau of Foreign and Domestic Commerce. Published in 1922."}, {"type": "text", "text": "59 J. B. Powell to Frank Rhea, Dec. 21, 1922. China Trade Act General Record, 1922-49, box 10. Foreign Service Posts of Department of State, Shanghai Consulate General, Commercial Section. United States National Archives, Washington D. C."}, {"type": "text", "text": "57 Julean Arnold, “Chinese Products of Interest to American,” in Julean Arnold eds., Commercial Handbook of China, Vol. II, p. 274. 如附錄4-1，一次大戰結束後的1919年，美貨輸華價值超過於大戰時期，輸華價值110,236,706海關兩，1921年又增為175,789,652海關兩。"}, {"type": "text", "text": "60 “Congressman Dyer Returns to Study Conditions in China,” The Weekly Review (1922-1923), Dec. 23, 1922."}, {"type": "text", "text": "58 \"Congressman Dyer Pledges Support to U.S. China Trade,\" The Weekly Review"}, {"type": "text", "text": "61〈雜纂：建議修正美國對華貿易法〉，《銀行週報》，1924年（第8卷第12期），頁31-33。文中亦提到在華之美國關係人，還提議修改該法案中有關組織輪船公司之股東限制。"}, {"type": "text", "text": "《對華貿易法案》歷經數次修正，據美國政府商務部國際貿易局網站，在1949年以前約有250家的美國公司受惠於此法而設立，其間只有4家公司最後解散或因執照過期而被註銷，可見此一法案實施之成效 $^{62}$ 。"}, {"type": "text", "text": "據1928年上海美國商會登錄的企業會員名冊，航運業、紡織業、金融和機器進口業為首要代表企業，同時這份名冊資料也提供了依據《美國對華貿易法案》而成立的公司（有標註「Fed. Inc.」之名單）。當時由於受到中國排外風潮影響，上海美國商會的企業會員雖降為68名，但其中因《美國對華貿易法案》而成立者有14間，馬達汽車進口、房地產公司、控股投資公司與保險業務都是新興熱門行業，甚至有從事消毒和衛生設備的專門企業，這些公司大多不是資本額龐大，顯現對華法案具有鼓勵美國中小企業到中國發展的指標，而其投資項目也與中國口岸城市化的商機最為相關 $^{63}$ 。1930年以後美商企業在上海城市的電話電訊、無線電台和電力設施，占有很大的比重（附錄9-1）。上海電話公司（Shanghai Telephone Company，1930年成立）和滬西電力公司（Western District Power Company of Shanghai，1934-35年成立）也是依美國《對華貿易法案》而設置的公司。值得注意的是，上海最大的電力公司——上海電力公司（Shanghai Power Co.）在1929年由美商收購約80%股份，成為美國公司，但它並不是《美國對華貿易法案》的公司 $^{64}$ 。然而，美國汽車大製造商福特汽車公司（Ford Motor Company）在華經銷業務的美通公司（又稱美通福特汽車，1927年成立於上海）則是一家《美國對華貿易法案》的公司。為何有些美國公司將其在華分銷處改組為《對華貿易法案》的公司，而有些公司則始終未更動其在華據點的組織型態（像美孚和英美煙等跨國大企業）？一些更細緻的因素迄今仍是不明的。顯然這些跨國公司精打細算後會從中選擇對其最有利的方案，以及股權轉移所牽涉的複雜問題讓不同企業有不同的考量 $^{65}$ 。至少可以解釋的是對華貿易法案的一再修正，不論對美國中小企業或大企業都提供了更有利的配套選擇。"}, {"type": "text", "text": "從19世紀末美國提出「門戶開放政策」到一次戰後美國擬訂《對華貿易法案》的1920年代初期，或許也是美國政府和私人企業對華政策合作的高峰期，此後美國政府和私人企業的關係充滿更多的內外張力和國際動盪的變因，而難以一概而論。19世紀末到一次大戰後的1920年代，美國大企業快速向海外擴張，他們秉持自由貿易的傳統信念——加以自19世紀末以來美國政府採取的金元外交為之後盾，這是美國大企業得以成功拓展海外事業的重要因素。1929年美國爆發史無前例的經濟大恐慌，使得美國政府高舉關稅壁壘政策以保護國內市場，並採行強力干預自由市場，以解決燃眉之急。然而，多數美國大企業在大蕭條時期反對政府的過度干預，他們和美國政府間的關係變得異常複雜。在1930年以前，美國政府政策和私人企業的目標常是平行發展的，但是在1930年代美國大型財團對市場國際化的想像更加茁壯，他們主張自由市場的開放，與美國政府的鎖綁政策愈來愈不相同。儘管大企業仍試圖通過院外集團來影響美國政府的決策，政府亦試圖通過私人關係影響大企業的決定，但整體而言，從大蕭條時代到二戰以前，美國政府和大財團的利益愈來愈少互惠，大財團未必配合美國政府的政策 $^{66}$ 。"}, {"type": "text", "text": "62 詳見美國商務部國際貿易局網站：http://www.ita.doc.gov/ooms/ChinaTradeAct RCS.pdf（2015/01/10下載）。"}, {"type": "text", "text": "64 同樣是電力公司，滬西公司為《對華貿易法案》公司，而上海電力公司則不是。經蜜拉·威爾金斯教授告知，上海電力公司隸屬於「美國及海外電力公司」（American & Foreign Power Co.）這家跨國大企業在華投資，而她在American & Foreign Power Co., Annual Reports 1934材料中，又發現滬西電力公司有來自美商上海電力公司的主要資本，筆者不敢掠人之美；在此感謝蜜拉·威爾金斯教授提供的一些《美國對華貿易法案》的寶貴意見。"}, {"type": "text", "text": "63 Mira Wilkins, “The Impact of American Multinational Enterprise on American-Chinese Economic Relations,” 1786-1949. in Ernest R. May & John K. Fairbank eds., America’s China Trade in Historical Respective, the Chinese and American Performance (Cambridge, Mass.: Harvard University Press, 1986), pp. 289-292，在這份1928年美國商會所錄的上海企業代表68個名單，不包含在中國具有直接投資（direct investments）類型的公司統計，例如：通用（General Mortors）、班達公司（Bordon Co.）和上海電力公司（Shanghai Powers）等等。"}, {"type": "text", "text": "65 自1922年頒布後，有些美商依據此一法案而改組或轉為《美國對華貿易法案》的聯邦有限股份公司，但有些公司則未必採用這一法案對他們的優勢，其間牽涉的美國跨國企業在華分公司或專門對華貿易而成立中小型企業的個別問題或共同因素，仍是本文力有未逮之處，只能留待後續研究。"}, {"type": "text", "text": "小結"}, {"type": "text", "text": "一次大戰爆發之初，由於歐洲大國捲入戰事無暇顧及遠東，而使中立的美國得以盤整其海外市場及遠東市場的布局。其中，中國市場的需求和條件無疑吸引美國資本家的目光。在此一契機中，中美兩國的企業主、商人及其利益團體所形成的關係網匯集交融成一股巨大的能量。他們視歐戰的爆發為開拓中國與美國海外市場接軌之契機，企圖通過中美長遠的友好關係，促使彼此互利受惠，使美國大企業得以進駐中國，到中國投資。中國方面，則又期盼引進美國方面的資金和技術轉移，提振中國的工業化，並藉此打造現代中國工業化的夢想。此一中美經濟交往的關係網，共同造就一戰以後中美進出口貿易、美國在華投資、西方技術引進、美國政府對華經濟活動的盛況，並成為此後中美經濟關係發展的一個轉捩點。"}, {"type": "text", "text": "66 Emily S. Rosenberg, Spreading the American Dream, American Economic and Cultural Expansion, 1890-1945 (New York: Hill and Wang, 1982), pp. 166-167."}, {"type": "note", "text": "2 Michael Hunt, The Making of a Special Relationship: The United States and China to 1914 (New York: Columbia University Press, 1983). 該書以具體案例闡釋一戰以前中美交互作用下所形成的特殊關係，主線有兩個：第一、美國政治人物（外交官）、商人、傳教士和公眾群體對於美國決策的影響。對華門戶開放政策是這些群體的共同信念；第二、中國決策者對美國的政治主張和外交策略。中國朝廷大員李鴻章、張之洞等人，對中美合作戰略興致勃勃，提出聯美制英的手段。"}, {"type": "note", "text": "1 關於美國「廣益投資公司」在華活動，可參見吳翎君，《美國大企業與近代中國的國際化》（台北：聯經出版公司，2012），第4章〈國際大財團投資案——廣益公司與1,500英里鐵路計畫〉，頁143-178。"}, {"type": "note", "text": "3 Peter Schran, “The Minor Significance of Commercial Relations between the United States and China, 1850-1931,” in Ernest R. May & John K. Fairbank, eds., America’s China Trade in Historical Respective, the Chinese and American Performance (Cambridge, Mass.: Harvard University Press, 1986), pp. 239-240."}, {"type": "note", "text": "4 表4-1之數據，詳見附錄：4-1。需說明的是表格中1905年美貨輸華暴增的現象，係因受到1903-1904年中國民間發動的反美華工禁約運動的回彈；在這二年美貨輸華儘管下降，但是積存的訂單貨號在反美風潮降溫後陸續抵達中國，反而造成1905年美國輸華貨品激增的現象。"}, {"type": "note", "text": "5 國史館重印，《中華民國海關華洋貿易總冊》（台北：國史館史料處，"}, {"type": "note", "text": "1982），民國4年（1915），第1卷，頁12。「本年貿易情形，雖因日本要求條"}, {"type": "note", "text": "件（指21條要求），恐與大局有關，商家不敢放膽交易，復因創議變更國"}, {"type": "note", "text": "體，又恐惹動風潮。有此兩層，則與商務一道，誠有阻礙，但牽及之甚，則"}, {"type": "note", "text": "在歐戰，如無歐戰，運貨船隻連翩而至。水腳運價並不過昂，則本年進口洋貨逆料必能異常發達。」"}, {"type": "note", "text": "6 國史館重印，《中華民國海關華洋貿易總冊》，民國7年（1918），頁19。"}, {"type": "note", "text": "7 王垂芳主編，《洋商史，1894-1956》（上海：上海社會科學出版社，2007），頁111。"}, {"type": "note", "text": "8 吳翎君，《美孚石油公司在中國，1870-1933》（台北：稻鄉出版社，2001），第1章〈市場經營與銷售〉，頁1-59。"}, {"type": "note", "text": "9 Christopher Bo Bramsen（白慕申），Open Doors, Vilhelm Meyer and the Establishment of General Electric in China (Richmond, Surrey: Curzon Press, 2001), pp. 95-107. 作者白慕申為慎昌洋行創辦人馬易爾的外孫，曾任丹麥駐中華人民共和國大使（1995-2001）、丹麥駐西班牙大使（2001-2004）。"}, {"type": "note", "text": "10 1890年代，英、美煙草即進入中國市場，其中美國煙草大王杜克（James B. Duke, 1856-1925）和英國的帝國煙草公司（Imperial Tobacco Company）兩方競爭激烈，最後於1902年合併創建英美煙公司。上海社會科學院經濟研究所編，〈前言〉，《英美煙公司在華企業資料匯編》（北京：中華書局，1983）第1冊，頁3；Sherman Cochran, Big Business in China: Sino-Foreign Rivalry in the Cigarette Industry, 1890-1930 (Cambridge, Mass.: Harvard University Press, 1980), p. 13."}, {"type": "note", "text": "12 Mira Wilkins, “The Impact of American Multinational Enterprise on American-Chinese Economic Relations, 1786-1949,” in Ernest R. May & John K. Fairbank eds., America’s China Trade in Historical Respective: the Chinese and American Performance (Cambridge, Mass.: Harvard University Press, 1986), pp. 285-287."}, {"type": "note", "text": "11 周新，〈23年度我國之對外貿易〉，《東方雜誌》，第32卷第12號（1935年12月），頁15。"}, {"type": "note", "text": "13 唐力行，《商人與中國近世社會》（台北：臺灣商務印書館，1997），頁304。"}, {"type": "note", "text": "14 丁日初，《上海近代經濟史》（上海：上海人民出版社，1994）第2卷，頁104、123。關於劉鴻生的最新研究，可參見：Sherman Cochran & Andrew Hsieh, The Lius of Shanghai (Cambridge, Mass.: Harvard University Press, 2013)."}, {"type": "note", "text": "15 白吉爾，《中國資產階級的黃金時代》（上海：上海人民出版社，1994），頁75-80。"}, {"type": "note", "text": "17 穆藕初於1909年赴美留學，1913年取得伊利諾大學（University of Illinois）農學學士學位。其後入德州農業與機械學院學習紡織工業，1914年獲碩士學位；參見“Mu Hsiang-yueh,” in Howard L. Boorman eds., Biographical Dictionary of Republican China (New York: Columbia University Press, 1967-1979), Vol. 3, pp. 38-40。穆藕初將泰勒書名譯為《學理的管理法》，於1915年11月至1916年3月於《中華實業界》連載，1916年6月由上海中華書局刊行；參見穆家修等編，《穆藕初先生年譜（1876-1943）》（上海：上海古籍出版社，2006），頁62-63、84-85。"}, {"type": "note", "text": "16 國史館重印，《中華民國海關華洋貿易總冊》，民國5年（1916），第1卷，頁"}, {"type": "note", "text": "18 穆家修等編，《穆藕初先生年譜（1876-1943）》，頁59-62、64、196。1920年美國議院團來訪時，亦曾參觀厚生紗廠。"}, {"type": "note", "text": "19 穆藕初，〈報告美棉遷地之效驗〉，收入穆湘玥著，《藕初五十自述（下）》，《中國現代自傳叢書》（台北：龍文出版社，1989，為據商務印書館1926年版印行），第1輯第10冊，頁46-49。"}, {"type": "note", "text": "20 穆家修等編，《穆藕初先生年譜（1876-1943）》，頁106、111。"}, {"type": "note", "text": "21 A. R. Burt, J. B. Powell and Carl Crow eds., Biographies of Prominent Chinese (Shanghai: Biographical Publishing Company Inc., 1925), p. 66; 穆家修等編，《穆藕初先生年譜（1876-1943）》，頁106-111、147、154。"}, {"type": "note", "text": "22 據江紹貞，〈聶雲台〉，收入中國科學院近代史研究所中華民國史組編，《中華民國史資料叢稿：人物傳記（徵求意見稿）》（北京：中華書局，1976），第3輯，頁110-115，「聶雲台是聶緝機的第三子，少年時隨父住上海，跟外國人學英語，兼學土木、電氣、化學等科。後來到美國去留學，加入過留美學生組織的「大衛與約那甬」（David and Jonathan）的兄弟會組織。」雖然該書1980年出版之版本已無赴美留學及加入兄弟會之語，但其曾跟隨外人學習，且英文流利則為確認。另可參見江紹貞，〈聶雲台〉，收入李新、孫思白主編，《中華民國史資料叢稿：民國人物傳》（北京：中華書局，1980），第2卷，頁249-255；聶雲台於1904年在上海組建復泰公司，承包華盛紡織總局。"}, {"type": "note", "text": "1909年收購華盛全部股份，改名恆豐紡織新局，親任總經理。"}, {"type": "note", "text": "23 Mou H. Y., “Commerce and Industry,” in American University Men in China (Shanghai: The Comacrib Press, 1936), pp. 119-120. 唐炳源於 1947 年遷居香港，翌年創立南海紗廠，有「紡織大王」之稱。"}, {"type": "note", "text": "24 Julean Arnold, “Chinese Products of Interest to American,” in Julean Arnold and Various American Consular Officers eds., Commercial Handbook of China, Vol. II (Washington: Government Printing Office, 1919), p. 321."}, {"type": "note", "text": "25 徐鼎新、錢小明，《上海總商會史，1902-1929》（上海：上海社會科學院出版社，1991），頁245。富有改革精神的錢莊經理、上海錢業公會會長秦潤卿（名祖澤，1877-1966）則當選為副會長。拙文此處主要說明的是新興企業家開始投入上海總商會領導層的活動，並占有一席之地。另據李達嘉的研究，1920年上海總商會領導層選舉的競爭，不能僅以新舊派系、浙江幫或非浙江幫等幫派觀點一分為二，還受外在經濟環境競爭、南北政治分裂和軍閥戰爭的影響。上海總商會領導層的選舉受外在勢力影響頗大，不能附會為新舊或幫派之爭。李達嘉，《上海商會領導層更迭問題的再思考》，《中央研究院近代史研究所集刊》，第49期（2005年9月），頁41-92。李達嘉，《商人與共產革命，1919-1927》（台北：中央研究院近代史研究所，2015年7月）。"}, {"type": "note", "text": "26 徐鼎新，《中國近代企業的科技力量與科技效應》（上海：上海社會科學院出版社，1995），頁44-48。從麻省理工學院取得管理碩士學位歸國的唐星海，回國後試圖改革家族企業慶豐紡織廠，同時留美礦冶碩士薛桂倫被延攬至廠擔任電氣工程師，但該廠在企業化革新過程中，遭到內部工頭勢力和家族長老勢力的反對。榮家集團無錫申新三廠大力推行泰勒的科學化管理，總工程師汪孚禮則是留日背景。上海美亞織綢廠為莫觴清獨資創設，其女婿蔡聲白畢業自美國麻省理工大學，蔡主持廠務後，順利廢除工頭制，建立科學管理化管理。被喻為「天才企業家」從事煤炭和火柴企業的劉鴻生，則是將成本"}, {"type": "note", "text": "會計視為實施科學管理的重要環節。科學化管理在1920年代為新興企業所採行，但或多或少都遇到舊勢力的抵制。關於1920年代中國新式企業的研究至為豐富，非本文題旨，最新的相關研究介紹，可參見：卞歷南（Morris Bian），〈西方學界最近四十年對於中國企業史研究的述評〉，《經濟社會史評論》（天津：天津師範大學），2018年第4期，頁104-127。"}, {"type": "note", "text": "27 American University Men in China (Shanghai: The Comacrib Press, 1936), pp. 19-26. 該組織於1930年共有10名終身會員，196名一般會員，其中有97名中國人。1933終身會員大幅增加到76名，會員總數達383名，共有207名中國籍會員。1935年，共有106名終身會員，會員總數396名，其中有204名中國籍會員。工程界的成員描述參見該書，頁90-106。"}, {"type": "note", "text": "28 Emily S. Rosenberg eds., A World Connecting, 1870-1945 (Cambridge, Mass., London, England: The Belknap Press of Harvard University Press, 2012), p. 932. 參見 Report of the Meetings of the International Research Council and of the Affiliated Unions Held at Brussels
