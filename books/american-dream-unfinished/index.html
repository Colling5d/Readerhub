, July 18-28, 1919. 創始國有：比利時、加拿大、法國、不列顛聯合王國、義大利、日本、紐西蘭、波蘭、羅馬尼亞、塞爾維亞、美國等。"}, {"type": "note", "text": "China's internationalization: the case of ‘The Engineering Society of China’, 1901-1941.” in María Dolores Elizalde & Wang Jianlang eds., Chinas Development from a Global Perspective (Newcastle: Cambridge Scholars Publishing, 2017:8), pp. 375-403."}, {"type": "note", "text": "http://www.ncbi.nlm.nih.gov/pmc/articles/PMC1084535/?page=1（2015/01/01點閱）。"}, {"type": "note", "text": "29 詳見：Wu Lin-chun, “Foreign Engineers’ Activities in China and the Process of"}, {"type": "note", "text": "30 據 1922 年的會員名冊，除榮譽會員 10 人，共有一般會員 147 人，美國籍占 87 人，中國籍 60 人。另有準會員（associated member）23 人，美籍占 5 人，中國籍 18 人。1922 年的 10 名榮譽會員中，中美各占 5 名。參見 Journal Association of Chinese and American Engineers, Vol. 5, 1922."}, {"type": "note", "text": "31〈中國游美實業團在美時之紀念攝影〉，《東方雜誌》，第12卷第8號（1915年8月），收入王雲五主持，《重印東方雜誌全部舊刊五十卷》（台北：臺灣商務印書館，1971-1976），頁28957。張振勳經商南洋事業有成，曾有「東南亞首富」之稱。另外重要事蹟有：在煙台創辦張裕葡萄釀酒公司、1890年代初期曾任中國駐新加坡總領事。"}, {"type": "note", "text": "32〈中美商團會議筆記〉，天津市檔案館藏，《天津商會檔》，401206800-J128-2-003100-001。Robert Dollar, Private Diary of Robert Dollar on His Recent Visits to China, Published 1912."}, {"type": "note", "text": "33 詳見吳翎君，《美國大企業與近代中國的國際化》，在這些個案中1913年到任的美國駐華公使芮恩施涉入甚深。此外，1918年6月，北京政府交通部曾與美國西方電氣公司、日本電氣公司議定合辦中華電氣公司，資本額100萬元。參見李玉，《北洋政府時期企業制度結構史論》（北京：社會科學文獻出版社，2011），頁620-621。"}, {"type": "note", "text": "圖4-3：中國游美實業團在美時之紀念攝影"}, {"type": "note", "text": "資料來源：《東方雜誌》，第12卷第8期（1915年8月），台北重印版，頁28957。"}, {"type": "note", "text": "34 張謇，《為組中美實業復芮恩施博士函》（1919），收入張謇研究中心編，《實業》（南京：江蘇古籍出版社，1994），《張謇全集》，第3卷，頁803。赫綏君之英文名不詳。"}, {"type": "note", "text": "35 芮恩施著有使華回憶錄，Paul S. Reinsch, An American Diplomat in China (Garden City/N.Y., Toronto: Doubleday, Page and Company, 1922)."}, {"type": "note", "text": "36 “An American Chamber of Commerce,” The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Jun. 12, 1915. 刊載了正式成立大會之前"}, {"type": "note", "text": "的聚會討論。"}, {"type": "note", "text": "37 Second Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, April, 1918, pp. 17-18."}, {"type": "note", "text": "38 Second Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, April, 1918, pp. 18-21. “Chinese Chamber of Commerce Entertains Americans,” Millard's Review of the Far East (1917-1919); Apr. 20, 1918. 據該報的報導此次聚會時間為4月15日。"}, {"type": "note", "text": "39 Second Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, April, 1918, pp. 1-3, 5."}, {"type": "note", "text": "40 Second Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, April, 1918, p. 11."}, {"type": "note", "text": "41 \"China's effort in Modern Industry,\" Asia: Journal of the American Asiatic Association, Nov., 1918, pp. 963-967."}, {"type": "note", "text": "42 胡光廌，《波逐六十年》（台北：新聞天地社，1967），頁214-220。"}, {"type": "note", "text": "43〈總商會歡迎美實業家紀盛〉，《申報》（上海），1916年6月17日，第3張。關於1917年羅司實業團訪華，可詳見賈中福，《中美商人團體與近代國民外交》（北京：中國社會科學出版社，2008），頁95-102。"}, {"type": "note", "text": "44〈組織中美國際商會之函稿〉，《申報》（上海），1917年4月23日，第3張。滬商對於加上「國際」兩字與原案未甚符合，冀再提全國商會討論；參見〈滬商會對於組織中美國際商會聯合國之意見〉，《申報》（上海），1917年5月17日，第3張。"}, {"type": "note", "text": "45〈組織協約國商會之主義〉，《申報》（上海），1918年9月29日，第3張。據該報之引述：「此議首倡為英國某著名銀行家，美人商會即援其義，首先向中國商會之代表作公共之討論，中國商會極以為然，而其他商人團體之代表，亦表贊同」；〈組織協約國聯合商會之贊同〉，《申報》（上海），1918年10月7日，第3張。"}, {"type": "note", "text": "46 辛丑和約（1901）之附件中達成設置「上海浚浦局」之專責機構，並訂有關營運、組織、經費之相關章程。但由於該局委員雖包含上海道台，但仍以洋人居多，而疏浚經費究係由中外各半，亦頗多爭論。光緒31年（1905年）又有「改訂修治黃浦河道條款」，確定成立浚浦機構，由江海關道（上海道台兼任）和英籍海關稅務司組建浚浦工程總局，施工一度順暢，開工數年之後，因經費不足於1911年中止疏浚工作。詳見：森田明著，鄭樑生譯，《清末民初的江南三角洲水利與帝國主義統制——上海「浚浦局」之設置》，《清代水利社會史研究》（台北：國立編譯館），頁249-278。"}, {"type": "note", "text": "48〈西人振興上海口岸計畫〉，《申報》，1919年3月27日，第3張。"}, {"type": "note", "text": "47《申報》，1919年3月27日，第3張。即有二文提到上海疏浚工程。一篇為〈萬國商會歐戰後大會記〉。一篇為〈西人振興上海口岸計畫〉。前者提到〈萬國商會該議期中所擬版法有（一）在口外神灘開挖峽道深至最低潮流時40英尺為度；（二）在黃埔築壩；（三）在吳淞設立船塢三層。大眾意見黃埔築壩似不可行，因上海溝渠排泄與飲水接濟及航行需要皆將大受影響。吳淞設塢有鐵路直通上海一層乃可行之辦法，但挖深神灘一層須先經極有經驗之專家從事研究，俟得其意見，然後始能討論此經費甚鉅之計畫也。"}, {"type": "note", "text": "49 關於美國商船在中國長江口岸的活動，詳見：David H. Grover, American Merchant Ships on the Yangtze, 1920-1941 (Praeger Publishers: Westport, 1992), pp. 63-85."}, {"type": "note", "text": "50 “Whangpoo Conservancy Board: Reports of the Consulting Engineers,” Edwin S. Cunningham to the Secretary of States, Oct. 20, 1922. United States National Archives (Microfilms) Washington D. C., Records of Department of State Relating to Internal Affairs of China, 1910-1929. (本書簡稱NA) 893.811/476."}, {"type": "note", "text": "51 Journal Association of Chinese and American Engineers, April and May, 1922, p. 2."}, {"type": "note", "text": "52 美國國務院所收錄海德生的上海港改善計畫及報告書詳見：“Whangpoo Conservancy Board”, Edwin S. Cunningham to the Secretary of States, May 16, 1923, NA, 893.811/526. 正文有81頁，另有附錄。"}, {"type": "note", "text": "53 \"Some Of The Activities of the American Asiatic Association Since Its Organization,\" The American Asiatic Association, Printed for the Annual Meeting, Oct. 21, 1937, New York, 1937, p. 7."}, {"type": "note", "text": "54 Julean Arnold and Various American Consular Officers, Commercial Handbook of China, Vol. I, II (Washington: Government Printing Office, 1919)."}, {"type": "note", "text": "55 China Trade Act, 1922: With regulations and forms. Trade Information Bulletin, No. 74.《1922年對華貿易法案》內容也牽涉股本和稅制的複雜計算，本文僅列其最主要內容和精神。此外，英國政府曾於1915年針對在華從事貿易的英國公司予以減稅優惠，美國的1922年《對華貿易法案》亦採用相似減稅措施。"}, {"type": "note", "text": "(1922-1923); Jan. 20, 1923. 戴爾係聖路易州（St. Louis）選區的眾議員代表，曾在1920年首次訪華，頗知曉中國市場對美國的吸引力，催促《對華貿易法案》。《對華法案》通過後，戴爾在1922年12月到馬尼拉訪問，途經上海停留數小時，次年1月返美途中又停留上海聽取美商對貿易法案的意見。“Congressman Dyer Returns to Study Conditions in China,” The Weekly Review (1922-1923), Dec. 23, 1922."}, {"type": "note", "text": "56 China Trade Act, 1922: With regulations and forms. No. 74 by United States. Bureau of Foreign and Domestic Commerce. Published in 1922."}, {"type": "note", "text": "59 J. B. Powell to Frank Rhea, Dec. 21, 1922. China Trade Act General Record, 1922-49, box 10. Foreign Service Posts of Department of State, Shanghai Consulate General, Commercial Section. United States National Archives, Washington D. C."}, {"type": "note", "text": "57 Julean Arnold, “Chinese Products of Interest to American,” in Julean Arnold eds., Commercial Handbook of China, Vol. II, p. 274. 如附錄4-1，一次大戰結束後的1919年，美貨輸華價值超過於大戰時期，輸華價值110,236,706海關兩，1921年又增為175,789,652海關兩。"}, {"type": "note", "text": "60 “Congressman Dyer Returns to Study Conditions in China,” The Weekly Review (1922-1923), Dec. 23, 1922."}, {"type": "note", "text": "58 \"Congressman Dyer Pledges Support to U.S. China Trade,\" The Weekly Review"}, {"type": "note", "text": "61〈雜纂：建議修正美國對華貿易法〉，《銀行週報》，1924年（第8卷第12期），頁31-33。文中亦提到在華之美國關係人，還提議修改該法案中有關組織輪船公司之股東限制。"}, {"type": "note", "text": "62 詳見美國商務部國際貿易局網站：http://www.ita.doc.gov/ooms/ChinaTradeAct RCS.pdf（2015/01/10下載）。"}, {"type": "note", "text": "64 同樣是電力公司，滬西公司為《對華貿易法案》公司，而上海電力公司則不是。經蜜拉·威爾金斯教授告知，上海電力公司隸屬於「美國及海外電力公司」（American & Foreign Power Co.）這家跨國大企業在華投資，而她在American & Foreign Power Co., Annual Reports 1934材料中，又發現滬西電力公司有來自美商上海電力公司的主要資本，筆者不敢掠人之美；在此感謝蜜拉·威爾金斯教授提供的一些《美國對華貿易法案》的寶貴意見。"}, {"type": "note", "text": "63 Mira Wilkins, “The Impact of American Multinational Enterprise on American-Chinese Economic Relations,” 1786-1949. in Ernest R. May & John K. Fairbank eds., America’s China Trade in Historical Respective, the Chinese and American Performance (Cambridge, Mass.: Harvard University Press, 1986), pp. 289-292，在這份1928年美國商會所錄的上海企業代表68個名單，不包含在中國具有直接投資（direct investments）類型的公司統計，例如：通用（General Mortors）、班達公司（Bordon Co.）和上海電力公司（Shanghai Powers）等等。"}, {"type": "note", "text": "65 自1922年頒布後，有些美商依據此一法案而改組或轉為《美國對華貿易法案》的聯邦有限股份公司，但有些公司則未必採用這一法案對他們的優勢，其間牽涉的美國跨國企業在華分公司或專門對華貿易而成立中小型企業的個別問題或共同因素，仍是本文力有未逮之處，只能留待後續研究。"}, {"type": "note", "text": "66 Emily S. Rosenberg, Spreading the American Dream, American Economic and Cultural Expansion, 1890-1945 (New York: Hill and Wang, 1982), pp. 166-167."}]}, {"id": "ch5", "title": "第五章 · 在華商人團體的成立與轉型", "paras": [{"type": "title", "text": "本章所探討的歐戰爆發後中美經濟交往的關係網，是一段中美共享與合作的歷史，中美之間由上而下、由下而上，呈現一種互動且多元的特殊網絡。在中國方面，中國必須迎向世界的主張，不惟在知識文化界，在一部分具有新思想的商人、企業組織和引介西方技術和知識體系的工程師團體中亦感同身受。泰勒的科學管理新方法、工廠管理和效率、棉紡機器技術和農田實驗等技術改良方法被大大引介到中國來，成就中國擺脫貧困農業社會的主張和行動；各種新興企業和技術網絡欣欣向榮，並與新知識文化的百花齊放同聲共息，共同成為一戰後中國的新圖像。美國政府和民間不同群體的共同合作更占關鍵，美國政府在對華貿易上扮演了「看得見的手」（visible hands）的綿密操作，由第一線的美國駐華使領和商務參贊為先鋒，深入調查中國口岸商情，為美國政府獻計謀略；商人團體則要求政府擬定具體實惠的法案鼓勵美商對華投資。另一方面，美國本土的商人組織和技術專家越過太平洋，將美國本土實施的現代化商會組織和工程師協會運作模式轉移至中國，並形成一個多元活絡的關係網。一戰之後中美商人和工程師群體在中國所開展的本土活動和外延的國際網絡，具體內容我們將於以下兩章詳加分析。"}, {"type": "text", "text": "第五章"}, {"type": "text", "text": "在華商人團體的成立與轉型 「美國亞洲協會」與「中國美國商會」"}, {"type": "text", "text": "東方市場帶給美國人異國想像，美國應以貿易開發亞洲，扮演拯救「貧窮東方」的要角。"}, {"type": "text", "text": "——美國亞洲協會期刊，1914年12月號"}, {"type": "text", "text": "中國正萌發出一種「國族精神」，富有理想，愛好和平，勤快積極，相信數年之間中國可望成為有組織的政府。"}, {"type": "text", "text": "——美國駐華商務代辦阿諾德，1916"}, {"type": "text", "text": "前言"}, {"type": "text", "text": "一戰爆發之後，美國最初未參戰，為大力拓展中國市場並凝聚美商在華的向心力，一個專屬中國市場的商人組織「中國美國商會」於1915年誕生 $^{1}$ 。在此之前美國在華最早的商人團體為1898年6月成立於紐約總部的「美國亞洲協會」（American Asiatic Association），它在上海設有分會，成立之初是美國門戶開放策背後的最大推力。1915年「中國美國商會」的成立代表美國在華商業發展的一個轉折點——一個更精準表述美商利益團體的誕生，其影響力迅速壯大。由於「美國亞洲協會」和「中國美國商會」的活動頗多重疊，1926年這兩個組織進行合併。「美國亞洲協會」在1920年代以後的功能則愈來愈走向文化事業活動，以贊助美國和遠東國家的教育文化交流，致力亞洲區域的和平理解為目標導向。太平洋戰爭爆發後，美國在華商務活動受到嚴重打擊，「中國美國商會」和「美國亞洲協會」的在華活動始形同停頓。"}, {"type": "text", "text": "一戰以前，就美國整體對外經濟關係而言，在華利益確實不大，但是正因為如此，商人利益往往是政府政策的馬前卒。地廣人多的中國，予美國人擴張對華貿易的美好想像，為打造另一種非正式帝國（informal empire）的遠景，跨海而來。成立於1898年的「亞洲協會」便是在這種背景下所成立的商人團體，其動向反應美商在華利益、經濟擴張與美國政府對華政策之間的互動關連。早期研究這一段美中關係的學者，不少強調19世紀末以後美國的經濟擴張和金元外交是美國成為世界霸主的重要動力和手段，認為美國外交完全以經濟利益的擴張為依歸，並受到大資本家的左右 $^{2}$ 。但這些研究的視角多是以美國中心為出發點，而關於美國商人團體在中國的活動及其演變，迄今則尚未有完整的研究 $^{3}$ 。"}, {"type": "text", "text": "本章主要分析一次大戰以後「中國美國商會」與「美國亞洲協會」這兩個商人團體在中國的活動、跨越1930年代中國參加國際商會組織的橫向聯結、中美貿易委員會的成立，以及1920年代以後「美國亞洲協會」的文化轉型，藉此探討美國在華商人團體的演變及其文化轉型對近代中美關係的意義。為清楚理解「美國亞洲協會」創建性質及其轉型，首先有必要先探究其早期創建的歷史，以接續它和「中國美國商會」的關係。"}, {"type": "text", "text": "一、美國在東亞最早的商人團體——美國亞洲協會"}, {"type": "text", "text": "（一）成立背景與早期發展"}, {"type": "text", "text": "1890年代以後，由於美國對華通商貿易的逐步增加，一個以促進美國在華利益的商業團體——「美國在華利益委員會」（Committee on American Interest in China）於1898年1月6日成立，意在促使美國政府對中國的商業利益採取更積極的政策 $^{4}$ 。數月後，擴大改組為「美國亞洲協會」。此一組織創立之際美國同時面對兩個議題，一方是列強瓜分中國，另一方則是美西戰爭對美國西太平洋政策的衝擊。其設置淵源如下："}, {"type": "text", "text": "2 像1960年代Thomas J. McCormick的代表論著，即是從經濟觀點論述美國在中國市場打造的非正式帝國。Thomas J. McCormick, China Market, America's Quest for Informal Empire, 1893-1901 (Chicago: Elephant Paperbacks, Ivan R. Dee, Publisher, 1967), pp. 77-103."}, {"type": "text", "text": "1 關於美國商會在中國的組織，成立之時稱 “American Chamber of Commerce of China”，但目前其官網則用 “American Chamber of Commerce in China”. 本文仍使用成立時的英文名稱 “OF” China。「中國美國商會」則為現在此一組織官網的中文名稱，特此說明。“American Chamber of Commerce of China: Its Inauguration in Shanghai,” Peking Daily News (1914-1917), Aug. 24, 1915."}, {"type": "text", "text": "3 勞羅斯（James John Lorence）的博士論文雖探討「美國亞洲協會」，但該文為1970年之作，且未使用中文材料，也未能討論1926年以後美國在華商會的發展。James John Lorence, “The American Asiatic Association, 1898-1925: Organized Business and the Myth of the China Market,” Ph. D. dissertation, University of Wisconsin, 1970."}, {"type": "text", "text": "1897年底德國占領膠州後，美國對華投資的最大財團——美華合興公司（American China Development Company）的法律顧問凱瑞（Clarence Cary）投書《紐約晚報》（New York Evening Post）表示對美國在華貿易和條約權利的擔憂，希望美國不分黨派應努力保護美國在華的權益 $^{5}$ 。凱瑞的主張和紐約《商業時報》（Journal of Commerce）特約編輯富爾德（John Foord）的想法不謀而合。富爾德長期關注美國在遠東的商業利益，他和凱瑞呼籲美國各個商會應聯合起來成立一個針對遠東貿易的專屬商人組織。由於時值美國為了古巴問題與西班牙陷入緊張關係（到了1898年4月美西戰爭開打），許多美國商會對美西戰爭的態勢表示觀望，以免影響直接貿易輸出最重要的拉丁美洲市場，因此也對太平洋彼岸的中國問題表示緘默。最初波士頓商會、巴爾的摩商會、舊金山商會、費城商會均反應冷淡，只有克里夫蘭商會表示友好；但也有人持論美西戰爭不僅能使美國獲得政治與商業的龐大利益，甚至是通往大清帝國之路的一次難得機會，例如弗瑞澤公司（Frazar & Company）的創辦人弗瑞澤（Everett Frazar, 1864-1901）。列強在中國變本加厲的勢力範圍瓜分行動，引起對華貿易商人的強烈不安。1898年1月，美國在華最具代表的企業——美孚公司的麥克吉（James McGee）主持下，富爾德、凱瑞、弗瑞澤、布魯斯特（Samual D. Brewster，旗下公司為Derring, Milliken & Company）和貝里咸鋼鐵公司（Bethlehem Iron Company）代表季林斯基（E. L. Zalinski），一同聚在華爾街凱瑞的辦公室，這五人小組策劃成立一個以中國市場為擴張重心的遠東商會組織。6月9日「美國亞洲協會」正式成立，首任主席為弗瑞澤，副主席為布魯斯特，財務長派特生（Joseph R. Patterson），祕書富爾德。1889年10月11日，「美國亞洲協會」在紐約召開第一屆年會，當時即將落幕的美西戰爭和平議定書中該如何處置菲律賓群島問題自是最受關注，該協會主張美國政府應全面介入，直到菲島人民能建立穩定的政權，並足以抵抗外來侵略者為止。該年會以正式決議文將他們的堅定主張送交美國白宮和國務院，由此可見該組織創設之初的高度政治化 $^{6}$ 。「美國亞洲協會」的成立時間係在美西戰爭和美國提出門戶開放政策之際，不僅有美商進軍中國市場的企圖，充滿美國對列強在華勢力範圍的擔憂，另也有以美西戰爭為跳板進攻中國市場的策略主張。"}, {"type": "text", "text": "4 據中國海關統計資料，1890年美國在華行號約32家，僑民約1,153人；1895年行號為31家，僑民增加到1,325人；1898年行號約43家，僑民突破2,000人（2,056人）。1899年第一次宣告對華門戶開放政策時，行號達70間，僑民2,335人。1900年儘管發生義和團排外事件，美國在華行號仍增加到81間，僑民則略減為1,908人，顯現一些美國僑民因義和團事件而撤離中國。該年在列強劃分中國勢力範圍之際，美國再度發布了第二次門戶開放政策。1901年八國聯軍之後清廷簽訂辛丑條約，這一年美國在華行號增加到99間，僑民增為2,292人。楊端六、侯厚培等，《六十五年來中國國際貿易統計》（國立中央研究院社會科學研究所專刊第4號，1931），頁143。 5 美華合興公司成立於1895年12月，由美國前俄亥俄州（Ohio）參議員布賴士（Calvin S. Brice）號召美國工商界人士，以獲取在中國建造鐵路、開礦和其他工業投資為目標所創立；成立時的股東包括鐵路界和金融界的大亨，如鐵路大王哈里曼（Edward H. Harriman）、花旗銀行和大通銀行的行長、美國前副總統莫頓（Levi Morton）、摩根公司（J. P. Morgan & Company）的一個合夥人及卡內基鋼鐵公司（Carnegie Steel Corporation）等。William R. Braisted, “The United States and the American China Development Company,” The Far Eastern Quarterly, Vol. 11, No. 2 (Feb., 1952), pp. 147-165."}, {"type": "text", "text": "「美國亞洲協會」成立之初，約有68個企業團體，成員多為以紐約為基地的出口商，至1900年快速成長到100名企業會員。總部設於紐約，並於上海、香港和日本橫濱等地設立分會，後擴及馬尼拉和新加坡等地。其中上海分會於1898年創設之初設置，顯現上海在亞洲經貿網絡和對美商的重要性，次年日本橫濱分會成立（下設神戶支部）7。前述提到的美華合興公司（中文稱華美興公司）曾於1898年獲得粵漢鐵路的築路權，其後該公司將大部分股權讓給比利時資本，惟此舉違約，清政府遂於1905年將築路權收回，而該公司更早在1896年向俄國提出合作投資東北鐵路，亦遭到拒絕8。由於美華合興公司在中國開發鐵路事業的受挫，讓美國資本家認為這是由於美國在中國沒有勢力範圍，以致美國資本在中國的競爭中處於不利的地位。美華合興公司的大資本家即是美國商會的活躍分子，大企業主和協會組織彼此互相串聯，由他們本身實際的遭遇困境，要求各國在中國享有同等的貿易投資權利，因此，「美國亞洲協會」成為美國對華門戶開放政策的主要推手。根據中國海關資料，也就是在1898年，美貨輸華價值首度超過華貨輸美，顯示美國對華出口貿易逐漸重要。（附錄表4-1）"}, {"type": "text", "text": "1898年7月25日，「美國亞洲協會」發行機關報——《美國亞洲協會期刊》（Journal of the American Asiatic Association），由協會祕書富爾德擔任刊物主編和發行人。富爾德掌管實際會務活動、傳達商會的主體立場和內外溝通，是該協會的靈魂人物。創刊號中富爾德以主編身分開宗明義，揭橥發行機關報的主旨係使「亞洲協會」會員得以交流遠東商業活動的訊息，隨著協會的擴充壯大，對東方事務的聯繫勢必更加緊密，而機關報刊的影響力就更重要 $^{9}$ 。《美國亞洲協會期刊》載有美國進出口概況、會務紀錄、遠東各國的商情、貿易政策的評論和主張，這一商人團體的機關報從創刊之初即和美國遠東政策互相推擁，具體反映商人團體的政治利益，迪奧多·羅斯福（Theodore Roosevelt, 1858-1919）總統的對華外交深受此一商人團體的左右 $^{10}$ 。"}, {"type": "text", "text": "該協會創立之初頗強調英美兩國對華政策立場的一致性，富爾德甚至致電英商「中國協會」（China Association）上海分會祕書布蘭德（J. O. P. Bland）表示「美國亞洲協會」將配合英美對華政策的共通利益 $^{11}$ 。「中國協會」於1889年3月在倫敦成立，主要由對中國、香港和日本貿易的英國商人為了向其政府遊說而組成的利益團體，成立時間比美國在華商會早了十年 $^{12}$ 。當時英商「中國協會」年會報告提到與「美國亞洲協會」在促進對華貿易上有廣泛共同的利益，特別是對上海公共租界的拓展，兩者將保持密切友善 $^{13}$ 。上海英文報刊《字林西報》興奮地報導「美國亞洲協會」的成立，稱英商「中國協會」誠懇歡迎這位新姊妹的到來，兩個組織將齊心協力促進對華門戶開放政策 $^{14}$ 。當時英美商人在對華門戶開政策的立場上是聯合一致的，英國既已在華市場占有先進優勢，在德、法、日等國紛紛瓜分中國勢力範圍的情勢之下，英國在華商人並不反對門戶開放政策，只是門戶開放的主張後來由美國政府順水推舟而壯大聲勢，此後再成為美國對華政策的指導原則。"}, {"type": "text", "text": "9 Journal of the American Asiatic Association, July 25, 1898, pp. 1-2."}, {"type": "text", "text": "10 David M. Pletcher, The Diplomacy of Involvement: American Economic Expansion Across the Pacific, 1784-1900 (Columbia: University of Missouri Press, 2001), pp. 295-299."}, {"type": "text", "text": "6 The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Dec. 5, 1898."}, {"type": "text", "text": "7 James John Lorence, \"The American Asiatic Association, 1898-1925: Organized Business and the Myth of the China Market,\" pp. 34-38."}, {"type": "text", "text": "8 李恩涵，《中美收回粵漢路權交涉》，《中央研究院近史所集刊》，第1期（1969），頁149-215。"}, {"type": "text", "text": "11 布蘭德時任上海公共租界工部局助理祕書。布蘭德（J. O. P. [John Otway Percy] Bland）為英國作家和記者，於1883-1910旅居中國。1883年抵華任職海關，從漢口、廣州到北京總海關，1894-96擔任赫德私人祕書。1896年起任上海公共租界工部局助理祕書，同時擔任《泰晤士報》通訊員。1906年任職於「中英公司」（British and Chinese Corporation, BCC）北京辦事處代表。1910年因其反德言論與該公司政策不符而遭解僱。據說他到北京後，因其通"}, {"type": "text", "text": "19、20世紀之交，美國商會在對華關係的作用，亦為中國朝野所知。例如1902年1月美國聖路易斯（Saint Louis）籌備兩年後舉辦的萬國賽會以紀念美國購買路易斯安那州的百年大會活動，清外務部檔案收有這份邀請函，期望中國「政府與民間最貴重之物攜來赴會，藉此益證兩國和好彌敦也」 $^{15}$ 。在此之前，儘管清政府曾有派員參加1893年芝加哥萬國賽奇會和1898年美國費城萬國通商賽會的盛事，但在聖路易斯博覽會，不僅由貝子溥倫率領清特使團參會，並首次出現兩家官民合資專為參展而設立的公司，清廷更提撥75萬兩的巨款，供辦參展所需。在當時清政府財政困難的狀況，呈現中美兩國在經貿外交和文化交流上的重大意義 $^{16}$ 。維新派領袖梁啟超在1903年赴美洲新大陸遊歷時，在紐約旅行二個月，作為政治名人的梁啟超曾受邀參加美國亞洲協會晚宴，在這次聚會中，共有美國人23位，日本人2位，華人（包括梁氏本人）6位。梁氏稱亞洲協會為「亞細亞協會」——「此會之目的，全在生計上，於政治上毫無關係。然東方知名之人至者，必饗宴焉，前公使伍（指伍廷芳），現公使梁（指駐美公使梁誠）皆嘗到（會）演說」。對於該次會議場景的描述如下：「席間總幹事赫欽士先起演說，極言美國無利中國土地之意，惟願保和平與商務，余亦照例述感謝之詞，並言中國若不得良政府，則世界之平和終不可望」 $^{17}$ 。梁啟超筆下的「亞洲協會」呈現政商雲集，清公使看重其政商關係亦頗多聯絡。然而，梁氏本人對美國政府宣稱的門戶開放政策為一種對華的保全政策，則殊無好感，稱此一政策將導致中國淪為外國殖民地的「滅國新法」 $^{18}$ 。而此時的亞洲協會正是大力支持梁啟超所反對的門戶開放政策。"}, {"type": "text", "text": "曉漢語，而著名的莫里遜因不通中文，視其為競爭對手，最後使得布蘭德又被《泰晤士報》解僱而返回英國。布蘭德有關中國的著作有：J. O. P. Bland, Houseboat Days in China (1909, 1919)、Verse and Worse (1902) 等，其中最有名的兩本暢銷書應屬 China under the Empress Dowager (1910) 和 Annals and Memoirs of the Court of Peking (1914)."}, {"type": "text", "text": "中央研究院近代史研究所檔案館藏，《外務部檔案》02-20-002-01-009。關於本次博覽會的中國展示，可參閱：王正華，〈呈現「中國」：晚清參與1904年美國聖路易萬國博覽會之研究〉，黃克武主編，《畫中有話：近代中國的視覺表述與文化構圖》（台北：中央研究院近代史研究所，2003），頁421-475。"}, {"type": "text", "text": "12 Journal of the American Asiatic Association, No. 1, July 25, 1898, p. 2."}, {"type": "text", "text": "13 China Association Annual Report, 1898-1899, p. 22."}, {"type": "text", "text": "14 \"The American Asiatic Association,\" The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Aug. 1, 1898, p. 197."}, {"type": "text", "text": "16 趙祐志，〈躍上國際舞台——清季中國參加萬國博覽會之研究，1866-1911〉，《國立臺灣師範大學歷史學報》，第25期（台北：國立臺灣師範大學歷史系所，1997年），頁287-344。據該文研究，從1866年總理衙門首度受邀參加法國巴黎博覽會起，至1911年清朝覆亡為止，在短短的46年期間，共計收到超過80次以上的邀請。其中，清廷組團參加了13次，寄物參展6次，派員參觀11次。而1904年聖路易斯博覽會的經費，為在此之前歷次總和之三倍，其重要性自不待言。"}, {"type": "text", "text": "15〈美國賽會大臣巴蕾致外務部〉，1902年1月14日（光緒27年12月05日），"}, {"type": "text", "text": "17 梁啟超，《新大陸遊記》（台北：文海出版社，1967年版），頁19-20。梁啟超還於次日造訪赫欽士私宅，赫欽士提到義和團排外事件和政治動亂對美國棉"}, {"type": "text", "text": "1903年清廷與外人簽署的第一次純粹以商務談判的商約中，「美國亞洲協會」便扮演了重要角色。早在1901年八國聯軍後的辛丑和約談判之際，美國駐上海領事即主動邀請「美國亞洲協會」上海分會，希望他們表達對關稅稅則的意見書以轉呈美國國務院參考。《中英商約》捷足先登，踵繼其後的《中美商約》談判之際，「美國亞洲協會」上海分部更表示拒絕以英國藍本作為《中美商約》的版本，要求提出美商自己的主張。在反對中國的釐金制度、商標、貨幣、匯率和礦務開採等有利於拓展中國市場的條件中，都向美國政府提出如何通過更具規範的商約來保護美商在華的利益 $^{19}$ 。「美國亞洲協會」曾就裁釐問題邀宴清政府駐美大臣梁誠，梁誠形容：「該會實為東方商務一大重點，外部遇有事件恆向取決，誠當與其在事諸人婉切商磋，得其一言相助，則事機可得八九分。」 $^{20}$ 1905年清政府派端方和戴鴻慈等五大臣率團赴歐美考察，次年抵美國紐約時「美國亞洲協會」於紐約商人俱樂部（Merchant Club）設宴款待 $^{21}$ 。"}, {"type": "text", "text": "就在美國資本家推動對華門戶開放政策之際，在美國本土卻逢1880年代以後愈演愈烈的排華運動，以及美國國會因受到民意選票壓力而通過排華法案。這時的「美國亞洲協會」適巧扮演了抵制和反對過激的排華法案，因為此一法案不僅和美國在門戶開放政策中所顯示對華友善的原則相違背，更是使美商在華利益受到威脅。「美國亞洲協會」和美國在華外交官聯手向迪奧多·羅斯福總統施加壓力，不希望激起中國人民對美國的敵意，以致危及美商在中國的權益。他們希望美國政府修改某些限制中國技術人才的移民法，特別是針對中國商人、學生和專業人才不應設置高門檻予以為難 $^{22}$ 。因美國通過極不友善的排華法案，中國民間於1906年發生一波自發性的反美風潮，富爾德甚至於3月赴華府國會聽證，要求美國政府就有關移民條約和清政府重新議訂 $^{23}$ 。雖然最後結果並沒有改變美國國會通過一系列的排華法案，但可看出亞洲協會強力支持門戶開放政策和其對排華法案採取溫和理性的立場。"}, {"type": "text", "text": "20〈外務部收駐美大使梁誠函〉（光緒29年5月初10），中央研究院近代史研究所編，《中美關係史料·光緒朝五》（台北：中央研究院近代史研究所，1988），頁3542。"}, {"type": "text", "text": "花輸出業造成重大打擊，美國南方業棉花者已倒閉三之一，失業之勞傭數千云云，再次表達美國工業製造業對開闢海外市場的強烈企圖。同時，梁啟超對美國華爾街大托辣斯有所戒心，擔心美國這些美國國內的托辣斯「將演進為國際托辣斯，而受害最劇者必在我中國」。參見：本書緒章。"}, {"type": "text", "text": "18 梁啟超，〈滅國新法論〉，中央研究院近代史研究所編，《近代中國對西方及列強認識資料彙編》第五輯，第一分冊，第574-575頁。張忠棟，〈門戶開放政策在中國的反應〉，《美國研究》，第3卷第3、4期合刊（1973年12月），頁121-142。"}, {"type": "text", "text": "21 \"Some Of The Activities of the American Asiatic Association Since Its Organization,\" The American Asiatic Association, Printed for the Annual Meeting, Oct. 21, 1937, New York, 1937, p. 7."}, {"type": "text", "text": "19 吳翎君，《美國大企業與近代中國國際化》（台北：聯經出版公司，2012），頁83-84。（簡體版由北京社會科學文獻社發行，2014）。"}, {"type": "text", "text": "22 The American Asiatic Association, Printed for the Annual Meeting, Oct. 21, 1937, New York, 1937, p. 7."}, {"type": "text", "text": "23 張存武，《光緒31年中美工約風潮》（中央研究院近代史研究所專刊13，1966年初版）。Guanhua Wang, In Search of Justice, the 1905-1906 Chinese Anti-American Boycott (Cambridge, MA: Harvard University Asia Center, 2001)."}, {"type": "text", "text": "美西戰後，美國獲得菲律賓和關島，勢力伸入太平洋地區，美日兩國的關係逐漸尖銳。此一緊張關係又因美國西岸興起的排斥日本僑民和移民問題而加劇。為舒緩美日緊張關係，陸軍部長塔虎脫（William Howard Taft，後來擔任美國第27屆總統，1909-1913），於1905年和1907年兩度訪問日本，尋求彼此的諒解 $^{24}$ 。1907年塔虎脫訪日之後於10月訪問上海，亞洲協會上海分會為此舉行盛大晚宴，商界代表紛紛出席，希望美國政府大力支持拓展中國市場 $^{25}$ 。此時面對日俄戰爭（1905年）之後已崛起的日本和一個正拓展遠東市場版圖的美國，在遠東的美商持以怎樣的態度？部分美商有意拉抬中國市場對美國的重要性，要求美國政府應大力轉進中國以牽制日本的崛起。儘管美國內部有不少人對崛起的新興日本感到不安，不少美商對日本大力推進滿洲市場的獨占亦發出警告和忿怒；但同時也有美商擔憂中國發動這一波的抵制美貨運動之後，美國不能再丟掉與日本的貿易機會，一個鞏固穩定的日本市場對美國進口商更具說服力。總之，美商步步為營權衡其在遠東市場的最大利益。"}, {"type": "text", "text": "美國亞洲協會的主導人物富爾德反對排華，對美國西岸時正興起的排日風潮也甚不以為然，認為排斥亞洲移民法案對美國推行門戶開放政策和整體遠東利益都是不利的。同時，他對日俄戰後取得勝利的日本在太平洋地區的崛起以及日本在滿洲的擴張，最初並未到意識到可能損及美國在中國東北的利益，他深信日本應會信守對華門戶開放政策中的平等原則，因此對日本在滿洲的野心企圖，並不以為意。1907年，他在《美國亞洲協會期刊》登高一呼美日關係應當緩解，將有助於遠東秩序的和平論調 $^{26}$ 。也有美商呼應美日關係應當和緩，同年1月《美國亞洲協會期刊》刊出波士頓商人豪斯（Osborne Howes）的〈日本商業發展〉（Japanese Commercial Development）長文，該文回顧日本古代與海外各國的交往歷史，以及1853年美國艦長培理（Matthew Calbraith Perry）打開日本門戶後日本開始面向西方的改革歷程，認為日本可望成為商業發達的文明國家 $^{27}$ 。"}, {"type": "text", "text": "24 塔虎脫首次訪日時間，就在美國為調停日俄戰爭而召開的樸茨茅斯會議（The Portsmouth Conference）之前一個月，簽署一份備忘錄（Taft-Katsura Agreement）。1907年再度訪日，簽署「日米紳士協議」（The Gentlemen's Agreement）非正式協定，對移民問題做出諒解。但簽約之後，美國西岸的排日運動並未減緩，他們希望對已入境的日本勞工採取限制的措施，美國國會最後也未能批准「日米紳士協議」，其結果加深日本對美國和東西方世界的不安感，促進日本內部「泛亞主義者」（Pan-Asianist）的形成。1924年美國又制定更嚴格的限制移民法，嚴格限定日本人和中國人的移民。Akira Iriye, Across the Pacific (New York: Harcourt, Brace & World, Inc., 1987), pp. 115-116."}, {"type": "text", "text": "25 \"Secretary Taft's visit to Shanghai,\" American Association of China (Shanghai. Press in 1907)."}, {"type": "text", "text": "26 Journal of the American Asiatic Association, Feb., 1907, pp. 1, 3. \"Annual Report"}, {"type": "text", "text": "美日兩國政府為緩和彼此在太平洋區域的緊張關係及美國排日問題而簽訂數次協議，其中最重要的是1908年11月30日，由日本駐美大使高平小五郎（Takahira Kogoro）與美國國務卿魯特（Elihu Root, 1845-1937）達成協定即《魯特—高平協定》（亦稱《羅脫—高平協定》）（Root Takahira Agreement）。這是日美兩國歷史上首次就太平洋地區的國家主權和領有地問題達成的安全協議。該協議中雙方政府承認（official recognition）領土現狀（the territorial status quo），包括：中國主權獨立和領土的完整（重申海翰門戶開放政策），美日雙方互允維持自由貿易和平等商業交往，日本承認夏威夷王國和菲律賓群島對美國的附屬，美國則承認日本在中國東北的地位。但這項協議美日雙方各自有不同的表述而爭議不休 $^{28}$ 。"}, {"type": "text", "text": "由於清帝國末年瞬息萬變的內外情勢，列強在中國的激烈瓜分和競爭，「美國亞洲協會」內部開始有不同的聲音，一些年輕人視富爾德為老派政客，對遠東政策過於保守溫和立場已跟不上時代。1911-1912年間該協會內部的年輕成員中，許多來自美國棉織品輸出協會（Cotton Goods Export Association）的活躍分子愈來愈走向激進態度，主張美國必須反對其他列強在中國的侵略行動以保護其經濟利益。在領軍人物美國棉織品輸出協會主席艾爾斯（Howard Ayers）的影響下，「美國亞洲協會」愈來愈激進，而中國辛亥革命後的動盪政局、帝國主義國家對中國鐵路權益的覬覦和國際銀行團的強勢作為，也使他們主張為了保護美國在中國的商業利益，美國政府應採取各種可能方式，甚至是武力干涉 $^{29}$ 。"}, {"type": "text", "text": "1912年中華民國正式成立後，列強觀望共和新政權的穩定性，並未馬上承認。亞洲協會內部文件坦承他們覺得對承認共和政府一事應保持緘默，直到1913年1月中國政局明朗化，協會始致函美國總統表示正式承認共和政府應有助於強化中美兩國的諒解 $^{30}$ 。共和政府肇建之後，該協會為因應中國新情勢的演變及對華貿易的手段策略，協會內部要求改組的呼聲愈來愈大，希望號召更多的會員加入，而年輕成員尤為他們所重視。「美國亞洲協會」的執行委員會認為有必要擴大該協會的宗旨和理想，除了原來的商業的利益之外，更應從教育、文化與經濟議題的討論促進東西世界的了解，成為東西文明的橋梁 $^{31}$ 。"}, {"type": "text", "text": "of the Secretary,\" Oct. 17, 1907, Journal of the American Asiatic Association, Nov., 1907, p. 298."}, {"type": "text", "text": "27 Osborne Howes, “Japanese Commercial Development,” Journal of the American Asiatic Association, Jan., 1907, No. 12, pp. 368-374. 該文為在波士頓商會（Commercial Club of Boston）的演講。"}, {"type": "text", "text": "28 喬治·F·肯南（George F. Kennan）原著，雷建鋒譯，《美國大外交》（American Diplomacy, 1900-1950）（北京：社會科學文獻出版社，2013），頁"}, {"type": "text", "text": "29 James John Lorence, “The American Asiatic Association, 1898-1925: Organized Business and the Myth of the China Market,” pp. 286, 304."}, {"type": "text", "text": "30 “The American Asiatic Association and History,” The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 6."}, {"type": "text", "text": "在此一背景之下，一位兼具外交官和銀行家資歷，且活躍於政經文化界的年輕人——司戴德（Willard D. Straight, 1880-1918）眾望所歸於1913年出任「美國亞洲協會」主席，直到1916年卸任。司戴德的遠東經歷不凡（詳後），他於1906年出任美國奉天總領事，適逢清政府宣布東北改制，由徐世昌出任第一任東三省總督，唐紹儀出任首任奉天巡撫。畢業自耶魯大學的唐紹儀（民國以後成為袁世凱總統的首任國務總理），他的美國留學背景令他和司戴德容易溝通，而奉天作為盛京和東三省的都會中心，擔任總領事的司戴德很快地和徐世昌、唐紹儀兩人有密切往來 $^{32}$ 。此外，司戴德在大學時代就認識也在康乃爾大學（Cornell University）就讀的施肇基，施肇基約在1905年返國後活躍於政治外交界，1912年加入了唐紹儀內閣。他形容司戴德「聰敏絕人，惜其早逝」 $^{33}$ 。更重要的是司戴德和美國金融界鉅子——號稱掌控美國鐵路創設和營運的「小拿破崙」哈里曼（E. H. Harriman, 1848-1909）交情不凡，也因此不久被美國摩根財團挖角，於1908年6月代表美國銀行團接洽清政府錦瑗鐵路貸款與幣制實業貸款的談判，談判期間司戴德以國際銀行團的美國代表身分，強烈捍衛他所認知的美國在華最大利益。在清末革命風潮的動盪中，他認為中國尚無實行共和的條件，希望袁世凱能維繫大清帝國的統治，改以實施君主立憲政體，司戴德於1911年10月28日給美國友人的信件表達了對袁世凱收拾亂象的信心，甚至稱「我們的朋友袁世凱」。傾向在袁世凱出任內閣總理的條件下，由四國銀行團提供一筆貸款協助中國進行改革，這樣一方面可使中國政局穩定，另一方面也不會有國際對新政府承認的移轉紛擾，而更重要的是亦得以保障各國既有的條約體系 $^{34}$ 。"}, {"type": "text", "text": "年輕有活力、人脈廣闊，且擁有豐富遠東政經資歷的司戴德及其對門戶開放政策的支持，正是陷入內部紛擾和世代交替的「美國亞洲協會」亟待協調出新方向的領導人選。作為美國遠東政策的前線執行者，不論是作為外交官或金融代表，司戴德始終堅持一個穩定獨立的中國（這也是他在辛亥革命傾心袁世凱之故），將有助於美國在華貿易與商業的發展，也才符合美國長遠的遠東利益。大戰爆發以後司戴德身兼美國大資本家專為海外投資而設置的廣益投資公司第三副總裁（Third Vice President），可見得他當時受到的愛戴光環。司戴德就任「美國亞洲協會」主席後，這一組織及其官方報刊不僅抓緊大戰時期中國市場的契機，更對中國的參戰問題所牽動的國際關係和遠東利益高度關注。"}, {"type": "text", "text": "31 “A Large Field for the Association,” Journal of the American Asiatic Association, April, 1912, p. 69."}, {"type": "text", "text": "32 1907年7月，司戴德建議在排除日本的參與下和英國資本家合作共同開發東北鐵路。次年，哈里曼寫信給國務卿魯特請求讓司戴德特地返美，與美國資本家共商向中國提供借款，以開發東北農業和建造鐵路計畫。而在此期間，司戴德已先和唐紹儀簽訂一筆2千萬元借款的備忘錄，成立中美合作的東三省銀行，並建造一條從齊齊哈爾到瓊琿的鐵路。George Kennan, E. H. Harriman, a Biography (Boston and New York: Houghton Mifflin Company, 1922), pp. 24-26. 楊凡逸，〈唐紹儀與近代中國的政治外交，1882-1938〉（台北：國立臺灣師範大學歷史研究所博士論文，2010）。"}, {"type": "text", "text": "33 施肇基，《施肇基早年回憶錄》（台北：傳記文學出版社，1985），頁32。施肇基於1902年取得康乃爾大學文學碩士，回憶錄中提到1926年該班同學在校舉行第25週年紀念會，以他及司戴德兩人較有聲譽乃捐款設置「施司獎學金」（Sze-Straight Fund）。Herbert David Croly, Willard Straight (New York:"}, {"type": "text", "text": "Macmillan Company, 1924), pp. 54-55 則提到司戴德在 1901 年到中國任職海關前曾向正在康乃爾學習的施肇基請教一些中國海關事務，司戴德也曾帶領施肇基參加大學俱樂部活動。"}, {"type": "text", "text": "34 Herbert David Croly, Willard Straight (New York: Macmillan Company, 1924), pp. 417-418."}, {"type": "text", "text": "（二）一戰時期的關鍵主張"}, {"type": "text", "text": "1914年5月27-28日在華盛頓召開的「全美對外貿易會議」（National Foreign Trade Convention）中，「美國亞洲協會」與「美國製造出口協會」（American Manufactures Export Association）聯手推動一個具有全國代表意義的國際貿易組織的誕生——「全美對外貿易委員會」（The National Foreign Trade Council, NFTC），首任主席為美國鋼鐵公司（US Steel）大老闆法瑞耳（James A. Farrell），敦促美國政府保護美商在海外的投資和貿易權益。為提升美國政府的泱泱文明形象，「美國亞洲協會」很早就注意到有必要改善美國在華使領館和外交人員的待遇，大力支持美國國會推動相關措施，該協會在1914年美國政府購建上海新領事館舍中扮演重要推手 $^{35}$ 。"}, {"type": "text", "text": "一次大戰爆發後，「美國亞洲協會」主席司戴德於1914年10月27日受芝加哥·伊利諾製造協會（Chicago, Illinois Manufacture Association）的邀請，發表講題為〈歐戰與我們對外貿易的機會〉（The European War and our Opportunity in Foreign Trade），呼籲美國銀行家應藉此機會將資金轉向南美洲及遠東市場，促進美國的海外貿易 $^{36}$ 。《美國亞洲協會期刊》密集刊出開拓中國市場的言論。1914年11月，刊出〈美國對華商業〉（American Business in Asia）一文，回顧從1784年美船中國女皇號（China Empress）首航中國後兩國經濟關係的進展。文中談及美國巴爾的摩飛剪船與英國商船在亞洲的競爭、美國對日本的貿易，並討論美國在亞洲市場的最大獲利——輸出粗棉換取精緻的絲品，以及美孚石油公司如何掌控中國石油市場的優勢。該文最後論述東方市場帶給美國人異國想像，主張美國應以貿易開發亞洲，扮演拯救「貧窮東方」的要角 $^{37}$ 。1914年12月，又刊出相似論調鼓勵美商前進中國的文章〈中國商業的未來〉（The Commercial Future in China） $^{38}$ 。"}, {"type": "text", "text": "35 \"Some Of The Activities of the American Asiatic Association Since Its Organization,\" The American Asiatic Association, Printed for the Annual Meeting, Oct. 21, 1937, New York, 1937, p. 8."}, {"type": "text", "text": "36 “The European War and our Opportunity in Foreign Trade” (Published 1914)，所發表的演講文，共15頁。"}, {"type": "text", "text": "37 \"American Business in Asia,\" Journal of the American Asiatic Association, Nov.,"}, {"type": "text", "text": "除了描繪中國的商業前景，《美國亞洲協會期刊》具體分析對中國市場開發的優勢和潛力。在1916年11月一篇文章中指出許多人都忽略中國是世界生產棉花量的第三大國，美國產量占世界首位，年約13,000,000至14,000,000包（bales, 1bale約等於4擔picul），其次為印度，年產量約7,000,000包，而中國居第三，約2,000,000包。中國粗棉的產量係在未有政府挹注經費於實驗農場、種子改良或專家協助等背景下，就達到約美國1/7；儘管有一批赴美研讀農業的留學生返華，從事棉業改革，但為數仍不足。作者認為以近年上海一地棉紡工業的欣欣向榮，中國如能引進現代科技，延聘更多技術專家，上海可望成為「遠東的曼徹斯特」（Manchester of the Far East） $^{39}$ 。12月號的專文則從棉花田實驗、工人的專業培訓和改良種籽的技術層面，縷述未來中國棉紡工業的發展方向 $^{40}$ 。同時，美國駐華與日本商務代辦（American Commercial Attachéfor China and Japan）阿諾德（Julean Arnold）在《美國亞洲協會期刊》呼籲美國大企業將資金轉向中國。他提及自從大戰爆發以來，多數美國製造業關注的仍是前進南美市場，將其視同於美國對外貿易的全部。但大家不了解中國市場更為巨大、更有潛力。阿諾德主張中國人口比起南美逾十倍之多，中國人又比拉丁美洲人更加勤快、工資便宜，而且國內物礦豐饒。當前亟待發展麵粉、棉紡織、榨油、火柴、玻璃等新式工廠的中國，更需要外國的投資和技術引進，而美國銀行家和企業家適可扮演此一角色。他同時認為，中國正萌發出一種「國族精神」（National Spirit）——富有理想，愛好和平，勤快積極，相信數年之間中國可望成為有組織的政府。阿諾德強調美國在華商會、美國駐華領事和華府的「國內外貿易發展局」（The Bureau of Foreign and Domestic Commerce）應密切合作，協助美國製造業和商人提供在中國發展商業的獎掖措施，而此事不必等到大戰結束，更要把握當前的大戰時機 $^{41}$ 。"}, {"type": "text", "text": "為鼓勵美商前進中國，《美國亞洲協會期刊》進一步從文化和心理層面介紹何謂中國，意圖翻轉美國人對東方民族的刻板性格。曾任教康乃爾大學的著名政治經濟學者詹克斯（Jeremiah W. Jenks, 1856-1929），撰述〈中國——美國沉默的夥伴〉（China, American Silent Partners）一文，分析中國人自陳「中國人尊敬英國，愛好美國，畏懼日本」一說的歷史淵源。作者縷述自清末駐華公使蒲安臣（Anson Burlingame, 1820-1870）以來的中美傳統友誼，認為美國更應幫助中國走向現代國家，而日本自1860年代以來的改革進步，則印證了東方民族是可以改變的。他首先揭示美國人仍停留於「睡獅中國」的看法有誤；恰好相反，一股中國民族主義的新精神正瀰漫全中國，這股士氣遠超乎美國人的想像。主張中國人追求富強和發展實業的企圖心非常旺盛，甚至以「極度務實的中國人」（the intensely practical Chinese）來形容此一動向。詹克斯此文用詞激昂，以美國總統傑弗遜（Thomas Jefferson, 1743-1826）果斷買下路易斯安那地區（Louisiana Purchase），因而為美國大西部的開發壯舉奠下基礎為例；此時中國的情況，正可讓美國挾著龐大的動力穿越太平洋，但美國要的不是領土，而是商業貿易。他同時提到北京政府有不少誠實、愛國，且有才幹的官員（並特別推崇財政部長陳錦濤的留美背景），呼籲美國必須把握機會，以財政援助中國，不宜錯失大好機會 $^{42}$ 。"}, {"type": "text", "text": "1914, pp. 310-313."}, {"type": "text", "text": "38 \"The Commercial Future in China,\" Journal of the American Asiatic Association, Dec., 1914, pp. 335-338."}, {"type": "text", "text": "39 \"China's Cotton Industry,\" from the N. C. Daily News, Journal of the American Asiatic Association, Nov., 1916, pp. 304-306."}, {"type": "text", "text": "40 \"The Manufacture of Cotton in China,\" Journal of the American Asiatic Association, Dec., 1916, pp. 335-340."}, {"type": "text", "text": "41 Julean Arnold, “American Trade Opportunities in China,” Journal of the American Asiatic Association, Dec., 1916, pp. 333-335. 阿諾德為大力倡導東方和中國貿易重要性之要角，不惟在各種場合一再呼籲美國政府端出更積極的對華商業政策，並在《美國亞洲協會期刊》上撰文，或接受該刊訪談，闡釋其見解。阿諾德於1914-1917任美國駐華和駐日商務幫辦。"}, {"type": "text", "text": "《美國亞洲協會期刊》和美國政府在華官員互相唱和，為說服美國各大商會前來中國投資，駐華商務代辦阿諾德在美國舊金山等太平洋口岸和美東紐約、波士頓等地到處演講。1917年3月，《美國亞洲協會期刊》刊出附有阿諾德照片的專題報導，並再度援引前述專文的主要內容，強調目前美國對華貿易僅占中國所有貿易的8-10%，雖已是自美國內戰以來，對華貿易的最高點，但仍有很大的進步空間。編輯也以顯著的標題指出中國的土地是日本的50倍大，人口比日本多8倍，並擁有廣大天然資源，其發展潛力可以期待 $^{43}$ 。"}, {"type": "text", "text": "從《美國亞洲協會期刊》的文章看來，一戰期間在討論投資中國市場的同時，美國企業界並不排斥與日本的合作，甚至也主"}, {"type": "text", "text": "張與日本合作共同開發中國，他們事實上是將日本、中國與遠東的貿易視為整體來考量其利益。1917年，美國紐約嘎什頓威格摩爾公司（Gaston, Williams & Wigmore）公司的副總裁威廉斯（Williams H. Williams）曾親訪上海，並接受「美國亞洲協會」訪問，他針對美國在亞洲的宏大商業計畫，提出三個主張：一、美國政府應對美商在海外的投資有所承諾和保障，且讓美商感覺到有效力的保障；二、在美國政府的資助下儘速拓展太平洋航線；三、美國可與日本共同合作，日本應會是誠懇的商業合作夥伴。他認為美國在中國的商業發展，光靠貿易是不夠的，必須有大筆的投資。他表示上海總商會會長朱葆三就向他提起：美國老是說要投資中國，且誇說美國對中國比其他國家友好，但都是光說不練；美國如果真要發展與中國的關係，光靠商品貿易無法發揮太大作用，美國政府必須強力推進美國大企業到中國來投資。「美國在中國的貿易和投資，如果抽掉美孚石油公司，就什麼也沒有了。所以，一定要有美國政府的推動政策和大企業的進駐投資。」44"}, {"type": "text", "text": "嘎什頓威格摩爾公司係一戰時期由數家船東宣布合組聯營的航運公司，於德勒克拉瓦註冊，資金5百萬，公司名下有14艘船。聯營之際，《紐約時報》還熱烈報導此事。這家懸掛美國國旗的新聯營公司，同時經營大西洋和太平洋航線，但主要因航行太平洋線——從舊金山到俄國、日本和中國口岸而聲名大噪 $^{45}$ 。威廉斯表示美國如要發展中美貿易，以現有的商船是不足的，呼籲美國政府應投資太平洋航線的運輸，而且此事大有利益可圖。威廉斯離華前，曾和甫卸下內閣總長的唐紹儀、上海總商會會長朱葆三等人會晤，並留下合影。他也抱怨說美國在海外投資的企業從未從美國政府獲得適當的保障，在中國政治不安穩的情況下，任何的礦業投資如果得不到美國政府的支持，企業家是不太願意冒此風險的 $^{46}$ 。當時《申報》稱威廉斯所屬為「美興公司」，上海總商會會長朱葆三於歡宴致詞中說「東西兩大共和國永聯為兄弟之邦，商務益臻發達」。威廉斯暢言商人對國際友誼的責任不亞於外交家：「外交家之光陰，其能專注外交者不過四分之一，而商家之光陰，其能從事於國際發生商務上更友好交誼之外交者則占四分之三。」 $^{47}$ 從這些言論也可以看出商人組織自詡在經濟外交上的任務和作用。"}, {"type": "text", "text": "42 Jeremiah W. Jenks, \"China, American Silent Partners,\" Journal of the American Asiatic Association, Jan., 1917, pp. 363-367."}, {"type": "text", "text": "43 Frank F. Davis, \"Broadening Our Chinese Trade,\" Asia: Journal of the American Asiatic Association, March, 1917, pp. 41-43."}, {"type": "text", "text": "44 該文提到上海總商會，但並未指出是誰，由合影始知是總商會會長朱葆三。“The Trade of Asia, An American-Asiatic Business Programme,” interview with William H. Williams, Vice-President of Gaston, Williams & Wigmore, Inc., Asia: Journal of the American Asiatic Association, April, 1917, pp. 122-124.〈總商會歡宴美國官商〉，《申報》（上海），1917年1月15日，第3張。"}, {"type": "text", "text": "1917年7月《美國亞洲協會期刊》特闢「對華貿易」（The Trade of China）專題，包含三篇文章：〈在中國投資的利益〉（Profits on Investment in China）、〈大戰與遠東商業〉（The War and the Commerce of the Far East）、〈學習漢語的商業政策〉（The Business Policy of Learning Chinese），後兩篇由著名記者鮑威爾執筆。〈在中國投資的利益〉文中提到：中國的工資低廉，約美國的1/10，而中國的棉花工廠、開礦和建造鐵路三種產業具有龐業的影響有三：一、日本工業的迅速發展；二、中國相對保守的心態；三、對亞洲市場興趣的增加和東亞工業的發展。他認為這些商業上的影響，其重要性不亞於政治外交領域。日本受大戰的影響對同盟國家的輸出也大有增加，1915年有156,000,000美元，1916年約有220,000,000美元。其中有約70,000,000美元來自俄國的訂單，出口至英國亦增加不少，美國則約占日本出口的30%。在國際航運方面，日本亦為一戰的受惠者，1914年美國進口貨物中，由日本輪船載運的僅2.77%，但到1916年，已上升到8.12%。文末強調東亞低工資也使先進工業國家的工資平衡受到威脅，為謀求雙方的利益，應在東亞培育技術工人使其得以自製半成品商品，如此將使西方工業國家和落後的廉價勞力國家彼此受惠。〈學習漢語的商業政策〉則強調美國若要拓展對華投資和擴大商業利益，有必要學習漢語和中國文化，以減少誤解。通過語言的溝通——不論是上海的洋涇濱英語（Pidgin English）或翻譯的普遍化，中美人士雙方的鴻溝已愈來愈少。總之，三篇文章從不同角度切入，試圖分析美國在中國的商業利益和方針、日本工業的快速崛起及中國市場的迎頭趕上 $^{48}$ 。"}, {"type": "text", "text": "45 New York Times, Feb. 24, 1916. 事實上，早在大戰爆發之初，中美兩國政府曾合作開通太平洋航線的合作。詳見本書第三章。"}, {"type": "text", "text": "46 \"The Trade of Asia, An American-Asiatic Business Programme,\" pp. 122-124."}, {"type": "text", "text": "47〈總商會歡宴美國官商〉，《申報》（上海），1917年1月15日，第3張。"}, {"type": "text", "text": "至於如何看待對中國事務具有野心的日本？作為美商團體的機關報，《美國亞洲協會期刊》與美國在華外交官和商務參贊往來密切，基本上呼應美國政府的遠東政策。1915年，被美國人冠以「日本摩根財團」的日本大企業家澀澤榮一（Baron Shibusawa Eiichi, 1840-1931）提出美日攜手合作開發中國的想法 $^{49}$ ，當時美國政府對於日本擴大在中國的影響力有所疑懼，並時而展現與日本競爭的意味。直到1917年4月初美國參戰後，因美、日同屬協約國盟友，美國對中國外交事務上與日本的合作始趨於明朗：不僅於1917年11月初與日本簽署「藍辛—石井協定」，承認日本在中國有特殊利益，且在中國的投資開發問題上亦傾向合作。美國參戰後，1917年5月《美國亞洲協會期刊》刊出文章〈我們亞洲的聯盟〉（Our Asiatic Allies），強調美國必須在中、日之間扮演協調者的角色，將日本因素納入遠東整體利益來考量，傾向美日合作的態度 $^{50}$ 。但該刊對於中國反日民族主義之情結亦略有同情，在日本提出21條要求後中國反日情緒持續高亢的狀況下，該刊曾於1917年6月刊出愛荷華大學商學院的中國留學生T. L. Li投書，該文強烈反對美日合作開發中國，認為以美國在工業技術上的領先，根本不需要與對中國虎視眈眈的日本共同合作來開發中國，指稱美國如和日本合作，等同狼狽為奸 $^{51}$ 。"}, {"type": "text", "text": "1917年2月，中國宣布與德斷交，美國國會於4月初宣布參戰。此時中國是否可能隨美國參加一戰？中國為何參戰？為何中國加入日本和協約國的一方？以及中國希望從英國和美國得到何種程度的回報等議題，同樣受到亞洲協會的關注。在〈中國為何參戰〉（Why China Enters the War）一文中，就中國政府對德宣戰的理由，作者略有保留。因為日本素來對中國的野心和挑釁絕對勝於德國，中國對德宣戰等於和日本成為盟友；此外，如以德國採用潛水艇作戰以致中國人遇難作為參戰理由，亦不具說服力，因為各國都知道中國政府對中國人民的生命財產保護是不力的。這篇文章對中國為何和德國斷交，且可能加入協約國一方的發展略有質疑，但也分析中國欲藉由參戰機會取得若干利益，包括希望獲得英美的支持參與國際事務、財政和軍事援助以及戰後恢復目前被剝奪的權益等多方考量。他提到儘管日本同意中國參戰，但已做好如何保護在中國既有權益的盤算。該文圖文並茂地介紹中國新式部隊的裝備，卻認為這些部隊和裝備若由中國軍官指揮，將無法發揮作用 $^{52}$ 。此文大致呼應了美國政府最初對於中國參戰政策的疑慮與態度，並不鼓勵中國參戰，以免中國可能成為協約國家的包袱或中國另有所圖 $^{53}$ 。"}, {"type": "text", "text": "48 “Profits on Investment in China,” “The War and the Commerce of the Far East,” “The Business Policy of Learning Chinese,” July, 1917, Asia: Journal of the American Asiatic Association, 三文刊於頁378-386."}, {"type": "text", "text": "49 澉澤榮一於 1902 年訪美，被美國媒體稱為「日本的摩根」（J. P. Morgan of Japan），當時他名下已有四十餘間公司、銀行和鐵路事業。New York Times, June 14, 1902."}, {"type": "text", "text": "1917, p. 163."}, {"type": "text", "text": "50 \"Our Asiatic Allies,\" Asia: Journal of the American Asiatic Association, May,"}, {"type": "text", "text": "51 “The Trade of Asia: An Objection to American Co-operation with Japan in China,” Asia: Journal of the American Asiatic Association, June, 1917, pp. 299-300."}, {"type": "text", "text": "52 “Why China Enters the War,” Asia: Journal of the American Asiatic Association, April, 1917, p. 163."}, {"type": "text", "text": "1917年8月14日中國正式對德、奧宣戰後，《美國亞洲協會期刊》刊出「今日中國」（Present Day China）專欄作家哈汀（Gardner L. Harding）所撰之〈戰時中國的角色〉（China's Part in the War）。不同於上述中國參戰前該刊持論的消極態度，作者提到中國從華工派遣、原料、兵工廠和食物供給均可對協約國家的援助發揮重要的作用，並肯定中國的參戰可使遠東局勢更加穩定，有鼓舞協約國士氣的作用；強調日本、中國和美國在同一目標的合作之下，中國將在未來更穩定的遠東局勢上發揮作用。該文以近二頁的篇幅介紹華工在英法華工營的優良表現，就中國人對歐戰的貢獻予以正面肯定。文中並提到上海新式工廠的發展，已略現規模，例如Nicholsa Tsu（中文名字不詳）的機械工廠在中國領班的帶領下，已可生產電車、鐵路、輪運等鋼鐵零件，上海新興的棉紡織工廠和漢陽鋼鐵廠也略有規模，甚至在西方技術支援下，剛萌芽的軍火工業，亦可發揮補給物資的作用。該文最後提到近年中國輸出大麥、大豆、冷凍食品和乾貨等的數量快速增加，這些都是中國對協約國家的具體援助 $^{54}$ 。儘管這些物資的輸出是一種獲利交易行為，但不論如何是中國對戰時歐洲民生食物的短缺做出的貢獻。也有資料顯示中國於大戰期間的1918年輸出的火腿肉有400萬磅之多，價值60萬海關兩（約值美金716,000元，當時1海關兩等於1.193美元），而英國則是中國火腿產品的最大輸入國家。這些火腿的產地包括漢口、上海、杭州和雲南，特別是雲南火腿的口碑甚佳，其次為浙江和湖南。中國東北為大豆和豆油輸出中心，以大連為主要輸出口岸，1918年輸出146,186美噸，價值24,047,036海關兩（合28,747,764美元）。雖然中國輸出火腿乃賺取謀生利潤，但早餐火腿在歐洲人生活中的重要性，可能不亞於戰爭時期香菸、可可和巧克力具同等重要的物資和精神鼓舞，成為英國人民的戰鬥力和民生需求的供應環之一55。"}, {"type": "text", "text": "1917年4月美國參戰，8月中國宣戰以及俄國十月革命的發生，海內外美國人愈來愈關注戰爭議題，如何發展中美經貿關係的言論已非焦點所在。特別是俄國大革命後的政治動盪，使得《美國亞洲協會期刊》愈來愈關注東方的政治議題。1918年4月，該刊表明自美國參戰後他們已是一本「戰爭雜誌」（War Magazine），並認為美國在這次大戰的巨大危機中，負有重大責任，宣稱「東方的危險即是我們國家（美國）的危險」、「我們已經在戰爭的中心」 $^{56}$ 。一戰結束前夕（1918年11月），該刊為配合戰時節約政策，表示為節省刊物印刷經費，僅印行會員紙本，不再於書報攤零售。一戰結束之後，因與「中國美國商會」的功能頗多重疊，加上後者快速擴充，亞洲協會及其所屬期刊逐漸轉型。"}, {"type": "text", "text": "53 吳翎君，《美國與中國政治》（台北：東大圖書公司，1996），頁 13-25。"}, {"type": "text", "text": "54 “China’s Part in the War,” Asia: Journal of the American Asiatic Association, Oct., 1917, pp. 644-646."}, {"type": "text", "text": "55 Julean Arnold, “Chinese Products of Interest to American,” in Julean Arnold eds., Commercial Handbook of China, Vol. II, 274. 該文也說據美國駐大連領事威廉斯的估算，東北年產150萬到200萬美噸的大豆作物，其中可能有至少100萬美噸輸往日本。"}, {"type": "text", "text": "56 “The Worst Disaster of the War,” Asia: Journal of the American Asiatic Association, April, 1918, p. 273."}, {"type": "text", "text": "二、美國在華商會的演變與作用"}, {"type": "text", "text": "(一)「中國美國商會」的成立"}, {"type": "text", "text": "1914年夏第一次大戰爆發，在上海的外商團體——萬國商會因為分屬不同交戰陣營而分裂，無法召開會議。倫敦中國協會在英國參戰後即建議在中國的英商應建立單獨的商業總會，1915年5月有十家上海英國公司聚在英國駐上海領事館籌組英商總會（The British Chamber of Commerce, Shanghai），最初會員60名，1916年快速增加到250名 $^{57}$ 。當時上海萬國商會的停擺情形如下：「此商會之地位已大受時局之影響矣，在戰爭中各國商會相繼成立。……但其戰前之活動將為各國商會所分，數年來未開大會」。「會董竊以為當惡感正熾之時未便集晤敵人於一堂，乃於當年報告中聲敘不開大會之理由，遇有應行討論事件輒發通告知照，照此辦理效用」 $^{58}$ 。一方面受英國總會成立的影響，另一方面在華美商在大戰時期深感成立獨立專責的美國商會之必要。1915年6月12日約有50位美國商人聚在上海皇宮酒店（Palace Hotel）共商籌組此事，美國駐上海總領事西蒙斯（Thomas Sammons）"}, {"type": "text", "text": "參與了這次籌備會議，會中推舉豐泰洋行（Frazar & Co.）創辦人麥克邁克爾為籌備會議主席，祕書布萊恩特（P. L. Bryant）負責商會的規章制定。該會籌備委員囊括最早一批美國在華跨國企業及其代表，例如美孚石油、英美煙公司和美國美國鋼鐵公司（U.S. Steel Products Co.）等等 $^{59}$ 。1915年6月19日「中國美國商會」在上海正式成立，正式選出麥克邁克爾擔任首屆主席，副主席為加拉赫（J. W. Gallagher）。上海美國商會（AmCham Shanghai）被喻為對華「美國貿易之喉舌」（Voice of American Business），是美國在本土之外，在海外所建立的第三個商會，可見得美商很早就看出上海在國際貿易的重要性 $^{60}$ 。"}, {"type": "text", "text": "「中國美國商會」首次執行委員會議年會於1916年8月18日召開，據會員名錄共有31個公司會員和28位個人會員。本次會議中討論的焦點為大戰期間對美國在華商業活動的處境及機遇，特別是如何解決大戰期間的船隻貨品運輸問題 $^{61}$ 。1918年4月「中"}, {"type": "text", "text": "59 “An American Chamber of Commerce,” The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Jun. 12, 1915. p. 793. 刊載了正式成立大會之前的聚會討論，這些企業及其代表如下：中日貿易公司（China and Japan Trading Co.）的代表F. A. Fairchild、大來公司（Robert Dollar Co.）的Harold Dollar、美國鋼鐵公司（U.S. Steel Products Co.）的J. W. Gallagher、豐泰洋行的J. H. McMichael、太平洋輪船公司（Pacific Mail Steamship Co.）的O. H. Ritter、美孚石油（Standard Oil Co.）的C. H. Blake、英美煙公司（British-American Tobacco）的Thomas Cobbs、梅西公司（R. H. Macy）的N. T. Saunders、中國橡木進出口公司（China Import and Export Lumber Co.）Carl Seitz等人。"}, {"type": "text", "text": "57 “An American Chamber of Commerce,” The North-China Herald and Supreme Court & Consular Gazette, Shanghai, May 22, 1915, p. 537. 首任主席為 H. H. Girardet，祕書長為 F. J. Norbury。目前此一組織的情況可參見官方網站 http://www.britishchambershanghai.org/en/about-history（2015年07月24日下載）。"}, {"type": "text", "text": "58〈萬國商會歐戰後大會記〉，《申報》，1919年3月27日，第3張。該文為針對戰後萬國商會如何解決上海口岸淤塞問題。「萬國商會仍為租界中必要之機關俾討論關於萬國利益之問題，而執行國際管理部關於浚浦與領港等事之職權。」戰後各國代表共聚討論上海港開挖方案。"}, {"type": "text", "text": "60 AmCham Shanghai官方網站，https://www.amcham-shanghai.org/en/about-amcham（2015年07月24日下載）。"}, {"type": "text", "text": "61 First Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, Aug. 18, 1916, pp. 1-2, 52-57."}, {"type": "text", "text": "國美國商會」召開的第二次執行委員會議年會中，會員數已增加，共有公司會員38位、個人會員28位、非駐地會員5位 $^{62}$ 。隨著美商在中國口岸業務的快速壯大，1918年5月美國商會成立天津分會，共有36名個人會員和11間公司會籍會員出席該次籌備會議，天津商會是美商在華北最大的商業利益團體 $^{63}$ 。1920年3月17日在美國駐漢口領事海因茲爾曼（P. S. Heintzleman）召集下，漢口美國商會成立，約有29名來自漢口和武昌的公司代表出席，他們認為上海、天津和漢口等地的美國商會有必要採取一致的行動，如此才能確保和壯大美商在華的整體利益。美國商會漢口分會繼上海、天津之後，成為美國在中國城市設置的第三個商會，其重要性不輸於美國在海外其他的商務據點。漢口商會的主席曼恩（Hunter Mann, L. C. Gillespie and Sons 公司代表），副主席為霍納（C. B. Horner，大來公司代表）。祕書為美孚公司的克勞弗（P. P. Clover）。執行委員除正副主席之外，包括：中國瓜哇出口貿易公司（The China and Java Export Company）的杭克爾（G. R. Henkel）、慎昌洋行（Anderson, Meyer and Company）的科布斯（J. J. Cobbs）、美孚公司的哈姆雷特（R. W. Hamlet）、亞洲銀行（Asia Banking Corporation）的卡雷遜（Theodore Carlesen）。漢口是長江沿岸的交通樞紐和蓬勃開展的工商城市，美國漢口商會的執行委員包含航運、機器進出口、貿易和銀行業，而美孚石油公司代表就有兩位，可見石油商品在中國市場的商機和勢力64。"}, {"type": "text", "text": "「中國美國商會」從成立之初，其會員和「美國亞洲協會」中國分會會員頗多重複，兩會會員共同呼籲和促進對華貿易多所串聯，並且他們與上海總商會的往來頗為密切，形成一個活躍的互聯網絡，特別是在1917年中美共同成為一次大戰的協約國陣營之後，三方的合作更加頻繁。1918年4月15日，上海總商會會長朱葆三，副會長沈聯芳（1870-1947）邀請「中國美國商會」主席伯恩、美國亞洲協會主席弗萊明、美國駐華公使芮恩施和上海總領事西蒙斯與中美商人晚宴，聚會中興致高昂討論如何促進中美商務發展 $^{65}$ 。一次大戰進入尾聲之際，1918年9月在「亞洲協會」中國分會和「中國美國商會」兩會促成之下，以促進大戰期間中美同為協約國家的商業利益為名義，共同邀請上海總商會會長朱葆三、副會長沈聯芳等人，共聚一堂。這次會議約有150位中美人士參加，會中就中美貿易和航運開展問題熱烈討論 $^{66}$ 。"}, {"type": "text", "text": "1922年9月19日美國總統批准《美國對華貿易法案》後，放寬了美國商人得以在中國開設公司的大門，大大吸引美商在遠東的商機 $^{67}$ 。（詳見本書第四章）接著美國在華商會採取了更具野心和效率的措施。1922年10月，來自上海、天津、北京和漢口的美國商會代表聚集上海成立「聯合美國商會」（Associated American Chambers of Commerce），宣告聯合美商在中國各地商會的組織和勢力成立一個更具領導權力的中央組織（Central Organization），除了因應《美國對華貿易法案》的成立，尚有中國本土的投資環境和政治情勢正處於激烈變化的階段，成立此一組織將更有效聯繫中國各地商會的意見。章程中規定正會員必須在美國商會中至少登錄有五間公司會籍，副會員則可少於五家公司。由於正副會員的門檻高，並不是每位美商都能具有此一要件，從「聯合美國商會」正副會員之階層運作和各項會務委員會的推動看來，係敦促美國投資者在中國努力創業和投資，使其享有在商會組織中的更高地位和影響力 $^{68}$ 。"}, {"type": "text", "text": "64 “An American Chamber of Commerce Formed In Hankow,” Millard’s Review of the Far East (1919-1921), Apr. 3, 1920, p. 245."}, {"type": "text", "text": "65 Second Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, April, 1918, pp. 18-21. “Chinese Chamber of Commerce Entertains Americans,” Millard's Review of the Far East (1917-1919), Apr. 20, 1918，據該報的報導此次聚會時間為4月15日。"}, {"type": "text", "text": "62 Second Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, April, 1918, p. 1-3, 5. 會員名錄見該書，頁114-120。"}, {"type": "text", "text": "63 The American Chamber of Commerce at Tientsin—a Progressive Organization, Millard's Review of the Far East (1917-1919), May 4, 1918, p. 358."}, {"type": "text", "text": "66 \"Americans Entertain Chinese: Chamber of Commerce,\" Millard's Review of the Far East (1917-1919), Sep. 21, 1918."}, {"type": "text", "text": "67 \"The China Trade Act aid for American Firms,\" South China Morning Post, Oct. 4, 1922."}, {"type": "text", "text": "（二）兩會在華商務活動的合併"}, {"type": "text", "text": "「中國美國商會」的聲勢愈來愈壯大，而其會員又多同屬「美國亞洲協會」成員，兩會乃有合併之議。1926年「美國亞洲協會」在華的商務活動被併入美國商會，「美國亞洲協會」仍保有其名，以從事教育文化事業為主。當時在華英文報刊多簡稱「美國亞洲協會」中國分會為「美國協會」，稱「中國美國商會」為「美國商會」。合併內容有四：一、美國協會與美國商會進行合併，係以聯合商會的形式運作；二、美國協會既有會員不論其職位地位或既有美國商會中的個人會員，只需交年費10元，其中"}, {"type": "text", "text": "5元捐為社區基金（Community Fund），賑災或其他用途；三、美國協會現有的各項基金將轉到美國商會的社區基金，由特別委員會管理；四、美國商會需於下屆年會召開時成立至少七人的社區委員會（Community Committee），需有美國商會的個人會員出任多數委員，延續過去美國協會承擔的社會救濟或其他公益事務 $^{69}$ 。"}, {"type": "text", "text": "1926年「美國亞洲協會」與「中國美國商會」的商務活動合併後，在商業推動的影響力更為壯大。1927年，擴大組織後首次會議選出新董事名單（表5-1），其中利吉特公司（Ligget & Myers Tobacco Co.）和美孚石油公司均為著名跨國企業，利吉特公司與美國煙草大王杜克（James B. Duke, 1856-1925）所創的美國煙草公司（American Tobacco Company）甚有淵源，美孚和美國煙草公司都是在1911年同時受到美國最高法院謝爾曼反托辣斯法案（Sherman Anti-Trust）的判例，而被勒令強制分立為數個獨立公司。其次，總公司設於美國德州休斯頓（Houston）的美國船級社（American Bureau of Shipping, ABS，成立於1862年）是建立和維護船舶及航運設備相關技術標準的非政府組織，以船舶監造和定期檢查等措施，來確保航海設備滿足其規範。船級社成立起初係因保險商為減少其承擔的風險，依據船舶之特性給予等級（classify），而發展出的一套檢驗系統，它在上海設有辦事處，並成為美國商會的董事，說明上海輪船業和保險業愈來愈重要。再者，滅菌消毒和檢測驗證等企業列於董事名單，也顯示美商對上海的城市公共衛生和文明都市的生活品質和據此發展的檢測準則，逐漸在外人社群中獲得認可 $^{70}$ 。"}, {"type": "text", "text": "68 U.S. Commerce Chambers in China Form a Central Organization, The Weekly Review (1922-23), Oct. 28, 1922, p. 304. \"American Chamber of Commerce: Common Association Formed in Shanghai,\" The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Oct. 28, 1922, p. 304."}, {"type": "text", "text": "69 \"New American Combination: American Association to Unite with the Chamber of Commerce,\" The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Dec. 4, 1926, p. 451."}, {"type": "text", "text": "1927年「中國美國商會」年會中，有一重要決議——開除《中國每週評論》（China Weekly Review，前身為《密勒氏評論報》[Millard's Review]）的會籍，由於時任主編鮑威爾對襲捲長江流域的排外運動和革命軍事行動的報導言論與「中國美國商會」不"}, {"type": "text", "text": "同調，且拒絕配合商會的立場，因而該年年會經過無記名投票要求該刊應辭去會籍，這件事創下該會創始以來開除會員會籍之首例 $^{71}$ 。由於美國商會曾要求在上海的英文報刊大力宣傳國民黨左派和共產黨人煽動反帝運動的言論，鮑威爾認為這樣的宣傳將使國民黨內原本的溫和派（如蔣介石）也被貼上紅色標籤，反而擠垮了國民黨溫和派，最後將強化了國民黨倒向共產黨及其蘇聯支持者。美國商會則希望藉此宣傳北伐軍事行動和排外風潮的串勾，挑動美國政府軍事介入中國的政治動亂。鮑威爾在其《中國二十五年回憶》（My Twenty Five Years In China）中提到被除名這件事應係包裹表決，但事後證明他的立場正是呼應了美國政府主張不宜軍事介入中國內政的想法 $^{72}$ 。「中國美國商會」是美國人在中國本土最具分量的角色之一，它和美國在華傳教組織成為1920年代後期美國對華政策的兩個最大壓力團體，基督教會和外國企業是中國排外運動中最受生命威脅和迫害的對象，為煽動帝國資本主義假借基督教義壓迫中國的具體表徵。有別於傳教士對中國民族主義風潮具有同情心，「中國美國商會」則認為排外風潮帶來的騷動不利於商業投資，他們大力宣傳和要求美國政府應採取軍事介入，此一舉措使得南方的國民政府撻伐美國商會已悖離往常商會的貿易性質 $^{73}$ 。"}, {"type": "text", "text": "71 \"American Chamber Of Commerce Holds Its Annual Meeting And Elects Directorate for Year,\" The China Press, Apr. 27, 1927."}, {"type": "text", "text": "72 事實上就在美國商會開會之前，鮑威爾收到來自華府記者訊息，美國政府宣稱除了保護美國在華僑民的生命財產安全無虞之外，反對軍事介入中國事務。John B. Powell, My Twenty Five Years In China (The Macmillan Company, 1945), pp. 165-167."}, {"type": "text", "text": "70 “American Chamber Of Commerce Holds Its Annual Meeting And Elects Directors for Year,” The China Press (1925-1938), Apr. 27, 1927. 刊出此屆新董事名單。"}, {"type": "text", "text": "73 \"Nationalist Government Aiming Criticisms Against Activities Of The American"}, {"type": "text", "text": "1920年代後期中國興起的一股民族主義排外風潮，以及國民政府利用「革命外交」的宣傳手段以收回國家主權的目標，再加上中國內戰問題，嚴重威脅外國僑民在華安危。1927年1月間，美國政府為避免國民革命軍及北方張作霖部在上海發生戰爭，嚴重危及各國僑民。由美國國務務卿凱洛格與遠東司長詹森磋商後，決定提出上海中立化的主張。具體意見為：一、國務院不贊成派遣正規陸軍部隊到上海，以避免刺激中國人民、甚至不慎導致美國同南方派軍隊開戰；二、立即與廣東派、北方張作霖聯繫，尋求達成保障公共租界的協議 $^{74}$ 。美國政府宣稱不干涉中國內政的立場，不論是北方軍閥混戰或南方國民革命軍發動的北伐戰爭中，美國政府尚稱中立，而以保護美國在華商民的性命安危為第一考量。這是由於美國公眾對於世界大戰後的國際政治大為失望，這種情緒滋長反對以武力解決國際問題的各種聲浪。從1920年代起，美國民眾日益反對帝國主義，而且對於使用武力對抗未開發國家甚為反感。1925年國內的壓力迫使凱洛格簽署一項公約宣布戰爭為非法。在此一背景下，美國政府不得不對在中國以軍事武力保護美國在華利益及僑民安危，表示猶豫 $^{75}$ 。"}, {"type": "text", "text": "隨著 1927 年下半年後中國政情的明朗化，美國商會始逐漸調整其因應步伐。1927 年著名的美國國會議員暨外交事務委員會（Committee on Foreign Affairs）主席波特（Stephen G. Porte）提出"}, {"type": "text", "text": "對華新政策《波特決議案》（The Porter Resolution Act），有意緩和中國高亢的民族主義排外情緒，並對中國可望從南北之爭或軍閥交戰的混亂狀態中逐漸脫身，率先釋出善意；要求美國柯立芝總統與代表全中國人民發言且強而穩定的中央政府進行商談，以便修訂中美兩國間的條約，俾使今後兩國外交關係建立在平等互惠的基礎上。《波特決議案》被視為次年6月美國與國民政府展開中美關稅自主協議的一個前哨站，美國政府並通過此一外交協議等於承認甫成立的南京政府。「波特決議案」的幕後推手即是美國在華商會，但美國商會的出發點在於排外風潮造成美國僑民在華生命財產的損失和不確定感，而選擇對中國民族主義者要求簽訂中美平等新約的退讓與妥協，並協助已撤離中國的美商能儘速返回中國繼續從事商業活動 $^{76}$ 。整體而言，1920年代中期「中國美國商會」和國民政府的關係相當緊張而尷尬，一直到1928年南京國民政府作為政治形式統一後的中國政府，該年英美商會始含蓄表達中國政治的穩定將有助於中外貿易，期待中國市場的繁榮前景 $^{77}$ 。"}, {"type": "text", "text": "（三）對中國參與國際商會和推動中美貿易委員會的作用"}, {"type": "text", "text": "1928年南京政府在政治形式上統一南北，並獲得國際各國的承認，成立於1919年，以巴黎為總部的國際商會組織邀請中國加入該組織，這一邀請顯示中國實業市場攸關世界經濟發展前途的意義，也勢必牽動美國商人團體在中國的權益。"}, {"type": "text", "text": "Chamber of Commerce,\" The China Press (1925-1938), Aug. 30, 1927."}, {"type": "text", "text": "74 Kellogg to MacMurray, Jan. 28, 1927, FRUS, 1927, Vol. II, p. 61. 關於「上海中立化」問題，詳見：吳翎君，《美國與中國政治》（台北：東大圖書公司，1996），第5章，頁205-216。"}, {"type": "text", "text": "75 Warren I. Cohen, American's Response to China (New York: Columbia University, 1990), p. 96."}, {"type": "text", "text": "76 美國政府並通過此一外交協議等於承認甫成立的南京政府。1928年9月11日，國務院致電馬慕瑞：「你可聲明北京公使館已授權與南京政府在完全承認（full recognition）的基礎上發展正式關係。」詳見：吳翎君，《美國與中國政治》，頁198-199、245-247。"}, {"type": "text", "text": "77 \"Shanghai American and British Chambers Hold Annual Meetings,\" The China Weekly Review (1923-1950), Apr. 28, 1928."}, {"type": "text", "text": "國際商會的主旨本為促進世界經濟發展，然而本次大會預備會議之中在討論中國經濟建設和財政交通問題的同時，中國撤廢治外法權問題卻成為主要焦點。1929年7月10日國際商會第五屆大會於荷京阿姆斯特丹召開正式大會，中國代表團主席為張嘉璈，陳光甫（輝德）及上海南市商會會長朱吟江任副代表，另有郭秉文等普通代表10名。英美法日等國駐滬商會代表有意在國際商會正式大會中提案反對中國撤銷治外法權，理由是根據華盛頓會議之決議，由美英中法日所組成之調查委員會對中國法律狀況的調查結果：「中國尚未能達到司法獨立，中外人民生命財產之安全未獲法律上和行政上之完善保護。」他們據此要求美英法日四國務當堅持華會的調查報告，作為討論國民政府所請各節之依據。中國代表則相繼演說各國在華治外法權問題和不平等條約係中國對外貿易之障礙，要求與世界各國發展正常經濟貿易關係，並主張國際合作之精神應在中國主動願意合作，且絕對無損於中國主權的條件下進行合作。在中國代表的堅持之下，國際商會最後答允將英美法日四國駐滬商會的提案書撤回，同時將中國代表要求取消治外法權的各項理由，「載入」提交大會正式討論的中國問題報告書中。最後會議主席畢蘭諾（Alberto Pirelli）的處置方式可說是一種「存而不論」的妥協，允諾正式大會決議書中除致達歡迎中國入會之外，不涉及中國其他問題 $^{78}$ 。"}, {"type": "text", "text": "美國作為一戰後的世界霸權國家和強大經濟體，並在1923年和1939接續推動道斯計畫（Dawes Plan）和楊格計畫（Young Plan），協助戰敗德國經濟重建，使其有能力償付賠款，並進一步復甦歐洲經濟，因此，美國在國際商會中的角色自不待言。而中國一旦加入國際商會，對「中國美國商會」在華事務的推動當然也產生若干影響，這也是上述為何英美法日等國駐滬商會代表在國際商會正式大會中提案反對中國撤銷治外法權的主要原由。"}, {"type": "text", "text": "在第五屆國際商會中，關於中國之會議席上美國代表團主席拉蒙脫（Thomas W. Lamont）致詞，他樂見中國加入國際商會，也對中國國民性格和近年商業進步有所稱譽，但他也直指「中國的國際信用之薄弱為任何人所不得而否認，在中國政府尚無建設國際信用之具體辦法以前，任何具備優惠條件之（中國）政府公債決不能售諸紐約市場，抑且不能募於歐洲市場，此鄙人所敢斷言者。」拉蒙脫曾充當美國銀行團代表，在一戰前後來華接洽國際銀行團對華借款事宜，對中國內戰連連以致國際信評低落表示焦慮，認為除非中國內部軍事革命成功而告一段落，尚可望得到國際經濟財政上的援助，否則實在難言經濟援助中國之可行性 $^{79}$ 。英國代表貝爾福爵士（Sir Arthur Balfour）的發言更點出中國必須自行整理財政經濟，將國家收入運用得當（尤指國家收入，大半用於軍需），才能談到輸入外資問題。英美代表的發言說明中國政治的和平發展與商業投資的紐帶關係，在中國經濟財政狀況不佳之下，美國銀行家在商言商，是不太可能給中國大宗借款，要求中國率先整頓本身的財政問題，才可能獲得友邦協助。中國加入國際商會的最初成效主要仍在於活絡中外企業的投資和國際商人團體交流，而非在於政府層次，英美雖邀請中國加入國際商會，但是在預備會議中不論是廢除治外法權或取得國際經濟援助均未獲有具體成果，甚至在預備大會中讓中國政府代表嘗盡歐美霸權當頭棒喝或有干涉中國政治之難堪感受，難怪與會者的報告書呈現強烈受辱的感覺80。"}, {"type": "text", "text": "處，但絕對不願對外借款受到各國「共同拘束」。陳嘉璈提到原本愛文和諾多瑪兩氏原本打算在第五屆大會正式會議有對華不利的政治演說，會場上正反意見各執一方，形勢緊張。後來進行討論會之前會長畢蘭諾先和他私下見面，表達對中國代表之尊重，將原設之中國問題委員會取消，婉謝愛文諾多瑪二氏之演說。"}, {"type": "text", "text": "78「國際商會第五屆大會中國代表團報告書」，〈國際商會暨參加美國世界博覽會籌委會規程〉，《國民政府》，國史館藏，數位典藏號：001-110020-00008-001。代表團主席張嘉璈陳述國民政府不願為行政經費與無計畫之借款，亦不願各國有共同拘束之財政援助，明白揭示中國開展中外合作之意願且獲得益"}, {"type": "text", "text": "79「國際商會關於中國之會議席上——美國代表團主席拉蒙脫氏之致辭」〈國際商會暨參加美國世界博覽會籌委會規程〉，《國民政府》，國史館藏，數位典藏號：001-110020-00008-001。"}, {"type": "text", "text": "南京政府在國際商會的主張，可說係延續1920年代以來中國要求廢除列強在中國的特殊權益，並希望以世界平等的國家身分進入國際社會的願望。最初中國政府顯然對參與國際商會賦予一種政治榮耀，但這次與會並未達成廢除治外法權等政治外交成就；儘管如此，這次會議是中國商人組織首次躍入國際舞台，表達中國欲以國際社會的平等主權國家身分，參與國際商會組織，並和世界各國發展正常貿易關係的決心。此後中國全國商會聯合會經兩年的討論和籌備，至1931年中國始成為國際商會的成員，國際商會中國分會正式成立，推舉上海商業儲蓄銀行總經理陳光甫為會長，郭秉文為副會長，林康侯為祕書長 $^{81}$ 。由於中國工商界的經濟實力遠落後於歐美國家，加以分會內部經費和人力不足，加入國際商會成為會員者並不踴躍，當時胡紀常特為此窘境撰述《國際商會概論》，鼓勵中國人應凝聚團結力量，加入國際商會中國分會 $^{82}$ 。早期參與國際商會的重要成員陳光甫（商業學士）、郭秉文（教育學博士）俱是留美派，可能是語言溝通的優勢和其人脈幹才，陳光甫很快在1930年代中美經濟關係上扮演極重要的民間與政府之間的橋梁角色 $^{83}$ 。郭秉文也於1931年出任國際貿易局局長，1934年擔任第一屆中美貿易委員會委員。"}, {"type": "text", "text": "就中國參與國際性商會組織方面的實質運作和影響力而言，「中國美國商會」對中美雙邊的影響力肯定高於國際商會。「中國美國商會」的會務持續拓展，到了1934年6月，在美國對外貿易委員會（National Foreign Trade of United State）的構想和促成之下，國民政府成立「中美貿易委員會」（Chinese American Trade Council），直接通過「中國美國商會」和「中國全國商會聯合會」的緊密合作關係強化中美經濟和貿易關係。1934年第一屆的中美貿易委員會成員14名與職掌（附錄：5-3），會長陳光甫、副會長郭秉文。中美兩方的組織成員為旗鼓相應：美方委員中除美國商會代表6名之外，尚包括美國駐華商務代辦阿諾德，中國委員中亦然，6名來自中國全國商會聯合會的代表之外，另包括國際貿易局局長的郭秉文 $^{84}$ 。"}, {"type": "text", "text": "82 胡紀常，《國際商會概論》（上海：商務印書館，1933），頁88-89。中國參與國際商會雖有政府為後盾兼具民間外交性質，財政部並補助中國全國商會聯合會及該會中國分會之出席費用，但中國民族企業最初並不熱中參與。「國際商會催繳中國分會會費暨出席1938年、1945年國際商會大會案」。中央研究院近代代史研究所檔案館，《經濟部檔案》，8-23-00-145。"}, {"type": "text", "text": "80 育幹，〈國際大會與中國〉，《東方雜誌》，第26卷第15號，頁6-9。另據《張公權先生年譜》（上），頁92。"}, {"type": "text", "text": "81 關於中國參與國際商會的詳細經過，可參見朱英，《中國商會走向國際舞台的新步幅——中國商會加入國際商會的歷程及影響》，《近代史學刊》，2001年第2期，頁6-16。本文不擬贅述。"}, {"type": "text", "text": "83 關於陳光甫的研究可參見：陳鴻明，《游走政商：陳光甫與國民黨政權（1927-1949）》，國立暨南國際大學歷史學研究所碩士論文，2015。郭秉文為哥大教育學博士，也是中國第一位教育學博士，著有《中國教育沿革史》一書。歸國後曾任南京高等師範學校（後改建為國立東南大學）教務長、校長，被稱為「東南大學之父」。1931年郭秉文出任國際貿易局局長，參與銀行金融界。紐約「華美協進社」（China Institute in America, 1926-）創辦人，一生提倡中美文化交流不遺餘力。"}, {"type": "text", "text": "為促進美國在太平洋地區的整體商業利益，1934年美國對外貿易委員會擬議組成一個龐大的「美國遠東經濟考察團」，由「美日貿易委員會」（American-Japanese Council）和「美中貿易委員會」（American-Chinese Council）規劃，通過紐約、東京、上海等地的相應貿易組織以及美國亞洲協會的共同合作，而促成此次壯舉 $^{85}$ 。中國方面則特別組織了「美國經濟考察團招待處」，專門設置執行委員會安排考察團在華活動及預期成效，包含中國國際貿易協會、國際商會中國分會、上海市商會代表各派出二人，另有執行委員會推請之代表。執行委員會下設有議事組、考察組、會序組、宣傳組和事務組，不僅安排中國各地的正式考察，甚至各種娛樂活動和讌會茶會遊園都在安排之列，並發動報紙和記者緊密配合宣傳，還徵集各界發表對考察團和中美經濟前景的論文談話，各項細節之精心運籌宛若一場盛大的排演，顯現南京政府對這件事情的高規格重視 $^{86}$ 。由此可見這一訪問團可以說是出自中美雙方各自的利益需求而共同籌劃的一場商業外交的盛事。"}, {"type": "text", "text": "「美國遠東經濟考察團」團長由擔任過駐日公使和菲律賓總督的福布斯（W. Cameron Forbes）出任，他們於1935年3月22日自舊金山出發，搭乘大來航運公司（Robert Dollar Co.）的柯立芝總統號（S. S. President Coolidge）先抵首站日本，4月22日自日本抵達上海。訪問團在中國造訪了上海、南京、北京、天津、漢口、廣州等城市。此行他們與中國工業家和銀行家密切交流，了解美商在中國投資的條件和困境，並且美國在中國各口岸的商會和口岸領事藉此盛事，推進與中國商人的理解合作 $^{87}$ 。這一浩大的商人團體在中國搭乘鐵路和飛機，而且他們可能是第一個搭乘中國國航（China National Aviation Corporation）考察中國各城市的實業團。在上海由市長吳鐵城邀集中美商人共聚於美國人俱樂部（American Club）餐敘。24日，抵國民政府首都南京，由南京政府實業部資源委員會和財政部要員熱烈接待（並安排赴中山陵謁靈）美國駐華公使詹森亦親自接待訪問團，顯現美國政府的重視。訪問團一行於6月18日轉往菲律賓 $^{88}$ 。訪問團歷經三個月在日本、中國和菲律賓的考察，完成了一份69頁的商情調查報告。這份報告可說是中國對日抗戰以前，美國對遠東最重要的三個商業利益國家的商業調查，副標題「對東方貿易的期待」（American Trade Prospects in the Orient），內文完全不涉及敏感政治問題，詳錄三國各地的接待、參訪和參與者名單，在這份報告中對投資中國著墨最多，共有43頁，包含中國財政信用、中國投資機會、美國銀行業在中國、美國白銀政策對中國的影響、中國農工礦業的調查等等 $^{89}$ 。報告的執筆者有撰述《外人在華投資》一書的雷麥（C. F. Remer），同時收錄了1935年美國「美中貿易委員會」和上海「中美貿易委員會」的成員，這些成員顯然也都是中美兩國商會的活躍分子（附錄5-4）。報告總結認為中美貿易的拓展機會，大於實質的障礙，而這些障礙都是技術操作的次要問題。這次訪問團的經費主要由美國大企業合力贊助，包括大通銀行、美孚公司、紐約花旗銀行、大來航運、國際電話電報公司等14家具全球影響力的跨國公司 $^{90}$ ，顯現美國大企業和商人團體對廣大中國市場"}, {"type": "text", "text": "84 “Trade-Council Got Start in 1934, Now Live Organization,” The China Press, Nov. 20, 1936. 到了 1936 年，委員改為 12 名，中美代表各 6 名。"}, {"type": "text", "text": "及專家談話會之召集；二、考察組：籌劃內地各處參觀之路程、沿途招待員嚮導及議員之委派、各地歡迎會談話會演說會之接洽；三、會序組：負責考察團在京滬時各種集會訪問參觀時間、讌會茶會遊園會、聘請招待人員和各項娛樂節目之籌備；四、宣傳組：集中發表考察團抵滬後之行動與言論、考察團往內地時記者之遣派、各演說會談話會速記員之遣派；五、事務組：臨時人員之聘請或僱用事項、銀錢出納及記帳事項、文書郵電之撰擬與收發事項、一切庶務事項。〈美國經濟考察團招待處組織大綱〉，天津市檔案館藏，《天津商會檔》，401206800-J128-2-003080-003。"}, {"type": "text", "text": "85 美國遠東經濟考察團，於 1935 年出版官方報告：Report of the American Economic Mission to the Far East: American Trade Prospects in the Orient (New York: National foreign trade council, 1935), pp. v-viii."}, {"type": "text", "text": "86 執行委員會設置各組如下：一、議事組，關於中美貿易問題之研究、中美貿易進展之提議、徵集國內對於該考察團之意見、中美經濟論文之撰寫、各界"}, {"type": "text", "text": "87 “American Economic Mission Arrives in Shanghai,” The China Weekly Review (1923-1950), Apr. 27, 1935, p. 295. “The American Asiatic Association and History,”福布斯曾於1909-1913年間任美國駐菲律賓總督、1930-32年間任美國駐日公使。"}, {"type": "text", "text": "的潛力，始終抱有信心。"}, {"type": "text", "text": "1936年「中國美國商會」慶祝成立21週年時，回顧該會在華創立的初始歷程，當時三件事最受重視：一、促進對華航運；二、要求美國在華商人得享有與各國公民一樣的權益；三、美國政府在上海應有一棟與美國國力相當的領事館。這些目標都逐一實現，他們對中國市場榮景充滿樂觀 $^{91}$ 。甚至在不久日軍侵略並占領上海後，美國商會仍持續運作，1941年2月21日在上海召開的年會中，仍有150名會員參加，直到珍珠港事件發生，美中貿易和美國在華商人的處境始發生劇烈變化 $^{92}$ 。"}, {"type": "text", "text": "三、「美國亞洲協會」的文化轉型"}, {"type": "text", "text": "1926年，「美國亞洲協會」中國分會與「中國美國商會」合併之後，在紐約總部的「亞洲協會」仍持續運作，但該協會自一戰以後除了商業活動之外，自許能對亞洲各國的相互了解做出貢獻，旗下刊物有意朝向以亞洲為一體的文化和人道關懷。《美國亞洲協會期刊》於創刊時開本為B5，係以商人利益為喉舌的報刊，在大戰期間1917年3月改版為A4大小，正式轉型為一本關注遠東所有事務的時尚文化刊物，而不僅僅是一本商業情報刊物。"}, {"type": "text", "text": "88 “American Economic Mission Arrives in Shanghai,” The China Weekly Review (1923-1950), Apr. 27, 1935.《申報》，1935年4月24日，第3版。"}, {"type": "text", "text": "89 Report of the American Economic Mission to the Far East: American Trade Prospects in the Orient (New York: National foreign trade council, 1935). 關於日本的報告，在頁1-16；關於中國，頁17-60；關於菲律賓，頁61-69。"}, {"type": "text", "text": "90 1935年「遠東經濟訪問團」贊助名單如下（金額不詳）：American Chamber of Commerce of America, Inc., The Chase National Bank of New York, Chemical Construction Corporation, Colgate-Palmolive-Peet Company, Dibrell Brothers, Inc., Dollar Steamship Lines, G. Ellsworth Huggins, International General Electric Company, International Telephone & Telegraph Corporation, Millers National Federation, National City Bank of New York, Standard-Vacuum Oil Company, The"}, {"type": "text", "text": "Texas Company, United States Steel Products Company. 資料來源：Report of the American Economic Mission to the Far East: American Trade Prospects in the Orient, p. IV."}, {"type": "text", "text": "91 \"American Chamber Celebrates 21st Anniversary on Aug. 20,\" The China Press (1925-1938), May 23, 1936."}, {"type": "text", "text": "92 \"American Chamber of Commerce Meeting,\" The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Feb. 26, 1941."}, {"type": "text", "text": "刊物轉型的主要關鍵來自1913年出任美國亞洲協會主席司戴德，亦即前述1915年出任廣益公司第三副總裁的傳奇人物。司戴德的早期遠東經歷，直接影響亞洲協會的發展及其文化轉型，有必要詳述之。"}, {"type": "text", "text": "司戴德畢業於康乃爾大學建築系，大學時代活躍於各個藝文社團。出於對遠東的好奇幻想，大學畢業後赴中國海關任職，當他抵達中國時，北京外交圈對義和團事件的陰影仍驚魂未定，但他經常四處旅行，並以畫筆描繪中國各地的風土人情。海關行政人員的無趣工作令他日生厭倦，日俄戰爭爆發後他擔任報社通訊員跟隨日軍報導戰情。司戴德童年時曾和母親待在日本二年多，對日本有特殊的情誼，然而1905年2月他以戰地記者的身分來到日俄戰爭的交戰區邊界——被日本人占領的牛莊，得以實地觀察這場戰爭在第三國境內開打的荒謬現象——中立國家中國的處境，並對日本的軍事擴張逐漸有所疑慮 $^{93}$ 。其後司戴德出任美國駐朝鮮漢城副總領事，由於美國領事館就位於朝鮮皇宮旁，他親眼目擊朝鮮王室被日本威脅而被迫成為日本保護國的驚駭情景，速寫一張「朝鮮簽字揮別自由」（Korea Signs Away Her Freedom）的素描。司戴德親眼見證了朝鮮民族的無助與日本的步步威逼，意識到日本將成為亞洲的侵略國家，這件事對他後來在中國的活動產生關鍵性作用，期望這樣的事情不會在中國重演 $^{94}$ 。司戴德對美國政府的背信也表示不滿，因為依據1882年的《朝美修好條約》，美國允諾尊重朝鮮的君主制和獨立地位。日本在朝鮮政策激起司戴德的憤怒，使他轉而愈加關注中國事務，而讓他發揮所長的機會已經不遠了。1906年司戴德出任美國奉天總領事，負責交涉美國對華鐵路投資和實業借款等重要事務，接著又出任摩根財團代表，繼續參與美國國際銀行團對中國的談判 $^{95}$ 。"}, {"type": "text", "text": "司戴德對中國的政治、社會、中國人民和文化有深刻的關懷，對中國的水患與飢民問題尤為同情。這位康乃爾大學建築系畢業的高材生非常喜愛素描，他以繪圖長才和敏銳的觀察力畫出眼中所見的中國，不論是大人物或市井小民都是他的素材，販夫走卒、喇嘛、和尚，以及中國婦女在他的筆下不是窮苦或卑憐的形象，而富有一種清新樸實之感。司戴德也極力促成他的母校康乃爾大學展現對庚子賠款獎學金（1908年實施）中國學生最友善的一面，開啟了康乃爾大學成為早期留美學生的學術大門。司戴德的好友同時也是為他立傳的柯羅里（Herbert David Croly, 1869-1930）形容他的性格「令人印象深刻，敏感、機伶、好奇，很快適應任何狀況和職務的挑戰。但他不是喜怒無常的藝術家，是最果敢行動之人，在他準備報告和重新詮釋之前肯定是先從生活中行動」；並概括他在中國的活動是「想通過政治和社會組織的改變，為中國邁向現代化之路提供裝備」 $^{96}$ 。柯羅里本人則在1909年出版有《美國人生活的承諾》（The Promise of American Life）一書，倡議打造一個經濟富裕、社會平等、努力實現自我，並凝聚在充滿愛國精神下的美國人認同之國度，成為美國1920年代進步主義運動的領軍人物之一。這兩位好友互相唱和，時用文字和言論表達對國內和國際政治的主張，共同參與了迄今仍富有影響力的《新共和》（New Republic）雜誌的創辦 $^{97}$ 。同樣為打造美國新共和的愛國主義精神所感召，司戴德在1917年4月美國參戰後，投入美國陸軍，遠赴法國擔任聯絡官，曾獲頒傑出服務獎章（Distinguished Service Medal），並被拔擢為上校。次年12月因感染西班牙流感（Spanish Flu），不幸於巴黎去世，死時猶未滿40歲。司戴德過世後，《亞洲：美國亞洲協會期刊》從1920年9月號起連載格里夫斯（Louis Graves）所著《一個美國人在亞洲》（An American in Asia），共9期，以示對他的誌念 $^{98}$ 。"}, {"type": "text", "text": "93 司戴德6歲喪父，母親帶著他和姊姊到日本教人學英文，以維持生計；9歲時母親也因病去世。母親的美國好友將他帶回美國教養成人。筆者曾撰有司戴德專文，吳翎君，〈司戴德與清末民初中國〉，「辛亥革命暨南臨時政府成立國際學術討論會」，南京：南京大學，2011年10月16-17日。（未正式出版論文集） 94 Herbert David Croly, Willard Straight (New York: Macmillan Company, 1924), pp.168-170."}, {"type": "text", "text": "95 Herbert David Croly, Willard Straight, pp. 190, 195."}, {"type": "text", "text": "96 Herbert David Croly, Willard Straight, introduction, XI; XIII. 柯羅里所寫的傳記主要運用司戴德日記為文本，圖文並茂厚達569頁。彼德·巴克（Peter Buck）研究康乃爾大學中國留學生創建的「中國科學社」時，也特別強調司戴德牽繫起康乃爾大學最早一批中國留學生的貢獻。Peter Buck, American Science and Modern China, 1876-1936 (Cambridge: Cambridge University, 1980), pp.89-90."}, {"type": "text", "text": "才華洋溢的司戴德在大學時代即是校刊編輯，他與《新共和》雜誌的友人對進步主義有股狂熱的追尋，在出任「美國亞洲協會」主席後，以他對於朝鮮、日本和中國的特殊經驗，使他有意改變《美國亞洲協會期刊》作為商人團體機關報的性質。在司戴德的主導下，1917年3月刊物改為《亞洲：美國亞洲協會期刊》（Asia: Journal of American Asiatic Association）（簡稱：《亞洲》〔Asia〕雜誌），主要介紹中國及亞洲國家的文化，兼及美國對遠"}, {"type": "text", "text": "東政治和文化的看法。改版後的《亞洲》雜誌，除了持續報導美國與遠東的商務和政治關係之外，尚介紹亞洲地理知識和歷史文化。這也是為何「美國亞洲協會期刊」的全稱編號最後出現於1916年12月號封面，此後封面不再印有「亞洲協會」的機關名稱，然而改版後刊物仍由「亞洲協會」贊助合作 $^{99}$ 。大戰結束後，《美國亞洲協會期刊》編輯部再次省視該刊物的走向和編輯方針，意圖轉型為一本以分享東西交化交流的文化期刊，並渴望成為歐美國家認識亞洲的一個媒介。"}, {"type": "text", "text": "97 Herbert David Croly, Willard Straight, \"introduction,\" XI."}, {"type": "text", "text": "98 該文主要選用司戴德的日記，並配有他親筆所繪的插圖和照片，內容止於1912年司戴德回到紐約。Asia: Journal of American Asiatic Association, 1920 Sep. to 1921 May，這9篇文章後來輯為專書出版，更名為：《司戴德在東方》（Willard Straight in Orient: with illustrations from his sketch-books, [New York: Asia Publishing Company, 1922]）。司戴德畢生文件收藏於康乃爾大學。"}, {"type": "text", "text": "1919年11月，編輯部宣布代表商人利益的「美國亞洲協會」組織正式退出該刊的管理和運作，其編務方向更加獨立，不受協會掌控。1919年12月，該刊再度改版並更名為《亞洲：關於東方的美國雜誌》（Asia: The American Magazine on the Orient），封面也沒有「亞洲協會」機關名稱，其報導內容更含括遠東和中東消息，但中國議題始終占有最多的篇幅。轉型後的《亞洲》刊物視司戴德為該刊的創始人，然而，不知為何，直到1925年「亞洲協會」的官方紀錄中，始宣告與《亞洲》雜誌出版社自1917年來的行政隸屬關係正式終止，刊物獨立運作 $^{100}$ 。不論如何，從行政上徹底轉型為獨立的文化期刊後，《亞洲》雜誌對近東和亞洲地區的藝術、文學、旅遊和風土特色的介紹更加不遺餘力，《亞洲》雜誌對中國人的心靈思想、中國文化特質、中國鄉村和農民，以及中國人如何看待世界等議題相當熱中 $^{101}$ ，當時尚未成名的賽珍珠（Pearl S. Buck）曾於該刊生動描繪中國女性的故事 $^{102}$ 。1930年3月邀請中國著名京劇表演藝術家梅蘭芳到紐約演出，引起轟動 $^{103}$ 。在1937年回顧在華40年的特刊中，該協會提到它的會員遍布整個亞洲地區，強調菲律賓、印度、中國以及整個亞洲是世界動盪局勢中的重要區塊，自期該協會扮演了美國人維護東方的任務 $^{104}$ 。"}, {"type": "text", "text": "「美國亞洲協會」在中國的會務並未停止，但影響力確不如作為早期商人團體時期。1922年4月，協會創始人富爾德病逝於華府，似乎也宣告了該協會標誌商人色彩的輝煌時代的結束，以及一戰後新時代的文化轉型。1920年起「亞洲協會」和紐約自然歷史博物館（American Museum of Natural History）合作，贊助博物學家和探險家安得思（Roy Chapman Andrews）率團遠赴中亞和蒙古考察；這支隊伍的重大發現，包括歷史上首次發現了恐龍蛋，為安得思本人和「美國亞洲協會」獲得很高的聲望 $^{105}$ 。1923年日本發生7.9級的關東大地震，該協會大力參與了美國紅十字會發起的救災捐款工作。對於一戰以後菲律賓的自治獨立運動，該會頗為同情，並組成研究小組向美國參議院領土與島嶼事務委員會（Committee on Territories and Insular Affairs）陳情 $^{106}$ 。"}, {"type": "text", "text": "John McCook Roots, “Chinese Head and Chinese Heart,” Asia: Journal of the American Asiatic Association, 1927, VOL XXVII, No. 2, Feb., 1927, pp. 91-97. Owen Lattimore, “The Chinese as a Dominant Race,” Asia: Journal of the American Asiatic Association, 1928, VOL XXVIII, No. 6, June, 1928, pp. 450-457. John Earl Baker,” Chinese Views of Truth and Justice,” Asia: Journal of the American Asiatic Association, 1928, VOL XXVIII, No. 7, July, 1928, pp. 532-539."}, {"type": "text", "text": "99 “The American Asiatic Association and History,” The American Asiatic Association, Printed for the Annual Meeting, Oct. 21, 1937, New York, 1937, pp. 28-29. 改版之初，該協會會員頗不知悉 “Asia” 與該組織的關連，編輯部於 1918 年 8 月 15 日起，又冠上 “Bulletin of the American Asiatic Association,” 的小字編號。"}, {"type": "text", "text": "102 Pearl S. Buck, “A Chinese Woman Speaks. A Story,” Asia: Journal of the American Asiatic Association, 1926, VOL XXVI, No. 4, April, 1926, pp. 304-310. Pearl S. Buck, “Chinese Woman Speaks.-II. A Story,” Asia: Journal of the American Asiatic Association, 1926, VOL XXVI, No. 5, May, 1926, pp. 413-419."}, {"type": "text", "text": "100 \"Some Of The Activities of the American Asiatic Association Since Its Organization,\" The American Asiatic Association, Printed for the Annual Meeting, Oct. 21, 1937, New York, 1937, p. 11."}, {"type": "text", "text": "103 \"The American Asiatic Association and History,\" The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 31."}, {"type": "text", "text": "101 Edward II. Hume, “Science and the Chinese Mind,” Asia: Journal of the American Asiatic Association, 1927, VOL XXVII, No. 7, July, 1927, pp. 562-567."}, {"type": "text", "text": "104 \"The American Asiatic Association and History,\" The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 32."}, {"type": "text", "text": "南京政府成立後，「美國亞洲協會」與它保持良好互動與中美友好。1928年南京政府成立後，由於中國政局不穩，美國駐北京大使館遲遲仍未搬遷，一直到1935年才遷到南京，但早在1931年該協會就積極主張大使館遷到南京。1928年該協會曾資助貝克（John Earl Baker）擔任中國交通部顧問，貝克是華洋義賑會賑災行動部主任，是美國人參與中國賑災中最有經驗的專家之一。1929年資助晏陽初所創辦的中華平民教育會，提升中國鄉村農民的識字率和教育文化水平；同年該協會派出代表戴維斯（O. K. Davis）參加在阿姆斯特丹舉辦的第五屆全球國際商會聯合大會，發表對中國事務的看法。1931年中國黃河大水患發生，該會在美國積極募款賑災。鑑於九一八事變後日本在東北的經濟壟斷和滿洲國的成立對美國商業利益造成的影響，「美國亞洲協會」再一次為半個世紀之前由他們一手推動的門戶開放政策用力發聲，要求美國政府向日本施加壓力，不得在東北實施經貿壟斷107。"}, {"type": "text", "text": "為了維持會務的永久運作和穩定經營，1929年「美國亞洲協會」成立終身會員制，共25名，終身會費100美元。同年該協會加入「美國聯邦商會」（The Chamber of Commerce）和國際商會會員，希望與這兩個組織的結合能發揮更大的影響。從會務報告看來，嚴格而言，自1926年該會在華商務活動與美國商會合併後，對華事務的發言權已遠不如「中國美國商會」，最後一次風光成果應屬1935年該協會參與了「全國對外貿易協會」（NFTC）所組織的聲勢浩大的「美國遠東經濟訪問團」（American Economic Mission to the Far East）的遠東之行（如前所述）。亞洲協會的文件宣稱共有12名活躍會員參與這次任務，並將此事列為年度重大成就 $^{108}$ 。"}, {"type": "text", "text": "1937年中國對日抗戰前夕，當時剛取得哈佛碩士學位在中國和日本進行考察研究的賴世和（Robert Karl Reischauer）在《亞洲》雜誌發表「日本戰爭之路」（Japan's Road To War）一文，對日本將發動一場侵略戰爭致使遠東深陷危機發出警世鐘 $^{109}$ 。不久日軍果真轟炸上海（1937年8月13日），40萬難民流離失所，9月「美國亞洲協會」紐約總部致電其會員上海美國商會主席普蘭特（W. H. Plant）——當時的上海國際救濟委員會主席（Chairman of the International Committee for the Aid of Chinese Refugees）協助籌款和搶救難民工作 $^{110}$ 。中國抗戰後宋美齡、林語堂曾在該刊發表文章，向國際宣傳國民政府抗戰的決心，並爭取美國人民支持中國政府。珍珠港事件發生後，《亞洲》期刊顯然受到戰爭影響無法定期發刊。1942年11月封面大字為“Asia”，小字加上“and the Americas”，有意以亞洲作為主體，聯結亞洲與美洲的文化橋梁。該刊因中國內外局勢動盪而無法正常運作，1946年國共內戰之際停刊，在華發行近50年。1946年1月發行的雜誌封底還是印著「由司戴德創立於1917年」（Founded in 1917 by Willard Straight）。"}, {"type": "text", "text": "107 \"Some Of The Activities of the American Asiatic Association Since Its Organization,\" pp. 12-14."}, {"type": "text", "text": "108 “The American Asiatic Association and History,” The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 32."}, {"type": "text", "text": "105 “The American Asiatic Association and History,” The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 29."}, {"type": "text", "text": "106 \"The American Asiatic Association and History,\" The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 31."}, {"type": "text", "text": "109 Robert Karl Reischauer, “Japan’s Road To War,” Asia: Journal of the American Asiatic Association, 1937, VOL XXXVII, No. 2, February, 1937, pp. 80-82。賴世和（1910-1990）於1939年獲哈佛博士學位，並在哈佛任教。1961-1966年出任美國駐日大使。他與知名漢學家費正清在哈佛合開東亞文明課程，可說是美國研究東亞文明的奠基者，1973年創辦哈佛大學日本研究所。"}, {"type": "text", "text": "小結"}, {"type": "text", "text": "由以上可知美國商人團體在中國的演進，從1898年美國「亞洲協會」中國（上海）分會的最早成立，到一戰期間成立「中國美國商會」，此後兩國商會組織中再精揀出更直接的「中美貿易委員會」，這一核心化過程也伴隨著中國進入國際商會組織，並且參與國際各種商業活動，同時1930年代後期中國愈來愈進入以美國為首的世界經濟市場的體系運作，對美經濟活動更與外交策略密不可分。在不同階段都說明了美國在華商人團體與政治權力的掛勾至為緊密，成立於1898年的「美國亞洲協會」事實上是開創了美國商人如何影響政治決策的傳統——推動門戶開放政策，後面則有「中國美國商會」踵繼其後，推動了1922年的「美國對華貿易法案」；美國商人團體在華活動的軌跡和演變，說明了從19末到20世紀商人利益團體如何影響對華政策的一種傳統特質之延續。"}, {"type": "text", "text": "就美國商人團體在中國的發展脈絡，「美國亞洲協會」創立的前15年主要以在美國本土大資本家為主，它們在中國市場主要仰賴中國買辦，在對華事務上主要聯合美國紐約和波士頓的美國本土資本家直接向美國政府施壓。到一戰時期的美國在華商人團體，則是由總部設在美國本土、分部設在中國條約口岸的跨國大企業自己發聲；它們在中國市場的影響力已完全由自己培育的專業經理人取代了中國傳統買辦，並且通過「中國美國商會」的組織動員大力介入美國對華政策。在1920年代中葉中國排外運動風起雲湧之際，「中國美國商會」過度保護美商僑民財產，要求美國政府軍事介入的作為，最初和美國政府對中國內部的政治判斷和政策走向發生短時間的扞格。由於激烈的排外風潮並未消褪，為了保護中國市場的持續開發，他們在1920年代後期轉而對中國民族主義的排外運動採取較退讓妥協的作法；這時期美國商會在中國各口岸的活動和董事名單，也具體呈現了美國企業所引入的現代化新式行業。"}, {"type": "text", "text": "成立於1898年的「美國亞洲協會」從早期作為商人利益團體，到一次大戰後的1920年代逐漸轉型為不具商業色彩的文化團體，在某種意義上它也和美國本土自一戰以後迅速成長的和平文化團體互相呼應，以「亞洲」作為跨國共同體的理想，標舉國際主義取代狹隘的民族主義作為解決國家關係的主導原則；在商業上則是主張自由貿易和開放的市場，堅信國家之間經濟聯繫的加深可以帶來繁榮與和平 $^{111}$ 。大戰之後的文化轉型也印證了華盛頓秩序下民間力量對遠東和平秩序的發聲正和政府力量相互推進。雖然國際競爭和衝突始終未歇，轉型後的「美國亞洲協會」通過文化傳播的力量致力於美國對東方的理解和亞洲區域的和平，頗有一種「共有亞洲」（A shared Asia）的遠大理念，並將此一理念付諸實踐行動。促成「美國亞洲協會」轉型的主要關鍵人物——具有豐富遠東經歷的司戴德當居功厥偉，他賦予《亞洲協會期刊》承擔促進亞洲和近東國家相互理解的領航責任，他所主導的理念深深影響了後繼者。一戰爆發後他侃侃而談美國如何拓展海外貿易以增進對世界的責任，並參與創辦《新共和》這份重要政論刊務，顯現他對進步主義價值的維護，而最後他作為一名軍人為他所奉獻的愛國信念而趕赴歐洲戰場卻不幸病亡。「美國亞洲協會」在中國的演變，歷經商人團體到文化組織，展現了中美關係中多元觸角和活絡的關係網絡。"}, {"type": "text", "text": "110 “The American Asiatic Association and History,” The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 18."}, {"type": "text", "text": "最後，中國加入國際商會組織或中美貿易委員會成立的時間，正值1930年代中國愛用國貨風潮鼎盛之際 $^{112}$ 。中國加入國際多邊或中美雙邊組織，熟稔歐美商會和國際金融事務的運作合作方式，理解國際各種新興企業和組織的經營模式，同時參與雙邊或多邊的非政府國際組織也展現了旺盛的國族主義企圖心。1930年代中國社會興起一股愛用國貨風潮藉以抵制外貨運動襲捲之際，同一時期中國卻努力參與國際商會組織的現象，兩者並不是一種矛盾的圖像，恰恰說明了1930年代中國藉由跨國商會活動呈現中國的國族身分認同，試圖以平等國家身分躋身國際經貿組織的交流意義。"}, {"type": "text", "text": "111 例如創始於1910年卡內基和平基金會（Carnegie Endowment for International Peace），在一戰以後會務迅速壯大。其他法治主義團體、國際主義和平團體、基督教團體等等，在一戰後更以倡導將美國的法治概念推廣到世界、戰爭非法化和世界和平等理想，並通過跨國活動來推行其主張。關於一戰以後美國本土非政府組織所倡議的跨國共同體理想和具體活動。詳見：王立新，《躊躇的帝國：美國崛起後的身分困惑與秩序追求，1913-1945》（北京：中國社會科學出版社，2015年），第6章，頁373-478。"}, {"type": "text", "text": "112 詳見：Karl Gerth, China Made: Consumer Culture and the Creation of the Nation, (Cambridge, Mass.: Harvard University, 2004). 中文版有：《製造中國：消費文化與民族國家的創建》（北京：北京大學出版社，2007）。"}, {"type": "note", "text": "2 像1960年代Thomas J. McCormick的代表論著，即是從經濟觀點論述美國在中國市場打造的非正式帝國。Thomas J. McCormick, China Market, America's Quest for Informal Empire, 1893-1901 (Chicago: Elephant Paperbacks, Ivan R. Dee, Publisher, 1967), pp. 77-103."}, {"type": "note", "text": "1 關於美國商會在中國的組織，成立之時稱 “American Chamber of Commerce of China”，但目前其官網則用 “American Chamber of Commerce in China”. 本文仍使用成立時的英文名稱 “OF” China。「中國美國商會」則為現在此一組織官網的中文名稱，特此說明。“American Chamber of Commerce of China: Its Inauguration in Shanghai,” Peking Daily News (1914-1917), Aug. 24, 1915."}, {"type": "note", "text": "3 勞羅斯（James John Lorence）的博士論文雖探討「美國亞洲協會」，但該文為1970年之作，且未使用中文材料，也未能討論1926年以後美國在華商會的發展。James John Lorence, “The American Asiatic Association, 1898-1925: Organized Business and the Myth of the China Market,” Ph. D. dissertation, University of Wisconsin, 1970."}, {"type": "note", "text": "4 據中國海關統計資料，1890年美國在華行號約32家，僑民約1,153人；1895年行號為31家，僑民增加到1,325人；1898年行號約43家，僑民突破2,000人（2,056人）。1899年第一次宣告對華門戶開放政策時，行號達70間，僑民2,335人。1900年儘管發生義和團排外事件，美國在華行號仍增加到81間，僑民則略減為1,908人，顯現一些美國僑民因義和團事件而撤離中國。該年在列強劃分中國勢力範圍之際，美國再度發布了第二次門戶開放政策。1901年八國聯軍之後清廷簽訂辛丑條約，這一年美國在華行號增加到99間，僑民增為2,292人。楊端六、侯厚培等，《六十五年來中國國際貿易統計》（國立中央研究院社會科學研究所專刊第4號，1931），頁143。 5 美華合興公司成立於1895年12月，由美國前俄亥俄州（Ohio）參議員布賴士（Calvin S. Brice）號召美國工商界人士，以獲取在中國建造鐵路、開礦和其他工業投資為目標所創立；成立時的股東包括鐵路界和金融界的大亨，如鐵路大王哈里曼（Edward H. Harriman）、花旗銀行和大通銀行的行長、美國前副總統莫頓（Levi Morton）、摩根公司（J. P. Morgan & Company）的一個合夥人及卡內基鋼鐵公司（Carnegie Steel Corporation）等。William R. Braisted, “The United States and the American China Development Company,” The Far Eastern Quarterly, Vol. 11, No. 2 (Feb., 1952), pp. 147-165."}, {"type": "note", "text": "9 Journal of the American Asiatic Association, July 25, 1898, pp. 1-2."}, {"type": "note", "text": "10 David M. Pletcher, The Diplomacy of Involvement: American Economic Expansion Across the Pacific, 1784-1900 (Columbia: University of Missouri Press, 2001), pp. 295-299."}, {"type": "note", "text": "6 The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Dec. 5, 1898."}, {"type": "note", "text": "7 James John Lorence, \"The American Asiatic Association, 1898-1925: Organized Business and the Myth of the China Market,\" pp. 34-38."}, {"type": "note", "text": "8 李恩涵，《中美收回粵漢路權交涉》，《中央研究院近史所集刊》，第1期（1969），頁149-215。"}, {"type": "note", "text": "11 布蘭德時任上海公共租界工部局助理祕書。布蘭德（J. O. P. [John Otway Percy] Bland）為英國作家和記者，於1883-1910旅居中國。1883年抵華任職海關，從漢口、廣州到北京總海關，1894-96擔任赫德私人祕書。1896年起任上海公共租界工部局助理祕書，同時擔任《泰晤士報》通訊員。1906年任職於「中英公司」（British and Chinese Corporation, BCC）北京辦事處代表。1910年因其反德言論與該公司政策不符而遭解僱。據說他到北京後，因其通"}, {"type": "note", "text": "曉漢語，而著名的莫里遜因不通中文，視其為競爭對手，最後使得布蘭德又被《泰晤士報》解僱而返回英國。布蘭德有關中國的著作有：J. O. P. Bland, Houseboat Days in China (1909, 1919)、Verse and Worse (1902) 等，其中最有名的兩本暢銷書應屬 China under the Empress Dowager (1910) 和 Annals and Memoirs of the Court of Peking (1914)."}, {"type": "note", "text": "中央研究院近代史研究所檔案館藏，《外務部檔案》02-20-002-01-009。關於本次博覽會的中國展示，可參閱：王正華，〈呈現「中國」：晚清參與1904年美國聖路易萬國博覽會之研究〉，黃克武主編，《畫中有話：近代中國的視覺表述與文化構圖》（台北：中央研究院近代史研究所，2003），頁421-475。"}, {"type": "note", "text": "12 Journal of the American Asiatic Association, No. 1, July 25, 1898, p. 2."}, {"type": "note", "text": "13 China Association Annual Report, 1898-1899, p. 22."}, {"type": "note", "text": "14 \"The American Asiatic Association,\" The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Aug. 1, 1898, p. 197."}, {"type": "note", "text": "16 趙祐志，〈躍上國際舞台——清季中國參加萬國博覽會之研究，1866-1911〉，《國立臺灣師範大學歷史學報》，第25期（台北：國立臺灣師範大學歷史系所，1997年），頁287-344。據該文研究，從1866年總理衙門首度受邀參加法國巴黎博覽會起，至1911年清朝覆亡為止，在短短的46年期間，共計收到超過80次以上的邀請。其中，清廷組團參加了13次，寄物參展6次，派員參觀11次。而1904年聖路易斯博覽會的經費，為在此之前歷次總和之三倍，其重要性自不待言。"}, {"type": "note", "text": "15〈美國賽會大臣巴蕾致外務部〉，1902年1月14日（光緒27年12月05日），"}, {"type": "note", "text": "17 梁啟超，《新大陸遊記》（台北：文海出版社，1967年版），頁19-20。梁啟超還於次日造訪赫欽士私宅，赫欽士提到義和團排外事件和政治動亂對美國棉"}, {"type": "note", "text": "20〈外務部收駐美大使梁誠函〉（光緒29年5月初10），中央研究院近代史研究所編，《中美關係史料·光緒朝五》（台北：中央研究院近代史研究所，1988），頁3542。"}, {"type": "note", "text": "花輸出業造成重大打擊，美國南方業棉花者已倒閉三之一，失業之勞傭數千云云，再次表達美國工業製造業對開闢海外市場的強烈企圖。同時，梁啟超對美國華爾街大托辣斯有所戒心，擔心美國這些美國國內的托辣斯「將演進為國際托辣斯，而受害最劇者必在我中國」。參見：本書緒章。"}, {"type": "note", "text": "18 梁啟超，〈滅國新法論〉，中央研究院近代史研究所編，《近代中國對西方及列強認識資料彙編》第五輯，第一分冊，第574-575頁。張忠棟，〈門戶開放政策在中國的反應〉，《美國研究》，第3卷第3、4期合刊（1973年12月），頁121-142。"}, {"type": "note", "text": "21 \"Some Of The Activities of the American Asiatic Association Since Its Organization,\" The American Asiatic Association, Printed for the Annual Meeting, Oct. 21, 1937, New York, 1937, p. 7."}, {"type": "note", "text": "19 吳翎君，《美國大企業與近代中國國際化》（台北：聯經出版公司，2012），頁83-84。（簡體版由北京社會科學文獻社發行，2014）。"}, {"type": "note", "text": "22 The American Asiatic Association, Printed for the Annual Meeting, Oct. 21, 1937, New York, 1937, p. 7."}, {"type": "note", "text": "23 張存武，《光緒31年中美工約風潮》（中央研究院近代史研究所專刊13，1966年初版）。Guanhua Wang, In Search of Justice, the 1905-1906 Chinese Anti-American Boycott (Cambridge, MA: Harvard University Asia Center, 2001)."}, {"type": "note", "text": "24 塔虎脫首次訪日時間，就在美國為調停日俄戰爭而召開的樸茨茅斯會議（The Portsmouth Conference）之前一個月，簽署一份備忘錄（Taft-Katsura Agreement）。1907年再度訪日，簽署「日米紳士協議」（The Gentlemen's Agreement）非正式協定，對移民問題做出諒解。但簽約之後，美國西岸的排日運動並未減緩，他們希望對已入境的日本勞工採取限制的措施，美國國會最後也未能批准「日米紳士協議」，其結果加深日本對美國和東西方世界的不安感，促進日本內部「泛亞主義者」（Pan-Asianist）的形成。1924年美國又制定更嚴格的限制移民法，嚴格限定日本人和中國人的移民。Akira Iriye, Across the Pacific (New York: Harcourt, Brace & World, Inc., 1987), pp. 115-116."}, {"type": "note", "text": "25 \"Secretary Taft's visit to Shanghai,\" American Association of China (Shanghai. Press in 1907)."}, {"type": "note", "text": "26 Journal of the American Asiatic Association, Feb., 1907, pp. 1, 3. \"Annual Report"}, {"type": "note", "text": "of the Secretary,\" Oct. 17, 1907, Journal of the American Asiatic Association, Nov., 1907, p. 298."}, {"type": "note", "text": "27 Osborne Howes, “Japanese Commercial Development,” Journal of the American Asiatic Association, Jan., 1907, No. 12, pp. 368-374. 該文為在波士頓商會（Commercial Club of Boston）的演講。"}, {"type": "note", "text": "28 喬治·F·肯南（George F. Kennan）原著，雷建鋒譯，《美國大外交》（American Diplomacy, 1900-1950）（北京：社會科學文獻出版社，2013），頁"}, {"type": "note", "text": "29 James John Lorence, “The American Asiatic Association, 1898-1925: Organized Business and the Myth of the China Market,” pp. 286, 304."}, {"type": "note", "text": "30 “The American Asiatic Association and History,” The American Asiatic Association, Printed for the Fortieth Annual Meeting, Oct. 21, 1937, New York, 1937, p. 6."}, {"type": "note", "text": "31 “A Large Field for the Association,” Journal of the American Asiatic Association, April, 1912, p. 69."}, {"type": "note", "text": "32 1907年7月，司戴德建議在排除日本的參與下和英國資本家合作共同開發東北鐵路。次年，哈里曼寫信給國務卿魯特請求讓司戴德特地返美，與美國資本家共商向中國提供借款，以開發東北農業和建造鐵路計畫。而在此期間，司戴德已先和唐紹儀簽訂一筆2千萬元借款的備忘錄，成立中美合作的東三省銀行，並建造一條從齊齊哈爾到瓊琿的鐵路。George Kennan, E. H. Harriman, a Biography (Boston and New York: Houghton Mifflin Company, 1922), pp. 24-26. 楊凡逸，〈唐紹儀與近代中國的政治外交，1882-1938〉（台北：國立臺灣師範大學歷史研究所博士論文，2010）。"}, {"type": "note", "text": "33 施肇基，《施肇基早年回憶錄》（台北：傳記文學出版社，1985），頁32。施肇基於1902年取得康乃爾大學文學碩士，回憶錄中提到1926年該班同學在校舉行第25週年紀念會，以他及司戴德兩人較有聲譽乃捐款設置「施司獎學金」（Sze-Straight Fund）。Herbert David Croly, Willard Straight (New York:"}, {"type": "note", "text": "Macmillan Company, 1924), pp. 54-55 則提到司戴德在 1901 年到中國任職海關前曾向正在康乃爾學習的施肇基請教一些中國海關事務，司戴德也曾帶領施肇基參加大學俱樂部活動。"}, {"type": "note", "text": "34 Herbert David Croly, Willard Straight (New York: Macmillan Company, 1924), pp. 417-418."}, {"type": "note", "text": "35 \"Some Of The Activities of the American Asiatic Association Since Its Organization,\" The American Asiatic Association, Printed for the Annual Meeting, Oct. 21, 1937, New York, 1937, p. 8."}, {"type": "note", "text": "36 “The European War and our Opportunity in Foreign Trade” (Published 1914)，所發表的演講文，共15頁。"}, {"type": "note", "text": "37 \"American Business in Asia,\" Journal of the American Asiatic Association, Nov.,"}, {"type": "note", "text": "1914, pp. 310-313."}, {"type": "note", "text": "38 \"The Commercial Future in China,\" Journal of the American Asiatic Association, Dec., 1914, pp. 335-338."}, {"type": "note", "text": "39 \"China's Cotton Industry,\" from the N. C. Daily News, Journal of the American Asiatic Association, Nov., 1916, pp. 304-306."}, {"type": "note", "text": "40 \"The Manufacture of Cotton in China,\" Journal of the American Asiatic Association, Dec., 1916, pp. 335-340."}, {"type": "note", "text": "41 Julean Arnold, “American Trade Opportunities in China,” Journal of the American Asiatic Association, Dec., 1916, pp. 333-335. 阿諾德為大力倡導東方和中國貿易重要性之要角，不惟在各種場合一再呼籲美國政府端出更積極的對華商業政策，並在《美國亞洲協會期刊》上撰文，或接受該刊訪談，闡釋其見解。阿諾德於1914-1917任美國駐華和駐日商務幫辦。"}, {"type": "note", "text": "42 Jeremiah W. Jenks, \"China, American Silent Partners,\" Journal of the American Asiatic Association, Jan., 1917, pp. 363-367."}, {"type": "note", "text": "43 Frank F. Davis, \"Broadening Our Chinese Trade,\" Asia: Journal of the American Asiatic Association, March, 1917, pp. 41-43."}, {"type": "note", "text": "44 該文提到上海總商會，但並未指出是誰，由合影始知是總商會會長朱葆三。“The Trade of Asia, An American-Asiatic Business Programme,” interview with William H. Williams, Vice-President of Gaston, Williams & Wigmore, Inc., Asia: Journal of the American Asiatic Association, April, 1917, pp. 122-124.〈總商會歡宴美國官商〉，《申報》（上海），1917年1月15日，第3張。"}, {"type": "note", "text": "45 New York Times, Feb. 24, 1916. 事實上，早在大戰爆發之初，中美兩國政府曾合作開通太平洋航線的合作。詳見本書第三章。"}, {"type": "note", "text": "46 \"The Trade of Asia, An American-Asiatic Business Programme,\" pp. 122-124."}, {"type": "note", "text": "47〈總商會歡宴美國官商〉，《申報》（上海），1917年1月15日，第3張。"}, {"type": "note", "text": "48 “Profits on Investment in China,” “The War and the Commerce of the Far East,” “The Business Policy of Learning Chinese,” July, 1917, Asia: Journal of the American Asiatic Association, 三文刊於頁378-386."}, {"type": "note", "text": "49 澉澤榮一於 1902 年訪美，被美國媒體稱為「日本的摩根」（J. P. Morgan of Japan），當時他名下已有四十餘間公司、銀行和鐵路事業。New York Times, June 14, 1902."}, {"type": "note", "text": "1917, p. 163."}, {"type": "note", "text": "50 \"Our Asiatic Allies,\" Asia: Journal of the American Asiatic Association, May,"}, {"type": "note", "text": "51 “The Trade of Asia: An Objection to American Co-operation with Japan in China,” Asia: Journal of the American Asiatic Association, June, 1917, pp. 299-300."}, {"type": "note", "text": "52 “Why China Enters the War,” Asia: Journal of the American Asiatic Association, April, 1917, p. 163."}, {"type": "note", "text": "53 吳翎君，《美國與中國政治》（台北：東大圖書公司，1996），頁 13-25。"}, {"type": "note", "text": "54 “China’s Part in the War,” Asia: Journal of the American Asiatic Association, Oct., 1917, pp. 644-646."}, {"type": "note", "text": "55 Julean Arnold, “Chinese Products of Interest to American,” in Julean Arnold eds., Commercial Handbook of China, Vol. II, 274. 該文也說據美國駐大連領事威廉斯的估算，東北年產150萬到200萬美噸的大豆作物，其中可能有至少100萬美噸輸往日本。"}, {"type": "note", "text": "56 “The Worst Disaster of the War,” Asia: Journal of the American Asiatic Association, April, 1918, p. 273."}, {"type": "note", "text": "59 “An American Chamber of Commerce,” The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Jun. 12, 1915. p. 793. 刊載了正式成立大會之前的聚會討論，這些企業及其代表如下：中日貿易公司（China and Japan Trading Co.）的代表F. A. Fairchild、大來公司（Robert Dollar Co.）的Harold Dollar、美國鋼鐵公司（U.S. Steel Products Co.）的J. W. Gallagher、豐泰洋行的J. H. McMichael、太平洋輪船公司（Pacific Mail Steamship Co.）的O. H. Ritter、美孚石油（Standard Oil Co.）的C. H. Blake、英美煙公司（British-American Tobacco）的Thomas Cobbs、梅西公司（R. H. Macy）的N. T. Saunders、中國橡木進出口公司（China Import and Export Lumber Co.）Carl Seitz等人。"}, {"type": "note", "text": "57 “An American Chamber of Commerce,” The North-China Herald and Supreme Court & Consular Gazette, Shanghai, May 22, 1915, p. 537. 首任主席為 H. H. Girardet，祕書長為 F. J. Norbury。目前此一組織的情況可參見官方網站 http://www.britishchambershanghai.org/en/about-history（2015年07月24日下載）。"}, {"type": "note", "text": "58〈萬國商會歐戰後大會記〉，《申報》，1919年3月27日，第3張。該文為針對戰後萬國商會如何解決上海口岸淤塞問題。「萬國商會仍為租界中必要之機關俾討論關於萬國利益之問題，而執行國際管理部關於浚浦與領港等事之職權。」戰後各國代表共聚討論上海港開挖方案。"}, {"type": "note", "text": "60 AmCham Shanghai官方網站，https://www.amcham-shanghai.org/en/about-amcham（2015年07月24日下載）。"}, {"type": "note", "text": "61 First Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, Aug. 18, 1916, pp. 1-2, 52-57."}, {"type": "note", "text": "64 “An American Chamber of Commerce Formed In Hankow,” Millard’s Review of the Far East (1919-1921), Apr. 3, 1920, p. 245."}, {"type": "note", "text": "65 Second Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, April, 1918, pp. 18-21. “Chinese Chamber of Commerce Entertains Americans,” Millard's Review of the Far East (1917-1919), Apr. 20, 1918，據該報的報導此次聚會時間為4月15日。"}, {"type": "note", "text": "62 Second Annual Report of the Proceedings of the Executive Committee of American Chamber of Commerce for the Year Ending, April, 1918, p. 1-3, 5. 會員名錄見該書，頁114-120。"}, {"type": "note", "text": "63 The American Chamber of Commerce at Tientsin—a Progressive Organization, Millard's Review of the Far East (1917-1919), May 4, 1918, p. 358."}, {"type": "note", "text": "66 \"Americans Entertain Chinese: Chamber of Commerce,\" Millard's Review of the Far East (1917-1919), Sep. 21, 1918."}, {"type": "note", "text": "67 \"The China Trade Act aid for American Firms,\" South China Morning Post, Oct. 4, 1922."}, {"type": "note", "text": "68 U.S. Commerce Chambers in China Form a Central Organization, The Weekly Review (1922-23), Oct. 28, 1922, p. 304. \"American Chamber of Commerce: Common Association Formed in Shanghai,\" The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Oct. 28, 1922, p. 304."}, {"type": "note", "text": "69 \"New American Combination: American Association to Unite with the Chamber of Commerce,\" The North-China Herald and Supreme Court & Consular Gazette (1870-1941), Dec. 4, 1926, p. 451."}, {"type": "note", "text": "71 \"American Chamber Of Commerce Holds Its Annual Meeting And Elects Directorate for Year,\" The China Press, Apr. 27, 1927."}, {"type": "note", "text": "72 事實上就在美國商會開會之前，鮑威爾收到來自華府記者訊息，美國政府宣稱除了保護美國在華僑民的生命財產安全無虞之外，反對軍事介入中國事務。John B. Powell, My Twenty Five Years In China (The Macmillan Company, 1945), pp. 165-167."}, {"type": "note", "text": "70 “American Chamber Of Commerce Holds Its Annual Meeting And Elects Directors for Year,” The China Press (1925-1938), Apr. 27, 1927. 刊出此屆新董事名單。"}, {"type": "note", "text": "73 \"Nationalist Government Aiming Criticisms Against Activities Of The American"}, {"type": "note", "text": "Chamber of Commerce,\" The China Press (1925-1938), Aug. 30, 1927."}, {"type": "note", "text": "74 Kellogg to MacMurray, Jan. 28, 1927, FRUS, 1927, Vol. II, p. 61. 關於「上海中立化」問題，詳見：吳翎君，《美國與中國政治》（台北：東大圖書公司，1996），第5章，頁205-216。"}, {"type": "note", "text": "75 Warren I. Cohen, American's Response to China (New York: Columbia
