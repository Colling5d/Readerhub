spectacles into an experimental montage. A kaleidoscopic montage in which all pictorial elements were arranged in a center-periphery mode gained popularity in mass media. Photomontage, “the fragmentation of reality,” as Peter Burger puts it, became a metaphor for the fragmentation of modern life.351 Collages of multiple photographic copies of architectural forms were very popular in mass media.A collage titled “The Metropolis” perfectly reflected the shock and fragmented visual experiences of urban architecture. In Pictorial Weekly, Zhuang Lijian 莊禮建made a collage of double prints of a tall ladder against a high-rise building, displaying the exquisite structure of the modern architecture in the 1930s (Fig.5.11).352 In his entry for a design photography competition held by the photographic magazine Changhong in 1936, Gu Zhibin 顧志斌 deployed a close-up perspective to represent the steel beams and architectural components of the Garden Bridge, then duplicated the copy and made a mirror image.353 Viewers had an immersive visual experience when they looked at montages. The photomontage has been developing within a complex and rich urban experience. Qin Tailai 秦泰來 (1905-?), who specialized in photographing film stars in Shanghai, was good at juxtaposing the modern women with the modern city. In The Young Companion, he published his experimental photomontage titled “Photo Designs:A New Way of Assembling Photographs into Artistic Designs”.354 The periphery of the montage shows several small montages of skyscrapers, clocks, female bodies and paper-cut silhouettes; the central kaleidoscopic montage displays a woman with a big smile against pine trees with a center-periphery mode (Fig.5.12). The montage is an assemblage of diverse popular visual elements in the pictorials: modern woman, the Western clock, and the high-rise building was reconfigured into an allegorical montage of the metropolis."}, {"type": "text", "text": "Beyond the colonial legacy, the thriving mass media in Shanghai embraced the transformation from the panoramic view to a montage of assembled fragmented images.355 In the 1930s, Shanghai left-wing artists drew on the works of George Grosz (1893-1959) and John Heartfield (1891-1968), both members of Berlin Dada. Zhang Guangyu, for example, transformed earlier photomontages closely associated with the popular culture into satirical works with deep cultural and political implications, which transformed photomontage into a powerful medium to depict reality and reshape the human perception of the world.356 Grosz, who emigrated to the US in 1933, made a creative photomontage entitled “American Landscape.”357 His artwork had been well known in China since Lu Xun's translation of Was Peterchens Freunde erzählen (What Peterkin’s Friends Say) which included drawings by George Grosz. In the 1930s,Shanghai artists drew a lot of influence from Grosz’s work due to his reputation in left-wing circles in both China and Japan.358"}, {"type": "text", "text": "The April 1934 issue of Modern Sketch published a photomontage titled “Shanghai Landscape” (Shanghai Fengjing 上海風景) (Fig.5.13). 359 The artist intentionally reconfigured several fragmented bodily images into a composite. The photomontage is put against a neutral blank background. Several gendered images were superposed on each other: a modern man’s face, a female body in swimming suit, female legs with silk stockings, high heels, breasts, a modern dress; some urban cultural symbols: mah-jong,lottery tickets, cigarette boxes, a drink bottle, and a tire are scattered around; the gun and a distorted face that appears to have been cut from film posters; an Indian appears at the bottom right of the image. The assemblage of the fragments in mass print reflects the hybridity and dynamism of Shanghai culture."}, {"type": "text", "text": "A composite named The Typical Chinese Person (Biaozhun zhonguoren 標準中國人) in Modern Sketch (shidai manhua 時代漫畫), 1936 signifies a shift from superficially entertaining representations to deep satire (Fig.5.14). 360 The artist employed the cut-and-paste approach to depicting a “typical Chinese”: he wears a Western hat and Chinese dress, hugs a nude sculpture and carries a basket on his back containing the Confucian classics, Peking opera, temples and a bronze ding (ancient ceremonial cauldron), all symbolizing the heavy burden of the nation. He is suffering the airstrikes and attacks from the tanks, but his sword is a stage prop from Peking opera. The assemblage of the fragmented images is a metaphor for the weak nation,which had suffered armed invasion by foreigners, and his terrified face with sealed month suggests the country is unable to defend itself. The 1936 photomontage satires the policy of “nonresistance” (bu dikang 不抵抗) toward Japan of Chiang Kai-shek 蔣介石(1887-1975), showing the strong opposition from the left-circle artists in Shanghai."}, {"type": "text", "text": "The techniques of collage and montages in the 1930s characterized by modernist exploration went in a different direction from Lang Jingshan's composite skills, signifying a transition from traditional pictorialism to modernist exploration. Lang's composite photographs usually have a fixed theme, but the modernist photomontage encourages the viewers to explore the multiple implications by themselves. As a sophisticated photographer, Lang also used his skill in compositing to combine several photographs into a complete image. For example, in a 1933 composite, he juxtaposed a photograph of a reclining female nude with a view of troops marching that was probably cut from a newspaper, suggesting the country is suffering the military incursion after Mukden Incident in 1931 (Fig.5.15).361 The depiction of femininity and its allegory with the motherland suggests a bonding that the photographer attempted to enhance. The patriotic sentiments that Lang tried to convey are obvious in this composite."}, {"type": "text", "text": "The montage of “The Typical Chinese Person” with many fragmented visions as a metaphor for the Chinese modernity contains many politicalized implications. These two kinds of the photographic composite were both developing in response to the political turmoil in the 1930s. The collage of the new sensations of the city life and the satirical montage for politics and society contributed to the modernist photographic experiments in the 1930s. The upcoming war brought the modernist photography an abrupt end. However, the 1930s photographic experimentation remains one of the richest in the history of Chinese photography."}]}, {"id": "concl", "title": "Conclusion", "paras": [{"type": "title", "text": "Conclusion"}, {"type": "text", "text": "Conclusion"}, {"type": "text", "text": "The dissertation discusses the ways in which Chinese amateur photographers embraced new photographic technology and invented local photographic vocabulary from 1900 to 1937. As one of the greatest technological achievements of the nineteenth century, photography simultaneously symbolized modernity and made it possible. In the context of Republican China, the dual powers of photography––to document the social turmoil and to rejuvenate Chinese art––made multilayered connections among a technological novelty, an emerging modern nation, and the transformative art world."}, {"type": "text", "text": "Chinese visual modernity in the first half of the twentieth century was particularly multilayered. In early twentieth-century China, the new generation of intellectuals saw photography as one of the achievements of “Western” modernization, treating it as a symbol of scientific modernity. Don Slater argued that photography brings modernity to a culminating point in that the means of representing the world, and the means of knowing it, are brought together within a single and unified technological vision. 362 Embracing and adapting new Western technologies was central to Chinese modernization. The rapid development of the modern Chinese printing industry and the great reproducibility of photography brought images to wide audiences in a fast,immediate, and inexpensive way. 363 A variety of textual and visual commodities were obtainable by urban dwellers in the Republican period. China had been brought into the “single and unified technological vision” with the introduction of photography in the mid-nineteenth century."}, {"type": "text", "text": "Within the growing industrial culture, the camera became a metaphor for mechanical ways of seeing. The camera gaze connected the modern vision with power,promoting the establishment of a hierarchical system. 364 Since the late nineteenth century, the Chinese confronted the gaze of demonstrating power and surveillance, but in return, the gaze aroused an emerging subjectivity. The shocking, eye-opening visual experience, as Laikwan Pang argued, was refracted through a distorting mirror,promoting Chinese to see their new but fragile selves. The Chinese, as the viewing subject rather than the object of being seen, acquired an alluring yet threatening sense of identity that was not available before.365"}, {"type": "text", "text": "For a long time, photography was a symbol of Europe-American modernization.So, when did the Chinese had the desire to represent the rapidly changing time and space in China? In the early twentieth century, the easy-to-use portable camera greatly enhanced photographers’ mobility, stimulating the desire to see and know the world.The “desire to photograph” refers to a demand to represent fugitive nature rapidly and massively.366 After the 1911 revolution, the modern art landscape was developing, and new intellectuals and urban bourgeoisie who distanced themselves from the old regime sought a new medium to record their modern experience. The affordability of Kodak portable cameras drove an increasing number of enthusiasts to employ photography to document their everyday life and self-expression."}, {"type": "text", "text": "In addition to viewing photography as a symbol of scientific modernity, Chinese intellectuals and artists consciously adapted the idioms of Euro-American artists into local artistic expressions. Many photographs in the 1920s and 1930s highlighted the role of photography in a composed, complex conception of modernity in China.Traditional pictorialism that was characterized by the painterly subjects elevated photography as fine art. The pursuit of “Chinese-ness” in the 1930s ran parallel to the rising nationalist sentiment. Meanwhile, some art photographers consciously displayed the medium’s natural strength, which means rendering of abstract form, i.e., a step toward modernist art. Drawing the inspiration from European-American photographers,several serious amateur photographers based in Shanghai showed talented attempts at modernist photography, although they only actively created in a transient period,marking a distinctive style with traditional pictorialism."}, {"type": "text", "text": "Photography intersected the transformation of vision, knowledge and the modern art world in 1930s China. As a fine-art form, it manifested a diversity of styles and subjects reflecting the struggles and exploration among the 1930s Chinese artists.Within the deteriorating situation in the mid-1930s China, many Chinese photographers expressed the sentiments of national salvation in their works. Compared with the other art forms, photography had more advantages to mobilize the masses since its great reproducibility. The upcoming war encouraged more and more photographers saw the nation and themselves in a national frame."}, {"type": "text", "text": "After the outbreak of the Second Sino-Japanese War, photographs were used as a significant tool for arousing public sentiment. A new genre of photography known as “red photography” (hongse sheying 紅色攝影) was established during the war. “Red photographs” focused on dramatic moments in the battlefield that would arouse patriotic sentiment. As Eliza Ho observes, Sha Fei’s wartime photographs still show high artistic standards because he used to be a fine art photographer before the war.367 Sha Fei associated the sophisticated photographic skills he learned in Shanghai with the new ideology, developing photography into a visual tool to construct a collective memory of the war."}, {"type": "text", "text": "The Japanese invasion brought many explorations of modern art and culture to an abrupt end. However, there were still many non-official photographic exhibitions and societies in Shanghai during Shanghai's lone islet period (gudao shiqi 孤島時期) (1937-1941). For example, Lang Jingshan held two exhibitions in Shanghai in 1939 and 1941, showing photographs taken in Sichun, Yunnan province, when he fled to Southwest China after the bombings on the coast in 1937. He refused an invitation from his friend Chu Minyi, who was an amateur photographer in the 1930s and a high official in the Wang Jingwei 汪精衛 (1883-1944) puppet government in Nanjing, to join in his collaboration with the Japanese. 368 The photographs in the exhibitions became a window for Shanghai to understand the interior of China. Photography offered a radical means of documenting the boundaries of the nation. During wartime, this depiction was imbued with more significant meaning. Lang’s photographic exhibitions in wartime Shanghai brought new subjects such as exile, displacement, and the national landscape into the history of Chinese visual culture."}, {"type": "text", "text": "“All fixed, fast-frozen relations, with their train of ancient and venerable prejudices and opinions, are swept away, all new formed ones become antiquated before they can ossify. All that is solid melts into air…” 369 The assertion in the Communist Manifesto of 1848 written by Marx and Engels shows that change, rather than stasis, would become normal in modern society, and such transformations would reshape the means of production, consumption, and circulation. 370 Four decades later, the first Kodak camera was invented in the US, and soon made its way to Europe, Asia and the rest of the world. The explosive development of photography in the late nineteenth and early twentieth centuries bore witness to modernization and also became a driving force for modernization. The emergence and development of amateur photography gave rise to the complex conception of multiple modernities in Republican China."}]}, {"id": "biblio", "title": "Bibliography", "paras": [{"type": "title", "text": "Bibliography"}, {"type": "text", "text": "Bibliography Ai Shu 艾姝. “Minguo chuqi tianjinshi meishuguan de meishu yingzhan yu meishu sheying wenhua de jiangou 民國初期天津市美術館的美術影展與美術攝影文化的早期建構 [Early Republican Art Photography Exhibition in Tianjin Municipal Art Museum and the early construction of art photographic culture],” Sichuan daxue xuebao 四川大學學報 [Journal of Sichuan University], no.2 (2014): 152-160.Aisin-Gioro Puyi. From Emperor to Citizen: The Autobiography of Aisin-Gioro Puyi.Translated by William J. F. Jenner. Peking: Foreign Language Press, 1964.Anderson, Benedict. Imagined Communities: Reflections on the Origin and Spread of Nationalism. London: Verso, 2006.Andrews, Julia F. “Traditional Painting in New China: Guohua and the Anti-Rightist Campaign.” The Journal of Asian Studies 49, no. 3 (August 1990): 555-577.Albers, Patricia C., and William R. James. “Travel photography: A methodological approach.” Annals of Tourism Research 15, no.1 (1988): 134-158.Allen, Joseph R. “Picturing Gentlemen: Japanese Portrait Photography in Colonial Taiwan.” The Journal of Asian Studies 73, no.4 (November 2014): 109-104.Arnall, January Parkos. “‘Adventures into Camera-Land’: Women, Image-Making,and the Social Environment of Chicago Camera Clubs at the Turn-of-the-Century.” Ph.D. diss., Claremont Graduate University, 2009.Barber, Martyn. A History of Aerial Photography and Archaeology. Swindon: English heritage, 2011.Barthes, Roland. Camera Lucida: Reflections on Photography. Translated by ion of Black and White Photographic Exhibition in 1934.Fig.3.12: Wu Yixian 吴印咸, Power, 1930.Fig.3.13: Wu Yinxian, Roar! 1935.Fig.3.14: Li Hua 李桦, Roar! China, 1935.Fig.3.15: Wu Yinxian 吳印咸, The Water Girl (jishui zhinv 汲水之女), Black and White Photo Album, 1935.Fig.3.16: Sha Fei 沙飛, A Wagoner, 1935-1937, courtesy of Wang Yan.Fig.3.17: Sha Fei, Crying of life, 1935-1937, courtesy of Wang Yan.Fig.3.18: Sha Fei, begging even not permitted, 1935-1937, courtesy of of Wang Yan.Fig.3.19: Sha Fei, Diligent and thrifty granny, 1935-1937, courtesy of Wang Yan.Fig. 4.1: Jin Shisheng, the Customs House, ca.1930s, courtesy of the estate of Jin Shisheng.Fig. 4.2: Jin Shisheng, Broadway Mansions under Construction, Shanghai, 1934,courtesy of the estate of Jin Shisheng.Fig.4.3: Chen Chuanling 陳傳霖, Modern Architecture, Black and White Photo Album, 1934.Fig.4.4: Ao Enhong 敖恩洪, Lines, Black and White Photo Album, 1934.Fig.4.5.1,4.5.2: Jin Shisheng, Playing the lottery, Shanghai, early 1930s, courtesy of the estate of Jin Shisheng.Fig.4.6: Jin Shisheng, Ruins in the aftermath of an airstrike during Shanghai war,1932, courtesy of the estate of Jin Shisheng.Fig.4.7: Karl Blossfeld, Adiantum pedatum, print date: 1924-32.Fig.4.8: László Moholy-Nagy, Berlin Tower, 1928.Fig.4.9: Jin Shisheng, the labors working on the dock in Qingdao, 1932, courtesy of the estate of Jin Shisheng.Fig.4.10: Ad of Kodak Brownie, “Meishu bailangni jingxiang” 美術白朗尼鏡箱[Fine Art Camera Brownie],” Chinese Kodarkery 2, no.12 (1931): 1.Fig.4.11.1: Zhao Zuyao 趙祖耀, Luo Bonian 駱伯年and his colleagues in commercial bank traveling in Lanxi, Zhejiang, ca.1930s, courtesy of the estate of Luo Bonian Fig.4.11.2: the back of the photograph captioned with the words: “On the way to Dongyuan, We enjoyed the landscape” (Qu dongyuan de tuzhong, youshanwanshui de women 去洞源的途中，遊山玩水的我們) ca. 1930s, courtesy of the estate of Luo Bonian Fig.4.12: Luo Bonian, “the Spring of the River” ( Dahe zhichun 大河之春), ca.1930s,courtesy of the estate of Luo eriment, Xu Xusheng's Diary of the Northwestern Journey (Xu Xusheng xiyou riji 徐旭生西游日記).Fig.4.26: Zhuang Xueben 莊學本, A young man of Qiang nationality was crossing the river with rope, 1934.Fig.4.27: Zhuang Xueben, a bird’s-eye view of Min River, 1934.Fig.4.28: Zhuang Xueben, “God Dance” (Tiaoshen, 跳神), Lifan, Sichuan, 1934.Fig.4.29: Zhuang Xueben, “sipped” wine (zajiu 咂酒), 1934.Fig.4.30: Jin Shisheng 金石聲, “Qingdao yipie 青島一瞥 [A glimpse of Qingdao],” Chinese Kodakery 3, no.9 (1932): 6.Fig.4.31: Lang Jingshan 郎靜山, Salt Well in Langzhong,阆中, Sichuan, 1938, courtesy of Huang Jianpeng.Fig.4.32.1: Liangyou Nationwide Tour (Liangyou quanguo kaocha tuan 良友全國考察團) consisted of Liang Desuo 梁得所 (1905-1938), the chief editor of Liangyou,and several photographers such as Ouyang Pu 歐陽璞, Situ Rong 司徒榮. China as She Is: A Comprehensive Album (Zhonghua jingxiang 中華景象) (Shanghai:Liangyou’s publishing company, 1934), courtesy of Chengdu Library.Fig.4.32.2: “The White Pagoda”, China as She Is: A Comprehensive Album (Zhonghua jingxiang 中華景象) (Shanghai: Liangyou’s publishing company, 1934),courtesy of Chengdu Library.Fig.4.33: The Team of Education Ministry’s Art and Relics 教育部藝術文物考察團,Wang Ziyun 王子雲 in Shunling Mausoleum 順陵, 1941, Xi’an, Shaaxi Province.Fig.5.1: Liu Bannong, Pond and Light of the Early Morning Sun, ca.1920s Fig.5.2.1: Lang Jingshan 郎静山, the first negative of Majestic Solitude (Chunshu qifeng 春樹奇峰), 1934.Fig.5.2.2: Lang Jingshan, the second negative of Majestic Solitude, 1934.Fig.5.2.3: Lang Jingshan, Majestic Solitude, the composite photograph, 1934 Fig.5.3: Lang Jingshan, Draw Water in the Morning (Xiaoji qingjiang 晓汲清江),1934.Fig.5.4: Shao Woyun 邵臥云, “Mubo 暮泊 [A ship in the twilight],” Zhonghua shying zazhi 中華攝影雜誌 [China Photographic Journal], no.3 (1932), 99.Fig.5.5: Lu Shifu 盧施福, Yellow Mountain, ca.1930s.Fig.5.6: Lu Shifu, Climbing Huang Mount, ca.1930s.Fig.5.7: Jin Shisheng 金石聲, Slender West Lake, 1932, gelatin silver print, courtesy of the estate of Jin Shisheng.Fig.5.8: Jin Shisheng, Street of Suzhou, ca.1930s, courtesy of the estate of Jin Shisheng.Fig. 5.9: Jin Shisheng, Self-portrait in his dormitory at Tongji University, Shanghai,1936, gelatin silver print, courtesy of the estate of Jin Shisheng.Fig.5.10.1: Luo Bonian 駱伯年, the palms, 1930s, courtesy of the estate of Luo Bonian.Fig.5.10.2: Luo Bonian, photomontage of the palms, 1930s, courtesy of the estate of Luo Bonian.Fig.5.10.3: Luo Bonian, photomontage of the palms, 1930s, courtesy of the estate of Luo Bonian.Fig.5.11: Zhuang Lijian 莊禮健, “Sheying tu’an 攝影圖案 [Photo design],” Sheying huabao 攝影畫報 [Photographic Pictorial ] 11, no.18 (1935): 19.Fig.5.12: Qin Tailai 秦泰來, “Zhaopian meishu tu’an 照片美術圖案 [Photo Designs:A New Way of Assembling Photographs into Artistic Designs],” Liangyou, no.113 (1936): 18.Fig.5.13: Anonymous, “Shanghai Landscape,” Modern Sketch, no.1 (1934): 23.Fig.5.14: Anonymous, “The Typical Chinese Person,” Modern Sketch, no.25 (1936):20.Fig.5.15: Lang Jingshan, nude, The Modern Miscellany 時代畫報4, no.5 (March 1933): np."}]}, {"id": "notes", "title": "Notes", "paras": [{"type": "title", "text": "Notes"}, {"type": "title", "text": "导论"}, {"type": "note", "text": "1 Feng Zikai 豐子愷, \"Meishu de zhaoxiang 美術的照相 [Fine art Photography],\" in Zhongguo jindai sheying yishu meixue xuan 中國近代攝影藝術美學文選 [the essays of Chinese modern photographic aesthetics], edited"}, {"type": "note", "text": "2 “Kodak LTD., Opens Here,” The China Press, April 2, 1921, 2."}, {"type": "note", "text": "3 Terry Bennett, History of Photography in China 1842-1860 (London: Bernard Quaritch Ltd; 1st edition, 2009);Claire Roberts, Photography and China (London: Reaktion Books, 2013); Wu Hung, Zooming In: Histories of Photography in China (London: Reaktion Books, 2016); Ma Yunzeng 馬運增, Chen Shen 陳申, and Hu Zhichuan胡志川, Zhongguo sheyingshi (1840-1937) 中國攝影史 [History of Chinese Photography 1840-1937] (Beijing:Zhongguo sheying chubanshe, 1987); Chen Shen 陳申, Guangshe jishi 光社紀事 [The history of Light Society] (Beijing: Zhonguo minzu sheying yishu chubanshe, 2017); Gu Zheng 顧錚, Chengshi biaoqing: ershi shiji dushi yingxiang 城市表情:二十世紀都市影像 [City Expression: 20th Century City Image] (Nanjing: Jiangsu renmin chubanshe, 2003); Tong Bingxue 仝冰雪, Zhonguo zhaoxiangguan shi 中國照相館史 (1859-1956) [History of Chinese Photography Studio,1859-1956)] (Beijing, Zhongguo sheying chubanshe, 2016)."}, {"type": "note", "text": "4 Jeffrey Cody and Frances Terpak's article Through a Foreign Glass: The Art and Science of Photography in Late"}, {"type": "note", "text": "5 Richard K. Kent, “Early Twentieth-Century Art Photography in China: Adopting, Domesticating, and Embracing"}, {"type": "note", "text": "6 Yi Gu’s PhD dissertation Scientizing Vision in China: Photography, Outdoor Sketching, and the Reinvention of"}, {"type": "note", "text": "7 Jin Hua 金華, ed., Chenji: Jin Shisheng yu xiandai zhongguo sheying 陳跡: 金石聲與現代中國攝影 [Relics: Jin Shisheng and Modern Chinese Photography]"}, {"type": "note", "text": "8 Three Shadows Photography Art Centre, ed., Luo Bonian 駱伯年 (Beijing: Beijing lianhe chubanshe, 2016). Two photographs by Luo Bonian were exhibited in Tate Modern, London from 2 May to 14 October 2018 as a part of the exhibition: Shape of Light: 100 Years of Photography and Abstract Art."}, {"type": "note", "text": "9 The catalog of the exhibition was published in 2016. Rong Rong 榮榮, ed., Zhongguo sheying: ershi shiji yilai中國攝影:二十世紀以來 [Chinese Photography: Since the Twentieth Century] ( Hangzhou: zhonguo meishu xueyuan chubanshe, 2016)."}, {"type": "note", "text": "10 Japanese photographic historian Yoshiaki kai argues that there is a lack of commercial photographic market for circulating the family photographs and private snapshots in Japan. The same argument applies to China. It was not until ten years ago that the commercial photographic market in China gradually developed which means for a long time the private snapshots or family albums would not be allowed to circulate away from their original owners.See Yoshiaki Kai, “The Shadow of Snapshots,” in Suspending Time Life–Photography–Death, edited by Geoffrey Batchen (Shizuoka: Izu Photo Museum, 2010), 172-191."}, {"type": "note", "text": "11 Photographic historian Geoffrey Batchen argued that the snapshot should be seen as a complex social device with specifically middle-class values and sentiments rather than simply an artistic object. Geoffrey Batchen,“Snapshots: Art History and the Ethnographic Turn,” Photographies 1, no. 2 (2008): 121-142."}, {"type": "note", "text": "12 Leo Ou-fan Lee, “Remapping Shanghai,” in Shanghai Modern–The Flowering of a New Urban Culture in China, 1930-1945 (Harvard University Press, 1999). 3-42."}, {"type": "note", "text": "13 Lydia Liu, “Introduction,” in Translingual Practice: Literature, National Culture, and Translated Modernity—China, 1900–1937 (Stanford: Stanford University Press, 1995), 1-42."}, {"type": "note", "text": "14 Shu-Mei Shih, “Loving the Other: May Fourth Occidentalism in the Global Context,” in The Lure of the Modern (Berkeley and Los Angeles, California University of California Press, 2001), 1-45."}, {"type": "note", "text": "15 Christopher A. Reed, “Introduction,” in Gutenberg in Shanghai: Chinese Print Capitalism, 1876-1937 (Vancouver: University of British Columbia Press, 2004), 3-24."}, {"type": "note", "text": "16 Yi Gu, “Photography and Its Chinese Origins,” In Photography and Its Origins edited by Tanya Sheehan and Andrés Mario Zervigón (New York, N.Y: Routledge, 2015), 157-70."}, {"type": "note", "text": "17 Liang Qichao 梁啟超, Zhongguo jin sanbainian xueshushi 中國近三百年學術史 [Chinese intellectual history of the last three hundred years] (Beijing: Dongfang chubanshe, 2004), 382."}, {"type": "note", "text": "18 Liu Bannong 劉半農, “Bannong tanying 半農談影 [The Talk on Photography],” in Zhongguo jindai sheying yishu meixue xuan, 177-202."}, {"type": "title", "text": "Chapter 1"}, {"type": "note", "text": "19 Michel Foucault used the “panopticon” proposed by Jeremy Bentham in the late eighteenth century to explain the modern social system as “an indefinitely generalizable mechanism of panopticism.” John Tagg continues Foucault’s discourse on power, argues that the camera that functioned as the revolutionary modern medium promotes the establishment of a hierarchical system. Michel Foucault, Discipline and Punish: The Birth of the Prison, tr. Alan Sheridan (New York: Vintage Books, 1977), 7; John Tagg, “A Means of Surveillance: The Photographs as Evidence in Law, ” in The Burden of Representation: Essays on Photographies and Histories (London: Macmillan Education UK, 1988), 66-102."}, {"type": "note", "text": "20 Felice Beato’s photos were purchased and sold by Henry Hering (1814-1873), a photographer and dealer in London. Wu Hung, “Photography’s Subjugation of China: A ‘Magnificent Collection’ of Second Opium War Images,” in Zooming In: Histories of Photography in China (London: Reaktion Books, 2016), 48-83."}, {"type": "note", "text": "21 Jules Itier, Journal d'un voyage en Chine en 1843, 1844, 1845, 1846 [Diary of a trip to China in 1843, 1844, 1845] (Paris, Dauvin et Fontaine, 1848), 331."}, {"type": "note", "text": "22 Major George Malcolm and Dr. Robert Woosnam, who both served the Legation of Sir Henry Pottinger mission,set up a daguerreotype camera on the banks of Yangzi River on July 1842. Robert Bickers: “The lives and Deaths of Photographs in Early Treaty Port China,” in Visualising China, 1845-1965: Life and Still Images in Historical"}, {"type": "note", "text": "23 Christopher Green, “New Ways of Visualizing Time and Space,” in Seizing the Light (New York.: MC GRAW HILL, 2000), 165-182."}, {"type": "note", "text": "24 Alfred Stieglitz, “The Hand Camera–Its Present Importance,” In American Annual of Photography and Photographic Times Almanac for 1897 (New York: 1896), 18-27."}, {"type": "note", "text": "25 Christopher Green, Seizing the Light, 173."}, {"type": "note", "text": "26 Jonathan Crary, “Techniques of the Observer,” in Techniques of the Observer: On Vision and Modernity in the"}, {"type": "note", "text": "19th Century (Cambridge: The MIT Press, 1992), 97-136."}, {"type": "note", "text": "27 Sarah E. Fraser, “Chinese as Subject: Photographic Genres in the Nineteenth Century,” in Brush and Shutter,"}, {"type": "note", "text": "90–109."}, {"type": "note", "text": "28 Paolo Battaglia and Nicola Labanca, Giuseppe Messerotti Benvenuti. Un italiano nella Cina dei boxer. Fotografie e lettere (1900-1901) [Giuseppe Messerotti Benvenuti. An Italian in China Boxers: Photographs and letters (1900-"}, {"type": "note", "text": "1901)] (Milan: Raccolte Fotogr. Moden. Panini, 2000), np."}, {"type": "note", "text": "29 In the letter, he said, “I witnessed this scene in the morning just like a physician (armed with a camera). Three guilty murders were beheaded by a Chinese according to the Chinese court law. They found a skilled executioner who pulled three heads with three hits. In a few minutes the operation was finished.” Paolo Battaglia and Nicola Labanca. Un italiano nella Cina dei boxer. Fotografie e lettere (1900-1901), 2."}, {"type": "note", "text": "30 James L. Hevia, “The Photography Complex: Exposing Boxer-Era China (1900-1901), Making Civilization,” in Empire of Vision, eds. Martin Jay and Sumathi Ramaswamy (Durham: Duke University Press, 2014), 283-314."}, {"type": "note", "text": "31 Ibid."}, {"type": "note", "text": "32 The corps of the engineers, US army made a report, listing the engineering equipment among allied forces.According to the report from the US army, the engineering office stated: “in each section of a special company,there must be a certain number of men who understand thoroughly reconnaissance, the duplicating methods adopted, field photography, or whatever else requires special instruction.” Harley B. Ferguson, Report on the engineer equipment of the allied troops: serving with the China Relief Expedition, 1900-1901 (Washington, 1901)."}, {"type": "note", "text": "33 These photographs were taken by Captain Plaisant, Captain Calmel and Captain Tissier in 1900-1901. La Chineà terre et en ballon. – Reproduction de 272 photographies [China on land and in balloon: Reproduction of 272"}, {"type": "note", "text": "34 The first aerial photograph was taken by Gaspard-Félix Tournachon (1820-1910) (known as “Nadar”). In 1858,he took several aerial views of the outskirts of Paris. At that time, even with excellent lighting conditions, there was still not enough time for a successful exposure. Nadar tried several times and did not succeed until 1868, when he ascended hundreds of feet in a balloon, and captured several photos of Paris. Martyn Barber, “‘Quick! The Kodak!’, Victorian and Edwardian aeronauts and aerial photographers,” in A History of Aerial Photography and Archaeology (Swindon: English heritage, 2011), 52-82."}, {"type": "note", "text": "35 Ibid, 60."}, {"type": "note", "text": "36 C. F. O’Keefe’s photographs of the expedition were collected in US National Archives in College Park,Maryland. NWDNS-77-CR. National Archives and Records Administration. Accessed May 18, 2018.https://catalog.archives.gov/id/519406."}, {"type": "note", "text": "37 J. M. Mancini, “War, the Crucible of Art,” in Art and War in the Pacific World: Making, Breaking, and Taking"}, {"type": "note", "text": "38 James L. Hevia, “The Photography Complex: Exposing Boxer-Era China (1900-1901), Making Civilization,” in"}, {"type": "note", "text": "39 Oliver Wendell Holmes, “The Stereoscope and the Stereograph,” The Atlantic, June 1859."}, {"type": "note", "text": "40 James Ricalton: “Count Von Waldersee Escorted by Officers of Allied Armies through Lines of U.S. Infantry,toward Sacred Gate, Pekin,” in China through the Stereoscope: A Journey through the Dragon Empire at the Time of the Boxer Uprising (New York, Underwood & Underwood, 1901), 297-299."}, {"type": "note", "text": "41 Allan Sekula, “The Traffic in Photographs,” in Art Journal 41, no. 1, (Spring, 1981), 15-25."}, {"type": "note", "text": "42 Japanese photographers made remarkable contributions to the international imagery of China during the Boxer"}, {"type": "note", "text": "43 The first generations of both Japanese and Chinese photographers learned the techniques and knowledge from"}, {"type": "note", "text": "44 Julie Christ Oakes, “Japan’s National Treasure System and the Commodification of Art,” in Looking Modern: East Asian visual culture from treaty ports to World War II, eds. Jennifer Purtle and Hans Bjarne"}, {"type": "note", "text": "45 Ogawa Kazumasa published an album Gengzi shibian Tuji/Yuan Ming Hokushin Jihen Sashincho [Souvenir Picture Album of the Allies in North China] (Tokyo, Ogawa Kazume Shuppanhu 1902). The album contains an aerial view of Peking taken from a French balloon. The reports of Itō’s and Tsuchiya’s appeared in 1903 in the scientific journal of the School of Engineering, Imperial University of Tokyo, separately. Ogawa’s photographs were edited in 1906 at the expense of the Imperial Museum of Tokyo titled Photographs of Palace Buildings of Peking, with a brief introduction by Itō and captions in Japanese, Chinese and English. Shinoku Pekin kojo"}, {"type": "note", "text": "46 Julie Christ Oakes, “Japan’s National Treasure System and the Commodification of Art,” in Looking Modern: East Asian visual culture from treaty ports to World War II, eds. Jennifer Purtle and Hans Bjarne"}, {"type": "note", "text": "47 James L. Hevia, “The Photography Complex: Exposing Boxer-Era China (1900-1901), Making Civilization,” in Empire of Vision, 283-314."}, {"type": "note", "text": "48 Itō Chuta, “Kenchiku Shinka no Gensoku yori Mitaru Wagakuni Kenchiku no Zento [The Future of Our Architecture in Terms of the Evolution Theory of Architecture],” Kenchiku Zasshi, 265: 4–36."}, {"type": "note", "text": "49 Yuko Kikuchi, “Appropriation of Orientalism,” in Japanese Modernisation and Mingei Theory (London:Routledge, 2004), 88-95."}, {"type": "note", "text": "50 Wu Hung, “Introduction: The Nine Tripods and Traditional Chinese Concepts of Monumentality,” in Monumentality in early Chinese art and architecture (Palo Alto: Stanford University Press, 1995), 1-15."}, {"type": "note", "text": "51 Brigadier Frank McCallum Collection, With the China Expeditionary Force 1900-1901. Mss Eur D1114/3:"}, {"type": "note", "text": "1900-1901, British Library. General Sir George de Symons Barrow, 'The Fire of Life', Hutchison, London"}, {"type": "note", "text": "52 Mcquire Scott, “Promiscuous meanings,” in Visions of Modernity (London: SAGE Publications, 1997), 44-63."}, {"type": "note", "text": "53 Walter Benjamin, “The Work of Art in the Age of Mechanical Reproduction,” in Illuminations, ed. Hannah Arendt (New York: Schocken Books, 1968), 222–23."}, {"type": "note", "text": "54 Arnold Henry Savage Landor, China and the Allies (New York: Scrinner, 1901); Arthur Henderson Smith,China in Convulsion (New York: Fleming H. Revell Co, 1901); Harper’s Weekly used several photographs from the photographers in Peking to depict the march on the Forbidden City. One of news photos foregrounds the Russian commander, and the Russian contingents are marching from the Meridian Gate in the background to the Hall of Supreme Harmony. Two whole pages of photographs of the triumphal march into the Forbidden City not only transmitted news of the victory but suggested a demystification of the Forbidden City parallel to the construction of authority of Western forces. See Peter C. Perdue and Ellen Sebring, “The Boxer Uprising II: War and Aftermath (1900-1901),” in MIT Visualizing Cultures. Accessed June 18, 2019.https://visualizingcultures.mit.edu/boxer_uprising_02/index.html."}, {"type": "note", "text": "55 Robert Bickers, “The Lives and Deaths of Photographs in Early Treaty Port China,” in Visualising China, 1845-"}, {"type": "note", "text": "56 John Hepburn Dudgeon, Tuoying qiguan 脫影奇觀 [Capturing Shadow and Spectacle], 1873."}, {"type": "note", "text": "57 Andrew Hillier, “The Kodak Comes to Peking,” Visualising China, accessed June 21, 2018, http://visualisingchina.net/blog/2017/01/26/the-kodak-comes-to-peking/#_edn5."}, {"type": "note", "text": "58 Advertisement, The North-China Daily News, June 27, 1889, np."}, {"type": "note", "text": "59 “Christmas Show at the Stores,” North China Herald, December 13, 1889, 726."}, {"type": "note", "text": "60 In 1890, the Sino-British Yantai Treaty was signed, and Chongqing became a port of trade. Rebecca Nield,China’s Foreign Places: The Foreign Presence in China in the Treaty Port Era, 1840–1943, 2015, 16."}, {"type": "note", "text": "61 Alicia Bewicke Little, Intimate China. The Chinese as I Have Seen Them (London: Hutchinson & Co, 1899), 36."}, {"type": "note", "text": "62 “Travels in Southwest China,” CrossAsia Thematic Portals, accessed June 16, 2017,https://themen.crossasia.org/weiss/?lang=en."}, {"type": "note", "text": "63 “Oswald, John Collection,” Historical Photographs of China, accessed May 1 2018,https://www.hpcbristol.net/collections/oswald-john"}, {"type": "note", "text": "64 In 1866, John Samuel Swire, the senior partner of John Swire & Sons, opened the doors of his first China office.George Warren Swire (1883-1949), a partner in John Swire & Sons starting in 1904, became the chairman 1927-"}, {"type": "note", "text": "46. “SWIRE'S 200TH ANNIVERSARY,” Swire's 200th Anniversary, accessed December 16, 2017,https://www.swire.com/200anniversary/."}, {"type": "note", "text": "65 The No. 4 Panorama is the first Kodak panoramic camera. It was introduced in 1899 and replaced by a redesigned model in November 1900. The No. 1 Panorama appeared in April 1900. The advantage of Kodak No 4 Panorama camera was the swinging lens in a leather tube; and they had pronounced curves to the film plane, to match the movement of the lens."}, {"type": "note", "text": "66 “Swire, G. Warren Collection,” Historical Photographs of China, accessed May 2018,https://www.hpcbristol.net/collections/swire-g-warren."}, {"type": "note", "text": "67 “Carrall Family Collection,” Carrall Family Collection, Historical Photographs of China, accessed June 2, 2018,https://www.hpcbristol.net/collections/carrall-family."}, {"type": "note", "text": "68 Yannan Ding, “Reviving Transnational Elite Sociality: Social Clubs in Shanghai,” in Cities and the Super-Rich:Real Estate, Elite Practices and Urban Political Economies, edited by Ray Forrest, Sin Yee Koh and Bart Wissink (New York: Palgrave Macmillan US,2017), 127-146."}, {"type": "note", "text": "69 Pamela J. Inglesby, “Button‐pressers versus Picture‐makers: The Social Reconstruction of Amateur Photography in the Late 19th Century U.S.,” Visual Sociology 5, no. 1 (1990): 18-25."}, {"type": "note", "text": "70 Morrison, J. K., President. Perkins, Dr., Vice-Predt. Milles, Dr., Hon. Sec. The North China Desk Hong List"}, {"type": "note", "text": "1889 January, 14."}, {"type": "note", "text": "71 Some members had a scientific background: for example, William B. Bonnell (1847-1912), a professor in Department of Science at Wesleyan College, accepted the chair of natural sciences in the Anglo-Chinese college of Shanghai, China in 1884; Dr. W.J. Milles was a Fellow of the British Royal College of Surgeons and a Licentiate"}, {"type": "note", "text": "72 “The China Camera Club Exhibition,” The North-China Daily News, June 22, 1889, 575."}, {"type": "note", "text": "73 Ibid."}, {"type": "note", "text": "74 “Latest Intelligence,” The North-China Daily News, October 28, 1891, 411."}, {"type": "note", "text": "75 “Latest Intelligence,” The North-China Daily News, May 6, 1891, 407."}, {"type": "note", "text": "76 Marie-Claire Bergère, “The Kaleidoscope of Shanghai Society,” in Shanghai: China’s Gateway to Modernity (Stanford, Stanford University Press, 2009), 84-108."}, {"type": "note", "text": "77 The registration information of China Camera Club on The North China Desk Hong List published until 1895."}, {"type": "note", "text": "78 \"The China Camera Club,\" The North-China Herald and Supreme Court & Consular Gazette, May 18, 1906, 5."}, {"type": "note", "text": "79 The North-China Herald and Supreme Court & Consular Gazette, March 26, 1902, 5."}, {"type": "note", "text": "80 Charles Ewart Darwent, Shanghai: a handbook for travellers and residents to the chief objects of interest in and"}, {"type": "note", "text": "81 The photographs were collected in the book Shanghai: a handbook for travelers and residents to the chief objects of interest in and around the foreign settlements and native city, and the Historical Photographs of China published an album of his own photographs. Christian Henriot, Charles Ewart Darwent’s Photographs. Virtual Shanghai, , accessed April 16, 2018, https://www.virtualshanghai.net/references/biography?ID=38."}, {"type": "note", "text": "82 “Latest Intelligence,” The North-China Daily News, April 1, 1892, 295."}, {"type": "note", "text": "83 “The Shanghai Photographic Society,” North China Herald, April 13, 1923."}, {"type": "note", "text": "84 The North-China Herald and Supreme Court & Consular Gazette December 2, 1914; The North-China Daily"}, {"type": "note", "text": "85 Xavier Ortells-Nicolau, “Juan Mencarini and Amateur Photography in Fin-de-siècle China,” in Kritika Kultura,"}, {"type": "note", "text": "86 “The China Camera Club,” The North-China Daily News, June 22, 1889."}, {"type": "note", "text": "87 Alicia Bewicke Little, Li Hung-chang, His Life and Times (London: Cassell & Co., 1903), frontispiece."}, {"type": "title", "text": "Chapter 2"}, {"type": "note", "text": "88 Alfred Stieglitz, “The Hand Camera–Its Present Importance,” The American Annual of Photography, 1897, 18-"}, {"type": "note", "text": "27."}, {"type": "note", "text": "89 Catherine Yeh identifies that early photographic enthusiasts who were also the readers of lithographed pictorials.See Catherine Yeh, “Beyond the Frame: The Camera in Republican Shanghai and Wartime Chongqing,” in Brush and Shutter: Early Photography in China, 111-119."}, {"type": "note", "text": "90 Marie-Claire Bergère: “the Golden Age of Shanghai Capitalism (1912-1937),” in Shanghai: China’s Gateway to Modernity (Stanford, Stanford University Press, 2009), 147-176."}, {"type": "note", "text": "91 It was probably the Kodak (original) produced in 1888, because the No. 2 Kodak was produced starting October"}, {"type": "note", "text": "1889. Advertisement, Shenbao, March 10, 1889, 6. The original Chinese text is: “啟者今有照相鏡，其法極易，雖未經學習者亦能影照。其鏡以手捧持，能照沿路樹木，田地船隻，山水人物房屋一切等類毫髮無差。重只九兩，收攏時長六寸，闊四寸七分五，高一寸七分五，所照之相能闊至四寸二分五，高三寸二分五。辦此鏡及知照法者，可至英國倫敦鈕猛街第八十八號門牌西，和行內面議。上海則問大英醫院可也。” The full translation is: “Recently we have a new kind of camera, the method of using is very simple, which even novices can learn easily. This camera can be held in the hands, photographing the trees along the roads, farmlands,landscape and residential areas in a clear way. It weighs only 9 liang (450g), it is 6 cun long, 4.75 cun wide and"}, {"type": "note", "text": "1.75 cun tall when folded. The picture is 4.25 cun wide and 3.25 cun tall. If you want to purchase it and know the method, please visit Oxford Street, 88, London, UK, or the British Dispensary, Shanghai.”"}, {"type": "note", "text": "92 China imported more than one-third of its photographic products from Britain before the first World War (1914-"}, {"type": "note", "text": "1918). By 1917 and 1918, however, British imports had declined, while imports from Japan had roughly doubled and imports from the United States had roughly tripled, with Japan being the largest source. See “Zhongguo jinkou zhaoxiang yongping 中國進口照相用品[Import of Photographic Products from China],”in Zhongwai jingji zhoukan 中外經濟週刊 [Sino-Foreign Economic Weekly], no.43 (1924): 36."}, {"type": "note", "text": "93 Luo Zhitian. Shifts of Power, (Leiden, The Netherlands: Brill, 2017), xxii."}, {"type": "note", "text": "94 Geoffrey Batchen, “Origin Stories,” in Burning with Desire: The Conception of Photography (Cambridge: M.I.T.Press, 1997), 17-24."}, {"type": "note", "text": "95 Zou was not the first group of transmitting geometric optics in China. The Jesuits in seventeenth-century China"}, {"type": "note", "text": "96 Helmut Gernsheim, History of Photography from the Earliest Use of the Camera Obscura in the Eleventh"}, {"type": "note", "text": "97 On 19 October 1839, the news of the invention of photography reached China—only two months after the"}, {"type": "note", "text": "98 Feng Guifen 馮桂芬, “Caixue xiyi 採學西議 [On the adoption of Western learning] (Shenyang: Liaoning renmin"}, {"type": "note", "text": "99 Sarah E. Fraser: “Chinese as Subject: Nineteenth Century Photographic Genres,” in Brush and Shutter, 91-106."}, {"type": "note", "text": "100 Jeffrey W. Cody and Frances Terpak, “Through a Foreign Glass: The Art and Science of Photography in Late Qing China,” in Brush and Shutter, 33-68."}, {"type": "note", "text": "101 Ibid"}, {"type": "note", "text": "102 John Thomson, The Straits of Malacca, Indo-China and China; or, Ten Years’ Travels, Adventures, and Residence Abroad (London: Sampson Low, Marston, Low & Searle, 1875), 519-21."}, {"type": "note", "text": "103 Advertisement, Shenbao, October 1, 1873, 6."}, {"type": "note", "text": "104 Advertisement, Shenbao, October 17, 1883. 5."}, {"type": "note", "text": "105 Marie-Claire Bergère, “the Golden Age of Shanghai Capitalism (1912-1937),” in Shanghai:China’s Gateway to Modernity (Stanford, Stanford University Press, 2009), 147-176."}, {"type": "note", "text": "106 Weipin Tsai, “Introduction: Consumers, Communities, Individuals: A New Readership for A New China,” in Reading Shenbao: Nationalism, Consumerism and Individuality in China 1919–37 (Palgrave Macmillan, 2010), 1-"}, {"type": "note", "text": "17."}, {"type": "note", "text": "107 Leo Ou-Fan Lee, “Modernity and its discontents: the cultural agenda of the May Fourth Movement”, Kenneth Lieberthal et al., Perspectives on Modern China: Four Anniversaries (Routledge, 2016). 159."}, {"type": "note", "text": "108 Luo Zhitian. Shifts of Power, (Leiden, The Netherlands: Brill, 2017), 108."}, {"type": "note", "text": "109 Wu Hung, “Birth of the Self and the Nation: Cutting the Queue,” in Zooming In: Histories of Photography in China, 85-123."}, {"type": "note", "text": "110 Puyi wrote the autobiography in the 1950s Fushun, China at the request of the PRC. See Puyi, From Emperor to Citizen: Autobiography of Aisin-Gioro Puyi (Peking: Foreign Language Press, 1964), 131."}, {"type": "note", "text": "111 Puyi, From Emperor to Citizen: Autobiography of Aisin-Gioro Puyi (Peking: Foreign Language Press, 1964),"}, {"type": "note", "text": "112 Yi Gu, “What’s in a Name? Photography and the Reinvention of Visual Truth in China, 1840–1911,” The Art Bulletin 95, no. 1 (2013): 120-138."}, {"type": "note", "text": "113 The General Affairs Section of the Imperial Household Office of the Manchu court set up a “Newspaper Delivery File” for the newspaper subscribed by Puyi, which kept a detailed record of the name and number of copies of newspapers delivered each day. If a certain newspaper was not available that day, the reasons were required to be listed and the newspaper needed to be replenished later. For example, on July 29, 1924, Shanghai Daily (上海日報) failed to arrive in time because of late trains and asked to be delivered in the next day; on August 21, Fubao (複報) stopped publication because of the war, and Shibao (時報) was detained by the Police Department. See Xie Xiaohua 謝小華, “Huangdi ai kanbao 皇帝愛看報 [The Emperor Loved Reading Newspaper],” Forbidden City Magazine 紫禁城, no.5 (May 2006): 74–79."}, {"type": "note", "text": "114 “Deguo huangdi niju helan yamo longqin gubao zuijin zhi sheying 德國皇帝匿居荷蘭亞墨龍琴古堡最近之攝影 [Photographs of the German emperor’s recent residence in the Dutch castle of Huis Doorn],”Dongfang Magazine 東方雜誌 17, no.2 (1920): 1."}, {"type": "note", "text": "115 Osvald Sirén, “A Chinese Emperor Plays Photographer's Assistant,” New York Times Magazine, April 4, 1923."}, {"type": "note", "text": "116 This photograph was first uncovered to the public in the book of Johnston Twilight in the Forbidden City that was published in London in 1934. See Reginald F. Johnston, Twilight in the Forbidden City (New Yoke: Appleton& Company, 1934). In July 1946, the Palace Museum in Peking made an inventory of Pu Yi’s property in Tianjin.Among his 222 boxes of household goods, there were 4 boxes of photographs, 2 boxes of negatives and one box of glass negatives. Since 2013, the Palace Museum, Beijing and the National Palace Museum, Taipei promoted a collaborative project that categorized and organized the old photographs of Pu Yi. In May 2015, the Palace Museum in Beijing held an exhibition A Century of Light and Shadow: The Palace Museum ’s Collection of Old Photos. The same exhibition was open at the National Palace Museum in Taipei in January 2016."}, {"type": "note", "text": "117 Laikwan Pang, “Introduction,” in The Distorting Mirror: Visual Modernity in China (Honolulu: University of Hawai’i Press, 2007), 1-29."}, {"type": "note", "text": "118 Lu Xun 魯迅, “lun zhaoxiang zhilei 論照相之類 [In the essay on photography],” in luxun quanji diyijuan 魯迅全集第一卷 [The Complete Works of Lu Xun, volume 1] (Beijing: Renmin wenxue chubanshe, 1973), 167-176."}, {"type": "note", "text": "119 Wu Hung, “Birth of the Self and the Nation: Cutting the Queue,” in Zooming In: Histories of Photography in China, 85-123."}, {"type": "note", "text": "120 Laikwan Pang, “Introduction,” in The Distorting Mirror: Visual Modernity in China, 1-29."}, {"type": "note", "text": "121 John Peter Berger, “Use of Photography,” in Understanding a Photograph, 100–118. (London: Penguin Books,"}, {"type": "note", "text": "122 Luo Zhitian, Shifts of Power, (Leiden, The Netherlands: Brill, 2017), 138-139."}, {"type": "note", "text": "123 Xu Jilin 許紀霖, “Chongjian shehui zhongxin–xiandai zhongguo de zhishiren shehui 重建社會重心——現代中國的“知識人社會” [Rebuilding the Center of Social Focus: The “Intellectual Society” in Modern China],” in Wang Fansen 王汎森, “Zhongguo jindai sixiangshi de zhuanxingshidai 中國近代思想史的轉型時代 [The Transitional Era of Chinese Modern Intellectual History],” (Xinbei: Lianjing chubanshe, 2007), 137-168."}, {"type": "note", "text": "124 Luo Zhitian, Shifts of Power, (Leiden, The Netherlands: Brill, 2017), 160."}, {"type": "note", "text": "125 They also had different divisions within them, As Edmund Fund argued, cultural radicalism that idealized Western culture, cultural conservatism that defended the national heritage through a confluence of Chinese and Western ideas, and New Confucians that emphasized either “returning to the roots in order to be creative and new” (fanben kaixin 返本開新) or “creating something new in order to strengthen the core” (chuangxin guben 創新固本). The group of new intellectuals appropriated Western ideas, adapted them to local discourse and constructed a new vision of Chinese modernity. Edmund S. K. Fung, “Introduction,” in The Intellectual Foundations of Chinese Modernity: Cultural and Political Thought in the Republican Era (Cambridge: Cambridge University Press, 2010),"}, {"type": "note", "text": "1-26."}, {"type": "note", "text": "126 Christopher A. Reed, “Introduction,” in Gutenberg in Shanghai: Chinese Print Capitalism, 1876-1937 (Vancouver: University of British Columbia Press, 2004), 3-24."}, {"type": "note", "text": "127 Zhu Huaiyuan 朱懷遠, “Song Jiaoren beici zhenxiang kaobian 宋教仁被刺真相考辯 [Study on the Truth of Song Jiaoren’s Being Assassinated],” Minguo dangan 民國檔案 [Republican China Archive], no. 3 (2010): 78–86."}, {"type": "note", "text": "128 Marie-Claire Bergère, “the Golden Age of Shanghai Capitalism (1912-1937),” in Shanghai:China’s Gateway to Modernity (Stanford, Stanford University Press, 2009), 147-176."}, {"type": "note", "text": "129 Marie-Claire Bergere, “The Chinese bourgeoisie, 1911-1937,” Cambridge History of China, vol. 12 (1983):"}, {"type": "note", "text": "721-825."}, {"type": "note", "text": "130 “Huaqi yinhang zhi sheying zhanlanhui 花旗銀行之攝影展覽會 [The Photo Exhibition of National City Bank],” Sheying huabao 攝影畫報 [Pictorial Weekly] 5, no.201 (1929): 7."}, {"type": "note", "text": "131 Pamela J. Inglesby, “Button-pressers versus Picture-makers: The Social Reconstruction of Amateur Photography in the Late 19th Century U.S.,” Visual Sociology 5, no. 1 (1990): 18-25."}, {"type": "note", "text": "132 Ge Yihong 葛一虹, “Aimeiju de tichu jiqi shijian 愛美劇的提出及其實踐 [The Emergence of Amateur Drama and Artistic Practices],” Zhongguo huaju tongshi 中國話劇通史 [The general history of Chinese Drama ] (Beijing:Wenhua xiju chubanshe, 2015), 51-69."}, {"type": "note", "text": "133 Liu Bannong 劉半農, \"Beiping guangshe nianjian xuyan 北平光社年鑒 [Preface of Yearbook of Peking Light Society],\" in Zhongguo jindai sheying yishu meixue xuan, 203-206."}, {"type": "note", "text": "134 Chen Chuanlin 陳傳霖, “China,” in Photograms of the year: The annual review of the world's pictorial photographic work, edited by F. J. Mortimer, London: Iliffe & Sons, 1936, 24."}, {"type": "note", "text": "135 The Eastman Kodak company opened a wholesale office in London, England, 1885. In 1891, Kodak opened the first oversea factory in Harrow, England. George Eastman established Kodak Limited in 1898 by merging the Eastman Photographic Materials Company in London and American Eastman Kodak Company. Reese V. Jenkins,“Technology and the Market: George Eastman and the Origins of Mass Amateur Photography,” Technology and Culture, Vol. 16, No. 1 (January 1975): 1-19."}, {"type": "note", "text": "136 “Kodak LTD., Opens Here,” The China Press, April 2, 1921, 2."}, {"type": "note", "text": "137 In 1924, E. P. Root from the Eastman Kodak Company in the U.S. was sent to Shanghai to be the manager.Besides the manager, there were also many Chinese assistants in the store. Wang Wenhao, who used to work in local studios, acted as an agent for Kodak products in Shanghai, communicated frequently with the manager of Kodak Shanghai branch. Fei Kailing 費開林,“Wang Wenhao tan Keda zai shanghai 王文浩談柯達在上海 [The Talks of Wang Wenhao: Kodak in Shanghai],” Echo Magazine 漢聲雜誌, January 1977, 64-65."}, {"type": "note", "text": "138 Advertisement, Shenbao, March 3, 1926, 12."}, {"type": "note", "text": "139 Tong Bingxue, Zhongguo zhaoxiangguan shi, 55."}, {"type": "note", "text": "140 Zhao Junyi 赵俊毅, Zhongguo sheyingshi shizhu 中國攝影史拾珠 [the Forgotten History of Chinese Photography] (Beijing: Zhonguo minzu sheying chubanshe, 2013), 22-25."}, {"type": "note", "text": "141 “Kangtaishi sheying zhanlanhui chupin yiban 康泰時攝影展覽會出品一斑 [the photographs in Contax photographic exhibition],”Tuhua shibao 圖畫時報 [The Eastern Times Photo Supplement], no.174 (1935): 5;“Kangtaishi mingzuo yingzhan 康泰時名作影展 [the masterpieces in Contax photographic exhibition],” Tianjin shangbao meiri huakan 天津商報每日畫刊, vol.20, no.29 (1936): 2."}, {"type": "note", "text": "142 Pierre Bourdieu identified two types of amateur photographers, one is occasional photographers, who take photographs occasionally—recording family events, social gatherings, or travels. For this group of photographers,“photographic practice only exists and subsists for most of the time by virtue of its family function or rather by the function conferred upon it by the family group, namely that of solemnizing and immortalizing the high points in family life.” In contrast to occasional photography, Bourdieu argues that the “dedicated” photographers were on a quest for technical and aesthetic perfection.” Pierre Bourdieu, “the Cult of Unity and Cultivated Differences,” in Photography, A Middle-Brow Art, translated by Shaun Whiteside (Cambridge: Polity, 1996), 13-72."}, {"type": "note", "text": "143 Lawrence W. Levine, Highbrow, Lowbrow: The Emergence of Cultural Hierarchy in America (Cambridge:Harvard University Press, 1988), 86, 100, 149."}, {"type": "note", "text": "144 “China Camera Club Formed to Develop Photographic Art nd to the changes. See Walter Benjamin, “On Some Motifs in Baudelaire,” in Selected Writings,iv: 1935-1938, edited by Howard Eiland and Michael. Jennings (Cambridge: Belknap Press, 2003), 313-355. Also see Scott McCracken, “Imagining the Modernist City,” in the Oxford Handbook of Modernisms, edited by Peter Brooker (Oxford: Oxford University Press, 2010), 644."}, {"type": "note", "text": "255 Hu Jinkang 胡晉康, “Shanghai de yingxiyuan: Hongkou daxiyuan 上海的影戲院: 虹口大戲院 [Shanghai Cinema: Hongkou Cinema],” Liangyou, no.62 (1931): 33."}, {"type": "note", "text": "256 As Robert Silberman analyzes Jin Shisheng’s 1934 image Grand Theatre, The World Moves On—a movie title announced on the façade of the movie theater—was the best summary of Shanghai in the 1930s. Robert Silberman,“Introduction,” in Chenji: Jin Shisheng yu xiandai zhongguo sheying, 20-30."}, {"type": "note", "text": "257 Maria Morris Hambourg, “From 291 to the Museum of Modern Art: Photography in New York, 1910-1937,” in The New Vision: Photography between the World Wars (New York: Metropolitan Museum of Art: Distributed by Harry N. Abrams, 1989), 3-63."}, {"type": "note", "text": "258 Christopher Phillips, \"Resurrecting Vision: European Photography Between the World Wars,\" in The New Vision: Photography between the World Wars (New York: Metropolitan Museum of Art: Distributed by Harry N. Abrams, 1989), 65-108."}, {"type": "note", "text": "259 László Moholy-Nagy, “Producktion-Reproduktion,” De Stijl, no. 5 (1922), 98–100."}, {"type": "note", "text": "260 Paul W. Ricketts, “Kaleidoscopic Modernisms: Montage Aesthetics in Shanghai and Tokyo Pictorials of the"}, {"type": "note", "text": "1920s and 1930s,” in Liangyou, Kaleidoscopic Modernity and the Shanghai Global Metropolis, 1926-1945 (Leiden: Brill, 2013), 17-44."}, {"type": "note", "text": "261 Celeste Connor, “The City,” in Democratic Visions: Art and Theory of the Stieglitz Circle, 1924-1934 (Berkeley: University of California Press, 2001), 141-194."}, {"type way Policy Plan and the Solutions of Some Historical Issues Concerning Foreign Affairs],” in Zhonghuaminguo tielushi ziliao (1921-1949) 中華民國鐵路史資料 (1921-1949) [Information on Railway History of the Republican China] (Beijing: Shehuikexuewenxian chubanshe, 2002), 730-841."}, {"type": "note", "text": "272 Li Wenhui 李文輝, “Huhangyong tielu yu jindai zhejiang jingji fazhan 滬杭甬鐵路與近代浙江經濟發展"}, {"type": "note", "text": "[Shanghai-Hangzhou-Ningbo Railway and economic development of Zhejiang in modern times],” in Huhangyong tielu yu jindai Zhejiang shehui (1897-1937) 滬杭甬鐵路與近代浙江社會 (1897-1937) [Shanghai-Hangzhou-Ningbo Railway and Modern Zhejiang Society (1897-1937)] (Ningbo: Ningbo University, master thesis, 2017),"}, {"type": "note", "text": "66-72."}, {"type": "note", "text": "273 The photographs of Luo Bonian come from the privation collection organized by Luo’s grandson Jin Youming.Luo purchased his first camera in 1932 after graduating from Hangzhou Commercial School, and the same year, he became a banker at Zhejiang Commercial Bank in Hangzhou. Two years later, he transferred to the Bank of China’s Lanxi Branch. Luo Bonian lived in Hong Kong from 1938 to 1941. He lived on Nathan Road in Kowloon.He photographed various places in Hong Kong during that time, such as Repulse Bay, Kowloon Tong, the ports,and Castle Peak. Jin Youming, “Yi wode zengzufu luobonian 憶我的曾祖父駱伯年 [Recollections of my grandfather Luo Bonian],” in Luo Bonian 駱伯年 edited by Three Shadows Photography Art Centre (Beijing:Beijing lianhe chubanshe, 2016), np."}, {"type": "note", "text": "274 John Berger, “Paul Strand,” in About Looking (New York, Vintage International, 1992), 51."}, {"type": "note", "text": "275 Nancy Shawcross, “Time: The Photographic Punctum,” in Roland Barthes on Photography (Gainesville:University of Florida, 1997), 86-106."}, {"type": "note", "text": "276 Pierre Bourdieu, “the Cult of Unity and Cultivated Differences,” in Photography, A Middle-Brow Art,translated by Shaun Whiteside (Cambri ehensive Album] (Shanghai:Liangyou publishing company), 1934, 9-12."}, {"type": "note", "text": "311 Xibei daxue wenhua yichan xueyuan 西北大學文化遺產學院, Jiaoyubu yishu wenwu kaochatuan xibei sheyingji 教育部藝術文物考察團西北攝影集 [The Northwest Photographic Album of the team of Education Ministry’s Northwest Art and Relics] (Xi’an: Xibei daxue chubanshe, 2016)."}, {"type": "note", "text": "312 Huang Zongxian 黃宗憲, Dayouhuan shidai de jueze–kangzhan shiqi dahoufang meishu yanjiu 大憂患時代的抉擇--抗戰時期大後方美術研究 [The Choice in Times of National Crisis: A Study of Fine Arts in the Rear Front during the Anti-Japanese War] (Chongqing: Chongqing chubanshe, 2000), 91."}, {"type": "note", "text": "313 Sarah E. Fraser, “Approaching the Boundaries of a National Landscape: Picturing the Frontier 1927–1948,” In Studies on 20th Century Shanshuihua, 371–86. Lu Fusheng, ed. Conference Proceedings, 20th century Chinese Landscape Painting. June 9–11, 2006. Shanghai: Shanghai Fine Arts Publisher, 2006."}, {"type": "title", "text": "Chapter 5"}, {"type": "note", "text": "5.1 Transformative Pictorialism: Imaginative and Realistic Expression"}, {"type": "note", "text": "314 Chen Wanli 陳萬里, “Dafengji zixu 大風集自序 [Preface of Dafeng Album],” in Zhongguo jindai sheying yishu meixue xuan, 120-121."}, {"type": "note", "text": "315 Chun Feng 春風, “sheying yi meishu zhiyi 攝影亦美術之一 [Photography as a Fine Art],” the Eastern Times,"}, {"type": "note", "text": "1923, November 17, 13."}, {"type": "note", "text": "316 Hu Boxiang 胡伯翔, “Meishu sheying tan 美術攝影談 [Talk on Fine Art Photography],” The China Focus 3,no.6 (1928): 37-38."}, {"type": "note", "text": "317 Kang Youwei 康有為, “Huayi pingyu 畫意評語 [Criticism on Pictorialism],” in Zhongguo jindai sheying yishu meixue xuan, 88-113."}, {"type": "note", "text": "318 Liu Bannong, “Bannong tanying,” in Zhongguo jindai sheying yishu meixue xuan, 207-209."}, {"type": "note", "text": "319 “Sheying shang de huayi 攝影上的畫意 [Painterly effect of photography],” Chinese Kodakery 5, no.11 (1934):"}, {" rt:Modern Expressions edited by Maxwell K. Hearn and Judith G. Smith (New York: Dept. of Asian Art, the Metropolitan Museum of Art, 2001), 212-45."}, {"type": "note", "text": "328 In the 1930s Lang joined the salon competition more than 300 times and nearly thousand works were exhibited in competition. In 1931, his work Willow and Boats (Liuyin qingzhou 柳蔭輕舟) was selected for the International Salon Competition in Japan; in 1934, his composite photograph Majestic Solitude (Chunshu qifeng 春樹奇峰) joined the British salon competition. See Kin-keung Lai, “The Life and Art Photography of Lang Jingshan (1892-"}, {"type": "note", "text": "1995)” (Ph.D. Dissertation, The University of Hong Kong, 2000), 10-69."}, {"type": "note", "text": "329 Aida Yuen Wong, “Tradition is a Foreign Country,” in Parting the Mists (Honolulu: University of Hawaii Press, 2006), 3-34."}, {"type": "note", "text": "330 Julia F. Andrews, “Traditional Painting in New China: Guohua and the Anti-Rightist Campaign,” The Journal of Asian Studies 49, no. 3 (Aug. 1990): 555-577."}, {"type": "note", "text": "331 Yi Gu, “Scientizing Vision in China: Photography, Outdoor Sketching, and the Reinvention of Landscape Perception, 1912–1949” (Ph.D. dissertation, Brown University, 2009), 58-101."}, {"type": "note", "text": "332 Hu Boxiang 胡伯翔, “Meishu sheying tan 美術攝影談 [On Fine Art Photography],” The China Focus 3, no.6 (1928): 37-38."}, {"type": "note", "text": "333 Shao Woyun 邵臥云, “Meishu sheying luetan 美術攝影略談 [Brief Talk on Fine-art Photography],” Zhonghua shying zazhi, no.2 (1932), 102."}, {"type": "note", "text": "334 Jin Hua 金華,“Jin shisheng nianbiao 金石聲年表 [The chronology of Jin Shisheng],” in Chenji: Jin Shisheng yu xiandai zhongguo sheying, 675–85."}, {"type": "note", "text": "335 Ibid, 315."}, {"type": "note", "text": "336 Wu Hung, “Self as Art: Jin Shisheng and His Interior Space,” in Zooming In: Histories of Photography in China (London: Reaktion Books, 2016), 64–87."}, {"type": "note", "text": "337 Shang , no. 25 (1936): 20."}, {"type": "note", "text": "361 Lang Jingshan, “nude,” The Modern Miscellany 4, no.5 (March 1933): np."}, {"type": "title", "text": "结论"}, {"type": "note", "text": "362 Don Slater, “Photography and Modern Vision,” in Visual Culture edited by Chris Jenks (London & New York:Routledge, 1995), 218-37."}, {"type": "note", "text": "363 John Raeburn, “The Rebirth of Photography in the Thirties,” in A Staggering Revolution (University of Illinois Press, 2010), 2."}, {"type": "note", "text": "364 John Tagg, The Burden of Representation: Essays on Photographies and Histories, 68."}, {"type": "note", "text": "365 Laiwan Pang, “The Pictorial Turn and the Realistic Desire,” in The Distorting Mirror: Visual Modernity in China, 33-68."}, {"type": "note", "text": "366 Geoffrey Batchen, Burning with Desire: The Conception of Photography, 20."}, {"type": "note", "text": "367 Eliza Ho, Art, documentary, and propaganda in wartime China: the photography of Sha Fei (Columbus, OH:East Asian Studies Center, Ohio State University, 2009), 10-11."}, {"type": "note", "text": "368 Mia Yinxing Liu, “The Allegorical Landscape: Lang Jingshan’s Photography in Context,” Archives of Asian Art 65, no. 1 (2016): 1-24."}, {"type": "note", "text": "369 Karl Marx and Friedrich Engels, Manifesto of the Communist Party (1848), trans. S. Moore (Moscow: Progress Publishers, 1977), 45-6."}, {"type": "note", "text": "370 Mcquire Scott, “The Law of Progress,” in Visions of Modernity, 112-118."}, {"type": "title", "text": "figs"}, {"type": "note", "text": "3."}]}];
const ZH = /*__ZH__*/[{"id": "ack", "title": "Acknowledgments", "paras": [{"type": "title", "text": "致谢"}, {"type": "text", "text": "致谢"}, {"type": "text", "text": "首先，我要向我的导师莎拉·E. 弗雷泽教授致以诚挚的谢意，感谢她在我的博士学习和研究过程中给予我始终不渝的支持和启发。她的指导使我得以界定问题、形成论点并找到恰当的表达。她也在我的整个学术生涯中为我提供了视野。我要感谢我的第二导师芭芭拉·米特勒教授，她的反馈促使我进行批判性和开阔性的思考，并一步步改进了我的博士论文。我对她就我的博士论文提出的宝贵意见深怀感激。我还要感谢梅拉妮·特雷德教授在我博士学习期间给予我的持续支持。她无限的热情给了我极大的鼓励，她的教学启发我在研究中发现新的方向。我还要衷心感谢王连明博士与我交流许多有用的资料和他自己的研究。在我的整个博士学习期间，我从他那里得到了大量的支持和帮助。"}, {"type": "text", "text": "我由衷感谢中国大陆和台湾一些摄影师及摄影收藏家的后人。郎玉文、金华、金有明、黄建鹏、仝冰雪、赵俊毅和李长江慷慨地向我展示了许多原始照片，这启发了我在思考中国摄影师如何使摄影作为美术获得正当性，并将其转化为本土表达方面的研究。我还要感谢中国国家留学基金管理委员会和海因茨-格策基金会，它们使我得以在海德堡完成博士论文，并在北京、上海、南京和四川进行田野调查。"}, {"type": "text", "text": "最后，但同样重要的是，特别感谢我的家人。我的父亲多次与中国的图书馆员和书商打交道，以帮助我，而我的母亲总是鼓励我克服写作过程中的困难。最后感谢王一成，感谢他的理解、耐心和不断的鼓励。"}]}, {"id": "intro", "title": "Introduction", "paras": [{"type": "title", "text": "导论"}, {"type": "text", "text": "导论"}, {"type": "text", "text": "丰子恺（1898—1975），民国时期上海的一位画家和散文家，曾谈到照相机的爆炸性流行：“我的许多朋友都拥有自己的照相机，自己拍照。如今街上有很多照相馆；只需大约10—20元，你就能买到一台照相机。”1 丰子恺的这些熟人属于上海的新中产阶级，他们从事摄影不仅将其作为记录的工具，也将其作为一种新的休闲活动。在民国时期（1912—1949），易于使用的柯达便携式照相机的价格可负担性，推动越来越多的摄影爱好者能够拥有自己的照相机。都市资产阶级和主要城市中的新知识分子拥抱一个摄影意识的新时代，寻求一种新的媒介来捕捉他们的现代经验。"}, {"type": "text", "text": "与20世纪10年代和20年代欧美摄影市场显著分化形成对照的是，中国的业余摄影师——既包括普通爱好者，也包括可被认定为艺术摄影师的先进业余摄影师——几乎同时出现。1920年伊士曼柯达在上海开设第一家分店之后，中国摄影市场进入了一个便携式照相机和胶卷的新时代。2 与照相馆摄影相对，民国时期的业余摄影师将摄影拥抱为一门严肃艺术，并试图使其作为艺术获得正当性。他们从20世纪10年代到30年代建立了一系列摄影社团，这些社团不仅发展出一套新的摄影语汇，也提供了平台，以促进公众把摄影理解为一种新的艺术形式。[据]龙熹祖（天津：天津人民美术出版社，1988年），第156—169页。许多普通摄影爱好者也积极参与了若干摄影活动。例如，据报道，成千上万的业余爱好者参加了光社（Guangshe 光社）和中华摄影学社（Zhonghua sheying xueshe 中華攝影學社，20世纪20年代更常简称为华社）以及20世纪30年代黑白影社（Heibai yingshe 黑白影社）举办的公开摄影展览；最大的摄影社团是由林泽苍（1903—1961）在上海创办的中国摄影学会（Zhongguo sheying xuehui中國攝影學會），该会声称拥有逾千名会员，既包括普通爱好者，也包括严肃的艺术摄影师。在我的研究中，业余摄影不仅指严肃业余摄影师的艺术实践，也指普通摄影爱好者在现代文化生活中的日常活动。摄影展览的巨大热情如何兴起并发展，仍是一个未被讲述的故事。"}, {"type": "text", "text": "条约口岸时期中国的殖民摄影史与民国时期的艺术摄影史受到了最多的学术关注。特里·贝内特、克莱尔·罗伯茨、巫鸿、马运增、陈申、顾铮、仝冰雪等学者的中国摄影史专著，聚焦于一批艺术摄影师的贡献。3 一些关于中国摄影领域的文章和展览图录，更多关注某些具体摄影师或摄影团体的个案研究，这为后续研究奠定了基础。例如，《笔与快门：中国早期摄影》中的文章，梳理了从晚清时期到民国上海与战时重庆的摄影第一个世纪中所创造的新艺术语汇。4 理查德·K.肯特的文章《二十世纪早期中国的艺术摄影：采纳、归化与拥抱外来》考察了民国时期中国艺术摄影的出现与发展，这是首次将中国美术摄影师作为研究对象加以考察。5 若干博士论文探讨了民国时期艺术摄影、传统风格中国画与大众文化之间关系的一些关键问题。6"}, {"type": "text", "text": "近年来，针对某些具体业余摄影师的个案研究开始出现。《遗痕：金石声与现代中国摄影》（陳跡：金石聲與現代中國攝影）一书首次公开了一位才华横溢的业余摄影师金石声（1910—2000）的摄影作品，以及由美国和中国学者撰写的一系列文章。7 金石声 4 杰弗里·科迪与弗朗西斯·特帕克的《透过异域之镜：晚清中国的摄影艺术与科学》一文，考察了照片如何在条约口岸流通与商品化。Jeffrey Cody and Frances Terpak, “Through a Foreign Glass: The Art and Science of Photography in Late Qing China,” in Brush and Shutter, Early Photography in China, Frances Terpak and Jeff Cody, eds (Los Angeles: Getty Publications; Hong Kong University Press, 2011), 33-68; 萨拉·弗雷泽的《中国人作为主体：十九世纪的摄影类型》一文，讨论了摄影作为一种新媒介如何在国际层面塑造中国的国家形象。Sarah E. Fraser, “Chinese as Subject: Photographic Genres in the Nineteenth Century,” in Brush and Shutter, 90–109; 以及叶文心的《超越画框：民国上海与战时重庆的相机》一文，考察了摄影在民国上海与战时重庆所扮演的关键角色。Wen-hsin Yeh, “Beyond the Frame: The Camera in Republican Shanghai and Wartime Chongqing,” in Brush and Shutter, 111-119.5 Richard K. Kent, “Early Twentieth-Century Art Photography in China: Adopting, Domesticating, and Embracing the Foreign,” The Trans-Asia Photography Review, no. 2 (Spring 2013). Accessed June 1, 2018. https://quod.lib.umich.edu/t/tap/7977573.0003.204/--early-twentieth-century-art-photography-in-china-adopting?rgn=main;view.6 顾伊的博士论文《在中国使视觉科学化：摄影、户外写生与风景感知的重塑，1912—1949》探讨了摄影与户外写生如何改变传统风格绘画中的感知模式，这为重新思考民国时期摄影与绘画的关系提供了新途径。Yi Gu, “Scientizing Vision in China: Photography, Outdoor Sketching, and the Reinvention of Landscape Perception, 1912-1949” (PhD diss., Brown University, 2009); 陈学圣的博士论文《1949年以前中国的艺术摄影：精英文化的延续与转化》通过考察民国时期艺术摄影师所拍摄的照片，讨论了艺术摄影从精英文化向大众艺术的转变。Hsueh Sheng Chen, “Art Photography in China before 1949: The Continuation and Transformation of an Elite Culture” (PhD diss., Asia Institute, The University of Melbourne, 2010).7 Jin Hua 金華, ed., Chenji: Jin Shisheng yu xiandai zhongguo sheying 陳跡: 金石聲與現代中國攝影 [Relics: Jin Shisheng and Modern Chinese Photography] (Shanghai: Tongji University Press, 2016). 金石声兼具杰出城市规划师与先驱业余摄影师的双重身份。他在20世纪30年代于上海开始摄影，当时他正在同济大学学习土木工程。金石声认同业余者应是严肃而富有创造力的艺术家这一定义，为艺术摄影的普及和推动现代主义实验作出了巨大贡献。1938年，金石声获得洪堡基金会奖学金，前往德国学习道路与城市工程。他与私人照片和日记相联系的个体战时记忆，为理解中德跨国相遇的历史提供了不同视角。"}, {"type": "text", "text": "另一本由三影堂摄影艺术中心编辑、2016年于北京出版的《骆伯年》（駱伯年）一书，展示了来自杭州的业余摄影师、浙江省银行家骆伯年（1911—2002）的私人摄影作品。由董宇辉（Stephanie H. Tung）撰写的导论《骆伯年：三种路径》，不仅概述了他的生平与创作，还考察了其业余摄影创作的重要语境。8 2015年在北京三影堂摄影艺术中心举办的展览《中国摄影：二十世纪以来》（中國攝影：二十世紀以來），呈现了一批技法与风格各异的照片，勾勒了20世纪中国摄影的历史。值得注意的是，该展览纳入许多此前未发表的作品，这些作品来自民国时期将摄影视为严肃艺术的业余摄影师。9"}, {"type": "text", "text": "然而，聚焦于民国时期普通摄影爱好者的学术研究仍然狭窄。忽视业余摄影师所作贡献的主要原因，在于收集和保存私人照片极为困难。在动荡的20世纪，业余摄影师的后代很难保存照片、底片和相册。罗伯年和金诗生的许多作品在文化大革命期间遗失，因为外滩建筑和民国时期仕女等题材与“资产阶级艺术”密切相关，在文化大革命期间被视为禁忌。直到十年前，中国的商业摄影市场才逐渐发展起来；然而，照片收藏者通常更愿意收藏名人肖像或美术摄影作品。民国时期业余摄影师照片的文化价值仍然被忽视。10"}, {"type": "text", "text": "严肃的业余摄影师和普通摄影爱好者都为中国现代摄影的多样性和活力作出了贡献。柯达以及徕卡、康泰时等其他品牌便携相机进入中国市场，激发了摄影爱好者的巨大热情，使他们创作出越来越多的照片，这些照片不仅反映了现代中国的社会和文化史，也在一个政治动荡的时代表达了个人情感。11 在"}, {"type": "text", "text": "一个"}, {"type": "text", "text": "不成熟的"}, {"type": "text", "text": "但是"}, {"type": "text", "text": "在持续发展的摄影市场中，严肃的业余摄影师与普通的摄影爱好者之间并无巨大鸿沟。从邹伯奇（1819—1869）蓬勃的摄影实验，到梁启超（1873—1929）为摄影作为现代科学争取合法地位的努力，上层阶级与知识分子都利用摄影作为现代性的象征，来传播西方知识并推动中国的改革。17 再现社会现实的能力将摄影与现代世界的动态联系在一起。在20世纪初的中国，观看和了解现代世界的愿望在科学启蒙与自我意识的语境中浮现，鼓励更多知识分子和精英探索摄影在现代性新时代中的多变功能。"}, {"type": "text", "text": "持有不同文化立场的中国知识分子和艺术家，将欧美艺术家的语汇融入本土艺术表达，从而呈现出变革中的现代艺术景观。两次世界大战之间，中国摄影师对欧美现代主义摄影的激动人心的运动作出了创造性的回应。拼贴、合成照片和设计摄影为表现新兴大都市提供了新的方式。自20世纪20年代以来，一批批业余摄影师将摄影语言调适于本土语境，试图发展出一种本土化的摄影艺术。光社的刘半农（1891—1934）撰写了一篇长篇理论文章，题为《半农谈影》，通过挪用传统画论的术语和方法，将摄影阐释为一种美术门类；18 华社的郎静山（1892—1995）运用精湛的暗房技术，将若干文学母题融入一幅仿中国传统绘画的作品之中，在国际舞台上发展出了一种标志性的集锦摄影风格；黑白摄影社的卢施福（1898—1983）和陈传霖（1897—1945）尝试了各种接近欧美摄影师现代主义风格的方法，但却是以他们自己的方式。20世纪20年代和30年代的一批美术摄影凸显了摄影在中国复杂的现代性观念中的作用。"}, {"type": "text", "text": "我的博士论文考察1900年至1937年间业余摄影在中国如何兴起和发展，以及摄影社团、展览和出版物如何在历经六十年问题重重的殖民摄影之后开辟出摄影表达的新途径。通过考察民国时期业余摄影师拍摄的大量私人照片，我认为，摄影在19世纪晚期曾是精英阶层的一种奢侈爱好，而在民国中国则转变为新知识分子和资产阶级的一种新的交流与表达媒介。20世纪初至30年代中国业余摄影的兴起，以及摄影社团、展览和出版物所发展出的新的摄影语汇，确实促成了中国视觉现代性的一些独特面向及其最终成长；这种视觉现代性是20世纪上半叶中国现代性的一种复合而复杂的观念。"}, {"type": "text", "text": "第一章《无处不在的凝视：摄影、征服与早期条约口岸中国的休闲生活》探讨了便携相机如何被用来表现1900—1901年社会动荡期间的暴力、冲突和占领，以及条约口岸的外侨摄影社群如何把摄影当作一种新的爱好。从笨重的摄影器材到小盒子，相机技术的进步使摄影无处不在，正如照片被吸收进异域风情与征服的表现之中。便携相机不仅被用作记录历史时刻的工具，也成为主要居住在条约口岸中国的外侨中的一种新娱乐产品。若干相机俱乐部为其成员举办展览和工作坊。超越殖民摄影之外，便携相机的出现和条约口岸中国业余摄影的兴起，促成了记录变革中的中国社会的新方式。"}, {"type": "text", "text": "第二章“重访‘柯达时刻’：柯达与中国业余摄影的兴起”将民国时期新兴业余摄影师的摄影活动置于具体语境中加以考察，这些业余摄影师既包括严肃的业余摄影师，也包括普通的摄影爱好者。新奇的视觉体验通过柯达相机得以呈现，促使中国人将国家和个人视为独立的视觉主体。通过摄影知识的传播和迷信的破除，曾经高深莫测的摄影逐渐成为新知识分子和城市资产阶级的一种新休闲活动。柯达公司在中国通过广泛的营销推广业余摄影。对相机简便性、可负担性和便携性的强调，在20世纪20年代和30年代的中国吸引了越来越多的业余摄影师。与此同时，柯达出版物为自学摄影者提供了全面的知识。从1910年代到1930年代，大量摄影团体成立，以发展新的摄影语汇。柯达便携相机还鼓励中国城市业余摄影师捕捉日常生活；此外，严肃的业余摄影师开始表现现代艺术景观。"}, {"type": "text", "text": "第三章“影像的民主化：公共空间中的业余摄影”探讨了摄影展览如何改变公众观看和欣赏图像的方式，并创造了一个新的学习与交流的公共空间。北京、上海、天津、广州和南京的业余摄影团体举办的一系列展览，使摄影作为一种美术门类获得正当性，并拓展了公众对现代艺术的理解。柯达进入中国的故事与当地业余摄影者记录现代生活、塑造自我身份的需求交织在一起。20世纪20年代和30年代，伊士曼柯达公司创造了多种方式来吸引顾客，并培养与现代化生活相一致的业余摄影者审美趣味。"}, {"type": "text", "text": "在第二章和第三章考察的基础上，第四章“便携的风景：城市景观、休闲旅行与国族表述”考察了20世纪30年代中国的业余摄影师如何利用便携相机来表现城市生活和休闲旅行中的自然瞬间。超越殖民主义遗产，许多城市摄影师倾向于以德国和其他欧洲摄影师现代主义式的语汇来描绘日益成长的上海大都市。在繁荣的上海都市文化和外国现代主义摄影运动（如新客观主义和新视觉）的影响下，这些摄影师运用新的观看方式来观察已经改变和正在改变的环境。柯达和另一品牌便携相机的到来，鼓励越来越多的业余摄影师在旅行时拍摄快照。在民国时期，旅行经历了从精英消遣到现代休闲活动的转变。携带便携相机的机械化旅行从根本上改变了感知移动风景的方式。城市中新中产阶级的兴起、交通基础设施的扩展以及战前相对和平的环境，推动了民国时期的旅游业发展。一些业余摄影师不仅将相机用作休闲产品，也将其用作纪录工具。除了前往风景名胜的休闲旅行之外，越来越多的中国知识分子推动了一种全国旅行潮流，以探索民国中国的新文化景观。在20世纪30年代的休闲旅行和文化考察中，业余摄影师揭示了便携相机作为纪录和教育工具的潜力，发展出一种描绘和发现新兴共和国国族景观的新视角。"}, {"type": "text", "text": "最后一章《重构现实主义：变革中的画意摄影与新视野》表明，20世纪30年代中国业余摄影师的努力为中国现代摄影史上题材与风格的多样性作出了贡献。摄影作为一种西式艺术形式，经由中国业余摄影师对传统风格水墨画的挪用与调适而得到承认并取得合法性。合成照片与设计摄影为描绘日益工业化的现代世界提供了一种新视角。业余摄影师的努力拓展了摄影表现的边界，丰富了中国现代艺术的语汇。"}, {"type": "text", "text": "在经历了六十年问题重重的殖民摄影之后，越来越多的中国业余摄影师试图开辟摄影表现的新途径。摄影被用来记录20世纪现代城市的发展。业余摄影师拍摄的照片起到了私人档案的作用，隐含着捕捉转瞬即逝之时刻的愿望。民国时期的摄影师自觉地找到了自己的方式，以应对现代生活中新的身体经验与感官经验。艺术作品、旅行快照、家庭照片以及中国日常生活的照片，使这些业余爱好者得以与环境、家庭和新国家建立起一种确切的联系。相机技术的发明与改进使之成为可能。这些快照的自发性、即时性与亲密感，为理解民国时期中国业余摄影师的文化与艺术生活提供了一种新视角。"}]}, {"id": "ch1", "title": "Chapter 1 · The Ubiquitous Gaze", "paras": [{"type": "title", "text": "第一章 · 无所不在的凝视"}, {"type": "text", "text": "第一章：无所不在的凝视：早期条约口岸中国的摄影、征服与休闲生活 导论"}, {"type": "text", "text": "摄影伴随着大英帝国的扩张在第一次鸦片战争（1839—1842年）期间传入中国。摄影在19世纪中国所受到的这种不平等接受表明，摄影作为一种革命性媒介，不仅带来准确的再现，也象征着一种与控制权力相关的凝视，这种凝视关涉殖民主义语境中的等级制与监视。摄影在殖民语境中最初是被动接受，而非高度协作式接受，这一点从一开始就应被视为一个迹象：摄影不能仅仅被看作技术，而应被看作人眼的延伸，从而加剧了权力关系的建构。正如约翰·塔格所言，相机凝视作为新的权力策略发挥作用，推动等级体系的建立，并提供了一种新的监视手段。19"}, {"type": "text", "text": "摄影技术是在19世纪与殖民扩张同步发展起来的。从笨重设备到小型盒式相机，技术的发展使摄影变得无所不在。大量照片被吸纳进异国情调与征服的再现之中。除了记录占领之外，专业人士和业余爱好者都热衷于在紫禁城内部拍摄一些日常快照，从展示殖民权力转向对日常生活的观察与监视。19世纪末20世纪初，居住在中国的欧美侨民使用柯达相机记录休闲活动。1.1 摄影与征服"}, {"type": "text", "text": "当一种现代媒介邂逅一个亘古不变的静态帝国时，会发生什么？紫禁城的摄影史始于1860年，以英籍意大利摄影师费利斯·比托（1832—1909）的湿版火棉胶照片为开端。比托是最早拍摄紫禁城并将其影像传播至世界各地的摄影师之一。第二次鸦片战争（1856—1860）之后，比托作为军事行动的一部分造访了紫禁城。他携带着一台装有10×12英寸底片的大型箱式相机，从正阳门出发，穿过天安门和端门，抵达紫禁城的入口——午门。随后他登上景山，俯瞰紫禁城，拍摄了一幅视野开阔的全景照片（图1.1）。20比托的摄影实践不仅彰显了摄影师在殖民扩张中的重要作用，也开创了一种框取历史遗迹的新方式。"}, {"type": "text", "text": "至19世纪90年代，中国摄影史已由若干重要照片构成，这些照片出自一些知名摄影师之手。中国最早的银版摄影作品由法国摄影师于勒·埃及尔于1844年拍摄，时值第一次鸦片战争（1839—1942）结束两年之后。除了这些不甚清晰的室内照片外，埃及尔还记录了他在1844年10月底至12月间沿珠江溯流而上前往广州途中所见的广州与澳门风光。这些银版照片——共计32块底版——首次真实地描绘了中国与中国人的面貌。21与此同时，一些业余爱好者最初也积极参与了一些摄影实验。由于技术上的局限，这些业余爱好者的实验似乎并不成功。22"}, {"type": "text", "text": "摄影技术是在19世纪与殖民扩张同步发展起来的。从笨重设备到小型盒式相机，技术的发展使摄影变得无所不在。大量照片被吸纳进异国情调与征服的再现之中。除了记录占领之外，专业人士和业余爱好者都热衷于在紫禁城内部拍摄一些日常快照，从展示殖民权力转向对日常生活的观察与监视。19世纪末20世纪初，居住在中国的欧美侨民使用柯达相机记录休闲活动。1.1 摄影与征服"}, {"type": "text", "text": "事实在于，手持相机的出现为户外拍摄提供了更多可能性，换言之，其易于使用的特性满足了人们捕捉变化世界中的运动与生活的愿望。用手持相机拍摄的照片被称为“快照”，这一术语借自狩猎用语，指即兴拍摄。25 视觉性的转变开启了一个再现和感知世界的新时代。乔纳森·克拉里讨论道，自19世纪以来，位置固定的暗箱对于不断变化的文化和政治景观而言过于僵化。视觉的位置一直在从固定位置向人体转变。一种新的“去中心化的观察者”随着小型便携仪器出现，使摄影师的注意力从机器操作上转移开来。在19世纪早期，一种新的视觉再现与感知模式出现了，在这一模式中，作为视觉和感知主体的观察者，远离了“暗箱”模式中固定、封闭的观看方式，进入了流动、变化的世界，在那里，观察者的身体经验介入了视觉生产的过程，在变化的时间和空间中重构了自我与世界的关系。 26"}, {"type": "text", "text": "1888年柯达的发明使摄影变得无处不在。作为即时记录方式的快照拍摄，与全球范围内迅速扩张的殖民扩张相伴而行，而其简便的机械结构促进了记录与勘测。柯达易于携带和操作，可用于海外观光和探险。在殖民主义扩张期间，摄影的力量在军事、商业和宣传领域得到利用。19世纪下半叶，越来越多的摄影师在亚洲、非洲和拉丁美洲开始了探险摄影和旅行摄影。"}, {"type": "text", "text": "在讨论条约口岸中国的业余摄影师的摄影实践之前，我想先考察手持相机如何被用来再现19世纪末20世纪初中国社会动荡期间的暴力、冲突和占领。即时照片已被吸纳进对大屠杀、战争和饥荒的再现之中——这些暴力由中国北方的外国军队和义和团共同实施，将中国从一个静止的古老帝国转变为一个混乱的战场。27"}, {"type": "text", "text": "朱塞佩·梅塞罗蒂·本韦努蒂（Giuseppe Messerotti Benvenuti）是一名意大利军官，在义和团运动期间用柯达相机在中国留下了影像记录。他在回忆录中写道：“这周围人人都是摄影师，也就是说几乎任何人都能拿着相机咔嚓咔嚓地拍，而且这样的人还不少。”28 他满怀热情地想要拍下对义和团成员的残酷处决。他寄出的一封信中附有一张照片，题注为“Teste di decapitati, maggio 1901”（被斩首者的头颅，1901年5月）。29 画面之外的那位摄影师恰好拍下了正在拍摄一具被斩首尸体的军方摄影师。这张照片凸显了他作为摄影师以及义和团运动（1898—1901）见证者的在场（图1.2）。"}, {"type": "text", "text": "1900年6月，八国联军——英国、美国、德国、法国、奥地利、意大利、俄国和日本——进入中国，以解救义和团运动期间被围困的使馆，并镇压这场起义。军事任务完成后，他们开始惩罚清政府和中国民众，并给他们一个教训。正如何伟亚（James L. Hevia）所论，作为一种网络的“摄影复合体”构成了一套新的摄影技术、摄影师和传播机构的组合，充当一种监视装置，记录“现实”以及整个惩罚过程。30"}, {"type": "text", "text": "1900年成为紫禁城摄影史上的一个分水岭。从柯达相机到天空中的气球，各种摄影器械被用来记录惩罚过程，将紫禁城从帝国的神圣空间转变为供全球观众观看的奇观。31 各国都高度重视占领期间视觉记录的保存。各支联军部队的视觉档案相互补充、相互参照，形成了一个互动体系。32"}, {"type": "text", "text": "费利切·贝亚托（Felice Beato）那张具有里程碑意义的紫禁城鸟瞰图，无疑为1900年法国远征军工兵军官从气球上拍摄的中国最早航空照片提供了参照。气球从天津飘到北京，法国人拍下了下方的教堂、街道和房屋。最后，他们在紫禁城附近降落。他们从西到东拍摄了颐和园、白塔、景山的航空照片，以及一幅贯通南北轴线的紫禁城全景图（图1.3）。这12张航空照片，连同1900年至1901年间拍摄的其他快照，共272幅，被编成42块照相图版，收入题为《中国：陆上与气球上》（La Chine à terre et en ballon）的相册。33 自19世纪上半叶起，气球被用于各种军事冲突。战争期间，可以从气球上拍摄大量航空照片。34 自1888年起，快门速度大幅提高的柯达相机给航空摄影带来了巨大变化。英国航空摄影师约翰·麦肯齐·培根（John Mackenzie Bacon，1846—1904）于1888年首次携带柯达相机飞行，而这一年正是第一台柯达相机问世之年。35"}, {"type": "text", "text": "透过这种无处不在的凝视，紫禁城被大量拍摄，促成了这个帝国的一种国际形象。美国军方摄影师科尼利厄斯·弗朗西斯·奥基夫（生卒年不详）在1900年至1901年间拍摄的数百余张照片几乎涵盖了征服与惩罚的全过程。36 奥基夫原本是科罗拉多州莱德维尔的一名职业摄影师，美西战争爆发后入伍，被派往菲律宾。37 他按照美军指挥官阿德纳·查菲将军的指示，正在构建一份关于占领的完整记录。1900年，战斗摄影尚未成为一门成熟的类型；其照片的主要题材是战后的战争废墟与“占领”。当联军与中国步兵交战时，奥基夫拍摄了躺卧在东便门附近一条运河边的尸体。位于使馆区西墙附近的前门，是义和团运动期间受损最严重的地点。义和团和军队点燃的大火在7月和8月先后摧毁了箭楼和城楼。8月15日，即被围困的使馆获救的次日，正对皇城的前门在查菲将军的命令下被美军炮火轰开。次日，即8月26日，联军指挥官们同意占领皇城，北京城很快被攻占。"}, {"type": "text", "text": "奥基夫记录了美军架起梯子、炸开通往太和殿之路从而攻入北京城的时刻。他还拍摄了鞑靼城内被毁坏的房屋、教堂和寺庙的若干照片（图1.4）。奥基夫摆脱了19世纪如画风格的束缚，在对战争废墟的描绘中展现了摄影机的纪实力量。与19世纪开创性的战地摄影师费利斯·比托在第二次鸦片战争期间精心组织、摆拍的照片相比，奥基夫的废墟照片传达出整座城市被解构的总体印象，迈向纪实摄影的新时代。"}, {"type": "text", "text": "在义和团运动期间，被遗弃的纪念碑和皇家宫殿被联军占领，并被军队摄影师大量拍摄，从而将惩罚的过程转变为一场权力的展演。38 8月28日，一场由八国军事分遣队以及外交使团组成的凯旋游行举行了，作为对中国政府的一次教训。联军沿着穿过皇城的中轴线大道行进。一张照片甚至显示了一名军队摄影师正在为外交使团拍照（图1.5）。御座《视觉帝国》，283-314。无疑是征服期间一个受欢迎的主题。奥基夫在荒废宫殿中拍摄的空御座暗示了清朝主权的丧失（图1.6）。摄影师们走过专为皇帝及其母亲慈禧太后保留的庭院和宫殿，拍摄了皇帝私人居所入口和乾清宫正殿御座的照片。"}, {"type": "text", "text": "立体摄影生动、可感且令人愉悦，成为向欧美观众展示异域风情的完美媒介。立体镜这一在19世纪最受欢迎的视觉媒介，通过直接创造并传达图像的触感来提供视觉愉悦。正如手持立体观看器的发明者奥利弗·温德尔·霍姆斯在其文章《立体镜与立体照片》中所设想的那样：“终有一天，一个希望观看任何对象——无论是自然的还是人造的——的人，会前往帝国、国家或城市立体摄影图书馆，索取它的皮或形，就像他在任何普通图书馆借一本书一样。”39 他这番充满热情的预言写于工业现代化和殖民扩张的时代，表明随着摄影技术的进步，一种由可感且即时的图像构成的等级化知识体系正在形成。"}, {"type": "text", "text": "詹姆斯·里卡尔顿（1844—1929），一位四处游历的美国摄影师，开展了一个立体摄影项目，其中包括印度和中国的图像，向全球观众展示“远东”的历史事件和人民。在詹姆斯·里卡尔顿的午门立体照片中，观看者会获得一种沉浸式的视觉体验，仿佛他们真的目睹了美国驻华公使康格及其妻子萨拉·派克·康格走近午门（图1.7）。40 立体镜所提供的视觉效果将视觉愉悦沉浸于幻象感之中。视觉性的转变开启了一个再现和感知世界的新时代。艾伦·塞库拉认为，立体镜和观看者丧失了图像物质基底的全部感觉，这容易导致对非物质化形式的信仰。因此，观看过程类似于资本主义交换过程，这不仅是全球政治经济的基础，也是一种新的等级体系"}, {"type": "title", "text": "知识与权力。41"}, {"type": "text", "text": "日本摄影师的摄影作品在技术与美学上都达到了更高的水准，更重要的是，它们展现出对东亚建筑及其文化意涵更为深入的理解。42 摄影术于1848年传入日本，几乎与中国同时。日本与中国在接纳摄影并将其调适于本土语境方面有许多相似之处。同样，广州、上海、天津等中国通商口岸的商业照相馆在十九世纪后期逐渐主导了国内摄影市场。43 日本摄影的繁荣在很大程度上得益于明治政府对文化财产的保护措施。为建立国宝体系——41 Allan Sekula, \"The Traffic in Photographs,\" in Art Journal 41, no. 1, (Spring, 1981), 15-25. 42 日本摄影师在义和团运动期间为中国国际形象的形成作出了显著贡献。山本讃七郎（Sanshichiro Yamamoto，1855—1953）在义和团运动期间从东京前往北京拍摄照片。他拍摄了皇宫、寺庙以及一些战争遗址的景象。共有57块印版上的106幅照片，配有日文和英文说明，汇编成相册《北清事變寫真帖》（Views of the North China Affair, 1900）。Sanshichiro Yamamoto 山本讃七郎, Views of the North China Affair 北清事變寫真帖 (Tokyo: Kanda Nishikicho, 1901). 山本讃七郎于1882年至1897年在东京经营一家照相馆。他第一次到中国是在1897年4月。他前往中国，在北京开始新的职业生涯。1899年，他出版了一本相册《北京》（Peking），收录了颐和园、雍和宫、明十三陵等历史遗迹以及当时中国人的照片。这本相册于1906年在北京再版。Sanshichiro Yamamoto 山本讃七郎, Peking 北京 (Peking 1906). 43 日本和中国的第一代摄影师都从西方摄影师那里学习技术和知识，如威廉·桑德斯（William Saunders，1832—1892），他在中国和日本都开设了照相馆。中国照相馆摄影师如赖阿芳（Lai Afong，1839—1890）和梁
