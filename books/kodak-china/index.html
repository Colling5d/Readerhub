luxury pastime only available to China’s upper classes,gradually reached these new intellectuals and urban bourgeoisie. They participated in public spaces in ways that produced, disseminated and consumed images. Beyond taking photographs, the amateur photographers bought the photographic equipment,photographic magazines and yearbooks, visited the exhibitions on a regular base, and formed a series of societies and clubs. The amateur photographers connected with the wider public through a series of photographic practices. The turbulent political situation and the deepening national crisis forced them to think about the relationship between the individual and the nation.2.3 “Kodak Girl” in China: Female Photographers in the 1920s and 1930s"}, {"type": "text", "text": "The light and easy-to-operate Kodak camera stimulated the enthusiasm of female photographers. Women played a limited role in photographic history in the middle of the nineteenth century, when the equipment was cumbersome and expensive.By the 1880s, the invention of dry plates and portable cameras encouraged more and more women to take up the hobby. With the requirements for the photographers to have complicated developing techniques and heavy equipment was eliminated, photography was accessible to everyone.172 Besides the male amateur photographers, the Kodak Company was the first to notice the value of female photographic enthusiasts. In 1893,the Eastman Kodak Company promoted “Kodak Girl.” The Kodak advertisements began featuring a modern and vibrant woman in a blue and white striped dress with a Kodak camera in hand (Fig.2.15). “Kodak Girl,” a pretty and modern girl in Kodak’s advertising campaigns, became a global icon to promote its easy-to-handle cameras,“Even the women can do it,” proclaimed the ad, which suggests the simplicity of operation.173 The fashionable “Kodak Girl” in the ads also suggests the significant role women played in recording the family gathering and domestic celebrations in the early twentieth century.174"}, {"type": "text", "text": "\"Kodak girl\" even took pictures all over the world. In Chinese Kodak ads, the modern and romantic Kodak girl not only indicates that the products were friendly to the amateurs but also symbolized a \"new woman\" (xin nüxing 新女性) who was well educated and sophisticated. For example, in 1926 The Ladies' Journal (Funü zazhi 婦女雜誌), the ad of Kodak shows a female photographer shooting athletes with a Kodak (Fig.2.16).175 Another ad creates a romantic outdoor scene in which the woman with the camera was taking pictures of the landscape and the man snuggled against her, which catered to the audience looking for a romantic story (Fig.2.17).176 Armed with their cameras, the new women could take their own shots rather than be viewed and exhibited. The women magazines in the Republican period such as The Ladies' Journal and Elegance (Linglong 玲瓏), all promoted the imagery of modern woman with the camera as a trend; they even designed various scenes for female photographers.177"}, {"type": "text", "text": "“New woman” in Republican China, which were first placed in a subject position in the May Fourth era, had been depicted as a modern subject searching for female subjectivity in modern Chinese literary works. The depictions of new women by some leftist writers such as Ding Ling 丁玲 (1904-1986) and Mao Dun 茅盾 (1891-1981) stood for the quest for modernity and expressed the struggle of modern Chinese women to find their voices in a new and changing world. Meanwhile, the writers like the “New Perceptionists” (Xinganjue pai 新感覺派) objectified the modern urban women as a dangerous femme fatale who enticed the urban male. Both of two representations of modern women show deep anxieties over alienation and modernity.178"}, {"type": "text", "text": "The image of Kodak girl in Chinese ads not only embodies the spirit of adventure and fashion but also suggests the needs of independence associated with their pursuit of personal progress. The idealized Chinese Kodak girl in the ads was associated with the positive aspects of modernity. The cover picture of in 1914 The Ladies’ Journal features a well-dressed female photographer in mid-heels is taking a photograph of a deer with Kodak camera. Painted in quietly elegant turquoise by Xu Yongqing 徐詠青(1880-1953), who specialized in drawing landscape and calendar picture, the picture illustrates a woman was enjoying the outdoor leisure travel alone (Fig.2.18).179 In this context, the camera was employed as both a fashionable accessory that became a part of the bodily performance and a modern medium for defining her own identity. The ownership of Kodak cameras in the 1910s was still limited to a small number of photography enthusiasts, and very few women had tried photography. The picture shows an idealized subject in a poetic atmosphere, and also suggests that urban women from upper-middle-class families were seeking their aspirations through new media."}, {"type": "text", "text": "Playing with the camera became a trend among modern urban women, and it simultaneously created the potential for some Chinese women to participate in the construction of self-image, that is, for women to play a more significant role in the shaping of their own portrayal. The cover of the fifth issue of The China Focus depicted a female photographer is operating the apparatus in the studio, which subverted the stereotype that studio photographers had always been men (Fig.2.19).180 It has been a past era when the women were depicted by men as a product of male erotic.181 More importantly, the camera entrusted the women photographers more power to manipulate their own image; the “self” was gradually developing into a crucial theme in the representation of Chinese women in the early twentieth century. The Chinese women have undergone a transformation, from being objects on view to subjects possessing their own desires, viewing the self through the world around them."}, {"type": "text", "text": "Through reading the group photographs of these clubs, it is interesting to note that more and more female amateur photographers participated in the clubs. The emergence of female amateur photographers and even women’s camera clubs were closely associated with the prevalence of photographic education in the early twentieth century. In the 1920s, the Sunikang Girl School in Shanghai (Shanghai songjiang nüzi xuetang 上海松江女子學堂) offered a class in photography; Lang Jingshan was employed as the teacher. Nankai Middle School for Girls (Nankai nüzi zhongxüe 南開女子中學) in Tianjin offered photographic courses as a crucial part of aesthetic education, promoting photography as a new way of cultivating the virtues of the women born to open-minded families in cities.182"}, {"type": "text", "text": "Modern women in the Republican period embarked on a photographic career,which also a new way of socializing. Like the male photographic hobbyists, women also chose to develop their own camera clubs for communicating and socializing with each other. The women’s camera club “Kodak Club” was established at the Shanghai McTyeire School for Girls (Chinese name: Zhongxi nüshu 中西女墅) in 1923 (Fig.2.20).183 McTyeire School, a private school for girls from Shanghai’s well-to-do families, set up several interest groups such as music and poetry clubs for enriching school life. The Kodak Club, consisting of fifteen students, was established a bit later than the music and poetry clubs and aimed to provide some technical guidance and cultivate an interest in photography. Lin Zecang, the founder of the Chinese Photographic Society, noticed the Kodak Club, and wrote an essay to introduce it in Pictorial Weekly, 1927. But he criticized the name “Kodak Club,” because it sounded like an advertisement for the Kodak company.184"}, {"type": "text", "text": "Camera clubs provided a new way for the women to bond with each other and connect with the changing world. The aim of the Kodak club was “good fellowship,good fun, and good photography.”185 Compared with the elite photographic societies and student camera clubs primarily for men, the women’s camera club explicitly highlighted the sociability and entertainment of the club. The female amateur photographers in McTyeire School, who lived in wealthy Chinese families, were expected to bring the connections made in the clubs to their own family. Meanwhile,the bond of female amateurs highlighted the image of the modern woman. A portrait of Qian Lianlian 錢蓮蓮 in McTyeire School, which was published in the popular women magazine Linglong, shows her holding a hand camera, with the caption: “Ms. Qian Lianlian graduates from McTyeire School for Girls and loves photography (Fig.2.21).”186 Chen Bingde’s photograph “A Successful Photographer Emerges from Practices Like This,” which was published in Linglong, captures a moment when two female photographic hobbyists were practicing taking photographs (Fig.2.22).187 The camera had been embedded into the cultural and artistic life of the female students.Female photographic hobbyists not only used the camera as a tool of documentation but also a way of displaying themselves."}, {"type": "text", "text": "In contrast with male amateur photographers who insisted on taking photos for self-entertainment, more and more female hobby photographers advocated that women should take up cameras not only for fun but also as a profession. An increasing number of women amateur photographers transformed into professionalism, or somewhere in between. In a December 1925 issue of The Ladies’ Journal published an essay entitled “The benefits of learning photography skills” ( Xue sheyingshu de liyi 學攝影術的利益), which encourages more women to become professional photographers so as to lead independent lives:"}, {"type": "text", "text": "Chinese women have been confined by etiquette for thousands of years,"}, {"type": "text", "text": "hiding in our rooms all day long…what kind of art shall I introduce to"}, {"type": "text", "text": "female readers now? I learn photography in order to understand fine arts"}, {"type": "text", "text": "(better). we are accustomed to the scenery of Dongting Lake, but it looks"}, {"type": "text", "text": "different when I take a photograph…In addition to understanding art, I"}, {"type": "text", "text": "learned photography for the sake of life…In the United States, college"}, {"type": "text", "text": "students can earn money from photography to pay tuition fees. Women"}, {"type": "text", "text": "are the most suitable photographers. Some women who are very"}, {"type": "text", "text": "reluctant to see male photographers, so female photographers can do big"}, {"type": "text", "text": "business.188"}, {"type": "text", "text": "Although the author seemed to be too optimistic about the career prospects of the photographers, she still provided the female readers with a new career choice besides becoming a teacher or a secretary. Sheng Heyin 盛和音, a member of Futan University Photographic Society, acted as a news photographer at a university ceremony with Cheng Bingde. The front-page photograph in 1930 Pictorial Weekly shows photographer Sheng Heyin holding her camera surrounded by her male classmates (Fig.2.23).189 Jin Naixian 金耐先, a women artist and amateur photographer in the Republican period, exhibited her work in the first National Fine Arts Exhibition of 1929 ( Diyijie quanguo meizhan 第一屆全國美展) with other well-known male amateur photographers.190 She also acted as a sport photographer when the national sport games was held in Hangzhou in April, 1930, taking many photographs for the female athletes (Fig.2.24)191. In 1931, Jin Naixian came to Beijing and taught Western painting in Kongde School. Liu Bannong, a member of the Light Society, invited her to join in the society. As the first and only female member, she displayed twenty of her photographs in Light Society exhibition. Gu Shuxing 顧淑型 (1897-1968) employed photography as a way of engaging with the social events. She took several photographs of representing March 18 Massacre in 1926 which 47 protesters were killed and more than 200 injured (Fig.2.25). In contrast with the records of entertainment, sports and landscape, the documentations by Gu Shuxing manifest the strong humanistic concerns as a progressive woman."}, {"type": "text", "text": "The establishment of women’s camera clubs broke the monopoly of photography as a male hobby, encouraging more modern women to record their cultural lives. Although the most amateur photographic societies had limited membership for women, camera clubs in schools allowed female amateurs to join together, developing an expanding social network of amateurs connected for pursuing photography. A new generation of women started experimenting with photography. The Camera had been embedded in their cultural life not only as a fashionable accessory but also as a new medium to define their own identity."}]}, {"id": "ch3", "title": "Chapter 3 · Democratization of the Images", "paras": [{"type": "title", "text": "Chapter 3 · Democratization of the Images"}, {"type": "text", "text": "Chapter 3: Democratization of the Images: Amateur Photography in Public Spaces Introduction:"}, {"type": "text", "text": "The exhibition (zhanlanhui 展覽會), which was a new cultural and artistic practice in China, emerged within the flourishing modern-art world in the early Republican period. An increasing number of exhibitions played a crucial part in promoting the notion of modern art in China.192 Art exhibitions not only provided a space of displaying the artworks but also created a new channel to exchange the ideas the between the artists and the audience. Art exhibitions in the Republican period essentially transformed the way of viewing and appreciating art among the general public, creating a new public space for learning and communication."}, {"type": "text", "text": "Within the deteriorating situation in mid-1930s China, an ongoing realism movement in the 1930s modern Chinese art world remarked a break with pictorialism and modernist exploration. Many photographers leveraged photography to express the sentiments of national salvation, using the camera as a “weapon” to mobilize the public.In the 1930s, photography played a crucial role as a tool of documentation one the one hand, on the other, of propaganda to shape national imagination.1920s and 1930s"}, {"type": "text", "text": "Since the nineteenth century, the prosperity of pictorial media fostered a large number of new audiences who would be actively engaged in twentieth-century public exhibitions. Visiting the artistic exhibitions became a modern cultural event for the new middle classes. Wang Jiyuan 王濟遠 (1893-1975), a modern Shanghai artist,mentioned that tens of thousands of visitors rushed to the exhibitions and would “leave a joyful expression and get rid of the sense of depression.”193 Artistic societies and exhibitions were central to creating the institutional structures such that expanded greater public understanding of modern art and the impact of the modern artists.Through the flourishing 1920s photographic culture, comprised of amateur societies,exhibitions, and the criticism of the exhibitions, a dynamic discourse on modern Chinese photographic was developing."}, {"type": "text", "text": "In 1889, the first photographic exhibition was held by China Camera Club with sixty works, including one from Chinese amateur Chan Chin-tung; since 1902, the Shanghai Amateur Photographic Society held had annual exhibitions of works from the membership in the Union Church Lecture Hall, which offered an opportunity for the Euro-American photographic hobbyists in Shanghai to meet and learn the new trend in the field of photography.194 Until the 1920s, the Shanghai Amateur Society still held exhibitions for its members’ work in order to demonstrate the photographs’ influence on the local Chinese societies. In the late 1920s, Lang Jingshan even joined the Shanghai amateur photographic exhibition."}, {"type": "text", "text": "The Light Society’s exhibitions enhanced the public understanding of photography as fine art, laying a foundation for the profusion of photographic exhibitions in the 1930s. From 1924 to 1932, Light Society had held approximately eight public exhibitions in Beijing. The first public exhibition of Light Society was held on June 14-15, 1924, in the teahouse at Central Park, which was close to Peking University. It consisted of over three hundred photographs from the membership and was free of admission. 195 The attendance of the first exhibition was more than five thousand, and the duration was extended to five days. 196 After the fourth annual exhibition, the first Peking Light Society Photographic Year Book was published in 1928, including 56 pieces of works from 16 members. And the second annual was published after the fifth annual exhibition. These two annuals not only showed the photographs in the exhibitions but also defined the boundary of art photography and discussed some theoretical issues such as the relationship between art and technology."}, {"type": "text", "text": "However, photography did not enter the Chinese modern art world until a series of exhibitions held by amateur photographic societies in Shanghai. In the 1920s,together with Western painting and sculpture, photography as a Western-style art form had gradually been recognized and legitimized through the efforts of many amateur photographers. The Pegasus Society (Tianmahui 天馬會), the earliest artistic society to promote Western-style art in China for the pubic, was the first artistic group that brought the photographic works into the mainstream art circle. Organized by The Pegasus Society, a personal exhibition of the founding member of Light Society Chen Wanli was held in 1926, Shanghai, displaying his photographs taken in the Forbidden City in 1924, and the caves of Dunhuang and Shanxi Province when he participated a scientific investigation with American explorers and conducted his archeological research on the caves.197 The historical and artistic value of these photographs during the investigation were inextricably entwined, but the photographic works exhibited at the 8th and 9th Pegasus Society Exhibition showed the great aesthetic value that reshaped the artistic discourse of Chinese modern art. In 1927 and 1928, the works from Chen Wanli, Lang Jingshan, Ding Song and several amateur photographers in Hua Society were exhibited in the 8th and 9th Pegasus Society Exhibition, suggesting that photography as a Western-style art form was accepted and recognized by the art world.Shanghai Sketch made a special issue of the 9th Pegasus Society Exhibition in which photography almost covered two pages as same as the Western painting.198 The first National Fine Arts Exhibition of 1929 in Shanghai also included 227 photographs from the serious amateur photographer.199 A series of art exhibitions demonstrated how the mainstream art circle in Shanghai recognized and legitimized photography as a new art form, which heralded a new era of photography."}, {"type": "text", "text": "It was the exhibitions held four times a year by the Hua Society in Shanghai that attracted more public attention, promoting photography as a popular art form in the Republican period. From 1928 to 1930, the Hua Society held four exhibitions a year in the offices of the Eastern Times newspaper, Shanghai. Nearly fifty participants offered 190 works for this exhibition. Participating photographers, besides the members of Hua Society, included amateur photographers who were businessmen, bankers, media workers, artists, and writers. The exhibitions of the Hua Society welcomed the works from other societies and non-members. The first exhibition displayed the photographs from Japanese amateur photographic society in Shanghai; the second exhibition included the photographs from the Light Society's members such as Liu Bannong and Li Song 李崧 from Hong Kong; Chen Chuanling and Lu Shifu whom both came from Black and White Photographic Society, also exhibited their works in the third and fourth Exhibition of Hua Society. The photographs with the painterly subjects and soft-focus techniques continued the pictorialism that prevailed in late nineteenth-century and early twentieth-century Europe and America. Hua Society called the exhibition Shanghai Salon, which showed the influence of French salon culture. However,photographers still incorporated Chinese aesthetic vocabulary into the new medium.For example, Lang Jingshan photograph Before the race (Chinese name: Shima 試馬) with Chen Wanli’s calligraphy uniquely demonstrates an enduring subject in traditional Chinese painting horse race through a new medium (Fig.3.1). It received a lot of favorable comments from the visitors.200 The 1928 issue of the second Hua Society Exhibition in Liangyou published Before the race from Lang Jingshan."}, {"type": "text", "text": "Benefiting from the increased media publicity, the exhibitions of the Hua Society attracted hundreds of thousands of visitors; meanwhile, the exhibitions received recognition by the Shanghai art world. The China Focus, the artistic photography magazine, established a special issue for the second exhibition of the Hua Society;201 the Eastern Times newspaper also specifically introduced significant Hua photographers like Lang Jingshan, Hu Boxiang, and several celebrities related to the exhibitions. According to the statistics in Shenbao, more than 10,000 people visited the exhibitions. 202 Zhou Shoujuan 周瘦鵑 (1895-1968), the writer and the editor of Shenbao, took charge of an influential column called Random Talk (Ziyoutan 自由谈) in Shenbao that offered a free and discursive space for Republican intellectuals to express the opinions and sentiments about politics, culture and art. It is interesting to note that some reviews of the Hua Society’s exhibitions appeared in Random Talk.After the first exhibition opened, Zhou wrote a review of it. He selected some representative photographs with an intuitive artist’s eye, giving praise to Hu Boxiang’s depiction of laborers smelting iron, which was similar to the Russian realist painting Barge Haulers on the Volga. He also tried to apply photographic terms to make comments on the photographs like good composition (jiagou 佳構), framing (qujing 取景), and lighting (yongguang 用光). 203 In another article entitled “The First Photographic Lesson” (Sheying diyike 攝影第一課), he showed strong interest in taking photographs with his the members of the Hua Society.204 As a well-known literary critic, Zhou’s support was crucial to the popularization of art photography in the Republican period."}, {"type": "text", "text": "Some reviews were written by the critics with a fine-arts background, for example, Zheng Manqing 鄭曼青 (1902-1975), who applied his painting knowledge to commenting the photographs in detail, praising Lang Jingshan’s Before The Race since it “combines the advantages of Chinese and western painting,” and the works from Japanese photographer Taketa show the “charm” (yunwei 韻味) of art photography.205 Meanwhile, some reviews written by ordinary photographic hobbyists gave readers a glimpse of the prosperous photographic culture. All these reviews basically gave positive evaluations on photographic exhibitions, photographic exhibition as a new form aroused great interest among the public."}, {"type": "text", "text": "At almost the same time as the first exhibition of the Hua Society, the China Photographic Society, founded by Lin Zecang, also held the First National Photographic Exhibition (Quanguo sheying zhanlan dahui 全國攝影展覽大會) from March 23 to 26, 1928 in Shanghai. With over 800 members, the China Photographic Society’s exhibition attracted submissions from all over the country. The Society also held a National Photographic Contest in conjunction with the exhibition. Over 8,000 photographic hobbyists visited the exhibitions, which even the records of previous photographic exhibitions.206 The Second Photographic Exhibition showed 280 works,including the prize-winning photographs of the accompanying contest, and these works were also exhibited in the 1929 Westlake exposition.207"}, {"type": "text", "text": "Through the history of photography exhibitions in the Republican period, it is interesting to find that the locations of these exhibitions vary a lot. In general, the venue requirements for a photographic exhibition are not as high as those for a painting exhibition. A rare photograph taken during the First Light Society Exhibition gives us a glimpse of what the exhibition environment looked like. The simply framed photographic works in various sizes were displayed on the walls and temporary showcase, with labels arranged in front (Fig.3.2)."}, {"type": "text", "text": "Over 300 photographs were exhibited in the three-room teahouse, which means these photos were displayed relatively densely, and the size of the photographs was also limited accordingly.208 The simplicity of the exhibition space and design suggests that the amateur photographic society did not intend to seek commercial sponsorship, as photographic exhibitions performed as an artistic and communicative space for the photographic hobbyists. The exhibitions of the Light Society began with a campus demonstration of the photographs, then later developed into a large exhibition in a teahouse at Central Park with free admission. Central Park, which was transformed from imperial architecture to a public park in the early Republican period, developed into a public space for holding political assemblies and processions during the May Fourth Movement, and also displaying artworks since the 1910s. The Institute of Antiquity Exhibition (Guwu chenlie suo 古物陳列所) that collected antiquities from the Palace often held exhibitions at Central Park.209 Since the 1920s, some painting exhibitions, like The Third Sino-Japanese Joint Painting Exhibition (Zhongri huihua disanjie lianhe zhanlanhui 中日繪畫第三屆聯合展覽會) and some private painting exhibitions like Situ Qiao’s 司徒喬 (1902-1958) private exhibition had been held at Central Park, which attracted many visitors from the art world.210 Central Park as the venue of the Light Society’s exhibitions suggests that photography was recognized by the public as a genre of fine art."}, {"type": "text", "text": "The exhibitions of the Hua Society and the first exhibition of the Black and White Photographic Society were all held in the office of the Eastern Times newspaper,which shows a close affinity with media. As discussed before, the amateur photographers who were actively engaged in intellectual and artistic circles offered a lot of benefits in terms of the organization and publicity, which enabled the exhibitions to remain as far away from commerce as possible. The combined efforts from amateur photographers and intellectuals in media circles not only legitimated photography as a new art form but also popularized art photography among the general public."}, {"type": "text", "text": "In contrast with the painting exhibition, the photography exhibition showed a relatively friendly attitude from the very beginning. As we can see from the photograph of the Second Exhibition of the Hua Society, the photographs, mounted on board with labels at the bottom, hung on a large exhibition board (Fig. 3.3; 3.4). Mounting onboard offers a simple and lightweight way to replace the glass or wooden frames. The photographs can be attached to the exhibition board easily and densely, which saves the organizers a lot of exhibition space and framing expenses. The simple and inexpensive framing style became a reference for future exhibitions. The China Photographic Society explicitly stated that works displayed at the National Photographic Exhibition would not be framed by the glass.211"}, {"type": "text", "text": "Developing within the growing mature photographic market, photographic exhibitions straddled the line between art and commerce. Some photographic suppliers,studios, or foreign companies that sold photographic equipment were willing to sponsor the exhibitions. The China Photographic Society’s National Photographic Exhibitions were held in the Sassoon House where Sassoon & Co. was located.212 Sassoon House,built by Sir Victor Sassoon, featured Art Deco and granite facing as part of the Peace Hotel."}, {"type": "text", "text": "According to the news photos, the exhibition ground was designed like a maze,or “Eight-Diagram tactics” (Baguashi 八卦式) as the reporter wrote, which means the spaces had been fully utilized for displaying the photographic works (Fig.3.5).213 Exhibited in one of the most well-known architecture on Bund, the National Photographic Exhibition naturally attracted the attention of people from all walks of life. The First National Photographic Exhibition attracted 8000 visitors, including prestigious artistic groups such as of the Dawn Art Association (Chenguang meishuhui晨光美術會) and the Shanghai Cartoon Society (Shanghai manhuashe 上海漫畫社),college students from local universities, and some Euro-American photographic hobbyists. The First National Photographic Exhibition was more tolerant of commercial sponsorship. Kodak and the photographic supplies companies Chiyo Yoko and Carlowitz & Co. exhibited their products on the exhibition. However, the Second National Photographic Exhibition emphasized that the photographic works on display had no connection with commercial sponsorship, so camera products were not allowed to be displayed at the exhibition. Only the National Photographic Contest was still available for commercial support, for which the photographic suppliers Chiyo Yoko and Kobza Studio in Shanghai also provided framing services, and Kodak and Agfa companies offered prizes for the winners in the contests accompanying by the exhibitions.214"}, {"type": "text", "text": "With the expansion of photographic exhibitions in the 1930s, the department store became a new site for exhibitions. Pei-Yang Photographic Society opened the photographic exhibition in the photographic section of Chung Yuen Department Store (中原公司) in Tianjin, 1928 (Fig.3.6).215 The Second and Third Exhibition of the Black and White Photographic Society moved to Dalu Mall (大陸百貨) on Nanking Road,and the Forth Exhibition was held in The Sun Mall (大新公司). Photographic exhibitions in commercial spaces expanded the traditional exhibition practice and reached broader audiences. The shopping mall and art exhibition, both new in the Republican period, were connected within the growing flourishing commercial environment. Modern artists in Shanghai had also been encouraged to explore the possibilities of artistic spaces as a setting for interaction and communication."}, {"type": "text", "text": "In the 1930s, some photographic exhibitions were held in the newly established art museums in the major cities. The Tianjin Municipal Art Museum (Tianjin shili meishuguan 天津市立美術館) was founded in 1930, and the first director Yan Zhikai嚴智開 (1894-1943) who had great interest on photography when he studied in Japan.From 1930 to 1937, the museum held art photography exhibitions each year except 1932, attracting thousands of visitors to learn and communicate about art photography.Besides the annual exhibition, the museum also hosted exhibitions of the Light Society and B&W Photographic Society in 1930 and 1935 respectively.216 In 1936, the museum held a private exhibition of Tianjin art photographer Liu Weiyi 劉維義, an exhibition of Japan Guangyang Society, and the Contax Exhibition. 217 In 1937, the Second National Art Exhibition (Dierjie quanguo meizhan 第二屆全國美展) which included a photographic section, was held in National Art Museum (Guoli meishu chenlieguan國立美術陳列館), Nanjing (Fig.3.7).218"}, {"type": "text", "text": "Photography’s entry into museums encouraged more audiences to consider the pedagogical functions of photography beyond its aesthetic significance. Museums in the 1930s functioned as not only artistic and cultural spaces but also as educational platforms. The launch of photography exhibitions in museums promoted the legitimation of photography as fine art, and simultaneously, stimulated lively debates on the subjects and intentions of art photography. The critic in Ta Kung Pao (大公報) said approvingly that the photographic works from Black and White Photographic Society demonstrated the documentary power of photography, representing the social reality and proletarian life.219 3.2 Photography and Mobilization: “Photography Was a Powerful Weapon”"}, {"type": "text", "text": "Consistent political events in the Republican era and cultural forces greatly impacted photography, expanding the desire of seeing oneself and the world in the larger frame of expressing the self and developing the nation. As Richard Kent argued,photography was developing into a larger political and cultural quest to forge and assert a national identity during a period of intense upheaval.220 In the 1930s both serious amateur photographers and photographic hobbyists attempted to reveal the documentary and propaganda potential of photography to depict the turbulent social reality. As an effective and practical medium, photography had been embedded in the cultural and political life of the public.221"}, {"type": "text", "text": "Since the mid-1930s, urban Chinese photographers—mostly in Shanghai—initiated the depiction of lower-class people, showing a pro-proletariat attitude under the influence of left-wing culture in the 1930s. Shanghai attracted a number of left-wing writers and artists to engage with the world in a realistic and radical way. 1930s Shanghai became a cradle of left-wing literature, drama, and cinema. In the late 1920s,especially after the schism between the Communist Party and the Nationalist Party in 1927, a number of left-wing intellectuals moved to Shanghai. As Laikwan Pang points out, both the first organizing meetings of the Left-wing Writers’ League and the Left-wing Dramatists League were held in Gongfei Cafe, and Lu Xun took the lead in many of these steering meetings that shaped the development of left-wing culture at large.222"}, {"type": "text", "text": "In the 1930s Shanghai, left-wing literature became mainstream, taking the opposite view of modernism and popular fiction like “Mandarin Ducks and Butterflies” (Xin yuanyanghudie pai 新鴛鴦蝴蝶派). A group of leftist writers criticized the fetishism of capitalism, the huge gap between rich and poor, and the pretentiousness of the bohemian-bourgeois, emphasizing the necessity of revolution and leading the way to revolution. As Mu Shiying 穆時英 (1912-1940) wrote, “Shanghai. A heaven built on hell!” The blooming metropolitan culture on one hand contributed to the prosperity of urban life; but on the other hand, brought inequality and high crime rates. Some significant writers like Mao Dun, who was not really engaged with the left-wing League,depict the social upheaval in the 1920s and 1930s China."}, {"type": "text", "text": "The left-wing cinema movement of the 1930s offered glimpses of the trends in local visual culture, suggesting a “proletarian cinema movement” in the future. Left-wing filmmakers attempted to deal with issues like romantic relationships, nationalist sentiments, the urban experience, and modernity under the influence of left-wing ideologies of the 1930s. Laikwan Pang argued that “their youth [were] fighting for a utopia, a utopia that they never clearly identified for themselves but that required their most fervent belief and passion to construct.”223 The Highway (1934), Scenes of City Life (1935) and Street Angel (1937) all expressed an optimistic view of the nation and called for wider public participation in national salvation."}, {"type": "text", "text": "The left-wing culture of 1930s impacted the development of modern Chinese photography. In the early 1930s, while lots of intellectuals and artists ambiguously straddled a pro-proletariat attitude and aesthetic autonomy, they showed the humanist commitment to a variety of subjects such as refugees fleeing to the major cities, street children, peddlers, rickshaw drivers and beggars, all of which were new subjects in Chinese modern art, thus developing a humanist vision. A 1934 photo of Jin Shisheng taken along the Bund shows two refugees standing on the bank, staring at the ships on the Huangpu River (Fig.3.8). It foregrounds the helpless figures, dressed shabbily and carrying baskets, against the background of modern factories and buildings on the other side of the river. The stark contrast of destitution vs. prosperity evokes deep sympathy for the refugees. Zhang Guangyu's photograph \"the Humble Urban Dwells and Skyscrapers\" (Ruru shizhongren, weiwei baichilou 蠕蠕市中人, 巍巍百尺樓) exhibits a direct contrast between the urban lower-class people and the luxurious skyscrapers Shanghai Club building, which was published in 1928 August The China Focus (Fig.3.9).224"}, {"type": "text", "text": "The street view gradually became a frequent subject. Many street photographs in the 1930s were distinguished by the growing gap between rich and poor, old and new,tradition and modern, suggesting that China was moving towards a modern era. Zhao Dingming’s 趙定明 photograph of Shanghai race course was distinguished by the contrast between the shanty town and high-rise buildings (Fig.3.10).225 Factory workers,machine operators and rickshaw drivers appeared more and more frequently in the lens of urban photographers. Lu Shifu’a photograph “Blacksmith” (Bailian gangtie 百煉鋼鐵), which was exhibited in the second exhibition of Black and White Photographic Exhibition in 1934, captures the moment when sparks were flying during steel smelting (Fig.3.11). The concern about the fate of the working people and urban poor was shown in more and more photographs taken in the 1930s."}, {"type": "text", "text": "Wu Yinxian emphasized more the individuality of photographic subjects. He was the photographer of the left-wing film Children of Troubled Times, took several photographs with left-wing influence. Left-wing cinema of the 1930s greatly impacted the composition and subjects of Wu’s photographic practices. Wu display a male nude photograph in the first Black and White photographic exhibition, 1930 (Fig.3.12). The photograph, with its emphasis on muscle and bodylines, was influenced by Greek art and Renaissance art. Beyond the masculine beauty, the photographer also highlights the strength and power of his male subject. Power, the title of this photograph, indicates a relatively ambivalent attitude. But the 1935 photograph named Roar, the same as Lu Xun’s novel, shows a clearer political tendency (Fig.3.13). A half-nude man is roaring,his head slightly raised, and his eyes turned 45 degrees above. The photographer breaks with classical aesthetics through the depiction of the sweat on his chest, and his anxious and painful eyes. This photograph was a reference point for the woodcut artist Li Hua’s李樺 (1907-1995) work Roar! China which depicts the struggling body in a more direct way (Fig.3.14)."}, {"type": "text", "text": "The second and third Black and White Photographic Exhibition in 1934 and 1935 showcased many works of working people, clearly expressing the fact that amateur photographers were no longer content to depict their inner world but utilized their lenses to express the realities of life in all sectors of society. Ye Qianyu’s photograph Sweet Seventeen has two titles; the Chinese title is Fisherwoman (Yujianu漁家女). The photo depicts a young fisherwoman, a proletariat job. The tricky bilingual strategy was applied in many photographs. Shi Zhenhuai’s 史震懷photograph featuring a group of rock carriers also had a bilingual title: Rock Carriers in English and Working Hard For Whom? (lulu weishuimang 碌碌為誰忙) in Chinese,which expresses sympathy for lower-class people; Wu Yinxian’s photograph The Water Girl (Jishui Zhinv 汲水之女) appropriated a classical subject from Jean Auguste Dominique Ingres (1780-1867)’s The Source, placing a headscarf on what appears to be a proletarian woman (Fig.3.15). A series of ideologically loaded photographs on display pushed art photography into a new field. After Shanghai, these works were also exhibited in Beijing, Tianjin, Nanjing, Guangzhou, and Qingdao."}, {"type": "text", "text": "The fourth and the last exhibition of Black and White Photographic Society showed a clearer trend: art photography had declined and photos documenting the social reality increased. The fourth exhibition was held in April 1937, just before the outbreak of the Second Sino-Japanese War. Within the deteriorating situation in China,many amateur photographers leveraged photography to express the sentiments of national salvation. At this moment, members of the society such as Chen Chuanling and Nie Guangdi emphasized photography as a powerful medium of representing social reality and arousing the public sentiment. In the essay “The eight years of Black and White Photographic Society” (Banian lai de heibaiyingshe 八年來的黑白影社), Chen Chuanling argues that photography was closely related with national salvation:"}, {"type": "text", "text": "If we do not forget, 24 days after the closing of the first photographic"}, {"type": "text", "text": "exhibition in 1932, the bloody atrocities on the Huangpu River lasted"}, {"type": "text", "text": "for more than 40 days (Shanghai Incident). With the deteriorating crisis,"}, {"type": "text", "text": "September 18 Incident in 1931 and Shanghai Incident in 1932 led to the"}, {"type": "text", "text": "fall of four provinces and the Songhu Armistice Agreement also lapsed."}, {"type": "text", "text": "The second Black and White Photographic Exhibition was aborted in"}, {"type": "text", "text": "the midst of unrest and turmoil…This is a bloody lesson that has taught"}, {"type": "text", "text": "us the close relationship between photography at this stage and the fate"}, {"type": "text", "text": "of the entire nation…Art is a reflection of reality, and real art is realism,"}, {"type": "text", "text": "which is the highest law of all arts…Our photography society is"}, {"type": "text", "text": "qualitatively different from the society in 1935 and 1934…We know"}, {"type": "text", "text": "our responsibility in Chinese photography is to make this black and"}, {"type": "text", "text": "white art (photography) be Chinese national art. Therefore, we must"}, {"type": "text", "text": "make photography quite successful in both quality and quantity and has"}, {"type": "text", "text": "prestige in the international stage.226"}, {"type": "text", "text": "The appeal of reflecting reality was rising in the mid-1930s among artists and intellectuals. The photographic critic Xu Xu 徐訏 argued that the camera was the best medium for depicting reality. He also suggested that news photographers in China should be divided according to their ideology, left- and right-wing.227 The photographer who best reflects the proletarian tendency is undoubtedly Sha Fei 沙飛 (1912-1950).Before he became the most prestigious war photographer of the Sino-Japanese War, he was a telegraph operator and a member of the Black and White Photographic Society.Sha Fei had been obsessed with photography since the 1920s, buying his first camera for his honeymoon."}, {"type": "text", "text": "Like most amateur photographers, Sha Fei began with mainstream pictorialism.In the third Black and White Exhibition, 1935, Sha Fei showed his famous pictorial photography: The Song of Two Fishermen (Chinese title: Yuguangqu 漁光曲),depicting the tranquility of the river landscape in Southern China. Between 1935 to 1937, he became an outstanding urban street photographer and took many photos of railroad workers, waggoneers, and beggars in Shanghai. The images of lower-class people highlight the hardships of poor city dwellers, indicating the inequality of society that was closely related to left-wing thoughts and emerging proletarian revolutionary ideas. In his photo of a rickshaw driver, he used an overlooked perspective to show the scene of a humble driver squatting on the street eating his lunch (Fig.3.16). The same perspective was also applied to the depiction of a barefoot street vendor. A photo called Crying for Life (Shengming de nahan 生命的吶喊) portrays a blind beggar with a slim walking stick squatting alone on the road (Fig.3.17). The frontal view of his blind eyes is shocking, which shows the sympathy and pity for people living in misery. The photo Begging Not Permitted directly criticizes the degenerate bureaucracy by representing a policeman in the Republican government driving a beggar away (Fig.3.18). In the fourth Black and White exhibition, 1937, he exhibited Diligent and thrifty granny (Chinese name: Qinjian 勤儉), depicting an ordinary village woman mending old clothes (Fig.3.19). He praised the good qualities of diligence and thriftiness among ordinary people, a clear manifestation of his pro-proletariat attitude. These ideologically loaded photographs with an obvious left-wing stance lead the audiences to understand the photographic works in a critical way rather than treat them as amateur art. Photography was closely related to the turbulent society. The generation of artists and photographers had to make a choice: art for art or art for life."}, {"type": "text", "text": "Sha Fei’s choice was made in 1936, the crucial watershed year of his life and the nation. He became famous for taking Lu Xun’s photographs in the second National Woodcut Art Exhibition and Lu Xun’s funeral just 11 days after the exhibition.228 In the series of news reports about Lu Xun, he acted as a professional news photographer.He captured the moment when Lu Xun was talking with the young woodcut artists in a friendly atmosphere, even taking a photograph of Lu Xun laughing, which was rarely seen. After the exhibition, he did not send these photographs to Lu Xun as a gift; instead,he asked for a copyright fee as a professional news photographer, although he was not employed by any news agency.229 At the funeral of Lu Xun, he took a series of demonstration photographs, displaying his strong news sensibility on the political events within the turbulent environment. The successful news report caused a sensation and his lasting enthusiasm for photography encouraged him to pursue it as a lifelong career."}, {"type": "text", "text": "Sha Fei’s shift from an amateur to a professional news photographer suggests that a prevalent turn occurred in the middle of the 1930s. Photography had been given too many social implications. Sha Fei undoubtedly made the boldest effort in revolutionizing the form and style of photography. In December 1936, Sha Fei wrote an introduction “Before the Exhibition” (Xiezai zhanchu zhiqian 寫在展出之前) for his exhibition in Guangzhou, arguing that photography was a “one of the most powerful weapons to revel reality (暴露現實的一種最有力的武器)”:"}, {"type": "text", "text": "I have been thinking that photography is a powerful weapon to reveal the"}, {"type": "text", "text": "reality and I have always desired to take advantage of that to depict the"}, {"type": "text", "text": "real world...Photography is one of the fine-art forms, but many people still"}, {"type": "text", "text": "treat it as a pastime. Essentially, they ignore the social meanings of this"}, {"type": "text", "text": "medium, allowing photography to be used by the pretentious bourgeoisie"}, {"type": "text", "text": "for representing beauty and ignoring reality, what a terrible thing! In"}, {"type": "text", "text": "reality, lots of people are suffering from massacres, rape, slavery. The"}, {"type": "text", "text": "inequality of society is the shame of humankind, and the responsibility of"}, {"type": "text", "text": "art is to help human beings to understand themselves, reform society, and"}, {"type": "text", "text": "restore themselves. Therefore, artists, especially photographers, should"}, {"type": "text", "text": "not be captive in utopia and carried away with a sense of self, but must"}, {"type": "text", "text": "investigate every class of society and search for the real materials. 230"}, {"type": "text", "text": "The exhibition of 114 pieces works identifies the transformation of Sha Fei’s photographic career. In his early career during the 1920s and early 1930s, he depicted the poetic landscape of Nan’ao island in Guangdong with pictorialist skills. Since the mid-1930s, he switched his pictorialist vocabulary to that of the city and its crises. The poor living in Shanghai taken from 1935 to 1936 show his ambitions to discover the documentary function of photography. After his exhibitions in Guangzhou and Guilin in 1936, some critics spoke highly of his works. Ma Zongrong 馬宗融 argued that we should no longer evaluate his works with old standards, “His works have value beyond art itself…His choice is of great significance: on the one hand, he depicted the everyday life during the social turmoil, and express the sufferings of the masses; on the other hand, he raised the national sentiment among the people.” 231"}, {"type": "text", "text": "In the book On Photography, Susan Sontag argues, “Just as a camera is a sublimation of the gun, to photograph someone is a subliminal murder––a soft murder,appropriate to a sad, frightened time.” The Camera has been seen as a metaphorical weapon in documentary photography and photojournalism, however, beyond semiotic violence that “turns people into objects that can be symbolically possessed”, Sha Fei intended to employ photography as a tool to mobilize the masses.232 The argument “photography as a weapon” had a profound influence on left-wing photography, leading a new direction of representing proletarian life and social reality. Undoubtedly, Sha Fei used a radical way to reveal the documentary side of photography and arose public sentiment by criticizing the inequality of society and degeneracy of the Nationalist government."}, {"type": "text", "text": "Photography magazines in the Republican period had always been a dynamic and experimental space for amateur photographers. Despite the high dependence on commercial sponsorship, many photographic magazines published works with nationalist sentiments.233 Pictorial Weekly was in a transition in the mid-1930s. The cover photograph of the 1935 issue featured a view of modern western-style architecture taken from a tourist ship; in 1936, the magazine launched a special issue of travel in Northern China. The cover photographs taken by Lin Zecang, show a soldier standing in the Great Wall and a view of the wall from the beacon tower. The Great Wall, which originally built as a means of preventing incursions from barbarian nomads,now became a national symbol of strength and independence. The editorial remark of Flying Eagle expressed the hope that China could produce its own equipment and supplies. Flying Eagle had never published any advertisements for Japanese products.Instead, they strongly promoted Chinese photographic products in magazines. The ads of Chinese products like Sanjiaopai (三角牌) film, and Qian Jinghua’s panoramic cameras were frequently published in Flying Eagle. The first issue of the editor’s remarks conveyed strong concern on the development of the photographic industry in China:"}, {"type": "text", "text": "Improving photographic equipment was still a long way off in industrially"}, {"type": "text", "text": "backward China. But the development of the photographic industry"}, {"type": "text", "text": "depends on everyone’s research and efforts. The prosperity of the"}, {"type": "text", "text": "European and American photographic industry is not accidental."}, {"type": "text", "text": "Photography is an art form associated with emerging science, which was"}, {"type": "text", "text": "developed only in these decades. Ten years ago, Japanese photographic"}, {"type": "text", "text": "materials still needed to be supplied by European and American countries."}, {"type": "text", "text": "In recent years, not only some simple equipment can be produced by itself,"}, {"type": "text", "text": "but also film can be produced by itself, and it has been circulated in the"}, {"type": "text", "text": "market. The quality of the products is still not mentioned, but the spirit of"}, {"type": "text", "text": "this endeavor is expected to be studied by domestic researchers and"}, {"type": "text", "text": "manufacturers.234"}, {"type": "text", "text": "Increasingly, the photographers consciously took advantage of cameras to arouse the patriotic enthusiasm in the 1930s. The promotion of “art” that related to aesthetic enlightenment” and “Chinese-ness” in terms of photography was consistent with the “Dual Variation of Enlightenment and Nationalism” proposed by Li Zehou in 1987.235 In the 1930s, photography remains significant by its historical role as a tool of documentation, one the one hand, on the other, of propaganda to create imagined communities. The great impact of photography on social reality and political moments made unification possible. 236 The 1930s witnessed the birth of photojournalism.Photography became the most effective art form and propaganda tool with the rise of social realism in the 1930s.237 Within the deteriorating situation in mid-1930s China,many amateur photographers leveraged photography to express the sentiments of national salvation. Through a series of photographic practices in the 1930s, some new subjects such as pain, death, and suffering of ordinary people and working-class extended the boundaries of photographic expression and enriched the artistic vocabulary of modern Chinese art."}, {"type": "text", "text": "In the 1920s and 1930s, a series of photographic exhibitions were held in major cities, which not only displayed the works of amateur photographers but also expanded public understanding of photography as a new art form. The amateur photographers who were new intellectuals in the cities promoted the democratization of the images by establishing the connection between the consumer market and the art world. In the mid to late 1930s, under the impact of the national crisis, amateur photographers used their culture and social influence for extensive social mobilization, transforming the amateur activities into social practices in public spaces. The tension between aesthetics and nationalism allowed amateur photography to gradually come under the system of the nationalist narrative."}]}, {"id": "ch4", "title": "Chapter 4 · Portable Landscapes", "paras": [{"type": "title", "text": "Chapter 4 · Portable Landscapes"}, {"type": "text", "text": "Chapter 4: Portable Landscapes: Urban Spectacles, Leisure Travel and Representing the Nation Introduction"}, {"type": "text", "text": "Sightseeing and photography were naturally connected when portable cameras came to China. The rush of hand camera and the “effortlessness” of photo-making allowed more hobbyists and amateurs to take snapshots during their short excursions and long-distance journeys. The rise of the new middle classes, a fast-growing transportation, and relatively peaceful prewar environment boosted tourism in the Republican period. Travel underwent a transformation from an elite pastime to a modern leisure activity in the Republican period. The popularity of hand cameras exactly met the demands of producing a great number of images in any places and time.Beyond leisure travel to scenic spots, an increasing number of Chinese intellectuals and artists promoted a trend of nationwide tours to explore the new cultural landscape of Republican China. The simplicity and portability of the Kodak camera also benefited greatly for the ethnographic research. A lot of photographs featuring everyday lived experience of the indigenous people were recorded."}, {"type": "text", "text": "In modern era, photography essentially offered a new “way of seeing” and traveling with a camera in hand had the potential to alter one’s view and understanding of the travel experience. The great popularity of the portable camera stimulated the desire to preserve private moments during trips. In contrast to the canon of travel photographs, vernacular tourist photographs have attracted limited attention from scholarship. Through a review of private travel photographs, it is interesting to find a different version to tell the story of tourism in the Republican period.4.1 Snapshot and the Moments of Urban Life"}, {"type": "text", "text": "The photographs taken by hand camera were known as “snapshots” which was adopted from the hunting term referring to shoot spontaneously.238 The unpretentious images, which was called as “boring pictures” by Geoffrey Batchen, show a direct and specific response to the environment.239 Hand cameras with roll film greatly enhanced photographers’ mobility. They occupied less space, so photographers could easily carry them outdoors, and roll film eliminated the need to insert plates after clicking the shutter every time. Additionally, the fast focus of hand cameras and the many lenses available for the users made getting the perfect shot easier. All these advantages contributed to the popularity of instant photographs or snapshots. Alfred Horsley Hinton wrote in 1893 about hand cameras: “If used intelligently and with proper motive with definite aim and purpose, then should be a future for hand camera work not yet imagined.”240"}, {"type": "text", "text": "Hand cameras become the favorite among both serious amateurs and ordinary hobbyists in the Republican period. Since the 1930s, amateur photographers such as Chen Chuanlin, Wang Laosheng and Lu Shifu have been writing about the superiority of hand cameras and advocating the capture of the moments in the real world. A series of instructive essays written by advanced photographers about using a small box camera (xiao jingxiang 小鏡箱) appeared in photographic publications. Chen Chuanling, the founding member of the Black and White Photographic Society and one of the earliest Leica photographers in China, introduced and promoted the use of hand cameras such as Agfa Ansco Memo, Leica, Zeise Contax, Kodak Pupille, and Rodenstock. He declared that the portability of the camera and affordability of the film were the main advantages. Hand cameras using roll film are suitable for taking instant photographs, and the inexpensive film allows the photographers to take many shots and choose the best one.241 Wang Laosheng 王勞生 (1908-1961) wrote a series of articles in the magazine Flying Eagle which were characterized by strong technicality, aiming to offer practical knowledge to amateur photographers.242"}, {"type": "text", "text": "Lu Shifu’s article focused on the technical perspectives of different brands of hand cameras, such as body design, shutter speed, and operability.243 He criticized the old-fashioned and conventional expressions in fine art photography, arguing that the photographer should not be obsessed with pleasing the connoisseur and neglect the real-world subjects. In his article entitled “My Opinion on Art Photography” (wode yishu sheying guan 我的藝術攝影觀), he criticized that some pictorialist photographers who tended to borrow some motifs from traditional paintings and depict landscape with painterly effect:"}, {"type": "text", "text": "The subject of the landscape was the favorite subject among the"}, {"type": "text", "text": "audience, but it is not good as the depiction of lively emotions in life."}, {"type": "text", "text": "For example, the photographer juxtaposed an old tree surrounded by"}, {"type": "text", "text": "clouds and haze with several cottages, which is indeed commendable,"}, {"type": "text", "text": "but if the photographer placed an elderly person by the tree, or the"}, {"type": "text", "text": "cooking smoke around the cottage curls up, the audience would feel"}, {"type": "text", "text": "touching with the lively scene. 244"}, {"type": "text", "text": "The immediacy and simplicity that hand cameras brought fundamentally changed how photographers view and approach the photographic subjects. The ever-changing, individual perspective fits with the emerging urban space of the early twentieth century. Portable hand cameras with sensitive film and faster shutter speeds enable photographers, both professional and amateur, to make expressive records of urban life. Architectural historian M. Christine Boyer identifies the transformation of urban life in the late nineteenth century and early twentieth century from a model interpreted through the logic of the picture frame to “a series of fleeting impressions and momentary encounters.”245 By the 1930s, Chinese city dwells experienced a great shock triggered by a strong sense that these “impressions and encounters” conditioned by the technological spectacle in the cities."}, {"type": "text", "text": "The early twentieth century witnessed Shanghai’s development into a bustling metropolis, as well as the great revolution of the photographic technology. Photography was employed to participate in the growth and development of modern cities in the twentieth century. The Republican photographers performed much like the modern writers and poets, finding their own way to deal with the new corporeal/sensory experience in modern life. 246 Compared with the urban modernist writings in the 1930s,urban photographers not only explored the hustle of metropolitan life but also showed a deep humanistic concern on urban development. Meanwhile, the modernist photographic movement in Europe and America between the wars also encouraged the Chinese urban photographers to represent the metropolis by reinventing the modernist vocabulary."}, {"type": "text", "text": "Shanghai was a metropolis where multiple modernities co-existed within a diverse context. Before 1937, the semi-colonial Shanghai offered Chinese intellectuals a diverse and dynamic cultural environment, the intellectuals were willing to adopt Europe-American or Japanese ideas. So did the amateur urban photographers who mainly consisted of new middle classes in Shanghai. They embraced and adapted certain elements from European and American photographic modernism to represent their changing urban environment.247 Shanghai became a center where new ideas and technologies converged at an international level, and meanwhile it also developed an alternative version of modernity that negotiated between tradition and “modern”."}, {"type": "text", "text": "Some writers in Shanghai such as Mao Dun, Liu Na’ou 劉吶鷗 (1900-1940),Shi Zhecun 施蟄存 (1905-2003), Mu Shiying, and Hei Ying 黑嬰 (1915-1992), started to describe the bustling metropolitan environment, making the response to the emerging new urban culture. In 1926, Liu Na’ou wrote a letter to Dai Wangshu 戴望舒 (1905-1950):"}, {"type": "text", "text": "To us moderns, Romance cannot but be distant.... The street cars are too"}, {"type": "text", "text": "noisy, the sky that was once blue is blackened by factory soot, and the"}, {"type": "text", "text": "songs of the skylarks are mute. Muses, their harp strings broken, have"}, {"type": "text", "text": "flown away to who knows where. Does this mean that there is no beauty"}, {"type": "text", "text": "in modern life? No, there is, except its form has changed. We don’t have"}, {"type": "text", "text": "Romance, no trumpets sounding from castles, but we have thrill and"}, {"type": "text", "text": "carnal intoxication. This is what I mean by modernism (jindaizhuyi 近"}, {"type": "text", "text": "代主義).248"}, {"type": "text", "text": "The modernist movement in the field of literature led by the group “New Perceptionists” that consisted of Liu Na’ou, Shi Zhecun and Mu Shiying. Mu Shiying showed a remarkable visual sensibility in his novel “Shanghai fox-trot” (shanghai hubuwu 上海狐步舞), depicting the glittering lights of the skyline, the sounds and colors on the street, and the big parties in the dancing halls:"}, {"type": "text", "text": "Shanghai. A heaven built on hell!"}, {"type": "text", "text": "West Shanghai, bright moon climbing the sky, illuminating the wasted"}, {"type": "text", "text": "sprawl. Ashen sprawl, blanketed with silver-gray moonlight, then inlaid"}, {"type": "text", "text": "with deep gray tree shadows and heaps of village shadows."}, {"type": "text", "text": "NEON LIGHT reaches colored fingers writing large words in the blue"}, {"type": "text", "text": "ink of night’s void. An English gentleman stands there, wearing"}, {"type": "text", "text": "coattails, carrying a cane under his arm, walking with a lively stride."}, {"type": "text", "text": "Written underneath his feet: “JOHNNY WALKER STILL GOING"}, {"type": "text", "text": "STRONG.” At the roadside the real-estate utopia of a small grass lot,"}, {"type": "text", "text": "above it a Chesterfield-smoking American looks on as if to say, “What"}, {"type": "text", "text": "a shame this lilliputian utopia; is that big lot too small for me to put my"}, {"type": "text", "text": "foot down in?” 249"}, {"type": "text", "text": "The new sensations of the city life that was closely associated with sounds,lights, colors, and motion, inspired the writers to explore vitality and diversity of the city. A visual turn, which had been inscribed by modernist writings in the 1930s,continued to be represented by several local urban photographers who took advantage of hand camera’s innovations in an attempt to capture the rapidly changing spectacle of Shanghai.250 Beyond the sounds of traffic, various street scenes and the hustle of metropolitan life, urban photographers explored a variety of subjects ranging from the architecture of the Bund to the bombed ruins after the Battle of Shanghai in 1932."}, {"type": "text", "text": "A group of local urban photographers responded creatively to the exciting movements in modernist photography in Europe between the wars by deploying a new perspective on Shanghai’s architecture. The Bund was not only a site where colonial power was exercised and various colonizers’ architectural styles were exhibited, but also a space where diverse cultures mingled and tension between the motion and stillness, old and new, tradition and modern was in full view. 251 The numerous construction projects of the time inspired urban photographers to reveal the complexity,establishing a visual history of urban expansion. Through Jin Shisheng’s camera, the Customs House with its huge clock became an allegory for the fast-moving modern age and changing consciousness in a growing metropolis (Fig.4.1); he took several photographs of the Broadway Mansions in the 1930s. Except for 1934 photograph, he also took photos in 1935, 1936 and later 1947. He may have climbed the bridge or even lain prone on the flatbed of a truck, capturing the fleeting images from the distorted perspective (Fig.4.2). Deploying various perspectives to represent the building, Jin exhibited a dynamic metropolitan environment where the ever-changing Chinese modernity emerged and developed.252 Artists cultivated a “new vision” that offered perspectives for seeing the world anew and reshaped the perception of photography.Their disorienting dramatic viewpoints communicated the dynamism of the modern world and characterized a modernist imagery for a technologically developed Europe during that time.253"}, {"type": "text", "text": "Chen Chuanling, who drew much influence from Euro-American straight photography, highlighted the precision of the HSBC Building (also called tge Municipal Government Building) in Neoclassical style, and the lines and structure of Park Hotel that was designed by Czech architect László Hudec (1893-1958). The photographs representing the high-rise buildings in Shanghai shared the similarity with Alfred Stieglitz’s New York City imagery in the 1930s (Fig.4.3). The Western-style architecture and growing skyscrapers symbolized an increasingly mechanical and industrialized metropolis before the Sino-Japanese war. Urban photographers brought entirely new experiences to their audiences in the 1930s."}, {"type": "text", "text": "Photography, the essence of arresting the fleeting moment in modern time,played a significant role in imaging Shanghai in the motion. Photographs of the Grand Theatre, department stores, the shimmering neon lights, motion, color, sound, all the sensory visual spectacles contribute to the “shock experience” proposed by Walter Benjamin in his study of Charles Baudelaire.254 Ao Enhong specialized in capturing the sensory experiences in a metropolitan cultural environment. He represented the Grand Theatre with an emphasis on the lines of the architecture from a dramatic diagonal (Fig.4.4). In the 1930s, the growing number of theaters in the city had developed into colorful symbols of urban life. Going to the cinema became a new pastime for urbanities.In 1931, The Young Conpanion devoted a full-page spread to photographs of cinemas in Shanghai taken by the film maker Hu Jinkang 胡晉康 .255 The Grand Theatre,designed by Czech architect László Hudec and opened in 1933, became a new favorite subject of urban photographers. Jin Shisheng also took a night scene photograph showing The World Moves On—a movie title announced on the façade of Grand Theatre.256"}, {"type": "text", "text": "The new technologies of lighting illuminated nightlife like never before.Consumption, together with leisure activities, had been absorbed into the texture of the everyday lives of urban people. Jin Shisheng took some photos representing how urban people were playing the lottery, displaying the unique urban culture in Shanghai (Fig.4.5.1;4.5.2). Under the shimmering neon light, the crowd moves back and forth.Some people’s faces show anxiety or excitement. One slogan read: “If you play the lottery today, maybe tomorrow you will become a man of means.” Together these places of leisure and entertainment that sprang up in the foreign concessions became central sites of Shanghai's urban culture, and they in turn served the frequent subjects to image production and literary works."}, {"type": "text", "text": "Some new subjects, such as city ruins and death appeared in the photographs taken by local urban photographers. Jin Shisheng had taken several shots of the rubble brought about by an airstrike during the Battle of Shanghai in 1932. Employing the techniques of pictorialism, Jin depicted the vastness of destruction within a traditionally structured frame (Fig.4.6). Melancholy and poetic, the dramatic view of clouds of smoke that partly obscured the buildings emphasizes the devastating power of bombing.The apocalyptic vision presages the breakout of a full-scale war between China and Japan five years later."}, {"type": "text", "text": "Almost in the same period, a growing number of photographs of metropolises such as Paris, Berlin and New York were taken by European and American photographers. In the US, Alfred Stieglitz’s New York photographs exhibit the complexity of a growing metropolis, conveying the tensions and energies in American society early in the Great Depression.257 The modernist movements in Europe, such as New Objectivity (Neue Sachlichkeit) and New Vision (Neue Vision), essentially represent a new way of seeing the increasingly technologically developed metropolis between the two World Wars.258 The pioneer of New Objectivity movement German photographer Albert Renger Patzsch (1897-1966) published the book Die Welt ist schön (The world is beautiful) in 1928. The one hundred photographs in the book embody an objective and modernized way of looking the industrialized and mechanic world,indicating the tendencies of rationalization and alienation. German artist Karl Blossfeld’s (1865-1932) photographs, like Adiantum Pedatum, display the tactile qualities and intricate forms of the plants. These black-and-white close-ups show the great strength of the natural world (Fig.4.7). The Hungarian artist and Bauhaus school member László Moholy-Nagy (1895-1946) claimed that photography and other modern technology offered new and unfamiliar experiences, which produced completely new relationships in the world beyond simple reproduction.259 His 1928 photograph of Berlin Radio Tower achieves an abstract quality with his experimental perspective,which encourages the audience to view the city in a completely new way (Fig.4.8).Besides the movements of New Objectivity and New Vision, Russian Constructivists such as Alexander Rodchenko (1891-1956), who employed the bold formalistic visual language to change the human perception of the world, inspired Chinese artists to reveal the aesthetic of the ordinary objects.260"}, {"type": "text", "text": "Despite the pursuit of formal aesthetics, photographic modernism in Europe-American showed a critical attitude toward the tumultuous social and political upheavals between the world wars. Alfred Stieglitz's urban imagery portrays the alienation of modern life, showing ambivalence about the ever-growing metropolis. He recognized the way cities brought confusion and disorder to people and encouraged audiences to rethink urbanization. 261 The European photographers criticized more about the social issues. “A cracking age,” as Ernst Bloch described the period of Germany’s Weimar Republic, “in decay and in labor at the same time”.262"}, {"type": "text", "text": "The Euro-American photographers in the 1920s and 1930s recorded the ambivalence about the city. They recognized that cities stripped people of their individuality and identity, emphasizing the alienation and detachment in urban life.Meanwhile, Chinese urban photographers were enthusiastic about celebrating the blossoming of the metropolitan culture, inviting viewers to enjoy the urban spectacle.263 The growing metropolis in fact, became the symbol of a increasingly modernized nation.The celebration of modernization could also be found in the photographs of showing the industrial advancement in other Chinese cities. For example, Jin Shisheng's photographs in Qingdao in the early 1930s captured the railroad, power station, and shipyard in the harbor, exhibiting the flourishing industry and ongoing modernization (Fig.4.9)."}, {"type": "text", "text": "Although Shanghai became a bustling metropolitan city that compared favorably with Paris, Berlin, New York in the 1920s and 1930s, could it be called a modernist city? Scott McCracken argues that the way of imagining the city defines the essence of the city. The distinction between a modern city and a modernist city lies in the difference between the historical city of the industrial age and the ways in which that city was imagined.264"}, {"type": "text", "text": "There is no standard for the definition of “modernist.” What are the standards of a modernist city, besides the modernized infrastructure? Urban photographers attempted to use a new approach beyond colonial discourse and pictorialist expression,representing the texture of bustling metropolitan city life and the inevitable tension between motion and stillness, new and old, modernity and tradition. Despite their admiration of and adaptation to European modernism in urban imagery, urban photographers took a distinctive approach to modernism. European-American modernism emphasized the alienation and detachment in urban life, but Chinese modernism embraced the energy of the city.4.2 Hand Camera and the Rise of Leisure Travel"}, {"type": "text", "text": "The hand camera met the natural desire to record what we have seen. Eastman referred to the Kodak as a photographic notebook as a record of fugitive experiences in a lifetime.265 The snapshots of everyday travel experience can be seen as a cultural artifact, and seemingly ordinary photographs of the private histories of amateur photographers essentially became a crucial part of modern photographic practice.Beyond the documentation of the historical events, hand cameras and leisure travel brought everyday images into the history of photography. Taking outdoor shooting became more prevalent among the middle classes. In early twentieth-century Europe and America, the popularity of hand cameras and roll film was rising within the fascination with outdoor leisure activities.266 Travel provides encounters with authentic experience deemed absent in the middle-class life. Therefore, more and more European-American tourists were keen to look for a civilization that was not ruined by industrialization and modernization. The remnants of the ruins had been turned into objects for nostalgic visitors to take photographs.267 A 1931 Kodak advertisement juxtaposed a photograph of the Heaven Temple in Beijing that became a tourist attraction in Republican period and a Kodak Brownie, suggesting the close relationship between cameras and sightseeing (Fig.4.10). The popularity of the camera met with the craze for travel in Republican China. As Susan Sontag noted: “It seems positively unnatural to travel for pleasure without taking a camera along...Travel becomes a strategy for accumulating photographs...Most tourists feel compelled to put a camera between themselves and whatever is remarkable they encounter.\"268 The invention of hand camera affected the ways of seeing and further altered society’s sense of how time and space were visually represented.269"}, {"type": "text", "text": "With the introduction of hand cameras, leisure travel enjoyed great popularity among the new middle class in the 1930s. It is not difficult to find that traveling with hand cameras had become a new way of seeing the new nation and modern world. The privilege of traveling was also transferred from the elite and intellectual circle to more urbanites who had more leisure time than ever before. Travel in the Republican period was transforming from the privileges of the elite to a common leisure activity hobby."}, {"type": "text", "text": "The rise of the new middle classes in the cities, expanding transportation infrastructure, and relatively peaceful prewar environment boosted tourism in the Republican period. A new mode of public transportation was constructed in the plan of Nanjing government that aimed to “reconstruct” China to make it modern.270 The expanding transportation system provided more possibilities for leisure travel. By 1911,there was around 9,000 km of railroads in China. In the Republican period, the new government realized the importance of railroads for the purpose of strengthening national control.271 The new railways connected the hinterland to the Yangtze River Delta and economic center, bringing many visitors to Zhejiang and Jiangsu. In 1921, it took six hours by train from Shanghai to Hangzhou, and only four by express.272 The Shanghai-Hangzhou line enabled many amateur photographers in Shanghai to visit West Lake on short holidays; the completion of Hangzhou-Huizhou highway allowed travel enthusiasts in the Yangtze River Delta to visit Mount Huang as a day trip."}, {"type": "text", "text": "An ordinary travel photograph that was taken in Lanxi, where a village nearly 120 miles from Hangzhou, shows a group of tourists sitting and standing on the rocks in the streams (Fig.4.11.1; 4.11.2).273 “We enjoyed the landscape” was written on the back by Luo Bonian, who was a banker and an amateur photographer based in Hangzhou and Shanghai. Travel with one’s camera became a new trend among amateur photographers. As discussed before, outdoor shooting was one of the main photographic activities among amateur photographic societies and camera clubs, which gave birth to travel photography or tourist photography among the amateurs."}, {"type": "text", "text": "The camera embedded in the private travel experience functioned as a visual memory aid, approaching the essence of photography—a metaphor of the passage of time. Because photography preserved the appearance of the photographic subject, it h
