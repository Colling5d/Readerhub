<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When Kodak Came to China, 1900-1937 — 中英对照在线阅读</title>
<style>
  :root{
    --bg:#f7f5f0;
    --panel:#ffffff;
    --ink:#2b2b2b;
    --ink-soft:#6b6b6b;
    --accent:#8a3b2e;
    --accent-soft:#efe5df;
    --line:#e2ddd4;
    --sidebar-w:290px;
    --lang-head:#f0ebe2;
    --zh:#7a1313;
    --en:#133b7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,serif;
    font-size:17px;
    line-height:1.85;
  }
  .app{display:flex;height:100vh;overflow:hidden}

  /* ===== Sidebar ===== */
  .sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:#fbfaf7;
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .sidebar .brand{
    padding:18px 18px 14px;
    border-bottom:1px solid var(--line);
    background:var(--accent);
    color:#fff;
  }
  .sidebar .brand h1{font-size:19px;margin:0 0 2px;letter-spacing:.5px}
  .sidebar .brand p{font-size:12px;margin:0;opacity:.85;line-height:1.4}
  .toc{flex:1;overflow-y:auto;padding:10px 0 30px}
  .toc .toc-top{
    font-size:12px;color:var(--ink-soft);text-transform:uppercase;
    letter-spacing:1.5px;padding:8px 18px;
  }
  .toc-group{margin-bottom:4px}
  .toc-item{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:7px 18px;cursor:pointer;font-size:14.5px;font-family:inherit;
    color:var(--ink);border-left:3px solid transparent;line-height:1.35;
  }
  .toc-item:hover{background:var(--accent-soft)}
  .toc-item .sub{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:1px}
  .toc-item.active{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
  .toc-item.active .sub{color:var(--accent)}
  .toc-sep{border-top:1px solid var(--line);margin:8px 14px}

  /* ===== Search ===== */
  .search-box{position:relative;padding:12px 14px;border-bottom:1px solid var(--line)}
  .search-box #search-input{
    width:100%;box-sizing:border-box;padding:9px 11px;
    border:1px solid #d8d0c0;border-radius:6px;background:#fff;
    font-size:13.5px;font-family:inherit;color:var(--ink);outline:none;
  }
  .search-box #search-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(160,120,70,.15)}
  .search-results{
    position:absolute;left:14px;right:14px;top:calc(100% - 4px);
    background:#fff;border:1px solid #ddd4c2;border-radius:8px;
    box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:50;
    max-height:min(46vh,420px);overflow-y:auto;display:none;
  }
  .search-results.open{display:block}
  .search-results .sr-head{
    font-size:11px;color:var(--ink-soft);text-transform:uppercase;
    letter-spacing:1px;padding:8px 12px 4px;border-bottom:1px solid var(--line);
  }
  .sr-item{padding:7px 12px;cursor:pointer;border-bottom:1px solid #f1ece2}
  .sr-item:hover{background:var(--accent-soft)}
  .sr-item .sr-meta{font-size:11px;color:var(--ink-soft);margin-bottom:2px}
  .sr-item .sr-meta b{color:var(--accent);font-weight:600}
  .sr-item .sr-text{font-size:12.5px;line-height:1.45;color:var(--ink)}
  .sr-item .sr-text mark{background:#ffe9a8;color:#5a3d00;border-radius:2px;padding:0 1px}
  .sr-empty{padding:12px;font-size:12.5px;color:var(--ink-soft);text-align:center}

  /* ===== Main ===== */
  .main{flex:1;display:flex;overflow:hidden}
  .col{flex:1;overflow-y:auto;padding:0 44px 120px}
  .col.en{border-right:1px solid var(--line)}
  .col-head{
    position:sticky;top:0;z-index:5;padding:16px 44px;
    background:var(--lang-head);border-bottom:1px solid var(--line);
    font-size:13px;letter-spacing:2px;text-transform:uppercase;
    font-family:"Helvetica Neue",Arial,sans-serif;font-weight:600;
  }
  .col.zh .col-head{color:var(--zh)}
  .col.en .col-head{color:var(--en)}
  .article{max-width:760px;margin:0 auto}
  .chapter-title{
    font-size:28px;font-weight:700;line-height:1.35;margin:36px 0 6px;
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,serif;
  }
  .chapter-sub{font-size:16px;color:var(--ink-soft);margin:0 0 28px;font-style:italic}
  .p{margin:0 0 1.25em;text-align:justify}
  .p.title{font-size:22px;font-weight:700;margin:2.2em 0 .6em;color:var(--accent)}
  .col.zh .p.title{color:var(--zh)}
  .col.en .p.title{color:var(--en)}
  .p.txt-marker{color:var(--ink-soft);font-size:13px;text-align:center;letter-spacing:3px;margin:3em 0}
  .notes-head,.bib-head{
    font-size:24px;font-weight:700;margin:34px 0 16px;
  }
  .note{font-size:15px;line-height:1.7;margin:0 0 .9em;color:#3a3a3a}

  /* Para-level follow: highlight the matched paragraph in the paired column */
  [data-lang] {transition:background-color .18s ease}
  [data-lang]:hover{background:rgba(180,160,120,.10);cursor:pointer;border-radius:3px}

  /* EN column serif italic look */
  .col.en{font-family:"Source Serif Pro",Georgia,serif;font-size:16.5px;color:#1f1f1f}
  .col.en .p{line-height:1.7}

  /* Scrollbar */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfc8bc;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  /* Progress */
  @media (max-width:1200px){
    .sidebar{--sidebar-w:240px;width:240px;flex-basis:240px}
    .col{padding:0 28px 100px}
    .col-head{padding:14px 28px}
  }
  @media (max-width:900px){
    /* ---- 手机上保持 中英左右两栏对照 ---------------- */
    html,body{height:100%;overscroll-behavior:none}
    html{-webkit-text-size-adjust:100%}
    html,body{margin:0}
    .app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
    body{background:var(--bg)}

    /* 侧边栏：顶部紧凑（宽度方向不占正文） */
    .sidebar{position:relative;transform:none;width:100%;flex:none;max-height:44vh;min-height:0;
             border-right:none;border-bottom:1px solid var(--line);overflow-y:auto;
             box-shadow:none}
    .sidebar .brand{padding:8px 12px}
    .sidebar .brand h1{font-size:16px}
    .sidebar .brand p{font-size:11px}
    .toc{padding:4px 0 12px}
    .toc-item{padding:5px 12px;font-size:13px}
    .search-box{padding:8px 12px}
    .search-results{max-height:150px}

    /* 主体：左右两栏，各占一半，自有滚动 */
    .main{flex:1;display:flex;min-height:0;overflow:hidden}
    .col{flex:1 1 0;min-width:0;width:auto;height:auto;position:static;
         overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 90px;
         -webkit-user-select:text;-webkit-touch-callout:none}
    .col .p{-webkit-user-select:text;user-select:text}
    .col.en{border-right:1px solid var(--line)}
    .col-head{position:static;font-size:12px;padding:8px 10px}
    .col .p{font-size:13.5px;line-height:1.6;text-align:justify;margin:0 0 .55em;hyphens:auto}
    .col.en .p{font-size:12.5px;line-height:1.55}
    .chapter-title{font-size:19px;margin:16px 0 3px}
    .chapter-sub{font-size:12px;margin-bottom:12px;line-height:1.4}
    .article{max-width:100%}

    /* 笔记面板 / 工具栏 小屏适配 */
    #note-panel{left:10px;right:10px;width:auto;top:auto;bottom:12px;max-height:60vh}
    #note-toolbar{max-width:97vw;flex-wrap:wrap}
    #note-toast{bottom:16px}
    .makenote{bottom:14px;right:14px}
  }

  /* ===== 笔记：画线/高亮 ===== */
  .hlmark{padding:0 1px;border-radius:2px}
  .ulnote{text-decoration:underline;text-decoration-thickness:2px;-webkit-text-decoration-color:#e8504a;text-decoration-color:#e8504a}
  #note-toolbar{position:fixed;display:none;z-index:9999;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.16);padding:6px 8px;gap:4px;font-family:inherit}
  #note-toolbar .nt{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:4px;border:1px solid var(--line);cursor:pointer;margin:0 2px;font-size:12px;color:#555;background:#fff}
  #note-toolbar .nt:hover{border-color:var(--accent)}
  #note-toolbar .nt.ul{width:auto;padding:0 8px;font-weight:bold;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#e8504a}
  #note-toolbar .nt.colors{width:auto;padding:0 4px}
  #note-toolbar .hlc{width:18px;height:18px;border-radius:3px;border:1px solid rgba(0,0,0,.18);cursor:pointer;margin:0 1px;display:inline-block}
  #note-toolbar .nt.cpy{width:auto;padding:0 9px;font-size:12px}
  /* 句子高亮：临时（选中句子时） */
  .senthl{background:#f5e660;border-radius:2px;padding:0 1px}
  /* 跨语言对应句高亮 */
  .peer-sent{background:#a7d3ff;border-bottom:2px solid #2f6fb3;border-radius:2px;cursor:pointer}
  .makenote{position:fixed;bottom:22px;right:22px;z-index:9998;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:13px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);font-family:inherit}
  .makenote:hover{filter:brightness(1.1)}
  #note-panel{position:fixed;top:16px;right:16px;width:320px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);z-index:10000;display:none;font-family:inherit;font-size:13px}
  #note-panel.np-open{display:block}
  #note-panel .np-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
  #note-panel .np-head b{font-size:15px}
  #note-panel .np-head button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:2px 6px}
  #note-panel .np-item{border-bottom:1px solid var(--line);padding:9px 14px;cursor:pointer}
  #note-panel .np-item:hover{background:#faf7f2}
  #note-panel .np-item .np-meta{font-size:11px;color:var(--mute);margin-bottom:3px;display:flex;gap:6px;align-items:center}
  #note-panel .np-text{line-height:1.55;color:var(--ink);word-break:break-word}
  #note-panel .np-empty{padding:24px;color:var(--mute);text-align:center}
  #note-toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;z-index:10001;opacity:0;transition:opacity .25s;pointer-events:none}
  #note-toast.nt-show{opacity:1}
  /* sync jump */
  .go-en,.go-zh{cursor:pointer;color:var(--accent)}

  /* ===== 目录折叠交互 (SIDEBAR-TOGGLE) ===== */
  /* 贴在侧栏右缘的竖向把手（经典折叠面板样式），不会遮挡任何内容 */
  .sidebar-toggle{
    position:fixed;z-index:9990;top:50%;
    left:calc(var(--sidebar-w) - 15px);transform:translateY(-50%);
    width:22px;height:52px;border-radius:0 8px 8px 0;
    border:1px solid var(--line);border-left:none;
    background:#fbfaf7;color:var(--accent);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;line-height:1;padding:0;
    box-shadow:2px 0 6px rgba(0,0,0,.06);
    transition:left .22s ease, background .15s ease, color .15s ease;
  }
  .sidebar-toggle:hover{background:var(--accent);color:#fff}
  /* 折叠后把手贴到最左 */
  .app.sidebar-collapsed .sidebar-toggle{left:0}

  /* 侧栏折叠动画 */
  .sidebar{transition:margin-left .22s ease}
  .app.sidebar-collapsed .sidebar{margin-left:calc(-1 * var(--sidebar-w))}

  /* 手机端：顶栏折叠，把手改为右上角小圆钮 */
  @media (max-width:900px){
    .sidebar-toggle{
      top:8px;right:8px;left:auto;transform:none;
      width:30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.4);
      background:rgba(0,0,0,.2);color:#fff;box-shadow:none;font-size:14px;
    }
    .sidebar-toggle:hover{background:rgba(0,0,0,.35);color:#fff}
    .app.sidebar-collapsed .sidebar-toggle{left:auto;right:8px;background:var(--accent);border-color:transparent}
    /* 手机上折叠=顶栏收起 */
    .app.sidebar-collapsed .sidebar{max-height:0;min-height:0;border-bottom:none;overflow:hidden}
  }

  /* ===== 阅读主题 / 字体 / 章节 HUD (READER-THEME-HUD) ===== */

  /* --- 主题：通过 data-theme 覆盖 CSS 变量 --- */
  html[data-theme="sepia"]{
    --bg:#f3ead8;
    --panel:#faf3e3;
    --ink:#43382a;
    --ink-soft:#7d6f58;
    --accent:#8a5a2b;
    --accent-soft:#ece0c6;
    --line:#ddcfb0;
    --lang-head:#ebdfc5;
    --zh:#7a3a13;
    --en:#3a4a2f;
  }
  html[data-theme="dark"]{
    --bg:#1d2024;
    --panel:#26292e;
    --ink:#dfe3e8;
    --ink-soft:#98a0aa;
    --accent:#c98b6b;
    --accent-soft:#33383f;
    --line:#3a3f46;
    --lang-head:#2b2f35;
    --zh:#e6a08a;
    --en:#8fb6e8;
  }
  html[data-theme="night"]{
    --bg:#0e0f11;
    --panel:#16181b;
    --ink:#c9ccd1;
    --ink-soft:#7d838c;
    --accent:#b0785c;
    --accent-soft:#202327;
    --line:#26292e;
    --lang-head:#181a1d;
    --zh:#d99a84;
    --en:#84a9d6;
  }
  html[data-theme="dark"],html[data-theme="night"]{color-scheme:dark}
  html[data-theme="dark"] body,html[data-theme="night"] body{background:var(--bg);color:var(--ink)}
  html[data-theme="dark"] .sidebar,html[data-theme="night"] .sidebar{background:var(--panel)}
  html[data-theme="dark"] .sidebar .brand,html[data-theme="night"] .sidebar .brand{color:#fff}
  html[data-theme="dark"] .search-box #search-input,
  html[data-theme="night"] .search-box #search-input{background:var(--bg);color:var(--ink);border-color:var(--line)}
  html[data-theme="dark"] .search-results,
  html[data-theme="night"] .search-results{background:var(--panel);border-color:var(--line)}
  html[data-theme="dark"] .sr-item,html[data-theme="night"] .sr-item{border-bottom-color:var(--line)}
  html[data-theme="dark"] .sr-item:hover,html[data-theme="night"] .sr-item:hover{background:var(--accent-soft)}
  html[data-theme="dark"] .col.en,html[data-theme="night"] .col.en{color:var(--ink)}
  html[data-theme="dark"] .note,html[data-theme="night"] .note{color:var(--ink-soft)}
  html[data-theme="dark"] #note-toolbar,html[data-theme="dark"] #note-panel,
  html[data-theme="night"] #note-toolbar,html[data-theme="night"] #note-panel{background:var(--panel);color:var(--ink);border-color:var(--line)}
  html[data-theme="dark"] #note-panel .np-head,html[data-theme="night"] #note-panel .np-head{background:var(--panel);border-bottom-color:var(--line)}
  html[data-theme="dark"] #note-panel .np-item:hover,html[data-theme="night"] #note-panel .np-item:hover{background:var(--accent-soft)}
  html[data-theme="dark"] #note-toolbar .nt,html[data-theme="night"] #note-toolbar .nt{background:var(--bg);color:var(--ink);border-color:var(--line)}
  html[data-theme="dark"] .sidebar-toggle,html[data-theme="night"] .sidebar-toggle{background:var(--panel);color:var(--accent)}
  html[data-theme="dark"] ::-webkit-scrollbar-thumb,html[data-theme="night"] ::-webkit-scrollbar-thumb{background:#4a4f57}
  html[data-theme="sepia"] .sidebar{background:#faf3e3}

  /* ===================================================================
     趣味主题（与首页 add_home_theme.py 保持一致）：配色 + 纹样 + 装饰
     阅读器变量集：--bg --panel --ink --ink-soft --accent --accent-soft
                   --line --lang-head --zh --en
     =================================================================== */

  /* 动漫 */
  html[data-theme="anime"]{
    --bg:#fdf2f6;--panel:#ffffff;--ink:#3b2c3a;--ink-soft:#6f5266;
    --accent:#e26d9c;--accent-soft:#fbe0ec;--line:#f3d3e0;
    --lang-head:#fbe7f0;--zh:#a83a66;--en:#255f80;
    --rv-radius:18px;
    --rv-pattern:
      radial-gradient(circle at 12% 18%, rgba(255,183,206,.55) 0 6px, transparent 7px),
      radial-gradient(circle at 82% 62%, rgba(170,208,255,.5) 0 5px, transparent 6px),
      radial-gradient(circle at 40% 84%, rgba(255,214,102,.45) 0 4px, transparent 5px),
      radial-gradient(circle at 66% 12%, rgba(255,183,206,.4) 0 4px, transparent 5px);
    --rv-pattern-size:520px 520px,460px 460px,600px 600px,480px 480px;
  }
  /* 像素 */
  html[data-theme="pixel"]{
    --bg:#1a1c2c;--panel:#2b2d42;--ink:#f4f4f4;--ink-soft:#a7acce;
    --accent:#41e0a0;--accent-soft:#22303a;--line:#3b3f5c;
    --lang-head:#222436;--zh:#86f0c2;--en:#8fb6e8;
    --rv-radius:0px;--rv-font:"Courier New",ui-monospace,monospace;
    --rv-pattern:
      linear-gradient(rgba(65,224,160,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(65,224,160,.09) 1px, transparent 1px);
    --rv-pattern-size:22px 22px;color-scheme:dark;
  }
  /* 赛博朋克 */
  html[data-theme="cyber"]{
    --bg:#07070f;--panel:#101024;--ink:#d8e6ff;--ink-soft:#95a2d0;
    --accent:#00e5ff;--accent-soft:#161a3a;--line:#2a2f5c;
    --lang-head:#131634;--zh:#7df3ff;--en:#ff9ce8;
    --rv-radius:6px;--rv-font:ui-monospace,"SFMono-Regular",Menlo,monospace;
    --rv-pattern:
      repeating-linear-gradient(0deg, rgba(0,229,255,.07) 0 1px, transparent 1px 42px),
      repeating-linear-gradient(90deg, rgba(255,0,200,.07) 0 1px, transparent 1px 42px);
    --rv-pattern-size:auto;color-scheme:dark;
  }
  /* 水墨 */
  html[data-theme="ink"]{
    --bg:#f6f3ec;--panel:#fbf9f3;--ink:#20201d;--ink-soft:#57544b;
    --accent:#9c2b25;--accent-soft:#ece5d8;--line:#d8d2c4;
    --lang-head:#efe9dc;--zh:#8a2a22;--en:#3f4a55;
    --rv-radius:4px;--rv-font:"STKaiti","Kaiti SC","KaiTi",serif;
    --rv-pattern:
      radial-gradient(ellipse 55% 38% at 8% 12%, rgba(40,40,40,.07), transparent 70%),
      radial-gradient(ellipse 42% 30% at 92% 82%, rgba(40,40,40,.055), transparent 72%),
      radial-gradient(ellipse 30% 22% at 72% 22%, rgba(156,43,37,.05), transparent 70%);
    --rv-pattern-size:auto;
  }
  /* 森林 */
  html[data-theme="forest"]{
    --bg:#f1f5ee;--panel:#ffffff;--ink:#243024;--ink-soft:#5b6a55;
    --accent:#3f7d4f;--accent-soft:#e0eede;--line:#cfe0cb;
    --lang-head:#e8f2e5;--zh:#2f6a3c;--en:#4a5f7a;
    --rv-radius:14px;--rv-font:"Yuanti SC","PingFang SC",serif;
    --rv-pattern:
      radial-gradient(circle at 20% 30%, rgba(104,160,104,.14) 0 14px, transparent 15px),
      radial-gradient(circle at 70% 70%, rgba(104,160,104,.1) 0 20px, transparent 21px),
      radial-gradient(circle at 88% 18%, rgba(160,140,90,.12) 0 10px, transparent 11px);
    --rv-pattern-size:600px 600px,700px 700px,500px 500px;
  }
  /* 海洋 */
  html[data-theme="ocean"]{
    --bg:#eef6fb;--panel:#ffffff;--ink:#14313f;--ink-soft:#4d7183;
    --accent:#1273a8;--accent-soft:#dcecf6;--line:#c9e0ee;
    --lang-head:#e3f1f9;--zh:#0d5f8a;--en:#2b6a8f;
    --rv-radius:16px;--rv-font:"Yuanti SC","PingFang SC",serif;
    --rv-pattern:
      repeating-radial-gradient(circle at 50% 120%, rgba(18,115,168,.07) 0 2px, transparent 2px 26px);
    --rv-pattern-size:auto;
  }
  /* 复古报纸 */
  html[data-theme="news"]{
    --bg:#f2ede1;--panel:#fbf7ec;--ink:#23211c;--ink-soft:#5c5849;
    --accent:#8c2d22;--accent-soft:#e7e0d1;--line:#cbc3b0;
    --lang-head:#eee8da;--zh:#8c2d22;--en:#3f4a55;
    --rv-radius:2px;--rv-font:"Times New Roman",Georgia,serif;
    --rv-pattern:

me, and my mother always encouraged me to overcome the difficulties in the writing process. A final thanks to Wang Yicheng, for his understanding, patience, and constant encouragement."}]}, {"id": "intro", "title": "Introduction", "paras": [{"type": "title", "text": "Introduction"}, {"type": "text", "text": "Introduction"}, {"type": "text", "text": "Feng Zikai 豐子愷 (1898-1975), a painter and essayist in Republican-era Shanghai, discussed the explosive popularity of the camera: “Many of my friends owned their cameras and took photographs by themselves. Nowadays there are a number of camera shops on the street; it only costs approximately 10-20 yuan, and you can get a camera.”1 The acquaintances of Feng Zikai, who were the new middle classes in Shanghai, took up photography not only as a tool of recording, but also as a new leisure activity. In the Republican period (1912-1949), the affordability of the easy-to-use Kodak portable camera drove an increasing number of photographic enthusiasts to access to their own cameras. Embracing a new era of photographic awareness, the urban bourgeoisie and new intellectuals in the major cities sought a new medium to capture their modern experience."}, {"type": "text", "text": "In contrast with the remarkable division of the photographic market in Europe and America in the 1910s and 1920s, Chinese amateur photographers––both ordinary hobbyists and advanced amateur photographers who can be identified as fine art photographers––emerged at almost the same time. After Eastman Kodak opened its first branch in Shanghai in 1920, the Chinese photographic market entered a new era of handy portable cameras and roll films.2 As opposed to studio photography, the amateur photographers in the Republican period embraced photography as a serious art and attempted to legitimize it as fine art. They established a series of photographic societies from the 1910s to the 1930s, which not only developed a new photographic vocabulary but also offered the platforms to promote public understanding of photography as a new by Long xizu 龍熹祖 (Tianjin, Tianjin renmin meishu chubanshe, 1988), 156-169.art form. Many ordinary photographic hobbyists were also actively engaged in a number of photographic activities. For example, thousands of amateurs took part in the public photographic exhibitions held by the Light Society (Guangshe 光社) and Chinese Photographic Society (Zhonghua sheying xueshe 中華攝影學社), or more simply called the Hua Society in the 1920s and Black-and-White Photographic Society (Heibai yingshe 黑白影社) in the 1930s, according to news reports; the largest photographic society was the China Photographic Society (Zhongguo sheying xuehui中國攝影學會), founded by Lin Zecang 林澤蒼 (1903-1961) in Shanghai, which claimed over thousand members to include both ordinary hobbyists and serious art photographers. In my research, amateur photography refers to not only the artistic practice of serious amateur photographers, but also to quotidian activities in modern cultural life by ordinary photographic hobbyists. How the great enthusiasm for the photographic exhibitions emerged and developed is still an untold story."}, {"type": "text", "text": "The history of colonial photography in treaty-port China and art photography in the Republican period have received the most scholarly attention. Monographs on the history of Chinese photography by scholars such as Terry Bennett, Claire Roberts, Wu Hung, Ma Yunzeng, Chen Shen, Gu Zheng, and Tong Bingxue focus on the contributions made by a group of art photographers.3 Some articles and catalogues on the field of Chinese photography focus more on the case studies of some specific photographers or photographic societies, which laid a foundation for future research.For example, the articles in Brush and Shutter: Early Photography in China identify the new artistic vocabulary invented during photography’s first century from the late Qing period to Republican Shanghai and wartime Chongqing.4 The article “Early Twentieth-Century Art Photography in China: Adopting, Domesticating, and Embracing the Foreign” by Richard K. Kent examines the emergence and development of art photography in Republican China, which was the first time that Chinese fine art photographers were examined as the research subject.5 Several dissertations address some critical issues of the relationships between art photography, traditional style Chinese painting, and popular culture in the Republican period.6"}, {"type": "text", "text": "Case studies of some specific amateur photographers have emerged in recent years.The book “Relics: Jin Shisheng and Modern Chinese Photography” (Chenji: Jin Shisheng yu xiandai zhongguo sheying 陳跡:金石聲與現代中國攝影) publishes the photographs of a talented amateur photographer, Jin Shisheng 金石聲 (1910-2000), for the first time, and a series of articles written by scholars from the US and China.7 Jin Qing China examines that how photographs circulated and commercialized in the treaty ports. Jeffrey Cody and Frances Terpak, “Through a Foreign Glass: The Art and Science of Photography in Late Qing China,” in Brush and Shutter, Early Photography in China, Frances Terpak and Jeff Cody, eds (Los Angeles: Getty Publications;Hong Kong University Press, 2011), 33-68; Sarah Fraser’s article Chinese as subject: Photographic Genres in the Nineteenth Century discusses how photography as a new medium shaped China’s national image at an international level. Sarah E. Fraser, “Chinese as Subject: Photographic Genres in the Nineteenth Century,” in Brush and Shutter, 90–109; and Wen-hsin Yeh’s article Beyond the Frame: The Camera in Republican Shanghai and Wartime Chongqing investigates the key role of photography in Republican Shanghai and wartime Chongqing. Wen-hsin Yeh, “Beyond the Frame: The Camera in Republican Shanghai and Wartime Chongqing,” in Brush and Shutter, 111-119.the Foreign,” The Trans-Asia Photography Review, no. 2 (Spring 2013). Accessed June 1, 2018.https://quod.lib.umich.edu/t/tap/7977573.0003.204/--early-twentieth-century-art-photography-in-china-adopting?rgn=main;view.Landscape Perception, 1912-1949 explores that how photography and outdoor sketching transformed the perceptual mode in traditional style paintings, which provides a new way to reconsider the relationship between photography and painting in the Republican period. Yi Gu, “Scientizing Vision in China: Photography, Outdoor Sketching, and the Reinvention of Landscape Perception, 1912-1949” (PhD diss., Brown University, 2009); Hsueh Sheng Chen’s PhD dissertation Art Photography in China before 1949: The Continuation and Transformation of an Elite Culture addresses the shifts of art photography from an elite culture to popular art through the examination of the photographs taken by art photographers in the Republican period. Hsueh Sheng Chen, “Art Photography in China before 1949: The Continuation and Transformation of an Elite Culture” (PhD diss., Asia Institute, The University of Melbourne, 2010).Shisheng and Modern Chinese Photography] (Shanghai: Tongji University Press, 2016).Shisheng had the dual identities of an outstanding urban planner and a pioneering amateur photographer. He started to take photographs in 1930s Shanghai, when he studied civil engineering at Tongji University. Embracing the definition of an amateur as a serious and creative artist, Jin Shisheng contributed greatly to the popularization of art photography and promoting modernist experimentation. In 1938, with the scholarship from the Humboldt Foundation, Jin Shisheng went to Germany to study road and urban engineering. His individual wartime memories associated with private photographs and diaries provide a different perspective on the history of transnational encounters between China and Germany."}, {"type": "text", "text": "Another book “Luo Bonian” (駱伯年) edited by Three Shadows Photography Art Centre and published in 2016, Beijing, displays the private photographic works from a Hangzhou amateur photographer Luo Bonian 駱伯年 (1911-2002), a banker in Zhejiang Province. The introduction “Luo Bonian: Three Approaches” written by Stephanie H. Tung not only outlines his life and creations, but also investigates the significant context of his amateur photographic creation.8 The 2015 exhibition Chinese Photography: Since the Twentieth Century (Zhongguo sheying: ershi shiji yilai 中國攝影:二十世紀以來) at the Three Shadows Photography Art Centre, Beijing, presents a selection of photographs with varied techniques and styles, charting the history of photography in the twentieth century China. It is worth noting that the exhibition incorporated many unpublished works from amateur photographers who embraced photography as a serious art in the Republican period.9"}, {"type": "text", "text": "However, the scholarship that focuses on the ordinary photographic hobbyists in Republican China is still narrow. The major reason for neglecting the contributions made by amateur photographers is the huge difficulty in collecting and preserving private photographs. In the turbulent twentieth century, it was very hard for the descendants of amateur photographers to preserve prints, negatives, and albums. Many works by Luo Bonian and Jin Shisheng were lost during the Cultural Revolution because the subjects such as architecture on the Bund and ladies in the Republican period, which were closely related with “bourgeoise art,” were seen as taboo during the Cultural Revolution. It was not until ten years ago that the commercial photographic market in China gradually developed; however, photo collectors generally prefer to collect portraits of celebrities or fine-art photographs. The cultural value of photographs by amateur photographers in the Republican period is still neglected.10"}, {"type": "text", "text": "Both serious amateur photographers and ordinary photographic hobbyists contributed to the diversity and vitality of modern Chinese photography. The introduction of Kodak and other brands of the portable camera such as Leica and Contax in Chinese market triggered a huge enthusiasm for photographic hobbyists,enabling them to create an increasingly large number of photographs that not only reflected the social and cultural history of modern China bur also expresses personal sentiments in an age of political upheaval.11 In"}, {"type": "text", "text": "an"}, {"type": "text", "text": "immature"}, {"type": "text", "text": "but"}, {"type": "text", "text": "continuously developing photographic market, there was no big gap between serious amateur photographers and ordinary photographic hobbyists. Both embraced the flourishing experimentation of Zou Boqi 鄒伯奇 (1819-1869) to Liang Qichao’s 梁啟超 (1873-1929) efforts to legitimize photography as modern science, the upper class and intellectuals took advantage of photography as a symbol of modernity to transmit Western knowledge and promote reform in China.17 The capacity to represent social reality connected photography to the dynamics of the modern world. In the early twentieth century China, the desire to see and know the modern world emerged within the context of scientific enlightenment and self-awareness, encouraging more intellectuals and elites to explore the variable functions of photography in the new era of modernity."}, {"type": "text", "text": "Chinese intellectuals and artists with varied cultural positions represented the transformative modern art landscape by adapting the idioms of Euro-American artists into local artistic expressions. Between the two world wars, Chinese photographers responded creatively to the exciting movements in modernist photography in Europe and America. Collages, photomontages, and design photography offered new ways to represent the emerging metropolis. Since the 1920s, groups of amateur photographers adapted the photographic language to local contexts, attempting to develop a localized photographic art. Liu Bannong 劉半農(1891-1934) of the Light Society wrote a long theoretical essay entitled “The Talks on Photography” (Bannong tanying 半農談影),interpreting photography as a genre of fine art through appropriating terms and methods from traditional painting theory; 18 Lang Jingshan 郎靜山 (1892-1995) of the Hua Society employed sophisticated darkroom techniques to incorporate several literary motifs into an emulative traditional Chinese painting, developing a signature style of composite photography on an international stage; Lu Shifu 盧施福 (1898-1983) and Chen Chuanling 陳傳霖 (1897-1945) of the Black-and-White Photographic Society tried various approaches to the modernist style of European and American photographers, but on their own terms. A number of fine-art photographs in the 1920s and 1930s highlighted the role of photography in a complex conception of modernity in China."}, {"type": "text", "text": "My dissertation examines how amateur photography emerged and developed in China from 1900 to 1937, and how the photographic societies, exhibitions and publications opened new avenues of photographic expression after six decades of problematic colonial photography. Through the examination of a lot of private photographs by the amateur photographers in the Republican period, I argue that photography, once a luxury hobby of the elites in the late nineteenth century was transformed into a new communicative and expressive medium for new intellectuals and bourgeoisie in Republican China. This rise of amateur photography in China and the new photographic vocabulary developed by the photographic societies, exhibitions,and publications from the 1900s to the 1930s indeed contributed to the particular aspects and eventual growth of Chinese visual modernity which is a comprised,complex conception of modernity in the first half of the twentieth century China."}, {"type": "text", "text": "The first chapter The Ubiquitous Gaze: Photography, Subjugation, and the Leisure Life in Early Treaty Port China explores how hand cameras were employed to represent the violence, conflicts and occupation during the social upheavals in 1900-1901, and how the expatriate photographic community in the treaty ports took up photography as a new hobby. From cumbersome photographic equipment to small boxes, the advancement of camera technology made photography ubiquitous, just as photographs were absorbed into the representation of exoticism and subjugation. The hand camera had not only been used as a tool of recoding the historical moments, but also a new entertainment product among the expatriates who mainly lived in treaty port China.Several camera clubs held exhibitions and workshops for their members. Beyond the colonial photography, the advent of hand camera and the rise of amateur photography in treaty port China contributed to new way of documenting transformative Chinese society."}, {"type": "text", "text": "Chapter two Revisiting the “Kodak Moment”: Kodak and the Rise of Amateur Photography in China contextualizes the photographic engagements of the emerging amateur photographers, including both serious amateur photographers and ordinary photographic hobbyists in the Republican period. The novel and exciting visual experience were represented through the Kodak camera, promoting the Chinese to see the nation and the individual as an independent visual subject. Through the dissemination of photographic knowledge and abolishment of superstition,photography, which was a once esoteric practice, gradually became a new leisure activity among the new intellectuals and the urban bourgeoisie. The Kodak Company in China promoted the amateur photography with extensive marketing. The emphasis on the simplicity, affordability and portability of the camera attracted more and more amateur photographers in 1920s and 1930s China. Meanwhile, Kodak publications provided a comprehensive knowledge for self-taught photographers. A lot of photographic societies formed to develop a new photographic vocabulary from 1910s-1930s. The Kodak portable camera also encouraged the Chinese urban amateur photographers to capture everyday life; Additionally, serious amateur photographers began to represent the modern art landscape."}, {"type": "text", "text": "Chapter three Democratization of the Images: Amateur Photography in Public Spaces explores that how photographic exhibitions transformed the way of viewing and appreciating pictures among the public, creating a new public space for learning and communication. A series of exhibitions held by the amateur photographic societies in Beijing, Shanghai, Tianjin, Guangzhou and Nanjing, legitimizing photography as a genre of fine art and expanding the public understanding of modern art. The story of Kodak coming to China was interwoven with the local amateur’s demand to record modern life and shape their self-identity. In the 1920s and 1930s the Eastman Kodak Company created a multitude of ways to attract the costumers and cultivate the amateurs’ aesthetic tastes in line with modern life."}, {"type": "text", "text": "Building upon the second- and three-chapters’ examinations, Chapter four Portable Landscapes: Urban Spectacles, Leisure Travel and Representing the Nation examines that how amateur photographers utilized the hand camera to represent the candid moments of urban life and leisure travel in 1930s China. Beyond the colonist legacy, many urban photographers tended to picture the growing metropolis of Shanghai in the modernist idiom of German and other European photographers.Inspired by both a flourishing Shanghai urban culture and the impact of foreign modernist photography movements such as New Objectivity and New Vision, these photographers deployed new ways of seeing the changed and changing environments.The arrival of Kodak and another brand of hand camera encouraged a growing number of amateur photographers to take snapshots when they traveled. Travel underwent a transformation from an elite pastime to a modern leisure activity in the Republican era.The mechanized travel with a hand camera fundamentally changed the way of perceiving moving landscape. The rise of the new middle classes in the cities,expanding transportation infrastructure, and relatively peaceful prewar environment boosted tourism in the Republican period. Some amateur photographers deployed the camera not only as a leisure product but also a documentary tool. Beyond leisure travel to scenic spots, an increasing number of Chinese intellectuals promoted a trend of nationwide tours to explore the new cultural landscape of Republican China. During the leisure travel and cultural investigations in the 1930s, the amateur photographers revealed the potential of hand camera as both documental and educational tool,developing a new perspective to depict and discovery the national landscape of an emerging Republic."}, {"type": "text", "text": "The last chapter Reconfiguring Realism: Transformative Pictorialism and New Visions demonstrates the efforts of the 1930s Chinese amateur photographers contributed to the diversity of subjects and styles in the history of Chinese modern photography. Photography as a Western-style art form recognized and legitimized through the appropriation and adaption of traditional-style ink painting by the Chinese amateur photographers. Photomontages and design photography offered a new perspective to depict the increasingly industrialized modern world. The efforts of the amateur photographers expanded the boundary of photographic expression and enriched the vocabulary of Chinese modern art."}, {"type": "text", "text": "After six decades of problematic colonial photography, increasingly number of Chinese amateur photographers attempted to open new avenues of photographic expression. Photography was employed to record the development of the modern cities in the twentieth century. The photographs taken by the amateur photographers perform as a private archive, implying a desire to capture the fleeting moments. The Republican photographers consciously found their own way to deal with the new corporeal and sensory experience in modern life. The artistic works, travel snapshots, family photographs, and pictures of daily life in China allowed these amateurs to establish a precise association with the environment, the family, and the new nation. The invention and improvement of camera technology made it possible. The spontaneity, immediacy,and intimacy of these snapshots provide a new perspective on Chinese amateur photographers’ cultural and artistic lives in the Republican period."}]}, {"id": "ch1", "title": "Chapter 1 · The Ubiquitous Gaze", "paras": [{"type": "title", "text": "Chapter 1 · The Ubiquitous Gaze"}, {"type": "text", "text": "Chapter 1: The Ubiquitous Gaze: Photography, Subjugation, and the Leisure Life in Early Treaty Port China Introduction"}, {"type": "text", "text": "Photography had been introduced into China with British imperial expansion during the first Opium War (1839-1842). The unequal reception of photography in 19th century China suggests that photography as a revolutionary medium not simply leads to accurate representation, but also symbolizes a gaze of controlling power relating to the hierarchy and surveillance in the context of colonialism. The initially passive, rather than strongly collaborative, reception of photography in colonial contexts should serve as an indication––from the very beginning—that photography cannot be seen simply as technology, but as an extension of the human eye, compounding the construction of power relationships. The camera gaze, as John Tagg argued, works as new strategies of power, promoting the establishment of a hierarchical system and provides a new means of surveillance. 19"}, {"type": "text", "text": "The photographic technology developed in tandem with the colonial expansion in the nineteenth century. From heavy equipment to small boxes, the development of the technology made photography ubiquitous. A large number of photographs were absorbed into the representation of exoticism and subjugation. Beside the documentation of occupation, both professional and amateur, enthusiastically took some everyday snapshots in the interior of the Forbidden City, shifting from the demonstration of colonial power to observation and surveillance of everyday lives. In the late nineteenth century and early twentieth century, European and American expatriates living in China employed Kodak cameras to document the leisure activities.1.1 Photography and Subjugation"}, {"type": "text", "text": "What happens when a modern medium encounters a changeless and static empire? The photographic history of the Forbidden City started in 1860 with Italian-British photographer Felice Beato’s (1832-1909) wet collodion photographs. Beato was the one of the first photographers to represent the Forbidden City and promote the diffusion of these images around the world. After the Second Opium War (1856-1860),Beato visited the Forbidden City as a part of the military campaign. Equipped with a large box camera containing 10 x 12 plates, he departed from the Qian Gate and went through the Tian’an Gate and the Duan Gate, arriving at the Meridian Gate, the entrance of the Forbidden City. Then he climbed Jing Mountain, overlooking the Forbidden City,and took a photograph of the sweeping vista (Fig.1.1).20 Beato’s photographic practices not only manifest the significant role of the photographer in the colonial expansion, but also initiated a new way of framing historical monuments."}, {"type": "text", "text": "By the 1890s, the history of Chinese photography consists of several significant photographs which had been taken by some renown photographers. The earliest daguerreotypes in China were taken by French photographer Jules Itier in 1844 after two years of the first Opium War (1839-1942). Besides these obscure indoor photographs, Itier documented the view of Canton and Macao during his travel up the Pearl River to Canton from the end of October to December 1844. These daguerreotypes—in total 32 plates for the first time depict the true representations of China and Chinese people.21 At the same time, some amateurs were also active in some photographic experiments in the very beginning. Due to the technique limitation, the experiments of the amateurs seemed unsuccessful.22"}, {"type": "text", "text": "The photographic technology developed in tandem with the colonial expansion in the nineteenth century. By the end of the nineteenth century, the third generation of photographic technology—dry plates and films almost replaced daguerreotype,calotype, and wet-glass plate—the first and two generations of photographic technology, and the rise of portable cameras offered great benefits for transmission of the images. In 1888, the Eastman Dry Plate Company in Rochester, New York began to produce the Kodak Camera with fixed focus and flexible roll film. The slogan, “You press the button, we do the rest,” invited more amateurs to capture spontaneous moments. In 1900, Kodak company launched the first mass-marketed camera, Brownie.The initially designed for children camera was portable and much easier to transport.23 Alfred Stieglitz commented that this invention was the beginning of the “photographing by the yard” era. Although many photographers rejected the small camera, Stieglitz highly praised its portability and simplicity. In the essay, he argued that the hand camera made the instrument become “a second nature”, allowing the hands, minds, and eyes to be fully occupied with the photographic subject. And the “simplest pattern” of the hand camera helped the photographer capture the moments easily and immediately. In Narratives (Leiden: Brill, 2012), 3-38.practice, the photographer waited several hours to grasp the desired picture, just as his 1893 photograph “Fifth Avenue, Winter”.24"}, {"type": "text", "text": "It was the fact that the arrival of hand camera offered more possibilities for outdoor shooting, in other words, its easy-to-use quality met the desire of capturing the motion and life in the changing world. The photographs taken by hand camera were known as “snapshots” which was adopted from the hunting term referring to shoot spontaneously.25 The transformation of visuality ushered in a new era of representing and perceiving the world. Jonathan Crary discussed that the camera obscura with the fixed position was too inflexible for ever-changing cultural and political landscape since the nineteenth century. The location of vision has been transforming from a fixed position to the human body. A new “decentered observer” emerged with small portable instrument diverted the photographer’s attention from machine operation. In the early nineteenth century, a new mode of visual reproduction and perception emerged, in which the observer, as the subject of vision and perception, moved away from the fixed,closed way of seeing in the “camera obscura” mode and entered the fluid, changing world, where the observer’s bodily experience intervened in the process of visual production, reconstructing the relationship between self and world in changing time and space. 26"}, {"type": "text", "text": "The invention of Kodak in 1888 made photography ubiquitous. Snapshotting as a way of recording immediately was paralleled with the rapidly growing colonial expansion in a global sphere, and the simple mechanism facilitated the documentation and surveying. Easy to carry and operate, Kodak could be used for sightseeing and expeditions abroad. During the expansion of colonialism, the power of photography was exploited in military, commercial and propagandistic arenas. An increasing number of photographers initiated expeditionary and travel photography in Asia, Africa, and Latin American in the latter half of the nineteenth century."}, {"type": "text", "text": "Before discussing the photographic practices of the amateur photographers in treaty port China, I would examine how hand cameras were employed to represent the violence, conflicts, and occupation during the social upheavals in the late nineteenth century and early twentieth century China. The instant photographs had been absorbed into the representation of the massacre, war and famine—violence perpetrated by both foreign troops and the Boxers in northern China, transforming China from a static Ancient Empire to a chaotic battle land.27"}, {"type": "text", "text": "Giuseppe Messerotti Benvenuti, an Italian military officer, was documented with Kodak in China at the time of the Boxer Rebellion. In his memoir, he described that:“Everyone is a photographer around here, which means just about anyone can go click click with a camera, and there are a lot of them around.”28 He was full of enthusiasm to capture the brutal execution on the Boxers. A photograph with caption Teste di decapitati, maggio 1901 (Heads of decapitated, May 1901) was enclosed in a letter he sent.29 The photographer outside the picture happened to have caught the military photographer who was taking shot of a decapitated body. The photograph emphasized his presence as a photographer and a witness of the Boxer Rebellion (1898-1901) (Fig.1.2)."}, {"type": "text", "text": "In June 1900, the allied forces––Great Britain, the United States, Germany, France,Austria, Italy, Russia, and Japan—entered China to rescue the besieged legations during the Boxer Rebellion and suppressing the uprising. After the military task was completed,they started to punish and teach lessons to the Qing government and Chinese people.As James L. Hevia argued that a “photography complex” as a network made up a new array of photographic technology, photographer and communicative agencies functioning as an apparatus of surveillance documenting “reality” and the whole process of punishing.30"}, {"type": "text", "text": "The year 1900 became a watershed in the history of photography of the Forbidden City. Ranging from Kodak cameras to a balloon above the sky, a variety of photographic apparatuses were utilized to record the process of punishment,transforming the Forbidden City from a sacred space of the empire to a spectacle for a global audience.31 All countries attached great importance to the preservation of visual records during the occupation. The visual archives of each allied forces complemented each other and referred to each other, forming an interactive system.32"}, {"type": "text", "text": "Felice Beato's landmark bird's view of the Forbidden City was undoubtedly a reference point for the earliest aerial photographs in China taken by French Expeditionary Engineer officers from a balloon in 1900. The balloon drifted from Tianjin to Beijing, with the French taking the views of the church, streets, and houses below. Finally, they landed near the Forbidden City. From the West to the East, they took the aerial views of Summer Palace, White Dagoba, Jing Hill, and an encompassing view of the Forbidden City running through the north-south axis (Fig.1.3). The 12 aerial photos, together with other snapshots taken from 1900 to 1901, a total of 272 pieces are arranged into 42 photographic plates in an album entitled \"China on land and in balloon\" (La Chine à terre et en ballon). 33 Balloons were employed into various military conflicts starting in the first half of the nineteenth century. Lots of aerial photographs could be taken from the balloons during the war. 34 Since 1888, Kodak with considerably faster shutter speed, brought great changes for aerial photography. British aerial photographer John Mackenzie Bacon (1846-1904) took his first flight with Kodak in 1888, the year that saw the invention of the first Kodak camera.35"}, {"type": "text", "text": "Through the ubiquitous gaze, the Forbidden City was extensively photographed contributing to an international image of the empire. Over hundreds of photographs taken by American military photographer Cornelius Francis O’Keefe (dates unknown) during 1900–1901 almost covered the whole process of subjugation and punishment.36 O’Keefe had been a professional photographer working in Leadville, Colorado when the Spanish-American War broke out. He enlisted in the army and was sent to the Philippines. 37 He was constructing a complete record of the occupation per US Commander General Adna Chafee’s instructions. In 1900, combat photography was not an established genre; war ruins in the aftermath of the battle and “occupation” were the main subjects in his photographs. O’Keefe captured dead bodies lying along a canal photographs] (Paris: Berger-Levrault, 1902).from Anson’s Voyage to the Philippine-American War (Berkeley: University of California Press, 2018), 147-177.near Dongbian Gate when the allies battled with Chinese infantry. Adjacent to the western wall of Legation Quarter, Qian Gate was the most damaged site during the Boxer Rebellion. The fire ignited by the Boxers and troops successively destroyed the watchtower and tower in July and August. On August 15, the day after the besieged legations were relieved, Qian Gate, directly towards the Imperial City, was blasted open by the US artillery under the order of General Chaffee. The following day, August 26,the allied commanders agreed to occupy the Imperial City, and the city of Beijing was quickly overtaken."}, {"type": "text", "text": "O’Keefe captured the moments when the US Army invaded the city by building a ladder and blowing open the path leading up to the Hall of Supreme Harmony. He also took several photographs of the devastated houses, churches, and temples in Tartar City (Fig.1.4). Divorced from the picturesque style of the nineteenth century, O’Keefe demonstrated the documentary power of the camera in his depiction of war ruins. Contrasted with the pioneering nineteenth-century war photographer Felice Beato’s meticulously organized staged photographs of the Second Opium War, O’Keefe’s ruin photographs convey an overall impression of the deconstruction of the city, moving forward to a new era of documentary photography."}, {"type": "text", "text": "During the Boxer Rebellion, abandoned monuments and imperial residences were occupied by the allied forces and extensively photographed by army photographers,transforming the process of punishment into a performance of power.38 On August 28,a triumphal march comprised of military contingents from the eight nations as well as the diplomatic corps was held as a lesson to the Chinese government. The allied forces marched up the central avenue leading through the Imperial City. A photograph even shows an army photographer taking shots for the diplomatic corps (Fig.1.5). The throne Empire of Vision, 283-314.is undoubtedly a popular subject during the subjugation. O’Keefe’s empty throne in the deserted palace suggests the loss of Qing sovereignty (Fig.1.6). Walking though the yards and palaces reserved solely for the emperor and his mother, Empress Dowager Cixi, the photographers took the views of the entrance of the Emperor’s private rooms and the principle throne in Qianqing Palace."}, {"type": "text", "text": "Vivid, tangible and pleasurable, stereography became a perfect medium for exhibiting the exoticness for the European-American audience. The stereoscope, a visual medium which gained the greatest popularity in the nineteenth century, provided visual pleasure by creating directly signifies tangibility of the images. As Oliver Wendell Holmes, the inventor of the hand-held stereo viewer, imagined in his essay “The Stereoscope and the Stereograph”: “The time will come when a man who wishes to see any subject, natural or artificial, will go to the Imperial, National, or City Stereographic Library and call for its skin or form, as he would for a book at any common library.”39 His enthusiastic prediction was written in the era of industrial modernization and colonial expansion, indicating a hierarchic knowledge system consisting of tangible and immediate images was being developed with the advancement of photographic technology."}, {"type": "text", "text": "James Ricalton (1844-1929), a peripatetic American photographer, developed a stereographic project that included images of India and China, displaying historical events and peoples in the “Far East” for a global audience. In James Ricalton’s Meridian Gate stereograph, the viewers would have an immersed visual experience, as if they had truly watched American minister to China Edwin Hurd Conger and his wife Sarah Pike Conger approaching the Meridian Gate (Fig.1.7). 40 The visual effects that stereoscope provided visual pleasure immersed in the sense of illusions. The transformation of visuality ushered in a new era of representing and perceiving the world. Allan Sekula argued that the stereoscope and the viewer lost all sense of the material substrate of the image, which was liable to result in a belief in dematerialized form. Therefore, the viewing process was analogous to the capitalist exchange process,which was not only the base of a global political economy but also a new hierarchy of"}, {"type": "title", "text": "knowledge and power.41"}, {"type": "text", "text": "The photographs from Japanese photographers are technically and aesthetically of a higher standard, and, more importantly, show a greater understanding of East Asian architecture and cultural implications.42 Photography was introduced to Japan in 1848,almost at the same time as China. Japan and China shared many similarities in embracing and adapting photography in a local context. Similarly, commercial photography studios in Chinese treaty ports like Canton, Shanghai, and Tianjin gradually dominated the domestic photographic market in the late nineteenth century.43 The prosperity of photography in Japan benefited greatly from the Meiji government’s protective measures on cultural property. For establishing a national treasure system Rebellion. Sanshichiro Yamamoto 山本讃七郎 (1855-1953) departed from Tokyo for Peking to take photographs during the Boxer Rebellion. He took the views of the Imperial Palace, temples, and some war ruins. A total of 106 photographs on 57 plates, with Japanese and English captions, were assembled in an album Views of the North China Affair, 1900. Sanshichiro Yamamoto 山本讃七郎, Views of the North China Affair 北清事變寫真帖(Tokyo: Kanda Nishikicho, 1901). Sanshichiro Yamamoto owned a studio in Tokyo from 1882 to 1897. His first visit in China was in April 1897. He left for China to start a new career in Peking. In 1899, he published an album Peking containing the photographs of some historical sites such as Summer Palace, Lama Temple, Ming tombs and Chinese people at that time. This album was reprinted in 1906 in Peking. Sanshichiro Yamamoto 山本讃七郎, Peking 北京 (Peking 1906).Western photographers such as William Saunders (1832-1892), who opened the studios in both China and Japan.Chinese studio photographers such as Lai Afong 賴阿芳 (1839-1890) and Liang Shitai 梁時泰 (dates unknown) depended heavily on the photographic legacy that Western photographers left and had been lack of the ability to resisting the colonial visions. However, some Japanese photographers, such as Kusakabe Kimbei 日下部金兵衛(1841-1932), Ogawa Kazumasa 小川一真 (1860-1929), and Tamamura Kōzaburō 玉村康三郎 (1856-?) all of whom ran studios, in the 1890s had expertise in establishing an independent style of Japanese souvenir photography, which not only satisfied the imagination and curiosity of the European-American audience, but also contributed to a new Japanese style in relation to national identity. Naoyuki Kinoshita, “The early years of Japanese photography,” in The History of Japanese Photography, ed. Anne Wilkes Tucker (New Haven: Yale University Press, 2003), 14-99.beyond imperial property, the government initiated the investigations of the Buddhist shrines and temples and developed national art museums and arts education. Ogawa Kazumasa 小川一真 (1860-1929), as the official photographer, participated in the photographic project, taking about 800 photographs of Buddhist temples and statues in Japan, which were published in art magazines over several years. As an editor of Shashin Shinpō 写真新報 and Kokka magazine 国華, he had rich experience in observing and depicting cultural heritage, which had a great impact on his photographic practices in China.44"}, {"type": "text", "text": "In 1901, the Imperial University of Tokyo dispatched a team consisting of several experts with different backgrounds for carrying out a cultural investigation of the construction and decoration of the Palace buildings in the Forbidden City. Architectural scholar Itō Chuta 伊東忠太 (1867-1954), engineer Tsuchiya Junichi 土屋淳一 (dates unknown) and Okuyama Tsunegorō 奧山恒五郎 (dates unknown) of Technology University of Tokyo, and photographer Ogawa Kazumasa collaboratively launched a meticulous documentary project. A total of 170 photographs with text in Japanese,Chinese and English were published in 1906. As the preface of the album suggests, the project provided materials for architectural study, representing parts of the Palace that “are jealously kept from the public sight”.45"}, {"type": "text", "text": "Itō Chuta, who established the modern study of architecture in Japan by analyzing Horyuji Temple in Nara, the earliest surviving timber structure in the world, visited the Thomsen (Chicago: Center for the Art of East Asia, University of Chicago, 2009), 220-242.shashincho [Photographs of the Palace Buildings of Peking] (Tokyo: Ogawa Kazume Shuppanhu, 1906), n.p.Forbidden City eager to investigate. Although Itō probably acted as an architectural consultant on the team, the actual performer of this ambitious investigative project was Ogawa Kazumasa. He deployed a pioneering photographic technique in the representation of the Forbidden City, transforming views of the Imperial Palace into aesthetic objects."}, {"type": "text", "text": "Intended for a worldwide audience, the album, with its orientalist-style cover,functioned as a visual guide to an exhibition of the monumental architecture in the Forbidden City and other palaces. The first panorama in the album highlights a grandeur and monumentality. Taken from a high vantage point, Ogawa effectively conveyed the vastness and magnificence of the Gate of Supreme Harmony, located at the central axis,as the symbol of imperial power. The bird’s eye view of the Forbidden City from Yong’an Temple echoed the 1860 panoramic view by Felice Beato from Jing Mountain,showing a more impressive and monumental vision 40 years later. Starting with the eighth plate, the photographs were organized and displayed in the order of the troops and visitors entering the city along the central north-south axis. The visual tour starts with a photo of inside the Qian Gate retouched in circle form that emulated the traditional Chinese architectural form of the “moon gate.” The lively scene of the market between the Qian Gate and the Daqing Gate forms a contrast with the desolate palaces in the Imperial City (Fig.1.8). It is impressive that the team made such effort to represent the decoration, texture, and details of architecture; for example, Ogawa deliberately depicted the decorative pattern on huabiao, a kind of ceremonial column located in front of the Tian’an Gate. He also placed a native Chinese near it to indicate the scale for viewers. With Itō’s guidance, Ogawa took close-ups of some architectural components: for example, the ornamental tops of the newels, the front steps, the platform, the zaojin 藻井 (pillars and coffers) in and around the Hall of Supreme Harmony, and some closer views of the objects like stone lions, bronze cranes and turtles, and stone sundials. He also used some creative perspectives to show the eaves and beams of the palace, fully displaying the uniqueness of Chinese architecture. The album ends with the photographs of Japanese military forces’ private house, the soldiers standing solemnly at the door. Their Western-style military uniforms are in sharp contrast to the traditional Chinese buildings (Fig.1.9)."}, {"type": "text", "text": "Employed as a treasure photographer for the government, Ogawa Kazumasa had expertise on decontextualizing religious treasures for serving national interests by transforming them into artistic objects.46 In China, his photographic practices on the one hand completed the task of providing a visual record for examining “the arrangement, construction, and decoration” of the Forbidden City and other palace grounds, and on the other hand, successfully decontextualized the significance and imperial authority of the Forbidden City which was penetrated by the allied forces in 1900."}, {"type": "text", "text": "Despite the stable and imperial settings in the album, these photographs did not evoke the “aura” of the Forbidden City. The documentary of a “dying tradition” was for constructing “whole new realities in the form a ‘traditionalist’ East Asian architecture.” 47 Itō Chuta and Ogawa Kazumasa made great efforts to form a new East Asian monumentality. After fourteen months in China, Itō visited Burma, India, Sri Lanka, Turkey, Europe, and the United States. In one article in 1909, he applied social Darwinism to architecture, claiming that there was no evolution in Chinese architecture due to its “uncivilized culture”. 48 His architectural study in 1901 was essentially Thomsen (Chicago: Center for the Art of East Asia, University of Chicago, 2009), 220-242.anthropological research, which indicated “the cultural contradictions in Japanese colonialism.” His examination of traditional Eastern architecture was at its heart a promotion of a new Japanese-style architecture in relation to the construction of a distinct Japanese ethnic identity.49 Monuments as aesthetic objects, as well as political tools, were constantly shaped and represented in the historical encounters with foreign powers. Ogawa Kazumasa’s photographs help trace the shifting meaning of historical monuments. The triangulation of cultural memory, power relations, and national identity reconstructed the monumentality of the Forbidden City.50"}, {"type": "text", "text": "Through an array of new photographic technology and apparatuses, the Forbidden City was under the surveillance of the allied forces. However, it is still interesting to find some contradictions and rupture in these punitive and ceremony photographs.Besides documenting the grand celebration in the Forbidden City, photographers, both professional and amateur, enthusiastically took some everyday snapshots in the interior of the Forbidden City and the Summer Palace, the Ming Tombs, the Great walls in Peking, and elsewhere, shifting from the demonstration of colonial power to observation and surveillance of everyday lives."}, {"type": "text", "text": "The ordinary snapshots in the archives are usually too unremarkable for the historian. But despite stiff frontal poses and occasional blurriness, these snapshots show a connection with the place, the site, and the objects. Here, the snapshots by army photographers immortalized the encounter between the troops and the monuments. It is interesting to see how these seemingly spontaneous shots from 1900-1901 constitute an alternative version of history and contribute to the complexity of memory. Photography at that time was not simply a tool of documenting the process of teaching lessons; it was a popular pastime to record personal lives and defining foreigners’ identities in China."}, {"type": "text", "text": "Amateur photographers witness the private memories behind conquest and violence. Assembled in a grey cloth-covered Kodak photograph album, a total of 96 photographs were part of the collection of British General Sir George de Symons Barrow (1864-1959), who served in China during the Boxer Rebellion under General Sir Alfred Gaselee (1844-1918) and left for India in December 1901.51 During his stay in China he collected many photographs that give a glimpse on the everyday lives of the British troops during this year-plus of occupation. He collected several photographs that capture the candid moments of everyday life in the Forbidden City."}, {"type": "text", "text": "One of the photographs in the album shows a relaxed scene of the wives of the British mission and other guests meeting and laughing. Interestingly, another group photograph of similar quality below this one depicts that the high-ranking British officers such as General Sir Alfred Gaselee and colonel Gerald O’Sullivan (1853-1940) of Royal Engineers (Fig.1.10). In contrast to O’Keefe’s official photographs taken in the Forbidden City, Barrow’s private album offers an insight into the personal lives of the military troops, the British legation, and even the significant political figures. In a relaxed, even merry atmosphere, the allies appear to enjoy the occupation life in the Forbidden City. The photographs taken in the yards and palaces in little groups capture the moments in everyday life, establishing a private connection between the individuals and the monuments in the palace. The private album has now been collected in British Library. Through re-interpreting and re-examining the personal archives, the new narratives that challenged the accepted history are constructing."}, {"type": "text", "text": "Conquerors, but also tourists, their dual identity constantly shifted during the occupation period. Some photographs, like the snapshots taken by O’Keefe in the early days of the occupation, recorded the tourist experiences of the troops. An image of a stone camel along the road to the Ming tombs echoes the nineteenth-century photographer John Thomson (1837-1921)’s photograph from the 1870s in terms of subject and composition. Ming tombs as the mausoleums of the emperors of Ming Dynasty symbolized a nostalgic glory. In Thomson’s photograph, a half-naked native Chinese is leaning on the huge and bizarre stone animal along the road, the desolated wasteland in the background creating an air of silence and melancholy (Fig.1.11)."}, {"type": "text", "text": "In O’Keefe’s photograph, taken nearly 30 years later, the native Chinese has been replaced a soldier from the 6th U.S. Cavalry. The photographer chose to take a back view of the soldier, who props his arm against the stone camel, and another soldier standing opposite him and holding the reins of some horses (Fig.1.12). Thomson’s image shows an apparent ethnographic perspective by displaying a Chinese peculiarity;by contrast, O’Keefe’s photograph conveys more subjective emotions. Their visit to Ming tombs probably followed the Thomson and other nineteenth-century photographers’ travel routines. The troops were taken several groups of photographs in various poses around the stone animal. They were even taken a group photograph between two large stone elephants. A series of photographs exhibited the gradual disenchantment beyond the Forbidden City."}, {"type": "text", "text": "The aerial photographs, stereographic views, news photographs, and everyday snapshots of the Forbidden City reveal the multiplicity of the encounters. The invention of hand camera in 1888, and the manufacture of roll film a year later, expanded the number of images of the Boxer Rebellion and occupation of Beijing. Almost at the same time, the introduction of half-tone print process promoted the photographs into the print media. 52A large amount of circulating images transmitted through European and American books, periodicals, journals, and the illustrated press removed the “unique existence at the place,” as Walter Benjamin argued.53 The various methods the allies used to punish the Chinese undermined the authority of the Empire. 54 From daguerreotype to hand camera, it is not difficult to identify that the photography’s pervasive conquest of the global audience due to the ever-increasing speed of reproduction and dissemination. Within two decades of its birth, hand cameras had established a ubiquitous presence on a global scale.1.2 Amateur Photographers in Early Treaty Port China"}, {"type": "text", "text": "With photography accessible to a broader audience, more and more photographic enthusiasts used the hand camera to capture people in spontaneous moments of daily life. After the Second Opium War, an increasing number of foreign residents, who mainly consisted of missionaries, diplomats and their families, traders,and expeditioners, gathered in the treaty ports in China.55 In the late nineteenth century and early twentieth century, European and American expatriates living in China used Kodak cameras to record family gatherings, short trips and cultural expeditions. Private photographs do not directly participate in the construction of socio-historical discourse 1965: Life/Still Images in Historical Narratives, Visualising China, 1845-1965 (Brill, 2013), 3-38.but are transformed into part of collective memory by the consistent interpretation of personal narratives."}, {"type": "text", "text": "In the era of dry plate, many early amateur photographers had a scientific background since photography was first seen as a mysterious product. John Dudgeon (1837-1901), who was a Scottish missionary doctor who worked in the London Missionary Society’s Peking Hospital spent nearly 40 years in China. Dr.Dudgeronz and some other missionary doctors started to translate European photography manuals into the Chinese language in the 1870s. He compiled an introductory photography manual “Capturing Shadow and Spectacle” (Tuoying qiguan 脫影奇觀) in 1873 in three volumes referring to the European photography manual. Tuoying, which literally means separating the shadow from the entity, suggests a process of duplicating and copying. The manual introduces the knowledge of European optics, basic principles of capturing the images, and methods of developing; it also lists the photographic materials and equipment illustrated with pictures. The knowledge and detailed methods in this manual enabled more photography enthusiasts to be self-taught photographers.56 In addition to photographers in the commercial studios, some local Chinese enthusiasts were actively exploring photography techniques and participating in the practice of photography by the missionaries, which will be fully discussed in the next chapter."}, {"type": "text", "text": "One of Dudgeon’s friends, British amateur photographer Thomas Child (1841-1898), who worked as a gas engineer for the Imperial Chinese Maritime Customs until 1889, took many views of Chinese architecture and monuments, such as the Old Summer Palace, the walls in Beijing, Ming tombs, as well as social scenes. Instead of magnificent panoramas and staged tableaux, Child’s photographs deployed variable perspectives to represent historical monuments and real street life in Peking. In contrast with Child’s dry-plate technology, Edward Guy Hillier (1857-1924), a banker and manager in Hong Kong, Shanghai and Peking, used an “instant camera”––which was probably a Kodak––for taking shots when he traveled along the Yangtze River and went deep into the mountains of south-west Yichang.57"}, {"type": "text", "text": "The greater photographic enthusiasm among the foreign residents in China was probably promoted by the advent of Kodak in 1888. As one piece of advertisement in June 1889 on The North-China Daily News said: “As a detective camera, it is unequalled in convenience and rapidity of adjustment for instantaneous photographs of moving objects under varying conditions, the focus and the speed of the shutter being instantly regulated without opening the camera.”58 At first Kodak was invented as the detective camera; its small size and fast speed brought a lot of benefits for instant shooting. But its ease of use eventually attracted a great number of amateur photographers who treated photography as a hobby rather than a scientific procedure."}, {"type": "text", "text": "The new cameras were first sold by foreign companies (hong 行) in the treaty ports. Kodak ads in nineteenth-century China mentioned that the latest products could be purchased at foreign-owned stores in Shanghai, such as J. Liewellyn & Co., Ld.Kodak products were also promoted as Christmas gifts. An 1889 ad indicates that Liewellyn & Co., Ld in Shanghai sells a “very handy” camera, which “can be carried under the coat with the lens projecting through a buttonhole, and the wearer can take several views by simply pulling a string.”59 The words highlights the advantages of Kodak: easy to operate and very handy. They could be brought into China as Christmas gifts by some of the Legation staff and other foreign residents."}, {"type": "text", "text": "In the late nineteenth century, photography has been regarded as a respectable hobby that brought benefits for social life in the European-American countries. The expatriate community brought the pastime to China. Photography was also employed as a tool for documenting the social life of the expatriate community in China. Alicia Bewicke Little (1845-1926), a prestigious travel writer and a feminist, arrived in Shanghai as the wife of British merchant Archibald John Little. They moved to the far west of China, at Chongqing in 1887.60 Intimate China. The Chinese as I have seen them, a book Alicia wrote in the late 1880s and early 1890s, includes 120 photographic illustrations depicting the landscape, the local customs and people when she traveled to interior China in the 1890s. Beyond the exhibition of exotic scenes and life of local people, she focused on the hard labour of the boat trackers who helped the passages to cross the Yangtze Gorges (Fig.1.13). In the photograph of trackers, she captured the labours walking along the river in a candid moment, against the backdrop of rolling hills and rapid rivers. Alicia described the difficulty of capturing the motion of the subjects in the book. She tried to take photographs of the Buddhist priests when they prostrated themselves and burnt the joss-sticks, but “it seemed a pity to wait to set up the camera till they had gone.”61 According to her description, she probably was not using a compact camera. Her photographs were credited with helping to bring attention to the degrading conditions of the labours in the Yangtze Gorges."}, {"type": "text", "text": "Women played a limited role in photographic history in the middle of the nineteenth century, when the equipment was cumbersome and expensive. The invention of the light and the easy-to-operate Kodak camera changed this situation and stimulated the enthusiasm of female photographers. After almost two decades, German diplomat Fritz Weiss (1877-1955) and his wife Hedwig Weiss took full advantages of the portable camera during their travel from Shanghai to Sichuan along the Yangtze River in 1911.62 One photograph taken on the deck of their houseboat represents Fritz and Hedwig Weiss traveled along the Yangtze River between Yichang and Sichuan. They sat in a cramped houseboat that was only available transportation on the Yangtze River in the autumn and winter (Fig.1.14)."}, {"type": "text", "text": "While visiting the Ming tomb in Nanjing, Fritz took a travel snapshot of his wife. Hedwig Weiss was holding a Kodak camera, wearing sunglasses and a bowler hat, standing at ease by the stone statue (Fig.1.15). Compared with the photographs taken by John Thomson and O’Keefe in the Ming tomb, Beijing, this loosely composed,private snapshot of ordinary quality did not exhibit the significance of the historical monument as a subject and instead establishes the connection between the individual and the monument, between the individual and the changing time and space. The aura of greatness and power that monumentality evoked gradually disappeared in everyday photographic practices."}, {"type": "text", "text": "After the invention of Kodak, photography also became a recreational and social event, bringing the expatriate community in early treaty port China closer together.Fuzhou became another hub wher
