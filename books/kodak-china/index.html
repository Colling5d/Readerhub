as always been connected with historical moments and memory.274 From the oft-quoted terms “that-has-been” in Camera Lucida of Roland Barthes to the theory of photography historian Geoffrey Batchen, photographs always capture a moment in the past, which we subsequently view in the present. To look at a photograph is, therefore to experience a temporal movement between past and present, i.e., to witness the passing of time.275"}, {"type": "text", "text": "Looking at the travel photographs in Luo Bonian’s private collection, it is not hard to find the intertextuality between the travel photographs and accompanying words.The words reveal their destinations: West Lake, Lan River, Yandang Mountain and Lanke Mountain. Most of these attractions were located within Zhejiang Province,which suggests these amateur photographers preferred to choose short journeys with close friends. The photographs from these trips formed a private and intimate visual narrative of the amateur photographic community. Luo Bonian preferred to capture some everyday subjects during travel. A 1935 close-up photograph of plum blossoms was taken by Luo Bonian during his travel to Chao Mountain, a scenic site 18 miles from Hangzhou. He depicted the detail of the plum blossoms, displaying a mild and peaceful atmosphere isolated from the social turmoil of the 1930s China (Fig.4.12).Flowers, trees, and boats on the3 water: all these motifs in traditional literati paintings were reframed by Luo. He deployed a close-up perspective to represent the withered grass in the snow, bristly green grass against the sky, and wildflowers (Fig.4.13.1). He also used a worm's eye perspective to represent the pagoda, juxtaposing it with the branches full of blossoms (Fig.4.13.2). The trees became an enduring subject in his photographs. In 1938, he was reassigned to a position with the Bank of China in Hong Kong. He took several photographs of the tropical trees there."}, {"type": "text", "text": "Depicting ordinary subjects in a poetic and romantic atmosphere, Luo Bonian used pioneering techniques to elevate the ordinary landscape and convey subtle emotions which was connected with his own cultural memory. In one photograph, he depicted the shapes and lines of the clouds and lights which were deployed with the idioms of international pictorialism in the early twentieth century, juxtaposed with traditional calligraphic notes (Fig.4.14). By focusing on the patterning of light and shade, blurring detail and compressing space, Luo depicted the rural landscape in a distinctive way from the pictorialist works that emulated traditional painting. He emphasized photography’s evocative and interpretive qualities and depicted common scenes in ways that suggested psychological and spiritual meanings. In several photographs of deserted villages, he created an immersive experience for the audience.The highlight of shade, light, and composition, and the romantic and sentimental atmosphere he created undoubtedly evoke emotional sensations and states of mind."}, {"type": "text", "text": "Leisure travel with portable cameras manifested the prerogative of a privileged minority, and the photographic images from these trips contributed to the formation of the identities of the new middle classes in the Republican period. In these travel photographs, the travelers––both men and women–– seemed to consider the camera a fashion accessory. In Luo Bonian’s collection, we can find several photographs showing travelers taking views, a man in long robe taking shots, and a woman in profile holding the camera and pretending to take photographs (Fig.4.15). Whether they posed for the picture or not, operating the camera was a modern behavior, suggesting a modern identity was established by means of photography."}, {"type": "text", "text": "Photography as the apparatus that industrializes visual memory has served as an interactive tool of communicating and makes visible the association with the community by means of celebrating memorable moments together. Pierre Bourdieu in his book Un art moyen (translated as Photography: A Middle-brow Art) discussed that photography as a memory device for preserving family memory and common past.276 David Bate extended the domestic use of photography to a variety of types of photographs which developed “a unifying factor, as monuments of and to the past”.277"}, {"type": "text", "text": "Leisure travel, a collective event and social ritual for the bourgeoisie in Republican China was captured by the portable camera. Through photographic practice,the community embraced a time for playing with cameras and celebrating amateurism and the instantaneous. During travel, the community of amateur photographers would take shots for each other, through which the associations of the photographic community became more visible. Travel photography or outdoor shooting in a group visualized as a collective event, a social and cultural ritual, shares some similarities with holiday photography and family photography. Travel and photography symbolized a new ritual that enhanced the bonding in the community. Beyond the approach to a close bonding, they also attempted to develop a self-identity through photography and leisure travel."}, {"type": "text", "text": "For the amateur photographers themselves, travel photographs were taken to preserve and celebrate the disjunct moments with normal place and time. Departing from familiar places, amateurs employed their hand cameras to record and celebrate the moments anytime. The desire of seeing the emerging new Republic and the landscape and people by means of photography drove the amateurs to explore beyond their homes."}, {"type": "text", "text": "From private travel with the intimate community to commercial group travel arranged by tourist agency or company, leisure travel was rising among the new middle classes in the Republican period. At the beginning of the twentieth century, the British tourism company, Thomas Cook & Sons Co., opened offices in China, while the American Express Travel Department and Japan Tourist Bureau provided tourist and banking services for international travelers from major treaty ports and Manchuria. In 1923, banker Chen Guangfu 陳光甫 (1881-1976) established the earliest Chinese travel agency in Shanghai. It was initially set up as a Travel Department under the Shanghai Commercial and Savings Bank, then later separated from the bank and renamed China Travel Service (Zhongguo lüxing she 中國旅行社). From 1923 to 1937, China Travel Service broke the monopoly of foreign tourist agencies in China, developing 66 branches ranging from Beijing to Hongkong. It mainly offered the booking the transportation and hotel, tour guide services for both Chinese and foreigner customers.278"}, {"type": "text", "text": "Some non-governmental tourist agencies like the Unison Travel Group (Yousheng lüxing tuan 友聲旅行團) was spontaneously organized by several travel enthusiasts in 1915. The founders, Sun Zongyuan 孫宗源 and Yao Yuangan 姚元幹,were typical of the new middle class in Shanghai: Sun was a customs clerk, and Yao worked for an insurance company (Fig.4.16). Compared with CTS, the Unison Travel Party offered travel services for the new urban middle class. The 1920s saw the rapid growth of the Unison Travel Group as more travel enthusiasts made journeys all over China. In the 1920s, the Unison Travel Group developed trips to scenic sites in the Yangtze River Delta. The routes from Shanghai to Suzhou, Wuxi, Jiaxing, Huzhou, and Mount Mogan became very popular.279 In August 1929, Unison organized a trip to the Capital Nanjing by air, which was the first group air travel in China.280 In the same year,Unison also organized over 800 tourists to visit Hangzhou West Lake Exposition by tour bus.281 In the 1930s, a trip to North China, passing through Shandong Province to Beijing, attracted over sixty members. Before the Sino-Japanese war, Unison organized approximately eight trips to Northern China in total. In 1934, Unison established a new routine to South China and rented a new tourist ship from China Merchants Steam Navigation Company. The Unison also promoted overseas tourism in the 1930s.282"}, {"type": "text", "text": "Some amateur photographers, who were mostly based in and around Shanghai,were actively engaged in publishing travel-related images and texts. The popular tourist magazines and pictorials such as Tourist Magazine (Lüxing zazhi 旅行雜誌) of China Travel Service and Monthly Tourist Magazine of the Unison (Yousheng luxing yuekan友聲旅行月刊) produced by Unison, frequently featured travel photographs taken by renowned photographers.283 In the 1930s, many members of the Hua Society, such as Chen Wanli, Lang Jingshan, Zhang Zhenhou, and Guo Xiqi offered a large number of photographs they had taken in the scenic sites to travel agencies (Fig.4.17)."}, {"type": "text", "text": "The Unison Travel Party developed a specific photography division in 1927.One 1927 photograph taken at Lingyin Temple in Hangzhou shows a group of approximately twenty-five male tourists (Fig.4.18). The man in the center in the western suit sits on a stone, looking directly at the camera; most members in the group wear long gowns, and some older members are carrying walking sticks. Compared with the group photograph by Luo Bonian of his small intellectual community, this all-male tourist group shows a more unified appearance. This photograph was selected from an album named Beautiful Hangzhou (Meili de hangzhou 美麗的杭州). Most of photographs were taken by Shao Woyun 邵臥雲 from the Hua Society, as well as Jin Xingchu 金性初 and Dong Hancha 董漢槎."}, {"type": "text", "text": "In 1931, the first travel photography exhibition of the members in the Unison was held in a shopping mall in Nanjing Road, Shanghai. Besides Yao Yuangan, the organizer of the travel group, two amateur photographers from the Hua Society: Shao Woyun, and Guo Xiqi also took an active part in the exhibition. Over 200 photographs were exhibited, including photographs taken in Jiangsu, Zhejiang, Jiangxi, and Shandong provinces, and even in India, Japan and Thailand. The 1931 China Pictorial (Zhonghua tuhua zazhi 中華圖畫雜誌) published several selective photographs from Zhang Zhenhou, Guo Xiqi, Chen Chuanling, and Zhou Shoujuan. The grotesque stone in Tianping Mount, Suzhou, the overlook from Tai Mount, and the unique perspective of Longhua pagoda were all captured during the trip, making a contrast with the misty landscape and “fuzzy” pictorial effects that characterized traditional pictorialism.284"}, {"type": "text", "text": "In the 1930s, some amateur photographers were actively engaged in the artistic societies, exhibitions, publications on the one hand, while also participating in vernacular photographic practices on the other hand, for example, making photo album of the scenic sites for the tourists. Guo Xiqi, a founding member of the Hua Society,deployed his pioneering technique to made exquisite photographic albums for the Unison Travel Party. His album Nanjing Photo Album (Nanjing yingji 南京影集) contains a series of photographs taken at the Sun Yat-sen Mausoleum, Ming tombs, the presidential palace and several other historical sites (Fig.4.19.1; 4.19.2). Covered with yellow silk and printed in Britain using the photogravure technique, the Nanjing Photo Album also was used as a diplomatic present by Nanjing government. Commissioned by Unison, Guo Xiqi took a series of photographs in Mount Putuo. His photographs displayed the monumentality of the Buddhist architecture against the magnificent landscape, highlighting the timeless quality and intrinsic intellectual spirit (Fig.4.20)."}, {"type": "text", "text": "Some photographs in the travel albums and brochures not only promoted tourist attractions but also highlighted the modern lifestyle. Leisure and vacation as the main subjects in travel photography constitute the hobby photography that was a popular pastime for the new middle class in the Republican period. Mount Putuo (Putuo shan普陀山), the so-called Buddhist Kingdom in the Sea ( Haitian foguo 海天佛國) in Zhejiang Province, one of the four sacred mountains in Chinese Buddhism, became a tourist destination and allowed visitors to enjoy the beautiful mountains, Buddhist history, and bathing beaches. In contrast with the monumental landscape representations, many vernacular travel snapshots in the popular media offered a chance to see how a historic site had been transformed into a tourist attraction in the Republican era. In 1929, The Unison promoted a special issue of Putuo, fully displaying the majestic mountains, elegant Buddhist architecture and long beaches. In an introductory essay, Shen Xingchu 沈杏初 described the grandness and smoothness of the Long Bathing Beach (Qianbusha yuchang 千步沙浴場), accompanied by an overlook photograph from a distance.285 Lang Jingshan also took a photograph to show the tranquility at the seaside of Putuo where a few tourists were walking and lying on the beach.286 In the late 1920s, sunbathing was only popular among western tourists. In 1929, the English newspaper The China Press described the bathing beach at Mount Putuo in more detail and highly recommended it as a vacation resort.287 Until the 1930s,the popular Chinese media started to promote sunbathing at the seaside as a modern leisure activity."}, {"type": "text", "text": "In the 1930s, the beaches as leisure resources in Shanghai, Zhejiang, and Qingdao were exploited. Just as the Kodak advertisements proclaimed: “A holiday without a Kodak is a holiday wasted.” Seaside holiday became a popular subject in amateur photography. Going to the Beach, a photograph published in 1933 Liangyou,depicts several women in swimsuits and qipao walking along the beach in Qingdao.The column “Kodak Travel” (Keda youji 柯達遊記) in Chinese Kodakery ran a number of travel photographs taken in seaside. A 1932 issue of Chinese Kodakery promoted the Brownie for seaside snapshot photograph. 288 When the introduction of portable cameras coincided with the rise of modern leisure activities among the new middle class,they flocked to the seaside to record their memories and celebrate the gathering moments. The popularity of seaside photography was also closely related to body representation in the Republican era. Chen Bingde successfully captured how the modern Chinese women––including some female students and film stars––enjoyed the sunbathing and beautiful scenery on the beach (Fig.4.21)."}, {"type": "text", "text": "The popularity of hand cameras went hand in hand with leisure travel in Republican China. The emphasis on flexibility, portability, and fast focus prompted more travelers to include hand cameras during their outdoor activities. Travel photographs were taken to preserve and celebrate the disjunct moments with normal place and time. Departing from familiar spots, amateurs employed hand cameras to record and celebrate the moments anytime. The desire of seeing the emerging new Republic and the landscape and people by means of photography drove the amateurs to explore the unseen and unknown lands.4.3 Grand Travel and Education to the Public"}, {"type": "text", "text": "Beyond leisure travel to scenic spots, an increasing number of Chinese intellectuals promoted a trend of nationwide tours to explore the cultural landscape of Republican China. Chen Wanli, a pioneering Chinese photographer who had a strong interest in investigating the cultural heritage. He took a series of photographs displaying how the specialists and students in Peking University examined and organized the treasures in the Palace in 1925(Fig.4.22). The last Emperor Puyi was forced to leave the palace on November 5, 1924, and one year later, the Forbidden City became a public museum.289 During this period, Deploying a sophisticated photographic technique,Chen exhibited a dying but not dead world from the perspective of a local intellectual,marking a significant transition of the Forbidden City from an imperial Palace to a public museum. The 1924 photographs in the Forbidden City were collected in an album “The Palace in the thirteenth year of Republican China” (Min shisan gugong 民十三故宮) and eventually published in 1928.290 In 1926, Chen’s photographs taken in the Forbidden City were exhibited in Shanghai, and then published in The Eastern Times Photo Supplement (Tuhua shibao 圖畫時報).291 Several photographs of the Empress’ bedroom, palace maids and old eunuchs in the Palace were firstly viewed by the audience in an unprecedented way (Fig.4.23). Despite the unstable fate under Nationalist and Communist rule, once the most mystifying spaces in history continue to open up."}, {"type": "text", "text": "Photography was widely used by the Europeans in the process of colonial expansion for categorizing and redefining the “other.” The photographs became a form of “cultural and legal power.”292 In the early twentieth century, the expedition teams led by the British Aurel Stein (1862-1943), French Paul Pelliot (1878-1945) Germans Albert Grünwedel (1856-1935), Albert Von Le Coq (1860-1930), Swedish Sven Hedin (1865-1952), Japanese Itō Chuta (1867-1954), and others made great discoveries during their expeditions to China’s northwestern frontiers, Tibet, and other central Asian lands.A series of journeys to China in the early twentieth century contributed to the global transformation of China’s image on the world stage.293 Beyond the ethnographic gaze and the pressures of the Sino-Japanese War, from the mid-1920s to the 1940s, many Chinese intellectual travelers and scholars embarked on expeditions akin to the Grand Tour undertaken by European nobility in the seventeenth to nineteenth centuries. By focusing on travel writings, sketches, illustrated travelogues, and some inscribed photographs made by explorers, scholars and amateur photographers from Europe-America, Japan and China. The texts and images in travel literature were not only interwoven with nation-building projects but also developed a new way of framing China in various transcultural encounters from 1925 to 1945."}, {"type": "text", "text": "Chinese intellectuals' Grand Travel (Zhuangyou 壯游) to the frontier began with the Chinese-foreign joint scientific expedition. In 1925, Chen Wanli, who had dual identity as a photographer and an archeologist, participated in a scientific investigation with a team led by the American Langdon Warner (1881-1955). Besides translation, he also conducted his own research on the caves of Dunhuang and made some observations on the local customs and practices in the Northwestern China. The flyleaf of Chen's travelogue, Diary of the Journey to the Northwest, shows a photograph captioned with \"the writer on the way to Dunhuang\" (Dunhuang tuzhong zhi zhuzhe 敦煌途中之著者) taken by his colleague. In the photograph, Chen Wanli's intellectual looks––glasses, Yat-Sen suit, and the portable camera––formed a contrast with the shabby carriage and rural environment; only the boots he wears suggest the hardship of the journey (Fig.4.24). Chen put this photograph in the first page of his travelogue, indicating a new start to grand travel. Departing from Beijing, the expedition team passed through Taiyuan, Xi'an, Lanzhou, and entered Dunhuang via Gansu Province. Chen made a cultural survey of the treasures from a local perspective. In Taiyuan, he took the photograph of the Stele forest and Maitreya in the library; he also took the views of Thousand Buddha's Caves in Dunhuang. These travel photographs were exhibited in the department of National Studies in Peking University in 1925, some of them were exhibited in Suzhou and Shanghai, which initiated a new way of observing and representing cultural relics in China.294 Responded to the National Studies Movement (Guoxue yundong 國學運動) which was getting under way in post-May Fourth Beijing, intellectuals determined to pursue a new understanding of the artifacts and cultural relics in the process of nation-building."}, {"type": "text", "text": "Chen Wanli's academic endeavor in the Northwest was commended by Liu Bannong, who had just graduated from the University of Paris-Sorbonne in 1925. During his studies in London and Paris from 1921 to 1925, Liu encountered the Stein collection of Dunhuang in London and the Pelliot collection in Paris. He even copied the manuscript of Dunhuang in the National Library of France in hand and brought them to China. These copies were published in 1925 as a three-volume book titled “Miscellany from Dunhuang” (Dunhuang duosuo 敦煌掇鎖).295"}, {"type": "text", "text": "The historical encounter with the Dunhuang collections promoted Liu Bannong to preserve the artifacts, and the concern on the frontier landscape was transformed into an assertion of China's sovereignty. In 1927, Swedish traveler Sven Hedin led a team of explorers to revisit China after three journeys crossing the Gobi Desert in Xinjiang and the Himalayan range in Tibet at the turn of the 20th century. With the financial support of Lufthansa German Airlines, he hoped to investigate the prospect of opening an air route for Lufthansa between Berlin and Beijing via Urumqi. Hedin's intentions and plans were questioned by Beijing academics. Liu Bannong as the leader of this committee negotiated with Hedin on many aspects. After forty days of detailed negotiations, the Chinese committee and Hedin signed the final contract, and five Chinese scholars and five students joined the expeditions.296 It was stipulated that the artifacts they collected in China must remain in China, and the photographs and scientific data could be published only after the permission of the Chinese committee."}, {"type": "text", "text": "From 1927 to 1935, Sino-Swedish Scientific Expedition Team to Northwest China (Zhongrui xibei kexue kaochatuan 中瑞西北科學考察團) led by Hedin and Xu Xusheng 徐旭生 (1888-1976), the Chinese director in the expedition team, conducted scientific research in north and northwest China. Xu Xusheng wrote a travelogue, Xu Xushen’s Diary of the Northwestern Journey (Xu Xusheng xiyou riji 徐旭生西游日記),with the travel photographs on the way. The diary described Xu’s discoveries and observations in Mongolia, the Gobi Desert and Xinjiang. Xu Xusheng and his team recorded his observations during the expedition extensively thanks to the documentary powers of photography. The photographer captured the images of weather experiments with balloons in Mongolia, camels marching in the desert and the doctors in their expedition team treating the Mongolian patients (Fig.4.25). These photographs explored the possibilities and pushed the boundaries of photography as a scientific tool."}, {"type": "text", "text": "The idea of Grand Travel across China was aligned with the Nationalist government’s frontier policy. After consolidating the national power, the government paid increasing attention to the Northwestern China, especially the threats of Japanese imperialism in Manchuria and Mongolia as well as British operations in Tibet and along China’s southwest borders. The northwestern, including Shaanxi, Gansu, Qinghai,Xinjiang, and Mongolia, was the least developed area in China. Dai Jitao 戴季陶 (1891-1949), the politician and journalist in the Kuomintang, contended the Northwestern provinces could be no war and construction must be sped up.297 A series of societies and organizations were established in Beijing, Nanjing and Shanghai in order to investigate the Northwest. For example, Northwest Association (Xibei xieshe 西北協社), Society for the Northwest Public Studies (Xibei Gongxueshe 西北公學社) in Peking, the Developing the Northwest Association (Kaifa Xibei Xiehui 開發西北協會) in Nanjing, and the Northwest Public Forum Association (Xibei Gonglunshe 西北公論社) in Shanghai.298 “Develop the Northwest” (Kaifa xibei 開發西北) was a strong call from the Nationalist government, urging the patriotic personage to go into these areas and start business and homesteads."}, {"type": "text", "text": "Photographs have been integral in revealing the national identity in twentieth-century China. Photography played a significant role of depicting and visualizing the borders of the new nation with the enthusiasm of developing the frontiers.299 In 1934,Zhuang Xueben 莊學本 (1909-1984) went to Chengdu with the Nationalist mission to offer condolences for the thirteenth Dalai Lama's death. He hoped to join the Nationalist government's mission to Lhasa, but the request was denied. After this setback, Zhuang did not return to Shanghai. Instead, he decided to explore the Golog (果洛) in May 1934, a so-called “white land” (baidi 白地) located at the junction of Qinghai and Sichuan. He went to Guanxian (灌縣), Wenchuan (汶川), Maoxian (茂縣), Lifan (理番), A’ba (阿垻), then entered to Golog.300 This six-month Golog journey also marked the beginning of Zhuang Xueben’s ten-year exploration of the western frontier. Linking this project with the Nationalist campaign of developing the Northwest, Zhuang claimed that Golog was “the hinterland of the Northwest,” and therefore it needed to be understood first \"in order to develop the whole northwest.301"}, {"type": "text", "text": "Zhuang Xueben was a self-taught photographer since the late 1920s when he worked in a foreign company in Shanghai. Later he became a journalist for Shenbao and The Young Companion. Zhuang Xueben started with art photography: lots of his Shanghai-period photographs represent his achievements in that field, then he transitioned into documentary imbued with humanist sentiments, constructing a magnificent humanist vision. Equipped with two hand cameras, a Rollei and a Zeiss Super Ikont, he recorded the details of the journey from Nanjing towards Chengdu along the Yangtze River, then westwards to Golog. In addition to travel photography,he also took a series of ethnographic portraits of the indigenous Qiang people, further contributing to constructing a new image of the frontier."}, {"type": "text", "text": "If we consider daguerreotypes and calotypes the first generation of photographic technology, and the wet-glass (collodion) plates that John Thomson employed was the second generation of photographic technology, the third generation was the advent of dry plates and film in the late 1860s, which fully developed around 1890s when modern celluloid film was invented by Kodak in 1889.302 The hand cameras Zhuang Xueben used had the advantages of capturing and snap-shooting. If we compare the photographs taken by Zhuang Xueben in 1934 with the picturesque monumental landscapes and ethnographic portraits that John Thomson and other nineteenth-century European and American photographers made in the 1860s, it is not difficult to find that the advancement of photographic technology transformed the still photographs to the images closer to the life and better acknowledging the subjectivity of the indigenous people."}, {"type": "text", "text": "Hand cameras helped photographers capture instants of motion on the journey.The immediacy, serendipity, and spontaneity that hand cameras brought fundamentally changed how photographers view and approach the photographic subjects. Zhuang Xueben traveled along the Min River, a tributary of the upper Yangtze River. The transportation in China’s western frontier regions was undeveloped in the 1930s.303 One close-up captures a moment when a young man of Qiang nationality was crossing the river with rope, the waves behind him rolling on and white spray flying (Fig.4.26).Deploying a variety of perspectives, Zhuang took a series of shots depicting how the indigenous people crossed the river with ropes or on suspension bridges above the rapids."}, {"type": "text", "text": "Beyond the rapid succession of photographs, Zhuang Xueben also took a number of spectacular landscape photographs along the river. He depicted the Feishaguan in Wenchuan country with great boldness and vision. He also used his pioneering technique to capture the monumental landscape in Weizhou, a town located in the northeast of Wenchuan. Employing a bird's-eye view, he depicts the viewer the magnificence of the Min River, including the Qiang villages scattered in the hills along the river (Fig.4.27). Zhuang Xueben attempted to create a magnificent frontier landscape with a grand manner and rich details, showing the contrast between pictorialist landscape and literati style."}, {"type": "text", "text": "Meanwhile, the hand camera was also a valuable tool in ethnographic work.Since the invention of photography in 1839, ethnic sightseeing became a significant voyeuristic experience, and many explorers and photographers took photographs of the ethnic subjects for satisfying their curiosity of seeing “strangers” in distant lands.Monumental landscapes and the ethnographic portraits were the main subjects in nineteenth-century travel photography. In the nineteenth century, Chinese people were ethnic subjects for European and American photographers. John Thomson (1837-1921),a Scottish photographer, traveled extensively throughout China, from the southern trading ports of Hong Kong and Canton to the cities of Peking and Shanghai, to the Great Wall in the north, and deep into central China. From 1870 to 1871 he visited the Fukien region, traveling up the Min River, and then visited Amoy and Swatow. The photographs taken during the travels were collected in the album Illustrations of China and Its People: A Series of Two Hundred Photographs, with Letterpress Descriptive of the Places and People Represented that was published in four volumes between 1873 and 1874. John Thomson’s photographs not only captured the scenic sites of China from the treaty ports to interior China along the Yangtze River but also established the “types” of Chinese people according to the characteristics of age, gender, ethnicity, and occupation. The photographs he took reflect a timeless quality that was closely associated with stagnancy and isolation."}, {"type": "text", "text": "The invention of the Kodak camera brought new possibilities for ethnographic research. The simplicity of operation, fast focus and inexpensive roll film supported the hand camera in capturing the multiple images when the indigenous people might be in unaware situations, recording the sequences in their daily life.304 A lot of photographs featuring the everyday experience of Qiang people were captured by Zhuang Xueben when he traveled to Golog. For example, he showed how they transported tea and medicine, plowed their fields, conducted business in the market; he also took shots when they “sipped” wine (zajiu 咂酒) with the bamboo that was the tradition of Qiang people (Fig.4.28; Fig.4.29), and when they wore traditional costumes to held religious ceremony. He displayed scenes like working, living, ceremony and ritual in an unobtrusive way, attempting to represent everyday situations in which indigenous people could ignore the photographer’s presence. Compared with the anthropometric photographs with standard poses and format, the photographs made by hand cameras were closer to the life being lived by the subject.305"}, {"type": "text", "text": "Zhuang Xueben’s photographic practices open a new chapter of ethnographic photography in China. In these photographs, they have undergone a transformation,from being objects on view to subjects possessing their own desires, viewing the self through the world around them. His travel photographs in the 1930s not only display the landscape in the motion along the river but also exhibits a humanist vision through the depiction of the everyday lives of indigenous people."}, {"type": "text", "text": "Travel photographs not only formulate what the travelers see, but also shape the ways of seeing and understanding. In general, travel photography has been regarded as a combination of sight and knowledge.306 Many essays instructed the hobbyist on how to employ the hand camera to take photographs during travel. A sustainable column,“Kodak Travel” in Chinese Kodakery exhibits a number of travel photographs from amateur photographers. Sightseeing and photography were naturally closely connected when portable cameras gained popularity. A number of camera advertisements juxtaposed the photographs of historical sites with the camera, indicating a new concept of travel, traveling with a camera that was emerging with the rise of the new middle class. Ranging from scenic spots to historic sites, these travel photographs were pronounced by Chinese Kodakery as a necessary backdrop for developing an association between the amateurs and the location."}, {"type": "text", "text": "In January 1932, Chinese Kodakery published a group of travel photographs taken by Jin Shisheng in Qingdao. As a college student in Civil Engineering Department of Tongji University, he made a field trip to the factory in Qingdao. The photographs depicted famous tourist attractions like the Qingdao Handover Memorial Pavilion, Tianhou Palace, the seaside park, and the aquarium (Fig.4.30).307 In his travelogue titled “A Glimpse into Qingdao” (Qingdao yipie 青島一瞥) which accompanied the photographs, he introduced the history of the seaside architecture and knowledge of the urban layout. While praising the German legacy of urban planning and infrastructure, also expressed his dismay at the Japanese occupation after World War I."}, {"type": "text", "text": "Travel photographs and essays offered a clue on how tourism in the Republican period was developing. The Great Wall, The West Lake, Mt. Tai and Yellow Mountains were the most popular tourist attractions in the early Republican period. In 1914, Huang Yanpei 黃炎培(1878-1965), an educator and politician, took many photographs of Yellow Mountains which were partly collected in an album named Scenic China: Series at Yellow Mountains (Zhongguo mingsheng diyizhong Huangshan 中國名勝第一種：黃山). Since 1914, the series of Scenic China published in a sequence: Yellow Mountains, Mt. Lu, Mt. Putuo, West Lake, and Mt. Wuyi. In 1915, the Scenic China series was given to the US as a gift in Panama–Pacific International Exposition in San Francisco."}, {"type": "text", "text": "Travel photographs, souvenir photographs, and tourist brochures were all means of disseminating knowledge of Republican China to a wider audience. Some albums with specific themes were published for promoting local tourism. In search of the Southeast (Dongnan lansheng 東南攬勝) in 1935 and Scenic Beauties in Southwest China (Xinan lansheng 西南攬勝) in 1939 are two examples. In search of the Southeast contains the photographs and texts contributed by several renowned intellectuals,painters, and photographers. In the travelogue of Yellow Mountains, Huang Binghong黃賓虹 (1865-1955), an accomplished traditional painter, wrote a long essay describing the journey to Yellow Mountains, and Chen Wanli, Jiang Bingnan contributed to a photograph depicting the mountain streams in pictorialist language."}, {"type": "text", "text": "In Search of the Southeast was edited by the Southeastern Transportation Tour Propaganda Committee, which suggests the guidebook was intended not only to introduce the scenic sites in the Southeast, but also to promote the Nanjing government’s achievements in transportation.308 Scenic Beauties in Southwest China was published in 1939. Lang Jingshan contributed lots of photographs taken in Sichuan when he went into exile after the outbreak of the Sino-Japanese War. He held two exhibitions in Shanghai in 1939 and 1941, showing the photographs taken in Southwest China when he fled to Sichuan after the bombings on the coast in 1937 (Fig. 4.31). These photographs taken in the frontier not only represent the landscape, but also convey the patriotic enthusiasm prevalent before and during the war."}, {"type": "text", "text": "Running from September 1932 to May 1933, Liangyou magazine carried out the first nationwide photographic expedition Liangyou Nationwide Tour (Liangyou quanguo kaocha tuan 良友全國考察團), making a photographic survey of the history,culture and people's livelihood from the Yellow River to the Yangtze River basin and southwest provinces under extremely difficult conditions of unrest and transportation.The tour team consisted of Liang Desuo 梁得所 (1905-1938), the chief editor of the Young Companion, and several photographers such as Ouyang Pu 歐陽璞, Situ Rong司徒榮. From Nanjing, Shandong to Northwestern China, they used their cameras to record and document the whole journey, then sent the photographs back to Shanghai.Photography became a central part of the tour. After the tour, The Young Companion Publishing Company held photographic exhibitions in Shanghai, Nanjing, Beijing,Hankou and several cities, displaying the photographs that had been selected from thousands.309"}, {"type": "text", "text": "The production of images of Chinese landscapes and historical monuments undoubtedly have political or ideological significance. Besides the exhibitions,Liangyou’s publishing company put out a comprehensive album called China as She Is:A Comprehensive Album (Zhonghua jingxiang 中華景象) in 1934 (Fig.4.32.1). The tendency of nationalistic interpretations shows in the Chinese foreword: “China is at a critical moment of national survival, but few Chinese know actual national conditions and people's livelihood.” The editors hoped the album could make up for the deficiency of local records and travelogues, making the contributions to the goal of national rejuvenation."}, {"type": "text", "text": "Despite the nationalist sentiments, in the English foreword of the album, the editor still emphasized that the album is “exposition and interpretation—not propaganda.”310 The album consisted of thousands of photographs cover the landscape and significant monuments twenty-eight provinces of Republican China during the nationwide tour. The photographs cover the landscape and monuments in twenty-eight provinces, including Manchuria, which the Japanese occupied since 1931, showing how Chinese photographers represented the new nation through the new medium photography."}, {"type": "text", "text": "The photographic practice was central to this album. The editors intentionally selected twenty photographs to enlarge and color, highlighting a series of tourist sites,including Pei Hai Park, the White Pagoda, the Qiantang River, and Guilin (Fig.4.32.2).The first color photograph in this album is a group photograph showing the four photographers in the team with the flag of the team (which seems to have been added by hand), all standing in front of the Giant Stone Buddhas in Gansu Province. The photographs of the tourist attractions in various provinces were accompanied by both Chinese and English introduction. This album displayed a unique perspective to depict and discover the national landscape, initiating a new era of cultural investigation in the Republican period."}, {"type": "text", "text": "After the broke of the Second Sino Japanese War, the cultural investigation still continued. Wang Ziyun 王子雲 (1897-1990) organized several art scholars and students in Chongqing––who were forced to move into interior China, developed a team to investigate the artifacts and cultural relics in the Northwestern China with the support from Education Ministry of Nationalist government. From 1940 to 1945, The team intensively used photography to establish a systematic photographic archive of the historical monuments and artifacts in Sichuan, Shaanxi, Henan, Gansu and Qinghai Provinces. The photographs were collected into a ten-volume album “The Northwest Photographic Album of the team of Education Ministry’s Northwest Art and Relics” ( 教育部藝術文物考察團西北攝影集). 311 The photographs in the album systematically show a series of single objects with rich details and information (Fig.4.33). The team of Education Ministry’s Northwest Art and Relics also held several exhibitions in Xi’an, Chongqing and Lan Zhou that displayed the artifacts in the Northwestern China and Dunhuang copies, which stimulated the desire of the public to rejuvenate “national art” (minzu yishu 民族藝術) during the wartime.312"}, {"type": "text", "text": "The invention of photography offered a new means of making national landscape images. The amateur photographers in the Republican period employed photography to depict the boundaries of a new nation state, which was informed by a desire of defining the identity of China.313 By representing the politically charged landscape in the 1930s and 1940s, photography made a great contribution to constructing and enhancing national discourse. Beyond aesthetic developments in the perception of landscape, the photographs also show political or ideological implications."}, {"type": "text", "text": "The prosperity of the portable camera market had paralleled the rise of leisure travel, cultural investigation and national tour in the Republican period. The different genres of records—art photography, travel snapshots, and ethnographic photographs jointly produce a moving photographic archive of the amateur photographers and a portable landscape of modern China."}]}, {"id": "ch5", "title": "Chapter 5 · Reconfiguring Realism", "paras": [{"type": "title", "text": "Chapter 5 · Reconfiguring Realism"}, {"type": "text", "text": "Chapter 5: Reconfiguring Realism: Transformative Pictorialism and New Visions Introduction"}, {"type": "text", "text": "Beyond the hobby and leisure activities, some amateur photographer embraced photography as serious art. In the 1920s and 1930s, photography as a Western-style art form had been recognized and legitimized through the appropriation and adaption of traditional-style ink painting by many Chinese amateur photographers. The efforts of the amateur photographers expanded the boundary of photographic expression and enriched the vocabulary of Chinese modern art. Beyond the appropriation of traditional painting, some serious amateur photographers exhibited the artistic quality of photography by focusing on the patterning of light and shade, composition and atmospheric effect. The examination of formalistic beauty in photography suggests a breakthrough in the understanding of photography."}, {"type": "text", "text": "Meanwhile, Collages, photomontages and design photography related to modernism offered a new perspective to represent the increasingly industrialized modern world. The photographs with sharply focused views of mechanic objects,architecture, and plants highlight a contrast with pictorialism, revealing the camera’s ability to represent the world in a completely objective manner."}, {"type": "text", "text": "Chen Wanli, in his first photographic album in 1924, enthusiastically argued that photography was not simply a mechanical production but also an artistic creation that brought together subject, composition, and lighting.314 It was worth noting that in his essay, photography had been elevated to a status of “art” rather than the craft or technique. An article in November 1923 The Eastern Times declared that “Fine-art Photography” (Meishu sheying 美術攝影) was a new genre of fine art.315 In the 1920s,Hu Boxiang, a member of the Hua Society, pointed out that fine art photography not only pursued true representation, but also emphasized the artistic quality.316 As Ouyang Huiqiang stated in “Photography Companion” (Sheying zhinan 攝影指南) in 1923,what distinguished fine-art photography from other genres like photojournalism was “painterly effect” (Huayi 畫意). From the perspective of traditional painting theory,Kang Youwei 康有為 (1858-1927), a famous conservative intellectual, expressed appreciation for the “painterly effect ” shown in Ouyang’s photographs.317"}, {"type": "text", "text": "Since the early 1930s, photography, which was originally seen as a Western-style art form, has been localized through the adaption of traditional-style ink painting.The discussions about fine art photography attempted to develop a series of local photographic vocabulary and the efforts of the amateur photographers expanded the boundary of photographic expression and enriched the vocabulary of Chinese modern art. Liu Bannong also made great contributions to photographic theory. His long essay “The Talk on Photography” gave an insight into linking photographic techniques with Chinese traditional artistic spirit, suggesting the divorcing form the mechanism and an introduction of artistic spirit, respectively, which link the pictorialist photography with traditional style painting.318 In the 1930s, two similar terms pictorialism (huayi sheying畫意攝影) and art photography (yishu sheying 藝術攝影) have been used to refer to a broader range of styles distinct from the documentary style.319"}, {"type": "text", "text": "A group of art photographers in the 1920s and 1930s successfully represent the aesthetic sensibility of an intellectual world. In respect of artistic practice, the fine-art photographs taken by the members of the Light Society and Hua Society feature soft-focus and darkroom skills, creating an aesthetic atmosphere that counteracted any mechanical effects. The most representative art photographer of this period is Liu Bannong. He became a self-taught amateur photographer when he studied phonetics in Paris in the early 1920s and dedicated himself to art photography after returning to China. Liu’s 1920s works were known for them with soft-focus, limited range of tones and specific technical methods like gum bichromate and bromoil processes, which was widely embraced by many European and American photographers who attempted to elevate photograph as fine art in the late nineteenth century and early twentieth century."}, {"type": "text", "text": "The photograph Pond and Light of the Early Morning Sun (池塘月色) that produced with heavy gum bichromate and bromoil processes, features a dreamy landscape with the reflections of the trees (Fig.5.1). The photographer draws on the dark shadows of European and American pictorial photography, and the early silver-salt process to make the image with intense tones and rich layers. The pictorial elements such as the faint morning light that converges in the clouds, the mirror representation that reflects the branches of birch trees, and the lush forest in the distance contributed to the aesthetic and sentimental atmosphere. Liu Bannong’s personal signature and inscription are also marked in the bottom left corner of the picture. Liu’s photograph echoes the 1904 artwork The Pond-Moonlight by American pictorialist photographer Edward Steichen (1879-1973). Both photographers utilized the great skills in depicting the relationship between light and shadow and space, creating an atmosphere as beautiful and quiet as a painting. The moonlight in Steichen’s work symbolizes the final stage of pictorialism in the European-American world, while the morning sunlight in Liu’s work suggests the wide acceptance of photography as a new art form in China."}, {"type": "text", "text": "The work by Liu Bannong inherits the artistic quality of the European and American pictorialism movement and opens up the infinite possibilities of photography as a new art form. It also features the “fuzzy” style that was popular in Chinese photography in the 1920s. This photograph also provides a new perspective on a long-obscured question in Chinese photographic history: was Chinese pictorialism or art photography a legacy of the European and American pictorialism movement, or was it something new that emerges from the indigenous cultural context? In 1923, Liu Bannong “bought a small hand camera to play with” while studying in Paris and came into contact with a large number of modern photographic exhibitions and magazines.320 Like most Chinese artists who studied in France in the 1920s and 1930s, he did not follow the modernist movement but concerned more about the origin of art photography—pictorialism. Although pictorialism movement declined in the early twentieth century in Europe and America, it experienced the second wave in China.After returning to China, Liu joined the Light Society in Peking and became one of the main members who made great efforts to promote art photography. Liu Bannong connected the aestheticism of European and American pictorialism with the yijing of traditional Chinese painting theory, making it possible for pictorialism to be widely accepted in the local cultural environment."}, {"type": "text", "text": "The aesthetic quality and pioneering darkroom skills that Liu Bannong employed inspired the next generation of art photographers. Among these art photographers, Lang Jingshan’s composite photography directly connected the pictorialism with the pursuit of national identity in an international stage. In fact, Lang explored diverse styles in the late 1920s, but eventually he established his signature style in the 1930s. Lang’s 1929 photographic album “Jingshan photographic album” (Jingshan sheyingji 靜山攝影集) collected his early photographic works which explored a variety of subjects ranging from urban architecture to domestic environment.He coined the term jinji zhaoxiang (composite photography 集錦照相) in a 1940 booklet “A Compendium of Composite Photography” (Jijin zhaoxiang gaiyao 集錦照相概要), and further explained the mothed of making composite photography in the book “The Method of Composite Photography” (Jingshan jijin zuofa 靜山集錦作法) which was firstly published in 1941.321 In a series of articles about the ideas and method of composite photography, he explained that the making of composite photography was based on the concept of traditional Chinese painting. Approaching an imaginative landscape, he modified the space and composition according to the Six Canons of Chinese Paintings proposed by Xie He 謝赫 (479-502).322"}, {"type": "text", "text": "Characterized by misty landscapes and wandering countrymen, Lang's pictorialism employed intensive darkroom methods to assemble fragmental literati motifs into an emulative traditional ink painting. His appropriation of traditional-style painting reframed a seemingly lost utopian landscape of China, promoting an idealized past through photography. Responding to the discourse of cultural radicalism in the May Fourth Movement, most art photographers were neither on the side of complete conservatism nor on the side of radicalism. As a neo-traditionalist, Lang Jingshan made great efforts to adapt traditional imagery into a modern medium, developing a dialogue between the past and present, art and technology. The 1934 photograph Majestic Solitude (Chunshu qifeng 春樹奇峰) was a composite of two original photographs.Lang placed a pine tree in foreground and used a chain of mountains as a distant background (Fig.5.2.1; Fig.5.2.2; Fig.5.2.3). The middle ground, a misty mountain view, was depicted as a reference to the blank space in traditional-style painting. Lang’s friend Ma Gongyu 馬公愚 (1893-1969), the prestigious calligrapher, painter and professor in Shanghai Academy of Fine Arts, wrote the calligraphic notes for Majestic Solitude. The inscription on the photograph praises the magnificence of Yellow Mountain and the exquisite skills of Lang Jingshan. Majestic Solitude, the first composite photograph created by Lang, was accepted by the British Salon Photographic Competition in 1934, which greatly enhanced his confidence in creation.323 Another 1934 work, Riverside Spring (Qingjiang xiaoji 清江曉汲), which shows more similarities to painting, was composed of two photographs. Lang employed even more sophisticated darkroom skills to incorporate fragmented images––branches in the foreground, a fisherman in the middle ground and misty mountains in the distant––into a complete picture with a flat perspective (Fig.5.3). A lot of space in two photographs was hidden into the blank, and the light and shadow were erased, which suggests the photographer attempted to make an emulative literati painting."}, {"type": "text", "text": "The moment of the fishermen’s life captured by Lang Jingshan is a particular response to the drastic changes: the daily lives of most Chinese people were isolated from the modernization, and the structures of inner stability and self-sufficiency were not completely destroyed. The poetic sentiment of everyday life that was displayed through pictorialism made a great contrast with the subjects of nineteenth-century colonial photography. This contrast precisely refers to the artistic characters of the local culture that Lang Jingshan and his contemporaries pursued. The pictorialist landscape photography, isolated from the metropolitan bustle, had been seen as resistance to the industrialized cityscape since the early twentieth century. Lang’s pictorialism not only manifests the stillness and subtlety of landscape but also creates a mysterious atmosphere that could be interpreted as exoticism as a continuation of colonial photography in the nineteenth century."}, {"type": "text", "text": "Lang Jingshan was adept at capturing the rhythmic and beautiful moments from everyday life. However, this realistic approach was gradually transformed in the mid-1930s into a fixed mode named “composite photography” (jijin zhaoxiang 集錦照相),in which a few fragments of the landscape were selected and collaged into photographic works that closely resembled literati paintings, following the composition of traditional paintings and using sophisticated darkroom techniques. The main principles of making composite photographs, as Lang Jingshan talked in his article “Composite photography”, were to change European linear perspective into Chinese perspective and “arrange the positions of the subjects” (jingying weizhi 經營位置):"}, {"type": "text", "text": "Chinese painting employs a bird’s eye view perspective…It is"}, {"type": "text", "text": "consistent with the way human eyes observe things…Therefore, the"}, {"type": "text", "text": "making of composite photography is also based on the perspective of"}, {"type": "text", "text": "(Chinese) painting…You can arrange the foreground, middle ground"}, {"type": "text", "text": "and background of each photograph, creating a monumental landscape"}, {"type": "text", "text": "by arranging the locations of the subjects. 324"}, {"type": "text", "text": "The “camera’s eye,” which refers to the mechanical effect, indicates the capacity to exhibit the visual accuracy and truth of the world, but what Lang attempted to overcome was the true representation.325 The visual mode dominated by Western perspective was challenged by a non-Western way of seeing. Lang not only restored the traditional imagery of the Chinese landscape but also reconstructed an essentially Chinese way of seeing and imagining traditional Chinese painting."}, {"type": "text", "text": "The emulative landscape photography in the Republican era was essentially a modern alternative to approaching eternity and immorality that was the essence of the declined literati spirit. The way of perceiving nature rooted in literati landscape paintings was to develop a spiritual connection between subject and nature through contemplation. Despite masterful skills, representing the past through a new medium suggests an inevitable contradiction and struggle. Lang Jingshan consciously leveraged photography to develop “traditional pictorialism” in close relation with the pursuit of national identity on an international stage. 326 An indistinctly national sentiment appeared in the artworks in the early 1930s. The appropriation of traditional style ink paintings into a new medium suggests a dynamic response to encroaching westernization and resistance to the colonial legacy. As argued by Lothar Ledderose,the nineteenth-century revival of antiquarianism redefined China’s identity, showing its advantages in the cultural and political competition in the world.327 Composite photography gave Lang a competitive edge in international salon photographic competitions. In the 1930s, his works were frequently selected for international salons and exhibitions in Japan and Europe."}, {"type": "text", "text": "The landscape photograph with stylistic references to traditional Chinese painting shaped the international imagination of China.328 Pictorialism, or fine art photography, suggests an intimate connection between painting and photography. The high dependency on painting language prevented the photographer from examining the uniqueness of the photographic language. Some pictorialist photographers in the 1930s clung to clichéd concepts and stereotypical modes of expression, following the aesthetic paradigm guided by veteran photographers and connoisseurs."}, {"type": "text", "text": "The invention of traditional pictorialist photography echoed the revolution of Chinese painting in Republican China. Similar to nihonga, Japanese painting, which was used in opposition to yōga, Western painting, “national painting” (guohua 國畫) was regarded as a reforming “Asian/Oriental” artistic forms against the backdrop of encroaching westernization. 329 “National painting” had been developing within the context of the National Essence movement of the 1910s and 1920s, which aimed to differentiate Chinese culture from the non-Chinese.330 As “the foreign” was embedded in Chinese identity, some “Western-style” art forms such as photography and sculpture had been adapted into local artistic expressions."}, {"type": "text", "text": "Photographers appropriated terms and concepts from painting, elevating the level of photography and legitimizing it as a fine art; painters—both traditional-style painters like Zhang Daqian and Western-style painters like Xu Beihong 徐悲鴻 (1895-1953)—treated photography as a symbol of scientific modernity, adopting some photographic practices like plein air sketching (drawing from nature outdoors 户外写生) to educate the students in Shanghai Academy of Fine Arts, which suggests photography was transforming the way of perceiving and depicting nature among modern artists. As Yi Gu argued, the camera had been used as a teaching tool for outdoor sketching, because the viewfinder of the camera can help students to establish composition closer to Western painting.331 The emphasis and use of photography show that modern artists and art educators were consciously encouraging students to change the way they observed nature, attempting to promote realism in the modern art world.The mutual influence of painting and photography contributed to the reform and innovation of modern Chinese art."}, {"type": "text", "text": "Beyond the appropriation of traditional painting, some serious amateur photographers exhibited the artistic quality of photography by focusing on the patterning of light and shade, composition and atmospheric effect. The examination of formalistic beauty in photography suggests a breakthrough in the understanding of photography. A increasing number of amateur photographers consciously emphasized the artistic quality of the photographs through focusing on the patterning of light and shade, atmospheric effect and spiritual meanings. In 1928, Hu Boxiang discussed that composition, light and shade played a key part in the process of photo-making.332"}, {"type": "text", "text": "Shao Woyun, a crucial member of Hua She, published an article “Brief Talk on Fine-art Photography” (meishu sheying lvetan 美術攝影略談) in Chinese Journal of Photography (Zhonghua sheying zazhi 中華攝影雜誌) in 1932, arguing that the “lighting” and “composition” were the key factors in art photography: “Even some landscape shows no special character, if the photographer can consider the lighting and composition and apply the developed scientific techniques, it will be a good fine art photograph.” He used his photograph Steamer in the sunset (mubo 暮泊) to illustrate how to arrange the composition: “the steamer anchoring in the harbor is the photographic subject, this scene was captured in the sunset, the black clouds in the upper part of the photo suggests the time. All the lines in this photo are straight, the long mast of the steamer sets off the light clouds, manifesting its outstanding shape.The shorter light pole makes the composition less monotonous. The steamer is arranged in the prominent position, it is not hard to see that, which plays a significant part in photography because the reader’s attention should be paid in the subject (Fig.5.4).”333 Shao Woyun explained clearly how to arrange the subject for a better composition in art photography, linking the photographic techniques with the creation of painterly effects and aesthetic atmosphere."}, {"type": "text", "text": "The efforts of 1930s amateur photographers such as Lu Shifu, Jin Shisheng, and Chen Chuanling contributed to the diversity of subjects and styles in the history of modern Chinese photography. Lu Shifu was a celebrated doctor in Shanghai and the founder of the Black and White Photographic Society. One photograph taken by Lu on Mount Huang makes a good reference for the transition of the understanding of pictorialism in the 1930s. The photograph demonstrates a clear transition from the imaginative landscape to a more direct snapshot from nature. In the photograph, he captured a scene in which a handful of travelers stand in the pine forest and enjoy the scenic beauty (Fig.5.5). Lu depicted the towering pine trees—an enduring motif in Chinese paintings—in the foreground and mid-ground in a realistic way, which was distinct from the imaginative and generalized landscape that Lang Jingshan and another traditionalist pictorialists produced. In the background, he also used a pioneering technique to show the misty landscape, creating a poetic atmosphere resonant with literati meanings. But the depiction of the travelers in the pine forest suggests a straightforward snapshot that reflected the nature in a pure form."}, {"type": "text", "text": "The rise of leisure travel promoted the transformation of perceiving nature, and the new approach to landscape suggests a transition from pictorialist representation to straight photography in the 1930s China. Lu Shifu appealed to the photographic hobbyists for trying more subjects, which not only suggests a shift to the reality, but also a transformation of the perceptual mode of nature. As an enthusiast of both travel and photography, a great number of photographs were taken during leisure travel (Fig.5.6). Instead of the imaginative landscape, he preferred to employ a more realistic approach to capture the rhythms and dynamics of the natural environment."}, {"type": "text", "text": "Jin Shisheng, who has the dual achievements of being an outstanding urban planner and a pioneering amateur photographer, also made a breakthrough in artistic photographic expression. Born to a merchant family in Wuhan in 1910, Jin taught himself photography at the age of thirteen, when he received his first Kodak camera.He started his photographic career in Shanghai in the 1930s, when he studied civil engineering at Tongji University. In 1938, with the support of the Humboldt Foundation,Jin Shisheng went to Germany to study road and urban engineering. Embracing the definition of an amateur as a serious and creative artist, Jin contributed greatly to promoting the transformation of pictorialism and even modernist experimentation in some cases.334"}, {"type": "text", "text": "A photograph of Jin Shisheng from 1934 features the beauty of Slender West Lake in Yangzhou, his hometown (Fig.5.7). In this work, he intentionally uses the traditional Chinese “moon gate” as a device, framing the landscape of the arched bridge and weeping willows by the lakeside to create the visual effect of a Chinese circular fan. In the foreground, he captures a scene of everyday life: A little boy sitting on the gate shows his back to the audience; a young woman stands beside him, smiling and talking to him. Accompanying the photograph is a short poem he wrote: “A picturesque landscape with the lake and the reflections of clouds; the visitors are characters in this beautiful painting.”335 Although he defined the landscape in a picture, his creation goes beyond the works of contemporary pictorialist photographers. Instead of borrowing his subject matter from literati paintings, his was a pioneering technique for depicting the daily life of his subjects. The juxtaposition of a prosaic scene and the eternal beauty of the landscape mark a remarkable break with the emulative representation of landscape."}, {"type": "text", "text": "From imaginative pictorialism to realistic pictorialism, the art photographers’ emphasis was on representing nature in detail and expressing the requisite sentiment through the camera beyond darkroom skills. Jin Shisheng’s photographs of the rural landscape in the suburbs of Shanghai tended to be realistic images representing the nature of objects form and state. He was a master of constructing the composition of a photograph. A 1930s photograph of Suzhou made by constructed composition shows a seemingly deserted street and houses (Fig.5.8). He foregrounds a hanging lantern placed in the golden section of the photograph, placing a row of houses in the middle ground and moving clouds as the background. The spaces and depth are arranged perfectly. Further, he deployed masterful skill in representing texture and details of the object, which was rarely seen in traditional pictorialist photographs."}, {"type": "text", "text": "Jin Shisheng launched an innovative photographic magazine, Feiying, in 1936.As editor-in-chief, he established an inclusive style of embracing sophisticated pictorialist photography as well as modernist exploration, representing a broad spectrum of modern Chinese photography. Flying Eagle, which had published a total of 19 issues in 19 months with the support of Guanlong Photographic Equipment Company, provided a platform for dedicated art photographers to demonstrate their talent. Jin Shisheng, as the chief editor, meticulously selected all the photographs, and organized them as specific themes and subjects. In issue 17 of Flying Eagle (1937), he selected a group of photographs featuring texture and patterns in nature, including Li Lixuan 李藜軒, Wei Nanchang’s 魏南昌 reeds in the snow, and Lang Jing's autumn leaves; and some photographs displaying the tranquility of the countryside from Liu Xucang 劉旭滄(1913-1966), Jiang Bingnan and Wu Zhongxing. He also chose photographs representing workers and laborers in the city, by Yang Yongma 楊永麻."}, {"type": "text", "text": "The deepening understanding of art photography benefited greatly from the flourishing metropolitan culture environment. The 1930s amateur photographers were open to pioneering photographic ideas and techniques from all over the world. One of Jin Shisheng’s self-portraits very clearly reveals his wide artistic vision of the 1930s (Fig.5.9). According to Wu Hung’s perceptive analysis of the various objects and images in this compact space, two magazines—The Young Companion and the German Photography Annual (Das Deutsche Lichtbild )— symbolized his two main inspirations for photography: The former represented the flourishing Shanghai urban culture that contributed to “a cultural climax of Chinese modernity”; the latter, the foreign impact of international pictorialism and modernist photography movements in Europe and the United States. In Jin’s 1936 self-portrait, there are international photography magazines on the shelves beside him: four issues of German Photography Annual, the Japanese photography album International Photography (国際写真), the International Portrait Photography Catalog, and the British Journal Photographic Almanac.336 There were many shops selling international photography journals in Shanghai. The 1928 Shanghai Sketch (Shanghai Manhua 上海漫畫) introduced the cover design of the German Photography Annual.337 Luo Bonian lived in Shanghai from 1932 to 1935 and his archive includes receipts from A. S. Watson & Co, a pharmacy that also developed negatives and sold supplies. Das Deutsche Lichtbild was distributed by Kelly & Walsh,a Shanghai-based publisher.338"}, {"type": "text", "text": "Both Lu Shifu and Jin Shisheng's representations of ponds, rivers, villages, and rural architecture show strong inspiration from naturalism that international pictorialism emphasized and promoted. International pictorialism reached a peak of activity between 1890 and 1930 and included artists working in the USA, Europe, Asia and Australia. Pictorialist photographers not only reinforced photography's status as an art alongside painting and drawing, but also treated photography as an interpretive and expressive"}, {"type": "text", "text": "medium"}, {"type": "text", "text": "that"}, {"type": "text", "text": "can"}, {"type": "text", "text": "evoke"}, {"type": "text", "text": "emotional"}, {"type": "text", "text": "sensations."}, {"type": "text", "text": "The"}, {"type": "text", "text": "British photographer Peter Henry Emerson (1856-1936), in particular, sought ways to promote personal expression in camera images, and created an ‘epoch-making’ photographic album called Life and Landscape on the Norfolk Broads, emphasizing naturalism in his photographs. American photographer Edward Steichen were influenced by his training as a painter and frequently used chemicals to achieve prints that resembled soft, fuzzy mezzotints or wash drawings. His work Pond-Moonlight was made with the use of the gum-bichromate process in conjunction with platinum or iron-based emulsions,creating a fuzzy and romantic atmosphere effect. Photo-Secession, the active pictorialist photographic group led by Alfred Stieglitz (1864-1946) in the early twentieth century, expanded the artistic vocabulary of pictorialism. In addition to European-American pictorialism, Japanese art photography before World War II impacted 1930s amateur photographers. Japanese photographer and author Fukuhara Shinzō (1883-1948) proposed the theory of light, which is the aesthetic basis of geijutsu shashin (芸術写真literally, art photography). Saito Tazunori's How to Make Art Photographs (1932) outlines four different approaches to the aesthetics of pictorialism:lyrical expression (jojoteki hyogen 徐々的表現), impressionistic expression (inshoteki hyogen 印象的表現), realistic expression (shajitsuteki hyogen 写実的表現) and constructivist expression (koseiteki hyogen 構成的表現). These four categories suggest a transforming understanding of art photography.339"}, {"type": "text", "text": "Pictorialism declined in the early 1920s after the advent of Straight Photography.Straight Photography respects the camera's ability to faithfully reproduce an image of reality in sharp focus, rich detail and high contrast. Photographic critic Sadakichi Hartmann complained in “A Plea for Straight Photography” that pictorial photographers rely too much on dark room technology to produce blurred images and use special printing methods such as gum dichromate. Hartman further explained direct photography:"}, {"type": "text", "text": "“Rely on your camera, on your eye, on your good taste and your"}, {"type": "text", "text": "knowledge of composition, consider every fluctuation of color, light,"}, {"type": "text", "text": "and shade, study lines and values and space division, patiently wait until"}, {"type": "text", "text": "the scene or object of your pictured vision reveals itself in its supremest"}, {"type": "text", "text": "moment of beauty.”340"}, {"type": "text", "text": "Hartman’s query on pictorial photography coincides with Alfred Stieglitz’s transformation. In the 1910s, Stieglitz greatly appreciated the clear and rich details in Paul Strand’s works, which means rendering of abstract form and tonal variation, and a step toward modernist art. In late 1920s and early 1930s China, the transition of pictorialism from an imaginative expression to a realistic one echoed the decline of pictorialism and the advent of Straight Photography in 1920s Europe-America, albeit delayed by a few decades. However, the transition of pictorialism in China signifies a more contested turn in twentieth-century Chinese art."}, {"type": "text", "text": "In 1930s China, the transition of pictorialism from an imaginative expression to a realistic expression echoed the decline of pictorialism and the advent of Straight Photography in 1920s Europe and America. The art photographers’ emphasis was to represent the natural world in detail through the camera beyond the use of darkroom skills. However, when European-American pictorialism was gradually moving towards modernist photography, an ongoing realism movement in the 1930s modern Chinese art world remarked a break with pictorialism."}, {"type": "text", "text": "“Photography is a superior realism because of its perfect draughtsmanship.”341 photography had long been seen as the epitome of realism, early names for photography all suggest the idea of drawing and engraving. Don Slater categorizes photographic realism into three types: representational realism, which refers to a superior ability of representing the world; ontological or existential realism, which indicates that the ability of photography to become a witness of events, to recall the past, to record the ruined; mechanical realism, which connects photography with a modern technological vision through the good reproducibility. 342 As the modernization and industrialization in Republican China, photography was inevitably connected with the technological advanced world."}, {"type": "text", "text": "Lu Shifu explored the new and distinct approach to photographing. Instead of appropriating the painting subjects, Lu Shifu encouraged the photographers to take photographs on a variety of subjects in everyday life, which expanded the boundary of modern Chinese photography. Simultaneously, many new subjects of art, politics and conflicts were established through photography in the Republican period. The capacity to represent reality combined photography with the dynamics of modern world.Xiezhen, the characters for photography in Japanese since the 1850s (shashin) also appear in Chinese as an alternative name for photography.343"}, {"type": "text", "text": "Photographic realism had been filtering into the public’s minds due to mass reproducibility. In the early Republican era, the new intellectuals and emerging bourgeoisies leveraged the photography to spread knowledge of democracy and science.In the 1920s and 1930s, realism as a way of faithful reflecting the world have been upheld by many artists and critics. The trend of realism opens for different interpretations. The style of mimeticism, which was fully exhibited in late Qing and early Republican pictorials like Dianzhizhai Pictorial (點石齋畫報), developed a different approach to representing reality. 344 Progressive intellectuals appreciated realism’s break with Chinese pictorial traditions, employing realism as a tool to reflect the real world. Some intellectuals, such as Kang Youwei, argued that the realist representation of the world was a more advanced type than the conceptual dynamism in traditional Chinese art, because of realism’s affinity with scientific practices related to self-strengthening and independence.345 Xu Beihong claimed that the highest state of art, is to “represent nature as if it were real” (weimiaoweixiao 惟妙惟肖). In the first National Exhibition of Art in 1929, there were conflicting views of realism in the published statements of the painter Xu Beihong and the poet Xu Zhimo 徐志摩 (1896-1931). Xu Beihong believed the mimesis while Xu Zhimo was open to expressionistic experimentation. Both of them desired to appropriate a Western model to reconstruct Chinese realism, but they insisted on the different approaches to realism."}, {"type": "text", "text": "Realism was considered a new and progressive art style due more to ideology than aesthetic value and redefined the national identity and crisis before the Second Sino-Japanese War. 346 For the intellectuals who acclaimed socialist realism, realism potentially revealed the historical principles of the world.347 In a broader context,photography as a realistic way of seeing has been brought into the new framework established by Chinese artists, which utilized realism as a Western model to rejuvenate Chinese art.5.2 A Fragmented Reality: Photomontage and Modernist Exploration"}, {"type": "text", "text": "The photographic modernism movement in Europe and America between the wars stimulated a lasting trend of photographic experimentation among the Chinese amateurs. As discussed in chapter 4, Jin Shisheng and Luo Bonian, urban modernist photographers in Shanghai, creatively responded to these exciting modernist movements in their work. In fact, photographic modernism in 1930s China was not limited in urban images. Design photography and photomontages provided a new perspective to understand the Chinese modern art landscape. The unique viewpoints and abstract forms in photographs reconfigured fragmented images of moving spectacles during their travels into an experimental montage."}, {"type": "text", "text": "Design Photography (Tu'an sheying 圖案攝影) emerged within the context of the decline of the pictorialism and the rise of photographic experimentation in the 1930s. In 1930 The Young Companion, Zhang Jianwen 張建文 published several photographs representing mechanical and artificial objects such as wheels and fans in the section of \"A Study of Designs by Photographs\". The Eastern Times released a special section of photo designs, showcasing the close-ups with emphasis of the lines, angles and texture of the artificial objects, including feathers and paper.348 Zhang Guangyu was one of the earliest artists in China who drew the modernist influence from Europe-America. The two photomontages he created transformed everyday objects and materials into artistic subjects. He captured a door, windows, and wire poles around his house, duplicating four copies of the original photograph and then resembled them into a kaleidoscopic montage.349 The accompanying words with the montages argued that each everyday object could be represented as the artistic subjects in the photographs; even the advertisements and design photographs could be regarded as art."}, {"type": "text", "text": "Employing new techniques such as collage, modernist artists attempted to reshape human perception by transforming everyday subjects and materials into art, which broadened the definition of art in general. The close-ups and photomontages of the ordinary objects in the 1930s were popular among urban photographic amateurs. In the tenth issue of Changhong in 1935, Huang Jiezhi 黃劼之introduced design photography or photo signs as a new subject in art photography, encouraging amateurs to explore the method of making collages of design by themselves.350"}, {"type": "text", "text": "Some advanced amateurs were eager to demonstrate their sophisticated techniques to manipulating image. Luo Bonian made several colleges in the 1930s. He transformed palm fronds and iron fences into geometric patterns, arranging palm leaves around a central point or forming a larger abstract image in a repetitive pattern (Fig.5.10.1;Fig.5.10.2; Fig.5.10.3). Employing collage and other modernist techniques, modernist Chinese photographers attempted to reshape human perception by transforming everyday botanical subjects into abstract art, and to broaden the definition of art in general. The promotion of everyday aesthetics inspired him to capture ordinary subjects in a domestic environment. Luo took several close-up shots of a crystal doll against a background with modern patterns, framed with beautiful flowers and plants. The collage exhibits a blend of traditional aesthetics and modernism."}, {"type": "text", "text": "Increasingly fragmented images of metropolitan life served as a metaphor for a rapidly mechanized modern world. Through an examination of Chinese modernist artists’ montages, I will explore how the 1930s Chinese artists reconfigured fragmented images of urban
