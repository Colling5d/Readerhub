时泰（Liang Shitai，生卒年不详）严重依赖西方摄影师留下的摄影遗产，缺乏抵抗殖民视觉的能力。然而，一些日本摄影师，如日下部金兵衛（Kusakabe Kimbei，1841—1932）、小川一真（Ogawa Kazumasa，1860—1929）和玉村康三郎（Tamamura Kōzaburō，1856—？），他们都经营照相馆，在19世纪90年代就擅长建立一种独立的日本纪念品摄影风格，这不仅满足了欧美观众的想象和好奇心，也有助于形成一种与国家认同相关的新日本风格。Naoyuki Kinoshita, \"The early years of Japanese photography,\" in The History of Japanese Photography, ed. Anne Wilkes Tucker (New Haven: Yale University Press, 2003), 14-99. 在皇产之外，政府启动了对佛教神社和寺庙的调查，并发展了国家艺术博物馆和艺术教育。小川一真（Ogawa Kazumasa，1860—1929）作为官方摄影师参与了这一摄影项目，拍摄了约800幅日本佛教寺庙和佛像的照片，这些照片在数年间陆续发表在艺术杂志上。作为《写真新報》（Shashin Shinpō）和《国華》（Kokka）杂志的编辑，他在观察和描绘文化遗产方面拥有丰富的经验，这对他在中国的摄影实践产生了重大影响。44"}, {"type": "text", "text": "1901年，东京帝国大学派遣了一支由几位不同背景的专家组成的团队，对紫禁城内宫殿建筑的建造与装饰进行文化考察。建筑学者伊东忠太（Itō Chuta，1867—1954）、东京工业大学的工程师土屋淳一（Tsuchiya Junichi，生卒年不详）和奥山恒五郎（Okuyama Tsunegorō，生卒年不详），以及摄影师小川一真共同发起了一项细致的记录项目。1906年出版了共170幅照片，配有日文、中文和英文说明文字。正如该相册前言所示，该项目为建筑研究提供了材料，展现了宫殿中\"被小心地避开公众视线\"的部分。45"}, {"type": "text", "text": "伊东忠太通过分析奈良法隆寺——世界上现存最古老的木构建筑——确立了日本的现代建筑研究，他怀着迫切的心情前往紫禁城进行考察。Thomsen (Chicago: Center for the Art of East Asia, University of Chicago, 2009), 220-242. shashincho [Photographs of the Palace Buildings of Peking] (Tokyo: Ogawa Kazume Shuppanhu, 1906), n.p. 尽管伊东可能在团队中担任建筑顾问，但这一雄心勃勃的考察项目的实际执行者是小川一真。他在紫禁城的呈现中运用了一种开创性的摄影技术，将皇宫的景象转化为美学对象。"}, {"type": "text", "text": "这本相册面向全球读者，以其东方主义风格的封面，作为一部关于紫禁城及其他宫殿宏伟建筑展览的视觉指南。相册中的第一幅全景图凸显了一种宏伟与壮丽。小川从高处取景，有效地传达了位于中轴线上作为皇权象征的太和门的辽阔与壮丽。从永安寺俯瞰紫禁城的鸟瞰图，与1860年费利斯·比托从景山拍摄的全景图相呼应，在40年后展现出更为震撼、更具纪念碑性的景象。从第八幅图版开始，照片按照军队和参观者沿中央南北轴线入城的顺序组织和展示。这场视觉之旅始于一张以圆形修版处理的乾门内部照片，模仿了中国传统建筑中的“月门”形式。乾门与大清门之间市场的热闹景象，与皇城内荒凉的宫殿形成对比（图1.8）。令人印象深刻的是，团队付出了如此努力来表现建筑的装饰、质感和细节；例如，小川特意描绘了华表的装饰图案，华表是一种位于天安门前的礼仪性立柱。他还在其旁放置了一位中国本地人以向观者标示尺度。在伊东的指导下，小川拍摄了一些建筑构件的特写：例如，栏杆柱头的装饰顶部、前台阶、台基、太和殿内外及周围的藻井（柱与天花格），以及一些更近距离的物体视图，如石狮、铜鹤与铜龟、石晷。他还使用了一些富有创意的视角来展示宫殿的屋檐和梁架，充分展现了中国建筑的独特性。相册以日本军队私人住宅的照片结束，士兵们肃立于门前。他们的西式军装与中国传统建筑形成鲜明对比（图1.9）。"}, {"type": "text", "text": "小川一真受雇为政府的宝物摄影师，擅长通过将宗教宝物转化为艺术品，使其脱离原有语境，以服务于国家利益。46 在中国，他的摄影实践一方面完成了为考察紫禁城及其他宫苑的“布局、构造与装饰”提供视觉记录的任务，另一方面成功地将1900年被联军攻入的紫禁城的意义与皇权去语境化。"}, {"type": "text", "text": "尽管相册中的场景稳固而具有帝国气象，这些照片并未唤起紫禁城的“灵光”。对一种“垂死传统”的记录，是为了建构“以‘传统主义’东亚建筑形式呈现的全新现实”。47 伊东忠太与小川一真为塑造一种新的东亚纪念碑性付出了巨大努力。在中国逗留十四个月后，伊东访问了缅甸、印度、斯里兰卡、土耳其、欧洲和美国。在1909年的一篇文章中，他将社会达尔文主义应用于建筑，声称由于中国“未开化的文化”，中国建筑没有进化。48 他在1901年的建筑研究本质上是人类学研究，揭示了“日本殖民主义中的文化矛盾”。他对传统东方建筑的考察，其核心是推动一种与建构独特日本族群认同相关的新日本式建筑。49 作为审美对象与政治工具，纪念碑在与外国势力的历史遭遇中不断被塑造和再现。小川一真的照片有助于追溯历史纪念碑意义的变化。文化记忆、权力关系与民族认同的三重交织，重构了紫禁城的纪念碑性。50"}, {"type": "text", "text": "借助一系列新的摄影技术和器材，紫禁城处于联军的监视之下。然而，在这些带有惩罚性和仪式性的照片中，仍能发现一些矛盾与断裂，这一点颇有意思。除了记录紫禁城内的盛大庆典之外，专业与业余摄影师都热衷于在紫禁城和颐和园内部、明十三陵、北京的城墙以及其他地方拍摄一些日常快照，从而从展示殖民权力转向对日常生活的观察与监视。"}, {"type": "text", "text": "档案中的普通快照对历史学家而言通常平淡无奇。但尽管姿势僵硬、正面直视，且偶尔模糊，这些快照仍显示出与地点、遗址和物件之间的联系。在这里，军队摄影师拍摄的快照使部队与纪念性建筑之间的相遇成为不朽。有意思的是，这些1900—1901年间看似自发的照片如何构成了一种另类历史版本，并增添了记忆的复杂性。当时的摄影并不仅仅是记录“教训”过程的工具；它还是一种流行的消遣方式，用以记录个人生活，并界定外国人在中国的身份。"}, {"type": "text", "text": "业余摄影师见证了征服与暴力背后的私人记忆。一本灰色布面柯达相册中汇集了共96张照片，它们曾是英国将军乔治·德·西蒙斯·巴罗爵士（1864—1959）藏品的一部分。巴罗在义和团运动期间随阿尔弗雷德·盖斯利将军（1844—1918）在中国服役，并于1901年12月前往印度。51 在华期间，他收集了许多照片，使人得以一窥英国军队在这段一年多占领期内的日常生活。他收集的若干照片捕捉了紫禁城日常生活中的自然瞬间。"}, {"type": "text", "text": "相册中的一张照片展示了英国公使馆夫人们与其他宾客相聚谈笑的轻松场景。有趣的是，在这张照片下方另有一张质量相近的合影，拍摄的是英国高级军官，如阿尔弗雷德·盖斯利将军爵士和皇家工兵团的杰拉尔德·奥沙利文上校（1853—1940）（图1.10）。与奥基夫在紫禁城拍摄的官方照片不同，巴罗的私人相册让人得以一窥军队、英国公使馆乃至重要政治人物的个人生活。在轻松甚至欢快的气氛中，联军似乎很享受在紫禁城的占领生活。这些在庭院和宫殿中三五成群拍摄的照片捕捉了日常生活的瞬间，在个人与宫中古迹之间建立起私人联系。这本私人相册现藏于大英图书馆。通过重新解读和重新审视这些个人档案，挑战既定历史的新叙事正在建构之中。"}, {"type": "text", "text": "他们既是征服者，也是游客，这种双重身份在占领期间不断转换。一些照片，如奥基夫在占领初期拍摄的快照，记录了部队的游客体验。通往明十三陵路旁一尊石骆驼的照片，在主题和构图上都与19世纪摄影师约翰·汤姆逊（1837—1921）19世纪70年代的照片遥相呼应。明十三陵作为明朝皇帝的陵墓，象征着一种怀旧式的荣耀。在汤姆逊的照片中，一个半裸的中国本地人倚靠在路旁那巨大而怪异的石兽上，背景中荒凉的旷野营造出一种寂静与忧郁的气息（图1.11）。"}, {"type": "text", "text": "在奥基夫拍摄于近30年后的照片中，那个中国本地人已被一名美国第六骑兵团的士兵取代。摄影师选择拍摄这名士兵的背面，他用手臂撑着石骆驼，另一名士兵站在他对面，手里牵着几匹马的缰绳（图1.12）。汤姆逊的照片通过展示一种中国特有的景物，呈现出明显的人类学视角；相比之下，奥基夫的照片传达了更多主观情感。他们对明十三陵的造访很可能沿袭了汤姆逊及其他19世纪摄影师的旅行路线。部队围绕着这尊石兽摆出各种姿势，拍摄了好几组照片。他们甚至还在两头巨大的石象之间拍了一张合影。这一系列照片展现了紫禁城之外逐渐祛魅的过程。"}, {"type": "text", "text": "紫禁城的航拍照片、立体视图、新闻照片和日常快照揭示了这些相遇的多样性。1888年手持相机的发明，以及一年后胶卷的制造，扩大了义和团运动与北京占领时期的图像数量。几乎与此同时，半色调印刷工艺的引入将照片推入了印刷媒体。52大量通过欧美书籍、期刊、杂志和画报传播的流通图像，移除了瓦尔特·本雅明所说的“此时此地的独特存在”。53协约国用来惩罚中国人的各种方法削弱了帝国的权威。54从银版摄影到手持相机，不难看出，摄影之所以能普遍征服全球观众，是由于复制和传播速度的不断加快。在其诞生后的二十年内，手持相机已在全球范围内确立了无处不在的存在。1.2 早期条约口岸中国的业余摄影师"}, {"type": "text", "text": "随着摄影为更广泛的受众所用，越来越多的摄影爱好者使用手持相机捕捉日常生活中人们自然流露的瞬间。第二次鸦片战争后，越来越多的外国居民聚集在中国的条约口岸，他们主要由传教士、外交官及其家属、商人和探险者组成。55在19世纪末和20世纪初，旅居中国的欧美侨民使用柯达相机记录家庭聚会、短途旅行和文化考察。私人照片并不直接参与社会历史话语的建构，55 Robert Bickers, “The Lives and Deaths of Photographs in Early Treaty Port China,” in Visualising China, 1845-1965: Life/Still Images in Historical Narratives, Visualising China, 1845-1965 (Brill, 2013), 3-38.而是通过对个人叙事的持续阐释转化为集体记忆的一部分。"}, {"type": "text", "text": "在干版时代，许多早期业余摄影师都有科学背景，因为摄影最初被视为一种神秘的产物。德贞（John Dudgeon，1837—1901）是一位苏格兰传教医生，曾在伦敦会北京医院工作，在中国生活了近40年。德贞医生和其他一些传教医生在19世纪70年代开始将欧洲摄影手册翻译成中文。他于1873年参照欧洲摄影手册编写了一部入门摄影手册《脱影奇观》（Tuoying qiguan 脫影奇觀），共三卷。“脱影”字面意思是使影与实体分离，暗示了一种复制和摹写的过程。该手册介绍了欧洲光学知识、捕捉图像的基本原理以及显影方法；还列出了附有图片说明的摄影材料和设备。这部手册中的知识和详细方法使更多摄影爱好者成为自学成才的摄影师。56除了商业照相馆中的摄影师外，一些中国本地爱好者也在积极探索摄影技术，并参与传教士的摄影实践，这将在下一章中充分讨论。"}, {"type": "text", "text": "德贞的一位朋友、英国业余摄影师托马斯·查尔德（Thomas Child，1841—1898）曾在中国海关担任煤气工程师，直至1889年。他拍摄了大量中国建筑和纪念物的照片，如圆明园、北京城墙、明十三陵，以及社会场景。查尔德的照片并未采用宏大的全景和摆拍的场面，而是运用多变的视角来表现北京的历史纪念物和真实的街头生活。与查尔德的干版技术不同，爱德华·盖伊·希利尔（Edward Guy Hillier，1857—1924），一位在香港、上海和北京任职的银行家兼经理，使用一种“即时相机”——很可能是一台柯达相机——在沿长江旅行并深入宜昌西南山区时拍摄照片。57"}, {"type": "text", "text": "在华外国居民中摄影热情的普遍高涨，很可能是由1888年柯达相机的问世所推动的。正如1889年6月《字林西报》上的一则广告所说：“作为一种侦测相机，它在便利性和调节速度方面无与伦比，可在各种条件下即时拍摄运动物体，无需打开相机即可即时调节焦距和快门速度。”58柯达最初是作为侦测相机发明的；其小巧的体积和快捷的速度为即时拍摄带来了诸多便利。但其易于使用的特点最终吸引了大量业余摄影师，他们将摄影视为一种爱好，而非一种科学程序。"}, {"type": "text", "text": "这种新相机最初由通商口岸的外国商行（行）销售。十九世纪中国的柯达广告提到，最新产品可在上海的外资商店购买，如J. Liewellyn & Co., Ld.。柯达产品还作为圣诞礼物加以推广。一则1889年的广告显示，上海的Liewellyn & Co., Ld出售一种“非常方便”的相机，它“可以藏在外套下，镜头从纽扣孔中伸出，使用者只需拉动一根细绳便可拍摄若干张照片。”59这些话凸显了柯达的优点：操作简便，非常方便。它们可以由一些使馆工作人员和其他外国居民作为圣诞礼物带入中国。"}, {"type": "text", "text": "十九世纪末，摄影在欧美国家被视为一种体面的爱好，为社会生活带来益处。侨民群体将这种消遣带到了中国。摄影也被用作记录在华侨民社群社会生活的工具。艾丽西亚·比威克·立德（Alicia Bewicke Little，1845—1926）是一位享有盛名的旅行作家和女权主义者，她以英国商人阿奇博尔德·约翰·立德（Archibald John Little）妻子的身份来到上海。1887年，他们迁居至中国远西部的重庆。60《亲密中国：我所见到的中国人》（Intimate China: The Chinese as I Have Seen Them）是艾丽西亚于十九世纪八十年代末至九十年代初撰写的一本书，书中收录了120幅摄影插图，描绘了她于十九世纪九十年代深入中国内陆旅行时所见的风景、地方风俗与民众。除了展示异域场景与当地人的生活之外，她还着重刻画了帮助旅客穿越长江三峡的纤夫的艰辛劳作（图1.13）。在纤夫的照片中，她以抓拍的方式捕捉了纤夫沿江行走的劳动身影，背景是起伏的丘陵与湍急的河流。艾丽西亚在书中描述了捕捉拍摄对象动态的困难。她曾试图在佛教僧侣跪拜焚香时为他们拍照，但“等到架好相机时他们已离去，实在可惜。”61根据她的描述，她当时使用的可能并非小型相机。她的照片被认为有助于引起人们对长江三峡劳工恶劣处境的关注。"}, {"type": "text", "text": "十九世纪中叶，摄影器材笨重且昂贵，女性在摄影史上发挥的作用十分有限。轻便且易于操作的柯达相机的发明改变了这一局面，激发了女性摄影师的热情。近二十年后，德国外交官弗里茨·魏斯（Fritz Weiss，1877—1955）及其妻子海德维希·魏斯（Hedwig Weiss）于1911年沿长江从上海前往四川旅行时，充分利用了便携式相机。62一张在他们船屋甲板上拍摄的照片，呈现了弗里茨与海德维希·魏斯沿长江在宜昌与四川之间旅行的情景。他们坐在一艘狭窄的船屋中，那是秋冬季节长江上唯一可用的交通工具（图1.14）。"}, {"type": "text", "text": "在参观南京明孝陵时，弗里茨为妻子拍下了一张旅行快照。海德维希·魏斯手持柯达相机，戴着墨镜和圆顶硬礼帽，悠闲地站在石像旁（图1.15）。与约翰·汤姆逊和奥基夫在北京明十三陵拍摄的照片相比，这张构图松散、质量普通的私人快照并未将历史纪念碑作为拍摄对象来展现其重要意义，而是在个人与纪念碑之间、个人与变迁的时空之间建立起联系。纪念碑性所唤起的那种伟大与力量的灵光，在日常摄影实践中逐渐消失。"}, {"type": "text", "text": "柯达发明之后，摄影也成为一种休闲和社交活动，使早期条约口岸中国的侨民社群更加紧密地联系在一起。福州成为另一个许多欧美业余摄影师聚集的中心。约翰·查尔斯·奥斯瓦尔德是一位英国茶商，19世纪80年代末居住在福州，他收藏了一批照片，其中包含福州侨民社群的社会生活和旅行经历的照片。在他的私人收藏中，有一张1895年3月的照片，题注为“I. Piny拍摄的瞬时照片”，可能是用柯达拍摄的即时快照。这种坦率的构图和自发的取景——业余摄影的典型特征——提供了对条约口岸中国外国社群社会生活和文化生活的一种私人视角，展示了19世纪殖民叙事的私人版本（图1.16）。63"}, {"type": "text", "text": "手持相机凭借其感光胶片和更快的快门速度，使专业人士和业余爱好者都能跟上城市生活的步伐，并为其留下富有表现力的记录。乔治·沃伦·施怀雅自1904年起是他家族企业太古洋行的伦敦合伙人，太古洋行是一家拥有航运业务的著名企业集团。64 1906年至1940年间，施怀雅定期访问中国的子公司，并在访问期间拍摄了许多照片。他对上海这样港口城市蓬勃发展的航运业更感兴趣，这是可以理解的。他使用一台柯达全景相机，配以全景底片（3½英寸×12英寸），拍摄了一系列外滩的全景照片。柯达全景相机可以让操作者拍摄142度的视角，适合拍摄广阔的风景和建筑。65 施怀雅拍摄了若干照片，记录他在黄浦江上的航行，展现了汹涌的波涛和沿岸广阔的景观（图1.17）。这些流动的景观成就了外滩充满动感和活力的意象。66"}, {"type": "text", "text": "在上海外滩之外，施怀雅的摄影调查还延伸到中国北方的港口。作为太古洋行的董事，乔治·沃伦·施怀雅利用相机记录了他对中国北方沿海各子公司的考察之行。在相册《中国北方港口B & S（Butterfield & Swire）》中，他拍摄了浙江省宁波、山东省杨家沟和龙口等基础设施仍在建设中的地方。他还访问了塘沽、秦皇岛和建于1905年的奉天港。有些照片表现了在港口工作的苦力和码头工人（图1.18）。这些照片建立了一个20世纪初中国港口城市的系统视觉档案。"}, {"type": "text", "text": "业余摄影者越来越多地将相机用作记录旅行记忆与私人生活的工具。手持相机、瞬时曝光和商业冲印的日益普及，使摄影这一媒介从一种小众实践转变为外国侨民中的流行消遣。大多数快照都是家庭照片。莫德·卡拉尔（Maude Carrall，1882—1949）是詹姆斯·威尔科克斯·卡拉尔（James Wilcocks Carrall，1849—1902）之女，后者曾任中国海关驻烟台的税务司。1902年春，她在芝罘的一次家庭野餐中，也用她1902年在上海购买的新柯达相机拍下了若干即时照片。一张照片显示，卡拉尔身着漂亮的衣裙、头戴帽子，正用她的柯达相机拍摄“花丛”，并回头面向摄影者（图1.19）。67 私人社交生活、家庭聚会、现代女性的表演以及城市景观：这些照片中的新题材挑战了殖民主义摄影旧有的视觉表征。"}, {"type": "text", "text": "俱乐部起源于17世纪的英国，为新兴资产阶级与贵族之间的交往提供了一个私密而享有特权的场所。半殖民地上海的俱乐部实质上移植了其本国的社会等级结构，并重建出一种以攀比仿效为特征的社会环境。68 到19世纪60年代初，美国一批上层摄影爱好者建立了业余摄影俱乐部，作为讨论艺术标准、传播最新信息的论坛，推动了第一波严肃的业余摄影浪潮。柯达相机的问世提高了业余摄影的普及程度。69 在欧美国家之外，中国的业余摄影者 also developed the camera clubs which continued the conventions of the clubs and societies in their home countries."}, {"type": "text", "text": "摄影俱乐部自19世纪末开始出现在通商口岸。1889年，中国摄影会（中文名：影相會）是中国第一个摄影俱乐部，由一批欧美业余摄影者在上海江西路创建。70 该俱乐部成员包括上海的医生、工程师、商人和使馆工作人员，他们旨在不仅将摄影视为一门科学，也将其视为一种美术门类。71 阿莉西亚·贝威克·利特尔（Alicia Bewicke Little）也是中国摄影会的成员之一。她留下了十张长江三峡的银版照片，展示了“汤姆逊先生那无所不拍的相机”也未能捕捉的壮丽景观。72 19世纪末，上海的摄影爱好者与欧美画意摄影保持同步，试图通过一系列与摄影相关的展览、讲座和讨论，使摄影作为美术获得正当性。俱乐部提供暗房，并作为成员的社会交往平台。1889年6月，他们举办了上海第一次摄影展览，展出了成员作品60件。据《北华捷报》的一篇介绍，展览中展出了许多在上海及其周边拍摄的风景照片。俱乐部中的业余摄影者使用溴化银工艺而非老式的银盐印相，使照片呈现出精致的柔和感与色调。文章还提到：“我们遗憾地看到，没有展出流行的侦测相机照片的实例”，这表明画意摄影与暗房操作在俱乐部业余摄影者中最受欢迎。73 摄影展览定期在共济会堂举行，委员会还会颁发奖项。74 除此之外，俱乐部还邀请一些摄影专家举办讲座。摄影专家W. S. 珀西瓦尔先生（Mr. W. S. Percival）应邀就如何在溴化纸上冲洗照片作了一次演讲。75 俱乐部会员还可使用其会客室和暗房，这对业余摄影者无疑是一大便利。"}, {"type": "text", "text": "摄影俱乐部为了解上海外国侨民的休闲生活提供了一个窗口。他们的休闲时间以上海侨民社区的俱乐部为中心。其中最排他的俱乐部——“上海俱乐部”——吸引了著名的英美大班；与此同时，还有许多小型俱乐部专门从事拳击、帆船运动，甚至板球。这些俱乐部已发展成为一个供他们交流与娱乐的公共空间。76 中国摄影俱乐部一直参与上海的文化活动，直到1895年俱乐部会长离任，其继承者——上海摄影业余社——于1902年在上海成立。77 新成立的社团继续定期为会员举办讲座、会议和73 同上。74 “最新情报”，《北华捷报》，1891年10月28日，411。75 “最新情报”，《北华捷报》，1891年5月6日，407。展览，并与这座城市及动荡的社会形势建立了更紧密的联系。该社团的年度展览展示了会员的作品，呈现了这座城市的一个综合图景，其中一场讲座展示了盟军占领期间紫禁城的立体照片。78"}, {"type": "text", "text": "摄影的力量使在华外国侨民更加投入到变化中的环境之中。查尔斯·尤尔特·达温特（Charles Ewart Darwent，1858—1924）负责协和教堂，并且是该社团的创始成员，他认为上海是业余摄影师拍照的理想之地。充满活力的城市环境提供了丰富的拍摄题材，并激励摄影爱好者捕捉这座迅速现代化城市中的种种变化。他声称：“如果一个人在这里都找不到题材，那他就不配拥有一台五先令的相机。”79"}, {"type": "text", "text": "达温特在其旅行指南《上海：供旅行者与居民使用的租界与华界及其周边主要名胜手册》中拍摄了许多出色的上海城市景观。80 除为旅行者撰写导言性文字外，达温特还收录了海关大楼、香港上海汇丰银行、大礼堂等著名景点的景观。他还介绍说，他工作的协和教堂正是上海摄影业余社的聚会地点。在旅行指南中，他还提到了一些娱乐区域，如跑马总会。他拍摄了许多街头小贩、人力车夫和普通中国人的肖像（图1.20）。他拍摄了一幅以繁忙商业区南京路为背景的街头小贩肖像、一位站在码头上的佛教僧人，以及一群在福州新年节庆聚会上围绕租界与华界的当地妇女（Publisher Shanghai; Hong Kong: Kelly & Walsh, 1904），np. Road。81 与19世纪刻板化的殖民 imagery 不同，他试图在20世纪之交将当地人与正在转型的城市环境结合起来。"}, {"type": "text", "text": "茶商、海关雇员以及一些旅行者构成了福州的业余摄影师群体。1892年，业余摄影师们建立了一个类似于中国摄影俱乐部的摄影俱乐部。82其创始人胡安·门卡里尼（Juan Mencarini，1860—1939）曾于1881年至1912年间在中国海关任职，他在该俱乐部的第一次会议上作了题为“灯笼幻灯片制作”的讲座，介绍了灯笼幻灯片的教育意义以及从底片制作幻灯片的过程。1903年门卡里尼赴上海任职后，便开始参与上海业余摄影学会的活动。1907年，他成为该学会的会长。该学会在接下来的二十年里经历了兴衰起伏。直到1923年，会议都在皇家亚洲学会大厅举行的一次聚会中进行。胡安·门卡里尼再次当选为主席。83"}, {"type": "text", "text": "上海业余摄影学会在20世纪10年代扩大了其会员规模，并跟上了该领域的最新潮流。讲座涵盖手携式相机和电影摄影等主题；第一次世界大战期间，俱乐部放映了“日本掠影”的幻灯片。84胡安·门卡里尼的摄影作品因发掘了作品背后的地方历史知识而受到学会业余摄影师的好评。胡安·门卡里尼的照片曾在1893年福州俱乐部展览上展出。一个月后，这些照片又在日本摄影学会展出。85福州的风景和当地人是门卡里尼摄影作品的主要题材。一些照片似乎模仿了苏格兰摄影师约翰·汤姆逊的风格，后者曾在19世纪60年代和70年代游历福州。在一张三位当地妇女的照片中，两位面向观者，另一位则背对观众站立。他有意设计这些姿势，以充分展示当地妇女的发型和服饰（图1.21）。"}, {"type": "text", "text": "从中国摄影俱乐部到上海业余摄影学会，相机也被用作与当地中国摄影爱好者交流的互动工具。尽管大多数摄影俱乐部专为通商口岸的侨民群体而设，但一些上层中国摄影爱好者仍可参加某些俱乐部的展览和讲座。在首届中国摄影俱乐部展览上，中国业余摄影爱好者陈锦堂——中国著名政治家李鸿章（1823—1901）的亲戚——也展示了他的摄影作品，并在1889年《字林西报》的一篇报道中特别提及。86中国摄影俱乐部成员阿丽西亚·比维克·立德于1903年出版了一部李鸿章传记，其中收录了照片和访谈。87该书的卷首插图是一张阿丽西亚于1896年为李鸿章拍摄的正式肖像（图1.22）。中国精英业余爱好者的参与展示了在混合文化环境中共同在场与互动的动态。上海业余摄影学会一直活跃到20世纪20年代。中国先驱业余摄影师郎静山曾在该学会展出其作品。这些摄影俱乐部还强调摄影作为一种美术媒介，将其工作与商业摄影区分开来。它们所确立的规则和宗旨也影响了20世纪20年代和30年代中国本土摄影社团的发展，这将在下一章讨论。"}, {"type": "text", "text": "作为十九世纪最伟大的技术创新之一，摄影打破了自十八世纪以来通过瓷器、外销画以及面向外国消费的版画等一系列视觉再现所发展起来的关于中国的幻想。相反，它开启了一个再现中国和中国人的新时期。从达盖尔银版法到便携相机，日益发展的技术不仅满足了欧美受众观看和探索东亚世界的欲望与需要，还通过摄影的分类、控制和传播强化了刻板印象。"}, {"type": "text", "text": "然而，柯达的出现使摄影为更广泛的人群所使用，同时也为越来越多的摄影爱好者利用摄影进行自我表达创造了可能。摄影伴随着殖民扩张的全球进程，业余摄影师见证了征服与暴力背后的私人时刻。柯达在混合摄影环境中的使用，标志着中国视觉再现新时代的开端。"}]}, {"id": "ch2", "title": "Chapter 2 · Revisiting the \"Kodak Moment\"", "paras": [{"type": "title", "text": "第2章 · 重访“柯达时刻”"}, {"type": "text", "text": "第二章：重访“柯达时刻”：柯达与中国业余摄影的兴起 引言"}, {"type": "text", "text": "伊士曼柯达公司的口号“你按快门，其余交给我们”吸引了更多业余摄影师去捕捉自发的瞬间。这种对顾客友好的照片冲印业务激发了业余爱好者和专业人士的热情。阿尔弗雷德·斯蒂格利茨评论说，柯达的推出开启了“按码拍照”的时代。88 尽管通商口岸的大多数摄影俱乐部由外籍业余摄影师组成，但到19世纪末，中国摄影爱好者的人数也在不断增加。"}, {"type": "text", "text": "义和团运动二十年后，一些中国业余摄影师开始对欧美摄影师在中国拍摄的影像记录作出积极回应。士绅精英是最早的地方摄影爱好者和业余摄影师。89 通过摄影知识的传播，摄影这一原本深奥的实践逐渐成为知识分子、精英和富商中的一种新的休闲活动和爱好。1911年革命后，中国乡村士绅社会解体，士绅群体迁往城市，形成城市精英。90 新知识分子和新兴资产阶级群体，即新的城市中产阶级，是最早的业余摄影群体。在20世纪20年代和30年代，若干中国摄影学会和摄影俱乐部涌现出来，并发展成为中国人业余摄影师学习、欣赏和社交的场所，它们与19世纪末20世纪初上海欧美业余摄影师的摄影俱乐部有一些相似之处。2.1 “新相机”的到来"}, {"type": "text", "text": "1889年3月10日，《申报》刊登了一则中文广告，推销“新式照相镜”（图2.1）。图中显示，一位身穿西式服装的女子手持一架新式照相机。“近来发明了一种极为简便的照相方法，即使初学者也能轻易学会。此照相机可以手持拍摄，能够清晰地拍摄路旁的树木、农田、风景和住宅区……如果您想购买并了解使用方法，请前往英国伦敦牛津街88号，或上海大英药房。”91图中的照相机很可能是1888年纽约罗切斯特生产的柯达原始盒式照相机。尽管伊士曼柯达公司是美国照相材料制造商，但其1885年成立于伦敦的英国分公司控制了新兴的当地照相市场，因为在第一次世界大战（1914—1918）之前，英国是主导中国的外国列强。92《申报》上的这则照相机广告甚至没有显示“柯达”的名称；相反，它以一位西方女子手持照相机的插图表明这是一款“新式照相机”。自19世纪中后期以来，整个社会逐渐崇西尚新。93宣传和强调“新”成为推销产品的一种营销策略。潜在和目标客户主要由照相馆摄影师和上层摄影爱好者构成，他们一直在寻找新事物和“西方”事物带给他们的兴奋感。"}, {"type": "text", "text": "摄影并非中国人固有的发明。在很长一段时间里，它是西方和外来文化的象征。中国人从何时起拥有了这种“文化使命”，并渴望再现迅速变化的时间和空间、表达自我？杰弗里·巴钦认为，“摄影的欲望”本质上是一种停住时间、凝固其稍纵即逝本质的需求；渴望把握时间和空间的感情已经转变为一种集体使命，即迅速而大规模地再现这种转瞬即逝的本质。94"}, {"type": "text", "text": "19世纪最后几十年，西方各学科知识涌入中国。一本19世纪的光学入门书名为《格术补》，作者是邹伯奇（1819—1869）——一位中国知识分子、广东士绅成员，该书在17世纪来华耶稣会士翻译编纂的光学著作基础上解释了光学和透镜的基本知识。95古代中国的传统墨家光学未能演变为几何光学，而几何光学促成了17世纪欧洲暗箱概念的形成。96邹伯奇的书《格术补》，字面意思是古代中国光学的补编，实际上挑战了墨家光学并解释了基本几何光学。他对摄影的实验和科学兴趣表明，中国受教育阶层已经意识到新技术，中国需要努力实现现代化。97一系列摄影手册不仅解释了基本光学知识和照相机原理，还为摄影爱好者提供了观察自然世界的新视角。"}, {"type": "text", "text": "自强运动（Ziqiang yundong 自強運動）发起于19世纪60年代初，得到左宗棠（1812—1885）、李鸿章和恭亲王奕䜣（1833—1898）的支持，试图采用西方的技术和军事革新。19世纪知识分子冯桂芬（1809—1874）提出了“中学为体，西学为用”（Zhongxue wei ti, Xixue wei yong 中學為體，西學為用）的概念，这一概念被中国知识分子和上层官员广泛接受。98 上层精英和95 邹伯奇并非第一个在中国传播几何光学的人。17世纪在中国的耶稣会士通过与当地科学机构的合作，向中国受众传播了天文学、数学和物理学知识。德国耶稣会神父兼天文学家汤若望（Johann Adam Schall von Bell，1592—1666）和中国科学家李祖白（?—1665）在钦天监（Qintianjian 欽天監）编译了《远镜说》（Yuanjing shuo 遠鏡說）一书，翻译了伽利略·伽利莱（Galileo Galilei，1564—1642）的文章。汤若望（Adam Schall von Bell），《远镜说》（Yuanjing shuo 遠鏡說，Speaking of the telescope），1626年，嘉庆年间（1796—1820）艺海珠尘版重印本（北京：北京爱如生数字化技术研究中心，2001—15），5b—6b，11a，b。96 Helmut Gernsheim，《摄影史：从11世纪暗箱的最早使用到1914年》（History of Photography from the Earliest Use of the Camera Obscura in the Eleventh Century up to 1914），伦敦、纽约：牛津大学出版社，1955年。97 1839年10月19日，摄影术发明的消息传到中国——距达盖尔摄影法发明公之于众仅两个月。虽然邹伯奇几乎不懂英文，但他仍有机会得知这一消息。Oliver Moore，《19世纪中国的邹伯奇论视觉与摄影》，载《现代中国的人物传统》（The Human Tradition in Modern China），Kenneth James Hammond、Kristin Eileen Stapleton编（拉纳姆：Rowman & Littlefield，2008年），33—54页。另见Jennifer Purtle，《双重审视：后全球视角下的中国光学及其媒介》，《东方艺术》（Ars Orientalis）第48卷，第20191029期（2018年8月）。98 冯桂芬，《采学西议》（Caixue xiyi 採學西議）[论采用西学]（沈阳：辽宁人民出版社，1994年），77、84页。知识分子将摄影视为现代性的象征，一种可以用来传播西方知识、推动中国改革的媒介。99 1872年，英国业余摄影师托马斯·查尔德（Thomas Child）在给妻子的信中提到了中国业余摄影师张浩（Chang How）。100 查尔德很可能以教授官员和富商摄影作为一种社交方式。在其他信中，他谈到了另一位业余摄影师杨芳（Yang Fang），一位官员兼当铺老板。查尔德雇他在杨的住所安装煤气照明和修理水泵。101 查尔德的朋友、著名摄影师约翰·汤姆逊（John Thomson）回忆说，他、德贞医生（Dr. Dudgeon）和杨芳曾到圆明园遗址郊游，他还记载杨芳对化学和摄影充满热情，甚至有一间实验室，“墙上装饰着杨芳家人和朋友们的放大照片”。102 汤姆逊的一张照片提供了了解中国上层阶级如何接纳摄影的一瞥（图2.2）。"}, {"type": "text", "text": "中国精英和知识分子已开始将摄影作为西方先进技术的一部分和现代性的象征来接纳。在柯达诞生之前，笨重的摄影设备和复杂的拍摄及冲洗流程使摄影为特定职业群体和上流社会所专享。尽管摄影是一种复杂的技术实践，但19世纪中后期的精英成员开始将摄影视为一种消遣方式。自19世纪70年代以来，一些外国公司、照相馆和通商口岸的供应商成为在中国销售照相设备的主要代理商。其中一些甚至为客户开设私人课程，作为推广其照相设备的商业策略。他们的目标客户并不限于中国人。例如，上海外国公司会地理洋行（Way de le 會地理洋行）1873年发表在《申报》上的一则广告表明，如果中国顾客想学摄影，经理会亲自教授。103 自19世纪60年代以来，拍照比画肖像更有利可图，因此通商口岸开设了许多照相馆，新摄影师成为外国照相器材供应商的目标客户。然而，会地理洋行1883年的一则广告表明，不仅照相馆摄影师想学摄影，一些“绅商”也想拍照自娱："}, {"type": "text", "text": "我们现在已开设摄影班，教授拍摄"}, {"type": "text", "text": "肖像、冲洗照片，以及使用化学材料。（我们班"}, {"type": "text", "text": "向那些想开设照相馆以获取"}, {"type": "text", "text": "利益的人开放），以及一些想要就读的绅士和商人（紳商）"}, {"type": "text", "text": "供自娱自乐者（自愉悅者）拍照；这两种人都可以"}, {"type": "text", "text": "在这里学习。"}, {"type": "text", "text": "第四大道，韦德勒街104号"}, {"type": "text", "text": "摄影课程不仅由外国公司开设，也由本地照相馆提供。以摄影自娱已成为中国“士绅与商人”的一种新式休闲活动。“士绅与商人”作为一个精英阶层，自第一次鸦片战争以来便从殖民主义介入所带来的经济变化中获益。105 在通商口岸充满活力的摄影环境中，构成中国早期业余摄影师大多数的本地知识分子、精英和富商，通过自学或从照相馆习得必要的摄影技能，并与外国摄影师建立了密切关系。"}, {"type": "text", "text": "柯达的引入使摄影从一种特权实践转变为一种休闲活动。1889年3月，距柯达相机发明还不到一年。上海的英文报纸和本地中文报纸《申报》都刊登了柯达的广告。《申报》在为不断扩大的读者群传播新式知识方面发挥了重要作用。106 1911年中华民国取代清朝后，对新事物的追求具有了更大的社会意义。在五四运动期间，对新事物的狂热崇拜和对旧事物的鄙弃盛行一时。正如李欧梵所论，五四运动中的知识分子倾向于凸显新的历史意识，并宣称中国已进入世界历史的“新纪元”，这表明中国不再与文明世界相隔绝。“新”的观念与价值是在一种线性时间和线性历史感的语境中被界定的，这种语境具有非传统和西方的特征；这意味着，在这一语境中，新与“西方”被等同于“现代性”。107"}, {"type": "text", "text": "“新”成为西方式现代性的替代品。108 对新式技术装置的热情可以被视为接近现代世界并与旧事物和传统决裂的尝试。美国摄影师约翰·赞布伦（John Zumbrun，1875—1949）在20世纪20年代初拍摄的一张照片，捕捉到了末代皇帝溥仪（爱新觉罗·溥仪，1906—1967）在紫禁城中把玩“新相机”的瞬间（图2.3）。在照片中央，溥仪站在宫殿门口，身旁一名太监拿着两种不同型号的柯达相机：一台折叠式老式相机和一台盒式相机。他似乎刚刚意识到约翰·赞布伦正在拍摄他。英国教师庄士敦（Reginald Johnston，1874—1938）正在与皇室成员讨论相机的使用。这张照片拍摄于不早于1922年的时候，当时溥仪在庄士敦的建议下剪掉了辫子。溥仪的大多数私人照片都是在剪掉辫子之后拍摄的，这成为他人生中的一个重要转折点，他开始有意识地把自己认同为一个现代人，并拥抱西方文化。109"}, {"type": "text", "text": "自1912年起，作为退位皇帝的溥仪一直住在紫禁城北半部和颐和园，直到1924年被冯玉祥（1882—1948）驱逐出宫。在自传中，他回忆了1911年至1924年间在紫禁城的生活。他满怀忧郁与悔恨地写道：“当中国被称为共和国、人类已经进入二十世纪时，我仍然过着皇帝的生活，呼吸着十九世纪的尘埃。”110紫禁城中的生活给他带来了极大的矛盾与困惑。溥仪体现了二十世纪之交帝制时代与新生共和国之间的断裂，他借助摄影这一媒介来表达那种荒诞感与挣扎。"}, {"type": "text", "text": "溥仪对摄影的兴趣，可能源于1916年6月袁世凯（1850—1916）去世后他开始关注政治新闻时，新闻照片带给他的视觉冲击。111二十世纪初中国的政治动荡增加了公众对历史事件真实视觉呈现的需求，而摄影的视觉准确性这一观念，则通过报纸和画报上的一系列肖像和新闻图像得到体现。112溥仪在紫禁城中的青年时代订阅了二十多种报纸和杂志。113以图像为导向的报纸和杂志给溥仪带来了一种新的阅读体验。第一次世界大战（1914—1918）后，各类报纸争相以图片形式报道世界局势。溥仪订阅的《东方杂志》具有高度图像敏感、视觉冲击强烈的风格。1920年的一则新闻报道称，德国皇帝威廉二世被流放到荷兰，住在一座庄园里，这则新闻完全以图画形式叙述。两张展示威廉二世闲居生活的照片占据了整整一页。114读者被邀请在视觉图像的基础上参与叙事。威廉的流亡经历可能与溥仪产生共鸣，因为溥仪于1911年被迫退位。这些照片唤起了他丧失权力的痛苦以及重新夺回权力的渴望。"}, {"type": "text", "text": "溥仪是众多摄影爱好者之一，他们受益于二十世纪初摄影环境的繁荣。1919年第一次见到溥仪后，庄士敦曾向英国当局写了一份备忘录，描述溥仪强烈的求知欲。在老师庄士敦的引导下，他培养了许多新的爱好，如打高尔夫球、骑自行车和摄影。他很可能是从北京与贵族关系密切的照相馆摄影师那里学会摄影的。日本摄影师山本赞七郎在义和团运动后于北京开设了一家照相馆；美国摄影师约翰·赞姆布伦在使馆区开设了名为“Camera Craft”的照相馆，他们经常被邀请为皇室拍照。"}, {"type": "text", "text": "在满清朝廷、北京政府与各外国势力之间政治斗争的漩涡中，溥仪通过追求新文化，表达了他强烈的摆脱传统的愿望。瑞典艺术史家喜龙仁（Osvald Sirén，1879—1966）精研中国的城门与城墙。1922年他在紫禁城拜访溥仪时，着重谈到溥仪对摄影的巨大热情与好奇。溥仪起初对喜龙仁表现出不信任和羞怯，但一发现喜龙仁的相机，便立刻改变了态度。他甚至拿出自己损坏的柯达相机，询问能否修好。在喜龙仁1923年发表于《纽约时报》的文章中，溥仪对新文化与新知识的渴望被生动地记录下来，这引起了公众对这位被囚禁在紫禁城中的年轻皇帝的同情。115"}, {"type": "text", "text": "义和团运动二十年后，一张溥仪站在紫禁城屋顶上的照片，似乎是对中国长达六十年的殖民摄影的一种有力回应（图2.4）。这张照片很可能摄于1924年——也就是他被逐出紫禁城的那一年。照片中，他身穿长袍马褂——民国时期的便服——并戴着一副墨镜，摆出一副现代绅士的姿态。背景中的景山，曾是许多欧美和日本摄影师拍摄皇宫全景的地方，此时成为外国列强无所不在且具控制性的凝视之寓喻。尽管溥仪神态从容，他却被困在高耸的宫墙之内，面对着外国势力与清朝旧遗存之间的两难困境。116"}, {"type": "text", "text": "从这个角度看，末代皇帝在宫中的摄影实践可以被理解为对新自我的一种显明表演。作为观看主体而非被观看的客体，溥仪会通过各种视觉装置看见一个新的自我。117《二我图》这一图像，很可能是对溥仪双重身份的一种隐喻：一个被囚禁的皇帝，和一个拥抱西方文化的现代个体。他表情僵硬，坐在紫禁城一架屏风背景前的一把精致椅子上。这张照片呈现出一种在两种略有不同的姿态中的反身自画像（图2.5）。鲁迅（1881—1936）曾认为，新颖的曝光技术在中国流行，是因为它使人们能通过扮演两种身份而获得快感。118溥仪希望操控并重新框定他的自我呈现，而通过相机，他可以像他的老师庄士敦那样扮演一个现代人。天津张园也拍摄过一幅类似的反身自画像；1924年至1929年，他正住在那裡。照片中，溥仪手持地球仪与万花筒，脸上带着滑稽的表情，而隐藏在这张照片中的另一幅肖像则显示溥仪身着全套西装，看上去十足是一位文雅的现代绅士（图2.6）。这两张照片都包含再现自我的双重层次。119他热情地拥抱现代文化，但却是以一种被动的方式。他对现代性的探索必定受到庄士敦的指导；那身西装表明了一种他终其一生都无法摆脱的控制性凝视。120"}, {"type": "text", "text": "溥仪的照片和底片随他从紫禁城被带到天津。直到1931年他前往满洲之前，他的大部分照片都保存在天津。从紫禁城、天津到满洲，溥仪的私人影像揭示了一个超出公众视野的个人世界。19世纪末和20世纪初，私人摄影记录大量涌现，使摄影史的书写更加丰富多样。柯达等小型相机的普及，使摄影不再那么像一种仪式，而更像一种“反映”；照片不仅是历史的证据，也是日常生活的纪念品。121 易于使用的柯达便携式相机的出现，也改变了业余摄影师捕捉日常事件的能力。柯达进入紫禁城后的两年内，溥仪、皇后婉容（1906—1946）、妃文繡（1909—1953）以及溥仪的兄弟姐妹，都在紫禁城留下了许多读书、吸烟、浇花、骑自行车和练中国拳术的快照。便携而小巧的柯达相机使即时户外拍摄成为可能。御花园和养心殿的庭院成了摄影爱好者的游乐场。在这些快照中，婉容沿宫墙骑自行车的照片引起了极大关注。尽管 121 John Peter Berger, “Use of Photography,” in Understanding a Photograph, 100–118. (London: Penguin Books,2013). 业余水准，这张照片显示出用便携式相机捕捉运动中拍摄对象的努力，体现了紫禁城中流动性与静止性之间的张力（图2.7）。"}, {"type": "text", "text": "柯达相机呈现了新颖而令人兴奋的视觉体验，促使中国人将民族和个人视为独立的视觉主体。19世纪末和20世纪初的摄影爱好者自觉地发现并肯定了自己的主体性，并建立了自己与现代世界的联系。柯达的便携性和简易性促进了户外摄影，使现代中国摄影爱好者能够观看世界并表达自我。手持相机在拍摄过程中提供了一种不断变化的个人视角，这种流动的视角与20世纪初正在兴起的现代景观相契合。2.2 在知识分子与业余者之间：中国业余摄影师的兴起"}, {"type": "text", "text": "1905年科举制的废除和新式学堂的开设改变了社会流动的途径。士、农、工、商四民社会经历了解体。引领四民社会的士绅阶层消失了，一个新的“知识分子”（zhishifenzi 知識份子）群体出现了。122 19世纪末和20世纪初，地方士商群体逐渐向城市转移，发展成为一批城市精英。他们中的一些人在新式学堂下成为新知识分子，拥有多种职业和身份，大多活跃于学术界、出版界和艺术界；另一些人则涌入其他新领域，成为商人、买办、军人、律师、医生等。123 与士绅相比，现代知识分子在政治生活中仍处于边缘地位。124 但他们试图寻求一种新的方式融入现代世界。125"}, {"type": "text", "text": "随着20世纪20年代和30年代出版文化的繁荣，现代知识分子以多种形式参与了公共话语的建构。作家、出版商和媒体从业者利用大众传媒新兴的力量来建构自己的新身份。摄影作为一种重要的媒介，提供了多种参与社会现实并与之互动的方式。再现现实的能力将摄影与现代世界的动态联系在一起。从石版印刷到照相铜锌版（中文名：照相桐梓版），自19世纪中叶以来，欧美印刷技术已传入上海，促进了上海印刷业的文化繁荣。126 20世纪00年代和10年代的《时事画报》（Shishi huabao 時事畫報）和《真相画报》（Zhenxiang huabao 真相畫報）提供了黄花岗起义（huanghuagang qiyi 黃花崗起義）和1911年革命的即时新闻照片。1913年，《大公报》揭露了国民党创始人宋教仁（Song Jiaoren 宋教仁，1882—1913）被暗杀的真相，通过一系列照片确认了凶手。127 尽管直到20世纪末大多数中国人才买得起照相机，但在20世纪初，摄影提供了通往真相或真相再现的直接途径。"}, {"type": "text", "text": "在20世纪20年代和30年代，摄影是民主和平等的，在知识分子与公众之间起中介作用。摄影的巨大生命力取决于现代知识分子为将照片带给公众而建立新场所的巨大努力。摄影是知识分子建构其公共社会生活的媒介，也是他们自身文化生活中不可分割的一部分。除知识分子外，城市资产阶级是业余摄影师的另一重要组成部分。两次世界大战之间是中国本土资本主义的黄金时代，一批与旧政权保持距离的新兴企业家资产阶级在发展的经济环境中蓬勃兴起。除新兴的企业家群体外，在金融机构、商店和工厂工作的雇员数量也大幅增长。然而，在本土资本主义发展中兴起的城市资产阶级仍然处于边缘地位：并非遍及全中国，而是集中在上海、天津等几个代表性城市。上海已成为新兴商业资产阶级的首都。128"}, {"type": "text", "text": "中国主要城市的现代知识分子和城市资产阶级拥抱摄影意识的新时代，渴望一种新媒介来表达他们的现代经验。他们拥有一定的经济基础和闲暇时间，负担得起自己的摄影设备，定期购买摄影杂志和年鉴，参观摄影展览，热衷于摄影比赛，其中一些人还组建了组织松散的社会团体和俱乐部，技艺娴熟的业余摄影师在那里展示作品、担任摄影比赛评委，并为新手提供技术和美学指导。20世纪20年代和30年代，业余摄影师的数量急剧增加，尤其是城市中的摄影爱好者。银行家、医生、工程师、教师、记者、作家和律师是新兴摄影市场的主要潜在客户。129 在华花旗银行俱乐部的成员定期举办摄影展览，作为一项社交娱乐活动。130"}, {"type": "text", "text": "柯达和廉价胶卷的发明提高了材料的可负担性，也促成了业余摄影师人数的迅速增长，这一现象大约三十年前发生在美国和欧洲。业余摄影师成为一个更加多元的群体。在1910年代和1920年代，欧洲和美洲，那些把摄影视为严肃艺术的严肃业余摄影师与普通爱好型摄影师或新的“快照朋友”已经分化。131 与欧美摄影市场显著的分化形成对比的是，中国摄影师——无论是业余爱好者还是进阶摄影师——几乎同时出现并发展起来。柯达的发明引发了欧美许多艺术摄影师的恐惧和焦虑；然而，许多中国摄影师却以一台便携且易于操作的柯达开始了自己的职业生涯。郎静山是中国最伟大的艺术摄影师之一，1906年他在中学时跟随绘画老师学习摄影，得到了自己的第一台相机，一台柯达；吴印咸（1900—1994）1920年在上海美术专科学校（上海美专）学习时买了一台柯达布朗尼，金石生则在1923年十三岁时收到自己的第一台柯达相机并自学摄影。与商业摄影和大众摄影相对，这些本土摄影爱好者自称业余摄影师。"}, {"type": "text", "text": "“业余”（爱美者）最早与“戏剧”连用，用来描述一种新的现代中国戏剧类型，即“爱美剧”，由戏剧理论家陈大悲（1887—1944）在其1921年的著作中提出，主张一种突出剧本和戏剧文学性、与商业戏剧相对的业余戏剧。132 业余摄影师与以拍照谋生的商业摄影师相对立。1920年代初的摄影师兼批评家刘半农在1927年《北平光社年鉴》的序言中首次谈到“业余”摄影的定义，他认为业余摄影师必须对摄影有极大兴趣，因为他们拍照是出于兴趣，而不是为了谋生。133"}, {"type": "text", "text": "与那些把摄影视为创造性艺术的严肃业余摄影师相比，越来越多的爱好型摄影师用相机表现日常生活，并参加展览和摄影社团，这促成了1920年代和1930年代持续不衰的摄影热情。1936年，陈传霖为英国杂志《年度摄影作品》撰写了一篇英文文章，该杂志是国际摄影作品的年度记录。他描述了中国业余摄影的出现和发展："}, {"type": "text", "text": "尽管这个国家正经历的，与世界各地一样，"}, {"type": "text", "text": "目前正普遍经历经济萧条，并且尽管存在"}, {"type": "text", "text": "政治动荡，业余摄影正变得越来越流行于"}, {"type": "text", "text": "社会各阶层，而且对其事务的兴趣异常浓厚。在"}, {"type": "text", "text": "上海，摄影爱好者得以取得相当"}, {"type": "text", "text": "进展，其证据是举办了十多次公开展览"}, {"type": "text", "text": "在1934年8月至1935年7月之间。令人欣慰的是，所有"}, {"type": "text", "text": "这些沙龙都取得了圆满成功。……各大城市中都有摄影俱乐部，"}, {"type": "text", "text": "如上海、北平、南京等大多数大城市中都有摄影俱乐部，"}, {"type": "text", "text": "天津、广州等地，而更多协会和摄影"}, {"type": "text", "text": "俱乐部在较小城市中的建立是必要的。……为了经济上的考虑"}, {"type": "text", "text": "并且为了方便起见，微型相机已经进入"}, {"type": "text", "text": "最为流行且最受青睐的是那种廉价而便携的"}, {"type": "text", "text": "2 1/4英寸 × 3 1/4英寸规格，可拍八张或十六张。对于那些"}, {"type": "text", "text": "买得起更昂贵相机的人来说，徕卡型相机"}, {"type": "text", "text": "当然处于最前列。除了新闻记者外，人们很少"}, {"type": "text", "text": "如今看到摄影爱好者随身携带哪怕是四分之一尺寸的"}, {"type": "text", "text": "器材。134"}, {"type": "text", "text": "陈氏发表于《摄影年鉴》（Photograms of the Year）的文章，旨在为欧美国家的读者勾勒中国摄影史。他并未介绍某些具体的艺术摄影师或杰作，而是描述了业余摄影师、摄影展览、相机俱乐部的日益增多，以及上海不断扩大的“小型相机”市场。20世纪30年代，一些严肃的业余摄影师，如陈传霖，已经意识到繁荣的摄影市场对文化生活的重要意义。"}, {"type": "text", "text": "中国摄影市场大约在1920年前后开始繁荣。认识到中国业余摄影师数量不断增加，伊士曼柯达公司于1920年在上海开设了第一家分店。135 曾在南非长期担任类似职务的C. E. 巴勒姆出任中国区经理。136 第一家批发店设在江西路，一家零售店在南京路开业，后于1928年迁至圆明园路。四年后，另一家分店在天津开业。137 在邮政服务的支持下，柯达产品可通达中国内地各地。1926年《申报》刊登的一则广告写道：“您想自己拍照吗？如果您住在中国内地而找不到商店，只需前往当地邮局写信给我们，就可以购买柯达相机。（图2.8）。”138 除柯达外，其他相机品牌也纷纷涌入中国市场。来自英国的依尔福，来自德国的爱克发、徕卡、蔡司、禄来和康泰时，以及来自日本的富士胶片都在上海开设了分店。139"}, {"type": "text", "text": "20世纪20年代和30年代，当柯达、康泰时、禄来等相机品牌在中国市场扩展业务，同时许多摄影学会、俱乐部和展览发展起来时，中国的业余摄影师群体也变得多样化。在不断扩大的摄影市场兴起过程中，不仅柯达相机，来自英国的依尔福，来自德国的爱克发、徕卡、蔡司、禄来和康泰时，以及来自日本的富士胶片，都在民国时期的中国开设了分店。140 康泰时公司甚至在上海和天津赞助摄影展览，以提高品牌知名度。141 大量业余摄影爱好者是大规模摄影市场的主要贡献者，并且具有增长潜力。142"}, {"type": "text", "text": "长期以来，学界一直关注艺术摄影，而艺术摄影以若干专注的业余摄影师为标志。在我的研究中，业余摄影不仅指严肃业余摄影师的艺术实践，也指普通爱好者在现代文化生活中对日常活动的捕捉。“既通俗又精英”，这是劳伦斯·W. 莱文对十九世纪美国莎士比亚的艺术机构与演出所作的描述，这些机构与演出吸引了取向各异的异质观众。”143 这一说法也完全适用于描述民国时期的业余摄影。"}, {"type": "text", "text": "20世纪20年代和30年代，业余摄影师的人数急剧增加，尤其是城市中的摄影爱好者人数。对摄影社团、展览和杂志的考察表明，严肃业余摄影师和摄影爱好者都积极参与摄影活动。1925年，林泽苍在上海创办了中国摄影学会，声称拥有会员一千余人，既包括普通爱好者，也包括严肃的艺术摄影师；144成千上万的业余爱好者参加了北京光社和上海华社举办的公开摄影展览。人们对这些展览的巨大热情反映了民国时期蓬勃发展的市场。"}, {"type": "text", "text": "柯达相机市场成功的关键因素是价格可负担、易于获得和操作简便。从1920年开始，柯达公司在中国推行了一系列营销策略以吸引更多顾客，并大力设法将相机嵌入城市居民的生活。20世纪20年代，一款柯达布朗尼——一种价廉而简易的相机——价格在3.4元到29元之间，其他各种型号则在11元到210元之间。145 1926年《申报》的一则广告展示了一款带有镜头和胶卷的袖珍柯达，售价30元，大城市中的新中产阶级——月薪100元到200元的医生、工程师、教师、记者、作家和律师——稍作筹划便可轻松负担。布朗尼在20世纪30年代得到密集推广。售价12元，几乎是袖珍柯达价格的一半，对城市居民来说相当可负担。146 而鹰眼，作为柯达系列中最便宜的型号之一，售价9元，并附赠大量配套产品。147"}, {"type": "text", "text": "除了价格可负担之外，柯达公司还推广其顾客友好型服务，强调相机的简便性，以吸引更多业余摄影师。1926年的一则中文广告写道：“摄影方法极为简单；即使初次使用，也能知晓其规则。将胶卷装入相机，拉出相机，按下按钮，一切就绪……胶卷可送至本公司冲洗……”148广告中这三个简单、易于说明的步骤与英文广告中的三个步骤相同，实质上就是“你按按钮，我们来做其余的事”这一口号的中文版。当时，上海的旅游业正在蓬勃发展。当观光渡轮靠岸时，游客会立刻找到冲洗胶卷的服务，然后装上新胶卷去观光。他们的照片会在他们回到渡轮之前就冲洗好。"}, {"type": "text", "text": "柯达的“你按按钮，我们来做其余的事”这一口号同样适用于中国市场。1921年，柯达公司在上海创办了一所学校，以培训门店技术人员和上海的摄影爱好者：“三周毕业，免费。149”他们须学习如何放大、冲洗和装裱照片。柯达门店和摄影用品供应商中的这些本地专业技术人员，保证了中国顾客友好型服务的质量和效率。《柯达杂志》是由位于纽约州罗切斯特的伊士曼柯达公司为业余爱好者出版的期刊，它刊登了一篇特别介绍柯达上海分公司的文章，并附有一张上海柯达学校的照片。150这张照片描绘了由柯达派来的托马斯·克雷林（Thomas Crellin）正在教他的中国学生（图2.9）。这张照片中全是男学生，也暗示了一种有趣的性别区分。男性摄影师往往被视为专业摄影师，而女性摄影师——基本上以“柯达女郎”的形象出现——则被视为业余爱好者。"}, {"type": "text", "text": "与此同时，柯达摄影协会已经成立，以吸引更多潜在消费者。1929年，该公司上海分公司发布了一则标题颇具吸引力的广告：“只需4.5元，人人都能自己拍照（图2.10）。”如果顾客支付4.5元会员费，就能免费获得一台柯达鹰眼相机和若干120胶卷。1511930年，柯达公司推广《中国柯达》（Keda zazhi 柯達雜誌），该刊于1930年创刊，1937年停刊，为中国业余摄影师提供了一瞥国际流行摄影文化的机会，激发了他们的摄影兴趣，并培养了他们对柯达产品的依赖。"}, {"type": "text", "text": "受大众摄影文化的影响，摄影比赛成为吸引更多顾客的一种有效方式。1929年，伊士曼柯达公司举办了一场全国性的摄影比赛，后来发展为一项国际性比赛。这项国际比赛在中国传播开来，激发了中国业余摄影爱好者的热情。这是中国业余摄影爱好者首次参加国际摄影比赛。参赛者须按指定主题提交照片，如“雪”“暑假”“儿童”等，这鼓励了业余爱好者记录家庭生活和休闲活动。获奖照片将刊登在《中华柯达》上，该刊在业余摄影照片的流通中发挥了关键作用。"}, {"type": "text", "text": "柯达出版物通过其教学文章为自学摄影者提供了全面的知识。《柯达画报》（Keda huabao 柯達畫報）和《中华柯达》发表了许多由较为老练的摄影者撰写或译自外国摄影杂志的实用指南文章。从摄影器材的选择到照片的冲印，这些指南文章为初学者和行家都提供了循序渐进的指导。对于初学者，教学文章的作者提出三条简单原则：准确用光、适度曝光和恰当构图；相应地，他们也为老练的业余爱好者介绍了非常详细的照片冲洗方法。此外，一些关于拍摄动态照片、风景照片和肖像照片的提示对所有读者都很实用。"}, {"type": "text", "text": "《中华柯达》的一个特别栏目“照片分析”（Zhaopian fenxi 照片分析）为业余摄影者提供了非常实用的建议。从题材选择到构图，作者会对所选照片进行具体分析。例如，1936年《中华柯达》的“照片分析”选取了余则民（Yu Zemin 余則民）的照片作为例子。评论者为这张照片绘制了一幅草图，向读者标示照片中的构图和主体（图2.11）。“天空和湖面过于空泛，”其中一则说明写道。评论者还指出了构图中的不足之处，供读者参考。152 “趣味点”（Quwei dian 趣味點）是这些技术性文章中经常提到的一个概念，与罗兰·巴特理论中的“刺点”（punctum）有相似之处，后者指的是吸引你注意某一图像的某个细节。153 趣味点的凸显使照片更加生动、更具动感，标志着与模糊画意主义的决裂。这些技术性文章还强调光影的运用。"}, {"type": "text", "text": "这些技术说明鼓励高阶业余爱好者深度参与摄影活动，更不用说这些技术指南还推动了大量摄影产品的消费。例如，一则题为“柯达摄影宝库”（Keda sheying baoku 柯達攝影寶庫）的广告推广了一整套摄影产品，包括相机、胶卷、显影液、暗房安全灯、相纸、显影罐和定影液（图2.12）。154 这种打包销售模式显然面向专注的业余摄影师。在操作简便的表象背后，这些技术文章实质上引导业余爱好者走上了一条自学与探索之路。"}, {"type": "text", "text": "柯达进入中国的故事，与本土业余爱好者记录现代生活、塑造自我身份的需求交织在一起。20世纪20年代和30年代，柯达公司创造了多种方式来吸引顾客，并依照现代生活培养业余爱好者的审美趣味。旅行、度假和家庭生活作为柯达出版物中的主要题材，构成了民国时期新兴中产阶级所热衷的业余摄影消遣。艺术作品、旅行快照、家庭摄影以及对日常生活瞬间的捕捉，使这些业余爱好者得以与他们所处的环境、他们的家庭以及一个新的国家建立起一种精确的关联。"}, {"type": "text", "text": "在民国时期，大多数摄影团体为业余摄影师的摄影活动提供了场所。20世纪20年代和30年代的本土摄影团体，与19世纪末20世纪初上海的欧美业余摄影师相机俱乐部有一些相似之处，主要为中国业余摄影师提供了一个学习、鉴赏和社交的场所。对这些摄影团体——既包括艺术团体，也包括兴趣俱乐部——的考察，将有助于一窥20世纪20年代和30年代的摄影文化以及正在兴起的现代艺术世界。"}, {"type": "text", "text": "摄影团体的发展可以说是普及摄影最有效的机制，它塑造了中国业余摄影的发展。20世纪20年代，摄影团体大量涌现。广州的景社、北京的 Light Society、天津的北洋摄影会、南京的美社以及上海的华社，作为民国早期现代艺术界形成过程中的产物而出现。一代业余摄影师努力建立现代组织结构并定期举办展览，为倡导艺术摄影、扩大公众对摄影的兴趣作出了显著贡献。与此同时，随着20世纪20年代和30年代大学中“美育”的兴起，学生摄影俱乐部也纷纷出现。中国业余摄影的这种兴起，以及1900年代至1930年代由俱乐部、展览和出版物发展出的新的摄影词汇，极大地促成了中国视觉现代性中那些独特而特别的方面及其最终的发展。"}, {"type": "text", "text": "与随意拍照者和普通业余爱好者不同，一批业余摄影师将摄影视为严肃艺术，试图推动艺术摄影的合法化与普及，并创建制度性结构，以扩大公众对现代艺术以及现代艺术家影响的理解。在操作层面，他们不仅在摄影出版物中撰写技术指导性文章，还写了一系列关于摄影美学的理论著作，从而在普通业余爱好者与投入的业余摄影师之间建立起一条正当的界限。"}, {"type": "text", "text": "20世纪20年代的摄影团体，如广州的景社、北京的 Light Society、上海的华社和南京的美社，仍然坚持限制会员人数。即使是上海会员人数最多的黑白摄影社，也只有74名会员。155 这些摄影团体吸引了从北京到广州的本地业余摄影师。它们的组织较为松散，没有严格规则，也没有定期会议。基本上，它们的年度展览和各种画报是业余摄影师展示和欣赏作品的唯一平台。"}, {"type": "text", "text": "刘半农在其长篇文言文《谈影》中提到，他摄影是为自娱，而非牟利。尽管他的表述带有中国文人惯用的自谦口吻，刘半农却将摄影视为严肃的纯艺术，强调摄影者的目的在于“造美”（zaomei 造美），而非复现。156 A 刘半农对摄影的态度，与苏轼（蘇軾，1037—1101）等中国文人画家的“业余”精神相呼应。文人画家有时自称业余，强调作画是为了自我表达。157"}, {"type": "text", "text": "从欧阳慧蹡（歐陽慧蹡）的《摄影指南》（Sheying zhinan，攝影指南）到刘半农的文章，摄影批评家挪用了传统画论中的术语与方法，如“写意”（xieyi 寫意）、“写真”（xiezhen 寫真）和“意境”（yijing 意境），来阐释艺术摄影，竭力使摄影作为一门纯艺术获得正当性。陈万里（陳萬里，1892—1969）出版了中国第一本艺术摄影集《大风集》（Dafeng ji 大風集），该摄影集挪用并采纳了文人山水画的题材，运用柔焦与暗房技巧营造出一种审美氛围，以抵消机械效果。"}, {"type": "text", "text": "许多早期摄影团体都以集体户外拍摄活动起步。便携、小巧且方便的手持相机为户外拍摄提供了诸多便利。精武体育摄学部（Jingwu tiyu shexuebu 精武體育攝學部）的创办人陈公哲（陳公哲，1890—1961）在20世纪10年代赴苏州、杭州游览时经常组织户外拍摄；北京的“光社”（Light Society）由北京大学的七位教职员组成，起初是一个组织松散的文艺社团，旨在欣赏他们旅行途中拍摄的照片。158 20世纪30年代，由郎静山、黄仲长（黃仲長，1900—1988）和徐祖荫（徐祖蔭）组成的“三友影会”（Sanyou yinghui 三友影會）多次造访黄山，甚至连传统风格画家张大千（張大千，1899—1983）也参与了他们的户外摄影实践。20世纪20年代的摄影团体为会员提供了一个以艺术同道身份相聚的空间，以探索摄影的技术与审美层面。"}, {"type": "text", "text": "北京、上海、天津等城市中的新文化动态催生了一批业余摄影师和摄影社团。它们作为一种新的力量兴起并发展起来，参与到正在发生变革的现代艺术世界中，重塑了公众对摄影作为一种新艺术类型的理解。由于摄影媒介的力量，一系列新的摄影活动将影响扩展到了精英知识分子圈子之外，表明权力正从相对小群的专业摄影师和职业人士转移至一大群业余摄影师。"}, {"type": "text", "text": "正如将在下一章讨论的那样，摄影展览一直发展为主办社团成员作品展示的主要场所。1924年至1928年，光社举办了五届年度展览，在北京地区乃至上海都逐渐赢得了声誉。第二届年度展览吸引了一万多名参观者。公众对摄影的热情是光社展览取得成功的最强大推动力。光社于1928年和1929年出版了两本年鉴，收录成员的艺术作品，并附有陈万里和刘半农撰写的文字，考察了摄影、艺术和技术方面的一些重要问题。刘半农不仅给出了“业余者”的定义，还强调摄影师需要表达独特的“中国人的情趣与韵调”（zhongguoren teyoude qingqu yu yundiao 中國人特有的情趣與韻調）。159尽管出现了鲜明的民族情感，20世纪20年代初的艺术摄影师成功再现了一个知识界的审美感受力。"}, {"type": "text", "text": "中国摄影学会，即华社，兴起于一个繁荣的文化环境之中。它汇聚了上海艺术界中的艺术家、知识分子乃至记者，旨在扩大艺术摄影的影响，并构建业余摄影师的声誉。郎静山是《申报》和《时报》的一位老练广告人，他组织了一批业余摄影师，并于1928年在上海创立了中国第一个艺术摄影社团。华社成员基本上都与大都市现代艺术界有密切联系。例如，胡伯翔（1896—1989）是一位知名商业艺术家，曾为上海一家烟草公司绘制月历；摄影杂志《天鹏》的编辑王大佛推动了1928年华社第二届展览特刊的出版；160丁悚（1891—1972）是当时上海最著名的漫画家之一，创办了《上海漫畫》杂志，该刊于1929年出版了华社第三届展览特刊；161朱壽仁是《中華攝影雜誌》的主编，该刊是最有影响的摄影杂志之一，从1931年10月持续至1936年6月；郭錫麒（1896—1976）是20世纪20年代一位高产的业余摄影师，在《時報圖畫週刊》和《攝影畫報》上发表了许多摄影作品；漫画家張光宇（1900—1965）和葉淺予（1907—1995）虽然不是正式成员，也为展览贡献了许多作品，并进一步利用其影响力在大众媒体中扩大该社团的声誉。"}, {"type": "text", "text": "民国首都南京的摄影圈与上海略有不同。国民政府的一些政界人物，如国民党高级将领何应钦（1890—1987），以及国民党中央执行委员会委员褚民谊（1884—1946），在1928年参观美社展览时加入了该社。162 社员分布于南京和上海。创始人张蓬舟（1904—1991）强调，该社的宗旨是欣赏艺术摄影，“我们没有严格的规则，组织松散……我们将保持业余摄影师的联络网络，并扩大艺术摄影的影响。”163 摄影作为一种新的艺术形式，其艺术性，以及更重要的是其文化力量，得到了中上层阶级中一个不断扩大的圈子的认可。"}, {"type": "text", "text": "20世纪30年代，随着黑白影社的发展，摄影文化日益繁荣。黑白影社的摄影师们拥抱艺术摄影的多样性，如陈传霖、卢施福、聂光地、吴中行（1899—1976）、敖恩洪（1909—1989）和沙飞（1912—1950），将各种题材带入他们的摄影作品中。1932年至1937年间，四次展览引起了公众的极大关注。黑白影社的成员培养了表现各种题材的敏感性，以回应20世纪30年代救亡图存的呼声。社员的作品将审美价值与社会内容相结合，试图回应摄影在动荡的社会变迁中所扮演的角色。黑白影社成功拓展了艺术摄影的边界，其对摄影新视角的探索与20世纪30年代左翼文化运动的兴起齐头并进。相应地，收录展览照片的年鉴得以出版并广泛流传。中国半个多世纪的动荡使得所有照片都无法保存下来。这些各社的年鉴成为追溯其在摄影界成就的重要线索。照片在大众传媒中发挥了重要作用，尽管摄影杂志和画报在民国时期的出版物中仅占一小部分。"}, {"type": "text", "text": "繁荣的报业推动了城市环境中业余摄影社团的发展，而社团成员反过来又向杂志和画报投稿。摄影年鉴、杂志和画报保持了业余爱好者之间的联系，并提供了审美上高质量的作品和批评，以及一些实用的技术信息，供普通业余摄影师参考。《北平光社摄影年鉴》充分展示了社员的画意摄影作品；《中国摄影》和《中华摄影杂志》频繁刊载华社成员的作品（图2.13）；《北洋画报》培养了一批摄影师，他们后来组建了一个新的社团——北洋摄影会，这表明大众传媒与业余摄影之间存在密切关系。"}, {"type": "text", "text": "20世纪30年代，由摄影器材供应商提供资金支持的摄影杂志，如《中国摄影》（The China Focus）、《长虹》、《晨风》、《中华》等，刊登了大量业余摄影者的摄影作品。然而，这些摄影杂志往往在出版仅两三年后便停刊了。《中国摄影》于1928年7月创刊，至1929年12月停刊，其原因在于缺乏长期而稳定的赞助。《晨风》于1933年12月创刊，至1935年11月停刊，亦因同样的经济原因而终止出版。专业摄影杂志在摄影爱好者中极受欢迎，但普通读者也更愿意购买一些综合性的画报。因此，摄影杂志必须向摄影器材供应商寻求赞助。1936年，金石声及一些与他往来的业余摄影者创办了一份重要的摄影杂志《飞鹰》，由上海的冠龙器材行提供资金支持。作为民国时期最为精致的摄影杂志之一，《飞鹰》既推崇画意摄影，也接纳现代主义作品。除专门的摄影杂志外，民国时期最具开创性的画报《良友》和《时代画报》也专门开设了摄影栏目，以满足观赏公众的热情。"}, {"type": "text", "text": "除了由严肃的业余摄影者所发展的摄影学会之外，值得注意的是，学生摄影俱乐部的兴起与民国时期的美育相伴而行。1916年，蔡元培（1868—1940）出任北京大学校长，并在新成立的民国政府中担任教育总长，提倡\"美育\"，强调审美价值而非实用技能。164 国民党中央执行委员会委员褚民谊也是南京美社的一名业余摄影者。在1929年一篇题为《美的真诠》的文章中，他认为美育对一个国家的文化生活极为重要，因此应当有更多像美社这样的摄影学会。165 他的论述直接将美育与摄影学会及俱乐部的推广联系起来。"}, {"type": "text", "text": "校园摄影俱乐部的建立，旨在培养对摄影的兴趣，并为青年学生提供技术指导。与光社、华社等严肃艺术团体相比，校园摄影俱乐部更强调社交性，使业余摄影者在共同致力于提升艺术的目标下保持紧密联系。民国时期的第一批兴趣俱乐部作为课外兴趣团体，出现在城市中的大学和中学里。许多摄影者最初接触或接受摄影训练，都是在中学或大学学习摄影之时。郎静山于1904年12岁时在上海南洋中学学习摄影。他从其绘画老师那里学到了一些基本的摄影技能和暗房技术；精武体育会摄影学会——中国最早的摄影学会——的创办人陈公哲，约在1910年就读复旦大学时接触摄影；林泽苍于1924年在圣约翰大学就读时担任该校摄影组组长，后于1925年创办中国摄影学会；金石声在上海浦东中学学习摄影，并在那里结识了同学蒋炳南。金氏于20世纪30年代在上海开始其摄影生涯，当时他正在同济大学学习土木工程。"}, {"type": "text", "text": "与光社和华社一样，摄影社团的主要活动包括户外拍摄、定期讨论照片以及参加展览。沪江大学摄影社（Hujiang daxue sheyingshe 滬江大學攝影社）成立于1925年，是沪江大学学生的一项课外活动。根据1925年刊《沪江年刊》（The Shanghai, Hujiang niankan 滬江年刊）中刊登的一张在思晏堂前拍摄的1925年合影，第一年有二十三名成员（包括一名女性）；一年后，人数增加了一倍多，达到五十人。166 在《沪江年刊》1929年的照片中，显然有更多女性加入了该社（图2.14）。成员们组织户外拍摄，并定期阅读和交流照片；他们被鼓励将自己的照片投稿至展览和杂志。在该社秘书王慎名（Sidney D. Wang）撰写的一篇文章中，他称赞了该社的成就：“本卷《沪江年刊》中汇编的美丽照片和快照。此外，在地方和全国摄影展览中，成员们的艺术作品赢得了不少赞赏和好评，从而使我们的母校以另一个好名声为社会所知。”167 陈春波（Chen Chunbo 陳春波），1929年该社社长、《沪江年刊》主编，在《图画周刊》（Pictorial Weekly）和《中国焦点》（The China Focus）上发表了大量照片。有时，摄影社的成员还多次充当记者，例如在体育赛事中。"}, {"type": "text", "text": "有时，知名摄影师会为学生摄影社团的摄影年刊撰稿，这在一定程度上使他们的摄影活动合法化，并将他们的作品带入由高级艺术摄影师所设定的美学体系之中。郎静山、华社的胡伯翔为1931年5月由复旦大学摄影会（Fudan daxue sheyinghui 復旦大學攝影會）创办的《复旦摄影年鉴》（Fudan sheying nianjian 復旦攝影年鑒）撰写了序言，称赞他们在艺术摄影方面的成就和贡献。168 年鉴中的照片涵盖了从人体到街景的广泛题材。陈昺德（Chen Bingde 陳昺德，1907—1950），专攻体育摄影和女性肖像，为年鉴贡献了八幅照片。其中有一幅户外人体照片，这在20世纪30年代很少见。与此同时，复旦大学附属中学摄影学会（Fudan daxue fushuzhongxue sheying xuehui 復旦大學附屬中學攝影學會）也于1930年12月出版了《复中影集》（Fuzhong yingji 復中影集）。作为一个中学摄影社团，它在设备和资金方面得到了大学的支持。除此之外，沪江大学附属中学银鸥摄影学会（Hujiang daxue fushuzhongxue yin’ou sheying xuehui 滬江大學附屬中學銀鷗攝影學會）也于1935年出版了一本影集。"}, {"type": "text", "text": "高级业余摄影师在使学生摄影社团的业余活动合法化方面发挥了重要作用，他们受邀担任顾问也很常见。持志大学摄影研究会（Chizhi daxue sheying yanjiuhui 持誌大學攝影研究會）约成立于1928年。郎静山和胡伯翔担任顾问。169 南京美社的创始人之一屠哲隐（Tu Zheyin 屠哲隱）成为金陵大学镁社（Jinling daxue meishe 金陵大學鎂社）的顾问，该社由金陵大学的学生组成。除此之外，严肃的业余爱好者还在学生摄影社团的展览和出版物上发表评论和批评，以认可其作品的美学价值。"}, {"type": "text", "text": "年轻学生在题材与风格上拥抱多样性与开放性，对城市环境的变化表现出更强的敏感性。上海美术专科学校约于1930年成立了一个摄影社团。该社团成员受过职业画家的训练。因此，他们拥有久经磨砺的艺术直觉。170 摄影杂志《晨风》和《中华》于1934年1月刊登了上海美专摄影会（Shanghai meizhuan sheyinghui 上海美專攝影會）第五次展览的照片。正如将在下一节讨论的那样，摄影展览是展示成员各类作品的主要场所，这些类别包括都市夜生活和战争局势。171 校园内学生社团的活动让人得以一窥20世纪20年代和30年代蓬勃发展的摄影文化。成员们的摄影水平参差不齐，但他们清新而富有表现力的作品为中国现代摄影的多样性与活力作出了贡献。"}, {"type": "text", "text": "摄影曾是一种只为中国上层阶级所享有的奢侈消遣，如今逐渐传播到这些新知识分子和城市资产阶级之中。他们以生产、传播和消费影像的方式参与公共空间。除了拍摄照片之外，业余摄影师还购买摄影器材、摄影杂志和年鉴，定期参观展览，并组建了一系列社团和俱乐部。业余摄影师通过一系列摄影实践与更广泛的公众建立联系。动荡的政治局势和不断加深的民族危机促使他们思考个人与国家之间的关系。2.3 中国的“柯达女孩”：20世纪20年代和30年代的女摄影师"}, {"type": "text", "text": "轻便且易于操作的柯达相机激发了女摄影师的热情。19世纪中叶，设备笨重而昂贵，女性在摄影史中的作用有限。到19世纪80年代，干板和便携式相机的发明鼓励越来越多的女性从事这项爱好。随着对摄影师掌握复杂显影技术和配备沉重设备的要求被取消，摄影变得人人都能接触。172 除了男性业余摄影师之外，柯达公司是最早注意到女性摄影爱好者价值的企业。1893年，伊士曼柯达公司推出了“柯达女孩”。柯达广告开始以一位现代而充满活力的女性为主角，她身穿蓝白条纹连衣裙，手持柯达相机（图2.15）。“柯达女孩”——柯达广告活动中一位漂亮而现代的女孩——成为推广其易于操作相机的全球标志，广告宣称“连女性也能做到”，这表明操作之简便。173 广告中时尚的“柯达女孩”也表明，女性在20世纪初记录家庭聚会和家庭庆典方面发挥了重要作用。174"}, {"type": "text", "text": "“柯达女郎”甚至在世界各地拍照。在中国的柯达广告中，现代而浪漫的柯达女郎不仅表明该产品对业余爱好者友好，而且象征着一类受过良好教育、精明练达的“新女性”（xin nüxing 新女性）。例如，1926年《妇女杂志》（Funü zazhi 婦女雜誌）中柯达的广告展示了一位女摄影师用柯达相机拍摄运动员（图2.16）。175 另一则广告营造了一个浪漫的户外场景：手持相机的女子正在拍摄风景，而男子依偎在她身旁，这迎合了寻找浪漫故事的受众（图2.17）。176 有了相机，新女性可以自己拍摄，而不是被观看和展示。民国时期的女性杂志，如《妇女杂志》和《玲珑》（Linglong 玲瓏），都推动了把持相机的现代女性形象作为一种潮流；它们甚至为女摄影师设计了各种场景。177"}, {"type": "text", "text": "民国时期的“新女性”在五四时代首次被置于主体位置，在中国现代文学作品中一直被描绘为寻求女性主体性的现代主体。丁玲（1904—1986）和茅盾（1891—1981）等一些左翼作家对新女性的描绘，代表了对现代性的追求，并表达了现代中国女性在一个崭新而变动不居的世界中寻找自己声音的斗争。与此同时，“新感觉派”（Xinganjue pai 新感覺派）等作家则将现代都市女性客体化为诱惑都市男性的危险蛇蝎美人。这两种现代女性的再现都表现出对异化与现代性的深切焦虑。178"}, {"type": "text", "text": "中国广告中的柯达女孩形象不仅体现了冒险精神与时尚，也暗示了与她们追求个人进步相关的独立需求。广告中理想化的中国柯达女孩与现代性的积极方面联系在一起。1914年《妇女杂志》的封面图描绘了一位衣着考究、穿着中跟鞋的女摄影师正用柯达相机拍摄一只鹿。这幅画由擅长绘制风景和月份牌画的徐咏青（Xu Yongqing 徐詠青，1880—1953）以清雅的 turquoise 色调绘制，表现了一位女性正独自享受户外休闲旅行（图2.18）。179 在这一语境中，相机既是被用作一种时尚配饰，成为身体表演的一部分，也是用于界定她自身身份的现代媒介。20世纪10年代，柯达相机的拥有者仍限于少数摄影爱好者，尝试摄影的女性极少。这幅图展示了一个处于诗意氛围中的理想化主体，也暗示来自中上层家庭的都市女性正通过新媒介寻求自己的抱负。"}, {"type": "text", "text": "把玩照相机成为现代都市女性的一种风尚，同时也为一些中国女性参与自我形象的建构创造了可能，也就是说，使女性在塑造自身形象的过程中发挥更为重要的作用。《中国焦点》第五期的封面描绘了一位女摄影师正在摄影棚中操作器材，这颠覆了摄影棚摄影师一向由男性担任的刻板印象（图2.19）。180 女性被男性描绘为男性情欲之物的时代已经过去。181 更重要的是，照相机赋予了女摄影师更多操控自身形象的力量；“自我”逐渐成为20世纪初中国女性再现中的一个关键主题。中国女性经历了一场转变，从被观看的客体变为拥有自身欲望的主体，并通过周围的世界来审视自我。"}, {"type": "text", "text": "通过阅读这些摄影团体的合影，可以有趣地注意到，越来越多的女性业余摄影师加入了这些团体。女性业余摄影师乃至女性摄影团体的出现，与20世纪初摄影教育的普及密切相关。20世纪20年代，上海的松江女子学堂（Shanghai songjiang nüzi xuetang 上海松江女子學堂）开设了摄影课程；郎静山受聘担任教师。天津的南开女子中学（Nankai nüzi zhongxüe 南開女子中學）将摄影课程作为美育的重要组成部分，把摄影推广为一种培养城市开明家庭出身女性美德的新途径。182"}, {"type": "text", "text": "民国时期的现代女性踏上了摄影生涯，这也是一种新的社交方式。与男性摄影爱好者一样，女性也选择发展自己的摄影团体，以便彼此交流和社交。1923年，女性摄影团体“柯达俱乐部”在上海中西女塾（英文名：McTyeire School for Girls；中文名：中西女墅）成立（图2.20）。183 中西女塾是一所招收上海富裕家庭女子的私立学校，为丰富校园生活设立了音乐社、诗社等多个兴趣团体。柯达俱乐部由十五名学生组成，成立时间略晚于音乐社和诗社，旨在提供一些技术指导并培养对摄影的兴趣。中国摄影学会的创办人林泽苍注意到了柯达俱乐部，并于1927年在《图画周刊》上撰文介绍它。但他批评“柯达俱乐部”这一名称，因为它听起来像是柯达公司的广告。184"}, {"type": "text", "text": "摄影俱乐部为女性提供了一种新的方式，使她们彼此联结，并与不断变化的世界建立联系。柯达俱乐部的宗旨是“良好的情谊、良好的乐趣和良好的摄影”。185 与主要面向男性的精英摄影学会和学生摄影俱乐部相比，女性摄影俱乐部明确强调俱乐部的社交性和娱乐性。麦克蒂尔女校中出身富裕中国家庭的女性业余摄影师，被期望将俱乐部中建立的人脉带回自己的家庭。与此同时，女性业余爱好者之间的联结凸显了现代女性的形象。一张发表于流行女性杂志《玲珑》上的麦克蒂尔女校钱莲莲的肖像照中，她手持便携式相机，图片说明写道：“钱莲莲女士毕业于麦克蒂尔女子学校，热爱摄影（图2.21）。”186 陈炳德发表于《玲珑》的照片《成功的摄影师就是这样练出来的》，捕捉了两名女性摄影爱好者在练习拍照的瞬间（图2.22）。187 相机已经融入女学生的文化与艺术生活。女性摄影爱好者不仅将相机用作记录工具，也将其作为展示自我的方式。"}, {"type": "text", "text": "与坚持拍照自娱的男性业余摄影师不同，越来越多的女性摄影爱好者主张，女性拿起相机不仅是为了消遣，也应作为一种职业。越来越多的女性业余摄影师转变为职业摄影师，或处于两者之间。1925年12月一期的《妇女杂志》刊登了一篇题为《学摄影术的利益》的文章，鼓励更多女性成为职业摄影师，从而过上独立的生活："}, {"type": "text", "text": "中国女性数千年来一直受到礼教的束缚，"}, {"type": "text", "text": "整天躲在房间里……我该向"}, {"type": "text", "text": "女性读者介绍什么样的艺术呢？我学习摄影是为了（更好地）理解美术"}, {"type": "text", "text": "（更好）。我们看惯了洞庭湖的景色，但它看起来"}, {"type": "text", "text": "当我拍照时则不同……除了理解艺术之外，我"}, {"type": "text", "text": "为了生活而学习摄影……在美国，大学"}, {"type": "text", "text": "学生可以通过摄影挣钱来支付学费。女性"}, {"type": "text", "text": "是最合适的摄影师。有些女性非常"}, {"type": "text", "text": "不愿见男摄影师，因此女摄影师可以做大"}, {"type": "text", "text": "生意。188"}, {"type": "text", "text": "尽管作者似乎对照相师的职业前景过于乐观，她仍为女性读者提供了除当教师或秘书之外的一种新职业选择。复旦大学摄影学会成员盛和音与程秉德一起在一场大学典礼上担任新闻摄影。1930年《图画周刊》的头版照片显示，摄影者盛和音手持相机，被她的男同学包围（图2.23）。189民国时期的女艺术家和业余摄影者金耐先，在1929年第一届全囯美展（Diyijie quanguo meizhan 第一屆全國美展）上与其他知名男性业余摄影者一同展出了自己的作品。1901930年4月全国运动会在杭州举行时，她还担任体育摄影者，为女运动员拍摄了许多照片（图2.24）。1911931年，金耐先来到北京，在孔德学校教授西洋画。光社成员刘半农邀请她加入该社。作为第一位也是唯一一位女性成员，她在光社展览中展出了二十幅照片。顾淑型（Gu Shuxing 顧淑型，1897—1968）把摄影作为一种介入社会事件的方式。她拍摄了若干张表现1926年三一八惨案的照片，当时47名抗议者被杀，200多人受伤（图2.25）。与娱乐、体育和风景的记录相比，顾淑型的纪实作品展现出一位进步女性强烈的人文关怀。"}, {"type": "text", "text": "妇女摄影俱乐部的建立打破了摄影作为男性爱好的垄断，鼓励更多现代女性记录自己的文化生活。尽管大多数业余摄影社团对女性成员名额有限，学校中的摄影俱乐部却允许女性业余爱好者聚集在一起，发展出一个不断扩大的、因追求摄影而联系起来的业余者社交网络。新一代女性开始尝试摄影。照相机已经嵌入她们的文化生活，不仅作为一种时尚配饰，也作为一种界定自身身份的新媒介。"}]}, {"id": "ch3", "title": "Chapter 3 · Democratization of the Images", "paras": [{"type": "title", "text": "第三章 · 图像的大众化"}, {"type": "text", "text": "第三章：图像的民主化：公共空间中的业余摄影 引言："}, {"type": "text", "text": "展览会（zhanlanhui 展覽會）是中国一种新的文化和艺术实践，兴起于民国初年蓬勃发展的现代艺术界。越来越多的展览在推动中国现代艺术观念方面发挥了至关重要的作用。192 艺术展览不仅提供了展示艺术品的空间，还开辟了艺术家与观众之间交流思想的新渠道。民国时期的艺术展览从根本上改变了普通公众观看和欣赏艺术的方式，为学习和交流创造了一个新的公共空间。"}, {"type": "text", "text": "在20世纪30年代中期中国不断恶化的局势中，20世纪30年代中国现代艺术界持续进行的现实主义运动标志着与画意摄影和现代主义探索的决裂。许多摄影师借助摄影来表达救国情怀，将相机作为“武器”来动员公众。在20世纪30年代，摄影一方面作为记录工具发挥了至关重要的作用，另一方面则作为宣传工具塑造了民族想象。20世纪20年代和30年代"}, {"type": "text", "text": "自19世纪以来，画报媒体的繁荣培育了大量新受众，他们积极参与到20世纪的公共展览之中。参观艺术展览成为新兴中产阶级的一种现代文化活动。现代上海艺术家王济远（1893—1975）提到，数以万计的参观者涌向展览，并“留下愉悦的表情，摆脱抑郁之感”。193艺术社团与展览在创建制度结构方面发挥了核心作用，这些制度结构扩展了公众对现代艺术以及现代艺术家影响力的更广泛理解。通过20世纪20年代蓬勃发展的摄影文化——由业余社团、展览以及对展览的批评所构成——一种关于中国现代摄影的动态话语正在形成。"}, {"type": "text", "text": "1889年，中国摄影会（China Camera Club）举办了第一次摄影展览，展出60件作品，其中包括中国业余摄影者陈金堂（Chan Chin-tung）的一件作品；自1902年起，上海业余摄影学会（Shanghai Amateur Photographic Society）每年在联合教堂演讲厅举办会员作品展，这为在上海的欧美摄影爱好者提供了一个相聚并了解摄影领域新趋势的机会。194直到20世纪20年代，上海业余摄影学会仍为其会员作品举办展览，以展示照片对当地中国社会的影响。20世纪20年代末，郎静山甚至参加了上海业余摄影展览。"}, {"type": "text", "text": "光社的展览增进了公众对摄影作为美术的理解，为20世纪30年代摄影展览的大量涌现奠定了基础。1924年至1932年间，光社在北京举办了大约八次公开展览。光社的第一次公开展览于1924年6月14日至15日在中央公园的茶社举行，那里靠近北京大学。展览共展出会员拍摄的三百余幅照片，免费入场。195第一次展览的参观人数超过五千，展期延长至五天。196第四次年度展览之后，第一本《北京光社摄影年鉴》于1928年出版，收录了16位会员的56件作品。第二本年鉴在第五次年度展览之后出版。这两本年鉴不仅展示了展览中的照片，也界定了艺术摄影的边界，并讨论了艺术与技术之间的关系等一些理论问题。"}, {"type": "text", "text": "然而，摄影直到上海一系列由业余摄影社团举办的展览之后，才进入中国现代艺术界。20世纪20年代，摄影作为一种西式艺术形式，与西画和雕塑一道，经由众多业余摄影者的努力而逐渐获得承认并取得合法性。天马会（Tianmahui 天馬會）是中国最早面向公众推广西式艺术的艺术社团，也是第一个将摄影作品带入主流艺术圈的艺术团体。由天马会组织，光社创始成员陈万里于1926年在上海举办个人展览，展出他1924年在紫禁城拍摄的照片，以及他在与美国探险者参加科学考察并对敦煌和山西石窟进行考古研究时拍摄的石窟照片。197 这些考察期间照片的历史价值与艺术价值密不可分，但在天马会第八次和第九次展览会上展出的摄影作品则展现了重塑中国现代艺术话语的巨大美学价值。1927年和1928年，陈万里、郎静山、丁悚以及华社若干业余摄影者的作品在天马会第八次和第九次展览会上展出，表明摄影作为一种西式艺术形式已被艺术界接受和承认。《上海画报》为天马会第九次展览会制作特刊，其中摄影几乎与西画一样占据了两页。198 1929年在上海举办的第一届全国美术展览会也收入了严肃业余摄影者的227幅照片。199 一系列艺术展览展示了上海主流艺术圈如何承认摄影为一种新的艺术形式并使之合法化，这预示着摄影新时代的到来。"}, {"type": "text", "text": "正是华社在上海每年举办四次的展览吸引了更多公众关注，推动了摄影在民国时期成为一种大众艺术形式。1928年至1930年间，华社在上海《时报》报馆每年举办四次展览。近五十名参展者为该展览提供了190件作品。参展摄影者除华社成员外，还包括身为商人、银行家、媒体工作者、艺术家和作家的业余摄影者。华社展览欢迎其他社团及非成员的作品。第一次展览展出了上海日本业余摄影社团的照片；第二次展览收入了光社成员如刘半农以及来自香港的李崧（Li Song 李崧）的照片；同样来自黑白影社的陈传霖和卢施福也在华社第三次和第四次展览会上展出了作品。那些具有绘画性题材和柔焦技术的照片延续了十九世纪末至二十世纪初在欧美盛行的画意摄影。华社将展览称为“上海沙龙”，显示出法国沙龙文化的影响。然而，摄影者仍将中国审美语汇融入这一新媒介。例如，郎静山带有陈万里书法的照片《赛马前》（中文名：試馬）以新媒介独特地展现了传统中国绘画中经久不衰的赛马题材（图3.1）。它获得了参观者的大量好评。200 1928年《良友》中华社第二次展览专号刊登了郎静山的《赛马前》。"}, {"type": "text", "text": "得益于媒体宣传的增加，华社展览吸引了成千上万的参观者；与此同时，这些展览也获得了上海艺术界的认可。艺术摄影杂志《中国摄影》为华社第二次展览设立了专号；201 《时报》也专门介绍了郎静山、胡伯翔等重要华社摄影者，以及与展览有关的若干名人。据《申报》统计，参观展览者超过一万人。202 周瘦鹃（Zhou Shoujuan 周瘦鵑，1895—1968）是作家兼《申报》编辑，负责《申报》中一个颇具影响力的专栏“自由谈”（Ziyoutan 自由谈），该专栏为民国知识分子表达关于政治、文化和艺术的意见与情感提供了一个自由而散论式的空间。有趣的是，一些关于华社展览的评论出现在“自由谈”中。第一次展览开幕后，周瘦鹃为其写了一篇评论。他以直觉性的艺术家眼光选取了一些有代表性的照片，称赞胡伯翔对炼铁工人的描绘，认为这类似俄罗斯现实主义绘画《伏尔加河上的纤夫》。他还尝试运用摄影术语来评论照片，如佳构（jiagou 佳構）、取景（qujing 取景）和用光（yongguang 用光）。203 在另一篇题为“摄影第一课”（Sheying diyike 攝影第一課）的文章中，他表现出与华社成员一起拍照的强烈兴趣。204 作为著名文学批评家，周瘦鹃的支持对民国时期艺术摄影的普及至关重要。"}, {"type": "text", "text": "有些评论出自具有美术背景的评论家之手，例如郑曼青（1902—1975），他运用自己的绘画知识详细评论这些照片，称赞郎静山的《赛前》\"兼有中西绘画之长\"，而日本摄影师武田的作品则展现了艺术摄影的\"韵味\"。205与此同时，一些由普通摄影爱好者撰写的评论让读者得以一窥当时繁荣的摄影文化。这些评论基本上都对摄影展览给予了正面评价，摄影展览作为一种新形式在公众中引起了极大的兴趣。"}, {"type": "text", "text": "几乎与华社第一次展览同时，由林泽苍创办的中国摄影学会也于1928年3月23日至26日在上海举办了第一届全国摄影展览大会。中国摄影学会拥有800多名会员，其展览吸引了来自全国各地的投稿。该学会还配合展览举办了全国摄影比赛。超过8000名摄影爱好者参观了展览，这甚至超过了以往摄影展览的记录。206第二届摄影展览展出了280件作品，包括 accompanying contest 的获奖照片，这些作品还在1929年西湖博览会上展出。207"}, {"type": "text", "text": "纵观民国时期的摄影展览史，有趣的是可以发现这些展览的举办地点变化很大。一般而言，摄影展览对场地的要求不如绘画展览那么高。一张在第一次光社展览期间拍摄的罕见照片让我们得以一窥当时的展览环境。大小不一、装框简朴的摄影作品陈列在墙壁和临时展柜上，前方摆放着标签（图3.2）。"}, {"type": "text", "text": "三百余幅照片在这座三间房的茶舍中展出，这意味着照片陈列得相对密集，照片尺幅也因此受到限制。208 展览空间与设计的简朴表明，业余摄影社团无意寻求商业赞助，因为摄影展览对摄影爱好者而言，是艺术与交流的空间。光社的展览最初以校园照片展示的形式开始，后来发展为在中央公园一间茶舍举办的大型展览，并免费入场。中央公园在民国初年由皇家建筑转变为公共公园，在五四运动期间发展成为举行政治集会与游行示威的公共空间，自1910年代起也用于展示艺术品。收藏清宫古物的古物陈列所（Institute of Antiquity Exhibition，Guwu chenlie suo）常在中央公园举办展览。209 自1920年代以来，一些绘画展览曾在中央公园举办，如第三届中日联合绘画展览会（Zhongri huihua disanjie lianhe zhanlanhui）以及司徒乔（Situ Qiao，1902—1958）个展等私人绘画展览，吸引了众多艺术界参观者。210 中央公园作为光社展览的举办地，表明摄影已被公众认可为一门美术。"}, {"type": "text", "text": "华社的展览以及黑白摄影社的首次展览，均在当时《时报》报馆内举行，显示出与媒体的密切关系。如前所述，积极活跃于知识界与艺术界的业余摄影师，在组织与宣传方面提供了诸多便利，使展览得以尽可能远离商业。业余摄影师与媒体界知识分子的共同努力，不仅使摄影作为一种新的艺术形式获得正当性，也使艺术摄影在一般公众中得以普及。"}, {"type": "text", "text": "与绘画展览相比，摄影展览从一开始就表现出相对友好的态度。从华社第二次展览的照片中可以看到，照片装裱在板上，底部贴有标签，悬挂于一块大型展板上（图3.3；3.4）。板装提供了一种简单而轻便的方式，以取代玻璃或木框。照片可以方便而密集地固定在展板上，为组织者节省了大量展览空间与装框费用。这种简单而廉价的装裱方式成为此后展览的参照。中国摄影学会明确表示，全国摄影展览会展出的作品将不用玻璃装框。211"}, {"type": "text", "text": "摄影展览在日益成熟的摄影市场中发展，游走于艺术与商业之间。一些摄影器材供应商、照相馆或销售摄影设备的外国公司愿意赞助展览。中国摄影学会的全国摄影展览会在沙逊公司所在的沙逊大厦举办。212 沙逊大厦由维克多·沙逊爵士建造，具有装饰艺术风格，外立面为花岗岩，是和平饭店的一部分。"}, {"type": "text", "text": "从新闻照片来看，展览场地被设计得像一座迷宫，或者如记者所写的那样，是“八卦式”（Baguashi 八卦式），这意味着空间被充分利用来展示摄影作品（图3.5）。213 全国摄影展览会在外滩最著名的建筑之一中展出，自然吸引了各界人士的关注。第一届全国摄影展览会吸引了8000名参观者，其中包括晨光美术会（Chenguang meishuhui 晨光美術會）和上海漫画社（Shanghai manhuashe 上海漫畫社）等知名艺术团体、本地大学的大学生，以及一些欧美摄影爱好者。第一届全国摄影展览会对商业赞助较为宽容。柯达以及摄影器材公司千代洋行和礼和洋行在展览会上展出了他们的产品。然而，第二届全国摄影展览会强调，展出的摄影作品与商业赞助没有任何关系，因此不允许在展览会上展示相机产品。只有全国摄影比赛仍然可以获得商业支持，为此，上海的摄影器材供应商千代洋行和Kobza Studio还提供了装裱服务，柯达和爱克发公司则为展览会同期比赛中的获奖者提供了奖品。214"}, {"type": "text", "text": "随着20世纪30年代摄影展览的扩展，百货商店成为展览的新场所。1928年，北洋摄影会在天津中原公司（中原公司）的摄影部举办了摄影展览（图3.6）。215 黑白摄影会的第二届和第三届展览迁至南京路的大陆百货（大陸百貨），215 “Beiyang sheyinghui di’erci meishu sheying zhanlan dahui zai zhongyuangongsi guangxuebu zhanlan zhi，而第四届展览则在大新公司（大新公司）举行。商业空间中的摄影展览扩展了传统的展览实践，并触及了更广泛的受众。购物商场和艺术展览在民国时期都是新事物，它们在日益繁荣的商业环境中相互连接。上海的现代艺术家也被鼓励去探索艺术空间作为互动和交流场所的可能性。"}, {"type": "text", "text": "20世纪30年代，一些摄影展览在各大城市新成立的美术馆中举办。天津市立美術館成立于1930年，首任馆长严智开（1894—1943）在日本留学时便对摄影抱有浓厚兴趣。1930年至1937年间，该馆除1932年外每年都举办艺术摄影展览，吸引数千名参观者前来了解并交流艺术摄影。除年度展览外，该馆还分别于1930年和1935年举办了光社与黑白摄影社的展览。216 1936年，该馆举办了天津艺术摄影师刘维义的个展、日本光阳社展览以及康泰克斯展览。217 1937年，包含摄影单元的第二次全国美展（第二屆全國美展）在南京国立美术陈列馆（國立美術陳列館）举办（图3.7）。218"}, {"type": "text", "text": "摄影进入博物馆促使更多观众在其审美意义之外思考摄影的教育功能。20世纪30年代的博物馆不仅是艺术与文化空间，也是教育平台。摄影展览在博物馆的推出促进了摄影作为美术的合法化，同时也激发了对艺术摄影题材与意图的热烈讨论。《大公报》的评论者赞许地指出，黑白摄影社的摄影作品展现了摄影的纪实力量，表现了社会现实与无产阶级生活。219 3.2 摄影与动员：“摄影是一种强有力的武器”"}, {"type": "text", "text": "民国时期接连不断的政治事件与文化力量极大地影响了摄影，在表达自我与发展国家的更大框架内，拓展了观看自我与世界的欲望。正如理查德·肯特所论，在剧烈动荡的时期，摄影正发展为一项更大的政治与文化追求，以塑造并宣示民族认同。220 20世纪30年代，严肃的业余摄影师与摄影爱好者都试图揭示摄影的纪实与宣传潜力，以描绘动荡的社会现实。作为一种有效而实用的媒介，摄影已嵌入公众的文化与政治生活。221"}, {"type": "text", "text": "自20世纪30年代中期起，中国城市摄影师——主要在上海——开始描绘下层阶级，在20世纪30年代左翼文化的影响下表现出亲无产阶级的态度。上海吸引了一批左翼作家和艺术家，以现实主义和激进的方式介入世界。20世纪30年代的上海成为左翼文学、戏剧和电影的摇篮。20世纪20年代末，尤其是在1927年共产党与国民党分裂之后，一批左翼知识分子迁往上海。正如彭丽君所指出的，左翼作家联盟和左翼戏剧家联盟的第一次组织会议都在公啡咖啡馆举行，而鲁迅在许多塑造左翼文化整体发展的指导性会议中发挥了带头作用。222"}, {"type": "text", "text": "在20世纪30年代的上海，左翼文学成为主流，与现代主义以及《新鸳鸯蝴蝶派》之类的通俗小说持相反立场。一批左翼作家批判资本主义拜物教、贫富悬殊以及波希米亚式资产阶级的矫饰，强调革命的必要性并引领通向革命的道路。正如穆时英（1912—1940）所写：“上海。建在地狱之上的天堂！”繁华的大都市文化一方面促进了城市生活的繁荣；但另一方面也带来了不平等和高犯罪率。一些重要作家，如并未真正参与左翼联盟的茅盾，则描绘了20世纪二三十年代中国的社会动荡。"}, {"type": "text", "text": "20世纪30年代的左翼电影运动让人得以一窥本土视觉文化的趋势，并预示着未来会出现一场“无产阶级电影运动”。在20世纪30年代左翼意识形态的影响下，左翼电影人试图处理恋爱关系、民族主义情感、城市经验和现代性等议题。彭丽君认为，“他们的青年［正在］为一种乌托邦而战，那是一种他们从未为自己清晰界定的乌托邦，却需要他们最炽热的信念和激情去建构。”223《大路》（1934）、《都市风光》（1935）和《马路天使》（1937）都表达了对国家的乐观看法，并呼吁更广泛的公众参与救国。"}, {"type": "text", "text": "20世纪30年代的左翼文化影响了中国现代摄影的发展。20世纪30年代初，许多知识分子和艺术家在亲无产阶级态度与审美自主性之间暧昧地徘徊，同时他们对各类题材表现出人道主义关怀，如逃往大城市的难民、街头儿童、小贩、人力车夫和乞丐，这些都是中国现代艺术中的新题材，从而发展出一种人道主义视野。金世生1934年在外滩一带拍摄的一张照片，展示了两名难民站在岸边，凝视着黄浦江上的船只（图3.8）。照片将无助的人物置于前景，他们衣衫褴褛，提着篮子，背景是河对岸的现代工厂和建筑。赤贫与繁荣的鲜明对比唤起了人们对难民的深切同情。张光宇的摄影作品《蠕蠕市中人，巍巍百尺楼》展现了城市下层民众与豪华摩天大楼上海总会大楼之间的直接对比，该作品发表于1928年8月的《中国焦点》（图3.9）。224"}, {"type": "text", "text": "街景逐渐成为一个常见的题材。20世纪30年代的许多街头摄影以贫富、新旧、传统与现代之间日益扩大的差距为特征，暗示中国正迈向现代时代。赵定明拍摄的上海跑马场照片以棚户区与高层建筑之间的对比为特征（图3.10）。225工厂工人、机器操作工和人力车夫越来越多地出现在城市摄影师的镜头中。卢施福拍摄的照片《百炼钢铁》曾在1934年第二届黑白摄影展览会上展出，捕捉了炼钢时火花飞溅的瞬间（图3.11）。对劳动人民和城市贫民命运的关切，体现在20世纪30年代越来越多的摄影作品中。"}, {"type": "text", "text": "吴印咸更强调摄影主体的个体性。他是左翼电影《风云儿女》的摄影师，拍摄了若干带有左翼影响的照片。20世纪30年代的左翼电影极大地影响了吴印咸摄影实践的构图与题材。吴印咸在1930年第一届黑白摄影展览会上展出了一幅男性裸体照片（图3.12）。这幅照片强调肌肉和身体线条，受到希腊艺术和文艺复兴艺术的影响。除男性美之外，摄影师还突出了男性主体的力量与强力。《力》——这幅照片的标题——表明了一种相对矛盾的态度。但1935年那幅与鲁迅小说同名的照片《呐喊》则显示出更明确的政治倾向（图3.13）。一名半裸男子在呐喊，头微微扬起，双眼向上转45度。摄影师通过描绘他胸前的汗水以及焦虑而痛苦的眼神，与古典美学决裂。这幅照片成为版画艺术家李桦（1907—1995）作品《怒吼吧！中国》的参照点，后者以更直接的方式描绘了挣扎的身体（图3.14）。"}, {"type": "text", "text": "1934年和1935年举办的第二届和第三届黑白摄影展展出了许多劳动人民的作品，清楚地表明业余摄影师已不再满足于描绘自己的内心世界，而是利用镜头来表达社会各阶层的生活现实。叶浅予的摄影作品《甜蜜的十七岁》有两个标题；中文标题是《渔家女》（Yujianu 漁家女）。这张照片描绘了一位年轻的渔家女，一个无产阶级的职业。这种巧妙的中英双语策略被应用于许多照片中。史震怀（Shi Zhenhuai 史震懷）拍摄一群背石工人的照片也有一个双语标题：英文为《背石工人》（Rock Carriers），中文为《碌碌为谁忙？》（lulu weishuimang 碌碌為誰忙），表达了对下层人民的同情；吴印咸的摄影作品《汲水之女》（Jishui Zhinv 汲水之女）挪用了让-奥古斯特-多米尼克·安格尔（Jean Auguste Dominique Ingres，1780—1867）《泉》的古典题材，给一个看似无产阶级妇女的形象戴上了头巾（图3.15）。展览中一系列带有意识形态色彩的照片将艺术摄影推向了一个新的领域。继上海之后，这些作品还在北京、天津、南京、广州和青岛展出。"}, {"type": "text", "text": "黑白影社的第四届也是最后一届展览显示出更清晰的趋势：艺术摄影已经衰落，记录社会现实的照片增多了。第四届展览于1937年4月举行，正值第二次中日战争爆发前夕。在中国局势日益恶化的情况下，许多业余摄影师利用摄影来表达救国情感。此时，陈传霖、聂光地等影社成员强调摄影是表现社会现实、唤起公众情感的有力媒介。在《黑白影社八年》（Banian lai de heibaiyingshe 八年來的黑白影社）一文中，陈传霖认为摄影与救国密切相关："}, {"type": "text", "text": "如果我们不忘记，第一届摄影展闭幕24天后"}, {"type": "text", "text": "1932年的展览，黄浦江上的血腥暴行持续了"}, {"type": "text", "text": "四十多天（上海事变）。随着危机恶化，"}, {"type": "text", "text": "1931年的九一八事变和1932年的上海事变导致了"}, {"type": "text", "text": "四省沦陷，淞沪停战协定亦告失效。"}, {"type": "text", "text": "第二届黑白摄影展在"}, {"type": "text", "text": "动荡与混乱之中夭折……这是一个血的教训，它教导"}, {"type": "text", "text": "我们，这一阶段摄影与命运的密切关系"}, {"type": "text", "text": "整个民族的……艺术是现实的反映，真正的艺术是现实主义，"}, {"type": "text", "text": "这是所有艺术的最高法则……我们的摄影学会是"}, {"type": "text", "text": "与1935年和1934年的社会有着本质的不同……我们知道"}, {"type": "text", "text": "我们在中国摄影方面的责任，是使这种黑"}, {"type": "text", "text": "白艺术（摄影）成为中国的民族艺术。因此，我们必须"}, {"type": "text", "text": "使摄影在质量和数量上都相当成功，并且具有"}, {"type": "text", "text": "国际舞台上的声望。226"}, {"type": "text", "text": "20世纪30年代中期，反映现实的吸引力在艺术家和知识分子中不断上升。摄影评论家徐訏认为，相机是描绘现实的最佳媒介。他还提出，中国的新闻摄影师应按其意识形态分为左翼和右翼。227 最能反映无产阶级倾向的摄影师无疑是沙飛（1912—1950）。在成为中日战争中最负盛名的战地摄影师之前，他曾是一名电报员，也是黑白摄影社的成员。沙飛自20世纪20年代以来一直痴迷于摄影，并为此购买了自己的第一台相机作为蜜月之用。"}, {"type": "text", "text": "像大多数业余摄影师一样，沙飞最初也从事主流的画意摄影。在1935年第三届黑白摄影展上，沙飞展出了他著名的画意摄影作品《渔光曲》，描绘了中国南方河流景色的宁静。1935年至1937年间，他成为一名杰出的城市街头摄影师，在上海拍摄了许多铁路工人、马车夫和乞丐的照片。底层民众的形象凸显了贫穷城市居民的艰辛，表明社会的不平等，这与左翼思想和新兴的无产阶级革命观念密切相关。在他拍摄的一名黄包车夫的照片中，他采用了一种被忽视的视角，展现了一个卑微的车夫蹲在街上吃午饭的场景（图3.16）。同样的视角也被用于描绘一个赤脚的街头小贩。一幅名为《生命的吶喊》的照片描绘了一个拄着细长拐杖的盲乞丐独自蹲在路旁（图3.17）。他那双失明眼睛的正面特写令人震惊，表现出对生活在苦难中的人们的同情与怜悯。照片《禁止乞讨》通过表现民国政府的一名警察驱赶一名乞丐，直接批判了腐败的官僚体制（图3.18）。在1937年第四届黑白摄影展上，他展出了《勤俭》，描绘了一位普通农村妇女缝补旧衣服（图3.19）。他赞扬了普通民众勤劳节俭的优良品质，这清楚地表明了他亲无产阶级的立场。这些带有明显左翼立场、充满意识形态色彩的照片引导观众以批判的方式理解摄影作品，而不是把它们当作业余艺术来对待。摄影与动荡的社会密切相关。那一代艺术家和摄影师不得不做出选择：为艺术而艺术，还是为生活而艺术。"}, {"type": "text", "text": "沙飞的选择是在1936年做出的，这是他个人与国家的关键分水岭之年。他因在第二届全国木刻艺术展览会和展览后仅11天举行的鲁迅葬礼上拍摄鲁迅的照片而成名。228 在关于鲁迅的系列新闻报道中，他以职业新闻摄影师的身份行事。他捕捉到了鲁迅在友好气氛中与年轻木刻艺术家交谈的瞬间，甚至拍下了一张难得一见的鲁迅大笑的照片。展览之后，他并没有把这些照片作为礼物送给鲁迅；相反，他作为一名职业新闻摄影师索要版权费，尽管他并未受雇于任何新闻机构。229 在鲁迅的葬礼上，他拍摄了一系列游行示威的照片，展现出他在动荡环境中对政治事件的强烈新闻敏感。这次成功的新闻报道引起了轰动，而他对摄影持久的热情促使他将摄影作为终身事业来追求。"}, {"type": "text", "text": "沙飞从业余摄影师向职业新闻摄影师的转变表明，20世纪30年代中期出现了一种普遍转向。摄影被赋予了太多社会意涵。沙飞无疑在革新摄影的形式与风格方面做出了最大胆的努力。1936年12月，沙飞为其在广州的展览撰写了一篇引言《写在展出之前》，主张摄影是“暴露现实的一种最有力的武器”："}, {"type": "text", "text": "我一直在思考，摄影是一种揭示"}, {"type": "text", "text": "现实的强大武器，我一直渴望利用它来描绘"}, {"type": "text", "text": "真实世界……摄影是美术形式之一，但许多人仍然"}, {"type": "text", "text": "把它当作消遣。本质上，他们忽视了这种"}, {"type": "text", "text": "媒介的社会意义，让摄影被自命不凡的资产阶级用来"}, {"type": "text", "text": "表现美而忽视现实，这是多么糟糕的事！在"}, {"type": "text", "text": "现实中，许多人正遭受屠杀、强奸和奴役。"}, {"type": "text", "text": "社会的不平等是人类的耻辱，也是……的责任"}, {"type": "text", "text": "艺术在于帮助人类认识自身、改革社会，并"}, {"type": "text", "text": "恢复自身。因此，艺术家，尤其是摄影师，应该"}, {"type": "text", "text": "不沉迷于乌托邦，也不被自我意识冲昏头脑，而必须"}, {"type": "text", "text": "考察社会各个阶层，寻找真实的材料。230"}, {"type": "text", "text": "这114件作品的展览标志着沙飞摄影生涯的转变。在其早期生涯中，即20世纪20年代至30年代初，他以画意摄影技法描绘广东南澳岛富有诗意的风景。自20世纪30年代中期起，他将画意摄影语汇转向城市及其危机。1935年至1936年间拍摄的上海贫民生活，展现了他发掘摄影纪实功能的雄心。1936年在广州和桂林举办展览后，一些评论家高度评价其作品。马宗融认为，我们不应再以旧标准评价其作品，“他的作品具有超越艺术本身的价值……他的选择意义重大：一方面，他描绘了社会动荡中的日常生活，表达了民众的苦难；另一方面，他激发了民众的民族情感。”231"}, {"type": "text", "text": "在《论摄影》一书中，苏珊·桑塔格指出：“正如照相机是枪支的升华，拍摄某人便是一种隐性的谋杀——一种温柔的谋杀，恰适于一个悲伤、惊恐的时代。”照相机在纪实摄影和新闻摄影中被视为一种隐喻性武器，然而，除了那种“把人变成可被象征性占有的物品”的符号暴力之外，沙飞意图将摄影用作动员民众的工具。232“摄影作为武器”的论点对左翼摄影产生了深远影响，引领了表现无产阶级生活与社会现实的新方向。无疑，沙飞以一种激进的方式揭示了摄影的纪实面向，并通过批判社会的不平等与国民政府的腐败，激发了公众情感。"}, {"type": "text", "text": "民国时期的摄影杂志始终是业余摄影师充满活力与实验性的空间。尽管高度依赖商业赞助，许多摄影杂志仍发表了带有民族主义情感的作品。233《图画周刊》在20世纪30年代中期正处于转型之中。1935年那一期的封面照片展现的是从游船上拍摄的现代西式建筑景观；1936年，该杂志推出了华北旅行特刊。林泽苍拍摄的封面照片展示了站在长城上的士兵以及从烽火台远眺长城的景象。长城最初建造的目的是防止蛮族游牧民的入侵，如今则成为力量与独立的民族象征。《飞鹰》的编辑评论表达了对中国能够生产自身设备和物资的希望。《飞鹰》从未刊登过任何日本产品的广告。相反，他们在杂志中大力宣传中国摄影产品。诸如三角牌（Sanjiaopai）胶片、钱景华的全景相机等中国产品的广告频繁出现在《飞鹰》上。第一期编辑评论传达了对中国摄影工业发展的强烈关切："}, {"type": "text", "text": "在工业落后的中国，改进摄影设备仍然遥遥无期。"}, {"type": "text", "text": "但是，摄影事业的发展"}, {"type": "text", "text": "有赖于大家的研究和努力。"}, {"type": "text", "text": "欧美摄影产业并非偶然。"}, {"type": "text", "text": "摄影是一种与新兴科学相关的艺术形式，它"}, {"type": "text", "text": "只是在近几十年才发展起来的。十年前，日本摄影"}, {"type": "text", "text": "材料仍然需要由欧美国家供应。"}, {"type": "text", "text": "近年来，不仅一些简单设备可以自行生产，"}, {"type": "text", "text": "而且胶片也可以自行生产，并且已经在"}, {"type": "text", "text": "市场。产品的质量仍未提及，但这种努力的精神"}, {"type": "text", "text": "预期会得到本国研究者和"}, {"type": "text", "text": "制造商的研习。234"}, {"type": "text", "text": "到了20世纪30年代，摄影师们越来越有意识地利用相机来激发爱国热情。摄影领域中与“审美启蒙”和“中国性”相关的“艺术”推广，与李泽厚在1987年提出的“启蒙与救亡的双重变奏”相一致。23520世纪30年代，摄影依然重要，因为它在历史上既是一种记录工具，另一方面也是创造想象共同体的宣传工具。摄影对社会现实和政治时刻的巨大影响使统一成为可能。23620世纪30年代见证了新闻摄影的诞生。随着20世纪30年代社会现实主义的兴起，摄影成为最有效的艺术形式和宣传工具。237在20世纪30年代中期中国不断恶化的局势中，许多业余摄影师借助摄影来表达救国情感。通过20世纪30年代的一系列摄影实践，一些新主题，如普通人和工人阶级的痛苦、死亡与苦难，扩展了摄影表达的边界，并丰富了中国现代艺术的艺术语汇。"}, {"type": "text", "text": "20世纪20年代和30年代，一系列摄影展览在主要城市举办，这些展览不仅展示了业余摄影师的作品，也拓展了公众对摄影作为一种新艺术形式的理解。作为城市中新知识分子的业余摄影师，通过建立消费市场与艺术界之间的联系，推动了图像的民主化。20世纪30年代中后期，在民族危机的影响下，业余摄影师利用自身的文化和社会影响力进行广泛的社会动员，将业余活动转变为公共空间中的社会实践。美学与民族主义之间的张力，使业余摄影逐渐被纳入民族主义叙事的体系之中。"}]}, {"id": "ch4", "title": "Chapter 4 · Portable Landscapes", "paras": [{"type": "title", "text": "第四章 · 可携带的风景"}, {"type": "text", "text": "第四章：便携的风景：城市景观、休闲旅行与民族表述 引言"}, {"type": "text", "text": "当便携式相机传入中国时，观光与摄影自然而然地联系在一起。手持相机的热潮和拍照的“毫不费力”使更多的业余爱好者和非专业人士能够在短途游览和长途旅行中拍摄快照。新中产阶级的兴起、快速发展的交通以及相对和平的战前环境，推动了民国时期旅游业的发展。在民国时期，旅行经历了从精英消遣到现代休闲活动的转变。手持相机的普及恰好满足了在任何地点和时间制作大量影像的需求。除了前往风景名胜的休闲旅行之外，越来越多的中国知识分子和艺术家推动了一种全国性旅行潮流，以探索民国中国的新文化景观。柯达相机的简便性和便携性也极大地有益于民族志研究。大量记录原住民日常生活经历的照片被拍摄下来。"}, {"type": "text", "text": "在现代，摄影本质上提供了一种新的“观看方式”，而手持相机旅行有可能改变一个人对旅行经验的看法和理解。便携式相机的大受欢迎激发了人们在旅途中保存私人时刻的愿望。与旅行摄影的经典相比，民间游客照片在学术研究中受到的关注有限。通过审视私人旅行照片，有趣的是可以发现一种不同的版本来讲述民国时期旅游业的故事。4.1 快照与城市生活的瞬间"}, {"type": "text", "text": "用手持相机拍摄的照片被称为“快照”，这一术语借自狩猎用语，意指自发地拍摄。238这些质朴无华的影像被杰弗里·巴钦称为“乏味的照片”，它们展示了对环境直接而具体的回应。239使用胶卷的手持相机大大增强了摄影师的机动性。它们占用更少的空间，因此摄影师可以轻松地将它们带到户外，而胶卷也免去了每次按下快门后都要插入干版的麻烦。此外，手持相机快速对焦以及可供用户使用的众多镜头，使获得完美照片变得更加容易。所有这些优势都促成了即时照片或快照的流行。阿尔弗雷德·霍斯利·辛顿在1893年写到手持相机时说：“如果使用得当，并怀着恰当的动机，有着明确的目标和目的，那么手持相机摄影的未来将是尚未想象的。”240"}, {"type": "text", "text": "在民国时期，手持相机成为严肃业余爱好者和普通业余玩家共同的最爱。自20世纪30年代以来，陈传霖、王劳生和卢施福等业余摄影师一直在撰文论述手持相机的优越性，并倡导捕捉现实世界中的瞬间。一些由资深摄影师撰写的关于使用小型箱式相机（小镜箱）的指导性文章出现在摄影刊物上。黑白影社的创始成员之一、中国最早的徕卡摄影师之一陈传霖介绍并推广了爱克发安斯柯·梅莫、徕卡、蔡司·康泰克斯、柯达·普皮勒和罗敦司得等手持相机的使用。他宣称，相机的便携性和胶卷的可负担性是其主要优势。使用胶卷的手持相机适合拍摄即时照片，而廉价的胶卷使摄影师可以拍摄许多张并从中挑选最好的一张。241王劳生（1908—1961）在《飞鹰》杂志上发表了一系列文章，这些文章以技术性强为特点，旨在为业余摄影师提供实用知识。242"}, {"type": "text", "text": "卢施福的文章着重于不同品牌手持相机的技术层面，如机身设计、快门速度和可操作性。243他批评了美术摄影中陈旧而程式化的表达，认为摄影师不应执迷于取悦鉴赏家而忽视现实世界的题材。在其题为《我的艺术摄影观》的文章中，他批评了一些画意派摄影师，他们往往从传统绘画中借用某些母题，并以绘画般的效果描绘风景："}, {"type": "text", "text": "风景题材是……最喜爱的题材"}, {"type": "text", "text": "观众，但不如对生活中生动情感的描绘。"}, {"type": "text", "text": "例如，摄影师将一棵被……环绕的老树并置"}, {"type": "text", "text": "云雾缭绕，几间茅舍掩映其间，确实值得称赞，"}, {"type": "text", "text": "但如果摄影师在树旁安排一位老人，或者"}, {"type": "text", "text": "茅舍周围的炊烟袅袅升起，观众就会感受到"}, {"type": "text", "text": "与这生动的场景相接触。244"}, {"type": "text", "text": "手持相机所带来的即时性与简易性，从根本上改变了摄影师观看和处理拍摄对象的方式。这种不断变化的、个体化的视角，与20世纪初新兴的城市空间相契合。便携式手持相机配以感光胶片和更快的快门速度，使专业与业余摄影师都能够对城市生活作出富有表现力的记录。建筑史学家M. 克里斯蒂娜·博耶指出，19世纪末20世纪初城市生活的转变，是从一种通过画面框架逻辑加以解释的模式，转向“一连串转瞬即逝的印象和片刻邂逅”。245到20世纪30年代，中国城市居民经历了一场巨大的震动，其强烈感受在于，这些“印象和邂逅”受到城市中技术奇观的影响。"}, {"type": "text", "text": "20世纪初见证了上海发展成为一个熙熙攘攘的大都市，也见证了摄影技术的伟大革命。摄影被用来参与20世纪现代城市的成长与发展。民国时期的摄影师在很大程度上就像现代作家和诗人一样，找到自己的方式来应对现代生活中新的身体／感官经验。246与20世纪30年代的城市现代主义写作相比，城市摄影师不仅探索了大都市生活的喧嚣，而且对城市发展表现出深切的人文关怀。与此同时，两次世界大战之间欧美现代主义摄影运动也鼓励中国城市摄影师通过重新发明现代主义语汇来表现大都市。"}, {"type": "text", "text": "上海是一座大都市，多种现代性在多元的语境中共存。1937年以前，这座半殖民地的上海为中国知识分子提供了多元而富有活力的文化环境，知识分子们愿意采纳欧美或日本的思想。主要由上海新中产阶级构成的业余城市摄影师也是如此。他们接受并改造了欧美摄影现代主义的某些元素，以表现不断变化的城市环境。247上海成为一个新思想与新技术在国际层面汇聚的中心，与此同时，它也发展出一种替代性的现代性版本，在传统与“现代”之间进行协商。"}, {"type": "text", "text": "上海的一些作家，如茅盾、刘呐鸥劉吶鷗（1900—1940）、施蛰存施蟄存（1905—2003）、穆时英和黑婴黑嬰（1915—1992），开始描写熙熙攘攘的大都市环境，对新出现的城市文化作出回应。1926年，刘呐鸥写信给戴望舒戴望舒（1905—1950）："}, {"type": "text", "text": "对于我们这些现代人来说，浪漫只能遥不可及……有轨电车太"}, {"type": "text", "text": "喧嚣之中，曾经湛蓝的天空被工厂的煤烟熏黑，而"}, {"type": "text", "text": "云雀的歌声沉默了。缪斯们，她们的竖琴琴弦已断，"}, {"type": "text", "text": "已飞往无人知晓的地方。这是否意味着不再有美"}, {"type": "text", "text": "在现代生活中？不，它存在，只是形式变了。我们没有"}, {"type": "text", "text": "浪漫，没有城堡中吹响的号角，但我们有刺激和"}, {"type": "text", "text": "肉欲的陶醉。这就是我所指的现代主义（jindaizhuyi 近"}, {"type": "text", "text": "代主义)。248"}, {"type": "text", "text": "文学领域的现代主义运动由“新感觉派”领导，该派由刘呐鸥、施蛰存和穆时英组成。穆时英在其小说《上海狐步舞》（shanghai hubuwu 上海狐步舞）中展现出非凡的视觉感受力，描绘了天际线闪烁的灯光、街上的声音与色彩，以及舞厅中的盛大派对："}, {"type": "text", "text": "上海。一个建在地狱之上的天堂！"}, {"type": "text", "text": "上海西部，明月升上天空，照亮了荒废的"}, {"type": "text", "text": "蔓延之地。灰白的蔓延，覆盖着银灰色的月光，然后又镶嵌着"}, {"type": "text", "text": "深灰色的树影和一堆堆村庄的阴影。"}, {"type": "text", "text": "霓虹灯光伸出彩色的手指，在蓝色"}, {"type": "text", "text": "夜空的墨色中写下大字。一位英国绅士站在那里，身穿"}, {"type": "text", "text": "燕尾服，臂下夹着手杖，步伐轻快。"}, {"type": "text", "text": "写在他脚下：“尊尼获加仍在"}, {"type": "text", "text": "前行。”路边一小块草地上，房地产的乌托邦，"}, {"type": "text", "text": "在其上方，一个抽着切斯特菲尔德香烟的美国人注视着，仿佛在说：“什么"}, {"type": "text", "text": "可惜这个小人国式的乌托邦；那块大地是不是太小了，容不下我把我的"}, {"type": "text", "text": "把脚踩下？”249"}, {"type": "text", "text": "与声音、灯光、色彩和运动紧密相连的城市生活的新感受，激发了作家们去探索城市的活力与多样性。20世纪30年代现代主义写作所铭刻的一种视觉转向，继续由几位本地城市摄影师加以表现，他们利用便携式相机的创新，试图捕捉上海迅速变化的景观。250 除了交通的声响、各种街景和大都市生活的喧嚣之外，城市摄影师还探索了从外滩建筑到1932年上海战役后轰炸废墟等各种题材。"}, {"type": "text", "text": "一群本土都市摄影师创造性地回应了两战之间欧洲现代主义摄影的激动人心的运动，他们通过对上海建筑采取新的视角来做到这一点。外滩不仅是殖民权力得以行使、各殖民者建筑风格得以展示的场所，也是一个多元文化交融、动与静、新与旧、传统与现代之间的张力尽收眼底的空间。251 当时众多的建筑项目激发了都市摄影师去揭示其复杂性，从而建立了一部城市扩张的视觉史。通过金石声的相机，带有巨钟的海关大楼成为快速变动的现代时代和一个成长中的大都市中不断变化的意识的寓言（图4.1）；他在20世纪30年代拍摄了数张百老汇大厦的照片。除了1934年的照片外，他还在1935年、1936年以及后来的1947年拍摄了照片。他可能爬上了桥，甚至俯卧在卡车的平板车上，从扭曲的视角捕捉转瞬即逝的影像（图4.2）。金石声运用多种视角来表现这座建筑，展现了一个动态的大都市环境，不断变化的中国现代性正是在其中浮现并发展起来。252 艺术家们培育出一种“新视觉”，为重新观看世界提供了视角，并重塑了对摄影的感知。他们那令人迷失方向的戏剧性视点传达了现代世界的动态，并成为当时技术发达的欧洲现代主义意象的特征。253"}, {"type": "text", "text": "陈传霖深受欧美直接摄影的影响，他强调了新古典主义风格的汇丰银行大楼（又称市府大楼）的精确性，以及由捷克建筑师邬达克（1893—1958）设计的国际饭店的线条与结构。表现上海高层建筑的照片与阿尔弗雷德·斯蒂格利茨在20世纪30年代的纽约市影像有相似之处（图4.3）。西式建筑和不断增多的摩天大楼象征着抗日战争前一个日益机械化、工业化的大都市。都市摄影师在20世纪30年代为他们的观众带来了全新的体验。"}, {"type": "text", "text": "摄影，其本质在于捕捉现代时间中转瞬即逝的瞬间，在动态地呈现上海形象方面发挥了重要作用。大戏院、百货公司、闪烁的霓虹灯的照片，运动、色彩、声音，所有感官性的视觉奇观，都促成了瓦尔特·本雅明在其对夏尔·波德莱尔的研究中所提出的“震惊体验”。254 敖恩洪擅长捕捉大都市文化环境中的感官体验。他以戏剧性的对角线构图强调建筑的线条来表现大戏院（图4.4）。20世纪30年代，城中日益增多的影院已发展成为城市生活的多彩象征。看电影成为都市人的一种新消遣。1931年，《良友》画报用整版篇幅刊登了电影制作者胡晋康拍摄的上海影院照片。255 大戏院由捷克建筑师邬达克设计，于1933年开业，成为都市摄影师们新的钟爱题材。金石声还拍摄了一张夜景照片，画面显示《世界在前进》——这是大戏院立面上公布的电影片名。256"}, {"type": "text", "text": "新的照明技术前所未有地照亮了夜生活。消费与休闲活动一道，已被吸纳进城市人日常生活的肌理之中。金世生拍摄了一些照片，表现城市人如何购买彩票，展现了上海独特的城市文化（图4.5.1；4.5.2）。在闪烁的霓虹灯下，人群来回移动。有些人的脸上显露着焦虑或兴奋。一条标语写道：“今天买彩票，也许明天你就会成为有钱人。”这些在外国租界中涌现的休闲娱乐场所共同成为上海城市文化的核心场域，而它们又反过来成为影像生产和文学作品中频繁出现的题材。"}, {"type": "text", "text": "一些新的题材，如城市废墟与死亡，出现在本地城市摄影师拍摄的照片中。金世生曾拍摄过数张1932年淞沪会战期间空袭造成的瓦砾残骸。金氏运用画意摄影的技法，在传统结构的画面中描绘了破坏的浩大规模（图4.6）。那幅景象忧郁而富有诗意，戏剧性地呈现了部分遮蔽建筑的滚滚浓烟，强调了轰炸的毁灭性力量。这一末日般的景象预示着五年后中日之间全面战争的爆发。"}, {"type": "text", "text": "几乎在同一时期，越来越多的巴黎、柏林和纽约等大都市照片由欧美摄影师拍摄。在美国，阿尔弗雷德·斯蒂格利茨的纽约照片展现了成长中大都市的复杂性，传达出大萧条初期美国社会中的紧张与活力。257 欧洲的现代主义运动，如新客观主义（Neue Sachlichkeit）和新视觉（Neue Vision），本质上代表了两战之间观察技术日益发达的大都市的一种新方式。258 新客观主义运动的先驱、德国摄影师阿尔伯特·伦格-帕奇（Albert Renger-Patzsch，1897—1966）于1928年出版了《世界是美丽的》（Die Welt ist schön）一书。书中的一百幅照片体现了一种客观而现代化的观看工业化与机械世界的方式，显示出理性化与异化的倾向。德国艺术家卡尔·布洛斯菲尔德（Karl Blossfeldt，1865—1932）的照片，如《铁线蕨》（Adiantum Pedatum），展现了植物的触感特质与错综复杂的形态。这些黑白特写显示了自然界的巨大力量（图4.7）。匈牙利艺术家、包豪斯学校成员拉斯洛·莫霍利-纳吉（László Moholy-Nagy，1895—1946）宣称，摄影及其他现代技术提供了新的、陌生的经验，从而在世界上产生了超越简单复制的全新关系。259 他1928年拍摄的《柏林广播塔》以其实验性视角达到了抽象的品质，鼓励观众以全新的方式观看城市（图4.8）。除了新客观主义和新视觉运动之外，俄罗斯构成主义者如亚历山大·罗德琴科（Alexander Rodchenko，1891—1956），运用大胆的形式主义视觉语言改变人类对世界的感知，启发了中国艺术家去揭示日常物品的美学。260"}, {"type": "text", "text": "尽管追求形式美学，欧美摄影现代主义对两次世界大战之间动荡的社会和政治剧变表现出批判态度。阿尔弗雷德·斯蒂格利茨的城市影像描绘了现代生活中的疏离感，对不断扩张的大都市表现出矛盾心态。他认识到城市给人们带来混乱与失序的方式，并鼓励观众重新思考城市化。261 欧洲摄影师对社会问题的批判更多。恩斯特·布洛赫在描述德国魏玛共和国时期时称之为“一个裂变的时代”，它“既在衰败，又在阵痛之中”。262"}, {"type": "text", "text": "20世纪20年代和30年代的欧美摄影师记录了人们对城市的矛盾心态。他们认识到城市剥夺了人们的个性与身份认同，强调都市生活中的疏离与冷漠。与此同时，中国城市摄影师则热衷于颂扬大都市文化的繁荣，邀请观者欣赏都市景观。263 不断扩张的大都市实际上成为一个日益现代化国家的象征。对现代化的颂扬也可以在其他中国城市展现工业进步的摄影作品中找到。例如，金世生在20世纪30年代初拍摄的青岛照片捕捉了港口中的铁路、发电站和造船厂，展现了蓬勃发展的工业和持续进行的现代化（图4.9）。"}, {"type": "text", "text": "尽管上海在20世纪20年代和30年代成为一个可与巴黎、柏林、纽约相媲美的繁华大都市，但它能被称为现代主义城市吗？斯科特·麦克拉肯认为，想象城市的方式定义了城市的本质。现代城市与现代主义城市之间的区别在于工业时代的历史城市与人们想象这座城市的方式之间的差异。264"}, {"type": "text", "text": "“现代主义者”的定义并无标准。除了现代化的基础设施之外，现代主义城市的标准又是什么？城市摄影师试图采用一种超越殖民话语和画意摄影表达的新方法，呈现熙熙攘攘的大都市生活的质感，以及动与静、新与旧、现代性与传统之间不可避免的张力。尽管城市摄影师在城市意象中赞赏并借鉴欧洲现代主义，他们对现代主义却采取了一种独特的路径。欧美现代主义强调城市生活中的疏离与超然，而中国现代主义则拥抱城市的活力。4.2 便携相机与休闲旅行的兴起"}, {"type": "text", "text": "便携相机满足了人们记录所见之物的天然愿望。伊士曼将柯达相机称为“摄影笔记本”，用以记录一生中转瞬即逝的经历。265 日常旅行经验所拍下的快照可被视为一种文化制品，而业余摄影师私人经历中看似普通的照片，实质上成为现代摄影实践的关键组成部分。除了记录历史事件之外，便携相机和休闲旅行还将日常影像带入摄影史。户外拍摄在中产阶级中愈发流行。在20世纪初的欧美，随着人们对户外休闲活动的痴迷，便携相机和胶卷日益普及。266 旅行提供了与中产阶级生活中被认为缺失的真实经验的相遇。因此，越来越多的欧美游客热衷于寻找一种未被工业化和现代化毁坏的文明。遗迹的残存物被转化为怀旧游客拍摄照片的对象。267 1931年的一则柯达广告将一幅民国时期成为旅游景点的北京天坛照片与一台柯达布朗尼相机并置，暗示了相机与观光之间的密切关系（图4.10）。相机的流行与民国中国的旅行热潮相遇。正如苏珊·桑塔格所言：“不带相机去旅行寻乐，简直显得不合常理……旅行成为一种积累照片的策略……大多数游客感到不得不把相机置于自己与所遇见的任何值得注意之物之间。”268 便携相机的发明影响了观看方式，并进一步改变了社会对时间和空间如何被视觉再现的感知。269"}, {"type": "text", "text": "随着便携相机的引入，休闲旅行在20世纪30年代的新中产阶级中广受欢迎。不难发现，携带便携相机旅行已成为观看新国家和现代世界的一种新方式。旅行的特权也从精英和知识分子圈子转移到更多比以往拥有更多闲暇时间的城市居民身上。民国时期的旅行正从精英的特权转变为一种普遍的休闲活动爱好。"}, {"type": "text", "text": "城市中新中产阶级的兴起、交通基础设施的扩展以及战前相对和平的环境，共同推动了民国时期旅游业的发展。南京政府的规划中建设了一种新的公共交通方式，旨在“重建”中国，使其现代化。270 不断扩展的交通体系为休闲旅行提供了更多可能。到1911年，中国的铁路里程约为9，000公里。民国时期，新政府认识到铁路对于加强国家控制的重要性。271 新修建的铁路将内陆地区与长江三角洲及经济中心连接起来，为浙江和江苏带来了许多游客。1921年，从上海乘火车到杭州需要六个小时，乘坐快车则只需四个小时。272 沪杭线使上海的许多业余摄影师能够在短假期前往西湖游览；杭徽公路的建成则使长江三角洲的旅行爱好者能够将游览黄山作为一日行程。"}, {"type": "text", "text": "一张在兰溪拍摄的普通旅行照片展示了成群结队的游客或坐或站在溪流中的岩石上；兰溪是一个距离杭州近120英里的村庄（图4.11.1；4.11.2）。273 照片背面是罗邦年写下的“我们欣赏了风景”几个字。罗邦年是一位银行家，也是常驻杭州和上海的业余摄影师。携带相机旅行成为业余摄影师中的一种新潮流。如前所述，户外拍摄是业余摄影协会和相机俱乐部的主要摄影活动之一，业余爱好者中的旅行摄影或旅游摄影由此诞生。"}, {"type": "text", "text": "嵌入私人旅行体验中的相机发挥着视觉记忆辅助工具的作用，接近摄影的本质——对时间流逝的隐喻。因为摄影保存了拍摄对象的外貌，所以它始终与历史时刻和记忆联系在一起。274 从罗兰·巴特《明室》中常被引用的“此曾在”，到摄影史学家杰弗里·巴钦的理论，照片总是捕捉过去的某一时刻，而我们随后在当下观看它。因此，观看一张照片就是在体验过去与现在之间的时间移动，也就是见证时间的流逝。275"}, {"type": "text", "text": "审视骆伯年私人收藏中的旅行照片，不难发现旅行照片与配文之间的互文性。这些文字揭示了它们的目的地：西湖、兰溪、雁荡山和烂柯山。这些景点大多位于浙江省内，这表明这些业余摄影师偏好与密友结伴进行短途旅行。这些旅行照片构成了业余摄影群体一种私密而亲昵的视觉叙事。骆伯年偏好捕捉旅途中的一些日常题材。1935年的一张梅花特写照片，是骆伯年在前往超山旅行时拍摄的，超山是距杭州18英里的风景区。他描绘了梅花的细节，呈现出一种温和宁静的氛围，与20世纪30年代中国的社会动荡相隔绝（图4.12）。花、树和水上的船：这些传统文人画中的母题都被骆伯年重新取景。他运用特写视角来表现雪中枯草、映衬天空的挺拔青草以及野花（图4.13.1）。他还运用虫眼视角来表现宝塔，将其与开满花朵的枝条并置（图4.13.2）。树木成为他照片中一个经久不衰的题材。1938年，他被调往香港的中国银行任职。他在那里拍摄了若干热带树木的照片。"}, {"type": "text", "text": "骆伯年以诗意而浪漫的氛围描绘平凡题材，运用开创性的技法来提升平凡风景，并传达与自身文化记忆相联系的微妙情感。在一张照片中，他描绘了云与光的形状和线条，这些运用了20世纪初国际画意摄影的语汇，并与传统书法题字并置（图4.14）。通过聚焦明暗的图案化处理、模糊细节并压缩空间，骆伯年以不同于那些模仿传统绘画的画意摄影作品的方式描绘了乡村风景。他强调摄影的唤起与阐释特质，以暗示心理和精神意涵的方式描绘寻常景物。在若干荒村照片中，他为观者创造了一种沉浸式体验。明暗与构图的突出，以及他所创造的浪漫而感伤的氛围，无疑唤起了情感的触动与心境。"}, {"type": "text", "text": "携带便携相机进行休闲旅行彰显了少数特权阶层的特权，而这些旅行所拍摄的影像促成了民国时期新中产阶级身份认同的形成。在这些旅行照片中，旅行者——无论男女——似乎都将相机视为一种时尚配饰。在骆伯年的收藏中，我们可以找到若干照片，展示旅行者在取景、一位身着长袍的男子在拍摄，以及一位侧身女子手持相机假装拍照（图4.15）。无论他们是否摆姿势拍照，操作相机都是一种现代行为，暗示着一种现代身份通过摄影得以确立。"}, {"type": "text", "text": "摄影作为一种将视觉记忆工业化的装置，是一种互动性的交流工具，并通过共同庆祝值得纪念的时刻，使与群体的联系变得可见。皮埃尔·布迪厄在其著作《一种中等艺术》（Un art moyen，英译为 Photography: A Middle-brow Art）中讨论了摄影作为一种保存家庭记忆和共同过去的记忆装置。276 大卫·贝特将摄影的家庭用途扩展到多种类型的照片，这些照片发展出了“一种统一因素，作为过去的纪念碑，也是献给过去的纪念碑”。277"}, {"type": "text", "text": "休闲旅行，作为民国时期资产阶级的一项集体活动和社会仪式，被便携式相机捕捉下来。通过摄影实践，这一群体迎来了一段把玩相机、颂扬业余性和瞬间性的时光。在旅行期间，业余摄影者群体会彼此为对方拍照，摄影群体的联系由此变得更加可见。旅行摄影或集体户外拍摄被可视化为一种集体活动、一种社会与文化仪式，与假日摄影和家庭摄影有一些相似之处。旅行与摄影象征了一种新的仪式，增强了群体内部的联结。除了走向紧密联结之外，他们还试图通过摄影和休闲旅行发展出一种自我认同。"}, {"type": "text", "text": "对于业余摄影者自身而言，旅行照片被拍摄下来，是为了保存并颂扬那些与寻常地点和时间相脱离的时刻。离开熟悉的地方后，业余摄影者手持相机，随时记录并颂扬这些时刻。通过摄影观看正在兴起的新共和国以及风景和人民的渴望，驱使这些业余摄影者走出家园、向外探索。"}, {"type": "text", "text": "从与亲密社群一起的私人旅行，到由旅行社或公司安排的商业团体旅行，休闲旅行在民国时期的新中产阶级中日益兴起。20世纪初，英国旅游公司托马斯·库克父子公司（Thomas Cook & Sons Co.）在中国开设了办事处，而美国运通旅行部和日本观光局则为来自主要通商口岸和满洲的国际旅行者提供旅游和银行服务。1923年，银行家陈光甫（1881—1976）在上海创办了中国最早的旅行社。它最初是作为上海商业储蓄银行下属的旅行部设立的，后来从银行分离出来，更名为中国旅行社（Zhongguo lüxing she 中國旅行社）。从1923年到1937年，中国旅行社打破了中国境内外资旅行社的垄断，发展了从北京到香港的66家分社。它主要提供交通和酒店预订，以及为中外客户提供导游服务。278"}, {"type": "text", "text": "一些非政府旅行社，如友声旅行团（Yousheng lüxing tuan 友聲旅行團），是由几位旅行爱好者在1915年自发组织的。创办者孙宗源（Sun Zongyuan 孫宗源）和姚元幹（Yao Yuangan 姚元幹）是上海新中产阶级的典型代表：孙是一名海关职员，姚则在一家保险公司工作（图4.16）。与中国旅行社相比，友声旅行团为新城市中产阶级提供旅行服务。20世纪20年代，随着越来越多的旅行爱好者游历中国各地，友声旅行团迅速发展。20世纪20年代，友声旅行团开辟了前往长江三角洲风景名胜的旅行线路。从上海到苏州、无锡、嘉兴、湖州和莫干山的路线变得非常受欢迎。279 1929年8月，友声组织了一次乘飞机前往首都南京的旅行，这是中国第一次团体航空旅行。280 同年，友声还组织了800多名游客乘旅游巴士参观杭州西湖博览会。281 20世纪30年代，一次途经山东省前往北京华北之旅吸引了六十多名成员。在中日战争之前，友声总共组织了大约八次华北之旅。1934年，友声开辟了一条前往华南的新路线，并从中国招商局轮船公司租了一艘新旅游船。友声在20世纪30年代还推动了海外旅游。282"}, {"type": "text", "text": "一些业余摄影者大多常驻上海及周边地区，积极从事旅行相关图像和文字的发表。中国旅行社的《旅行杂志》（Lüxing zazhi 旅行雜誌）和友声 produced by Unison 的《友声旅行月刊》（Yousheng luxing yuekan 友聲旅行月刊）等流行旅游杂志和画报，经常刊登著名摄影师拍摄的旅行照片。283 20世纪30年代，华社的许多成员，如陈万里、郎静山、张珍侯和郭锡麒，向旅行社提供了大量他们在风景名胜地拍摄的照片（图4.17）。"}, {"type": "text", "text": "1927年，同声旅行团设立了专门的摄影部。一张1927年在杭州灵隐寺拍摄的照片展示了一群约二十五名男性游客（图4.18）。中央那位身着西装的男子坐在石头上，直视镜头；组中大多数成员身穿长袍，一些年长者拄着手杖。与骆伯年为其小型知识分子群体拍摄的合影相比，这个全男性游客群体呈现出更为统一的外观。这张照片选自一本名为《美丽的杭州》的相册。大部分照片由华社的邵臥雲拍摄，此外还有金性初和董漢槎。"}, {"type": "text", "text": "1931年，同声旅行团成员的首次旅行摄影展在上海南京路的一家商场举行。除旅行团的组织者姚元干外，华社的两位业余摄影师邵臥雲和郭锡麒也积极参与了展览。展出的照片超过200幅，包括在江苏、浙江、江西和山东等省，甚至印度、日本和泰国拍摄的照片。1931年的《中华图画杂志》刊发了张珍侯、郭锡麒、陈传霖和周瘦鹃的若干精选照片。苏州天平山的怪石、泰山的远眺以及龙华塔的独特视角都是在此次旅行中拍摄的，与雾气迷蒙的风景和以“模糊”画意效果为特征的传统画意摄影形成了对比。284"}, {"type": "text", "text": "20世纪30年代，一些业余摄影师一方面积极参与艺术社团、展览和出版活动，另一方面也投身于通俗摄影实践，例如为游客制作风景名胜相册。华社的创始成员郭锡麒运用其开创性技术，为同声旅行团制作了精美的摄影集。他的《南京影集》收录了一系列在中山陵、明孝陵、总统府及其他几处历史遗迹拍摄的照片（图4.19.1；4.19.2）。《南京影集》以黄色丝绸装帧，采用照相凹版技术在英国印制，还被南京政府用作外交赠礼。受同声旅行团委托，郭锡麒在普陀山拍摄了一系列照片。他的照片展现了佛教建筑在壮丽景观映衬下的宏伟气势，突出了超越时间的品质和内在的精神气质（图4.20）。"}, {"type": "text", "text": "旅行相册和宣传册中的一些照片不仅推广了旅游景点，也突出了现代生活方式。休闲和度假作为旅行摄影的主要题材，构成了业余摄影，这是民国时期新中产阶级中流行的一种消遣。普陀山（Putuo shan 普陀山），即所谓浙江省的海天佛國（Haitian foguo 海天佛國），是中国佛教四大名山之一，成为旅游目的地，让游客得以欣赏美丽的山峦、佛教历史和浴场沙滩。与纪念碑式的风景表现不同，大众媒体中的许多民间旅行快照提供了一个机会，让人看到一处历史遗迹在民国时期如何被改造成旅游景点。1929年，《联益》推出了普陀专号，充分展示了雄伟的山峦、优雅的佛教建筑和长长的沙滩。在一篇导论文章中，沈杏初（Shen Xingchu 沈杏初）描述了千步沙浴場（Qianbusha yuchang 千步沙浴場）的宏伟与平缓，并配有一张从远处俯瞰的照片。285 郎静山也拍摄了一张照片，以展示普陀海边的宁静，那里有几位游客在沙滩上行走和躺卧。286 20世纪20年代后期，日光浴只在西方游客中流行。1929年，英文报纸《大陆报》（The China Press）更详细地描述了普陀山的浴场，并极力推荐其作为度假胜地。287 直到20世纪30年代，中国大众媒体才开始将海边日光浴宣传为一种现代休闲活动。"}, {"type": "text", "text": "20世纪30年代，上海、浙江和青岛的海滩作为休闲资源得到开发。正如柯达广告所宣称的那样：“没有柯达的假期是浪费的假期。”海滨度假成为业余摄影中的热门题材。1933年《良友》发表的一张照片《去海滩》，描绘了几位身穿泳衣和旗袍的女性走在青岛的海滩上。《中国柯达》中的“柯达游记”（Keda youji 柯達遊記）专栏刊登了许多在海滨拍摄的旅行照片。1932年的一期《中国柯达》推广了用于海滨快照摄影的布朗尼相机。288 当便携式相机的引入与新中产阶级中现代休闲活动的兴起同时发生时，他们涌向海滨，记录自己的回忆并庆祝聚会时刻。海滨摄影的流行也与民国时期的人体表现密切相关。陈炳德成功捕捉了现代中国女性——包括一些女学生和电影明星——如何在沙滩上享受日光浴和美丽风景（图4.21）。"}, {"type": "text", "text": "手持相机的流行与民国中国的休闲旅行相伴而行。对灵活性、便携性和快速对焦的强调，促使更多旅行者在户外活动中携带手持相机。人们拍摄旅行照片，以保存和庆祝那些与日常地点和时间相分离的时刻。离开熟悉的地点后，业余摄影者使用手持相机随时记录和庆祝这些时刻。通过摄影观看正在兴起的新民国及其风景和人民的愿望，驱使业余摄影者去探索未见和未知的土地。4.3 宏大的旅行与面向公众的教育"}, {"type": "text", "text": "除了前往风景名胜的休闲旅行之外，越来越多的中国知识分子推动了一种遍游全国、以探索民国文化景观为宗旨的旅行潮流。陈万里是一位先驱性的中国摄影家，对考察文化遗产有着浓厚的兴趣。他拍摄了一系列照片，展现了1925年北京大学专家和学生如何检视并整理故宫中的珍宝（图4.22）。末代皇帝溥仪于1924年11月5日被迫离开皇宫，一年之后，紫禁城成为一座公共博物馆。289在此期间，陈万里运用精湛的摄影技术，以一位本土知识分子的视角展现了一个行将消逝却尚未死去的世界，标志着紫禁城从皇家宫殿向公共博物馆的重要转变。1924年在紫禁城拍摄的这些照片被收入相册《民十三故宮》，并最终于1928年出版。2901926年，陈万里在紫禁城拍摄的照片在上海展出，随后发表于《圖畫時報》。291若干张皇后寝宫、宫女和老太监的照片，首次以一种前所未有的方式呈现在观众面前（图4.23）。尽管在国民党和共产党统治下命运不定，这些历史上曾经最为神秘的空间仍在持续敞开。"}, {"type": "text", "text": "在殖民扩张的过程中，欧洲人广泛运用摄影术来对“他者”进行分类和重新界定。照片由此成为一种“文化与法律权力”的形式。29220世纪初，由英国人奥雷尔·斯坦因（1862—1943）、法国人保罗·伯希和（1878—1945）、德国人阿尔伯特·格伦威德尔（1856—1935）、阿尔伯特·冯·勒柯克（1860—1930）、瑞典人斯文·赫定（1865—1952）、日本人伊东忠太（1867—1954）等人率领的考察队，在中国西北边陲、西藏以及中亚其他地区的探险中取得了重大发现。20世纪初的一系列中国之行，推动了中国形象在世界舞台上的全球性转变。293除了民族志式的凝视和中日战争的压力之外，从20世纪20年代中期到40年代，许多中国知识分子旅行者和学者踏上了类似于17至19世纪欧洲贵族所进行的“大旅行”的考察之旅。通过聚焦于来自欧美、日本和中国的探险家、学者和业余摄影者所创作的旅行著述、速写、插图游记以及一些题签照片。旅行文献中的文字与图像不仅与民族国家建设项目交织在一起，还开拓出一种在1925年至1945年间各种跨文化相遇中重新构想中国的新方式。"}, {"type": "text", "text": "中国知识分子的边疆“壮游”（Zhuangyou 壯游）始于中外联合科学考察。1925年，兼具摄影师与考古学家双重身份的陈万里参加了由美国人兰登·华尔纳（Langdon Warner，1881—1955）率领的考察队进行科学调查。除翻译工作外，他还对敦煌石窟进行了自己的研究，并对中国西北地区的地方风俗习惯作了一些观察。陈万里游记《西行日记》的扉页上刊登了一张由同事拍摄的照片，图注为“敦煌途中之著者”（Dunhuang tuzhong zhi zhuzhe 敦煌途中之著者）。照片中，陈万里的知识分子形象——眼镜、中山装和便携相机——与破旧的马车和乡村环境形成对比；唯有他脚上穿的靴子暗示了旅途的艰辛（图4.24）。陈万里将这张照片置于游记首页，标志着壮游的新开端。考察队从北京出发，经太原、西安、兰州，经由甘肃省进入敦煌。陈万里从本地视角对文物进行了文化调查。在太原，他拍摄了图书馆中的碑林和弥勒像；他还拍摄了敦煌千佛洞的景观。这些旅行照片于1925年在北京大学国学研究部门展出，其中一些在苏州和上海展出，开创了中国观察和再现文物的新方式。294 响应五四运动后北京正在兴起的国学研究运动（Guoxue yundong 國學運動），知识分子决心在民族国家建设过程中追求对器物和文物的新理解。"}, {"type": "text", "text": "陈万里在西北的学术努力得到了刘半农的赞扬，后者于1925年刚从巴黎索邦大学毕业。1921年至1925年在伦敦和巴黎求学期间，刘半农在伦敦见到了斯坦因收集的敦煌文献，在巴黎见到了伯希和收集的敦煌文献。他甚至亲手抄录了法国国家图书馆所藏的敦煌写本，并将它们带回中国。这些抄本于1925年出版，书名为三卷本的《敦煌掇琐》。295"}, {"type": "text", "text": "与敦煌文献的历史性相遇促使刘半农致力于保护文物，而对边疆风貌的关注也转化为对中国主权的声张。1927年，瑞典旅行家斯文·赫定率领一支探险队再次造访中国，此前他在20世纪之交已三次穿越新疆的戈壁沙漠和西藏的喜马拉雅山脉。在德国汉莎航空公司的资金支持下，他希望考察开辟一条从柏林经乌鲁木齐至北京的汉莎航空航线的可能性。赫定的意图和计划受到北京学者的质疑。刘半农作为该委员会负责人，与赫定在多个方面进行了谈判。经过四十天的详细谈判，中方委员会与赫定签署了最终合同，五名中国学者和五名学生加入了探险队。296合同规定，他们在中国收集的文物必须留在中国，照片和科学数据只有经中方委员会许可后方可发表。"}, {"type": "text", "text": "1927年至1935年，由赫定和中国方面团长徐旭生（1888—1976）率领的中瑞西北科學考察團在中国北部和西北地区进行科学研究。徐旭生写有一部游记《徐旭生西游日記》，书中附有旅途中的旅行照片。这部日记记述了徐旭生在蒙古、戈壁沙漠和新疆的发现与观察。得益于摄影的记录能力，徐旭生及其团队广泛记录了他在考察期间的观察。摄影师拍摄了蒙古用气球进行气象实验、骆驼在沙漠中行进以及考察队中的医生为蒙古病人治疗等影像（图4.25）。这些照片探索了摄影作为科学工具的可能性，并拓展了其边界。"}, {"type": "text", "text": "“大旅行”穿越中国的理念与国民政府的边疆政策是一致的。在巩固国家权力之后，政府日益关注中国西北地区，尤其是日本帝国主义在满洲和蒙古的威胁，以及英国在西藏和中国西南边境的活动。西北地区，包括陕西、甘肃、青海、新疆和蒙古，是中国最不发达的地区。国民党政治家兼记者戴季陶（1891—1949）主张西北诸省可以免于战乱，建设必须加快。297 为了考察西北，北京、南京和上海成立了一系列学会和组织。例如，北京的西北协社、西北公学社，南京的开发西北协会，以及上海的西北公论社。298“开发西北”是国民政府发出的强烈号召，敦促爱国人士前往这些地区兴办实业、开垦定居。"}, {"type": "text", "text": "照片在揭示20世纪中国的国家认同方面一直不可或缺。摄影在描绘和视觉化新国家边疆方面发挥了重要作用，并伴随着开发边疆的热情。299 1934年，庄学本（1909—1984）随国民政府代表团前往成都，为十三世达赖喇嘛的去世致哀。他希望加入国民政府前往拉萨的代表团，但请求被拒绝。遭遇这一挫折后，庄学本并未返回上海。相反，他决定在1934年5月考察果洛，一个位于青海和四川交界处、被称为“白地”的地方。他前往灌县、汶川、茂县、理番、阿垻，然后进入果洛。300 这次为期六个月的果洛之行，也标志着庄学本长达十年的西部边疆考察的开始。庄学本将这一计划与国民政府开发西北的运动联系起来，声称果洛是“西北的腹地”，因此首先需要了解果洛，“以便开发整个西北”。301"}, {"type": "text", "text": "庄学本自20世纪20年代末在上海一家外国公司工作时起，便是一位自学成才的摄影师。后来，他成为《申报》和《良友》的记者。庄学本从艺术摄影起步：他在上海时期的大量照片代表了他在这一领域的成就，随后他转向带有浓厚人文情怀的纪实摄影，构建出一种宏大的人本主义视野。他配备两台便携相机，一台禄来和一台蔡司超级伊康泰，记录了从南京沿长江前往成都、再向西前往果洛的旅程细节。除旅行摄影外，他还拍摄了一系列土著羌族的人种志肖像，进一步为构建新的边疆形象作出了贡献。"}, {"type": "text", "text": "如果我们把达盖尔银版法和卡罗式摄影法视为第一代摄影技术，把约翰·汤姆逊所使用的湿版（火棉胶）玻璃底片视为第二代摄影技术，那么第三代便是19世纪60年代末干版和胶片的出现，而在19世纪90年代前后，当柯达于1889年发明现代赛璐珞胶片时，这一技术得到了充分发展。302 庄学本所使用的手持相机具有抓拍和快拍的优势。如果将庄学本1934年拍摄的照片与约翰·汤姆逊及其他19世纪欧美摄影师在19世纪60年代所拍摄的如画般的宏大风景和民族志肖像相比，便不难发现，摄影技术的进步使静态照片转变为更贴近生活、也更能承认原住民主体性的图像。"}, {"type": "text", "text": "手持相机帮助摄影师捕捉旅途中的运动瞬间。手持相机所带来的即时性、偶然性和自发性，从根本上改变了摄影师观看和处理拍摄对象的方式。庄学本沿岷江旅行，岷江是长江上游的一条支流。20世纪30年代，中国西部边疆地区的交通尚不发达。303 一幅特写捕捉到一名羌族青年用绳索过河的瞬间，身后的波浪翻滚，白色水花飞溅（图4.26）。庄学本运用多种视角，拍摄了一系列照片，描绘原住民如何用绳索或在急流之上的吊桥过河。"}, {"type": "text", "text": "除了快速连续拍摄照片之外，庄学本还沿江拍摄了许多壮观的风景照片。他以极大的胆识和眼光描绘了汶川县的飞沙关。他还运用开创性的技法捕捉了威州的宏大景观，威州是位于汶川东北部的一座城镇。他采用鸟瞰视角，向观者展现岷江的壮丽，包括散布在沿江山丘间的羌族村寨（图4.27）。庄学本试图以宏大的气派和丰富的细节创造壮丽的边疆景观，展现出画意摄影风景与文人风格之间的对照。"}, {"type": "text", "text": "与此同时，手持相机也是民族志工作中一种有价值的工具。自1839年摄影术发明以来，族群观光成为一种重要的窥视性体验，许多探险家和摄影师拍摄族群对象，以满足他们观看遥远土地上“陌生人”的好奇心。宏大的风景和民族志肖像照是19世纪旅行摄影的主要题材。在19世纪，中国人是欧美摄影师的族群拍摄对象。约翰·汤姆森（1837—1921）是一位苏格兰摄影师，他广泛游历中国，从南方的通商口岸香港和广州，到北京和上海等城市，再到北方的长城，并深入华中地区。1870年至1871年，他访问了福建地区，沿闽江而上，随后又访问了厦门和汕头。旅行期间拍摄的照片收录于相册《中国与中国人影像：附代表性地点与人物文字说明的两百幅照片系列》，该相册于1873年至1874年间分四卷出版。约翰·汤姆森的照片不仅捕捉了从条约口岸到长江沿岸中国内地的风景名胜，还根据年龄、性别、族群和职业特征确立了中国人的“类型”。他拍摄的照片体现出一种与停滞和隔绝密切相关的永恒质感。"}, {"type": "text", "text": "柯达相机的发明为民族志研究带来了新的可能性。操作简便、对焦快速和廉价胶卷使手持相机能够在原住民可能未察觉的情况下捕捉多重影像，记录其日常生活中的连续片段。304 庄学本前往果洛旅行时拍摄了大量呈现羌族日常生活经验照片。例如，他展示了他们如何运送茶叶和药品、耕种田地、在市场上经商；他还在他们用竹管“咂酒”（咂酒）时拍照，这是羌族的传统（图4.28；图4.29），以及他们身着传统服饰举行宗教仪式时拍照。他以不引人注目的方式展示劳动、生活、典礼和仪式等场景，试图表现原住民可以无视摄影师在场的日常情境。与具有标准姿势和格式的人体测量照片相比，手持相机拍摄的照片更接近拍摄对象所过的生活。305"}, {"type": "text", "text": "庄学本的摄影实践开启了中国民族志摄影的新篇章。在这些照片中，他们经历了一种转变，从被观看的对象转变为拥有自身欲望的主体，通过周围的世界观看自我。他20世纪30年代的旅行照片不仅展现了沿河行进中的景观，还通过描绘原住民的日常生活展现出一种人道主义视野。"}, {"type": "text", "text": "旅行照片不仅构建了旅行者之所见，也塑造了观看和理解的方式。总体而言，旅行摄影一直被视为视觉与知识的结合。306 许多文章指导业余爱好者如何在旅行中使用手提相机拍照。 Chinese Kodakery 中一个持续开设的专栏“柯达旅行”展示了业余摄影师的众多旅行照片。当便携式相机普及后，观光与摄影自然而然地紧密联系在一起。许多相机广告将历史遗迹的照片与相机并置，表明一种新的旅行观念，即带着相机旅行，随着新中产阶级的兴起而出现。从风景名胜到历史遗迹，这些旅行照片被 Chinese Kodakery 宣称为在业余爱好者与地点之间建立联系的必要背景。"}, {"type": "text", "text": "1932年1月， Chinese Kodakery 发表了金世盛在青岛拍摄的一组旅行照片。作为同济大学土木工程系的一名大学生，他到青岛的工厂进行了一次实地考察。这些照片描绘了青岛交接纪念亭、天后宫、海滨公园和水族馆等著名旅游景点（图4.30）。307 在 accompanying the photographs 的题为《青岛一瞥》（Qingdao yipie 青島一瞥）的游记中，他介绍了海滨建筑的历史和城市布局的知识。在赞扬德国在城市规划和基础设施方面的遗产的同时，也表达了他对第一次世界大战后日本占领的沮丧。"}, {"type": "text", "text": "旅行照片和文章为民国时期旅游业的发展提供了线索。长城、西湖、泰山和黄山是民国初期最受欢迎的旅游景点。1914年，教育家兼政治家黄炎培（1878—1965）拍摄了许多黄山的照片，这些照片部分收录在名为《中国名胜第一种：黄山》（Zhongguo mingsheng diyizhong Huangshan 中國名勝第一種：黃山）的相册中。自1914年起，《中国名胜》系列依次出版了黄山、庐山、普陀山、西湖和武夷山。1915年，《中国名胜》系列在旧金山巴拿马太平洋万国博览会上作为礼物赠送给美国。"}, {"type": "text", "text": "旅行照片、纪念照片和旅游手册都是向更广泛受众传播民国中国知识的途径。一些具有特定主题的画册被出版以促进地方旅游业。1935年的《东南揽胜》（Dongnan lansheng 東南攬勝）和1939年的《西南揽胜》（Xinan lansheng 西南攬勝）是两个例子。《东南揽胜》收录了多位知名知识分子、画家和摄影师提供的照片和文字。在黄山的游记中，造诣深厚的传统画家黄宾虹（1865—1955）撰写了一篇长文描述黄山之旅，而陈万里、蒋炳南则以画意摄影语言贡献了一幅描绘山间溪流的照片。"}, {"type": "text", "text": "《东南揽胜》由东南交通游览宣传委员会编辑，这表明该指南不仅意在介绍东南地区的风景名胜，也旨在宣传南京政府在交通方面的成就。308《西南胜景》于1939年出版。郎静山贡献了大量他在四川拍摄的照片，当时他因中日战争爆发而流亡入蜀。他于1939年和1941年在上海举办过两次展览，展出了1937年沿海遭轰炸后他逃往四川时在西南地区拍摄的照片（图4.31）。这些在边疆拍摄的照片不仅表现了风景，也传达了战前和战时普遍存在的爱国热情。"}, {"type": "text", "text": "1932年9月至1933年5月，《良友》杂志开展了首次全国性的摄影考察活动——良友全国考察团（Liangyou quanguo kaocha tuan 良友全國考察團），在动荡不安和交通极为困难的条件下，对从黄河流域到长江流域及西南各省的历史、文化和民生进行了摄影调查。考察团由《良友》主编梁得所（1905—1938）以及欧阳璞、司徒荣等数名摄影师组成。他们从南京、山东到西北中国，用相机记录和记载了整个旅程，然后将照片寄回上海。摄影成为此次考察的核心部分。考察结束后，良友图书印刷公司在上海、南京、北京、汉口等数座城市举办了摄影展览，展出了从数千张照片中遴选出来的作品。309"}, {"type": "text", "text": "对中国风景与历史遗迹之图像的制造，无疑具有政治或意识形态意义。除展览之外，良友出版公司于1934年推出了一部名为《中国风貌：一部综合影集》（Zhonghua jingxiang 中華景象）的综合影集（图4.32.1）。民族主义解读的倾向在其中文前言中有所体现：“中国正处于民族生存的关键时刻，但很少有中国人了解实际的国情与民生。”编者希望这部影集能够弥补地方志和游记的不足，为民族复兴的目标作出贡献。"}, {"type": "text", "text": "尽管带有民族主义情绪，在该影集的英文前言中，编者仍然强调这部影集是“阐释与解读——而非宣传”。310 这部影集由数千张照片组成，涵盖民国时期全国巡游期间二十八个省的风景与重要遗迹。这些照片涵盖了二十八个省（包括自1931年起被日本占领的满洲）的风景与遗迹，展示了中国摄影师如何通过摄影这一新媒介来表现这个新国家。"}, {"type": "text", "text": "摄影实践是这部影集的核心。编者有意挑选了二十张照片进行放大和上色，突出了一系列旅游景点，包括北海公园、白塔、钱塘江和桂林（图4.32.2）。这部影集中的第一张彩色照片是一张合影，展示了团队中的四位摄影师以及团队的旗帜（似乎是手工添加的），他们全都站在甘肃省的巨石佛像前。各省旅游景点的照片均附有中英文介绍。这部影集展现了描绘和发现国家风景的独特视角，开启了民国时期文化考察的新时代。"}, {"type": "text", "text": "第二次中日战争爆发后，文化考察仍在继续。王子云（1897—1990）在重庆组织了几位艺术学者和学生——他们被迫迁入中国内地——组建了一支团队，在国民政府教育部的支持下考察中国西北地区的文物和文化遗产。1940年至1945年间，该团队大量运用摄影，建立起四川、陕西、河南、甘肃和青海各省历史古迹与文物的系统性照片档案。这些照片被汇编成十卷本相册《教育部艺术文物考察团西北摄影集》（教育部藝術文物考察團西北攝影集）。311 相册中的照片系统地展示了一系列单体对象，细节和信息丰富（图4.33）。教育部艺术文物考察团还在西安、重庆和兰州举办了数次展览，展出中国西北地区的文物和敦煌临摹品，这激发了战时公众复兴“民族艺术”（minzu yishu 民族藝術）的愿望。312"}, {"type": "text", "text": "摄影术的发明为塑造国家景观图像提供了一种新手段。民国时期的业余摄影师运用摄影来描绘一个新民族国家的边界，其背后是一种界定中国身份的愿望。313 通过表现20世纪30年代和40年代充满政治意味的景观，摄影为建构和强化民族话语作出了重大贡献。除了景观感知方面的美学发展之外，这些照片还显示出政治或意识形态意涵。"}, {"type": "text", "text": "便携式相机市场的繁荣与民国时期休闲旅行、文化考察和国民旅游的兴起并驾齐驱。不同类型的记录——艺术摄影、旅行快照和民族志照片——共同构成了业余摄影师流动的摄影档案，以及现代中国的便携景观。"}]}, {"id": "ch5", "title": "Chapter 5 · Reconfiguring Realism", "paras": [{"type": "title", "text": "第五章 · 重构现实主义"}, {"type": "text", "text": "第五章：重构现实主义：变革中的画意摄影与新视野 导论"}, {"type": "text", "text": "除了作为业余爱好和休闲活动之外，一些业余摄影师将摄影视为严肃艺术。在20世纪20年代和30年代，摄影作为一种西式艺术形式，通过许多中国业余摄影师对传统风格水墨画的挪用与改造，得到了认可并获得了合法性。业余摄影师的努力拓展了摄影表现的边界，丰富了中国现代艺术的语汇。除了对传统绘画的挪用之外，一些严肃的业余摄影师还通过关注光影的图案化、构图和氛围效果来展现摄影的艺术品质。对摄影中形式美感的审视，表明人们对摄影的理解出现了突破。"}, {"type": "text", "text": "与此同时，与现代化主义相关的拼贴、照片蒙太奇和设计摄影提供了一种新的视角，用以表现日益工业化的现代世界。那些以锐利焦点呈现机械物体、建筑和植物的照片，突显了与画意摄影的对比，揭示了相机以完全客观的方式表现世界的能力。"}, {"type": "text", "text": "陈万里在1924年出版的首部摄影集中热情地主张，摄影不仅仅是一种机械制作，更是一种将主题、构图与光线融为一体的艺术创造。314值得注意的是，在他的文章中，摄影已被提升至“艺术”的地位，而非一种技艺或技术。1923年11月的《时报》上的一篇文章宣称，“美术摄影”（Meishu sheying 美術攝影）是一种新的美术门类。31520世纪20年代，华社成员胡伯翔指出，美术摄影不仅追求真实的再现，还强调艺术品质。316正如欧阳慧锵1923年在《摄影指南》（Sheying zhinan 攝影指南）中所言，美术摄影与新闻摄影等其他门类相区别之处在于“画意”（Huayi 畫意）。从传统画论的角度出发，著名保守派知识分子康有为（1858—1927）对欧阳慧锵照片中所呈现的“画意”表示赞赏。317"}, {"type": "text", "text": "自20世纪30年代初起，摄影原本被视为一种西式艺术形式，却通过借鉴传统水墨画而实现了本土化。关于美术摄影的讨论试图发展出一套本土摄影语汇，而业余摄影师的努力则拓展了摄影表达的边界，丰富了中国现代艺术的语汇。刘半农也为摄影理论做出了巨大贡献。他的长文《摄影谈》深入探讨了将摄影技术与中国传统艺术精神相联结的问题，分别提出脱离机械性与引入艺术精神，从而将画意摄影与传统风格绘画联系起来。31820世纪30年代，“画意摄影”（huayi sheying 畫意攝影）与“艺术摄影”（yishu sheying 藝術攝影）这两个相似的术语被用来指称区别于纪实风格的更广泛的风格。319"}, {"type": "text", "text": "20世纪20年代和30年代的一批艺术摄影师成功地再现了一个知识世界的审美感受力。在艺术实践方面，光社和华社成员所拍摄的美术摄影作品以柔焦和暗房技法为特色，营造出一种能够抵消任何机械效果的审美氛围。这一时期最具代表性的艺术摄影师是刘半农。他在20世纪20年代初于巴黎学习语音学期间自学成为业余摄影师，回国后便致力于艺术摄影。刘半农20年代的作品以柔焦、影调范围有限以及诸如重铬酸胶和溴素油等特定技术方法而闻名，这些方法在19世纪末20世纪初被许多试图将摄影提升为美术的欧美摄影师广泛采用。"}, {"type": "text", "text": "这幅以重铬酸盐胶和溴釉工艺制作的《池塘月色》照片，呈现出一片梦幻般的风景，树影倒映其中（图5.1）。摄影师借鉴了欧美画意摄影的幽暗阴影以及早期银盐工艺，使影像色调浓烈、层次丰富。微弱的晨光汇聚于云层、如镜的水面映出桦树枝条、远处郁郁葱葱的森林等画意元素，共同营造出唯美而感伤的氛围。照片左下角还标有刘半农的个人签名与题识。刘半农的这幅照片与美国画意摄影家爱德华·斯泰肯（1879—1973）1904年的作品《池塘月色》遥相呼应。两位摄影家都运用高超技巧描绘光与影、空间之间的关系，营造出如画般优美静谧的氛围。斯泰肯作品中的月光象征着欧美画意摄影的最后阶段，而刘半农作品中的晨光则表明摄影作为一种新的艺术形式在中国已被广泛接受。"}, {"type": "text", "text": "刘半农的这幅作品继承了欧美画意摄影运动的艺术品质，并开启了摄影作为一种新艺术形式的无限可能。它还具有20世纪20年代中国摄影中流行的“朦胧”风格。这幅照片也为中国摄影史上一个长期被遮蔽的问题提供了新的视角：中国的画意摄影或艺术摄影究竟是欧美画意摄影运动的遗产，还是从本土文化语境中新生出来的事物？1923年，刘半农在巴黎留学期间“买了一架小型手提相机来玩”，并接触到大量现代摄影展览和杂志。320与20世纪二三十年代大多数留学法国的中国艺术家一样，他并没有追随现代主义运动，而是更关注艺术摄影的源头——画意摄影。尽管画意摄影运动在20世纪初的欧美已经衰落，但它在中国经历了第二波浪潮。回国后，刘半农加入了北京的“光社”，并成为致力于推动艺术摄影的主要成员之一。刘半农将欧美画意摄影的唯美主义与中国传统画论中的意境联系起来，使画意摄影有可能在本地文化环境中被广泛接受。"}, {"type": "text", "text": "刘半农所运用的美学品质和开创性的暗房技巧，启发了下一代艺术摄影家。在这些艺术摄影家中，郎静山的集锦摄影直接将画意摄影与国际舞台上对民族身份的追求联系起来。事实上，郎静山在20世纪20年代末探索了多种风格，但最终在20世纪30年代确立了自己的标志性风格。郎静山1929年的摄影集《静山摄影集》（Jingshan sheyingji 靜山攝影集）收录了他早期的摄影作品，题材多样，从城市建筑到家庭环境均有涉及。他在1940年的小册子《集锦照相概要》（Jijin zhaoxiang gaiyao 集錦照相概要）中创造了“集锦照相”（composite photography 集錦照相）这一术语，并在1941年首次出版的《静山集锦作法》（Jingshan jijin zuofa 靜山集錦作法）一书中进一步解释了制作集锦摄影的方法。321在一系列关于集锦摄影理念与方法的文章中，他解释说，集锦摄影的制作基于中国传统绘画的理念。面对一片想象中的风景，他根据谢赫（479—502）提出的“中国画六法”来调整空间与构图。322"}, {"type": "text", "text": "郎静山的画意摄影以朦胧的山水和游荡的乡民为特征，运用密集的暗房技法，将片断的文人画母题拼合成一幅仿效传统水墨画的影像。他对传统风格绘画的挪用，重新框定了一片看似失落的中国乌托邦山水，通过摄影推崇一个理想化的往昔。面对五四运动中的文化激进主义话语，大多数艺术摄影师既不站在完全保守主义一边，也不站在激进主义一边。作为一位新传统主义者，郎静山竭力将传统意象纳入现代媒介，在往昔与当下、艺术与技术之间展开对话。1934年的摄影作品《春树奇峰》（Chunshu qifeng 春樹奇峰）由两幅原始照片合成。郎静山在前景放置一棵松树，并以连绵山脉作为远景背景（图5.2.1；图5.2.2；图5.2.3）。中景是一片朦胧的山景，被描绘为对传统风格绘画中留白的参照。郎静山的朋友马公愚（Ma Gongyu 馬公愚，1893—1969），著名的书法家、画家、上海美术专科学校教授，为《春树奇峰》题写了书法题跋。照片上的题词赞美黄山的壮丽和郎静山精湛的技艺。《春树奇峰》是郎静山创作的第一幅集锦摄影作品，1934年被英国沙龙摄影比赛接受，极大增强了他的创作信心。323 另一幅1934年的作品《清江晓汲》（Qingjiang xiaoji 清江曉汲）与绘画更为相似，由两幅照片合成。郎静山运用更为精妙的暗房技法，将片断影像——前景的树枝、中景的渔夫和远处的朦胧山峦——纳入一幅具有平面透视的完整画面（图5.3）。两幅照片中的大量空间被隐入留白，光影被抹去，这表明摄影师试图创作一幅仿效文人画的影像。"}, {"type": "text", "text": "郎静山所捕捉的渔夫生活瞬间，是对剧烈变迁的一种特定回应：大多数中国人的日常生活与现代化相隔绝，内在稳定与自给自足的结构并未被完全摧毁。画意摄影所展现的日常生活的诗意情感，与19世纪殖民摄影的题材形成了鲜明对比。这一对比恰恰指向郎静山及其同代人所追求的地方文化的艺术品格。自20世纪初以来，与都市喧嚣相隔绝的画意风景摄影一直被视为对工业化城市景观的抵抗。郎静山的画意摄影不仅展现了山水的静谧与微妙，还营造出一种可被解读为异域风情的神秘氛围，成为19世纪殖民摄影的延续。"}, {"type": "text", "text": "郎静山擅长从日常生活中捕捉富有韵律和美感的瞬间。然而，这种写实手法在20世纪30年代中期逐渐转变为一种固定模式，名为“集锦照相”（jijin zhaoxiang 集錦照相）。在这一模式中，选取若干山水片断，遵循传统绘画的构图，运用精妙的暗房技法，拼贴成与文人画极为相似的摄影作品。正如郎静山在其文章《集锦照相》中所言，制作集锦照片的主要原则是将欧洲的焦点透视转变为中国式的透视，并“经营位置”（jingying weizhi 經營位置）："}, {"type": "text", "text": "中国画采用鸟瞰透视……它"}, {"type": "text", "text": "与人类眼睛观察事物的方式相一致……因此，"}, {"type": "text", "text": "合成摄影的制作也基于……的透视"}, {"type": "text", "text": "（中国）绘画……你可以安排前景、中景"}, {"type": "text", "text": "和每张照片的背景，从而创造出一幅宏大的风景"}, {"type": "text", "text": "通过安排被摄对象的位置。 324"}, {"type": "text", "text": "“相机之眼”指的是机械效果，表明其能够展示世界的视觉准确性与真实性，但郎静山试图超越的正是这种真实再现。325 由西方透视法主导的视觉模式，受到了一种非西方的观看方式的挑战。郎静山不仅恢复了中国山水的传统意象，而且重构了一种本质上属于中国的观看与想象传统中国绘画的方式。"}, {"type": "text", "text": "民国时期的仿古山水摄影，本质上是一种以现代方式趋近永恒与不朽的替代路径，而这种永恒与不朽正是衰落的文人精神的精髓。植根于文人山水画中的感知自然方式，是通过沉思在主体与自然之间建立一种精神联系。尽管技艺精湛，但通过一种新媒介来再现过去，仍意味着不可避免的矛盾与挣扎。郎静山有意识地借助摄影来发展“传统画意摄影”，并将其与国际舞台上对民族身份的追求紧密联系起来。326 20世纪30年代初，他的艺术作品中出现了某种隐约的民族情感。将传统风格水墨画挪用于新媒介之中，表明了对日益逼近的西方化的一种能动回应，以及对殖民遗产的抵抗。正如洛塔尔·莱德罗斯所言，19世纪古物学的复兴重新定义了中国身份，显示了其在世界文化与政治竞争中的优势。327 合成摄影使郎静山在国际沙龙摄影比赛中具有竞争优势。20世纪30年代，他的作品频繁入选日本和欧洲的国际沙龙与展览。"}, {"type": "text", "text": "带有中国传统绘画风格指涉的山水照片，塑造了国际社会对中国的想象。328 画意摄影，或称艺术摄影，表明绘画与摄影之间存在密切联系。对绘画语言的高度依赖，使摄影者无法审视摄影语言的独特性。20世纪30年代的一些画意摄影师固守陈腐观念和程式化表现模式，追随由资深摄影师和鉴赏家所引导的审美范式。"}, {"type": "text", "text": "传统画意摄影的发明与民国时期中国画的革命遥相呼应。与日本画（nihonga）相似——日本画被用来与洋画（yōga，即西方绘画）相对立——“国画”（guohua 國畫）被视为在西方化不断侵蚀的背景下一种革新的“亚洲／东方”艺术形式。329 “国画”是在20世纪10年代和20年代国粹运动的脉络中发展起来的，该运动旨在将中国文化与非中国文化区分开来。330 由于“外来”已嵌入中国身份之中，摄影和雕塑等一些“西式”艺术形式已被吸收改造为本土艺术表达。"}, {"type": "text", "text": "摄影家借用绘画的术语和概念，提升了摄影的地位，并使其作为一门美术获得合法性；画家——既有张大千这样的传统派画家，也有徐悲鸿（1895—1953）这样的西画派画家——将摄影视为科学现代性的象征，采用户外写生（plein air sketching，即在大自然中户外作画 户外写生）等摄影实践来教育上海美术专科学校的学生，这表明摄影正在改变现代艺术家感知和描绘自然的方式。正如顾伊（Yi Gu）所论，照相机被用作户外写生的教学工具，因为相机的取景器可以帮助学生建立更接近西画的构图。331 对摄影的重视和运用表明，现代艺术家和艺术教育者有意鼓励学生改变观察自然的方式，试图在现代艺术界推动写实主义。绘画与摄影的相互影响促成了中国现代艺术的改革与创新。"}, {"type": "text", "text": "除了借用传统绘画之外，一些严肃的业余摄影家还通过关注光影的图案化、构图和氛围效果来展现摄影的艺术品质。对摄影中形式美的审视表明，人们对摄影的理解取得了突破。越来越多的业余摄影家有意识地通过关注光影的图案化、氛围效果和精神意涵来强调照片的艺术品质。1928年，胡伯翔（Hu Boxiang）论述道，构图、光与影在照片制作过程中起着关键作用。332"}, {"type": "text", "text": "华社的重要成员邵卧云于1932年在《中华摄影杂志》上发表《美术摄影略谈》一文，主张“光线”与“构图”是美术摄影的关键因素：“即使某些风景并无特别之处，若摄影者能考虑光线与构图，并运用已发展的科学技法，它就会成为一幅优秀的美术照片。”他以自己的照片《暮泊》来说明如何安排构图：“停泊在港口中的汽船是摄影主体，这一场景摄于日落时分，照片上部的黑云暗示了时间。这张照片中的所有线条都是直的，汽船长长的桅杆衬托着淡淡的云彩，显现出其突出的形态。较短的灯杆使构图不那么单调。汽船被安排在显著的位置，不难看出，这在摄影中起着重要作用，因为读者的注意力应当集中在主体上（图5.4）。”333 邵卧云清楚地阐释了在美术摄影中如何安排主体以获得更好的构图，将摄影技法与画意效果和审美氛围的创造联系起来。"}, {"type": "text", "text": "20世纪30年代业余摄影家如卢施福、金石声和陈传霖等人的努力，促成了中国现代摄影史上题材与风格的多样性。卢施福是上海一位著名医生，也是黑白影社的创办人。卢施福在黄山拍摄的一幅照片，为理解20世纪30年代画意摄影观念的转变提供了很好的参照。这幅照片清晰地展示了从想象性风景向更直接的自然快照的转变。在这幅照片中，他捕捉到一小群旅行者站在松林中欣赏美景的场景（图5.5）。卢施福以写实的方式描绘了前景和中景中高耸的松树——这是中国绘画中一个经久不衰的母题，这与郎静山及另一位传统主义画意摄影家所创作的想象性、概括性风景截然不同。在背景中，他还运用了一种开创性技法来表现云雾缭绕的风景，营造出与文人意趣相呼应的诗意氛围。但松林中旅行者的描绘则暗示着一种直接快照，以纯粹的形式反映了自然。"}, {"type": "text", "text": "休闲旅行的兴起推动了感知自然的转变，而这种新的风景处理方式表明，20世纪30年代的中国正从画意摄影表现向直接摄影过渡。卢施福呼吁摄影爱好者尝试更多题材，这不仅意味着向现实的转向，也意味着自然感知模式的转变。作为旅行与摄影的双重爱好者，他在休闲旅行中拍摄了大量照片（图5.6）。与想象性的风景不同，他更倾向于采用更为写实的方法来捕捉自然环境的节奏与动态。"}, {"type": "text", "text": "金石声既是杰出的城市规划师，又是先驱性的业余摄影师，这种双重成就使他在艺术摄影表达上也实现了突破。1910年，他出生于武汉一个商人家庭，十三岁时得到第一台柯达相机，从此自学摄影。20世纪30年代，他在上海开始了自己的摄影生涯，当时他正在同济大学学习土木工程。1938年，在洪堡基金会的资助下，金石声前往德国学习道路与城市
