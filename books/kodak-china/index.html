e many European-American amateur photographers gathered. John Charles Oswald, a British tea merchant, living in Fuzhou in the late 1880s, held a photographic collection which contained photographs of the social lives and travel experiences of Fuzhou’s expatriate community. In his private collection, a photograph in March 1895 captioned Instantaneous pictures taken by I. Piny could be an instant snapshot captured by Kodak. The candid composition and spontaneous framing––the typical characteristics of amateur shots––offer a private perspective on the social and cultural lives of the foreign community in treaty port China, which illustrates a private version of colonial narratives in the nineteenth century (Fig.1.16).63"}, {"type": "text", "text": "The hand camera, with their sensitive films and faster shutter speeds, enabled both professionals and amateurs to keep pace with and make expressive records of urban life. George Warren Swire was a London-based partner in his family firm, John Swire & Sons from 1904, a prestigious conglomerate with shipping business. 64 Between 1906 and 1940, Swire visited the subsidiaries in China regularly and took many photographs during his visits. He was understandably more interested in the booming marine industry in a port city like Shanghai. Using a Kodak Panorama camera with panoramic negatives (3½ inches x 12 inches), he took a series of panoramic views of the Bund. The Kodak Panorama allowed the operators to take a view of 142 degrees,which was suitable for shooting wide expanses of landscape and architecture.65 Swire took several photographs to record his cruise on the Huangpu River, showing the turbulent waves and broad landscape along the embankment (Fig.1.17). The mobile views contribute to the dynamic and vibrant imagery of the Bund.66"}, {"type": "text", "text": "Beyond Shanghai Bund, Swire’s photographic investigation had been extended into the ports in northern China. As the director of John Swire & Sons, George Warren Swire utilized the camera to record his investigation tour of each subsidiary on the north China coast. In the album China Northern Ports B & S (Butterfield & Swire), he took the photographs in Ningbo in Zhejiang Province, Yangjiaogou and Longkou in Shandong Province where the infrastructures were still in the construction. He also visited Tongku, Qinghuangdao and Fengtian port which was built in 1905. Some photographs represent the coolies and dockers working in the ports (Fig.1.18). These photographs established a systematic visual archive of Chinese port cities in the early twentieth century."}, {"type": "text", "text": "Increasingly, amateurs deployed their cameras as a tool for recording their travel memory and private life. The growing popularity of hand cameras, instantaneous exposures, and commercial film processing transformed the medium of photography from an esoteric practice into a popular pastime among foreign residents. Most snapshots were family photographs. Maude Carrall (1882-1949), the daughter of James Wilcocks Carrall (1849-1902), Commissioner of Customs for the Chinese Imperial Customs in Yantai, also took several instant photographs at a family picnic in Chefoo in the spring of 1902 with her new Kodak, purchased in Shanghai in 1902. A photograph shows Carrall, wearing a beautiful dress and hat, taking photos at the “blossoms” by her Kodak and turning her head to the photographer (Fig.1.19).67 Private social life, family gatherings, the performance of modern women, and the urban landscape: these new subjects in photographs challenged the old visual representations of colonialist photography."}, {"type": "text", "text": "The clubs, which originated from seventeenth-century Britain, offered a private and privileged venue for interaction amongst the emerging bourgeoisie and the aristocracy. The clubs in semi-colonial shanghai essentially transplanted the social hierarchy from their home countries and reconstructed an emulative social environment.68 By the early 1860s, a group of upper-class photographic enthusiasts in the U.S. established the amateur camera clubs as forums for debating artistic standards and disseminating latest information, contributing to the first wave of serious amateur photography. The advent of Kodak increased the popularity of amateur photography.69 Beyond the European-American countries, the amateur photographers in China also developed the camera clubs which continued the conventions of the clubs and societies in their home countries."}, {"type": "text", "text": "Camera clubs emerged in the treaty ports starting the late nineteenth century. In 1889, the China Camera Club (Chinese name: Yingxiang hui 影相會) was the first camera club in China, established by a group of amateur European-American photographers on Jiangxi Road, Shanghai.70 The club members consisted of physicians,engineers, businessmen and legation staffs in Shanghai, who aimed to treat photography not only as a science but also a genre of fine art.71 Alicia Bewicke Little was also one of the members of China Camera Club. She left ten silver plates of the Yangtze Gorges, exhibiting the grand view “which escaped Mr Thomson’s omnivorous camera”.72 The photographic enthusiasts in Shanghai kept the pace with European-American pictorialism in the late nineteenth century, attempting to legitimize photography as fine art through a series of exhibitions, lectures and discussions related to photography. The club provided darkrooms and served as a social platform for their members. In June 1889, they held the first photographic exhibition in Shanghai, with of the College of Physicians, practising in Shanghai. North China Herald, May 27, 1887, 10.60 pieces works by members. According to an introduction in The North-China Daily News, many scenery photographs taken in and around Shanghai were exhibited. The amateur photographers in the club used the bromide process instead of the old-fashioned silver printing, displaying an exquisite softness and tone in the photographs.The essay also mentioned “we regret to see, no example of the popular detective camera pictures shown,” which suggests that pictorialism and darkroom manipulation gained the greatest popularity among the amateurs in the club.73 The photographic exhibition was held regularly at the Masonic Hall, and the committee would award prizes.74 Besides that, the club invited some photographic specialists to give lectures. Mr. W. S.Percival, a photographic specialist, was invited to give a presentation on how to develop photograph on bromide paper.75 The club included the use of their drawing room and darkroom with membership, which was undoubtedly a great benefit for amateur photographers."}, {"type": "text", "text": "Camera clubs offered a glimpse into the leisure life of foreign residents in Shanghai. Their leisure time centred on the clubs of expatriate communities in Shanghai.The most exclusive club, the “Shanghai Club,” attracted the prominent British and American taipans; at the same time, there were many small clubs devoted to boxing,yachting, and even cricket. These clubs had been developed into a public space where they would communicate and amuse themselves. 76 The China Camera Club was engaged in Shanghai cultural activities until 1895 when the president of the club left,and its successor, the Shanghai Photographic Amateur Society, was founded in Shanghai in 1902. 77 The new society continued to hold lectures, meetings and exhibitions on a regular basis for members, and it developed a closer relationship with the city and the turbulent social situation. The annual exhibitions of the society displayed the members’ works featuring a comprehensive view of the city, and one of the lectures exhibited the stereographic images of the Forbidden City during the occupation of the allied forces.78"}, {"type": "text", "text": "The power of photography made expatriates in China more engaged in the changing environment. Charles Ewart Darwent (1858-1924), who was in charge of the Union Church and the founding member of the society, considered Shanghai an ideal place for amateur photographers to take photographs. The dynamic urban environment offered ample subjects and inspired photographic enthusiasts to capture the changes in the rapidly modernizing city. He claimed, “If one can’t find subjects here, one doesn’t deserve to own a five-shilling camera.”79"}, {"type": "text", "text": "Darwent captured many excellent views of the Shanghai cityscape in his guidebook Shanghai: a handbook for travellers and residents to the chief objects of interest in and around the foreign settlement and native city. 80 Accompanied by introductory writings for travelers, Darwent included views of famous sites like the Custom House, the Hong Kong and Shanghai Bank, Tower Hall. He also introduced that the Union Church where he worked was exactly the meeting place of Shanghai Photographic Amateur Society. In the guidebook, he also mentioned some entertainment areas, like the race club. He took many portraits of street peddlers,rickshaw drivers, and ordinary Chinese people (Fig.1.20). He made a portrait of a street peddler against the busy commercial district Nanjing Road, a Buddhist priest standing on a jetty, and a group of local women at a New Year festival gathering in Foochow around the foreign settlements and native city (Publisher Shanghai; Hong Kong: Kelly & Walsh, 1904), np.Road.81 In contrast with the stereotypical colonial imagery in the nineteenth century, he sought to combine the local people with the transforming urban environment at the turn of the twentieth century."}, {"type": "text", "text": "Tea merchants, employees in the Customs, and some travelers made up the community of amateur photographers in Fuzhou. In 1892, a camera club similar to the China Camera Club was established by amateur photographers.82 The founder, Juan Mencarini (1860-1939), who served the Chinese Maritime Customs between 1881 and 1912, delivered a lecture on “Lantern-Slide Making” at the first meeting of the club,introducing the educational significance of lantern slides and the process of making slides from the negatives. Mencarini had been engaged in the activities of Shanghai Amateur Photographic Society starting in 1903 when he took a post in Shanghai. In 1907, he became the president of the society. The society experienced ups and downs over the next two decades. Until 1923, meetings were held at a gathering in the Royal Asiatic Society’s Hall. Juan Mencarini was elected as chair again.83"}, {"type": "text", "text": "The Shanghai Amateur Photographic Society expanded its membership in the 1910s and kept pace with the latest trends in the field. Lectures covered such subjects as hand cameras and cinematography; during World War I, the club showed slides of “Glimpses of Japan”. 84 Juan Mencarini’s photographs were well received by the amateur photographers in the society due to his discovery of the local historical knowledge behinds the works. The photographs of Juan Mencarini were shown at the 1893 Fuzhou club exhibition. One month later, they were exhibited at the Japan News January 22, 1915; The North-China Herald and Supreme Court & Consular Gazette, December 2, 1916.Photographic Society.85 The scenery of Fuzhou and local people were the main subjects of Mencarini’s photographs. Some photographs seem to imitate the style of Scottish photographer John Thomson, who traveled around Fuzhou in the 1860s and 1870s. In a photograph of three local women, two are facing the viewer while the other is standing with her back to the audience. He intentionally designed the poses to fully display the local women’s hairstyles and dresses (Fig.1.21)."}, {"type": "text", "text": "From China Camera Club to Shanghai Amateur Photographic Society, the camera was also deployed as an interactive tool for communicating with the local Chinese photographic enthusiasts. Although most camera clubs were exclusive for the expatriate community in the treaty ports, some upper class Chinese photographic enthusiasts were accessible to some club exhibitions and lectures. In the first China Camera Club Exhibition, Chinese photographic amateur Chan Chin-tung, a relative of the eminent Chinese statesman Li Hongzhang 李鴻章 (1823-1901), also displayed his photographic work garnered specially mention in a report in The North-China Daily News, 1889.86 Alicia Bewicke Little, a member of China camera Club, published a biography of Li Hongzhang in 1903 that contained the photographs and interviews.87 The frontispiece of the book was a formal portrait of Li Hongzhong taken by Alicia in 1896 (Fig.1.22). The participation of the elite Chinese hobbyists shows the dynamics of copresence and the interactions in a hybrid cultural environment. Shanghai Amateur Photographic Society remained active until the 1920s. The pioneering Chinese amateur photographer Lang Jingshan exhibited his work in the society. These camera clubs also emphasized that photography as a fine-art medium, separating their work from commercial photography. The rules and aims of what they established also imparted February 2018, 49-87.the development of local Chinese photographic societies in the 1920s and 1930s, which will be discussed in the next chapter."}, {"type": "text", "text": "As one of the greatest technological innovations in the nineteenth century,photography disrupted the fantasy of China that developed since the eighteenth century through a series of visual representations in porcelain, export paintings, and prints for foreign consumption. Instead, it launched a new period of representing China and Chinese people. From Daguerreotype to hand camera, the increasingly developing technology not only satisfied the desire and imperative of the Europe-American audience to see and explore the East Asian world but enhanced stereotypes through the categorization, control, and transmission of photography."}, {"type": "text", "text": "However, the arrival of Kodak made photography accessible to a broader population, simultaneously created the potential for more and more photographic hobbyists to employ photography for self-expression. Photography accompanied the global expansion of colonization, and amateur photographers witnessed the private moments behind conquest and violence. The use of Kodak within the hybrid photographic milieu marked the beginning of a new era in the visual representation of China."}]}, {"id": "ch2", "title": "Chapter 2 · Revisiting the \"Kodak Moment\"", "paras": [{"type": "title", "text": "Chapter 2 · Revisiting the \"Kodak Moment\""}, {"type": "text", "text": "Chapter 2: Revisiting the “Kodak Moment”: Kodak and the Rise of Amateur Photography in China Introduction"}, {"type": "text", "text": "The slogan of Eastman Kodak Company, “You press the button, we do the rest,” invited more amateur photographers to capture spontaneous moments. The customer-friendly photo-finishing business triggered the enthusiasm of both amateurs and professionals. Alfred Stieglitz commented that the introduction of Kodak was the beginning of the “photographing by the yard” era.88 Despite the fact that most camera clubs in the treaty ports were comprised of expatriate amateur photographers, an increasing number of Chinese photographic enthusiasts emerged in the late nineteenth century as well."}, {"type": "text", "text": "Two decades after the Boxer Rebellion, Some Chinese amateur photographers began to make a dynamic response to the pictorial records made by European-American photographers in China. The gentry elites were the earliest local photographic enthusiasts and amateur photographers.89 Through the dissemination of photographic knowledge, photography, which was an esoteric practice, gradually became a new leisure activity and hobby among the intellectuals, elites, and wealthy merchants. After the 1911 revolution, the society of Chinese rural gentry disintegrated and the gentry groups shifted to the cities to form an urban elite. 90 The new intellectuals and the emerging bourgeoisie group, the new urban middle class, were the first amateur photographic groups. In the 1920s and 1930s, several Chinese photographic societies and camera clubs, which shared some similarities with the camera clubs of European-American amateur photographers in late nineteenth-century and early twentieth-century Shanghai, emerged and developed as a site of learning, appreciating, and socializing for Chinese amateur photographers.2.1 The Arrival of the “New Camera”"}, {"type": "text", "text": "On March 10 1889, Shenbao (申報) published a piece of advertisement in Chinese to promote the “new camera” (xinshi zhaoxiangjing 新式照相鏡) (Fig.2.1).The picture shows a new camera was held by a woman in a Western-style dress.“Recently a very simple method of photographing has been invented, which even novices can learn easily. This camera can be held in the hands, photographing the trees along the road, farmlands, landscape, and residential areas in a clear way…If you want to purchase it and know the method, please visit Oxford Street, 88, London, UK, or the British Dispensary, Shanghai.”91 The camera in the picture was probably the Kodak original box camera produced in 1888, Rochester, New York. Although the Eastman Kodak Company was American manufacture of photographic materials, its British branch, which was founded in 1885, London, controlled the emerging local photographic market because Britain was the dominant foreign power in China before the first World War (1914-1918).92 The camera advertisement in Shenbao does not even show the name of “Kodak”; instead, it indicates that it was a “new camera” with the illustrations of a Western woman holding the camera. Since the late-mid nineteenth century, the society at large became venerating the West and worshiping the new.93 Promoting and emphasizing the “newness” functioned as a marketing strategy for selling products. The potential and target customers, who were largely made up of studio photographers and upper-class photographic enthusiasts has been looking for the excitement that something new and “Western” brought to them."}, {"type": "text", "text": "Photography was not a native invention for Chinese. In a long time, it was a symbol of the West and imported culture. Since when did Chinese have the “culture imperative” and desire to represent the rapidly changing time and space and express themselves? The “desire to photograph”, Geoffrey Batchen argued that is essentially a demand to arrest the time and still its fleeting nature; the feelings of longing for apprehension the time and space have been transformed into a collective imperative to represent the fugitive nature rapidly and massively.94"}, {"type": "text", "text": "The last decades of the nineteenth century witnessed the influx of Western knowledge in China in various disciplines. A nineteenth-century introductory book on optics named “Optics Updates” (Geshu bu 格術補), written by Zou Boqi (1819-1869)—a Chinese intellectual and a member of Guangdong gentry, explained the basic knowledge of optics and lens based on the optical works translated and compiled by Jesuits in seventeenth-century China. 95 Traditional Mohist optics in ancient China failed to be evolved into geometrical optics that contributed to the concept of camera obscura in seventeenth-century Europe.96 Zou’ s book Geshu bu, which literally means a supplement to the ancient Chinese optics, actually challenged the Mohist optics and explained the fundamental geometrical optics. His experimentation on photography and scientific interest suggests that the Chinese educated class had become aware of new technology and that China needed to make efforts to modernize. 97 A series of photography manuals explained not only fundamental optical knowledge and the laws of the camera but also offered photographic enthusiasts a new perspective for seeing the natural world."}, {"type": "text", "text": "The Self-Strengthening Movement (Ziqiang yundong 自強運動), initiated in the early 1860s and supported by Zuo Zongtang 左宗棠 (1812-1885), Li Hongzhang,and Prince Gong Yixin 奕䜣 (1833-1898), attempted to adopt Western technology and military innovations. Feng Guifen 馮桂芬 (1809-1874), an intellectual in the nineteenth century, formulated a concept “Chinese learning as essence, Western learning as function“ (Zhongxue wei ti, Xixue wei yong 中學為體, 西學為用 ) that was widely accepted by Chinese intellecuals and top officials. 98 The upper-class elites and circulated the knowledge of astronomy, mathematics and physics to the Chinese audience through the cooperation with the local academies of science. The German Jesuit priest and astronomer Johann Adam Schall von Bell (1592–1666) and Chinese scientist Li Zubai 李祖白(?-1665) in the Imperial Astronomical Bureau (Qintianjian 欽天監) complied the book “Speaking of the Telescope” (Yuanjing shuo 遠鏡說) by translating Galileo Galilei (1564-1642)’s articles. Adam Schall von Bell 湯若望, Yuanjing shuo 遠鏡說 (Speaking of the telescope), 1626,reprint of Jiaqing-era (1796–1820) Yihai zhuchen edition (Beijing: Beijing Erudition Digital Research Center,2001–15), 5b–6b, 11a, b.Century up to 1914. London, New York: Oxford University Press, 1955.public announcement of the invention of the daguerreotype process. Although Zou Boqi could barely read English,he still had the chance to know this news. Oliver Moore, “Zou Boqi on vision and photography in 19th century China,” in The Human Tradition in Modern China edited by Kenneth James Hammond, Kristin Eileen Stapleton (Lanham: Rowman & Littlefield, 2008), 33-54. Also see Jennifer Purtle, “Double Take: Chinese Optics and Their Media in Postglobal Perspective,” Ars Orientalis 48, no. 20191029 (August 2018).chubanshe,1994), 77, 84.intellectuals regarded photography as a symbol of modernity, a medium that could be seized to transmit Western knowledge and promote reform in China.99 In 1872, British amateur photographer Thomas Child mentioned a Chinese amateur photographer named Chang How in a letter to his wife.100 Child probably taught photography to the mandarins and rich merchants as a way of networking. In other letters, he talked about another amateur, Yang Fang, a mandarin and a pawnbroker. Child hired him to install gas lighting and work on a water pump at Yang’s residence.101 Child’s friend, the renowned photographer John Thomson, recalled that he, Dr. Dudgeon, and Yang Fang made excursions to the ruins of the old Summer Place, he also recorded that Yang was full of enthusiasm for chemistry and photography, and even had a laboratory in which “the walls were garnished with enlarged photographs of Yang’s family and friends”.102 One of Thomson’s photographs provided a glimpse to see how the upper class in China embraced photography (Fig.2.2)."}, {"type": "text", "text": "Chinese elites and intellectuals had started to embrace photography as a part of advanced Western technology and a symbol of modernity. Before the birth of Kodak,cumbersome photographic equipment and complex shooting and processing processes made photography exclusive to specific professional populations and upper-class society. Even though photography was a complex technical practice, the elite members in the mid to late nineteenth century started to regard photography as a way of recreation.Since the 1870s, some foreign companies, photography studios, and suppliers in the treaty ports became the main agents to sell photographic equipment in China. Some of them even established private courses for their customers as a commercial strategy to promote their photographic equipment. And their target customers were not exclusive to Chinese. For example, an advertisement of Shanghai foreign company Way de le (會地理洋行) published on Shenbao in 1873 suggests that if Chinese customers wanted to learn photography, the manager would teach them personally. 103 Since the 1860s,taking photographs was more profitable than making the portraits, so many studios were established in the treaty ports, and the new photographers became the target customers of the foreign photographic suppliers. However, an advertisement of Way de le in 1883 indicates that not only the studio photographers wanted to learn photography, but also some “gentry and merchants” wanted to take photographs for self-entertaining:"}, {"type": "text", "text": "We have now opened a photography class, which provides skills of taking"}, {"type": "text", "text": "portraits, developing photos, and using chemical materials. (Our class is"}, {"type": "text", "text": "open to) those who want to open a photographic studio for gaining the"}, {"type": "text", "text": "benefits, and some gentry and merchants (紳商) who want to take"}, {"type": "text", "text": "photographs for self-entertaining (自愉悅者); both kinds of people can"}, {"type": "text", "text": "study here."}, {"type": "text", "text": "Fourth Avenue, Way de le 104"}, {"type": "text", "text": "The photography courses were not only offered by foreign companies but also local photographic studios. Taking photographs for self-entertainment had become a new leisure activity for the “gentry and merchants” in China. The “gentry and merchants” who were an elite class benefited from the economic changes brought by the intervention of the colonialism since the First Opium War. 105 In a dynamic photographic environment in the treaty ports, local intellectuals, elites, and rich merchants who made up the majority of early Chinese amateur photographers acquired necessary photographic skills through self-study or from the studios and developed close relationships with foreign photographers."}, {"type": "text", "text": "The introduction of Kodak transformed photography from a privileged practice to a leisure activity. In March 1889, less than a year after the invention of the Kodak camera. Both the English paper in Shanghai and the local Chinese newspaper Shenbao ran advertisements for Kodak. Shenbao plays a significant role in disseminating new forms of knowledge for an expanding readership. 106 After the Republic of China replaced the Qing Dynasty in 1911, the pursuit of the new took on greater social significance. Fanatical worship of the new and a disdain for the old prevailed during the May Fourth Movement. As Leo Ou-Fan Lee argued that the intellectuals in the May Fourth Movement tended to highlight the new historical consciousness and declared China had entered a “new epoch” of world history, suggesting China had no longer been isolated from the civilized world. The notion and value of “newness” are defined in a context of unilinear time and a unilinear sense of history that is characteristically untraditional and Western, which means, in this context, newness and “western” were equated with “modernity”. 107"}, {"type": "text", "text": "“Newness” became a substitute for Western-style modernity.108 The enthusiasm on new technological devices could be regarded as the attempts to approach to the modern world and make a break with old and tradition. One photograph taken by American photographer John Zumbrun (1875-1949) in the early 1920s captured the moment when the last Emperor Puyi Aisin Gioro 愛新覺羅·溥儀 (1906-1967) explored the “new camera” in the Forbidden City (Fig.2.3). In the center of the photograph, Puyi stood at the gate of the palace, accompanying by a eunuch holding two different modes of Kodak camera: a folding vintage camera and a box camera. He seemed to have just realized that John Zumbrun was photographing him. British teacher Reginald Johnston (1874-1938) was discussing the use of cameras with members of the royal family. This photograph was taken no earlier than 1922, when Puyi cut off his queue on Johnston’s suggestion. Most of Puyi’s private photographs were taken after cutting off the queue,which became a significant turning point in his life at which he began to consciously identify himself as a modern man and embrace the Western culture.109"}, {"type": "text", "text": "Since 1912, Puyi, as an abdicated Emperor, stayed in the northern half of the Forbidden City and the Summer Palace until Feng Yuxiang 馮玉祥 (1882-1948) expelled him in 1924. In his autobiography, he recalled life in the Forbidden City from 1911 to 1924. Melancholy and remorseful, he wrote, “When China was called a republic and mankind had advanced into the twentieth century, I was still living the life of an emperor, breathing the dust of the nineteenth century.”110 Life in the Forbidden City brought him great contradictions and confusion. Puyi exemplified the rupture in the turn of the twentieth century between the imperial era and newborn Republic,utilizing photography as a medium to convey the sense of absurdity and struggle."}, {"type": "text", "text": "Puyi’s interest in photography might emerge with the visual shock that news photographs brought him when he started to follow the political news since the death of Yuan Shikai 袁世凱(1850–1916) in June 1916. 111 The political turmoil in early twentieth-century China increased the demands of the public for true visual representations of the historical events, and the concept of visual accuracy of photography was illustrated by a series of portraits and news images in the newspapers and pictorials. 112 Puyi subscribed to more than twenty kinds of newspapers and magazines during his youth in the Forbidden City.113 The image-oriented newspapers and magazines introduced a new experience of reading to Puyi. After World War I (1914–1918), various newspapers scrambled to cover the world situation in the form of pictures. Dongfang Magazine (東方雜誌) to which Puyi subscribed featured a highly image-sensitive and visually charged style. A 1920 news story, which states that the German Kaiser Wilhelm II was exiled to the Netherlands and lived in a manor house,was entirely narrated in pictorial form. Two photographs showing the leisure life of Wilhelm II occupied the entire page.114 The readers were invited to participate in the narration on the basis of visual imagery. Wilhelm’s experience in exile might resonate with Puyi, who was forced to abdicate in 1911. The photographs evoked the pain of his loss of power and his desire to regain it."}, {"type": "text", "text": "Puyi was one of many photographic enthusiasts who benefited from the prosperity of the photographic environment in the early twentieth century. After his first meeting with Puyi in 1919, Johnston wrote a memorandum to the British authorities describing Puyi’s eagerness to learn. Under the guidance of his teacher Johnston, he developed many new hobbies like playing golf, bicycling and photography.He probably picked up photography from the studio photographers in Beijing who had close ties to the aristocracy. Japanese photographer Yamamoto Sanshichiro, who opened a photographic studio in Beijing after the Boxer Rebellion; American photographer John Zumbrun, who opened the photographic studio named Camera Craft in Legation Quarter, were frequently invited to take photographs for the royal family."}, {"type": "text", "text": "In the vortex of political struggle between the Manchu court, the government of Peking and the forces of various foreign countries, Puyi expressed his strong desire to break from the tradition through the pursuit of new culture. Swedish art historian Osvald Sirén (1879-1966), who had expertise on Chinese city gates and city walls,emphasized Puyi’s great enthusiasm and curiosity on photography when he visited Puyi in the Forbidden City, 1922. Puyi at first showed distrust and shyness towards Osvald,but immediately changed his attitude when he found Osvald’s camera. He even took out his broken Kodak cameras and asked if they could be fixed. In Osvald’s essay that was published in New York Times in 1923, Puyi’s desire for new culture and knowledge was vividly recorded, which evoked public sympathy for the young emperor who was captive in the Forbidden City.115"}, {"type": "text", "text": "Two decades after the Boxer Rebellion, a photograph of Puyi standing on the roof of the Forbidden City was seemingly a dynamic response to the six decades of colonial photography in China (Fig.2.4). The photograph was probably taken in 1924— the same year he was expelled from the Forbidden City. In the photograph, he wore the long gown and mandarin jacket—the civil costume in the Republican period—and a pair of sunglasses, posing as a modern gentleman. Jing Mountain, in the background,where many European-American and Japanese photographers took the panoramic view of the Palace, became an allegory for the ubiquitous and controlling gaze from foreign powers. Despite Puyi’s relaxed manner, he was stranded in the towering palace walls,confronting the dilemma between foreign forces and the old relics of the Qing Dynasty.116"}, {"type": "text", "text": "From this perspective, the photographic practices of the last Emperor in the Palace can be understood as a manifest performance of the new self. As the viewing subject rather than the object of being seen, Puyi would see a new self through a variety of visual apparatus.117 The image of Double me (erwo tu 二我圖) is likely a metaphor for Puyi’s dual identities: a captive emperor and a modern individual embracing Western culture. With a stiff expression, he sat on an exquisite chair against the background of a screen in the Forbidden City. The photograph exhibits a reflective self-portrait in two slightly different postures (Fig.2.5). Lu Xun 魯迅 (1881-1936) used to argue that the novel exposure technique was popular in China because it enabled people to gain pleasure by performing two identities.118 Puyi wished to manipulate and reframe his self-representation, and through the camera, he could perform as a modern man like his teacher Johnston. A similar self-reflective portrait was taken in Zhang Garden in Tianjin, where he stayed from 1924 to 1929. In the photograph, Puyi holds a terrestrial globe and kaleidoscope, with a comical expression on his face, and another portrait hidden in this photograph shows Puyi in a full suit looking every inch the genteel modern gentleman (Fig.2.6). Both photographs included double layers of representing the self. 119 He embraced modern culture passionately, but in a passive way. His exploration of modernity must have been instructed by Johnston; the western suit indicates a controlling gaze that he could not be rid of his entire life.120"}, {"type": "text", "text": "Puyi’s photographs and negatives were carried with him from the Forbidden City to Tianjin. Until he left for Manchuria in 1931, most of his photographs were kept in Tianjin. From the Palace, Tianjin to Manchuria, Puyi’s private images reveal a personal world beyond public view. The late nineteenth and early twentieth centuries saw the emergence of a large number of private photographic records that made the writing of photographic history richer and more diverse. The popularity of compact cameras, such as Kodak, has made photography less of a ritual and more of a “reflection”; photographs are not only evidence of history, but also a souvenir of everyday life.121 The availability of the easy-to-use Kodak portable camera also changed the ability of amateur photographers to capture quotidian events. Within two years of Kodak’s introduction in the Forbidden City, Puyi, Empress Wanrong 婉容(1906-1946), concubine Wenxiu文繡 (1909-1953), and Puyi’s siblings all left a number of snapshots of reading,smoking, watering flowers, riding bicycles, and practicing Chinese boxing in the Forbidden City. The portable and compact Kodak made instant outdoor shooting possible. The Imperial Garden and the courtyard of the Hall of Mental Cultivation became a playground for photographic enthusiasts. Among these snapshots, the picture of Wanrong riding a bicycle along the palace wall attracted great attention. Despite the 2013).amateur quality, the photograph shows an effort to capture the subject in the motion with a portable camera, which manifested the tension between mobility and stillness in the Forbidden City (Fig.2.7)."}, {"type": "text", "text": "The novel and exciting visual experience were represented through the Kodak camera, promoting the Chinese to see the nation and the individual as an independent visual subject. The photographic enthusiasts in the late nineteenth century and early twentieth century consciously discovered and affirmed their subjectivity and established their connection with the modern world. Kodak’s portability and simplicity facilitated outdoor photography, allowing modern Chinese photographic enthusiasts to see the world and express themselves. The hand camera provides an ever-changing,personal view in the midst of the shot, a fluid perspective that fits in with the emerging modern landscape of the early twentieth century.2.2 Between Intellectual and Amateur: The Emergence of Chinese Amateur Photographers"}, {"type": "text", "text": "The abolishment of the imperial examination in 1905 and the opening of new-style schools changed the avenues for social mobility. The four-class (scholar, peasants,artisans, merchants) society experienced a disintegration. The scholar class that led the four-class society disappeared and a new group of “intellectual” (zhishifenzi 知識份子) emerged.122 The late nineteenth century and the early twentieth century saw the local community of scholars and merchants gradually shifted to the cities to develop into a group of urban elites. Some of them became new intellectuals under the new-style schools, with a plurality of professions and identities, mostly active in academia,publishing, and the art world; others flocked to other new fields, becoming businessmen,buyers, soldiers, lawyers, doctors, etc. 123 In contrast with the scholars, modern intellectuals remained marginal in the political life.124 But they attempted to seek a new level of integration into the modern world.125"}, {"type": "text", "text": "With the prosperity of the publishing culture in the 1920s and 1930s, modern intellectuals participated in the construction of public discourse in a variety of forms.Writers, publishers and media professionals took advantages of the emerging power of the mass media to construct their new identity. Photography, as a significant medium,provided a variety of approaches to engaging in and with social reality. The capacity to represent reality connected photography to the dynamics of the modern world. From lithography to photoengraving (Chinese name: Zhaoxiang tongziban 照相桐梓版),printing technologies from Europe and America had been introduced in Shanghai since the middle of the nineteenth century, which promoted the cultural prosperity of the printing industry in Shanghai.126News Pictorial (Shishi huabao 時事畫報) and Truth Pictorial (Zhenxiang huabao 真相畫報) in the 1900s and 1910s provided immediate news photographs of the Huanghuagang Uprising (huanghuagang qiyi 黃花崗起義) and the Revolution of 1911. In 1913, Ta Kung Pao revealed the truth of founder of the Kuomintang Song Jiaoren 宋教仁 (1882-1913)’s being assassinated, identifying the murder through a series of photographs.127 Despite the fact that the majority of the Chinese people could not afford a camera until the late twentieth century, photography offers direct access to the truth or the reproduction of the truth in the early twentieth century."}, {"type": "text", "text": "In the 1920s and 1930s, photography was democratic and egalitarian that mediated between the intellectuals and the public. The great vitality of photography depended on the great efforts of the modern intellectuals to establish the new venues for bringing the pictures to the public. Photography was the medium through which intellectuals construct their public social life and was an integral part of their own cultural life. In addition to the intellectuals, the urban bourgeoisie was another important part of the amateur photographers. Between the two World Wars, which was the golden age of native Chinese capitalism, a new bourgeoisie of entrepreneurs, who distanced themselves from the old regime, flourished within the developing economic environment. In addition to the emerging group of entrepreneurs, the number of employees working in financial institutions, shops, and factories has grown substantially. However, the urban bourgeoisie that emerged within the development of native capitalism remained marginal: not throughout China but in several representative cities like Shanghai and Tianjin. Shanghai has become the capital of a new bourgeoisie of business.128"}, {"type": "text", "text": "Embracing a new era of photographic awareness, the modern intellectuals and urban bourgeoisie in the major Chinese cities desired a new medium to express their modern experience. They had a certain economic base and spare time, could afford to provide their own photographic equipment, regularly bought photographic magazines and yearbooks, visited photographic exhibitions, were enthusiastic about photographic competitions, and some of them formed loosely organized societies and clubs where skilled amateur photographers exhibited their work, acted as judges in photographic competitions, and gave technical and aesthetic guidance to novices. The number of amateur photographers had increased dramatically in the 1920 and 1930s, especially the number of photographic hobbyists in the cities. Bankers, doctors, engineers,teachers, journalists, writers, and lawyers were major potential customers in the emerging photographic market.129 The members Of National City Bank Clubs in China held regular photographic exhibitions as a social entertainment activity.130"}, {"type": "text", "text": "The invention of Kodak and inexpensive roll film increased the affordability of materials and contributed to the rapid growth of the number of amateur photographers,which happened almost three decades ago in the U.S. and Europe. Amateur photographers became a more diverse group. In 1910s and 1920s, Europe and America,the serious amateur photographers who regarded photography as serious art and ordinary hobby photographer or new “snapshot friends” had split up.131 In contrast with the remarkable division of the photographic market in Europe and America, Chinese photographers––both hobbyists and advanced photographers—emerged and developed at almost the same time. The invention of Kodak triggered the fear and anxiety of many art photographers in Europe and America; however, many Chinese photographers began their careers with a portable and easy-to-operate Kodak. Lang Jingshan, one of the greatest art photographers in China, got his first camera, a Kodak, in 1906 when he learned photography from his painting teacher in middle school; Wu Yinxian 吳印咸(1900-1994) bought a Kodak Brownie in 1920 when he studied at Shanghai Academy of Fine Arts (Shanghai meizhun 上海美專), and Jin Shisheng taught himself photography in 1923 when he received his first Kodak camera at the age of thirteen. In contrast to commercial and popular photography, these local photographic enthusiasts claimed to be amateur photographers."}, {"type": "text", "text": "“Amateur” (aimeizhe 愛美者) was firstly used with “drama” to describe a new and modern Chinese drama genre, “amateur drama” (aimeiju 愛美劇), by drama theorist Chen Dabei 陳大悲 (1887–1944) in his 1921 book, proposing an amateur theatre with a highlight of the script and literary aspects of theatre in contrast to commercial theatre. 132 Amateur photographers were the opposite of commercial photographers, who earned a living by taking pictures. The early 1920s photographer and critic Liu Bannong first talked about the definition of “amateur” photography in the preface of “Peking Light Society Photographic Year Book” (Beiping guangshe nianjian, 北平光社年鑒) in 1927, he argued that amateur photographers must have a great interest in photography, as they took photographs out of interest, instead of making a living.133"}, {"type": "text", "text": "Compared with the serious amateur photographers who embraced photography as a creative art, the increasing number of hobby photographers employed their camera to represent everyday life and participated in the exhibitions and photographic societies,which contributed to the persistent photographic enthusiasm in the 1920s and 1930s. In 1936, Chen Chuanling wrote an English article to British magazine Photograms of the Year that was an annual record of international photographic work. He described the emergence and development of amateur photography in China:"}, {"type": "text", "text": "Despite of economic depression of this country, in common with all"}, {"type": "text", "text": "parts of the world, is at present passing through, and in spite of the"}, {"type": "text", "text": "political upheavals, amateur photography is becoming more popular in"}, {"type": "text", "text": "all ranks of life, and interest in its affairs is surprisingly keen. In"}, {"type": "text", "text": "Shanghai, camera enthusiasts have been able to make considerable"}, {"type": "text", "text": "headway, as evidenced by the holding of more than ten open exhibitions"}, {"type": "text", "text": "between August 1934, and July 1935. It is gratifying to note that all"}, {"type": "text", "text": "these salons have been crowned with success. …There are camera clubs"}, {"type": "text", "text": "in existence in most of the big cities like Shanghai, Peiping, Nanjing,"}, {"type": "text", "text": "Tientsin, Canton, etc., while the formation of more societies and camera"}, {"type": "text", "text": "clubs in the smaller cities is a necessity. …In the interest of economy"}, {"type": "text", "text": "and for the sake of convenience, miniature cameras have come into"}, {"type": "text", "text": "prominence. The most popular and favorable one is the cheap and handy"}, {"type": "text", "text": "2 1/4 in. × 3 1/4 in. size, with eight or sixteen exposures. For those who"}, {"type": "text", "text": "can afford to pay for the more expansive cameras, the Leica type is, of"}, {"type": "text", "text": "course, in the front rank. With the exception of Pressmen, one seldom"}, {"type": "text", "text": "sees nowadays a camera enthusiast carrying even the quarter-size"}, {"type": "text", "text": "apparatus.134"}, {"type": "text", "text": "Chen’s article in Photograms of the year aims to outline the history of Chinese photography for the readers in the European-American countries. Instead of introducing some specific art photographers or masterpieces, he described the increasing number of amateur photographers, photographic exhibitions, camera clubs, and the expanding “miniature cameras” market in Shanghai. In the 1930s, some serious amateur photographers like Chen Chuanglin had realized the significance of a prosperous photographic market to cultural life."}, {"type": "text", "text": "The Chinese photographic market began to prosper around 1920. Recognizing the increasing numbers of Chinese amateur photographers, the Eastman Kodak company opened its first branch in Shanghai in 1920.135 C. E. Barham, who occupied a similar position in South Africa for many years, acted as the manager for China.136 The first wholesale store was established on Jiangxi Road, and a retail store opened on Nanjing Road and later moved to Yuanmingyuan Road in 1928. Four years later,another branch opened in Tianjin.137 With the support of the postal service, Kodak’s products were accessible throughout mainland China. In an advertisement published in Shenbao 1926 says: “Would you like to take a photograph by yourself? If you are living in interior China and cannot find a shop, you just go to the local post office and write to us, and then you can buy the Kodak camera. (Fig.2.8).”138 In addition to Kodak, other camera brands rushed into the Chinese market. Ilford from Britain, Agfa, Leica, Zeiss,Rolleiflex, and Contax from Germany, and Fuji Film from Japan all opened branches in Shanghai.139"}, {"type": "text", "text": "The group of amateur photographers in China became diverse in the 1920s and 1930s when the camera brands such as Kodak, Contax, Rolleiflex expanded their business in the Chinese market, and simultaneously many photographic societies, clubs,and exhibitions developed. Within the emergence of an expanding photographic market,not only the Kodak camera, but Ilford from Britain, Agfa, Leica, Zeiss, Rolleiflex, and Contax from Germany, and Fuji Film from Japan, all opened branches in Republican China.140 The Contax Company even sponsored photographic exhibitions in Shanghai and Tianjin for increasing brand awareness.141 A large number of hobby photographers who were the major contributors in mass photography markets and had the potential to increase.142"}, {"type": "text", "text": "It has been a long time that the scholarship paid attention to art photography,which was marked by several dedicated amateur photographers. In my research,amateur photography suggests not only the artistic practices by serious amateur photographers but also the capture of quotidian activities in modern cultural lives by ordinary hobbyists. “Simultaneously popular and elite,” is how Lawrence W. Levine described the art institutions and productions of Shakespeare in nineteenth-century America, which attracted heterogeneous audiences that had differing orientations toward art.”143 It is also perfect for describing amateur photography in the Republican period."}, {"type": "text", "text": "The number of amateur photographers increased dramatically in the 1920 and 1930s, especially the number of photographic hobbyists in the cities. A review of the photographic societies, exhibitions and magazines reveals that both serious amateur photographers and photographic hobbyists were actively engaged in photographic activities. In 1925, China Photographic Society was founded by Lin Zecang in Shanghai,claiming that there were over one thousand members, including both ordinary hobbyists and serious art photographers;144 thousands of amateurs had participated in the public photographic exhibitions held by Light Society in Beijing, Hua Society in Shanghai.The great enthusiasm for the exhibitions reflected the thriving market in the Republican period."}, {"type": "text", "text": "The key factors in the success of the Kodak camera market were affordability,accessibility and simplicity. Starting in 1920, the Kodak Company promoted a series of marketing strategies for attracting more customers in China, making great efforts to embed the camera in the lives of urban dwellers. In the 1920s, the price of a Kodak Brownie––an inexpensive and simple camera––was between 3.4 yuan to 29 yuan, and various other models were between 11 yuan to 210 yuan.145 A 1926 ad in Shenbao shows a Vest Pocket Kodak with lens and films that cost 30 yuan, which the new middle classes in the major cities––doctors, engineers, teachers, journalists, writers and lawyers with a monthly salary 100 to 200 yuan—could easily afford with a bit of planning. The Brownie was intensively promoted in the 1930s. At 12 yuan, almost half the cost of a Vest Pocket Kodak, it was quite affordable for city dwellers.146 And the Hawkeye, one of the cheapest models in Kodak series, was sold for 9 yuan with lots of complementary products.147"}, {"type": "text", "text": "Beyond affordability, Kodak company promoted its customer-friendly service,emphasizing the simplicity of the camera for the purpose of attracting more amateur photographers. A 1926 Chinese ad stated: “The photography method is very simple;you would know the rules even though you use it for the first time. Load the film into the camera, pull out the camera, press the button, all done…The film can be sent to our company for developing…”148 The three simple, easily explained steps in the ad were the same as the three steps in English ads, essentially a Chinese version of the slogan “you press the button, we do the rest.” At that time, Shanghai's tourism industry was booming. When the tourist ferry pulled into shore, tourists would find a film-developing service immediately, then load a new roll and go sightseeing. Their photographs would be ready just before they came back the ferry."}, {"type": "text", "text": "Kodak’s “You press the button, we do the rest” slogan also applied to the Chinese market. In 1921, Kodak company established a school in Shanghai to train the technicians in stores and photographic enthusiasts in Shanghai: “Three weeks to graduate, free of charge.149” They were required to learn how to enlarge, develop and mount photographs. These local professional technicians in the Kodak shops and photographic suppliers guaranteed the quality and efficiency of the customer-friendly service in China. The Kodak Magazine, which was a journal published by Eastman Kodak Company, Rochester, N.Y. for the amateurs, published a special introduction of Kodak’s Shanghai branch accompanied by a photograph of Shanghai’s Kodak school.150 The photograph depicts Thomas Crellin, who was sent from Kodak, teaching his Chinese students (Fig.2.9). All male students in this photograph also suggest an interesting gender differentiation. Male photographers tended to be regarded as professional ones, yet the women photographers––basically appeared as “Kodak girl”––were seen as amateurs."}, {"type": "text", "text": "Simultaneously, the Kodak Photographic Society had been established to attract more potential consumers. In 1929, the company’s Shanghai branch published an ad with an appealing title: “Only costs 4.5 yuan, everyone can take photographs by themselves (Fig.2.10).” If customers paid a 4.5-yuan membership fee, they could get a Kodak Hawkeye camera with several 120 films free of charge.151 In 1930, Kodak company promoted Chinese Kodakery (Keda zazhi 柯達雜誌), launched in 1930 and suspended in 1937, provided a glimpse of the international popular photographic culture to Chinese amateur photographers, stimulating their photographic interest and cultivating their dependence on Kodak products."}, {"type": "text", "text": "Influenced by the popular photographic culture, photography competitions became an effective way of attracting more customers. In 1929, the Eastman Kodak Company held a nationwide photography competition, which later became an international competition. The international competition was spreading in China and triggered enthusiasm among Chinese amateurs. It was the first time for Chinese amateurs to participate in an international photography competition. The participants had been required to submit their photographs to the designated themes, such as “snow,” “summer vacation,” “children,” etc., which encouraged amateurs to document domestic and leisure-time activities. The winning photographs would be published on Chinese Kodakery, which played a key role in the circulation of amateur photographs."}, {"type": "text", "text": "Kodak publications provided a comprehensive knowledge for self-taught photographers through their instructional essays. Kodak Monthly (Keda huabao 柯達畫報) and Chinese Kodakery published many how-to essays written by relatively sophisticated photographers or translated from foreign photographic journals. From the choices of photographic products to printing out photographs, these how-to essays provided step-by-step instructions for both beginners and old hands. For the beginners,the authors of instructional essays state three simple principles: accurate light, moderate exposure, and appropriate framing; correspondingly, they introduced very detailed measures of photo developing for the sophisticated amateurs. Besides that, some tips for taking moving photographs, landscape photographs, and portrait photographs were practical for all readers."}, {"type": "text", "text": "“Photo analysis” (Zhaopian fenxi 照片分析), a special column in Chinese Kodakery, offered very practical advice for amateur photographers. From the choices of the subject to composition, the writer would make a concrete analysis of the chosen photographs. For example, the 1936 “Photo analysis” in Chinese Kodakery selected the photograph of Yu Zemin 余則民 as an example. The critic made a sketch of the photograph, signaling the composition and subjects in the photograph for the readers (Fig.2.11). “The sky and lake surfaces are too empty,” reads one note. The critic also pointed out the shortcomings in the composition for the reader’s reference. 152 The point of fun (Quwei dian 趣味點), a concept that was frequently mentioned in these technical essays, shared the similarities with the punctum in Roland Barthes’s theory referring to a detail that attracts you to an image.153 The highlight of point of fun made the photographs livelier and more dynamic, remarking a break with fuzzy pictorialism.The technical essays also emphasized the employment of light and shadow."}, {"type": "text", "text": "These technical instructions encouraged advanced amateurs to be deeply involved in photographic activities, not to mention the fact that the technical guidelines promoted the consumption of many photographic products. For example, an ad entitled “Kodak Photographic Treasury” (Keda sheying baoku 柯達攝影寶庫) promotes a whole set of photographic products, including cameras, film, developing solutions,darkroom safelights, photographic papers, developing tanks, and fixing solutions (Fig.2.12).154 This packaging sales mode is obviously aimed at dedicated amateur photographers. Behind the simplicity of operation, the technical essays essentially led the amateurs to a way of self-study and exploration."}, {"type": "text", "text": "The story of Kodak coming to China was interwoven with the local amateur’s demand to record modern life and shape their self-identity. In the 1920s and 1930s, the Kodak Company created a multitude of ways to attract the costumers and cultivate the amateurs’ aesthetic tastes in line with modern life. Travel, vacation, and domestic life as the main subjects in Kodak publications constituted the hobby photography that was a popular pastime for the new middle classes in the Republican period. The artistic works, travel snapshots, family photography, and capture of daily life in China allowed these amateurs to establish a precise association with their environment, their families,and a new nation."}, {"type": "text", "text": "In the Republican period, most photographic societies provided the locus for the photographic activities of amateur photographers. Local photographic societies in the 1920s and 1930s, which shared some similarities with the camera clubs of European-American amateur photographers in late nineteenth-century and early twentieth-century Shanghai, primarily functioned as a site of learning, appreciating, and socializing for Chinese amateur photographers. The examination of the photographic societies,including both art societies and hobby clubs, would provide a glimpse of the photographic culture and the emerging modern art world in the 1920s and 1930s."}, {"type": "text", "text": "The growth of photographic societies, arguably the most effective institution in popularizing photography, shaped the development of Chinese amateur photography.In the 1920s, photographic societies sprang up in large numbers. The Jing Society (Jingshe 景社) in Guangzhou, the Light Society in Beijing, the Pei-Yang Photographic Society (Beiyang sheying hui 北洋攝影會) in Tianjin, the Mei Society (Meishe 美社) in Nanjing, and the Hua Society in Shanghai emerged as the formation of the early Republican era modern art world. A generation of amateur photographers made efforts to establish a modern organizational structure and hold exhibitions on a regular basis,making a remarkable contribution to advocating art photography and expanding the public interest in photography. Simultaneously, student camera clubs sprang up within the advent of “aesthetic education” in the universities in the 1920s and 1930s. This rise of amateur photography in China and the new photographic vocabulary developed by the clubs, exhibitions, and publications from the 1900s to the 1930s contributed significantly to the particular and unique aspects and eventual growth of Chinese visual modernity."}, {"type": "text", "text": "In contrast to the casual photographers and ordinary hobbyists, a group of amateur photographers embraced photography as serious art, attempting to promote the legitimation and popularization of art photography and create institutional structures that expanded greater public understanding of modern art and the impact of the modern artists. At the operational level, they wrote not only the instructional technical essays in photographic publications but a series of theoretical works about photographic aesthetics, establishing a legitimate boundary between ordinary hobbyists and dedicated amateur photographers."}, {"type": "text", "text": "The 1920s photographic societies, like the Jing Society in Guangzhou, the Light Society in Beijing, the Hua Society in Shanghai, and the Mei Society in Nanjing, still insisted on limiting membership. Even the Black and White Photographic Society in Shanghai, with the largest number of members, had only 74 members. 155 These photographic societies attracted local amateur photographers from Beijing to Guangzhou. They were organized loosely without strict rules or regular meetings.Basically, their annual exhibitions and various pictorials were the only platforms for amateur photographers to display and appreciate their works."}, {"type": "text", "text": "Liu Bannong, in his long classical essay “The talk on photography” mentioned that he took photographs for self-entertainment rather than making profits. Although his statements carried the tone of self-abasement commonly used by Chinese scholars, Liu embraced photography as serious fine art, emphasized that the purpose of the photographers was to “create beauty” (zaomei 造美) rather than reproduction. 156 A Liu’s attitude on photography echoed the “amateur” spirit of Chinese literati painters like Su Shi 蘇軾 (1037-1101). Literati painters sometimes claimed to be amateurs,emphasizing that they painted for self-expression.157"}, {"type": "text", "text": "From Ouyang Huiqiang’s 歐陽慧蹡 “Photography Companion” (Sheying zhinan,攝影指南) to Liu Bannong's essay, the photographic critics appropriated the terms and methods from traditional painting theory such as “sketch conceptualism” (xieyi 寫意),“depict the truth” (xiezhen 寫真) and “aesthetic circumstances” (yijing 意境) to interpret art photography, making great efforts to legitimize photography as a genre of fine art. Chen Wanli 陳萬里 (1892-1969) published the first album of art photography in China “Wind” (Dafeng ji 大風集), which appropriated and adopted the subjects from literati landscape paintings, using soft-focus and darkroom skills to create an aesthetic atmosphere that counteracted the mechanical effects."}, {"type": "text", "text": "Many early photographic societies started with group outdoor shooting activities.Portable, compact, and convenient, hand cameras provided a lot of advantages for outdoor shooting. The founder of the Photographic Society of the Jingwu Martial Arts Association (Jingwu tiyu shexuebu 精武體育攝學部) Chen Gongzhe 陳公哲(1890-1961) frequently organized outdoor shoots during excursions to Suzhou and Hangzhou in the 1910s; the Light Society in Beijing, which consisted of seven faculties and staff at Peking University began with a loosely organized art society to appreciate the photographs taken during their travels.158 In the 1930s, Sanyou Photographic Society (Sanyou yinghui 三友影會), which was made up of Lang Jingshan, Huang Zhongchang黃仲長 (1900-1988) and Xu Zuyin 徐祖蔭, visited Huang Mountain several times, and even the traditional style painter Zhang Daqian 張大千(1899-1983) participated in their outdoor photographic practices. The photographic societies in the 1920s offered the members a place to gather as artistic equals to explore the technical and aesthetic aspects of photography."}, {"type": "text", "text": "The new cultural dynamics in cities like Beijing, Shanghai and Tianjin gave rise to a group of amateur photographers and photographic societies. They emerged and developed as a new force to be engaged in the transformative modern art world,reshaping the public’s understanding of photography as a new genre of art. Due to the power of the photographic medium, a series of new photographic activities extended the influence beyond the circle of elite intellectuals, indicating the transfer of power from a relatively small group of advanced photographers and professionals to a large group of amateur photographers."}, {"type": "text", "text": "As will be discussed in the next chapter, the photographic exhibition had been developing as the main venue to show the works by the societies’ membership. From 1924 to 1928, the Light Society had held five annual exhibitions, developing a reputation around the Beijing area and even in Shanghai. The second annual exhibition attracted more than ten thousand visitors. The public enthusiasm for photography was the strongest motivating force for the success of Light Society exhibitions. The Light Society published two yearbooks in 1928 and 1929, collecting the artworks from the members, with text written by Chen Wanli and Liu Bannong that examined some significant issues about photography, art and technology. Liu Bannong not only gave the definition of “amateur,” but also emphasized that the photographers need to express the unique “Chinese taste and sentiment” (zhongguoren teyoude qingqu yu yundiao 中國人特有的情趣與韻調).159 Although a distinctly national sentiment appeared, art photographers of the early 1920s successfully represented the aesthetic sensibility of an intellectual world."}, {"type": "text", "text": "The Photographic Society of China, known as the Hua Society, emerged in a thriving cultural environment. It drew together artists, intellectuals and even journalists in the Shanghai art world, aiming to expand the impact of art photography and constructing the reputation of amateur photographers. Lang Jingshan, a sophisticated advertiser in Shenbao and The Eastern Times (Shibao 時報), organized a group of amateur photographers and established the first Chinese art photographic society in Shanghai, 1928. The members of the Hua Society basically were closely associated with the metropolitan modern art world. For example, Hu Boxiang 胡伯翔 (1896-1989) was a well-known commercial artist who painted the monthly calendar for a tobacco company in Shanghai; Wang Dafo 王大佛, the editor of photographic magazine The China Focus (Tianpeng 天鵬), promoted a special issue of the second exhibition of the Hua Society in 1928; 160 Ding Song 丁悚 (1891-1972), one of the most famous Shanghai cartoonists of the time, founded the magazine Shanghai Sketch ( Shanghai manhua 上海漫畫) which published a special issue of the third exhibitions of the Hua Society in 1929;161 Zhu Shouren 朱壽仁 was the chief editor of Chinese Journal of Photography (Zhonghua sheying zazhi 中華攝影雜誌) which was one of the most influential photographic magazines, running from October 1931 to June 1936; Guo Xiqi郭錫麒 (1896-1976), an productive amateur photographer in the 1920s, published many photographs in The Eastern Times Photo Supplement (Shibao tuhua zhoukan 時報圖畫週刊) and Pictorial Weekly (Sheying huabao 攝影畫報); the cartoonists Zhang Guangyu 張光宇 (1900-1965) and Ye Qianyu 葉淺予 (1907-1995), though not official members, also contributed many works to the exhibitions, and further took advantage of their influence to expand the reputation of the society in mass media."}, {"type": "text", "text": "The photographic circle in Nanjing, the capital of Republican China, was slightly different from Shanghai’s. Several political figures from the Nationalist government such as He Yingqin 何應欽 (1890-1987) who was the senior general of the Kuomintang,and Chu Minyi 褚民誼 (1884-1946) who was a member of the Central Executive Committee of the Kuomintang, joined in the society when they visited the exhibitions of the Mei Society in 1928.162 The members were distributed in Nanjing and Shanghai.The founder, Zhang Pengzhou 張蓬舟 (1904-1991) emphasized that the aim of the society was to appreciate art photography, “we have no strict rules, and are loosely organized...we would keep the network of amateur photographers connected, and expand the influence of art photography.”163 Photography as a new form of art, its artistic quality, and more importantly, the cultural power, was recognized by an expanding circle in the upper middle classes."}, {"type": "text", "text": "The 1930s saw photographic culture had been flourishing with the development of the Black and White Photographic Society. Embracing the diversity of art photography,the photographers in Black and White Photographic Society such as Chen Chuanling,Lu Shifu, Nie Guangdi 聶光地, Wu Zhongxing 吳中行 (1899-1976), Ao Enhong 敖恩洪 (1909-11989) and Sha Fei 沙飛 (1912-1950) brought a variety of subjects into their photographs. From 1932 to 1937, four exhibitions attracted great attention from the public. The members of the Black and White Photographic Society developed their sensitivity to represent various subjects for the audience in response to the appeal for national salvation in the 1930s. The works by members integrated the aesthetic value with social content, attempting to respond to the role of photography played in the turbulent social changes. The Black and White Photographic Society successfully expanded the boundaries of art photography, and its exploration of new perspectives of photography went hand in hand with the rise of a left-wing cultural movement in the 1930s. Correspondingly, the yearbooks with collected photographs from the exhibitions had been published and were widely available. The turmoil of more than half a century in China has made it impossible to preserve all the photographs. These yearbooks of each society became a crucial clue to trace their achievements in the photographic world.Photographs played a significant role in mass media, although photographic magazines and pictorials accounted for only a small part of the publications in the Republican period."}, {"type": "text", "text": "The flourishing press industry promoted the development of amateur photographic societies in the urban environment, and the members of the societies, in turn contributed their works to magazines and pictorials. Photographic yearbooks, magazines, and pictorials kept the association of the amateurs connected and provided aesthetically high-quality works and criticism, as well as some practical technical information for ordinary amateur photographers. Peking Light Society Photographic Year Book fully displayed the pictorialist works from the members; The China Focus, Chinese Journal of Photography frequently published the works of the Hua Society members (Fig.2.13);The Pei-Yang Pictorial News (Beiyang huabao 北洋畫報) cultivated a group of photographers who later developed a new society, the Beiyang Photographic Society (Beiyang sheyinghui 北洋攝影會), which suggests a close relationship between mass media and amateur photography."}, {"type": "text", "text": "The 1930s photographic magazines such as The China Focus, Changhong (長虹),Chenfeng (晨風), Zhonghua (中華) financially supported by the photographic suppliers published lots of amateurs’ photographic works. However, these photographic magazines often had been suspended only after two or three years of publication The China Focus, which launched from July 1928 to December 1929, suspended due to the lack of long-term and stable sponsorship. Chenfeng, which launched from December 1933 to November 1935, stopped publication for the same economic reason.Professional photographic magazines were very popular among photographic enthusiasts, but the ordinary readers were also more willing to buy some comprehensive pictorials. Therefore, photographic magazines must seek sponsorship from suppliers of photographic materials. In 1936, Jin Shisheng and some amateurs associated with him launched an important photographic magazine Flying Eagle (Feiying 飛鷹) that was financed by the Guanlong Photographic Supply Company (Guanlong qicaihang 冠龍器材行) in Shanghai. As one of the most sophisticated photographic magazines in the Republican period, Flying Eagle embraced pictorialist photography as well as modernist works. Besides the specific photographic magazines, the Young Companion and The Modern Miscellany (Shidai huabao 時代畫報) which were the most pioneering pictorials in the Republican period specially opened the photographic section for satisfying the enthusiasm from the viewing public."}, {"type": "text", "text": "Besides the photographic societies developed by serious amateur photographers, it is interesting to notice that the emergence of student camera clubs was accompanied by the aesthetic education in the Republican period. In 1916, Cai Yuanpei 蔡元培 (1868-1940) took up the present of Peking University and the post of Minister of Education in the newly established Republican China and advocated for “aesthetic education” (meiyu 美育) by emphasizing aesthetic merit rather than functional skill.164 Chu Minyi,a member of the Central Executive Committee of the Kuomintang, was also an amateur photographer in Mei Society in Nanjing. In a 1929 article entitled “The True Meaning of Beauty” (Meide zhenquan 美的真詮), he believed that aesthetic education was very significant to the cultural life in a country, so there should be more photographic societies like the Mei Society.165 His argument directly connects aesthetic education with the promotion of photographic societies and clubs."}, {"type": "text", "text": "The camera clubs on campuses were established to cultivate an interest in photography and offer technical guidance to young students. Compared with the serious art groups like the Light Society and the Hua Society, the camera clubs in the campus emphasized sociability, keeping the amateurs closely connected with a mutual goal to improve the art. The first batch of hobby clubs in the Republican period appeared in colleges and middle schools in the cities as the extracurricular interest groups. Many photographers first contacted or trained in photography when they studied it in middle school or college. Lang Jingshan learned photography in Shanghai Nanyang Middle school at the age of 12 in 1904. He learned some basic photographic skills and darkroom techniques from his painting teacher; Chen Gongzhe, the founder of the Photographic Society of Jingwu Martial Arts Association, which was the earliest photographic society in China, contacted photography when he studied in Fudan University around 1910; Lin Zecang was the leader of the photographic group at Saint John’s University when he studied there in 1924 and later he established China Photographic Society in 1925; Jin Shisheng he learned photography in Shanghai Pudong Middle School, where he met his schoolmate Jiang Bingnan 蔣炳南. Jin started his photographic career in Shanghai in the 1930s, when he studied civil engineering at Tongji University."}, {"type": "text", "text": "Like the Light Society and the Hua Society, the main activities of the camera clubs included outdoor shoots, regular discussions about photographs, and participation in the exhibitions. The Shanghai College Photo Club (Hujiang daxue sheyingshe 滬江大學攝影社) was founded in 1925 as an extracurricular activity for students at Shanghai College. According to a 1925 group photo in front of Yates Hall published in 1925 The Shanghai (Hujiang niankan 滬江年刊), there were twenty-three members (including one woman) in the first year; one year later, the number had more than doubled to fifty.166 In the 1929 photograph in The Shanghai, it is obvious that more women had joined the club (Fig.2.14). The members organized outdoor shoots and read and communicated with photographs on a regular basis; they were encouraged to submit their photographs to the exhibitions and magazines. In one essay written by the Secretary of the club, Sidney D. Wang, he praised the club's achievements: “the beautiful pictures and snapshots compiled in the present volume of the Shanghai Annual. Besides, in the local and national photo-exhibitions, the artistic works of the members win no little appreciation and praise, thus making our Alma Mater known in society with another good name.”167 Chen Chunbo 陳春波, chairman of the club in 1929 and the chief editor of The Shanghai, published a great number of photographs in Pictorial Weekly and The China Focus. Sometimes the members of Photo Club also acted as journalists on many occasions, such as sports events."}, {"type": "text", "text": "Sometimes the well-known photographers would write for the photographic annuals of the student camera clubs, which to some extent, legitimated their photographic activities and brought their works into the aesthetic system set by advanced art photographers. Lang Jingshan, Hu Boxiang from the Hua Society wrote the prefaces for the Futan Photography Annual (Fudan sheying nianjian 復旦攝影年鑒) created by the Futan University Photographic Society (Fudan daxue sheyinghui 復旦大學攝影會) in May 1931, praising their achievements in and contributions to art photography.168 The photographs in the annual explore a wide range of subjects from nude to the street scene. Chen Bingde 陳昺德 (1907-1950), who specialized in sport photography and female portraits, contributed eight photographs to the annual. Among them, there was an outdoor nude photograph, which was rarely seen in the 1930s.Meanwhile, the Futan University Middle School Photographic Society (Fudan daxue fushuzhongxue sheying xuehui 復旦大學附屬中學攝影學會) also published the Futan University Middle School Photography Album (Fuzhong yingji 復中影集) in December 1930. As a middle-school camera club, it received support from the university in terms of the equipment and funds. Besides that, the Yin-O Photo Club of Shanghai College Middle School (Hujiang daxue fushuzhongxue yin’ou sheying xuehui 滬江大學附屬中學銀鷗攝影學會) also published an album in 1935."}, {"type": "text", "text": "Advanced amateur photographers played an important role in legitimizing the amateur activities of the student camera club, and it common for then to be invited as an advisor. The Chih Tze College Photographic Study Society (Chizhi daxue sheying yanjiuhui 持誌大學攝影研究會) was established around 1928. Lang Jingshan and Hu Boxiang acted as advisers.169 Tu Zheyin 屠哲隱, one of the founders of the Nanjing Mei Society, became the advisor of the Mei Society of Jinling University (Jinling daxue meishe 金陵大學鎂社) which consisted of students from Jinling University. Besides that, serious amateurs also gave commentary and critiques at the student camera clubs’ exhibitions and publications to approve the aesthetic values of their works."}, {"type": "text", "text": "Embracing diversity and openness on the subjects and styles, the young students showed more sensibility to the changes in the urban environment. The Shanghai Fine Art Academy established a photographic society around 1930. The members of the society were trained as professional painters. Therefore, they had well-honed artistic instincts. 170 The photographic magazines Chenfeng and Zhonghua published photographs from the fifth exhibition of Shanghai Meizhuan Photographic Society (Shanghai meizhuan sheyinghui 上海美專攝影會) in January 1934. As will be discussed in next section, the photographic exhibition was the main venue for showing the works of the members in various categories like metropolitan nightlife and the war situation.171 The engagements of student societies on the campus provided a glimpse of the flourishing photographic culture in the 1920s and 1930s. The members’ photographic level is variable, but their fresh and expressive works contribute to the diversity and vitality of modern Chinese photography."}, {"type": "text", "text": "Photography, an once
