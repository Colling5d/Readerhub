工程。他认同业余者应被视为严肃而富有创造性的艺术家这一界定，并极大地推动了画意摄影的转变，在某些情况下甚至推动了现代主义实验。334"}, {"type": "text", "text": "金石声1934年拍摄的一幅照片展现了其家乡扬州瘦西湖的美景（图5.7）。在这幅作品中，他有意以中国传统的“月洞门”为取景装置，将湖畔拱桥与垂柳的景致框入画面，营造出中国团扇的视觉效果。在前景中，他捕捉到一幕日常生活场景：一个小男孩坐在门上，背对观者；一位年轻女子站在他身旁，微笑着与他说话。照片还配有一首他写的小诗：“湖光云影如画景；游人皆入此图中。”335 尽管他以画面界定了风景，他的创作却超越了同时代画意摄影师的 作品。他的题材并非借自文人画，而是以开创性的技法描绘被摄者的日常生活。平凡场景与风景永恒之美并置，标志着与模仿式风景表现之间的显著决裂。"}, {"type": "text", "text": "从想象性画意摄影到写实性画意摄影，艺术摄影师的 重点在于细致表现自然，并通过相机表达所要求的情感，而不只是依靠暗房技巧。金石声拍摄的上海郊区乡村风景照片，倾向于以写实影像表现对象形态与状态的自然面貌。他是构筑照片构图的大师。一幅20世纪30年代以构筑式构图拍摄的苏州照片，呈现出看似空旷的街道和房屋（图5.8）。他将一盏悬挂的灯笼置于照片的黄金分割处作为前景，将一排房屋置于中景，并以流动的云作为背景。空间与纵深安排得恰到好处。此外，他在表现对象质感与细节方面也展现出高超技巧，这在传统画意摄影照片中很少见。"}, {"type": "text", "text": "1936年，金石声创办了一本创新型摄影杂志《飞鹰》。作为主编，他确立了兼收并蓄的风格，既接纳精巧的画意摄影，也拥抱现代主义探索，展现了现代中国摄影的广阔光谱。在冠龙照相器材公司的支持下，《飞鹰》在19个月内共出版了19期，为专注艺术的摄影师提供了展示才华的平台。作为主编，金石声精心挑选所有照片，并按特定主题和题材加以组织。在《飞鹰》第17期（1937年）中，他选了一组表现自然肌理与图案的照片，包括李藜軒、魏南昌的雪中芦苇以及郎静山的秋叶；还有刘旭滄（1913—1966）、蒋炳南和吴中行的一些展现乡村宁静的照片。他还选了杨永麻拍摄的表现城市工人和劳动者的照片。"}, {"type": "text", "text": "对艺术摄影理解的加深，在很大程度上得益于繁荣的大都市文化环境。20世纪30年代的业余摄影师对来自世界各地的先锋摄影理念和技术持开放态度。金石声的一幅自拍照非常清楚地展现了他宽广的20世纪30年代艺术视野（图5.9）。根据巫鸿对这一紧凑空间中的各种物件和图像的敏锐分析，两本杂志——《良友》和德国《摄影年鉴》（Das Deutsche Lichtbild）——象征了他摄影的两个主要灵感来源：前者代表了繁荣的上海都市文化，这种文化促成了“中国现代性的文化高潮”；后者则代表了国际画意摄影和欧美现代主义摄影运动的外来影响。在金石声1936年的自拍照中，他身旁的书架上有国际摄影杂志：四期德国《摄影年鉴》、日本摄影集《国际写真》、国际肖像摄影目录以及英国《摄影年鉴杂志》。336 上海有许多出售国际摄影期刊的店铺。1928年的《上海漫画》介绍了德国《摄影年鉴》的封面设计。337 骆伯年于1932年至1935年居住在上海，他的档案中包括屈臣氏大药房的收据，这家药房也冲洗底片并出售摄影用品。Das Deutsche Lichtbild由总部设在上海的出版商别发洋行发行。338"}, {"type": "text", "text": "卢施福和金石声对池塘、河流、村庄和乡村建筑的描绘，都显示出受到国际画意摄影所强调和推崇的自然主义的强烈启发。国际画意摄影在1890年至1930年间达到活动顶峰，其参与者包括在美国、欧洲、亚洲和澳大利亚工作的艺术家。画意摄影师不仅巩固了摄影作为与绘画和素描并列的一种艺术的地位，而且将摄影视为一种具有诠释性和表现力的"}, {"type": "text", "text": "媒介"}, {"type": "text", "text": "那个"}, {"type": "text", "text": "能够"}, {"type": "text", "text": "唤起"}, {"type": "text", "text": "情感的"}, {"type": "text", "text": "感觉。"}, {"type": "text", "text": "那个"}, {"type": "text", "text": "尤其是英国摄影师彼得·亨利·埃默森（Peter Henry Emerson，1856—1936），他设法在相机影像中促进个人表达，并创作了一本被称为“划时代”的摄影集《诺福克湖区的生活与风景》（Life and Landscape on the Norfolk Broads），在其照片中强调自然主义。美国摄影师爱德华·斯泰肯（Edward Steichen）受其绘画训练的影响，并经常使用化学药剂来获得类似柔和、模糊的美柔汀或淡彩画效果的印相。他的作品《池塘—月光》（Pond-Moonlight）使用重铬酸胶工艺结合铂或铁基乳剂制作，营造出模糊而浪漫的氛围效果。摄影分离派（Photo-Secession）是20世纪初由阿尔弗雷德·斯蒂格利茨（Alfred Stieglitz，1864—1946）领导的活跃画意摄影团体，扩展了画意主义的艺术语汇。除欧美画意摄影外，二战前的日本艺术摄影也影响了20世纪30年代的业余摄影师。日本摄影师兼作家福原信三（Fukuhara Shinzō，1883—1948）提出了光理论，这是艺术写真（geijutsu shashin，芸術写真，字面意为艺术摄影）的美学基础。斋藤田野则（Saito Tazunori）的《如何制作艺术照片》（How to Make Art Photographs，1932）概述了画意主义美学的四种不同取向：抒情表现（jojoteki hyogen，徐々的表現）、印象主义表现（inshoteki hyogen，印象的表現）、写实表现（shajitsuteki hyogen，写実的表現）与构成主义表现（koseiteki hyogen，構成的表現）。这四个类别暗示了对艺术摄影理解的一种转变。339"}, {"type": "text", "text": "画意主义在20世纪20年代初随着直接摄影（Straight Photography）的出现而衰落。直接摄影尊重相机以清晰焦点、丰富细节和高对比度忠实再现现实影像的能力。摄影批评家萨达基奇·哈特曼（Sadakichi Hartmann）在《为直接摄影辩护》（“A Plea for Straight Photography”）中抱怨说，画意摄影师过于依赖暗房技术来制作模糊影像，并使用重铬酸胶等特殊印相方法。哈特曼进一步解释了直接摄影："}, {"type": "text", "text": "“依靠你的相机，依靠你的眼睛，依靠你良好的品味和你的"}, {"type": "text", "text": "构图知识，考虑色彩、光线、"}, {"type": "text", "text": "和明暗的每一种变化，研究线条、明暗层次和空间划分，耐心等待，直到"}, {"type": "text", "text": "你所构想的景象或对象在其最极致的"}, {"type": "text", "text": "美的时刻显露自身。”340"}, {"type": "text", "text": "哈特曼对画意摄影的追问与阿尔弗雷德·斯蒂格利茨的转变不谋而合。20世纪10年代，斯蒂格利茨极为欣赏保罗·斯特兰德作品中的清晰而丰富的细节，这意味着对抽象形式和色调变化的呈现，也是迈向现代主义艺术的一步。在20世纪20年代末至30年代初的中国，画意摄影从想象性表达向写实性表达的转变，与20世纪20年代欧美画意摄影的衰落和直接摄影的兴起遥相呼应，尽管迟了数十年。然而，画意摄影在中国的转变标志着20世纪中国艺术中一个更具争议性的转向。"}, {"type": "text", "text": "在20世纪30年代的中国，画意摄影从想象性表达向写实性表达的转变，与20世纪20年代欧美画意摄影的衰落和直接摄影的兴起遥相呼应。艺术摄影师所强调的，是通过相机细致地再现自然世界，而不仅仅依靠暗房技巧。然而，当欧美画意摄影逐渐走向现代主义摄影之时，20世纪30年代中国现代艺术界持续进行的写实主义运动，则标志着与画意摄影的决裂。"}, {"type": "text", "text": "“摄影是一种优越的写实主义，因为它具有完美的描绘技巧。”341 摄影长期以来一直被视为写实主义的典范，摄影早期的名称都暗示着素描与雕刻的观念。唐·斯莱特将摄影写实主义分为三种类型：再现性写实主义，指一种优越的再现世界的能力；本体论或存在论写实主义，指摄影能够成为事件的见证者、唤起过去、记录被毁之物的能力；机械写实主义，则通过良好的可复制性将摄影与现代技术视觉联系在一起。342 随着民国时期中国的现代化与工业化，摄影不可避免地与技术上先进的世界联系在一起。"}, {"type": "text", "text": "卢施福探索了新的、独特的摄影方法。卢施福并非挪用绘画题材，而是鼓励摄影师在日常生活中拍摄各种各样的题材，从而拓展了中国现代摄影的边界。与此同时，在民国时期，许多艺术、政治与冲突的新题材通过摄影得以确立。再现现实的能力将摄影与现代世界的动态结合在一起。写真，这一自19世纪50年代以来日语中表示摄影的词语（shashin），也作为摄影的另一种名称出现在中文中。343"}, {"type": "text", "text": "由于大规模复制，摄影现实主义一直在渗入公众的思想。民国初年，新知识分子和新兴资产阶级利用摄影传播民主与科学知识。20世纪二三十年代，作为一种忠实反映世界的方式，现实主义得到许多艺术家和批评家的推崇。现实主义潮流开启了不同的阐释。模仿主义风格在晚清和民国初年的画报如《点石斋画报》中得到充分展示，并发展出一种不同的再现现实的方式。344 进步知识分子欣赏现实主义与中国画传统的决裂，将现实主义用作反映现实世界的工具。一些知识分子，如康有为，认为对世界的现实主义再现比中国传统艺术中的概念性动势更为先进，因为现实主义与自强和独立相关的科学实践具有亲和性。345 徐悲鸿声称，艺术的最高境界是“惟妙惟肖”。在1929年第一届全国美术展览会上，画家徐悲鸿和诗人徐志摩（1896—1931）发表的声明中对现实主义持相互冲突的观点。徐悲鸿相信模仿，而徐志摩则对表现主义实验持开放态度。二人都希望挪用一种西方模式来重建中国的现实主义，但他们坚持不同的现实主义路径。"}, {"type": "text", "text": "现实主义被认为是一种新的、进步的艺术风格，这更多是出于意识形态而非美学价值，并在第二次中日战争前重新定义了民族认同与危机。346 对于赞扬社会主义现实主义的 intellectuals 而言，现实主义潜在地揭示了世界的历史原则。347 在更广泛的语境中，摄影作为一种现实主义的观看方式，已被带入中国艺术家建立的新框架之中，他们利用现实主义作为 rejuvenate 中国艺术的西方模式。5.2 碎片化的现实：摄影蒙太奇与现代主义探索"}, {"type": "text", "text": "两次世界大战之间欧美兴起的摄影现代主义运动，激发了中国业余摄影者中一场持久的摄影实验潮流。正如第四章所讨论的，上海都市现代主义摄影师金石声和骆伯年在其作品中创造性地回应了这些激动人心的现代主义运动。事实上，20世纪30年代中国的摄影现代主义并不局限于都市影像。设计摄影和摄影蒙太奇为理解中国现代艺术景观提供了新的视角。照片中独特的视角和抽象形式，将他们旅行途中移动景观的碎片化影像重新组合成一种实验性的蒙太奇。"}, {"type": "text", "text": "图案摄影（Design Photography，圖案攝影）兴起于20世纪30年代，其背景是画意摄影的衰落与摄影实验的兴起。1930年，张建文在《良友》画报的“图案摄影之研究”栏目中发表了几幅表现车轮、风扇等机械与人工物件的照片。《东方时报》则推出了一个摄影图案专栏，展示以强调人造物件（包括羽毛和纸张）的线条、角度与质感为重点的特写照片。348 张光宇是中国最早从欧美汲取现代主义影响的艺术家之一。他创作的两幅集锦摄影将日常物件与材料转化为艺术主题。他拍摄了自家周围的门、窗和电线杆，将原照片复制四份，然后将其拼合为一幅万花筒式的集锦摄影。349 与这些集锦摄影相配的文字主张，每一件日常物件都可以在照片中被表现为艺术主题；甚至连广告和图案摄影也可以被视为艺术。"}, {"type": "text", "text": "现代主义艺术家运用拼贴等新技术，试图通过将日常题材和材料转化为艺术来重塑人的感知，这也从总体上拓宽了艺术的定义。20世纪30年代，普通物品的特写和集锦照相在城市摄影爱好者中颇为流行。1935年《长虹》第十期上，黄劼之将图案摄影或照片图案作为一种艺术摄影的新题材加以介绍，鼓励爱好者自行探索制作图案拼贴的方法。350"}, {"type": "text", "text": "一些水平较高的爱好者热衷于展示自己处理影像的精湛技法。罗伯年（Luo Bonian）在20世纪30年代制作了若干拼贴作品。他把棕榈叶和铁栅栏转化为几何图案，将棕榈叶围绕一个中心点排列，或以重复的图式构成一幅更大的抽象图像（图5.10.1；图5.10.2；图5.10.3）。中国现代主义摄影师运用拼贴和其他现代主义技法，试图通过将日常植物题材转化为抽象艺术来重塑人的感知，并从总体上拓宽艺术的定义。对日常美学的提倡促使他捕捉家庭环境中的普通题材。罗伯年拍摄了若干特写照片，照片中的水晶娃娃以带有现代图案的背景衬托，周围则点缀着美丽的花卉和植物。这幅拼贴作品呈现出传统美学与现代主义的融合。"}, {"type": "text", "text": "日益碎片化的大都市生活影像，成为快速机械化的现代世界的一种隐喻。通过考察中国现代主义艺术家的拼贴作品，我将探讨20世纪30年代的中国艺术家如何将城市景观的碎片化影像重新组合为一种实验性蒙太奇。一种将所有图像元素以中心—边缘模式排列的万花筒式蒙太奇在大众媒体中广受欢迎。正如彼得·比格尔所言，照片蒙太奇是“现实的碎片化”，它成为现代生活碎片化的一种隐喻。351 将建筑形态的多个摄影副本加以拼贴的做法在大众媒体中非常流行。一件题为《大都会》的拼贴作品完美地反映了城市建筑所带来的震惊与碎片化的视觉体验。在《图画周刊》中，庄礼建将一座高楼前长梯的双重印片拼贴在一起，展示了20世纪30年代现代建筑的精致结构（图5.11）。352 在1936年由摄影杂志《长虹》举办的设计摄影比赛中，顾志斌在其参赛作品中采用特写视角来表现外白渡桥的钢梁与建筑构件，随后复制该影像并制作出镜像。353 观看者在观看蒙太奇时获得了一种沉浸式的视觉体验。照片蒙太奇一直在复杂而丰富的城市经验中发展。秦泰来（1905—？）专门在上海拍摄电影明星，擅长将现代女性与现代城市并置。在《良友》中，他发表了自己的实验性照片蒙太奇，题为“照片设计：一种将照片组装为艺术设计的新方式”。354 该蒙太奇的边缘展示了若干由摩天大楼、钟表、女性身体和剪纸剪影构成的小型蒙太奇；中央的万花筒式蒙太奇则以中心—边缘模式展示了一位在松树背景前笑容灿烂的女性（图5.12）。蒙太奇是画报中多种流行视觉元素的组装：现代女性、西式钟表和高层建筑被重新组合为大都会的一幅寓言式蒙太奇。"}, {"type": "text", "text": "在殖民遗产之外，上海蓬勃发展的大众媒体拥抱了从全景式景观向由碎片化影像组装而成的蒙太奇的转变。355 20世纪30年代，上海左翼艺术家借鉴了乔治·格罗斯（1893—1959）和约翰·哈特菲尔德（1891—1968）的作品，二人均为柏林达达成员。例如，张光宇将早先与流行文化密切相关的照片蒙太奇转化为带有深厚文化政治意涵的讽刺作品，从而将照片蒙太奇转变为一种描绘现实并重塑人类世界感知的有力媒介。356 格罗斯于1933年移居美国，创作了一件富有创造性的照片蒙太奇，题为《美国风景》。357 自鲁迅翻译《小彼得的朋友们讲的故事》（Was Peterchens Freunde erzählen）以来，他的艺术作品便在中国广为人知，该书收录了乔治·格罗斯的绘画。20世纪30年代，由于格罗斯在中国和日本左翼圈子中的声誉，上海艺术家从格罗斯的作品中汲取了大量影响。358"}, {"type": "text", "text": "1934年4月号的《现代》杂志发表了一件题为《上海风景》的照片蒙太奇（图5.13）。359 艺术家有意将若干碎片化的身体影像重新组合为一个复合体。这幅照片蒙太奇被置于中性的空白背景之上。若干性别化影像彼此叠置：一张现代男性的脸、一具身穿泳装的女性身体、穿着丝袜的女性双腿、高跟鞋、乳房、一件现代连衣裙；一些城市文化符号：麻将、彩票、香烟盒、饮料瓶和一只轮胎散落四周；还有一支枪和一张似乎从电影海报上剪下来的扭曲面孔；图像右下角出现了一个印度人。大众印刷中这些碎片的组装反映了上海文化的混杂性与活力。"}, {"type": "text", "text": "1936年发表于《时代漫画》（Shidai manhua 時代漫畫）的一幅题为《标准中国人》（Biaozhun zhongguoren 標準中國人）的拼贴画，标志着从表面娱乐性的表现转向深刻的讽刺（图5.14）。360 艺术家采用剪贴拼合的手法描绘了一个“典型的中国人”：他头戴西式帽子，身穿中式服装，怀抱一尊裸体雕塑，背上的篮子里装着儒家经典、京剧、庙宇和一件青铜鼎（古代礼仪用大釜），所有这些都象征着国家沉重的负担。他正遭受空袭和坦克的攻击，但他的剑不过是京剧中的道具。这些碎片化图像的拼合是对这个遭受外国武装侵略的弱国的隐喻，而他紧闭嘴巴的惊恐面容则暗示这个国家无力自卫。这幅1936年的摄影拼贴画讽刺了蒋介石蔣介石（1887—1975）对日本采取的“不抵抗”（bu dikang 不抵抗）政策，展现了上海左翼艺术家的强烈反对。"}, {"type": "text", "text": "20世纪30年代以现代主义探索为特征的拼贴和蒙太奇技法，与郎静山的集锦摄影技艺走向了不同的方向，标志着从传统画意摄影向现代主义探索的转变。郎静山的集锦照片通常有一个固定的主题，而现代主义照片蒙太奇则鼓励观者自行探索多重意涵。作为一名技艺精湛的摄影师，郎静山也运用其集锦技艺将数张照片合成为一幅完整的图像。例如，在1933年的一幅集锦作品中，他将一张斜卧女性裸体照片与一幅很可能剪自报纸的军队行进图并置，暗示国家在1931年九一八事变后正遭受军事入侵（图5.15）。361 对女性气质的描绘及其与祖国的寓意，暗示了摄影师试图强化的一种联结。郎静山在此集锦作品中所要传达的爱国情感显而易见。"}, {"type": "text", "text": "《标准中国人》这幅蒙太奇作品以诸多碎片化的景象作为中国现代性的隐喻，包含着许多政治化的意涵。这两种摄影合成作品都是为了回应20世纪30年代的政治动荡而发展的。对城市生活新感受的拼贴以及针对政治与社会的讽刺性蒙太奇，共同促成了20世纪30年代的现代主义摄影实验。即将到来的战争使现代主义摄影戛然而止。然而，20世纪30年代的摄影实验仍然是中国摄影史上最丰富的时期之一。"}]}, {"id": "concl", "title": "Conclusion", "paras": [{"type": "title", "text": "结论"}, {"type": "text", "text": "结论"}, {"type": "text", "text": "本论文探讨了1900年至1937年间中国业余摄影师接纳新摄影技术并创造本土摄影语汇的方式。作为十九世纪最伟大的技术成就之一，摄影既象征着现代性，又使现代性成为可能。在民国中国的语境中，摄影的双重力量——记录社会动荡与复兴中国艺术——在一种技术新事物、一个正在兴起的现代民族与一个经历变革的艺术世界之间建立了多层次的关联。"}, {"type": "text", "text": "二十世纪上半叶中国的视觉现代性尤其具有多层次性。在二十世纪初的中国，新一代知识分子将摄影视为“西方”现代化的成就之一，把它当作科学现代性的象征。唐·斯莱特认为，摄影将现代性推向一个顶点，因为再现世界的手段与认识世界的手段被统合在一种单一而统一的技术视野之中。362 接纳并调适新的西方技术是中国现代化的核心。中国现代印刷业的迅速发展与摄影的高度可复制性，以快速、即时且廉价的方式将图像带给广大受众。363 在民国时期，城市居民可以获得各种文本与视觉商品。随着摄影在十九世纪中叶传入中国，中国已被带入这种“单一而统一的技术视野”。"}, {"type": "text", "text": "在日益发展的工业文化中，照相机成为机械观看方式的隐喻。照相机凝视将现代视觉与权力联系起来，促进了等级制度的建立。364 自19世纪末以来，中国人直面展示权力与监视的凝视，但作为回报，这种凝视唤起了正在兴起的主体性。正如彭丽君所言，那种令人震惊、大开眼界的视觉体验通过一面扭曲的镜子折射出来，促使中国人看到自己崭新却脆弱的自我。中国人作为观看主体而非被观看的客体，获得了一种此前无法获得的既诱人又具威胁性的身份认同。365"}, {"type": "text", "text": "长期以来，摄影是欧美现代化的象征。那么，中国人是何时产生表现中国迅速变化的时间与空间的愿望的？20世纪初，易于使用的便携式照相机极大地增强了摄影师的流动性，激发了人们观看和认识世界的愿望。“拍摄的愿望”指的是一种迅速而大量地表现转瞬即逝的自然的需求。366 1911年革命之后，现代艺术景观正在发展，而疏离于旧政权的新知识分子和城市资产阶级寻求一种新的媒介来记录他们的现代经验。柯达便携式照相机的可负担性促使越来越多的爱好者使用摄影来记录他们的日常生活和自我表达。"}, {"type": "text", "text": "除了将摄影视为科学现代性的象征之外，中国知识分子和艺术家还有意识地将欧美艺术家的语汇改编为本土艺术表达。20世纪20年代和30年代的许多照片凸显了摄影在中国一种从容而复杂的现代性构想中的作用。以绘画性题材为特征的传统画意摄影将摄影提升为美术。20世纪30年代对“中国性”的追求与日益高涨的民族主义情绪并行。与此同时，一些艺术摄影师有意识地展示该媒介的自然优势，即抽象形式的呈现，也就是迈向现代主义艺术的一步。受欧美摄影师的启发，几位在上海的严肃业余摄影师在现代主义摄影方面作出了富有才华的尝试，尽管他们只在短暂时期内积极创作，却以传统画意摄影标示出一种独特的风格。"}, {"type": "text", "text": "摄影在20世纪30年代的中国与视觉、知识及现代艺术世界的转型交汇。作为一种美术形式，它展现了多样的风格与题材，反映了20世纪30年代中国艺术家之间的挣扎与探索。在20世纪30年代中期中国不断恶化的局势中，许多中国摄影师在作品中表达了救亡图存的情感。与其他艺术形式相比，摄影因其极强的可复制性，在动员大众方面具有更多优势。即将到来的战争促使越来越多的摄影师从民族框架中看待国家与自身。"}, {"type": "text", "text": "第二次中日战争爆发后，照片被用作唤起公众情绪的重要工具。战争期间，一种名为“红色摄影”（hongse sheying 紅色攝影）的新摄影类型得以确立。“红色照片”聚焦于战场上能够激发爱国情感的戏剧性时刻。正如何伊丽（Eliza Ho）所观察到的，沙飞的战时照片仍显示出很高的艺术水准，因为他在战前曾是一名美术摄影师。367 沙飞将他在上海学到的精湛摄影技巧与新的意识形态相结合，把摄影发展为一种构建战争集体记忆的视觉工具。"}, {"type": "text", "text": "日本入侵使现代艺术与文化的许多探索骤然中止。然而，在上海孤岛时期（gudao shiqi 孤島時期）（1937—1941年），上海仍有许多非官方摄影展览和团体。例如，郎静山于1939年和1941年在上海举办了两次展览，展出了他1937年沿海遭轰炸后逃往中国西南时在云南、四川拍摄的照片。他的朋友褚民谊曾在20世纪30年代是一名业余摄影师，后来成为南京汪精卫（Wang Jingwei 汪精衛，1883—1944）傀儡政府的高级官员，邀请他加入与日本的合作，但他拒绝了。368 展览中的照片成为上海了解中国内地的一扇窗口。摄影提供了一种记录国家边界的激进手段。在战时，这种描绘被赋予了更重要的意义。郎静山在战时上海的摄影展览将流亡、离散和民族景观等新题材带入中国视觉文化史。"}, {"type": "text", "text": "“一切固定的僵化的关系，以及与之相伴的古老而令人崇敬的偏见和见解，都被扫除了，一切新形成的关系等不到固定下来就陈旧了。一切坚固的东西都烟消云散了……”369 马克思和恩格斯1848年写下的《共产党宣言》中的这一论断表明，变化而非停滞将成为现代社会的常态，而这种转变将重塑生产、消费和流通的方式。370 四十年后，第一台柯达相机在美国发明，并很快传入欧洲、亚洲和世界其他地区。19世纪末20世纪初摄影的爆炸式发展见证了现代化，同时也成为现代化的驱动力。业余摄影的出现和发展，催生了民国时期多重现代性的复杂概念。"}]}, {"id": "biblio", "title": "Bibliography", "paras": [{"type": "title", "text": "参考文献"}, {"type": "text", "text": "Bibliography Ai Shu 艾姝. “Minguo chuqi tianjinshi meishuguan de meishu yingzhan yu meishu sheying wenhua de jiangou 民國初期天津市美術館的美術影展與美術攝影文化的早期建構 [Early Republican Art Photography Exhibition in Tianjin Municipal Art Museum and the early construction of art photographic culture],” Sichuan daxue xuebao 四川大學學報 [Journal of Sichuan University], no.2 (2014): 152-160.Aisin-Gioro Puyi. From Emperor to Citizen: The Autobiography of Aisin-Gioro Puyi.Translated by William J. F. Jenner. Peking: Foreign Language Press, 1964.Anderson, Benedict. Imagined Communities: Reflections on the Origin and Spread of Nationalism. London: Verso, 2006.Andrews, Julia F. “Traditional Painting in New China: Guohua and the Anti-Rightist Campaign.” The Journal of Asian Studies 49, no. 3 (August 1990): 555-577.Albers, Patricia C., and William R. James. “Travel photography: A methodological approach.” Annals of Tourism Research 15, no.1 (1988): 134-158.Allen, Joseph R. “Picturing Gentlemen: Japanese Portrait Photography in Colonial Taiwan.” The Journal of Asian Studies 73, no.4 (November 2014): 109-104.Arnall, January Parkos. “‘Adventures into Camera-Land’: Women, Image-Making,and th aptioned with “the writer on the way to Dunhuang” (Dunhuang tuzhong zhi zhuzhe 敦煌途中之著者) taken by his colleague, 1924.Fig.4.25: the photographic team of Sino-Swedish Scientific Expedition Team to Northwest China (Zhongrui xibei kexue kaochatuan 中瑞西北科學考察團) led by Hedin and Xu Xusheng 徐旭生 (1888-1976), Ballon Experiment, Xu Xusheng's Diary of the Northwestern Journey (Xu Xusheng xiyou riji 徐旭生西游日記).Fig.4.26: Zhuang Xueben 莊學本, A young man of Qiang nationality was crossing the river with rope, 1934.Fig.4.27: Zhuang Xueben, a bird’s-eye view of Min River, 1934.Fig.4.28: Zhuang Xueben, “God Dance” (Tiaoshen, 跳神), Lifan, Sichuan, 1934.Fig.4.29: Zhuang Xueben, “sipped” wine (zajiu 咂酒), 1934.Fig.4.30: Jin Shisheng 金石聲, “Qingdao yipie 青島一瞥 [A glimpse of Qingdao],” Chinese Kodakery 3, no.9 (1932): 6.Fig.4.31: Lang Jingshan 郎靜山, Salt Well in Langzhong,阆中, Sichuan, 1938, courtesy of Huang Jianpeng.Fig.4.32.1: Liangyou Nationwide Tour (Liangyou quanguo kaocha tuan 良友全國考察團) consisted of Liang Desuo 梁得所 (1905-1938), the chief editor of Liangyou,and several photographers such as Ouyang Pu 歐陽璞, Situ Rong 司徒榮. China as She Is: A Comprehensive Album (Zhonghua jingxiang 中華景象) (Shanghai:Liangyou’s publishing company, 1934), courtesy of Chengdu Library.Fig.4.32.2: “The White Pagoda”, China as She Is: A Comprehensive Album (Zhonghua jingxiang 中華景象) (Shanghai: Liangyou’s publishing company, 1934),courtesy of Chengdu Library.Fig.4.33: The Team of Education Ministry’s Art and Relics 教育部藝術文物考察團,Wang Ziyun 王子雲 in Shunling Mausoleum 順陵, 1941, Xi’an, Shaaxi Province.Fig.5.1: Liu Bannong, Pond and Light of the Early Morning Sun, ca.1920s Fig.5.2.1: Lang Jingshan 郎静山, the first negative of Majestic Solitude (Chunshu qifeng 春樹奇峰), 1934.Fig.5.2.2: Lang Jingshan, the second negative of Majestic Solitude, 1934.Fig.5.2.3: Lang Jingshan, Majestic Solitude, the composite photograph, 1934 Fig.5.3: Lang Jingshan, Draw Water in the Morning (Xiaoji qingjiang 晓汲清江),1934.Fig.5.4: Shao Woyun 邵臥云, “Mubo 暮泊 [A ship text": "4 杰弗里·科迪与弗朗西丝·特帕克的论文《透过外国玻璃：晚期摄影的艺术与科学》"}, {"type": "note", "text": "5 理查德·K. 肯特，《二十世纪早期中国的艺术摄影：接受、驯化与拥抱》"}, {"type": "note", "text": "6 顾伊的博士论文《在中国的科学化视觉：摄影、户外写生与……的重新发明》"}, {"type": "note", "text": "7 金华编，《陈迹：金石声与现代中国摄影》[Relics: Jin Shisheng and Modern Chinese Photography]"}, {"type": "note", "text": "8 三影堂摄影艺术中心编，《骆伯年》（北京：北京联合出版社，2016年）。骆伯年的两幅摄影作品于2018年5月2日至10月14日在伦敦泰特现代美术馆展出，系展览“光之形：摄影与抽象艺术100年”的一部分。"}, {"type": "note", "text": "9 该展览的图录于2016年出版。荣荣编，《中国摄影：二十世纪以来》（杭州：中国美术学院出版社，2016年）。"}, {"type": "note", "text": "10 日本摄影史家甲斐义明认为，日本缺乏用于流通家庭照片和私人快照的商业摄影市场。同样的论点也适用于中国。直到十年前，中国的商业摄影市场才逐渐发展起来，这意味着在很长一段时间里，私人快照或家庭相册都不被允许脱离其原始所有者而流通。参见甲斐义明，《快照的影子》，载杰弗里·巴钦编，《悬置时间：生命—摄影—死亡》（静冈：伊豆摄影博物馆，2010年），第172—191页。"}, {"type": "note", "text": "11 摄影史学家杰弗里·巴钦（Geoffrey Batchen）认为，快照应被视为一种复杂的社会装置，带有特定的中产阶级价值观和情感，而不仅仅是一件艺术品。杰弗里·巴钦，《快照：艺术史与民族志转向》，《摄影学》第1卷第2期（2008年）：121-142。"}, {"type": "note", "text": "12 李欧梵，《重绘上海》，《上海摩登——一种新都市文化在中国，1930—1945》（哈佛大学出版社，1999年），第3—42页。"}, {"type": "note", "text": "13 刘禾，《导论》，载《跨语际实践：文学、民族文化与被译介的现代性——中国，1900—1937》（斯坦福：斯坦福大学出版社，1995年），第1—42页。"}, {"type": "note", "text": "14 石淑媚（Shu-Mei Shih），《爱他者：全球语境中的五四西方主义》，载《现代的诱惑》（伯克利与洛杉矶：加州大学出版社，2001年），第1-45页。"}, {"type": "note", "text": "15 克里斯托弗·A. 里德（Christopher A. Reed），《导论》，载《上海的古腾堡：中国印刷资本主义，1876-1937》（温哥华：不列颠哥伦比亚大学出版社，2004年），第3-24页。"}, {"type": "note", "text": "16 顾伊（Yi Gu），《摄影及其中国起源》，载坦尼娅·希恩（Tanya Sheehan）与安德烈斯·马里奥·塞尔维贡（Andrés Mario Zervigón）编《摄影及其起源》（纽约：劳特利奇，2015年），第157-170页。"}, {"type": "note", "text": "17 梁启超， 《中国近三百年学术史》 [中国近三百年的学术思想史]（北京：东方出版社，2004年），第382页。"}, {"type": "note", "text": "18 刘半农， 《半农谈影》 [关于摄影的谈话]， 载《中国近代摄影艺术美学选》，第177—202页。"}, {"type": "title", "text": "第一章"}, {"type": "note", "text": "19 米歇尔·福柯借用杰里米·边沁在十八世纪末提出的“全景敞视监狱”概念，将现代社会制度解释为“一种无限普遍化的全景敞视主义机制”。约翰·塔格延续了福柯关于权力的论述，认为作为革命性现代媒介的照相机促进了等级制度的建立。米歇尔·福柯：《规训与惩罚：监狱的诞生》，艾伦·谢里丹译（纽约：Vintage Books，1977年），第7页；约翰·塔格：《一种监视手段：照片作为法律证据》，载《表征的重负：论摄影与历史》（伦敦：Macmillan Education UK，1988年），第66-102页。"}, {"type": "note", "text": "20 费利斯·比托的照片由伦敦摄影师兼经销商亨利·赫林（1814—1873）购买并出售。巫鸿：《摄影对中国的征服：第二次鸦片战争影像的“壮丽收藏”》，载《聚焦：中国摄影史》（伦敦：Reaktion Books，2016年），第48—83页。"}, {"type": "note", "text": "21 于勒·埃及尔：《1843、1844、1845、1846年中国旅行日记》（巴黎：Dauvin et Fontaine，1848年），第331页。"}, {"type": "note", "text": "22 乔治·马尔科姆少校和罗伯特·伍斯南博士都曾在璞鼎查爵士使团供职，他们于1842年7月在长江岸边架设了一台达盖尔照相机。罗伯特·比克斯：《早期条约口岸中国照片的生命与死亡》，载于《视觉化中国，1845—1965：历史中的生活与静态影像》"}, {"type": "note", "text": "23 克里斯托弗·格林：《视觉化时间与空间的新方式》，载于《捕捉光线》（纽约：麦格劳-希尔，2000年），第165—182页。"}, {"type": "note", "text": "24 阿尔弗雷德·斯蒂格利茨：《手持相机——其当前重要性》，载于《1897年美国摄影年鉴与摄影时报年鉴》（纽约：1896年），第18—27页。"}, {"type": "note", "text": "25 克里斯托弗·格林，《捕捉光线》，第173页。"}, {"type": "note", "text": "26 乔纳森·克拉里，《观察者的技术》，收入《观察者的技术：论19世纪的视觉与现代性》"}, {"type": "note", "text": "（剑桥：麻省理工学院出版社，1992年），第97—136页。"}, {"type": "note", "text": "27 莎拉·E. 弗雷泽（Sarah E. Fraser），《作为主体的中国人：十九世纪的摄影类型》，载《毛笔与快门》，"}, {"type": "note", "text": "90–109。"}, {"type": "note", "text": "28 保罗·巴塔利亚（Paolo Battaglia）与尼古拉·拉班卡（Nicola Labanca），《朱塞佩·梅塞罗蒂·本韦努蒂：一个身处义和团之中国的意大利人。照片与书信（1900—1901）》[Giuseppe Messerotti Benvenuti：《一个在华义和团中的意大利人：照片与书信（1900—"}, {"type": "note", "text": "1901）]（米兰：拉科尔泰摄影·莫代内西·帕尼尼，2000年），无页码。"}, {"type": "note", "text": "29 他在信中写道：“我早晨亲眼目睹了这一场景，就像一个带着相机的医生。三名犯有谋杀罪的犯人根据中国法庭的法律被一名中国人斩首。他们找到了一名熟练的刽子手，三刀砍下三颗人头。几分钟之内，行刑就结束了。”保罗·巴塔利亚、尼古拉·拉班卡：《一个意大利人在拳民的中国：照片与书信（1900—1901）》，第2页。"}, {"type": "note", "text": "30 何伟亚：《摄影综合体：曝光拳民时代的中国（1900—1901），制造文明》，载马丁·杰伊、苏玛蒂·拉马斯瓦米编：《视觉帝国》（达勒姆：杜克大学出版社，2014年），第283—314页。"}, {"type": "note", "text": "31 同上。"}, {"type": "note", "text": "32 美国陆军工程兵部队提交了一份报告，列举了联军中的工程装备。根据美国陆军的这份报告，工程处指出：“在一个特种连的每个分队中，都必须有一定数量的人员彻底了解侦察、所采用的复制方法、战地摄影，或其他任何需要专门训练的事项。” 哈利·B. 弗格森，《联军工程装备报告：随中国救援远征军服役，1900—1901年》（华盛顿，1901年）。"}, {"type": "note", "text": "33 这些照片由普莱桑上尉、卡尔梅尔上尉和蒂西耶上尉于1900—1901年拍摄。《地上与气球上的中国》。——272张照片的复制品 [中国地上与气球上：272"}, {"type": "note", "text": "34 第一张航空照片由加斯帕尔-费利克斯·图尔纳雄（Gaspard-Félix Tournachon，1820—1910年）（人称“纳达尔”）拍摄。1858年，他拍摄了数张巴黎郊区的空中景观。当时，即使照明条件极佳，仍没有足够时间完成一次成功曝光。纳达尔尝试了多次，直到1868年才成功；那一年，他乘气球升到数百英尺高空，拍摄了数张巴黎照片。马丁·巴伯（Martyn Barber），《“快！柯达！”，维多利亚和爱德华时代的飞行家与航空摄影师》，载《航空摄影与考古学史》（斯温登：英格兰遗产出版社，2011年），第52—82页。"}, {"type": "note", "text": "35 同上，第60页。"}, {"type": "note", "text": "36 C. F. 奥基夫（C. F. O’Keefe）关于此次探险的照片收藏于马里兰州学院公园的美国国家档案馆。NWDNS-77-CR。国家档案与文件管理署。访问日期：2018年5月18日。https://catalog.archives.gov/id/519406。"}, {"type": "note", "text": "37 J. M. 曼奇尼，《战争，艺术的熔炉》，载于《太平洋世界的艺术与战争：制作、破坏与夺取》"}, {"type": "note", "text": "38 何伟亚，《摄影综合体：曝光义和团时期的中国（1900—1901），制造文明》，载于"}, {"type": "note", "text": "39 奥利弗·温德尔·霍姆斯，《立体镜与立体照片》，《大西洋月刊》，1859年6月。"}, {"type": "note", "text": "40 詹姆斯·里卡尔顿：《冯·瓦德西伯爵由联军军官陪同，穿过美军步兵队列，朝北京神圣门行进》，载《透过立体镜看中国：义和团运动时期穿越龙帝国的旅程》（纽约：安德伍德与安德伍德出版社，1901年），第297—299页。"}, {"type": "note", "text": "41 艾伦·塞库拉，《照片的交易》，载《艺术杂志》第41卷，第1期（1981年春季），第15-25页。"}, {"type": "note", "text": "42 日本摄影师在义和团运动期间为中国国际形象的塑造做出了显著贡献"}, {"type": "note", "text": "43 日本和中国第一代摄影师都是从……那里学习技术和知识的"}, {"type": "note", "text": "44 朱莉·克里斯特·奥克斯：《日本的国宝制度与艺术商品化》，载《看向现代：从通商口岸到第二次世界大战的东亚视觉文化》，詹妮弗·珀特尔和汉斯·比亚恩主编"}, {"type": "note", "text": "45 小川一真出版了相册《庚子事变图集》/《远明北洋事变写真帖》[《北清联军纪念影集》]（东京：小川一真出版部，1902年）。该相册收录了一幅从法国气球上拍摄的北京鸟瞰图。伊藤和土屋的报告于1903年分别发表于东京帝国大学工科大学的科学期刊上。小川的照片于1906年由东京帝室博物馆出资编辑，题为《北京宫殿建筑照片》，附有伊藤的简短导言，以及日文、中文和英文图注。Shinoku Pekin kojo"}, {"type": "note", "text": "46 朱莉·克里斯特·奥克斯，《日本的国家珍宝体系与艺术商品化》，载《审视现代：从通商口岸到第二次世界大战的东亚视觉文化》，珍妮弗·普特尔和汉斯·比亚恩主编"}, {"type": "note", "text": "47 詹姆斯·L. 何伟亚，《摄影综合体：曝光义和团时期的中国（1900—1901），制造文明》，载《视觉帝国》，第283—314页。"}, {"type": "note", "text": "48 伊东忠太，《从建筑进化原则看我国建筑的未来》[The Future of Our Architecture in Terms of the Evolution Theory of Architecture]，《建筑杂志》，第265期：第4—36页。"}, {"type": "note", "text": "49 菊地优子，《东方主义的挪用》，载《日本的现代化与民艺理论》（伦敦：劳特利奇出版社，2004年），第88—95页。"}, {"type": "note", "text": "50 巫鸿，《导论：九鼎与中国传统的纪念碑性观念》，载《中国古代艺术与建筑中的纪念碑性》（帕洛阿尔托：斯坦福大学出版社，1995年），第1—15页。"}, {"type": "note", "text": "51 弗兰克·麦卡勒姆准将收藏，《随中国远征军1900—1901》。Mss Eur D1114/3："}, {"type": "note", "text": "1900—1901年，大英图书馆。乔治·德·西蒙斯·巴罗将军，《生命之火》，哈奇森，伦敦"}, {"type": "note", "text": "52 麦夸尔·斯科特，“混杂的含义”，载《现代性的诸愿景》（伦敦：塞奇出版公司，1997年），第44—63页。"}, {"type": "note", "text": "53 瓦尔特·本雅明，“机械复制时代的艺术作品”，载《启迪》，汉娜·阿伦特编（纽约：肖肯图书公司，1968年），第222—223页。"}, {"type": "note", "text": "54 阿诺德·亨利·萨维奇·兰道，《中国与盟国》（纽约：斯克里布纳出版社，1901年）；阿瑟·亨德森·史密斯，《中国在动乱中》（纽约：弗莱明·H·雷维尔公司，1901年）；《哈珀周刊》使用了北京摄影师拍摄的数张照片来描绘向紫禁城进军的场景。其中一张新闻照片将俄国指挥官置于前景，俄国分遣队则从背景中的午门向太和殿行进。整整两页关于凯旋进军紫禁城的照片不仅传递了胜利的消息，还暗示了对紫禁城的去神秘化，这与西方列强权威的建构相呼应。参见彼得·C·珀杜与艾伦·塞布林，《义和团运动之二：战争与余波（1900—1901）》，载于麻省理工学院“可视化文化”项目。访问日期：2019年6月18日。https://visualizingcultures.mit.edu/boxer_uprising_02/index.html。"}, {"type": "note", "text": "55 罗伯特·比克斯，《早期条约口岸中国照片的生命与死亡》，载于《视觉化中国，1845—》"}, {"type": "note", "text": "56 约翰·赫本·杜德真（John Hepburn Dudgeon），《脫影奇觀》[捕捉影像与奇观]，1873年。"}, {"type": "note", "text": "57 安德鲁·希利尔：《柯达来到北京》，《视觉中国》，2018年6月21日访问，http://visualisingchina.net/blog/2017/01/26/the-kodak-comes-to-peking/#_edn5。"}, {"type": "note", "text": "58 广告，《字林西报》，1889年6月27日，无页码。"}, {"type": "note", "text": "59 《商店圣诞展销》，《北华捷报》，1889年12月13日，第726页。"}, {"type": "note", "text": "60 1890年，中英《烟台条约》签订，重庆成为通商口岸。丽贝卡·尼尔德，《中国的外国地方：条约口岸时代中国的外国存在，1840—1943》，2015年，第16页。"}, {"type": "note", "text": "61 阿丽西亚·比维克·利特尔：《亲历中国：我所见到的中国人》（伦敦：哈钦森出版公司，1899年），第36页。"}, {"type": "note", "text": "62 《中国西南游记》，CrossAsia主题门户，访问日期：2017年6月16日，https://themen.crossasia.org/weiss/?lang=en。"}, {"type": "note", "text": "63 《奥斯瓦尔德，约翰收藏》，中国历史照片，访问日期：2018年5月1日，https://www.hpcbristol.net/collections/oswald-john"}, {"type": "note", "text": "64 1866年，约翰·塞缪尔·施怀雅，即约翰·施怀雅父子商行的高级合伙人，开设了其第一家中国办事处。乔治·沃伦·施怀雅（1883—1949），自1904年起成为约翰·施怀雅父子商行的合伙人，于1927年起担任主席——"}, {"type": "note", "text": "46. “施怀雅200周年纪念”，《施怀雅200周年纪念》，访问日期2017年12月16日，https://www.swire.com/200anniversary/。"}, {"type": "note", "text": "65 第4号全景相机是柯达首款全景相机。它于1899年推出，并于1900年11月被重新设计的型号取代。第1号全景相机于1900年4月问世。柯达第4号全景相机的优势在于其置于皮革筒中的摆动镜头；而且它们在胶片平面上具有明显的弧度，以配合镜头的运动。"}, {"type": "note", "text": "66 “太古，G. 沃伦收藏，”《中国历史照片》，2018年5月访问，https://www.hpcbristol.net/collections/swire-g-warren。"}, {"type": "note", "text": "67 “卡罗尔家族收藏，”卡罗尔家族收藏，《中国历史照片》，2018年6月2日访问，https://www.hpcbristol.net/collections/carrall-family。"}, {"type": "note", "text": "68 丁燕南，“复兴跨国精英社交性：上海的社交俱乐部”，载《城市与超级富豪：房地产、精英实践与城市政治经济学》，雷·福雷斯特、许倩仪和巴特·维辛克编（纽约：帕尔格雷夫·麦克米伦美国公司，2017年），127-146页。"}, {"type": "note", "text": "69 帕梅拉·J. 英格尔斯比，《按钮操作者与图像制作者：19世纪晚期美国业余摄影的社会重构》，《视觉社会学》第5卷，第1期（1990年）：18-25。"}, {"type": "note", "text": "70 莫里森，J. K.，总裁。珀金斯，博士，副总裁。米尔斯，博士，名誉秘书。《北华 desk 行名录》"}, {"type": "note", "text": "1889年1月14日。"}, {"type": "note", "text": "71 有些成员具有科学背景：例如，威廉·B.邦内尔（William B. Bonnell，1847—1912），卫斯理学院（Wesleyan College）科学系教授，于1884年接受了中国上海中西书院（Anglo-Chinese College）自然科学讲席；W.J.米尔斯博士（Dr. W.J. Milles）是英国皇家外科医学院（British Royal College of Surgeons）会员，并持有执照"}, {"type": "note", "text": "72 《中国摄影俱乐部展览》，《字林西报》，1889年6月22日，第575页。"}, {"type": "note", "text": "73 同上。"}, {"type": "note", "text": "74 《最新消息》，《字林西报》，1891年10月28日，第411页。"}, {"type": "note", "text": "75《最新消息》，《字林西报》，1891年5月6日，第407页。"}, {"type": "note", "text": "76 玛丽-克莱尔·贝尔热（Marie-Claire Bergère），《上海社会的万花筒》（“The Kaleidoscope of Shanghai Society”），载《上海：中国通往现代性之门》（Shanghai: China’s Gateway to Modernity），斯坦福：斯坦福大学出版社，2009年，第84—108页。"}, {"type": "note", "text": "77 中国摄影俱乐部（China Camera Club）在《北华捷报行名录》（The North China Desk Hong List）上的登记信息，该名录出版至1895年。"}, {"type": "note", "text": "78 《中国摄影俱乐部》，《北华捷报暨最高法院与领事公报》，1906年5月18日，第5页。"}, {"type": "note", "text": "79 《北华捷报及最高法院与领事公报》，1902年3月26日，第5页。"}, {"type": "note", "text": "80 查尔斯·尤尔特·达温特，《上海：旅行者与居民主要名胜指南》，"}, {"type": "note", "text": "81 这些照片被收录在《上海：供旅行者与居民了解外国租界及老城内外主要名胜的手册》一书中，而“中国历史照片”网站则发布了一册他本人拍摄的照片相册。克里斯蒂安·昂里奥，《查尔斯·尤尔特·达温特的照片》。虚拟上海，访问日期：2018年4月16日，https://www.virtualshanghai.net/references/biography?ID=38。"}, {"type": "note", "text": "82 《最新情报》，《字林西报》，1892年4月1日，第295页。"}, {"type": "note", "text": "83 《上海摄影学会》，《北华捷报》，1923年4月13日。"}, {"type": "note", "text": "84 《北华捷报及最高法院与领事公报》，1914年12月2日；《北华日报》"}, {"type": "note", "text": "85 泽维尔·奥尔特尔斯-尼古劳，《胡安·门卡里尼与世纪末中国的业余摄影》，载于《克里提卡·库尔图拉》，"}, {"type": "note", "text": "86 “中国摄影俱乐部”，《北华捷报》，1889年6月22日。"}, {"type": "note", "text": "87 阿莉西亚·比尤伊克·立德，《李鸿章：他的生平与时代》（伦敦：卡塞尔公司，1903年），卷首插图。"}, {"type": "title", "text": "第二章"}, {"type": "note", "text": "88 阿尔弗雷德·斯蒂格利茨，《手提相机——其当下的重要性》，《美国摄影年鉴》，1897年，18-"}, {"type": "note", "text": "27。"}, {"type": "note", "text": "89 叶凯蒂指出，早期的摄影爱好者同时也是石印画报的读者。见叶凯蒂，《画框之外：民国上海与战时重庆的相机》，载《笔与快门：中国早期摄影》，111-119。"}, {"type": "note", "text": "90 玛丽-克莱尔·白吉尔：《上海资本主义的黄金时代（1912—1937）》，载《上海：中国通向现代性之门》（斯坦福：斯坦福大学出版社，2009年），第147—176页。"}, {"type": "note", "text": "91 这很可能是1888年生产的柯达（原版）相机，因为二号柯达相机是从10月开始生产的"}, {"type": "note", "text": "1889年。《申报》，1889年3月10日，第6页。中文原文为：“啟者今有照相鏡，其法極易，雖未經學習者亦能影照。其鏡以手捧持，能照沿路樹木，田地船隻，山水人物房屋一切等類毫髮無差。重只九兩，收攏時長六寸，闊四寸七分五，高一寸七分五，所照之相能闊至四寸二分五，高三寸二分五。辦此鏡及知照法者，可至英國倫敦鈕猛街第八十八號門牌西，和行內面議。上海則問大英醫院可也。”全文译文为：“最近我们有一种新型相机，使用方法非常简单，即使从未学过的人也能轻松学会。这种相机可以手持，能够清晰地拍摄路旁的树木、田地、船只、山水、人物、房屋等一切事物，毫发不差。它重仅九两（450克），收拢时长六寸，宽四寸七分五，高一寸七分五，所拍照片可宽至四寸二分五，高三寸二分五。欲购买此相机并了解拍照方法者，可前往英国伦敦钮猛街第八十八号门牌西，和行内面议。在上海则可向大英医院询问。”"}, {"type": "note", "text": "折叠后高1.75寸。图片宽4.25寸，高3.25寸。如欲购买并了解方法，请前往英国伦敦牛津街88号，或上海英华药房。”"}, {"type": "note", "text": "92 在第一次世界大战（1914—"}, {"type": "note", "text": "1918年）。然而，到1917年和1918年，英国进口已经下降，而从日本的进口大约翻了一番，从美国的进口大约增至三倍，日本成为最大的来源国。见“中國進口照相用品[中国照相用品进口]”，载《中外經濟週刊》[《中外经济周刊》]，第43期（1924年）：36。"}, {"type": "note", "text": "93 罗志田。《权力的转移》，（莱顿，荷兰：博睿学术出版社，2017年），xxii。"}, {"type": "note", "text": "94 杰弗里·巴钦，〈起源故事〉，载《燃烧的欲望：摄影的构想》（剑桥：麻省理工学院出版社，1997年），17-24。"}, {"type": "note", "text": "95 邹并非在中国传播几何光学的第一群人。十七世纪中国的耶稣会士"}, {"type": "note", "text": "96 赫尔穆特·格恩斯海姆，《摄影史：从十一世纪暗箱的最早使用开始》"}, {"type": "note", "text": "97 1839年10月19日，摄影术发明的消息传到了中国——仅在……两个月之后"}, {"type": "note", "text": "98 冯桂芬，《采西学议》（沈阳：辽宁人民"}, {"type": "note", "text": "99 郭适：〈作为主体的中国人：十九世纪摄影类型〉，载《画笔与快门》，91-106。"}, {"type": "note", "text": "100 杰弗里·W. 科迪与弗朗西斯·特帕克，《透过外国玻璃：晚清中国的摄影艺术与科学》，载《毛笔与快门》，第33—68页。"}, {"type": "note", "text": "101 同上"}, {"type": "note", "text": "102 约翰·汤姆森，《马六甲海峡、印度支那与中国；或海外十年旅行、冒险与居留记》（伦敦：桑普森·洛、马斯顿、洛与塞尔出版社，1875年），第519—521页。"}, {"type": "note", "text": "103 广告，《申报》，1873年10月1日，第6页。"}, {"type": "note", "text": "104 广告，《申报》，1883年10月17日。第5页。"}, {"type": "note", "text": "105 白吉尔（Marie-Claire Bergère），《上海资本主义的黄金时代（1912—1937）》，载《上海：中国通向现代性之门》（斯坦福：斯坦福大学出版社，2009年），第147—176页。"}, {"type": "note", "text": "106 蔡维屏，《导论：消费者、社群、个体：新中国的读者群》，载《阅读〈申报〉：1919—1937年间中国的民族主义、消费主义与个体性》（帕尔格雷夫·麦克米伦出版社，2010年），第1页起。"}, {"type": "note", "text": "17。"}, {"type": "note", "text": "107 李欧梵，《现代性及其不满：五四运动的文化议程》，载李侃如等编，《现代中国透视：四个周年纪念》（劳特利奇出版社，2016年），第159页。"}, {"type": "note", "text": "108 罗志田。《权势转移》，（莱顿，荷兰：博睿学术出版社，2017年），第108页。"}, {"type": "note", "text": "109 巫鸿，〈自我与民族的诞生：剪辫〉，载《聚焦：中国摄影史》，第85—123页。"}, {"type": "note", "text": "110 溥仪于20世纪50年代在中国抚顺，应中华人民共和国要求撰写了这部自传。见溥仪，《从皇帝到公民：爱新觉罗·溥仪自传》（北京：外文出版社，1964年），第131页。"}, {"type": "note", "text": "111 溥仪，《从皇帝到公民：爱新觉罗·溥仪自传》（北京：外文出版社，1964年），"}, {"type": "note", "text": "112 顾伊，《名之何谓？摄影与中国视觉真实的重新发明，1840—1911》，《艺术公报》第95卷第1期（2013年）：120—138。"}, {"type": "note", "text": "113 清室内务府总务科为溥仪所阅报纸设立了“送报档”，详细记录每日送达报纸的名称与份数。若某报当日未能送到，则须列明原因，并于日后补送。例如，1924年7月29日，《上海日报》（上海日報）因火车晚点未能及时送达，要求次日补送；8月21日，《复报》（複報）因战事停刊，《时报》（時報）被警察厅扣留。参见谢小华（謝小華），《皇帝爱看报》（Huangdi ai kanbao 皇帝愛看報），《紫禁城》2006年第5期（5月）：74—79。"}, {"type": "note", "text": "114 “德國皇帝匿居荷蘭亞墨龍琴古堡最近之攝影”［德国皇帝近期匿居荷兰多恩庄园城堡之照片］，《東方雜誌》第17卷第2期（1920年）：1。"}, {"type": "note", "text": "115 喜龙仁（Osvald Sirén）：《中国皇帝充当摄影助手》，《纽约时报杂志》，1923年4月4日。"}, {"type": "note", "text": "116 这张照片首次向公众披露，见于庄士敦1934年在伦敦出版的《紫禁城的黄昏》一书。参见庄士敦（Reginald F. Johnston）《紫禁城的黄昏》（纽约：Appleton & Company，1934年）。1946年7月，北平故宫博物院对溥仪在天津的财产进行清点。在其222箱家用物品中，有4箱照片、2箱底片和1箱玻璃底片。自2013年起，北京故宫博物院与台北故宫博物院推动了一项合作项目，对溥仪的旧照片进行分类和整理。2015年5月，北京故宫博物院举办了“光影百年：故宫博物院藏老照片展”。同一展览于2016年1月在台北故宫博物院展出。"}, {"type": "note", "text": "117 彭丽君：《导论》，载《扭曲的镜子：中国视觉现代性》（檀香山：夏威夷大学出版社，2007年），第1—29页。"}, {"type": "note", "text": "118 鲁迅：《论照相之类》，载《鲁迅全集》第一卷（北京：人民文学出版社，1973年），第167—176页。"}, {"type": "note", "text": "119 巫鸿：《自我与民族的诞生：剪辫》，载《聚焦：中国摄影史》，第85—123页。"}, {"type": "note", "text": "120 彭丽君，《导论》，载《哈哈镜：中国视觉现代性》，第1-29页。"}, {"type": "note", "text": "121 约翰·彼得·伯杰，《摄影的用途》，收入《理解一张照片》，100–118页。（伦敦：企鹅出版社，"}, {"type": "note", "text": "122 罗志田，《权力的转移》，（荷兰莱顿：博睿学术出版社，2017年），第138-139页。"}, {"type": "note", "text": "123 许纪霖，《重建社会重心——现代中国的“知识人社会”》，载王汎森，《中国近代思想史的转型时代》，（新北：联经出版社，2007年），第137-168页。"}, {"type": "note", "text": "124 罗志田，《权力的转移》，（荷兰莱顿：博睿出版社，2017年），第160页。"}, {"type": "note", "text": "125 他们内部也存在不同的分野。正如冯兆基所论，有理想化西方文化的文化激进主义，有通过中西思想汇流来捍卫民族遗产的文化保守主义，也有新儒家，他们或强调“返本开新”，或强调“创新固本”。新知识分子群体挪用西方思想，将其调适为本土话语，并建构了一种关于中国现代性的新愿景。冯兆基，“导论”，载《中国现代性的思想基础：民国时期的文化与政治思想》（剑桥：剑桥大学出版社，2010年），"}, {"type": "note", "text": "1-26。"}, {"type": "note", "text": "126 克里斯托弗·A. 里德，《导论》，载《上海的古腾堡：中国印刷资本主义，1876—1937》（温哥华：不列颠哥伦比亚大学出版社，2004年），第3—24页。"}, {"type": "note", "text": "127 朱怀远，「宋教仁被刺真相考辩」，《民国档案》，第3期（2010年）：78–86。"}, {"type": "note", "text": "128 玛丽-克莱尔·贝尔热，《上海资本主义的黄金时代（1912—1937）》，载《上海：中国通往现代性之门》（斯坦福：斯坦福大学出版社，2009年），第147—176页。"}, {"type": "note", "text": "129 白吉尔，《中国的资产阶级，1911—1937》，载《剑桥中国史》，第12卷（1983年）："}, {"type": "note", "text": "721—825。"}, {"type": "note", "text": "130 “花旗銀行之攝影展覽會 [The Photo Exhibition of National City Bank]，”《攝影畫報》[Pictorial Weekly] 第5卷，第201期（1929年）：7。"}, {"type": "note", "text": "131 帕梅拉·J. 英格尔斯比，《按快门者与制图者：19世纪后期美国业余摄影的社会重构》，《视觉社会学》第5卷第1期（1990年）：18-25。"}, {"type": "note", "text": "132 葛一虹，《爱美剧的提出及其实践》，《中国话剧通史》（北京：文化艺术出版社，2015年），51-69。"}, {"type": "note", "text": "133 刘半农，\"《北平光社年鑒》序言\"，收入《中国近代摄影艺术美学选》，第203—206页。"}, {"type": "note", "text": "134 陈传霖（陳傳霖），《中国》，载《年度摄影作品：世界画意摄影作品年度评论》，F. J. 莫蒂默编，伦敦：Iliffe & Sons，1936年，第24页。"}, {"type": "note", "text": "135 伊士曼柯达公司于1885年在英国伦敦开设了一家批发办事处。1891年，柯达在英国哈罗开设了第一家海外工厂。乔治·伊士曼于1898年通过合并伦敦的伊士曼摄影材料公司和美国伊士曼柯达公司，创立了柯达有限公司。里斯·V. 詹金斯，《技术与市场：乔治·伊士曼与大众业余摄影的起源》，《技术与文化》，第16卷，第1期（1975年1月）：第1-19页。"}, {"type": "note", "text": "136 《柯达有限公司在此开业》，《大陆报》，1921年4月2日，第2页。"}, {"type": "note", "text": "137 1924年，美国伊士曼柯达公司的E. P. 鲁特被派往上海担任经理。除了经理之外，店里还有许多中国助理。王文浩曾在本地照相馆工作，担任柯达产品在上海的代理商，与柯达上海分公司的经理频繁沟通。费开林（Fei Kailing）費開林，“王文浩谈柯达在上海”，“汉声杂志”（Echo Magazine）漢聲雜誌，1977年1月，第64-65页。"}, {"type": "note", "text": "138 广告，《申报》，1926年3月3日，第12页。"}, {"type": "note", "text": "139 佟冰雪，《中国照相馆史》，第55页。"}, {"type": "note", "text": "140 赵俊毅，《中国摄影史拾珠》[被遗忘的中国摄影史话]（北京：中国民族摄影出版社，2013年），第22—25页。"}, {"type": "note", "text": "141 《康泰时摄影展览会出品一斑》，《图画时报》，第174期（1935年）：第5页；《康泰时名作影展》，《天津商报每日画刊》，第20卷第29期（1936年）：第2页。"}, {"type": "note", "text": "142 皮埃尔·布迪厄区分了两类业余摄影师，一类是偶尔拍照的摄影师，他们偶尔拍摄照片——记录家庭事件、社交聚会或旅行。对于这类摄影师而言，“摄影实践在大多数时候仅仅依靠其家庭功能而存在并延续，或者更确切地说，是依靠家庭群体赋予它的功能，即使家庭生活中的重要时刻显得庄严并使之不朽。”与偶尔摄影相对，布迪厄认为，“专注的”摄影师追求技术与审美的完美。皮埃尔·布迪厄，《统一性崇拜与有教养的差异》，载《摄影：一种中产阶级艺术》，肖恩·怀特塞德译（剑桥：政体出版社，1996年），第13—72页。"}, {"type": "note", "text": "143 劳伦斯·W. 莱文，《高雅文化、低俗文化：美国文化等级制度的兴起》（剑桥：哈佛大学出版社，1988年），86，100，149。"}, {"type": "note", "text": "144 “中国摄影俱乐部成立，以发展摄影艺术”，《大陆报》，1925年8月16日，16。"}, {"type": "note", "text": "145 广告，《申报》，1923年2月9日，17。"}, {"type": "note", "text": "146 广告，《中国柯达》，1931年，第2卷，第12期，无页码。"}, {"type": "note", "text": "147 广告，《中国柯达》，1931年，第2卷第8期，无页码。"}, {"type": "note", "text": "148 广告，《申报》，1926年9月19日，第3页。"}, {"type": "note", "text": "149 “柯达公司创办照相学校 [Kodak Company Established Photography School]”，《申报》，1921年12月23日，第4版。"}, {"type": "note", "text": "150 “柯达有限公司。中国上海，”《柯达杂志》第四卷，第2期（1923年7月）：3。"}, {"type": "note", "text": "151 广告，载《申报》，1929年5月16日，第1版。"}, {"type": "note", "text": "152 “照片分析 照片分析 [Photo Analysis]，”《中国柯达》7，第8期（1936）：12。"}, {"type": "note", "text": "153 罗兰·巴特，《明室：摄影纵横谈》，理查德·霍华德译（纽约：希尔与王出版社，"}, {"type": "note", "text": "1981），115。"}, {"type": "note", "text": "154 “Keda sheying baoku 柯達攝影寶庫［Kodak Photographic Treasury］”，《Chinese Kodakery》第2卷第8期（1931年）：1。"}, {"type": "note", "text": "155 赵君毅。Zhongguo sheyingshi shizhu，86-91。"}, {"type": "note", "text": "156 刘半农，《半农谈影》，载《中国近代摄影艺术美学选》，177-202页。"}, {"type": "note", "text": "158 光社的创始成员包括北京大学的七位教职员。陈万里，历史系讲师；吴郁周，物理系和外语系教授；钱景华（1935—），工程师；汪孟舒，古琴演奏家；黄振玉，国学系讲师；以及王琴希和吴辑熙，二人均为国学系教授。陈学圣，《寻回失落的民国摄影》（台北：福井艺术出版社，2015年），第76页。"}, {"type": "note", "text": "159 刘半农，《北平光社年鉴序言》，载《中国近代摄影艺术美学选》，207—209页。第四次年度展览之后，光社的16名成员共挑选出56幅照片，于1928年1月1日将其作为年鉴出版。第二部年鉴在第五次年度展览之后出版。"}, {"type": "note", "text": "160 《华社影展专号》，《中国摄影》第3卷第6期（1928年12月）。"}, {"type": "note", "text": "161 《华社第三次摄影展览会出品之一斑》，载《上海漫画》第85期（1929年4月）：第1—2页。"}, {"type": "note", "text": "162 褚民谊在《中国评论》上发表文章，认为摄影可以促进美育。褚民谊：《美的真诠》[Th text": "254 本雅明用德语词Erlebnis来描述现代经验，该词被译为“震惊体验”。波德莱尔的诗歌不仅记录了转瞬即逝、短暂易逝、朝生暮死的意象，也试图回应这些变化。参见瓦尔特·本雅明，《论波德莱尔的几个主题》，载《选集》第四卷：1935—1938，霍华德·艾兰和迈克尔·詹宁斯编（剑桥：贝尔纳普出版社，2003年），第313—355页。另见斯科特·麦克拉肯，《想象现代主义城市》，载《牛津现代主义手册》，彼得·布鲁克编（牛津：牛津大学出版社，2010年），第644页。"}, {"type": "note", "text": "255 胡晉康，《上海的影戏院：虹口大戏院》，《良友》第62期（1931年）：第33页。"}, {"type": "note", "text": "256 正如罗伯特·西尔伯曼（Robert Silberman）在分析金士生的1934年影像《大戏院》（Grand Theatre）时所说，《世界在前进》（The World Moves On）——这是电影院外立面上公告的一部电影片名——是对1930年代上海的最佳概括。罗伯特·西尔伯曼，“引言”，载《陈迹：金士生与现代中国摄影》，20–30页。"}, {"type": "note", "text": "257 玛丽亚·莫里斯·汉堡，《从291到现代艺术博物馆：纽约的摄影，1910—1937》，载《新视野：两次世界大战之间的摄影》（纽约：大都会艺术博物馆：哈里·N·艾布拉姆斯发行，1989年），第3—63页。"}, {"type": "note", "text": "258 克里斯托弗·菲利普斯，《复兴视觉：两次世界大战之间的欧洲摄影》，载《新视觉：两次世界大战之间的摄影》（纽约：大都会艺术博物馆；由哈里·N. 艾布拉姆斯发行，1989年），第65—108页。"}, {"type": "note", "text": "259 拉兹洛·莫霍利-纳吉，《生产-复制》，《风格派》，第5期（1922年），第98–100页。"}, {"type": "note", "text": "260 保罗·W. 里基茨，《万花筒式的现代主义：上海与东京画报中的蒙太奇美学》，"}, {"type": "note", "text": "1920年代与1930年代》，载《良友：万花筒式的现代性与上海全球大都市，1926–1945》（莱顿：博睿，2013年），第17–44页。"}, {"type": "note", "text": "261 塞莱斯特·康纳，“城市”，载《民主愿景：斯蒂格利茨圈子的艺术与理论，1924—1934》（伯克利：加利福尼亚大学出版社，2001年），第141—194页。"}, {"type": "note", "text": "262 恩斯特·布洛赫，《我们时代的遗产》，内维尔和斯蒂芬·普莱斯译（伯克利：加利福尼亚大学出版社，1991年），第1—3页。"}, {"type": "note", "text": "263 罗伯特·西尔伯曼，“导论”，载《陈迹：金石声与现代中国摄影》，第20—30页。"}, {"type": "note", "text": "264 斯科特·麦克拉肯，《想象现代主义城市》，载《牛津现代主义手册》，637-654页。"}, {"type": "note", "text": "265 乔治·伊士曼，《柯达手册》，手稿，乔治·伊士曼故居图书馆，纽约州罗切斯特。"}, {"type": "note", "text": "266 南希·玛莎·韦斯特，《柯达与怀旧之镜》（弗吉尼亚州夏洛茨维尔：弗吉尼亚大学出版社，"}, {"type": "note", "text": "2000年），第37页。"}, {"type": "note", "text": "267 彼得·D. 奥斯本，《悖论式娱乐：旅游与现代形象》，载《轻装旅行：摄影、旅行与视觉文化》（英国曼彻斯特：曼彻斯特大学出版社，2000年），第70—78页。"}, {"type": "note", "text": "268 苏珊·桑塔格，《在柏拉图洞穴中》，载《论摄影》，第1—19页。"}, {"type": "note", "text": "269 克里斯托弗·格林，《观察时间与空间的新方式》，载《捕捉光线》（纽约：麦格劳-希尔出版社，2000年），第165-182页。"}, {"type": "note", "text": "270 关于浙江省的公路建设，见诺埃尔·R.迈纳，《浙江：国民党在土地改革与建设方面的努力，1927—1937年》（斯坦福大学博士学位论文，1973年），第233—243页。"}, {"type": "note", "text": "271 1928年至1937年，南京国民政府在南京修建了3600公里铁路。粤汉铁路（粵漢鐵路）于1936年建成，连接南北；陇海铁路于1934年延伸至西安，1936年延伸至宝鸡；浙赣铁路（浙贛鐵路）将沪杭铁路与该国主要干线之一——汉口至广州线连接起来。宓汝成（Mi Lucheng 宓汝成），《国民政府的铁路政策计划和对一些涉外历史问题的处理》（國民政府的鐵路政策計劃和對一些涉外歷史問題的處理"}, {"type": "note", "text": "《国民政府铁路政策计划及有关外交的若干历史问题的解决》，载《中华民国铁路史资料（1921—1949）》（北京：社会科学文献出版社，2002年），第730—841页。"}, {"type": "note", "text": "272 李文辉，《沪杭甬铁路与近代浙江经济发展》，"}, {"type": "note", "text": "《沪杭甬铁路与近代浙江经济发展》，载《沪杭甬铁路与近代浙江社会（1897—1937）》（宁波：宁波大学硕士学位论文，2017年），"}, {"type": "note", "text": "66-72。"}, {"type": "note", "text": "273 骆伯年的照片来自骆的孙子金有明组织的私人收藏。骆伯年1932年从杭州商业学校毕业后购买了他的第一台相机，同年，他成为杭州浙江商业储蓄银行的一名银行职员。两年后，他转入中国银行兰溪分行。骆伯年于1938年至1941年间居住在香港。他住在九龙的弥敦道。在此期间，他拍摄了香港的各个地方，如浅水湾、九龙塘、港口和青山。金有明，《忆我的曾祖父骆伯年》，载《骆伯年》，三影堂摄影艺术中心编（北京：北京联合出版社，2016年），无页码。"}, {"type": "note", "text": "274 约翰·伯格，《保罗·斯特兰德》，载《观看之道》（纽约：国际复古出版社，1992年），第51页。"}, {"type": "note", "text": "275 南希·肖克罗斯，《时间：摄影刺点》，载《罗兰·巴特论摄影》（盖恩斯维尔：佛罗里达大学出版社，1997年），第86—106页。"}, {"type": "note", "text": "276 皮埃尔·布尔迪厄，《统一的崇拜与有教养的差异》，载《摄影：一种中产阶级艺术》，肖恩·怀特塞德译（剑桥：政体出版社，1996年），第19—31页。"}, {"type": "note", "text": "277 大卫·贝特，《摄影的记忆》，《摄影》第3卷，第2期（2010年）：第243—257页。"}, {"type": "note", "text": "278 莫亚君，《共和国的行程：近代中国的旅游与旅行文化，1886—1954》（博士学位论文，加利福尼亚大学圣克鲁兹分校，2011年），第176—264页。"}, {"type": "note", "text": "279 “有声旅行团赴洞庭山旅行 [The Unison Travel Group traveled to Dongting Mount]”，《申报》，1922年12月25日，第5页。"}, {"type": "note", "text": "280 《申报》，1929年8月30日，无页码。"}, {"type": "note", "text": "281 《西湖博览会闭幕前消息》，《申报》，1929年9月13日，第4版。"}, {"type": "note", "text": "282 朴敬石：《民国时期上海的友声旅行团和休闲旅行》，《民国研究》，2010年第1期，第246—261页。"}, {"type": "note", "text": "283 郭锡麒：《友声旅行团旅行富春江之一部》，《图画时报》，第553期（1929年4月），第1页。"}, {"type": "note", "text": "284 “友聲旅行團旅行攝影成績展覽會出品 [The Exhibition of Travel Photographs of the Unison Travel Group]”，《中華圖畫雜誌》[China Pictorial]，第4期（1931年）：13-14。"}, {"type": "note", "text": "285 沈杏初，《普陀名胜志略》，《游声》普陀特刊（1929年）：7-18。"}, {"type": "note", "text": "286 郎靜山，《普陀海邊》，《紅玫瑰》第5卷第35期（1929年）：2。"}, {"type": "note", "text": "287 《大陆报》，1929年8月11日，第3页。"}, {"type": "note", "text": "288 《普陀》，《中国柯达》第3卷       btn.innerHTML = `<span>${label[0]}</span><span class="sub">${label[1]}</span>`;
    } else {

    }

  // group separators
  if(id==='intro' || id==='notes'){

/* ============ Full-text search ============ */
function secTitle(id){
  const map = {
    "intro": "导论",
    "ch1": "第一章 无所不在的凝视",
    "ch2": "第二章 重访“柯达时刻”",
    "ch3": "第三章 影像的民主化",
    "ch4": "第四章 便携的风景",
    "ch5": "第五章 重构现实主义",
    "concl": "结论",
    "notes": "注释",
    "biblio": "参考文献",
    "figs": "插图目录" };
  return map[id] || id;
}
// Build a search index once: for each section, for each para, keep en+zh text
let searchIndex = null;
function buildSearchIndex(){
  searchIndex = EN.map(sec=>{
    const zsec = ZH.find(x=>x.id===sec.id) || {paras:[]};
    const zhMap = {};
    zsec.paras.forEach((z,i)=>zhMap[i]=z&&z.text?z.text:'');
    const items = sec.paras.map((p,i)=>{
      const en = (typeof p==='object'?p.text:p)||'';
      const zh = zhMap[i]||'';
      return {i, en, zh, type:(typeof p==='object'?p.type:'text')};
    });
    return {id:sec.id, title:secTitle(sec.id), items};
  });
}
function countMatches(q, text){
  if(!q || !text) return 0;
  let c=0, idx=text.toLowerCase().indexOf(q.toLowerCase());
  while(idx!==-1){ c++; idx=text.toLowerCase().indexOf(q.toLowerCase(), idx+q.length); }
  return c;
}
function highlight(text, q){
  if(!q) return esc(text);
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  let out='', last=0, idx=lower.indexOf(ql);
  while(idx!==-1){
    out += esc(text.slice(last,idx)) + `<mark>${esc(text.slice(idx,idx+ql.length))}</mark>`;
    last = idx+ql.length;
    idx = lower.indexOf(ql, last);
  }
  out += esc(text.slice(last));
  return out;
}
function snippet(text, q, maxLen){
  maxLen = maxLen||120;
  if(!q) return (text.length>maxLen? text.slice(0,maxLen)+'…': text);
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  let pos = lower.indexOf(ql);
  if(pos===-1) pos = 0;
  else pos = Math.max(0, pos - maxLen/3);
  let s = text.slice(pos, pos+maxLen);
  return (pos>0?'…':'')+s+(pos+maxLen<text.length?'…':'');
}
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchTimer=null, searchOpen=false;
function closeSearch(onClicking){
  searchOpen=false;
  searchResults.classList.remove('open');
  if(!onClicking) searchInput.blur();
}
function runSearch(){
  const q = searchInput.value.trim();
  if(!q){ closeSearch(); return; }
  if(!searchIndex) buildSearchIndex();
  // gather matches across all sections, cap overall
  const MAX_TOTAL = 60, PER_SEC = 14;
  let results = [], total=0;
  for(const sec of searchIndex){
    if(total>=MAX_TOTAL) break;
    let hit={sec, items:[]};
    for(const it of sec.items){
      const cm = countMatches(q, it.en);
      const cz = countMatches(q, it.zh);
      if(cm||cz){ hit.items.push(it); }
      if(hit.items.length>=PER_SEC){ break; }
    }
    total += hit.items.length;
    if(hit.items.length) results.push(hit);
  }
  searchResults.innerHTML='';
  if(!results.length){
    searchResults.innerHTML = '<div class="sr-empty">未找到相关内容</div>';
  } else {
    const head=document.createElement('div');
    head.className='sr-head';
    head.textContent = `${total} 处匹配 · ${q}`;
    searchResults.appendChild(head);
    results.forEach((hit,k)=>{
      // section header row
      const sh=document.createElement('div');
      sh.className='sr-item';
      sh.style.cursor='default';
      sh.innerHTML = `<div class="sr-meta" style="font-size:11.5px;color:var(--accent);font-weight:600">▸ ${esc(hit.sec.title)}</div>`;
      searchResults.appendChild(sh);
      hit.items.forEach((it)=>{
        const row=document.createElement('div');
        row.className='sr-item';
        row.innerHTML =
          `<div class="sr-meta"><b>${esc(hit.sec.title)}</b> · 段 ${it.i+1}</div>` +
          `<div class="sr-text">${highlight(snippet(it.en,q),q)}</div>` +
          (it.zh?`<div class="sr-text" style="color:#6a6044">${highlight(snippet(it.zh,q),q)}</div>`:'');
        row.addEventListener('click',(ev)=>{ ev.stopPropagation(); openResult(hit.sec.id, it.i); });
        searchResults.appendChild(row);
      });
    });
  }
  searchResults.classList.add('open');
  searchOpen=true;
}
function openResult(sectionId, paraIdx){
  closeSearch(true);
  goTo(sectionId);
  // align both scroll containers to that paragraph (滚动定位，不加整段高亮)
  setTimeout(()=>{
    ['en','zh'].forEach(lang=>{
      const pair = colPair(lang);
      const top = paraScrollTop(pair, paraIdx);
      if(top !== null){
        pair.scroll.scrollTop = Math.max(0, top);
      }
    });
  }, 30);
}
searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(runSearch, 200);
});
searchInput.addEventListener('focus',()=>{ if(searchInput.value.trim()) runSearch(); });
document.addEventListener('click',(e)=>{ if(searchOpen && !e.target.closest('.search-box')) closeSearch(); });
searchInput.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ closeSearch(); } });

/* ============ Render ============ */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function paraHTML(p, lang){
  const t = p.text || '';
  const cls = p.type==='title' ? 'p title' : (p.type==='note' ? 'note' : 'p');
  return `<p class="${cls}" data-lang="${lang}">${t}</p>`;
}

let current = null;
function goTo(id){
  current = id;
  const enEl = document.getElementById('article-en');
  const zhEl = document.getElementById('article-zh');
  const sec = EN.find(x=>x.id===id);
  const zsec = ZH.find(x=>x.id===id) || {paras:[]};

  const zmap = {};
  zsec.paras.forEach((z,i)=>zmap[i]=z.text||'');

  // clear
  enEl.innerHTML=''; zhEl.innerHTML='';

  const titleMap={
    "intro": "导论 · Introduction",
    "ch1": "第一章 无所不在的凝视 · Ch.1 The Ubiquitous Gaze",
    "ch2": "第二章 重访“柯达时刻” · Ch.2 Revisiting the \"Kodak Moment\"",
    "ch3": "第三章 影像的民主化 · Ch.3 Democratization of the Images",
    "ch4": "第四章 便携的风景 · Ch.4 Portable Landscapes",
    "ch5": "第五章 重构现实主义 · Ch.5 Reconfiguring Realism",
    "concl": "结论 · Conclusion",
    "notes": "注释 · Notes",
    "biblio": "参考文献 · Bibliography",
    "figs": "插图目录 · List of Figures" };

  // Section title
  const h = document.createElement('div');
  h.innerHTML = `<p class="chapter-title">${titleMap[id]||sec.title}</p><p class="chapter-sub">${esc(sec.title)}</p>`;
  enEl.appendChild(h.cloneNode(true));
  zhEl.appendChild(h.cloneNode(true));

  sec.paras.forEach((p,i)=>{
    enEl.insertAdjacentHTML('beforeend', paraHTML(p,'en'));
    const zt = zmap[i];
    // Mirror structure in Chinese (same para index i, so the two columns always align 1:1)
    let zhHtml;
    if(p.type==='title'){
      zhHtml = `<p class="p title" data-lang="zh">${esc(zt||'')}</p>`;
    } else if(p.type==='note'){
      zhHtml = `<p class="note" data-lang="zh">${esc(zt||'')}</p>`;
    } else if(zt){
      zhHtml = `<p class="p" data-lang="zh">${esc(zt)}</p>`;
    } else {
      // Reference sections (Notes/Bibliography/Index) are citations & entries:
      // mirror the source text so the page reads complete (no blank placeholders)
      const mirror = (id==='notes' || id==='backmatter') ? (p.text||'') : '';
      if(mirror){
        zhHtml = `<p class="p" style="color:#3a3a3a" data-lang="zh">${esc(mirror)}</p>`;
      } else {
        zhHtml = `<p class="p" style="color:#b6b0a6" data-lang="zh">（尚未翻译）</p>`;
      }
    }
    // stamp the paragraph index so the paired column can jump to the exact spot
    zhHtml = zhHtml.replace('<p ', '<p data-i="'+i+'" ');
    zhEl.insertAdjacentHTML('beforeend', zhHtml);
    // stamp index on the just-inserted EN paragraph too
    const enP = enEl.lastElementChild;
    if(enP) enP.setAttribute('data-i', i);
  });

  // active state
  document.querySelectorAll('.toc-item').forEach(el=>{
    el.classList.toggle('active', el.textContent.includes(labelOf(id)));
  });
  var scE = document.getElementById('scroll-en');
  var scZ = document.getElementById('scroll-zh');
  if(scE) scE.scrollTop = 0;
  if(scZ) scZ.scrollTop = 0;
}
function labelOf(id){
  const s = EN.find(x=>x.id===id);
  return s? s.title : id;
}

/* ============ Scroll sync: scrolling one column precisely parks the
   other column on the SAME paragraph (matched by data-i) ============ */
// Pairs of (scroll container, content container) for each column.
// In the real layout the SCROLL container is the <section class="col">
// (overflow-y:auto); the <div id="article-*"> is just content inside it.
function colPair(lang){
  return {
    scroll: document.getElementById(lang==='en'?'scroll-en':'scroll-zh'),
    content: document.getElementById(lang==='en'?'article-en':'article-zh')
  };
}
// Height of the sticky column header (so a paragraph's first line isn't hidden under it).
function headerOff(pair){
  var h = pair.scroll.querySelector('.col-head');
  if(!h) return 0;
  try{
    var cs = getComputedStyle(h).position;
    if(cs==='sticky' || cs==='fixed') return h.offsetHeight;
  }catch(e){}
  return 0;
}
// Absolute top (in scroll pixels) of a paragraph within its scroll container.
function paraScrollTop(pair, i){
  var tgt = pair.content.querySelector('[data-i="'+i+'"]');
  if(!tgt) return null;
  var sRect = pair.scroll.getBoundingClientRect();
  var pRect = tgt.getBoundingClientRect();
  // Align the paragraph's FIRST LINE just below the sticky header (so it's visible),
  // instead of tucking it underneath and showing later lines.
  return (pRect.top - sRect.top) + pair.scroll.scrollTop - headerOff(pair);
}
// Index of the paragraph currently at the top area of the scroll container.
// 平滑滚动到目标列（用于句级对齐时把对侧滚到对应句所在段）。
var animActive = false;  // 是否正在播放平滑滚动动画
var animCancel = null;   // 取消动画的令牌
var SAVED_POS = null;    // last reading position (section + both scroll tops)

// Smoothly scroll a column to targetTop.
function smoothGoto(scrollEl, targetTop){
  var start = scrollEl.scrollTop;
  var delta = Math.max(0, targetTop) - start;
  if(Math.abs(delta) < 3){ return; }
  if(animCancel) animCancel.cancelled = true;
  var tok = {cancelled:false}; animCancel = tok;
  animActive = true;
  var dur = Math.min(280, 150 + Math.abs(delta)*0.05);
  var t0 = null;
  function step(ts){
    if(tok.cancelled){ animActive = false; return; }
    if(t0 === null) t0 = ts;
    var p = Math.min(1, (ts - t0)/dur);
    var ease = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
    scrollEl.scrollTop = start + delta*ease;
    if(p < 1){ requestAnimationFrame(step); }
    else { animActive = false; animCancel = null; }
  }
  requestAnimationFrame(step);
}
// 仅滚动目标列到该段（不加整段高亮），用于句级对齐时只突出对应句
function scrollToPara(otherLang, i){
  var other = colPair(otherLang);
  var top = paraScrollTop(other, i);
  if(top === null) return;
  smoothGoto(other.scroll, top);
}


/* ================= 笔记：选中画线 / 高亮 ================= */
var BOOK_KEY = 'readerhub_notes_kodak-china';
var HL_COLORS = [
  {name:'黄',hex:'#ffe58a'},
  {name:'青',hex:'#a9e9ee'},
  {name:'粉',hex:'#ffc0cb'},
  {name:'绿',hex:'#b8e8ae'},
  {name:'橙',hex:'#ffd9a8'}
];
var NOTES = loadNotes();
function loadNotes(){ try{ return JSON.parse(localStorage.getItem(BOOK_KEY))||[]; }catch(e){ return []; } }
function saveNotes(){ try{ localStorage.setItem(BOOK_KEY, JSON.stringify(NOTES)); }catch(e){ showToast('笔记保存失败'); } }
function articleFor(lang){ return document.getElementById(lang==='en'?'article-en':'article-zh'); }
function escText(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* 重新渲染一个段落的标记（textContent 是原始未标记文本，稳定） */

var TEMP = null;   // 当前本栏选中句 {lang,i,from,to}
var PEER = null;   // 当前跨语言对应句高亮 {lang,i,ranges:[[s,e],...]}

/* 底层按句号切分一段文本（不用于展示，仅用于定位"选中的那一句"） */
function splitSentences(text){
  // 底层按句末标点切分（不用于展示）；支持中英文句末标点 + 紧随的引号/括号
  text=String(text);
  var list=[], start=0, i;
  function flush(end){ var t=text.slice(start,end); if(t){ list.push({start:start,end:end,text:t}); } start=end; }
  for(i=0;i<text.length;i++){
    var c=text[i];
    if('.!?；。！？…'.indexOf(c)>=0){
      var j=i+1;
      while(j<text.length && /[\"''””』」）)\]’”]/.test(text[j])) j++;
      flush(j); i=j-1;
    }
  }
  if(start<text.length) flush(text.length);
  return list;
}
var __SENT_CACHE = {};
function sentsFor(lang,i){
  var key=lang+':'+i;
  if(__SENT_CACHE[key]) return __SENT_CACHE[key];
  var el=articleFor(lang).querySelector('[data-i="'+i+'"]');
  var list = el ? splitSentences(el.textContent) : [];
  __SENT_CACHE[key]=list;
  return list;
}
function sentenceAt(lang, i, from){
  var list=sentsFor(lang,i);
  for(var k=0;k<list.length;k++){ if(from>=list[k].start && from<=list[k].end){ return list[k]; } }
  for(var j=list.length-1;j>=0;j--){ if(list[j].start<=from){ return list[j]; } }
  return list[0];
}

/* 清除所有临时句子高亮 + 跨语言对应高亮 */
function clearTempHL(){
  TEMP=null; PEER=null;
  var marks=document.querySelectorAll('.senthl,.peer-sent');
  for(var k=0;k<marks.length;k++){ var p=marks[k].closest('[data-i]'); if(p) renderMarks(p); }
}
function renderMarks(el){
  if(!el || el.getAttribute('data-i')==null) return;
  var lang=el.getAttribute('data-lang'), i=el.getAttribute('data-i');
  var list=NOTES.filter(function(n){return n.lang===lang && n.i===+i;})
                .sort(function(a,b){return a.from-b.from;});
  var text=el.textContent, html='', pos=0;
  list.forEach(function(n){
    var f=Math.max(pos,n.from), t=Math.min(text.length,n.to);
    if(f>pos) html+=escText(text.slice(pos,f));
    if(t>f){
      if(n.type==='hl') html+='<mark class="hlmark" style="background:'+n.color+'">'+escText(text.slice(f,t))+'</mark>';
      else html+='<u class="ulnote">'+escText(text.slice(f,t))+'</u>';
    }
    pos=Math.max(pos,t);
  });
  // 临时句子高亮（本栏选中句，可叠加在持久标记之上）
  if(TEMP && TEMP.lang===lang && TEMP.i===+i){
    var f=Math.max(pos,TEMP.from), t=Math.min(text.length,TEMP.to);
    if(f>pos) html+=escText(text.slice(pos,f));
    if(t>f) html+='<mark class="senthl">'+escText(text.slice(f,t))+'</mark>';
    pos=Math.max(pos,t);
  }
  // 跨语言对应句高亮（另一栏对齐到的那些句）
  if(PEER && PEER.lang===lang && PEER.i===+i){
    var pr=PEER.ranges.slice().sort(function(a,b){return a[0]-b[0];});
    pr.forEach(function(rg){
      var f=Math.max(pos,rg[0]), t=Math.min(text.length,rg[1]);
      if(f>pos) html+=escText(text.slice(pos,f));
      if(t>f) html+='<mark class="peer-sent">'+escText(text.slice(f,t))+'</mark>';
      pos=Math.max(pos,t);
    });
  }
  if(pos<text.length) html+=escText(text.slice(pos));
  el.innerHTML=html;
}
function renderAllMarks(){
  ['en','zh'].forEach(function(lang){
    var art=articleFor(lang);
    if(!art) return;
    var set={};
    NOTES.forEach(function(n){ if(n.lang===lang) set[n.i]=1; });
    for(var k in set){ var el=art.querySelector('[data-i="'+k+'"]'); if(el) renderMarks(el); }
  });
}

/* 点 (node,off) 在段落内的字符偏移（用 Range 计文本长度，自然兼容嵌套 mark） */
function pointOffsetInPara(para, node, off){
  try{
    var r=document.createRange();
    r.selectNodeContents(para);
    r.setEnd(node, off);
    return r.toString().length;
  }catch(e){ return 0; }
}

/* 从当前选区构建一条笔记；要求选区落在同一段内 */
function buildNote(){
  var sel=window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return null;
  var r=sel.getRangeAt(0);
  var root=r.commonAncestorContainer.nodeType===1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  var lang = root.closest('#article-en') ? 'en' : (root.closest('#article-zh') ? 'zh' : null);
  if(!lang) return null;
  var startPara=r.startContainer.nodeType===3 ? r.startContainer.parentElement : r.startContainer.closest('[data-i]');
  var endPara=r.endContainer.nodeType===3 ? r.endContainer.parentElement : r.endContainer.closest('[data-i]');
  if(!startPara || !endPara || startPara!==endPara) return null;
  var a=pointOffsetInPara(startPara, r.startContainer, r.startOffset);
  var b=pointOffsetInPara(endPara, r.endContainer, r.endOffset);
  var from=Math.min(a,b), to=Math.max(a,b);
  if(to-from<=0) return null;
  return {lang:lang, i:+startPara.getAttribute('data-i'), from:from, to:to,
          text:startPara.textContent.slice(from,to)};
}

/* 工具栏显隐 */
function moveNoteToolbar(){
  var sel=window.getSelection(), tb=document.getElementById('note-toolbar');
  if(!sel.rangeCount||sel.isCollapsed){ tb.style.display='none'; return; }
  var r=sel.getRangeAt(0), rect=r.getBoundingClientRect();
  tb.style.left=Math.max(8, Math.min(window.innerWidth-tb.offsetWidth-8, rect.left+rect.width/2-tb.offsetWidth/2))+'px';
  tb.style.top=Math.max(8, rect.top-tb.offsetHeight-10)+'px';
  tb.style.display='flex';
}
function hideToolbar(){ var tb=document.getElementById('note-toolbar'); if(tb) tb.style.display='none'; }

function bindToolbar(){
  var tb=document.getElementById('note-toolbar');
  HL_COLORS.forEach(function(c){
    var b=document.createElement('span');
    b.title='高亮·'+c.name; b.className='nt hlc'; b.style.background=c.hex;
    (function(hex){ b.onmousedown=function(ev){ ev.preventDefault(); applyNote('hl',hex); }; })(c.hex);
    tb.appendChild(b);
  });
  var ul=document.createElement('span');
  ul.title='画线'; ul.textContent='划线'; ul.className='nt ul';
  ul.onmousedown=function(ev){ ev.preventDefault(); applyNote('ul',null); };
  tb.appendChild(ul);
  var cp=document.createElement('span');
  cp.title='复制选中内容'; cp.textContent='复制'; cp.className='nt cpy';
  cp.onmousedown=function(ev){ ev.preventDefault(); copySelection(); };
  tb.appendChild(cp);
}
function copySelection(){
  var sel=window.getSelection();
  var txt = (sel && !sel.isCollapsed) ? sel.toString()
          : (TEMP ? currentSentenceText() : '');
  if(!txt){ showToast('没有可复制的内容'); return; }
  var ok=false;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ showToast('已复制 '+txt.length+' 字'); },
      function(){ fallbackCopy(txt); });
    ok=true;
  } else { fallbackCopy(txt); }
  if(ok) window.getSelection().removeAllRanges();
  hideToolbar();
}
function currentSentenceText(){
  if(!TEMP) return '';
  var el=articleFor(TEMP.lang).querySelector('[data-i="'+TEMP.i+'"]');
  return el ? el.textContent.slice(TEMP.from,TEMP.to) : '';
}
function fallbackCopy(txt){
  try{
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('已复制 '+txt.length+' 字');
  }catch(e){ showToast('复制失败'); }
}

function applyNote(type,color){
  var note=buildNote();
  window.getSelection().removeAllRanges();
  hideToolbar();
  if(!note){ showToast('请在同一段内选择文字'); return; }
  if(type==='ul'){ note.type='ul'; note.color=null; }
  else { note.type='hl'; note.color=color||HL_COLORS[0].hex; }
  var idx=findNoteIndex(note);
  if(idx>=0) NOTES.splice(idx,1);
  NOTES.push(note);
  saveNotes();
  var el=articleFor(note.lang).querySelector('[data-i="'+note.i+'"]');
  if(el) renderMarks(el);
  showToast((type==='ul'?'已划线':'已高亮'+(colorName(note.color)||''))+'，已保存到笔记');
  refreshPanel();
}
function findNoteIndex(n){
  for(var i=0;i<NOTES.length;i++){ var x=NOTES[i];
    if(x.lang===n.lang&&x.i===n.i&&x.from===n.from&&x.to===n.to) return i; }
  return -1;
}
function colorName(hex){ var r=''; HL_COLORS.forEach(function(c){ if(c.hex===hex) r=c.name; }); return r; }
function noteText(n){
  var el=articleFor(n.lang).querySelector('[data-i="'+n.i+'"]');
  return el? el.textContent.slice(n.from,n.to) : '';
}

/* 笔记面板 */
function togglePanel(){
  var p=document.getElementById('note-panel');
  p.classList.toggle('np-open');
  if(p.classList.contains('np-open')) refreshPanel();
}
function refreshPanel(){
  var p=document.getElementById('note-panel');
  var html='<div class="np-head"><b>📝 我的笔记 ('+NOTES.length+')</b><span>';
  html+='<button id="np-clear" style="color:#c0392b">清除全部</button> <button id="np-close" style="color:var(--accent)">关闭</button></span></div>';
  if(!NOTES.length) html+='<div class="np-empty">还没有笔记。<br>在正文里选中文字，即可「高亮」或「划线」。</div>';
  else{
    var shown={};
    for(var i=NOTES.length-1;i>=0;i--){
      var n=NOTES[i];
      var key=n.lang+':'+n.i;
      shown[key]=(shown[key]||0)+1;
      if(shown[key]>1) continue;           // 同一段只列一条（可合并）
      var t=noteText(n)||'…';
      var lang=n.lang==='en'?'英':'中';
      var mark=n.type==='hl'
        ? '<span style="background:'+n.color+'">&nbsp;&nbsp;&nbsp;</span>'
        : '<span style="text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#e8504a">&nbsp;&nbsp;&nbsp;</span>';
      html+='<div class="np-item" data-lang="'+n.lang+'" data-i="'+n.i+'">'
           +'<div class="np-meta"><b>段 '+n.i+'</b><span style="color:var(--mute)">'+lang+'</span>'+mark
           +(n.type==='ul'?'<span style="font-size:10px;color:#888">划线</span>':'<span style="font-size:10px;color:#888">高亮</span>')
           +'</div><div class="np-text">'+escText(t)+'</div></div>';
    }
  }
  p.innerHTML=html;
}
function clearAllNotes(){
  var b=document.createElement('button');
  b.style.cssText='background:none;border:none;color:#c0392b;cursor:pointer;font-size:13px;padding:2px 6px';
  b.textContent='确认全部清除？'; b.id='np-clear-act';
  b.onclick=function(){
    NOTES=[]; saveNotes(); renderAllMarks(); refreshPanel(); showToast('已清除全部笔记');
  };
  var old=document.getElementById('np-clear-act'); if(old) old.remove();
  document.getElementById('np-clear').replaceWith(b);
  setTimeout(function(){ var x=document.getElementById('np-clear-act'); if(x){ x.textContent='清除全部'; x.style.cssText=''; x.onclick=function(){refreshPanel();}; } },2500);
}
function showToast(msg){
  var t=document.getElementById('note-toast');
  t.textContent=msg; t.classList.add('nt-show');
  clearTimeout(t.__t);
  t.__t=setTimeout(function(){ t.classList.remove('nt-show'); },1700);
}

var POS_KEY = 'readerhub_pos_kodak-china';

  try{ SAVED_POS = JSON.parse(localStorage.getItem(POS_KEY)); }

  return SAVED_POS;
}
function writeStoredPos(){
  if(!current) return;
  var scE = document.getElementById('scroll-en');
  var scZ = document.getElementById('scroll-zh');
  try{
    localStorage.setItem(POS_KEY, JSON.stringify({
      section: current,
      en: scE ? scE.scrollTop : 0,
      zh: scZ ? scZ.scrollTop : 0
    }));
  }catch(e){}
}

(function(){

  function getCollapsed(){
    try{ return localStorage.getItem(KEY) === '1'; }catch(e){ return false; }

  function setCollapsed(v){
    app.classList.toggle('sidebar-collapsed', !!v);
    try{ localStorage.setItem(KEY, v ? '1' : '0'); }catch(e){}
    var btn = document.getElementById('sidebar-toggle');
    if(btn){
      btn.innerHTML = v ? '&#10095;' : '&#10094;';   // 折叠时 ›（展开），展开时 ‹（收起）
      btn.setAttribute('aria-expanded', String(!v));
    }
  }
  // 初始
  setCollapsed(getCollapsed());
  var btn = document.getElementById('sidebar-toggle');
  if(btn){
    btn.addEventListener('click', function(e){ e.stopPropagation(); setCollapsed(!app.classList.contains('sidebar-collapsed')); });
  }
  // 快捷键：反斜杠 \  切换
  document.addEventListener('keydown', function(e){
    if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;

  });
})();
