          window.renderMarks(peerPara);
          // 平滑滚动对侧栏到对应段
          var t = paraTop(peerLang==='zh'?scZ:scE, peerLang==='zh'?zhEl:enEl, g);
          if(t!==null) smoothGoto(peerLang==='zh'?scZ:scE, t);
        }
        return;
      }
    }
  };
  try{ applySentenceSel = window.applySentenceSel; }catch(e){}

  // ------- 阅读位置记忆：连续滚动直接存 scrollTop -------
  function savePos(){
    var id = window.__csCurrent || ORDER[0];
    try{
      localStorage.setItem(POS_KEY, JSON.stringify({
        section: id, en: scE.scrollTop, zh: scZ.scrollTop, at: Date.now()
      }));
    }catch(e){}
  }
  scE.addEventListener('scroll', function(){ clearTimeout(window.__csPosT); window.__csPosT=setTimeout(savePos,200); }, {passive:true});
  scZ.addEventListener('scroll', function(){ clearTimeout(window.__csPosT); window.__csPosT=setTimeout(savePos,200); }, {passive:true});

  // ------- 恢复上次位置 -------
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); }catch(e){}
  var startSec = (saved && saved.section) ? saved.section : (ORDER.indexOf('introduction')>=0 ? 'introduction' : ORDER[0]);
  window.goTo(startSec);
  if(saved){
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      // 连续滚动下直接用像素位置恢复更准确；若还原偏差过大再退回章节顶部
      if(saved.en) scE.scrollTop = saved.en;
      if(saved.zh) scZ.scrollTop = saved.zh;
      var id = topSection(scE, enEl); setCurrent(id);
    });});
  }
  setTimeout(function(){ window.__csCurrent = window.__csCurrent || startSec; }, 0);

  // 首次渲染后套用笔记标记
  if(window.renderAllMarks) window.renderAllMarks();
  if(window.__updateChapterHud) window.__updateChapterHud();
})();
</script>
<script>window.BOOK_META={"id": "chinese-americans-shared-history", "title": "Chinese and Americans: A Shared History", "titleZh": "中国人与美国人——一部共有的历史", "titleEn": "Chinese and Americans: A Shared History", "subtitle": "《中国人与美国人——一部共有的历史》", "author": "徐国琦", "authorZh": "徐国琦", "authorEn": "Xu Guoqi", "publisher": "哈佛大学出版社", "publisherEn": "Harvard University Press", "publishYear": "2014"};</script>
<script>
/* ============ 笔记删除 + 批量导出 (NOTES-EXPORT) ============ */
(function(){
  if(typeof EN === 'undefined') return;

  var META = window.BOOK_META || {};
  function bookTitle(){ return META.title || ''; }
  function bookAuthor(){ return META.author || ''; }

  /* 引文行：中文与英文两套格式 */
  function citation(lang){
    var t, a;
    if(lang === 'zh'){
      t = META.titleZh || META.title || '';
      a = META.author || '';
      var pub = META.publisher || '';
      var yr  = META.publishYear || '';
      // ——作者：《书名》，出版社，年份
      var tail = [];
      if(pub) tail.push(pub);
      if(yr)  tail.push(yr);
      var s = '——' + a;
      s += '：《' + t + '》';
      if(tail.length) s += '，' + tail.join('，');
      return s;
    }
    // 英文：Author, *Title* (Publisher, Year).
    t = META.titleEn || META.title || '';
    a = META.authorEn || META.author || '';
    var pubE = META.publisherEn || META.publisher || '';
    var yrE  = META.publishYear || '';
    var s2 = (a ? a + ', ' : '') + (t ? '*' + t + '*' : '');
    if(pubE || yrE){
      var par = [];
      if(pubE) par.push(pubE);
      if(yrE)  par.push(yrE);
      s2 += ' (' + par.join(', ') + ')';
    }
    s2 = s2.replace(/^\s+|\s+$/g,'');
    if(s2) s2 += '.';
    return s2;
  }

  /* 每条笔记：正文 + 出处（去重后的引文行） */
  function noteBlock(n, ordinal){
    var txt = (window.noteText ? (window.noteText(n) || '') : '').replace(/\s+$/,'');
    var head = (n.sec || '') + (n.i != null ? (' · 段 ' + (n.i + 1)) : '');
    var kind = (n.type === 'ul') ? '划线' : '高亮';
    var lang = (n.lang === 'en') ? 'en' : 'zh';
    var cite = citation(lang);
    var out = '';
    out += '### ' + ordinal + '. ' + head + '（' + kind + '）\n\n';
    out += '> ' + txt.replace(/\n/g, '\n> ') + '\n\n';
    if(cite) out += '> ' + cite + '\n\n';
    return out;
  }

  function sortedNotes(){
    // 按 章（sec 出现顺序）-> 段 -> 起始偏移 排序；同段同偏移合并为一条
    var secOrder = {};
    (typeof EN !== 'undefined' ? EN : []).forEach(function(s, k){ secOrder[s.id] = k; });
    var arr = NOTES.slice();
    // 去重：同 lang+gi+from+to 只保留一条（笔记模型本身可含重复）
    var seen = {};
    arr = arr.filter(function(n){
      var k = n.lang + '|' + n.gi + '|' + n.from + '|' + n.to;
      if(seen[k]) return false; seen[k] = 1; return true;
    });
    arr.sort(function(a, b){
      var oa = (secOrder[a.sec] != null) ? secOrder[a.sec] : 9999;
      var ob = (secOrder[b.sec] != null) ? secOrder[b.sec] : 9999;
      if(oa !== ob) return oa - ob;
      if((a.gi||0) !== (b.gi||0)) return (a.gi||0) - (b.gi||0);
      return (a.from||0) - (b.from||0);
    });
    return arr;
  }

  function buildMarkdown(){
    var arr = sortedNotes();
    if(!arr.length) return '';
    var out = '# ' + (bookTitle() || '阅读笔记') + ' · 高亮笔记\n\n';
    var c0 = citation('zh');
    if(c0) out += c0.replace(/^——/, '') + '\n\n';
    out += '共 ' + arr.length + ' 条\n\n---\n\n';
    // 按章分组
    var lastSec = null, idx = 0;
    arr.forEach(function(n){
      if(n.sec !== lastSec){
        lastSec = n.sec;
        out += '## ' + (n.sec || '（未分章）') + '\n\n';
      }
      idx++;
      out += noteBlock(n, idx);
    });
    return out;
  }

  function buildText(){
    var arr = sortedNotes();
    if(!arr.length) return '';
    var out = (bookTitle() || '阅读笔记') + ' · 高亮笔记\n';
    var c0 = citation('zh');
    if(c0) out += c0 + '\n';
    out += '共 ' + arr.length + ' 条\n\n';
    var lastSec = null, idx = 0;
    arr.forEach(function(n){
      if(n.sec !== lastSec){ lastSec = n.sec; out += '\n【' + (n.sec || '（未分章）') + '】\n'; }
      idx++;
      var txt = (window.noteText ? (window.noteText(n) || '') : '').replace(/\s+$/,'');
      var kind = (n.type === 'ul') ? '划线' : '高亮';
      out += '\n' + idx + '. ' + txt + '\n';
      var lang = (n.lang === 'en') ? 'en' : 'zh';
      var cite = citation(lang);
      if(cite) out += '   ' + cite + '\n';
    });
    return out;
  }

  function buildJSON(){
    var arr = sortedNotes().map(function(n){
      var lang = (n.lang === 'en') ? 'en' : 'zh';
      return {
        section: n.sec || null,
        paraIndex: (n.i != null ? n.i : null),
        globalIndex: (n.gi != null ? n.gi : null),
        lang: lang,
        type: (n.type === 'ul') ? 'underline' : 'highlight',
        color: n.color || null,
        text: (window.noteText ? (window.noteText(n) || '') : ''),
        citation: citation(lang)
      };
    });
    return JSON.stringify({
      book: { title: bookTitle(), author: bookAuthor(),
              publisher: META.publisher || '', publisherEn: META.publisherEn || '',
              year: META.publishYear || '' },
      exportedAt: new Date().toISOString(),
      count: arr.length,
      notes: arr
    }, null, 2);
  }

  /* ---------- 下载 ---------- */
  function download(filename, content, mime){
    try{
      var blob = new Blob([content], {type: (mime || 'text/plain') + ';charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 120);
      return true;
    }catch(e){ return false; }
  }
  function safeName(){
    var t = (bookTitle() || 'notes').replace(/[\\/:*?"<>|]+/g, '_').trim();
    var d = new Date();
    function p(x){ return (x<10?'0':'') + x; }
    return t + '_笔记_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '.md';
  }
  function doExport(kind){
    var arr = sortedNotes();
    if(!arr.length){ if(window.showToast) showToast('还没有笔记可导出'); hideExport(); return; }
    var ok = false;
    if(kind === 'md')   ok = download(safeName(), buildMarkdown(), 'text/markdown');
    if(kind === 'txt')  ok = download(safeName().replace(/\.md$/, '.txt'), buildText(), 'text/plain');
    if(kind === 'json') ok = download(safeName().replace(/\.md$/, '.json'), buildJSON(), 'application/json');
    if(kind === 'copy' || !ok){
      // 兜底：复制到剪贴板
      var txt = (kind === 'json') ? buildJSON() : buildMarkdown();
      copyText(txt);
    } else {
      if(window.showToast) showToast('已导出 ' + arr.length + ' 条笔记');
    }
    hideExport();
  }
  function copyText(txt){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        if(window.showToast) showToast('已复制到剪贴板');
      }, function(){ fallback(txt); });
    } else fallback(txt);
  }
  function fallback(txt){
    try{
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      if(window.showToast) showToast('已复制到剪贴板');
    }catch(e){ if(window.showToast) showToast('导出失败'); }
  }

  /* ---------- 导出浮层 ---------- */
  function ensureExportMenu(){
    var m = document.getElementById('np-export');
    if(m) return m;
    m = document.createElement('div');
    m.id = 'np-export';
    m.innerHTML =
      '<button data-k="md">导出 Markdown（.md）</button>' +
      '<button data-k="txt">导出纯文本（.txt）</button>' +
      '<button data-k="json">导出 JSON（.json）</button>' +
      '<div class="np-exp-sep"></div>' +
      '<button data-k="copy">复制全部（含出处）</button>';
    document.body.appendChild(m);
    m.addEventListener('click', function(e){
      var b = e.target.closest && e.target.closest('button[data-k]');
      if(!b) return;
      e.stopPropagation();
      doExport(b.getAttribute('data-k'));
    });
    return m;
  }
  function showExport(anchor){
    var m = ensureExportMenu();
    m.classList.add('on');
    var r = anchor.getBoundingClientRect();
    var mw = m.offsetWidth, mh = m.offsetHeight;
    var left = Math.min(window.innerWidth - mw - 8, Math.max(8, r.right - mw));
    var top = r.bottom + 6;
    if(top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
    m.style.left = left + 'px';
    m.style.top = top + 'px';
  }
  function hideExport(){ var m = document.getElementById('np-export'); if(m) m.classList.remove('on'); }
  document.addEventListener('click', function(e){
    var m = document.getElementById('np-export');
    if(!m || !m.classList.contains('on')) return;
    if(e.target.closest && e.target.closest('#np-export')) return;
    if(e.target.closest && e.target.closest('.np-exp')) return;
    hideExport();
  });
  window.addEventListener('scroll', hideExport, true);
  window.addEventListener('resize', hideExport);

  /* ---------- 单条删除 ---------- */
  function deleteNote(n){
    // 精确定位：lang + gi + from + to；移除所有匹配项
    var removed = 0;
    for(var k = NOTES.length - 1; k >= 0; k--){
      var x = NOTES[k];
      if(x.lang === n.lang && +x.gi === +n.gi && x.from === n.from && x.to === n.to){
        NOTES.splice(k, 1); removed++;
      }
    }
    if(!removed) return false;
    try{ saveNotes(); }catch(e){}
    try{ renderAllMarks(); }catch(e){}
    // 该段可能已无任何笔记：renderAllMarks 不会重绘它，导致残留 <mark>。
    // 因此这里显式重绘被删除笔记所在的那一段（清掉标记）。
    try{
      var root = (n.lang==='zh') ? document.getElementById('article-zh') : document.getElementById('article-en');
      var el = root && root.querySelector('[data-gi="'+n.gi+'"]');
      if(el && typeof window.renderMarks === 'function') window.renderMarks(el);
    }catch(e){}
    try{ refreshPanel(); }catch(e){}
    if(window.showToast) showToast('已删除该条笔记');
    return true;
  }
  /* ---------- 点击正文里的高亮/划线 → 直接删除 ----------
     需求：不用打开「笔记」面板，直接点那段彩色文字就能删掉这条高亮。
     做法：
       1) 包裹 renderMarks，在每枚 mark.hlmark / u.ulnote 上写入 data-nf/data-nt
          （段内起止偏移），使「被点的标记 → 对应笔记」可精确对应；
       2) 在 document 上监听 click，命中标记则按 lang+gi+from+to 删除该条；
       3) 区分「单击」与「拖选」：按下与抬起位置基本重合、且没有选中文字时才算点击，
          避免用户拖拽选词时误删。
     同时提供一个可选开关（默认开启）：window.__clickDeleteHighlight。 */
  window.__clickDeleteHighlight = (window.__clickDeleteHighlight !== false);

  // 1) 包裹 renderMarks：给高亮/划线标记打上偏移信息
  function tagMarks(root){
    if(!root || !root.querySelectorAll) root = document;
    var ms = root.querySelectorAll('mark.hlmark, u.ulnote');
    for(var i=0;i<ms.length;i++){
      var m = ms[i];
      if(m.getAttribute('data-nf')!=null) continue;
      // 该标记在段落纯文本中的起止偏移（跳过已处理的其它标记，逐枚累加）
      var para = m.closest('[data-gi]');
      if(!para) continue;
      var off = textOffsetWithin(para, m);
      var len = (m.textContent||'').length;
      m.setAttribute('data-nf', off);
      m.setAttribute('data-nt', off+len);
    }
  }
  function textOffsetWithin(para, node){
    // 用一个 Range 测 node 起点相对 para 内容的字符偏移
    try{
      var r = document.createRange();
      r.selectNodeContents(para);
      r.setEndBefore(node);
      return r.toString().length;
    }catch(e){ return 0; }
  }
  if(typeof window.renderMarks === 'function'){
    var __rm2 = window.renderMarks;
    window.renderMarks = function(el){
      var r = __rm2.apply(this, arguments);
      try{ tagMarks(el); }catch(e){}
      return r;
    };
    try{ renderMarks = window.renderMarks; }catch(e){}
  }
  // 全文重绘后再补标一次
  if(typeof window.renderAllMarks === 'function'){
    var __ram = window.renderAllMarks;
    window.renderAllMarks = function(){ var r=__ram.apply(this,arguments); try{ tagMarks(document); }catch(e){} return r; };
    try{ renderAllMarks = window.renderAllMarks; }catch(e){}
  }
  // 首屏已有标记也补标
  setTimeout(function(){ try{ tagMarks(document); }catch(e){} }, 400);

  // 2) 点击删除（含拖选保护）
  var _downX=0,_downY=0,_downT=0;
  document.addEventListener('mousedown', function(e){
    _downX=e.clientX; _downY=e.clientY; _downT=Date.now();
  }, true);
  document.addEventListener('click', function(e){
    if(window.__clickDeleteHighlight === false) return;
    var t = e.target;
    if(!t || !t.closest) return;
    var m = t.closest('mark.hlmark, u.ulnote');
    if(!m) return;
    var para = m.closest('[data-gi]');
    if(!para) return;
    // 拖选保护：位移过大 / 耗时过长 → 视为选词，不删
    var dist = Math.abs(e.clientX-_downX) + Math.abs(e.clientY-_downY);
    var dt = Date.now() - _downT;
    var sel = window.getSelection && window.getSelection();
    var hasSel = sel && !sel.isCollapsed && String(sel).length>0;
    if(dist > 6 || hasSel && dt > 120) return;
    var lang = para.getAttribute('data-lang') || (para.closest('#article-zh') ? 'zh' : 'en');
    var gi = +para.getAttribute('data-gi');
    var from = +m.getAttribute('data-nf');
    var to = +m.getAttribute('data-nt');
    var target = findNoteByKey(lang, gi, from, to);
    if(!target){
      // 兜底：同段内取包含点击位置的最近一条
      var cands = NOTES.filter(function(x){ return x.lang===lang && +x.gi===gi; });
      target = cands.sort(function(a,b){ return Math.abs(a.from-from)-Math.abs(b.from-from); })[0];
    }
    if(!target) return;
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation) e.stopImmediatePropagation();
    var removed = target;
    lastDeleted = JSON.parse(JSON.stringify(removed));
    deleteNote(target);
    if(window.showToast) showToast('已删除这条' + (removed.type==='ul' ? '划线' : '高亮') + '（按 Ctrl/⌘+Z 撤销）');
  }, true);

  // 误删保护：记录最近一次删除，支持 Ctrl/⌘+Z 恢复
  var lastDeleted = null;
  document.addEventListener('keydown', function(e){
    if(!lastDeleted) return;
    if((e.ctrlKey || e.metaKey) && (e.key==='z' || e.key==='Z')){
      var n = lastDeleted; lastDeleted = null;
      // 避免重复恢复
      var dup = NOTES.some(function(x){ return x.lang===n.lang && +x.gi===+n.gi && x.from===n.from && x.to===n.to; });
      if(!dup){
        NOTES.push(n);
        try{ saveNotes(); }catch(e2){}
        try{ renderAllMarks(); }catch(e2){}
        try{
          var root=(n.lang==='zh')?document.getElementById('article-zh'):document.getElementById('article-en');
          var el=root&&root.querySelector('[data-gi="'+n.gi+'"]');
          if(el) window.renderMarks(el);
        }catch(e2){}
        try{ refreshPanel(); }catch(e2){}
        if(window.showToast) showToast('已恢复刚才删除的笔记');
      }
      e.preventDefault();
    }
  }, true);

  // 供面板构建时取到「当前显示的这条」：用 data 属性和 noteText 反查
  function findNoteByKey(lang, gi, from, to){
    for(var k=0;k<NOTES.length;k++){
      var x=NOTES[k];
      if(x.lang===lang && +x.gi===+gi && x.from===+from && x.to===+to) return x;
    }
    return null;
  }

  /* ---------- 面板重建 ----------
     原阅读器 refreshPanel 同一段（lang+gi）只渲染“最新一条”，
     导致同段多条高亮时：列表里看不到其余条目、✕ 删的也不是显示的那条。
     这里整段重写：逐条列出每一枚高亮/划线，各自带 ✕，
     并用索引精确定位要删的笔记（不依赖 gi/from/to 去猜）。 */
  function hexOf(n){ return n.color || '#ffe58a'; }

  function buildPanel(){
    var p = document.getElementById('note-panel');
    if(!p) return;
    // 按「章 -> 段 -> 段内位置」排序，列表更稳
    var order = NOTES.map(function(n,i){ return i; });
    order.sort(function(a,b){
      var A=NOTES[a], B=NOTES[b];
      if((A.sec||'') !== (B.sec||'')) return (A.sec||'') < (B.sec||'') ? -1 : 1;
      if(+A.gi !== +B.gi) return +A.gi - +B.gi;
      if(A.lang !== B.lang) return A.lang < B.lang ? -1 : 1;
      return (A.from||0) - (B.from||0);
    });

    var html = '<div class="np-head"><b>📝 我的笔记 ('+NOTES.length+')</b>'
             + '<span class="np-tools">'
             + '<button class="np-exp">导出</button>'
             + '<button id="np-clear" class="clr">清除全部</button>'
             + '<button id="np-close">关闭</button></span></div>';

    if(!NOTES.length){
      html += '<div class="np-empty">还没有笔记。<br>在正文里选中文字，即可「高亮」或「划线」。</div>';
    }else{
      for(var k=0;k<order.length;k++){
        var idx = order[k];
        var n = NOTES[idx];
        var t = '';
        try{ t = window.noteText ? window.noteText(n) : ''; }catch(e){}
        if(!t) t = '…';
        var lang = n.lang==='en' ? '英' : '中';
        var mark = n.type==='hl'
          ? '<span style="background:'+hexOf(n)+'">&nbsp;&nbsp;&nbsp;</span>'
          : '<span style="text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#e8504a">&nbsp;&nbsp;&nbsp;</span>';
        html += '<div class="np-item" data-idx="'+idx+'" data-lang="'+n.lang+'" data-gi="'+n.gi+'" data-from="'+(n.from||0)+'" data-to="'+(n.to||0)+'">'
             +  '<div class="np-meta"><b>'+escText(n.sec||'')+' · '+((+n.i||0)+1)+'</b>'
             +  '<span style="color:var(--mute)">'+lang+'</span>'+mark
             +  (n.type==='ul'?'<span style="font-size:10px;color:var(--mute)">划线</span>':'<span style="font-size:10px;color:var(--mute)">高亮</span>')
             +  '<button class="np-del" data-idx="'+idx+'" title="删除这条笔记">✕</button>'
             +  '</div><div class="np-text">'+escText(t)+'</div></div>';
      }
    }
    p.innerHTML = html;

    var exp = p.querySelector('.np-exp');
    if(exp) exp.addEventListener('click', function(e){ e.stopPropagation(); showExport(exp); });
    var clr = p.querySelector('#np-clear');
    if(clr) clr.addEventListener('click', function(e){ e.stopPropagation(); clearAll(); });
    var cls = p.querySelector('#np-close');
    if(cls) cls.addEventListener('click', function(e){ e.stopPropagation(); closePanel(); });
  }

  function escText(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function clearAll(){
    if(!NOTES.length) return;
    if(!window.confirm('确定清除全部 '+NOTES.length+' 条笔记？')) return;
    NOTES.length = 0;
    try{ saveNotes(); }catch(e){}
    try{ renderAllMarks(); }catch(e){}
    try{ refreshPanel(); }catch(e){}
    if(window.showToast) showToast('已清除全部笔记');
  }

  function closePanel(){
    var p = document.getElementById('note-panel');
    if(p) p.style.display = 'none';
    if(typeof window.hidePanel === 'function'){ try{ window.hidePanel(); }catch(e){} }
  }

  /* ✕ 删除：document 捕获阶段监听，抢在面板自身的 .np-item 跳转
     （捕获 + stopImmediatePropagation）之前处理。 */
  document.addEventListener('click', function(e){
    var del = e.target && e.target.closest && e.target.closest('#note-panel .np-del');
    if(!del) return;
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation) e.stopImmediatePropagation();
    var idx = +del.getAttribute('data-idx');
    if(isNaN(idx) || idx<0 || idx>=NOTES.length){
      // 兜底：用 data 属性反查
      var item = del.closest('.np-item');
      if(item){
        var lang = item.getAttribute('data-lang')==='zh'?'zh':'en';
        var gi = +item.getAttribute('data-gi');
        var from = +item.getAttribute('data-from');
        var to = +item.getAttribute('data-to');
        idx = -1;
        for(var k=0;k<NOTES.length;k++){
          var x=NOTES[k];
          if(x.lang===lang && +x.gi===gi && (+x.from||0)===from && (+x.to||0)===to){ idx=k; break; }
        }
      }
    }
    if(idx<0 || idx>=NOTES.length){ if(window.showToast) showToast('未找到该笔记'); return; }
    deleteNote(NOTES[idx]);
  }, true);

  /* 覆盖 refreshPanel：改为逐条列出全部笔记 */
  window.refreshPanel = buildPanel;
  try{ refreshPanel = window.refreshPanel; }catch(e){}

  // 初始化时若面板已存在也重建一次
  buildPanel();

  window.__notesExport = { markdown: buildMarkdown, text: buildText, json: buildJSON, citation: citation };
})();
</script>

<script>
/* ============ 阅读主题 / 字体 / 章节 HUD (READER-THEME-HUD) ============ */
(function(){
  var THEME_KEY = 'readerhub_theme';        // 共用
  var FONT_KEY  = 'readerhub_font';         // 共用
  var SCALE_KEY = 'readerhub_scale';        // 共用

  // group: reading = 阅读主题；fun = 趣味主题（与首页一致）
  var THEMES = [
    {id:'light',  name:'亮色',   bg:'#f7f5f0', ink:'#2b2b2b', group:'reading', ico:'☀'},
    {id:'sepia',  name:'护眼',   bg:'#f3ead8', ink:'#43382a', group:'reading', ico:'📖'},
    {id:'dark',   name:'深色',   bg:'#1d2024', ink:'#dfe3e8', group:'reading', ico:'🌙'},
    {id:'night',  name:'夜间',   bg:'#0e0f11', ink:'#c9ccd1', group:'reading', ico:'🌑'},
    {id:'anime',  name:'动漫',   bg:'#fdf2f6', ink:'#3b2c3a', group:'fun', ico:'🌸'},
    {id:'pixel',  name:'像素',   bg:'#1a1c2c', ink:'#f4f4f4', group:'fun', ico:'👾'},
    {id:'cyber',  name:'赛博朋克', bg:'#07070f', ink:'#d8e6ff', group:'fun', ico:'🛰'},
    {id:'ink',    name:'水墨',   bg:'#f6f3ec', ink:'#20201d', group:'fun', ico:'🖌'},
    {id:'forest', name:'森林',   bg:'#f1f5ee', ink:'#243024', group:'fun', ico:'🌲'},
    {id:'ocean',  name:'海洋',   bg:'#eef6fb', ink:'#14313f', group:'fun', ico:'🌊'},
    {id:'news',   name:'报纸',   bg:'#f2ede1', ink:'#23211c', group:'fun', ico:'📰'},
    {id:'candy',  name:'糖果',   bg:'#fff7f0', ink:'#3d2f3a', group:'fun', ico:'🍬'},
    {id:'manga',  name:'漫画',   bg:'#fbfbfb', ink:'#111111', group:'fun', ico:'💥'},
    {id:'sakura', name:'樱花夜', bg:'#1b1430', ink:'#f0e6ff', group:'fun', ico:'🌸'},
    {id:'vapor',  name:'蒸汽波', bg:'#241b4a', ink:'#f7e9ff', group:'fun', ico:'🎴'}
  ];
  var FONTS = [
    {id:'serif',   name:'宋体', css:'"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,serif'},
    {id:'kai',     name:'楷体', css:'"Kaiti SC","STKaiti","KaiTi","Source Han Serif SC",serif'},
    {id:'sans',    name:'黑体', css:'"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif'},
    {id:'system',  name:'系统', css:'-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif'}
  ];
  var SCALES = [
    {id:'0.9',  name:'小'},
    {id:'1',    name:'中'},
    {id:'1.15', name:'大'},
    {id:'1.3',  name:'特大'}
  ];

  function get(k, d){ try{ return localStorage.getItem(k) || d; }catch(e){ return d; } }
  function set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

  var curTheme = get(THEME_KEY, 'light');
  var curFont  = get(FONT_KEY,  'serif');
  var curScale = get(SCALE_KEY, '1');

  // 书页现已支持全部 15 套主题（4 阅读 + 11 趣味），与首页完全一致。
  // 兼容旧数据：若 localStorage 里是未知/已废弃的主题 id，回退到亮色。
  function themeMeta(id){ for(var i=0;i<THEMES.length;i++) if(THEMES[i].id===id) return THEMES[i]; return THEMES[0]; }
  function normalizeTheme(id){ for(var i=0;i<THEMES.length;i++) if(THEMES[i].id===id) return id; return 'light'; }
  function fontMeta(id){ for(var i=0;i<FONTS.length;i++) if(FONTS[i].id===id) return FONTS[i]; return FONTS[0]; }

  function applyTheme(id, persist){
    // 书页支持全部 15 套主题。
    // persist=true 时才写回 THEME_KEY（用户手动选择时）。
    id = normalizeTheme(id);
    curTheme = id;
    if(id === 'light'){ document.documentElement.removeAttribute('data-theme'); }
    else{ document.documentElement.setAttribute('data-theme', id); }
    // 顶部/lang-head 品牌色仍用 accent；手机端状态栏色调（支持的浏览器）
    try{
      var m = document.querySelector('meta[name="theme-color"]');
      if(!m){ m = document.createElement('meta'); m.name='theme-color'; document.head.appendChild(m); }
      m.content = themeMeta(id).bg;
    }catch(e){}
    // 用户手动选择时覆盖共用 key；首屏回退应用时不写，保留主页的趣味主题。
    if(persist) set(THEME_KEY, id);
  }
  function applyFont(id){
    curFont = id;
    var f = fontMeta(id);
    document.documentElement.style.setProperty('--reader-font', f.css);
    document.body.setAttribute('data-font', id);
    set(FONT_KEY, id);
  }
  function applyScale(id){
    curScale = String(id);
    document.documentElement.style.setProperty('--reader-scale', curScale);
    set(SCALE_KEY, curScale);
  }

  // ---- 首屏尽早应用（避免闪烁）----
  applyTheme(curTheme, false);  // 首屏不写回 key（避免无谓写入）
  applyFont(curFont);
  applyScale(curScale);

  // ---- 设置面板 ----
  var panel = document.getElementById('reader-settings');
  var btn = document.getElementById('reader-settings-btn');

  function swatch(t){
    var light = (t.ink === '#2b2b2b' || t.ink === '#43382a' || t.ink === '#20201d' ||
                 t.ink === '#243024' || t.ink === '#14313f' || t.ink === '#23211c' ||
                 t.ink === '#3d2f3a' || t.ink === '#3b2c3a' || t.ink === '#111111');
    return '<div class="rs-sw'+(t.id===curTheme?' on':'')+'" data-theme-pick="'+t.id+'" '
      +  'title="'+t.name+'" style="background:'+t.bg+'">'
      +  '<span style="color:'+(light?'#666':'#bbb')+'">'+t.name+'</span>'
      +  '<i class="ico" style="font-style:normal">'+t.ico+'</i></div>';
  }
  function renderPanel(){
    var html = '<h4>阅读设置</h4>';
    html += '<div class="rs-row"><div class="rs-label">阅读主题</div><div class="rs-swatches">';
    THEMES.filter(function(t){return t.group==='reading';}).forEach(function(t){ html += swatch(t); });
    html += '</div></div>';
    html += '<div class="rs-row"><div class="rs-label">趣味主题</div><div class="rs-swatches">';
    THEMES.filter(function(t){return t.group==='fun';}).forEach(function(t){ html += swatch(t); });
    html += '</div></div>';
    html += '<div class="rs-row"><div class="rs-label">字体</div><div class="rs-opts">';
    FONTS.forEach(function(f){
      html += '<button class="rs-opt'+(f.id===curFont?' on':'')+'" data-font-pick="'+f.id+'" style="font-family:'+f.css+'">'+f.name+'</button>';
    });
    html += '</div></div>';
    html += '<div class="rs-row"><div class="rs-label">字号</div><div class="rs-opts">';
    SCALES.forEach(function(s){
      html += '<button class="rs-opt'+(s.id===curScale?' on':'')+'" data-scale-pick="'+s.id+'">'+s.name+'</button>';
    });
    html += '</div></div>';
    panel.innerHTML = html;
  }

  function togglePanel(force){
    var open = (typeof force==='boolean') ? force : !panel.classList.contains('open');
    if(open) renderPanel();
    panel.classList.toggle('open', open);
  }

  btn.addEventListener('click', function(e){ e.stopPropagation(); togglePanel(); });
  panel.addEventListener('click', function(e){
    e.stopPropagation();
    var sw = e.target.closest('[data-theme-pick]');
    if(sw){ applyTheme(sw.getAttribute('data-theme-pick'), true); renderPanel(); return; }
    var fo = e.target.closest('[data-font-pick]');
    if(fo){ applyFont(fo.getAttribute('data-font-pick')); renderPanel(); return; }
    var sc = e.target.closest('[data-scale-pick]');
    if(sc){ applyScale(sc.getAttribute('data-scale-pick')); renderPanel(); return; }
  });
  document.addEventListener('click', function(e){
    if(panel.classList.contains('open') && !e.target.closest('#reader-settings') && !e.target.closest('#reader-settings-btn'))
      togglePanel(false);
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') togglePanel(false);
  });

  // ---- 目录项与章节 id 建立映射，修正高亮 + 供 HUD 使用 ----
  // 原书用 `el.textContent.includes(labelOf(id))` 判断高亮，对多数章节失效。
  // 这里改用「TOC 生成顺序 = tocOrder」建立 data-sec-id，按 id 精确高亮。
  var SEC_IDS = [];
  (function stampTocIds(){
    var order = (typeof tocOrder !== 'undefined' && tocOrder) ? tocOrder : null;
    var items = [].slice.call(document.querySelectorAll('.toc-item'));
    if(order && typeof EN !== 'undefined'){
      var ids = order.filter(function(id){ return EN.some(function(s){ return s.id === id; }); });
      if(ids.length === items.length){
        for(var k=0;k<items.length;k++){
          items[k].setAttribute('data-sec-id', ids[k]);
          SEC_IDS.push(ids[k]);
        }
        return;
      }
    }
    // 兜底：没有 tocOrder 时按 EN 顺序
    if(typeof EN !== 'undefined'){
      EN.forEach(function(s, idx){
        if(items[idx]){ items[idx].setAttribute('data-sec-id', s.id); SEC_IDS.push(s.id); }
      });
    }
  })();

  function markActive(id){
    var items = document.querySelectorAll('.toc-item');
    var hit = null;
    for(var k=0;k<items.length;k++){
      var on = items[k].getAttribute('data-sec-id') === id;
      items[k].classList.toggle('active', on);
      if(on) hit = items[k];
    }
    // 让当前章节在目录中保持可见（侧栏未折叠时）
    if(hit && hit.scrollIntoView){ /* 仅在目录自身可滚动时轻推，不移动正文 */ }
    return hit;
  }

  // ---- 当前章节 HUD ----
  var hud = document.getElementById('chapter-hud');
  var hudName = hud.querySelector('.ch-hud-name');
  var hudTimer = null;
  function activeTocLabel(){
    var el = document.querySelector('.toc-item.active');
    if(!el) return '';
    var sub = el.querySelector('.sub');
    var main = el.querySelector('span');
    var t = (main ? main.textContent : el.textContent) || '';
    if(sub && sub.textContent) t = t + ' · ' + sub.textContent;
    return t.replace(/\s+/g,' ').trim();
  }
  function flashHud(){
    hud.classList.add('ch-hud-show');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(function(){ hud.classList.remove('ch-hud-show'); }, 2600);
  }
  function updateHud(){
    hudName.textContent = activeTocLabel();
  }
  window.__updateChapterHud = updateHud;
  window.__flashChapterHud = flashHud;
  window.__markChapterActive = markActive;
  hud.addEventListener('click', function(){
    var app = document.querySelector('.app');
    if(app && app.classList.contains('sidebar-collapsed')){
      var tgl = document.getElementById('sidebar-toggle');
      if(tgl) tgl.click();
    }
  });
  setTimeout(updateHud, 60);

  // goTo() 之后：按 id 精确高亮 + 同步 HUD（兼容原有 __origGoTo 包装）
  function afterGoTo(id){
    if(id) markActive(id);
    updateHud();
    flashHud();
  }
  var __prevGoTo = window.goTo;
  if(typeof __prevGoTo === 'function'){
    window.goTo = function(id){
      var r = __prevGoTo.apply(null, arguments);
      setTimeout(function(){ afterGoTo(id); }, 0);
      return r;
    };
    // 折叠状态变化时短暂展示当前章节（让用户知道现在读到哪）
    var tgl = document.getElementById('sidebar-toggle');
    if(tgl) tgl.addEventListener('click', function(){ setTimeout(function(){ updateHud(); flashHud(); }, 60); });
    // 确定初始章节：优先 localStorage 记忆的位置，其次当前 active 项
    setTimeout(function(){
      var initId = null;
      try{
        for(var k=0;k<localStorage.length;k++){
          var key = localStorage.key(k);
          if(key && key.indexOf('readerhub_pos_') === 0){
            var v = JSON.parse(localStorage.getItem(key) || 'null');
            if(v && v.section){ initId = v.section; break; }
          }
        }
      }catch(e){}
      if(!initId){
        var cur = document.querySelector('.toc-item.active');
        initId = cur ? cur.getAttribute('data-sec-id') : null;
      }
      if(initId) markActive(initId);
      else if(SEC_IDS.length) markActive(SEC_IDS[0]);
      updateHud();
    }, 0);
  }
})();
</script>
<script>/* ============ 脚注悬浮提示 (FOOTNOTE-TOOLTIP) ============ */
(function(){
  if(typeof EN === 'undefined') return;

  /* ---------- 1) 解析 notes 章节 -> 章节脚注映射 ---------- */
  var FN = {};   // FN[secId] = { en:{num:text}, zh:{num:text} }

  function normTitle(t){
    return String(t||'').toLowerCase()
      .replace(/^\s*\d+\s*\/\s*/, '')       // "274 / Notes to Introduction" -> notes to introduction
      .replace(/notes?\s+to\s+/, '')         // notes to introduction -> introduction
      .replace(/^\s*(chapter|ch\.?)\s*/,'')  // chapter 1 -> 1
      .replace(/[^a-z0-9\u4e00-\u9fa5]+/g,' ').trim();
  }
  // 从一段文本里抽出「编号 -> 注释文本」（宽松：编号可出现于行首或行中）
  function extractNotes(t){
    var out = [];
    var s = String(t||'');
    var marks = [];
    // 先识别行首「编号 + 分隔符」：支持 N. / N、 / N␣ / N《（数字后直接跟中文标点或汉字，如 “75《最新消息》”）
    var head = /^\s*(\d{1,3})(?:[.、]\s*|\s+|(?=[《“「『（(【]))/.exec(s);
    if(head){
      marks.push({ n: parseInt(head[1],10), at: 0, end: head[0].length });
    }
    // 行内其它「编号 + .、」形式（部分旧书把多条注拼在同一段）
    var r2 = /[\s.。](\d{1,3})\s*[.、]\s*/g, m2;
    while((m2 = r2.exec(s))){
      var lead = m2[0].length - m2[0].replace(/^[\s.。]/,'').length;
      if(m2.index + lead <= (marks[0] ? marks[0].end : 0)) continue;  // 避开行首已收的编号
      marks.push({ n: parseInt(m2[1],10), at: m2.index + lead, end: r2.lastIndex });
    }
    for(var i=0;i<marks.length;i++){
      var chunkStart = marks[i].end;
      var chunkEnd = (i+1<marks.length) ? marks[i+1].at : s.length;
      out.push({ n: marks[i].n, text: s.slice(chunkStart, chunkEnd).trim() });
    }
    return out;
  }
  function stripNum(t){
    return String(t || '').replace(/^\s*\d{1,3}(?:[.、]\s*|\s+|(?=[《“「『（(【]))/, '').trim();
  }
  // 纯文本内嵌脚注号：句末标点/引号后紧跟数字，后接空格或行尾（如 identity.49 / city.”50）
  var PLAIN_REF = /[.\u201d\u2019;,\)]\s*\d{1,3}(?=\s|$)/;
  // 中文侧：中文标点/闭引号后紧跟数字（20世纪/1930年代 等时间量词除外）
  var PLAIN_REF_ZH = /[。，、；：）】」』”’"]\s*\d{1,3}/;
  function hasPlainRef(t){
    t = String(t||'');
    if(PLAIN_REF.test(t)) return true;
    var r = new RegExp(PLAIN_REF_ZH.source, 'g'), m;
    while((m = r.exec(t))){
      var rest = t.slice(m.index + m[0].length);
      if(/^[A-Za-z%.]/.test(rest)) continue;
      if(/^\s*(?:世纪|年代|年|月|日|时|分|秒|岁|人|个|种|次|万|千|百|元|位|届|—|–|-|\d)/.test(rest)) continue;
      return true;
    }
    return false;
  }
  function hasSup(t){
    t = t || '';
    return /<sup\b/i.test(t) || /\\\^\{|\\\^\{|\\\^\\\{/.test(t) || /\^\{/.test(t) || hasPlainRef(t);
  }
  function footnoteSections(ARR){
    return ARR.filter(function(s){
      if(s.id === 'notes') return false;
      return (s.paras || []).some(function(p){ return hasSup(p.text); });
    });
  }
  function noteSec(ARR){
    for(var i=0;i<ARR.length;i++){ if(ARR[i].id === 'notes') return ARR[i]; }
    return null;
  }
  // 收集某章节正文里出现过的脚注编号
  function numbersIn(sec){
    var nums = {};
    (sec.paras||[]).forEach(function(p){
      var t = p.text||''; var m;
      var r1=/<sup[^>]*data-fn=["']?(\d{1,3})/g; while((m=r1.exec(t))) nums[+m[1]]=1;
      var r1b=/<sup[^>]*>(\d{1,3})<\/sup>/g; while((m=r1b.exec(t))) nums[+m[1]]=1;
      var r2=/\^\{(\[?\d{1,3}\]?)\}/g; while((m=r2.exec(t))) nums[+m[1].replace(/[\[\]]/g,'')]=1;
      var r3=/[.\u201d\u2019;,\)]\s*(\d{1,3})(?=\s|$)/g; while((m=r3.exec(t))) nums[+m[1]]=1;
      // 中文侧：中文标点/闭引号后紧跟数字（与 normalizeHTML 的规则 d 保持一致）
      var r4=/([。，、；：）】」』”’"])(\s*)(\d{1,3})/g;
      while((m=r4.exec(t))){
        var rest = t.slice(m.index + m[0].length);
        if(/^[A-Za-z%.]/.test(rest)) continue;
        if(/^\s*(?:世纪|年代|年|月|日|时|分|秒|岁|人|个|种|次|万|千|百|元|位|届|—|–|-|\d)/.test(rest)) continue;
        nums[+m[3]]=1;
      }
    });
    return nums;
  }
  /* 组注释：优先用 notes 里的 title 切章（多数书标题清晰）；
     title 缺失/错位时退回「编号回落到 1」切分。 */
  function buildFragGroups(nsec){
    var groups = [], cur = null;
    (nsec.paras||[]).forEach(function(p){
      if(p.type === 'title'){
        cur = { title: p.text||'', nums:{} };
        groups.push(cur); return;
      }
      if(!cur){ cur = { title:'', nums:{} }; groups.push(cur); }
      extractNotes(p.text).forEach(function(x){
        if(!x.n) return;
        if(!(x.n in cur.nums) && x.text) cur.nums[x.n] = x.text;
      });
    });
    return groups;
  }
  function matchGroup(groups, sec, used){
    var st = normTitle(sec.title || sec.id), sid = normTitle(sec.id);
    for(var i=0;i<groups.length;i++){
      if(used[i]) continue;
      var gt = normTitle(groups[i].title);
      if(!gt) continue;
      if(gt===st || gt===sid || (sid && gt.indexOf(sid)>=0) || (st && gt.indexOf(st)>=0)) return i;
    }
    return -1;
  }
  /* 分派：先按 title 对齐各章节；对仍未覆盖的编号，用「整体片段池」按序回填。 */
  function assignNotes(nsec, secs){
    var groups = buildFragGroups(nsec);
    var result = secs.map(function(){ return {}; });
    var usedG = {};
    secs.forEach(function(sec, si){
      var gi = matchGroup(groups, sec, usedG);
      if(gi >= 0){
        usedG[gi] = 1;
        var nums = groups[gi].nums, want = numbersIn(sec);
        Object.keys(want).forEach(function(n){ if(nums[n]) result[si][n] = nums[n]; });
      }
    });
    // 回填：把所有片段按编号收集（保序），给缺失的章节补
    var pool = {};
    groups.forEach(function(g){ Object.keys(g.nums).forEach(function(n){ (pool[n]=pool[n]||[]).push(g.nums[n]); }); });
    var poolIdx = {};
    secs.forEach(function(sec, si){
      Object.keys(numbersIn(sec)).forEach(function(n){
        if(result[si][n]) return;
        var arr = pool[n]; if(!arr || !arr.length) return;
        var k = poolIdx[n]||0;
        if(k < arr.length){ result[si][n] = arr[k]; poolIdx[n] = k+1; }
      });
    });
    return result;
  }
  ['en','zh'].forEach(function(lang){
    var ARR = (lang === 'en') ? EN : ((typeof ZH !== 'undefined') ? ZH : []);
    var nsec = noteSec(ARR);
    if(!nsec) return;
    var secs = footnoteSections(ARR);
    var assigned = assignNotes(nsec, secs);
    secs.forEach(function(sec, idx){
      var sid = sec.id;
      FN[sid] = FN[sid] || {en:{}, zh:{}};
      FN[sid][lang] = assigned[idx] || {};
    });
  });

  /* ---------- 2) 浮层 ---------- */
  var tip = document.getElementById('fn-tip');
  if(!tip){ tip = document.createElement('div'); tip.id = 'fn-tip'; document.body.appendChild(tip); }

  function showTip(el, text, num, alt){
    tip.innerHTML = '';
    var h = document.createElement('div'); h.className = 'fn-tip-num';
    h.textContent = '注释 ' + num + (alt ? '（原文）' : '');
    var b = document.createElement('div'); b.className = 'fn-tip-body';
    b.textContent = text;
    tip.appendChild(h); tip.appendChild(b);
    tip.classList.add('on');
    var r = el.getBoundingClientRect();
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = r.left + r.width/2 - tw/2;
    left = Math.max(8, Math.min(window.innerWidth - tw - 8, left));
    var top = r.top - th - 10;
    if(top < 8) top = r.bottom + 10;
    top = Math.max(8, Math.min(window.innerHeight - th - 8, top));
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip(){ tip.classList.remove('on'); tip.removeAttribute('data-for'); }

  function lookup(sid, lang, n){
    var rec = FN[sid];
    if(!rec) return null;
    if(rec[lang] && rec[lang][n]) return {text: stripNum(rec[lang][n]), alt:false};
    var other = (lang === 'en') ? 'zh' : 'en';
    if(rec[other] && rec[other][n]) return {text: stripNum(rec[other][n]), alt:true};
    return null;
  }

  /* ---------- 3) 统一脚注表示 ----------
     正文里可能出现的脚注写法：
        a) <sup>14</sup>             （新书）
        b) ^{14}  / ${}^{14}$        （旧书，明文）
     二者统一为：
        <sup class="fnmark" data-fn="14">14</sup>
     关键点：其 textContent 恰为 "14"，与用户阅读所见一致，偏移稳定。 */
  function markHTML(n){ return '<sup class="fnmark" data-fn="' + n + '">' + n + '</sup>'; }

  function normalizeHTML(html, lang, sec){
    // 仅当该节确实收录了编号 n 的注释时才标记（避免 figure 号/页码/量词的误标记）
    function hasNote(n){
      if(!sec) return true;
      var rec = FN[sec];
      if(!rec) return true;
      return !!((rec.en && rec.en[n]) || (rec.zh && rec.zh[n]));
    }
    // a) 真正的 <sup>（含已有 fnmark，保持不动）
    html = html.replace(/<sup\b([^>]*)>(\s*\d{1,3}\s*)<\/sup>/g, function(m, attrs, n){
      if(/data-fn=/.test(attrs)) return m;                 // 已标注
      return markHTML(String(n).replace(/\s/g,''));
    });
    // a2) 被转义的 &lt;sup&gt;
    html = html.replace(/&lt;sup\b[^&]*?&gt;(\s*\d{1,3}\s*)&lt;\/sup&gt;/g, function(m, n){
      return markHTML(String(n).replace(/\s/g,''));
    });
    // b2) $^{N}$ / ${}^{N}$（先处理，避免 $ 包壳被下面的 ^{N} 规则拆坏）
    html = html.replace(/\$\s*\{?\s*\}\s*\^?\s*\{\s*(\[?\d{1,3}\]?)\s*\}\s*\$/g, function(m, n){
      var v = String(n).replace(/[\[\]]/g,'');
      return v ? markHTML(v) : m;
    });
    // b) ^{N}
    html = html.replace(/\^\{\s*(\[?\d{1,3}\]?)\s*\}/g, function(m, n){
      return markHTML(String(n).replace(/[\[\]]/g,''));
    });
    // c) 纯文本内嵌脚注号（英文书：句末标点后紧跟数字，如 identity.49 / city.”50）
    //    仅英文侧启用，避免误伤中文/年份。数字需后接空格或行尾，且不在空格/字母前。
    if(lang === 'en'){
      html = html.replace(/([.”’;,\)])(\s*)(\d{1,3})(?=\s|$)/g, function(m, p, sp, n, off, whole){
        var before = whole.slice(Math.max(0, off - 10), off + 1);
        // 排除缩写：no. 3 / etc. 12 / vol. 5 / fig. 2 …
        if(/(?:^|\b)(?:no|fig|vol|ch|pp|p|ed|eds|rev|cf|ca|etc|al|et al|jr|sr|st|nd|rd|th)\.\s*$/i.test(before)) return m;
        // 排除后接 '(' 的（期号如 “no.2 (Spring 2013)”）
        if(/^\s*\(/.test(whole.slice(off + m.length))) return m;
        // 仅当该节有对应注释时才标记（滤掉 “1.75 cun” 之类的误报）
        if(!hasNote(n)) return m;
        return p + sp + markHTML(n);
      });
    }
    // d) 中文侧内嵌脚注号（本书：中文句末标点/引号后紧跟数字，如 “新时代。2 与照” / “问题。6” /
    //    “回答。”1 丰子恺” / “。21与此同时”）。中文标点或闭引号前导 + 后接空格/CJK 标点/汉字/句尾
    //    + 不跟量词/时间单位 + 该节确有该编号注释。
    if(lang === 'zh'){
      html = html.replace(/([。，、；：）】」』”’"])(\s*)(\d{1,3})/g, function(m, p, sp, n, off, whole){
        var rest = whole.slice(off + m.length);
        // 后接非停顿字符（拉丁字母/百分号等）则不算
        if(/^[A-Za-z%.]/.test(rest)) return m;
        // 排除时间/量词表达：20世纪 / 1930年代 / 1912—1949 / 5年 / 3个月 …
        if(/^\s*(?:世纪|年代|年|月|日|时|分|秒|岁|人|个|种|次|万|千|百|元|位|届|—|–|-|\d)/.test(rest)) return m;
        if(!hasNote(n)) return m;
        return p + sp + markHTML(n);
      });
    }
    return html;
  }

  // 非叙述性章节（参考文献/图表目录）：其中数字多为页码/卷号，不标注脚注
  var NO_FN_SEC = { biblio:1, bibliography:1, refs:1, references:1, figs:1, figures:1 };
  function annotateEl(el, lang){
    if(!el || !el.getAttribute) return;
    if(el.getAttribute('data-fn-done')) return;
    var sec = el.getAttribute('data-sec') || '';
    if(NO_FN_SEC[sec]){ el.setAttribute('data-fn-done','1'); return; }
    var html = el.innerHTML;
    var out = normalizeHTML(html, lang, sec);
    if(out !== html) el.innerHTML = out;
    el.setAttribute('data-fn-done', '1');
  }
  function annotateAll(){
    ['article-en','article-zh'].forEach(function(aid){
      var root = document.getElementById(aid);
      if(!root) return;
      var lang = (aid === 'article-zh') ? 'zh' : 'en';
      var ps = root.querySelectorAll('[data-gi]');
      for(var i=0;i<ps.length;i++) annotateEl(ps[i], lang);
    });
  }
  annotateAll();

  /* ---------- 4) 让 renderMarks 保留脚注（核心修复） ----------
     renderMarks 以 el.textContent 计算偏移，再用 escText 重建 innerHTML，
     于是 <sup>14</sup> 被拍平成纯文本 "14"（旧书的 "^{14}" 同理），
     导致「高亮一旦覆盖脚注，脚注标记就失效」。

     做法：在调用原 renderMarks 之前，把段落里每个 .fnmark 临时替换成
     一段「哨兵文本」\u2063N\u2063（不可见字符包裹数字），使 textContent/偏移
     完全一致、且不会与普通数字混淆；原 renderMarks 重建完成后，
     再把 HTML 里的 \u2063N\u2063 还原为 <sup class="fnmark" data-fn="N">。 */
  var SEPS = '\u2063';   // invisible separator (哨兵)

  function encloseSups(el){
    // DOM -> 用哨兵文本替换 .fnmark 元素；返回是否替换过
    var sups = el.querySelectorAll('sup.fnmark');
    if(!sups.length) return false;
    for(var i=0;i<sups.length;i++){
      var s = sups[i];
      var n = s.getAttribute('data-fn') || (s.textContent||'').replace(/[\[\]]/g,'');
      s.replaceWith(document.createTextNode(SEPS + n + SEPS));
    }
    return true;
  }
  function restoreSups(el){
    // HTML -> 把哨兵还原为 <sup>（escText 不会改动 \u2063）
    var html = el.innerHTML;
    if(html.indexOf(SEPS) < 0) return;
    // 正常情况：⁣N⁣
    html = html.replace(new RegExp(SEPS + '(\\d{1,3})' + SEPS, 'g'), function(m, n){
      return markHTML(n);
    });
    // 兜底：若高亮边界把数字切开（⁣2</mark>2⁣），合并后再还原
    html = html.replace(new RegExp(SEPS + '([\\s\\S]{1,120}?)' + SEPS, 'g'), function(m, mid){
      var digits = mid.replace(/<[^>]+>/g,'').replace(/\D/g,'');
      return digits ? markHTML(digits) : m;
    });
    el.innerHTML = html;
  }

  /* 让高亮/划线选区「吸附」到整枚脚注：from/to 落在某枚脚注范围内则扩展为整枚，
     避免把脚注数字切成两半，从而与 renderMarks 的哨兵法配合、脚注始终完整。 */
  function snapToFootnotes(el, from, to){
    var sups = el.querySelectorAll('sup.fnmark');
    if(!sups.length) return [from, to];
    for(var i=0;i<sups.length;i++){
      var s = sups[i];
      try{
        var r = document.createRange();
        r.selectNodeContents(el);
        r.setEndBefore(s);
        var sStart = r.toString().length;
        var sLen = (s.textContent || '').length;
        var sEnd = sStart + sLen;
        if(from > sStart && from < sEnd) from = sStart;
        if(to   > sStart && to   < sEnd) to   = sEnd;
      }catch(e){}
    }
    return [from, to];
  }

  if(typeof window.renderMarks === 'function'){
    var __rm = window.renderMarks;
    window.renderMarks = function(el){
      if(el && el.querySelectorAll){
        var had = encloseSups(el);
        var r = __rm.apply(this, arguments);
        if(had) restoreSups(el);
        el.removeAttribute('data-fn-done');
        annotateEl(el);
        return r;
      }
      var r2 = __rm.apply(this, arguments);
      if(el){ el.removeAttribute('data-fn-done'); annotateEl(el); }
      return r2;
    };
    try{ renderMarks = window.renderMarks; }catch(e){}
  }

  /* 包裹 buildNote：把选区偏移吸附到完整脚注，避免切碎脚注数字 */
  if(typeof window.buildNote === 'function'){
    var __bn = window.buildNote;
    window.buildNote = function(){
      var n = __bn.apply(this, arguments);
      if(!n) return n;
      try{
        var el = document.querySelector('p[data-gi="' + n.gi + '"][data-lang="' + n.lang + '"]');
        if(el){
          var snapped = snapToFootnotes(el, n.from, n.to);
          if(snapped[0] !== n.from || snapped[1] !== n.to){
            n.from = snapped[0]; n.to = snapped[1];
            n.text = el.textContent.slice(n.from, n.to);
          }
        }
      }catch(e){}
      return n;
    };
    try{ buildNote = window.buildNote; }catch(e){}
  }

  /* ---------- 5) 事件委托 ---------- */
  function markOf(t){ return (t && t.closest) ? t.closest('.fnmark') : null; }
  function recOf(m){
    var p = m.closest('[data-gi]') || m.closest('[data-sec]') || m.closest('[data-lang]');
    var sid = null, lang = null;
    if(p){
      sid = p.getAttribute('data-sec');
      lang = p.getAttribute('data-lang');
    }
    if(!sid){
      // 兜底：用当前章节
      sid = (typeof current !== 'undefined') ? current : null;
    }
    if(!lang){
      lang = m.closest('#article-zh') ? 'zh' : 'en';
    }
    var n = parseInt(m.getAttribute('data-fn'), 10);
    var rec = lookup(sid, lang, n);
    return rec ? {rec:rec, n:n, key:sid + ':' + lang + ':' + n} : null;
  }
  var pinnedEl = null;   // 被点击/长按固定住的脚注（触摸设备友好）
  var lastHover = null;  // 最近悬停的脚注（滚动时重定位用）

  function openFor(m, info){
    pinnedEl = m;
    showTip(m, info.rec.text, info.n, info.rec.alt);
    tip.setAttribute('data-for', info.key);
  }

  document.addEventListener('mouseover', function(e){
    var m = markOf(e.target);
    lastHover = m;
    if(!m) return;
    var info = recOf(m); if(!info) return;
    if(pinnedEl && pinnedEl !== m) pinnedEl = null;   // 移动到别的脚注则取消固定
    showTip(m, info.rec.text, info.n, info.rec.alt);
    tip.setAttribute('data-for', info.key);
  }, true);
  document.addEventListener('mouseout', function(e){
    var m = markOf(e.target); if(!m) return;
    if(pinnedEl === m) return;          // 已固定：不因移出而关闭
    hideTip();
  });
  // 点击 / 触摸：切换显示（触摸设备没有 hover，靠这里）
  document.addEventListener('click', function(e){
    var m = markOf(e.target);
    if(m){
      var info = recOf(m);
      if(info){
        if(pinnedEl === m && tip.classList.contains('on')){ pinnedEl = null; hideTip(); }
        else { openFor(m, info); }
        e.preventDefault();
        return;
      }
    }
    // 点击别处：关闭已固定的浮层
    if(pinnedEl){ pinnedEl = null; hideTip(); }
  });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ pinnedEl = null; hideTip(); } });
  // 滚动时：若已固定则跟随重定位，否则仅在指针已离开时收敛（避免误关）
  function reposition(){
    var m = pinnedEl || lastHover;
    if(!m || !tip.classList.contains('on')) return;
    var r = m.getBoundingClientRect();
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = Math.max(8, Math.min(window.innerWidth - tw - 8, r.left + r.width/2 - tw/2));
    var top = r.top - th - 10; if(top < 8) top = r.bottom + 10;
    top = Math.max(8, Math.min(window.innerHeight - th - 8, top));
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }
  window.addEventListener('scroll', function(){ if(pinnedEl) reposition(); else hideTip(); }, true);
  window.addEventListener('resize', reposition);

  window.__annotateFootnotes = annotateAll;
  window.__fnLookup = lookup;
  window.__fnMap = FN;
})();
</script>
<script>
/* ============ 语言栏显示切换 (LANG-TOGGLE) ============ */
(function(){
  var KEY = 'readerhub_lang_view';
  var body = document.body;
  var enEls = document.querySelectorAll('#scroll-en, #enpane, .col.en');
  var zhEls = document.querySelectorAll('#scroll-zh, #zhpane, .col.zh');
  if(!enEls.length && !zhEls.length) return;

  var bar = document.getElementById('lang-toggle');
  var bEn = document.getElementById('lt-en');
  var bZh = document.getElementById('lt-zh');

  /* ---- 接管旧版顶栏「隐藏英文」按钮，避免两套状态打架 ---- */
  var legacyBtn = document.getElementById('toggle-en');
  if(legacyBtn){
    legacyBtn.style.display = 'none';
    var wrap = document.getElementById('wrap');
    if(wrap) wrap.classList.remove('hide-en');
    try{ localStorage.removeItem('readerhub_bilingual_hide_en'); }catch(e){}
  }

  /* ---- 从栏头文案推断语言名（英文 / 俄文 / 中文 …） ---- */
  function headText(els){
    for(var i=0;i<els.length;i++){
      var h = els[i].querySelector('.col-head, .panehead, header');
      if(h && h.textContent) return h.textContent;
    }
    return '';
  }
  function guess(txt, preferCjk, fallback){
    var seg = String(txt||'').split(/[·•|｜]/);
    var cjk = [], lat = [];
    seg.forEach(function(s){
      s = s.trim(); if(!s) return;
      (/[\u4e00-\u9fa5]/.test(s) ? cjk : lat).push(s);
    });
    var pick = preferCjk ? (cjk[0] || lat[0]) : (lat[0] || cjk[0]);
    pick = String(pick || '');
    pick = pick.replace(/原文|翻译|译文|对照|版|栏/g, '').replace(/[（(].*?[)）]/g, '').trim();
    if(!pick) return fallback;
    if(!/[\u4e00-\u9fa5]/.test(pick)) return fallback;
    return pick.length > 6 ? fallback : pick;
  }
  var enLabel = guess(headText(enEls), true, '英文');
  var zhLabel = guess(headText(zhEls), true, '中文');

  /* ---- 空栏（单语书）自动藏起对应按钮 ---- */
  function hasContent(els){
    for(var i=0;i<els.length;i++){
      var a = els[i].querySelector('.article') || els[i];
      if(a && a.textContent && a.textContent.replace(/\s+/g,'').length > 40) return true;
    }
    return false;
  }
  function refreshAvailability(){
    if(bEn && !hasContent(enEls)) bEn.style.display = 'none';
    if(bZh && !hasContent(zhEls)) bZh.style.display = 'none';
  }

  /* ---- 状态 ---- */
  var hideEn = false, hideZh = false;

  function toast(msg){
    if(typeof window.showToast === 'function'){ try{ window.showToast(msg); return; }catch(e){} }
    var t = document.getElementById('note-toast');
    if(t){
      t.textContent = msg; t.style.opacity = '1';
      clearTimeout(t._lt); t._lt = setTimeout(function(){ t.style.opacity = '0'; }, 1400);
    }
  }

  function paint(save){
    body.classList.toggle('rh-hide-en', hideEn);
    body.classList.toggle('rh-hide-zh', hideZh);
    if(bEn){
      bEn.classList.toggle('on', hideEn);
      bEn.textContent = (hideEn ? '显示' : '隐藏') + enLabel;
      bEn.title = (hideEn ? '显示' : '隐藏') + '原文栏（快捷键 E）';
    }
    if(bZh){
      bZh.classList.toggle('on', hideZh);
      bZh.textContent = (hideZh ? '显示' : '隐藏') + zhLabel;
      bZh.title = (hideZh ? '显示' : '隐藏') + '中文栏（快捷键 C）';
    }
    if(save){
      try{ localStorage.setItem(KEY, JSON.stringify({en: hideEn, zh: hideZh})); }catch(e){}
    }
    try{ window.dispatchEvent(new Event('resize')); }catch(e){}
  }

  function toggle(which){
    if(which === 'en'){
      // 不允许两栏同时隐藏：隐藏原文时若中文已隐藏，则自动切回中文
      if(!hideEn && hideZh) hideZh = false;
      hideEn = !hideEn;
    }else{
      if(!hideZh && hideEn) hideEn = false;
      hideZh = !hideZh;
    }
    paint(true);
    if(hideEn) toast('已隐藏' + enLabel + ' · 仅看' + zhLabel);
    else if(hideZh) toast('已隐藏' + zhLabel + ' · 仅看' + enLabel);
    else toast('双语对照');
  }

  if(bEn) bEn.addEventListener('click', function(){ toggle('en'); });
  if(bZh) bZh.addEventListener('click', function(){ toggle('zh'); });

  document.addEventListener('keydown', function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    var k = (e.key || '').toLowerCase();
    if(k === 'e'){ e.preventDefault(); toggle('en'); }
    else if(k === 'c'){ e.preventDefault(); toggle('zh'); }
  });

  /* ---- 恢复上次偏好 ---- */
  var st = null;
  try{ st = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){}
  if(st && typeof st === 'object'){
    hideEn = !!st.en; hideZh = !!st.zh;
    if(hideEn && hideZh){ hideEn = false; hideZh = false; }  // 脏数据兜底
  }
  paint(false);
  refreshAvailability();
  window.addEventListener('load', function(){
    refreshAvailability();
    setTimeout(refreshAvailability, 600);
  });
})();
</script>
<div class="lang-toggle" id="lang-toggle" role="group" aria-label="语言栏显示切换">
    <button type="button" class="lt-btn" id="lt-en" title="隐藏 / 显示原文栏（快捷键 E）">隐藏英文</button>
    <span class="lt-sep"></span>
    <button type="button" class="lt-btn" id="lt-zh" title="隐藏 / 显示中文栏（快捷键 C）">隐藏中文</button>
  </div>
<script>
/* ============ 语言栏显示切换 (LANG-TOGGLE) ============ */
(function(){
  var KEY = 'readerhub_lang_view';
  var body = document.body;
  var enEls = document.querySelectorAll('#scroll-en, #enpane, .col.en');
  var zhEls = document.querySelectorAll('#scroll-zh, #zhpane, .col.zh');
  if(!enEls.length && !zhEls.length) return;

  var bar = document.getElementById('lang-toggle');
  var bEn = document.getElementById('lt-en');
  var bZh = document.getElementById('lt-zh');

  /* ---- 接管旧版顶栏「隐藏英文」按钮，避免两套状态打架 ---- */
  var legacyBtn = document.getElementById('toggle-en');
  if(legacyBtn){
    legacyBtn.style.display = 'none';
    var wrap = document.getElementById('wrap');
    if(wrap) wrap.classList.remove('hide-en');
    try{ localStorage.removeItem('readerhub_bilingual_hide_en'); }catch(e){}
  }

  /* ---- 从栏头文案推断语言名（英文 / 俄文 / 中文 …） ---- */
  function headText(els){
    for(var i=0;i<els.length;i++){
      var h = els[i].querySelector('.col-head, .panehead, header');
      if(h && h.textContent) return h.textContent;
    }
    return '';
  }
  function bodyText(els){
    var s = '';
    for(var i=0;i<els.length;i++){
      var a = els[i].querySelector('.article') || els[i];
      if(a && a.textContent){ s += a.textContent; if(s.length > 8000) break; }
    }
    return s;
  }
  function cjkRatio(s){
    var m = String(s||'').match(/[\u4e00-\u9fa5]/g);
    return (m && s.length) ? (m.length / s.length) : 0;
  }
  function guess(txt, preferCjk, fallback){
    var seg = String(txt||'').split(/[·•|｜]/);
    var cjk = [], lat = [];
    seg.forEach(function(s){
      s = s.trim(); if(!s) return;
      (/[\u4e00-\u9fa5]/.test(s) ? cjk : lat).push(s);
    });
    var pick = preferCjk ? (cjk[0] || lat[0]) : (lat[0] || cjk[0]);
    pick = String(pick || '');
    pick = pick.replace(/原文|翻译|译文|对照|版|栏/g, '').replace(/[（(].*?[)）]/g, '').trim();
    if(!pick) return fallback;
    if(!/[\u4e00-\u9fa5]/.test(pick)) return fallback;
    return pick.length > 6 ? fallback : pick;
  }
  var enLabel = guess(headText(enEls), true, '英文');
  var zhLabel = guess(headText(zhEls), true, '中文');

  /* ---- 空栏（单语书）自动藏起对应按钮 ---- */
  function hasContent(els){
    for(var i=0;i<els.length;i++){
      var a = els[i].querySelector('.article') || els[i];
      if(a && a.textContent && a.textContent.replace(/\s+/g,'').length > 40) return true;
    }
    return false;
  }
  function refreshAvailability(){
    // 空栏（单语书）藏起对应按钮
    var cEn = hasContent(enEls), cZh = hasContent(zhEls);
    if(bEn) bEn.style.display = cEn ? '' : 'none';
    if(bZh) bZh.style.display = cZh ? '' : 'none';
    // 栏头标题未必靠谱（有的书把中文原文放在“英文栏”），按实际内容语言校正标签
    if(cEn && cjkRatio(bodyText(enEls)) > 0.15) enLabel = '原文';
    if(cZh && cjkRatio(bodyText(zhEls)) < 0.15) zhLabel = '译文';
    paint(false);
  }

  /* ---- 状态 ---- */
  var hideEn = false, hideZh = false;

  function toast(msg){
    if(typeof window.showToast === 'function'){ try{ window.showToast(msg); return; }catch(e){} }
    var t = document.getElementById('note-toast');
    if(t){
      t.textContent = msg; t.style.opacity = '1';
      clearTimeout(t._lt); t._lt = setTimeout(function(){ t.style.opacity = '0'; }, 1400);
    }
  }

  function paint(save){
    body.classList.toggle('rh-hide-en', hideEn);
    body.classList.toggle('rh-hide-zh', hideZh);
    if(bEn){
      bEn.classList.toggle('on', hideEn);
      bEn.textContent = (hideEn ? '显示' : '隐藏') + enLabel;
      bEn.title = (hideEn ? '显示' : '隐藏') + '原文栏（快捷键 E）';
    }
    if(bZh){
      bZh.classList.toggle('on', hideZh);
      bZh.textContent = (hideZh ? '显示' : '隐藏') + zhLabel;
      bZh.title = (hideZh ? '显示' : '隐藏') + '中文栏（快捷键 C）';
    }
    if(save){
      try{ localStorage.setItem(KEY, JSON.stringify({en: hideEn, zh: hideZh})); }catch(e){}
    }
    try{ window.dispatchEvent(new Event('resize')); }catch(e){}
  }

  function toggle(which){
    if(which === 'en'){
      // 不允许两栏同时隐藏：隐藏原文时若中文已隐藏，则自动切回中文
      if(!hideEn && hideZh) hideZh = false;
      hideEn = !hideEn;
    }else{
      if(!hideZh && hideEn) hideEn = false;
      hideZh = !hideZh;
    }
    paint(true);
    if(hideEn) toast('已隐藏' + enLabel + ' · 仅看' + zhLabel);
    else if(hideZh) toast('已隐藏' + zhLabel + ' · 仅看' + enLabel);
    else toast('双语对照');
  }

  if(bEn) bEn.addEventListener('click', function(){ toggle('en'); });
  if(bZh) bZh.addEventListener('click', function(){ toggle('zh'); });

  document.addEventListener('keydown', function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    var k = (e.key || '').toLowerCase();
    if(k === 'e'){ e.preventDefault(); toggle('en'); }
    else if(k === 'c'){ e.preventDefault(); toggle('zh'); }
  });

  /* ---- 恢复上次偏好 ---- */
  var st = null;
  try{ st = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){}
  if(st && typeof st === 'object'){
    hideEn = !!st.en; hideZh = !!st.zh;
    if(hideEn && hideZh){ hideEn = false; hideZh = false; }  // 脏数据兜底
  }
  paint(false);
  refreshAvailability();
  window.addEventListener('load', function(){
    refreshAvailability();
    setTimeout(refreshAvailability, 600);
  });
})();
</script>
</body>
</html>
