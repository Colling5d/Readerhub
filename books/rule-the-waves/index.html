t fielding a navy and merchant fleet capable of dominating the high seas. Alfred Thayer Mahan, the world's most renowned naval strategist, famously described the link between national power, economic power, and sea power: \"Control of the sea, by maritime commerce and naval supremacy,\" he wrote, means predominant influence in the world ... [and] is the chief among the merely material elements in the power and prosperity of nations.\"2","zh":"过去五百年间，世界贸易与军事力量的走向，都由海洋以及发生在海洋之上的竞争所塑造。在这五百年里，凡能长期执世界牛耳的国家或帝国，无不同时拥有足以称霸公海的海军与商船队。世上最负盛名的海权战略家阿尔弗雷德·塞耶·马汉，曾这样论述国家实力、经济实力与海权之间的关联：他写道，“通过海上贸易与海军优势而取得的海洋控制权”，意味着在世界上的支配性影响……“并且是各国实力与繁荣中各项纯物质要素里最首要的一项”。*"},{"id":"ch03-011","p":54,"t":"p","en":"In the modern period, the relationship between trade and naval power has been symbiotic in one way or another.³ For some powers, trade followed where their navies plundered—in the parlance of the American navy, “trade followed the flag.\" Other nations inverted the relationship, letting trade serve as the leading edge of their power, which more forceful measures—and their navies—followed.","zh":"近代以来，贸易与海军力量之间始终以某种方式互为依存。* 对某些强国而言，海军掠向何处，贸易便跟到何处——用美国海军的说法，“贸易跟着国旗走”。另一些国家则把这一关系颠倒过来：先让贸易充当国力的前锋，更强硬的手段——以及它们的海军——随之而至。"},{"id":"ch03-012","p":54,"t":"n","en":"to the British), Elmina castle saw as many as thirty thousand slaves moved through its dungeons each year.","zh":"落入英国人之手），埃尔米纳堡每年经其地牢转运的奴隶多达三万人。"},{"id":"ch03-013","p":54,"t":"n","en":"Conventional wisdom to the contrary, the trade winds are not so named after the trade routes they came to support, but rather from the medieval phrase \"blow trade,\" meaning in a steady course or direction. See Lincoln Paine, The Sea and Civilization: A Maritime History of the World (New York: Vintage, 2013).","zh":"与流行的说法相反，信风（trade winds）之名并非得自它们后来支撑起来的贸易航线（trade routes），而是出自中世纪的说法“blow trade”，意为沿着稳定的路线或方向吹。参见林肯·佩恩（Lincoln Paine）：《海洋与文明：一部世界海洋史》（The Sea and Civilization: A Maritime History of the World），纽约：Vintage 出版社，2013年。"},{"id":"ch03-014","p":55,"t":"p","en":"Prior to this period, for the Western nations who so profoundly shaped the modern world, oceans were the boundary of their experience, the frontier of societies, and the limit of knowledge. Not until the late eighth century did Norse Vikings sail and row across the North Sea to raid and then establish settlements in northern England--an impressive feat for the age, but in fact a voyage of only a few hundred nautical miles. More remarkably, around the turn of the eleventh century, Norseman Leif Erikson or his contemporaries (the historical record is imprecise) sailed across the Atlantic and established a settlement on what is now Canada's far-eastern shore.4 But these were exceptions. For much of humanity the sea was a blank space on the rudimentary maps of the day. Instead of islands and waves, maps of oceans were marked by monsters and imaginary creatures—such was the limited understanding.","zh":"在此之前，对那些深刻塑造了现代世界的西方民族来说，海洋是经验的边界、社会的前沿，也是知识的尽头。直到8世纪末，北欧维京人才驾船划桨横渡北海，前去劫掠，随后在英格兰北部建立定居点——在那个年代这已是不起的壮举，但实际航程不过数百海里。更值得注意的是，11世纪之交，北欧人莱夫·埃里克松（Leif Erikson）或其同时代人（史料记载并不精确）横渡大西洋，在如今加拿大最东端的海岸上建起一处居留地。* 但这些都属例外。对人类的多数而言，海洋不过是时人那些简陋地图上的一片空白。海图之上，岛屿与波涛的位置画的却是海怪和臆造的生物——所知就是这般有限。"},{"id":"ch03-015","p":55,"t":"p","en":"Only in the Islamic world was there greater movement and commerce across the oceans. 'The most recent history shows major trade across the Indian Ocean as early as the fourth century BCE.⁵ It is no accident that it was an Islamic scholar, Ibn Battuta, who in 1328 or 1330 (his chronology is suspect) managed to sail from Jeddah in the Arabian Peninsula, southeast to Aden, against the prevailing winds in the Red Sea, and ultimately to Zanzibar, the fabled island off the eastern coast of Africa. At least a decade later, he also made it as far east as China. Battuta's travelogue, the Rihla, only confirmed the extent of the cross-cultural and cross-continental trade in the Indian Ocean that reshaped the Islamic world in the fourteenth and fifteenth centuries.?","zh":"只有伊斯兰世界，越洋的迁徙与贸易才更为频繁。最新的史料表明，早在公元前4世纪，印度洋上就已有大规模贸易。* 1328年或1330年（他的纪年并不可靠），身为伊斯兰学者的伊本·白图泰（Ibn Battuta）从阿拉伯半岛的吉达出发，逆着红海的盛行风向东南驶抵亚丁，最终到达非洲东海岸那座传说中的岛屿桑给巴尔；做成这件事的偏偏是一位伊斯兰学者，这并非偶然。至少十年之后，他还一路向东到了中国。白图泰的游记《旅行记》（Rihla）恰恰印证了14、15世纪印度洋上跨文化、跨大陆贸易的规模——正是这种贸易重塑了伊斯兰世界。*"},{"id":"ch03-016","p":55,"t":"p","en":"Europe was largely incidental to these developments. Only in the enclosed Mediterranean Sea did the European polities of the time compete in naval contest. The continent caught the echoes of wider developments in the trade of silk and slaves that connected it to the Islamic world, but only remotely. Most of that trade happened by camel and horse and foot, having only to cross a narrow section of the Mediterranean at its eastern edge to connect the Venetian empire to the wealth of the Islamic world.8 What the European world understood of a rich market beyond its network of knowledge was shrouded in mystery and romanticism, like the legend of Prester John and his riches, which spurred many of the early, failed European efforts to find a sea route to Asia.","zh":"欧洲在这些发展中基本处于边缘。当时欧洲各政治体之间的海上角逐，只发生在被陆地环抱的地中海一隅。丝绸之路与奴隶贸易把欧洲与伊斯兰世界连在一起，欧洲大陆也能听到这些更广阔变动的回声，但只是远远听到。那时这类贸易大多靠骆驼、马匹和人力完成，只需在地中海东端越过一道狭窄水域，就能把威尼斯帝国与伊斯兰世界的财富接通。* 至于在那个知识网络之外还存在一个富庶市场，欧洲人所知的一切都笼罩在神秘与浪漫想象之中，譬如祭司王约翰（Prester John）及其财富的传说——正是这类传说，驱使欧洲人早年一再出海寻找通往亚洲的航路，却屡屡无功而返。"},{"id":"ch03-017","p":56,"t":"p","en":"All that changed when pre-Renaissance Europe, rising from the devastation of the Dark Ages, developed new knowledge and techniques for long-range navigation. Tempted in large part by the lure of the spice trade, European adventurers began their excursions into Asia, Africa, and the Americas by means of ocean voyage.º The resulting encounters of commerce and violence forged our world.","zh":"这一切，在文艺复兴前夜的欧洲发生了变化：欧洲从黑暗时代的废墟中重新站起，积累起远洋航行所需的新知识与新技术。很大程度上是受了香料贸易的诱惑，欧洲的冒险家开始渡海远行，闯入亚洲、非洲和美洲。* 由此产生的通商与暴力交织的相遇，锻造了我们今天的世界。"},{"id":"ch03-018","p":56,"t":"p","en":"Today we have a sense of the romance of the seas, but romance was not the point of Europe's ocean adventures—the point was prestige, and profit. As the most adventurous European powers of the day, Spanish and Portuguese explorers forayed into the \"new\" world, dismantling the Aztec and Mayan civilizations, and establishing for themselves far-flung empires of gold and silver and disease, spreading epidemics in their wake. And then Portugal went farther, charting a sea route to Asia, chasing the scent of profits as they tangled with the Mamluks of Egypt and the Ottomans of Constantinople over control of the spice trade.","zh":"今天我们觉得海洋带着浪漫色彩，但浪漫从来不是欧洲远航的目的——目的是威望，是利润。作为当时最具冒险精神的欧洲强权，西班牙与葡萄牙的探险者闯入“新”世界，拆毁了阿兹特克与玛雅文明，为自己建立起横跨远方的帝国，其基石是黄金、白银与疾病——他们走到哪里，瘟疫就传到哪里。葡萄牙走得更远，它勘出了通往亚洲的海路，循着利润的气味，与埃及的马穆鲁克王朝、君士坦丁堡的奥斯曼人争夺香料贸易的控制权。"},{"id":"ch03-019","p":56,"t":"p","en":"Portugal's motives were religious as well—the Christian powers of Europe sought to weaken the influence of the Muslim world by pressuring them in their home territories. (It was the first but not the last time Western powers would decide that the right way to weaken the perceived threat from Muslims was to take the fight to the Arab world.) Such was the role of religion and perceptions of providence in early European exploration that the Portuguese king's orator once cast their ambitions in terms quoted from Psalm 72: “He shall have dominion also from sea to sea, and from the river unto the ends of the earth.\"1o Combining religious zeal with advanced cannonry, Portugal's brutal explorers opened up trade routes that would become the precursors to contemporary globalization. Admiral James Stavridis, the first naval officer to become the head of NATO, wrote of this phase that \"their great voyages of discovery inspired Europeans, exploited Africans (often with extreme brutality), and created the connections between the Atlantic and Indian oceans over the fifteenth and sixteenth centuries. Some have called this the dawn of the Oceanic Age.\"11","zh":"葡萄牙的动机里也有宗教：欧洲的基督教强国想通过在穆斯林的本土施加压力，削弱伊斯兰世界的影响。（西方强国认定，削弱他们所感受到的穆斯林威胁，正确办法就是把战火打到阿拉伯世界去——这是第一次，却不是最后一次。）宗教与天意观念在欧洲早期探险中分量之重，以至于葡萄牙国王的御前演说者曾引用《诗篇》第72篇来陈述他们的抱负：“他要执掌权柄，从这海直到那海，从大河直到地极。”* 宗教狂热与先进火炮相结合，葡萄牙那些残暴的探险者打通了一条条贸易航路，日后成为当代全球化的前身。第一位出任北约欧洲盟军最高司令的海军军官詹姆斯·斯塔夫里迪斯海军上将（Admiral James Stavridis）写到这个阶段时说：“15、16世纪，他们那些伟大的发现之旅激励了欧洲人，剥削了非洲人（往往极其残暴），并打通了大西洋与印度洋之间的联结。有人称这是海洋时代的黎明。”*"},{"id":"ch03-020","p":56,"t":"p","en":"As the Portuguese and Spanish, and soon after the Dutch, vied for influence in the lands they encountered, dominance of the high seas became the most important measure and instrument of global power.¹2 The age of empire, which so deeply shaped the modern world, was first and foremost an age of sail—of naval warfare and sea-based trade. It was a violent encounter. In his epic poem The Lusíads, the Portuguese poet Luís de Camões talked of","zh":"随着葡萄牙人、西班牙人以及不久之后的荷兰人在他们踏足的异邦争夺势力，对公海的支配便成为衡量和运用全球实力最重要的尺度与工具。* 那个如此深刻塑造了现代世界的帝国时代，首先是一个风帆的时代——海上战争与海上贸易的时代。那也是一场暴力的相遇。葡萄牙诗人路易斯·德·卡蒙斯（Luís de Camões）在史诗《卢济塔尼亚人之歌》（The Lusíads）中写道："},{"id":"ch03-021","p":57,"t":"p","en":"such storms and perils,","zh":"多少风暴，多少危难，"},{"id":"ch03-022","p":57,"t":"p","en":"That death, many times, seemed imminent;","zh":"死亡多少次近在眼前；"},{"id":"ch03-023","p":57,"t":"p","en":"On the land, such battles and intrigue,","zh":"陆上又有多少厮杀与阴谋，"},{"id":"ch03-024","p":57,"t":"p","en":"Such dire, inevitable hardships!3","zh":"多少惨烈而无可避免的苦难！*"},{"id":"ch03-025","p":57,"t":"p","en":"This state-backed violence was a new phenomenon for the Indian Ocean they encountered. Roger Crowley, a historian of the imperial age, wrote about the Indian Ocean as the Portuguese encountered it in the 1400s. He described:","zh":"这种由国家撑腰的暴力，对他们所遇到的印度洋而言是新鲜事物。帝国时代史家罗杰·克劳利（Roger Crowley）曾描述15世纪葡萄牙人所遇见的印度洋，他写道："},{"id":"ch03-026","p":57,"t":"p","en":"a complex interlocking of trading systems, maritime styles, cultures and religions, and a series of hubs: Malacca on the Malay Peninsula, larger than Venice, for goods from China and the farther spice islands; Calicut, on the west coast of India, for pepper; Ormuz, gateway to the Persian Gulf and Baghdad; Aden, at the entrance to the Red Sea and the routes to Cairo, the nerve center of the Islamic world. Scores of other small city states dotted its shores. It dispatched gold, black slaves and mangrove poles from Africa, incense and dates from Arabia, bullion from Europe, horses from Persia, opium from Egypt, porcelain from China, war elephants from Ceylon, rice from Bengal, sulfur from Sumatra, nutmeg from the Malaccas, diamonds from the Deccan Plateau, cotton cloth from Gujarat. No one had a monopoly in this terrain—it was too extensive and complex.¹4","zh":"“那是一整套彼此咬合的贸易体系、航海方式、文化与宗教，还有一连串枢纽：马来半岛上的马六甲，规模比威尼斯还大，汇集来自中国和更远香料群岛的货物；印度西海岸的卡利卡特，以胡椒闻名；霍尔木兹，波斯湾与巴格达的门户；亚丁，扼红海入口，通往开罗——伊斯兰世界的神经中枢。沿岸还散布着数十个小城邦。这里输出非洲的黄金、黑奴与红树木杆，阿拉伯的乳香与椰枣，欧洲的金银锭，波斯的马匹，埃及的鸦片，中国的瓷器，锡兰的战象，孟加拉的稻米，苏门答腊的硫黄，马鲁古群岛的肉豆蔻，德干高原的钻石，古吉拉特的白棉布。在这片海域上，谁也无法垄断——它太大、太复杂了。”*"},{"id":"ch03-027","p":57,"t":"p","en":"Portugal was not the only distant power of the era to flex its muscles in the Indian Ocean. So, too, did China, at the height of the Ming Dynasty. Earlier, Song Dynasty merchants had recorded large profits from seagoing ventures, but the depredations of two merchants during the waning days of Mongol rule confirmed traditional Confucian distrust of seagoing ventures, and bureaucrats put the lid on oceangoing trade.\" China was visited by foreign explorers and traders, though, mostly from the Islamic world, whose arrival over land and by sea began to expose the Mings to the wealth to be found beyond the Middle Kingdom. At the dawn of the fifteenth century, the Yongle Emperor decided to break with that Confucian custom and set his sights on seaward exploration. He ordered his court to build a fleet of ships capable of sailing well beyond the coastal seas and into the far oceans.","zh":"在印度洋上伸展拳脚的，并不只有葡萄牙这一个远方强权。明王朝鼎盛时期的中国也是如此。更早些时候，宋代商人曾从海上贸易中获利甚丰，但蒙古统治末期两名商人的劫掠行径，坐实了儒家对出海经商的传统疑虑，官僚们于是封死了远洋贸易。* 不过，中国仍接待过外国探险者与商人，他们多来自伊斯兰世界；这些人经陆路和海路到来，也渐渐让明朝人看到中原之外还有何等财富。15世纪初，永乐皇帝决意打破这一儒家旧例，把目光投向海外。他下令朝廷建造一支船队，要能驶出近海，直入远洋。"},{"id":"ch03-028","p":58,"t":"p","en":"What resulted has gone down in Chinese lore as one of the great exploits of the nation's long history. It has been described as \"perhaps the most remarkable single phenomenon of the fifteenth century.\"15 Under the command of one of the emperor's court loyalists, Zheng He, the Mings built a fleet of around sixty treasure ships, the largest of which had nine masts, and were likely at least twice the size of the single largest ship in the Spanish or Portuguese fleets (although their true size is disputed).16 These ships were then loaded with goods and treasures from the Ming court, and accompanied by over two hundred troop, grain, battle, and supply ships. Historian Louise Levathes describes the voyage as it set sail: \"In autumn of 1405, the fleet of 317 brightly painted junks with a total crew of more than 27,000 men was ready to depart from Nanjing. As the ships assembled in formation in the center of the Yangzi, the sculpted ‘eyes' on the majestic bows looked anxiously downstream toward the open sea.\"i7 The so-called Treasure Fleet, voyaging together as an armada, set sail for ports west in 1405, past the Malay trading post of Malacca and out into the vastness of the Indian Ocean. For twenty-eight years these ships sailed to and from the major trading entrepôts of the day—from Malacca to Calicut to Malindi (near the island of Zanzibar) in an exercise of cultural diplomacy on a grand scale.18 The voyage played an important role in quasi-stabilizing the Malacca Straits, until then an anarchic den of competing pirate clans.19","zh":"其结果，在中国人的记忆里成了这个国家漫长历史上最了不起的功业之一。有人称之为“15世纪或许最值得瞩目的单一现象”。* 在皇帝身边一位亲信郑和的统率下，明朝建造了约60艘宝船，其中最大者立九桅，船体很可能至少是西班牙或葡萄牙舰队中最大单船的两倍（其真实尺寸仍有争议）。* 这些船装满明廷的货物与珍宝，另有200余艘兵船、粮船、战船与补给船随行。史家路易丝·莱瓦西斯（Louise Levathes）这样描写船队启航的情景：“1405年秋，317艘彩绘一新的帆船、共两万七千余名船员的舰队，已在南京准备启程。船只在长江江心列成阵形，那些雄伟船首上雕出的‘眼睛’，焦急地朝下游的远海张望。”* 这支所谓的宝船队以一支舰队的规模结伴而行，1405年启航驶向西面的港口，经马来半岛的贸易站马六甲，直入印度洋的浩渺。此后28年间，这些船往返于当时各主要贸易口岸——从马六甲到卡利卡特，再到马林迪（在桑给巴尔岛附近）——进行了一场规模宏大的文化外交。* 这次远航对马六甲海峡的初步稳定起了重要作用：在那之前，那里是各海盗团伙相互争斗、全无秩序的老巢。*"},{"id":"ch03-029","p":58,"t":"n","en":"According to a recent study of naval architecture, early Chinese ship designs actually informed some of the most important advances in industrial ship design, especially the strong internal bulkheads used by Chinese junks as early as the 300s. See Larrie D. Ferreiro, Bridging the Seas: The Rise of Naval Architecture in the Industrial Age, 1800–2000 (Cambridge, MA: MIT Press, 2020). The superior design of these early junks was noted by none other than Benjamin Franklin in his \"Marine Observations\" of 1795.","zh":"据新近一项船舶工程学研究，中国早期的船型设计实际上启发了工业时代船舶设计中若干最重要的进步，尤其是中国帆船早在4世纪就已采用的坚固内部隔舱。参见拉里·D. 费雷罗（Larrie D. Ferreiro）：《连接海洋：工业时代船舶工程的兴起，1800—2000》（Bridging the Seas: The Rise of Naval Architecture in the Industrial Age, 1800–2000），麻省理工学院出版社，2020年。这些早期帆船设计的优越之处，正是本杰明·富兰克林在1795年的《海洋观察》一文中指出的。"},{"id":"ch03-030","p":59,"t":"p","en":"Few original writings of the voyage survive, but one is from Zheng He himself. He inscribed the following:","zh":"关于这次远航的原始文字留存极少，其中一篇出自郑和本人。他刻石立碑，写下这样的话："},{"id":"ch03-031","p":59,"t":"p","en":"We have traversed over a hundred thousand li of vast ocean [and have] beheld great ocean waves, rising as high as the sky and swelling and swelling endlessly. Whether in dense fog and drizzling rain or in winddriven waves rising like mountains, no matter what the sudden changes in sea conditions, we spread our cloudlike sails aloft and sailed by the stars day and night.20","zh":"“涉彼十万余里之巨海，见洪涛接天，巨浪如山，绵延不绝。或雾霭弥漫、细雨霏霏，或狂风激浪、高如山岳，海况骤变，不一而足；我等张云帆于高桅，昼夜观星而行。”*"},{"id":"ch03-032","p":59,"t":"p","en":"Zheng He is to China what Richard the Lionheart is to England— a figure of historical legend who embodies the early prowess of the nation, often invoked by Chinese patriots and nationalists aspiring to reclaim the lost glory of China's imperial past.2¹ (And just as modern historiography has underscored the brutality of the Crusades, recent works of history have revealed that Zheng He's interactions across the Indian Ocean were far less peaceful than the official Chinese narrative would suggest.) But in 1433, after seven voyages of the Treasure Fleet, the Ming Dynasty under its new emperor, Xuande, pulled back the ships to preserve resources (the Mings were being attacked by the Mongols in the northwest), withdrawing back into its inland boundaries.\"The timing of the Chinese maritime decline,\" writes the naval historian Bruce Swanson, \"could not have been worse, for it coincided with European maritime expansion into Asia.\"22","zh":"郑和之于中国，犹如狮心王理查之于英格兰——一位历史传说中的英雄，象征这个国家早年的勇武，常被渴望重拾帝国往昔荣光的中国爱国者与民族主义者提起。*（正如现代史学强调十字军东征的残暴，晚近的史学著作也揭示出：郑和在印度洋上的往来，远不像中国官方叙事所讲的那样和平。）然而1433年，宝船队七下西洋之后，明王朝在新君宣德治下为节省国力把船队撤回（当时明朝正遭西北蒙古人攻击），退回到内陆疆界之内。* “中国海上力量衰落的时间点，”海军史家布鲁斯·斯旺森（Bruce Swanson）写道，“再糟糕不过，因为它恰与欧洲向亚洲的海上扩张同时发生。”*"},{"id":"ch03-033","p":59,"t":"p","en":"And so the Portuguese (and soon their European competitors) encountered little resistance on the high seas of Asia. As Roger Crowley writes, “The great continental powers of Asia left the sea to the merchants. There was small-scale piracy but there were no protectionist war fleets, and little notion of territorial waters prevailed.\"²3 That was about to change. Had China stayed this maritime course, the first sustained encounter between the Middle Kingdom and the Christian empires might have played out very differently. But it was not to be. Portugal encountered an Indian Ocean free of Chinese sea power and was therefore able over time to gain an important advantage in the game of empires.","zh":"于是，葡萄牙人（以及随后不久的欧洲竞争者）在亚洲的公海上几乎未遇抵抗。罗杰·克劳利写道：“亚洲各大陆上强国把海洋交给商人。那里有小股海盗，却没有保护性的战舰队，领海的概念也几乎不存在。”* 这种局面即将改变。倘若中国继续走那条海上之路，中原帝国与基督教帝国之间的第一次持续接触，结局也许会截然不同。然而历史没有如果。葡萄牙人所遇到的印度洋上没有中国海权，因此得以在帝国博弈中随着时间推移取得重要优势。"},{"id":"ch03-034","p":60,"t":"p","en":"For more than a century, Portugal's advantages on the high seas al. lowed it to develop the farthest-tlung empire of the late titteenth and sixteenth centuries, its exploits touching every peopled region of the world. From aforementioned Manaus in the central Amazon to the narrows that Verrazzano saw at the entrance to what is now the Fort of New York to Goa on the west coast of India, Portuguese seatarung sketched the links in what would become a global chain ot trade connections.\" Wherever Portugal deploved its cannon. trade routes wouid follow: trade followed the flag. Since Portugal's rise in the 15o)s, naval power and global trade have been inextricably linked-and remain so to this day.","zh":"一个多世纪里，葡萄牙在公海上的优势使它得以建立起15世纪末至16世纪最遥远的帝国，其活动触及世界上每一个有人聚居的地区。从前文提到的亚马孙腹地玛瑙斯，到韦拉扎诺（Verrazzano）当年所见、如今纽约港入口处的那道海峡，再到印度西海岸的果阿，葡萄牙人的航海活动勾连起日后那条全球贸易链上的各个环节。* 葡萄牙把炮架到哪里，贸易航路便延伸到哪里：贸易跟着国旗走。自16世纪葡萄牙崛起以来，海军力量与全球贸易便密不可分——直至今日依然如此。"},{"id":"ch03-035","p":60,"t":"p","en":"By the late 1500s, England was challenging both Spain and Fortugal on the seas. At a decisive battle in 1588 off the French coast at Grave lines, the English navy defeated the Spanish armada. demonstrating its growing mastery of the techniques of sail and naval battle. Its advances in shipbuilding would soon lead England to displace Portugal and then to build the largest and richest empire the world had ever knownuntil the US Navy helped forge the modern American equivalent.\"","zh":"到16世纪末，英格兰已在海上同时挑战西班牙与葡萄牙。1588年，在法国海岸外的格拉沃利讷（Gravelines）一场决定性海战中，英格兰海军击败西班牙无敌舰队，显示出它对风帆航行与海战技艺的掌握日益精熟。它在造船上的进步，很快使英格兰取代葡萄牙，进而建立起世界前所未见的最大、最富的帝国——直到美国海军帮助锻造出与之相当的现代美国版本。*"},{"id":"ch03-036","p":60,"t":"p","en":"Globalization, that bugbear of modern politics, that much misused description of global economics, is often thought of as a contemporary phenomenon. Yet the history of the rise of Europe as early as the sixteenth century is a story of global trade. Not free trade. to be sure. but a global trade nonetheless. Indeed, to this day. global trade and power follows patterns and pathways set in the Age of Empire. lhe parameters of the contemporary world were set in large part by the wav in which European colonial exploration intersected with the waning enpires of the East in the late eighteenth and early nineteenth centuries","zh":"全球化——现代政治的心头之患，也是被误用最多的一个描述全球经济的说法——常被视为当代现象。然而欧洲早在16世纪崛起的历史，本身就是一部全球贸易史。当然不是自由贸易，但仍旧是全球范围的贸易。事实上，时至今日，全球贸易与权力的走向，仍沿着帝国时代划定的模式与路径。当代世界的诸多参数，很大程度上是由18世纪末、19世纪初欧洲殖民探索与东方日渐衰落的帝国彼此交汇的方式所设定的。"},{"id":"ch03-037","p":60,"t":"p","en":"Even smaller European empires like Sweden, puny actors by global scale, played important roles in this phase of imperial exploration and trade.2⁶ Germany had a modest global footprint, as did Belgium, between them occupying and plundering in the most brutal manner imaginable the natural resources of Central and East Africa.27 Of the major European powers, France joined the game late, moving in the 1700s to acquire possessions in the Americas, in West and North Africa, in the Middle East, and later a small foothold in Southeast Asia. Writing his magisterial account of the sea and civilization, Lincoln Paine comments of this oceanic activity: \"They made possible the forging of new links between formerly unconnected regions of the globe, and laid the foundation of Europe's gradual ascendency on the world stage.\"28","zh":"即便是瑞典这样较小的欧洲帝国——放到全球尺度上不过是个微不足道的角色——也在这一轮帝国探索与贸易中扮演了重要角色。26 德国在世界上的足迹不算大，比利时亦然；两国在中非与东非以所能想象的最残暴方式占领并掠夺当地的自然资源。27 在主要的欧洲强国中，法国入场较晚：18世纪它才开始在美洲、西非与北非、中东谋取属地，后来又到东南亚取得了一小块立足点。林肯·佩恩（Lincoln Paine）在他那部论述海洋与文明的皇皇巨著中，这样评说这场海洋活动：“它们使世界上原本互不相连的地区之间得以结成新的纽带，并为欧洲在世界舞台上逐步崛起奠定了基础。”28"},{"id":"ch03-038","p":60,"t":"n","en":"The major competitors to the Portuguese in this period were the (ttomans. That the Ottomans were a sea power as well as a land power is otten neglected in the re counting of the imperial age, but Portuguese-Ottoman competition shaped the de velopment of the Red Sea, the eastern coast of Africa, and the Suez long betore the arrival of the better-known Franco-British rivalries of the eighteenth and nineteenth centuries.","zh":"这一时期葡萄牙人的主要竞争对手是奥斯曼人。在讲述帝国时代时，人们常忽略一点：奥斯曼人既是陆上强国，也是海上强国。然而早在18、19世纪那场更为人熟知的英法角逐到来之前很久，葡萄牙与奥斯曼的竞争就已塑造了红海、非洲东海岸以及苏伊士一带的格局。"},{"id":"ch03-039","p":61,"t":"p","en":"But to fully understand that ascendency, and the shape of the modern world, it's chiefly Britain's economic, colonial, and eventually imperial role in Asia that matters. Britain reversed the Portuguese game—the flag followed the trade.","zh":"但要真正理解这次崛起，理解现代世界的成形，关键还在于英国在亚洲所扮演的经济角色、殖民角色，乃至最终成形的帝国角色。英国把葡萄牙人的那套玩法颠倒了过来——国旗跟着贸易走。"},{"id":"ch03-040","p":61,"t":"h","en":"The Company","zh":"英国东印度公司"},{"id":"ch03-041","p":61,"t":"p","en":"England's industrial revolution is often written about as a story of new technology and manufacturing prowess, and these were essential. What financed England's growth, though, was huge imports of cotton from India and other natural resources from its eastern colonies.29 The flowering of European civilization in the eighteenth and particularly the nineteenth century was a product of the huge economic gains from a global trade—and, to be sure, of the system of suppression and indentured labor that undergirded it.30","zh":"人们写英格兰的工业革命，往往写成新技术与制造业本领的故事，这些固然必不可少。但真正为英格兰的增长提供资金的，是从印度源源运来的棉花，以及从东方各殖民地运来的其他自然资源。29 18世纪、尤其是19世纪欧洲文明的繁盛，是全球贸易巨额收益的产物——当然，也是支撑这一切的压迫制度与契约劳工制度的产物。30"},{"id":"ch03-042","p":61,"t":"p","en":"Some of England's most important imperial interactions, though, came initially not through military occupation but commercial engagement. As early as 1553, a handful of British merchants formed what later became known as a joint-stock company, the aptly named Company of Merchant Adventurers to New Lands (also known as the Muscovy Company), formed to undertake trade with Russia.³¹ Almost fifty years later, and more consequently, a similar mechanism was formed in 1600 to venture still farther east: the English East India Company. This move was quickly followed by the Dutch, Danish, Portuguese, French, and Swedish imperial courts, each of which would over the next decades establish their own similar \"companies.\"32 In today's parlance we would think of them as joint ventures, so entangled were they with the crown.\" They became the tip of the spear of European exploration.33","zh":"不过，英格兰若干最重要的帝国交往，起初并不是靠军事占领，而是靠商业往来打开的。早在1553年，就有几位英国商人组建了后来所称的合股公司，名号起得恰如其分——“新土地商人冒险家公司”（Company of Merchant Adventurers to New Lands），又名莫斯科公司（Muscovy Company），专营对俄贸易。31 将近五十年后，即1600年，一种类似的机制又告成立，为的是向更远的东方闯荡，影响也更大：这就是英国东印度公司。此举一出，荷兰、丹麦、葡萄牙、法国、瑞典的宫廷纷纷效仿，各自在此后数十年间建起自己的“公司”。32 用今天的话说，我们会把它们看作合资企业——它们与王室纠缠得实在太深——这些公司成了欧洲探索的矛尖。33"},{"id":"ch03-043","p":62,"t":"p","en":"Most consequential was the English East India Company, which by the mid-1700s was so large and so powerful it was simply known as The Company.34 Over the course of two centuries, it wielded a combination of trade, commercial diplomacy, and private force-often backed up by official diplomacy and force from London. The story of The Company's gradual morphing from a commercial enterprise into a semi-sovereign force, both partner and competitor to the Crown, defies effective categorization between the private and the public sphere. William Dalrymple, the leading historian of the English in India, uses an evocative phrase to describe its tenure: he calls it, simply, “The Anarchy.\"3s During its two centuries of operations, backed by the British Crown, it would progressively, purposely, and eventually brutally dismantle the Mughal Empire in northern India, along with the Burmese Kingdom, and absorb the remnants of the Deccan sultanates in southern India. And then, in a more gradual and subtle process, it would encounter and help to hasten the collapse of the Qing Dynasty in China.36","zh":"其中影响最大的当属英国东印度公司。到18世纪中叶，它的规模与权势已大到人们径称之为“公司”。34 在两个世纪里，它集贸易、商业外交与私人武力于一身——背后往往还有伦敦官方的外交与武力撑腰。这家“公司”如何从一家商业企业渐渐变成半主权力量，既是王室的伙伴，又是王室的对手，其历程实在难以在公与私之间划出界线。研究英国人在印度历史的权威学者威廉·达尔林普尔（William Dalrymple）用了一个很传神的说法来概括它的统治，径称之为“无政府状态”（The Anarchy）。35 在其两个世纪的经营中，有英国王室撑腰，它一步步地、蓄意地、最终是残暴地拆解了北印度的莫卧儿帝国与缅甸王国，并吞并了南印度德干诸苏丹国的残余。再往后，它又以更为缓慢隐蔽的方式撞上了清王朝的崩塌，并助推了这一崩塌。36"},{"id":"ch03-044","p":62,"t":"p","en":"Though these empires were by most measures larger and more powerful than their European competitors, Europe's command of the high seas gave its adventurers a formidable advantage. Indeed, some recent scholarship suggests that it was the key advantage that the Europeans held over their powerful Asian rivals. In an important revision of some of the conventional assumptions of the time, J. C. Sharman's Empires of the Weak makes a compelling case that it was precisely their ability to control the high seas, not advantages of modernization or political systems or even weaponry, that enabled the European empires to gain mastery over the Asian empires. (It is also true that the heyday of European power coincided with a period of advanced corruption and rot in the heart of the key Asian empires.)37","zh":"尽管从多数标准衡量，这些帝国都比它们的欧洲对手更大、更强，但欧洲人对公海的掌控，还是让他们的冒险者占尽优势。事实上，晚近一些研究认为，这正是欧洲人相对其强大的亚洲对手所握有的关键优势。J. C. 沙曼（J. C. Sharman）的《弱者的帝国》（Empires of the Weak）对当时一些通行假设作了重要修正，令人信服地论证：欧洲各帝国之所以能凌驾于亚洲帝国之上，靠的恰恰是控制公海的能力，而不是现代化程度、政治制度乃至武器的优势。（同样属实的是：欧洲权力的鼎盛期，恰与亚洲几个主要帝国核心的深度腐败与朽坏同时。）37"},{"id":"ch03-045","p":62,"t":"n","en":"Another of these joint stock ventures was the Hudson's Bay Company, which opened up British trade routes in what would later become Canada and the United States of America. For an excellent history of the company, see Peter C. Newman, Company of Adventurers: How the Hudson's Bay Empire Determined the Destiny of a Continent (Toronto: Penguin Canada, 2005).","zh":"这类合股企业还有哈得孙湾公司（Hudson's Bay Company），它在后来成为加拿大与美国的那片土地上开辟了英国的贸易路线。关于该公司的一部优秀史著，参见彼得·C. 纽曼（Peter C. Newman）：《冒险家公司：哈得孙湾帝国如何决定了一个大陆的命运》（Company of Adventurers: How the Hudson's Bay Empire Determined the Destiny of a Continent），多伦多：企鹅加拿大出版社，2005年。"},{"id":"ch03-046","p":63,"t":"p","en":"Whatever the role of internal decay, political systems, or naval mastery, a vital backdrop to all that followed is that the near-total collapse of both the Indian and Chinese empires opened up a lacuna in world affairs. They were the two largest economies in the world in the 1700s, and their demise created a space into which Western power would flow and from which Europe and then the New World would profit for more than a century and a half.38","zh":"无论内部朽坏、政治制度、海上优势各起了多大作用，此后一切事件都有一个至关重要的背景：印度与中国这两个帝国的近乎全面崩溃，在世界事务中留下了一片真空。18世纪，它们是世界上最大的两个经济体；它们的衰亡腾出的空间，西方势力随即涌入，欧洲乃至后来的新大陆从中获利长达一个半世纪有余。38"},{"id":"ch03-047","p":63,"t":"p","en":"In the late 1700s, Britain's colonial ambitions and profits were disrupted by a populist revolt in a territory it had acquired some years earlier, one that would soon become known as the United States of America. The American war served not to weaken the British Empire as a whole, but rather to refocus it on its eastern holdings.³9 On the European continent, Britain was endlessly entangled in war with the French. In Africa, a profitable slave trade continued, but in constant friction with the French, as in the Middle East, where French rivalry and local insurrections curtailed British ambitions.40","zh":"18世纪末，英国在数年前取得的一块领地上爆发了一场民粹式的叛乱，它的殖民雄心与利润因此受挫——那块领地不久后便以“美利坚合众国”之名行世。这场美国战争并没有削弱整个大英帝国，反而使它把注意力重新集中到东方的属地。39 在欧洲大陆，英国与法国缠斗不休。在非洲，利润丰厚的奴隶贸易继续进行，但与法国人摩擦不断；中东亦然，法国的竞争与当地的起事限制了英国的野心。40"},{"id":"ch03-048","p":63,"t":"p","en":"In the East, however, the English dominated the colonial race, in part because Portugal and the Dutch had diminished as imperial contenders, and in large part because Britain had the superior navy. The riches they plundered from their holdings and acquisitions in India were unparalleled. In the wake of their loss of the American colonies, London's appetite for eastern expansion grew, and it turned its gaze still farther in the Orient, to the uncalculated treasures of the Qing Empire in China. British victories in the Napoleonic Wars also enabled a move against French possessions in the Indian Ocean.","zh":"然而在东方，英国人主导了这场殖民竞赛。部分原因是葡萄牙与荷兰已不再是有分量的帝国角逐者，更主要的原因是英国拥有更强大的海军。他们从印度属地与占领地掠夺的财富无从比拟。失去美洲殖民地之后，伦敦对东方扩张的胃口反而更大，目光投向更远的东方，投向中华帝国清廷那些无法估量的财宝。英国在拿破仑战争中的胜利，也使它得以对法国在印度洋的属地动手。"},{"id":"ch03-049","p":63,"t":"p","en":"As the story has been carefully told elsewhere, as Britain deepened its hold on India and the Indian Ocean, the most consequential economic feature of the colonial system became the triangular trade that emerged between Britain, India, and China. Britain and Europe as a whole had developed an appetite for Chinese tea, as well as silks, furniture, and other goods. Trade in these goods started at a small scale, but grew through the late 1700s and into the early 1800s. But as Britain traded its gold for that tea, it developed a substantial trading deficit with China—to the mounting concern of London and the masters of The Company. (There are sharp echoes here of modern complaints about China's large “current-account surplus\" with the United States.)","zh":"这段故事已有史家细细讲过：随着英国加深对印度与印度洋的控制，殖民体系中最要紧的经济特征，变成了英国、印度与中国之间兴起的三角贸易。英国乃至整个欧洲都对中国茶叶、丝绸、家具及其他货物生出了胃口。这类贸易起初规模不大，但从18世纪末到19世纪初不断增长。可英国是用黄金去换茶叶的，对华贸易逆差于是越积越大，令伦敦和“公司”的东主们日益不安。（这与今天对中国对美巨额“经常账户顺差”的抱怨，如出一辙。）"},{"id":"ch03-050","p":64,"t":"p","en":"To change the equation, Britain began exporting opium, which it grew in India, to feed an incipient Chinese market for the drug. Increasing the flow of opium into China began to ease British gold losses in the triangular trade. This became a domestic problem in China, as the health effects of the opium trade began to take a toll on Chinese society. The British and European trade nevertheless deepened.41,' By 1828, opium accounted for more than half of the British total export value to China.42 In 1834, the British Crown revoked the monopoly it had given to the East India Company, and an influx of private traders flowed into China. The opium trade grew still further.43","zh":"为了改变这道算式，英国开始出口在印度种植的鸦片，以喂养中国刚刚萌生的毒品市场。流入中国的鸦片增加，英国在三角贸易中的黄金流失开始缓和。这却成了中国国内的一大问题：鸦片贸易带来的健康后果开始侵蚀中国社会。尽管如此，英国与欧洲的贸易仍在加深。41 到1828年，鸦片已占英国对华出口总值的半数以上。42 1834年，英国王室撤销了授予东印度公司的垄断权，大批私商涌入中国。鸦片贸易进一步膨胀。43"},{"id":"ch03-051","p":64,"t":"p","en":"At this point in history, China's trade with the outside world was tightly controlled. After early, unsettling encounters with foreign traders, the Chinese court had established a careful system for limiting contact between foreigners and the Chinese. They gave a monopoly on foreign trade to a small number of families, termed the Cohong or Hongs, and forbade foreigners from entering China proper. The Qing court demarcated a small area of Canton (modern-day Guangzhou), at the opening of the Pearl River, to house foreign traders. They established \"factories\" there—the word \"factory\" not implying a production facility, but housing for the \"factors,\" or tradesmen of the day. These were a combination of boardinghouse and warehouse for the British, French, Russian, German, and other European traders who maintained a consistent flow of goods into China. And by the mid-1830s, opium accounted for a huge portion of that flow of goods.","zh":"在这一历史时点，中国与外部世界的贸易受到严格管制。在与外国商人有过早年的不快接触之后，清廷订立了一套审慎的制度，以限制外国人与中国人的往来。它把对外贸易的垄断权交给少数几家商行，称为“公行”（Cohong，即“十三行”），并禁止外国人进入中国内地。清廷在广州（Canton，今广州）珠江河口划出一小块地方，供外国商人居留，并在那里设立“商馆”（factory）——“factory”一词在此并非指生产场所，而是指“代理商”（factor）即当时商人的住所。对英国、法国、俄国、德国及其他欧洲商人来说，这些商馆既是旅舍，又是货栈；正是他们维持着货物源源不断流入中国。到19世纪30年代中期，鸦片已占这股货流的很大一部分。"},{"id":"ch03-052","p":64,"t":"p","en":"In 1836, the imperial court of China, together with the viceroy of Canton, started a campaign to try to eliminate the opium trade. The Qing Dynasty appointed Imperial Commissioner Lin Zexu to Canton to try to crack down on the opium trade, including destroying chests of opium, and pushing back on the British penetration of Canton.44,†","zh":"1836年，清廷会同两广总督，发起一场力图禁绝鸦片贸易的运动。清廷任命林则徐为钦差大臣，派赴广州查禁鸦片，包括销毁一箱箱鸦片，并遏止英国人对广州的渗透。44†"},{"id":"ch03-053","p":64,"t":"n","en":"Even the United States joined the trade in 1784, when the Empress of China became the first American merchant ship to enter Chinese waters, a mere eight years after the country became independent. See Michael Green, By More Than Providence (New York: Columbia University Press, 2017), 22.","zh":"连美国也在1784年加入了这项贸易：“中国皇后”号（Empress of China）成为第一艘驶入中国水域的美国商船，此时距美国独立仅八年。参见迈克尔·格林（Michael Green）：《超越天意》（By More Than Providence），纽约：哥伦比亚大学出版社，2017年，第22页。"},{"id":"ch03-054","p":64,"t":"n","en":"Not for the first time in Chinese history. In 878 AD, Chinese rebels defied the edicts of the emperor and massacred Arab and Persian traders who had established a trading base at Guangzhou. See William Bernstein, A Splendid Exchange (New York: Atlantic Monthly Press, 2008), 68.","zh":"这在中国历史上并非首次。公元878年，中国叛军无视皇帝的诏令，屠杀了在广州建立贸易据点的阿拉伯与波斯商人。参见威廉·伯恩斯坦（William Bernstein）：《伟大的贸易》（A Splendid Exchange），纽约：大西洋月刊出版社，2008年，第68页。"},{"id":"ch03-055","p":65,"t":"p","en":"Tensions grew; Britain was simply gaining too much profit from the trade to allow for a restriction. The British had tried for years to open up Chinese markets to deeper trade. As early as 1793, they had tried direct diplomatic appeals to the Chinese Imperial Court. Lord George Macartney undertook a famous diplomatic mission to Beijing to ask the court to further open up the opium trade. A portrait of the diplomatic mission shows Lord Macartney in his audience with the Qing emperor. A note in his diary explains what happened in the meeting: he “was received with the utmost politeness, treated with the utmost hospitality, watched with the utmost vigilance and dismissed with the utmost civility.\"45 Little came of his mission. In 1816, George Staunton, the son of one of Macartney's translators, served as a commissioner on the earl of Amherst's diplomatic embassy to Beijing. This time, the British did not even manage to gain an audience with the emperor, when Staunton advised Amherst not to kowtow to the Chinese. Diplomacy failed. Then, as would so often afterward be the case, what followed failed diplomacy was military escalation.","zh":"紧张不断加剧；英国从这项贸易中获利实在太多，容不得任何限制。多年来，英国人一直设法打开中国市场，把贸易做得更深。早在1793年，他们就尝试直接向清廷作外交呼吁。乔治·马戛尔尼勋爵（Lord George Macartney）率团出使北京，是著名的一次外交行动，目的正是请求清廷进一步开放鸦片贸易。有一幅描绘该使团的画作，画的是马戛尔尼勋爵觐见清帝的场面。他日记里的一则笔记说明了会面的情形：他“受到极度的礼遇，受到极度的款待，受到极度的警觉监视，最后以极度的客气被礼送出境”。45 此行收效甚微。1816年，马戛尔尼一位译员的儿子乔治·斯当东（George Staunton）以专员身份随阿美士德伯爵的使团赴北京。这一次，斯当东劝阿美士德不要向中国人叩头，英国人连觐见皇帝都没能做到。外交失败了。接下来，一如此后屡屡发生的那样，外交失败之后跟着的便是军事升级。"},{"id":"ch03-056","p":65,"t":"p","en":"By the late 1820s, the Qing Dynasty was using its limited naval power to block English clippers from sailing up the Pearl River, forcing them to port at the small island of Lintin, in the mouth of the river delta. In 1839, Lin Zexu's campaign to push back on the English trades began to intensify as the Chinese commissioner confiscated and destroyed chests of British-supplied opium. In September 1839 there were skirmishes off the coast, and in November 1839 a military confrontation at Cheunpi, in Canton Bay, saw two British frigates, the twenty-eight-gun Volage and the eighteen-gun Hyacinth, take on twenty-nine Chinese vessels that were blocking the harbor. The overwhelming military superiority of the British ships carried the day and the Chinese junks were destroyed with almost no casualties on the British side.4 In the words of Bruce Swanson, a historian of Chinese naval power: \"The ocean no longer served as an extension of the Great Wall.\"47","zh":"到19世纪20年代末，清廷动用其有限的海上力量，阻止英国飞剪船驶入珠江，迫使它们只能停泊在珠江口的小岛伶仃岛（Lintin）。1839年，随着这位钦差大臣查抄销毁英国供应的鸦片，林则徐遏止英商贸易的行动开始升级。1839年9月，沿海发生了数次小规模冲突；11月，在穿鼻（Cheunpi，广州湾）的一场军事对抗中，英国两艘护卫舰——装备28门炮的“沃拉吉”号（Volage）和装备18门炮的“风信子”号（Hyacinth）——迎战封锁港口的29艘中国船只。英舰压倒性的军事优势决定了战局，中国帆船被摧毁，英方几乎未受损失。46 用中国海军史家布鲁斯·斯旺森（Bruce Swanson）的话说：“海洋不再是长城的延伸。”47"},{"id":"ch03-057","p":65,"t":"p","en":"From there, the situation escalated quickly. In Britain, politicians had been arguing about the benefits and costs of demanding retaliation against the Chinese for blocking their market-but the decision to launch a full-blown fight was ultimately not made in London. On January 31, 1840, The Company's authorities in India, who had command of British forces in Asia, declared war on the Chinese.48 The British government wouldn't pass a motion for war against China until April 1840. The purpose of the war was a limited one: to compel the Chinese to open to wider trade. Lord Palmerston was the foreign secretary in London and his name will always be associated with \"gunboat diplomacy\"—a phrase that captured the somewhat ironic notion of using naval force to achieve better terms in a negotiation over \"free\" trade. In point of fact, Palmerston long resisted deploying British forces to help the opium traders, arguing that Britain could not “interfere for the purpose of enabling British subjects to violate the laws of the country to which they trade.\"49 Eventually, though, events on the ground (and strong lobbying from British opium traders) forced his hand.","zh":"事态由此迅速升级。在英国，政客们一直在争论因中国封锁市场而要求报复的利弊——但真正决定大打一场的，最终并不是伦敦。1840年1月31日，“公司”在印度的当局——他们掌握着英国在亚洲的军队——对中国宣战。48 英国政府直到1840年4月才通过对华开战的动议。战争的目标是有限的：迫使中国开放更广泛的贸易。帕默斯顿勋爵（Lord Palmerston）时任伦敦外交大臣，他的名字将永远与“炮舰外交”连在一起——这个说法道出了一种颇具讽刺意味的思路：用海军力量在关于“自由”贸易的谈判中换取更有利的条件。事实上，帕默斯顿长期反对出兵帮助鸦片贩子，理由是英国不能“为使其臣民违反他们所贸易国家的法律而进行干预”。49 但地面的局势（以及英国鸦片贩子的强力游说）最终还是逼他出手。"},{"id":"ch03-058","p":66,"t":"p","en":"As the British intensified their military operations on the Pearl River, they focused their attention on the great natural harbor of Hong Kong, some twenty miles due south from the Chinese mainland. The harbor features deep, protected, and easily defended waters with easy access to the South China Sea and beyond. Prior to the open conflict with China, the harbor and surrounding areas had been used as a location to replenish fresh-water supplies. But during the ensuing war, the British navy and traders began to use the harbor at scale. On January 26, 1841, Hong Kong island was occupied by the British with the signing of the Convention of Chuenpi (today romanized as Chuanbi), although neither side professed happiness with it; Palmerston called Hong Kong \"a barren island with hardly a house upon it.\"50","zh":"英军在珠江上加紧军事行动的同时，把注意力集中到香港那片天然良港上——它位于中国大陆正南约20英里处。港口水深、有遮蔽、易守难攻，进出南海及更远海域都十分便利。在与中国的公开冲突爆发之前，这一港湾及周边地区只是补充淡水的地方。但在随后的战争中，英国海军与商人开始大规模使用这个港口。1841年1月26日，随着《穿鼻草约》签订，香港岛被英军占领（该地名今罗马化为 Chuanbi）；不过双方都不曾表示满意，帕默斯顿说香港是“一座几乎连房子都没有的荒岛”。50"},{"id":"ch03-059","p":66,"t":"p","en":"Military action intensified, and what is known as the First Opium War was well underway. It lasted, at varying degrees of intensity, for two and a half years. At its peak, the British had sixteen gunboats plying Chinese waters.51 By the summer of 1842, the Chinese recognized that they were literally outgunned, and they sued for peace. The result was the August 29, 1842, Treaty of Nanking. This ended the monopoly of the Cohongs who had controlled trade and opened new treaty ports in addition to Canton, in Amoy, Foochow (modern-day Xiamen and Fuzhou), Ningpo, and Shanghai. The Chinese paid the British off for their opium losses, and they ceded Hong Kong to Britain. In 1843, a supplementary treaty, known as the Treaty of the Bogue, reinforced the Treaty of Nanking and added further provisions. Between them, the two treaties stipulated that British citizens would be tried by British courts for any violations of the treaty or of Chinese law, and if China were to grant other rights to other European powers, they would also grant Britain those same rights.","zh":"军事行动不断加剧，所谓第一次鸦片战争已然全面展开。战事以不同的强度持续了两年半。到战事高峰时，英国有16艘炮艇在中国水域往来。51 到1842年夏，清廷认清自己在火力上确实处于劣势，遂求和。结果便是1842年8月29日的《南京条约》。条约终结了掌控贸易的公行垄断，并在广州之外新开若干通商口岸：厦门（Amoy）、福州（Foochow）、宁波、上海。中国向英国偿付鸦片损失，并割让香港给英国。1843年，又有一项补充条约，即《虎门条约》，加强并增补了《南京条约》的条款。两项条约合起来规定：英国臣民若有违反条约或中国法律之举，交由英国法庭审判；中国若给予其他欧洲强国任何其他权利，也须一并给予英国。"},{"id":"ch03-060","p":67,"t":"p","en":"The Treaties of Nanking and Bogue are some of the most consequential documents in modern history. The treaties effectively established the principles that form the legal heart of global trade arrangements to this day—what are known in modern parlance as the principle of “extra-territoriality\" and the principle of the “most-favored nation.\" For all intents and purposes they sealed the fate of the late Qing Empire in China, assigning it to a subordinate status in the face of British power. Although the Qing would rule until 1912, from the 1850s onward they were progressively weakened by a combination of internal rebellion and external intrusion by the European power. This set the stage for the so-called Century of Humiliation, a period of history that the modern Chinese government still references as it deals with the West. And it solidified the three-way trade in gold, tea, and opium that undergirded British dominance of world finance for a century to come.52","zh":"《南京条约》与《虎门条约》是近代史上影响最深远的文件之一。它们实际上确立了至今仍是全球贸易安排法律核心的几项原则——用现代的说法，就是“治外法权”原则与“最惠国”原则。就其实际效果而言，这两项条约锁定了晚清帝国的命运，使它在英国的强权面前沦于从属地位。清朝虽统治到1912年，但从19世纪50年代起，便在内部叛乱与欧洲列强外来侵逼的双重作用下日渐削弱。这为此后所谓的“百年国耻”搭好了舞台——这段历史，今天的中国政府在与西方打交道时仍会提及。它也巩固了黄金、茶叶与鸦片之间的三方贸易，而正是这一贸易支撑了英国在此后一个世纪里对世界金融的主导。52"},{"id":"ch03-061","p":67,"t":"p","en":"The period that followed were the years when Britain \"ruled the waves,\" in the words of the Gilbert and Sullivan song that became the anthem of an age.","zh":"此后那段岁月，正是英国“统治海洋”的年代——这句话出自吉尔伯特与沙利文（Gilbert and Sullivan）的一首歌，那首歌成了一个时代的颂歌。"},{"id":"ch03-062","p":67,"t":"h","en":"The Great Bypass","zh":"伟大的绕行"},{"id":"ch03-063","p":67,"t":"p","en":"For the rest of the nineteenth century and into the twentieth, Britain continued its dominance of the high seas. Ironically, a major boost to its dominance came in the form of an innovation by its archrival France.","zh":"在19世纪余下的岁月并进入20世纪之后，英国继续主宰着公海。颇具讽刺意味的是，给这份主导地位一记重大助推的，竟是它的头号对手法国的一项创新。"},{"id":"ch03-064","p":67,"t":"p","en":"Given the critical role played in the imperial contest by sea power, and the growing importance of global trade to the coffers of both Paris and London, it was foremost in the minds of Britain's rulers to look at their long-running competition with France, in part through the question of who had greater control of the seas. France and England's endless land wars—the Hundred Years' War, the Thirty Years' War, and the Napoleonic Wars—-are better known; but control of the critical seaways was a vital part of Anglo-French rivalry.⁵3","zh":"鉴于海权在帝国角逐中所起的关键作用，也鉴于全球贸易对巴黎与伦敦两地国库日益重要，英国的统治者首先想到的，是从谁更掌握海洋这一角度，来看待他们与法国之间旷日持久的竞争。英法之间无休无止的陆战——百年战争、三十年战争、拿破仑战争——更为人所熟知；但对关键航道的控制，同样是英法角逐中至关重要的一环。53"},{"id":"ch03-065","p":67,"t":"p","en":"In parallel to British imperial expansion in Asia was France's imperial domination of the western half of the Middle East, in particular the","zh":"与英国在亚洲的帝国扩张齐头并进的，是法国对中东西半部的帝国统治——尤其是在"},{"id":"ch03-066","p":68,"t":"p","en":"Levant and Egypt.54 The forging of the modern Middle East through imperial conquest and combat is a distinct story-but it intersects with ours, in Egypt.","zh":"黎凡特（Levant）与埃及。54 现代中东是经帝国征服与战争锻造出来的，这属于另一段故事——但它与我们这段故事在埃及交汇。"},{"id":"ch03-067","p":68,"t":"p","en":"In the 1830s, as part of its growing colonial presence in the Middle East, France sent a consul to Alexandria, an individual whose name would end up written into the history books precisely on the question of access to the seas. French consul Ferdinand Marie, Vicomte de Lesseps, turned into reality a dream that had long been considered by Europe's colonial adventurers. Although Egypt was a landlocked country, the formation that lay between the Mediterranean and Europe's ports on the one hand and the outer fringes of the Indian Ocean on the other was a fairly small parcel of land, the Sinai Peninsula. For years, people had considered the possibility of creating a sea passage, a canal, to link the two seas. De Lesseps made it happen.","zh":"19世纪30年代，作为其在中东日益扩张的殖民存在的一部分，法国向亚历山大港派出一名领事。此人的名字后来恰恰因为通往海洋的通道问题而被写进史册。法国领事费迪南·德·雷赛布子爵（Ferdinand Marie, Vicomte de Lesseps）把欧洲殖民冒险家盘算已久的梦想变成了现实。埃及虽是一个内陆国，但横在地中海与欧洲各港口为一方、印度洋外缘为另一方之间的那块地——西奈半岛——面积相当有限。多年来，人们一直在考虑开出一条海上通道、一条运河，把两片海连起来的可能。德·雷赛布把它做成了。"},{"id":"ch03-068","p":68,"t":"p","en":"De Lesseps began exploring the idea of a water passage across Egypt from his very first days in the country. Although an early proponent of the canal, Barthélemy Prosper Enfantin, set up a Suez Canal Study Group in 1846, the accession of an unfriendly Egyptian khedive to the throne in 1849 nixed his plans. It was not until 1854 that de Lesseps secured the permission of a more pliable khedive to form a company to begin the work with a French charter and French engineers. De Lesseps began to plan for one of the great engineering marvels of the era (despite British opposition to a project that Palmerston—soon to be prime minister—viewed as an unrealistic French dream that would only cause problems for its neighbors, including Britain). The Suez Canal Company started operations in 1858. Dug between 1859 and 1869, the canal forged a connection between Port Said in the south to the Mediterranean in the north, passing through a series of large lakes in the Sinai Peninsula, including the Great Bitter Lake (which would host a fateful encounter at the end of World War II).55","zh":"德·雷赛布一到埃及，便开始琢磨横穿该国开一条水道的主意。这条运河的早期鼓吹者巴泰勒米·普罗斯佩·昂方坦（Barthélemy Prosper Enfantin）虽在1846年组建了苏伊士运河研究小组，但1849年一位不友善的埃及赫迪夫继位，使他的计划落空。直到1854年，德·雷赛布才从一位较为顺从的赫迪夫那里取得许可，组建公司，凭法国的特许状、由法国工程师动工。德·雷赛布着手筹划那个时代最了不起的工程奇迹之一（尽管英国反对这项工程——即将出任首相的帕默斯顿视之为一个不切实际的法国梦，只会给包括英国在内的邻国添麻烦）。苏伊士运河公司于1858年开始运作。运河于1859年至1869年间开凿，把塞得港（Port Said）与地中海连成一线，穿越西奈半岛上的一连串大湖，其中包括大苦湖（Great Bitter Lake，二战结束时那里曾有一场命中注定的会面）。55"},{"id":"ch03-069","p":68,"t":"p","en":"Thus did the French achieve an engineering marvel and an economic revolution. The Suez Canal transformed global trading relations in the heyday of the imperial age by creating a short route for sea-based trade from Asia to Europe. By digging the canal, de Lesseps reduced the distance from London to Bombay, for instance, by a whopping 6,649 miles. It cut the time for sea voyages from Asia to Europe in half, and the costs by an equal amount. And it allowed ships to avoid sailing around the Cape of Good Hope—a singularly ill-named feature, noted for the scale and severity of its storms and the number of ships that perished off its coast.56 Avoiding the Cape and forging this new straighter path between Asia and Europe was a huge boon to trade.57","zh":"法国人就这样取得了一项工程奇迹，也带来了一场经济革命。在帝国时代的鼎盛期，苏伊士运河为亚洲到欧洲的海上贸易开出一条近路，改变了全球贸易格局。举例来说，开凿这条运河，使伦敦到孟买的航程缩短了足足6,649英里。它把亚洲到欧洲的海上航行时间砍掉一半，费用也减了一半。它还让船只不必再绕行好望角——这个地名起得实在不妙，那里以风暴之猛烈、覆没船只之多而闻名。56 避开好望角，在亚欧之间另辟这条更直的通道，对贸易是极大的利好。57"},{"id":"ch03-070","p":69,"t":"p","en":"It should also have been a massive boon to France's clout. But for this: in 1881, an Egyptian army officer initiated a coup against the khedive, the leader of Egypt and Sudan—and together France and Britain sent warships off the coast of Alexandria in support of the khedive. After a riot in the city that killed fifty Europeans, the French fleet was recalled home. Meanwhile, the British offered an ultimatum-and when it was rejected, began a bombardment of Alexandria, on Egypt's Mediterranean coast. They went on to occupy much of Egypt and to gain effective control of the Suez Canal.58","zh":"这本也该大大增强法国的影响力。但偏偏出了这样一件事：1881年，一名埃及军官发动政变，起兵反对赫迪夫——埃及与苏丹的统治者；法国与英国于是联合派出军舰驶抵亚历山大港外，支持赫迪夫。城里随后发生暴乱，50名欧洲人丧生，法国舰队被召回本国。与此同时，英国发出最后通牒——遭拒之后，英军开始炮击埃及地中海沿岸的亚历山大港。此后英军占领埃及大部，并实际控制了苏伊士运河。58"},{"id":"ch03-071","p":69,"t":"p","en":"The canal itself quickly became a source of tension between the two most active European colonialists, as well as their respective rivals. Neither France nor England trusted the other to allow the passage to be left open for trade. And thus, Egypt and control of this canal became a major prize in the long-running imperial contest between London and Paris.59 Eventually, after much friction, they decided to resolve the issue by a diplomatic agreement. They met, together with Germany, the Austro-Hungarian empire, the Ottoman Empire, Spain, France, Italy, the Netherlands, and Russia—the other European imperial powers of the day—and set out some rules of the game. Their envoys eventually signed the Convention of Constantinople, a treaty that stipulated that the canal should be a source of free passage in war or peace. It was an early example of using diplomacy to set out a series of commitments about how the powers would behave on the seas-a body of convention and law that we now refer to as the \"law of the sea,\" and was eventually encoded in an overarching treaty by that name. Like much of the rest of the law of the sea that was to come, the Convention of Constantinople was a document honored in times of comity and peace, and rapidly abandoned in times of war.60","zh":"运河本身很快成了紧张关系的源头——不只在两个最活跃的欧洲殖民强国之间，也在它们各自的对手之间。法国与英国谁也不信对方肯让这条航道保持开放、任贸易通行。于是，埃及连同这条运河的控制权，成了伦敦与巴黎旷日持久的帝国角逐一枚重要筹码。59 几经摩擦，双方最终决定用一纸外交协议了断此事。两国会同德国、奥匈帝国、奥斯曼帝国、西班牙、法国、意大利、荷兰与俄国——当时其余的欧洲帝国列强——坐到一起，定下若干游戏规则。各国使节最终签署了《君士坦丁堡公约》（Convention of Constantinople），规定无论战时平时，运河都须供人自由通行。这是早期的一例：以外交手段，把列强在海上行为方式的一连串承诺逐条写明；这套惯例与法律，就是我们今天所说的“海洋法”（law of the sea），后来更汇成一部同名的总括性条约。与后来海洋法的多数内容一样，《君士坦丁堡公约》也是这样一纸文件：邦交和睦、天下太平时被奉为圭臬，战端一开便被撂到一边。60"},{"id":"ch03-072","p":69,"t":"p","en":"Still, for the fifty years that followed the signing of the Convention in 1888, the canal was largely open, a source of the free flow of trade especially from India and the Asian colonies into Europe's markets.","zh":"尽管如此，1888年公约签署后的50年里，运河大体保持开放，成就了贸易的自由流通，尤其是从印度与亚洲各殖民地源源涌入欧洲市场的货流。"},{"id":"ch03-073","p":70,"t":"p","en":"World War I briefly interrupted the flow of trade through the Suez, although it reopened quickly at war's end. By this time, the Suez Canal was the most important waterway in the world, a crucial artery in the flow of global trade. Virtually all of the shipping that flowed into Europe's ports from Asia sailed through the Suez Canal. With the advent of modern industrialization and the energy revolution that accompanied it, as well as the discovery of oil in the Arabian Peninsula, the importance of the Suez grew further. From what had been a vague dream to the digging project to a vital artery of trade, the Suez Canal came to be an essential feature of the architecture of the late phase of the British Empire.61","zh":"第一次世界大战一度切断了经苏伊士运河的贸易流，不过战事一了便迅速复航。到这时，苏伊士运河已是世界上最重要的水道，是全球贸易流通中的一条命脉。从亚洲驶进欧洲各港的船只，几乎无一不取道苏伊士运河。随着现代工业化及其伴生的能源革命到来，加上阿拉伯半岛发现石油，苏伊士的分量又重了一层。从朦胧的梦想，到开凿的工程，再到贸易命脉，苏伊士运河终成了大英帝国晚期格局里不可或缺的一根梁柱。61"},{"id":"ch03-074","p":70,"t":"h","en":"Sailing to World War","zh":"驶向世界大战"},{"id":"ch03-075","p":70,"t":"p","en":"For more than two hundred years, the British maintained the dominant navy on the high seas, and the global standing it allowed.62 But by the early 1900s, it was facing a new aspirant to that status, Germany. At the turn of the twentieth century, Berlin sought to challenge London's dominance on the sea. The threat to Britain's position in the English Channel and beyond triggered London to build even larger, even more potent frigates. The arms buildup that resulted was a crucial part of the dynamic that culminated in the First World War.63","zh":"200多年里，英国在公海上养着一支独步天下的海军，也养着这支海军给它带来的世界地位。62 但到20世纪初，它遇上了一个觊觎这份地位的新对手：德国。世纪之交，柏林一心要挑战伦敦的海上主导。英国在英吉利海峡乃至更远海域的地位受到威胁，伦敦遂造起更大、更凶悍的护卫舰。由此而来的军备扩张，正是把局势一路推到第一次世界大战的那股动力里关键的一环。63"},{"id":"ch03-076","p":70,"t":"p","en":"Historians disagree on many fundamentals about the causes of that great slaughter, or of the relative importance of specific actions and decisions taken by the European powers in the decade leading up to it.64 But there's a surprising degree of agreement around the importance of an unsolicited memorandum penned by a relatively lowly Foreign Office official, working of all places in the registry system—essentially, the British government's filing system for the many, varied cables it received from all corners of the empire.","zh":"那场大屠戮因何而起，史家在许多根本问题上并无定论；此前十年里欧洲列强各自的举动与决断究竟孰轻孰重，也众说纷纭。64 但有一件事，各方却出人意料地一致：一份无人授意而写下的备忘录极关紧要，它出自外交部一名品级不高的官员之手，而他偏偏供职于文书登记部门——说白了，就是英国政府用来归档帝国四面八方雪片般电报的那套卷宗系统。"},{"id":"ch03-077","p":70,"t":"p","en":"The official in question, Sir Eyre Alexander Barby Wichart Crowe, was what passed for an expert on German affairs in those days, when the Foreign Office was still proudly manned by \"gifted amateurs.\" Crowe was born in Leipzig, his mother was of German ancestry, his wife was of German descent, and he spent much of his youth in Berlin, so he had some claim to at least a layman's familiarity with German culture and mindset. More to the point, he had served in the Foreign Office's unit dealing with the Africa Protectorates, and in that capacity had been privy to the negotiations between Germany, France, England, America, and the other European powers over the status of Morocco—negotiations that culminated in the Treaty of Algeciras in 1906. The treaty emerged from a German attempt to block France's efforts to establish a protectorate over Morocco and to divide the French-British entente that had occurred after 1904. German efforts failed, however, and the conference left Britain and France closer than before-and skeptical of a rising Germany. Those negotiations shaped Crowe's perception of German foreign relations in the age of Bismarck.65 In 1907, evidently somewhat bored with his role in the registry, and mindful of the recent negotiations in Spain, he took the initiative to pen a long memo about Britain's relations with Germany, and more specifically on the question of how Britain should respond to Germany's evident desire to expand its naval capacity and commercial reach. It's a wordy, turgid text that meanders through Anglo-German history and treaty negotiationsbut its core arguments about the dynamics of great power rivalry shape our understanding of international relations to this day.66","zh":"这名官员叫艾尔·亚历山大·巴比·威查特·克罗爵士（Sir Eyre Alexander Barby Wichart Crowe）。在那个外交部仍以“天才的业余爱好者”充任班底、并引以为傲的年代，他就算得上德国问题专家了。克罗生于莱比锡，母亲有德意志血统，妻子是德国后裔，青年时代又大半在柏林度过，因此至少可以说，他对德国文化与德国人的心思有着外行人里难得的熟稔。更要紧的是，他曾在外交部主管非洲保护地的部门任职，得以亲历德国、法国、英国、美国及其他欧洲列强围绕摩洛哥地位展开的谈判——谈判以1906年的《阿尔赫西拉斯条约》（Treaty of Algeciras）收场。这份条约缘于德国的一次尝试：一面阻止法国把摩洛哥变成保护国，一面离间1904年后结成的英法协约。然而德国没能得手，会议反倒让英法比从前更近，也对一个正在崛起的德国多了戒心。这几轮谈判，塑造了克罗对俾斯麦时代德国对外关系的判断。65 1907年，他显然对档案室里的差事有些倦了，又惦着刚在西班牙了结的那场谈判，便主动动笔，写下一份关于英德关系的长篇备忘录，更确切地说，是谈英国该如何回应德国扩充海军、伸展商业触角那份昭然若揭的欲望。文字冗长沉闷，在英德交往史与条约谈判之间兜兜转转；可它关于大国竞逐之动力的核心论断，直到今天仍在塑造我们对国际关系的理解。66"},{"id":"ch03-078","p":71,"t":"p","en":"The Crowe Memorandum, as it has come to be known, had three essential themes. The first, almost in passing, sets out Britain's understanding of its own role as a guardian of the world's naval and trade routes. Then he spells out the implications of a theory about sea power recently published by the American academic Alfred Thayer Mahan:","zh":"后人称之为《克罗备忘录》（Crowe Memorandum）的这份文件，有三个要旨。第一点近乎顺笔带过：英国如何看待自己——世界海上航道与贸易航路的守护者。接着，他铺陈出一位美国学者新近发表的海权理论所含的意味，那人便是阿尔弗雷德·塞耶·马汉："},{"id":"ch03-079","p":71,"t":"p","en":"The general character of England's foreign policy is determined by the immutable conditions of her geographical situation on the ocean flank of Europe as an island State with vast oversea colonies and dependencies, whose existence and survival as an independent community are inseparably bound up with the possession of preponderant sea power. The tremendous influence of such preponderance has been described in the classical pages of Captain Mahan. No one now disputes it. Sea power is more potent than land power, because it is as pervading as the element in which it moves.","zh":"英国外交政策的基本性质，取决于其地理环境不可移易的条件：它地处欧洲濒海一侧，是一个拥有广袤海外殖民地与属地的岛国；它能否作为一个独立共同体存续下去，同握有压倒性的海权密不可分。这种压倒性优势的巨大影响，马汉上校已在经典篇章中写透，如今无人再持异议。海权胜于陆权，因为它就像它所驰骋的那片汪洋，弥漫四方、无远弗届。"},{"id":"ch03-080","p":71,"t":"p","en":"Second, he talks about Germany's presumed desire for a wider leadership stance in international affairs. In so doing he describes the essential dilemma of modern state-to-state relations:","zh":"其次，他谈到德国被推定要在国际事务中求得更广的领导地位。正是在这里，他道出了现代国与国关系的根本困局："},{"id":"ch03-081","p":72,"t":"p","en":"Now, it is quite possible that Germany does not, nor ever will, consciously cherish any schemes of so subversive a nature. Her statesmen have openly repudiated them with indignation. Their denial may be perfectly honest, and their indignation justified. If so they will be most unlikely to come into any kind of armed conflict with England, because, as she knows of no causes of present dispute between the two countries, so she would have difficulty in imagining where, on the hypothesis stated, any such should arise in the future. England seeks no quarrels, and will never give Germany cause for legitimate offence.","zh":"话说回来，德国也许从未、也永远不会自觉地怀有这般颠覆性的图谋，这完全可能。它的政治家已公开愤然否认；否认或许句句出于真心，愤慨也未必没有道理。若果真如此，德国就极不可能同英国兵戎相见：既然英国知道两国眼下并无争端的由头，那么照上述假设，它也就难以想见将来这样的争端能从哪里冒出来。英国不寻衅，也绝不会给德国留下理直气壮的发难理由。"},{"id":"ch03-082","p":72,"t":"p","en":"All well and good, it would seem. But then Crowe describes the dilemma that carries his name:","zh":"听上去似乎面面俱到、无不妥帖。可紧接着，克罗写下了那个后来以他命名的困局："},{"id":"ch03-083","p":72,"t":"p","en":"But this is not a matter in which England can safely run any risks.","zh":"但在这一件事上，英国冒不起半点风险。"},{"id":"ch03-084","p":72,"t":"p","en":"In other words, while Germany's intentions might be peaceable, Britain could not risk having Germany challenge its dominance in case Berlin's intentions changed. So Britain had no choice but to make clear to Berlin that Germany would pay a high price should it choose to try.67","zh":"换句话说，德国的意图或许是平和的，英国却不能拿自己的主导地位去赌——万一柏林哪天改了主意呢。于是英国别无选择，只能向柏林讲明白：德国若当真要试，就得付出高昂代价。67"},{"id":"ch03-085","p":72,"t":"p","en":"And in the circles of power in London, Crowe's argument resonated, and Britain's rulers responded by investing still further in their naval power.","zh":"在伦敦的权力圈子里，克罗这番话引起了共鸣；英国当政者回应的办法，是往海军里再投一笔。"},{"id":"ch03-086","p":72,"t":"p","en":"It is a feature of great power politics that is with us to this day: one power sees the other having an advantage, and seeks to close the gap, if for no other than defensive reasons; but then the first power, seeing this, perceives a challenge to its dominance, and moves to protect its advantage. The result is an arms race and a spiral of perceptions of threat and insecurity that can lead nations to war.","zh":"大国政治的这一脾性至今未改：一国见另一国占了先机，即便纯出于防卫，也要把差距追平；而先行的一国见此情形，便视之为对自身主导地位的挑战，转而护住自己的优势。结果便是军备竞赛，是威胁感与不安全感层层螺旋上升，一路能把国家推向战争。"},{"id":"ch03-087","p":72,"t":"p","en":"There's a strong parallel between Crowe's thinking, later adopted by the Foreign Office, and the language of German statesman Theobold von Bethmann-Hollweg, who would serve as chancellor from 1909 to 1917. In 1913, Bethmann-Hollweg argued that to be a “really Great power,\" Germany had to have “a fleet, and a strong one . . . not merely for the purposes of defending her commerce, but for the general purpose of her greatness.\"68 And he set his sights on eroding Britain's naval dominance. Germany saw the gap between its own navy and Britain's as a threat to its ambitions and began to invest in building a more powerful fleet. Britain, of course, in turn saw that buildup as a direct threat to its own power and began to respond. In 1898, Germany had passed what was known as the First Fleet Act, which funded seven new battleships to be built over the course of the next six years. And then it put this shipbuilding program in the hands of Admiral Alfred von Tirpitz, who had campaigned for the law's passage.69 Von Tirpitz was more aggressive still and determined to create a fleet so powerful it would make Britain feel compelled to make diplomatic concessions. Von Tirpitz's plan called for Germany to double its fleet, including building two new squadrons of battleships and ten cruisers. This became known as the Risikoflotte, or the Risk Fleet. It was never designed to defeat Britain on the high seas, but simply to make it increasingly expensive for Britain to maintain its dominance.70","zh":"克罗的思路后来为外交部所采纳，它与德国政治家特奥巴尔德·冯·贝特曼-霍尔韦格（Theobald von Bethmann-Hollweg）的说法遥相呼应——此人在1909年至1917年间任帝国首相。1913年，贝特曼-霍尔韦格主张，德国要成为“真正的大国”，就得有“一支舰队，而且必须强大……不单是为保卫其商业，更是为成就其伟大”。68 他把目光瞄准了削弱英国的海上主导。德国把自家海军与英国之间的差距看作对其雄心的威胁，开始着力打造一支更强的舰队。英国自然反过来，把这场造舰视作对自身权势的直接威胁，着手回应。1898年，德国通过人称《第一舰队法》（First Fleet Act）的法案，拨款在之后6年里新造7艘战列舰，又把这项造舰计划交到阿尔弗雷德·冯·提尔皮茨海军上将（Alfred von Tirpitz）手里——正是他为法案奔走，促其通过。69 提尔皮茨更为激进，决意造出一支强大到足以逼英国在外交上让步的舰队。他的方案要德国把舰队翻一番，包括新建2支战列舰分舰队和10艘巡洋舰。这便是所谓“风险舰队”（Risikoflotte，或称 Risk Fleet）。它从来不是为在公海上击败英国而设计，只是要让英国维持主导地位的花销一天比一天高。70"},{"id":"ch03-088","p":73,"t":"p","en":"Britain's response was to outmatch the Germans, and in 1906 it launched what was known as His Majesty's Ship Dreadnought, a new type of super battleship. The Dreadnought, and the class of ships that followed after her, revolutionized battleships in two primary ways: first, she had an \"all-big-gun\" armament scheme, meaning that she held more heavy-caliber guns than prior ships; and second, she was the first big warship to be powered by steam turbine, making the Dreadnought faster than any other contemporary battleships. The Dreadnought was so revolutionary that all earlier battleships became known as “predreadnoughts,\" and the next dreadnoughts were built with incredible speed in Britain, which had the industrial resources to almost literally churn them out, each bigger and more powerful than the next. Germany could not match it.71","zh":"英国的回应是压过德国人：1906年，它下水了人称「无畏」号（HMS Dreadnought）的新型超级战列舰。「无畏」号及其后同型舰，从两个主要方面改写了战列舰：一是采用“全大口径主炮”（all-big-gun）的火力配置，所载重炮比以往舰只更多；二是它头一回以蒸汽轮机驱动大型战舰，因而比同时代任何战列舰都快。「无畏」号之新，新到此前所有战列舰一并被叫作“前无畏舰”；英国凭着自己的工业底子，几乎真能像从流水线上下来似的一艘接一艘造出后续无畏舰，一艘比一艘更大、更强。德国跟不上。71"},{"id":"ch03-089","p":73,"t":"p","en":"But Germany had another card to play, a disruptive new technology: the submarine. As the less rich of the two countries, Germany had limited resources to pour into this naval arms race, while the British could basically build and stretch out as long as it needed. Germany switched tactics to submarines.","zh":"可德国手里还有一张牌，一项足以搅局的新技术：潜艇。两国之中德国较穷，能砸进这场海军军备竞赛的资源有限，英国却大可要造多久就造多久、要铺多开就铺多开。德国于是改换打法，转向潜艇。"},{"id":"ch03-090","p":73,"t":"p","en":"This became important at the onset of war, when Britain's first move was to blockade the English Channel. Germany managed to poke holes in the blockade through the deployment of what it called U-boats. In August 1914, by sending a flotilla of nine U-boats into the North Sea, Germany launched the first submarine war patrol in history. Its goal was to sink British ships and reduce Britain's numerical capacity, and the Germans would come to turn the entire North Sea into a war zone. Germany's submarines went farther from its shores, sailing around Great Britain out into the Atlantic. And while this move caused London some discomfort, it ultimately backfired. Because German submarine activities in 1916 began to generate costs to a very different actor-that is, the United States. It was German attacks against US shipping in the Atlantic channel that would eventually bring the United States into the war. The American entry into the war in 1917 helped bring that continental slaughter to an end, in 1918.72","zh":"战争初起时，这一点要了紧：英国的头一步是封锁英吉利海峡。德国靠它称作 U 艇的潜艇，在封锁网上捅出了窟窿。1914年8月，9艘 U 艇编队驶入北海，人类历史上第一次潜艇战斗巡逻就此开场。目标是击沉英国船只、削掉英国在数量上的本钱；德国人后来更把整个北海都划作战区。潜艇越走越远，绕过大不列颠，驶进大西洋。此举虽让伦敦有些不舒服，到头来却反噬了自身。因为1916年，德国的潜艇活动开始让一个全然不同的角色付出代价——那就是美国。正是德国在大西洋航路上袭击美国航运，最终把美国拽进了战争。1917年美国参战，促成这场大陆上的屠戮在1918年收场。72"},{"id":"ch03-091","p":74,"t":"p","en":"Britain ended the war challenged and changed, though still in command of its vast empire. Its naval strength had been sapped, and the Bank of England drained.73 And America was rising.","zh":"英国打完这场仗，受了挑战，也变了样，尽管庞大帝国仍握在手里。海军元气被耗空，英格兰银行也被掏干。73 而美国正在升起。"},{"id":"ch03-092","p":74,"t":"h","en":"New Nation at Sea","zh":"海上的新兴国家"},{"id":"ch03-093","p":74,"t":"p","en":"The interwar years that followed were a time of confusion. Among the odd features of the age was the passivity of the United States, which had surpassed Britain in economic terms at some point in the 1890s, but had so far chosen to limit its involvement in global politics before being reluctantly pulled into WWI. And after the war it returned to its more reticent position.","zh":"其后的战间岁月是一段混乱时期。那个年代最反常的景象之一，是美国的消极：早在19世纪90年代的某个时点，它的经济就已超过英国，却一直刻意把自己拢在全球政治之外，直到半推半就被卷入第一次世界大战。战后，它又退回到那种更为收敛的姿态。"},{"id":"ch03-094","p":74,"t":"p","en":"This seesaw between expansive naval appetite and reticence to use it had in fact characterized the United States almost since the birth of the nation.74 It was not long after American independence that it found itself developing a navy. The decision was controversial: many believed that Washington, with limited resources to put into its new state military, should eschew a navy and simply rely on the long distances between its Atlantic shores and the home ports of any potential challenger, while others opposed a navy on the grounds that it would require higher taxes and allow another mechanism to suppress liberty.7⁵ In the first one hundred years after the founding of the republic, there was no consistent position on naval power, despite George Washington's firm belief that “without a decisive naval force we can do nothing definitive, and with it, everything honorable and glorious.\"76 Naval power was not essential for deepening trade with America's backyard,","zh":"一边是不断膨胀的海军胃口，一边却不肯真拿它去用——这副跷跷板，几乎从建国那天起就跟着美国。74 独立后没多久，美国便着手建海军。这个决定争议不小：许多人认为，新国家能拨给军队的资源有限，华盛顿不该养海军，只消倚仗自家大西洋海岸与任何潜在对手母港之间那漫漫长途就够了；另一些人反对，则因为建海军要加税，还会多出一套压制自由的机关。75 立国后的头100年，尽管乔治·华盛顿笃信“没有一支决定性的海军，我们便办不成任何决定性的事；有了它，一切体面而光荣的事都办得成”，美国对海权却始终没有一以贯之的立场。76 要深化同自家后院的贸易，海军并非必不可少，"},{"id":"ch03-095","p":75,"t":"p","en":"Mexico and the wider expanses of South America. And in Asia, the United States had no hope of challenging British dominance, nor did it seek to: it simply engaged in commercial activity in Asia, and contributed modestly to wider European security efforts in the region—to use today's terms, America was a “free rider\" on British naval power in Asia.77","zh":"即墨西哥，以及南美洲更为辽阔的腹地。而在亚洲，美国既无望挑战英国的主导，也无意去挑战：它只是在亚洲做做生意，对欧洲列强在该地区更广泛的安全行动略尽薄力——用今天的话说，美国在亚洲搭的是英国海权的“便车”（free rider）。77"},{"id":"ch03-096","p":75,"t":"p","en":"America's attitude started to change toward the end of the 1700s, when it began to experience in the Atlantic the harassment of American shipping by pirates operating out of the Barbary Coast of North Africa. Congress finally shifted, and formally established the new American navy by authorizing funds to build six frigates in 1794.78 Not for nothing does the battle hymn of the American marines start with an invocation of \"the shores of Tripoli,\" for it was to Tripoli, modernday Libya and back then the main hub of the Barbary pirates, that America deployed its first overseas naval and marine campaign (joining a Swedish campaign already underway).* The destruction of the Barbary pirates in their home port of Tripoli echoed the Portuguese belief that you had to take the fight to the enemy's home base, and set a precedent for later American power projection in the Middle East.79","zh":"到18世纪末，美国的态度开始转变：它在大西洋上吃到苦头，北非巴巴里海岸出发的海盗不断袭扰美国商船。国会终于改了主意，1794年拨款建造6艘护卫舰，正式立起美国的新海军。78 美国海军陆战队的战歌开篇便唱到“的黎波里的海岸”，并非没有来由——美国第一次海外海军与陆战队远征，去的正是的黎波里，即今日的利比亚、当年巴巴里海盗的大本营（其时瑞典已有一场战事在进行，美国是加入进去的）。* 把巴巴里海盗端掉在他们自己的母港的黎波里，正应了葡萄牙人那条信念：仗得打到敌人的老巢去；这也为日后美国向中东投送力量开了先例。79"},{"id":"ch03-097","p":75,"t":"p","en":"Then, shortly after the new nation had tested its naval and marine contingents, the War of 1812 against its old master solidified the importance of a navy for American defense and enabled the nascent navy to solidify its importance.80","zh":"这个新生国家刚把海军与陆战队拉出来试过身手，不久便迎来1812年对旧宗主国的战争；这场战争坐实了海军之于美国防务的分量，也让初生的海军站稳了脚跟。80"},{"id":"ch03-098","p":75,"t":"p","en":"Asia, too, was important even in these early days of the American nation. Both merchant ships and the new American navy found their way to Asia. China was the main goal, as knowledge about its collection of some of the world's most sought after commodities—tea, porcelain, and silk, for example—enticed American entrepreneurs to cross the Pacific. The voyage, however, required a network of ports that extended across the ocean, and the US sought to expand its presence throughout the region.81","zh":"亚洲之重要，甚至在美国立国之初便已如此。商船与新建的美国海军，都找到了通往亚洲的路。首要目标是中国：世上最抢手的几样货色——茶叶、瓷器、丝绸——竟都聚在那里，这样的见闻诱得美国商人横渡太平洋。可这一程需要一张横越大洋的港口网，美国于是谋求在整个地区铺开自己的存在。81"},{"id":"ch03-099","p":75,"t":"p","en":"As China and India were dominated by the British, America turned its ambitions toward Japan. US Commander Matthew Calbraith Perry was dispatched to establish a regional foothold that would strengthen the United States' ability to pursue its interests within the Pacific. To this end, America tried to do to Japan what Britain had done to China: to use superior naval firepower to force that ancient Asian nation to open itself and its markets to foreign trade. Dutch, English, and Jesuit traders had been trying to penetrate Japan with limited success since the 1500s. But none had at their disposal the degree of naval firepower that Perry had when he sailed his famous flagships into Tokyo Bay in Yokosuka in 1853. Perry's Black Ships, as they were called, anchored four vessels in the bay for six days, threatening to use force to ensure the delivery of a letter from President Millard Fillmore. The Japanese refused to accept the letter for several days, but on July 14 it was formally received—to the sound of a thirteen-gun salute from the Susquehanna. In early 1854, Perry returned with ten vessels and 1,600 men to receive the response. On March 8, while three military bands played \"The Star-Spangled Banner,\" Perry landed in Yokohama and began three weeks of negotiations that led to the opening of ports to American ships—and the opening of Japan.82","zh":"中国与印度既被英国攥在手里，美国便把野心转向日本。美国海军准将马修·卡尔布雷思·佩里（Matthew Calbraith Perry）奉派前往，要在这一带扎下立足点，好让美国在太平洋上追逐利益时更有底气。为此，美国想把英国对中国用过的那一套搬到日本身上：凭更胜一筹的舰炮，逼这个古老的亚洲国家开放国门与市场，容纳对外贸易。自16世纪起，荷兰、英国和耶稣会的商人就一直想打进日本，收效寥寥。可谁手里都没有1853年佩里率著名旗舰驶进横须贺东京湾时那份火力。人称“黑船”的佩里舰队，4艘舰在湾里泊了6天，扬言动武，非要日方收下米勒德·菲尔莫尔总统（Millard Fillmore）的信不可。日本人连着几天拒不接信，直到7月14日才正式受领——「萨斯奎汉纳」号（Susquehanna）鸣礼炮13响。1854年初，佩里带10艘舰、1,600人回来讨回音。3月8日，三支军乐队奏起《星条旗》，佩里在横滨登岸，开始为期3周的谈判，谈成为美国船只开港——也打开了日本的国门。82"},{"id":"ch03-100","p":75,"t":"n","en":"President Thomas Jefferson's first choice to lead the Barbary Wars was a former British pirate turned American naval officer, John Paul Jones. Later in this book we'll encounter the destroyer that carries his name.","zh":"托马斯·杰斐逊总统（Thomas Jefferson）主持巴巴里战争，点将的第一人选是约翰·保罗·琼斯（John Paul Jones）——昔日的英国海盗，后来成了美国海军军官。本书后文还会遇到以他命名的那艘驱逐舰。"},{"id":"ch03-101","p":76,"t":"p","en":"These growing interests required protection. Threats to the safety of American ships were not just to be found along the Barbary Coast. In 1831, inhabitants on the coast of Sumatra plundered an American merchant ship and killed several of her crew. The next year, a US frigate was sent to the island-and burned the town.83 In 1835, the US East India Squadron was created, charged with protecting American commercial interests from China to Arabia.84","zh":"利益日增，就得有人护着。威胁美国船只安全的，不止巴巴里海岸一带。1831年，苏门答腊沿岸居民劫掠一艘美国商船，杀死数名船员。次年，一艘美国护卫舰开到岛上，一把火烧了那座城镇。83 1835年，美国东印度分舰队（East India Squadron）成立，专司护佑从中国到阿拉伯一线的美国商业利益。84"},{"id":"ch03-102","p":76,"t":"p","en":"Once again, the history of the interactions between Asia and the West might have unfolded rather differently had not the United States shortly thereafter largely retreated from Asia. It did so as it fell into the internal, consuming drama of the American Civil War. The navy's ships were repurposed to blockade the Confederacy. And America emerged from the Civil War exhausted and looking inward, focused on the massive reconstruction process that began at war's end.85","zh":"亚洲与西方交往的历史，本可能走上很不一样的路——倘若美国没有在此后不久大体撤出亚洲。它之所以抽身，是因为一头栽进了内战这场耗尽国力的内部大戏。海军舰船改作封锁南方邦联之用。内战结束时，美国精疲力竭，目光向内，一心扑在战后启动的浩大重建上。85"},{"id":"ch03-103","p":76,"t":"p","en":"Not until the late 1880s would America once again look outward, this time provoked by Spanish exploration in its near waters, specifically around the island of Cuba. (Not the last time that that island would play an outsize role in American diplomacy.) The ensuing Spanish-American War would be fought in neither country, but between the two navies in and around the coast of Cuba and off the coast of the Philippines, Spain's main colonial possession in Asia. The US Navy won two decisive victories: in Manila Bay, in the Philippines, and at the Battle of Santiago de Cuba. One result of the Spanish-American War was the establishment of America's first overseas colony, the Philippines. A second result was the shaping of the mindset of a man who had recently served as the assistant secretary of the navy and had made many of the major naval decisions leading up to the war, one Theodore Roosevelt.86","zh":"直到19世纪80年代末，美国才重新向外张望，这回是被西班牙在近海、尤其在古巴岛一带的探察所激。（那座岛在美国外交里扮演的超大角色，此后还会一再重演。）随之而来的美西战争，战场不在两国本土，而是两支海军在古巴沿海及四周、以及菲律宾——西班牙在亚洲的主要殖民地——外海的交锋。美国海军赢得两场决定性胜利：菲律宾的马尼拉湾海战，与圣地亚哥-德古巴海战。美西战争的一个结果，是美国有了第一块海外殖民地：菲律宾。另一个结果，是塑造了一个人的心态——此人名叫西奥多·罗斯福（Theodore Roosevelt），战前不久出任海军部助理部长，开战前后许多重大海军决策都出自他手。86"},{"id":"ch03-104","p":77,"t":"p","en":"Although the US Navy had won a decisive victory in Manila Bay, the reality was that it won through a combination of naval tactics, planning, and luck. Its warships were less modern, less large, and less effective than those of America's peers at the time. While it fought its civil war, the US was on the sidelines as, worldwide, ironclad ships displaced the earlier generation of wooden sailing craft. US policy planners began to recognize that their navy was out of date, and with the growth in overseas markets and the importance of sea-based communications, they started a modernization program in 1883 that would help lead the country into a new era of naval engagement. In 1870, the US had the world's twelfth-largest navy—by the turn of the twentieth century, it had the fifth.87 The Spanish-American War gave the US an idea of its navy's shortcomings, but also a taste of increased maritime responsibility.88","zh":"美国海军虽在马尼拉湾大胜，实情却是靠战术、谋划加运气凑出来的。它的舰艇比起同时代别国，既不够新，也不够大，战力更逊一筹。美国打内战那些年，世界范围内铁甲舰正取代上一代木质帆船，它却置身事外。美国的政策规划者开始意识到自家海军已经落伍；海外市场在扩大，海上交通线又事关重大，他们遂于1883年启动现代化计划，把国家带进一个海军重新投身世界的新时代。1870年，美国海军规模排世界第12；到20世纪之交，已升至第5。87 美西战争让美国看清了自家海军的短处，也让它初次尝到海上责任加重的滋味。88"},{"id":"ch03-105","p":77,"t":"p","en":"The American presence in Asia grew beyond Japan. The US established consulates in Fiji in 1844, Samoa in 1856, and the Marshall Islands in 1881 to protect its interests in way stations for the Chinese trade, and increased its presence in Hawaii in order to establish a Pacific base of operations to support that trade.89 In each case, it was pursuing a deliberate strategy—influenced in part by the father of modern maritime strategy, Captain Alfred Thayer Mahan, and embraced by a voung Theodore Roosevelt—of pushing America's defensive line ever farther west across the Pacific. American naval leaders and politicians were acutely aware of the growing Japanese naval threat and sought to build a sea perimeter from which to defend mainland United States.90 The annexation of Hawaii in 1898—implemented while Teddy Roosevelt was serving as assistant secretary of the navy—constituted the pinnacle of this strategy, establishing a permanent American presence deep in the Pacific, and from which American naval power could readily reach out as far as Guam and Formosa (now Taiwan). It set the pattern for American defense strategy in Asia that remains with us to this day.","zh":"美国在亚洲的存在不再限于日本。1844年在斐济、1856年在萨摩亚、1881年在马绍尔群岛，美国陆续设下领事馆，护住对华贸易沿途补给站的利益；又加码在夏威夷的存在，为的是建起一处太平洋上的行动基地，支撑这项贸易。89 每一步背后都是一套深思熟虑的战略：把美国的防线朝太平洋更西处一步步推。这套战略部分得自现代海上战略之父、阿尔弗雷德·塞耶·马汉上校的影响，也为年纪轻轻的西奥多·罗斯福所服膺。美国海军将领与政客敏锐地察觉日本海军威胁日增，谋求筑起一道海上环形防线，好据此守卫美国本土。90 1898年吞并夏威夷——落实此事时，特迪·罗斯福正任海军部助理部长——是这套战略的顶点：美国自此在太平洋深处有了常驻存在，其海军力量从这里可以轻易够到关岛与福尔摩沙（今台湾）。它定下了美国在亚洲防务战略的格局，至今未改。"},{"id":"ch03-106","p":78,"t":"p","en":"In this period, the United States also began to play an important role in shaping international standards and legal agreements governing shipping. For example, in 1889, the United States hosted in Washington, DC, an International Marine Conference designed to resolve important differences in how various countries mapped and charted the seas. Such variant methods made for complexity and difficulty in navigation. The conference resulted in a proposal for a permanent international commission that would help countries resolve differences in their charting-a commission that still exists in the form of the International Hydrographic Organization, headquartered in Monaco.91","zh":"这一时期，美国也开始在制定航运的国际标准与法律协定方面发挥重要作用。例如1889年，美国在华盛顿主办了一场国际海洋会议（International Marine Conference），意在解决各国测绘海图、绘制海图的方法不一所造成的重要分歧。方法各异，航行便繁难。会议的结果，是提议设立一个常设国际委员会，帮助各国消弭测绘上的分歧——这个委员会延续至今，即总部设在摩纳哥的国际水文组织（International Hydrographic Organization）。91"},{"id":"ch03-107","p":78,"t":"p","en":"When Teddy Roosevelt became president after William McKinley's assassination in September 1901, he entered office well aware of the United States' growing maritime potential, as well as the shortcomings of the US Navy itself. As he ascended into the presidency, he had a hunger for a more expansive international role for the United States, and the tools to administer it.92 What he would do next would set the foundations for modern American power projection, and the acquisition of its first colonies—the start of America's entry into the perilous business of imperial competition.","zh":"1901年9月威廉·麦金利遇刺身亡，特迪·罗斯福接任总统。上任之时，他很清楚美国日渐增长的海上潜力，也清楚美国海军自身的短处。登上总统之位，他渴望让美国在国际上扮演更广阔的角色，也手握推行这一角色的工具。92 他接下来的作为，为现代美国的力量投送奠定了基础，也为美国取得第一批殖民地——美国就此踏入帝国竞逐这桩凶险的行当。"},{"id":"ch03-108","p":78,"t":"p","en":"Roosevelt, seeking to demonstrate growing US naval power, convened often with Alfred Thayer Mahan.* In 1890, Mahan, then president of the newly established US Naval War College, published The Influence of Sea Power Upon History. The classic book argues for the importance of maritime dominance, highlighting the need for both a strong navy and a strong commercial fleet. Mahan's argument starts with the notion that wealth begins with trade, and international trade depends on sea commerce—and thus, in turn, the ability of a country to accumulate wealth depends on its abili
