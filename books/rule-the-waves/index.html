一场军备竞赛；而这场竞赛，又正把两国拖向战争。"},{"id":"ch11-090","p":236,"t":"p","en":"As we saw in the Combat Information Center of the John Paul Jones, it's a form of war that could start in the information space, and play out with almost no human-to-human contact. Indeed, with no human sensory information at all—until the first missile hits a destroyer. It might be kept limited, but it could also rapidly escalate to American attacks on the Chinese mainland—and in the extreme, Chinese missile attacks on America's mainland bases.","zh":"正如我们在“约翰·保罗·琼斯”号的作战信息中心所见，这种战争可能始于信息空间，在几乎没有任何人对人接触的情况下打完全程。事实上，全程都没有人的感官信息——直到第一枚导弹击中一艘驱逐舰。它也许会被控制在小范围内，但也可能迅速升级为美国对中国大陆的攻击——而走到极端，则是中国导弹攻击美国本土的基地。"},{"id":"ch11-091","p":236,"t":"p","en":"This dynamic shows no signs of lessening. That's both because of the seemingly inexorable escalatory logic of military affairs, and because as China has continued to grow, it has faced a deepening problem—what former Premier Hu Jintao once referred to as China's \"Malacca Dilemma.\" Because the US Navy dominates in the Singapore and Malacca Straits, all of the trade and energy goods that flow across those waters into China's economy depend on US protection. As Jintao noted, the more China's economy grew, the more it depended on the US Navy. When he first articulated that concept, some 30 percent of Chinese trade flowed through those Straits; now closer to 70 percent does.","zh":"这一态势没有缓和的迹象。这一半是因为军事事务那种看似不可阻挡的升级逻辑，一半是因为随着中国持续增长，它面对的问题也越来越深——中国前领导人胡锦涛所说的“马六甲困局”。由于美国海军主宰着新加坡与马六甲海峡，经这些水域流入中国经济的全部贸易与能源货物，都得仰赖美国的保护。正如胡锦涛所指出的，中国经济越增长，对美国的依赖就越深。他最初提出这一概念时，中国约30%的贸易经这些海峡通行；如今已接近70%。"},{"id":"ch11-092","p":236,"t":"p","en":"When the Chinese first made their play for sovereignty and naval power in the Near Seas, American analysts fretted about their resulting ability to choke off that vital sea-lane of communication. But that was always the wrong concern: China has never had any intention of closing off that flow of trade, on which its economy hugely relies. It wanted to deny America the capacity to do so; and for all intents and purposes, it has achieved that objective. The South China Sea has been the gate-","zh":"当中国最初在近海争夺主权与海军优势时，美国分析人士担心的是：中国由此获得切断这条重要海上交通线的能力。但这种担心从一开始就错了方向：中国从来没有关闭这条贸易流的打算，它的经济极度依赖这条贸易流。中国要做的，是让美国失去关掉它的能力；而就实际效果而言，这个目标它已经达到了。四百年来，南海一直是亚洲与西方贸易往来的门"},{"id":"ch11-093","p":237,"t":"p","en":"way to the flow of trade between Asia and the West for four centuries.   \nIt looks set to remain that way.","zh":"户。\n这一格局看来还将延续下去。"},{"id":"ch11-094","p":237,"t":"p","en":"But power has its own appetite; and as China's strength in the Near Seas has grown, so has its ambition to project powers beyond them. What's more: as China has developed it has, like every industrialized nation before it, increased its appetite for energy. Throughout the modern period, there's been a 1:1 relationship between economic growth and energy consumption-and that's been true for China as well. But China—unlike Russia or the United States—is not well-blessed with its own energy endowment.","zh":"但权力自有其胃口；随着中国在近海的实力增长，它向近海之外投送力量的野心也随之膨胀。更何况，中国在发展过程中，也像此前每一个工业化国家一样，增加了对能源的需求。在整个现代时期，经济增长与能源消耗始终保持着1∶1的关系——中国也不例外。但中国不像俄罗斯或美国，它并没有一份丰厚的能源家底。"},{"id":"ch11-095","p":237,"t":"p","en":"So China has had to find an ever-larger set of energy sources abroad. Some of that flows into China's factories by pipeline, across the Asian steppes. But much, much more of it flows to China by sea. And as we will see next, the quest for energy sources is yet another way the power of the seas themselves intensifies the dynamics of geopolitical rivalry.","zh":"于是中国不得不到海外寻找越来越庞大的能源来源。其中一部分经管道穿越亚洲草原，送进中国的工厂。但多得多的那一部分，是走海路运到中国的。而我们下面将会看到，对能源的追逐，正是海洋本身的力量加剧地缘政治竞争的又一条途径。"}],"notes":[]},{"id":"pt4","label":"Part IV Opening","labelZh":"部前小引","title":"","titleZh":"开篇　从“马德里”号的驾驶台望去","part":"Part IV: The Power of the Seas","showPart":true,"partZh":"第四部","partTitleZh":"海洋的力量","paras":[{"id":"pt4-001","p":241,"t":"p","en":"Seen from the bridge on the Madrid, maneuvers of the region's navies and of the American fleet are little more than a distraction. Short of the outbreak of full-blown war or the imposition of a blockade, the presence of the competing navies barely registers on the mental radar of Captain Jensen or his crew. Indeed, for much of the voyage through the South and East China Seas, the Madrid sails on the nautical equivalent of autopilot while its leadership focuses on more pressing concerns like fuel ratios, port timings, and brewing storms.","zh":"从马德里马士基号的驾驶台望出去，本地区各国海军和美国舰队的演习，不过是个干扰项。除非爆发全面战争，或者有人实施封锁，竞争各方舰艇的存在几乎不会在延森船长和船员们脑子里的那部雷达上留下任何回波。事实上，在穿越南海与东海的航程中，大半时间里马德里马士基号都处在航海版的“自动驾驶”状态下，船上的管理层则盯着更要紧的事：燃油配比、靠港时间，还有正在酝酿的风暴。"},{"id":"pt4-002","p":241,"t":"p","en":"But there are dangers in these shipping lanes, to be sure, and plenty of them. The most visible come from the fishing fleets that ply these waters. If the commercial traffic outside Singapore resembles a busy New York avenue, the passage through the Chinese and Taiwanese fishing fleets plying the strait that divides them more closely resembles the snarl of motorbikes, tuk-tuks, and diesel-spewing cars that fuel the pollution and gridlock of the nearby cities of Jakarta and Manila. Sailing through that strait, the sea is crawling with trawlers, literally thousands of them on any given evening. And many of them don't carry the Automated Identification System transponders—ships' equivalent to airplanes' black boxes—that they're supposed to. For the Madrid's crew, hitting one of the trawlers is a nightmare to be avoided at all costs. The small boats would barely dent the hull of the Madrid, but the huge ship would crush the trawler underneath her, causing loss of life—and a massive insurance fight with the Chinese authorities.","zh":"不过，这些航道上确实有危险，而且不少。最显眼的是往来穿梭的渔船。如果说新加坡港外的商船流像纽约一条车水马龙的大道，那么穿行台湾海峡、置身海峡两岸的渔船队之间时，倒更像一头扎进了摩托车、嘟嘟车和冒着黑烟的柴油车搅成的一团乱麻——雅加达和马尼拉的污染与拥堵，正是这些车造成的。航行在那条海峡里，海面上满是拖网渔船，随便哪个傍晚都有成千上万艘。其中许多并没有按规定携带船舶自动识别系统（AIS）应答器——那是船上的“黑匣子”。对马德里马士基号的船员来说，撞上一条拖网渔船是无论如何都要避免的噩梦。小渔船顶多在船壳上磕出一个凹坑，可这艘巨轮会把它整个压到船底，出人命，还要跟中国当局打一场旷日持久的保险官司。"},{"id":"pt4-003","p":241,"t":"p","en":"The fishing fleets are far from the only obstacle to shipping. On a chart of these seas, the sea-lanes are crisscrossed by dotted lines that indicate the placement of a growing profusion and entanglement of data cables. They're often bundled, too, not allowing just one cable, but huge chunks of them to straddle key passageways. The bundles coming into Hong Kong, for example, are huge, providing a clear choke point on the map of global data. In the primary sea-lanes, they pose no concern to shipping. But these are shallow waters, and as ships turn from the main channels toward the littorals and toward harbors, they keep a careful eye on the locations of cables as they rise from the seafloor to meet the coastlines.","zh":"渔船远不是航运唯一的障碍。在这一带海域的海图上，航道被纵横交错的虚线切得七零八落，那些线标出的是数量激增、彼此缠绕的数据电缆。它们往往还是成束铺设的，横跨关键水道的不止一根，而是一大捆一大捆。比如通往中国香港的那些缆束就极为庞大，在全球数据地图上构成一个再清楚不过的咽喉要道。在主航道上，它们并不妨碍航行。但这里水浅，船只一旦从主航道转向近海、驶向港口，就得仔细盯住电缆的位置——它们正从海底升上来，接上岸线。"},{"id":"pt4-004","p":242,"t":"p","en":"Those same charts show a growing profusion of oil rigs and oil fields. These belong to China, Vietnam, Indonesia, the Philippines, Brunei, and even India (through joint ventures). All throughout the area of China's nine-dash line, large oil and gas fields are marked out all along the coastal waters, but also out into the farthest reaches of the seas. There is no longer any route through the South China Sea that does not traverse a claimed oil or gas field. In 2009, when the Chinese began their far-reaching play for control of these waters, rigs were few and far between. But even then, initial estimates of the sheer quantity of energy underneath the seabeds were astounding.","zh":"同一批海图上还标出越来越多的钻井平台与油气田。它们分属中国、越南、印度尼西亚、菲律宾、文莱，甚至还有印度（通过合资项目）。在中国的九段线范围内，大型油气田沿着近岸海域一路排开，也一直延伸到最远的海域。如今穿越南海，已经没有一条航线不经过某处已被主张的油气田。2009 年中国人开始大举布局、争夺这片海域的控制权时，钻井平台还寥寥无几。但即便在那时，对海床之下能源储量的初步估算就已令人瞠目。"},{"id":"pt4-005","p":242,"t":"p","en":"So far in this book, we've looked at transactions and competition, commercial and naval, on the surface of the world's great waters, only dipping below the surface briefly to encounter submarine fleets. But there's much more to the seas than what lies atop their waters. Both the seas and the seabeds are also a vast natural resource-a resource to be tapped, fished, farmed, drilled, and mined. And competed over. In much of modern life, we've become used to thinking of the world's oceans as part of the global commons, shared by all nations. Granted, there's always been competition over fishing rights, and the hunt for whales—the earliest source of oil for lighting—pitted the world's major empires against each other. But this was limited, and fluid; neither fish nor whales respect political boundaries, or legal ones. But in the contemporary period, with new abilities to probe the seafloor and suck resources out of it, the dynamics of extracting the oceans' bounty have changed. Oil and gas are increasingly found in the world's deep offshore waters.","zh":"本书写到这里，我们看的都是发生在世界各大洋水面上的交易与竞争——商业的与海军的，只在偶尔潜入水下时，与潜艇舰队打了个照面。但海洋远不止水面之上的这些。海洋与海床本身也是一份巨大的自然资源——可以汲取、捕捞、养殖、钻探、开采，也因此值得争夺。在现代生活的大部分时间里，我们习惯了把世界大洋看作全球公域的一部分，由所有国家共享。诚然，渔业权的争夺从未停歇，而捕鲸——人类最早的照明用油来源——曾让当时的世界列强彼此对峙。但这种争夺是有限的，也是流动的：鱼和鲸都不认政治边界，也不认法律边界。到了当代，有了探测海床、从海床里抽取资源的新本领，开发海洋财富的逻辑已经改变。油气越来越多地采自世界的深水外海。"},{"id":"pt4-006","p":242,"t":"p","en":"This seabed energy, in turn, connects to the vexed question of climate change. Energy and climate aren't always viewed as two sides of the same coin, but they should be: the one is about the extraction and burning of concentrated carbon; the other about its reabsorption, and the effects of that reabsorption of carbon on our climate, our oceans, and our weather.","zh":"这种海床能源，反过来又牵出气候变化这个棘手问题。人们并不总把能源与气候看作同一枚硬币的两面，但它们本该如此：一面是从地下采出浓缩的碳并把它烧掉，另一面是碳的重新吸收，以及这种吸收对我们的气候、海洋和天气所造成的影响。"}],"notes":[]},{"id":"ch12","label":"Chapter 12","labelZh":"","title":"The Salt of the Oceans","titleZh":"第十二章　海洋之盐","part":"Part IV: The Power of the Seas","showPart":false,"partZh":"第四部","partTitleZh":"海洋的力量","paras":[{"id":"ch12-001","p":243,"t":"p","en":"For the past hundred and fifty years, the main story of energy was the story of oil, and the story of oil was mostly a story of land—of finding oil beneath the rocks of Pennsylvania and Texas, and the sands of Iraq and Saudi Arabia, and of the transportation of that oil by pipelines over land. As Richard Rhodes wrote in his Energy: A Human History, \"The history of liquid energy is a history of pipelines.\"¹ But over the last sixty years, that has changed. The business of oil and gas has become a business of the oceans.","zh":"过去一百五十年间，能源的主线是石油，而石油的故事大体上是陆地的故事——在宾夕法尼亚和得克萨斯的岩层之下、在伊拉克和沙特阿拉伯的沙层之下发现石油，再用管道把石油输送过陆地。理查德·罗兹（Richard Rhodes）在《能源：人类史》中写道：“液态能源的历史，就是一部管道的历史。”* 但过去六十年里，情况变了。石油与天然气的生意，成了海洋的生意。"},{"id":"ch12-002","p":243,"t":"p","en":"Few places have been as profoundly affected as Houston, Texas. There-and specifically in the Houston Ship Channel-we can see the major evolution in energy dynamics: the growth of the city and of the American engineering industry through the first oil boom, the change from the early years when Texas was a hub for the export of oil, to the postwar years when it became a key hub for imports, the development of technologies for offshore drilling, and the resulting shift in flows of oil by sea, as America regained its status as a net exporter of oil—and China claimed the dubious mantle of the world's largest importer of oil—much of it, again, by sea.","zh":"很少有地方像得克萨斯州休斯敦这样受到如此深刻的影响。在那里——具体说，是在休斯敦航道（Houston Ship Channel）——我们可以看到能源格局的重大演变：第一次石油繁荣中城市与美国工程业的成长；从早年得克萨斯作为石油出口枢纽，到战后成为关键进口枢纽的转变；海上钻井技术的开发；以及随之而来的海上石油流向的逆转——美国重新夺回石油净出口国的地位，中国则接过“世界最大石油进口国”这顶并不光彩的帽子，而中国进口的石油，很大一部分同样走海路。"},{"id":"ch12-003","p":243,"t":"h","en":"The Houston Ship Channel, Texas","zh":"得克萨斯州休斯敦航道"},{"id":"ch12-004","p":243,"t":"p","en":"The use of petroleum is most commonly dated to the discovery of large fields in Titusville, Pennsylvania, in 1859. But by the end of the century, it was the sands of Texas that generated the volumes of oil that made the United States the largest oil producer in the world.","zh":"石油的利用，通常追溯到1859年宾夕法尼亚州泰特斯维尔（Titusville）大油田的发现。但到那个世纪末，正是得克萨斯的沙层产出了巨量石油，把美国推上世界最大产油国的位置。"},{"id":"ch12-005","p":243,"t":"p","en":"Unlike Copenhagen or New York or Singapore or Hong Kong, the critical feature of the Port of Houston is not its natural structure; it's a man-made channel. For much of the nineteenth century and into the early twentieth, the major port on the southern coast of the United States was not Houston, but Galveston. An island city outside of Houston on the Gulf, Galveston was a natural choice for exports, having been the world's top cotton shipping port after the Civil War. Its history might have been much different, had it been able to take full advantage of the Texan oil boom. But nature had other plans. In 1900, a massive hurricane (known in the region as simply the “Great Storm\") swept through the city, damaging every dwelling in the city. The highest point in the city was only 8.7 feet above sea level—the storm surge alone was nearly double that. It left nearly one-third of the population homeless and, with at least six thousand fatalities, is still the deadliest natural disaster in US history.","zh":"与哥本哈根、纽约、新加坡或香港不同，休斯敦港的关键特征不在天然地形，而在于它是一条人工开凿的航道。19世纪大部分时间直到20世纪初，美国南海岸的主要港口并不是休斯敦，而是加尔维斯顿。这座位于休斯敦城外墨西哥湾中的岛屿城市，是天然的出口之选——内战后它曾是世界上最繁忙的棉花输出港。倘若它能充分利用得克萨斯的石油繁荣，历史或许会大不相同。但大自然另有安排。1900年，一场巨大的飓风（当地只称之为“大风暴”）横扫全城，城里每一处住所都受损。全城最高点仅高出海平面8.7英尺——仅风暴潮就几乎是这个高度的两倍。近三分之一的人口无家可归；至少6,000人丧生，至今仍是美国历史上死亡人数最多的自然灾害。"},{"id":"ch12-006","p":244,"t":"p","en":"Ironically, Houston would benefit from the disaster. A small channel had been used to move goods from Houston to the sea since the early 1800s. But in the wake of the hurricane, fearing another direct hit, planners made the decision to create the Houston Ship Channel, a fifty-mile waterway that would be completed in 1914. President Woodrow Wilson would mark the occasion by pushing a button in the White House that sent a telegraph to Houston to trigger a cannon that officially opened the channel and its deepwater port.","zh":"具有讽刺意味的是，休斯敦反而从这场灾难中获益。早在19世纪初，就有一条小水道用来把货物从休斯敦运到海上。但飓风过后，规划者担心再遭正面袭击，决定开凿休斯敦航道——一条50英里长的水道，1914年完工。伍德罗·威尔逊总统在白宫按下按钮，电报发往休斯敦，触发一门大炮鸣响，正式为这条航道及其深水港揭幕。"},{"id":"ch12-007","p":244,"t":"p","en":"Now large ships could make their way up from the Gulf of Mexico to Houston, where they were safer from storms. They moved safely, but not smoothly: large ships transitting the Houston Ship Channel have to perform what's known as the “Texas chicken\" maneuver. As two large vessels approach from opposite directions, they both turn starboard, so that water displaced from their bows pushes the ships away from each other (and from the center of the channel). Once they pass each other, the suction of the displaced water flowing in behind the ships then pulls them back toward the center of the waterway.","zh":"如今，大船可以从墨西哥湾溯流而上直抵休斯敦，在那里躲避风暴更为安全。航行是安全的，却并不平顺：通过休斯敦航道的大船，必须做一套被称为“得州小鸡”（Texas chicken）的操船动作。两艘大船相向驶近时，双双向右转舵，船首排开的水便把两船推开（也推离航道中线）。两船交错而过之后，被排开的水从船后涌回，产生的吸力又把它们拉回水道中央。"},{"id":"ch12-008","p":244,"t":"p","en":"Along this channel is the infrastructure necessary for the import of large volumes of oil. In the early years of Houston's growth, the port was an exporter of oil. It's often forgotten that in the years prior to World War II, the United States was the world's largest energy producer. Although it consumed most of that oil domestically, and moved much of it by pipeline, energy exports also formed part of Houston's early development. This was critical during World War II: according to Daniel Yergin, over the course of World War II the US and the European allies consumed seven billion barrels of oil and the US supplied six billion of those seven billion barrels, most of it shipped from Texas.²","zh":"沿这条航道，铺展着大量进口石油所必需的基础设施。在休斯敦成长的早年，这座港口是石油的输出港。人们常常忘记，二战之前的那些年，美国是世界最大的能源生产国。尽管这些石油大部分在国内消费、大部分通过管道输送，能源出口也曾是休斯敦早期发展的一部分。这一点在二战期间至关重要：据丹尼尔·耶金（Daniel Yergin）说，整个二战期间，美国与欧洲盟国共消耗70亿桶石油，其中60亿桶由美国供应，大部分从得克萨斯运出。*"},{"id":"ch12-009","p":245,"t":"p","en":"But in the years after the war, with its reserves gone and US industry growing rapidly, the US became a major energy importer, and continues to be one to the present day. 'That being said, Houston also contains the largest concentration of refineries and petrochemical plants in the world.³ It's also home to a large infrastructure for energy export. In 2018, the Texas Gulf Coast accounted for 80 percent of the nation's crude shipments.4 Even more striking: in April 2018, the Houston-Galveston port region exported more oil than it imported for the first time since the end of the Second World War.5 That shift reflects the underlying reality that the United States has recently returned to the position of a net exporter of energy—that is, the US produces more oil and gas than it consumes, and exports the balance.'","zh":"但战后，随着储量枯竭、美国工业迅速扩张，美国成了能源进口大国，至今仍然如此。话虽如此，休斯敦也拥有世界上最集中的炼油厂和石化厂群。* 这里同样建有大规模的能源出口设施。2018年，得克萨斯墨西哥湾沿岸承担了全国80%的原油装运量。* 更惊人的是：2018年4月，休斯敦—加尔维斯顿港区自二战结束以来首次出口石油多于进口。* 这一转变反映了一个基本现实：美国近来重新回到能源净出口国的位置——也就是说，美国生产的石油和天然气多于它消费的量，并将余额出口。*"},{"id":"ch12-010","p":245,"t":"p","en":"Some of that shift has to do with new technologies for exploration and drilling that have led to the discovery and extraction of oil from shale rock, and the extraction of what's known as \"tight oil\"-smaller pockets of residual oil in the rocks surrounding what were once large pockets of trapped oil. The United States has been the technological and engineering leader in both shale and unconventional oil, though now those techniques have spread worldwide—in part through foreign contracting of US firms. But what's also changed the picture is the large role of the waters off of Houston's coast—the Gulf of Mexico, which now produces nearly 20 percent of all the oil in the United States.","zh":"这一转变部分归因于勘探与钻井的新技术：它们使页岩中的石油得以发现和开采，也使所谓“致密油”（tight oil）得以采出——即曾经封存大油藏的那些岩层之中残留的小油囊。美国在页岩油和非常规石油方面一直是技术与工程上的领跑者，不过如今这些技术已传播到全世界——部分是通过外国公司雇用美国企业实现的。但改变局面的还有休斯敦近海那片水域所扮演的重要角色：墨西哥湾如今产出美国全部石油的近20%。"},{"id":"ch12-011","p":245,"t":"p","en":"The story of how the Gulf of Mexico became the world's most important source of innovation in offshore oil is a story of entrepreneurship and engineering (and, to a degree, of corruption).6 But it is also, importantly, a story about how the US Navy drove the science and engineering that has allowed us to plumb the oceans' depths, and to penetrate the ocean floor.","zh":"墨西哥湾如何成为世界最重要的海上石油创新之源，这是一个关于创业精神与工程技术的故事（某种程度上也是关于腐败的故事）。* 但同样重要的是，这也是一个关于美国海军如何推动科学与工程的故事——正是这些技术让我们得以探测大洋深处，钻入海底。"},{"id":"ch12-012","p":245,"t":"p","en":"*The issue is somewhat confusing, as the United States still imports a large quantity of oil. That's because oil comes in several different varieties, and the US needs to import volumes of oil of types that it does not produce domestically. When people point to the fact that the US is a net exporter of energy and say that it is now “energy independent,\" they are glossing over this critical detail.","zh":"* 这个问题有点令人费解，因为美国至今仍进口大量石油。原因在于石油分许多不同品种，而美国需要进口一些本国不生产的油种。当人们拿美国是能源净出口国这一点做文章、声称它如今已“能源独立”时，恰恰忽略了这一关键细节。"},{"id":"ch12-013","p":246,"t":"h","en":"Drilling Deep: By-products of the Cold War","zh":"深钻：冷战的副产品"},{"id":"ch12-014","p":246,"t":"p","en":"Walter Munk, of the Scripps Institution of Oceanography, was probably the most influential oceanographer of the American century. (He died in February 2019, at the age of 101, still conducting influential research and shaping the careers of generations of students.) Munk's most famous studies relate to the ways in which the wind, currents, and chemistry of the oceans shape the movement of the seas (and thus, much of our weather). He was, in this, a frequent collaborator with the US Navy's powerful Office of Naval Research (of which we'll see more in the following chapter). But the strangest collaboration between them was not in the realm of oceanography at all, but in a somewhat capricious effort to drill into the Earth's crust.","zh":"斯克里普斯海洋研究所的沃尔特·芒克（Walter Munk），大概是美国世纪里最有影响力的海洋学家。（他于2019年2月去世，享年101岁，临终前仍在做有分量的研究，仍在提携一代代学生。）芒克最著名的研究，关乎风、洋流与海水化学如何塑造海洋的运动（进而塑造了我们的大部分天气）。在这一领域，他是美国海军实力雄厚的海军研究局（Office of Naval Research）的常客——下一章我们还会更多看到这个机构。但双方最奇怪的一次合作，完全不在海洋学领域，而是某种异想天开的、向地壳钻探的尝试。"},{"id":"ch12-015","p":246,"t":"p","en":"During the heart of the Cold War, the navy's star was fading as the nuclear arms race and the space race became the dominant forms of competition with the Soviet Union. The ocean sciences community was worried they were being left behind, along with the navy. But providentially, the United States had gotten wind of the notion that the Soviets were planning a project to drill into the Earth's mantle. That required an American response.' Munk, in a meeting of the National Science Foundation, made the surprising and bold proposal that an American project to drill into the Earth's crust should be launched and launched from sea. His essential observation was that if the first several thousand feet of drilling involved feeding pipe through water, it would be far easier than drilling through an equivalent amount of land. He proposed aiming for what's known as the Mohorovičić Discontinuity, or the Moho—the layer that separates the Earth's crust from its mantle—at a location northwest off the coast of Hawaii.","zh":"冷战正酣之时，随着核军备竞赛和太空竞赛成为与苏联较量的主要形式，海军的地位日渐黯淡。海洋科学界担心自己会跟海军一起被甩在后面。但天从人愿，美国风闻苏联正筹划一个钻入地幔的工程。这需要美国作出回应。* 芒克在美国国家科学基金会的一次会议上提出了一个出人意料的大胆建议：美国应当上马一个钻透地壳的计划，而且要从海上发起。他的核心判断是：如果最初几千英尺的钻探是把钻杆穿过水层送下去，那要比在陆地上钻同样深度容易得多。他提议的目标是所谓的莫霍洛维奇不连续面（Mohorovičić Discontinuity），简称莫霍面——即地壳与地幔的分界面——地点选在夏威夷海岸西北方向。"},{"id":"ch12-016","p":246,"t":"p","en":"Thus was born the cleverly named Project Mohole. It was approved by the National Science Foundation. The project attracted excitement and attention—in part due to the lyrical writing of a journalist assigned to cover the story for Life magazine, a young John Steinbeck. And it was carried out by the American Miscellaneous Society—a whimsically named informal group of scientists headed by Gordon Lill, at the time the director of the geophysics branch of the Office of Naval Research.","zh":"于是有了名字起得颇巧的“莫霍计划”（Project Mohole）。计划获国家科学基金会批准。它引来兴奋与关注——部分要归功于一位被派去为《生活》杂志报道此事的记者，年轻时的约翰·斯坦贝克（John Steinbeck）。执行者是“美国杂学会”（American Miscellaneous Society）——一个名字带着戏谑意味的非正式科学家团体，领头人戈登·利尔（Gordon Lill），当时任海军研究局地球物理处处长。"},{"id":"ch12-017","p":247,"t":"p","en":"Lill's contributions were multiple, but importantly included his advanced knowledge of sonar technology, and what is known as bathymetry-the measurement of the depth of the water in oceans, seas, and lakes. He had pioneered new techniques for bathymetry while on a training stint away from the US Navy at the famed Woods Hole Oceanographic Institute. And he was closely connected to the world of the Navy Experimental Diving Unit, which had trained divers for underwater salvage.","zh":"利尔的贡献是多方面的，尤其包括他在声呐技术上的精深知识，以及所谓“水深测量”（bathymetry）——即测量大洋、海、湖水深的技术。他曾在暂离美国海军期间，赴著名的伍兹霍尔海洋研究所进修，并在那里开创了水深测量的新技术。他还与海军实验潜水队（Navy Experimental Diving Unit）关系密切，那支部队为水下打捞训练潜水员。"},{"id":"ch12-018","p":247,"t":"p","en":"Industry was also built into the project from the start. The Gulf Oil Corporation chaired the Project Mohole subcommittee of the American Miscellaneous Society, and a Louisiana company that had been leading innovations in offshore engineering, Global Marine, was contracted to do the actual drilling for the project. Global Marine deployed its dedicated drilling ship to the project—one of the first in the world capable of conducting drilling from open waters—and began testing off of Guadalupe, Mexico, in 1960. And Brown and Root-one of the world's largest engineering management firms, and the first ever to build an offshore platform—was contracted to run the work.8","zh":"这个计划从一开始就把产业界纳入进来。海湾石油公司（Gulf Oil Corporation）主持美国杂学会的莫霍计划分委员会；一家在海上工程领域引领创新的路易斯安那公司“环球海洋”（Global Marine）受雇承担实际钻探。环球海洋为计划派出了它的专用钻探船——世界上最早能在开阔水域作业的钻探船之一——1960年在墨西哥瓜达卢佩（Guadalupe）外海开始试验。而布朗与鲁特公司（Brown and Root）——世界最大的工程管理公司之一，也是第一家建造海上平台的公司——受雇负责施工管理。*"},{"id":"ch12-019","p":247,"t":"p","en":"From the outset, though, the project was ill-managed. The various parties had disagreements, from the engineering and scientific goals to simple personality clashes. And while the first phase of the project had a relatively modest cost, the costs for drilling into the Moho grew and grew. The mismanagement of the project became public, with Newsweek describing the expedition as “Project No Hole.\"9 And after repeated inquiries and mounting expenses, and in the face of considerable political and scientific opposition, Congress defunded the project.10","zh":"然而从一开始，这个计划就管理不善。各方在工程与科学目标上意见不一，甚至还有纯粹的性格冲突。计划第一阶段的花费还算有限，但钻向莫霍面的成本越滚越大。管理混乱被公开，《新闻周刊》把这次远征称作“无洞计划”。* 在反复的质询、不断攀升的开支以及相当多的政治与科学界反对之下，国会最终削减了该计划的经费。*"},{"id":"ch12-020","p":247,"t":"p","en":"But not before the project recorded some important achievements. It succeeded in extracting core samples from the Earth that penetrated through Miocene-age sediments for the first time (that's from some twenty-three million to five million years ago). But the more lasting effects of the project were the advances in deep-sea engineering.","zh":"但在此之前，计划已经取得了一些重要成果。它首次成功地从地球取出了穿透中新世沉积层的岩芯（中新世距今约2,300万年至500万年）。不过，这个计划更持久的效应，是深海工程方面的进步。"},{"id":"ch12-021","p":247,"t":"p","en":"First, the project's drilling itself was unprecedented. Five holes were drilled into the Earth's core, with the deepest being 601 feet below the seafloor. And that hole was dug from a drilling ship operating in 11,700 feet of water. It was—by far—the deepest drilling ever conducted by an untethered platform afloat at sea. That success came in large part from a related engineering advance. The project was the first to develop techniques for stabilizing ship platforms at sea, using a series of thrusters to keep the ship in place against the swell of waves and tides. The technique of \"dynamic positioning\" would prove key to what was to follow.","zh":"首先，计划本身的钻探就是史无前例的。它在地壳上钻了5个孔，最深的一个深入海底以下601英尺。而这个孔，是从一艘在11,700英尺深的水中作业的钻探船上钻出来的。这是迄今为止漂浮海上、不系缆的平台所进行的最深钻探，远超以往。这一成功很大程度上来自一项相关的工程突破：该计划首次开发出在海上稳定船舶平台的技术，用一组推进器把船顶住涌浪与潮流的推力，固定在原位。这种“动力定位”（dynamic positioning）技术，后来被证明是下一步发展的关键。"},{"id":"ch12-022","p":248,"t":"p","en":"There were several follow-on projects that came out of Mohole, the most important being the Joint Oceanographic Institutions for Deep Earth Sampling program, which ran from 1968 to 1983 and provided the first comprehensive sets of data about the sub-seafloor.\" This project discovered that evidence of salt domes in core samples positively correlated with the likelihood of the presence of oil fields. But realizing the potential of that discovery required a second project—again a collaboration of the US Navy, the national security community in Washington more broadly, and the oceanographic and engineering communities. Once again it was a by-product of the Cold War.","zh":"莫霍计划衍生出若干后续项目，最重要的是“深海地球取样联合海洋机构计划”（Joint Oceanographic Institutions for Deep Earth Sampling），1968年至1983年间运行，首次提供了关于海底以下的系统数据。* 该项目发现，岩芯中盐丘的证据与油田存在的可能性呈正相关。但要把这一发现的可能性变成现实，还需要第二个项目——同样是美国海军、华盛顿更广泛的国家安全界与海洋学、工程界三方的合作。又一次，它是冷战的副产品。"},{"id":"ch12-023","p":248,"t":"h","en":"Project Azorian","zh":"阿佐里安计划"},{"id":"ch12-024","p":248,"t":"p","en":"In 2010, the US Central Intelligence Agency released to the public a declassified version of a remarkable document written in late 1985. Originally classified top secret, it was downgraded to secret/noforn (\"no foreigners\") when some of the project details leaked to the Los Angeles Times and then to the New York Times. As journalists filed Freedom of Information Act requests to learn more, the CIA refused to either “confirm or deny\" the existence of the requested documents—a famous and oft-repeated non-reply that came to be known as the “Glomar response,\" after the name of the ship involved. Fully two decades after the collapse of the Soviet Union and after multiple leaks, the CIA deemed that it was finally safe to release their version of the story. Even so, the report is heavily redacted, including several whole pages that have been blanked out. Still, between the leaks, an eventual documentary, and the CIA's own document, most of the salient details of what the CIA had termed “Project Azorian” can be gleaned.12","zh":"2010年，美国中央情报局向公众公布了一份1985年末写成的非同寻常的文件的解密版本。这份文件原定密级为“绝密”，后来因计划的部分细节先是泄露给《洛杉矶时报》、继而又泄露给《纽约时报》，被降为“机密／不得向外国人公开”。记者们依据《信息自由法》提出申请、要求了解更多内情时，中情局拒绝“确认或否认”被申请文件的存在——这个著名而屡被引用的不置可否，后来因涉事船只之名被称作“格洛玛号式答复”。苏联解体整整二十年、又经过多次泄密之后，中情局才认定公开他们那个版本的故事已无妨碍。即便如此，报告仍有大量涂黑，包括整整几页被整版盖住。不过，把泄密材料、后来的一部纪录片以及中情局自己的文件拼起来，中情局所称“阿佐里安计划”的大部分要点仍可推知。*"},{"id":"ch12-025","p":248,"t":"p","en":"Even the redacted version of the story in the CIA's document reads like a nautical version of the movie Argo about the CIA's (real) use of a fake film as a cover story for their rescue of the escapees from the Iranian embassy hostage-taking. Except that in this case the agency wasn't trying to rescue someone, but to recover something—specifically, a Soviet nuclear submarine, K-129, lost at sea in 1968 and found by the US Air Force and US Navy off the west coast of Hawaii, under some 16,700 feet of water.","zh":"即便经过涂黑，中情局文件里的这个故事读起来仍像一部航海版的电影《逃离德黑兰》（Argo）——那部电影讲的是中情局（真事）以一部假电影为幌子，营救从伊朗使馆人质事件中脱身的美国人员。只不过这一次，中情局不是要救什么人，而是要捞一件东西——具体说，是一艘苏联核潜艇K-129，它1968年沉没，被美国空军和海军在夏威夷西海岸外、约16,700英尺深的水下找到。"},{"id":"ch12-026","p":249,"t":"p","en":"This remarkable project was marked by intrigue and creative engineering. To create a plausible cover story, the agency contacted the eccentric billionaire Howard Hughes, known for his cars and his experimental wooden airplane, the Spruce Goose, and convinced him to agree to launch a marine mining voyage, complete with press release and accompanying stories. For the (fake) voyage, a specifically designed ship, the Hughes Glomar Explorer, was built by Sun Shipbuilding out of Pennsylvania, then the largest shipbuilding firm in the country, at a cost of over \\$200 million. Intelligence officers and nuclear technicians were quietly embedded onto the ship as part of the engineering crew contracted for the project—Global Marine, whose prowess in deep-sea drilling in Project Mohole had captured the US Navy's attention. To get from the shipyards south of Philadelphia, in the working-class city of Chester, to Hawaii, the ship, which was too wide to go through the Panama Canal, had to transit around South America, through the Strait of Magellan at the tip of the continent. They docked at Valparaiso, Chile, to resupply—on the very day that General Pinochet was ousted in a coup. They then sailed to Long Beach, where the ship ended up stuck ashore by a strike of longshoremen that rocked the California harbor. When they arrived at the recovery site, their voyage was waylaid by one of the largest typhoons ever recorded in the eastern Pacific. And when they eventually arrived at their destination, they found a Soviet ship patrolling the area, which deployed a helicopter to take photographs of the vessel. Every conceivable natural and political obstacle appeared set against their task.","zh":"这项非凡的工程，处处是算计，也处处是富有创造性的工程智慧。为了编出一个可信的掩护故事，中情局找上古怪的亿万富翁霍华德·休斯（Howard Hughes）——他因汽车和那架试验性的木制飞机“云杉鹅”（Spruce Goose）而闻名——说服他同意发起一次海底采矿航行，还配发新闻稿和相关报道。为这次（假）航行，宾夕法尼亚州的太阳造船公司（Sun Shipbuilding）——当时美国最大的造船企业——专门设计建造了一艘船“休斯·格洛玛探索者”号（Hughes Glomar Explorer），造价逾2亿美元。情报官员和核技术专家被悄悄安插上船，身份是项目承包方“环球海洋”雇用的工程人员——这家公司在莫霍计划中展现的深海钻探本领，早已引起美国海军注意。从费城以南工人城市切斯特（Chester）的船厂驶往夏威夷，这艘船因船体过宽无法通过巴拿马运河，只能绕行南美洲，穿过大陆南端的麦哲伦海峡。他们在智利瓦尔帕莱索（Valparaíso）靠岸补给——恰恰就在皮诺切特将军被政变推翻的那一天。随后他们驶往长滩，结果船被码头工人的罢工困在岸上，那场罢工震动了整个加州港口。等他们抵达打捞海域，航行又被东太平洋有记录以来最大的台风之一耽搁。而等他们终于到达目的地，却发现一艘苏联船只正在该海域巡逻，还派出直升机对这条船拍照。凡是能想到的自然障碍和政治障碍，似乎都挡在他们这项任务前面。"},{"id":"ch12-027","p":249,"t":"p","en":"After myriad tests, systems trials, misfires, and delays over four years, the project eventually recovered a thirty-eight-foot portion of the Soviet boat. What the navy gleaned from that small portion of the six-hundred-plus-foot boat is presumably the subject of the redacted portions of the 2010 document. But as with Project Mohole, the more lasting legacy of the project was its engineering advances for offshore drilling.","zh":"经过四年间无数次的试验、系统测试、失败和延期，计划最终捞起了苏联潜艇38英尺长的一段艇体。海军从这艘六百多英尺长的潜艇的这一小段上得到了什么，想必就是2010年那份文件被涂黑的部分。但和莫霍计划一样，这个计划更持久的遗产，是它为海上钻井带来的工程进步。"},{"id":"ch12-028","p":249,"t":"p","en":"These were several. It was the deepest marine salvage operation in history, bringing up a portion of the Soviet sub from more than three miles below the ocean's surface. The project advanced the techniques for dynamic positioning, for keeping the ship stable in the water as it conducted drilling operations. They experimented with hydraulic/ pneumatic systems that could prevent the ship's heave from affecting the string of pipes lowered down to the ocean floor—a major problem in earlier deep-sea efforts.13 Given the complexity of drilling at such depths, this was a critical advance. Even the Hughes Glomar Explorer continued to be used after the recovery and played an important role in deep-sea exploration advances.","zh":"这样的进步有好几项。这是历史上最深的一次海上打捞作业，从海面以下三英里多深处把苏联潜艇的一部分捞了上来。计划推进了动力定位技术，使船在钻探作业时能在水中保持稳定。他们还试验了液压／气动系统，用以避免船的垂荡影响下到海底的那一串钻杆——这是早期深海作业中的一大难题。* 鉴于如此深度钻探的复杂性，这是一项关键突破。就连“休斯·格洛玛探索者”号在打捞之后也继续使用，在深海勘探的进步中发挥了重要作用。"},{"id":"ch12-029","p":250,"t":"p","en":"Unlike Project Mohole, which came at a time when the US was focused on the space competition with the Soviets and when the international oil supply was plentiful, Project Azorian came at a very different moment. The 1973 Suez Crisis and oil price shock that had so impacted the container ship fleet also shook up the oil industry—just as Azorian was underway. And then in 1979 the Shah of Iran was deposed, and oil prices spiked again. They stayed high for years, as both Iran and Iraq became embroiled in a long, extremely bloody war. The flow of oil was increasingly important for the United States as well. Oil tankers entering the port of Houston as well as Los Angeles and elsewhere and unloading cargoes of fuel from the Persian Gulf became the critical symbol of energy insecurity in the United States. Just as geopolitical developments had helped transform containerized shipping, so they began to reshape the energy business. And the pressure mounted to find new suppliers of oil. Part of the answer would lie in the Gulf of Mexico, using all of this new technology.","zh":"莫霍计划上马时，美国正专注于与苏联的太空竞赛，国际石油供应也还充裕；阿佐里安计划所处的时刻则大不相同。1973年苏伊士危机与油价冲击曾重创集装箱船队，也同样震动了石油业——恰在阿佐里安计划进行之际。接着，1979年伊朗国王被推翻，油价再度飙升。此后多年油价居高不下，伊朗和伊拉克双双陷入一场漫长而极其血腥的战争。石油的流向对美国也越来越重要。油轮驶入休斯敦港以及洛杉矶等地的港口，卸下来自波斯湾的燃料，这成了美国能源不安全的关键象征。地缘政治的发展曾促成集装箱航运的转型，如今又开始重塑能源业。寻找新石油供应来源的压力与日俱增。答案的一部分，就在墨西哥湾，靠的正是这些新技术。"},{"id":"ch12-030","p":250,"t":"h","en":"Offshore Oil: Of Salt and Carbon, Take 1","zh":"海上石油：盐与碳（一）"},{"id":"ch12-031","p":250,"t":"p","en":"It had long been understood that the salty chemistry of the oceans' waters meant that it absorbed carbon from the atmosphere. The modern study of this phenomenon concentrates on the question of how much excess carbon—carbon produced by the burning of fossil fuels—has been absorbed by the oceans. But carbon is of course also a naturally occurring chemical in the atmosphere, essential to the formation of plant life through photosynthesis, with oxygen as the by-product of that interaction-and so, fundamental to plant and animal life on Earth, including human life. Carbon is emitted naturally into the atmosphere by volcanoes and hot springs, and released from rocks when they come into contact with groundwater, ice caps, and seawater-al naturally occurring processes. Some of this carbon sinks to the seafloor and is buried in sediment—and after millions of years, some of it is transformed into oil.","zh":"人们早已明白，海水含盐的化学性质意味着它能从大气中吸收碳。对这一现象的现代研究，集中在这样一个问题上：海洋吸收了多少多余的碳——即燃烧化石燃料产生的碳。但碳本身当然也是大气中天然存在的化学物质，是植物借光合作用生长所必需，而这一反应的副产品是氧——因此，碳对地球上的动植物生命（包括人的生命）都是根本性的。火山和温泉会天然地向大气排放碳，岩石在与地下水、冰盖和海水接触时也会释放碳——这些都是自然过程。其中一部分碳沉到海底，埋进沉积物——几百万年之后，有一部分变成了石油。"},{"id":"ch12-032","p":251,"t":"p","en":"In a similar fashion, and over similar time, salt in the water settles to the bottom and forms a crust. This crust is not static, though; it is pushed around by the currents. Depending on currents and the specific salinity of the water, this salt can get trapped in mountains, or pockets. What the Integrated Ocean Drilling Project discovered is that sometimes those formations emerge as “domes.\" And just as pockets of oil can be \"trapped\" by specific geological formations beneath land, so, too, it can be trapped by sand domes or similar formations on the seabed.14","zh":"同样地，在同样漫长的时间里，水中的盐沉到海底，结成一层硬壳。但这层壳并非静止不动，它被洋流推来推去。视洋流与水体具体盐度的不同，这些盐可能被封存在山体里，也可能聚成盐囊。综合大洋钻探计划（Integrated Ocean Drilling Program）发现，有时这些构造会以“盐丘”的形态凸起。正如陆地下方某些地质构造能“封住”油藏，海底的盐丘或类似构造也能把石油封住。*"},{"id":"ch12-033","p":251,"t":"p","en":"The search for energy at sea has a long history, much of it unproductive.* As early as the 1890s, the search for oil led some entrepreneurial spirits to experiments in the lakes of Ohio, and in Baku, and then to piers off the coasts of California, Texas, and Louisiana. This was not really offshore exploration, though; these locations were all close to land, either on piers or in very shallow waters accessible from land. It wasn't until 1947 that a truly offshore oil well was drilled, out of the sight of land—some ten miles off the coast of Louisiana.","zh":"在海上寻找能源已有很长历史，其中大部分一无所获。* 早在19世纪90年代，找油的热情就驱使一些有创业精神的人到俄亥俄州的湖泊和巴库（Baku）去试验，后来又到加利福尼亚、得克萨斯和路易斯安那近海的栈桥上去。但这其实算不上真正的近海勘探：这些地点都紧靠陆地，不是在栈桥上，就是在可以从陆地抵达的极浅水域。直到1947年，才钻出第一口真正离岸、望不见陆地的海上油井——在路易斯安那州海岸外约10英里处。"},{"id":"ch12-034","p":251,"t":"p","en":"The cost of these early platforms and drills was prohibitive. On land, you can cheaply and easily drill hundreds of test wells. Not so at sea.","zh":"这些早期平台和钻机的成本高得让人却步。在陆地上，你可以便宜又轻松地打上几百口探井。海上就不行了。"},{"id":"ch12-035","p":251,"t":"n","en":"Petroleum is not the first fuel that industrialized societies have extracted from the oceans; that distinction belongs to the oil that comes from rendering the fat of sperm whales—which were hunted almost to extinction by British, French, American, Japanese, and Russian whaling fleets at the dawn of the industrial age. (Nathaniel Philbrick's intimate account of whale hunting, in Into the Heart of the Sea: The Tragedy of the Whaleship Essex [New York: Pengiun Books, 2020], vividly conveys the scale and the drama of that enterprise.) Notably, whaling fleets also sourced large quantities of guano from the Chincha Islands off the western coast of Peru, and later off the southwestern coast of Africa. Guano was the main input to the first industrial fertilizers in the Western world. It may also have been the source of a blight that caused the potato famine—a reversal of the process that saw the European world bring disease to their colonial possessions.","zh":"石油并不是工业社会从海洋中获取的第一种燃料；这一殊荣属于用抹香鲸脂肪熬出的油——工业时代初叶，英国、法国、美国、日本和俄罗斯的捕鲸船队几乎把抹香鲸捕到绝迹。（纳撒尼尔·菲尔布里克（Nathaniel Philbrick）在《海洋深处：捕鲸船“埃塞克斯”号的悲剧》（Into the Heart of the Sea: The Tragedy of the Whaleship Essex，纽约：企鹅出版社，2020年）中对捕鲸的细致记述，生动再现了那项产业的规模与惊心动魄。）值得注意的是，捕鲸船队还从秘鲁西海岸外的钦查群岛（Chincha Islands）、后来又从非洲西南海岸大量采集鸟粪石。鸟粪石是西方世界最早一批工业化肥的主要原料。它或许还是引发马铃薯饥荒的一种疫病的源头——这恰好是欧洲人把疾病带往殖民地那一步的反向过程。"},{"id":"ch12-036","p":252,"t":"p","en":"Making a very well-informed estimate of where oil might be found is absolutely vital to economically viable drilling at sea. Here, what came into play was a different set of technologies, some developed by the US Navy, others by industry. The first part of this was sonar mapping, which emerged from the work of the navy in tracking submarines, and further developed by the navy and oceanographers at Woods Hole and elsewhere in the early part of the Cold War. The second part was seismic mapping. This field owed less to the navy than to the oil industry itself. In particular, advances by Shell Oil and Mobil Oil in the late 1960s generated what was known as \"bright spots\" mapping. Earlier seismic mapping could identify locations where oil could be trapped. The new technology showed off “amplitude anomalies\"(or \"bright spots\"), which were far more likely to be a reflection of the presence of oil itself. This dramatically reduced the risks of drilling a dry hole.15","zh":"要在海上钻井而经济上可行，事先对哪里可能找到石油作出有充分依据的判断，绝对关键。这方面起作用的是另一组技术，一部分出自美国海军，一部分出自产业界。其一是声呐测绘，源于海军追踪潜艇的工作，冷战初期又由海军与伍兹霍尔等地的海洋学家进一步开发。其二是地震测绘。这一领域与其说靠海军，不如说靠石油业自身。尤其是壳牌石油（Shell Oil）与美孚石油（Mobil Oil）在1960年代末取得的进展，催生了所谓“亮点”（bright spots）测绘技术。早期地震测绘只能找出可能圈闭石油的位置；新技术则能显示“振幅异常”（即“亮点”），而这种异常更可能直接反映石油本身的存在。这大大降低了打出干井的风险。*"},{"id":"ch12-037","p":252,"t":"p","en":"Finding is one thing, drilling is another. The Gulf of Mexico emerged as a key site for development of offshore drilling for several reasons. One was politics: as Clyde Burleson quips in his history of offshore oil exploration, \"Oil and water do not mix. Oil and politics, however, seem made for each other.\" The Louisiana legislative and pork barrel campaign to open up drilling of the Gulf tidelands was, by his account, \"one of the longest, most brutal, and intense political battles ever waged in Washington, DC.\"16 Politics can be overcome; geology is harder. Bright spot seismic technology only works with certain kinds of rock formations, and the deltaic rocks of the Gulf of Mexico (which are highly porous) were the perfect kind of rock sample for the new technologies.","zh":"找到是一回事，钻下去是另一回事。墨西哥湾成为海上钻井技术发展的重镇，原因有好几个。其一是政治：克莱德·伯利森（Clyde Burleson）在他那部海上石油勘探史里打趣说：“油与水不相溶。可油与政治，倒像是天生一对。”据他记述，路易斯安那州为开放墨西哥湾潮间带钻探而展开的立法攻势与“分肥”政治，是“华盛顿特区有史以来历时最长、最惨烈、最激烈的一场政治战”。* 政治可以攻克，地质却更难对付。亮点地震技术只适用于某些类型的岩层，而墨西哥湾的三角洲岩层（孔隙度极高）恰好是新技术的理想样本。"},{"id":"ch12-038","p":252,"t":"p","en":"Geology was one advantage; geography was another. The transition from land to the ocean depth does not happen immediately. Every continent and every coast has an underwater shelf, a land formation that extends outward under the water. This continental shelf is important for fishing and also for drilling. But these shelves vary in width and in slope. Off the southern coast of the United States, the Gulf of Mexico has one of the gentlest shelves in the world. In some parts of the Gulf, the water depths were less than 600 feet as far out as 140 miles. The Gulf of Mexico—with its proximity to the headquarters of energy majors in Texas; its long, gentle, sloping sea shelf; and the permissive politics of Louisiana—had the exact right conditions to enable expansive testing.17","zh":"地质是一个优势，地理是另一个。从陆地到深海并不是一步跨过去的。每块大陆、每段海岸都有一片水下陆架，那是陆地向水下延伸出去的部分。大陆架对捕鱼重要，对钻井也重要。但各处的陆架，宽度与坡度大不相同。在美国南海岸外，墨西哥湾拥有世界上最平缓的陆架之一。湾内有些地方，向外延伸140英里，水深仍不足600英尺。墨西哥湾——靠近得克萨斯的各大能源公司总部，拥有漫长、平缓倾斜的海底陆架，又有路易斯安那宽松的政治环境——恰好具备开展大规模试验的全部条件。*"},{"id":"ch12-039","p":253,"t":"p","en":"Drilling a salt dome involves several steps, all of them complicated. To find an oil pocket, you start by conducting seismic surveys (using sonar equipment) to determine where oil is most likely to be. Then you use a mobile offshore drilling unit to dig an initial well. These come in four main types: submersibles—usually barges that rest on the seafloor, with steel posts on the deck that extend above the waterline; jackups— rigs that sit on a floating barge, with legs extended to the seafloor; drill ships—like those used for Mohole and Azorian, with a drilling rig on the top deck working through a hole in the hull; and semi-submersibles— drilling units that float on the surface on top of submerged pontoons. At the seafloor is a pair of hydraulically powered clamps that can close off the pipe leading up to the rig in case of a blowout. At the drill site, drill pipes are connected to form a drill string, which is used to reach deep into the Earth's crust. The drill string is then connected to a device that spins it around, and using a drill bit connected at the bottom of the drill string, the pipes grind into the Earth's surface. Putting this all together can take weeks to months. When it works, you then have to replace the temporary rig with a permanent one to capture the oil. All this while navigating the high waves and powerful storms that regularly sweep in from the Caribbean and churn up the shallow waters of the Gulf.","zh":"钻探盐丘要经过好几道工序，每一道都很复杂。要找油囊，先做地震勘测（使用声呐设备），确定石油最可能存在的地方。然后用一座移动式海上钻井装置打第一口井。这类装置主要有四种：坐底式——通常是坐在海底的驳船，甲板上有高出水面的钢柱；自升式——钻机坐在浮驳上，桩腿向下伸到海底；钻井船——莫霍计划与阿佐里安计划用的就是这种，钻机装在顶层甲板，通过船体上的开口向下钻；半潜式——浮在水面、底下靠潜没的浮箱托着的钻井装置。海底装有一对液压夹钳，一旦发生井喷，可把通往平台的管柱夹闭。在井位上，钻杆一根根接成钻柱，用来深入地下深处的地壳。钻柱再接到一台带动它旋转的装置上，靠钻柱底端的钻头，让管子一点点磨进地层。把这一切装配起来，要花几周到几个月。打成了，还得把临时装置换成永久平台，才能把油采出来。而这一切，都要在加勒比海定期涌来、把墨西哥湾浅水搅得天翻地覆的巨浪与强风暴中进行。"},{"id":"ch12-040","p":253,"t":"p","en":"Understandably, these efforts are easier in shallower waters than in deep. Early offshore drilling was literally just offshore, still in very shallow waters where platforms could be tethered to the ocean floor or by cables to land. But with the development of technologies for dynamic positioning, platforms were stable without having to be tethered to the ocean floor. And with the new technologies for drilling at depth, further horizons opened up.","zh":"这也难怪：浅水区的作业总比深水容易。早期的海上钻井真的就在“岸外”不远处，仍在极浅的水域，平台可以锚定在海底，或者用缆绳系到岸上。后来有了动力定位技术，平台不必锚定海底也能保持稳定。再随着深水钻井新技术问世，更远的天地打开了。"},{"id":"ch12-041","p":253,"t":"p","en":"Step by step, consortiums of companies-energy firms like Shell and Texaco combining forces with engineering firms like Global Marine and Brown and Root-steadily pushed the boundary outward. Success at one thousand feet taught them more about the technology, and gave them more experience, including in managing and mitigating the risks associated with these amazingly complex projects.","zh":"企业联合体就这样一步步把边界向外推——壳牌、德士古（Texaco）这样的能源公司，与“环球海洋”、布朗与鲁特这样的工程公司联手。在1,000英尺水深处取得成功，让他们对技术懂得更多、经验也更足，包括如何管理和化解这些复杂得惊人的项目所伴随的风险。"},{"id":"ch12-042","p":253,"t":"p","en":"By the late 1990s, the combination of techniques for sonar and seismic mapping, for dynamic positioning and for deep-sea drilling, had turned the entire Gulf into a giant oil field. By 1999, the cost of finding and producing oil was 60 percent of what it had been ten years prior.18 And in 1998, the ship used by Project Azorian-the Hughes Glomar Explorer, on contract for Chevron and Texaco-set a world record by spudding a well 7,718 feet below the Gulf of Mexico.19 By the mid-2000s, there were more than four thousand platforms connected to thirty-five thousand wells in the Gulf. And the US waters of the Gulf of Mexico were accounting for almost 20 percent of US crude oil production.20","zh":"到1990年代末，声呐测绘、地震测绘、动力定位与深海钻井几套技术合在一起，已把整个墨西哥湾变成一片巨大的油田。到1999年，找油与采油的成本已降到十年前的60%。* 1998年，阿佐里安计划用过的那条船——“休斯·格洛玛探索者”号，受雪佛龙（Chevron）与德士古租用——在墨西哥湾海底7,718英尺处开钻，创下世界纪录。* 到2000年代中期，湾内已有4,000多座平台，连接着35,000口井。美国所属的墨西哥湾海域，承担了美国原油产量的近20%。*"},{"id":"ch12-043","p":254,"t":"p","en":"But even greater depths were about to be plumbed, outside of US continental waters.","zh":"但更大的深度即将被测探——而且是在美国大陆水域之外。"},{"id":"ch12-044","p":254,"t":"h","en":"Offshore Goes Global","zh":"近海钻探走向全球"},{"id":"ch12-045","p":254,"t":"p","en":"In all of this, the United States had an advantage: its major engineering firms were private, as were the firms in some of the major European countries. In the rest of the world, and among the biggest energy players in the world, this was an exception. In Russia, Saudi Arabia, Indonesia, Qatar, Iran, and Iraq, oil was dominated by state-owned and state-operated firms. By the 1980s, fully 85 percent of the world's oil reserves were held by state-owned firms.","zh":"在这一切之中，美国有一项优势：它的主要工程公司都是私营的，欧洲几个主要国家也是如此。而在世界其余地方，尤其是在世界最大的那些能源玩家当中，这属于例外。在俄罗斯、沙特阿拉伯、印度尼西亚、卡塔尔、伊朗和伊拉克，石油业由国有、国营的公司主导。到1980年代，全世界足足85%的石油储量掌握在国有企业手中。"},{"id":"ch12-046","p":254,"t":"p","en":"David Victor, a colleague of Walter Munk's at Scripps, conducted a detailed study of innovation by state-owned firms and private firms.21 His data is compelling. It showed that although there is some variation across firms, it was only under rare conditions (and mostly in democracies) that state-owned firms could develop the entrepreneurial instinct and the managerial competence for the risk-taking required to drive the kinds of advances in offshore engineering that American firms could develop. So it was overwhelmingly Western firms that developed the technology, the engineering, and the management capacity to shoulder the multifaceted scientific and engineering challenge of offshore drilling. Other countries had to contract in Western expertise, often US expertise, if they wanted to develop offshore projects. When state-owned firms did try to compete without Western firms, they quickly discovered they could not handle either the sophisticated engineering or, in particular, the management consequences of undertaking these extraordinarily complex projects. This was true of Venezuela, and of Qatar.. Even the Soviet Union was forced to call in","zh":"沃尔特·芒克在斯克里普斯的同事戴维·维克托（David Victor），对国有企业与私营企业的创新做过一项细致研究。* 他的数据很有说服力。数据显示，尽管各公司之间差异不小，但只有在极少数条件下（而且大多是在民主国家），国有企业才可能培养出创业本能与管理能力，去承担推动海上工程进步所必需的风险——而美国公司恰恰能发展出这样的能力。因此，发展出足以扛起海上钻井这一多面科学工程挑战的技术、工程与管理能力的，绝大多数是西方公司。其他国家若想开发海上项目，只能外购西方（往往是美国）的专业技术。国有企业真的抛开西方公司单干时，很快便发现：无论是复杂的工程技术，还是——尤其要紧的——承担这类极度复杂项目所带来的管理后果，它们都应付不了。委内瑞拉如此，卡塔尔亦然。连苏联也不得不求助于"},{"id":"ch12-047","p":255,"t":"p","en":"Western expertise when it tried to develop an oil field in the Tengiz section of the north Caspian, and ended up triggering a blowout that raged for 365 days.22","zh":"西方专业技术：它在北里海田吉兹（Tengiz）区块开发油田时，最终引发了一场持续燃烧365天的井喷。*"},{"id":"ch12-048","p":255,"t":"p","en":"But, of course, American engineering can spread and US companies (and similarly capable European firms) became involved in partnership with other countries seeking to develop offshore projects. Qatar and the UAE were earlier movers in developing these relationships. As was Brazil. Its state-owned enterprise, Petrobras, had stuck its toes into offshore waters in the 1980s, but hesitantly. Still protected by a monopoly and skeptical of international investors, Petrobras was limited in its exploration of Brazil's offshore potential. This continued until the 1990s, when Brazil transitioned to a democracy and, at more or less the same time, liberalized its economy—including the oil sector.23 International companies, with their diverse expertise from other projects, began to enter the market, partnering with Petrobras to develop the offshore industry.24","zh":"不过，美国的工程技术当然会扩散，美国公司（以及能力相当的欧洲公司）也开始与有意开发海上项目的其他国家结伙合作。卡塔尔和阿联酋在建立这类关系上起步较早，巴西也是。它的国有企业巴西石油公司（Petrobras）在1980年代就把脚趾探进了海上，但颇为迟疑。当时它仍受垄断保护，又对国际投资者心存疑虑，对巴西海上潜力的勘探因此受限。这种局面一直延续到1990年代：巴西转向民主制，差不多同时放开经济——包括石油部门。* 带着在其他项目上积累起来的多样专长，国际公司开始进入市场，与巴西石油合作发展海上产业。*"},{"id":"ch12-049","p":255,"t":"p","en":"Just as in the Gulf of Mexico, it was not just politics that animated drilling off the Brazilian coast, but geography—specifically, the nature of its eastern shore on the Atlantic Ocean. For several miles off the coast of Brazil, where the Amazon empties into the Atlantic, Brazil's continental shelf slopes downward at a very gentle pace. As with the Gulf of Mexico, the gentle slope of Brazil's shelf allowed its state-owned enterprise to develop the capacity to manage complex engineering projects step-by-step.","zh":"与墨西哥湾一样，推动巴西沿海钻井的不只是政治，还有地理——具体说，是它濒临大西洋的东海岸的地形。在亚马孙河注入大西洋的巴西沿海，向外若干英里之内，大陆架以极其平缓的坡度向下延伸。与墨西哥湾相似，正是这片平缓的陆架，让巴西的国有企业得以一步步培养起管理复杂工程项目的能力。"},{"id":"ch12-050","p":255,"t":"p","en":"Brazil started in shallow waters, with simple rigs, then moved to floating platforms as it progressed into deeper sea. This not only meant that they could innovate bit by bit, but that earlier and shallower projects could help fund the deeper, more complicated wells.","zh":"巴西从浅水起步，用的是简易钻机，随着向更深处推进，转而采用浮式平台。这不仅意味着他们可以一点一点地创新，也意味着早期较浅的项目能为更深、更复杂的井提供资金。"},{"id":"ch12-051","p":255,"t":"p","en":"In all of this, Brazil opened up two horizons. They chartered the deepest offshore wells yet drilled and, along the way, found some of the largest oil reserves in the world. One is in the Brazilian fields of Mero (formerly known as Libra), in the Santos Basin, about 125 miles off the coast of Rio de Janeiro. The field is almost 600 square miles wide and more than 16,500 feet deep. To drill it, Petrobras contracted with several international partners—including Shell, BP, ExxonMobil, and Statoil (the Norwegian state-owned oil company, the only such entity that operates like a private-sector firm). The drilling was incredibly complex. First, there was the depth of the waters themselves. More complicated, the biggest oil deposits weren't just below the first layer of salt, but deeper still, in what's known as the \"pre-salt formation\"-a geological feature left over from the era when the continents split apart. The oil sits underneath a layer of salt that can be more than 6,500 feet thick in some areas. For the Mero fields, that meant a total drilling depth of twenty thousand feet—far deeper than anywhere else in the world. And drilling through the salt layer is tricky, as it is made up of different types of salt, which interact differently with drilling fluid, leading to clogging drill holes and other problems known as \"salt creep.\"","zh":"在这一切之中，巴西开辟了两片新天地。他们钻出了当时最深的几口海上井，也顺带发现了世界上最大的一些石油储量。一处是桑托斯盆地（Santos Basin）的梅罗（Mero，原名利布拉／Libra）油田，位于里约热内卢海岸外约125英里。油田宽近600平方英里，水深超过16,500英尺。为了开发它，巴西石油与多家国际伙伴签约——包括壳牌、BP、埃克森美孚，以及挪威国家石油公司（Statoil，挪威国有企业，也是这类实体中唯一像私营企业那样经营的一家）。钻井作业复杂得难以想象。首先是水深本身。更麻烦的是，最大的油藏并不只在第一层盐之下，而埋得更深，位于所谓“盐下构造”（pre-salt formation）之中——那是大陆彼此分裂的时代留下的地质构造。石油之上的盐层，有些地方厚达6,500英尺以上。对梅罗油田来说，这意味着总钻井深度达两万英尺——比世界上任何地方都深。而钻穿盐层很棘手：盐层由不同种类的盐组成，它们与钻井液的反应各不相同，会造成井眼堵塞，以及“盐蠕变”（salt creep）一类的麻烦。"},{"id":"ch12-052","p":256,"t":"p","en":"But the Mero fields proved vast. Its Lula oil field alone, off of the southeast of the country, is believed to hold up to 8.3 billion barrels of recoverable oil.25","zh":"但梅罗油田之大，出乎预料。仅其东南沿海的卢拉（Lula）油田，据信就蕴藏多达83亿桶可采石油。*"},{"id":"ch12-053","p":256,"t":"p","en":"What happened in Brazil didn't stay in Brazil. Over the past decade, wherever there are continental shelves gentle enough, new drills have been tested and deployed.","zh":"巴西发生的事，没有止步于巴西。过去十年间，凡是有足够平缓的大陆架的地方，新的钻探技术都被试用、被部署。"},{"id":"ch12-054","p":256,"t":"p","en":"That includes the shallow waters of the South and East China Seas, where the estimates of oil and gas reserves are driving ferocious expansion and competition. There, it's not just the seas themselves that are hotly contested; it's also the estimates of what lies beneath them.26 At the conservative end, in 2013 the US Energy Information Administration estimated that about 11 billion barrels of oil and 190 trillion cubic feet of natural gas were held in those shallow waters.27 Even that's about the same as oil reserves in Mexico and about two-thirds of the proved natural gas reserves in Europe (without Russia).28 But an earlier estimate by the US Geological Survey estimated total discovered and undiscovered reserves at 28 billion barrels of oil and 266 trillion cubic feet of gas.29 (China's National Offshore Oil Corporation estimates that the South China Sea contains a whopping 125 billion barrels of oil and 500 trillion cubic feet of gas in undiscovered areas—but this hasn't been confirmed by other, independent studies.)","zh":"其中就包括南海与东海的浅水海域——那里对油气储量的估算，正推动着疯狂的扩张与竞争。在那里争得火热的，不只是海面本身，还有对海底究竟埋着什么的各种估算。* 最保守的估计来自2013年的美国能源信息署（Energy Information Administration）：这些浅水海域约藏有110亿桶石油和190万亿立方英尺天然气。* 即便如此，也大致相当于墨西哥的石油储量，以及欧洲（不含俄罗斯）已探明天然气储量的三分之二。* 而美国地质调查局（US Geological Survey）早先的一项估算认为，已发现与未发现储量合计为280亿桶石油、266万亿立方英尺天然气。*（中国海洋石油总公司估算，南海未探明区域蕴藏多达1,250亿桶石油和500万亿立方英尺天然气——但这一数字没有得到其他独立研究的证实。）"},{"id":"ch12-055","p":256,"t":"p","en":"The search for these potentially massive finds has added literal fuel to the fire of oceanic competition in the region. An example: Chinese and Vietnamese ships were at a standoff for four months beginning in June 2019 around a drilling rig in one of Vietnam's oil and gas blocks. On June 16, a China Coast Guard ship began harassing the rig and offshore supply vessels servicing it. Over the course of four months,","zh":"对这些可能极为巨大的发现的追寻，给该地区的海洋竞争实实在在地添了一把柴。一个例子：从2019年6月起，中国与越南的船只在越南一处油气区块的钻井平台周围对峙了四个月。6月16日，一艘中国海警船开始骚扰该平台及为其服务的海上补给船。四个月里，"},{"id":"ch12-056","p":257,"t":"p","en":"China Coast Guard vessels sailed in and out of the field to keep up the harassment.30 In the meantime, China has also developed a gigantic ten-story oil drilling platform that can dig up to five and a half miles deep, potentially for use in waters that are disputed with Vietnam.³1","zh":"中国海警船在区块内进出巡航，持续骚扰。* 与此同时，中国还建成了一座十层楼高的巨型石油钻井平台，钻深可达5.5英里，可能用于与越南有争议的海域。*"},{"id":"ch12-057","p":257,"t":"p","en":"In the East China Sea, there are also potential spots for conflict. The Energy Information Administration estimates that the sea has some 200 million barrels of oil and 30 to 60 billion cubic feet of gas; not large by international standards but meaningful for import-dependent Japan.32 But these fields are in exactly the waters that both China and Japan contest. And China has moved in, installing oil and gas platforms in contested waters over Tokyo's objections.3³3","zh":"东海同样有潜在的冲突点。能源信息署估计，东海约有2亿桶石油和300亿至600亿立方英尺天然气；按国际标准不算大，但对依赖进口的日本却意义重大。* 但这些油气田恰恰位于中日两国都主张权利的海域。中国已经动手，不顾东京的反对，在争议海域安装了油气平台。*"},{"id":"ch12-058","p":257,"t":"p","en":"Offshore oil discovery also includes the long (though narrow) continental shelf off the Bering Sea, in the high north. And here, warming seas have made the area far more accessible than was previously possible. Indeed, the combination of new technology, warming seas, and Russia's drive to retain its position as an energy superpower has made the Arctic and its littoral seas one of the most adventuresome places for offshore exploration.","zh":"海上找油还延伸到高纬度北方白令海外的狭长大陆架。在这里，变暖的海水让该地区的可进入程度远超从前。的确，新技术、变暖的海洋，加上俄罗斯力图保住能源超级大国地位的努力，三者叠加，使北极及其沿岸海域成为海上勘探中最富冒险色彩的地方之一。"},{"id":"ch12-059","p":257,"t":"p","en":"Once again, the scale is huge. Numbers are hard to come by in the Arctic, in part because it's hard to access, but in 2008 the US Geological Survey estimated that the Arctic Circle held 90 billion barrels of recoverable oil—at the time 13 percent of the world's estimated undiscovered oil resources. The USGS also estimated that it held nearly 1,700 trillion cubic feet of natural gas-of which 84 percent is offshore.34 Just as in the South and East China Seas, there is debate about how far the exclusive economic zones extend between the Arctic countries: Canada, Denmark (through Greenland), Finland, Iceland, Norway, Russia, Sweden, and the United States. In 2007, Russia famously planted a Russian flag at the ocean bottom at the North Pole, prompting concern among the other countries.3⁵ Russia, Norway, Denmark, and Canada have all made claims to the seafloor beyond the exclusive zones awarded by the United Nations Convention on the Law of the Sea.","zh":"规模同样巨大。北极的数据不易获得，部分原因是难以进入；但2008年美国地质调查局估计，北极圈内藏有900亿桶可采石油——占当时全球未探明石油资源估计量的13%。美国地质调查局还估计，那里蕴藏近1,700万亿立方英尺天然气，其中84%在海上。* 与南海、东海一样，北极各国——加拿大、丹麦（经格陵兰）、芬兰、冰岛、挪威、俄罗斯、瑞典和美国——之间专属经济区能延伸到多远，也存在争议。2007年，俄罗斯在北冰洋底插上一面俄罗斯国旗，举世皆知，引起其他国家的警觉。* 俄罗斯、挪威、丹麦和加拿大都已对《联合国海洋法公约》所划专属经济区之外的海床提出主张。"},{"id":"ch12-060","p":257,"t":"n","en":"Russian offshore drilling isn't limited to the Arctic: indeed, the largest offshore platform in the world is the Berkut oil platform, located off Russia's Pacific coast. It's illustrative of the dynamics of the energy industry that, notwithstanding the tensions between the countries in question, this platform was financed by a consortium of companies from Russia, India, Japan, and the United States.","zh":"俄罗斯的海上钻井并不限于北极：实际上，世界上最大的海上平台是别克托夫（Berkut）石油平台，位于俄罗斯太平洋沿岸外海。尤其能说明能源业运作逻辑的是，尽管相关国家之间关系紧张，这座平台却由俄罗斯、印度、日本和美国的公司组成的联合体出资兴建。"},{"id":"ch12-061","p":258,"t":"p","en":"China has also entered the arena, gaining observer status at the Arctic Council, the body that coordinates discussions among Arctic countries, and helping Russia to fund oil and gas projects in the region. As one expert summarized the Chinese position, \"We know that we don't have claims in the Arctic, but if there's anything in the Arctic that we can get, we don't want to be left out.\"36","zh":"中国也已进入这个赛场：它在北极理事会（Arctic Council，协调北极各国磋商的机构）取得观察员地位，并帮助俄罗斯为该地区的油气项目融资。一位专家这样概括中国的立场：“我们知道自己在北极没有主权主张，但北极但凡有能拿到的东西，我们都不想被落下。”*"},{"id":"ch12-062","p":258,"t":"p","en":"In fact, the Arctic has become one of the more confounding areas of Russia-China relations. On the one hand, supplies of Russian gas from the Yamal Peninsula (on the Barents coast) are designated for China, usefully adding to the diversity of its energy supply. On the other hand, China stands to gain much more, commercially, from the flow of shipping across a warming Arctic than does Russia, so China looks warily on Russia's increasing militarization of the seas. And in June 2020, with tensions between the two countries already running high around the COVID-19 crisis, Russia accused China of spying on its Arctic activities, fingering a Russian national for having (reportedly) supplied China with documentation about Russia's work on hyrdoacoustics in the Arctic—work vital for undersea energy exploration, as well as for monitoring submarine activity.37","zh":"事实上，北极已成为中俄关系中最令人困惑的领域之一。一方面，来自亚马尔半岛（Yamal Peninsula，位于巴伦支海沿岸）的俄罗斯天然气指定供应中国，为中国的能源供应增添了多样性，颇有用处。另一方面，变暖的北极一旦通航，中国在商业上所能得到的好处远多于俄罗斯，因此中国对俄罗斯在这一海域不断加强军事化心存戒备。2020年6月，两国因新冠疫情关系已然紧张，俄罗斯又指责中国刺探其北极活动，点名一名俄罗斯公民（据称）向中国提供了俄方在北极进行水声学（hydroacoustics）研究的文件——这项工作对海底能源勘探以及监测潜艇活动都至关重要。*"},{"id":"ch12-063","p":258,"t":"p","en":"And offshore drilling has expanded in the Persian Gulf—not the sands of Arabia or Iran that flank it, but the waters of the Gulf itself. Here, though, the offshore play is not oil, but gas. The region has long known of huge offshore fields of gas. But for most of the history of the fuel, it's been limited by the need to tie the extraction of gas to pipelines. As a result, for many years, natural gas has been a regional fuel, shipped from extraction fields to neighboring countries by pipeline— and thus with limited markets, and limited reach.","zh":"海上钻井也在波斯湾扩展开来——不是两侧阿拉伯半岛或伊朗的沙漠，而是海湾本身的水域。不过在这里，海上的主角不是石油，而是天然气。该地区早已知道海上有巨大的气田。但在天然气发展史的绝大部分时间里，它的开采都受制于一点：必须把气田接上管道。因此许多年里，天然气一直是一种区域性燃料，从开采气田经管道输往邻国——市场有限，触角也有限。"},{"id":"ch12-064","p":258,"t":"p","en":"Technological development changed that. Liquefied natural gas (LNG) is natural gas that's been cooled to -260 degrees Fahrenheit, the temperature at which it becomes a liquid. The volume of this liquid is six hundred times smaller than the gas.38 This allows LNG to be pumped into container vessels, then transported by sea. Just ten years ago, less than 30 percent of gas moved by sea. By 2018, almost 50 percent of the world's gas trade between regions was moved by LNG tanker.39","zh":"技术发展改变了这一切。液化天然气（LNG）是把天然气冷却到华氏零下260度——即它变成液体的那个温度。液化后的体积，只有气态的六百分之一。* 这样就可以把液化天然气泵入专用船舱，经海路运输。仅仅十年前，经海路运输的天然气还不足30%。到2018年，全球区域之间的天然气贸易中，已有近50%由液化天然气船承运。*"},{"id":"ch12-065","p":258,"t":"p","en":"These are, once again, huge ships. The first modern natural gas tanker—which had the somewhat on-the-nose name of the Methane","zh":"这同样是些庞然大物。世界上第一艘现代天然气运输船，名字起得直白得近乎不加掩饰，叫“甲烷"},{"id":"ch12-066","p":259,"t":"p","en":"Princess—was 908 feet long and capable of carrying 9,532,912 liquid gallons of gas. Fast-forward to the present day, and Qatar's Mozah is capable of carrying 70,269,765 liquid gallons of gas. (And in the still bizarre, semi-regulated world of shipping, the Mozah—named after the consort of the former emir of the country, and owned by the state of Qatar itself—flies under the flag of the Marshall Islands, where it registers its \"flag of convenience.\")","zh":"公主”号——全长908英尺，可装载9,532,912加仑液态天然气。快进到今天，卡塔尔的“莫扎”号（Mozah）能装70,269,765加仑液态天然气。（而在航运业这个依旧古怪、监管半松半紧的世界里，“莫扎”号——以卡塔尔前埃米尔的王后命名，船东就是卡塔尔国本身——却挂着马绍尔群岛的旗，在那里注册它的“方便旗”。）"},{"id":"ch12-067","p":259,"t":"p","en":"Much of this gas flows to Asia, including to Japan, which has long been a major importer of natural gas, especially from Indonesia. As Indonesia's gas fields have dried up, Japan is on the hunt for a new supply—perhaps from Myanmar, by pipeline, but also from the Persian Gulf, by sea. Japan is still thirsty for imports of gas; but by 2018, China had become the world's second-largest importer of natural gas; and its thirst is growing.40 From 2016 to 2018, the global supply of LNG increased by 28 percent, and China absorbed half of that increase.41","zh":"这些天然气大部分流向亚洲，包括日本——长期以来，日本一直是天然气进口大国，尤其依赖印度尼西亚。随着印尼气田枯竭，日本开始另寻供应——也许经管道从缅甸来，也许经海路从波斯湾来。日本对天然气进口依然渴求；但到2018年，中国已成为世界第二大天然气进口国，而且胃口还在变大。* 2016年至2018年，全球液化天然气供应量增长了28%，其中一半的增量被中国吸收。*"},{"id":"ch12-068","p":259,"t":"h","en":"Oceans of Energy","zh":"海洋能源时代"},{"id":"ch12-069","p":259,"t":"p","en":"With the liquification of natural gas and its shipment by sea, we complete the story of the growing dominance of the oceans in the world of energy.","zh":"有了天然气的液化与海上运输，海洋在能源世界里日益上升的主导地位，这个故事也就讲到了尽头。"},{"id":"ch12-070","p":259,"t":"p","en":"It's long been part of the story, of course. In the years after World War II, Saudi production, as well as Iranian production, transformed the global oil markets. But of course, the oil had to get from the Gulf to the markets, and then it had to get there by oceans, and thus began the story of oil tankers. The world's first oil tankers carried their cargo in barrels. New tankers emerged from the Suez Crisis of 1956, and the oil price spike that followed.42 Just as with containerization, the subsequent Suez Crisis in the 1970s spurred the development of much larger oil tankers.","zh":"当然，这故事由来已久。二战后的那些年，沙特与伊朗的产量改变了全球石油市场。但石油总得从波斯湾运到市场，而且必须走海路——油轮的故事由此开始。世界上最早的油轮，是把石油装进桶里运输的。1956年的苏伊士危机以及随之而来的油价飙升，催生了新一代油轮。* 与集装箱化如出一辙，1970年代那场苏伊士危机又推动了油轮向更大型发展。"},{"id":"ch12-071","p":259,"t":"p","en":"And as the scale grew, so did the pressure for standardization, much as it did with containerization. Indeed, it was tanker shipping that was the driving element in the growth of scale of modern bulk shipping. For Maersk, overseas-oriented tanker traffic was in fact the larger part of their corporate growth in the 1950s and '60s. OOCL's first truly large ship was not a container, but the Seawise Giant, which they ordered in","zh":"规模一大，标准化的压力也随之而来，与集装箱化的情况颇为相似。事实上，正是油轮运输带动了现代散货航运的规模扩张。对马士基来说，面向海外的油轮业务，实际上是1950年代和60年代公司增长中更大的那一块。东方海外（OOCL）第一艘真正的大船不是集装箱船，而是“海上巨人”号（Seawise Giant），订造于"},{"id":"ch12-072","p":260,"t":"p","en":"1974. They took delivery of the ship in 1979, just as the container revolution was gaining steam. The ship displaced 81,000 tons unloaded, and a whopping 564,000 tons when filled with oil.* It was 1,500 feet long—making it the longest ship ever constructed. In his epic account of the tanker industry, Noel Mostert wrote: \"These are the biggest ships that have ever been; their dimensions being one of the technological audacities of the century.\"43 In the 1960s and '70s, Maersk made more money delivering fuel from Saudi Arabia to Europe and the United States than from any other part of its shipping business.","zh":"1974年。1979年，东方海外接收了这艘船，正值集装箱革命方兴未艾之际。该船空载排水量81,000吨，装满石油后则高达564,000吨。* 船长1,500英尺（约457米），是史上建造过的最长的船。诺埃尔·莫斯特（Noel Mostert）在他那部记述油轮业的史诗之作中写道：“这是有史以来最大的船；它们的尺寸，是20世纪技术上的大胆创举之一。”* 1960年代和70年代，马士基把燃料从沙特阿拉伯运往欧洲和美国所赚的钱，比其航运业务其他任何部分都多。"},{"id":"ch12-073","p":260,"t":"p","en":"So the flow of oil by sea has, for the past several decades, been an important part of the energy story. Add to this the huge expansion in offshore discovery and production of oil, and then the flow by sea of gas. As of 2016, more than a quarter of the world's oil and gas supply was produced offshore, mostly in the Persian Gulf, the Gulf of Guinea, the North Sea, Brazil, the Gulf of Mexico, and the Caspian Sea.\" And this flow shows no sign of slowing: since 2010, more than half of the volume of energy discovered globally has been found offshore. In 2018, there were fifty-five such discoveries, representing 70 percent of the volumes of liquids and gas discovered. And the International Energy Agency predicts a rise of 24,720 billion cubic feet of offshore gas production by 2040. Similarly, the US Bureau of Ocean Energy Management in 2016 estimated that 90 billion barrels of undiscovered, recoverable oil and 327 trillion cubic feet of undiscovered, recoverable natural gas lay just in the US continental shelf.45","zh":"所以，过去几十年间，石油的海上流动一直是能源故事中重要的一环。再加上海上油气发现与生产的巨大扩张，以及天然气的海上运输。截至2016年，全球超过四分之一的石油和天然气供应产自海上，主要集中在波斯湾、几内亚湾、北海、巴西、墨西哥湾和里海。这一势头毫无放缓的迹象：2010年以来，全球新发现的能源储量中，一半以上来自海上。2018年，这样的发现共有55处，占当年发现的液态与气态能源总量的70%。国际能源署预测，到2040年，海上天然气产量将增加24,720亿立方英尺。同样，美国海洋能源管理局（Bureau of Ocean Energy Management）在2016年估计，仅美国大陆架就蕴藏着900亿桶未探明、可开采的石油，以及327万亿立方英尺未探明、可开采的天然气。*"},{"id":"ch12-074","p":260,"t":"p","en":"The bottom line is this: the vast majority of the world's supply of oil and gas is either found at sea or moved by sea to its destination. The story of the role of oceans in global energy trade is rarely told, but they are vital to the overall picture. Almost 80 percent of all oil consumed worldwide moves by sea at some point. And as of 2018, so does nearly 50 percent of natural gas.46","zh":"归根结底：全球绝大部分石油和天然气供应，要么产自海上，要么经海路运往目的地。海洋在全球能源贸易中扮演的角色，很少有人讲述，但它对整体图景至关重要。全世界消耗的石油中，近80%在某个环节要经由海上运输。截至2018年，天然气也有近50%经由海路运输。*"},{"id":"ch12-075","p":260,"t":"p","en":"All of which is profoundly problematic for China.47","zh":"这一切对中国来说，都是极为棘手的问题。*"},{"id":"ch12-076","p":260,"t":"p","en":"*This ship was actually ordered by a Greek shipping owner, at a smaller original size; but when early trials of the ship revealed problems with its stability, he refused to take ownership. C. Y. Tung made a deal to take over ownership of the vessel, and had it lengthened to its eventual full size. The ship was sunk during the Iran-Iraq War, but then resurfaced and was repaired to use as a fuel storage vessel.","zh":"*这艘船原本是一位希腊船东订造的，初始尺寸较小；但早期试航暴露出稳性问题，他便拒绝接收。董浩云（C. Y. Tung）谈成一笔交易，接手了这艘船的所有权，并将其加长到最终的完整尺寸。该船在两伊战争期间被击沉，后来被打捞出水，经修复后用作储油船。"},{"id":"ch12-077","p":261,"t":"h","en":"Energy Security and Choke Points","zh":"能源安全与咽喉要道"},{"id":"ch12-078","p":261,"t":"p","en":"Energy is bought and sold now as if it were a market good, like any other product on a container ship or bulk carrier. But governments don't treat energy the same way they do sneakers, or TVs, or any other elements that fill container ships. For this simple reason: blockage of their supplies of energy would cripple their economies. (These supplies also fuel the major powers' navies and armies. Indeed, the United States armed services is the largest single energy consumer in the world.) For the governments in question, energy is a strategic, not a commercial, good.","zh":"如今，能源的买卖仿佛它只是一件普通商品，与集装箱船或散货船上的任何其他货物并无二致。但各国政府对能源的态度，不同于对运动鞋、电视机，或任何装满集装箱船的货物。道理很简单：能源供应一旦被切断，经济便会瘫痪。（这些能源同样供养着大国的海军与陆军。事实上，美国武装部队是世界上最大的单一能源消费主体。）对相关政府而言，能源是战略物资，而非商业商品。"},{"id":"ch12-079","p":261,"t":"p","en":"This reality is reinforced by the role of national companies in the energy space. The media, when covering issues of energy, tends to focus on the role of the American independent majors, like Shell or Exxon-Mobil, and sometimes the European independents, like BP. A common refrain of American critics of the energy sector is that these companies are too close to government and often gain preferential treatment. But by the standards of the rest of the world, they're quite distant from government; because in the rest of the world, oil companies are actually owned or controlled by governments. That's true for Russia, for China, for Brazil, India, Saudi Arabia, Qatar, Norway, Indonesia, Venezuela, and Japan. Fully 90 percent of the world's oil and gas reserves are held by nationally owned companies. The trade and flow of energy is the business of governments and semi-government entities far more than it is of the working of the marketplace.","zh":"这一现实，因国有企业在能源领域的作用而更加凸显。媒体在报道能源问题时，往往聚焦于美国的独立大型石油公司，如壳牌或埃克森美孚，有时也关注欧洲的独立公司，如BP。美国能源界批评者常挂在嘴边的一句话是：这些公司离政府太近，常常得到优待。但按世界其他地区的标准，它们与政府的关系其实相当疏远；因为在世界其余地方，石油公司实际上是由政府拥有或控制的。俄罗斯、中国、巴西、印度、沙特阿拉伯、卡塔尔、挪威、印度尼西亚、委内瑞拉和日本，莫不如此。全世界足足90%的石油和天然气储量，掌握在国有企业手中。能源的贸易与流动，与其说是市场机制在起作用，不如说是政府及半政府实体的生意。"},{"id":"ch12-080","p":261,"t":"p","en":"Why does this matter? Because energy powers literally every other part of human activity. From agriculture, where energy is a vital input into fertilizer, as well as a source of fuel for the machinery used to harvest crops on an industrial scale; to industry, where the burning of fossil fuels is a necessary ingredient in the manufacture of steel and iron and other metals; to transportation, the largest single source of the consumption of oil; to heat, which is generated in most countries by the burning of oil or gas or coal; and even to modern industries like technology or finance, which require huge quantities of electricity that in most countries is generated primarily by the burning of oil or coal.","zh":"这为什么重要？因为能源实实在在地驱动着人类活动的一切其余部分。农业离不开它——能源是化肥的重要投入，也是规模化收割机械的动力来源；工业离不开它——燃烧化石燃料是钢铁及其他金属冶炼中不可或缺的一环；交通运输离不开它——那是石油消费最大的单一领域；供暖离不开它——多数国家的供暖靠燃烧石油、天然气或煤炭；就连科技、金融这类现代产业也离不开它——它们需要大量电力，而在多数国家，电力主要靠燃烧石油或煤炭产生。"},{"id":"ch12-081","p":261,"t":"p","en":"Nearly all projections of the world's energy use have oil and gas still accounting for the largest share of the world's energy through 2050. Indeed, the world's demand for oil and gas has been growing in the past three decades, as sea-based trade has allowed new countries to participate in globalization. Demand for energy in the world grew by 50 percent between 1990 and 2008.48","zh":"几乎所有关于世界能源使用的预测都认为，直到2050年，石油和天然气仍将占全球能源的最大份额。事实上，过去30年间，世界对石油和天然气的需求持续增长，因为海上贸易让更多新国家得以参与全球化。1990年至2008年，全球能源需求增长了50%。*"},{"id":"ch12-082","p":262,"t":"p","en":"So ensuring a steady flow of oil (and now gas) by sea is a vital concern for governments worldwide. It's why the US focused on the Middle East in the postwar era, and one reason why it has stayed involved—by many accounts, too involved—ever since. For as the Malacca Strait is the great, vulnerable choke point of container trade, the Strait of Hormuz is the great, vulnerable choke point of energy flows.","zh":"因此，确保石油（如今还有天然气）稳定地经海路流动，是世界各国政府极为关切的事。这正是战后美国聚焦中东的原因，也是它此后始终深陷其中——按许多人的说法，是陷得太深——的原因之一。正如马六甲海峡是集装箱贸易巨大而脆弱的咽喉要道，霍尔木兹海峡便是能源流动巨大而脆弱的咽喉要道。"},{"id":"ch12-083","p":262,"t":"p","en":"In the postwar period, the US Navy has deployed in ways designed to secure key choke points for the flow of oil—especially the Sixth Fleet in Haifa, and the Fifth Fleet in Bahrain, in the Persian Gulf. But as the US deploys to be able to defend key choke points, that also means that it can close them off.","zh":"战后时期，美国海军的部署方式，就是为了保障石油流动的关键咽喉要道——尤其是驻海法的第六舰队，以及驻波斯湾巴林的第五舰队。但美国既然部署力量以图保卫关键咽喉要道，这也就意味着它同样能够将这些要道封锁。"},{"id":"ch12-084","p":262,"t":"p","en":"All this reinforces China's Malacca Dilemma. Indeed, Daniel Yergin, in his epic account of the modern energy industry, The Quest, notes that Chinese premier Hu Jintao began to focus on the Malacca Dilemma just after the Iraq War-which China at the time assumed was a US move to tighten up its control of Middle Eastern energy supplies. And Beijing's focus on the Malacca Dilemma helped drive China's \"Going Out\" policy of encouraging overseas investment in the oil and gas sector.","zh":"这一切都强化了中国的马六甲困局。丹尼尔·耶金（Daniel Yergin）在他那部讲述现代能源业的鸿篇巨制《能源重塑世界》（The Quest）中指出，中国总理胡锦涛正是在伊拉克战争之后开始关注马六甲困局的——当时中国认为，那场战争是美国为加紧控制中东能源供应而走的一步棋。而北京对马六甲困局的关注，助推了中国鼓励海外油气投资的「走出去」政策。"},{"id":"ch12-085","p":262,"t":"p","en":"The Strait of Hormuz, which channels the Persian Gulf into the open ocean, carries about one-third of all global seaborne oil trade. Furthermore, more than 25 percent of global LNG trade goes through the strait.49 Much of what goes through is oil from Saudi Arabia, Iraq, and Iran to importers in Asia, Europe, and Africa. Closing the strait entirely would block around 17 percent of the global oil supply—and send prices skyrocketing.5º And China's vulnerability is particularly acute: in 2018, about 40 percent of China's crude oil imports came through Hormuz.","zh":"霍尔木兹海峡把波斯湾引向开阔大洋，承担着全球约三分之一的海运石油贸易。此外，全球超过25%的液化天然气贸易也要经过这道海峡。* 通过的货物中，很大一部分是从沙特阿拉伯、伊拉克和伊朗运往亚洲、欧洲和非洲进口国的石油。若海峡被完全封锁，全球约17%的石油供应将被阻断——油价随之飞涨。* 而中国的脆弱性尤为突出：2018年，中国约40%的原油进口经由霍尔木兹海峡。"},{"id":"ch12-086","p":262,"t":"p","en":"Hormuz is not the only energy choke point. The Malacca Strait is also key for the delivering of energy to Asia. It currently carries about 19 million barrels per day of crude oil and oil products—and is important for fuel storage, fuel blending, and ship refueling.51 There are no easy options to avoid Malacca. The Sunda Strait, between Java and Sumatra, is the nearest option, but is too shallow and narrow for large vessels. The Lombok Strait (between Bali and Lombok islands) is the most viable alternative, but doesn't have adequate infrastructure and it would increase voyage times, causing delays and adding costs.","zh":"霍尔木兹并非唯一的能源咽喉。马六甲海峡对于向亚洲输送能源同样至关重要。它目前每天承运约1,900万桶原油和成品油——并且在燃料储存、燃料调合与船舶加油方面也发挥着重要作用。* 要绕开马六甲，没有轻松的选择。爪哇与苏门答腊之间的巽他海峡是最近的选项，但对大型船舶而言太浅、太窄。巴厘岛与龙目岛之间的龙目海峡是最可行的替代路线，但缺乏足够的基础设施，而且会延长航程，造成延误、增加成本。"},{"id":"ch12-087","p":263,"t":"p","en":"(And often neglected in accounts of choke points is the Bosporus Strait-but if you're Russian, it's a key fact. As Yergin notes, \"Every day more than three million barrels per day of Russian and Central Asian oil pass through it, right down through the middle of Istanbul.\"* Remarkably, the flow of Russian oil and shipping through this channel is still governed by the relevant parties in compliance with the Treaty of Dardanelles, signed in 1809.)","zh":"（在有关咽喉要道的种种论述中，博斯普鲁斯海峡常被忽略——但如果你是俄罗斯人，这可就是一个关键事实。正如耶金所说：“每天有300多万桶俄罗斯和中亚石油通过这里，就从伊斯坦布尔的正中间穿过。”* 值得注意的是，经这条水道输送的俄罗斯石油与船舶通行，至今仍由相关各方依照1809年签署的《达达尼尔条约》管理。）"},{"id":"ch12-088","p":263,"t":"p","en":"The dependence on these straits isn't going to change anytime soon. The International Energy Agency estimates that by 2040, nearly 26 million barrels per day of oil will pass through the Strait of Malacca and 20 million through the Strait of Hormuz.52","zh":"对这些海峡的依赖，短期内不会改变。国际能源署估计，到2040年，每天将有近2,600万桶石油通过马六甲海峡，2,000万桶通过霍尔木兹海峡。*"},{"id":"ch12-089","p":263,"t":"p","en":"China's not alone in this, though. Japan is equally dependent on imports—indeed, to China's 40 percent of imports that come through Hormuz, Japan's equivalent number is 80 percent. And India is increasingly dependent on oil and gas from the Persian Gulf. Just as China's energy growth has been the major story of global oil and gas markets in the past two decades, India's will dominate the next two decades. At current rates, India's growth in energy consumption up to 2050 represents fully 40 percent of the expected total world increase in consumption.53 And already by 2030, India will be about 90 percent dependent on oil imports, most of it flowing through the Strait of Hormuz. When the US Navy contemplates energy blockades of China, these facts substantially complicate the picture.⁵4","zh":"不过，中国并非孤例。日本同样依赖进口——中国有40%的进口石油经由霍尔木兹海峡，日本的相应数字则是80%。印度也日益依赖波斯湾的石油和天然气。过去20年，中国的能源增长是全球油气市场的主线故事；未来20年，主导者将是印度。按目前的速度，到2050年，印度能源消费的增长将占全球预期消费总增量的足足40%。* 而到2030年，印度约90%的石油将依赖进口，其中大部分经由霍尔木兹海峡。当美国海军盘算对中国的能源封锁时，这些事实让整个局面变得复杂得多。*"},{"id":"ch12-090","p":263,"t":"p","en":"Back in Houston, these changes are visible in the major new oil and gas export terminals now built up along the Houston Ship Channel, as well as in nearby Louisiana. The American return to a position of net energy exporter has been widely celebrated, both by the American media and by political elites in Washington, DC. Indeed, it's become fashionable to argue that because the United States is now a net energy exporter, it's \"“independent\" from the frailties of the Persian Gulf, and no longer has to worry about energy insecurity; that the United States itself is effectively immune from the vulnerabilities in Middle Eastern choke points.","zh":"回到休斯敦，这些变化在休斯敦航道（Houston Ship Channel）沿线新建的大型油气出口码头，以及邻近的路易斯安那州，都清晰可见。美国重新回到能源净出口国的地位，受到美国媒体与华盛顿特区政治精英的广泛称颂。事实上，一种论调已蔚然成风：既然美国如今已是能源净出口国，它便「独立」于波斯湾的种种脆弱之外，不必再为能源不安全而担忧；美国本身实际上已对中东咽喉要道的脆弱性免疫。"},{"id":"ch12-091","p":263,"t":"n","en":"From Daniel Yergin, The Quest, 283. For a vivid account of the changing dynamics o
