r fighters; penetrating Chinese airspace; evading Chinese air defenses; evading or surviving combat with the (very sophisticated) Chinese air force; and successfully targeting and striking Chinese assets on land. Now, striking targets on land is easier than hitting them at sea, but it is far from foolproof. As one expert in this field notes, “Getting a weapon to the right place at the right time is just the last step in a long chain of inference.\" China would take substantial measures to shield its missiles, to confuse American tracking, and to stop American jets from successfully flying over Chinese territory. Most analysts believe that ultimately the United States would be successful in its efforts to take out the missile launchers. But that necessarily involves hitting targets on the Chinese mainland, which takes what might once have been a limited encounter between two navies at sea right to the edge of fullblown war with the Chinese PLA.","zh":"第二种方案——在近海岛屿或中国大陆的基地上摧毁那些导弹——既复杂又危险。它要求美国投入远程打击战斗机、远程导弹，或前沿部署的空军战机；突入中国领空；躲过中国的防空系统；在与（极为老练的）中国空军交战中脱身或生存下来；并成功锁定、打击中国陆上目标。打击陆上目标比打击海上目标容易，但远非万无一失。正如这一领域的一位专家所说：“把一件武器在恰当的时间送到恰当的地点，只是一条漫长推断链上的最后一步。”中国会采取大量措施保护其导弹、迷惑美国的跟踪，并阻止美国战机顺利飞越中国领土。多数分析人士认为，美国最终能够成功打掉那些导弹发射装置。但那必然意味着要打击中国大陆的目标，这就把原本可能只是两国海军在海上的一次有限交锋，直接推到了与中国解放军全面开战的边缘。"},{"id":"ch10-065","p":212,"t":"p","en":"And so the third option-shooting down Chinese missiles in flight—is a hugely preferable option. If it can be done reliably. If the United States can successfully, repeatedly, shoot down Chinese missiles, it limits the game-changing feature of China's anti-ship system. And we go back to ship-to-ship competition, where the US Navy has a vital technological and qualitative edge over its Chinese competitors.","zh":"于是第三种方案——在飞行途中击落中国导弹——就显得可取得多。前提是它能可靠地做到。如果美国能够成功、反复地击落中国导弹，中国反舰体系中那个改变游戏规则的特点就被限制住了，较量又回到舰对舰的层面——在那里，美国海军对中国对手握有至关重要的技术与质量优势。"},{"id":"ch10-067","p":212,"t":"p","en":"This approach has its skeptics. Some of them are former Department of Defense officials closely involved with the original arguments around Air-Sea Battle, who argue that to defeat American anti-ballistic missile defenses, the Chinese (or even the North Koreans) could simply barrage American ships with \"garbage missiles\" until the American supply of SM-6 missiles was exhausted—and then target American ships with higher-quality munitions.","zh":"这套思路也有怀疑者。其中一些是国防部的前官员，当年深度参与过围绕空海一体战的辩论。他们认为，要破解美国的反导防御，中国（甚至朝鲜）只需用“垃圾导弹”对美国军舰实施饱和攻击，直到美军的SM-6导弹库存耗尽——然后再用更高质量的弹药打击美国军舰。"},{"id":"ch10-068","p":212,"t":"p","en":"For this reason, the navy's research establishment is experimenting with weapons that can be fired more frequently, like high-powered microwave, electrical, and laser weapons. That sounds like a sci-fi novel, but there's long been research on such weapons, and new tests are advancing the capacity for missile-targeting with lasers. One senior defense official originally involved in the Air-Sea Battle concept argues that \"We need to be doing a Manhattan Project on electronic weapons; and we're not.\"13 Others are focused on railguns.\" Watts himself is more skeptical of those: \"It's the technology of the future, and always will be.\"14 But there have been recent breakthroughs in laser weapons tested at sea.","zh":"正因如此，海军的研究机构正在试验可以更频繁发射的武器，比如高功率微波武器、电武器和激光武器。这听起来像科幻小说，但此类武器的研究已进行了很久，新的试验正在提升用激光锁定导弹的能力。一位最初参与空海一体战构想的国防部高级官员主张：“我们需要在电子武器上搞一个曼哈顿计划；而我们并没有。”¹³ 另一些人则把希望寄托在电磁炮上。沃茨本人对这些更持怀疑态度：“这是未来的技术，而且永远是未来的技术。”¹⁴ 不过，近来在海上试验的激光武器确已取得突破。"},{"id":"ch10-069","p":212,"t":"p","en":"*A railgun looks like a large, square cannon; it uses parallel metal conductors (they look like railroad tracks, hence the name) and an electrical current flowing down one side, to generate electromagnetic force that launches a projectile at very high speed. Most railgun projectiles do not contain explosives, but rather rely on the speed and kinetic energy to inflict damage.","zh":"*电磁炮看上去像一门方形的大炮；它用两根平行的金属导轨（样子像铁轨，名字由此而来），让电流沿一侧流下，产生电磁力，把弹丸以极高速度射出。多数电磁炮弹丸不装炸药，而是靠速度与动能造成毁伤。"},{"id":"ch10-070","p":213,"t":"p","en":"Whatever weapons systems are involved, Air-Sea Battle also requires something that sounds very mundane but is in fact equally hard: the integration of combat services. The core idea behind the concept of Air-Sea Battle is that tight communication between air force and naval operations, with each service playing an enabling role for the other, can substantially extend the range, accuracy, and punch of the other.*","zh":"无论涉及何种武器系统，空海一体战还要求一件听起来平淡无奇、实则同样困难的事：各军种的融合。空海一体战构想的核心理念是：空军与海军的作战行动紧密协同，彼此为对方创造条件，就能大幅延伸对方的作战距离、精度与打击力。＊"},{"id":"ch10-071","p":213,"t":"p","en":"In real terms, integrated air and naval operations would give the United States the ability to do the following (very difficult) things. The US Air Force could conduct “counter-space\" operations—basically, attacking Chinese satellites—to blind China's space-based ocean surveillance systems; that would improve operational freedom for the US Navy. The navy's Aegis ships could then sail forward to supplement ground-based missile-defense assets to improve the security of US Air Force bases in Japan and elsewhere along the Near Seas perimeter. Navy submarines and carrier-based strike groups could then conduct attacks on Chinese missile outposts in the South and East China Seas, enabling further US Air Force strikes. Then the air force could conduct long-range strikes designed to destroy PLA maritime surveillance systems, and to destroy ground-based ballistic missile launchers. That would again expand the navy's freedom of maneuver and reduce strikes on US and allied bases. The navy's carrier-based fighters could then launch a wave of attacks against what's known as the Intelligence, Surveillance, and Reconnaissance platforms of the Chinese forces— their tracking and targeting instruments—-thereby enabling air force tankers and support aircraft to move deeper into the Near Seas. And finally the air force could support anti-submarine warfare through offensive mining by stealth bombers.¹⁵ All this effort would enable the US to roll back PLAN positions across the breadth of the Near Seas.","zh":"具体说来，空海一体化作战将使美国有能力做成以下这些（极为困难的）事。美国空军可以实施“反太空”作战——基本就是攻击中国的卫星——致盲中国天基海洋监视系统，从而扩大美国海军的行动自由。海军的“宙斯盾”舰随后可以前出，补充陆基导弹防御力量，加强对驻日美国空军基地以及近海周边其他基地的防护。海军的潜艇与航母打击群接着可以攻击中国在南海和东海的导弹前哨，为空军进一步打击创造条件。然后空军可以实施远程打击，摧毁解放军的海上监视系统，摧毁陆基弹道导弹发射装置；这又会扩大海军的机动自由，减少对美军和盟国基地的打击。海军的舰载战斗机随后可以对中国军队所谓“情报、监视与侦察”平台——即其跟踪与瞄准的工具——发起一波攻击，从而使空军的加油机与支援飞机得以深入近海。最后，空军可以通过隐身轰炸机攻势布雷，支援反潜作战。¹⁵ 这一整套行动，将使美国得以把解放军海军在近海全境的前沿部署逐步逼退。"},{"id":"ch10-072","p":213,"t":"p","en":"But once launched, this \"battle of networks\" or “systems war\" likely becomes a full-blown war between the American and Chinese armed forces.","zh":"但一旦打响，这场“网络之战”或“体系战”，很可能就变成美中两国武装力量之间的全面战争。"},{"id":"ch10-073","p":213,"t":"p","en":"*All of this is still conceptual, and much debated, and so there are as many versions of Air-Sea Battle as there are analysts working through its details. The following paragraphs represent the core of what many analysts see as the principal elements of Air-Sea Battle, but there are also lots of skeptics about the ability of the navy or the air force to actually pull this off—let alone of Congress to adequately fund the necessary purchases of equipment.","zh":"＊所有这一切仍停留在构想层面，且争议甚多；因此，空海一体战有多少分析者去推敲细节，就有多少个版本。下面几段所述，是许多分析者所认为的空海一体战核心要素，但也有不少人怀疑海军或空军是否真能办到——更不用说国会能否为必需的装备采购拨足经费。"},{"id":"ch10-074","p":214,"t":"h","en":"America's Hard Choices","zh":"美国的艰难抉择"},{"id":"ch10-075","p":214,"t":"p","en":"Unsurprisingly, there's been a heated debate within the American strategic community about the feasibility (and the cost) of the Air-Sea Battle plan.16 But it's also about the wisdom of even contemplating it.","zh":"毫不意外，美国战略界围绕空海一体战方案的可行性（以及成本）展开了激烈辩论。¹⁶ 但辩论也关乎：是否该动这个念头。"},{"id":"ch10-076","p":214,"t":"p","en":"At the end of Part I, we highlighted the fact that the United States pays the bulk of the costs of securing the freedom of trade even as other nations profit handsomely from it. Skeptics ask the question this way: Why should the United States pay for the security of trade when countries like Japan, the third-richest country in the world, profit so hugely from it? Going further, a growing body of skeptical opinion in Washington asks: Why should the United States put itself at risk of war with China to secure the Western Pacific, when all of its allies in that region profit from freedom of the seas there? During his term, President Trump made this question explicit in his negotiations with the Japanese: at the very least, he argued, Japan should pay the full cost of the American forward presence in its waters.","zh":"本书第一编结尾，我们强调过这样一个事实：保障贸易自由的成本，大部分由美国承担，受益的却是别国。怀疑者这样发问：日本是世界第三富国，从贸易中获利如此之巨，凭什么要美国为贸易的安全买单？再进一步，华盛顿越来越多的怀疑意见问道：美国在那一地区的盟友都从西太平洋的航行自由中获益，凭什么要美国为守住西太平洋而冒与中国开战的风险？特朗普总统在任期间，在与日方的谈判中把这个问题挑明了：他主张，至少日本应当全额承担美国在其海域前沿存在的费用。"},{"id":"ch10-077","p":214,"t":"p","en":"But the issue is a difficult one. If the United States chose to pull back from its commitments to the security of Japan (and perhaps similarly Korea), there are two distinct possibilities of what would happen next. One is that Japan and China could find a way to get along, despite a long-running rivalry. They are, after all, each other's largest trading partners and despite mounting strategic tensions, they continue to deepen their economic ties. But that's no guarantee of peace. It's also possible that Japan and China could end up in a hot war at sea—pitting the world's second- and third-largest economies against each other, massively disrupting the global economy and roiling the most important shipping lanes in the world—shipping lanes on which the American economy now vitally relies. That conflict would also roil the entire North Asian region. Defense of the freedom of commerce in Asian waters has been central to America's security concept since the middle of the nineteenth century, and its importance has only grown in the modern era.¹7 And the wider the Chinese naval reach grows, the more reasons the United States would have to blunt it.","zh":"可这个问题并不好回答。假如美国选择从它对日本安全（或许还有韩国）的承诺中抽身，接下来会发生什么，有两种截然不同的可能。一种是，日本与中国尽管长期互为对手，却仍能找到相处之道。毕竟两国互为最大的贸易伙伴；战略紧张虽在加剧，经济联系却仍在加深。但这并不等于和平有了保障。另一种可能是，日中两国最终在海上打一场热战——把世界第二大与第三大经济体摆到对立面上，重创全球经济，搅乱世界上最重要的几条航道，而美国经济如今恰恰严重依赖这些航道。这场冲突还会搅动整个北亚地区。自19世纪中叶以来，维护亚洲海域的贸易自由就一直是美国安全构想的中心内容，到了当代，其重要性只增不减。¹⁷ 而中国海军的触角伸得越远，美国要把它钝化的理由就越多。"},{"id":"ch10-078","p":215,"t":"p","en":"By around 2016, many observers in Southeast Asia warned that China was gradually gaining the upper hand in the Near Seas. Certainly, China had increased its capacity to impose substantial costs on the US Navy in times of war. But to military observers, China had also gained \"escalation dominance\"—that is to say, it has the ability to prevail at several different levels of conflict, and ratchet up its response if need be. To countries like Singapore and Japan, who rely on the protection of the US Navy, this was a deeply worrying development.","zh":"到2016年前后，东南亚的许多观察人士警告说，中国正在近海逐渐占据上风。中国确实增强了在战时让美国海军付出重大代价的能力。但在军事观察家看来，中国还获得了“升级主导权”——也就是说，它有能力在几个不同的冲突层级上占得上风，并在必要时把回应进一步加码。对新加坡、日本这样依赖美国海军保护的国家来说，这一动向令人深感不安。"},{"id":"ch10-079","p":215,"t":"p","en":"At one level, it's also deeply unsurprising. After all, we are talking about a series of bodies of waters immediately off the Chinese coast, and at least seven thousand miles from the Pacific border of the United States (excepting Hawaii). A fast cruiser steaming at a sustainable speed of twenty knots would take about fourteen days to reach Woody Island (in the South China Sea, site of China's first reported missile installation in those waters) from the US Naval Base in San Diego. China could take myriad types of actions within comfortable range of its shore before the United States could even seriously start to reinforce its presence.","zh":"从某个层面说，这也丝毫不令人意外。毕竟，我们说的是紧贴中国海岸的一系列海域，距美国太平洋边界（夏威夷除外）至少 7,000 英里。一艘巡洋舰以20节的持续航速行驶，从圣迭戈的美国海军基地出发，大约要14天才能抵达永兴岛（Woody Island，位于南海，是中国据报在该海域首次部署导弹的地方）。美国甚至连认真着手增援都还没开始，中国就已经可以在自家海岸附近的舒适范围内采取五花八门的行动。"},{"id":"ch10-080","p":215,"t":"p","en":"But for American strategic planners, the deeper concern was in the inexorable, escalatory logic of military affairs: the sense that, as China improved its capacity for integrated operations in the Near Seas, and its capacity to defend those operations from \"counter-insurgency\" by the US Navy in the Western Pacific, it was in effect giving itself the building blocks of a genuinely global blue-water navy. By roughly 2015, China was showing every sign of moving in that direction—engaging in port visits, long-range ship trials, and weapons developments that many believed could only be explained by an ambition to deploy naval capacity far beyond the Western Pacific. And at the same time, the costs kept growing for the United States to maintain a sufficient fleet in the Near Seas and address China's relentless strategic escalation. And so US thinking turned to two new tactics to confront the Chinese. One was to turn back to a key instrument of American military superiority during the Cold War: the nuclear submarine. The other was a tactic to hurt the Chinese at lower costs—by blockading Chinese ports.","zh":"但对美国的战略规划者来说，更深一层的忧虑在于军事事务中那种不可阻挡的升级逻辑：他们感到，随着中国提高在近海实施一体化作战的能力，也提高了为这些行动抵御美国海军在西太平洋“反叛乱”式打击的能力，中国实际上是在为自己积攒一支真正全球性蓝水海军的构件。到2015年前后，中国在各方面都显示出朝这个方向前进的迹象——港口访问、远洋试航、武器研发，而在许多人看来，这些举动只能用一种野心来解释：把海军力量投送到远超西太平洋的地方。与此同时，美国要在近海维持一支规模足够的舰队、应对中国毫不放松的战略升级，成本也在不断攀升。于是美国的思路转向两种新战术来对付中国。一是重新拾起冷战时期美国军事优势的一件关键工具：核潜艇。另一种是以较低成本打击中国的战术——封锁中国港口。"}],"notes":[]},{"id":"ch11","label":"Chapter 11","labelZh":"","title":"To Conquer the Seas","titleZh":"第十一章　征服海洋","part":"Part III: The Flag Follows the Trade","showPart":false,"partZh":"第三部","partTitleZh":"旗帜跟着贸易走","paras":[{"id":"ch11-001","p":216,"t":"p","en":"“How should we not continue to conquer the sea?\" —C. Y. Tung, 1954 Entry, Personal Diaries, C. Y. Tung Museum","zh":"“我们怎能不继续征服海洋？”——董浩云，1954年日记，董浩云博物馆藏《个人日记》"},{"id":"ch11-002","p":216,"t":"p","en":"Mahan described maritime power as involving commercial reach, adequate ships, and a network of ports. By 2015, that China had acquired the first two measures of power was beyond doubt. But for the officers and scholars at the Naval War College debating the question of Chinese intentions, the question of China's access to global bases remained. Without them, China could pose only a limited, regional threat to American strategy. This helps explain why the officers and scholars were so focused on a striking development in a region that otherwise attracts limited attention from the United States—the Red Sea, off the Indian Ocean, lying between Asia and Africa.","zh":"马汉认为，海上力量包含三样东西：商业触角的延伸、足够的船舶，以及一张港口网络。到2015年，中国已经具备前两项，这一点毋庸置疑。但在海军战争学院，那些争论中国意图的军官和学者始终绕不开另一个问题：中国能不能用上遍布全球的基地。没有这些基地，中国对美国战略所能构成的威胁就只能是有限的、区域性的。这也解释了，为什么这些军官和学者会如此关注一个本来不太受美国注意的地区所发生的一件引人注目的事——红海。红海位于印度洋外侧，横亘在亚洲与非洲之间。"},{"id":"ch11-003","p":216,"t":"p","en":"Perim Island is a small, crab-shaped island in the Red Sea, two miles deep and three miles wide. It has limited plant life and no animals. Nor does it have a single source of potable water, and hence no long-standing human settlement. And yet, Perim has been the source of an amazing amount of political tension over time. It was written about by Pliny the Elder, the Roman historian who in 77 BCE published the Naturalis Historia, under the name of the island of Diodorus. Not much is known about its history during the Dark Ages, but in 1513, as part of their effort to dominate the spice trade, the Portuguese seized Perim. They con-","zh":"丕林岛（Perim）是红海中一座形似螃蟹的小岛，纵深2英里，宽3英里。岛上植被稀少，没有动物，也没有一处能饮用的水源，因此从未形成长久的人类聚落。然而正是这座岛，历史上引发过数量惊人的政治紧张。罗马史学家老普林尼（Pliny the Elder）在公元77年刊行《博物志》（Naturalis Historia），书中就写到过它，称之为“狄奥多罗斯岛”。关于它在黑暗时代的历史，人们所知甚少；但1513年，葡萄牙人为夺取香料贸易的主导权，占领了丕林岛。他们一"},{"id":"ch11-004","p":217,"t":"p","en":"trolled it until the mid-1700s, when the Red Sea became again a zone of contest, between the French and Ottomans. And in 1799, the island was briefly occupied by the British East India Company. The British did not sustain their presence, but fifty years later would resume it, when they got wind of the French construction of the Suez Canal. During the First World War, British forces in Perim came under attack by the Turks. The British maintained control of Perim and nearby Aden until 1967, when the island became part of the independent nation of the People's Republic of South Yemen. In 1971, the Marxist government of South Yemen allowed a Palestinian terrorist group, the People's Front for the Liberation of Palestine (PFLP), to use Perim as a base for an attack on an Israeli commercial vessel sailing up the Rea Sea to Aqaba/Eilat. And during the Cold War, Perim and Aden were a base for the Soviet navy.","zh":"直控制着这座岛，直到18世纪中叶，红海再度成为法国人与奥斯曼人争夺的战场。1799年，英国东印度公司曾短暂占据该岛。英国人没有长期驻守，但五十年后，当他们风闻法国人正在修建苏伊士运河，就又回来了。第一次世界大战期间，驻守丕林的英军遭到土耳其人攻击。英国对丕林和邻近的亚丁的控制一直维持到1967年，那一年该岛成为独立的南也门人民共和国的一部分。1971年，南也门的马克思主义政府允许巴勒斯坦恐怖组织“解放巴勒斯坦人民阵线”（PFLP）以丕林为基地，袭击一艘沿红海上行、驶往亚喀巴／埃拉特的以色列商船。冷战期间，丕林和亚丁还曾是苏联海军的基地。"},{"id":"ch11-005","p":217,"t":"p","en":"Why should this barren isle be fought over so prodigiously? The simple answer is: geography. Perim Island lies right in the middle of the Bab el-Mandeb, or the Gate of Tears—a narrow passage that lies at the opening of the Gulf of Aden to the Indian Ocean. Put differently: it's the key passageway between the Indian Ocean and the Red Sea, which buts up against the Sinai Peninsula and the Suez Canal, the choke points from which empires and states have sought to patrol and control the flow of goods between the European and Asian worlds.","zh":"这座荒岛为什么会被如此激烈地反复争夺？答案很简单：地理位置。丕林岛正卡在曼德海峡（Bab el-Mandeb）中间——这道海峡又名“泪之门”，位于亚丁湾通向印度洋的开口处。换个说法：它是印度洋与红海之间的关键通道，而红海又紧抵西奈半岛和苏伊士运河。正是这些咽喉要道，让历代帝国和国家都想在此巡弋，掌控欧亚两个世界之间的货物流转。"},{"id":"ch11-006","p":217,"t":"p","en":"And so it provoked more than a few raised eyebrows when a new sea power chose to take over a port and build out a logistical hub, not on Perim itself but on the eastern coast of Djibouti, just eight miles away from Perim. In August 2017, China opened what it termed a \"Chinese PLA Operations Support Base\"—China's first overseas military installation, and the first time since the 1450s that Chinese naval ships had been based in the Indian Ocean.","zh":"所以，当一个新的海上强国选择接管一座港口、建起一处后勤枢纽，而且不在丕林岛上，而在8英里外的吉布提东海岸时，难免让不少人皱起了眉头。2017年8月，中国启用了它所称的“中国人民解放军驻吉布提保障基地”——这是中国首个海外军事设施，也是自15世纪50年代以来中国军舰首次以印度洋为母港。"},{"id":"ch11-007","p":217,"t":"p","en":"China argued that it was simply expanding its capacity to support the counter-piracy operations and to protect its overseas interests. In 2015, it issued a government white paper that spelled this out: \"The security of overseas interests concerning energy and resources, strategic sea lines of communication (SLOCs), as well as institutions, personnel, and assets abroad, has become an imminent issue.\"¹ In essence, Beijing was arguing that the Djibouti installation was simply designed to protect China's economic interests. But it's hard to deny the significance of the location.²","zh":"中国表示，这不过是扩大了自身支持反海盗行动、保护海外利益的能力。2015年，中国政府发布国防白皮书，把这一点讲得很明白：“海外能源资源、海上战略通道以及海外机构、人员、资产的安全问题日益凸显。”¹ 实质上，北京是在说，吉布提这处设施纯粹是为了保护中国的经济利益。但它的选址意义，却很难否认。²"},{"id":"ch11-008","p":218,"t":"h","en":"Strategic Strong Points","zh":"战略支点与港口网络"},{"id":"ch11-009","p":218,"t":"p","en":"The United States came out of World War II with a world-dominant navy, a network of allies, a long history of naval deployments in Asia, and access to many of the Royal Navy's far-flung network of bases, logistical facilities, and fueling stations. China had none of these. But what China has built, in spades, is economic and commercial ties. And one of the world's largest and most extensive infrastructure lending programs. Over the past several years, China has turned those assets into an important network of ports—not quite the same thing as bases, but an important step in that direction.³","zh":"美国走出二战时，拥有一支世界无敌的海军、一个盟友网络、在亚洲长期部署海军的历史，以及英国皇家海军遍布远方的基地、后勤设施和加油站的准入权。这些中国一样都没有。但中国大规模建起来的，是经贸纽带，还有世界上规模最大、覆盖面最广的基础设施贷款计划之一。过去几年，中国把这些资产转化为一张重要的港口网络——它并不等同于军事基地，却是朝那个方向迈出的重要一步。³"},{"id":"ch11-010","p":218,"t":"p","en":"Much of this has been developed through its infamous Belt and Road Initiative, a network of infrastructure investments, port investments, and political relationships with countries at the terminus of key sea-lanes of communication. Among them was the commercial port of Hambantota, Sri Lanka, to which China was given a ninety-nineyear lease after the Sri Lankan government struggled to pay back the debt on Chinese loans it had used to build the port; Piraeus, Greece, just across from the Suez Canal; Haifa, Israel, also close to the Suez and very close to Russia's base in Tartus, Syria; in Gwadar, Pakistan, relatively close to the Strait of Hormuz; Curitiba, Brazil, Brazil's most profitable port terminal; Bruges, Belgium; and Casablanca, Morocco. Some of these are self-evidently commercial, and have no clear strategic function. But others are certainly amenable to \"dual use.\"","zh":"其中很大一部分，是通过那项声名在外的“一带一路”倡议铺开的：一整套基础设施投资、港口投资，以及同关键海上通道终点国家之间的政治关系。名单上有斯里兰卡汉班托塔的商业港——斯里兰卡政府无力偿还为建设该港所借的中国贷款，只好把港口以99年租约交给中国；有与苏伊士运河隔海相望的希腊比雷埃夫斯；有同样靠近苏伊士、并且离俄罗斯在叙利亚塔尔图斯的基地很近的以色列海法；有距霍尔木兹海峡不算太远的巴基斯坦瓜达尔；有巴西最赚钱的码头库里蒂巴；有比利时布鲁日；还有摩洛哥卡萨布兰卡。其中一些显而易见是商业性的，并无明确的战略功能。但另一些则完全可以“军民两用”。"},{"id":"ch11-011","p":218,"t":"p","en":"Rush Doshi, who had plumbed a unique archive of Chinese Communist Party sources, notes that China had also officially adopted a doctrine to allow those economic hubs to be rapidly reinforced by China's marines, to serve the function of protecting Chinese citizens overseas and Chinese economic interests.4 Of course, that's entirely legitimate and consistent with an overarching strategy of defense of trade; but could it be the thin edge of the wedge in a militarization of China's network of ports?","zh":"杜如松（Rush Doshi）曾深挖过一批独特的中国共产党文献档案，他指出，中国还正式采用了一套学说，允许由海军陆战队迅速增援这些经济枢纽，以履行保护海外中国公民和中国经济利益的职能。⁴ 这当然完全正当，也与保护贸易的总体战略一脉相承；但它会不会成为中国港口网络军事化的第一道楔子？"},{"id":"ch11-012","p":218,"t":"p","en":"One concept that seemed to square the circle between China's commercial approach and its military potential is the notion of what's known as \"strategic strongpoints.\"s These are foreign ports that hold special value for their economic functions and are operated by Chinese firms. There are at least seventy global ports in which Chinese firms have equity or operating leases.6 With its network of China-friendly or Chinese state-owned enterprise-run commercial facilities, Chinese forces operating abroad could stop at these ports to receive supplies and other services and thus help extend China's projection capabilities by shortening resupply time and by providing a Chinese presence.7 And if Djibouti is an example, they could be rapidly expanded from commercial installations to naval ones. In December 2016, PLAN commander Admiral Wu Shengli spoke about these ports during an event commemorating the eighth anniversary of China's anti-piracy operations off the Horn of Africa: \"We must give full play to the supporting role of the overseas support system to carry out larger scale missions in broader areas and the shape the situation.\"8 That's China's bureaucratic-speak for preparing to fight wars in the far seas.","zh":"有一个概念似乎能把中国的商业路径与它的军事潜力对接起来，那就是所谓的“战略支点”。⁵ 这类支点是具有特殊经济价值、由中国企业运营的外国港口。全球至少有70座港口有中国企业持股或持有经营租约。⁶ 有了这张由对华友好方或中国国有企业运营的商业设施组成的网络，中国的海外用兵部队可以在这些港口停靠补给、获得各种服务，从而缩短再补给时间、维持中国的存在，扩大自身的投送能力。⁷ 而如果吉布提可以作样本，这些设施能够迅速从商业用途扩建为海军用途。2016年12月，中国海军司令员吴胜利上将在纪念中国在非洲之角海域开展反海盗行动八周年的活动上谈到这些港口：“必须充分发挥海外保障体系的支撑作用，在更广阔的区域执行更大规模的任务、塑造态势。”⁸ 用中国官场的话说，这就是在为远海作战做准备。"},{"id":"ch11-013","p":219,"t":"p","en":"China appears, in fact, to be following the model of the English East India Company. When the East India Company received its charter from Queen Elizabeth I at the dawn of the seventeenth century, its focus was on building trade relations. But the flag soon followed. China seems to be pursuing a similar model, with trade leading the way-and, potentially, the military not far behind. Or as two China scholars put it: \"The flag lags, but follows.\"9","zh":"事实上，中国似乎正在效法英国东印度公司。17世纪初，东印度公司从伊丽莎白一世女王手中取得特许状时，重心是建立贸易关系。但旗帜很快就跟了上来。中国似乎在走同一条路：贸易先行，军队则可能紧随其后。或者用两位中国问题学者的话说：“旗帜滞后，但终会跟上。”⁹"},{"id":"ch11-014","p":219,"t":"p","en":"China is already flexing its military muscles at some of these overseas strong points—especially with its submarines, which have been spotted at ports far from the Near Seas. In 2016, a Chinese submarine made a port call in Karachi, Pakistan, China's most important ally.¹º In 2017, Chinese attack submarines conducted port calls in Sepanggar, Malaysia. Chinese subs have also been increasingly spotted in the Indian Ocean—in 2013, China confirmed that a nuclear attack sub would make its way across the ocean to carry out anti-piracy missions in the Gulf of Aden.\" And China tried but ultimately failed to get Sri Lanka to host a port call in Colombo, in the heart of the Indian Ocean.12","zh":"中国已经在其中一些海外支点上展示军力——尤其是潜艇，它们出现在远离近海的港口。2016年，一艘中国潜艇停靠中国最重要的伙伴巴基斯坦的卡拉奇。¹⁰ 2017年，中国攻击型潜艇停靠马来西亚实邦加（Sepanggar）。中国潜艇在印度洋的露面也越来越频繁：2013年，中国证实一艘核动力攻击潜艇将穿越印度洋，赴亚丁湾执行反海盗任务。¹¹ 中国还试图让斯里兰卡允许其在印度洋中心的科伦坡停靠，但最终未能如愿。¹²"},{"id":"ch11-015","p":219,"t":"p","en":"These PLAN moves, and the mounting distrust of Chinese intent, have caused America to contemplate the aforementioned countermeasures of blockades and submarines.","zh":"中国海军的这些动作，加上外界对中国意图日渐加深的不信任，促使美国开始考虑前面提到的两种反制手段：封锁与潜艇。"},{"id":"ch11-016","p":220,"t":"h","en":"Blockading the Chinese","zh":"对华封锁的两种方案"},{"id":"ch11-017","p":220,"t":"p","en":"Blockades are a tested tactic of naval warfare. The British blockaded France continuously from 1773 to 1802, and again from 1804 to 1814, ultimately helping Britain to defeat France in the Napoleanic Wars. Britain also blockaded the United States during the Revolutionary War, and again during the War of 1812. (With less favorable outcomes for London.) During the Civil War, the Union mounted a naval blockade of the Confederacy both to impose shortages and to prevent reinforcements from European powers. And Britain and the United States blockaded Japan in the 1930s in response to its invasion of China, and then again after it allied itself to Nazi Germany.","zh":"封锁是海战中被反复验证过的战术。英国从1773年到1802年、又从1804年到1814年持续封锁法国，最终帮助英国在拿破仑战争中击败法国。独立战争期间，英国封锁了美国；1812年战争期间，又封锁了一次。（对伦敦来说，结果不那么理想。）美国内战期间，北方联邦对南方邦联实施海上封锁，既制造物资短缺，也阻止欧洲列强增援。20世纪30年代，英国和美国因日本侵略中国而对其实施封锁；日本同纳粹德国结盟后，封锁又一次重启。"},{"id":"ch11-018","p":220,"t":"p","en":"China is quite vulnerable to a potential blockade. In 2018, trade made up 38 percent of China's GDP,13 and 64 percent of that maritime trade went through the South China Sea. Add the Yellow Sea and the East China Sea and the numbers go up still further.¹4 So if the United States and its allies could actually succeed in stopping shipping from reaching Chinese shores, it could cripple the Chinese economy.","zh":"中国相当经不起封锁。2018年，贸易占中国GDP的38%，¹³ 其中64%的海上贸易要经过南海。再加上黄海和东海，比例还要更高。¹⁴ 因此，如果美国及其盟友真能阻断驶抵中国海岸的航运，就有可能重创中国经济。"},{"id":"ch11-019","p":220,"t":"p","en":"What would a blockade look like? Historically, there have been two kinds. First is a close blockade, which takes place close to the coasts of the target country. That involves placing warships just off of an enemy's shore to search all incoming and outgoing merchant ships (as the British did with the United States before the breakout of the War of 1812). The second option is a distant blockade, which involves stationing warships farther away from the coasts, along sea-lanes, and then choking off trade in a similar manner—by searching all incoming and outgoing merchant ships. The trade-offs are simple: the farther away you are from the target nation's coast, the less exposed you are to counterattack; but the more you risk allowing ships to route around you or slip through the blockade.","zh":"封锁会是什么样子？历史上有两种。第一种是近距离封锁，在目标国海岸附近实施：把军舰摆在敌方近岸，登临检查所有进出港的商船（1812年战争爆发前，英国对付美国就是这么做的）。第二种是远距离封锁：把军舰部署在离海岸更远的航道上，再用同样的办法掐断贸易——检查所有进出的商船。两者的取舍很简单：离目标国海岸越远，遭反击的风险越小；但船只有可能绕开你，或从封锁的缝隙里溜过去，这个风险就越大。"},{"id":"ch11-020","p":220,"t":"p","en":"Several American think tanks and defense contractors have undertaken studies about how a blockade could be implemented. A major study by RAND looked at how the US could close off the Malacca Strait, as well as the nearby straits of Sunda and Lombok (mostly used by oil tankers).1⁵ A study led by Jan van Tol, a former naval captain who served as a special adviser in the vice president's office and as a military assistant to the famous Pentagon strategist Andy Marshall (known as \"Yoda\"), argued that distant blockade operations could require disrupting Chinese undersea telecommunications lines; and seizing/ destroying Chinese undersea energy infrastructure.16 And studies of potential blockade scenarios were published in the navy's semi-official journal, Proceedings. Chinese planners tracking the American navy saw a surge of such writings in the 2010 to 2014 period.","zh":"美国几家智库和国防承包商都研究过封锁该如何实施。兰德公司（RAND）的一项重头研究，考察了美国如何封锁马六甲海峡，以及附近的巽他海峡和龙目海峡（这两条海峡主要由油轮使用）。¹⁵ 由扬·范托尔（Jan van Tol）牵头的一项研究则认为，远距离封锁行动可能需要破坏中国的海底通信线路，并夺取或摧毁中国的海底能源基础设施。¹⁶ 范托尔当过海军上校，在副总统办公室做过特别顾问，也当过五角大楼著名战略家安迪·马歇尔（Andy Marshall，人称“尤达”）的军事助理。此外，海军半官方刊物《海军学会会刊》（Proceedings）也刊登过若干封锁情景研究。追踪美国海军动向的中国规划人员注意到，2010年至2014年间这类文章明显增多。"},{"id":"ch11-021","p":221,"t":"p","en":"The history of blockades suggests that they have been most successful when they differentiate between neutral and enemy shipping and consistently block enemy shipping.¹7 This creates trade-offs. Consistent blocking is easier with a close blockade, but it would involve putting American assets at risk close to China's shores. The US could diminish the risk to its assets by mounting a distant blockade. These assets could neutralize shipping—but they couldn't differentiate between Chinese and neutral shipping, thus infuriating neutral parties whose ships were disturbed. And that includes countries like Japan, whose support of a blockade would be essential for success. So American planners are exploring the notion of a \"two-ring\" blockade: an inner ring, which would be a close blockade that aimed to neutralize vessels bound for China, and an outer ring to solve the differentiation problem.18 The inner ring would be declared an “exclusion zone\" that is off-limits to commercial shipping and enforced by firepower (essentially a “sink-on-sight\" policy) as close to China's shores as operationally possible. It would be principally enforced by submarines, backed up by long-distance airpower, and mines. By avoiding the use of surface ships, the US could limit its exposure to Chinese anti-ship mines. The outer ring would allow for differentiation and “non-lethal neutralization\"—i.e., seizure, or redirection—by setting up checkpoints and closing or limiting traffic through a number of key passageways (though that may very well violate international law). The US could also establish an inspection regime here, trying to determine merchant vessels’ ultimate destinations and reviewing their bills of lading—in an extreme circumstance, by boarding the ships, but perhaps also by exchange of electronic information.","zh":"封锁的历史表明，最成功的封锁，是能把中立国船只与敌国船只区分开来、并持续封锁敌国航运的封锁。¹⁷ 这就带来取舍。要持续封锁，近距离封锁更容易做到，但那意味着把美国的力量放到中国近岸去冒险。美国可以通过远距离封锁来降低自身的风险。这些力量足以瘫痪航运，却无法区分中国船只和中立国船只，于是会激怒那些船只受到骚扰的中立方，其中包括日本——而日本的支持对封锁的成败至关重要。因此，美国的规划者正在琢磨“双层封锁”的构想：内环是近距离封锁，目标是让驶往中国的船只失去行动能力；外环则用来解决区分难题。¹⁸ 内环将宣布为“禁航区”，禁止商船进入，在作战条件允许的范围内尽量靠近中国海岸，以火力强制执行（实质上是“见即击沉”政策）；主要由潜艇执行，远程空中力量和布设的水雷提供支援。避免动用水面舰艇，美国就可以减少遭受中国反舰水雷打击的风险。外环则允许区分目标、实施“非致命性瘫痪”——即通过设立检查站、关闭或限制若干关键通道的通行，实施扣押或勒令改道（不过这样做很可能违反国际法）。美国也可以在这里建立检查制度，设法查明商船的最终目的地、审查其提单——极端情况下可以登船检查，但也可能通过交换电子信息来完成。"},{"id":"ch11-022","p":221,"t":"p","en":"All this has the advantage of avoiding American strikes on the Chinese mainland. But there are serious difficulties with this idea as well.","zh":"所有这些做法的好处，是避免美国对中国大陆动武。但这个设想也有严重的难处。"},{"id":"ch11-023","p":221,"t":"p","en":"First, there are the economic challenges. China is a far bigger player in the global economy than Germany was on the eve of WWI—","zh":"首先是经济上的挑战。中国在全球经济中的分量，远非一战前夕的德国可比——"},{"id":"ch11-024","p":222,"t":"p","en":"Germany accounted for slightly under 15 percent of global manufacturing production in 1913; China now accounts for more than 25 percent of global manufacturing value added. Impeding the economy of China would rebound into the economies of Japan, Australia, and the United States-the key actors that would have to implement a blockade. (To say nothing of European allies.) And rewiring around China would take years, and might not really be possible—at least not without the kind of costs that societies are only willing to bear in times of war.19","zh":"1913年，德国占全球制造业产量的比例略低于15%；如今中国占全球制造业增加值的25%以上。压制中国经济，会反噬日本、澳大利亚和美国的经济——而这三个国家正是实施封锁的关键角色。（更不用说欧洲盟友了。）而要围绕中国重构供应链，需要多年时间，而且未必真能做到——至少，除非让社会付出只有在战争年代才愿意承受的那种代价。¹⁹"},{"id":"ch11-025","p":222,"t":"p","en":"There's an additional, modern problem: the nature of what's on commercial'vessels. One of the more spectacular early German attacks against British shipping in WWII came in 1939 when a German U-boat sank the Doric Star, a Blue Star Line ship carrying wool and mutton from New Zealand to UK ports. It was a major blow against British food stocks. But the modern equivalent would be far more complicated. If an American submarine sank a ship sailing to Chinese harbors, not only would it likely be sinking a non-Chinese vessel, it would be destroying cargo ultimately bound not just for Chinese consumption, but for Chinese intermediate manufacturing designed ultimately to end up as part of the supply chain of American and European goods. By imposing costs on the Chinese economy, the US would be imposing costs on Japan, Australia, Europe-and itself.","zh":"还有一个现代才有的问题：商船上装的是什么。二战初期德国对英国航运最惊人的一次打击发生在1939年：一艘德国U型潜艇击沉了“多里克星”号（Doric Star）——蓝星航运（Blue Star Line）的一条船，满载羊毛和羊肉，正从新西兰驶往英国港口。那是对英国食品储备的重击。但换成今天，同类行动会复杂得多。假如一艘美国潜艇击沉一艘驶往中国港口的船，它击沉的很可能并非中国船；而且毁掉的货物最终去向也不只是中国消费，还包括中国的中间品制造——这些中间品最终会成为美欧商品供应链的一部分。美国把代价加在中国经济头上，同时也就加在了日本、澳大利亚、欧洲——以及它自己头上。"},{"id":"ch11-026","p":222,"t":"p","en":"And there's a third problem-China could counterattack.\"","zh":"还有第三个问题——中国会反击。"},{"id":"ch11-027","p":222,"t":"p","en":"Most historians agree that it was the British and American rubber and oil blockade of Japan that triggered its military incursions into what it called the East Asian Resource Zone (Singapore and Hong Kong, principally) to gain access and sea routes to Indonesian and Malaysian rubber and oil supplies. To deter America from interfering with this move, Japan also attacked Pearl Harbor.20","zh":"多数历史学家都同意，正是英美对日本的橡胶和石油封锁，触发了日本对它所谓“东亚资源圈”（主要是新加坡和中国香港）的军事入侵，以打通获取印度尼西亚和马来西亚橡胶、石油的通道与海上航线。为了阻吓美国出手干预，日本还袭击了珍珠港。²⁰"},{"id":"ch11-028","p":222,"t":"p","en":"The lessons of that episode clearly inform China's thinking about blockades.","zh":"那段历史的教训，显然影响着中国对封锁的思考。"},{"id":"ch11-029","p":222,"t":"p","en":"*Germany used a counterattack in response to the British blockade, sinking some 11,153,000 tons of Allied merchant shipping by the end of WWI, mostly through submarine attacks. And in WWII, Germans responded to a blockade with commercial warfare against the British and later Allied maritime trade, sinking more than five thousand Allied merchant ships. This also delayed supply chains, since convoys had to move slowly and were substantially rerouted. In short, blockades can lead to major escalation, rather than the opposite.","zh":"*德国则以反击回应英国封锁，到一战结束时共击沉约11,153,000吨协约国商船，多数是潜艇所为。二战中，德国同样以商战回应封锁，打击英国及后来的盟国海上贸易，击沉盟国商船五千余艘。这也拖慢了供应链：船队不得不低速航行，并大规模改道。简言之，封锁可能导致大规模升级，而不是相反。"},{"id":"ch11-030","p":223,"t":"p","en":"China has threatened to respond to a blockade by sinking American aircraft carriers, and exploiting other American weaknesses. \"What the United States fears the most is taking casualties,\" said PLAN Rear Admiral Luo Yuan, commenting on a possible attack on US aircraft carriers.21 And others have noted that over time Beijing could adapt its anti-access, area denial tactics to implement a form of “economic warfare with Chinese characteristics.\" That could involve conducting strikes against economic targets in nearby nations (like ports, ground transportation nodes, communications facilities, manufacturing, and energy infrastructure), or other moves to disrupt global supply chains.22 All this could result in a two-sided naval war on trade.","zh":"中国已威胁以击沉美国航母、并利用美国其他弱点来回应封锁。“美国最怕的就是伤亡，”中国人民解放军海军少将罗援在谈到可能攻击美国航母时说。²¹ 也有人指出，假以时日，北京可以调整其反介入／区域拒止战术，实施一种“具有中国特色的经济战”。这可能包括打击周边国家的经济目标（如港口、地面交通枢纽、通信设施、制造业和能源基础设施），或采取其他扰乱全球供应链的举动。²² 这一切可能导致一场双方互相打击对方贸易的海战。"},{"id":"ch11-031","p":223,"t":"p","en":"Still, faced with the alternative of an attack on the Chinese mainland, possibly provoking all-out war, blockades could be a lower-cost way to confront China's navy.","zh":"不过，与袭击中国大陆、并可能引发全面战争这一选项相比，封锁或许是与中国海军周旋成本更低的方式。"},{"id":"ch11-032","p":223,"t":"p","en":"The second countermeasure is a lot more expensive. It involves some of the most advanced technology in the American arsenal: submarines.","zh":"第二种反制手段要昂贵得多。它涉及美国军火库中最先进的技术之一：潜艇。"},{"id":"ch11-033","p":223,"t":"p","en":"The job of keeping the US Navy at the forefront of submarine technology belongs to the labyrinthine set of research stations and labs that report to the Naval Research Center-ranging from testing and development sites in the Hawaiian archipelago, in Alaska, Florida, Virginia, and Washington State, to a sonar testing facility in, of all places, central Idaho.' At the heart of this, though, are two “echelon commands\"—the Naval Undersea Warfare Center in Newport, Rhode Island, and the Naval Surface Warfare Center in Carderock, Maryland.","zh":"让美国海军始终站在潜艇技术最前沿的，是海军研究中心下属那一整套迷宫般的研究站和实验室——从夏威夷群岛、阿拉斯加、佛罗里达、弗吉尼亚和华盛顿州的试验与开发场站，到偏偏设在爱达荷州中部的声呐试验设施。* 而其中的核心，是两个“梯队司令部”：罗得岛州纽波特的美国海军水下作战中心，和马里兰州卡德罗克的美国海军水面作战中心。"},{"id":"ch11-034","p":223,"t":"p","en":"In the post-Cold War era, the American focus on submarines waned. But there's been a full reversal. A recent report from an Australian university put it succinctly: “As the environment above the surface becomes more deadly because of Chinese deployments of cruise missiles, hypersonic technologies and anti-air defenses, America's enduring advantage in undersea warfare will become increasingly important in the regional balance of power.\"23 That argument is echoed by the leadership of the US Indo-Pacific Command: Admiral Philip Davidson told Congress in 2019 that submarine activity by America's adversaries had tripled since 2009.24 He said, \"Continuing to build submarines is critically important. It is our most significant advantage in all domains right now.\"25","zh":"冷战结束后的年代里，美国对潜艇的重视一度减弱。但如今形势完全逆转。澳大利亚一所大学最近的报告说得直截了当：“随着中国部署巡航导弹、高超声速技术和防空系统，海面之上的环境变得愈发致命，美国在水下战方面长期保有的优势，将在地区力量平衡中变得越来越重要。”²³ 这一论点在美国印太司令部领导层那里得到呼应：2019年，菲利普·戴维森（Philip Davidson）上将对国会说，2009年以来，美国对手的潜艇活动增加了两倍。²⁴ 他说：“继续建造潜艇至关重要。这是我们当下在所有领域最重要的优势。”²⁵"},{"id":"ch11-035","p":223,"t":"n","en":"For new sonar and other undersea detection technologies, the open ocean creates too many complications and variables for initial testing; so the navy operates its Acoustic Research Department in the 1,150-foot-deep waters of Lake Pend Oreille in northern Idaho.","zh":"对于新型声呐及其他水下探测技术而言，开阔大洋变量太多、情况太复杂，无法进行初期测试；因此海军把它的声学研究部设在爱达荷州北部深达1,150英尺的彭多雷湖（Lake Pend Oreille）水域。"},{"id":"ch11-036","p":224,"t":"p","en":"It is not just American and Chinese submarines at play. Former US assistant secretary of defense for Asian and Pacific security affairs David Shear has said, \"The region—particularly the western Pacific, and particularly within the first island chain on the American front perimeter—is filling up with submarines.\"26 Those waters are now replete with Korean, Japanese, and even Malaysian and Vietnamese submarines.27, 28 This has led to calls for a kind of underwater code of conduct, since there are so many submarines in the Indo-Pacific now and the risk of accident has risen dramatically.29,*","zh":"在这片水下活动的并不只有美国和中国潜艇。美国前负责亚太安全事务的助理国防部长戴维·希尔（David Shear）说过：“这个地区——尤其是西太平洋，尤其是美国前沿防线第一岛链以内——正在被潜艇填满。”²⁶ 如今这些水域里满是韩国、日本、甚至马来西亚和越南的潜艇。²⁷ ²⁸ 由于印太地区眼下潜艇数量如此之多、事故风险急剧上升，已有人呼吁制定某种水下行为准则。²⁹*"},{"id":"ch11-037","p":224,"t":"p","en":"The United States currently operates the world's most sophisticated fleet of submarines, about seventy of them. They are built to several different classes, or hull designs. Most powerful are the Ohio-class boats, which are classified as SSBNs—that is, submarine ships ballistic nuclear, in other words, submarines capable of launching ballistic nuclear missiles. Each of the Ohio-class submarines can fire twentyfour such missiles armed with nuclear warheads. Those subs that don't carry a nuclear payload are designated SSGNs-they carry submarine launched cruise missiles, including up to 154 Tomahawk missiles.† Then, the US has a number of attack submarines designed to engage in ship-to-ship combat and to support and defend the carrier strike groups. These include the Los Angeles-class, the Seawolf-class, and the Virginia-class boats. Variants on these boats are also used to insert Special Forces units onto enemy shores. (It's an oddity of maritime convention that whereas destroyers, frigates, cruisers, and the like the surface fleet—are referred to as “ships,\" their submarine cousins are referred to as \"boats.\")","zh":"美国目前拥有世界上最先进的潜艇舰队，约70艘。它们按不同级别（即不同艇体设计）建造。最强大的是俄亥俄级，归类为SSBN——即弹道导弹核潜艇，也就是能发射弹道核导弹的潜艇。每艘俄亥俄级潜艇可发射24枚携带核弹头的此类导弹。不携带核弹头的同级艇被定为SSGN——它们携带潜射巡航导弹，最多可装154枚“战斧”导弹。† 此外，美国还有若干攻击型潜艇，用于舰对舰作战，并为航母打击群提供支援与护卫，包括洛杉矶级、海狼级和弗吉尼亚级。这些艇的改型也用于把特种部队送上敌岸。（海军传统里有个古怪之处：驱逐舰、护卫舰、巡洋舰等水面舰队的舰只都叫“舰”（ship），而它们的表亲潜艇却叫“艇”（boat）。）"},{"id":"ch11-038","p":224,"t":"n","en":"It's not the first time that political leaders have called for a code of conduct to regulate submarine warfare. So brutal were the effects of submarine warfare in the First World War that in its wake, Britain's King George VI floated the idea of an outright ban on submarines, likening them to other classes of weaponry that \"civilized nations\" had chosen to forego. But King George got little traction with his proposal, and submarines played a critical role again in World War II. Then, as in World War I, their critical function: to attack trade. And that's what makes them theoretically critical for a blockading operation. For submarines' role in World War II, see Craig L. Symonds, World War II at Sea: A Global History (New York: Oxford University Press, 2018), chs. 6, 12, 17.","zh":"这并非政治领导人第一次呼吁以行为准则约束潜艇战。一战中潜艇战造成的后果太过惨烈，以致战后英国国王乔治六世提出干脆全面禁止潜艇，把潜艇与“文明国家”已经选择放弃的其他类别武器相提并论。但这一提议应者寥寥，潜艇在二战中再度扮演了关键角色。与一战时一样，它们的核心职能是打击贸易——这正是潜艇在理论上对封锁行动至关重要的原因。关于潜艇在二战中的作用，见克雷格·L. 西蒙兹《海上二战：一部全球史》（纽约：牛津大学出版社，2018年），第6、12、17章。"},{"id":"ch11-039","p":224,"t":"n","en":"Many submarines are nuclear-powered; others are powered by diesel or electrical batteries. A subset of nuclear-powered submarines also carry and can launch nuclear weapons. Nuclear-powered submarines are designated SSN; those that can launch nuclear weapons are designated SSBN. The SS signifies submarine; the G denotes a guided missile; and the N tells us that the submarine is nuclear-powered.","zh":"许多潜艇为核动力，另一些则由柴油机或蓄电池驱动。核动力潜艇中有一部分也携带并可发射核武器。核动力潜艇代号为SSN；能发射核武器的代号为SSBN。SS表示潜艇，G表示导弹，N则表示该艇为核动力。"},{"id":"ch11-040","p":225,"t":"p","en":"They are powerful weapons. And they are expensive, especially in large numbers. But the United States is investing heavily in its submarine fleet. In December 2019, the USN awarded its most expensive shipbuilding contract ever, allocating \\$22.2 billion over several years for nine nuclear-powered Virginia-class attack submarines.3º (These are huge boats, displacing 10,200 tons—compared to just over 9,000 tons for the Arleigh Burke-class destroyers like the USS John Paul Jones.)","zh":"它们是威力强大的武器，而且造价高昂——成批建造尤其如此。但美国仍在潜艇舰队上大举投入。2019年12月，美国海军签下了有史以来最昂贵的一份造舰合同：分几年拨出222亿美元，建造9艘“弗吉尼亚”级核动力攻击潜艇。*（这是名副其实的巨艇，排水量10,200吨；相形之下，“约翰·保罗·琼斯”号这样的“阿利·伯克”级驱逐舰排水量才刚过9,000吨。）"},{"id":"ch11-041","p":225,"t":"p","en":"A key technological edge that the United States holds is that all of its submersible boats are nuclear-powered. That gives them the ability to travel for months at a time; to operate without having to surface for oxygen; and to roam freely across the world's oceans, and under surface ice. And it gives them this critical advantage: they are quiet. And thus very hard to detect.","zh":"美国握有一项关键的技术优势：它所有能下潜的艇都是核动力。这使它们可以一连数月在水下航行，不必浮出水面换取氧气，可以自由巡游于世界各大洋，甚至钻到表层冰盖之下。这也给了它们一项至关重要的长处：安静，因而极难被发现。"},{"id":"ch11-042","p":225,"t":"p","en":"China's boats are not. Its fleet has been growing fast, but it still faces an important technology gap with the United States. According to a US Defense Intelligence Agency report, in 2019 China was operating six nuclear attack subs, four nuclear-powered ballistic missile submarines, and fifty diesel attack subs.³¹ Its nuclear-powered ballistic missile submarines are what's known as Type 094 Jin-class, believed to have been developed with help from Russia, and which can fire missiles with an estimated range of 4,600 miles. That's a critical measure, because if China can reliably deploy those boats at the eastern edge of the Philippine Sea, they could hit the continental United States.* And China is expected to begin producing more powerful submarines similar in quality to the US Virginia class.32 These would extend China's missile range considerably.","zh":"中国的潜艇则不是。中国舰队扩充得很快，但在技术上与美国仍有重大差距。美国国防情报局的一份报告称，2019年中国拥有6艘核动力攻击潜艇、4艘核动力弹道导弹潜艇和50艘柴油动力攻击潜艇。* 其核动力弹道导弹潜艇即所谓094型“晋”级，据信是在俄罗斯帮助下研制成功的，可发射射程约4,600英里（约7,400公里）的导弹。这项指标十分关键：只要中国能把这类潜艇可靠地部署到菲律宾海东缘，美国本土就处在其打击范围之内。* 而中国预计将着手建造性能更强、质量接近美国“弗吉尼亚”级的潜艇。* 那将大幅延伸中国的导弹射程。"},{"id":"ch11-043","p":225,"t":"n","en":"According to the US Defense Intelligence Agency, China also operates what are known as Type 092 Xia-class boats, which fire short-range missiles for use in regional combat; and nuclear-powered fleet submarines combat Type 093 Shang-class. That's in addition to four classes of conventionally powered submarines: the Type 039A Yuanclass, AIP-powered (one of their quietest), which can launch anti-ship cruise missiles; the Type 039 Song-class, their first indigenous design; the Kilo-class (Russian-made), providing a long-range anti-surface warfare capability of about 120 nautical miles; and the Type 035 Ming-class, its most dated boat.","zh":"据美国国防情报局称，中国还拥有所谓092型“夏”级潜艇，可发射用于地区作战的短程导弹；以及093型“商”级核动力攻击潜艇。此外还有四个级别的常规动力潜艇：可发射反舰巡航导弹、采用不依赖空气推进（AIP）的039A型“元”级（中国最安静的艇型之一）；中国第一型自行设计的039型“宋”级；俄制“基洛”级，具备约120海里的远程反水面作战能力；以及最为老旧的035型“明”级。"},{"id":"ch11-044","p":226,"t":"p","en":"Though over time their technology has improved, noise remains a key weakness for the Chinese submarine fleet.33 Quiet submarines can stay hidden from anti-submarine detection and anti-submarine warfare. In most conditions, ambient sea noise is around ninety decibels; to avoid detection, submarines need to be able to power themselves with engines that do not make much more noise than that. Western submarine design hit that mark around thirty years ago; China still lags behind. The US estimates that the newest Chinese submarine (the Type 093) operates at about 110 decibels; far better than its predecessors, but still far easier to detect than the quieter American boats.","zh":"尽管这些年中国潜艇的技术不断改进，噪声仍是中国潜艇部队的一大软肋。* 安静的潜艇能躲过反潜探测和反潜作战。多数海况下，海洋环境噪声约为90分贝；潜艇要不被发现，其动力装置的噪声就不能比这个水平高出太多。西方潜艇设计大约在30年前就达到了这条线，中国至今仍有差距。美方估计，中国最新的潜艇（093型）运行噪声约110分贝——比前几代好得多，但仍远比更安静的美国潜艇容易被发现。"},{"id":"ch11-045","p":226,"t":"p","en":"On the other hand, Chinese submarine-detection technology is advancing. Chinese boats already have passive sonar arrays on their sides and retractable towed array sonars that go behind them, similar to American boats. This allows them to operate anti-submarine reconnaissance with roughly the same sophistication as the US Navy.","zh":"另一方面，中国的探潜技术也在进步。中国潜艇的舷侧已装有被动声呐基阵，艇后拖着可收放的拖曳线列阵声呐，与美国潜艇相似。这使它们能以与美国海军大致相当的精密程度执行反潜侦察。"},{"id":"ch11-046","p":226,"t":"p","en":"And China is pouring resources into new technologies to improve its undersea targeting and detection. A key question is this: Will advances in artificial intelligence—where Chinese science is very close to that of the United States—allow China to close the gap? To put it in more technical terms: Has China significantly advanced its capacity through autonomous data analysis, inference, and decisional controls?","zh":"同时，中国正把大量资源投入新技术，以提升水下目标定位与探测能力。一个关键问题是：人工智能的进步——中国在这一领域的科研水平与美国非常接近——能否让中国补上差距？用更技术化的话说：中国是否已通过自主数据分析、推理与决策控制，显著提升了这方面的能力？"},{"id":"ch11-047","p":226,"t":"p","en":"By far the most common technique for submarine tracking is acoustic detection, using sonar-a technology that relies on what's known as the \"acoustic tomography\" of the oceans (basically, its sound patterns). Readers who have watched movies like The Hunt for Red October will recall scenes of sonar operators listening intently to pinging sounds picked up by sending out microphone signals, which bounce off the other side's submarines (or whales or rocks; they have different sounds). In the contemporary period, human ears have been replaced by automated signal-processing algorithms—one of the earlier forms of artificial intelligence introduced into modern warfare.","zh":"迄今为止，追踪潜艇最常用的技术是声学探测，也就是声呐——这种技术依赖海洋的所谓“声学层析”（说白了，就是海洋的声音图样）。看过《猎杀红色十月》这类电影的读者会记得这样的场面：声呐兵屏息聆听一声声回响。那些回响来自向外发出的声波信号，信号碰上对方的潜艇（也可能碰上鲸或礁石；不同的东西回声不同）再反射回来。到了当代，人的耳朵已被自动化的信号处理算法取代——这是人工智能最早进入现代战争的形态之一。"},{"id":"ch11-048","p":226,"t":"p","en":"In theory, there are other ways: tracking the effect of the submarine's movement on bioluminescence; measuring its effect on surface waves, or internal waves; magnetic resonance; measuring for temperature changes in the waters around the boat; and what's called “lidar\" (essentially, laser radar). But all of these technologies suffer from two inescapable physical realities: the chemistry and currents of the oceans, and the sheer size of the marine environment versus the ultimately puny size of the target. This generates a fundamental problem for all detection methods: a low ratio of signal to noise.","zh":"理论上还有别的办法：追踪潜艇航行对生物发光的影响；测量它对表层波或内波的影响；磁共振；测量潜艇周围水体的温度变化；以及所谓“激光雷达”（lidar，即激光探测与测距）。但所有这些技术都受制于两个无法回避的物理现实：海水的化学构成与洋流，以及海洋环境之浩瀚对目标之微小。这给一切探测手段带来一个根本难题：信噪比过低。"},{"id":"ch11-049","p":227,"t":"p","en":"Slightly more promising is the detection of downstream wakes. As we'll see in Part IV, the ocean's waters are actually quite stratified, with density, salinity, and temperature changing continuously, but largely quite different in the deep waters below one thousand feet, versus surface waters. When a submarine moves through those stratified layers, it disturbs them and creates a turbulent wake. This can be observed, inter alia, by laser beams.34 Still, the large distances involved and the huge volume of water that would need to be covered for such technologies to reliably detect submarines pose considerable logistical and financial obstacles.","zh":"稍有些希望的是探测潜艇身后的尾流。我们将在第四部分看到，海水其实是高度分层的：密度、盐度和温度不断变化，但1,000英尺以下的深水与表层水差别很大。潜艇穿过这些分层水体时会扰动它们，拖出一条湍流尾迹。用激光束等手段可以观测到这条尾迹。* 然而，要想靠这类技术可靠地探到潜艇，涉及的距离之远、需要覆盖的水体之巨，都构成相当大的后勤和经费障碍。"},{"id":"ch11-050","p":227,"t":"p","en":"So difficult are these obstacles that during the Cold War, the US Navy developed a plan for an alternative method to defeat the Soviet submarine fleet: to use depth charges, but depth charges tipped with nuclear warheads. These would explode with sufficiently forceful waves to disrupt the Soviet boats as much as fifteen miles from the blast radius. Of course, even fifteen miles is only a useful distance if you have some knowledge of where the target is sailing. In the extreme—detection of a large-scale Soviet submarine launch without subsequent tracking of specific boats—the US planned to use the air force to engage in an oceans-wide \"nuclear barrage\" to defeat the Soviet submarine fleet.","zh":"这些障碍如此棘手，以致冷战期间美国海军只好另辟蹊径，制订了一套击破苏联潜艇舰队的方案：用深水炸弹——不过是装上核弹头的深水炸弹。它们爆炸时产生的冲击波，足以扰乱15英里外的苏联潜艇。当然，即便有15英里这样的毁伤半径，也得大致知道目标往哪儿开才有用。在极端情形下——探测到苏联潜艇大规模出航，却无法持续追踪其中具体哪几艘——美国曾计划动用空军，在整片大洋上布下“核弹幕”，以此打垮苏联潜艇舰队。"},{"id":"ch11-051","p":227,"t":"p","en":"The Chinese appear to have learned a lot from American anti-Soviet tactics—and the use of nuclear-tipped anti-submarine depth charges is now a part of the PLAN arsenal. It is now a Chinese option to use these nuclear devices against the American submarine fleet, although probably on a much smaller scale—barraging only the Luzon Strait in the Philippine Sea, for example, to prevent the US Navy from reinforcing Taiwan. American naval planners believe that the Chinese view is that the use of nuclear weapons undersea would not constitute a violation of the key international norm against the use of nuclear weapons, or generate an American nuclear response; instead, the US might choose to use conventional munitions to strike a Chinese communications base or missile installation near the coast. Still, the notion of the use of subsea nuclear weapons is a deeply disturbing one.","zh":"中国似乎从美国对付苏联的战术中学到了不少——装核弹头的反潜深水炸弹，如今已是解放军海军的装备之一。用这类核装置对付美国潜艇舰队，已成为中国的一个选项，只不过规模大概要小得多——例如只在菲律宾海的吕宋海峡布下弹幕，阻止美国海军驰援台湾。美国海军规划人员认为，在中方看来，在水下使用核武器并不构成对禁止使用核武器这一重要国际规范的违反，也不会招致美国的核报复；美国反倒可能选择用常规弹药，打击中国沿海的一处通信基地或导弹设施。尽管如此，在水下使用核武器这个念头，仍然令人深感不安。"},{"id":"ch11-052","p":228,"t":"p","en":"As the US and its potential adversaries return to a focus on antisubmarine warfare, an important question is whether advances in artificial intelligence and computing power fundamentally change the dynamics of submarine detection. Tom Stefanick, who did some of the earliest work for the US Navy in applying artificial intelligence to submarine warfare, thinks the application is limited.\"There's simply no way around the fundamental problem of tracking small boats in huge waters: a low signal to noise ratio. All the AI in the world can't overcome that problem.\"35","zh":"随着美国及其潜在对手重新把注意力转向反潜战，一个重要的问题是：人工智能与算力的进步，是否会从根本上改变潜艇探测的规律？汤姆·斯特凡尼克（Tom Stefanick）早年曾为美国海军做过把人工智能用于潜艇战的最早一批研究，他认为这种应用是有限的。“在浩瀚水域里追踪小艇，那个根本难题绕不过去，就是信噪比太低。再多的人工智能也解决不了这个问题。”*"},{"id":"ch11-053","p":228,"t":"p","en":"The bottom line: the US submarine fleet remains, for all intents and purposes, indestructible. China's only reliable option to destroy the US submarine fleet is an incredibly risky one—to attack the boats in their bases, on the Pacific and Atlantic coasts, using intercontinental ballistic missiles. From what we know, China has developed the capacity to deploy such missiles, but has not done so yet. And it would have to think very carefully before taking this step, for here the planned American response is absolutely clear: nuclear strike on China.","zh":"说到底：美国潜艇舰队实际上仍然无法被摧毁。中国要摧毁这支舰队，唯一可靠的选项极其冒险——用洲际弹道导弹，打击停泊在太平洋和大西洋沿岸基地里的潜艇。就我们所知，中国已具备部署这类导弹的能力，但尚未走出这一步。而迈出这一步之前，它必须反复掂量，因为美方在此处的预定反应再清楚不过：对中国实施核打击。"},{"id":"ch11-054","p":228,"t":"h","en":"Chinese Friends?","zh":"中国有朋友吗"},{"id":"ch11-055","p":228,"t":"p","en":"Short of such dramatic outcomes, a key question for China is this: If it ended up in some more limited form of naval warfare with the United States, could it count on support from any other power? It's a question most germane to Russia. For while China is now the clear number two defense spender in the world, and now has the second-largest navy by displacement, it is actually not China that has the number two navy in the world measured by sophistication and global reach. That dangerous designation belongs to Russia. And in recent years, Russia has been using its navy in ways that are very helpful to China.","zh":"在事态尚未演到那一步时，中国面临的一个关键问题是：如果它与美国陷入某种规模更有限的海战，能否指望其他大国的支持？这个问题与俄罗斯关系最大。因为，尽管中国如今稳居世界第二大军费开支国，按排水量计算也拥有世界第二大的海军，但若以技术水平和全球到达能力衡量，世界第二的海军其实并不是中国的。这个危险的位次属于俄罗斯。而近年来，俄罗斯运用海军的方式对中国很有帮助。"},{"id":"ch11-056","p":228,"t":"p","en":"That's a new development. Russian naval capacity has waxed and waned. At no point during the Cold War did the Soviet navy match the US for quality, though it did eventually match it for size. (And as one Soviet naval analyst quipped at the time, “Size is its own quality.\") The Soviet navy, along with the Soviet economy, collapsed with the fall of the Berlin Wall. But it's been partially rebuilt since, under President Putin's tenure. In the past, the Soviet submarine fleet was of very high quality—coming close to matching US technology. Russia has retained the technological legacy of that period of investment and continues to operate a world-class submarine fleet","zh":"这是新近才出现的情况。俄罗斯的海军实力几经消长。冷战期间，苏联海军在质量上从未与美国匹敌，但规模最终赶了上来。（当时一位苏联海军分析人士打趣说：“规模本身就是一种质量。”）随着柏林墙倒塌，苏联海军与苏联经济一同崩溃。但在普京总统任内，它已得到部分重建。当年苏联潜艇舰队的质量极高，几乎与美国技术比肩。俄罗斯继承了那一轮投资留下的技术遗产，至今仍在使用一支世界级的潜艇舰队。"},{"id":"ch11-057","p":229,"t":"p","en":"Some of Putin's most aggressive moves against the West over the past decade have been in areas where important Russian naval bases were at stake. Russia's move into Syria in 2012 had multiple motives, but central among them was to make sure that Russia retained access to its only Mediterranean naval base (technically, it's Material Technical Support Point), in Tartus, Syria. And its annexation of Crimea, in Ukraine, again had multiple logics, but vitally included regaining its historic Black Sea base in Sevastopol, on the Crimea peninsula.36","zh":"过去十年间，普京对西方采取的一些最激进的举动，都发生在俄罗斯重要海军基地受到威胁的地区。2012年俄罗斯介入叙利亚，动机不止一个，但核心是确保俄罗斯保住它在地中海唯一的军事基地（严格说，那是个“物资技术保障点”）——叙利亚的塔尔图斯。兼并乌克兰的克里米亚同样有多重逻辑，但至关重要的一环是重新拿回克里米亚半岛上历史悠久的黑海基地塞瓦斯托波尔。*"},{"id":"ch11-058","p":229,"t":"p","en":"Russia has also reactivated what was an important strength during the Cold War: its submarine fleet. By 2017, Russian submarine activity was at its highest point since the end of the Cold War, and particularly active in North Asia (the Western Pacific/Yellow Sea), and the North Atlantic. Russia has also repeatedly sailed its ships through the Kattegat, past Copenhagen, and into Scandinavian waters. American sailors have tracked Russian submarines as far away as Maine. When America's acting secretary of the navy was asked, in 2020, why America needed to expand its navy, his answer dwelt on China—but it started with Russia.³7","zh":"俄罗斯还重新启用了冷战时期的一项强项：潜艇舰队。到2017年，俄罗斯潜艇的活动达到冷战结束以来的最高水平，在北亚（西太平洋／黄海）和北大西洋尤为活跃。俄罗斯军舰还多次穿越卡特加特海峡，经哥本哈根驶入斯堪的纳维亚海域。美国水兵曾在远至缅因州的外海追踪过俄罗斯潜艇。2020年，有人问美国代理海军部长，美国为何需要扩充海军，他的回答主要谈中国——但开口先说的是俄罗斯。*"},{"id":"ch11-059","p":229,"t":"p","en":"Its submarine fleet also poses a threat to America's reliance on undersea cables. In 2015, what was technically classified as an “oceanographic research vessel,\" the Russian submarine Yantar, probed a cable route to Cuba. Then it positioned itself off a US submarine base in the Gulf of Mexico. Since then, Russian submarines have been detected along cables in the Atlantic and the Pacific, in increasing frequency. It's unclear whether submarines can tap underwater cables the same way that spies can tap fiber-optic cables on land, but it is apparent that these vessels can do serious damage.38 And the Russians might not just be looking at cables—but also military underwater sensing equipment that is used for detecting submarines. Rear Admiral Frederick J. Roegge, the commander of the US Navy's submarine fleet in the Pacific, said in 2015, \"I'm worried every day about what the Russians may be doing. \"39","zh":"俄罗斯潜艇舰队也对美国对海底光缆的依赖构成威胁。2015年，一艘名义上归类为“海洋调查船”的俄罗斯潜艇“扬塔尔”号，勘察了一条通往古巴的光缆路由，随后又在美国墨西哥湾的一处潜艇基地外就位。此后，俄罗斯潜艇在大西洋和太平洋的光缆沿线被发现的次数越来越多。潜艇能否像间谍在陆地上搭接光纤那样搭接海底光缆，目前还不清楚，但这些船只能够造成严重破坏，却是显而易见的。* 而俄罗斯人盯上的也许不只是光缆，还包括用于探测潜艇的军用海底传感设备。2015年，时任美国海军太平洋潜艇部队司令弗雷德里克·J. 罗格（Frederick J. Roegge）少将说：“我每天都在担心俄罗斯人可能在做什么。”*"},{"id":"ch11-060","p":230,"t":"p","en":"Most worrying to American naval planners, Russia and China have undertaken joint naval exercises in the Mediterranean in 2015, in the South China Sea in 2016, the Yellow Sea in 2018, and the East China Sea in 2019. They are not, at this stage, an allied force, but they are certainly deploying in ways that complement each other's strengths. If China can deepen its engagement with Russia, it can gain access to at least some of Russia's network of bases and capabilities—these are not of the same scale as the combined British-American network, but they would meaningfully extend China's global reach.","zh":"最令美国海军规划人员担忧的是，俄中两国已举行过多次联合海上演习：2015年在地中海，2016年在南海，2018年在黄海，2019年在东海。现阶段它们还算不上一支盟军，但其兵力部署显然能互补长短。如果中国能深化与俄罗斯的协作，至少可以利用俄罗斯的部分基地网络和能力——这些虽不能与英美两国的基地网络合并相比，却会实实在在地延伸中国的全球触角。"},{"id":"ch11-061","p":230,"t":"p","en":"China-Russia relations are complex, and it is unclear how Russia would behave in an outright conflict between the United States and China. But given its simmering tensions with the West, and its distaste for Western sanctions, it is certainly possible that the Russians would help China get around an American blockade.","zh":"中俄关系错综复杂，一旦美中之间爆发全面冲突，俄罗斯会如何行事并不清楚。但考虑到它与西方持续发酵的紧张关系，以及它对西方制裁的反感，俄罗斯帮中国绕开美国封锁，是完全可能的。"},{"id":"ch11-062","p":230,"t":"p","en":"But America would also try to bring in others.","zh":"但美国也会设法拉上别人。"},{"id":"ch11-063","p":230,"t":"h","en":"America's Friends at Sea","zh":"美国的海上盟友"},{"id":"ch11-064","p":230,"t":"p","en":"Were this book being written at any previous point in the last four hundred years, a focus of any global naval assessment would have been the navies of Europe—Britain above all, but also France, Holland, Italy, Spain, and even Germany. These are now all shadows of their former selves. At times, some of them have fallen to a level of capacity and readiness that calls into question their basic effectiveness.","zh":"倘若本书写于过去四百年间的任何一个时点，任何一份全球海军评估的重点都会是欧洲各国的海军——首推英国，此外还有法国、荷兰、意大利、西班牙，甚至德国。如今它们都只是昔日身影的残照。有些时候，其中一些国家的海军在实力与战备上跌到的水平，已让人怀疑它们是否还具备基本作战效能。"},{"id":"ch11-065","p":230,"t":"p","en":"Paul Kennedy, the celebrated historian of the rise and fall of empires, has noted with concern that Europe has allowed its navies to decline just as the Asian powers began to build theirs.40 This is both a matter of operational concern, and part of a pattern of the shift in the balance of economic and military power away from Europe, toward Asia. Kennedy recalls the advantage gained by Europe, in the 1400s to 1500s, as China withdrew its exploration of the high seas just as the Portuguese were sailing into the Indian Ocean. We may be seeing now something like the reverse; a naval counterpart to the closing of the eighteenth-century economic lacuna.","zh":"以研究帝国兴衰著称的历史学家保罗·肯尼迪（Paul Kennedy）不无忧虑地指出：就在亚洲列强开始造舰的当口，欧洲却听任自己的海军衰落下去。* 这既是作战层面的问题，也是经济与军事力量对比从欧洲转向亚洲这一大势的一部分。肯尼迪回想起15、16世纪欧洲占到的那份便宜：中国恰在葡萄牙人驶入印度洋之际，撤回了对远洋的探索。而我们今天看到的，也许是某种倒转——18世纪那个经济缺口被填平的一幕，如今在海军领域又重演了一遍。"},{"id":"ch11-066","p":230,"t":"p","en":"Still, Europe's decline can be exaggerated. The major European navies are roughly as large, each of them, as Japan's, and have a suite of ships and a network of former colonial outposts that give them global range-—from French possessions in the Indian Ocean to British bases in East Asia. Britain continues to operate bases and fueling stations left over from the days when the Royal Navy spanned the globe and makes the majority of those bases available to the US Navy—a key asset. London and Paris and Madrid can also work together through the European Union. Taken together, the EU powers retain a sizable force, operating three aircraft carriers, two dozen destroyers, a submarine fleet including nuclear-capable submarines, and roughly 150,000 personnel. From a Chinese perspective, that's a serious factor to contend with.","zh":"不过，欧洲的衰落也可能被夸大。欧洲各大海军每一支的规模都大致与日本相当，而且都拥有成套舰艇和一张前殖民地据点网络，使它们具备全球活动半径——从法国在印度洋的属地，到英国在东亚的基地。英国至今仍在运营皇家海军称雄全球年代留下的基地和加油补给站，并把其中大部分基地提供给美国海军使用，这是一笔关键资产。伦敦、巴黎和马德里还可以通过欧盟协同行动。合起来看，欧盟各国的海军仍保有相当可观的兵力：3艘航空母舰、24艘驱逐舰、一支含可搭载核武器潜艇的潜艇舰队，以及约15万人员。从中国的角度看，这是一个必须认真对待的因素。"},{"id":"ch11-067","p":231,"t":"p","en":"America has other friends in the Indo-Pacific region as well. Fastest of those friends is Australia. And while Australia has to balance its large economic stakes in trade and investment with China, its navy has continuously exercised and sailed in the South China Sea. Under a \\$62 billion program, Australia is set to double the size of its fleet, building more than fifty vessels, including twelve new attack-class submarines. Australia's navy and combat troops are well tested, having served alongside the US in Iraq and elsewhere. The Australian navy has joined Japan, Britain, France, and India, among others, in the conduct of “freedom of navigation\" operations in the Pacific and Indian Oceans.41","zh":"美国在印太地区还有别的朋友。这些朋友中动作最快的是澳大利亚。澳大利亚固然要权衡它在对华贸易与投资上的巨大经济利益，但其海军一直在南海演习、航行。按照一项620亿美元的造舰计划，澳大利亚将把舰队规模扩大一倍，建造50多艘舰艇，其中包括12艘新型“攻击”级潜艇。澳大利亚的海军和作战部队久经考验，曾在伊拉克等地与美军并肩作战。澳大利亚海军还与日本、英国、法国、印度等国一道，在太平洋和印度洋开展“航行自由”行动。*"},{"id":"ch11-068","p":231,"t":"p","en":"And in several scenarios, the US Navy would also potentially have substantial help from Japan. That includes scenarios involving submarine warfare. Indeed, one of Japan's great contemporary strengths is its submarine fleet. It operates one of the most effective submarine fleets in the world, a diesel electric fleet that is quiet, efficient, and exceedingly well maintained—no small feat in the world of metal machines that live under water.42 It uses that submarine fleet to patrol its long archipelago of islands, down to the Ryukus, which extend to within 250 miles of China's shores. And in 2018, responding to Chinese developments in the East China Sea, Japan created an amphibious rapid deployment brigade based on submarines to defend some of the more remote islands in its own archipelago. And that is no mere passive force: in 2018, the Japanese Air Self-Defense Force scrambled nearly one thousand times—64 percent of which were to respond to Chinese aircraft largely flying around the Senkakus and the East China Sea.43 That's nearly two sorties responding to Chinese aircraft a day. The","zh":"在若干情形下，美国海军还可能得到日本的大力协助，包括涉及潜艇战的情形。事实上，日本当今的一大强项就是它的潜艇舰队。它拥有一支世界上最有效的潜艇部队——一支柴电潜艇舰队，安静、高效，维护极其精良；在水下那些钢铁机器中间，这可不是小事。* 日本用这支潜艇部队巡逻其狭长的岛链，一直南抵琉球群岛，那里距中国海岸不足250英里（约400公里）。2018年，为应对中国在东海的动作，日本组建了一支以潜艇为依托的水陆机动团，用于防卫本国岛链中一些更偏远的岛屿。而这并不是一支只守不攻的力量：2018年，日本航空自卫队紧急起飞近1,000架次，其中64%是为了应对中国飞机，而后者大多在尖阁诸岛（即钓鱼岛及其附属岛屿）和东海一带飞行。* 这相当于平均每天近两个架次应对中国飞机。"},{"id":"ch11-069","p":232,"t":"p","en":"Japanese are almost literally building a wall, with defensive installations along Japan's southwestern island chain. The result is what one Chinese naval officer called a new“impassable maritime great wall\"- more commonly, simply the \"Japanese Wall\" of fortifications to block Chinese naval expansion.44","zh":"日本人几乎真的在筑墙：沿日本西南岛链修建防御设施。用一位中国海军军官的话说，这成了一道新的“不可逾越的海上长城”；更常见的说法，干脆就叫它“日本墙”——用一道道工事阻挡中国海军向外扩展。*"},{"id":"ch11-070","p":232,"t":"p","en":"Theoretically, the Korean navy would contribute to an American response to China as well. It is, of course, a US ally. But of late, it's an unhappy one, and it has increasingly strong economic ties to China. Already, American naval planners are reassessing whether they can rely on access to Korean ports should they face a wartime scenario in the Near Seas.45 The point is: China's strategy for improving its ability to operate freely in the Near Seas isn't only a naval strategy-—it's a multifaceted strategy of naval pressure, commercial ties, and diplomacy designed to weaken the string of American alliances that surround it.","zh":"理论上，韩国海军也会在美国对华的反应中出力。它当然是美国的盟友。但近来这个盟友并不痛快，而且与中国的经济联系日益紧密。美国海军规划人员已在重新评估：一旦近海出现战时情形，还能不能指望使用韩国港口。* 要点在于：中国为提升自己在近海自由行动的能力所制定的战略，并不只是海军战略——它是一套多管齐下的战略，把海上施压、商业纽带和外交手段结合起来，意在削弱环绕中国的这一连串美国同盟。"},{"id":"ch11-071","p":232,"t":"p","en":"On the other hand, there's a new entrant to the game of ports and naval power, and while it has traditionally maintained a neutral posture in global affairs, its mounting tensions with China are increasingly pushing that power toward the United States. At the very least, its new, growing navy is playing a role that looks set to complicate China's maritime life.","zh":"另一方面，这场港口与海权的博弈中又出现了一个新玩家。它历来在全球事务中保持中立姿态，但它与中国不断加剧的紧张，正把这个大国越来越推向美国一边。至少可以说，它那支新兴的、不断壮大的海军正在扮演一个角色，看样子会让中国的海上处境更加复杂。"},{"id":"ch11-072","p":232,"t":"h","en":"The India Question","zh":"印度问题"},{"id":"ch11-073","p":232,"t":"p","en":"The body of the Indian subcontinent lies precisely between the western end of the Malacca Strait and the eastern openings of the Suez and Hormuz. From its home ports, India has uninterrupted access to the key sea-lanes of trade and what Mahan called the \"sea-lanes of communication\"—the islands and choke points that abut those trade routes. In short: India is a great thousand-mile dagger thrust into the heart of China's Indian Ocean ambitions.","zh":"印度次大陆的主体，恰好横亘在马六甲海峡西端与苏伊士、霍尔木兹的东侧出口之间。从本土港口出发，印度可以不受阻隔地进入主要贸易航道，以及马汉所说的“交通航道”——紧贴这些贸易路线的岛屿与咽喉要道。简言之：印度是一把长达千英里、直插中国印度洋雄心心脏的巨匕。"},{"id":"ch11-074","p":232,"t":"p","en":"As China sails out past the Near Seas, it can go in one of three directions: north through the Korea Strait to the Arctic (about which we'll see more in Part IV); east to the Pacific, where it confronts the US Navy; or it can sail along the main shipping lanes, past Singapore and out through the Malacca Strait into the Indian Ocean. If China wants to be able to defend its trade against an American blockade, it has to be able to secure those shipping lanes. But when it looks toward the Indian Ocean, past the Malacca Strait, the first obstacle it encounters is the Indian navy, at Port Blair in the Andaman Sea.","zh":"中国驶出近海之后，只有三个方向可走：向北穿过朝鲜海峡进入北极（第四部分还会详述）；向东进入太平洋，在那里直面美国海军；或者沿主要航道，过新加坡、出马六甲海峡，进入印度洋。中国若想保住自己的贸易不被美国封锁，就必须能够控制这些航道。可当它越过马六甲海峡望向印度洋时，撞上的第一道障碍就是印度海军——驻在安达曼海布莱尔港的印度海军。"},{"id":"ch11-075","p":233,"t":"p","en":"The simple fact of India's geography makes China's job immeasurably harder. So, too, do its relations with India, with whom it has fought three wars since independence. Granted, those wars were all along its land border with India, in the Himalayas, and as a consequence India has privileged its land and air forces over its navy. This, despite the fact of its extraordinarily long coastline and its heavy dependence on fishing and sea-based imports.","zh":"单是印度地理这一个事实，就让中国的活难做了不知多少倍。它与中国的关系同样如此——印度自独立以来已经打过三场战争。当然，那些战争都发生在喜马拉雅山的中印陆地边界上，因此印度一向把陆军和空军排在海军之前。尽管它有一条长得异乎寻常的海岸线，尽管它的渔业和进口都严重依赖海洋。"},{"id":"ch11-076","p":233,"t":"p","en":"Until very recently, India had never developed as a serious naval power.\" India's limited navy has long kept its focus narrowly on India's own ring of small islands that surround it—Mauritius, Seychelles, Maldives, and above all Sri Lanka. It has also had to focus on operations against Pakistan.","zh":"直到不久之前，印度还从未发展成一个真正的海军强国。印度有限的海军长期只盯着环绕本国的那一圈小岛——毛里求斯、塞舌尔、马尔代夫，尤其是斯里兰卡，同时还不得不兼顾对巴基斯坦的作战。"},{"id":"ch11-077","p":233,"t":"p","en":"India's naval ambitions began to rise, along with its economy, in the post-9/11 period. At the end of the Cold War, India, like China and Brazil and others, opened its economy to globalization and began to grow, fast. By 2010, India had overtaken France to become the sixth-largest economy in the world (and is projected to become the third-largest economy in the world by 2050). Like China, and like Britain and America before it, it has developed far-reaching foreign policy interests to match its new economic status—though not yet the capacity to match.46","zh":"9·11之后，印度的经济与海军雄心一同上升。冷战结束时，印度与中国、巴西等国一样向全球化开放经济，开始快速增长。到2010年，印度已超过法国，成为世界第六大经济体（预计到2050年将成为世界第三大经济体）。与中国一样，也与它之前的英国和美国一样，印度已发展出与其新经济地位相称的、影响深远的外交利益——尽管还不具备与之相称的实力。*"},{"id":"ch11-078","p":233,"t":"p","en":"After 9/11 and the Al Qaeda attacks on American territory, the United States decided—echoing its experience with the Barbary pirates—to launch a land invasion of Afghanistan, to rob this new set of non-state actors of a base of operations in their home territory. This caused the United States to pull resources away from functions like protecting the Malacca Straits, to deploy to the Afghan operation.","zh":"9·11之后，“基地”组织袭击了美国本土，美国于是决定——这与它当年对付巴巴里海盗的经历如出一辙——对阿富汗发动地面入侵，以剥夺这批新型非国家行为体在其本土的行动基地。这使美国把资源从保护马六甲海峡这类任务上抽走，转投阿富汗战事。"},{"id":"ch11-079","p":233,"t":"n","en":"The earliest “Indian” navy was actually part of the British East India Company. In 1612, a company vessel fought a Portuguese contingent and managed to win, but combined with the threat of the Portuguese and of pirates, they convinced the Company to establish the East India Marine. Britain controlled India until its independence in 1947. After, India developed a small navy. In a twist of fate, the first engagement of the newly independent Indian navy was also against Portugal, during India's fight to liberate Portugal's last overseas colony, Goa, in western India (in 1961).","zh":"最早的“印度”海军其实附属于英国东印度公司。1612年，公司的一艘船与一支葡萄牙分遣队交手并取胜，但葡萄牙人的威胁加上海盗的威胁，促使公司组建了东印度海事力量。英国统治印度直至1947年印度独立。此后，印度才发展起一支小型海军。命运的巧合是，新独立的印度海军第一次交战，对手同样是葡萄牙——1961年印度为解放葡萄牙在印度西部最后一块海外殖民地果阿而战。"},{"id":"ch11-080","p":234,"t":"p","en":"India volunteered to carry some of the burden and took on a role in escorting ships through the Malacca Straits, freeing up American resources.","zh":"印度主动分担了一部分担子，承担起为船只护航通过马六甲海峡的任务，从而腾出了美国的资源。"},{"id":"ch11-081","p":234,"t":"p","en":"The most important focus for Indian foreign policy is the longrunning alliance between its two principal adversaries, Pakistan and China. For much of its history, this kept it focused on its northern land borders. But as China's PLAN has grown global sea legs, this alliance has spilled out into the Indian Ocean.47 During a tense India-Pakistan standoff in 2017, China sent a submarine to the area to \"monitor\" the situation. This so angered the Indians that it set off a wave of Indian naval purchases and deployment. Already India had an aircraft carrier, and a nuclear-capable submarine. In 2019 it started to expand its fleet—aiming to have three carrier groups, with two hundred ships, twenty-four conventional submarines, and five hundred aircraft by 2030.48 (Though in 2019, reeling from the economic impact of the COVID-19 pandemic, it trimmed its budget aspirations.)49","zh":"印度外交政策最看重的，是它的两个主要对手——巴基斯坦与中国——之间长期结成的同盟。在历史上大部分时间里，这使印度的注意力一直放在北部陆地边界上。但随着中国海军长出全球远洋的腿脚，这一同盟关系也外溢到了印度洋。⁴⁷ 2017年印巴两国紧张对峙期间，中国派出一艘潜艇前往该海域“监控”局势。此举激怒了印度，引发一波海军采购与部署的热潮。印度当时已有一艘航空母舰和一艘可搭载核武器的潜艇。2019年，它开始扩充舰队，目标是到2030年拥有3个航母战斗群、200艘舰艇、24艘常规潜艇和500架飞机。⁴⁸（不过2019年，受新冠疫情经济冲击的拖累，它下调了预算目标。）⁴⁹"},{"id":"ch11-082","p":234,"t":"p","en":"India has used its geographical advantage well; by 2019, it had ships visiting and practicing in every one of the Indian Ocean sea lines of communication. And unlike China, India has good relations with virtually all of its neighboring countries. It has used this-and shared concern about China-to forge new maritime agreements with Singapore; a defense agreement with France for access to its Indian Ocean properties; a base-sharing agreement with Oman, near the Strait of Hormuz; and to deepen ties with the United States. This gives it access to ports and bases across the sweep of the Indian Ocean. There's even growing naval cooperation between India and Vietnam in the South China Sea, much to China's distress.","zh":"印度把自己的地理优势用得相当好：到2019年，印度军舰已造访印度洋上每一条海上交通线，并在那里演练。而且与中国不同，印度几乎与所有邻国都保持着良好关系。它借这一点——也借各国对中国的共同担忧——与新加坡缔结了新的海上协议，与法国达成防务协议以获得法国印度洋属地的使用权，与靠近霍尔木兹海峡的阿曼签署了基地共用协议，还加深了与美国的关系。这使它的港口与基地横贯整个印度洋。印度与越南在南海的海军合作也在增强，令中国十分不安。"},{"id":"ch11-083","p":234,"t":"p","en":"*In all of this, India's geopolitical relations are, well, eclectic. Despite long-running tensions, China is India's largest trading partner. It is actively deepening ties with Japan and has recently joined Japan, Australia, and the United States in a mechanism called the Quad, a defensive semi-alliance against China. It is increasingly friendly to and mission-aligned with the US. And throughout all of this, it's maintained friendly relations with its largest arms supplier—Russia.","zh":"*在这一片关系中，印度的地缘政治立场可谓，嗯，兼收并蓄。尽管摩擦日久，中国仍是印度最大的贸易伙伴。它一边积极加深与日本的关系，一边新近加入日本、澳大利亚与美国组成的“四方机制”（Quad）——一个针对中国的防御性半同盟。它对美国越来越友好，也越来越与之步调一致。而在这一切之外，它还与本国最大的武器供应国俄罗斯保持着友好关系。"},{"id":"ch11-084","p":235,"t":"h","en":"A Naval Arms Race","zh":"海军军备竞赛"},{"id":"ch11-085","p":235,"t":"p","en":"All of this activity amounts to a growing, near-global naval arms race— pitting the United States and China against each other, and pulling in European and Asian powers, including Russia and India. It's made the world's oceans-and particularly the Pacific, the Indian, and the Arctic-the front lines of geopolitical tensions. There's even growing Chinese and Russian naval activity in the Mediterranean, and a growing Russian presence in the northern Atlantic.","zh":"所有这些加在一起，构成了一场不断升温、近乎覆盖全球的海军军备竞赛——美国与中国彼此角力，欧洲与亚洲的强国也被卷入，包括俄罗斯和印度。它使世界各大洋——尤其是太平洋、印度洋和北冰洋——成了地缘政治紧张的前线。中国与俄罗斯在地中海的海军活动日益增多，俄罗斯在北大西洋的存在也在扩大。"},{"id":"ch11-086","p":235,"t":"p","en":"And tensions continue to mount. In June 2016, China sent a warship to the Senkakus for the first time, with a frigate sailing in the islands' waters.50 In January 2018, the PLAN kicked off the new year by sending a nuclear attack submarine into those waters.51 In the north, a new Russian icebreaker was built to be able to carry Kalibr cruise missiles, and with Russia—and China—increasingly active in the Arctic, in May 2020 the US Navy sent naval surface ships to the Barents Sea for the first time since the Cold War.52","zh":"紧张还在继续升级。2016年6月，中国首次派军舰前往尖阁诸岛，一艘护卫舰驶入这些岛屿周边海域。⁵⁰ 2018年1月，解放军海军以一艘核动力攻击潜艇进入该海域，为新年开局。⁵¹ 在北边，俄罗斯新建的一艘破冰船可搭载“口径”巡航导弹；随着俄罗斯与中国在北极日益活跃，2020年5月，美国海军自冷战结束以来首次派水面舰艇进入巴伦支海。⁵²"},{"id":"ch11-087","p":235,"t":"p","en":"As the US Department of Defense continues to prepare for various scenarios of escalation with China, it's recognized that it needs tighter integration between the navy and the marines. That was, of course, how both services were born—at the time of the fight against the Barbary pirates, and building on the British tradition, these were inseparable forces; the marines had no separate existence apart from life aboard and campaigns launched from naval ships. But as advanced air transport has allowed the marines to get to its battles without the navy, many countries' marines have developed ever more as a separate service—and in the case of the United States, that's especially been true as the marines become the de facto lead service in fighting America's long wars in the Middle East. But by 2019, the commandant of the marines recognized that if America's principal potential adversary is the Chinese PLA, then it has to get back to the concept of fighting together with the navy, and with a focus on the first island chain. His directive to the marine service that year called for it to prepare for pre-positioning contingents of marines out in the peninsulas and islands surrounding the first island chain.53 It would also mean pre-positioning weapons supplies at bases and locations throughout those waters. And in a neat","zh":"美国国防部在持续为与中国冲突升级的各种情形做准备的同时，也意识到海军与海军陆战队必须更紧密地整合。这两支力量原本就是这样诞生的——在对抗巴巴里海盗的年代，沿袭英国的传统，二者不可分割；除了随舰生活、从军舰上发起战役，陆战队并无独立的存在。但先进的空运使陆战队不必依靠海军也能抵达战场，许多国家的陆战队于是越来越发展成一个独立军种——在美国尤其如此，因为在中东的几场长期战争中，陆战队事实上成了打头阵的军种。然而到2019年，陆战队司令意识到：如果美国主要的潜在对手是中国军队，那么陆战队就必须回到与海军并肩作战的理念上，并且以第一岛链为重点。他当年对陆战队下达的指令要求：做好准备，把陆战队分队预置到第一岛链周边的半岛和岛屿上。⁵³ 这也意味着要在这一带海域的基地和据点预置武器与补给。而历史还有一个巧妙的"},{"id":"ch11-088","p":236,"t":"p","en":"twist of history, one of the proposals that's been floated to accomplish this is to \"containerize\" missiles—literally to use what the army still refers to as CONEX boxes to ship large numbers of missiles out to American forward positions.54 Malcom McLean, the man who popularized this technique in the 1950s, would be pleased.","zh":"转折：为达成这一点，已经有人提出的方案之一，是把导弹“集装箱化”——字面意思，就是用陆军至今仍称作“康乃克斯箱”（CONEX）的箱子，把大量导弹运到美国的前沿阵地。⁵⁴ 20世纪50年代使这项技术流行起来的那个人——马尔科姆·麦克莱恩，想必会感到欣慰。"},{"id":"ch11-089","p":236,"t":"p","en":"To summarize, then, China's \"Malacca Dilemma\" spurred it to develop a naval capacity to defend the Near Seas; and then to defend that capacity out to the Western Pacific. At the same time, America has been responding, ship by ship, missile by missile, submarine by submarine, to advances in Chinese capacity. The interplay between these two dynamics is pulling the Chinese PLAN and the US Navy into an arms race; and that, in turn, is pulling the two nations toward war.","zh":"概括起来：中国的“马六甲困局”促使它发展出保卫近海的海军力量，随后又要把防线一路推到西太平洋，以保卫这支力量本身。与此同时，美国一直以舰对舰、弹对弹、艇对艇的方式，回应中国能力的每一分进展。这两股力量的相互作用，把中国海军与美国海军拖进了
