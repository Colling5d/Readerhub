psided triangle encompassing the heart of the South China Sea. The Paracels lie some 250 miles off of central Vietnam's coast, 220 miles south of the Chinese island of Hainan, and stretch as far as a tiny feature known as Woody Island (which lies at 16.8366 degrees north, 112.3368 degrees east). The Spratlys lie southeast, off the northern coast of the Malaysian Peninsula. And the Scarborough Shoal lies roughly four hundred miles from China's shore, but just west of the main Philippine islands.¹7 By claiming these three sets of features, China was claiming the whale's share of the sea, and land features that together encircled the shipping lanes—the key Mahanian “sea-lanes of communication.\"18","zh":"中国这一庞大主张的核心，是西沙群岛（Paracels）、南沙群岛（Spratly Islands）和黄岩岛（Scarborough Shoal）的地物。这三处连起来，构成一个不等边的三角形，罩住南海的中心。西沙群岛距越南中部海岸约250英里，位于中国海南岛以南220英里，最远处一直延伸到一处叫作永兴岛（Woody Island，北纬16.8366度、东经112.3368度）的小地物。南沙群岛在东南方向，紧邻马来半岛北岸。黄岩岛距中国海岸约400英里，却紧贴菲律宾主要岛屿的西侧。¹⁷ 通过对这三组地物提出主张，中国等于索取了这片海里最大的一份，而这些地物合起来恰好环绕着航道——马汉所说的关键的“海上交通线”。¹⁸"},{"id":"ch09-039","p":187,"t":"p","en":"China was not alone in making claims in the South China Sea. Five other states had filed claims for some combination of those land features, and their surrounding maritime space: Taiwan, Vietnam, the Philippines, Malaysia, and Brunei. The other states' claims, though, were substantially more modest and more targeted to island features close to their shores.","zh":"在南海提出主张的不止中国。另有五个国家和地区就这些地物及周边海域的某些部分提出了主张：台湾、越南、菲律宾、马来西亚和文莱。不过，其他各方的主张要克制得多，也更多针对靠近本国海岸的岛屿地物。"},{"id":"ch09-040","p":187,"t":"p","en":"China's claims were not particularly compelling.19 But then again, neither were those of its competitors. In the modern era, none of these islands had been meaningfully occupied in ways that common sense would say meant that they \"belonged\" to one state or another. Competing states tried to buttress their claims with a whole series of creative steps—building maritime research stations in disputed areas, putting up lighthouses, locating meteorology stations and satellite control posts on the features—and even building a so-called “special bird-watching stand.\"20 However, in the words of one prominent legal scholar, “in a sense these occupations and related activities can be viewed as being symptomatic of the shortcomings in the claimant states' cases\" and the states \"give every appearance of operating on the basis of the old adage that possession is nine-tenths of the law.\"21","zh":"中国的主张并不特别有说服力。¹⁹ 不过话又说回来，其他竞争者的主张也一样。在近代，这些岛屿没有一个曾被真正有效地占据，以至于按常理就能说它们“属于”这个国家或那个国家。相互竞争的国家想出一连串别出心裁的办法为自己的主张撑腰——在争议区域建海洋研究站，竖灯塔，在地物上设气象站和卫星控制站——甚至修了一座所谓的“专用观鸟台”。²⁰ 然而，用一位知名法学学者的话说，“从某种意义上讲，这些占据及相关活动，恰恰可以看作主张国自身理据不足的症状”，而这些国家“处处显得是在按那句老话行事：谁占有，谁就占了九分法理”。²¹"},{"id":"ch09-041","p":187,"t":"p","en":"But possess them they soon did. And as China asserted these claims, it backed them up—with a steady tempo of deployments of frigates and cruisers and destroyers of the PLAN.","zh":"但它们很快就真的把这些地方占住了。中国提出这些主张的同时，也用行动为它们撑腰——以稳定的节奏，把中国人民解放军海军的护卫舰、巡洋舰和驱逐舰一批批派了过去。"},{"id":"ch09-042","p":187,"t":"h","en":"The East China Sea—and the Old Enemy","zh":"东海——与宿敌"},{"id":"ch09-043","p":187,"t":"p","en":"Soon after its move to claim territory in the South China Sea, the Chinese gaze swept northward to the East China Sea. But there it encountered a more powerful obstacle than geography—the Japanese navy.","zh":"中国在南海提出领土主张后不久，目光便向北扫向东海。但在那里，它撞上了一个比地理更强大的障碍——日本海军。"},{"id":"ch09-044","p":187,"t":"p","en":"In the postwar period, we've become accustomed to thinking of Japan as a pacifist power. Japan's Basic Law—the constitution drafted for postwar Japan by the American occupation authorities after World War II—explicitly forbids Japanese rearmament for offensive purposes and explicitly commits Japan not to engage in warring activities. Even its armed forces, such as they are, are known as the Japan Self-Defense Force. Japan has been reluctant to engage even in such modest international security activities as UN peacekeeping.²² Japan's anti-militarism, a reaction to its own excesses in the days of the Japanese occupation of Korea and Manchuria and to the horrors of Nagasaki and Hiroshima, is now deeply embedded in Japanese political culture.²3","zh":"战后，我们渐渐习惯把日本看成一个和平主义国家。日本的《基本法》——即二战后由美国占领当局为战后日本起草的宪法——明确禁止日本为进攻目的重整军备，也明确规定日本不得参与交战行为。就连它的武装力量，虽然名不副实，也叫作日本自卫队。日本连联合国维和这样有限的国际安全行动都不愿参与。²² 日本的反军国主义，既是对本国当年占领朝鲜、满洲时种种暴行的反弹，也是对长崎、广岛惨祸的回应，如今已深深嵌入日本的政治文化。²³"},{"id":"ch09-045","p":188,"t":"p","en":"There's a crucial exception: defense against China is not considered to be a warring activity. It's explicitly a function of self-defense and so it falls outside of the prohibitions in the Japanese constitution. Japan's capacity to defend itself against Beijing is substantial.²4 That's particularly so when it comes to its navy.","zh":"但有一个关键例外：针对中国的防御不算交战行为。它明确属于自卫职能，因而落在日本宪法禁令之外。日本抵御北京的能力相当可观，²⁴ 海军尤其如此。"},{"id":"ch09-046","p":188,"t":"p","en":"Operating from numerous bases across the Japanese archipelago, the Japan Maritime Self-Defense Force is the world's fourth-largest navy and one of its most effective. It encompasses 45,800 personnel with a total of 114 ships. That surface fleet is accompanied by around twenty submarines, as well as other support ships.2⁵ All of this is complemented by a highly effective Coast Guard of fourteen thousand personnel.26 And in 2006, it decided to turn two large destroyers into what it euphemistically called \"helicopter destroyers,\" but was really the next step toward an aircraft carrier.27 In 2018, the Japanese government announced that it would turn its larger Izumo-class \"helicopter destroyers\" into \"multi-purpose operation destroyers\" that would happen to be capable of launching jets. For all intents and purposes, these vessels would serve as aircraft carriers, marking the first time since World War II that Japan has possessed that particular naval weapon.28","zh":"日本海上自卫队以日本群岛各地的众多基地为依托，是全世界第四大海军，也是战斗力最强的海军之一。它有 45,800 名人员、共 114 艘舰艇。这支水面舰队还配有约 20 艘潜艇及其他支援舰船。²⁵ 此外还有一支一万四千人的海上保安厅，效率极高。²⁶ 2006 年，日本决定把两艘大型驱逐舰改成它委婉称呼的“直升机驱逐舰”，而这一步实际是迈向航空母舰的下一级台阶。²⁷ 2018 年，日本政府宣布，将把较大的“出云”级“直升机驱逐舰”改为“多用途运用舰”——这些舰恰好能够起降战斗机。实际上，它们将充当航空母舰，这是二战以来日本首次拥有这类海军武器。²⁸"},{"id":"ch09-047","p":188,"t":"p","en":"Japan deploys that force along the breadth of its archipelago, which encloses the East China Sea. As such, it encloses China at its most productive zone: the eastern seaboard, where lies the delta of the Yangtze River, just east of Shanghai. The East China Sea is also rich in resources (especially oil and gas—as we'll see in Part IV), adding to the competitive pressure between the two countries.","zh":"日本把这支力量沿着群岛的纵深铺开，而这串群岛环抱着东海。于是它也把中国最有生产力的地带环抱在内：东部沿海，长江的三角洲就在那里，紧贴上海以东。东海还蕴藏丰富资源（尤其是石油和天然气——第四部会讲到），这又加重了两国之间的竞争压力。"},{"id":"ch09-048","p":188,"t":"p","en":"All of Japan is an archipelago. Its major islands run from Hokkaido in the northeast to Kyushu in the southwest. But even farther south and west, a string of small islands stretch from the Osumi islands of Kyushu's coast via Okinawa to the Senkaku Islands, a mere eightyseven miles off Taiwan's coast. And it was there that in 2010, the Chinese and Japanese nearly came to blows.","zh":"日本全境就是一个群岛。主要岛屿从东北的北海道排到西南的九州。但再往南、再往西，还有一长串小岛，从九州海岸外的大隅群岛经冲绳，一直延伸到尖阁诸岛（即钓鱼岛及其附属岛屿）——那里离台湾海岸只有 87 英里。2010 年，中日两国正是在那里险些动起手来。"},{"id":"ch09-049","p":188,"t":"p","en":"Initially, there was a degree of ambiguity as to whether or not US treaty obligation to Japan covered these Japanese-administered but essentially uninhabited islands. President Obama removed that uncertainty in 2014 when he explicitly declared that the Japaneseadministered territory was covered by the treaty.29 And when China declared that the airspace out from the Chinese coast just below Korea's island of Jeju to just north of Taiwan, an area that includes the Senkakus, constituted an “air defense interdiction zone\"—i.e., a zone in which China would exclude foreign planes from flying—Obama ordered two nuclear-capable B-52s to fly through the airspace.30","zh":"起初，美国对日本的条约义务是否涵盖这些由日本管理、但基本无人居住的岛屿，多少有些含糊。2014 年，奥巴马总统明确宣布，这些由日本管理的领土在条约涵盖范围之内，消除了这份不确定。²⁹ 此后，中国宣布，从中国海岸外、朝鲜济州岛以南到台湾以北的空域——这一区域包含尖阁诸岛——构成“防空拦截区”，即中国不许外国飞机飞入的区域；奥巴马随即下令两架可携带核武器的 B-52 飞越该空域。³⁰"},{"id":"ch09-050","p":189,"t":"p","en":"Because unlike the situation in the South China Sea, the East China Sea comes with a twist—Japan is not only a treaty ally, it is an ally with whom the United States has a mutual defense commitment. Article 5 of the Treaty of Mutual Cooperation and Security Between the United States and Japan commits the United States to come to the defense of Japan if it falls under attack. This is no mere formality, either, for Japan also houses the largest overseas American naval presence in the world, at United States Fleet Activities Yokosuka in Tokyo Harbor. Together with Fuchu Air Base, Yokota Air Base, Sasebo Naval Base, and Marine Corps camps on Okinawa, Torii Station Army Base, and smaller encampments throughout Japan, over one hundred thousand American personnel and families from all the services are present, as well as tens of thousands of Japanese personnel.³1","zh":"因为与南海的局势不同，东海还多一层转折：日本不只是一个条约盟友，还是与美国互有共同防务承诺的盟友。《美日相互合作及安全保障条约》第五条承诺，日本一旦遭受攻击，美国将出兵防卫。这也并非只是形式，因为日本还驻有美国在海外规模最大的一支海军力量，即东京湾的横须贺美国海军基地。再加上府中空军基地、横田空军基地、佐世保海军基地，冲绳的海军陆战队营地、鸟居站陆军基地，以及遍布日本各地的小型营区，各军种的美国军人与家属超过十万人，另有数万名日方人员。³¹"},{"id":"ch09-051","p":189,"t":"p","en":"All of this makes Japan a serious obstacle for China's Near Seas activities, let alone its wider ambitions.","zh":"这一切使日本成为中国近海行动的重大障碍，更不必说它更广泛的雄心了。"},{"id":"ch09-052","p":189,"t":"p","en":"While the Senkaku standoff did not ultimately escalate into direct confrontation, nor did the Japanese and American reaction cause China to back down completely. Instead, China has continued a high tempo of activities that fall in the gray zone between legitimate commercial and Coast Guard activity, and military harassment.3² For example, in 2010 a Chinese fishing trawler (part of its maritime militia*) collided with a Japanese Coast Guard patrol boat near the Senkakus. Japan arrested the Chinese captain, sparking protests in China and a diplomatic crisis.33 In December 2012, a Chinese government aircraft entered Japanese-controlled airspace for the first time since 1958, when such records began to be kept.³⁴ One defense official told reporters, “I think ... neither side has an interest or an intention to escalate the conflict at this point, although there's a lot of air and naval activity on a small confined space, so there's always potential for something.\"35","zh":"尖阁诸岛的对峙最终没有升级为直接冲突，日美两国的反应也没能让中国完全退让。中国转而继续以高频率开展各类活动，这些活动落在合法商业与海上执法活动和军事骚扰之间的灰色地带。³² 例如 2010 年，一艘中国拖网渔船（属于海上民兵*）在尖阁诸岛附近与日本海上保安厅的巡逻艇相撞。日本逮捕了中国船长，在中国国内引发抗议，酿成一场外交危机。³³ 2012 年 12 月，一架中国政府飞机进入日本控制的空域，这是 1958 年有此类记录以来第一次。³⁴ 一位国防官员对记者说：“我认为……目前双方都既无兴趣也无意图让冲突升级，尽管在这么小的一块封闭空间里有大量空中和海上活动，所以总有可能出点什么事。”³⁵"},{"id":"ch09-053","p":189,"t":"n","en":"Which Japanese defense officials call \"little green fishermen,\" reminiscent of the \"little green men” that Russia sent into Crimea.","zh":"日本防卫官员称之为“小绿渔民”，让人想起俄罗斯派往克里米亚的“小绿人”。"},{"id":"ch09-054","p":190,"t":"p","en":"But the Senkakus presented the United States with a rather acute dilemma. What if China called its bluff? Or gambled on the idea that an American president would not actually commit to war with a 1.2-billion-strong China over what amounted to a distant pile of rocks? Few American politicians or security analysts doubt that the United States would live up to its security obligations to Japan should the main body of that country come under attack. But a pile of rocks occupied only by a small herd of goats? The situation seemed absurd.","zh":"但尖阁诸岛给美国出了一道相当尖锐的难题。万一中国真的来试它的底牌呢？或者赌定美国总统不会为了远处一堆礁石，真去跟一个有 12 亿人口的中国开战？很少有美国政客或安全分析人士怀疑，如果日本本土遭到攻击，美国会履行对日本的安全义务。可要是那只是一堆礁石，上面只住着一小群山羊呢？这局面显得荒谬。"},{"id":"ch09-055","p":190,"t":"p","en":"Far less absurd is the question of America's security relations with the next island down the chain—Taiwan itself.","zh":"而顺着岛链再往下一个岛，事情就没那么荒谬了——那个岛就是台湾本身，是美国与它的安全关系。"},{"id":"ch09-056","p":190,"t":"h","en":"Flash Point Formosa","zh":"福尔摩沙：引爆点"},{"id":"ch09-057","p":190,"t":"p","en":"The Taiwan Strait divides mainland China from the island of Taiwan, running along the island's 245-mile length. At its widest, it is 110 miles; at its narrowest, 81. It's also fairly shallow, with the vast majority of the strait less than 490 feet deep.","zh":"台湾海峡把中国大陆与台湾本岛分隔开来，沿海岛 245 英里的长度伸展。最宽处 110 英里，最窄处 81 英里。海峡还相当浅，绝大部分水域深度不足 490 英尺（约 150 米）。"},{"id":"ch09-058","p":190,"t":"p","en":"Taiwan has a complex history. The indigenous population were largely displaced by mass Han migration in the seventeenth century, and then the island fell under Dutch rule when the Min Dynasty in turn expelled the Han rulers. The island was annexed to the Qing Dynasty in 1683, but a hundred and some odd years later ceded to Japan during the first Japan-China war in 1895. Japan used Taiwan during World War II as an important industrial base and as a key set of ports. After the war and the surrender of Japan, the Republic of China, which was founded in the mainland in 1912 and replaced the Ching Dynasty, took control over the island of Formosa. When, during the Chinese civil war, the ROC lost the mainland to the Chinese Communist Party, the core of the ROC government fled to Taiwan in 1949. Over time, it transitioned from a one-party dictatorship to a multiparty democracy, and thus, is two thorns in the side of the Chinese leadership. They see it as a physical loss of formerly Chinese-owned territory and as an ideological threat to the mainland.36","zh":"台湾的历史颇为复杂。17 世纪大批汉人移入，原住民大多被挤走；此后明王朝又将汉人统治者逐出，台湾岛落入荷兰人之手。1683 年，台湾岛并入清朝版图，但一百多年后，在 1895 年的第一次中日战争中割让给了日本。二战期间，日本把台湾当作重要的工业基地和一组关键港口。战后日本投降，1912 年在大陆成立、取代清朝的中华民国接管了福尔摩萨岛。中国内战期间，中华民国在大陆败给中国共产党，其政府核心于 1949 年逃往台湾。随着时间推移，它从一党专政转为多党民主制，于是成了中国领导层肋下的两根刺：一是版图上失去了原属中国的领土，二是对大陆构成意识形态威胁。³⁶"},{"id":"ch09-059","p":190,"t":"n","en":"It has since been described as \"the Senkaku Paradox\"-—because the United States couldn't afford to back down, but also couldn't credibly commit to launching a war with China over such small triggering stakes. See Michael E. O'Hanlon, The Senkaku Paradox: Risking Great Power War Over Small Stakes (Washington, DC: Brookings Institution Press, 2019).","zh":"此事后来被称为“尖阁悖论”——因为美国既退不起，又无法可信地承诺为如此之小的触发利益而与中国开战。见迈克尔·E. 奥汉隆（Michael E. O'Hanlon），《尖阁悖论：为小利冒大国战争之险》（The Senkaku Paradox: Risking Great Power War Over Small Stakes，华盛顿特区：布鲁金斯学会出版社，2019 年）。"},{"id":"ch09-060","p":191,"t":"p","en":"Its relations to the United States have also been complex. Although the US recognized the Kuomintang government of the ROC in 1950, it explicitly ruled out engaging in the Taiwan Straits. Truman, though, did send the Seventh Fleet to the Straits of Formosa during the Korean War. In the 1950s, Taiwanese deployment on the islands of Quemoy and Matsu, among others, sparked the First Taiwan Strait Crisis. Rather than engage militarily, the United States upgraded its legislative standards, adopting the Formosa Resolution, which gave Eisenhower the authority to defend Taiwan. Beijing backed down. 37","zh":"它与美国的关系同样复杂。1950 年，美国承认中华民国的国民党政府，却又明确表示不介入台湾海峡。不过朝鲜战争期间，杜鲁门还是把第七舰队派进了福尔摩萨海峡。20 世纪 50 年代，台湾在金门、马祖等岛屿上的部署引发了第一次台湾海峡危机。美国没有动武，而是提高了立法层级，通过《福尔摩萨决议案》，授权艾森豪威尔防卫台湾。北京退让了。³⁷"},{"id":"ch09-061","p":191,"t":"p","en":"Then Taiwan and the United States signed the Sino-American Mutual Defense Treaty, which held from 1955 to 1979, and would have brought the United States to the defense of Taiwan if and when it came under attack. In 1972, the Shanghai Communiqué, which followed Kissinger's negotiations for the diplomatic recognition of Beijing, recognized that the PRC was \"the sole legal Government of China.\" Simultaneously, the United States, partly through the urging of Congress, adopted what's known as the One China policy. Under this policy, the US did not officially recognize Chinese sovereignty over Taiwan. Instead, in a diplomatic sleight of hand, Washington acknowledged the Chinese position that Taiwan was part of China. It thus has formal relations with the PRC and unofficial relations with Taiwan.38 The Mutual Defense Treaty lasted until 1979, when President Jimmy Carter formally cut off relations with Taiwan and abrogated the treaty. But that same year, Congress adopted the Taiwan Relations Act, which allowed the United States to conduct unofficial diplomacy with 'Taiwan, but even more critically to sell them defensive military equipment.39","zh":"随后，台湾与美国签订《中美共同防御条约》，该条约自 1955 年维持至 1979 年，一旦台湾遭受攻击，美国将出兵防卫。1972 年，基辛格为外交承认北京进行谈判之后发表了《上海公报》，其中承认中华人民共和国是“中国的唯一合法政府”。与此同时，美国在国会的推动下（部分原因在此），采行了所谓的“一个中国”政策。按这一政策，美国不正式承认中国对台湾的主权，而是玩了一手外交障眼法，只“认知”中国关于台湾是中国一部分的立场。于是它同中华人民共和国保持正式关系，同台湾保持非官方关系。³⁸ 《共同防御条约》一直维持到 1979 年，卡特总统正式与台湾断交并废约。但就在同一年，国会通过《与台湾关系法》，允许美国与台湾进行非官方外交，而更关键的是，可以向台湾出售防御性武器装备。³⁹"},{"id":"ch09-062","p":191,"t":"p","en":"The sale of defensive military equipment is the key point. Sales of new equipment and of refurbished American ships and aircraft have allowed Taiwan to develop into a substantial naval power in its own right. By 2018, its naval force comprised 38,000 personnel, 28 aircraft, and 117 ships—and all of that capacity is dedicated to defending a narrow strip of Taiwanese territorial waters. That included a small submarine fleet, but more importantly four destroyers (formerly US destroyers), and about two dozen frigates, built based on licensing agreements with the United States.40 Ships bought from France round out the combat fleet. The Republic of China's navy also has a missile boat, a dozen patrol ships, minesweepers, and up to nine amphibious ships that allow for tank landing and personnel movement across the Taiwan Strait. In addition, auxiliary ships like fast combat support ships, research ships, and rescue and salvage operations round out their naval capability. Most recently, they have commissioned a large amphibious ship and have begun to develop their own diesel submarine fleet.41","zh":"出售防御性武器是关键所在。新装备的销售，加上美国翻新的舰船和飞机，使台湾得以自行发展成一支可观的海上力量。到 2018 年，其海军有 38,000 人、28 架飞机、117 艘舰艇，而这些力量全部用于防卫一条狭窄的台湾领海水域。其中包括一支小型潜艇部队，更重要的是 4 艘驱逐舰（原为美国驱逐舰）和约 24 艘护卫舰，后者按与美国的授权协议建造。⁴⁰ 从法国购买的舰艇补足了战斗舰队。中华民国海军还有 1 艘导弹艇、十余艘巡逻舰、扫雷舰，以及最多 9 艘两栖舰，可以运送坦克登陆、输送人员穿越台湾海峡。此外，快速战斗支援舰、调查船以及救援打捞力量等辅助舰船，也补全了它的海上能力。最近，它又有一艘大型两栖舰服役，并开始发展自己的柴电潜艇部队。⁴¹"},{"id":"ch09-063","p":192,"t":"p","en":"All of this still leaves Taiwan facing a stronger, more sophisticated force across the Taiwan Strait, but Taiwan has invested in \"asymmetric operations\"—basically, David versus Goliath tactics—like laying large quantities of mines in the waters, or having the capacity to lay large quantities of mines, and using small fast attack boats and truck-launched anti-ship cruise missiles to weaken the Chinese advantage.","zh":"即便如此，台湾海峡对岸的力量仍然更强大、更精良。但台湾着力经营“不对称作战”——大体上就是大卫对歌利亚的战术——比如在相关海域布设大量水雷（或者说具备布设大量水雷的能力），并用小型快艇和卡车发射的反舰巡航导弹，削弱中国的优势。"},{"id":"ch09-064","p":192,"t":"p","en":"All of this still probably leaves China with the upper hand should it come to direct conflict between China and Taiwan, but a far more equal conflict than would be normal for a country with the size and population of Taiwan, relative to a country the size and population of China.","zh":"倘若两岸直接冲突，占上风的很可能仍是中国；但以台湾这样的体量与人口，去对上一个有着中国大陆那般体量与人口的对手，这场冲突会远比通常情形更为势均力敌。"},{"id":"ch09-065","p":192,"t":"p","en":"There is no legal requirement for the United States to involve itself in Taiwan now, but there are a whole series of political and other reasons why it might. It's a former ally, and a current defense partner. Taiwan plays a critical role in the American supply chain in high technology, especially in computer chips. And not just technology: Taiwan was the first country to supply surplus personal protective equipment to the United States after the outbreak of COVID-19.42 There's anti-China sentiment to factor in, and seen from the vantage point of Washington's national security establishment, there's American prestige on the line. Above all, Taiwan is a democracy threatened by a country that many in the United States have begun to perceive as America's most important adversary.","zh":"如今，美国在法律上没有义务介入台湾，但它仍可能介入，背后自有一整套政治及其他理由。台湾是旧日的盟友，也是当下的防务伙伴。在美国的高科技供应链中，尤其是计算机芯片领域，台湾扮演着关键角色。而且不只是技术：新冠疫情暴发后，台湾是最早向美国提供多余个人防护装备的地方。⁴² 还有国内的反华情绪可作动因；而从华盛顿国家安全机构的视角看，这还关乎美国的威望。最重要的是，台湾是一个民主政体，而威胁它的那个国家，已被美国许多人视为美国最重要的对手。"},{"id":"ch09-066","p":192,"t":"p","en":"And there's this: if China were to reintegrate Taiwan into the core of the Chinese political entity, it would suddenly gain naval bases beyond the first island chain. The southern coast of Japan would be far more vulnerable to the Chinese PLAN, and America's defenses in the rest of the Western Pacific more exposed to Chinese power. Taiwan has become a major feature in the debate about American power and prestige in Asia, but it's also China's key to unlocking the first island chain. And therefore critical to America's forward posture.","zh":"还有一点：如果中国把台湾重新纳入中国政治实体的核心，它就会突然获得第一岛链之外的海军基地。日本南岸将更易受到中国海军的威胁，美国在西太平洋其余地区的防务也将更直接地暴露在中国力量之下。在关于美国于亚洲的实力与威望的辩论中，台湾已成为一个核心议题；但它同时也是中国打开第一岛链的钥匙，因而对美国的军事前沿态势至关重要。"},{"id":"ch09-067","p":193,"t":"p","en":"So if China was to contemplate a military operation to retake Taiwan, it would have to be prepared to stop the US Navy from reinforcing the Taiwanese fleet (and its own forces) inside the Near Seas. In other words, it would have to be able to mount what it calls a \"counterintervention\" operation beyond the Near Seas-out past the first island chain, into the wider waters of the Philippine Sea, perhaps as far east as Guam. This required a substantial toughening of the PLAN.","zh":"因此，如果中国要考虑以军事行动收复台湾，就必须准备好阻止美国海军在近海之内增援台湾舰队（以及它自己的部队）。换句话说，它必须有能力在近海之外——越过第一岛链，进入菲律宾海更广阔的水域，也许向东远至关岛——实施它所说的“反介入”行动。这就要求中国人民解放军海军大幅增强实力。"},{"id":"ch09-068","p":193,"t":"h","en":"Hardening the Seas","zh":"把海洋筑成壁垒"},{"id":"ch09-069","p":193,"t":"p","en":"That the Chinese have to think about the presence of the US Navy in the Near Seas is an artifact of three distinct but reinforcing American concepts. There's the alliance system, and the notion that the United States would come to the defense of smaller powers that have chosen to ally themselves to the US. There's America's long naval presence in Asia, stretching as far back as the 1840s. And there's a deeply embedded view in the US Navy that one of its core functions—inherited from the Royal Navy—is to protect the freedom of the seas.","zh":"中国不得不顾及美国海军在近海的存在，这是美国三个彼此不同却又相互加强的观念造成的。其一是同盟体系，以及这样一种信念：对于选择与美国结盟的较小国家，美国会出手防卫。其二是美国在亚洲长期的海军存在，其源头可上溯到 19 世纪 40 年代。其三，美国海军内部深植着一种看法：它的一项核心职能——承自英国皇家海军——就是维护海洋的自由。"},{"id":"ch09-070","p":193,"t":"p","en":"This is an important part of what's meant when American diplomats these days refer to a “rules-based international order.\" The “rules” in question are the UN Convention on the Law of the Sea—an international law the United States has not ratified in Congress, but in practice both implements and enforces.* Those rules stipulate the right of any state to sail through the territorial waters of any other state so long as the purpose of their sailing is “innocent\"—the concept of “innocent passage\" we encountered in chapter 8. Only the state that has the territorial claim can fish its waters or develop its seabed resources, but any state can sail through. This makes it, among other things, a way of pushing back against any one power operating a naval sphere of influence off their coast. Which is a very comfortable set of rules if you're the only global power able to operate off everyone's coast, and a somewhat less comfortable set of rules if you are a rìsing, aspiring power like China.","zh":"美国外交官如今说“基于规则的秩序”，其中很重要的成分就在这里。所谓的“规则”，指的是《联合国海洋法公约》——一部美国国会尚未批准、实践中却既实施又执行的国际法。* 这些规则规定，任何国家都有权驶过任何其他国家的领海，只要航行的目的是“无害”的——这就是我们在第 8 章遇到过的“无害通过”概念。只有提出领土主张的国家才能在自己主张的水域捕鱼、开发海床资源，但任何国家都可以驶过。于是这套规则在诸多作用之外，还成了一种反制手段：不让任何单一强国在别国家门口划出自己的海军势力范围。如果你是有能力在所有国家近海活动的唯一全球强国，这套规则非常舒服；如果你是像中国这样正在崛起、雄心勃勃的强国，这套规则就没那么舒服了。"},{"id":"ch09-071","p":193,"t":"n","en":"It may seem ironic that the US Navy should focus on enforcing an international law Congress has refused to ratify. Yet this has been how the United States has approached many such treaties, like the Comprehensive Nuclear-Test-Ban Treaty.","zh":"美国海军致力于执行一部国会拒绝批准的国际法，这看起来或许有些讽刺。但美国对待许多此类条约都是如此，《全面禁止核试验条约》即为一例。"},{"id":"ch09-072","p":194,"t":"p","en":"The essential mechanism by which the United States enforces the law of the sea is what it calls freedom of navigation operations (which go by the clumsy abbreviation FONOPs). That is, the US Navy deliberately sails its ships directly through waters that it believes are permissible for open navigation even if another power has claimed them as part of their territory, daring the other power to push back.4³ To its credit, the United States has undertaken such freedom of navigation operations in the territories of allies and adversaries alike, living up to its claim to act as an impartial arbiter of the rules.' But it has placed particular emphasis on freedom of navigation operations in waters now claimed by China.","zh":"美国执行海洋法的主要机制，是它所说的“航行自由行动”（英文缩写 FONOPs，颇为拗口）。也就是说，美国海军有意把军舰直接开进它认为可以自由通行的水域，即便另一强国已宣称那里是其领土的一部分，以此逼对方作出反应。⁴³ 值得肯定的是，美国对盟友和对手的领土都开展过这类航行自由行动，算是兑现了它要做规则的中立裁判的说法。* 但它格外看重的，是在目前中国主张的水域开展航行自由行动。"},{"id":"ch09-073","p":194,"t":"p","en":"Even assuming that the US Navy's presence in the Near Seas is only to defend the Law of the Sea Convention (and the US no longer even really maintains that stance), these \"freedom of navigation operations\" put US warships in a position to substantially impede China's military options in the Taiwan Strait, and across the South and East China Seas.44 And so, from the late 1990s onward, China focused its energy and effort on building out its capacity to push back, to defend its interests in the Near Seas, and frustrate or limit USN freedom within those waters.","zh":"就算假设美国海军在近海的存在只为捍卫《海洋法公约》（况且美国如今连这个说法都不大坚持了），这些“航行自由行动”也使美国军舰有能力大幅妨碍中国在台湾海峡以及南海、东海的军事选择。⁴⁴ 于是从 20 世纪 90 年代末起，中国把精力集中用于建设反制能力，以捍卫自己在近海的利益，阻挠或限制美国海军在这些水域的自由。"},{"id":"ch09-074","p":194,"t":"p","en":"A UN tribunal eventually ruled on the expansive claim by China and rejected large swaths of it. But China's reaction to this was essentially to shrug—it simply ignored the law and went about its business.45 And as time progressed, it became increasingly clear that part of its business was to transform these island features into bases for the PLAN.","zh":"一个联合国仲裁庭最终对中国这项宽泛的主张作出裁决，否决了其中大片内容。但中国的反应基本上是一耸肩——干脆不予理睬，照旧做自己的事。⁴⁵ 随着时间的推移，越来越清楚的是，它“自己的事”之一，就是把这些岛屿地物变成中国人民解放军的基地。"},{"id":"ch09-075","p":194,"t":"p","en":"A key to understanding the dynamic of the Near Seas is that large reaches of them are exceedingly shallow. The large container ships that ply its route stick to narrow passages where the depths plummet to more than two miles. But even they frequently sail through subchannels that are no more than two to three hundred feet in depth, carefully watching their draw. As they sail, they closely watch charts that show a plethora of sand cays, banks, reefs, and other features of extremely shallow waters. This is very useful for such activities as fishing and oil exploration. But it's also helpful for land reclamation—for taking minor “island features” and turning them into larger tracts of low-lying land.","zh":"理解近海局势的一个关键，是这片海域有大片区域极浅。往来于此的大型集装箱船都走那些狭窄的深水通道，那里的水深可达两英里以上。但即便是它们，也常常要穿过深度不超过两三百英尺的支航道，小心留意吃水。航行时，它们得紧盯海图，图上密密麻麻标着沙洲、浅滩、暗礁以及其他极浅水域的地物。这对捕鱼和石油勘探之类的活动很有用。但它对填海造陆同样有用——把小小的“岛屿地物”变成大片低洼陆地。"},{"id":"ch09-076","p":194,"t":"n","en":"In April 2021, the USS John Paul Jones—which we will shortly encounter— conducted a series of freedom of navigation operations in Indian waters, to howls of protest from the Indian media.","zh":"2021 年 4 月，「约翰·保罗·琼斯」号（我们很快会写到它）在印度水域开展了一系列航行自由行动，引来印度媒体的猛烈抗议。"},{"id":"ch09-077","p":195,"t":"p","en":"And so began an initial phase of Chinese militarization of these waters. It dredged and reclaimed and built out from its claimed land features, eventually creating new, usable land in the South China Sea, especially around the Spratlys. Two of the main features around which China built out their land seemed particularly aptly named: Fiery Cross Reef, and Mischief Reef. These were built up with docks, large metal sheds, and, in some cases, landing strips. And then Beijing took a step it had repeatedly promised not to: they put military equipment on those reclaimed lands. Starting on Woody Island in the Paracels, China placed missile batteries, built airstrips, established docks, and in several other ways militarized their outposts in these disputed waters.4","zh":"中国的军事化就这样在这些水域拉开了第一阶段。它在自己主张的地物上疏浚、填海、扩建，最终在南海造出新的可用陆地，南沙群岛一带尤其如此。中国选来填海扩建的两处主要地物，名字起得格外贴切：永暑礁（Fiery Cross Reef）和美济礁（Mischief Reef）。岛上修起码头、大型金属棚屋，有些还铺了简易跑道。接着，北京迈出了它一再承诺不会迈的一步：在这些填海造出的陆地上部署军事装备。中国先从西沙群岛的永兴岛开始，布设导弹阵地、修机场跑道、建码头，还以其他几种方式把这些争议水域中的前哨军事化。⁴⁶"},{"id":"ch09-078","p":195,"t":"p","en":"These developments extended the range of the PLAN Air Force, especially its main fighter jets (the Russian-designed Sukhoi 30 MKKs, core of its fighter fleet), and enabled China to pose a threat to US Navy ships much farther away from the Chinese mainland. It was all part of the more ambitious vision of the Chinese leadership.","zh":"这些建设扩大了解放军海军航空兵的作战半径，尤其是其主力战斗机（俄制苏-30MKK，其战斗机群的核心），使中国能够对距离大陆远得多的美国海军舰艇构成威胁。这一切都出自中国领导层更为宏大的构想。"},{"id":"ch09-079","p":195,"t":"p","en":"One such leader was Admiral Wu Shengli, who took command of the PLAN in 2006. From the start, he pushed for two key reforms. First, he built up the sophistication and fighting capacity of the core Chinese fleet, and continued the effort to militarize its positions, building out still larger fortifications in the reclaimed islands. And he began to agitate for the PLAN to aim farther than the Western Pacific. As he drove modernization of the fleet, he updated its doctrine. His explicit instruction to the Chinese PLAN: to use its counter-piracy missions in the Malacca Strait and in the Indian Ocean to train for far-seas operations—and to interact with foreign navies to gain knowledge. In his writings to the Chinese fleet, he was explicit that the purpose of this effort was more than defensive: it was to bring to an end the “Century of Humiliation.\"47,' His vision seemed designed to give China the capacity to reach out to the “far seas\"—to develop that symbolic and persuasive instrument of global power, a blue-water navy. That meant extending the PLAN to the Pacific, Indian, and Arctic Oceans—in short, the precise area of operations of America's largest naval force, stationed out of Hawaii.48 And on the very waters that have been at the heart of American power projection since the end of World War II.","zh":"吴胜利海军上将就是其中一位，他于 2006 年出任中国人民解放军海军司令员。从一开始，他就力推两项关键改革。第一，提升中国核心舰队的精良程度与战斗力，继续推进阵地军事化，在填海岛屿上修建更大的工事。第二，他开始鼓动海军把目光投向比西太平洋更远的地方。在推动舰队现代化的同时，他也更新了海军的作战条令。他给中国海军的明确指示是：借在马六甲海峡和印度洋执行反海盗任务之机，演练远海行动，并与外国海军交往以获取知识。在与舰队的文字中，他明言这一努力的目的不止于防御：它要终结“百年国耻”。⁴⁷* 他的构想似乎是要让中国获得走向“远海”的能力——发展那种既具象征意义、又具说服力的全球实力工具：一支蓝水海军。这意味着把海军的力量延伸到太平洋、印度洋和北冰洋——简言之，正是美国从夏威夷出发的最大一支海军力量的作战区域。⁴⁸ 也正是在这些水域，自二战结束以来，美国的实力投送一直以之为核心。"},{"id":"ch09-080","p":196,"t":"p","en":"*Foreign critics of China often argue that the regime uses the \"Century of Humiliation\" purely as a propaganda device. It's striking, though, that Chinese PLAN commanders, writing in Mandarin and in specialized naval journals, also invoke the memory. In their authoritative account of Chinese-language sources on doctrine, Red Star over the Pacific, Yoshihara and Holmes cite Admiral Wu's articles in the Chineselanguage magazine Qiushi, which invoke this concept.","zh":"*外国批评中国的人常说，这个政权不过是把「百年国耻」当作宣传工具。然而耐人寻味的是，中国人民解放军海军的指挥官们用中文、在专业海军期刊上撰文时，同样会援引这段记忆。吉原俊井与詹姆斯·霍姆斯在《太平洋上的红星》一书中，对中文文献中的海军学说资料作了权威梳理，其中便引述了吴胜利上将在中文杂志《求是》上发表的文章——那些文章正援引了这一概念。"}],"notes":[]},{"id":"ch10","label":"Chapter 10","labelZh":"","title":"America's Lake","titleZh":"第十章　美国的内湖","part":"Part III: The Flag Follows the Trade","showPart":false,"partZh":"第三部","partTitleZh":"旗帜跟着贸易走","paras":[{"id":"ch10-001","p":197,"t":"p","en":"When an \"Urgency EGC Received\" warning about a North Korean missile test flashes into the bridges of commercial ships worldwide, they are not the first to receive the message. The test would have been detected first by satellites orbiting the area, and by American and Japanese long-range radar mounted on ships patrolling the adjacent waters. Then American signals collectors would relay the information to the US Naval Computer and Telecommunications Area Master Station Pacific on Wahiawa, Hawaii—the largest telecommunications station in the world.","zh":"当一条关于朝鲜试射导弹的“紧急 EGC 信息”（Urgency EGC Received）警报闪现在全球各地商船的驾驶台上时，这些商船并不是最早收到消息的一方。这次试射，最先应是被掠过该区域的卫星发现的，也是被邻近海域巡逻舰艇上装载的美日远程雷达发现的。此后，美方信号情报人员会把信息转送到位于夏威夷怀阿瓦（Wahiawa）的美国海军太平洋计算机与电信区域主站——那是世界上最大的电信站。"},{"id":"ch10-002","p":197,"t":"p","en":"Master Station Pacific is an essential hub in the flow of sensor and satellite information and data that forms a critical part of modern naval war fighting. But Master Station Pacific itself is but one part of an array of American defensive assets deployed across the Hawaiian archipelago. Hawaii is the last line of America's Pacific defense, and its first line of action for projecting military power across Asia.","zh":"在现代海战中，传感器与卫星所传回的信息和数据构成作战能力的关键一环，而太平洋主站正是这股信息流中的重要枢纽。不过，主站本身也只是美国部署在整个夏威夷群岛的防御资产体系中的一环。夏威夷既是美国太平洋防线的最后一道，也是它向亚洲投送军力的第一线。"},{"id":"ch10-003","p":197,"t":"p","en":"America's forward naval positions in Japan and Korea, and its defense arrangements with Singapore, bring the US Navy to the very edge of the Near Seas. Those forward positions are then vitally supported by America's own “string of pearls\"—a chain of islands that run across the width of the Pacific at intervals that allow each one to be reinforced by the next.¹ Basing agreements in the Philippines (where once the US held the mighty Subic Bay) start this island chain. From there, the navy can fall back to the American territory of Guam, 1,500 miles east; from there to the Marshall Islands and Micronesia (one thousand miles farther east), where the US has permanent basing rights; and from there, the last one thousand miles to the Hawaii archipelago. By dint of Hawaii's location, America's rear base for dealing with Asia is more than three thousand miles closer to Japan and China than it would be if California were still the western edge of American territory.","zh":"美国在日本、韩国的前沿海军基地，加上与新加坡的防务安排，把美国海军推到了“近海”的边缘。这些前沿据点又得到美国自己那条“珍珠链”的有力支撑——一串横贯太平洋的岛屿，彼此间隔恰好，后一座可以得到前一座的增援。¹ 这条岛链的起点，是菲律宾的基地协定（美国曾在那里握有强大的苏比克湾）。从菲律宾往东1,500英里，海军可以退守美国领土关岛；再往东1,000英里，是马绍尔群岛与密克罗尼西亚，美国在那里拥有永久基地权；从那里再走最后1,000英里，便到了夏威夷群岛。凭借夏威夷的位置，美国应对亚洲的后方基地距日本和中国，比加利福尼亚仍是美国领土西缘时近了三千多英里。"},{"id":"ch10-004","p":198,"t":"p","en":"Hawaii was of course the site of the December 7, 1941, attack by the Imperial Japanese Navy Air Service that sunk the USS Arizona and damaged twenty other American surface vessels at the American naval port that carries the same name as the small town at the mouth of its inlet, Pearl City. One of the more surprising features of the Japanese attack on Pearl Harbor is how little damage was done to the base itself. Notwithstanding the large loss of life, the Japanese bombing runs inflicted little damage to the base facilities.† That meant that the US Navy was able quickly to restore what was then called Naval Station Pearl Harbor to operational use. It became a critical part of American operations in the Pacific through the rest of World War II. In the aftermath of the war, it served as the base headquarters for what was then known as Commander in Chief Pacific, or CINCPAC—a role held by such famed naval commanders as Admiral Nimitz.","zh":"1941年12月7日，日本帝国海军航空队就在这里发动偷袭，在港内击沉了“亚利桑那”号，另使二十艘美国水面舰艇受损。这座美国军港的名字，取自湾口那座名叫珍珠城（Pearl City）的小镇。日本这次偷袭，最出人意料的一点是基地本身受损极轻。尽管人员伤亡惨重，日军的轰炸对基地设施造成的破坏却相当有限。† 这意味着美国海军得以迅速把当时的“珍珠港海军站”恢复到可用状态，此后直至第二次世界大战结束，它一直是美军太平洋作战的关键一环。战后，它又成为当时“太平洋司令部总司令”（CINCPAC）的驻地司令部——尼米兹海军上将等著名海军将领都曾出任此职。"},{"id":"ch10-005","p":198,"t":"p","en":"These facilities have grown and evolved. CINCPAC headquarters was moved up the hill to Camp Smith, originally the site of the Aiea Naval Hospital. In April 2004, it moved into a newly built facility, the Nimitz-MacArthur Pacific Command Center, a six-story building encompassing almost 250,000 square feet of office space for the senior leadership. From the offices and conference rooms of the three- and four-star admirals, the building looks down over banyan trees, red mangroves, and bungalows that slope down along Halawa Heights, to nearly the entire southern coast of Oahu, from Diamond Head to","zh":"这些设施不断扩建、演变。太平洋司令部总部迁往半山上的史密斯营（Camp Smith），那里原先是艾亚海军医院（Aiea Naval Hospital）的所在地。2004年4月，司令部搬入新建的尼米兹—麦克阿瑟太平洋指挥中心。这是一座六层建筑，为高层领导提供近25万平方英尺的办公空间。从三星、四星将军们的办公室和会议室望出去，视线越过榕树、红树林和沿着哈拉瓦高地（Halawa Heights）层层下斜的平房，几乎可以把瓦胡岛（Oahu）的整个南岸尽收眼底——从钻石头山（Diamond Head）到"},{"id":"ch10-006","p":198,"t":"n","en":"For a commanding account of America's long-unfolding presence in Asia, readers should turn to Michael Green's By More Than Providence: Grand Strategy and American Power in the Asia Pacific Since 1783 (New York: Columbia University Press, 2017).","zh":"关于美国在亚洲漫长展开的存在，一卷气势宏阔的记述可参阅迈克尔·格林（Michael Green）的《超越天意：1783年以来亚太的大战略与美国实力》（By More Than Providence: Grand Strategy and American Power in the Asia Pacific Since 1783，纽约：哥伦比亚大学出版社，2017年）。"},{"id":"ch10-007","p":198,"t":"n","en":"Historian Craig Symonds, in his account World War II at Sea, notes that Admiral Chuichi Nagumo, commander of the First Air Fleet during the attack on Pearl Harbor, took the fateful decision not to launch a third wave of attacks on the base, which had originally been envisaged as a strike designed to take out headquarters and maintenance facilities, oil tanks, and dry dock facilities.","zh":"历史学家克雷格·西蒙兹（Craig Symonds）在《海上二战》（World War II at Sea）中记述，偷袭珍珠港时统率第一航空舰队的南云忠一海军中将，做出了一个决定命运的选择：不再对基地发动第三波攻击。而按照最初的设想，这次空袭本就要打掉司令部与维修设施、油罐和干船坞。"},{"id":"ch10-008","p":199,"t":"p","en":"Waikiki to the light blue waters of Mamala Bay. The sweeping view echoes the growing responsibilities of the command, which were evolving to meet new Chinese (and Russian) activity. In 2018, at the order of Secretary of Defense Mattis, this evolution was formalized in a reconfiguration that gave it the designation Indo-Pacific Command, adding the entire Indian Ocean basin to its already extensive area of operations.","zh":"怀基基（Waikiki），再到马马拉湾（Mamala Bay）那片淡蓝的海水。这开阔的视野，正呼应着该司令部日益加重的职责——它们随着中国（以及俄罗斯）的新动向不断演变。2018年，奉国防部长马蒂斯之命，这一演变以一次改编尘埃落定：司令部改称印太司令部，在原本已十分广阔的作战区域之上，又纳入了整个印度洋。"},{"id":"ch10-009","p":199,"t":"p","en":"Pearl Harbor also is the home port of the USS John Paul Jones—a guided-missile destroyer. It's at the very heart of American defenses in the Pacific and Indian Oceans. The ship forms part of Destroyer Squadron 9, which comprises six other destroyers built to the same design-the so-called Arleigh Burke-class destroyers that form the backbone of the American fleet.* The destroyer group in turn is assigned to Carrier Strike Group 11, which sails together with the aircraft carrier USS Nimitz out of Naval Base San Diego, the largest base in the Pacific. Both are supported from naval installations in Everett, Washington.² Aside from Carrier Strike Group 11 and four others like it, the US Pacific Fleet also comprises Naval Submarine Forces Pacific, the Naval Air Forces Pacific, the famed Seventh Fleet (which encompasses Task Force 73, a logistics unit, in Singapore), the Third Fleet, US Naval Forces Korea, and US Naval Forces Marianas (Guam). And, crucially, it incorporates Fleet Activities Yokosuka— diplomatic wording for what would otherwise be known as a base, in Tokyo Harbor (almost exactly where Commander Perry anchored his Black Ships in 1853). Yokosuka hosts the USS Ronald Reagan together with Carrier Strike Group 5 and Destroyer Squadron 15—the only American aircraft carrier homeported outside of US territory, and a highly visible symbol of America's treaty obligations to defend Japan from attack.","zh":"珍珠港也是“约翰·保罗·琼斯”号的母港。这是一艘导弹驱逐舰，处于美国在太平洋与印度洋防御体系的最核心。该舰隶属第9驱逐舰中队，中队另有六艘同型驱逐舰——即所谓“阿利·伯克”级，美国舰队的骨干。* 这个驱逐舰中队又编入第11航母打击群，与航母“尼米兹”号一同从太平洋上最大的基地圣迭戈海军基地出航，两者均由华盛顿州埃弗里特的岸上设施提供保障。² 除第11航母打击群及另外四个同类打击群之外，美国太平洋舰队还下辖太平洋潜艇部队、太平洋航空兵部队、著名的第七舰队（其所属的后勤部队第73特遣队驻新加坡）、第三舰队、驻韩美国海军以及美国海军马里亚纳部队（关岛）。尤为关键的是，它还包含横须贺舰队基地——这是外交辞令，换个说法就是位于东京湾的一处基地（1853年佩里准将的“黑船”几乎就锚泊于此）。横须贺驻有“罗纳德·里根”号、第5航母打击群和第15驱逐舰中队。这是唯一一艘以美国本土之外为母港的美国航母，也是美国依条约防卫日本之义务的高度醒目标志。"},{"id":"ch10-010","p":199,"t":"p","en":"All of this amounts to 120,000 personnel under the command of the Pacific Fleet. But even this huge machinery is only one part of","zh":"这一切加起来，是归太平洋舰队指挥的12万名人员。但即便这样庞大的一台机器，也只是"},{"id":"ch10-011","p":199,"t":"n","en":"It is the US Navy's tradition to name both specific ships and classes of ships (specific hull designs) after famous admirals—like the Nimitz, the Arleigh Burke, and most recently the Zumwalt-class frigates. The Arleigh Burke class has a hull design that simultaneously improved its sea handling and generated a smaller radar footprint than destroyers with a similar displacement.","zh":"以著名海军将领的名字命名某艘军舰乃至某一舰级（即特定的舰体设计），是美国海军的传统——“尼米兹”号、“阿利·伯克”号，以及最近的“朱姆沃尔特”级护卫舰都是如此。“阿利·伯克”级的舰体设计，在改善航海性能的同时，雷达反射面积也比同等排水量的驱逐舰更小。"},{"id":"ch10-012","p":200,"t":"p","en":"Indo-Pacific Command—the integrated command structure responsible for managing the deployments of up to 380,000 naval, air force, army, marine, and Special Forces personnel, almost one-quarter of the entire US armed services.","zh":"印太司令部的一小部分而已。这个一体化指挥机构负责管理多达38万名海军、空军、陆军、海军陆战队和特种部队人员的部署，几乎相当于美军全部兵力的四分之一。"},{"id":"ch10-013","p":200,"t":"p","en":"The officers of the wardroom of the John Paul Jones are fully aware of the bureaucracy above them. But equally, happily, uninvolved in their day-to-day tussles. For the ship is at the fighting end of this large complex of military arrangements.","zh":"“约翰·保罗·琼斯”号军官舱里的军官们，对头顶上那套官僚机构心知肚明，但也乐得不去掺和它每天的拉扯。因为这艘舰处在整个庞大军事体系的最前端，是真正打仗的那一头。"},{"id":"ch10-014","p":200,"t":"p","en":"They are also steeped in naval tradition-on this ship, particularly. It is named after one of the most famous officers in the long history of the US Navy, often referred to as the founder of the service.* Jones fought for the fledgling nation during the Revolutionary War, before the United States actually had its own naval forces, sailing under orders from George Washington.³ In 1779, his most famous engagement, still one of the most storied in American naval history, occurred just off the coast of England. Jones had evaded the British blockade of its rebellious colonies and crossed the Atlantic to approach English waters There, he then encountered HMS Serapis and the Countess of Scarborough. Early action saw him raked with gunfire and seeming to face certain defeat. The captain of the Serapis called over for his surrender It was then that Jones reportedly uttered his famous phrase, \"I have not yet begun to fight!\" Through a series of skillful maneuvers and a substantial degree of luck, Jones proceeded to defeat both ships and to capture the Serapis. The flag flown by Jones during his defeat of the Serapis flies to this day on board the modern destroyer. (As does a second flag, which shows thirteen American stars and thirteen stripes, but with the sixth, tenth, and twelfth stripes rendered in blue rather than red or white. The flag was sent to Jones by Ben Franklin, then serving as ambassador in Paris, who had it rapidly commissioned by a seamstress. Clearly Franklin's explanation of the flag's design left something to be desired.†)","zh":"他们尤其深受这艘舰上海军传统的浸染。舰名取自美国海军悠久历史上最著名的军官之一，此人常被称为这一军种的奠基者。* 独立战争期间，琼斯为这个羽翼未丰的国家作战——那时美国还没有自己的海军——奉乔治·华盛顿之命出海。³ 1779年，他一生中最著名的一战就发生在英格兰近海，至今仍是美国海军史上最具传奇色彩的战事之一。琼斯躲过了英国对叛乱殖民地的封锁，横渡大西洋，逼近英国海域，在那里遭遇了英国皇家海军“塞拉皮斯”号（HMS Serapis）与“斯卡伯勒伯爵夫人”号（Countess of Scarborough）。交战之初，他的舰被炮火横扫，看上去必败无疑。“塞拉皮斯”号舰长隔水喊话，要他投降。据说正是在这一刻，琼斯说出了那句名言：“我还没有开始战斗！”凭借一连串巧妙的机动，再加上相当大的运气，琼斯接连击败两艘敌舰，俘获了“塞拉皮斯”号。他击沉该舰时悬挂的那面旗，至今仍在这艘现代驱逐舰上飘扬。（同时飘扬的还有第二面旗：十三颗美国星、十三道条纹，只是第六、第十、第十二道条纹是蓝色，而非红或白。这面旗是本杰明·富兰克林送给琼斯的，他当时出任驻巴黎大使，临时找来一位女裁缝赶制。显然，富兰克林对旗面设计的说明差点意思。†）"},{"id":"ch10-015","p":200,"t":"n","en":"Jones was an early advocate of a standing American navy, and an agitator for major naval action to deal with the Barbary pirates. Indeed, Thomas Jefferson turned to Jones to lead the campaign into Barbary—but by the time his orders reached him in Paris, Jones had died.","zh":"琼斯是美国常备海军的早期倡导者，也是力主大举用兵对付巴巴里海盗的鼓动者。事实上，托马斯·杰斐逊曾属意由琼斯领兵远征巴巴里——可等命令送到巴黎他手上时，琼斯已经去世。"},{"id":"ch10-016","p":200,"t":"n","en":"As told to the author by the XO of the USS John Paul Jones.","zh":"据“约翰·保罗·琼斯”号副舰长（XO）向作者讲述。"},{"id":"ch10-017","p":201,"t":"p","en":"Jones's “I have not yet begun to fight\" is the better-known (and probably apocryphal) quote, but the crew of the modern ship prefer to cite his other famous saying: \"I wish to have no connection with any ship that does not sail fast, for I intend to go in harm's way.\" Harm's way is exactly where the Jones sails. Although its specific mission details are classified, it's not hard to determine that Carrier Group 11 spends much of its time deployed to the Western Pacific, engaging in operations designed to defend Guam, to patrol the Philippine Sea, and to defend Japan. That puts it on the front lines of most potential confrontations with the Chinese navy, and potentially Russia's fleet as well.*","zh":"琼斯那句“我还没有开始战斗”流传更广（也很可能是后人附会），但这艘现代战舰的舰员更愿意引用他的另一句名言：“我不愿与任何一条航速不快的船有任何瓜葛，因为我打算驶向险境。”险境，正是“琼斯”号要去的地方。它的具体任务细节属于机密，但不难判断：第11航母打击群大部分时间部署在西太平洋，执行保卫关岛、巡逻菲律宾海和防卫日本的任务。这就把它放在了与中国海军——可能还有俄罗斯舰队——大多数潜在对抗的最前线。*"},{"id":"ch10-018","p":201,"t":"p","en":"The modern John Paul Jones is a fearsome piece of war-fighting machinery. A crew of thirty officers command the ship with a crew of around three hundred men and women. It's 505 feet long and displaces just over nine thousand tons. Four gas turbine engines, each operating 26,000 shaft horsepower equivalents, allow it to sail at a top speed of over thirty knots. Her surface is thoroughly bristling with radar, sonar, and weapons systems. On her upper decks and rigging, she carries search and control radar, navigation radar, surface search radar, target illumination radar, and fire control radar.† That's in addition to a suite of sonar tools, including bow-mounted sonar, and towed array sonar. She has a whole series of countermeasures and jammers as well, including decoy systems, and towed torpedo decoys. Above all, she sports the Aegis radar-the most sophisticated radar system in the world.","zh":"现代化的“约翰·保罗·琼斯”号是一台令人生畏的作战机器。三十名军官指挥全舰，手下约三百名男女舰员。舰长505英尺，排水量九千吨出头。四台燃气轮机，每台输出相当于26,000轴马力，使它最高航速超过30节。舰体上下密布雷达、声呐与武器系统。上层建筑和索具上装有搜索与控制雷达、导航雷达、对海搜索雷达、目标照射雷达和火控雷达。† 此外还有一整套声呐设备，包括舰艏声呐和拖曳阵声呐。它还配有一系列对抗与干扰装置，包括诱饵系统和拖曳式鱼雷诱饵。最重要的，是那部“宙斯盾”雷达——世界上最先进的雷达系统。"},{"id":"ch10-019","p":201,"t":"p","en":"All this hardware is designed to support a battery of weapons. That includes a five-inch gun; two radar-equipped 20 mm Gatling guns; two seventy-five caliber Bushmaster guns; four machine guns; two sets of torpedo launchers; and eight harpoon missiles for ship-to-ship defense. The word \"harpoon\" conjures an image of old-school whalers firing large, tied arrows from crossbows. The harpoons aboard the Jones are fifteen-foot missiles that fire from tubes on her deck and skim along the surface of the water at a speed of Mach .75 (equivalent to 556 mph) before exploding their five-hundred-pound warheads against the target.⁴","zh":"所有这些硬件，都是为了一组武器服务：一门五英寸舰炮；两门带雷达的20毫米“加特林”机炮；两门75倍径“大毒蛇”机关炮；四挺机枪；两组鱼雷发射装置；以及八枚用于舰舰防御的“鱼叉”导弹。“鱼叉”这个词，让人想到旧时捕鲸人从弩上射出带绳索的大箭。而“琼斯”号上的“鱼叉”，是十五英尺长的导弹，从甲板上的发射筒射出，以0.75马赫（相当于每小时556英里）的速度贴着海面飞掠，最后让五百磅重的弹头在目标上炸开。⁴"},{"id":"ch10-020","p":201,"t":"n","en":"Indo-Pacific Command ranges as far north as the Arctic, so the Jones might also be deployed near where Russia has recently reinforced its Northern Fleet. It also covers India's coastline, where the Jones conducted FONOPs in 2021.","zh":"印太司令部的辖区北抵北极，因此“琼斯”号也可能被部署到俄罗斯近来加强北方舰队的海域附近。辖区还涵盖印度海岸线，2021年“琼斯”号曾在那一带执行航行自由行动。"},{"id":"ch10-021","p":201,"t":"n","en":"More technically: the Lockheed Martin SPY-1 3D search weapons and control radar, the Raytheon AN/SPS-64 navigation radar, surface search radar, the Raytheon AN/SPG-62 target illumination radar, and an MK-15 Phalanx fire control radar.","zh":"更技术性地说：洛克希德·马丁公司的 SPY-1 三维搜索、武器与控制雷达，雷神公司的 AN/SPS-64 导航雷达与对海搜索雷达，雷神公司的 AN/SPG-62 目标照射雷达，以及 MK-15“密集阵”火控雷达。"},{"id":"ch10-022","p":202,"t":"p","en":"The core of her weaponry, though, is only partially visible on deck. Both at the foredeck and the rear deck of the ship stand two arrays of flat doors with heavy hinges, clustered together in blocks of eight. The doors are similar in shape to those atop the plastic recycling containers that dot America's driveways, but these are made of a heavy metal painted naval gray. They conceal the deadly weaponry within: vertically launched missiles.","zh":"不过，它真正的武器核心只有一部分露在甲板上。前甲板和后甲板各立着两组带粗重铰链的平板门，每八扇并作一块。门的形状像美国家家户户车道上那些塑料回收箱的盖子，只是这些门用厚重的金属制成，漆成海军灰。门后藏着致命的武器：垂直发射的导弹。"},{"id":"ch10-023","p":202,"t":"p","en":"The Jones can fire several types of missiles from those bays. That includes the SM-2, a medium-range anti-aircraft missile (that can also be used for short-range ship-to-ship fighting); the SM-3, which travels into the outer atmosphere; the VLA (Vertical Launch Anti-Submarine Rocket), used to launch torpedoes against submarines at a longer range than ship-based torpedo tubes; and the Evolved Sea Sparrow Missile, short-range anti-air missiles. The Jones also carries Tomahawks—indeed, she was the first ship to fire them into Iraq after the launch of the Gulf War. And crucially, she also carries what is known as Standard Missile 6. This is a multi-mission missile, initially used primarily for long-range air defense, and in other configurations for high-speed anti-ship fighting. But it is also used for what's known as “terminal ballistic missile defense,\" the latest instrument in the information technology-fueled arms race between the US and China.","zh":"“琼斯”号能从这些发射井里打出好几种导弹：SM-2，一种中程防空导弹（也可用于近程舰舰交战）；SM-3，可飞入大气层外；VLA（垂直发射反潜火箭），能把鱼雷投送到比舰载鱼雷管更远的距离上；还有“改进型海麻雀”，一种近程防空导弹。“琼斯”号也带“战斧”——事实上，海湾战争开打后，正是它成为第一艘向伊拉克发射“战斧”的军舰。而至关重要的是，它还携有所谓“标准-6”型导弹。这是一种多任务导弹，最初主要用于远程防空，在其他配置下用于高速反舰作战；但它也被用于所谓“末端弹道导弹防御”，这是美中之间由信息技术推动的军备竞赛中最新的利器。"},{"id":"ch10-024","p":202,"t":"h","en":"Dynamics of \"Informatized\" War","zh":"“信息化”战争的机理"},{"id":"ch10-025","p":202,"t":"p","en":"In previous eras, the pulsing heart of a warship was the bridge, from where the captain and the leading officers would both navigate the ship, control its engines, maintain surface watch, and command the fire of the guns. The smell of ocean air, the scent of cordite, the sounds of gunfire—these were all part of the sensory experience of ship-toship battle at sea.","zh":"在以往的时代，军舰跳动的心脏是舰桥：舰长和主要军官在那里操船、控制主机、保持海面瞭望、指挥火炮齐射。海风的气味、无烟火药的气味、炮声——这些都是海上舰对舰作战的感官体验。"},{"id":"ch10-026","p":202,"t":"p","en":"No more. In the world of modern war fighting, the heart of the Jones is a dark room known as the CIC—or the Combat Information Center. It's as far removed from human sensory experience as the ship designers can make it.","zh":"现在不同了。在现代战争的语境里，“琼斯”号的心脏是一间被称作 CIC 的暗室，即“战斗情报中心”。舰艇设计师想尽办法，把它做得离人的感官经验越远越好。"},{"id":"ch10-027","p":203,"t":"p","en":"To access the CIC, you descend a series of steep metal ladders four decks down from the bridge. Quarters on a naval ship are exceedingly tight, and the dark gray paint of every surface increases the sense of enclosure as you descend these spaces. Walk the long, tight corridor of the main deck of the ship, and you arrive at the outer doors of the CIC, which can only be accessed by secure keycode.","zh":"要进入 CIC，得从舰桥顺着几段陡峭的金属梯子往下爬四层甲板。军舰上的空间极其局促，四壁一律刷成深灰，越往下走，封闭感越强。穿过主甲板那条又长又窄的通道，就到了 CIC 的外门——只有密码才能打开。"},{"id":"ch10-028","p":203,"t":"p","en":"Inside, the room is roughly thirty feet square, with an eight-foot ceiling. The walls and ceiling are painted black, which helps absorb the heat from a huge amount of computing power (plus up to two dozen bodies crowded into this small space) and keeps things dark. Though there are a few overhead blue fluorescent bulbs, most of the light in the room comes from the computer screens in front of the firing crew.","zh":"舱内约三十英尺见方，顶高八英尺。四壁与舱顶漆成黑色，既便于吸收大量计算设备散出的热量（何况这狭小空间里还挤着二十来号人），也让舱内保持昏暗。头顶虽有几盏蓝色荧光灯管，但舱里的光主要来自射手面前的一块块屏幕。"},{"id":"ch10-029","p":203,"t":"p","en":"At the front are mounted three huge screens, displaying geographical, tactical, and targeting information. Immediately facing these screens is a station reserved for the captain or his XO. The rest of the room is organized around twenty workstations, arranged by type of warfare or weapon: there's a station for anti-aircraft fire, for sonar control, for anti-submarine fire, electronic measures, missile defense, naval surface fire, and air control. Some stations are equipped with joysticks to control on-deck guns. Hived off on their own, secured even inside the CIC, are the strike warfare controls for the Tomahawk missile launches—which are still one of the most closely guarded secrets in the US Navy.","zh":"正前方挂着三块巨幅屏幕，分别显示地理、战术与目标信息。正对屏幕的位置，留给舰长或副舰长。舱内其余空间围绕二十个工作站布置，按作战或武器类别划分：有防空射击、声呐控制、反潜射击、电子对抗、导弹防御、对海射击、空中管制等席位。有些工作站配了操纵杆，用来控制甲板上的火炮。还有一处单独隔开、即便在 CIC 内部也要再加保密的区域，是“战斧”导弹发射的打击战控制台——这仍是美国海军保守得最严的秘密之一。"},{"id":"ch10-030","p":203,"t":"p","en":"Most consoles have computer terminals with a bank of three screens. These screens in turn relay specific targeting information, allowing the officers to communicate with one another, with the Tactical Action Office, or if necessary, with the captain. Some stations have classic radar with a green circle and a glowing radial arm. Others can display high-resolution topographical maps.","zh":"多数控制台配有一组三块的电脑屏幕，屏幕上转递具体的瞄准信息，军官们借此彼此联络，或与战术行动军官联络，必要时也可直接联络舰长。有些席位用的是老式雷达显示，一个绿圈，一根发光的扫描臂；另一些则能显示高分辨率的等高线地图。"},{"id":"ch10-031","p":203,"t":"p","en":"The firing controls for these systems are decentralized; the captain sets the overall tone of any given encounter, but decisive action is delegated to the officers managing each station. With the speed at which their targets move and the speed at which information is processed, every station has to act at a fast pace—so they have to be able to fire at their own discretion. Every station is trained on a range of scenarios and has specific orders as to how to respond to unfolding situations. From there, the ship operates by what's known as \"command by negation.\" That is, an officer can initiate defensive actions without prior permission. Their responsibility is to alert the tactical action officer, or if necessary, the XO or captain, to their imminent actions. One of those senior officers in turn can then order them to stop—to negate their action. In the absence of an order to stop, they have a green light to act. This allows them to move with the speed of combat:","zh":"这些系统的射击控制是分散的：舰长定下一次交战的整体基调，但决断权下放给各工作站的军官。目标移动得快，信息处理得也快，每个席位都必须快速行动，因此必须能自行决定开火。每个席位都针对一系列情景受过训练，也有明确命令，规定遇到何种情况该如何应对。整舰据此按所谓“否定式指挥”运转：军官可以不经事先批准即采取防御行动，其职责是把即将采取的行动告知战术行动军官，必要时告知副舰长或舰长；上级军官随后可以下令叫停，也就是“否定”这一行动。若无人叫停，他们便一路绿灯。这让他们能以战斗所需的速度行动："},{"id":"ch10-032","p":204,"t":"p","en":"Tradition dies hard in the navy. One thing that naval officers like to do when plotting their firing positions is to scribble their targeting calculations as they make them. Historically, they would write calculations on the glass panel where map and ship information was displayed. As the glass panels were replaced by computers, naval officers still used wax pens to scribble their calculations directly on their screens. But the Jones's computer systems were recently upgraded to touchscreens, making it impossible to scribble onto the monitors. That didn't stop the crew. On top of the new terminal screens, several officers have Velcroed plastic blue light screens onto which they can scribble their calculations—a \\$50 solution on top of what was roughly a \\$50 million upgrade.","zh":"海军的传统不容易消失。军官们测定射击阵位时有个习惯：一边算一边把计算过程随手写下来。从前，他们写在地图与舰艇信息所在的那块玻璃板上；玻璃板换成电脑之后，军官们仍旧拿蜡笔直接在屏幕上涂写。可“琼斯”号的电脑系统前不久升级成了触摸屏，没法再往显示器上写字。这也没难住舰员：几位军官用魔术贴在新屏幕外面贴了塑料蓝光片，照样能在上面涂写计算过程——在一项约5,000万美元的升级之上，又添了一个50美元的土办法。"},{"id":"ch10-033","p":204,"t":"p","en":"Strung across the ceiling of the CIC are a large number of thick, black cables. These link the room to the on-deck radar. On-deck receivers are also pulling in data, at a rate of 128 bursts per second, from what's known as the Joint Tactical Information Distribution System. This is a complex set of radio, satellite, and internet-based systems that link US tracking and targeting systems on land (among other places, in Alaska, Greenland, and the UK), in aircraft like AWACS, satellites, and ships into a seamless, global flow of tactical and targeting information. The Aegis software integrates that data and its own sensory information into targeting options for the tactical action officers. This is crucial; for what actually makes the John Paul Jones a vital part of the American defensive array is not actually her missiles, or even her radar; it's her software.","zh":"CIC 的舱顶横拉着许多条粗黑的电缆，把舱室与甲板上的雷达连在一起。甲板上的接收机还以每秒128次脉冲的速率，接收来自“联合战术信息分发系统”的数据。这是一套由无线电、卫星和互联网构成的复杂系统，把美国在陆上（包括阿拉斯加、格陵兰和英国等地）、在预警机等飞机上、在卫星上和在舰上的跟踪与瞄准系统，连成一股无缝的全球战术与瞄准信息流。“宙斯盾”软件把这些数据与自身的传感信息融合，生成可供战术行动军官选择的目标方案。这一点至关重要：真正使“约翰·保罗·琼斯”号成为美国防御体系关键一环的，其实不是它的导弹，甚至也不是它的雷达，而是它的软件。"},{"id":"ch10-034","p":204,"t":"p","en":"The John Paul Jones was the first ship in the American fleet to receive what's known as Aegis Baseline 9, the latest software upgrade to the Aegis radar system. It represents the culmination of more than forty years of continuous innovation in radar design.* It improves the ship's ability to engage in the extremely complex business of shooting down a ballistic missile while simultaneously engaging in more traditional air defense actions.","zh":"“约翰·保罗·琼斯”号是美国舰队中第一艘装上“宙斯盾”基线9型的军舰，那是“宙斯盾”雷达系统最新的软件升级，代表着雷达设计四十余年持续创新的结晶。* 它提升了本舰的能力：既能执行拦截弹道导弹这类极其复杂的任务，又能同时进行更为传统的防空作战。"},{"id":"ch10-035","p":205,"t":"p","en":"Ballistic missiles are small, fast, and travel at heights that exceed the Earth's atmosphere. On descent, they are moving at speeds up to Mach 10—that's ten times the speed of sound, or nearly 7,700 miles per hour.⁵ The challenge of tracking a small missile moving at those speeds is substantial. The challenge of using radar to guide a second missile to intercept it is epic.","zh":"弹道导弹体积小、速度快，飞行高度超出地球大气层。再入时，速度可达10马赫——即音速的十倍，接近每小时7,700英里。⁵ 要跟踪一枚以这种速度飞行的小型导弹，难度极大；要用雷达引导另一枚导弹去拦截它，更是史诗级的难题。"},{"id":"ch10-036","p":205,"t":"p","en":"Many of the details about Aegis radar are secret. One is very visible, though, the device itself. It looks nothing like the rotating device familiar from airport radar towers or cops' radar guns or similar. The Aegis radar appears to be a simple metal plate, roughly the same shape as a stop sign, though much larger; two of them are mounted on the forward part of the ship's superstructure, and two aft. Up close, you can see that it's actually comprised of more than one thousand \"windows,\" or radiating elements.","zh":"关于“宙斯盾”雷达的许多细节都是秘密。但有一样东西一目了然，就是这台设备本身。它的样子跟机场雷达塔上那种旋转天线、跟警察的测速雷达枪之类完全不同，看上去只是一块简单的金属板，形状略似八角形的“停车”标志牌，但要大得多；舰桥上层建筑的前部装两块，后部装两块。凑近看才看得出，它其实由一千多个“窗口”，也就是辐射单元拼成。"},{"id":"ch10-037","p":205,"t":"p","en":"In some ways, it is surprising that in a world of nuclear weapons and artificial intelligence and massive aircraft carriers, radar is still a critical technology. Yet it is a fact that continuous innovations in radar are a major part of what gives the United States its technological edge in modern battle. Radio detection and ranging, aka radar, basically entails pulsing radio waves out into the air and recording the signal when they bounce back off of solid objects. Since radio waves move at the speed of light, or 186,000 miles per second, that happens near instantaneously. The signal, frequently repeated, can reveal both location and speed. What's known as the Doppler effect, a slight curve in the radio wave as it bounces off a moving object, shows direction.","zh":"在一个已有核武器、人工智能和巨型航母的世界里，雷达居然仍是关键技术，这多少有些出人意料。但事实就是：雷达的持续创新，是美国在现代战场上保有技术优势的重要来源之一。无线电探测与测距，即雷达，说到底是向空中发出脉冲无线电波，并在电波被固体物体反射回来时记录信号。无线电波以光速传播，即每秒18.6万英里，所以这一切几乎在瞬间完成。信号反复发出，便能同时揭示目标的位置和速度。而所谓多普勒效应，即电波从运动物体上反射回来时产生的轻微弯曲，则指示出方向。"},{"id":"ch10-038","p":205,"t":"p","en":"There are lots of things that can limit radar or diminish its effectiveness. First there's the question of the frequency of the pulse. You have to get a signal back before the next one is emitted. Normal radar is sufficient to track ships and airplanes. But when you move out to atmospheric distance and you're dealing with missiles moving at three miles per second, traditional radar can't cope. Then there's what's known as signal noise, in other words, random variations internal to the pulse itself—irrelevant in short bursts but increasingly problematic over long distance. Also, the longer the distance between a radar array and the object it's trying to track, the more likely that simple clutter will interfere-random other objects that might be in the line of sight. Weather matters, too: rain, snow, cold, and wind can all interfere with radar over distance. And of course your adversary can deliberately jam or try to deceive your radar by sending out counter signals. Finally, short-range and long-range radar work rather differently because different energy pulses are more effective at the two different distances, and so it's hard to combine the two—but combining them is absolutely necessary if you're going to shoot down a fast-moving missile as it approaches its terminal destination.","zh":"有许多因素会限制雷达，或削弱它的效能。首先是脉冲频率的问题：你必须在下一次脉冲发出之前收到回波。普通雷达足以追踪船只和飞机。可一旦把距离拉远到大气层的尺度，面对以每秒3英里飞行的导弹，传统雷达就应付不了。其次是所谓“信号噪声”，也就是脉冲内部随机的波动——短促发射时无关紧要，距离一长就越来越成问题。还有，雷达阵列与它要追踪的目标之间距离越远，普通杂波干扰的可能性就越大，也就是视线里可能存在的其他物体。天气也有影响：雨、雪、寒冷和风，都会在远距离上干扰雷达。当然，对手还可以有意施放对抗信号，干扰雷达或诱使它上当。最后，近程雷达和远程雷达的工作方式颇为不同，因为不同的能量脉冲在这两种距离上各有优势，二者很难合一——可要击落一枚高速冲向末段目标的导弹，两者又非得合起来不可。"},{"id":"ch10-039","p":205,"t":"n","en":"In some senses, more than seventy-five years of innovation; for some of the engineers most deeply involved with the innovations that ultimately became Aegis got their start at England's Bletchley Park, de-encrypting the German Enigma machine.","zh":"从某种意义上说，这是七十五年以上持续创新的结果；因为当年最深地投入那些最终凝结为“宙斯盾”的创新工作的工程师当中，有些人的起点是英国的布莱切利园（Bletchley Park），在那里破译德国的“恩尼格玛”密码机。"},{"id":"ch10-040","p":206,"t":"p","en":"Most important, there has to be a line of sight between the radar pulse, which moves in a straight line, and the object it's detecting. Line of sight is not a problem for old-fashioned ship-to-ship radar or from a ground-based station to the air above it. But its more complicated when you're trying to detect a long-range missile that's being launched out beyond the curvature of the Earth's surface. For ballistic missile defense, tracking a missile through its launch requires multiple sensors (radar arrays) on ships, in ground-based stations, and in satellite orbit, communicating with one another in real time.","zh":"最重要的，是雷达脉冲（沿直线传播）与被探测目标之间必须有视线。对老式的舰对舰雷达，或地面站对其上方空域，视线不成问题。但要探测一枚从地球表面曲率之外发射的远程导弹，情况就复杂多了。对弹道导弹防御来说，要全程追踪一枚导弹的发射，就需要舰上、地面站和卫星轨道上的多部传感器（雷达阵列）实时互通。"},{"id":"ch10-041","p":206,"t":"p","en":"To overcome these obstacles, the American navy does two things. First, the Aegis-class ships operate what's known as a phased array— far more precise than traditional radar. This allows it to compare information from different signals and sort out what is noise. It also allows it to track multiple targets simultaneously, a key asset. Second, it takes inputs from Master Station Pacific, satellite stations in the Arctic, and multiple other feeds—from ships, stationary positions, and satellites— and integrates them into a single, integrated tracking picture. Then, exceptionally powerful software that forms the Baseline 9 system draws together several different radar, sensor, integration, and firing control packages and prepares decisions for confirmation and action by tactical action officers.","zh":"为克服这些障碍，美国海军做了两件事。第一，“宙斯盾”级舰上装的是所谓“相控阵”，比传统雷达精确得多。它可以把不同信号的信息相互比对，从中筛出噪声；还能同时追踪多个目标，这是一项关键本领。第二，它接收来自太平洋主站、北极卫星站，以及舰艇、固定阵地和卫星等多路信息，整合成一幅统一的跟踪图像。随后，功能极为强大的“基线9”系统软件把若干个雷达、传感器、集成与火控模块汇于一体，为战术行动军官拟定方案，等他们确认后执行。"},{"id":"ch10-042","p":207,"t":"p","en":"All this is described in the stilted language of the US Department of Defense as \"an advanced automatic detect and track multifunction, three-dimensional passive, electronically scanned array radar.\" The navy has a more descriptive term: \"shield of the fleet.\"","zh":"美国国防部用一句生硬的话来形容它：“一种先进的自动探测与跟踪、多功能、三维、无源、电子扫描阵列雷达。”海军自己有个更形象的说法：“舰队的盾牌。”"},{"id":"ch10-043","p":207,"t":"h","en":"Ballistic Missile Defense","zh":"弹道导弹防御"},{"id":"ch10-044","p":207,"t":"p","en":"One of the people who is expert in this is Captain Rob Watts. The navy has been part of his life from early childhood in Norfolk, Virginia. Although he was not born into a navy family, he grew up surrounded by naval life. To this day, he recalls spending an early birthday in the wardroom of an aircraft carrier, an outing arranged by a family friend. He read a lot of Tom Clancy novels in middle school, and also Jane's Fighting Ships. By high school, he realized that he wanted to join the navy. That took him to the University of Virginia, and then into the service.","zh":"罗布·沃茨（Rob Watts）上校就是精于此道的人之一。他从小在弗吉尼亚州诺福克长大，海军一直是他生活的一部分。他并非出身海军家庭，却在海军的生活氛围里长大。直到今天，他还记得有一个生日是在一艘航母的军官舱里过的——那是家里的一位朋友安排的出游。中学时他读了大量汤姆·克兰西的小说，也读《简氏战舰年鉴》。到高中，他明白自己想加入海军。这把他带到了弗吉尼亚大学，随后入伍。"},{"id":"ch10-045","p":207,"t":"p","en":"He was soon deployed into Operation Iraqi Freedom, aboard the USS Raven, a minesweeper patrolling the Persian Gulf from its base in Bahrain. He was then stationed aboard the USS Oscar Austin, homeported in Norfolk, on which he gained his first experience with the Aegis system. He learned about deeper oceans when the Oscar Austin was deployed to the Indian Ocean as part of the counter-piracy operations there (described in chapter 8). He spent a tour on the navy staff at the Pentagon, and then in the Protocol Office, working for the vice chief of Naval Operations.","zh":"他很快被派往“伊拉克自由”行动，在“雷文”号（USS Raven）上服役——那是一艘扫雷舰，以巴林为基地，在波斯湾巡逻。之后他调到母港在诺福克的“奥斯卡·奥斯汀”号（USS Oscar Austin），第一次接触“宙斯盾”系统。后来“奥斯卡·奥斯汀”号被派往印度洋参加那里的反海盗行动（见第八章），他由此见识了更深的海洋。他又在五角大楼海军参谋部门任职一期，随后进入礼宾处，为海军作战部副部长工作。"},{"id":"ch10-046","p":207,"t":"p","en":"It was service in the Pentagon that turned his career toward Asia. He had already been interested in the country, spending a semester in Beijing in 1996, and returning to spend six months studying the Mandarin language in Chongqing in 2001. Working with the vice chief of Naval Operations, he helped to plan the first visit to the US by the","zh":"正是五角大楼的这段任职，把他的事业引向亚洲。他对这个国家早有兴味，1996年曾在北京度过一个学期，2001年又回到中国，在重庆学了半年普通话。在海军作战部副部长身边工作时，他参与筹划了中国人民解放军海军新任作战部长对美国的首次访问——"},{"id":"ch10-047","p":207,"t":"n","en":"Specifically, the AEGIS Weapon System (AWS), comprised of AN/SPY-1 radar (similar to the better-known land-based THAAD, which stands for Terminal High Altitude Area Defense), a fire control system, and a suite of command and control software packages.","zh":"具体说，是指“宙斯盾”武器系统（AEGIS Weapon System，AWS），由 AN/SPY-1 雷达（类似更广为人知的陆基“萨德”，即末段高空区域防御系统）、一套火控系统和一整套指挥控制软件组成。"},{"id":"ch10-048","p":208,"t":"p","en":"PLAN's new chief of operations, none other than Wu Shengli. And his expertise in Asia deepened when he was deployed to a ship based in Yokosuka, in Tokyo Bay.","zh":"这位部长不是别人，正是吴胜利。后来他被派往以东京湾横须贺为母港的一艘军舰，对亚洲的了解又深了一层。"},{"id":"ch10-049","p":208,"t":"p","en":"Tall and fit, but bookish with glasses, and always with a quick intellect, Watts has kept up his focus on Asian security questions. He enrolled at Princeton to earn a master's degree in public policy and international security studies, and focused on the question of US strategy in Asia. He's also developed something of a career specialization in ballistic missile defense. That makes him particularly well suited to the command of the USS John Paul Jones—a commission he received in July 2020. Because of the continuing US spread of COVID-19, his ceremony was limited to senior crew and family only and broadcast on the ship's Facebook page.","zh":"沃茨身材高大、体格结实，戴一副眼镜，颇有书卷气，脑子转得极快，始终专注于亚洲安全问题。他进入普林斯顿大学攻读公共政策与国际安全研究硕士学位，主攻美国对亚洲的战略。他在职业上也渐渐专精于弹道导弹防御，这使他格外适合执掌“约翰·保罗·琼斯”号——2020年7月，他正式受命接任。由于美国新冠疫情持续蔓延，就职仪式只限高级军官与家属参加，并在该舰的Facebook页面上直播。"},{"id":"ch10-050","p":208,"t":"p","en":"In his period first as XO then captain of the Jones, one of the focus areas for the ship's training was on what's called \"terminal defense.\" In an essay for his master's degree, Watts explains: \"Regional defense employs a range of sensors and weapons to defend deployed forces and allies against shorter-range threats in the midcourse and terminal phases of flight. Midcourse defense involves intercepting missiles while they are outside the atmosphere. Terminal defense means intercepting a ballistic missile as it descends toward its target.\"","zh":"在“琼斯”号上先任副舰长、后任舰长这段时间里，全舰训练的重点之一就是所谓“末段防御”。沃茨在硕士论文中解释道：“区域防御运用一系列传感器和武器，保护已部署的部队与盟友，使其免受飞行中段和末段的近程威胁。中段防御，是在导弹处于大气层之外时实施拦截。末段防御，则是在弹道导弹向目标下降的过程中将其拦截。”"},{"id":"ch10-051","p":208,"t":"p","en":"The United States has tried on several occasions to shoot down a ballistic missile, and results are spotty. The USS John Paul Jones was part of some of those early trials. On November 1, 2015, it participated in a test operation off of Wake Island (some 2,300 miles west of Honolulu), but failed to intercept a medium-range ballistic missile launched from a C-17 transport plane. Watts says of ballistic missile defense, \"Sometimes the weapons exceed what our sensors can see.\" But that is the job Aegis Baseline 9 was designed to solve.","zh":"美国曾多次尝试击落弹道导弹，结果参差不齐。“约翰·保罗·琼斯”号参加过其中一些早期试验。2015年11月1日，它在威克岛（Wake Island，位于檀香山西面约2,300英里）附近海域参与一次试验，未能拦截一枚由C-17运输机空投发射的中程弹道导弹。谈到弹道导弹防御，沃茨说：“有时候，武器的能力超出了我们的传感器所能看到的东西。”而这正是“宙斯盾”基线9型要解决的问题。"},{"id":"ch10-052","p":208,"t":"p","en":"On August 29, 2017, with the new operating system installed, the Jones was the anchor ship in a new trial, designated Flight Test Standard Missile-27 Event 2. A ballistic missile was fired from the Pacific Missile Range Facility on the island of Kauai, at the western edge of the windward Hawaiian islands. A video of a similar event is stored on Watts's computer, and shows the huge plume of smoke and fire that accompanied the launch of a missile from the front vertical launch bays. The AN/SPY-1 radar component of the Aegis system tracked the incoming missile as the SM-6 flew to meet it, flying at a speed of over 2,600 miles per hour. Overhead, satellites detected the launch, and radar tracked both missiles, communicating to the Jones's radar through the Joint Tactical Information Distribution System. (“Ballistic missile defense is a team sport,\" Captain Watts quipped.) Between the operation of the Jones and the various involved commands and the dummy missile, that single test cost an astonishing \\$200 million. But it had the desired result: the Jones intercepted and destroyed the ballistic missile as it descended from exo-atmospheric space.⁶","zh":"2017年8月29日，装上新的操作系统之后，“琼斯”号在一场新试验中担任核心舰，试验代号“标准导弹-27第2号事件”（Flight Test Standard Missile-27 Event 2）。一枚弹道导弹从考艾岛（Kauai）上的太平洋导弹靶场发射升空，那里位于夏威夷迎风群岛的最西端。沃茨的电脑里存着一次同类试验的视频：前部垂直发射井喷出导弹时，带起一大团烟与火。导弹飞来，“标准-6”以每小时2,600英里以上的速度迎上去，“宙斯盾”系统的 AN/SPY-1 雷达则一路跟踪。头顶上，卫星发现了发射，雷达同时追踪两枚导弹，并通过“联合战术信息分发系统”把信息传给“琼斯”号的雷达。（“弹道导弹防御是一项团队运动。”沃茨上校打趣道。）算上“琼斯”号的运转、各参与指挥机构以及那枚靶弹，单是这一次试验就耗资2亿美元，令人咋舌。但它取得了预期的结果：“琼斯”号在大气层外空间将那枚下落的弹道导弹拦截并击毁。⁶"},{"id":"ch10-053","p":209,"t":"p","en":"It was, to its proponents, a key element in the wider American response to China's evolving strategy.","zh":"在其支持者看来，这是美国应对中国不断演变的战略这一更大布局中的关键一环。"},{"id":"ch10-054","p":209,"t":"h","en":"The Battle of Networks: Air-Sea Battle vs. A2/AD","zh":"网络之战：空海一体战对阵反介入"},{"id":"ch10-055","p":209,"t":"p","en":"When Admiral Wu Shengli took over the PLAN in 2006, he developed a new doctrine for its “far seas\" activities. But he also hardened its Near Seas deployments. That involved increasing the focus on land reclamation and installing facilities in the Near Seas. And it involved putting missile systems on those islands. For in 2010, China became the first country in the world to announce that they had within their arsenal a new type of weapon: an anti-ship ballistic missile. That is to say, a theater-range missile that could target American frigates and possibly even American aircraft carriers, at a range of at least nine hundred miles (the DF-21D missile). Soon after, China revealed that it had also developed (though not yet tested) a missile with a much more powerful range, out to 2,500 miles (the DF-26).7 These missiles can be fired from ships, aircraft, and surface batteries, and can increasingly reach US forces stationed beyond China's immediate offshore waters.8","zh":"2006年吴胜利海军上将接掌中国人民解放军海军后，为海军的“远海”行动拟定了一套新理论，同时也强化了近海部署。这包括更加着力于填海造陆、在近海修建设施，也包括在这些岛屿上部署导弹系统。因为2010年，中国成为世界上第一个宣布其武库中拥有一种新型武器的国家：反舰弹道导弹。也就是说，一种战区射程的导弹，可以打击美国护卫舰，甚至可能打到美国航母，射程至少900英里（即东风-21D）。此后不久，中国又披露已研制出（但尚未试射）一种射程大得多的导弹，可达2,500英里（即东风-26）。⁷ 这些导弹可从舰艇、飞机和地面发射阵位发射，打击范围越来越能覆盖驻扎在中国近岸海域之外的美国部队。⁸"},{"id":"ch10-056","p":209,"t":"p","en":"The missiles were not China's only new advance. They were designed to be deployed in tandem with a suite of systems whose purpose is to interfere with American radar and targeting. This included anti-radiation systems that jam or incapacitate enemy sensors, weaponry that specializes in attacking the airborne sensors and electronic warfare assets that the US relies on. In a best-case scenario for China, this would paralyze the US ability to win what China started to call “informatized wars\"——what American planners call “systems war.\"","zh":"导弹并不是中国唯一的进步。它们被设计成与一整套系统配合使用，而那套系统的目的就是干扰美国的雷达与瞄准。其中包括干扰或瘫痪敌方传感器的反辐射系统，也包括专门攻击美军所依赖的机载传感器和电子战装备的武器。对中国来说，最理想的情形是：这能瘫痪美国打赢中国开始称之为“信息化战争”的能力——美国规划者则称之为“体系战”。"},{"id":"ch10-057","p":209,"t":"p","en":"The purpose of China's advanced systems is plainly stated: to destroy US or allied ships and facilities inside the first island chain, and to threaten and deter US ships or aircraft carriers if or as they try to enter that zone, or even to approach it.9 It added up to a major blow to American naval dominance in the Western Pacific.","zh":"中国这些先进系统的目的说得明白：摧毁第一岛链以内美国或盟国的舰艇与设施；一旦美国舰艇或航母试图进入该区域、甚至只是接近，就对其施加威胁与威慑。⁹ 这些加起来，是对美国在西太平洋海上主导地位的一次重大打击。"},{"id":"ch10-058","p":210,"t":"p","en":"In military circles, this combination of island reclamation, military installations, forward deployment of aircraft, and above all the anti-ship missiles became known by the somewhat unwieldy acronym A2/AD. That stands for \"anti-access/area denial.\"Anti-access means making it impossible or prohibitively costly for an adversarial navy to gain access to the waters in question—in this case, the Near Seas. Area denial means keeping that adversary force at bay over long periods of time, preventing them from gaining a foothold from which to expand their force.","zh":"在军界，填海造岛、修建军事设施、前沿部署飞机，尤其是反舰导弹，这几样合在一起，得了个颇为拗口的缩写：A2/AD，即“反介入／区域拒止”。反介入，是让对手海军无法进入、或须付出难以承受的代价才能进入相关海域——在这里就是近海。区域拒止，则是长期把对手的力量挡在外面，使其无法取得一个可以向外扩张的立足点。"},{"id":"ch10-059","p":210,"t":"p","en":"But as China evolved its forces, so did the United States. In the first decades of the post-Cold War era, the US had focused on far-range land operations-the long wars and high-impact Special Forces operations in the Middle East, above all. Those were operations that focused on Special Forces command, and the marines. But now the US turned back to the navy—and the air force. Because what emerged from early US thinking about how to respond to China's growing naval prowess was the concept of Air-Sea Battle—or ASB, as it is known in the acronym-clogged world of national security.10,*","zh":"但中国在发展军力的同时，美国也在变。冷战结束后的最初几十年，美国专注于远距离陆上作战——首先是中东的长期战争和高强度特种部队行动。那些行动的重心是特种作战司令部和海军陆战队。如今，美国把目光转回海军——还有空军。因为在美国关于如何应对中国海军力量增长的早期思考中，浮现出了“空海一体战”（Air-Sea Battle）这一构想；在这个缩写满天飞的国家安全圈里，它被称作 ASB。¹⁰,＊"},{"id":"ch10-060","p":210,"t":"p","en":"In an earlier era, when confronted with advances by another peer competitor, the Soviet Union, the United States had looked to offset those advances with developments of its own. The first of these came in confronting the sheer size of the Soviet conventional force; the US offset the Soviet advantage by developments in its nuclear weapons program. It became known as the “first offset.\"1 When the Soviets caught up in the nuclear arena, the United States looked to innovations in information technology and connectivity to provide the \"second offset,\" improving what's referred to as the \"“qualitative edge\" of American military performance—basically, cutting-edge information and communication technology. It has sought to maintain that edge ever since. And in 2010, confronting China's launch of anti-ship ballistic missiles, the United States began to seek a “third offset.\" Air-Sea Battle was the answer.12","zh":"更早的时代，面对另一个同级别对手苏联的进步，美国也曾力图以自己的发展来抵消对方的优势。第一次是在应对苏联常规力量压倒性规模的时候：美国以核武器计划的发展，抵消了苏联的优势，这被称为“第一次抵消”。¹ 苏联在核领域赶上来之后，美国转而寄望于信息技术与互联互通方面的创新，构成“第二次抵消”，提升所谓美国军事效能的“质量优势”——说到底是尖端的信息与通信技术。此后它一直设法保住这一优势。2010年，面对中国推出反舰弹道导弹，美国开始寻求“第三次抵消”。答案是空海一体战。¹²"},{"id":"ch10-061","p":210,"t":"n","en":"The Department of Defense later decided that the phrase \"Air-Sea Battle\" was too provocative, and replaced it with “Joint Concept for Access and Maneuver in the Global Commons.\" Then, deciding that was too inelegant, replaced it in turn with \"Multi-Domain Operations\" or “Joint All-Domain Operations,\" or even “Joint All-Domain Command and Control.\" The original \"Air-Sea Battle\" does a much better job of conveying the point.","zh":"国防部后来认为“空海一体战”的说法过于刺激，改称“全球公域介入与机动联合构想”；又觉得这个说法太不雅驯，再改为“多域作战”“联合全域作战”，甚至“联合全域指挥与控制”。还是原先的“空海一体战”更能把意思说清楚。"},{"id":"ch10-062","p":211,"t":"p","en":"Air-Sea Battle comprises a lot of acronyms and concepts and technical complexities, but its core is simple: to blunt the power of the Chinese missile systems, to allow the US to depend on its better ship design and higher-quality radar and communications technology for the edge in ship-to-ship combat. This can be done in three ways: by disrupting Chinese targeting; by destroying missile launchers in their bases; or by intercepting the missiles in flight.","zh":"空海一体战包含一大堆缩写、概念和技术细节，但核心很简单：钝化中国导弹系统的威力，让美国得以凭借更优良的舰艇设计、更高品质的雷达与通信技术，在舰对舰作战中占得上风。办法有三：扰乱中国的瞄准；摧毁基地里的导弹发射装置；或者在导弹飞行途中将其拦截。"},{"id":"ch10-063","p":211,"t":"p","en":"The first is conceptually straightforward, but technologically complex. Unlike missiles, ships—especially aircraft carriers—are large and very slow (by the standards of radar detection). Without sophisticated countermeasures, targeting of the ships is relatively straightforward. Of course, the US does engage in substantial countermeasures, using counter-radar, cyber offense, sending out counter-information, and other means to inject uncertainty into China's targeting. By these means, the US tries to confuse the Chinese picture of its naval assets in the Western Pacific—disrupting the sensory picture. And every time China tries to track and target an American ship, it is revealing valuable information—for any use of active sensors gives away the presence and identity of the user at a much greater range than what the sensor itself can detect. Still, as China develops its satellite and naval radar technologies, it's more and more likely that American ships could be successfully targeted. Disrupting targeting is not a sufficient measure to reduce the threat of China's anti-ship missiles.","zh":"第一种在道理上直截了当，技术上却很复杂。与导弹不同，舰艇——尤其是航母——体积大、速度慢（按雷达探测的标准衡量）。若没有精巧的对抗手段，锁定这些舰艇相对容易。当然，美国确实采取大量对抗措施，动用反雷达手段、网络攻击、释放对抗信息等等，给中国的瞄准注入不确定性。它借此扰乱中国对西太平洋美国海军力量态势的认知——打乱其感知图景。而中国每一次试图跟踪、锁定美国军舰，都在泄露宝贵的信息：任何主动传感器的使用，都会在远大于该传感器自身探测距离的范围内，暴露使用者的存在与身份。尽管如此，随着中国发展卫星与舰载雷达技术，美国军舰被成功锁定的可能性越来越大。扰乱瞄准，并不足以消减中国反舰导弹的威胁。"},{"id":"ch10-064","p":211,"t":"p","en":"The second option—destroying the missiles in their bases on island features in the Near Seas or on the Chinese mainland-is both complex and dangerous. It involves the United States deploying either long-range strike fighters, long-range missiles, or forward US ai
