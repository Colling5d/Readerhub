"p":107,"t":"h","en":"The Size Race","zh":"船舶的规模竞赛"},{"id":"ch04-055","p":107,"t":"p","en":"Among the first to marry these innovations was Maersk. Although they had stayed away from containerization in the mid-1960s, by the turn of the decade they had changed course. In 1970, P. Maersk Møller's grandson Arnold Maersk Mc-Kinney Møller, who took over the company after his father's death in 1965, would decide to commission their first cargo ship fully outfitted to support containerization. Maersk took delivery of the Svendborg Maersk in 1974, after it traveled from its port of construction in Japan. It copied some of the U-shaped design of the large tankers of the day, creating more room in the hold and straighter hull walls, which eased the process of stacking containers.","zh":"最早把这两套创新结合起来的企业之一，就是马士基。尽管它在20世纪60年代中期还对集装箱化敬而远之，但到60年代末70年代初，它已改弦更张。1970年，P. 马士基·穆勒的孙子阿诺德·马士基·麦金尼·穆勒（Arnold Maersk Mc-Kinney Møller）——他在1965年父亲去世后接掌公司——决定订造公司第一艘完全按集装箱化要求配备的货船。这艘「斯文堡马士基」号（Svendborg Maersk）在日本建成后驶回，于1974年交付。它借鉴了当时大型油轮的U形设计，货舱更宽敞，船壳侧壁更直，码放集装箱更为便利。"},{"id":"ch04-056","p":107,"t":"p","en":"The advent of fully containerized ships allowed Maersk—and the rest of the global shipping business—to expand the volume of what they could carry and the frequency of their trips. Maersk had run ships from Europe to Asia since 1926. But the new container ships allowed them to progressively and then massively increase the volume of cargo they could carry.","zh":"全集装箱船的出现，使马士基——以及整个全球航运业——得以扩大运量、提高航次频率。马士基自1926年起就经营欧洲至亚洲的航线。而新型集装箱船让它们逐步地、继而大幅度地提升了可承运的货量。"},{"id":"ch04-057","p":107,"t":"p","en":"Container ships and trade volumes grew hand in hand. Spurred by American industrial prowess, postwar reconstruction in Europe, and these new technologies for shipping, the world economy grew quickly, recording faster growth between 1950 and 1973 than it had in the heady years before 1914.37 Europe and the United States were the primary drivers and primary beneficiaries of this trade. In 1950, the US economy stood at almost \\$2.4 trillion in 2012 dollars; by 1980, when containerized trade had been fully adopted, it had grown to \\$6.8 trillion.38","zh":"集装箱船与贸易量携手增长。在美国工业实力、欧洲战后重建以及这些航运新技术的推动下，世界经济快速增长，1950年至1973年间的增速甚至超过1914年前那段意气风发的年月。37 欧洲与美国既是这场贸易的主要推手，也是主要受益者。1950年，按2012年美元计，美国经济规模约为2.4万亿美元；到1980年，集装箱化贸易已被全面采用，这一数字增至6.8万亿美元。38"},{"id":"ch04-058","p":107,"t":"p","en":"A running list of the largest ports in the world, by value or by volume, shows this growth—and the near-total extent to which “world\" trade was, in that period, dominated by the West. In 1969, the top container ports in the world were New York, Oakland, Rotterdam, Sydney, Los Angeles, Antwerp, Yokohama, Melbourne, Felixstowe (in southern England), and Bremen.39 The only non-Western port on the list was Yokohama—Japan being then the only industrialized democracy in Asia. Together, these economies accounted for more than 90 percent of global exports.40","zh":"把世界最大港口按货值或吞吐量列一张榜单，就能看出这种增长——也能看出那一时期“世界”贸易几乎完全由西方主导。1969年，世界排名前列的集装箱港是纽约、奥克兰、鹿特丹、悉尼、洛杉矶、安特卫普、横滨、墨尔本、费利克斯托（英格兰南部）和不来梅。39 榜上唯一的非西方港口是横滨——日本当时是亚洲唯一的工业化民主国家。这些经济体合计占全球出口的90%以上。40"},{"id":"ch04-059","p":108,"t":"p","en":"As Western trade grew, so did the demand for container traffic. Maersk and its competitors were in a constant race for scale. Other major shipping companies were nipping at their heels. Their primary competitors in those days were other European majors: the Genevabased but Italian-owned Mediterranean Shipping Company (MSC); the French-owned CMA CGM, a company formed by the merger of Compagnie Maritime d'Affrètement (CMA) and Compagnie Générale Maritime (CGM); and the German-owned Hapag-Lloyd.41 The nationality of the shipping firms reflected the legacy of the role Europe had played in the previous two hundred years in forging global trade. And they profited from the huge investment in the reconstruction of Europe after WWII and the intensification of trade with the United States.","zh":"随着西方贸易增长，集装箱运输的需求也随之增长。马士基与竞争对手陷于旷日持久的规模竞赛，其他大航运公司紧追不舍。当时它们的主要对手是欧洲的几家巨头：总部设在日内瓦、为意大利人所有的地中海航运公司（MSC）；法国人所有的达飞海运（CMA CGM），由达飞轮船（CMA）与法国海运总公司（CGM）合并而成；以及德国人所有的赫伯罗特（Hapag-Lloyd）。41 这些航运公司的国籍，映射出过去两百年里欧洲在缔造全球贸易中所扮演角色的遗产。它们也从二战后欧洲重建的巨额投资、以及与美国贸易的不断加深中获利。"},{"id":"ch04-060","p":108,"t":"p","en":"It is striking that there was only one American company in the top ranks for global shipping firms in that period (McLean's own company, Sea-Land). Perhaps this reflected the fact that, despite its size, the American economy was in that period largely driven by domestic consumption—by goods made, sold, and used in the United States. In the early 1960s, only 5 percent of the American economy was driven by exports, and even after two decades of globalization, by 1980 that number had risen only to 10 percent.4² Europe, on the other hand, was heavily dependent on trade—and the scale and weight of its shipping firms reflected that.","zh":"值得注意的是，那一时期位居全球航运前列的公司中，只有一家是美国的（即麦克莱恩自己的海陆公司）。这或许反映出：美国经济尽管庞大，那一时期却主要由国内消费驱动——商品在美国制造、在美国销售、在美国使用。20世纪60年代初，出口只占美国经济的5%；即便经过二十年的全球化，到1980年这一数字也只升到10%。42 反观欧洲，则严重依赖贸易——其航运公司的规模与分量正是这一点的写照。"},{"id":"ch04-061","p":108,"t":"p","en":"Maersk and its European competitors kept up the race for size, building ever-bigger ships. Although the company had vaulted up the ranks of the larger container shipping companies, its rivals were constantly vying to catch up. In 1977, it extended the size of its firstgeneration container ships, allowing them to carry 1,800 TEU.43 In 1978, it commissioned a ship able to hold 2,124 TEU.44 And it kept going: in the mid-1980s, it commissioned what became known as the Marchen Maersk, this one produced by the Odense shipyard itself, capable of carrying 5,000 TEU, fully ten times the \"behemoth\" that McLean had sailed in 1961.45","zh":"马士基与欧洲对手们继续着规模竞赛，把船越造越大。公司虽已跃居大型集装箱航运公司之列，对手们却时刻想赶上来。1977年，它把第一代集装箱船加长，载箱量提高到1,800标准箱。43 1978年，它订造了一艘可装2,124标准箱的船。44 而且它没有停步：20世纪80年代中期，它订造了后来所称的「马士基·马辰」号（Marchen Maersk），由欧登塞船厂自己建造，可装5,000标准箱，整整是麦克莱恩1961年那艘“巨兽”的十倍。45"},{"id":"ch04-062","p":108,"t":"p","en":"The growth in scale of the ships precisely mirrored the growth in volume of global trade—indeed, the two are all but synonymous. In 1950, when Maersk was rebuilding its shipping fleet after the losses of World War II, the total value of all global trade was \\$61 billion.4 The evolution of ship design and containerization—and the standardization of inter-model containers—helped to drive large-scale growth in trade, and with it the total size of the Western economies. No other factor does as much to explain the growth of these economies in the 1970s, '80s, and '90s as the drastic reduction in the cost of transportation that large-scale shipping allowed.47 By 1990, when the Marchen was plying the transpacific route, global trade had skyrocketed to \\$3.5 trillion.48 And Maersk had become the largest shipping company in the world.","zh":"船舶规模的扩张，精确地映照出全球贸易量的增长——两者几乎可以说是一回事。1950年，马士基正在二战损失之后重建船队，当时全球贸易总额为610亿美元。46 船舶设计与集装箱化的演进——以及多式联运集装箱的标准化——推动了贸易的大规模增长，也推动了西方经济体总体规模的扩张。20世纪70、80、90年代这些经济体的增长，别的因素都远不及大规模航运所带来的运输成本骤降那样能够解释。47 到1990年，「马士基·马辰」号正跑在跨太平洋航线上，全球贸易额已飙升至3.5万亿美元。48 而马士基已成为世界最大的航运公司。"},{"id":"ch04-063","p":109,"t":"p","en":"But by then, bigger changes were afoot. And to understand and visualize them, we need to shift our gaze back to geopolitics, and Asia. And to the second family-owned company that helped to shape the world of today.","zh":"但到那时，更大的变化已在酝酿。要理解这些变化、把它们看得真切，我们得把目光移回地缘政治，移向亚洲，移向另一家塑造了今日世界的家族企业。"}],"notes":[]},{"id":"ch05","label":"Chapter 5","labelZh":"","title":"Taipans of Globalization","titleZh":"第五章　全球化的大班","part":"Part II: To Contain the World, 1956-2017","showPart":false,"partZh":"第二部","partTitleZh":"围堵世界（1956—2017）","paras":[{"id":"ch05-001","p":110,"t":"p","en":"In the 1960s and '70s, international trade was heavily dominated by the Western democracies of Europe and the United States. But by the early 1980s, there was also growing dynamism in the capitalist countries of Asia—Korea, Taiwan, Japan—as well as in the city-state of Singapore. It's striking to look at the names and origins of the shipping companies that began climbing the global ranks in this period: Mitsui O.S.K. Lines from Japan, American President Lines from Singapore, Yang Ming Marine Transport Corporation from Taiwan. Each of these nations developed companies that built or commissioned their own container ships, each vying for a share of the burgeoning world trade market. All this was amplified by the Japanese economic boom in the 1980s, which turned Japan into the number two economy in the world.","zh":"20世纪60、70年代，国际贸易基本由欧洲与美国的西方民主国家主导。但到80年代初，亚洲的资本主义国家和地区——韩国、台湾、日本——以及城邦国家新加坡，也日渐显出生气。这一时期开始跻身全球前列的航运公司，其名号与出身颇值得一看：日本的大阪商船三井（Mitsui O.S.K. Lines）、新加坡的美国总统轮船（American President Lines）、台湾的阳明海运（Yang Ming Marine Transport Corporation）。这些国家和地区各自都有了建造或订造自家集装箱船的公司，争相在这个蓬勃生长的世界贸易市场上分一杯羹。这一切又因80年代日本的经济繁荣而放大——日本由此成为世界第二大经济体。"},{"id":"ch05-002","p":110,"t":"p","en":"But the largest Asian shipping firm in the 1970s and '80s was from none of these countries. It was based, rather, in that British exclave of the West, Hong Kong.","zh":"但20世纪70、80年代亚洲最大的航运公司，并不出自上述任何一个国家。它偏偏坐落在香港——英国安插在东方的那块“西方飞地”。"},{"id":"ch05-003","p":110,"t":"p","en":"Hong Kong has played strangely important roles in the story lines of two modern global powers: Britain, which, when it encountered Hong Kong in the 1830s, was at the very peak of its might and reach; and China, which was then at the nadir of its own. Ironically, when the English East India Company first sought London's backing for the Opium Wars and held out Hong Kong as an important reward, Lord Palmerston quipped, “It will never be a mart for trade.\"1 A hundred and thirty years later, it was the largest port in the world.²","zh":"在香港的故事里，两个现代全球大国都扮演过奇特而重要的角色：一个是英国——19世纪30年代它与香港相遇时，正当国力与势力范围的顶峰；另一个是中国——当时正处在自身命运的最低谷。颇具讽刺意味的是，当年英国东印度公司为发动鸦片战争寻求伦敦支持、把香港说成一份重要的战利品时，帕默斯顿勋爵曾打趣道：“它永远不会成为贸易集市。”1 一百三十年后，这里成了世界最大的港口。2"},{"id":"ch05-004","p":111,"t":"p","en":"Just as the expansion of European and Atlantic trade in the 1960s through the 1980s is reflected in the change and growth of the familyowned company Maersk, so, too, can the expansion of Asia's role in the world economy be seen reflected in a second family-owned company— this one in Hong Kong. At its peak, the Orient Overseas Container Line family of firms would become the largest shipping conglomerate in Asia.*","zh":"正如20世纪60年代至80年代欧美与大西洋贸易的扩张，映照在马士基这家家族企业的变迁与成长之中；亚洲在世界经济中角色的扩张，也可以从第二家家族企业身上看出来——这一家在香港。鼎盛时期，东方海外集装箱航运（Orient Overseas Container Line）旗下的一众公司，成了亚洲最大的航运集团。*"},{"id":"ch05-005","p":111,"t":"p","en":"Part of what makes Hong Kong so important is its entrepreneurial culture. Much of this was inherited from Shanghai—many of Hong Kong's most important business families have their roots in 1930s Shanghai, at the time the third-largest city in the world and a key hub for international shipping and finance (as well as espionage and imperial rivalry).³ One such family was the Hong Kong Tungs.","zh":"香港之所以如此重要，部分原因在于它的创业文化。这种文化多半承自上海——香港许多最重要的商业家族，根都在20世纪30年代的上海；那时的上海是世界第三大城市，也是国际航运与金融（以及间谍活动与列强角逐）的关键枢纽。3 董氏家族便是其中一支。"},{"id":"ch05-006","p":111,"t":"p","en":"In 1922, a short story by the English novelist W. Somerset Maugham introduced Western readers to the concept of the Taipan—a figure that blends the roles of business leader, family scion, and overlord of trade.† If there's a modern-day equivalent of the Taipan, it's the Hong Kong Tungs: local business leaders, political figures, international business tycoons, and scions of the most important shipping dynasty in Hong Kong.","zh":"1922年，英国小说家毛姆（W. Somerset Maugham）的一篇短篇小说，把“大班”这个概念介绍给了西方读者——这个大班，兼有商界领袖、家族继承人与贸易霸主三重身份。* 若说今天还有大班的对应物，那便是香港董家：地方商界领袖、政治人物、国际商业巨子，香港最重要的航运王朝的传人。"},{"id":"ch05-007","p":111,"t":"p","en":"The founder, Chao Yung Tung (or C.Y., as he's commonly known), was born outside Shanghai in 1912-the same year Peter Maersk and his son founded their business. Like Maersk, the company C. Y. Tung founded would remain in private hands, would pass from father to son, and would help craft modern globalization. And like the Danish Shipbuilding Company of 1912, the company he founded was born into a world on the precipice of war.","zh":"创始人董浩云（Chao Yung Tung，通称 C. Y.）1912年生于上海郊外——正是彼得·马士基父子创办公司的那一年。与马士基一样，董浩云创办的公司始终握在私人手里，父传子，并参与塑造了现代全球化。也与1912年的丹麦造船公司一样，他创立的公司诞生在一个濒临战争的世界。"},{"id":"ch05-008","p":111,"t":"n","en":"For a time, the parent company, Overseas Orient Ltd., even owned the Port of Long Beach, before the US government forced it to sell, citing what are known as CFIUS concerns—rules issued by the Committee on Foreign Investment in the United States that authorize the US government to limit sales of American firms to foreign companies on national security grounds.","zh":"有一段时间，母公司东方海外（Overseas Orient Ltd.）甚至拥有长滩港，后来美国政府迫使其出售，理由是所谓的“CFIUS 审查”——那是美国外国投资委员会（Committee on Foreign Investment in the United States）发布的规则，授权美国政府以国家安全为由限制美国企业向外国公司出售资产。"},{"id":"ch05-009","p":111,"t":"n","en":"James Clavell further popularized this notion with his novels about the establishment of what he terms “the Noble House\"——loosely modeled on the oldest English trading firm in Asia, Jardines, whose main business house in China is still to be found on the famous Bund of Shanghai, and whose fifty-two-story Hong Kong skyscraper was the tallest in Asia when it was built. The Jardine building dominated the skyline of Hong Kong in the 1980s, its nautically themed porthole-shaped windows and the reputation of its inhabitants earning it the unfortunate sobriquet of “the house of a thousand arseholes.\"","zh":"詹姆斯·克拉维尔（James Clavell）以其一系列小说进一步普及了这一形象，写的就是他所谓“豪门”（the Noble House）的建立——那大致是以亚洲最古老的英资洋行为原型，即怡和洋行（Jardines）。它在中国的总行至今仍坐落在上海著名的外滩，而它那幢五十二层的香港摩天楼落成时曾是全亚洲最高。20世纪80年代，怡和大楼雄踞香港天际线，它那航海主题的舷窗形窗户，加上楼里人的名声，给它招来了“千屁眼大楼”这个不雅的诨名。"},{"id":"ch05-010","p":112,"t":"p","en":"The story of C.Y's company is well told in a small museum housed on the campus of Shanghai Jiao Tong University. The university was formed in 1896 as the Nanyang Public School by Emperor Guangxu, at the urging of Shanghainese leaders eager to develop the intellectual and entrepreneurial energy of the city's residents. Shanghai's merchants were ambitious and seeking to reverse the decline in Chinese fortunes that had followed the unequal treaties. They invested in education and engineering and in the industry that had so obviously and so visibly seen China subordinated to foreign powers and foreign companies— shipping.⁴","zh":"董浩云公司的故事，在上海交通大学校园里的一座小博物馆里讲得很清楚。这所大学1896年由光绪皇帝创办，初名南洋公学，倡办者是几位上海士绅——他们急于培育这座城市居民的智识与创业精神。上海商人雄心勃勃，想要扭转不平等条约之后中国国运的衰颓。他们投资教育，投资工程，也投资那个让中国如此明显、如此醒目地屈从于列强与外国公司的行业——航运。4"},{"id":"ch05-011","p":112,"t":"p","en":"Modern Chinese universities can be brutish affairs, reflecting the ideology of their times. But the earliest China universities, Shanghai Jiao Tong among them, resemble their English redbrick counterparts, organized around central courtyards lined with yew trees and boxwoods, and populated by buildings that echo the architectural interplay of old Shanghai-with Victorian, Gothic, and Chinese styles all represented in the university's central square.","zh":"中国的现代大学往往粗陋僵硬，映照着各自时代的意识形态。但中国最早的几所大学——上海交大也在其中——却像英国的“红砖大学”：以中央庭院为核心布局，院中夹道种着红豆杉与黄杨，四周的建筑呼应着老上海的建筑对话——维多利亚式、哥特式与中国式风格，在大学中央广场上一一呈现。"},{"id":"ch05-012","p":112,"t":"p","en":"At the edge of the university is a small shikumen building—a style of gray-and-red-brick two-story architecture unique to Shanghai of the 1930s. Open the doors and you enter a cantilevered hall with a skylight that runs the entire length of the building, creating a large sun-filled chamber off of which are mounted side rooms that house the main displays. These depict the history of Chinese maritime exploration from the 1400s onward, recounting the exploits, for example, of the Shanghai sand fishermen who first ventured across the surprisingly shallow waters of the East China Sea. Pride of place is given over to Zheng He and the Chinese Treasure Fleet. Then a side staircase rises to an upper gallery, which takes up all of the second floor. This is dedicated in its entirety to C. Y. Tung.","zh":"校园边上有一幢小小的石库门建筑——那种灰红砖墙的两层小楼，是20世纪30年代上海独有的样式。推门进去，是一个带天窗的挑空大厅，天窗贯穿整幢建筑的长度，形成一间洒满阳光的大屋子，两侧开着一间间侧室，主要展陈都在其中。展览讲的是15世纪以来中国海上探索的历史，比如最早闯过东海那片浅得出奇的水域的上海沙船渔民。最显要的位置留给了郑和与郑和宝船队。再往里，一道侧梯通向占据整个二层的高层展廊——那里全部用来陈列董浩云。"},{"id":"ch05-013","p":112,"t":"p","en":"In 1928, at the age of sixteen, C.Y. began work for a Japanese firm, Kokusai Transport Company, where he learned the basics of the transportation sector. A year later he transferred to Tongcheng Co., a Chinese bank. Tongcheng had a subsidiary, the Tianjin Navigation Company, which had the contract to service much of the fleet docked at Shanghai's wharfs—at the time, one of only a handful of Chineseowned firms with a piece of the action of the maritime trade. C.Y. transferred to the Tianjin Navigation Company, and quickly climbed the corporate ladder. At age twenty-three, he was made the vice president of the Tianjin Shipowners Association. One of the visible features of European dominance of Shanghai at the time was the tall ships and tea clippers and steamships docked immediately in front of the Bund, Shanghai's glittering new waterfront quay. The C. Y. Tung gallery displays dozens of sepia photographs of the steamers and cruisers and cargo ships of Jardine Matheson, Butterfield and Swire, the Americanowned Shanghai Steam Navigation company, and of the other European and Japanese firms that occupied the riverside harbor in old Shanghai. It was a daily reminder of the backwardness of turn-of-thecentury China. On the very first day of his job at Tainjin Navigation, C.Y. would write a note to his boss, highlighting the fact that all the ships that they were servicing were European or Japanese, not Chinese: \"It should never have been allowed to be like this.\"⁵ In his diaries he would write about the need to move China out of its backwardness to refresh the memory of Zheng He and to launch China's own industrialists and entrepreneurs into the critical industry of the maritime shipping trade.6 In 1964, he wrote, \"Admiral Zheng He (known in Chinese history as Eunuch San Pao) visited the South Seas seven times from Asia to Africa. This epic-making event of 550 years ago all happened before Columbus discovered the New World.\" In a connected passage he would ask about Chinese industry, \"How can we not continue to conquer the sea?\"7,*","zh":"1928年，十六岁的董浩云进了一家日本公司——国际运输公司（Kokusai Transport Company），在那里学到了运输业的基本门道。一年后，他转到一家中资银行——通成公司。通成旗下有一家子公司，即天津航业公司，承包了停泊上海各码头的相当一部分船队的服务业务——当时，能在这门海上贸易里分得一杯羹的中资公司不过寥寥数家。董浩云转到天津航业，很快在公司里一路升迁。二十三岁那年，他出任天津船东协会副会长。当时欧洲人主宰上海的一个显眼标志，就是紧靠外滩——上海那条光彩夺目的新滨江码头——停泊的大帆船、飞剪茶船与汽船。董浩云展廊里挂着几十帧棕褐色照片，拍的是怡和洋行、太古洋行、美资旗昌轮船公司，以及当年占据老上海江岸码头的其他欧资、日资企业的汽船、巡洋船与货船。那是日日可见的提醒：世纪之交的中国何等落后。到天津航业上班的第一天，董浩云就给老板写了一张条子，指出他们提供服务的船全是欧洲船或日本船，没有一条中国船：“这种事本就不该被允许。”5 他在日记里写到，必须让中国走出落后，唤回对郑和的记忆，把中国自己的实业家与创业者推上海上贸易这一关键行业。6 1964年，他写道：“郑和海军统帅（中国史称三宝太监）七下南洋，远及非洲。这桩550年前的壮举，全都发生在哥伦布发现新大陆之前。”在紧接的一段文字里，他还会写道……"},{"id":"ch05-014","p":113,"t":"p","en":"In 1941, C.Y. launched his own shipping company, Chinese Maritime Trust Ltd., taking offices in rooms 300, 301, and 303 in No. 12 The Bund, a building whose main tenant was the Hongkong and Shanghai Banking Corporation (now better known by its initials, HSBC; Asia's largest bank). The company he founded would end up a critical player in the economic rise of Asia.8","zh":"1941年，董浩云创办了自己的航运公司——中国航运信托公司（Chinese Maritime Trust Ltd.），办事处设在外滩12号的300、301、303室；这幢楼的主要租户是香港上海汇丰银行（如今人们更熟悉它的简称 HSBC，亚洲最大的银行）。他创办的这家公司，后来成了亚洲经济崛起中的关键角色。8"},{"id":"ch05-015","p":113,"t":"n","en":"Once established in a wealthy position in Hong Kong, C. Y. Tung wanted to make a movie about Zheng He, and approached a famous Hong Kong film director with the proposition. The director told him: “C.Y., you don't want to make that movie; you'll lose a fortune.\" C.Y. went to his deathbed with this one unfulfilled ambition. (Author interview with C. H. Tung, Hong Kong, November 1, 2019.)","zh":"在香港站稳了富裕地位之后，董浩云想拍一部关于郑和的电影，便带着这个想法去找一位香港名导演。导演对他说：“C.Y.，这电影你别拍，你会赔掉一大笔钱。”这个未了的心愿，他一直带到了临终。（作者2019年11月1日在香港对董建华的访谈。）"},{"id":"ch05-016","p":114,"t":"p","en":"But Shanghai was (and is) a city of contradictions. For all its international commercial energy, it was also here in 1920 after the fall of the Qing emperor that the Chinese labor movement grew, forged ties with the Soviets, and took form as the Communist Party of China. And in 1937, as C. Y. Tung registered his company, Shanghai was about to be torn apart by violence. Already in the late 1920s, Shanghai had been the scene of a brutal massacre at the hands of Chiang Kai-shek and his nationalist forces of the Kuomintang.\" Much worse was to come. On July 7, 1937, Japan invaded China, and they skirmished in what later became famous as the Marco Polo Bridge Incident—on the very day that C. Y. Tung's first son was born.","zh":"但上海从来就是（现在也是）一座充满矛盾的城市。尽管国际商业活力充沛，也正是在这里，1920年清帝退位之后，中国工人运动壮大起来，与苏联建立了联系，并形成为中国共产党。1937年，就在董浩云注册公司的时候，上海即将被暴力撕碎。早在20世纪20年代末，上海就已是蒋介石及其国民党武装血腥屠杀的现场。9 更坏的还在后面。1937年7月7日，日本侵华，双方交火，即后来著名的卢沟桥事变——就在董浩云长子出生的那一天。"},{"id":"ch05-017","p":114,"t":"p","en":"Later that summer the Japanese would press further, and in August of 1937, Japanese and Chinese forces clashed on the banks of the Huangpu River in central Shanghai. By the time the battle ended three months later, what became known as the Battle of Shanghai had left as many as three hundred thousand dead—one of the deadliest battles in modern history, until World War II obliterated such records with its vast killing fields.10","zh":"那年夏天稍晚，日军继续推进。1937年8月，中日军队在上海市中心的黄浦江畔交火。三个月后战役结束时，这场后来被称为淞沪会战的战事已造成多达三十万人死亡——在现代史上最惨烈的战役之列，直到二战以其广袤的屠杀场刷新了这一纪录。10"},{"id":"ch05-018","p":114,"t":"p","en":"At the outbreak of World War II, C. Y. Tung registered his company in Hong Kong, before that city-state fell to Japanese occupation, one day before the Japanese attack on Pearl Harbor. He then temporarily set up shop in Chongqing, where the Chinese government established a temporary capital. And then when the war receded, he returned to Shanghai in 1946. But China was set to see more strife, as the internal divisions that had begun to tear China apart before the war returned in full force, and China fell again into civil war. In 1949, Chairman Mao's Red Army defeated Chiang Kai-shek of the Koumintang, who was pushed into exile in Taiwan, and formed the People's Republic of China. One of Mao's first acts was to close Shanghai off from the outside world. The gilded city that had endured so much folded into itself, forced to recede from world markets and fading from the world's imagination. A red star, the symbol of the Communist Party, was installed on top of the tallest spire of the major trading house on the Bund.\"","zh":"第二次世界大战爆发之际，董浩云把公司注册到了香港——那是在这座城市沦陷于日军占领之前，比日本偷袭珍珠港早一天。随后他暂在重庆设行，中国政府在那里建立了战时首都。战事退去后，他于1946年回到上海。但中国注定还要经历更多动荡：战前已开始撕裂中国的内部分裂全面回潮，中国再度陷入内战。1949年，毛泽东主席的红军击败蒋介石的国民党，蒋退往台湾，中华人民共和国成立。毛泽东最早的动作之一，就是把上海与外部世界隔绝开来。这座镀金的城市承受了那么多，如今向内收拢，被迫退出世界市场，也从世界的想象中淡出。一颗红星——共产党的标志——被装上了外滩那家最大贸易行的最高塔尖。11"},{"id":"ch05-019","p":114,"t":"p","en":"C. Y. Tung had already left. In 1948, seeing the growing risk of a communist takeover, he moved his business and his family permanently to Hong Kong.","zh":"董浩云早已离开。1948年，眼看共产党接管的危险日增，他把生意和家人都迁到了香港，从此定居。"},{"id":"ch05-020","p":115,"t":"p","en":"Chinese Maritime Ltd. quickly became one of Hong Kong's most important companies. Understanding the importance of bold moves, C.Y. acquired the Tien Loong, a steamship of more than ten thousand tons. It became the first ship in modern history owned and managed by a Chinese national to sail the Atlantic and arrive in Europe.12 In 1948, he went farther, when the Tung Ping became the first Chinese ship to sail to the United States.13,\" Shipping was his life: \"The sea has held my fascination since I was a child; the ship is my other self.\"14","zh":"中国航运公司迅速成为香港最重要的企业之一。董浩云懂得大胆行动的价值，买下了万吨以上的汽船「天龙」号（Tien Loong）。这艘船成为近代史上第一艘由中国人拥有并经营、横渡大西洋抵达欧洲的船。12 1948年，他走得更远：「通平」号（Tung Ping）成为第一艘驶抵美国的中国船。13* 航运就是他的生命：“我从小就痴迷于大海；船是我的另一个自我。”14"},{"id":"ch05-021","p":115,"t":"p","en":"Like Maersk in the same era, China Maritime Ltd. first developed its global business through the tanker trade. As early as 1959, just after the first Suez Crisis, C. Y. Tung ordered the construction of Oriental Giant, which became the largest ship in Asia when it was delivered. And in 1973 he commissioned the construction of the mega-tanker Seawise Giant (a pun on his initials), which lived up to its name—when delivered in 1979, it was the largest ship in the world.15","zh":"与同一时期的马士基一样，中国航运公司最初是通过油轮业务发展起全球生意的。早在1959年，第一次苏伊士危机刚刚过去，董浩云就订造了「东方巨人」号（Oriental Giant），交付时是亚洲最大的船。1973年，他又订造了巨型油轮「海上巨人」号（Seawise Giant，取他姓名缩写 C.Y. 的谐音）——这船名副其实：1979年交付时，它是世界上最大的船。15"},{"id":"ch05-022","p":115,"t":"p","en":"But what really drove C. Y. Tung's companies to the forefront of Hong Kong's role in globalization was, again like Maersk, an early move into containerization of the international trade. In 1965, C. Y. Tung converted a series of bulk carriers into semi-containerized ships. He served on the containerization commission for Hong Kong in 1966. And in 1971 he committed, commissioning two fully containerized ships, the Oriental Commander and Oriental Financier. And in 1973, just as Maersk took delivery of the Svendborg, he established a separate company to deepen his container investment, Orient Overseas Container Line (OOCL).","zh":"但真正把董浩云旗下公司推到香港参与全球化最前沿的，仍旧和马士基一样，是早早投身国际贸易的集装箱化。1965年，董浩云把一批散货船改装成半集装箱船。1966年，他出任香港集装箱化委员会委员。1971年，他下决心投入，订造了两艘全集装箱船「东方统帅」号（Oriental Commander）与「东方金融家」号（Oriental Financier）。1973年，就在马士基接收「斯文堡马士基」号之际，他另设一家公司以加深集装箱方面的投资，即东方海外集装箱航运公司（OOCL）。"},{"id":"ch05-023","p":115,"t":"p","en":"For the next decade, as Hong Kong rose, so did OOCL; or really, the other way around. In December 1966, the Hong Kong Container Committee, with C. Y. Tung on board, reported, “[U]nless a container terminal is available in Hong Kong to serve these [new container] ships the trading position of the Colony will be affected detrimentally.\"16 The authorities acted on the commission's recommendations—in 1969, three initial terminals were funded by operators from Europe, Japan, and the US. In July of that year, Hong Kong received its first visit from a fully containerized ship (before the terminal was ready); in 1972, the first berths for a new facility, today known as the Kwai Tsing Container Terminals, opened; and in 1976, five container terminals became fully operational. Between 1970 and 1972, shipments out of Hong Kong rose from 3 million tons to 3.8 million, and the value of foreign trade increased by 35 percent—even before the container terminals were operating at full steam.17","zh":"此后十年，香港崛起，东方海外也随之崛起；或者说，其实是反过来。1966年12月，董浩云参与的香港集装箱委员会报告称：“除非香港能提供集装箱码头来服务这些（新型集装箱）船，否则本殖民地的贸易地位将受到损害。”16 当局照委员会的建议办了——1969年，首批三个码头由来自欧洲、日本和美国的运营商出资建设。同年7月，香港迎来了第一艘全集装箱船的挂靠（那时码头尚未建成）；1972年，新设施——即今日的葵青集装箱码头——第一批泊位启用；1976年，五个集装箱码头全面投入运营。1970年至1972年间，香港的出港货运量从300万吨增至380万吨，对外贸易额增长35%——而这还是集装箱码头尚未全速运转之前。17"},{"id":"ch05-024","p":115,"t":"n","en":"Here, the word “Chinese” is referring to the ethnicity of C. Y. Tung, not his nationality.","zh":"此处“Chinese”一词指的是董浩云的族裔，而非他的国籍。"},{"id":"ch05-025","p":116,"t":"p","en":"Through all of this, the Tungs were a central pillar of Hong Kong's growth. Indeed the family is the living embodiment of the changing fate of China, with its storied past and turbulent history; of the crisis of the communist takeover of China in the 1940s; of the unique role of Hong Kong as a kind of offshore safety valve for Chinese industrial prowess; of the transformation of Hong Kong into a modern hub for finance and trade; and of its eventual reabsorption back into mainland China.","zh":"贯穿这一切，董家是香港成长的中流砥柱。这个家族确实是中国命运变迁的活标本：既有悠远的过往，也有动荡的历史；既映照着20世纪40年代共产党接管中国的变局，也映照着香港作为中国工业实力“离岸安全阀”的独特角色；还映照着香港转变为现代金融与贸易枢纽，以及最终重归中国大陆。"},{"id":"ch05-026","p":116,"t":"p","en":"Modern-day Hong Kong is a dramatic place, where steep mountain slopes fall down toward the blue-gray waters of the harbor, only to be interrupted in their descent by a wall of expansive neon-ringed skyscrapers that line the shore. From some vantage points it seems like the skyscrapers are taller than Hong Kong's famed Victoria Peak, but in fact that natural feature still does just top out the island. From there, on a clear day (rarer than they used to be) the naked eye can see for miles, well into mainland China across Kowloon Bay. Also visible is the modern harbor of Hong Kong, fronting right up to the skyline: until 2017, the world's largest. This is the Hong Kong that these Taipans of globalization helped create.\"","zh":"今日香港是个极有戏剧性的地方：陡峭的山坡向港湾蓝灰色的水面倾落，半途却被一堵环绕海岸、霓虹镶边的摩天楼墙截断。从某些角度望去，那些摩天楼仿佛高过香港著名的太平山顶，但实际上，那座天然地标仍略高于全岛。站在山顶，晴天（如今比从前少了）裸眼可望出数英里，越过九龙湾一直看到中国大陆腹地。同样看得见的，是紧贴天际线铺开的现代香港港区：直到2017年，它一直是世界最大的港口。这就是这些全球化的大班们参与造就的香港。18"},{"id":"ch05-027","p":116,"t":"p","en":"The central offices of the Tung business empire lie very close to the harbor-not in the glitzy Central District, where modern financial Hong Kong works, but in the more modest Wan Chai district, a nondescript office block close to the main port facility of old. The Tung offices are situated on the thirty-third floor of the Harbor Center, the marble lobby of which could be found in any commercial quarter of any Western city—except for the small boutique of Chinese antiques tucked away in a corner. Step out of the elevator on the thirty-third floor, though, and you could only be in Hong Kong.","zh":"董氏商业帝国的总部办公室离海港很近——不在香港现代金融业云集、光鲜的中环，而在朴素些的湾仔：一幢不起眼的写字楼，靠近老港区的主要设施。董家的办公室在海港中心三十三楼，那幢楼的大理石大堂放在任何西方城市的任何商务区都不违和——除了角落里藏着一间中国古董小店。可一旦踏出三十三楼的电梯，你就只可能是在香港。"},{"id":"ch05-028","p":116,"t":"n","en":"Despite New York Times profiles and friendships with world leaders, and the prestige as Asia's largest shipper, C.Y. still did not see himself as belonging. In the 1950s, he sent his son to school in the United Kingdom. At the time, he told him: \"You cannot enter the university in Hong Kong, because it is for the elite; and we are not of the elite.\" Author interview, C. H. Tung, Hong Kong, November 1, 2019.","zh":"尽管《纽约时报》作过人物特写，尽管与世界各国领导人交好，尽管享有亚洲最大船东的声望，董浩云仍不觉得自己属于那个圈子。20世纪50年代，他把儿子送到英国读书，当时对他说：“你进不了香港的大学，那是给精英读的；我们不是精英。”作者访谈，董建华，香港，2019年11月1日。"},{"id":"ch05-029","p":117,"t":"p","en":"When the doors open, three staff members are waiting to greet you. They escort you warmly, but quickly, to an outer office, where a receptionist takes your coat, if you have one. (Hong Kong gets quite cold in its winter months.) She offers you tea while you wait. This being China, you always have to wait; but this being Hong Kong, you don't wait long.","zh":"门开处，三名职员已在等候迎接。他们热情而利落地把你引到外间办公室，接待员替你接过外套——如果你带了的话。（香港的冬天相当冷。）你等候时，她端上茶。这里是中国，你总得等；但这里是香港，你不会等太久。"},{"id":"ch05-030","p":117,"t":"p","en":"C.H. stands about five foot seven and is always immaculately dressed, usually in a bespoke suit, his silvering hair trimmed at the temples. He exudes the quiet confidence of a man with both economic and political power at his ready disposal. For four decades he was at the heart of Hong Kong's economic rise.","zh":"董建华身高约五英尺七英寸，衣着总是一丝不苟，通常是一身定做的西装，鬓角处银发修得整齐。他流露出的是一种安静的自信——一个经济权力与政治权力都随时可供调用的人才会有的自信。四十年来，他一直身处香港经济崛起的核心。"},{"id":"ch05-031","p":117,"t":"p","en":"After you wait for a few minutes in his outer office, his staff invite you to go into the inner sanctum. A modern office suite with a wide desk set against a bank of large windows and a series of black leather sofas formed into a rectangle to allow for quiet conversation. On the rear wall, a montage of black-and-white photographs captures the development of the technology and the steadily growing size of OOCL's ships, ships that formed the backbone of Hong Kong's economic growth in the 1970s, '80s, and '90s.","zh":"在外间等过几分钟，职员便请你进入内室。一间现代风格的办公套间，宽大的办公桌背靠一排大窗，几张黑皮沙发围成一个矩形，便于安静交谈。后墙上是一组黑白照片拼贴，记录着技术的演进与东方海外船舶吨位的稳步增长——那些船，正是20世纪70、80、90年代香港经济增长的脊梁。"},{"id":"ch05-032","p":117,"t":"p","en":"When C. H. Tung himself enters the office to greet you, he bears a warm smile on his face. He is dressed in the Western businessman's uniform, charcoal gray suit and crisp white shirt, both impeccably tailored. Then he asks you to wait for a brief moment and disappears into a personal office. When he returns, the suit jacket has been replaced by a black fleece Mao jacket. Perhaps the change is motivated simply by an effort to combat the chills, but somehow it seems to capture the essence of the man: an avatar of globalization and of modern business, a member of the International Council at J.P. Morgan, a capitalist to his very bones—but in his marrow, Chinese.","zh":"董建华本人进来迎客时，脸上挂着温暖的笑意。他穿的是西方商人的制服：炭灰色西装，挺括的白衬衫，剪裁都无可挑剔。随后他请你稍候片刻，转身进了里间的私人办公室。再出来时，西装外套已换成了黑色的毛式抓绒上衣。换这身衣服，也许只是为御寒，但不知怎的，它似乎抓住了这个人的本质：全球化的化身、现代商业的化身，摩根大通国际顾问委员会成员，骨子里彻头彻尾的资本家——然而在骨髓深处，是中国人。"},{"id":"ch05-033","p":117,"t":"p","en":"C.H. never had the same love for the sea that inspired his father. “He was a romantic. I counted the money,\" he says with a rueful smile. And at first, C. H. Tung resisted being pulled into the family business. When he was away at school in England—graduating in 1960 with a bachelor's degree in maritime engineering from the University of Liverpool—his mother had sent word that he should come back to","zh":"董建华从未像父亲那样痴迷大海。“他是个浪漫主义者。我数钱。”他苦笑着说。起初，董建华并不愿被拉进家族生意。他在英国读书时——1960年毕业于利物浦大学，获船舶工程学士学位——母亲捎信来，要他回香港帮父亲。"},{"id":"ch05-034","p":118,"t":"p","en":"Hong Kong to support his father. But when his father came to see him in England and asked him what he wanted to do, C.H. did not propose to return. \"I told my father, I think you are still at a stage where you do not need my help. I'd like to stay in England and learn more about business.\" His father had other ideas, but to C.H.'s pleasant surprise they did not involve a return to Hong Kong.\"He told me, Go to America. That is the country of the future. If you go there, you will never regret taking my advice.' And I never did.\" C. H. Tung spent ten years in America, several of them working with General Electric. His father visited him so frequently—sometimes up to ten times a year—that he ended up taking his own apartment, on New York's Fifth Avenue.","zh":"可父亲来英国看他、问他想做什么时，董建华并没有提出要回去。“我告诉父亲，我觉得你现在这个阶段还不需要我帮忙。我想留在英国，多学点商业上的事。”父亲另有打算，但让董建华惊喜的是，那些打算与回香港无关。“他对我说：‘去美国。那是未来的国家。你去了，就永远不会后悔听我的。’我确实从未后悔。”董建华在美国待了十年，其中几年在通用电气工作。父亲来看他来得极勤——有时一年多达十次——最后干脆在纽约第五大道置了一处自己的公寓。"},{"id":"ch05-035","p":118,"t":"p","en":"But duty did eventually call. In 1969, C.H. returned to Hong Kong to learn the business from the inside, and gradually take over management. When his father died in 1981, the company passed into C.H's hands. He recalls the period gravely: “It was not an easy time for me.\" Not only had he been called home from the America he had grown to love, he found the company heavily indebted, and underwater financially.\"We had some financial difficulties. And it was at a time when interests rates were at thirteen or fourteen percent; and we had a lot of debt. I had to find a way out.\"","zh":"但责任终究还是来了。1969年，董建华回香港，从内部学做业务，逐步接手管理。1981年父亲去世，公司交到他手上。他沉重地回忆那段日子：“那对我来说不是轻松的时期。”他不仅被从自己渐渐爱上的美国叫了回来，还发现公司负债累累，财务上已经沉到了水下。“我们有些财务困难。那时利率是13%、14%，而我们债务很重。我必须找到出路。”"},{"id":"ch05-036","p":118,"t":"p","en":"That way out involved support from China. A local tycoon, Henry Fok, helped arrange \\$120 million to save the company. Fifty million dollars reportedly came from the mainland-controlled Bank of China, and a significant amount also came from China Merchants, part of China's transport ministry.18 It was the start of a relationship with mainland China, just at the start of its new opening to the Western world; a relationship that would shape much of the rest of the story of OOCL.","zh":"这条出路，靠的是来自中国大陆的支援。香港大亨霍英东（Henry Fok）出面张罗，筹措到1.2亿美元，把公司救了回来。据说其中5,000万美元出自受大陆控制的中国银行，还有相当一部分来自中国交通部下属的招商局。18 这便是董家与中国大陆一段关系的开端——而当时，大陆才刚刚开始向西方世界打开大门；这段关系日后将在很大程度上塑造东方海外的命运。"},{"id":"ch05-037","p":118,"t":"p","en":"C.H. ran the company for fourteen years, and in that period he returned it to profitability. The key was not new trade routes or new ship designs or new partners: it was technology. \"Business is business. And the best that you can do, the only thing you can do, is to know what role you play in the transportation chain and why you and only you are important. What can you do for your customers that nobody else can do that make them willing to pay? For years our margin was higher, but they would pay. Why? Because we were the first to be able to extensively use innovation and technology to make the difference.\"","zh":"董建华执掌公司十四年，其间把公司重新带回盈利。关键不在新航线，不在新船型，也不在新伙伴，而在技术。“生意就是生意。你能做的最好的事、唯一能做的事，就是弄清楚自己在运输链条上扮演什么角色，弄清楚为什么重要的人是你、而且只有你。你能为客户做什么别人做不到、因而他们甘愿掏钱的事？那些年，我们的报价一直比别人高，可客户还是愿意付。为什么？因为我们是第一家能够大规模运用创新和技术、由此做出差别的公司。”"},{"id":"ch05-038","p":118,"t":"p","en":"Specifically, under C. H. Tung, the company became a pioneer in the marriage between containerization and computerization. Until very recently, the global shipping industry was resistant to computerization—to this day, many ports and many shipping companies do their business by faxed copies of paper forms. C.H. foresaw that using computers to track shipments would enable greater efficiency in getting customers' goods from origin to destination.","zh":"具体来说，在董建华手上，这家公司成了集装箱化与计算机化联姻的先驱。直到不久以前，全球航运业对计算机化仍相当抵触——时至今日，许多港口、许多航运公司还在靠传真纸质单据做生意。董建华预见到，用计算机追踪货运，能大大提高把客户货物从起点送到终点的效率。"},{"id":"ch05-039","p":119,"t":"p","en":"By 1983, the company was the sixth-largest shipping firm in the world.19 It played a key role in Hong Kong's own growth—which was itself remarkable. In 1974, Hong Kong broke the international record by handling more than 3,500 TEUs in a single day. That year, Hong Kong container terminals handled a total of 726,000 TEUs; by 1989, that number grew to 4.5 million—an increase of more than 500 percent.2º In 1987, Hong Kong passed Rotterdam and New York City as the largest container port in the world. The related industries of finance and commercial law also grew, and Hong Kong became the critical anchor of Western globalization in Asia.","zh":"到1983年，东方海外已是世界第六大航运公司。19 它在香港自身的成长中起了关键作用——而香港的成长本身堪称奇迹。1974年，香港单日处理集装箱超过3,500个标准箱，刷新了世界纪录。那一年，香港各集装箱码头共处理72.6万个标准箱；到1989年，这个数字增至450万，增幅超过500%。20 1987年，香港超过鹿特丹和纽约，成为世界最大的集装箱港。金融、商法等相关行业也随之壮大，香港成了西方全球化在亚洲的关键锚地。"},{"id":"ch05-040","p":119,"t":"p","en":"And then, a decade later, a very dramatic change occurred: in 1997, Britain's 150-year rule of Hong Kong came to an end. Hong Kong reverted to Chinese sovereignty.","zh":"又过了十年，一件极具戏剧性的大事发生了：1997年，英国对香港150年的管治走到尽头，香港回归中国。"},{"id":"ch05-041","p":119,"t":"p","en":"When Hong Kong reverted to Chinese control, it brought into the heart of China an economic powerhouse. China had begun its exploration of overseas markets and would, one year later, enter the World Trade Organization; having Hong Kong was a massive economic shot in the arm.","zh":"香港回归中国，等于把一台经济发动机送进了中国的心脏。此时中国已经开始了对海外市场的探索，一年之后还将加入世界贸易组织；有了香港，无异于一剂猛烈的经济强心针。"},{"id":"ch05-042","p":119,"t":"p","en":"It's easy to miss the significance of this. China was trying to forge an international economic strategy with a leadership drawn exclusively from the ranks of the Chinese Communist Party, almost none of whom had lived or worked abroad. They had no experience of foreign trade, and no trading infrastructure. And then, suddenly, the world's largest trading port—with all the infrastructure, relationships, financiers, and international lawyers that go along with it—fell into their lap. Moreover, Hong Kong's return to China was the final belated nail in the coffin of Britain's overseas empire. It is one of history's great ironies that this small cluster of islands, so central to the manner in which the British Empire extracted the riches of China, was about to reverse roles.","zh":"这件事的意义很容易被忽略。当时中国正试图锻造一套国际经济战略，而其领导层全部出自中国共产党内部，几乎没有人有过在国外生活或工作的经历。他们没有对外贸易的经验，也没有贸易所需的基础设施。然后突然间，世界最大的贸易港口——连同它全套的基础设施、人脉关系、金融家和国际律师——就这么落到了他们手上。此外，香港回归中国，也是英国海外帝国棺材上迟来的最后一颗钉子。历史的一大讽刺在于：这一小群岛屿，曾是英帝国榨取中国财富的关键支点，如今角色即将颠倒过来。"},{"id":"ch05-043","p":120,"t":"h","en":"China Opening","zh":"中国打开大门"},{"id":"ch05-044","p":120,"t":"p","en":"Earlier in this book we encountered the notion that a lacuna had opened up in world affairs when British imperial conquest had resulted, nearly simultaneously, in both the Indian and the Chinese empires all but disappearing from the world stage. Each of them had, at the time, accounted for roughly a quarter of the world's economic activity. That number fell to roughly 3 percent of world GDP each.²¹ Into that lacuna flowed European trade and imperial power, and wealth. Europe (and the New World) profited for nearly a century and a half, dominating both world politics and the global economy out of all proportion to population size or intrinsic resources. That a country like Denmark, puny by global standards, could have become a significant trading empire is indicative of the disproportionate role Europe played. But with the advent of containerization, and geopolitical changes, the lacuna was about to start to close.","zh":"本书前文提到过一个概念：英帝国的征服几乎同时让印度帝国与中国帝国从世界舞台上消失，世界事务中由此出现了一片真空。当年这两国各自约占世界经济活动的四分之一，份额后来各跌至世界GDP的3%左右。21 欧洲的贸易、帝国的强权与财富，涌进了这片真空。欧洲（以及新大陆）因此受用了近一百五十年，在世界政治与全球经济中的支配地位，远远超出其人口规模或资源禀赋所能支撑的分量。像丹麦这样一个按世界标准看微不足道的国家，竟也能成为重要的贸易帝国，正说明欧洲所扮演的角色何等不成比例。然而随着集装箱化的到来，随着地缘政治的变迁，这片真空即将开始收拢。"},{"id":"ch05-045","p":120,"t":"p","en":"These changes would be manifest in the late 1990s and early 2000s. But they date back to the fall of 1967—when a former vice president and presidential hopeful, Richard Nixon, penned an article about the future of US relations with China, one that would shape the diplomacy of his presidency and ultimately the later part of the twentieth century. Nixon's thinking appeared in the October 1967 issue of the influential journal Foreign Affairs; he argued that the United States needed to shift its engagement in Asia and bring China back into the international fold. His logic was simple: he believed the United States needed China on its side to help balance the Soviet Union. But he argued in more elegiac terms: \"There is no place on this small planet for a billion of its potentially most able people to live in angry isolation.\"22","zh":"这些变化要到20世纪90年代末、21世纪初才充分显现，但源头可以上溯到1967年秋天——当时，前副总统、有意问鼎白宫的理查德·尼克松写了一篇文章，谈美中关系的未来。这篇文章影响了他任内的外交，也最终影响了20世纪后半叶的历史走向。尼克松的想法发表在1967年10月号那本颇具影响力的《外交事务》杂志上。他主张，美国需要调整在亚洲的介入方式，把中国重新拉回国际大家庭。他的逻辑很简单：他相信美国需要中国站在自己一边，以制衡苏联。但他的表述更带几分挽歌意味：“在这个小小的星球上，容不下10亿最有才干的人民生活在愤怒的孤立之中。”22"},{"id":"ch05-046","p":120,"t":"p","en":"Thirteen months later he would be elected to the presidency. In February 1969, barely one month into office, Nixon wrote a memo to his national security advisor, Henry Kissinger (later secretary of state), directing him to look into possibilities of engaging with the Chinese through private channels.23 On June 26 of that year, National Security Decision Memorandum 17 ordered the modification of some trade controls against China that had been put in place in the context of the Korean War from 1950 to 1953; it also removed regulatory restraints on foreign subsidiaries of US firms undertaking transactions with the Chinese.24","zh":"十三个月后，他当选总统。1969年2月，上任不过一个月，尼克松就给国家安全事务助理亨利·基辛格（后任国务卿）写了一份备忘录，要他研究通过私下渠道与中国接触的可能。23 同年6月26日，《国家安全决定备忘录第17号》下令调整部分对华贸易管制——那些管制是1950年至1953年朝鲜战争期间设下的；备忘录同时解除了对美国公司海外子公司与中国做生意的监管限制。24"},{"id":"ch05-047","p":121,"t":"p","en":"Then, quiet diplomacy got underway. On December 3, the American ambassador to Poland, Walter Stoessel, passed a message to the Chinese embassy in Warsaw that Nixon was willing to have substantive talks with the Chinese. Over the course of the next two years the Americans would communicate to the Chinese through various Eastern European embassies that they were willing to meet directly to discuss a warming in US-China relations.2⁵ A Pakistani channel opened up in April 1971 when the Pakistani ambassador to Washington, DC, Agha Hilaly, delivered a note from Zhou Enlai, the first premier of the People's Republic of China, inviting a special envoy to a meeting in Peking.26","zh":"接着，静悄悄的外交开始了。12月3日，美国驻波兰大使沃尔特·斯托塞尔（Walter Stoessel）向中国驻华沙大使馆传话：尼克松愿意与中国方面举行实质性会谈。此后两年间，美方通过多个东欧国家使馆向中方转达：他们愿意直接会面，讨论美中关系缓和之事。25 1971年4月，一条巴基斯坦渠道开通——巴基斯坦驻华盛顿大使阿迦·希拉利（Agha Hilaly）转交了中华人民共和国第一任总理周恩来的来函，邀请美方派特使赴北京会晤。26"},{"id":"ch05-048","p":121,"t":"p","en":"Kissinger began to prepare for the trip. Such were the sensitivities at the time that the trip was conducted in secret. Kissinger flew to Vietnam in July 1971 for consultations with leadership of the American war effort there, and then flew on to Pakistan. In Islamabad, he feigned a stomachache and then flew secretly to Peking, where he met with Zhou.* The meeting was a success: On July 11, 1971, Kissinger sent a cable to Nixon from the US embassy in Pakistan that contained a simple word: \"Eureka.\" Four days later, on July 15, Nixon announced on national TV that he would visit China.27","zh":"基辛格开始为这趟行程做准备。当时事情敏感到了这种程度：整趟访问是秘密进行的。1971年7月，基辛格飞往越南，与当地美军战事的负责人磋商，随后转飞巴基斯坦。在伊斯兰堡，他装肚子疼，然后秘密飞往北京，在那里会见了周恩来。* 会见很成功：1971年7月11日，基辛格从美国驻巴基斯坦大使馆给尼克松发去一封电报，电报上只有一个词——“尤里卡”。四天后，即7月15日，尼克松通过全国电视宣布，他将访问中国。27"},{"id":"ch05-049","p":121,"t":"p","en":"The historic visit took place February 21 to 28 of 1972. Nixon visited both Premier Zhou Enlai and Chairman Mao Zedong, and together they negotiated a communiqué that laid out a “roadmap\"—a diplomatic term that simply means a rough sketch of potential agreements—to peaceful relations between the two countries.28","zh":"这次历史性的访问发生在1972年2月21日至28日。尼克松先后会见了周恩来总理和毛泽东主席，双方共同磋商出一份公报，为两国关系的和平发展勾画了一张“路线图”——这是外交术语，意思不过是潜在共识的粗略草图。28"},{"id":"ch05-050","p":121,"t":"p","en":"Nixon's resignation in 1974 might have slowed the warming between the two countries; but when Gerald Ford took office, he immediately sent a letter to Chairman Mao pledging to continue the opening policy. Negotiations continued apace. Elections in 1976 brought to power the Democratic Party and President Jimmy Carter; but he, too, continued the policy. It was Carter who in January 1979 gave China full diplomatic recognition, formalized in February 1979 with a symbolic visit by Vice Premier Deng Xiaoping to the United States. It had taken a decade.29","zh":"1974年尼克松辞职，两国关系的回暖本可能因此放慢；但杰拉尔德·福特接任总统后，立即致信毛泽东主席，承诺延续开放政策，谈判照旧推进。1976年大选让民主党上台，吉米·卡特就任总统，他也延续了这一政策。正是卡特在1979年1月给予中国完全的外交承认，1979年2月又由邓小平副总理访美作了象征性的确认。前后用了十年。29"},{"id":"ch05-051","p":121,"t":"n","en":"The Pakistanis employed a body double of Kissinger to further throw any observers off the scent—who got an actual stomachache when he ate six mangoes in quick succession. As a result, the Pakistanis had to find a doctor who had never heard of Kissinger so their ruse could continue. Chris Tudda, A Cold War Turning Point (Baton Rouge: Louisiana State University Press, 2012), 81.","zh":"为进一步迷惑外界观察者，巴方还安排了一名基辛格的替身——此人连吃六个芒果，真的闹起了肚子。结果巴方只好另找一位从未听说过基辛格的医生，好让这场障眼法继续下去。克里斯·图达（Chris Tudda），《冷战的转折点》（A Cold War Turning Point），巴吞鲁日：路易斯安那州立大学出版社，2012年，第81页。"},{"id":"ch05-052","p":122,"t":"p","en":"The warming of US-China ties continued through the last decade of the Cold War, although President Ronald Reagan sought to roll back some concessions Carter had made to the Chinese on US relations with Taiwan. Still, diplomatic recognition stood and the warming of relations continued. In 1989, they were temporarily set back when the Chinese People's Liberation Army was sent into Beijing's Tiananmen Square to forcibly disperse tens of thousands of student protesters assembled there to call for democratic reforms, killing thousands of civilians. The United States suspended arms sales and official visits to China. However, through private channels, President George H. W. Bush communicated that the events would not derail broader US-China relations.30 But then another event occurred that cast the entire issue in a different light: the Berlin Wall fell.","zh":"美中关系的回暖贯穿冷战的最后十年，尽管里根总统试图收回卡特在美台关系上对中国作出的一些让步。但外交承认依然维持，关系继续回暖。1989年，两国关系一度受挫：中国人民解放军奉命进入北京天安门广场，强行驱散聚集在那里、要求民主改革的学生抗议者，造成数千平民死亡。美国暂停了对华军售和官方访问。但老布什总统通过私下渠道传话：这一事件不会使美中关系的大局脱轨。30 然而随后又发生了一件事，让整个问题的性质为之一变：柏林墙倒了。"},{"id":"ch05-053","p":122,"t":"p","en":"As the wall fell, so, too, did the Soviet Union—and with it, the underlying reason for the US rapprochement to Beijing, which had been initially inspired by a desire to rebalance global political affairs against Moscow. But by then, the diplomatic process of opening up to China had been underway for two decades. And during the course of it, both China and the US had found another reason for closer ties: trade.","zh":"墙倒之际，苏联也随之垮掉——美国接近北京的根本理由也随之而去，那个理由起初是想要重新平衡全球政治格局、以抗衡莫斯科。但到那时，对华开放的外交进程已经走了二十年。而在这个过程中，美中双方都找到了另一个让彼此靠得更近的理由：贸易。"},{"id":"ch05-054","p":122,"t":"p","en":"As the Cold War began to wind down, with the start of the opening up of the Soviet Union under Mikhail Gorbachev, decision makers in China began to worry that by staying out of the Western-led global trade and finance systems—which they had done ever since taking power in 1947—they were losing out on substantial opportunities for economic growth. In the years since Nixon penned his article, Western economies had grown steadily. In 1980, China's GDP stood at \\$191 billion; that compared badly to the GDP of the United States, at \\$2.86 trillion, despite a Chinese population nearly four times that of the US.31 Put differently: the average Chinese citizen had an annual income of less than one-fortieth of that of the average American.32","zh":"随着冷战走向尾声——戈尔巴乔夫治下的苏联开始开放——中国的决策者开始担心：由于长期置身于西方主导的全球贸易与金融体系之外（自1947年取得政权以来一直如此），中国正错失大量经济增长的机会。尼克松写下那篇文章之后的这些年里，西方经济稳步增长。1980年，中国的GDP为1,910亿美元，美国为2.86万亿美元，两相比较，中国相形见绌——尽管中国人口接近美国的四倍。31 换个说法：中国普通公民的年收入，不到美国普通人的四十分之一。32"},{"id":"ch05-055","p":122,"t":"p","en":"And so the Chinese leadership did something unorthodox: it changed course. Fatefully, in 1986, China formally submitted an application to join the main trading body of the time, the General Agreement on Tariffs and Trade (which would be replaced in 1995 by the World Trade Organization).33 They were not alone: over the coming years, the Soviet Union also applied to join under reformer President Gorbachev, though its application would take far longer to advance.34 Eventually dozens of other countries of the “developing world\" that had stayed outside of both the Western and Soviet blocs during the Cold War joined them. But it was China's bid that would prove the most significant.","zh":"于是，中国领导层做了一件不合常规的事：改弦更张。1986年，中国正式申请加入当时的主要贸易机构关税与贸易总协定（1995年，该协定为世界贸易组织所取代）。33 这一步决定了后来的命运。中国并不孤单：此后几年，改革派总统戈尔巴乔夫治下的苏联也提出了申请，只是它的申请推进得慢得多。34 最终，还有数十个在冷战期间既不属于西方阵营、也不属于苏联阵营的“发展中世界”国家相继加入。但其中最具分量的，是中国的申请。"},{"id":"ch05-056","p":123,"t":"p","en":"Life comes full circle. By the time China entered the WTO, Hong Kong had reverted to Chinese sovereignty. And the first governor of non-British Hong Kong was none other than C. H. Tung. Their fortunes— in both senses of that word—would continue to grow together, but now their fates were intertwined with that of China, and its reentry into the world. OOCL grew, Hong Kong grew, world trade grew, and China grew. In 2003, Tung's Orient Overseas Container Line took possession of the OOCL Shenzhen, with a capacity of 8,063 TEU. A Chinese-owned ship was now the largest container ship in the world.35","zh":"世事兜了一个圆满的圈。中国加入世贸组织时，香港已经回归中国。而不再是英国治下的香港，第一任行政长官不是别人，正是董建华。他们两家的“运”——财富与命运这两层意思都算——还将继续一同生长，但此时他们的命运已与中国、与中国重返世界的进程交织在一起。东方海外在长，香港在长，世界贸易在长，中国也在长。2003年，董建华的东方海外集装箱航运公司接收了「东方海外深圳」号，运力8,063个标准箱。世界最大的集装箱船，这时属于一家中国公司。35"}],"notes":[]},{"id":"ch06","label":"Chapter 6","labelZh":"","title":"The Great Closing","titleZh":"第六章　大关门","part":"Part II: To Contain the World, 1956-2017","showPart":false,"partZh":"第二部","partTitleZh":"围堵世界（1956—2017）","paras":[{"id":"ch06-001","p":124,"t":"p","en":"The Yangtze River, Asia's longest, is the historic lifeline of Chinese civilization, and the city that dominates its mouth, Shanghai, has long been that nation's economic heart. But for almost forty years, from 1947 to 1984, China kept Shanghai closed off from global commerce. It was as if the United States had, in the 1950s, decided to shut down the New York Stock Exchange and seal off the Port of New York.","zh":"长江是亚洲最长的河流，也是中华文明自古以来的生命线；扼守江口的上海，长期以来是这个国家的经济心脏。然而从1947年到1984年，将近四十年间，中国让上海与全球贸易隔绝。这就好比美国在20世纪50年代决定关掉纽约证券交易所、封锁纽约港。"},{"id":"ch06-002","p":124,"t":"p","en":"But when China decided to change course, a decade before they reabsorbed Hong Kong, Shanghai would once again become the actual center and the symbol of China's opening to the West and to globalization.¹ In 1984, the Chinese government opened Shanghai to foreign investment. China's leader at the time, Deng Xiaoping, anointed Shanghai as the “head of the dragon\"—the cutting edge of China's liberalization.²","zh":"但当中国决定改弦更张时——那是在收回香港的十年前——上海将再度成为中国向西方、向全球化开放的实际中心与象征。1 1984年，中国政府向外资开放上海。时任中国领导人邓小平把上海点名为“龙头”——中国自由化的锋刃。2"},{"id":"ch06-003","p":124,"t":"p","en":"The transformation that followed is best symbolized by the change to Shanghai's Pudong district—in the early 1980s, it was still parkland and farmland opposite the Bund, a place where middle-class families would come by ferry to picnic and escape the heat and bustle of central Shanghai. The decision to open Shanghai would transform its bucolic nature.","zh":"此后发生的变化，最集中地体现在上海浦东的改观上——上世纪80年代初，与外滩隔江相望的浦东还是一片公园与农田，中产家庭会乘轮渡过来野餐，躲开上海市中心的暑热与喧嚣。开放上海的决定，将彻底改变这里田园牧歌般的面貌。"},{"id":"ch06-004","p":124,"t":"p","en":"To mark the start of China's opening, the authorities launched the building of its first modern skyscraper. The Oriental Pearl Tower, with its 1,535-foot-high TV tower spiking up from two purple domes covered in neon lights and spiking mastheads, was the first major building","zh":"为标志中国开放的起点，当局启动了第一座现代摩天大楼的建设。东方明珠塔的电视塔身高1,535英尺（约468米），从两个裹满霓虹灯的紫色球体与尖耸的桅杆之间拔地而起，是第一座矗立于"},{"id":"ch06-005","p":125,"t":"p","en":"in Pudong. But it was quickly flanked by two other skyscrapers built at around the same time, and then by a growing number of hotels and office towers.3 The skyline became internationally known in 2005 as the producers of the Mission Impossible series took the unusual step (for the time) of filming in China, shooting the third episode of the franchise in Shanghai, showcasing its new commercial grandeur and the impressive high-rises that then dominated its skyline.4 Today it's hard to make out those buildings, so fully dominated are they by the now far taller buildings of the rest of the Pudong skyline. Much as the United States at the height of its global economic clout strutted its stuff by building competing skyscrapers in New York and Chicago, so, too, has China used Shanghai's skyline to demonstrate its financial engineering, and architectural prowess, and to symbolize its growing power on the world stage.⁵","zh":"浦东的大型建筑。但很快，它的两侧就立起了大约同期建成的另外两座摩天楼，随后酒店与写字楼越聚越多。3 2005年，《碟中谍》系列的制片人做了一件在当时颇为不寻常的事——到中国取景，把该系列第三部放在上海拍摄，让这座城市崭新的商业气派和当时构成天际线的那些高楼一同亮相，这条天际线从此为世界所知。4 今天已经很难辨认出那几座楼了，因为浦东天际线上其余那些高得多的建筑把它们彻底压了下去。正如美国在全球经济影响力鼎盛之时，靠纽约和芝加哥竞相耸立的摩天楼炫耀实力，中国也用上海的天际线展示自己的金融工程与建筑造诣，并以此象征它在世界舞台上不断增长的力量。5"},{"id":"ch06-006","p":125,"t":"p","en":"That skyline is now dominated by a trio of remarkable buildings that abut one another in a single city block in Pudong. In 1994, Shanghai began construction of the eighty-eight stories of the Jin Mao Tower. The building is a masterpiece of modern architecture, a fusion of modernism and Orientalism that pulls the eye upward constantly as it moves between its sixteen cantilevered sections and its aluminum shell. The entire building is wrapped in filigree, like someone took the Chrysler Building and wrapped it in dragon scale. A spiking tower at its top completes the effect. When finished, it was the fifth-tallest building in the world and the tallest in Asia, a symbol of China's growing economic clout.6 Then came the World Financial Center, opened to the public in 2008. It briefly took the title of world's tallest building.' Most dramatic of all is the Shanghai Tower immediately to the north. Built between 2008 and 2014, the tower is now the second-tallest building in the world. Among other engineering advances, it houses the world's second-fastest elevator—which shoots from the ground floor to an observation deck on the 108th floor in only twenty-seven seconds. Along the building's immense height it twists gently as it rises, creating both an elegant design and greater functionality, a device designed to counter typhoon winds. It houses new museums, and art galleries dedicated to the young innovators of Shanghai's burgeoning art scene. In the dynamic architecture and vibrant cultural life of Pudong and central Shanghai is everything to celebrate about China's rise.9","zh":"如今这条天际线由三座非凡的建筑主导，它们紧紧相邻，同在浦东的一个街区之内。1994年，上海动工兴建88层的金茂大厦。这座楼是现代建筑的杰作，融现代主义与东方情调于一体，在16个悬挑分段与铝制外壳之间层层收分，不断把视线向上牵引。整座建筑裹着一层细密的镂空纹饰，仿佛有人把克莱斯勒大厦包上了一层龙鳞。楼顶的尖塔收束了这一效果。建成时，它是世界第五高楼、亚洲第一高楼，象征中国日益增强的经济实力。6 接着是2008年对公众开放的上海环球金融中心。它曾短暂摘得“世界第一高楼”的名号。7 最引人注目的是紧邻其北的上海中心大厦。它建于2008年至2014年间，如今是世界第二高楼。在诸多工程创新之外，楼里还装有世界第二快的电梯——从底层到108层观光厅只要27秒。沿着巨大的楼体上升，它缓缓扭转，既成就了优雅的造型，也带来更强的功能——这是为抵御台风而设计的构造。楼内设有新的博物馆，还有专为上海日渐蓬勃的艺术圈中年轻创新者而设的画廊。浦东与上海市中心充满动感的建筑、活跃的文化生活，凝聚着中国崛起中一切值得称道之处。9"},{"id":"ch06-008","p":126,"t":"p","en":"From the observation deck of the Shanghai Tower, you look out over Shanghai's multiple sets of skylines, to a view of the old French Concession, the Bund, and the Huangpu River, a tributary of the Yangtze. You watch a constant flow of barges carrying coal and containers atop as they flow through central Shanghai. But you see few ships docked now at Shanghai wharf, except the occasional river cruise ship. For with the advent of very large commercial container ships, with huge hulls, the most important trading ships could no longer sail up the Huangpu to the piers of Shanghai. The city risked being left behind in the global scale race among container ports, just as China most needed trade access and the growth opportunity it provided.","zh":"从上海中心大厦的观光厅望出去，上海层层叠叠的几组天际线尽收眼底：旧时的法租界、外滩、长江支流黄浦江。你能看到满载煤炭、上面又摞着集装箱的驳船川流不息地穿过上海市中心；但如今靠泊在上海码头的船已经很少，偶尔才有一艘内河游轮。因为随着船体巨大的超大型商用集装箱船问世，最重要的贸易船舶再也无法沿黄浦江上溯到上海的码头。在这场集装箱港口的全球规模竞赛中，这座城市面临被甩在后面的危险——而恰恰此时，中国最需要贸易通道，以及贸易带来的增长机会。"},{"id":"ch06-009","p":126,"t":"p","en":"So in 2005, the modern Chinese Communist Party did what it does best: it engineered around the problem. Specifically, it created a new, deepwater port seventeen miles off the coast of Shanghai, built on reclaimed land assimilating two small islands, known collectively as Yangshan. And it's in the new port of Yangshan that we can really visualize the true scale of China's economic return.¹º","zh":"于是2005年，当代中国共产党做了它最拿手的事：绕开问题，另做安排。具体说来，它在距上海海岸17英里（约27公里）处造了一座新的深水港，港区填海而成，把两座小岛连成一体，合称洋山。也正是在洋山新港，我们才真正看得清中国经济回归的分量。10"},{"id":"ch06-010","p":126,"t":"p","en":"The rise of China and its involvement in the WTO is an interwoven story. In 2018, a Wall Street Journal essay described China's accession to the WTO as \"when the world opened the gates of China.\"11 It helped create the giant economy that China today represents. The basic numbers tell the story. In 1999, twenty years after opening up diplomatically, China's GDP had grown to an estimated \\$1 trillion. A decade later, it had grown to \\$5 trillion.12","zh":"中国的崛起与它加入世贸组织的历程，是彼此交织的两条线索。2018年，《华尔街日报》一篇文章把中国加入世贸组织说成“世界向中国敞开大门”的时刻。11 正是这一进程造就了今天中国所代表的庞大经济体。基本数字足以说明问题。1999年，即外交上开放二十年之后，中国国内生产总值估计已增至1万亿美元。十年后，增至5万亿美元。12"},{"id":"ch06-011","p":126,"t":"p","en":"But one of China's major weaknesses is that the size of its population hugely outstrips the scale of natural resources available inside its borders. If it was going to continue to grow, it was going to have to get natural resources from outside its borders, as well as conduct trade in industrial goods. So China began to explore how to acquire resources overseas.","zh":"但中国的一大弱点是，人口规模远远超出境内可支配自然资源的规模。若要继续增长，它就必须从境外获取自然资源，同时还得做工业品贸易。于是中国开始探索如何在海外取得资源。"},{"id":"ch06-012","p":126,"t":"p","en":"Now, nearly two-thirds of China's huge population lives along its eastern edges, with 96 percent living to the east of the so-called Hu Line that demarcates China's densely populated east and its sparsely populated west.¹3 Of course, China has land routes into Europe's huge markets, but those routes are thousands of miles long. The trans-Siberian highway and railroad does the difficult part of connecting Beijing to","zh":"如今，中国庞大的人口中近三分之二生活在东部沿海一带，96%住在所谓“胡焕庸线”以东——这条线划出中国人口稠密的东部与人口稀疏的西部。13 当然，中国有通往欧洲庞大市场的陆路，但这些路线长达数千英里。横贯西伯利亚的公路与铁路，承担了连接北京与"},{"id":"ch06-013","p":127,"t":"p","en":"Moscow, but even then, having traversed a distance of 4,735 miles, it covers only two-thirds of the journey from Beijing to London.¹⁴ Even with Chinese investment in transportation and trade infrastructure to its west, the easiest and fastest way for China to connect to global markets was to deviate from its long history of inland consolidation. China was, for the first time since the 1400s, about to venture out to sea.","zh":"莫斯科这段路程中最艰难的部分；但即便如此，走完4,735英里，也只相当于北京到伦敦全程的三分之二。14 纵然中国在其西部投资交通与贸易基础设施，中国连接全球市场最省事、最快捷的途径，仍是背离长期经营内陆的历史惯性。自15世纪以来，中国第一次准备向海洋进发。"},{"id":"ch06-014","p":127,"t":"p","en":"As China began to look for huge volumes of natural resources overseas, it encountered the basic question that had constrained the British and the French in the early days of their overseas adventures: the simple cost of bringing goods back home. In China's case: to make trade with the rest of the world economical, given the distances involved for reaching Europe or the United States, required the ability to move things in very large volumes.","zh":"当中国开始到海外寻找大宗自然资源时，它撞上了当年英国人和法国人在海外扩张初期同样受制于的根本问题：把货运回本国要付的代价。就中国而言：以通往欧洲或美国的距离论，要让与世界其他地方的贸易在经济上划得来，就必须具备超大规模运送货物的能力。"},{"id":"ch06-015","p":127,"t":"p","en":"The still relatively new container ship technology was the perfect solution at the perfect time. Bulk shipping and containerized trade was key: it allowed for large, economical volumes of natural resources to flow into China's domestic markets, and for equally large volumes of inexpensive manufactured goods to flow out of China to developed markets in the West.","zh":"当时还算新技术的集装箱船，恰在其时，成了完美的解决方案。散货运输与集装箱化贸易是关键：它让大批量、低成本的自然资源流入中国市场，也让同样大批量的廉价制成品从中国流向西方发达市场。"},{"id":"ch06-016","p":127,"t":"p","en":"What followed was exponential growth of two types—of the scale of container shipping and of the quantity of goods these ships sailed in and out of China's ports. The pace of growth in the size of the ships almost perfectly tracks China's stunning growth between the mid-1990s and the present day. China's growth could not have been accomplished without the advent of containerized trade.15","zh":"随之而来的是两种指数级增长——集装箱航运规模的扩张，以及这些船舶进出中国港口所运货物数量的激增。船型增大的速度，几乎完美对应了上世纪90年代中期至今中国令人惊叹的增长曲线。没有集装箱化贸易的问世，中国的增长无从实现。15"},{"id":"ch06-017","p":127,"t":"h","en":"The New Port of Shanghai","zh":"上海的新港区"},{"id":"ch06-018","p":127,"t":"p","en":"Driving from central Shanghai to the new port is an escapade through the drab realities of modern industrial and suburban planning. Like most exciting metropolises, Shanghai is surrounded by miles of suburban and light-industrial blight, admittedly vastly preferable for its inhabitants to the crumbling infrastructure of the late communist era, but hardly an uplifting urban landscape. Twenty miles south along Highway 52, the industrial architecture gives way to farmlands that supply Shanghai's 24 million souls—farmlands spliced through with high-voltage wires and even nuclear plants that abut the highway, their double cooling towers appearing almost within reach from the roadside rest stops.","zh":"从上海市中心驱车去新港，是一场穿越现代工业与郊区规划之灰暗现实的历险。和多数令人兴奋的大都市一样，上海四周围着绵延数英里的郊区与轻工业破败地带；平心而论，这对居民来说远胜过共产主义时代晚期那套日益破败的基础设施，可实在算不上赏心悦目的城市景观。沿52号公路南行20英里，工业建筑让位于供养上海2,400万人口的农田——高压电线穿插其间，紧贴公路甚至还有核电站，从路边休息站望去，那两座冷却塔几乎近在咫尺。"},{"id":"ch06-019","p":128,"t":"p","en":"From the end of the highway, to access the modern port, you first have to cross the Donghai Bridge. It's hard to write about China without constantly reaching for trite superlatives. At the time that it was built, the Donghai Bridge was the largest sea-crossing bridge in the entire world—until an even larger one was built north of Shanghai to connect Shanghai's markets to the trade routes to the north. (Today, another Chinese bridge, between Hong Kong, Macau, and Zhuhai, is the longest sea-crossing bridge in the world.16) The Donghai Bridge is yet another engineering marvel, given both its scale and its location in the East China Sea, where it is exposed to frequent typhoons. On a clear day you can see most of its twenty miles snake its way across the opening between Shanghai and the islands of the new port. It curves and twists like a dragon's tail, an engineering solution designed to defeat typhoons, and a seeming visual continuation of the shapes of the Pudong towers.¹7 From conception to completion, the bridge took a mere four years.","zh":"到了公路尽头，要进这座现代港口，先得跨过东海大桥。写中国，很难不一再搬出那些用滥了的最高级形容词。东海大桥建成时是全世界最长的跨海大桥——直到上海以北又建起一座更大的桥，把上海的市场与北方的贸易航线连起来。（今天，连接中国香港、澳门与珠海的另一座中国大桥才是世界最长的跨海大桥。16）无论从规模看，还是从它身处频繁遭台风袭击的东海这一点看，东海大桥都是又一个工程奇迹。晴天时，你能看到20英里的桥身大半蜿蜒横跨在上海与新港诸岛之间的水面上。它弯转扭动，形如龙尾，既是为战胜台风而采取的工程方案，也像是浦东那组塔楼造型在视觉上的延续。17 从构思到建成，大桥只用了四年。"},{"id":"ch06-020","p":128,"t":"p","en":"Notwithstanding its architectural sophistication, driving the Donghai Bridge is a long way from the romance of the Shanghai Bund. The endlessly unfolding gray concrete of the bridge winds above the surrounding gray of the East China Sea. A large wind farm provides some visual interest, though only in direct sunlight can you tell that the giant spinning fans are white, not gray as well. The gray steel hulls of a couple of naval cruisers keeping an eye on the port occasionally appear before dipping back below the horizon. The immense scale and the endless drab contribute to a suffocating sense of industrial heft.","zh":"尽管工程精巧，行驶在东海大桥上，离外滩的浪漫情调却相去甚远。无尽展开的灰色混凝土桥面，在四周灰蒙蒙的东海之上蜿蜒。一座大型风电场带来些许视觉趣味，只是只有在直射阳光下，你才分辨得出那些飞旋的巨型叶片是白色的，而非同样灰暗。两艘监视港口的巡洋舰灰色的钢制舰体偶尔露出海面，随即又沉回地平线以下。巨大的尺度与无尽的单调，共同造成一种令人窒息的工业沉重感。"},{"id":"ch06-021","p":128,"t":"p","en":"Twenty minutes later, one exits the bridge and the view scape is briefly broken by the green hills of the island and the small collection of traditional Chinese fishing junks that still dock in its original port. These belong to the few original residents of the island, the majority of whom were forced to relocate to make way for the modern port of Shanghai.","zh":"二十分钟后驶下大桥，视野被岛上的青山短暂打断，还有一小群仍停靠在岛上旧港里的中国传统渔船。它们属于岛上为数不多的原住民；这些原住民大多已为给上海现代港口让路而被迫迁走。"},{"id":"ch06-022","p":128,"t":"p","en":"From the base of the hill, a road winds its way up the steep sides of the cliff base to the peak. Along the road are modern apartment buildings that house foreign guests who come to check on their cargoes, their shipping berths, or simply to marvel at the scale of the Yangshan Port. Cross the peak and come to the other side, and a viewing platform provides a view of the entire port; or so it seems, until you turn the corner and realize that the first part of the port is simply that—the first part. Beyond, an enormous forest of cranes and containers extends far beyond the original vista.","zh":"从山脚起，一条公路沿着陡峭的崖壁盘旋而上，直抵山顶。路边是现代公寓楼，住着前来看货、看泊位，或干脆只为惊叹洋山港规模的外国客人。翻过山顶到另一侧，一座观景平台可以俯瞰整个港区；看上去是这样，直到你转过弯才明白，先前看到的只是港区的第一部分——仅此而已。再往外，起重机与集装箱组成的巨林一直铺到视野尽头之外。"},{"id":"ch06-023","p":129,"t":"p","en":"Visitors to the viewing platform are often greeted by Zhao Yaping, director, and He Caixue, deputy general manager. Responsible for the day-to-day operations of the port, they are both themselves original residents of the fishing community. Many of the island community were forcibly displaced from the island, and many of them were given jobs in the new port and are housed in the new apartment blocks at the mainland base of the Donghai Bridge. Others commute by company shuttle from eastern Shanghai, a drive of nearly two hours in each direction. The industrial gray, the scale, the forced displacement, and the tough conditions for the port workers: Yangshan exemplifies everything that's worrying about China's economic rise.18","zh":"来观景平台的访客，常由港区主任赵亚平（Zhao Yaping）和副总经理何彩雪（He Caixue）接待。两人负责港口的日常运营，本人都是这片渔村社区的原住民。岛上社区有许多人被强制迁离，其中不少人在新港得到工作，安置在东海大桥陆上桥头的新公寓楼里；另一些人则乘公司班车从上海东部通勤，单程近两小时。工业的灰暗、庞大的规模、强制搬迁、港口工人的艰苦条件：洋山港集中体现了中国经济增长中一切令人忧虑之处。18"},{"id":"ch06-024","p":129,"t":"p","en":"The port itself was built in four phases. It was well timed to capture the economic boom that came from China's opening to the world economy and then its entry into the World Trade Organization. Already by 2002, Shanghai had become the fourth-largest port in the world by container volume.19 Over the course of the next decade it would steadily and inexorably climb the lead tables of the largest ports in the world—and by 2017 it would top that list.20","zh":"港口分四期建成，时机恰到好处，正好接住中国向世界经济开放、继而加入世界贸易组织所带来的繁荣。早在2002年，上海按集装箱吞吐量已是世界第四大港。19 此后十年间，它稳步而不可阻挡地在世界大港榜单上攀升——到2017年登顶。20"},{"id":"ch06-025","p":129,"t":"p","en":"The port itself is simple in its layout. A large expanse of reclaimed land lies behind the original slopes of the Yangshan hills. Along its eastern edge are arrayed more than forty container cranes, each of them almost three hundred feet in height and two hundred feet in width, and each capable of lifting a twenty-thousand-pound container onto a cargo ship in a matter of thirty seconds. Along the base of the port lie more than one hundred thousand containers—literally a day's worth of work for the industrial mass of the shipyard. What are known as “rubber tire gantries\"—basically cranes on wheels, forty feet high topped by small glass and metal caves that house their drivers—maneuver around the port on eight foot wheels to shift containers from docking back to prime movers and back again, keeping a constant flow of containers from ship to port and back.","zh":"港区布局简单。洋山诸岛原先的山坡之后，是一大片填海而成的陆地。沿东侧排列着40多台集装箱岸桥，每台高近300英尺、宽200英尺，都能在30秒内把一只2万磅重的集装箱吊上货船。港区底部堆放着10万只以上的集装箱——那几乎就是这个庞大工业堆场一天的工作量。所谓“轮胎式龙门吊”——说白了就是装在轮子上的起重机，高40英尺，顶上有个玻璃与金属的小舱室供司机容身——靠着8英尺高的轮子在港区里移动，把集装箱从码头一侧转到牵引车上、再转回来，让集装箱在船与港区之间川流不息。"},{"id":"ch06-026","p":130,"t":"p","en":"The newest part of the port, Phase 4, was completed in 2017 and at first glance looks identical to the rest. On closer inspection, a very important difference reveals itself: there are no people. This part of the port is the world's largest, and one of the first, to be entirely automated. The movement of containers, the unloading and off-loading from ships, all happens by the same cranes and the same trollies, but in Phase 4, they're controlled by computers. A highly sophisticated artificial intelligence and robotics system manages the entire flow, and an AI-powered surveillance system monitors the operation. With its scale, sophistication, and the displacement of human labor, Phase 4 of Yangshan Port is everything that's ominous about China's future, and perhaps the future of globalization itself.²1","zh":"港区最新的四期工程2017年完工，乍看之下与其余部分毫无二致。细看之下，一个极要紧的差别显露出来：这里没有人。这部分港区是世界上最大、也是最早一批完全自动化的码头。集装箱的搬运、船舶的装卸，仍由同样的岸桥和同样的台车完成，但在四期，它们由计算机控制。一套高度精密的人工智能与机器人系统管理整个流程，一套人工智能驱动的监控系统监视作业。凭它的规模、精密程度和对人力劳动的取代，洋山港四期体现了中国未来——或许还有全球化本身未来——一切不祥之处。21"},{"id":"ch06-027","p":130,"t":"h","en":"China Goes Out","zh":"中国“走出去”"},{"id":"ch06-028","p":130,"t":"p","en":"With the return of Hong Kong and the trade and investment opportunities that afforded, China pushed further, encouraging its businesses to invest overseas. This helped Chinese business abroad, but it also helped domestically—as new WTO commitments accelerated the opening up of the domestic market, encouraging Chinese businesses to operate abroad helped them gain international experience that could help them keep up with foreign businesses now entering the Chinese market.","zh":"随着香港回归以及随之而来的贸易与投资机会，中国又往前推了一步，鼓励本国企业到海外投资。这既帮了在海外经营的中国企业，也有益于国内——世贸组织的新承诺加速了国内市场开放，鼓励中国企业到境外经营，能帮它们积累国际经验，从而跟得上此时正涌入中国市场的外国企业。"},{"id":"ch06-029","p":130,"t":"p","en":"This strategy evolved through several phases. Starting in 1986, as China negotiated for global trade access, the Chinese authorities allowed its state-owned firms to start investing in overseas markets. The returns were quite limited; between 1986 and 1991 only around \\$1 billion in investments were made by Chinese firms in foreign markets.22 Starting in 1991, with the Cold War now decisively in the dustbin of history, China decided to open up more, and began to allow private firms as well to invest overseas. This was underway when the Asian financial crisis hit in 1997, triggered by a market crisis in Thailand that quickly spread through the rest of Asia. In 1994, China had taken the important reform decision to peg its currency to the US dollar, so it, too, was affected when global financial markets were roiled by the crisis.2³ So, in 1999, just as China's negotiations to join the WTO entered the endgame, the authorities decided to formalize and deepen their overseas investment strategy, announcing a policy later described as its “go out” policy.","zh":"这一战略经过几个阶段的演变。从1986年起，中国为进入全球贸易体系进行谈判，当局允许国有企业开始投资海外市场。回报相当有限：1986年至1991年间，中国企业在境外市场的投资只有约10亿美元。22 从1991年起，冷战已被决定性地扫进历史的垃圾箱，中国决定进一步开放，开始也允许民营企业到海外投资。这一进程正在进行，1997年亚洲金融危机爆发，危机由泰国的一场市场动荡引发，迅速蔓延到亚洲其余地区。1994年，中国作出把人民币与美元挂钩的重要改革决定，因此当全球金融市场被这场危机搅得天翻地覆时，它也受到波及。23 于是1999年，正当中国加入世贸组织的谈判进入收官阶段，当局决定把海外投资战略正式化、深化，宣布了一项后来被称为“走出去”的政策。"},{"id":"ch06-030","p":131,"t":"p","en":"The focus of investment was the raw materials and natural resources that China needed for its own growth. In the first years of China's \"go out\" policy, state-owned enterprises were leading the effort, and focused their investment on mergers and acquisitions of foreign assets. China learned fast that this was not the most efficient way to acquire resources and shifted strategy. So then, both state-owned firms and Chinese private enterprise were incentivized to invest in natural resources and infrastructure projects—the basic logic being that if more natural resources were transported into the global market, China could simply acquire them through commercial transactions. The strategy evolved still further. Chinese authorities recognized that there was enough global supply of most natural resources that China's investments began to shift to a more straightforward focus on profit-making, and thus to investing where the profits were to be made—often by buying sizable shares of key industries. Over time, this policy would evolve into what became much more commonly known as China's Belt and Road Initiative.²4","zh":"投资的重点是中国自身增长所需的原材料与自然资源。“走出去”政策的最初几年，由国有企业挑头，投资集中于并购境外资产。中国很快认识到这不是获取资源最有效率的路子，于是调整策略。此后，国有企业和中国民营企业都受到鼓励，去投资自然资源与基础设施项目——基本逻辑是：只要更多自然资源被运进全球市场，中国通过商业交易把它们买下来就行。策略继续演变。中国当局意识到，多数自然资源的全球供应已经充足，中国的投资便开始转向更直接的逐利目标，投到有钱可赚的地方——常常是买下关键行业相当规模的股份。久而久之，这一政策演变为人们更常听说的“一带一路”倡议。24"},{"id":"ch06-031","p":131,"t":"p","en":"Containerization and bulk shipping made this possible. The raw numbers tell the story: Chinese outward investment went from \\$913 million USD in 1991 to \\$9.7 billion in 2001, to a peak of a whopping \\$216 billion in 2016.25 And between 1998 and 2008, global trade in natural resources grew from \\$613 billion to \\$3.7 trillion, with money pouring into the coffers of both traditional and new commodity exporters.26","zh":"集装箱化与散货运输使这一切成为可能。原始数字足以说明问题：中国对外投资从1991年的9.13亿美元增至2001年的97亿美元，又在2016年冲到2,160亿美元的高峰。25 而1998年至2008年间，全球自然资源贸易额从6,130亿美元增至3.7万亿美元，资金滚滚流入传统与新兴大宗商品出口国的国库。26"},{"id":"ch06-032","p":131,"t":"p","en":"This is often written simply as a story of Chinese economic growth. In fact, the massive Chinese appetite for resources led to a global boom in commodity prices, a commodity super-cycle.27 Resource-rich lowerincome countries gained significant economic opportunities as a result, extracting \\$1 trillion in oil revenues alone during the height of the commodities boom from 2005 to '08.28 This helped create conditions that led to this remarkable phenomenon: every developing country in the world grew, barring those at war.29","zh":"人们常把这一切简单写成中国经济增长的故事。事实上，中国对资源的巨大胃口带动了大宗商品价格的全球性上涨，即“大宗商品超级周期”。27 资源丰富的中低收入国家因此得到重要经济机遇：在2005年至2008年大宗商品繁荣的高峰期，仅石油收入一项就有1万亿美元。28 这促成了下面这种不同寻常的现象：除战乱国家外，世界上每个发展中国家都在增长。29"},{"id":"ch06-033","p":131,"t":"p","en":"The gains were substantial. Nigeria went from \\$567 per capita in 1990 to \\$2,242 in 2008; Ghana from \\$398 to \\$1,210; the average per capita size of Latin America's developing countries jumped from \\$2,500 to \\$7,672; and so on.30 China's commodity super-cycle transformed the \"third world.\"","zh":"收益相当可观。尼日利亚人均收入从1990年的567美元升至2008年的2,242美元；加纳从398美元升至1,210美元；拉美发展中国家的人均经济产出从2,500美元跃升至7,672美元；诸如此类。30 中国的大宗商品超级周期改造了“第三世界”。"},{"id":"ch06-034","p":132,"t":"p","en":"All of this would in turn transform world affairs. From a world in which the rich countries of the north could dictate the terms of international politics to developing countries, the commodity super-cycle created a new reality. More than sixty countries grew from low-income status to middle-income status, and gained the diplomatic influence that goes along with that growth. By the late 2000s, the largest of these countries were being talked about as “emerging markets,\" and later as “rising powers.\" The countries would begin to wield substantially greater clout in global affairs. No longer could the rich northern countries of Europe and the free world simply dictate the field of play; they now had to contend with the influence of the \"global south.\" Chinese investment was not the only factor: Western aid played a useful role in some settings, like Vietnam and Ethiopia, as did regional organizations. But it was the Chinese-led commodity super-cycle that created the basic conditions for these countries' economic rise.³1","zh":"这一切反过来又改变了世界格局。过去，北方富国可以对着发展中国家规定国际政治的条款；大宗商品超级周期造出一个新的现实。60多个国家从低收入行列升入中等收入行列，并获得了与这种增长相称的外交影响力。到2000年代后期，其中最大的几个国家被称为“新兴市场”，后来又被称为“崛起大国”。这些国家开始在全球事务中施展大得多的影响力。欧洲与自由世界的富裕北方国家再也无法单方面规定游戏规则；它们如今必须应付“全球南方”的影响力。中国投资并非唯一因素：西方援助在越南、埃塞俄比亚等地起过有益作用，区域组织亦然。但正是中国主导的大宗商品超级周期，为这些国家的经济崛起创造了基础条件。31"},{"id":"ch06-035","p":132,"t":"p","en":"The rest of the story is all about China. It's remarkable to look at the tables of the largest ports in the world and watch China simply start to dominate. In 2001, leaving aside Hong Kong, China has one port, Shanghai, in the top five, well below Singapore and Busan, and only marginally larger than the largest European or Western port of the time, Rotterdam.³² Fast-forward to 2005, and Singapore holds the top slot, but the next in the ranks are Chinese: Hong Kong and Shanghai. In 2010, China has six of the ten top slots—including Guangzhou, earlier known as Canton, site of China's original confrontation with the trading West. At this stage, Europe has only one slot left in the top ten, Rotterdam—and the United States has none. Both Los Angeles and New York have been booted out of the top levels of world trade.33 By this point, more than two-thirds of the world's trade was passing through a port with Chinese investment at some stage of its travels.34","zh":"接下来的故事则全关乎中国。看世界大港榜单，看中国就这样开始占据主导，着实令人惊叹。2001年，且不说香港，中国只有上海一个港口进入前五，远在新加坡和釜山之后，仅比当时欧洲乃至西方最大的港口鹿特丹略大。32 快进到2005年，新加坡仍居首位，紧随其后的却是中国的港口：香港和上海。2010年，前十名里中国占了六席——包括广州，旧称 Canton，那正是中国最初与来做生意的西方正面交锋之地。此时欧洲在前十中只剩一席，鹿特丹——而美国一席不剩。洛杉矶和纽约都被踢出了世界贸易的顶层。33 到这时，世界贸易中三分之二以上的货物，在其旅程的某一站经过了有中国投资的港口。34"},{"id":"ch06-036","p":132,"t":"p","en":"From there, the list of ports doesn't change much, though Rotterdam drops out of the top ten by 2013—it's just that the numbers continue to grow, inexorably. In 2002, Shenzhen was the number six port in the world, with an annual TEU throughput rate of 7,618,000 containers. By 2005, it reached 16,000,000 TEU, and by 2015 it was at 24,000,000 TEU—more than twice as large as the largest European container port, Rotterdam. But even its numbers were dwarfed by the new global champion in container ports: Shanghai, which processed more than 35 million TEUs.35","zh":"此后，港口名单变化不大，只是到2013年鹿特丹跌出前十——变的是数字，它们不可阻挡地继续增长。2002年，深圳是世界第六大港，年吞吐量761.8万个标准箱（TEU）。到2005年达到1,600万标准箱，2015年升至2,400万标准箱——是欧洲最大集装箱港鹿特丹的两倍多。但即便这些数字，也被新的全球集装箱港冠军比了下去：上海，吞吐量超过3,500万标准箱。35"},{"id":"ch06-037","p":133,"t":"p","en":"In 2017, Shanghai became t
