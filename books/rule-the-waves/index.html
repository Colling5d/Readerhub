输的现实中还有一个不显眼的特征：就连世界上最强大的军队，也得依靠私营部门的散货航运才能向海外部署。美国的命运与国际安全的走向，就这样再一次系于对海洋的掌控。"},{"id":"ch01-044","p":28,"t":"p","en":"That all of this matters to the US Navy, and to China and Russia, is evident. But to see how it links to the daily functioning of the economy, it helps to shift from the high drama of the north to the more quotidian realities of trade, and a location where the Wilhelmsen Group docks its ro-ro ships when not on special assignment to the US military. Like many of the features of contemporary changes to trade, it's plainly visible—in Newark, New Jersey.","zh":"这一切对美国海军、对中国和俄罗斯都至关重要，这是显而易见的。但要看清它与经济日常运转之间的联系，不妨从北方那出高调的大戏上移开目光，去看贸易中更寻常的现实，去看威尔森集团的滚装船在没有为美军执行特殊任务时所停靠的地方。与当代贸易变迁的许多特征一样，那地方明明白白地摊在那里——新泽西州纽瓦克。"}],"notes":[]},{"id":"ch02","label":"Chapter 2","labelZh":"","title":"The Outer Perimeter; or, Pushing the American Border Out","titleZh":"第二章　外围防线：把美国的边界推出去","part":"Part I: News from the Future","showPart":false,"partZh":"第一部","partTitleZh":"来自未来的消息","paras":[{"id":"ch02-001","p":29,"t":"p","en":"Every day, tens of thousands of New Yorkers climb into a taxi or an Uber to drive through the Lincoln Tunnel into Hoboken, New Jersey, on their way to Newark Airport. Along the way, many cross the Newark Bay Bridge on Interstate 78, one of the nation's most congested expressways. Most of them are watching TV shows on their iPads or texting and emailing from their phones—anything to avoid the bleak viewscape of chemical plants and storage facilities and rail yards that make up the industrial rim around New York City. Similar voyages make up the route to airports in Seattle, Boston, Houston, and other American locales—in each case, bypassing major seaports that no longer occupy central real estate in modern cities.","zh":"每天，数以万计的纽约人钻进出租车或优步，穿过林肯隧道进入新泽西州霍博肯，再赶往纽瓦克机场。一路之上，许多人要驶过78号州际公路上的纽瓦克湾大桥——那是全美最拥堵的高速公路之一。他们大多在iPad上看剧，或者用手机发短信、回邮件——总之是要躲开窗外那片萧索的景致：化工厂、仓储设施、铁路编组场，构成了环绕纽约市的工业边缘带。前往西雅图、波士顿、休斯敦以及美国其他地方机场的路线也大同小异——每一条都绕开了那些曾经寸土寸金、如今在现代城市里已不再占据核心地段的大型海港。"},{"id":"ch02-002","p":29,"t":"p","en":"If these preoccupied passengers did look out the window and pay attention to their passing surroundings, along the route they would probably see at least one ro-ro ship docked in Port Newark, at the terminus of the Kill van Kull—the westernmost dock in New York's massive harbor, and easily the most important waterway that most people have never heard of. And chances are good that their car arrived in the United States on the decks of one of those ships, before being offloaded at Newark, New Jersey, and then moved by truck or rail to dealerships across the state, and as far away as Chicago.","zh":"假如这些心事重重的乘客真的往窗外看一眼，留意一下掠过的景物，他们多半会看到至少一艘滚装船停靠在纽瓦克港，就在基尔范库尔水道（Kill van Kull）的尽头——那是纽约庞大港区最西端的一座码头，也是大多数人从未听说过、却无疑最要紧的一条水道。而他们坐的这辆车，很可能正是由那样一艘船运抵美国，在新泽西州纽瓦克卸下，再由卡车或铁路送往全州各地的经销商，远至芝加哥。"},{"id":"ch02-003","p":29,"t":"p","en":"New York's harbor has a long history. In 1524, Portuguese captain and explorer Giovanni da Verrazzano sailed aboard La Dauphine from a home port in Brittany under service to the French king, Francis I.","zh":"纽约港的历史很长。1524年，葡萄牙船长、探险家乔瓦尼·达·韦拉扎诺（Giovanni da Verrazzano）受法国国王弗朗索瓦一世之命，驾驶「多菲内号」（La Dauphine）从布列塔尼的母港出海。"},{"id":"ch02-004","p":30,"t":"p","en":"Nearly two months later, his ship neared an area now known as Cape Fear, off the Carolina coast. He then sailed northward, missing the Chesapeake Bay and the mouth of the Delaware River, and eventually encountering a large opening that he believed to be a lake. It was in fact the mouth of the Hudson River. Little did he know that the narrows he sailed past would end up bearing his name and be the sea-based gateway to the most important city of the twentieth century.","zh":"将近两个月后，他的船驶近今天北卡罗来纳州沿海一个叫作恐怖角（Cape Fear）的地方。随后他向北航行，错过了切萨皮克湾和特拉华河口，最后遇上一片开阔的水面，他以为那是个湖。那其实是哈得孙河的河口。他当时并不知道，自己驶过的这片窄水道日后会以他的名字命名，并成为通往20世纪最重要城市的海上门户。"},{"id":"ch02-005","p":30,"t":"p","en":"Today, few New Yorkers experience the old approach to the port and the harbor. They arrive by plane or train to the grim and grime of LaGuardia, Newark, or John F. Kennedy airports and to Amtrak's recently finished Moynihan Train Hall, which has replaced the dilapidated horror of Penn Station. But sailors aboard modern trade ships still enter by the old route. Having weathered the notorious storms and swells of the gray Atlantic, they approach New York City sailing west along Long Island's southern shore, and approach the Narrows from the east. Rounding the head, they sail under the huge suspension bridge named after Verrazzano—when it was built, at the height of American power, the largest suspension bridge in the world.","zh":"今天，很少有纽约人还会走那条通往港口与港湾的老航线。他们坐飞机或火车，抵达的是拉瓜迪亚、纽瓦克或肯尼迪机场那副灰暗又脏乱的模样，以及美铁新近落成的莫伊尼汉车站——它取代了破败得令人心惊的宾夕法尼亚车站。但现代商船上的水手仍从老路进港。他们闯过灰蒙蒙的大西洋上出了名的风暴与涌浪，沿长岛南岸向西驶近纽约市，再从东侧进入纳罗斯水道（the Narrows）。绕过海岬，船从以韦拉扎诺命名的那座巨型悬索桥下驶过——大桥落成之时正值美国国力的巅峰，是当时世界上跨度最大的悬索桥。"},{"id":"ch02-006","p":30,"t":"p","en":"For the first few minutes after you enter the Narrows, the view is bounded by the headlands of Staten Island and Long Island. Then the field of vision opens to the wide expanse of the deep natural harbor where the East River and the Hudson River empty into the Atlantic. A small formation on the horizon soon reveals itself to be the Statue of Liberty. To the west lie the remnants of Fort Tompkins, named for Daniel D. Tompkins, governor of the state of New York during the War of 1812, when Britain's Royal Navy mounted a blockade of fledgling America off these waters.¹ To the northeast, the towers of lower Manhattan are outlined against the sky, their reflections shimmering in the surprisingly clear waters of the harbor.","zh":"进入纳罗斯水道后的头几分钟，视野被斯塔滕岛与长岛的海岬夹在中间。随后豁然开朗，一片开阔的深水天然良港铺展开来——东河与哈得孙河就在这里注入大西洋。地平线上一个小小的轮廓，很快显出是自由女神像。西边是汤姆金斯堡（Fort Tompkins）的残迹，此堡以丹尼尔·D. 汤普金斯（Daniel D. Tompkins）命名，他是1812年战争期间的纽约州州长；当年英国皇家海军正是在这片海域封锁了羽翼未丰的美国。* 东北方向，曼哈顿下城的楼群在天幕上勾出轮廓，倒影在港湾出人意料清澈的水面上晃动。"},{"id":"ch02-007","p":30,"t":"p","en":"In the days of sail and steam, and up through the 1960s, ships coming into New York Harbor from the Narrows would steer north up to the mouth of the East River and the piers at Manhattan's South Street port, or across the river on Brooklyn's shore. The Brooklyn Bridge— the world's first steel-wire suspension bridge—was built to provide a rail connection between Manhattan and the new Brooklyn shipping piers. From the early 1900s until the mid-1970s, New York was the largest and most important port in the world.","zh":"在帆船与蒸汽船的时代，直至20世纪60年代，从纳罗斯水道进入纽约港的船都会向北驶向东河口、曼哈顿南街港区的码头，或者驶向对岸的布鲁克林岸边。布鲁克林大桥——世界上第一座钢丝悬索桥——正是为了用铁路把曼哈顿与布鲁克林新建的航运码头连起来而修建的。从20世纪初到70年代中期，纽约一直是世界上最大、最重要的港口。"},{"id":"ch02-008","p":31,"t":"p","en":"Not so for modern cargo ships. Indeed, the largest of those ships can't even enter New York Harbor, as it is too shallow at low tide to accommodate the draft of the ultra-large ships that make up the high end of the global trading system. These ships head farther south to the deepwater port of Charleston. But many other container ships—from the Maersk fleet, or from Orient Overseas Container Line, or Mediterranean Shipping Company, or Hapag-Lloyd—or ro-ro ships, oil tankers, grain steamers, or bulk carriers with shallower keels transit the Narrows, but instead of continuing north they turn southwest. There, they enter the Kill van Kull, a narrow channel that runs for three miles between Staten Island and the eastern shore of New Jersey. They have to navigate carefully—even modest-size cargo ships often have a draft of well over forty feet, and even after multiple dredging operations the Kill is only fifty feet deep at low tide. A slight wrong turn, a brief miscalculation, and a grounded ship would choke off dozens of billions of dollars of imports into the eastern United States.","zh":"现代货船就不是这样了。事实上，其中最大的船根本进不了纽约港——退潮时港内水太浅，容不下站在全球贸易体系顶端那些超大型船舶的吃水。这类船继续南下，驶往查尔斯顿的深水港。但还有许多别的集装箱船——马士基船队的，或是东方海外、地中海航运、赫伯罗特的——以及滚装船、油轮、运粮船，或者吃水较浅的散货船，仍会穿过纳罗斯水道，只是不再继续向北，而是转向西南。它们驶入基尔范库尔水道，这条狭窄航道在斯塔滕岛与新泽西东岸之间延伸三英里。船必须小心翼翼地走——即便是中等大小的货船，吃水也常常远超40英尺，而基尔水道经过多次疏浚，退潮时水深也只有50英尺。稍有偏差，稍有失算，一条搁浅的船就会掐断流入美国东部、价值数百亿美元的进口货物。"},{"id":"ch02-009","p":31,"t":"p","en":"Safely through, they dock at the piers at Elizabeth, New Jersey, just south of Newark.","zh":"平安通过之后，它们停靠在新泽西州伊丽莎白的码头，那里就在纽瓦克以南。"},{"id":"ch02-010","p":31,"t":"h","en":"The Inner Perimeter","zh":"内层防线"},{"id":"ch02-011","p":31,"t":"p","en":"If a cargo or container ship has made it this far into New York Harbor, it's already passed through several concentric rings of security—a vast system of interlocked intelligence gathering, cyber monitoring, Coast Guard operations, and overseas programs that put the United States at the heart of global trade security. The system is designed to protect the United States against terrorism, the import of weapons of mass destruction, and infectious disease, as well as the smuggling of drugs and counterfeit goods. And it effectively extends the American border outward seven thousand miles from each coast. We'll explore that in a moment. But having passed through that system and made it to the Kill van Kull, there are still two critical layers of protection to get past.","zh":"一艘货船或集装箱船能深入到纽约港这个位置，说明它已经穿过了好几道同心圆式的安全防线——那是一套庞大的体系，情报搜集、网络监控、海岸警卫队行动与海外项目彼此咬合，把美国放在全球贸易安全的中枢。这套体系意在保护美国免遭恐怖主义、大规模杀伤性武器输入和传染病之害，也防堵毒品与假冒商品的走私。它实际上把美国的边界从东西两岸各向外推了7,000英里。这一点稍后再说。不过，即便穿过了那套体系、驶抵基尔范库尔水道，还有两道关键防线要过。"},{"id":"ch02-012","p":31,"t":"p","en":"The first is a large but nondescript warehouse in the middle of the secured Customs and Border Protection zone in Elizabeth. This is the Centralized Examination Station, one of three, each encompassing 100,000 square feet of interior space, with sixty docking bays of container trucks. From inside the warehouse, agents of the Customs and Border patrol can inspect cargo inside the containers themselves, without having to unload the goods, unless they have specific intelligence or a reason to dig deeper.","zh":"第一道，是伊丽莎白封闭式海关与边境保护区中央一座其貌不扬的大仓库。这里是集中查验站（Centralized Examination Station），三座当中的一座，每座室内面积10万平方英尺，设有60个集装箱卡车泊位。海关与边境保护局的人员可以在仓库里直接查看集装箱内部的货物，不必卸货——除非他们掌握了具体情报，或有理由深查。"},{"id":"ch02-013","p":32,"t":"p","en":"The opened container doors reveal a bewildering array of packing methods, from the rigorous to the shambolic. In one container, an entire apartment's worth of furniture, clothes, carpets, and cleaning supplies are strewn across the container with no additional packaging or arrangement, like a college student in a rush has thrown their dorm room furniture into the back of their parents' truck—if that truck were one of twenty thousand containers on the world's largest cargo ship. In another, an old Mercedes is strung to the roof of the container using leather straps—as if being above a bunch of crates of toilet paper would somehow cause the customs agents not to notice. More commonly, every square inch of space inside the container is taken up with neatly stacked pallets or boxes, eight feet high by eight feet eight inches wide, and forty feet long. In one, dozens of cases of rum are boxed one on top of another—amazingly, not a single bottle broken during the twelveday sea voyage across 7,500 nautical miles.","zh":"箱门一开，装法五花八门，令人瞠目，从严丝合缝到乱七八糟都有。有一个箱子里，一整套公寓的家具、衣服、地毯、清洁用品横七竖八地摊着，既没另加包装，也没做任何整理，就像一名大学生赶时间，把宿舍家具一股脑扔进父母皮卡的后斗——只不过那辆“皮卡”是当今世界最大货轮上两万个集装箱中的一个。另一个箱子里，一辆旧奔驰用皮带吊在箱顶——仿佛把它架在一堆卫生纸箱子上方，海关人员就看不出来了。更常见的情形是，箱内每一寸空间都被码得整整齐齐的托盘或纸箱占满：8英尺高、8英尺8英寸宽、40英尺长。有一个箱子里，几十箱朗姆酒层层叠放——令人称奇的是，这趟横渡7,500海里的十二天海上航程下来，一瓶都没碎。"},{"id":"ch02-014","p":32,"t":"p","en":"Not everything is inspected inside the container trucks, though. Acting on intelligence, a tip, or sheer gut instinct, the Customs and Border agents pull a selection of the goods onto the warehouse floor for more detailed examination. Their main job these days is counterterrorism—but the old-school agents still love the hunt for contraband. John V., a gruff old Irish customs agent, thirty-five years in the service, says with a grin, \"We old-school guys do it old-school ways.\"","zh":"不过，并非所有货物都在集装箱卡车里查验。依据情报、线报，或者全凭直觉，海关与边境人员会挑出一批货物卸到仓库地面，做更细致的检查。如今他们的主业是反恐——但老派关员依然钟爱查缉违禁品这件事。约翰·V.（John V.）是个粗声粗气的老爱尔兰裔关员，在海关干了35年，他咧嘴一笑：“我们这些老家伙，就用老办法。”"},{"id":"ch02-015","p":32,"t":"p","en":"That involves stacking row after row of goods across the warehouse floor and doing a detailed inspection by hand. On a given day, the number and variety of goods arrayed across the Centralized Examination Station is staggering. There's a large row of neatly piled bags of turbinado sugar. A pallet of allspice. Dozens of bags of rice, next to sackcloth bags full of hibiscus leaves. Boxes of butane lighters next to old-fashioned boom boxes and pirated CDs. There are dozens of vacuum cleaners lying on their sides amid mops and brooms and pails and cleaning supplies. One row displays enough paper towels to wipe down a city block. There are hundreds of flat-screen TVs and stereos. A section of the warehouse is given over to furniture—dining room tables and chairs and living room sets, mattresses and pillows and blankets, all wrapped in translucent blue plastic. Crates of batteries. Boxes full of running shoes in every conceivable color combination, alongside T-shirts, jeans, and sweatshirts. There's an X-ray machine and a ventilator and a high-end laser printer. Stuffed animals and children's clothing and toys. A row of motorbikes, and several used cars—some of them in such appalling condition it's inconceivable that there's reason to import them. Car parts and canisters of fuel of every description. China dinner sets, toiletries, and an entire container full of sex toys. Reams of paper, paintings, wash powder, taxidermied animals, canola oil, laptops, headphones, winter coats, and pallets of dried flowers. Every possible facet of modern household consumption is arrayed here for inspection.","zh":"随便哪一天，集中查验站里摆开的货物，数量和种类都多得惊人。一大排码得整整齐齐的粗糖袋。一托盘多香果。几十袋大米，挨着装满洛神花叶的麻袋。几箱丁烷打火机靠着老式收录机和盗版CD。几十台吸尘器侧卧在地，混在拖把、扫帚、水桶和清洁用品中间。有一排厨房纸巾，够把一整个街区擦一遍。还有成百上千台平板电视和音响。仓库有一片区域专放家具——餐桌、餐椅、客厅套装、床垫、枕头、毯子，全都裹着半透明的蓝塑料膜。成箱的电池。装满各色跑鞋的纸箱，旁边是T恤、牛仔裤、卫衣。一台X光机、一台呼吸机、一台高端激光打印机。毛绒玩具、童装、玩具。一排摩托车，还有几辆二手车——有的车况差得让人想不出还有什么进口的理由。汽车零件，各式各样的燃料罐。中国餐具、洗漱用品，以及整整一集装箱的性玩具。成令的纸、画作、洗衣粉、动物标本、芥花籽油、笔记本电脑、耳机、冬衣，还有一托一托的干花。现代家庭消费的每一个侧面，都在这里排开来等着查验。"},{"id":"ch02-016","p":33,"t":"p","en":"As are foodstuffs. Hundreds of sacks of potatoes and yams and rice. Coffee beans from Brazil, paneer from India, dried noodles from Pakistan and Thailand. And niche goods for specialty markets, like duck feet and chicken tongues and goose hearts. And every conceivable variety of pork product, mostly from China—pork tails, pork tongues, dried pork, smoked pork, pork hearts, pork livers, pork hocks.","zh":"食品也一样。几百袋土豆、山药和大米。巴西的咖啡豆，印度的印度奶酪（paneer），巴基斯坦和泰国的干面条。还有专供小众市场的货色，像鸭掌、鸡舌、鹅心。以及五花八门的猪肉制品，大多来自中国——猪尾、猪舌、猪肉干、熏猪肉、猪心、猪肝、猪肘。"},{"id":"ch02-017","p":33,"t":"p","en":"Some of these goods are simply illegally imported and will be returned. Others are past their sell-by dates and will be destroyed. But there are also fresh goods and fruits designed for markets across the city and the entire eastern United States: crate after crate of persimmons and clementines and lemons. Pallets of tomatoes. Crates full of bananas. Pineapples, kumquats, avocados, lychees, and all of the other tropical produce that Americans have come to expect to be able to buy in their local markets. As well as fruit that is grown in the United States, but only seasonally, or that is cheaper to ship from Latin America than to fly from California—billions of dollars' worth of blueberries and strawberries and grapes and cranberries and mangoes and watermelons and apples.","zh":"其中有些货是非法进口的，将被退回；有些过了保质期，将被销毁。但也有供应全城乃至整个美国东部市场的新鲜货物和水果：一箱接一箱的柿子、小柑橘、柠檬。一托盘一托盘的番茄。整箱整箱的香蕉。菠萝、金橘、牛油果、荔枝，以及美国人早已习惯在自家附近市场上买到的一切热带物产。还有美国本土出产、但只有季节性供应的水果，以及从拉美海运比从加州空运更便宜的水果——价值数十亿美元的蓝莓、草莓、葡萄、蔓越莓、芒果、西瓜和苹果。"},{"id":"ch02-018","p":33,"t":"p","en":"There's a special inspection regime for live agricultural products. That doesn't mean sampling every piece of fruit—literally uncountable billions of pieces of fruit and vegetables enter this port every year. Instead, the agents work with the Plant Protection and Quarantine unit of the US Department of Agriculture to figure out scientific methods to test for disease. They conduct detailed experiments to measure the units per thousands of bugs, infestations, blights, and diseases that spread across specific types of plants, and sample against those ratios, Every single container that has agricultural goods is opened for inspection. The main concern is preventing the import of pests that could damage American crops, but it's also an important barrier against foodborne disease-foot-and-mouth disease and Asian swine flu being the two most pressing concerns. In the wake of COVID—and reports of potential new swine flu outbreaks in Asian markets-this function of the service feels particularly important.","zh":"对鲜活农产品另有一套查验办法。这并不意味着要逐个抽检水果——每年进入这个港口的果蔬以数十亿计，根本无法计数。关员们与美国农业部植物保护与检疫部门合作，研究用科学手段检测病害。他们做细致的实验，测算特定植物上虫害、疫病、枯萎病的发生率——每一千株里有多少——再按这些比例抽样。凡装载农产品的集装箱，一律开箱查验。重点是防止可能危害美国农作物的虫害入境，同时它也是一道防范食源性疾病的重要屏障，其中最紧要的两项是口蹄疫和亚洲猪流感。新冠疫情之后——加之有报道称亚洲市场可能出现新的猪流感疫情——海关的这项职能显得尤为重要。"},{"id":"ch02-019","p":34,"t":"p","en":"A lot of what the CBP finds during these inspections are simply cheap knockoffs—counterfeit goods. You can almost monitor the popularity of various street brands by the quantity of knockoff imports inside the Centralized Examination Station. Yeezy shoes are the newest fad, and the newest catch. Timberland boots are a particularly common catch, with manufacturers using a series of tricks to try to get around counterfeit rules—like importing fake Timberlands that aren't adorned with the brand's distinctive under-sole label, which is produced domestically and glued onto the imported fakes if they make it past customs. There are fake Guccis, and Rolexes, and Nikes and Uggs and Beats headphones by the hundreds of dozens.\"","zh":"这些查验中，海关与边境保护局查获的很多东西只是廉价仿货——假冒商品。看集中查验站里仿货进口的数量，几乎就能推断出各种街头品牌有多红。椰子鞋（Yeezy）是最新的风潮，也是最新的战果。添柏岚（Timberland）靴子格外常见，厂商想方设法绕开打假规则——比如进口一批不带品牌标志性鞋底标的假添柏岚，那种鞋底标在美国本土生产，假货一旦过了关，再粘上去。假古驰、假劳力士，假耐克、假UGG、假Beats耳机，成百上千。"},{"id":"ch02-020","p":34,"t":"p","en":"And then there are the drugs. Lots of them, hidden in an ever more creative array of concealment techniques. So many that the customs agents dedicate a small portion of the warehouse floor to what they call their \"concealment museum.\" Understandably, they don't display or talk about the latest methods. But even the methods that are now so routine that they aren't hesitant about displaying them are striking in their malign creativity. There's a bicycle whose tires had strips of marijuana hidden inside the inner tubes. A simple cardboard box: its contents passed inspection, but a clever agent noticed that the cardboard itself had a different consistency than normal, and tests determined that cocaine had been turned into a form of glue and painted into the ribs of the cardboard itself. A pallet of kitchen towels, seemingly innocuous, but actually with heroin baked into the fabric. A ceramic toilet with meth hidden in its inner piping. Dates, still on the vine, imported from Algeria—and with cocaine soaked into the fruit. A stack of taxidermied lizards with LSD hidden in the stomach cavities—a clever idea but for the fact that the lizards themselves are a prohibited item. A 1992 BMW 750 whose gas tank was full of ecstasy pills. Every other variety of American appetite for vice is on display here as well.","zh":"接下来是毒品。数量极大，藏法越来越有创意。多到关员们在仓库地面划出一小块地方，管它叫“藏匿博物馆”。不用说，最新的手法他们不展示、也不谈论。但即便是那些已经司空见惯、他们不介意展示的手法，其恶意的巧思也令人咋舌。有一辆自行车，内胎里塞着条状大麻。一个普普通通的纸箱：箱里的东西过了关，但一名眼尖的关员发现纸板的质地与寻常不同，检测证实可卡因被做成一种胶，刷进了纸板的瓦楞里。一托盘厨房用巾，看着无害，其实海洛因已经焙进了织物。一只陶瓷马桶，冰毒藏在内侧管道里。从阿尔及利亚进口的椰枣，还带着枝，果肉里浸透了可卡因。一摞蜥蜴标本，胃腔里塞着LSD——主意不可谓不妙，只可惜蜥蜴标本本身就是禁运品。一辆1992年的宝马750，油箱里装满摇头丸。美国人贪图各种恶习的口味，在这里一样不少地陈列着。"},{"id":"ch02-021","p":34,"t":"n","en":"What's true on the way in is also true on the way out. The same agents can scan exported goods for sensitive American technologies, stolen vehicles, and illegal merchandise. But the vast majority of this enforcement function is now electronic.","zh":"进港如此，出港亦然。同一批关员也会扫描出口货物，查缉敏感的美国技术、被盗车辆和非法商品。但这项执法职能的绝大部分如今已电子化。"},{"id":"ch02-022","p":35,"t":"p","en":"They also find money. Once, \\$11 million stuffed into used truck parts. Another time, \\$150,000 hidden in bales of hay. And sometimes, simply a bundle of money left in the front of a container—a kind of standing bribe to look the other way at contraband.","zh":"他们还会查到钱。有一次，1,100万美元塞在旧卡车零件里。另一次，15万美元藏在干草捆里。有时候，就是简简单单一捆现金留在集装箱门口——像一笔常设的贿赂，请人对着违禁品睁一只眼闭一只眼。"},{"id":"ch02-023","p":35,"t":"p","en":"The contents on display at the Centralized Examination Station give a glimpse both of the huge array of goods imported into the United States and of how much American consumption has come to rely on those imports. The scene is repeated in every major American port. And in port cities in every rich country in the world—highlighting the near-omnipresent nature of sea-based trade, no longer confined to specialty goods like spices and tea, but woven into the fabric of everyday household consumption and economic production.","zh":"集中查验站里摆出来的这些东西，既让人瞥见输入美国的货物何其庞杂，也让人看到美国消费已在多大程度上依赖这些进口。同样的场景在美国每一个大港重演，也在世界每一个富国的港口城市重演——这正说明海上贸易几乎无处不在：它早已不再局限于香料、茶叶之类的特货，而是织进了日常家庭消费与经济生产的肌理。"},{"id":"ch02-024","p":35,"t":"p","en":"Still, for all the diversity and scale of what's on display inside the Centralized Examination Station, only around 5 percent of the containers are pulled for inspection. The scale of what's imported now into the United States by ship is so large that if the customs agents pulled every container for inspection, it would drastically slow the entire American economy","zh":"然而，尽管集中查验站里陈列的东西如此繁复、规模如此之大，真正被抽出来查验的集装箱只占5%左右。如今经海路输入美国的货物量如此庞大，倘若关员把每个箱子都拉出来查验，整个美国经济都会被拖慢。"},{"id":"ch02-025","p":35,"t":"p","en":"There's one critical exception, though: nuclear material.","zh":"不过，有一个关键例外：核材料。"},{"id":"ch02-026","p":35,"t":"h","en":"The Last Line of Defense","zh":"最后一道防线"},{"id":"ch02-027","p":35,"t":"p","en":"In the wake of 9/11, with fears of a terrorist organization trying to smuggle a dirty bomb or radiological device or chemical weapon into the country, the Departments of Commerce and Homeland Security collaborated to put together new methods at Elizabeth to scan cargo coming into the country for radiological materials. That sounds very complicated, but after some trial and error and some technical innovations, this has been turned into a smooth operation. Containers coming into Elizabeth can be off-loaded from 6:00 a.m. to 8:00 p.m.,","zh":"“9·11”之后，人们担心恐怖组织会把脏弹、放射性装置或化学武器偷运入境，商务部与国土安全部联手，在伊丽莎白港设计出新办法，扫描入境货物中的放射性物质。听起来很复杂，但经过反复试错和几轮技术革新，这套流程如今已相当顺畅。运抵伊丽莎白的集装箱，可在早6点至晚8点之间卸货，"},{"id":"ch02-028","p":36,"t":"p","en":"Monday through Friday. As they do, they drive through a portal that checks for gamma radiation. It looks, quite simply, like an extremely large metal detector, the same kind you walk through when boarding an airplane. Only, this one is twenty feet high and twenty-six feet wide, painted yellow, covered in two-inch metal rivets, like the kind that hold airplane wings together. They stand two abreast, at the last exit from the port. Trucks pull up and drive slowly through the scanner one at a time, hundreds of them in any given hour. A few yards away, six officers sit crammed into a small shed, scanning the results.","zh":"周一到周五。卸货时，卡车要驶过一道检测伽马射线的门架。说白了，它就像一台特大号金属探测器，和你登机时走过的那种一样。只不过这一台有20英尺高、26英尺宽，漆成黄色，钉满两英寸的金属铆钉，就像固定飞机机翼用的那种。两台门架并排而立，守在出港的最后一个出口。卡车一辆辆驶来，缓缓通过扫描仪，每小时可达数百辆。几码之外，六名关员挤在一间小棚子里，盯着扫描结果。"},{"id":"ch02-029","p":36,"t":"p","en":"The results are instantly displayed on a computer terminal, which shows the heat signature from the container on the back of the truck. The challenge for the CBP officers comes from the fact that many types of goods throw off some degree of radiation, including a variety of plastics, hospital equipment, even smoke alarms. Usefully, though, every type of radiation has a specific signature. For the most part, the officers inside the truck can tell the difference between the radiation thrown off from innocuous materials and those they should be worried about. The systems keep getting refined. When these \"radiation portal monitors\" were first installed at Port Elizabeth, up to two hundred containers a day would set off a flag that would require more detailed examination. With refinements in the technology and increased training for the agents, that's now down to twenty a day.","zh":"结果即时显示在电脑终端上，屏幕上是卡车所载集装箱的热特征。难题在于，许多货物本身就会放出一定程度的辐射，包括多种塑料、医院设备，甚至烟雾报警器。好在每种辐射都有特定的特征谱。大体上，棚里的关员能分辨出无害材料发出的辐射和真正该警惕的辐射。系统也在不断改进。这些“辐射门户监测仪”刚在伊丽莎白港安装时，一天最多有两百个集装箱触发警报、需要进一步细查。随着技术改良和关员培训加强，如今已降到每天20个。"},{"id":"ch02-030","p":36,"t":"p","en":"Sometimes still a red flag does go off. A container giving off the heat signature of cesium-137, for example, is indicative of nuclear or other radiological materials. That can still be legitimate, though: a hospital might be importing a complex piece of medical equipment that has a nuclear component, which is perfectly legal. The paperwork is inspected, and the container can move onward. If the signal is unclear, or the paperwork incomplete, the officers have to send the data source and the heat signature to one of the country's nuclear laboratories for further examination. A Washington, DC, lab monitors all this in real time and helps the officers to decide when to escalate for more complex screening. By now, that's down to one time a month, when a heat signature for cobalt-60 or another similar, prohibited substance gives off a large enough measure to worry about. Now 100 percent of containers leaving the port are scanned for radiological material.","zh":"有时警报还是会响。比如一个集装箱显出铯-137的热特征，那就意味着可能有核材料或其他放射性物质。不过也可能是合法的：某家医院也许正在进口一台含核部件的复杂医疗设备，完全合规。查过单证，集装箱便可放行。如果信号不明确，或单证不全，关员须把数据来源和热特征送到国内的核实验室做进一步分析。华盛顿特区的一家实验室实时监控这一切，帮关员判断何时该升级做更复杂的筛查。到如今，这种情况已降到每月一次——某批钴-60或类似违禁物质的热特征强到值得担忧的时候。而现在，出港的集装箱百分之百都要接受放射性物质扫描。"},{"id":"ch02-031","p":36,"t":"p","en":"Then the trucks carrying the off-loaded cargo head out into the complex of railway lines, highway terminals, and airports that surround Elizabeth—from there, feeding the entire eastern seaboard of the United States.","zh":"随后，载着卸下货物的卡车驶入环绕伊丽莎白的铁路网、公路货运站和机场群——再从那里，输往美国整个东海岸。"},{"id":"ch02-032","p":37,"t":"p","en":"Elizabeth exists at the hub of a remarkable concentration of industrial and commercial logistics. Within a short radius of downtown Elizabeth can be found the nation's second-largest port, the main oil and gas pipeline into the American northeast, the world's most vital data cables, two of the nation's busiest airports, NY State Highway 89, the New Jersey Turnpike, several rail yards, and Wall Street.","zh":"伊丽莎白正处在一个工业和商业物流高度密集的枢纽上。以伊丽莎白市中心为圆心，不远处就有全美第二大港、通往美国东北部的主要油气管道、世界上最要紧的数据光缆、全美最繁忙的两座机场、纽约州89号公路、新泽西收费公路、好几处铁路编组场，还有华尔街。"},{"id":"ch02-033","p":37,"t":"p","en":"For more than half a century, New York was the largest port in the world, and by most measures arguably the most important city of the twentieth century. Early in the twenty-first, New York's standing as the largest American container port was lost to Los Angeles/Long Beach—a reflection of the shift in economic weight away from Europe toward Asia, from the transatlantic trade to the transpacific. But New York still plays an outsize role in the global economy, in ways that are directly linked to sea-based flows. Taken as a whole, the port in New York and New Jersey is still one of most important economic pieces of real estate in the entire United States. The port area includes a system of waterways that make up some 650 miles of shoreline in New York City and northern New Jersey, as well as the region's airports. It's the second-largest port by tonnage and the busiest in the US, and it's vital to the most lucrative metropolitan region in the US. In 2018, the port alone imported more than \\$165 billion in value—more, if you count the oil that flows into nearby terminals. That's more than Turkey, South Africa, or Argentina.² The port system itself generates over four hundred thousand jobs, which is enough to employ the entire population of Tampa and more.³","zh":"半个多世纪里，纽约一直是世界上最大的港口，而且无论从哪方面衡量，都算得上20世纪最重要的城市。进入21世纪不久，纽约把全美最大集装箱港的地位让给了洛杉矶／长滩——这反映出经济重心从欧洲转向亚洲，从跨大西洋贸易转向跨太平洋贸易。但纽约仍以与海上物流直接相连的方式，在全球经济中扮演着超乎比例的角色。整体来看，纽约与新泽西港仍是全美国最重要的经济地产之一。港区包含一套水道系统，在纽约市与新泽西北部构成约650英里海岸线，此外还有本地区的机场。按吨位计，它是全美第二大港，也是全美最繁忙的港口，对全美最富庶的大都市区至关重要。2018年，仅这个港口进口的货值就超过1,650亿美元——若把流入附近码头的石油算上，还要更多。这比土耳其、南非或阿根廷的进口额都高。* 港区本身提供了40多万个就业岗位，足以把整个坦帕的人口雇下来还有余。*"},{"id":"ch02-034","p":37,"t":"p","en":"It represents one of a handful of port complexes that anchor American trade. In 2018, the United States imported about \\$2.8 trillion in goods. And while those imports were spread over four hundred seaports, airports, and border crossings, the vast bulk of the imports— more than 60 percent of them—came into the country via one of ten major port complexes.4 Those complexes-in Los Angeles/Long Beach, San Francisco/Oakland, Seattle-Tacoma, Miami-Fort Lauderdale, Laredo Texas, Anchorage, Houston-Sugarland-Baytown, Detroit-Warren-","zh":"它是支撑美国贸易的少数几个港口群之一。2018年，美国进口商品总值约2.8万亿美元。这些进口分散在四百多座海港、机场和陆路口岸，但绝大部分——超过60%——是经由十大港口群之一进入美国的。* 这十个港口群——洛杉矶／长滩、旧金山／奥克兰、西雅图—塔科马、迈阿密—劳德代尔堡、得克萨斯州拉雷多、安克雷奇、休斯敦—舒格兰—贝敦、底特律—沃伦—"},{"id":"ch02-035","p":38,"t":"p","en":"Livonia, and Chicago-Joliet-Naperville-move more than \\$8 billion in goods daily in and out of the American economy. International trade accounts for nearly one-third of the country's entire GDP. And as we'll see at the end of Part II, that actually understates the importance of sea-based trade to the American economy, or to America's leadership role in the world.","zh":"利沃尼亚，以及芝加哥—乔利埃特—内珀维尔——每天进出美国经济的货物价值超过80亿美元。国际贸易占美国全部GDP的近三分之一。而我们在第二部结尾将会看到，这个数字其实还低估了海上贸易对美国经济、对美国在世界上的领导地位的重要性。"},{"id":"ch02-036","p":38,"t":"p","en":"Also: a little-understood role of modern shipping ports is that they are critical to major airports, too. Jets require very specific types of fuel, unsurprisingly collectively known as jet fuel. The supply of fuel for JFK, LaGuardia, and Newark airports, which combined represent the largest airport system in the United States, predominantly comes through Kill van Kull to oil terminals in New Jersey and New York.","zh":"还有一点：现代航运港口有个鲜为人知的作用——它们对大型机场同样生死攸关。喷气式飞机需要特定种类的燃料，不出所料，这类燃料统称航空燃油。肯尼迪、拉瓜迪亚和纽瓦克三座机场合起来构成全美最大的机场系统，其燃油供应主要通过基尔范库尔水道（Kill van Kull）运抵新泽西和纽约的石油码头。"},{"id":"ch02-037","p":38,"t":"p","en":"All of this matters to New York, to the eastern seaboard of the United States, and to the entire American economy. But New York's port is vital in ways that extend far beyond its economic impact. It's a key hub in one of the most far-reaching and penetrating forms of American power—a system of trade intelligence and security that projects into the territories of dozens of countries worldwide with the goal of extending the American border outward; in the words of Customs and Border Protection, the objective is to \"extend the zone of security outward so that American borders are the last line of defense, not the first.\"5","zh":"这一切对纽约、对美国东海岸、对整个美国经济都事关重大。但纽约港的重要性远不止于经济影响。它是美国投射得最远、渗透最深的一种力量的关键枢纽——一套贸易情报与安全体系。这套体系伸进全球几十个国家的领土，为的是把美国边界向外推；用海关与边境保护局（CBP）的话说，目标是“把安全区向外扩展，让美国边界成为最后一道防线，而不是第一道”。*"},{"id":"ch02-038","p":38,"t":"h","en":"The Second Perimeter: Coast Guard Station New York","zh":"第二道外围：纽约的海岸警卫队站"},{"id":"ch02-039","p":38,"t":"p","en":"Jason Tama is in his midforties, with a wife and two young girls who occupy him when he's not surfing or skiing on the weekends, or cycling to and from his twelve-hour-a-day job in Staten Island, home to the main Coast Guard base for New York Harbor. Born in Maryland, near Annapolis, he's spent his entire adult life in the Coast Guard. His father worked as a civilian in the navy, and from both the surrounding geography and his father's influence, a life of service and a life at sea both came naturally. He was interested in both the navy and Coast Guard, but his father, despite his own path, convinced him to pursue the Coast Guard option-he thought his son would prefer the smaller service and the peacetime mission. A few weeks after graduating high school, at age seventeen, he reported to the US Coast Guard Academy in New London, Connecticut. Tama then served on ship and at shore, as well as in the DC headquarters, for twenty years. He took a master's degree in naval architecture from UC Berkeley and an MBA from the Sloan School of Management at MIT. He was then deployed as the Coast Guard's chief prevention officer in San Francisco.","zh":"贾森·塔马（Jason Tama）四十来岁，有妻子和两个小女儿。周末不去冲浪、滑雪，或者骑车往返斯塔滕岛那份一天12小时的工作时，他的时间都给了她们。斯塔滕岛是纽约港海岸警卫队主要基地所在地。他生于马里兰州安纳波利斯附近，成年后的全部岁月都在海岸警卫队度过。父亲是海军的文职人员；受周遭环境与父亲的双重影响，从军与航海这两条路对他都顺理成章。他对海军和海岸警卫队都有兴趣，但父亲尽管自己走的是海军一路，却劝儿子选海岸警卫队——他觉得儿子会更喜欢这支规模更小的部队和和平时期的使命。高中毕业几周后，17岁的他到康涅狄格州新伦敦的美国海岸警卫队学院报到。此后20年，塔马在舰上、岸上以及华盛顿总部任职。他在加州大学伯克利分校取得船舶工程硕士学位，又在麻省理工学院斯隆管理学院读了MBA。之后被派往旧金山，担任海岸警卫队预防事务主管。"},{"id":"ch02-040","p":39,"t":"p","en":"In 2018, he was assigned as the captain of the Port of New York and New Jersey. From there, he was tasked to oversee every aspect of the Coast Guard's maritime safety, security, and environmental protection operations in the huge harbor, with approximately six hundred uniformed Coast Guard personnel under his command, as well as three hundred reservists and one hundred civilians. That included overseeing the blandly named Vessel Traffic Service—in reality, a war room that monitors the flow of commercial, naval, and recreational vessels in and out of New York Harbor: one vessel every eight minutes, 24/7; four thousand vessels every month, in addition to the hundreds of daily ferry transits crisscrossing the harbor.","zh":"2018年，他受命出任纽约与新泽西港的港务指挥官（Captain of the Port）。在这个职位上，他负责监管这座巨型港口内海岸警卫队的海上安全、治安和环境保护等各方面行动，麾下有约600名穿制服的海岸警卫队人员，另有300名预备役和100名文职人员。其中也包括那个名字平淡无奇的「船舶交通服务」——实际上是一间作战室，监控商船、军舰和休闲船只进出纽约港的动态：每8分钟一艘，全天候不间断；每月4,000艘，此外每天还有数百班渡轮在港内穿梭往返。"},{"id":"ch02-041","p":39,"t":"p","en":"Sit in Captain Tama's office for more than a few minutes and you're likely to witness him fulfilling his most important duty. His cell phone rings and he listens patiently to his deputy commander or watch chief at the other end of the line. He asks a clarifying question and listens to the answer. And then he says decisively, “I concur.\" He's just issued a “Captain of the Port Order.\" And in doing so, he's wielded a nearabsolute authority, one that can't be overturned by the commandant of the Coast Guard, the secretary of Homeland Security, or even the president of the United States.","zh":"在塔马上校的办公室坐上一会儿，你多半就会看到他履行自己最重要的职责。手机响了，他耐心听完电话那头的副指挥官或值班长讲话，问一个澄清性的问题，再听完回答。然后他干脆地说一句：「我同意。」就这样，他签发了一道「港务指挥官令」。而这一签，他行使的是一种近乎绝对的权力——海岸警卫队司令、国土安全部长，甚至美国总统，都无法推翻。"},{"id":"ch02-042","p":39,"t":"p","en":"His Captain of the Port authorities go back to an incident in New York Harbor in July 1916, when a bomb was detonated in a stockpile of weapons on barges off Black Tom Island, just off the coast of Jersey City. The bomb destroyed a huge cache of weapons, over 2 million pounds of ammunitions, destined for a WWI resupply of the Allies. The explosion damaged the Statue of Liberty, buildings in Jersey City a mile away, and shook the Brooklyn Bridge. The shock wave was felt as far away as Philadelphia. It was the most important act of German espionage inside the United States during the war. The Black Tom incident led Congress to pass the Espionage Act of 1917, which for the first time established a domestic intelligence capacity for the United States. It also gave port captains sweeping powers to secure their ports.","zh":"他这份港务指挥官权限，可以追溯到1916年7月纽约港的一起事件。泽西市近岸的布莱克汤姆岛（Black Tom Island）外，停泊的驳船上堆着军火，一枚炸弹在其中引爆。那批军火是运给协约国、用于一战补给的，超过200万磅（约900吨）弹药，尽数被毁。爆炸震坏了自由女神像，震碎了1英里外泽西市的建筑，连布鲁克林大桥都晃动了，冲击波一直传到费城。这是战时德国在美国境内最重要的一次间谍行动。布莱克汤姆事件促使国会通过1917年《反间谍法》，美国由此第一次建立起本土情报能力；该法同时赋予各港港务指挥官保卫港口的广泛权力。"},{"id":"ch02-043","p":40,"t":"p","en":"For nearly a century, those authorities remained largely unchanged. Until 9/11. After that set of attacks, the fears of terrorists or rogue states using ships to smuggle weapons of mass destruction or related material into major cities caused Congress to pass an additional law, the federal Maritime Transportation Security Act of 2002. It took Captain Tama's substantial powers and expanded them. Indeed, it put him in the middle of a global web of intelligence collection and security operations.","zh":"近百年来，这些权限基本未变。直到9·11。那场袭击之后，人们担心恐怖分子或无赖国家利用船舶，把大规模杀伤性武器或相关材料偷运进大城市，国会因此又通过一部法律——2002年联邦《海上运输安全法》。它接过塔马手中本已可观的权力，再加扩充。事实上，它把他放到了全球情报搜集与安全行动网络的中心。"},{"id":"ch02-044","p":40,"t":"p","en":"In times past, the reach and authority of a Coast Guard captain was limited to the physical terrain of the port itself and the immediately surrounding waters. Given advanced warning of an illegal shipment or smuggling operation, the Coast Guard could interdict a ship just before it entered the port itself. More commonly, ships were inspected once they were already docked in harbor. Now the world's major ports are plugged into a twenty-four-hour-a-day web of information technology that connects hundreds of ports in dozens of countries into a single system of information designed to provide security to global trade.","zh":"过去，海岸警卫队港务指挥官的管辖范围和权限，只限于港口本身的水域及紧邻海域。若提前得到非法货运或走私行动的情报，海岸警卫队可以在船只即将进港时将其拦下。更常见的情形是，等船靠好码头再登船检查。如今，世界各大港口都接入了一张24小时运转的信息技术网络，把几十个国家的数百个港口连成一个信息系统，为全球贸易提供安全保障。"},{"id":"ch02-045","p":40,"t":"p","en":"If the radiation monitoring portal or the Centralized Examination Station in Elizabeth are the innermost layers of defense for American trade, then the most carefully guarded layer is the second—the entrance to New York Harbor. To protect it, the US Coast Guard, in close coordination with CBP, runs a worldwide program that requires ships to identify themselves and file vital information far offshore from the entrance to the harbor. From two hundred miles offshore, or ninetysix hours before docking, any ship wanting to enter an American port has to file with the Coast Guard what's known as an Advance Notice of Arrival (NOA). It lays out for the US authorities critical data they need to assess whether the ship poses a threat, or can be safely allowed into harbor. On its face, the document is innocuous enough: a simple list of ports of call, of crew members, and of the recorded contents of the cargo. In fact, it triggers a complex set of legal and operational authorities with global, national, and local law enforcement capacities.","zh":"如果说伊丽莎白的辐射监测门架和集中查验站是美国贸易最内层的防线，那么把守最严的是第二层——纽约港的入口。为守住这一层，美国海岸警卫队与海关与边境保护局密切协作，运行一项全球性计划：要求船只在离港口入口很远的海域就表明身份、报送关键信息。凡是想进入美国港口的船只，都必须在离岸200英里、或进港前96小时，向海岸警卫队提交所谓的「到港预先通知」（Advance Notice of Arrival，NOA）。这份文件向美方提供评估所需的关键数据：该船是否构成威胁，能否安全放行入港。表面看，它平淡无奇：无非一份挂靠港清单、一份船员名单，一份所载货物的记录。可实际上，它调动起的是一整套复杂的法律与行动权限，涉及全球、全国和地方三级执法能力。"},{"id":"ch02-046","p":40,"t":"p","en":"One of the most important pieces of information on the NOA is the name of the last five ports in which the ship had docked. Those ports or the countries where they are located can ring an alarm bell if they are among the several dozen ports tracked by the US intelligence community—a list that is continuously updated and closely guarded. A combination of the NOA and intelligence flows come together in Captain Tama's office. Every single ship that enters the harbor has to pass by the scrutiny of his team.6 If the port in question is on the watch list, or anything else about the NOA rings an alarm bell, Captain Tama issues a Captain of the Port Order and the Coast Guard swings into action. The ship is halted off the coast of New York, and a Coast Guard vessel motors out at high speed to intercept the ship prior to it passing through the Narrows.","zh":"到港预先通知上最重要的信息之一，是船只最近挂靠的五个港口。只要其中有港口——或港口所在国——出现在美国情报界追踪的几十个港口名单上，警报就会响起；这份名单不断更新，严格保密。预先通知与各方情报，在塔马的办公室里汇到一处。每一艘进港的船，都要过他这班人这一关。* 如果所涉港口在黑名单上，或者通知里别处有可疑之处，塔马就签发港务指挥官令，海岸警卫队随即行动。船在纽约外海被叫停，一艘海岸警卫队快艇高速驶出，赶在它穿过纳罗斯水道（The Narrows）之前实施拦截。"},{"id":"ch02-047","p":41,"t":"p","en":"The coordinated gathering and sharing of intelligence between the Coast Guard, CBP, and other law enforcement agencies has resulted in some huge seizures in ports across the country. For example: the largest cocaine bust in the history of US enforcement was three thousand pounds seized off the container ship MSC Carlotta, sailing up from Guyana. Based on local intelligence, the Coast Guard and local CBP agents boarded the ship as it was entering the Port of Philadelphia. They found forty thousand bags of cocaine hidden among hundreds of containers spread around the ship.","zh":"海岸警卫队、海关与边境保护局及其他执法机构协同搜集、共享情报，让全美各地港口屡破大案。例如：美国执法史上最大的一宗可卡因案，是在从圭亚那驶来的集装箱船「MSC 卡洛塔」号上查获的3,000磅可卡因。依据当地情报，海岸警卫队与CBP探员在该船驶入费城港时登船，从散布全船的数百个集装箱当中，搜出4万袋藏匿的可卡因。"},{"id":"ch02-048","p":41,"t":"h","en":"The Outer Layers","zh":"更外一层的防线"},{"id":"ch02-049","p":41,"t":"p","en":"For a ship to leave an overseas port and head toward Captain Tama's port, it has already passed another layer of security. After 9/11, with enhanced fears about terrorist smuggling, the US adopted what's known as the Container Security Initiative (CSI), a system of port inspections, scanning methods, intelligence collection, and monitoring of port compliance that operates far beyond American borders. Fastforward to 2019, and fully 80 percent of the goods imported into the United States by sea come to the US from a port that's participating in the CSI program. That includes all the major European ports, plus the main ports in Korea, Singapore, Japan, and even China. CSI, enabled by Congress's Fair Trade Act of 2007, requires any container or bulk cargo carrier seeking to sail toward an American port to disclose the manufacturer, seller, buyer, and destination; the location where the container was filled; the consolidator; the importer of record; the country of origin; tariff data; the vessel stow plan; and any and all updates on the status of the container. Seen in comparison to, say, the transport of people and goods by plane, this system seems mundane, obvious; but it brought a revolution in transparency to the opaque and under-regulated world of shipping.","zh":"一艘船从海外港口启航、驶向塔马的港口之前，先已过了另一道关口。9·11之后，出于对恐怖分子走私的深切担忧，美国推行所谓的「集装箱安全倡议」（Container Security Initiative，CSI）：一套在远超美国国界之外运作的港口检查、扫描方式、情报搜集与合规监督体系。到2019年，美国经海路进口的货物中，足足80%来自参与CSI计划的港口，涵盖欧洲所有主要港口，以及韩国、新加坡、日本乃至中国的主要港口。CSI依国会2007年《公平贸易法》授权，要求任何驶往美国港口的集装箱或散货承运人披露制造商、卖方、买方和目的地，装箱地点、拼箱人、登记进口商、原产地、关税数据、船舶配载图，以及关于该箱状态的任何及全部更新。与空运人员和货物相比，这套制度似乎平淡无奇、理所当然；但它给原本不透明、监管不足的航运业带来了一场透明化革命。"},{"id":"ch02-050","p":42,"t":"p","en":"And in real terms it means that US Coast Guard and Customs and Border Protection agents are stationed inside the port operations of the dozens of participating countries. They are constantly developing sources of information about potential smuggling operations-of humans, of drugs, of weapons—and can flag a specific cargo or a specific ship before it leaves a foreign port. If they don't give the ship a clean bill of health, it can't sail out of the port—at least not until it files a non-American destination. As Tama says, \"Using big data and intelligence we can analyze threats much, much further up the supply chain.\"","zh":"落到实处，这意味着美国海岸警卫队和海关与边境保护局的探员，就驻在几十个参与国的港口作业区里。他们不断开辟情报来源，掌握人口、毒品、武器走私的潜在动向，从而能在某批货或某条船离开外国港口之前就把它标出来。若他们不给这艘船「体检合格」，它就出不了港——至少，在它改报一个非美国的目的港之前不行。正如塔马所说：“借助大数据和情报，我们可以把威胁分析一直追溯到供应链上远得多、远得多的上游。”"},{"id":"ch02-051","p":42,"t":"p","en":"The program is also designed to provide the US intelligence and Coast Guard communities with up-to-date information about the status of the security in ports worldwide and the question of whether a port captain can have confidence in the manifest of the ship that has emerged from suspect ports. The list of ports and countries subject to the watch list is closely guarded, but it would be no surprise if North Korea's Pyongyang were on the list, as well as Iran's Caspian Sea ports, and probably the Pakistani ports of Gwadar and Karachi.","zh":"这项计划还意在让美国情报界和海岸警卫队随时掌握世界各地港口的安全状况，并回答一个问题：一艘从可疑港口驶出的船，其舱单是否可信。受监控的港口与国家名单严格保密，但朝鲜平壤、伊朗的里海港口，以及巴基斯坦的瓜达尔港和卡拉奇港很可能都在其中——这并不令人意外。"},{"id":"ch02-052","p":42,"t":"p","en":"If intelligence is received that gives the US authorities pause or concern, they can issue a \"Do Not Load\" order. This means that the container in question can't be loaded onto its intended ship. Of course, the United States can't physically block the loading of the cargo or the departure of the ship, but such a ship would never get anywhere near American shores—and the ship operator and cargo facilitator would find themselves subject to fines and extensive legal action in the US courts. And the shipowner would likely be barred from exporting to American ports. Denial of access to the vast American market is the kiss of death for any global manufacturer, so this is an imposing power.","zh":"一旦收到让美方迟疑或担忧的情报，他们可以下达「禁止装船」令。这就是说，涉事集装箱不得装上原定船舶。当然，美国无法在物理上阻止货物装船或船舶离港，但这样一艘船永远别想靠近美国海岸——船东和货运中介还会在美国法院吃上罚款和大量官司。船东多半也会被禁止向美国港口出口。对任何一家全球制造商而言，被挡在庞大的美国市场之外就是死路一条，所以这是一项令人生畏的权力。"},{"id":"ch02-053","p":42,"t":"p","en":"These programs give the United States concrete tools to secure trade flows worldwide. They reflect a deep American security concept, one whose roots lie in the earliest days of the American Republic and the formation of the US Navy. It's the concept of “playing the away game\"—that is, taking the fight to the enemies' shore so we don't have to fight on American soil. It's a concept of American foreign policy that has its roots at sea—as we'll see in chapter 3—and an astonishing conceptual extension of American might.","zh":"这些计划为美国提供了保障全球贸易畅通的具体工具。它们体现着一种深植于美国的安全观念，其根源可追溯到共和国初建、美国海军组建的年代。这就是「打客场」的观念——把仗打到敌人的海岸上去，免得在美国本土开战。这一美国外交政策观念植根于海洋——我们将在第3章看到——也是美国实力在观念上一次惊人的延伸。"},{"id":"ch02-054","p":43,"t":"p","en":"And these programs have this other effect: they put the American navy on patrol worldwide.","zh":"这些计划还有另一重效果：它们让美国海军在全世界巡逻。"},{"id":"ch02-055","p":43,"t":"h","en":"Sailing the Outer Perimeter","zh":"在外围防线上航行"},{"id":"ch02-056","p":43,"t":"p","en":"The largest hub of trade in the world is China. From ports outside Hong Kong, Shanghai, and Beijing, container vessels and tankers and cargo ships of every description sail east across the Pacific to Los Angeles and Seattle and Vancouver, or south to cross to the Indian Ocean en route to ports in Europe and the eastern United States. But a small number of ships do something very different. They turn off their locator beacons and head north for just over five hundred nautical miles, where they bunker off the boundary waters of North Korea. These are the sanctions busters: a form of modern-day smugglers, often private, sometimes state backed, who sell goods or weapons to a country that's been placed under sanctions. In this case, the target of the sanctions is the Democratic People's Republic of Korea: North Korea, the Hermit Kingdom, a country largely sealed off from the rest of the world by its own Orwellian government, and now also by multiple different sanctions imposed by the US and the United Nations. The sanctions were imposed both as punishment for its development of nuclear weapons, against rules set out in key international treaties, and to prevent North Korea from importing the materials or fuel to develop more.","zh":"世界上最大的贸易枢纽是中国。从香港、上海、北京周边的港口出发，集装箱船、油轮和形形色色的货船向东横渡太平洋，驶往洛杉矶、西雅图、温哥华；或者向南进入印度洋，转往欧洲和美国东部的港口。但有少数船只做的事截然不同。它们关闭定位信标，一路向北，航行五百多海里，在朝鲜界外海域加油。这就是「突破制裁者」：现代版的走私客，多为私营，有时有国家撑腰，把货物或武器卖给受制裁的国家。这一次的制裁对象是朝鲜民主主义人民共和国：朝鲜，「隐士之国」，一个被自己那套奥威尔式政府与世界隔绝的国家，如今又被美国和联合国施加的多重制裁层层封死。实施制裁，既是对它违反重要国际条约规定、发展核武器的惩罚，也是为了防止它进口用于继续发展的材料或燃料。"},{"id":"ch02-057","p":43,"t":"p","en":"The sanctions also prohibit the country from selling the shrimp, rice, minerals, and light manufactured goods that the country produces, and from importing manufactured goods, weapons components, and fuel. That is, all but a small supply of fuel, enough to heat its population, not enough to power its industry. That's where the smugglers come in. Ships sail out of the Yangtze River, or ports north closer to Beijing, and cross the Yellow Sea, usually under cover of dark. From reports from defectors, and by piecing together evidence from smugglers who have been caught, it seems that many of these ships sail to just over twelve miles off the North Korean coast, where they anchor in what are still technically international waters. Then they wait until local merchant ships steam out to meet them. The two ships then transfer their loads of coal or other fuels, which are then transported to land. It's estimated that by these means North Korea manages to smuggle roughly five times as much coal and other fuel as it is allowed under the sanctions.","zh":"制裁还禁止朝鲜出售本国出产的虾、大米、矿产和轻工产品，也禁止它进口工业制成品、武器部件和燃料——只留一小部分燃料，够给民众取暖，不够开动工业。走私客的空间就在这里。船只从长江或更靠北、离北京更近的港口出海，通常趁夜色横渡黄海。根据脱北者的讲述，再拼合被抓走私者的供述，可以看出：许多船开到离朝鲜海岸刚过12海里的地方抛锚，那里在技术上仍属国际水域。然后它们等着当地商船驶出来会合。两船过驳煤炭或其他燃料，再由商船运上岸。据估计，靠这些手段，朝鲜走私进来的煤炭和其他燃料约为制裁允许量的五倍。"},{"id":"ch02-058","p":44,"t":"p","en":"Smuggling coal is one thing, smuggling weapons is another. In 2003, North Korea was caught doing just that. Early that year, the US intelligence community got wind of the fact that North Korea was smuggling rockets to ports in Yemen, in the Arabian Gulf, at that time an incipient stronghold of an ISIS affiliate. US agents managed to track down the So San, a North Korean-owned ship, as it was sailing through Spanish waters. The director for arms control at the State Department, none other than the feisty John Bolton, wanted to intercept the shipment. At the request of the US authorities, the Spanish naval frigate Navarra attempted to board the So San, which in turn tried to flee. The Navarra sent a shot across the bows and raked the stern of the So San with rifle fire, at which point the So San complied with the order to halt. The Spanish navy boarded the ship. And there, as warned, they found fifteen Scud missiles.","zh":"走私煤炭是一回事，走私武器是另一回事。2003年，朝鲜就在这上头被逮了个正着。那年年初，美国情报界获知，朝鲜正把火箭弹走私到也门的港口——也门位于阿拉伯湾，当时那里正逐渐成为「伊斯兰国」一个分支的据点。美方探员追踪到一艘朝鲜籍货船「So San」号正驶经西班牙海域。国务院负责军备控制的官员不是别人，正是脾气火爆的约翰·博尔顿，他想把这批货拦下来。应美方要求，西班牙海军「纳瓦拉」号护卫舰试图登上「So San」号，对方却掉头逃跑。「纳瓦拉」号朝其船首前方鸣炮示警，又用步枪扫射船尾，这时「So San」号才服从停船命令。西班牙海军登船搜查，果然如情报所言，发现了15枚「飞毛腿」导弹。"},{"id":"ch02-059","p":44,"t":"p","en":"Bolton asked the State Department's lawyers to let him know which part of international law allowed him to seize these smuggled weapons. To his surprise the answer was \"None.\" It wasn't illegal to smuggle the weapons on the lawless high seas, and Spanish and American lawyers determined that they had no legal basis to seize the weapons. Eventually, the missiles were allowed to proceed to Yemen.*","zh":"博尔顿请国务院的律师告诉他：国际法哪一条允许他扣押这批走私武器？令他意外的是，答案是「没有」。在无法无天的公海上走私武器并不违法；西班牙和美国的律师认定，他们没有扣押这批武器的法律依据。最终，导弹获准继续运往也门。*"},{"id":"ch02-060","p":44,"t":"p","en":"Bolton, furious, decided to remedy the situation. Building on the launch of the Container Security Initiative, the US called several allies together to join what became known as the Proliferation Security Initiative (PSI). Its signatories agreed not to use ships on the high seas to smuggle weapons. But more important, they agreed to allow the","zh":"博尔顿大为恼火，决意改变这一局面。在启动集装箱安全倡议的基础上，美国召集若干盟国，共同加入后来所称的「防扩散安全倡议」（Proliferation Security Initiative，PSI）。各签署国承诺，不利用公海船舶走私武器。更重要的是，它们同意允许"},{"id":"ch02-061","p":44,"t":"n","en":"The US first got assurances from the Yemeni authorities that the missiles would be used for defensive purposes only. That held until 2015, when the missiles were used in attacks by Houthi rebels against Saudi Arabia.","zh":"美方事先得到也门当局的保证，这批导弹仅用于防御目的。这一承诺维持到2015年——胡塞武装用这些导弹袭击了沙特阿拉伯。"},{"id":"ch02-062","p":45,"t":"p","en":"United States, or another country with a claim, to board ships flying under their flags\" if they were suspected of smuggling weapons of mass destruction or WMD-related material. PSI has been in operation ever since—used by American, German, Spanish, and other naval powers to intercept suspicious flows at sea.","zh":"美国或其他有管辖主张的国家，登临悬挂本国国旗的船舶——只要该船被怀疑走私大规模杀伤性武器或相关材料。PSI自那时起一直运作至今——美国、德国、西班牙等海上强国用它拦截海上的可疑货运。"},{"id":"ch02-063","p":45,"t":"p","en":"These programs reflected the reality of the second decade after the end of the Cold War: that the United States was the undisputed leader of the international system, both architect and anchor of most international security arrangements, and in the leadership role to protect the flow of trade—above all, at sea. The Container Security Initiative reflected the long reach of the American market, and the ability of the United States to wield its market power to great effect. The Proliferation Security Initiative reflected a dual reality—that the United States alone operated a global blue-water navy, which sailed unchallenged; but that it used that navy, in part, at least, to enforce the rules and norms of open trade on the seas and to enforce decisions of the UN Security Council when other countries were abusing that open system. This notion of the navy as the guarantor of freedom of the seas was inherited from Britain's Royal Navy—one of the main legacies passed from that former imperial power to the United States in the wake of World War II.","zh":"这些计划反映出冷战结束后第二个十年的现实：美国是国际体系无可争议的领导者，是大多数国际安全安排的设计者与支柱，并承担着保护贸易流通的领导角色——首先是在海上。集装箱安全倡议体现了美国市场的长远触角，以及美国运用市场权力取得巨大效果的能力。防扩散安全倡议则体现了一种双重现实：只有美国拥有一支全球性蓝水海军，航行于各大洋而未逢对手；但它动用这支海军，至少部分是为了在海上执行开放贸易的规则与规范，并在其他国家滥用这一开放体系时，执行联合国安理会的决议。把海军视为海洋自由担保者的观念，承自英国皇家海军——那是这个前帝国强权在二战之后留给美国的主要遗产之一。"},{"id":"ch02-064","p":45,"t":"h","en":"A Sea of Data","zh":"一片数据的汪洋"},{"id":"ch02-065","p":45,"t":"p","en":"All these programs rely on the constant and massive flow of data. But what happens if that data gets hacked? In 2019, Captain Tama was the","zh":"所有这些计划都依赖持续而海量的数据流。可要是这些数据被黑客攻破，会怎样？2019年，塔马上校成了"},{"id":"ch02-066","p":45,"t":"p","en":"*“Flving under their flag\": one of the oddities of international maritime law is that ships can fly the flag of any country that allows what's known as “registration of convenience.\" A ship can be owned by an American company, operated by a Dutch marine operator, sailed by an Indian crew, be sailing between Britain and South Africa, carrying Chinese, Japanese, and Thai goods; but for legal purposes can be registered in the Bahamas, or St. Kitts, or in any one of more than a dozen countries that allows the practice. This explains why the three countries in the world that lead with the number of ships registered to them are Panama, Liberia, and the Marshall Islands—countries with a combined population of circa 8 million. The business of assigning these “flags“ is managed by the United States, specifically the straightforwardly named American Committee for Flags of Necessity.","zh":"*「悬挂他们的国旗」：国际海事法的一桩怪事是，船舶可以悬挂任何允许「方便登记」的国家的国旗。一艘船可以属美国公司所有，由荷兰船舶运营商经营，由印度船员驾驶，航行于英国与南非之间，装载中国、日本和泰国的货物；但在法律上，它可以注册在巴哈马、圣基茨，或十多个允许此种做法的国家中的任何一个。这就能解释，为什么全球注册船舶数量最多的三个国家是巴拿马、利比里亚和马绍尔群岛——三国人口加起来约800万。分配这些「船旗」的生意由美国掌管，具体机构的名字一语道破：美国「必需船旗」委员会（American Committee for Flags of Necessity）。"},{"id":"ch02-067","p":46,"t":"p","en":"first American port commander to board a ship on the basis of concerns about a cyber hack.","zh":"第一位因担心网络入侵而登船检查的美国港务指挥官。"},{"id":"ch02-068","p":46,"t":"p","en":"In February, a US-flagged container vessel filing its NOA en route to New York, verbally alerted the port that it believed that its data operations might have been penetrated by cyber espionage or interference. The NOA told Tama's team that the ship had docked in some high-risk ports in Asia and the Middle East and was transporting, among many other things, cargo for the Department of Defense. Now that they were reporting a potential hack, their route and cargo were points of serious concern. What was the intent? Was a state with adversarial intent seeking to gain control of the ship, or compromise its IT and navigation systems? Did terrorists want to ram the ship into the Verrazzano bridge and block the harbor, thereby disrupting a huge portion of the American economy?","zh":"2月，一艘悬挂美国国旗的集装箱船在驶往纽约途中提交到港预先通知，并口头向港口示警：该船认为，其数据系统可能已遭网络间谍活动或干扰侵入。通知告诉塔马的团队，这艘船曾挂靠亚洲和中东的几个高风险港口，所载货物中包括运给国防部的物资。既然它报告了可能被黑，它的航线和货物就成了严重关切之点。对方意图何在？是某个怀有敌意的国家想夺取该船的控制权，或破坏其信息技术与导航系统？还是恐怖分子想把船撞向韦拉扎诺海峡大桥、堵死港口，从而扰乱美国经济的一大块？"},{"id":"ch02-069","p":46,"t":"p","en":"Tama contacted the Coast Guard's nascent Cyber Protection Team, as well as the New York FBI's Cyber Task Force. Together—and with the ship's consent—they boarded it to investigate.","zh":"塔马联系了海岸警卫队新近成立的网络保护小组，也联系了联邦调查局纽约分部的网络特别工作组。三方会合，经船方同意，登船调查。"},{"id":"ch02-070","p":46,"t":"p","en":"Tama was well trained for this operation. When serving in San Francisco, he frequently came into contact with executives from technology firms looking to develop projects in the harbor or off the coast of the Bay Area. When he returned to Washington, DC, he spent a stint developing recommendations to help the Coast Guard deepen their interactions with the West Coast tech firms, in large part to buttress cyber security.","zh":"塔马受过良好训练，足以胜任这次行动。在旧金山任职时，他常与科技公司的高管打交道——那些人正想在港内或湾区近海开发项目。调回华盛顿特区后，他又花了一段时间撰写建议，帮海岸警卫队加强与西海岸科技企业的往来，很大一部分用意就是加固网络安全。"},{"id":"ch02-071","p":46,"t":"p","en":"In theory, many of the critical navigation systems of any ship entering New York Harbor are delinked from vulnerable networks to prevent hacking. But in practice, ships' crews, like all the rest of us, do not practice good cyber hygiene. When ships near ports, they need to communicate with the authorities, file records, and requisition supplies of fuel, food, water, and other goods. All this happens electronically. In the galley where the first officer of a ship works the bill of lading and oversees the onboarding and off-boarding of crew and containers, there may be dozens of thumb drives containing the relevant files from ports all over the world. These are routinely plugged into USB drives on the ship's operating system. The software that drives those gets automatic updates. And the notion that all of those updates are free from penetration is self-evidently false. On board the ship that reported the cyber hack, Tama and his team found an entire drawerful of thumb drives from ports all over the world, including from some on the Coast Guard's watch list.","zh":"理论上，任何驶入纽约港的船舶，其许多关键导航系统都与易受攻击的网络断开连接，以防被黑。可实际上，船上的船员和我们所有人一样，并不讲究网络卫生。船靠近港口时，要与当局联络、报送记录、申领燃油、食品、淡水和其他物资，这一切都在电子系统上完成。在船上那间兼作办公的舱室里，大副处理提单、监管船员上下船和集装箱进出，那里可能放着几十只U盘，装着来自世界各地港口的文件。这些U盘常被插进船舶操作系统的USB接口。驱动这些系统的软件会自动更新。而要说这些更新全都干净、没被人渗透，显然不成立。在那艘报告遭网络攻击的船上，塔马和团队搜出整整一抽屉U盘，来自世界各地的港口，其中有些港口就在海岸警卫队的监控名单上。"},{"id":"ch02-072","p":47,"t":"p","en":"In the end, software diagnostics proved that the ship had not been hacked by a malign nation, but simply infected by a piece of malware known as Emotet that had been attacking government institutions and corporations around the US. It seemed likely that the ship had not been deliberately targeted, but randomly infected. Still, it was a wakeup call for the marine industry, and for the Coast Guard.","zh":"最终，软件诊断证明：这艘船并非被某个怀有恶意的国家攻破，只是感染了一款名为「埃莫特」（Emotet）的恶意软件——它当时正在攻击美国各地的政府机关和企业。看来这艘船并非被刻意锁定，只是被随机感染。但对航运业、对海岸警卫队来说，这仍是一记警钟。"},{"id":"ch02-073","p":47,"t":"p","en":"A critical part of the data that ships use is what's known as the Automatic Identification System. The AIS is a post-9/11 innovation that requires ships to continuously transmit vital information like their position, their name, their size, their type of ship, their course, their speed, their cargo, their crew, and so on. Twenty or so pieces of basic information about every one of the ninety thousand ships that are sailing at any given time, all of it updated every minute, meaning that in a single day just over 2.5 billion pieces of data are flowing through the AIS, or more than 950 billion pieces of data per year. All of which can be penetrated by cyber hacks.","zh":"船舶所用数据中，有一个关键部分叫「船舶自动识别系统」（AIS）。AIS 是「9·11」之后的产物，它要求船舶持续发送自身的要害信息：位置、船名、尺寸、船型、航向、航速、所载货物、船员人数等等。任意时刻在航的船舶有9万艘，每艘约20项基本信息，且每分钟全部刷新一遍——也就是说，一天就有超过25亿条数据流经 AIS，一年超过9,500亿条。而这一切，都可能被网络攻击穿透。"},{"id":"ch02-074","p":47,"t":"p","en":"The biggest hack on shipping to date occurred on the afternoon of June 27, 2017.7 Maersk employees in Copenhagen began to panic as one after another of their computer screens turned black. Earlier that year, hackers connected with the Russian military had hijacked the servers of a small, family-run software business in Ukraine, and in June, they used the back door they'd created to release a piece of malware called NotPetya. NotPetya spread like wildfire, attacking automatically and indiscriminately. It crippled companies across the globe—not just giants like Maersk, but also Merck, FedEx's European subsidiary TNT Express, and Rosneft. The hack hit more than sixty countries in Europe, the US, and beyond, and resulted in more than \\$10 billion in damages.8","zh":"迄今为止针对航运业最大的一次黑客攻击，发生在2017年6月27日下午。* 哥本哈根的马士基员工眼看着屏幕一块接一块变黑，恐慌蔓延开来。那年早些时候，与俄罗斯军方有关联的黑客劫持了乌克兰一家小型家族软件企业的服务器；6月，他们利用自己留下的后门，释放出一款名为「诺特佩蒂亚」（NotPetya）的恶意软件。NotPetya 像野火般扩散，自动攻击，不分对象。全球各地的公司接连瘫痪——不只是马士基这样的巨头，还有默克、联邦快递的欧洲子公司 TNT 快递，以及俄罗斯石油公司（Rosneft）。攻击波及欧洲、美国等60多个国家，造成的损失超过100亿美元。*"},{"id":"ch02-075","p":47,"t":"p","en":"The impact for Maersk reached across the world. In Port Elizabeth, where Jason Tama would arrive one year later, hundreds of truck drivers were stalled outside the port as the system that allowed them to come in and drop off their wares for shipping went black. Rail lines up and down the eastern seaboard were halted while they waited for cargo. No one could get in the gate. With no word from Maersk, the Port Authority announced that Maersk's terminal would close for the rest of the day. Shippers were stuck clamoring for either last-minute, expensive alternative shipping methods or temporary storage until the mess cleared. The same would happen at sixteen of Maersk's other loading terminals across the world.","zh":"马士基所受的冲击遍及全球。在伊丽莎白港——一年后贾森·塔马将到任的地方——数百名卡车司机堵在港外，因为允许他们进港卸货交运的系统已经变黑。东海岸沿线的铁路停摆，等着接货。谁也进不了闸门。马士基那边一直没有消息，港务局只好宣布其码头当天余下时间关闭。货主们急得四处奔走，要么临时改走昂贵得多的其他运输方式，要么另找地方暂存，等这摊乱局收拾干净。马士基在全球另外16个装货码头也是同样的情形。"},{"id":"ch02-076","p":48,"t":"p","en":"The computers on Maersk's ships weren't infected, but the computers monitoring and dictating the movement of those ships and all of their containers were. And key to that were the company's network's domain controllers, which among other functions set the rules that determine which users can access which systems. They only found one clean backup copy: in an office in Ghana, which happened to have been affected by a power blackout just before NotPetya struck and was thereby not vulnerable to the malware's attack. In a scene out of a spy thriller, Maersk raced to get the backup to London, where its IT department was based. With none of the Ghanaian staffers holding a British visa, the USB was handed off between two employees in an airport in Nigeria before being flown onward to London. It would be more than a week until Maersk terminals around the world began operating under any sense of normalcy. The attack alone cost Maersk between \\$250 and \\$300 million.¹0","zh":"马士基自有船舶上的电脑并未感染，但监控和调度这些船及其全部集装箱的电脑感染了。关键在于公司网络的域控制器——它的职能之一就是设定规则，决定哪个用户能访问哪些系统。他们只找到一份干净的备份，存放在加纳的一间办公室里：那台机器恰好在 NotPetya 发作前遇上停电，因而未被这款恶意软件攻破。接下来像间谍惊悚片里的一幕：马士基争分夺秒，要把备份送到信息技术部门所在的伦敦。加纳员工谁都没有英国签证，那只U盘先在尼日利亚一座机场由两名员工交接，再搭机飞往伦敦。一个多星期之后，马士基设在世界各地的码头才勉强恢复常态运转。仅这一次攻击，就让马士基损失2.5亿至3亿美元。*"},{"id":"ch02-077","p":48,"t":"p","en":"All this to say that communications is key for the shipping industry. When trucks unload containers in ports for shipping, they are \"checked in\" similar to an airplane, given an identification number that not only details what is in the containers and where they are going but also feeds into an automated system that tells the truck where to unload the containers, then helps the cranes load them onto the ships, and so forth, until the container is returned to a new truck at the destination port. If something in that system breaks, the whole thing breaks—and the effects spread throughout the global economy.","zh":"这一切都说明，通信对航运业至关重要。卡车在港口卸下集装箱交运时，要像飞机一样「办理登机」，取得一个编号；这个编号不仅写明箱内装的是什么、要运往何处，还会进入一套自动化系统，由系统告诉卡车把箱子卸在哪里，再指挥吊机把箱子装上船，如此一环扣一环，直到集装箱在目的港被交到另一辆卡车上。这套系统里任何一个环节断裂，整条链就断，后果会扩散到整个全球经济。"},{"id":"ch02-078","p":48,"t":"p","en":"From China's shores to America's, there's another critical way that sea-based traffic shapes the American economy: how data actually moves around the globe. It's commonplace when talking about the flow of data to talk about it \"flying through the air\"; and of course some data does move by radio waves. The vast bulk of data, though, moves by sea. That is to say, it flows through a system of cables that run along the ocean floor, connecting continents and linking economies. Fully 93 percent of all data traveling around the world ends up flowing through ocean cables. There's no part of our modern world of finance, internet communication, Zoom meetings, Amazon ordering, online commerce, Facebook, YouTube, and TikTok that isn't made possible by cables on the seafloor.","zh":"从中国海岸到美国海岸，海上交通塑造美国经济还有另一条关键途径：数据究竟如何在全球流动。谈起数据流动，人们习惯说它「在空中飞」；当然，确有一部分数据靠无线电波传输。但绝大部分数据走的是海路。也就是说，它沿着铺在洋底的整套电缆流动，连接各大洲，连接各经济体。全世界流动的数据，足足93%最终要经由海底光缆。我们的现代生活——金融、互联网通信、Zoom 会议、亚马逊下单、在线商务、Facebook、YouTube、TikTok——没有一样离得开洋底的电缆。"},{"id":"ch02-079","p":49,"t":"p","en":"In fact, a complex grid of more than four hundred seafloor cables link every major market in the world. Looking at their map is like playing a game of connect the dots between the world's major cities. Cables border the edges of every continent, hugging Europe from France to Portugal and then Africa from Morocco to South Africa. They cross in wide chunks from New York to nearly every part of Europe. They follow similar paths as do container ships, traveling the Mediterranean and passing through the Suez Canal before hugging India and traversing the Malacca Straits to Beijing and other coastal Chinese cities. There they group together to cross the Pacific, connecting to the West Coast of the United States—and everywhere in between. It's no accident that these cables concentrate in the world's key financial capitals, and it's no accident that those capitals are one and the same as the great harbors of the world.","zh":"事实上，400多条海底光缆织成一张复杂的网，连接世界每一个主要市场。看它们的分布图，就像在世界各大城市之间玩连点游戏。光缆沿着每一块大陆的边缘走，贴着欧洲从法国到葡萄牙，再贴着非洲从摩洛哥到南非。从纽约到欧洲几乎每一个角落，都有成片的光缆横跨大西洋。它们的走法与集装箱船相仿：穿地中海，过苏伊士运河，贴着印度，再穿过马六甲海峡到北京和中国其他沿海城市；到那里汇成束，横越太平洋，接到美国西岸——以及其间所有地方。这些光缆集中在世界主要金融之都，绝非偶然；而这些金融之都恰好就是世界的大港，同样绝非偶然。"},{"id":"ch02-080","p":49,"t":"p","en":"That this global system of ocean floor cables requires continuous replacement and upgrade is not a revelation; what is perhaps surprising is that these cables were first laid in the 1850s, at the height of British maritime power. The famed HMS Challenger (whose voyage of discovery and scientific inquiry was celebrated by the first US shuttle launch) also undertook some of the first studies of the contours of the seabed and the conditions at seafloor depth that would affect the laying of various types of potential cable.1 A scientist and engineer by the name of William Thomson made the key scientific breakthroughs about the design of cables that could sustain deep-sea conditions, and took to sea on the HMS Agamemnon in 1857 to begin laying cable. A series of failures and disasters did not deter Thomson or the shipowners, and in 1865 the first complete cable was laid. The onset of the transoceanic telegraph cable enabled quicker communications between Britain and its former colonial outpost, delivering news and data between journalists, government officials, and trading and shipping companies, supplanting the sea \"packets\" that used to carry the mails between London and Newport, Rhode Island. In 1858, with the successful completion of the first transatlantic telegraph cable, the first message, on August 16, 1858, read, \"Europe and America are united by telegraph. Glory to God in the highest.\" The next morning, one hundred guns saluted the connection in New York, with a grand parade and fireworks in September. William Thomson was knighted Lord Kelvin by Queen Victoria for his role in the effort.","zh":"这套全球海底光缆系统需要不断更换、升级，这算不上什么新发现；或许令人意外的是，这些电缆最早铺设于1850年代，正值英国海上力量的鼎盛时期。著名的「挑战者」号（美国第一架航天飞机「挑战者」号之名，便是为纪念它的发现与科学考察之旅）还率先研究了海底地形，以及会影响各类候选电缆铺设的深海环境。* 一位名叫威廉·汤姆森的科学家兼工程师，在能承受深海条件的电缆设计上取得了关键突破；1857年，他随「阿伽门农」号出海，开始铺设电缆。一连串失败与灾难没能让汤姆森和船东们退缩，1865年，第一条完整的电缆铺设成功。跨洋电报电缆的问世，使英国与其昔日的殖民地据点之间得以更快通信，记者、政府官员、贸易商行与航运公司之间的消息与数据由此传递，取代了以往往返于伦敦与罗德岛州纽波特之间运送邮件的海上「邮船」。1858年，第一条跨大西洋电报电缆铺设成功，8月16日发出的第一封电报写道：“欧美两洲已由电报相连。荣耀归于至高无上的上帝。”次日清晨，纽约鸣炮一百响庆祝接通；9月又举行了盛大游行和焰火。因为这项事业中的贡献，威廉·汤姆森被维多利亚女王册封为开尔文勋爵。"},{"id":"ch02-081","p":49,"t":"n","en":"Which is why Microsoft and Facebook collaborated in 2017 to lay the fastest cable yet laid across the Atlantic, capable of transmitting data at a rate of 160 terabits per second.","zh":"正因如此，微软与 Facebook 于2017年联手铺设了当时横跨大西洋最快的一条光缆，传输速率可达每秒160太比特。"},{"id":"ch02-082","p":50,"t":"p","en":"Since then, cable speeds have kept getting faster-as a function of technology, military necessity, and the ravenous demands of capitalism. These cables link the great financial and trading hubs of the world, from New York to Hong Kong to London. \"People don't understand how important the undersea cables are to our business,\" one financial trader told me. When the major firms are considering their trades, they're constantly calculating which undersea cable they should use to connect to specific markets; speed is a factor but redundancy and reliability are just as important.","zh":"自那以后，光缆的速度不断提升——这是技术演进的结果，也出于军事需要，还因为资本主义贪得无厌的需求。这些光缆连接着世界各大金融与贸易枢纽，从纽约到香港、伦敦。“人们不明白海底光缆对我们的生意有多重要，”一位金融交易员对我说。大公司在斟酌交易时，时刻都在盘算该走哪条海底光缆接入特定的市场；速度是一个因素，但冗余和可靠同样重要。"},{"id":"ch02-083","p":50,"t":"p","en":"All this profits the United States. Over the past three decades, the US share of world trade has gradually diminished to around 22 percent. Things look different if you examine the share of world profits taken by American financial firms. There, as of 2020, it was between two to three times that share.12 Managing the flow of money that attaches itself to every single trade ship that enters the port of New York, to every trade transaction around the world that's brokered in US dollars, has become a huge part of what drives economic performance in the United States. In 2016, fully 50 percent of the profits recorded by American firms were in the financial industry. And all of this was made possible by seabed cables.","zh":"这一切都让美国受益。过去三十年，美国在世界贸易中所占的份额逐步降至22%左右。但若看美国金融企业拿走的世界利润份额，情况就大不相同：截至2020年，这一比例是前者的两到三倍。* 每一艘驶入纽约港的商船、每一笔以美元结算的全球贸易，都附着一股资金流；经营这些资金流，已成为驱动美国经济表现的重要部分。2016年，美国企业录得利润的整整50%来自金融业。而这一切之所以成为可能，靠的是海底光缆。"},{"id":"ch02-084","p":50,"t":"p","en":"One of the tools that Captain Tama used to manage the security of the Port of New York and New Jersey is called an Area Maritime Security Committee. It brings together federal, state, and local authorities— and Wall Street. One of the country's largest financial firms sits on that committee, to help the Coast Guard perform its function. When Tama asked one of their executives why they paid attention to the Coast Guard's work, they answered: \"You're a market mover. A disruption in the maritime supply chain would roil the financial markets.\"","zh":"塔马上校管理纽约与新泽西港安全所用的工具之一，叫「区域海上安全委员会」。它把联邦、州和地方当局聚到一处——还有华尔街。全美最大的金融机构之一就派人坐在这张桌子旁，帮海岸警卫队履行职责。塔马曾问其中一位高管，为什么如此关注海岸警卫队的工作，对方答道：“你们是撬动市场的人。海上供应链一旦中断，金融市场就会翻江倒海。”"},{"id":"ch02-085","p":51,"t":"p","en":"So what's at stake is the American economy, American security, and America's role in the world as the banker to the global economy and the anchor of global trade security, a role that affects billions of people globally. It's a role that relies on American naval dominance, a position it inherited from the British Royal Navy—whose role in the eighteenth and nineteenth centuries was violent, sometimes immoral, but massively consequential to the shape of the twenty-first-century world.","zh":"所以，真正攸关的是美国经济、美国安全，以及美国作为全球经济银行家和全球贸易安全之锚的世界角色——这个角色影响着全球数十亿人。这一角色依赖美国的海上主导地位，而那一地位继承自英国皇家海军：皇家海军在18、19世纪的所作所为充满暴力，有时并不道德，却对21世纪世界的面貌留下了极其重大的影响。"}],"notes":[]},{"id":"ch03","label":"Chapter 3","labelZh":"","title":"Charting Today's World","titleZh":"第三章　绘制今日世界的海图","part":"Part I: News from the Future","showPart":false,"partZh":"第一部","partTitleZh":"来自未来的消息","paras":[{"id":"ch03-001","p":52,"t":"p","en":"The Praia de Careavelos stretches for more than a mile along Portugal's Atlantic coast, its deep, golden-colored sands serving as a weekend escape from Lisbon, eight miles awav, around the headlands that separate the Tagus River from the swells of the Atlantic. Although well stocked with cafes and restaurants and bars, and well visited by Lisbon's burgeoning population, the Carcavelos beach receives few foreign tourists, who typically head farther south to the better-known beaches and resorts of the Algarve.","zh":"卡尔卡韦卢什海滩（Praia de Carcavelos）沿着葡萄牙的大西洋海岸绵延一英里有余，沙层深厚，沙色金黄。里斯本在八英里之外，中间隔着一片岬角，把塔霍河与大西洋的涌浪分开；城里人到了周末，便绕过岬角到这片沙滩上来换口气。海滩上咖啡馆、餐馆、酒吧一应俱全，里斯本日渐增多的人口也常来光顾，外国游客却很少——他们通常一路南下，去阿尔加维（Algarve）那些更有名的海滩和度假地。"},{"id":"ch03-002","p":52,"t":"p","en":"But Carcavelos has two important claims to attention. One is not easily visible: it's the hub of the first sea cable to connect mainland Europe to England, and thus to America, as well as Europe to Africa and then to India. On June 25, 1870, the Illustrated London News celebrated its conclusion:","zh":"但卡尔卡韦卢什有两处值得一说的地方。其中一处不大看得见：这里是第一条海底电缆的枢纽——那条电缆把欧洲大陆连到英格兰，再由英格兰连到美洲，也把欧洲连到非洲，再连到印度。1870年6月25日，《伦敦新闻画报》（Illustrated London News）为它的竣工喝彩："},{"id":"ch03-003","p":52,"t":"p","en":"The successful completion of the submarine telegraph line between Malta, Gibraltar, and Falmouth, in connection with the Anglo-Mediterranean and the British Indian submarine telegraphs, to form a direct submarine communication all the way from India to England, crossing only the land of Egypt, has been announced, to the public satisfaction.","zh":"“马耳他、直布罗陀与法尔茅斯之间的海底电报线路已顺利建成，并与英属地中海及英属印度海底电报线接通，从而形成一条从印度直达英格兰的海底通信线路，途中仅需经过埃及一地。此讯业已公布，公众闻之欣慰。”"},{"id":"ch03-004","p":52,"t":"p","en":"To this day, Carcavelos continues to serve as the hub of myriad undersea cables, with a particular concentration of cables connecting mainland Europe to Africa. The early company officials of the Falmouth, Malta, Gibraltar Telegraph Company (later, Cable & Wireless) who chose the Portuguese coast to anchor the Gibraltar section of the cable did so for a simple reason: it's the westernmost point of the European mainland.","zh":"直到今天，卡尔卡韦卢什仍是无数海底光缆的枢纽，其中尤以连接欧洲大陆与非洲的光缆最为密集。法尔茅斯—马耳他—直布罗陀电报公司（Falmouth, Malta, Gibraltar Telegraph Company，即后来的大东电报局 Cable & Wireless）早年的几位主管之所以选中葡萄牙海岸，把电缆的直布罗陀段锚定在这里，理由很简单：这里是欧洲大陆的最西端。"},{"id":"ch03-005","p":53,"t":"p","en":"That same geography matters for the beach's other important feature, the maritime defensive fortification of São Julião da Barra. The fort comprises an uneven pentagon that serves as its sea-level perimeter, defense posts overlooking the ocean, and a guard tower that anchors its central section. It is Portugal's largest maritime fortification, and from 2013 onward has been the official residence of the country's minister of defense. Although originally commissioned by King Manuel I, who ruled Portugal from 1495 to 1521, construction of the fort was delayed. It was completed between 1553 and 1558, one of a string of towers and forts that protected Lisbon from attack from the Atlantic.","zh":"同样的地理位置，也成就了这片海滩的另一处要紧之物：圣朱利昂达巴拉要塞（São Julião da Barra）。要塞的外围是一圈不规则的五边形围墙，贴着海平面展开；墙上有俯瞰大洋的防御炮位，中央则由一座瞭望塔镇住。这是葡萄牙最大的海防要塞，自2013年起一直是该国国防部长的官邸。要塞最初由国王曼努埃尔一世（Manuel I，1495—1521年在位）下令兴建，工程却一再延宕，直到1553至1558年间才告建成，是当年护卫里斯本、抵御大西洋来犯之敌的一串塔楼与堡垒之一。"},{"id":"ch03-006","p":53,"t":"p","en":"It was from these shores, too, that Portugal's conquistadors set sail on their voyages of discovery, trade, conquest, and slavery that so profoundly shaped the modern world. The basement dungeons of São Julião da Barra, later famous for holding political prisoners during Portugal's fascist period, far earlier were also holding cells for slaves returned from West Africa. Several decades before the fort was constructed, Infante Dom Henrique of Portugal, Duke of Viseu, had established a trading post at Elmina, on the Ghanaian coast of the Gulf of Guinea, and brought African slaves back with him to Lisbon—the first African slaves to be brought to the European continent. By the time of the completion of the Barra, Elmina was one of the major centers of the African slave trade, and many who were captured there spent time in the dank basements of the Barra.†","zh":"葡萄牙的征服者也正是从这一带海岸扬帆出海，踏上他们的发现、贸易、征服与贩奴之旅——这些航行如此深刻地塑造了现代世界。圣朱利昂达巴拉要塞的地下土牢，后来因在葡萄牙法西斯时期关押政治犯而闻名；但更早得多的时候，这里同样用作牢房，关着从西非运回的奴隶。要塞建成前数十年，葡萄牙的恩里克王子（Infante Dom Henrique）、维塞乌公爵已在几内亚湾加纳海岸的埃尔米纳（Elmina）设立商站，并把非洲奴隶带回里斯本——这是被带到欧洲大陆的第一批非洲奴隶。到巴拉要塞建成时，埃尔米纳已是非洲奴隶贸易的主要中心之一，许多在那里被掳获的人，都曾在巴拉要塞阴湿的地下室里待过。*"},{"id":"ch03-007","p":53,"t":"n","en":"I first visited these forts when I was seventeen, on a summer holiday with a school friend. While wandering through the dark halls of the fort's holding cells, I realized that I'd seen something similar before. As a schoolchild, I'd visited the other end of the traffic, the slaveholding forts of Elmina. It was an eerie realization, and one that shaped my earliest understanding of the role of empire in the forging of the world in which I lived.","zh":"我第一次见到这些要塞时十七岁，正和一个中学同学一起过暑假。我在要塞关押人犯的阴暗廊道里转着，忽然意识到：这样的地方我先前见过。念小学时，我去过这条贩奴链条的另一端——埃尔米纳的蓄奴堡。那一刻的感觉说不出的诡异，也正是它，最早塑造了我对帝国的理解：我所生活的这个世界，是怎样被帝国锻造出来的。"},{"id":"ch03-008","p":53,"t":"n","en":"Three thousand miles away, Elmina fort still stands, well preserved, a three-hour drive west of Accra, Ghana. It overlooks the pounding surf and strong currents of the Gulf of Guinea. It's the oldest surviving European structure in sub-Saharan Africa, and a particularly redolent memorial to the brutality of that encounter. Just as in the Barra, its lowest levels were forged as holding cells for the slaves that passed through this fortification. Also on display at Elmina is the armor of some of the early Portuguese occupiers—surprisingly small in stature. At the height of the European slave trade (when Elmina had passed from Portuguese hands to the Dutch, before passing","zh":"三千里之外，埃尔米纳堡依然矗立，保存完好，在加纳首都阿克拉以西三小时车程处。它俯瞰着几内亚湾拍岸的浪涛与强劲的海流。这是撒哈拉以南非洲现存最古老的欧洲建筑，也是一座格外触目惊心的纪念碑，记着那场相遇的残暴。与巴拉要塞一样，它的最底层也是为关押经此要塞转运的奴隶而造的。埃尔米纳堡里还陈列着一些早期葡萄牙占领者的盔甲——身材小得令人意外。在欧洲奴隶贸易的鼎盛时期（当时埃尔米纳已从葡萄牙人手中转入荷兰人之手，其后又"},{"id":"ch03-009","p":54,"t":"p","en":"No account of the role of European imperialism in forging the modern world should fail to emphasize the central, indispensable role of the transatlantic slave trade in its establishment, and of slavery in general in generating the wealth of Europe that allowed it to dominate world politics for the four and a half centuries that followed the construction of São Julião da Barra. Portugal's most consequential voyage, though, was not to its slaving colonies in the Americas or West Africa; it was Portugal's discovery of a solution to a riddle that had preoccupied Europe's imperialists and explorers and crusaders, and evaded rival Spain's Columbus—the sea route to the Indies. It's ironic that Europe's westernmost country would be the first to find the sea route to Asia, but it turned out that the key to doing so was to sail farther west across the Atlantic, there to catch winds that could fling a small ship into currents that pulled it south and east around the southern coast of Africa, up into the Indian Ocean—winds we know today as the trade winds.1,*","zh":"凡论述欧洲帝国主义如何锻造现代世界，都不能不强调：跨大西洋奴隶贸易在这一过程中居于核心，不可或缺；而奴隶制本身，更造就了欧洲的财富，使它在圣朱利昂达巴拉要塞建成之后的四个半世纪里得以主宰世界政治。不过，葡萄牙最具决定性的一次远航，并不是驶向它在美洲或西非的蓄奴殖民地，而是解开了一道长期困扰欧洲的帝国扩张者、探险家和十字军骑士的谜题——通往印度的海路；而这道谜题，连它的竞争对手西班牙的哥伦布也未能破解。颇具讽刺意味的是，欧洲最西端的国家反倒最先找到通往亚洲的海路；而其中的关键，竟是继续向西横渡大西洋，到那里去借风，让风把小船送进一股洋流，由洋流带着它往南、往东，绕过非洲南岸，北上进入印度洋——这些风，我们今天叫作信风。*"},{"id":"ch03-010","p":54,"t":"p","en":"For the past five hundred years, the dynamics of world trade and military power have been shaped by oceans and the competition upon them. In that time, no state or empire has succeeded in sustaining a position as a leading world power withou
