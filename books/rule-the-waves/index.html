discovery that the Arabian Sea had been cooling, affected by changes in the upwelling of cold bottom waters. Careful forensics showed that increased upwelling was related to wind patterns over the ocean, themselves a function of changing patterns of the Asian summer monsoon. Further research showed a strong link between snow patterns in the highlands of Europe and Asia and monsoon patterns—a link that had been theorized as early as the late 1880s, but never demonstrated.³","zh":"斯克里普斯。在比奇洛实验室，一位名叫若阿金·戈埃斯（Joaquim Goés）的学者得到美国航空航天局（NASA）的资助，用卫星对叶绿素的观测和海表温度数据，绘制海洋硝酸盐浓度图——这是NASA对全球环流建模的贡献之一。他的图显示，阿拉伯海（在印度次大陆的另一侧，与孟加拉湾、安达曼海相望）出现了异常大规模的浮游植物藻华。由此发现，阿拉伯海一直在变冷，原因是底层冷水上涌发生了变化。细致的溯因分析表明，上涌增强与洋面上的风场有关，而风场本身又取决于亚洲夏季季风规律的变化。进一步研究显示，欧亚高地的积雪状况与季风规律之间存在紧密关联——这一关联早在19世纪80年代末就有人提出假说，却从未得到证实。³"},{"id":"ch14-014","p":289,"t":"p","en":"Using advanced climate modeling, the team found a clear set of patterns: a decline in snow coverage in Europe and Asia from the early 1990s onward meant warmer air over these continents, which was affecting glacier formation in the Himalayas, which was affecting rain concentration in the Asian highlands, which was affecting the timing and strength of the monsoon rains. And leading to increased flooding. In a normal year, up to 40 percent of the Ganges and Irrawaddy river deltas flood from the monsoon rains, and over centuries, the local populations have built up their farming and infrastructure around that predictable floodplain. But in flood years, up to 70 percent of the deltas can flood, with devastating effects. And in the last decade, the timing of the monsoons has been increasingly unpredictable, and floods increasingly common.","zh":"借助先进的气候模型，团队理出一组清晰的链条：20世纪90年代初以来，欧亚积雪覆盖减少，意味着这些大陆上空的空气更暖；这影响喜马拉雅的冰川形成，进而影响亚洲高地的降水集中度，再进而影响季风雨的时机与强度，最终导致洪水增多。正常年份，恒河与伊洛瓦底江三角洲最多有40%因季风雨泛洪；几百年来，当地人的农耕与基础设施正是围绕这片可预期的洪泛区建起来的。但在洪水年份，三角洲被淹的比例可高达70%，后果惨重。过去十年，季风来临的时机越来越难以预料，洪水也越来越常见。"},{"id":"ch14-015","p":289,"t":"p","en":"For the rice farmers who depend on the predictability of the monsoons to prepare their rice fields, these fluctuations were debilitating. And so many of them left the dry zones and decamped to other parts of Myanmar—becoming, in effect, internal climate refugees. They ended up at the edges of parts of Myanmar historically dominated by different ethnicities, and recently torn by more than fifty years of civil war. Myanmar's fragile young democracy was already coping with increased frequency of cyclone and storm-surge damage, dramatic global fluctuations in energy prices, and intensifying competition between China, India, and the West. Adding in a loss of productivity in the rice crop—the production and trade of which accounts for nearly half of Myanmar's GDP-as well as large numbers of internal climate refugees, and Thant was becoming worried that Myanmar's political system might not be able to cope. \"I'm worried that Burma could become the world's first climate-induced failed state.\"","zh":"对那些要靠季风的可预期性来备好稻田的稻农来说，这种反复足以摧毁生计。于是许多人离开干旱区，迁往缅甸其他地方——实际上成了国内的气候难民。他们落脚的地方，多是缅甸历来由其他民族聚居的边缘地带，而这些地区近年又被五十多年的内战撕扯得支离破碎。缅甸年轻而脆弱的民主制度，本已在应对日益频繁的气旋与风暴潮灾害、全球能源价格的剧烈波动，以及中、印与西方之间不断加剧的竞争。再加上稻米减产——稻米的生产与贸易占缅甸国内生产总值的近一半——以及大量国内气候难民，吴丹敏开始担心缅甸的政治体制承受不住。“我担心缅甸会成为世界上第一个由气候导致的失败国家。”"},{"id":"ch14-016","p":290,"t":"p","en":"The effects would not be limited to Myanmar's population of 56 million. On the western side of Myanmar, China has begun to invest billions of dollars in Rakhine State, to build both an oil pipeline and a deepwater port at Kyaukphyu, at the northern tip of Ramree Island. Kyaukphyu has a natural harbor and has long been an important outpost for the trade in rice between Myanmar and India. If fully operationalized, the port would realize China's bid for an equivalent to the Suez Canal-a passageway that would connect Chinese rail and trade directly to the Indian Ocean, bypassing the Malacca Straits. But instability on land and rising sea levels threaten the viability of the project.","zh":"影响不会只限于缅甸的5,600万人口。在缅甸西部，中国已开始向若开邦投入数十亿美元，要在兰里岛北端的皎漂修一条输油管道、建一座深水港。皎漂有天然良港，长期以来是缅印之间稻米贸易的重要前哨。若全面投入运营，这座港口将实现中国打造「苏伊士运河等价物」的构想——一条把中国的铁路与贸易直接接入印度洋、绕过马六甲海峡的通道。但陆上的动荡与海平面上升，正威胁着这一项目的可行性。"},{"id":"ch14-017","p":290,"t":"p","en":"All of this is impacted by oceanic dynamics playing out as far away as the North Atlantic and the Antarctic. In the largest sense, the oceans are one, as the Royal Navy used to say, and so is climate change. It's for this reason that climate change is usually viewed as a \"we're all in one boat\" problem that will logically drive cooperation between governments around the world. But what's equally true is that every sea, and every shore, is distinct; and climate change is playing out very differently in different waters of the world. That reality of variation is not driving cooperation, but rather adding to the competition over command of the seas.","zh":"这一切都受到远在北大西洋和南极的海洋动力过程的影响。从最宏观的意义上说，海洋是一体的——英国皇家海军过去常这么说——气候变化也是一体的。正因如此，气候变化通常被看成一个「我们同在一条船上」的问题，按理说会推动世界各国政府合作。但同样真实的是，每一片海、每一段海岸都各不相同；气候变化在世界不同水域的展开方式差异极大。这种差异的现实并未促成合作，反而加剧了对海洋控制权的争夺。"},{"id":"ch14-018","p":290,"t":"h","en":"The Oceans and the Climate","zh":"海洋：气候的稳定器"},{"id":"ch14-019","p":290,"t":"p","en":"The vastness of the oceans has served as a place to operate navies and a global trading system, and they are a resource—for fish, for minerals, for energy. What we're coming to understand, and have increasingly confirmed through oceanographic and atmospheric observation, is that the oceans also play a pivotal role in human ecology, as a critical stabilizer of the climate. For this reason more than any other: the oceans store more heat in the top ten feet of their surface waters than does the entire atmosphere.⁴","zh":"海洋的辽阔，为海军和全球贸易体系提供了活动场域；它本身也是资源——鱼类、矿产、能源。而我们逐渐认识到、并通过海洋与大气观测不断证实的是：海洋在人类生态中还扮演枢纽角色，是气候的关键稳定器。最要紧的理由是：海洋表层十英尺的水体所储存的热量，超过整个大气层。⁴"},{"id":"ch14-020","p":290,"t":"n","en":"This was before a coup in January 2021 added a further man-made crisis to the already volatile situation.","zh":"这是2021年1月那场政变之前的事。那场政变给本已动荡的局势又添了一重人为的危机。"},{"id":"ch14-021","p":291,"t":"p","en":"That's germane to weather patterns in many more places than the Bay of Bengal. The great ocean currents move warm air around the world, affecting weather patterns from northern Europe to the southern cone. The oceans also help distribute rain across the globe: ocean water is constantly evaporating, increasing the temperature and humidity of the surrounding air to form rain and storms, which are then carried by the trade winds across the world. Almost all rain that falls on land begins in the ocean.","zh":"这与天气格局的关联，远不止孟加拉湾一地。巨大的洋流把暖空气带往世界各地，影响从北欧到南锥体的天气格局。海洋还参与把雨水分配到全球：海水不停蒸发，提高周围空气的温度与湿度，形成降雨与风暴，再由信风带往各处。落到陆地上的雨，几乎都起于海洋。"},{"id":"ch14-022","p":291,"t":"p","en":"This matters most when it comes to the dynamics of El Niño and La Niña-the major patterns of rainfall and temperature that sweep across the Pacific, best known for bringing rain to the West Coast of the United States, but also vital to rain patterns as far away as the northern Sahara. Climate measurements show that both have become more variable and more intense over the past several decades.⁵ El Niño occurs when water temperatures in the central and eastern equatorial Pacific are warmer than average for an extended period of time (now typically three to five months). This warm water shifts eastward, moving the strongest tropical thunderstorms to the central Pacific. This storm shift changes jet-stream wind patterns, creating warmerthan-normal winters in parts of North America and elsewhere bringing unusually heavy storms. As the storms move across the US, the South faces wetter-than-average winters. El Niño also impacts other locations across the globe, causing droughts and wildfires in Australia, floods in South America, below-average rainfall in Indonesia, and other effects as far away as in East and Central Africa.","zh":"在厄尔尼诺与拉尼娜的动力机制上，这一点最为要紧——这两个横扫太平洋的降雨与温度大格局，以给美国西海岸带来雨水而最为人熟知，但也关系到远至撒哈拉北部的降雨。气候观测显示，过去几十年间两者的变化幅度与强度都在增加。⁵ 赤道太平洋中部与东部的水温长时间高于平均值（如今通常为三到五个月），便形成厄尔尼诺。暖水向东移动，把最强烈的热带雷暴带到太平洋中部。风暴位置的这种偏移改变了急流的风场，使北美部分地区冬季偏暖，另一些地方则遭遇异常猛烈的风暴。风暴横扫美国时，南方的冬季比常年更湿。厄尔尼诺还影响到全球其他地方：在澳大利亚引发干旱与野火，在南美造成洪灾，在印度尼西亚使降雨偏少，其效应甚至远及东部与中部非洲。"},{"id":"ch14-023","p":291,"t":"p","en":"For the past one hundred years or so, extreme El Niños have occurred about once every twenty years—but, for the next century, they are predicted to occur once every ten years. The increase is due to the fact that more water in the eastern equatorial Pacific is warmer, thanks to climate change—so it warms up more quickly, accelerating El Niño. Its effects are also anticipated to expand to a wider area: extratropical storms are projected to move toward the poles, with consequent changes in wind, precipitation, and temperature patterns.6","zh":"过去一百年左右，极端厄尔尼诺大约每二十年出现一次；而据预测，未来一百年将变为每十年一次。频率上升，是因为气候变化使赤道太平洋东部有更多水体偏暖，升温更快，从而加速厄尔尼诺。其影响范围预计也会扩大：温带风暴预计将向两极移动，风、降水与温度的格局随之改变。⁶"},{"id":"ch14-024","p":291,"t":"p","en":"This new pattern doesn't just matter for weather; it matters for agriculture. For example: one of the things that El Niño affects is how much rain and cool air get blown across California, and along with it the central plains of the United States. It therefore also affects the average annual temperature. And on current patterns, that's set to rise somewhere between .5 to 1 degree over the next twenty or so years, and another 1.5 to 2 degrees in the fifty years after that.","zh":"这种新格局不只关乎天气，也关乎农业。举例来说，厄尔尼诺影响的一件事，是有多少雨水和冷空气被吹过加利福尼亚，以及与之相连的美国中部平原。因此它也会影响年平均气温。按目前的趋势，未来二十年左右将上升0.5至1度，此后再过五十年，还会再升1.5至2度。"},{"id":"ch14-025","p":292,"t":"p","en":"Before America was the world's financier, it was the world's factory; and before it was the world's factory, it was the world's farmer—the largest and most important producer of food in the world. America's first source of wealth was the vast fields of wheat and corn and cattle and hogs that dominate the American Midwest. Adding California to the mix, with its verdant black soil that gives up five crops per year, only added to the bounty. This massive agricultural venture not only feeds America's 330 million citizens, but is also exported to every corner of the globe and forms the bulwark of food supplies provided to global counter-poverty efforts.","zh":"在美国成为世界的银行家之前，它是世界的工厂；在成为世界的工厂之前，它是世界的农场——全球最大、最重要的粮食生产者。美国最初的财富来源，是遍布中西部的辽阔麦田、玉米地，以及牛群与猪群。再加上加利福尼亚，那里黑土肥沃，一年能收五茬，丰饶更胜一筹。这项庞大的农业事业不仅养活美国3.3亿国民，产品还行销全球各个角落，并构成全球反贫困事业粮食供给的支柱。"},{"id":"ch14-026","p":292,"t":"p","en":"Why is America so productive agriculturally? Because in the California plain and the American Midwest, the average temperature between April and October (and longer in California) fluctuates between 69 and 82 degrees Fahrenheit in an average growing season. Some years are hotter, some are cooler, but on average, that's the temperature band. And that happens to be the precise temperature band at which crops like wheat and corn and barley do best. (Other crops like bananas need hotter temperatures, which is why they mostly grow in the Philippines and the Caribbean.) Now, bananas can serve as a staple if you have ready access to some protein, but to build a modern economy and a modern agricultural system you need crops that can be grown in bulk, stored in bulk, and turned into feedstock for cattle and hogs. In short, you need wheat and corn, which the United States has in enormous quantities—it's the world's largest producer of both crops. So what happens if the average temperatures in the United States rise by a couple of degrees? Simply put, a falloff in the productivity of field crops. Just a shift from an average temperature band of 73 to 82 degrees to an average temperature band of 78 to 87 degrees will cause the productivity of grain and corn to drop.\"","zh":"美国的农业为何如此高产？因为在加州平原和美国中西部，4月到10月（加州更长）的平均气温，在一个寻常的生长季里浮动于华氏69至82度（约摄氏20.5至28度）之间。有的年份更热，有的年份更凉，但平均下来就是这个温区。而这恰好是小麦、玉米、大麦这类作物长势最好的精确温区。（香蕉之类的作物需要更高的温度，所以主要长在菲律宾和加勒比地区。）当然，只要能方便地弄到一些蛋白质，香蕉也能当主粮；但要建立现代经济和现代农业体系，你需要的是能大规模种植、大规模储存、并能加工成牛羊猪饲料的作物。简言之，你需要小麦和玉米，而美国的产量极大——它是这两种作物的全球最大生产国。那么，如果美国的平均气温升高两三度会怎样？简单说，大田作物的生产率会下滑。仅仅是从73至82度这个平均温区移到78至87度，谷物和玉米的产量就会下降。"},{"id":"ch14-027","p":292,"t":"p","en":"There are still further effects.","zh":"还有更多的后果。"},{"id":"ch14-028","p":292,"t":"p","en":"The absorption of carbon by the oceans, and their subsequent warming, are also driving more and more marine heat waves—days when the daily sea-surface temperature exceeds the local ninety-ninth percentile of the last roughly forty years. These have doubled in frequency and become longer-lasting, more intense, and more extensive. The difference in density between the ocean's surface and the deep ocean is also growing—which means that less heat, salinity, oxygen, and carbon and fewer nutrients are exchanged vertically in the ocean. The ocean, meanwhile, has lost oxygen.8","zh":"海洋吸收碳、随之升温，也在催生越来越多的海洋热浪——即日海表温度超过当地过去约四十年第99百分位的那些日子。其出现频率已经翻倍，持续时间更长，强度更大，范围更广。海洋表层与深海的密度差也在扩大，这意味着热、盐、氧、碳以及营养盐在海洋垂向上的交换都在减少。与此同时，海洋已经失去了一部分氧气。⁸"},{"id":"ch14-029","p":293,"t":"p","en":"The oceans have also become 30 percent more acidic over the last two centuries.9 This has two effects. First, it becomes harder for animals to thrive, especially those with shells, as they have a harder time producing and keeping calcium carbonate.1º If these animals aren't thriving, that can change the broader overall structure of the ecosystems—ultimately affecting fish populations. Some of this loss can be compensated for by fish-farming close to the coast, and in some geographies by shifting fish farms to land.","zh":"过去两个世纪，海洋的酸度上升了30%。⁹ 这带来两种效应。第一，动物更难繁盛，尤其是带壳的动物，因为它们生成并保有碳酸钙变得更困难。¹⁰ 这些动物若不能繁盛，整个生态系统的总体结构就可能改变，最终影响到鱼类种群。部分损失可以通过近岸养鱼来弥补，在某些地区还可以把养殖场搬到陆上。"},{"id":"ch14-030","p":293,"t":"p","en":"The second effect of rising acidity in the oceans is that it affects the rate at which cold bottom waters mix with the warmer surface waters. That's because it changes the salinity of the oceans. Salinity's effect on the density of water is especially important in the western tropical Pacific and far North Atlantic. Rain reduces water's salinity and evaporation increases salinity. This denser, saltier water sinks. So all of this could affect the dynamics of thermohaline circulation—though only over a very great deal of time. The likely consequence of the changing chemistry of the oceans takes us back to where modern oceanography got its start—to the Antarctic Ocean.","zh":"海洋酸度上升的第二种效应，是影响底层冷水与较暖表层水的混合速率。这是因为它改变了海水的盐度。盐度对水密度的影响，在热带西太平洋和北大西洋高纬海域尤为重要。降雨降低海水盐度，蒸发提高盐度。更密、更咸的水下沉。因此这一切都可能影响温盐环流的动力——只不过要在极长的时间尺度上才显现出来。海洋化学变化可能带来的后果，又把我们带回现代海洋学的起点——南大洋。"},{"id":"ch14-031","p":293,"t":"p","en":"The Intergovernmental Panel on Climate Change's seven-hundredplus-page \"Special Report on the Oceans and the Cryosphere,\" published in 2019, is a monumental work of international scientific cooperation, drawing together studies from several hundred scientists in more than sixty countries for the fullest account ever of the role of the oceans in our changing climate. Its language is ponderous and bureaucratic, reflecting both the rigors of science and the politics of navigating the text through the concerns of dozens of governments. Even its summary for policy makers is clogged with jargon. But amid the technicalities lies the conclusion of a growing, foreboding consensus among the burgeoning field of ocean scientists—that the key to understanding our changing climate lies in the oceans; and the signals are not good. The IPCC's message is that much of what sustains human life comes from the interplay between the surface and deep waters and sea ice; an interplay affected in turn by the interaction between the surface waters and the atmosphere—and that delicate balance is increasingly threatened by a warming planet. The most worrying part of this complex picture is what's happening to the sea ice.","zh":"政府间气候变化专门委员会（IPCC）2019年发布的七百多页《海洋与冰冻圈特别报告》，是一部国际科学合作的巨作：它汇集六十多个国家数百位科学家的研究，是迄今关于海洋在变化气候中所起作用最完整的论述。它的语言滞重而官腔十足，既反映了科学的严谨，也反映了让文本穿过数十国政府关切的政治过程。就连供决策者阅读的摘要也塞满了行话。但在技术细节之间，藏着正在壮大的海洋科学界一个日益强烈、令人不安的共识：理解我们变化中的气候，关键在海洋；而信号并不好。IPCC传达的信息是：维系人类生命的许多东西，来自表层水、深层水与海冰之间的相互作用；而这种相互作用又受表层水与大气往来的影响——这一微妙的平衡正日益受到变暖星球的威胁。在这幅复杂图景中，最令人担忧的是海冰的遭遇。"},{"id":"ch14-032","p":294,"t":"h","en":"Of Glaciers That Speak with Tongues","zh":"会吐舌的冰川"},{"id":"ch14-033","p":294,"t":"p","en":"The science of a topic as vast as the oceans proceeds with hundreds of studies, many operating in parallel, some that rarely see the light of day, some that attract attention but prove ephemeral in their scientific impact. Then there's that rare study that both attracts attention at the time and stands the test of revision, review, and reexamination. One such was a short, 2001 article by Wally Broecker with the whimsical title \"Glaciers That Speak in Tongues and Other Tales of Global Warming.\"1 In it, he charted the loss of glacial ice in the Arctic and Antarctic. He noted that the place that this loss was by then most pronounced was where the glacial formations licked out beyond the continental landmass into the oceans themselves—what are known as glacial tongues. There, glaciers were receding and losing mass even more quickly than on the main Arctic ice sheet, or on the Antarctic continent. In subsequent studies of what scientists call the \"cryosphere\" (the world of ice, at sea and in glaciers), the importance of this phenomenon has grown.","zh":"像海洋这样庞大的题目，其科学进展是靠几百项研究推进的：许多研究并行展开，有些几乎不见天日，有些引人注目，科学影响却转瞬即逝。偶尔也会有那样的少数研究：当时引人注目，又经受住了修正、评议与反复检验。沃利·布勒克（Wally Broecker）2001年那篇短文就是一例，题目起得俏皮：《会吐舌的冰川及其他全球变暖的故事》。¹ 文中他绘出了北极与南极冰川冰的消融。他指出，当时消融最显著的地方，是冰川越过大陆地块、伸入海洋之处——也就是所谓「冰舌」。在那里，冰川退缩与质量损失的速度甚至快于北极主冰盖或南极大陆。此后在科学家称为「冰冻圈」（海上与冰川中的冰的世界）的研究中，这一现象的重要性不断上升。"},{"id":"ch14-034","p":294,"t":"p","en":"From 1902 to 2015, the global mean sea level rose some six inches— and the rate of that rise, from 2006 to 2015, was .14 inches per year, the highest rate over the last century, and about two and half times the rate recorded between 1901 and 1990.12 This rise is generated by two phenomena. First is the simple warming of the waters, as they absorb more carbon from the atmosphere. Warm water takes up more volume than cold-just think of filling a pot to two-thirds height and leaving it on the stove; even before boiling over, the hotter water fills the pot. Just so, warmer oceans take up more space than colder ones; and globally, the mean global ocean level is rising. Although the estimates here rely on extraordinarily complex calculations from the global circulation models, the contemporary estimate is that atmospheric warming accounts for about 40 percent of sea-level rise, globally.","zh":"1902年至2015年，全球平均海平面上升了约六英寸；其中2006至2015年的上升速率为每年0.14英寸，是一个世纪以来最快的，约为1901至1990年间记录速率的两倍半。¹² 这种上升由两种现象造成。第一是海水变暖本身：海洋从大气中吸收更多碳，水温随之升高。暖水比冷水占的地方大——想想把锅装到三分之二满，放在炉子上；还没烧开溢出，更热的水就已经把锅填满了。同样，较暖的海洋比较冷的海洋占更多空间，全球平均海平面因此上升。这里的估算依赖全球环流模型极其复杂的计算，但目前的估计是：全球海平面上升中，大气变暖约占40%。"},{"id":"ch14-035","p":295,"t":"p","en":"The other 60 percent comes from the melting of the sea ice, at both poles. This has been well documented and well covered in the Arctic. We've long measured the Arctic ice—in part because the Arctic ice sheet was where the Soviet fleet would park their submarines, to try to avoid detection from the US Navy. Tracking the Soviets became one of the most complex and dangerous parts of the Cold War, and involved the US Navy measuring the changing levels of surface and subsea ice. Much of this science was released to the public in the 1980s, in part as an effort to spur more serious attention to climate change. It forms an essential baseline. But even more important is the interplay between the oceans and the glaciers in the south.","zh":"另外60%来自两极海冰的融化。这件事在北极记录得很细，报道也很充分。我们测量北极冰层已有很长时间——部分原因是北极冰盖过去是苏联舰队停放潜艇、躲避美国海军侦测的地方。追踪苏联潜艇成了冷战中最复杂也最危险的行动之一，美国海军因此一直在测量海面冰层与水下冰层的变化。这些科学成果大部分在20世纪80年代向公众公开，部分用意是促使人们更认真地看待气候变化。它们构成了一条不可或缺的基准线。但更要紧的，是南大洋与南部冰川之间的相互作用。"},{"id":"ch14-036","p":295,"t":"h","en":"The Great Southern Warming","zh":"南大洋大升温"},{"id":"ch14-037","p":295,"t":"p","en":"On February 6, 2020, Antarctica hit its highest temperatures ever recorded: 18.3C/64.9F—which was about the same temperature as Los Angeles that day. The warm temperatures arrived February 5 and continued until the 13th. The ice melt in just those eight days was notable, and evident. Satellite pictures taken from Eagle Island, near the Drake Passage separating Antarctica from South America, tell the story: on February 4, the island was mostly white, with a few green areas in the satellite image near the coasts. But on February 13, white spots were patchy, and concentrated only in the middle. In just four days (February 6 to 11), Eagle Island lost four inches of ice.13","zh":"2020年2月6日，南极洲录得有记录以来的最高气温：18.3摄氏度（64.9华氏度）——与当天洛杉矶的气温大致相当。高温2月5日到来，一直持续到13日。仅这八天里的冰融就相当可观，而且肉眼可见。从鹰岛（Eagle Island）拍下的卫星照片把这一切讲得很清楚。鹰岛位于德雷克海峡（Drake Passage）附近，那道海峡把南极洲与南美洲分开：2月4日，岛上大部分还是白色，卫星图像上只在近岸处有几片绿色区域；到了2月13日，白色已经斑驳，只集中在岛的中部。短短四天（2月6日至11日）里，鹰岛失去了四英寸厚的冰。¹³"},{"id":"ch14-038","p":295,"t":"p","en":"The size and the cold of the Southern Ocean plays a key role in the world's climate system, and Antarctic bottom water is crucial to global convection. This heavy, salty water is so dense that in sinking to the seafloor it pushes billions of gallons of water northward, up into the North Atlantic on one side of the Americas, where it originates the Atlantic Meridional Overturning Circulation, which plays a key role in regulating the temperature of both North America and Europe; and on the other side of the Americas, originating the Humboldt Current, and the rains it generates, which hit the Andes and flow down off of them into the Amazon, watering the entire Amazon basin and much of the South American landmass. Overall, more than one hundred quadrillion gallons of water (that is, 100 followed by fifteen zeroes) are moved through circulation by the sinking of this Antarctic bottom water.","zh":"南大洋的体量与寒冷，在世界气候系统中举足轻重；南极底层水对全球对流更是至关重要。这种又重又咸的水密度极大，沉向海底时会把数以十亿加仑计的海水推向北方：在美洲一侧推入北大西洋，由此启动大西洋经向翻转环流（Atlantic Meridional Overturning Circulation），而这一环流对调节北美与欧洲的气温起着关键作用；在美洲另一侧，则启动洪堡洋流（Humboldt Current）以及它带来的雨水——雨水打在安第斯山上，顺山体流下进入亚马孙，滋润整个亚马孙流域和南美大陆的广袤土地。总的算来，南极底层水的下沉所驱动的环流，搬运着超过十亿亿加仑（即100后面跟15个零）的海水。"},{"id":"ch14-039","p":296,"t":"p","en":"The bottom water is also fantastically productive. Neil Mostert, a scholar of global energy trade, notes, \"The layered cold-warm-cold Southern Ocean contains the biggest, most abundant, and the most important of these areas. It is highly productive over much of its area. ... Indeed, several of those pockets of high productivity elsewhere are directly influenced by the Southern Ocean, notably the west coast of South America from Horn to the equator, and the west coast of Africa from Good Hope to the equator. The Antarctic richness is carried up the South American coast by the Humboldt Current, and along South West Africa by the Benguela Current. .. .\"—naming several of the world's most productive fisheries.14","zh":"底层水还极为丰饶。研究全球能源贸易的学者尼尔·莫斯特（Neil Mostert）指出：“南大洋呈冷—暖—冷的分层结构，其中包含着这些区域里最大、最丰饶、也最重要的几处。它的很大一部分海域生产力极高。……事实上，别处那些高生产力的海域，有好几处直接受到南大洋的影响，尤其是南美西岸从合恩角到赤道一带，以及非洲西岸从好望角到赤道一带。南极的富饶由洪堡洋流沿南美海岸带出，又由本格拉洋流（Benguela Current）沿西南非海岸带出……”——他点到的，正是世界上几处最高产的渔场。¹⁴"},{"id":"ch14-040","p":296,"t":"p","en":"Even before it performs these critical roles, the Southern Ocean captures far and away the largest volume of CO, anywhere in the world and keeps it on the seafloor for up to one thousand years. It's the largest carbon sink in the world.","zh":"甚至在发挥这些关键作用之前，南大洋就已经吸收了世界上远远最多的二氧化碳，并把它们封存在海底长达一千年之久。它是世界上最大的碳汇。"},{"id":"ch14-041","p":296,"t":"p","en":"So much so in fact that it now becomes clear that the Southern Ocean has absorbed more heat and more CO2 from the atmosphere than all other marine regions of the world combined, perhaps significantly more so. So the research showing a steady rise in the temperatures of the Southern Ocean is worrying.¹5","zh":"事实上，吸收量之大，以致如今已看得很清楚：南大洋从大气中吸收的热量与二氧化碳，超过世界其他所有海域的总和，而且可能超出不少。因此，那些显示南大洋温度持续上升的研究，令人不安。¹⁵"},{"id":"ch14-042","p":296,"t":"p","en":"Every model of the global climate predicts the same phenomenon, namely that the world's two poles will warm more and warm faster than the rest of the world. This is due to a change in the way that snow reflects sunlight and heat into the atmosphere. In a region covered year-round by snow, what's known as the albedo effect occurs, when light surfaces reflect more heat than dark surfaces. On Earth, the snow reflects about 80 percent of the sunlight back into the atmosphere. By contrast, the open waters of the ocean, despite their vast size, reflect only 7 percent.16 The exception is the poles, where the ice caps and the sea ice are (until recently) covered with snow year-round. As the atmosphere warms, some of that snow cover melts, exposing the terrain, much darker than the snow. Thus, the poles start to reflect less sunlight, and the surrounding seas are made warmer, and melt more adjacent sea ice; and the cycle deepens, creating a feedback loop. It's this process that has caused the Arctic ice sheet to melt by nearly 40 percent in forty years.¹7","zh":"所有全球气候模型都预测同一个现象：地球两极的升温幅度会大于、速度快于世界其他地方。原因在于雪把阳光与热量反射回大气的方式起了变化。在终年被雪覆盖的地方，会出现所谓的「反照率效应」——浅色表面比深色表面反射更多热量。在地球上，雪会把约80%的阳光反射回大气；相比之下，辽阔的海洋开阔水面只能反射7%。¹⁶ 两极是例外：那里的冰盖与海冰（直到不久前）终年覆雪。随着大气变暖，一部分雪盖融化，露出比雪暗得多的地面。于是两极反射的阳光变少，周围海水因此变暖，又融掉更多邻近的海冰；如此循环不断加深，形成一个正反馈。正是这一过程，使北极冰盖在四十年间缩减了近40%。¹⁷"},{"id":"ch14-043","p":297,"t":"p","en":"Even more worrying is the situation in the Southern Ocean. Unlike the Arctic, where there's more sea than land, the Antarctic is the opposite, there's more land than sea—so there's a greater albedo effect. Another concern is the melting of the portion of the Antarctic known as the West Antarctic Ice Sheet, which appears to be reacting to climate change like the glacial tongues.","zh":"更令人担忧的是南大洋的情形。北极是海多于陆，南极恰恰相反，陆多于海——所以反照率效应更强。另一个隐忧，是南极被称为西南极冰盖的那一部分正在融化，而它的反应方式，看来和冰舌一样。"},{"id":"ch14-044","p":297,"t":"p","en":"As these tongues encounter warmer water, they start to melt, and in so doing they wick the warmer water farther up the ice sheet, weakening the sheet itself. The narrower, lighter, and shorter these oncemassive ice tongues become the more this phenomenon amplifies and they become weaker still, threatening the core of the ice sheet itself. The main ice sheet is constantly pushing outward toward the ocean, and these glacial fields, now weaker, cannot resist, and eventually break off. What's more, warm water is also present in the deep chasms and shells that are underneath the ice sheet, weakening its connection to the seafloor and to the main body of the Antarctic continent.","zh":"这些冰舌一旦遇上更暖的海水便开始融化，而融化又把暖水引向冰盖更深处，反过来削弱冰盖本身。这些曾经庞大的冰舌越窄、越薄、越短，这一过程就越是加剧，冰舌也就越发孱弱，进而威胁到冰盖的核心。主冰盖不断向海洋方向外推，如今已然变弱的这些冰原无力阻挡，最终断裂崩解。此外，冰盖下方的深沟与陆架中也有暖水，它们削弱了冰盖与海底、与南极大陆主体之间的联结。"},{"id":"ch14-045","p":297,"t":"p","en":"We are watching now the beginnings of a destructive chain reaction. Large portions of the West Antarctic Ice Sheet rest on land that's below sea level and slips downward. So as the Southern Ocean warms up, it comes into direct contact with ice mass and melts it, causing further rise of the seas.","zh":"我们此刻看到的，是一场破坏性连锁反应的开端。西南极冰盖的很大一部分，坐落在低于海平面、且正在向下滑动的陆地上。因此，随着南大洋变暖，海水直接接触到冰体并将其融化，海平面于是进一步上升。"},{"id":"ch14-046","p":297,"t":"p","en":"Human beings have lived with sea-level rise and fall before, but never so fast and never when so many human beings lived, worked, and produced industry close to the edge of the oceans. According to the World Ocean Review of 2019:","zh":"人类以前也经历过海平面的升与降，但从未如此之快，也从未赶上如此之多的人在海边居住、劳作、办工业。2019年的《世界海洋评论》（World Ocean Review）写道："},{"id":"ch14-047","p":297,"t":"p","en":"But a glimpse into more recent climate history also reveals that since humankind began to settle down, sea level has never risen as fast as it is rising now. ... This disturbingly sharp increase is primarily due to two factors. On the one hand, the ice sheets and glaciers of the world are losing large amounts of ice, and the resulting water either enters the ocean directly or is carried in by rivers. On the other hand, the temperatures in the world's oceans are rising, and warmer water expands and takes up more space than cold water.18","zh":"“但只要稍稍回望晚近的气候史就会发现：自人类定居以来，海平面从未像现在这样快速上升。……这种令人不安的陡增主要源于两个因素。一方面，世界各地的冰盖与冰川正在流失大量冰体，融水或直接注入海洋，或由河流带入。另一方面，世界大洋的温度在升高，而暖水膨胀，比冷水占据更大空间。”¹⁸"},{"id":"ch14-048","p":298,"t":"p","en":"How much sea-level rise will this generate? We don't precisely know. Every model has an “error band\"—a numerical band that spans the distance between the best- and worst-case estimates. As Arctic and Antarctic ice sheet melt has been added to climate models, these error bands have grown. That's not so much a measure of scientific doubt as it is of the scale of the potential effect. At the lowest-level assumptions, loss of the Greenland and Antarctic ice sheets would contribute to a modest rise in global sea levels by 2100, of roughly four inches—a manageable rise, although still a level of rise that will exacerbate storms and storm surges, at substantial cost. But at higher estimates, the ice sheet loss would contribute something more like two feet by 2100-a rate never experienced in the modern world, and one that would pose vast challenges to the huge populations that live along the coasts.19","zh":"这会带来多少海平面上升？我们并不确切知道。每个模型都有一条「误差带」——一个横跨最好情形与最坏情形之间距离的数值区间。随着北极与南极冰盖的融化被纳入气候模型，这些误差带也在变宽。这与其说表明科学上有多少犹疑，不如说反映了潜在影响的量级。按最低一档的假设，格陵兰与南极冰盖的损失到2100年只会让全球海平面小幅上升，约四英寸——尚属可控，但这样的升幅仍会加剧风暴与风暴潮，代价不菲。而按较高估计，冰盖损失到2100年会带来两英尺左右的上升——这样的速度是现代世界从未经历过的，将给沿海的庞大人口带来巨大挑战。¹⁹"},{"id":"ch14-049","p":298,"t":"h","en":"Adaptation, Engineering, and Competition","zh":"适应、工程与竞争"},{"id":"ch14-050","p":298,"t":"p","en":"What does this all mean for geo-economics and geopolitics?","zh":"这一切对地缘经济与地缘政治意味着什么？"},{"id":"ch14-051","p":298,"t":"p","en":"The world of climate change is generally understood to fall into two major policy streams—mitigation and adaptation. Mitigation is the world of climate diplomacy and industrial policy—the business of trying to limit the emission of carbon, methane, and other critical gases into the atmosphere, to limit the potential damage. Climate change mitigation is generally understood to be a world of cooperation— driven by a sense that, in the long term, we're all in this together.","zh":"气候变化问题通常被分成两大政策门类——减缓与适应。减缓属于气候外交与产业政策的范畴：设法限制碳、甲烷及其他关键气体排入大气，以减轻可能的损害。气候变化的减缓一般被看作一个合作的世界——其驱动力是这样一种认识：长远来看，我们同舟共济。"},{"id":"ch14-052","p":298,"t":"p","en":"But adaptation is another story. Even if CO2 emissions went to zero today, the heat already stored in the oceans would continue to have effects well past the next century. The sea levels will continue to rise— what's unknown is by how much and how it will play out unevenly around the world.","zh":"但适应是另一回事。即便二氧化碳排放今天归零，海洋中已经储存的热量仍会继续发挥作用，其影响远及下个世纪之后。海平面还会继续上升——不知道的只是升多少，以及它将如何在世界各地以极不均衡的方式显现。"},{"id":"ch14-053","p":298,"t":"p","en":"Take the way the warming oceans impact fish stocks (already dangerously thinned out by overfishing\"). Generally speaking, colder waters are more productive for fishing; cold, mineral-rich waters are ideal spawning grounds for phytoplankton, the first chain in the nutrition ladder that leads to large fish stocks. The great fisheries of the worldthe Humboldt, the Grand Banks—occur where cold bottom waters are pushed up to cool the surface waters, or where the waters themselves are made colder by glaciers and sea-ice melt","zh":"以海洋变暖对鱼类种群的影响为例（过度捕捞已使这些种群稀疏到危险的地步²⁰）。一般说来，较冷的水域更利于渔业：寒冷而富含矿物质的水，是浮游植物理想的繁殖场，而浮游植物是通往庞大鱼类种群的营养阶梯的第一环。世界上的大渔场——洪堡、大浅滩（Grand Banks）——都出现在底层冷水上涌、令表层水变冷的地方，或是冰川与海冰融水使海水本身变冷的地方。"},{"id":"ch14-054","p":298,"t":"n","en":"The cold upwelling of the bottom waters of the Atlantic, off the Grand Banks of Newfoundland, has long generated one of the most productive fisheries in the world, particularly important for the cod that dominated fish supply in the Atlantic in the eighteenth, nineteenth, and twentieth centuries. By 1992, long before oceanic warming had a chance to affect fish productivity, the estimated biomass of the Canadian cod","zh":"纽芬兰大浅滩外大西洋底层冷水的上涌，长期造就着世界上最高产的渔场之一，对鳕鱼尤为重要——18、19、20世纪，鳕鱼一直是大西洋鱼类供应的主力。到1992年，远在海洋变暖有机会影响鱼类生产力之前，加拿大鳕鱼的估计生物量"},{"id":"ch14-055","p":299,"t":"p","en":"If the seas are warming, then the productivity of the oceans should decline—and globally, that's estimated to be true: the IPCC believes that global net fish potential will decline as much as 24 percent in the coming decades.20 But there are important differences in where it plays out. The already warm and shallow waters of the South and East China Seas look to be hard hit. But off the Arctic, the melting of Arctic ice is cooling those waters, leading to a substantial increase in the productivity of what was already one of the great sources of phytoplankton in the world. The melting of the sea ice in the Arctic, by cooling the nearby waters in the short term, has increased what the IPCC calls the 'net primary production\" of the Arctic—that is, the total quantity of phytoplankton blooms, generating more fish life. In warmer waters, the opposite is occurring, generating less.21","zh":"如果海洋在变暖，海洋的生产力就应当下降——从全球看，估算确实如此：IPCC认为，未来几十年全球渔业净潜力将下降多达24%。但各地情况差别很大。南海与东海那些本就温暖、浅的水域，看来会遭受重创。而在北极外海，北冰洋海冰的融化正在使那里的海水变冷，令本已是世界最大浮游植物来源之一的海域生产力大增。北冰洋海冰融化，短期内使邻近海水降温，提高了IPCC所说的北极「净初级生产力」——也就是浮游植物藻华的总量，从而养育更多鱼类。在较暖的水域，情况恰恰相反，产量更少。²¹"},{"id":"ch14-056","p":299,"t":"p","en":"One of the most powerful images in the IPCC special report on oceans is a global map that overlays two measures. The first, the maximum fish catch potential; second, the relevant population's diet—with shades of orange (from light to dark) indicating how dependent on fish a country is for its animal-sourced food.22 Overlay these two sets of data and a clear picture emerges: the sparsely populated Arctic regions are likely to see the biggest net gains in fish productivity, with small nearby populations to draw from them, turning the Arctic into one of the most attractive grounds on which to compete for fish stocks. By contrast, the South China Sea emerges as a flash point of a very different kind: it's one of the seas most likely to face substantial warming and declining fish stocks. Several hundred million Chinese, Japanese, and Southeast Asians as a whole live within one hundred miles of the East and South China Seas, and they look to the fisheries there to provide one of the most important sources of protein. For the governments in question, ensuring that they have access to those fish stocks becomes a matter of huge political import. There's a reason that the first time a Chinese naval vessel used force to detain another ship off its coast, it wasn't a US Navy frigate or Japanese cutter—it was a Filipino fishing vessel.","zh":"IPCC海洋特别报告中最有力的图之一，是一张把两组数据叠合的全球地图。第一组是最大捕捞潜力；第二组是相关人口的饮食结构——橙色（由浅到深）标示一国在动物性食物上对鱼类的依赖程度。²² 把这两组数据叠在一起，画面就清楚了：人烟稀少的北极地区很可能在渔业生产力上获得最大的净增益，而当地人口很少，正可以把这份增益拿走，北极因此成为争夺鱼类资源最有吸引力的海域之一。相比之下，南海呈现出的是另一种性质的引爆点：它是最可能遭遇大幅变暖与鱼类资源衰退的海域之一。数亿中国人、日本人以及整个东南亚的人口，生活在距东海与南海不足100英里（约160公里）的地方，指望着那里的渔业提供最重要的蛋白质来源之一。对相关政府来说，确保能拿到这些鱼类资源，便成了具有重大政治意义的事。中国海军舰艇第一次在近海动用武力扣押他国船只，扣的不是美国海军护卫舰，也不是日本海上保安厅的巡逻船，而是一艘菲律宾渔船——这不是没有缘由的。"},{"id":"ch14-057","p":299,"t":"n","en":"population had fallen to 1 percent of its earlier levels as a result of overfishing. Globally, industrial-scale fishing has depleted an estimated 90 percent of open-water fish stocks. See: Brian Fagan, Fishing: How the Sea Fed Civilization (New Haven, CT: Yale University Press, 2017).","zh":"已跌至先前水平的1%，原因是过度捕捞。在全球范围，工业化规模的捕捞已耗尽了估计90%的公海鱼类资源。参见：Brian Fagan, Fishing: How the Sea Fed Civilization（纽黑文：耶鲁大学出版社，2017年）。"},{"id":"ch14-058","p":300,"t":"p","en":"So, in the short term, the changing climate is creating winners and losers, and incentives to compete—over who can best adapt to the short-term effects of climate change.","zh":"所以短期内，变化中的气候正在制造赢家与输家，也在制造竞争的动力——比谁更能适应气候变化的短期影响。"},{"id":"ch14-059","p":300,"t":"h","en":"Differential Effects","zh":"不均衡的冲击"},{"id":"ch14-060","p":300,"t":"p","en":"Climate change will not only impact the food that coastal nations depend on, but the very lives of those who live on the coasts. Approximately 680 million people (nearly 10 percent of the 2010 global population) live on coastal land that is less than thirty-three feet above sea level. This number is projected to reach more than 1 billion by 2050.23 Their livelihoods will be deeply impacted—when combined with sea levels rising, increases in tropical cyclone winds and rainfall and increases in extreme waves will likely exacerbate problems caused by rising sea levels, especially on coastlines.24 Research has suggested that a four-inch rise exposes an additional 10 million people to flooding.25","zh":"气候变化不仅会影响沿海国家赖以果腹的食物，还会影响沿海居民的身家性命。约6.8亿人（接近2010年全球人口的10%）住在海拔不足33英尺（约10米）的沿海地带。预计到2050年，这个数字将超过10亿。²³ 他们的生计将受到深刻冲击：与海平面上升叠加，热带气旋风力与降雨的增加、极端浪高的加大，很可能加剧海平面上升造成的问题，在海岸线上尤其如此。²⁴ 有研究指出，海平面上升四英寸，就会多出1,000万人面临洪水威胁。²⁵"},{"id":"ch14-061","p":300,"t":"p","en":"We can easily imagine rising seas and increased storm volatility and frequency impacting the land and infrastructure-just look at the damage that hurricanes have recently wreaked in Mississippi, Florida, Texas, and elsewhere. But recurrent coastal flooding can also increase the risk that infrastructure for drinking water and wastewater will fail—putting people at risk of coming into contact with pathogens and harmful chemicals.2⁶ Standing water in streets and houses can also bring in disease-carriers like mosquitoes.27","zh":"海面上升、风暴愈发狂暴频繁，会冲击陆地与基础设施——这并不难想象：看看近年飓风在密西西比、佛罗里达、得克萨斯等地造成的破坏就够了。但反复发生的沿海洪水，还会加大饮用水与污水处理设施失灵的风险，使人面临接触病原体与有害化学品的危险。²⁶ 街道与房屋里的积水还会招来蚊虫这类疾病媒介。²⁷"},{"id":"ch14-062","p":300,"t":"p","en":"Furthermore, climate change will likely hasten the loss of coastal wetlands, which help protect the coastline from storms and erosion and help buffer the impacts of sea-level rise. They're also important for storing carbon-and yet nearly 50 percent of these wetlands have been lost over the last one hundred years, as a result of human pressures, sea-level rise, warming, and extreme climate events.28 This loss of wetlands worsens the feedback loops. One effect is that areas with mostly","zh":"此外，气候变化很可能加快沿海湿地的消失。湿地既帮助海岸抵御风暴与侵蚀，也缓冲海平面上升的冲击，对固碳同样重要——然而过去一百年间，由于人类压力、海平面上升、变暖与极端气候事件，这类湿地已流失近50%。²⁸ 湿地的消失又使反馈循环进一步恶化。后果之一是，以较小的冰川为主的地区"},{"id":"ch14-063","p":301,"t":"p","en":"smaller glaciers (like Central Europe, the Caucasus, North Asia, Scandinavia, the tropical Andes, Mexico, eastern Africa, and Indonesia) are projected to lose more than 80 percent of their current ice mass by 2100.29 That will add to the albedo effect, and increase overall warming.","zh":"（如中欧、高加索、北亚、斯堪的纳维亚、热带安第斯、墨西哥、东非与印度尼西亚）预计到2100年将失去现有冰量的80%以上。²⁹ 这会加重反照率效应，使整体升温进一步加剧。"},{"id":"ch14-064","p":301,"t":"p","en":"The US East Coast is particularly vulnerable to climate-induced sea-level rise, because it has low elevations and sinking shorelines.30 Flooding is already becoming more frequent along the US coastline, and as of 2016, more than \\$1 trillion of property and infrastructure are at risk of damage from coastal flooding.³¹ Since 2010, Wilmington, North Carolina, has flooded most often—forty-nine days per year, with Annapolis, Maryland, not far behind at forty-seven days per year.32 Wilmington, Annapolis, Sandy Hook, and Atlantic, New Jersey, experience floods ten times more often now than in the 1950s.³3","zh":"美国东海岸尤其容易受到气候导致的海平面上升影响，因为那里地势低、岸线正在下沉。³⁰ 美国沿海的洪水已经越来越频繁；截至2016年，超过1万亿美元的财产与基础设施面临沿海洪水破坏的风险。³¹ 2010年以来，北卡罗来纳州威尔明顿的洪水最为频繁——每年49天；马里兰州安纳波利斯紧随其后，每年47天。³² 威尔明顿、安纳波利斯、桑迪胡克与新泽西州大西洋城，如今遭遇洪水的频率是20世纪50年代的十倍。³³"},{"id":"ch14-065","p":301,"t":"p","en":"And then storms make it worse. “Extreme sea-level events\" (like major flooding) are historically rare, occurring about once per century. Even with climate mitigation, they are now projected to occur frequently (at least once per year) by 2050, especially in tropical regions.³4","zh":"而风暴会让情况更糟。「极端海平面事件」（如大洪水）在历史上很罕见，大约一个世纪才有一次。即便采取气候减缓措施，预计到2050年它们也将频繁发生（至少每年一次），热带地区尤其如此。³⁴"},{"id":"ch14-066","p":301,"t":"p","en":"But how damaging all this will be depends heavily on a different factor: the wealth of the population in question. Will the great economic, energy, and naval powers of our time choose to care about the consequences of climate adaption for the poorer nations and peoples of the world? Or will they focus only on adapting their own coastlines, engineering their own coastal protections, and extending their own fisheries, operating on the mentality of sauve qui peut, or every country for itself? Or will they look further, caring for the devastating effect of warming seas, changing wind and rain patterns, and growing sea-level rise on the livability, the agriculture, and the viability of the world's poorer nations? Will they provide the “statesmanship of a rare order\" that Margaret Thatcher called for, now more than three decades ago?","zh":"但这一切破坏有多大，很大程度上取决于另一个因素：相关人口的贫富。我们这个时代的经济、能源与海军强国，会选择去关心气候适应给世界上较贫穷的国家与人民带来的后果吗？还是只顾适应自己的海岸线、修筑自己的海岸防护工程、扩大自己的渔场，抱着「各自逃命」（sauve qui peut）的心态，也就是每个国家只顾自己？抑或会把目光放得更远，去关心变暖的海水、改变的风雨格局与不断上升的海平面，对世界上较贫穷国家的宜居程度、农业与生存能力造成的毁灭性影响？他们会拿出玛格丽特·撒切尔三十多年前所呼吁的那种「罕见的政治家气度」吗？"},{"id":"ch14-067","p":301,"t":"p","en":"It's a question that takes us beyond the realm of power, to wider questions of leadership, and of how we think about the relationship between power and the world around us.","zh":"这个问题把我们带出了权力的疆域，引向更广阔的追问：什么是领导力，以及我们该如何看待权力与周围世界的关系。"}],"notes":[]},{"id":"conclusion","label":"Conclusion","labelZh":"","title":"Come Hell and High Water","titleZh":"结语　纵有洪水滔天","part":"Part IV: The Power of the Seas","showPart":false,"partZh":"第四部","partTitleZh":"海洋的力量","paras":[{"id":"conclusion-001","p":303,"t":"p","en":"Even in the long dark of Arctic winter, the Norwegian city of Tromsø teems with maritime activity, as scientists and fishermen and leisure boats ply its waterways. Tourists come not just for the Northern Lights, but to participate in the world's northernmost film festival, set in the town's central square and taking advantage of the blue night to screen outdoors at all hours of the day. Perhaps some of the advance crew of the Research Vessel Polarstern took the chance to participate before their ship launched in September 2019. It would, after all, be more than a year before they would next see terra firma.","zh":"即便在北极漫长的黑夜里，挪威城市特罗姆瑟的海上活动照样繁忙：科学家的船、渔民的船、消闲的船，往来穿梭于城中水道。游客来这里，不只为看北极光，也为参加世界最北的电影节——影节设在市中心广场，借着那片“蓝色夜晚”，一天到晚都在露天放片。科考船「极星」号（Polarstern）的先遣船员里，也许有人赶在2019年9月启航之前去凑了这场热闹。毕竟，他们要再过一年多，才能重新见到坚实的陆地。"},{"id":"conclusion-002","p":303,"t":"p","en":"They set sail in a world of tensions; they docked in a world in crisis. By the time they had completed their voyage, the world had been roiled by the first two rounds of the global COVID-19 pandemic. Even a ship sailing the high Arctic couldn't escape its reach; the crew had to quarantine when a helicopter pilot bringing in supplies tested positive for the disease. Yet, while the world churned, they completed a scientific marathon.","zh":"他们启航时，世界布满紧张；他们靠岸时，世界已陷危机。等这趟航程走完，全球新冠疫情的头两波已经把世界搅得天翻地覆。就连航行在北极高纬海域的船也躲不开它的波及：一名运送补给的直升机驾驶员检测呈阳性，船员们只得隔离。然而，就在世界翻腾之际，他们跑完了一场科学马拉松。"},{"id":"conclusion-003","p":303,"t":"p","en":"Their voyage was the core of a collaboration known as MOSAIC, or Multidisciplinary drifting Observatory for the Study of Arctic Climate. For more than a year, the RV Polarstern drifted in the polar ice, close to the North Pole. During the age of exploration, the HMS Terror and Erebus plied those waters as part of Sir John Franklin's ill-fated search for the Northwest Passage; and Norwegian scientist Fridtjof Nansen famously drifted his wooden sail ship Fram across the Arctic waters. But no ship in history had drifted so long, so close to the North Pole, as the RV Polarstern. During its drift, the crew planted remotely operated measuring devices in locations spanning out over a radius of fifty miles from its hull, at varying depths in the ice cap itself, and took measurements in the surrounding waters. Planes took frequent temperature readings in the air above the ice. Monitoring continuously over the course of the year, the expedition generated the closest, most detailed, most carefully measured look ever at the nature and evolution of the Arctic sea ice—its depth, chemistry, and most important, its rate of melt.","zh":"这趟航程，是一项名为“MOSAIC”的合作计划的核心——全称是“北极气候研究多学科漂流观测站”（Multidisciplinary Drifting Observatory for the Study of Arctic Climate）。在一年多的时间里，科考船「极星」号一直在靠近北极点的极地浮冰中漂流。探险时代，英国皇家海军的「幽冥」号与「惊恐」号也曾在这一带海域航行，那是约翰·富兰克林爵士（Sir John Franklin）寻找西北航道的悲惨远征；挪威科学家弗里乔夫·南森（Fridtjof Nansen）则驾着他那条木制帆船「前进」号（Fram）横漂北极海域，名垂史册。但历史上还没有哪条船，像「极星」号这样在离北极点如此之近的地方漂流如此之久。漂流期间，船员在以船体为圆心、半径50英里的范围内布设遥控测量装置，把它们安放在冰盖的不同深度，并在周边水域取样测量。飞机频繁升空，测取冰层上方空气的温度。整整一年不间断的监测，使这次远征留下了迄今最切近、最详尽、测量最严谨的一份关于北极海冰性质与演变的记录——它的厚度、化学成分，以及最要紧的融化速度。"},{"id":"conclusion-004","p":304,"t":"p","en":"The project was the result of a scientific collaboration involving more than twenty nations, which supplied icebreakers, support ships, aircraft, helicopters, satellite bandwidth, computing power, and the research crew. In its scale and ambition, MOSAIC carried with it something of the legacy of Cold War-era global research collaborations. But this effort was not led by the United States; indeed, though some of the research crew were drawn from the Scripps Institution, America played no leadership role at all—probably the largest global scientific exploration since the 1940s not led by the United States.","zh":"这个项目由20多个国家共同参与，它们出动了破冰船、保障船、固定翼飞机、直升机，提供了卫星带宽、算力与科研队伍。论规模、论雄心，“MOSAIC”身上都带着冷战年代全球科研合作的一脉遗风。但这项事业不是美国牵头的。事实上，尽管研究队伍中有一部分人来自斯克里普斯海洋研究所，美国却完全没有扮演领导角色——这大概是20世纪40年代以来，唯一一项不由美国主导的大型全球科学考察。"},{"id":"conclusion-005","p":304,"t":"p","en":"It was led, rather, by a commercial power, one that had long since abandoned its ambitions for naval prowess: Germany. When the Polarstern docked, in October 2020, in Bremerhaven, it was met by Germany's science minister, who hailed its contributions to climate research. At its launch, German foreign minister Heiko Maas had set out the country's intentions: \"We want to preserve the Arctic as a largely conflict-free region and use the available resources responsibly,\" said Maas.¹ It was a part of a wider German bid for leadership roles in international affairs—but leadership defined in diplomatic, scientific, and collaborative terms.","zh":"牵头的是一个商业强国，一个早已放下海军雄心的国家：德国。2020年10月，「极星」号靠泊不来梅港（Bremerhaven），德国科学部长到场迎接，盛赞它对气候研究的贡献。启航之际，德国外长海科·马斯（Heiko Maas）已把本国的意图讲得明白：“我们希望让北极保持为一个基本没有冲突的地区，并负责任地使用那里的资源。”¹ 这只是德国争取在国际事务中担当领导角色这一更大努力的一部分——只不过它所说的领导，是以外交、科学、合作来定义的。"},{"id":"conclusion-006","p":304,"t":"p","en":"Germany's peaceable objectives were in stark contrast to the motives of other players simultaneously upping their stakes in the great new game of oceanic competition.2 The most striking development was an agreement that brought full circle the story of the Royal Navy's role in Asia: the conclusion of a UK-India naval agreement in the fall of 2020. The agreement gave India—Britain's most important colonial possession during the long eighteenth and nineteenth centuries—the right to access the still substantial British naval infrastructure in the Indian Ocean.3 Not content to rely on shared resources, India also commissioned a new naval base in the Andaman Islands, three hundred miles north of Port Blair.4","zh":"德国这些和平的目的，与另一些玩家的动机形成鲜明对照——他们同时在这场新的海洋大博弈中加注。² 最引人注目的进展，是一份让英国皇家海军在亚洲角色的故事画成一个整圆的协议：2020年秋，英印两国缔结海军协议。协议赋予印度——18、19两个世纪漫长岁月里英国最重要的殖民地——使用英国在印度洋依然可观的海军基础设施的权利。³ 印度并不满足于借用现成资源，还在安达曼群岛（Andaman Islands）布莱尔港（Port Blair）以北300英里处，启用了一处新海军基地。⁴"},{"id":"conclusion-007","p":304,"t":"p","en":"Beijing reacted furiously. But it, too, was deepening its naval alliances. Earlier that year, it mounted its largest naval exercises ever, sailing jointly with Russia as well as with Iran (which operates a sizable fleet, one that sometimes harasses Western shipping in the Straits of Hormuz). The Western powers matched this in turn, hosting the largest naval exercises since the end of the Cold War, anchored by the US aircraft carriers Reagan and Nimitz, and joined by Australia's HMAS Canberra, an amphibious assault ship, and the JS Teruzuki, a destroyer from the Japanese Maritime Self-Defense Force. India also deepened its ties to those three navies, through a diplomatic mechanism known simply as \"the Quad.\"","zh":"北京反应激烈。但它同样在加深自己的海军同盟。同年早些时候，它举行了史上规模最大的海军演习，与俄罗斯、也与伊朗联合出海（伊朗拥有一支不小的舰队，不时在霍尔木兹海峡骚扰西方商船）。西方大国随即以对等动作回应，举办了冷战结束以来规模最大的海军演习：以美国航母「里根」号和「尼米兹」号为核心，澳大利亚的两栖攻击舰「堪培拉」号（HMAS Canberra）与日本海上自卫队的驱逐舰「照月」号（JS Teruzuki）也加入其中。印度则通过一个简称“四方机制”（the Quad）的外交安排，加深了与这三支海军的联系。"},{"id":"conclusion-008","p":305,"t":"p","en":"The sense of a world reconsolidating into military blocs began to deepen. And back in Tromsø, the Olavsvern naval base officially reopened for operations. Immediately thereafter, the United States concluded its \"status of forces agreement\" that allowed it once again to dock in the mountain's hidden caverns. American nuclear submarines were back in the high north.","zh":"世界正在重新聚拢为军事集团——这种感觉开始加深。而在特罗姆瑟，奥拉夫斯文海军基地正式重新启用。紧接着，美国签定了《驻军地位协定》，从而获准再次停靠在这座大山隐秘的洞库里。美国的核潜艇回到了高北地区。"},{"id":"conclusion-009","p":305,"t":"p","en":"It all signaled the end of an era: the end of a period of relative calm in great power relations, and perhaps of American dominance of global affairs.","zh":"这一切都标志着一个时代的终结：大国关系相对平静的那段岁月结束了，也许，美国主导全球事务的时代也一并结束了。"},{"id":"conclusion-010","p":305,"t":"h","en":"Sailing into a New Age","zh":"驶入一个新的时代"},{"id":"conclusion-011","p":305,"t":"p","en":"And so we find ourselves, now well-entrenched in the twenty-first century, reliving some of the dynamics of the nineteenth. We find ourselves at the start of a new age in world affairs. But what comes next?","zh":"于是我们发现，自己如今已深深扎进21世纪，却在重演19世纪的某些老戏码。我们站在世界事务一个新纪元的起点上。可接下来会是什么？"},{"id":"conclusion-012","p":305,"t":"p","en":"This book's voyage with pirates and naval ports and polar ice caps reveals a coming age of contradictions, shaped in the swell of the world's oceans. A period of duality in America's approach to the world, torn between coastal centers tied to sea-based trade and the investment flows and financial profits it undergirds, and a non-coastal population disconnected from that global enterprise—indeed, both displaced by it and politically disenchanted by those who sustain it. An age in which we are still profoundly tied together in natural and economic terms, but increasingly chafe under a sense that we are too connected—a sensibility sharpened by the experience of COVID-19.","zh":"本书跟着海盗、军港与极地冰盖一路航行，看到的将是一个充满矛盾的未来，它正在世界海洋的涌浪中成形。美国对世界的态度会显出两重性：一边是依附海上贸易的沿海中心，以及海上贸易所支撑的投资流与金融利润；另一边是与这番全球事业脱了钩的内陆人口——他们既被它挤到一边，又在政治上对维护它的人心灰意冷。这将是一个我们在自然上、经济上依然紧紧相连，却越来越因“连得太紧”而烦躁不安的时代——新冠疫情的经历让这种感受更加锋利。"},{"id":"conclusion-013","p":305,"t":"p","en":"It's a coming age that will be shaped by China's bid for a global naval presence and America's reaction, a dangerous dance. Naval power was the handmaiden to American hegemony. China's bid may not yet be for true global power, for world hegemony as the United States has enjoyed; that is not an achievable objective in the near to medium term. But China is certainly engaged in a bid for counter-hegemony: a bid for the capacity to be able to stop the United States from imposing its will and its model on Chinese affairs and Chinese clients. And China is fast becoming a fuller maritime power than the United States, in that it has invested in the ships and dockyards and commercial underpinnings of its rising maritime power-which America has largely neglected of late. The remaining question is whether it can forge a network of bases to support the logistics of a global navy. Its alliance with Pakistan, growing coordination with Iran, and its \"concert like\" arrangements with Russia, combined with its far-flung network of civilian- but potentially dual-use ports infrastructure, are laying the physical and diplomatic foundation. Captain Alfred Thayer Mahan would recognize the world that China sees.","zh":"这个即将到来的时代，将由中国谋求全球海军存在与美国对此的反应来塑造，那是一支危险的舞。海军力量曾是美国霸权的侍女。中国所求，也许还不是真正的全球力量，不是美国曾享有过的那种世界霸权；在中近期内，那也不是一个可以达到的目标。但中国确实在争取一种“反霸权”：争取一种能力，足以阻止美国把它的意志和模式强加于中国事务与中国客户头上。而且中国正迅速成为一个比美国更完整的海洋强国——它为自身崛起的海上力量投资造船、修船厂，也投资商业根基，而这些恰恰是美国近来大体上忽略的。剩下的问题是，它能否织起一张基地网络，为全球海军的后勤提供支撑。它与巴基斯坦的同盟、与伊朗日益紧密的协调、与俄罗斯“类似大国协调”的安排，再加上遍布远方的民用、却可能军民两用的港口设施网络，正在铺下物质与外交的地基。马汉上校会认出中国眼里的那个世界。"},{"id":"conclusion-014","p":306,"t":"p","en":"The coming age of contradiction and rivalry seems likely to have no clear hierarchy of power of the kind that were familiar in the Cold War and post-Cold War eras, and that infuse the American conversation about preeminence (or, more politely, \"leadership\"). China will soon be the largest economy in the world, by GDP, but the United States will have the more powerful military for some time to follow. Russia is a puissant military and energy actor, but an economic welterweight. Japan's military capacity is modest, but for the vital exception of its submarine fleet and marines, which pose a major first barrier to Chinese expansionism. The European Union, anchored by Germany, is a smaller commercial and financial power than the United States, but only by a modest degree, while its naval capacity badly lags its commercial weight, as does that of Britain. India is a potential powerhouse in every domain, but its power is yet fully realized in none.","zh":"这个充满矛盾与角逐的未来，看来不会有冷战与冷战后时代人们所熟悉的那种清晰的力量等级——那种等级观念浸透在美国关于“优势地位”（说得客气些，叫“领导权”）的讨论中。按GDP计算，中国很快将成为世界最大经济体，但在其后一段时间里，美国仍将拥有更强大的军队。俄罗斯是军事与能源上的强者，经济上却只是个轻量级选手。日本的军事能力不算强，但潜艇部队与海军陆战队是重大例外——它们构成阻挡中国扩张主义的第一道重要屏障。以德国为锚的欧盟，作为商业与金融力量比美国小，但差距有限；而它的海军能力远远落后于自身的商业分量，英国也是如此。印度在每一个领域都有成为强国的潜力，但在任何一个领域都还没有把潜力完全变成实力。"},{"id":"conclusion-015","p":306,"t":"p","en":"Indeed, the decisions that India makes in the coming decade loom surprisingly large. Perhaps “surprising\" is the wrong word; after all, it is the world's most populous country and will likely soon overtake the UK to be the fifth-richest. How India chooses to manage the next phase of its energy growth will be the central question in the world's efforts to combat climate change.⁵ India has begun to make its presence felt in naval affairs; if New Delhi continues to deepen its naval cooperation with the West, then from the Bay of Bengal onward, the Indian navy will be a major obstacle in China's putative search for a global bluewater presence. Yet it is striking that for all of the scale of the Indian economy, if you list the world's top ports, there's no Indian entry in the top ten—nor even in the top twenty-five. It's an indicator that India has not yet genuinely chosen to open its economy to the world. If it does, it will open up new options for the remaking of globalization.","zh":"事实上，印度在未来十年作出的决定，分量之大出人意料。说“出人意料”也许并不恰当；毕竟它是世界人口第一大国，而且很可能很快超过英国，成为世界第五富国。印度选择如何安排下一阶段的能源增长，将是全世界应对气候变化努力中的核心问题。⁵ 印度已开始在海军事务中让人感到它的存在；如果新德里继续加深与西方的海军合作，那么从孟加拉湾往外，印度海军将成为中国寻求全球蓝水存在道路上的一大障碍。然而值得注意的是：尽管印度经济体量如此之大，若把世界主要港口排个序，前十名里没有一家印度港口——前二十五名里也没有。这说明印度还没有真正选择向世界开放经济。一旦它这样选择，重塑全球化就会多出新的选项。"},{"id":"conclusion-016","p":307,"t":"h","en":"Conflict or Coexistence?","zh":"冲突还是共存？"},{"id":"conclusion-017","p":307,"t":"p","en":"At the onset of the COVID-19 pandemic, the media, always hungry for an angle, shaped a narrative that COVID-19 would change everything, that nothing would be the same afterward. But that argument only holds if one believes that the world going into COVID was a world free of tension, carefully managing its interconnections. This book reveals something very different. More than a year into the pandemic, it seems quite wrong to say that COVID will change everything. Will US-China tensions ease? Will China, Japan, India, and the other Asian powers find new comity and calm in their relations? Will political distrust of globalization fade? Will climate change reverse itself, and the seas settle? Far from it. COVID has not changed things, so much as it has amplified the core tension of today's world—the sharp contradiction between deep economic and natural interconnection, and mounting geopolitical distrust.","zh":"新冠疫情初起时，一向急于找角度的媒体塑造出这样一种叙事：新冠将改变一切，此后一切都不会再一样。但这个说法要成立，前提是相信进入疫情之前的世界没有紧张，且小心翼翼地打理着彼此之间的联结。本书揭示的却大不相同。疫情已一年有余，说新冠将改变一切，看来相当不对。美中紧张会缓和吗？中国、日本、印度及其他亚洲强国能在彼此关系中找到新的礼让与平静吗？对全球化的政治不信任会消退吗？气候变化会逆转、海洋会平息吗？远非如此。新冠与其说改变了什么，不如说放大了当今世界的核心张力——深刻的经济与自然互联，同日益加剧的地缘政治不信任之间的尖锐矛盾。"},{"id":"conclusion-018","p":307,"t":"p","en":"The West also discovered that one of the things that container shipping brings to its markets is most of the world's supply of personal protective equipment (PPE)—the bulk of which is manufactured in China. It heightened a latent political interest in the West in moving away from globalized supply chains dependent on Beijing—what is referred to as “decoupling.\" But COVID also showed us how costly decoupling will be, if taken beyond small, focused measures like medical equipment. At the onset of the pandemic, racing to close their borders and spooked by early experiences of cruise ships serving as “superspreaders,\" countries around the world refused to allow the crews of container ships to disembark while in dock. As closures endured, it generated a sustained crisis in global shipping, as crews were living for months at a time isolated on their ships. It caused major slowdowns in the global economic supply—experienced in the US largely in the form of inconveniences, like the shortage of paper towels and bicycles in the spring of 2020. But it also affected the supply of Apple iPhones and other high-tech products imported in bulk by container ship, as well as automotive parts.6 Elsewhere, it was more serious—in Germany, knock-on effects from constrictions in global shipping brought the country to within days of serious interruptions in the food supply. It was all, of course, intensely illogical—the tiny crews of giant container ships, isolated at sea for days or weeks at a time, are about as quarantined as it's possible to be. But, dispiritingly, COVID showed us that even when confronted by a genuinely shared global challenge, fear and distrust will rapidly drown out logic and cooperation.","zh":"西方还发现，集装箱航运送到其市场上的东西里，包括全世界大部分的防护用品（PPE）——其中大部分产自中国。这加剧了西方一种潜在的政治意愿：摆脱依赖北京的全球化供应链——也就是所谓的“脱钩”。但新冠也让我们看到，一旦把脱钩推过医疗器械这类小而精准的举措，代价会有多高。疫情之初，各国争相关闭边界，又被早期邮轮充当“超级传播者”的经历吓住，纷纷拒绝让靠港集装箱船的船员下船。封锁持续下去，便在全球航运中造成一场持久危机：船员们一连几个月被隔离在船上。它使全球经济供应大幅放缓——在美国，这大体上表现为种种不便，比如2020年春天厨房纸和自行车缺货。但它也影响了苹果 iPhone 以及其他由集装箱船大批进口的高科技产品的供应，还有汽车零部件。⁶ 在其他地方，情况更严重：在德国，全球航运受阻的连锁反应，一度让该国的食品供应只差几天就要出现严重中断。这一切当然极不合逻辑——巨型集装箱船上那几个人数极少的船员，一次在海上隔离数日乃至数周，几乎是可能做到的极限隔离。但令人沮丧的是，新冠让我们看到：即便面对一个真正全球共有的挑战，恐惧与不信任也会迅速淹没理性与合作。"},{"id":"conclusion-019","p":308,"t":"p","en":"The huge benefits of globalization and the great cost of reversing it, combined with the reality that all countries' fates are tied together, make it tempting to hope that logic rather than fear will prevail when dealing with the epochal challenge of climate change. To believe that we will be led by women and men of responsibility who will find new, less dangerous ways to navigate this new era; that the issues that divide us can be managed by diplomats more than by destroyers. Tempting, too, to note that as the pressure mounts to find alternative, renewable sources of energy, a move away from fossil fuels will actually help the United States and China, and others, rediscover a sense of common interest in co-patrolling the sinews of global trade, just as they've sailed together to protect trade from piracy.","zh":"全球化的巨大好处、逆转它的巨大代价，再加上各国命运相连这一现实，使人不禁愿意相信：在应对气候变化这一划时代挑战时，理性而非恐惧终将占上风。愿意相信，带领我们的将是有担当的人，他们会为这个新时代找到新的、危险更小的航法；相信使我们分裂的问题，更多能由外交官而不是驱逐舰来料理。也让人愿意相信：随着寻找替代性可再生能源的压力加大，摆脱化石燃料实际上会帮助美国、中国以及其他国家，重新找到一种共同利益感，去共同巡护全球贸易的筋脉——就像它们曾经联合出海、保护贸易不受海盗侵扰那样。"},{"id":"conclusion-020","p":308,"t":"p","en":"Perhaps. But the exposition in this book reveals, and the response to COVID reminds us, of older patterns of fear and distrust, powerful forces through history, unfolding once again. From our shared globalization and shared exposure to global climate change, we are sailing into new waters; but the likelihood that they will be calm waters seems remote. We may find our way to effective decarbonization, but along the way we'll have to manage decoupling and spiraling distrust.","zh":"也许吧。但本书的叙述揭示了、对新冠的反应也提醒了我们：恐惧与不信任这些更古老的模式，这些在历史上屡屡发力的强大力量，又一次展开了。出于共同的全球化、共同面对全球气候变化，我们正驶入新的水域；但那会是平静水域的可能，看来渺茫。我们也许能找到有效的脱碳之路，但沿途必须应付脱钩与不断升级的不信任。"},{"id":"conclusion-021","p":308,"t":"p","en":"The great fear must be that the fraught, ongoing arms race playing out among Chinese, American, and Russian submarine fleets and missile systems will spill out from below those waters to pull these competing powers into active war, and erode the prospects for collaboration on climate change. So far, we've not seen great power tensions rise to the level of direct military confrontation; but the tidal pull that precedes a tsunami is gaining strength.","zh":"最该担心的是：中、美、俄三国潜艇舰队与导弹系统之间那场紧张而持续的军备竞赛，会从水面之下溢出，把这些相互竞争的大国拖入实战，并侵蚀气候合作的前景。到目前为止，大国紧张尚未升到直接军事对抗的程度；但海啸来临前那股退潮的拉力，正在增强。"},{"id":"conclusion-022","p":309,"t":"h","en":"How Should America Respond?","zh":"美国应当如何应对？"},{"id":"conclusion-023","p":309,"t":"p","en":"For decades, America was able to take for granted that it could dominate world affairs; no more. If the United States wants to compete from a position of strength, there's going to have to be a national conversation about several existing realities. We have to acknowledge, frankly that globalization has been very good for the US economy, but quite bad for the US polity. The status quo cannot be sustained. Either we pull away from globalization, at fantastic cost, or we remake it—both internationally, and in terms of who benefits, domestically.","zh":"几十年来，美国可以理所当然地认为自己能主导世界事务；这样的日子已经过去了。如果美国想以实力地位参与竞争，就必须就若干现实展开一场全国性的讨论。我们必须坦率承认：全球化对美国经济极有好处，对美国政治体制却相当有害。现状无法维持。要么以极高代价退出全球化，要么重塑它——在国际层面重塑，也在国内层面重塑，重新界定谁能受益。"},{"id":"conclusion-024","p":309,"t":"p","en":"We have to be clear-eyed about the fact that we are already deeply mired in an arms race with China, and a global naval arms race—that is not ahead of us; we are already in it. It's a race profoundly infused by questions of computational capacity-a race that could be won or lost in satellite bursts, subsea sensors, and AI algorithms just as much or more so than in hull-to-hull combat. And it's a race that could easily trip into a war that would be fought with devastating cost, with nuclear anti-submarine warfare once again in the mix. So far, US-China/ Russia tensions have not spilled into outright hostilities, but we are but a wavelength away from worse outcomes. And we have to confront the devil's dilemma posed by Taiwan.","zh":"我们必须清醒地看到：我们已经深陷与中国的军备竞赛，也深陷一场全球海军军备竞赛——它不是在前方等着我们，我们已经在里面了。这场竞赛深深浸透着算力问题——胜负可能取决于卫星突发通信、海底传感器与人工智能算法，其分量不亚于、甚至超过舰体对舰体的交战。这场竞赛还很容易绊进一场代价惨烈的战争，核反潜战会再次被纳入其中。到目前为止，美中、美俄的紧张还没有溢出为公开敌对，但我们离更糟的结局只差一个波长。我们还必须面对台湾问题带来的“魔鬼的两难”。"},{"id":"conclusion-025","p":309,"t":"p","en":"Finally, we have to recognize that climate change is not a future threat; it's a present reality. We should focus, to be sure, on reducing our national emissions as rapidly as feasible. But we also have to confront the challenge of climate adaptation, which is already upon us, and will continue to get worse for years to come—perhaps much worse.","zh":"最后，我们必须认识到：气候变化不是未来的威胁，而是当下的现实。我们当然应当着力于尽快削减本国排放。但我们也必须应对气候适应的挑战，它已经来到眼前，而且在今后许多年里还会继续恶化——也许会恶化得多。"},{"id":"conclusion-026","p":309,"t":"p","en":"All this suggests that the grand challenge of American statecraft is to squarely confront the tension between globalization and geopolitics. One option, in the face of internal contractions and rising risk, is simply to retreat. To leave Asia's waters to China, to sit back while China builds a network of bases and relationships for global power projection. Those who argue along these lines do so on the basis of several untested assumptions: that the result will be a peaceful Asia, or that conflicts in","zh":"这一切都说明，美国治国术的重大挑战，是正面应对全球化与地缘政治之间的张力。面对国内收缩与风险上升，一种选择就是干脆退却：把亚洲水域让给中国，坐视中国为全球力量投送搭建基地与关系网络。持这种主张的人，依据的是若干未经检验的假设：以为结果会是一个和平的亚洲，或者以为发生在"},{"id":"conclusion-027","p":310,"t":"p","en":"Asia will be limited and not impact the rest of the world; that the pathway to that state of affairs can be reached without crisis; that China's ambitions end in the western Pacific. All of these are theoretically possible outcomes. But the evidence casts doubt about this scenario. It is just as likely that the outcomes would be sustained tension and crisis in North Asia (source of 50 percent of world GDP), an intensification of Chinese global ambition and reach, and sustained loss of commercial and diplomatic advantage by the United States, and the wider West.","zh":"亚洲的冲突将是有限的、不会波及世界其他地方；以为通往那种局面的路可以在没有危机的情况下走完；以为中国的野心止于西太平洋。这些在理论上都是可能的结果。但证据让人怀疑这幅图景。同样可能的结果是：北亚（全球GDP的50%出自这里）陷入持续的紧张与危机，中国的全球野心与触角进一步扩张，而美国乃至整个西方持续丧失商业与外交优势。"},{"id":"conclusion-028","p":310,"t":"p","en":"Which is not to say that if the United States seeks to retain the advantages that come from an ability to profoundly shape world affairs it can do so free of great risk, and at low cost. Those days are now behind us. The US has no easy choices ahead. But it does have strengths, and advantages. And it can build a national strategy around them.","zh":"这并不是说，美国若想保住那种源自“能深刻塑造世界事务”的优势，就可以不冒大风险、不付高代价地做到。那样的日子已经过去了。摆在面前的选择没有一个是轻松的。但美国确实有实力，也有优势。它可以围绕这些来构建一项国家战略。"},{"id":"conclusion-029","p":310,"t":"p","en":"That starts with forging a new naval and computational \"alliance,\" building on but not limited to the Quad. In the Near Seas, some version of a \"mutually assured denial\" arrangement could stably cover the flow of trade. Beyond, tighter collaboration among the main Asian navies is an important element in constraining China's expansion and Russian aggression. NATO, retooled, can be a useful buttress to American power in the Arctic and the Atlantic. If China continues to expand its reach and ambition, the United States will have to forge a kind of \"alliance of alliances\" that links that capacity of NATO, the EU, the Quad and others—all of whom profit from the free flow of trade and energy—to keep the peace in the Pacific, the Arctic, the Indian Ocean, the Southern Ocean, and beyond.'","zh":"这要从打造一个新的海军与算力“同盟”开始，以四方机制为基础，但不限于四方机制。在近海，某种形式的“相互确保拒止”安排可以稳定地覆盖贸易流。更远处，亚洲主要海军之间更紧密的协作，是约束中国扩张与俄罗斯侵犯的重要一环。经过改造的北约，可以在北极与大西洋为美国的力量提供有力支撑。如果中国继续扩张其触角与野心，美国就不得不缔造一种“同盟的同盟”，把北约、欧盟、四方机制及其他各方的能力连接起来——它们都从贸易与能源的自由流动中获益——以维持太平洋、北极、印度洋、南大洋乃至更远海域的和平。*"},{"id":"conclusion-030","p":310,"t":"p","en":"Among the critical tasks—protect undersea cables. That's a task both for submarine and surface patrols, and for technology cooperation. And such cooperation is going to be vital if the West is to stay competitive in the AI race and the \"systems warfare\" that characterizes the new maritime battlefied (as well as the cyber one). The Biden administration, though it has not used these terms, certainly seems to be oriented to try to forge some version of this new alliance dynamic—no accident that President Biden's first international meeting (held virtually) was the inaugural summit-level meeting of the Quad.","zh":"关键任务之一，是保护海底光缆。这项任务既靠潜艇与水面巡逻，也靠技术合作。如果西方想在人工智能竞赛、以及在新型海战场（还有网络战场）上特有的“体系战”中保持竞争力，这种合作就至关重要。拜登政府虽然没用这些词，但显然有意尝试缔造某种版本的新型同盟动态——拜登总统的首场国际会议（以视频方式举行）就是四方机制的首次峰会，这并非偶然。"},{"id":"conclusion-031","p":310,"t":"p","en":"*In a four-leaders op-ed that replaced the traditional summit communiqué, the Quad said that it was open to participation by other like-minded states. Already Can-","zh":"*在取代传统峰会公报的四国领导人联合署名文章中，四方机制表示，它对志同道合的其他国家参与持开放态度。已经有加"},{"id":"conclusion-032","p":311,"t":"p","en":"The United States will also have to push its allies to think hard about how they would respond in a scenario where China launches a military bid to reclaim Taiwan. Direct response by the United States is still a possibility—but as China deepens its hold on the Near Seas, the cost of that kind of response rises, and the likelihood of success diminishes, even with new iterations of the multi-domain operations or Air-Sea Battle plans. Better to plan for “multi-geography\" responses-to use America's continuing global reach, and that of its allies, to deter China by creating risks and costs for Beijing far from its shores. Building on the idea of distant blockades, the US and its allies can highlight a new China dilemma—the more its global reach grows, the more it has farflung vulnerabilities. Putting pressure on those vulnerabilities—from its fishing fleet in Angolan waters to its oil interests in the Strait of Hormuz to its naval base in the Red Sea—may be lower risk than confronting China in its own maritime backyard. Presenting the Chinese with credible scenarios for American and allied response is an important deterrent—for the overall objective of American policy here should not be to win the war, but to avoid it occurring in the first place.","zh":"美国还必须推动盟友认真思考：如果中国发动军事行动收回台湾，它们将如何应对。美国直接回应仍是一种可能——但随着中国加深对近海的控制，这类回应的代价会上升，成功的可能性会下降，即便用上新版的多域作战或空海一体战方案也是如此。更好的做法是筹划“多地域”回应——利用美国及其盟友仍然具备的全球触角，在远离中国海岸的地方为北京制造风险与代价，以此威慑中国。在“远距封锁”构想的基础上，美国及其盟友可以突显中国面临的一个新两难：全球触角伸得越远，散布远方的脆弱点就越多。对这些脆弱点施压——从安哥拉水域的捕鱼船队，到霍尔木兹海峡的石油利益，再到红海的海军基地——风险或许低于在中国自家海上后院与它正面对抗。让中国看到美国与盟友回应的可信情景，本身就是一种重要威慑——因为美国政策在此处的总体目标不应是打赢战争，而是让战争根本不发生。"},{"id":"conclusion-033","p":311,"t":"p","en":"At the same time, the United States has to tackle the question of winners and losers from globalization. Here, too, retreat is a theoretical option-one that President Trump tried, with his trade tariffs on China. It was a largely unsuccessful strategy, which did more to impose costs on the United States than on Beijing.* And it only takes one visit to the Centralized Examination Station in Elizabeth, New Jersey, to reveal how much of its own economy the United States would have to remake if it wanted to unwind sixty years of global economic trade. Rather, the US should reanimate its engagement with globalization, and look to domestic policy to broaden the profit-sharing from America's continued vast financial stake in the operation of the global economy.","zh":"与此同时，美国必须处理全球化中的赢家与输家问题。这里同样，退却是理论上的一个选项——特朗普总统试过，用他对华贸易关税。那基本上是一场失败的策略，它给美国造成的代价，大于给北京造成的。* 而只要去一趟新泽西州伊丽莎白的集中查验站（Centralized Examination Station），就能看出：美国若想拆解60年的全球经济贸易，得把自家经济改造多大一部分。相反，美国应当重新激活它对全球化的参与，并通过国内政策，让美国在全球经济运行中持续持有的巨额金融权益所产生的利润，得到更广泛的分享。"},{"id":"conclusion-034","p":311,"t":"p","en":"On climate change: the crucial task obviously is to adopt the kinds of plans needed to abate carbon emissions, and sustain global cooperation on climate mitigation. But in addition, the United States should focus squarely on the issue of adaptation. And here, the United States should mobilize one of its key advantages—its world-class capacity for maritime engineering, exemplified by deep-sea energy exploration, heavily concentrated in Texas. Very soon, both the US itself and the rest of the world are going to need a great deal of advanced engineering to deal with sealevel rise. Only two nations, so far, are equipped to supply it at scale: the United States and China, with the US holding a sizable technological and managerial edge. Who leads this industry, and on what terms, may prove as consequential to the next set of global developments as the current battle over China's Belt and Road infrastructure--an investment closely tied, of course, to its huge stake in global sea-based trade. And in the US, an emphasis on maritime engineering has the advantage of cutting across the blue/red state divide on trade and globalization; Alaska, Texas, Florida, and Maine would be important beneficiaries of such an approach, in addition to California, Washington, and Virginia.","zh":"在气候变化问题上：关键任务显然在于制定减排所需的各类方案，并维持全球在减缓气候变化方面的合作。但除此之外，美国还应把重点牢牢放在气候适应问题上。在这方面，美国应当调动自己的一项关键优势——世界一流的海洋工程能力，深海能源勘探即为范例，而这一行业高度集中于得克萨斯。用不了多久，美国自身和世界其他地区都将需要大量先进工程技术来应对海平面上升。到目前为止，能大规模提供这种工程的只有两个国家：美国和中国，而美国在技术与管理上握有相当大的优势。谁将主导这一产业、按什么条件主导，对下一轮全球格局演变的影响，也许不亚于当下围绕中国“一带一路”基础设施的角逐——当然，那笔投资与中国在全球海运贸易中的巨大利益紧密相连。而且在美国，强调海洋工程还有一个好处：它能超越贸易与全球化问题上的蓝州、红州分野；除加利福尼亚、华盛顿、弗吉尼亚之外，阿拉斯加、得克萨斯、佛罗里达和缅因也将成为这一路径的重要受益者。"},{"id":"conclusion-035","p":311,"t":"n","en":"ada has conducted naval exercises in a Quad+ format, and South Korea has been exploring a range of forms of collaboration with Quad navies.","zh":"拿大以“四方+”（Quad+）形式举行过海军演习，韩国也一直在探索与四方机制各国海军开展各种形式的合作。"},{"id":"conclusion-036","p":311,"t":"n","en":"Would that Trump's advisers had told him the story of King Canute (familiar to Maersk's employees)—an apocryphal Danish king who sat on his throne beside the beach and commanded the tide to stop flowing. When it did not, he told his courtiers, \"Let all men know how empty and worthless is the power of kings.\"","zh":"但愿特朗普的顾问曾给他讲过克努特国王（King Canute）的故事（马士基的员工耳熟能详）——那是一位传说中未必真有其事的丹麦国王，他坐在海边的王座上，命令潮水停止上涨。潮水没有听命，他便对廷臣说：“让所有人都知道，国王的权力是多么空洞、多么一文不值。”"},{"id":"conclusion-037","p":312,"t":"p","en":"In all of this, the United States should sustain, celebrate, and where necessary revitalize one of its most important, but unheralded, advantages: its world-leading network of institutes and installations for the ocean sciences. Whether in the naval domain, on the sustainability of the oceans' biodiversity and fisheries, on the threat to that sustainability from a mounting challenge of microplastics in the ocean, to new opportunities in deep-ocean minerals mining, or on the fundamentals of climate change, the ocean sciences remain a bedrock capacity for international leadership, as they were at the height of the imperial age.","zh":"在这一切之中，美国应当维持、珍视，并在必要时重振自己最重要却鲜为人知的一项优势：世界领先的海洋科研机构与设施网络。无论是海军领域，还是海洋生物多样性与渔业的可持续性，无论是海洋中日益严峻的微塑料问题对这种可持续性构成的威胁，还是深海矿产开采带来的新机遇，抑或是气候变化的基本机理，海洋科学始终是支撑国际领导力的基石性能力，一如它在帝国鼎盛时期那样。"},{"id":"conclusion-038","p":312,"t":"p","en":"Once, oceans were the boundary of our existence; now they are the front lines of the new rivalries that will shape the twenty-first century. All but the tiniest fraction of humankind resides on land, works on land, interacts with other humans primarily on the land. It is entirely possible to live a rich life and never once set foot in the world's oceans; a substantial portion of humanity lives their entire existence without even ever setting eyes on them. And yet the seas shape the world around us. It is on the oceans that the great struggles of our day—for military power, for economic dominance, over our changing climate— are playing out. Our security, our prosperity, and our environment hang in the balance.","zh":"曾几何时，海洋是我们存在的边界；如今，它们是塑造21世纪的新一轮角逐的前线。除了极小的一部分人，人类全都住在陆地上、在陆地上工作，也主要在陆地上与他人往来。一个人完全可以过富足的生活，却从未踏足海洋；人类中相当大的一部分，终其一生甚至不曾看过大海一眼。然而，海洋塑造着我们周围的世界。我们这个时代的重大较量——对军事力量的争夺、对经济主导权的争夺、围绕不断变化的气候而展开的较量——正是在海洋上上演。我们的安全、我们的繁荣、我们的环境，都悬于其间。"}],"notes":[]}]};</script>
<script>
(function(){
  const reader = document.getElementById('reader');
  const wrap = document.getElementById('wrap');
  const tocEl = document.getElementById('toc');
  const sidefoot = document.getElementById('sidefoot');
  const posEl = document.getElementById('pos');
  const CH = BOOK.chapters;
  let cur = 0;
  const LS = (function(){
    try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return localStorage; }
    catch(e){ const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k,v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; }
  })();

  /* ---------- 主题 / 字号 / 模式 ---------- */
  const theme = LS.getItem('rtw.theme') || 'dark';
  document.documentElement.dataset.theme = theme;
  let fs = parseFloat(LS.getItem('rtw.fs') || '17.5');
  document.documentElement.style.setProperty('--fs', fs + 'px');
  let mode = LS.getItem('rtw.mode') || 'both';
  setMode(mode, false);

  function setMode(m, save){
    mode = m;
    document.body.className = 'mode-' + m;
    document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
    if (save !== false) LS.setItem('rtw.mode', m);
  }
  document.getElementById('mode').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) setMode(b.dataset.m);
  });
  document.getElementById('theme').onclick = () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t; LS.setItem('rtw.theme', t);
  };
  const applyFs = () => { document.documentElement.style.setProperty('--fs', fs + 'px'); LS.setItem('rtw.fs', fs); };
  document.getElementById('fsup').onclick = () => { fs = Math.min(26, fs + 1); applyFs(); };
  document.getElementById('fsdown').onclick = () => { fs = Math.max(13, fs - 1); applyFs(); };

  /* ---------- 目录 ---------- */
  const cov = c => {
    const n = c.paras.length, d = c.paras.filter(p => p.zh).length;
    return n ? Math.round(d / n * 100) : 0;
  };
  function buildToc(){
    let h = '', lastPart = null;
    CH.forEach((c, i) => {
      if (c.part && c.part !== lastPart){
        lastPart = c.part;
        h += `<div class="pt">${c.partZh}<i>${c.partTitleZh}</i></div>`;
      }
      const pct = cov(c);
      h += `<a href="#${c.id}" data-i="${i}"><span class="n">${String(i).padStart(2,'0')}</span>` +
           `<span class="t">${c.titleZh || c.title}</span>` +
           `<span class="pct">${pct === 100 ? '✓' : (pct ? pct + '%' : '')}</span></a>`;
    });
    tocEl.innerHTML = h;
    tocEl.querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); go(+a.dataset.i); });
  }
  function markToc(){
    tocEl.querySelectorAll('a').forEach(a => a.classList.toggle('on', +a.dataset.i === cur));
    const on = tocEl.querySelector('a.on'); if (on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
  }

  /* ---------- 渲染 ---------- */
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function render(i){
    const c = CH[i];
    let h = '';
    if (c.showPart) h += `<div class="parthead"><div class="p1">${c.partZh}</div><div class="p2">${c.partTitleZh}</div></div>`;
    h += `<div class="chhead">
      <div class="kicker">${c.labelZh || c.label.toUpperCase()}</div>
      <h1>${c.titleZh || c.title}</h1>
      <h2>${c.title}</h2>
      <div class="meta">${c.paras.length} 段 · 原书第 ${c.paras[0] ? c.paras[0].p : ''}–${c.paras.length ? c.paras[c.paras.length-1].p : ''} 页</div>
    </div>`;
    c.paras.forEach(p => {
      const cls = p.t === 'h' ? ' sub' : (p.t === 'n' ? ' note' : '');
      h += `<div class="row${cls}${p.zh ? '' : ' nozh'}" id="${p.id}">
        <span class="pg">${p.t === 'n' ? '注' : p.p}</span>
        <div class="en">${esc(p.en)}</div>
        <div class="zh">${p.zh ? esc(p.zh) : ''}</div>
      </div>`;
    });
    if (c.notes && c.notes.length){
      h += `<div class="notes"><h3>原文脚注（OCR 保留）</h3>`;
      c.notes.forEach(n => h += `<p>${esc(n.en)}</p>`);
      h += `</div>`;
    }
    h += `<div class="chfoot">
      <button id="pv">← ${i > 0 ? CH[i-1].titleZh : ''}</button>
      <button id="nx">${i < CH.length-1 ? CH[i+1].titleZh : ''} →</button>
    </div>`;
    wrap.innerHTML = h;
    const pv = document.getElementById('pv'), nx = document.getElementById('nx');
    if (pv) pv.onclick = () => go(Math.max(0, i - 1));
    if (nx) nx.onclick = () => go(Math.min(CH.length - 1, i + 1));
    posEl.textContent = `${i + 1} / ${CH.length}`;
    markToc();
  }

  let saveTimer = null;
  reader.addEventListener('scroll', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const r = reader.scrollTop / Math.max(1, reader.scrollHeight - reader.clientHeight);
      LS.setItem('rtw.pos.' + CH[cur].id, r.toFixed(4));
      LS.setItem('rtw.last', cur);
    }, 300);
  });

  function go(i, targetId){
    cur = i;
    render(i);
    const r = LS.getItem('rtw.pos.' + CH[i].id);
    if (targetId){
      const el = document.getElementById(targetId);
      if (el) { reader.scrollTop = el.offsetTop - 90; el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1800); }
    } else {
      reader.scrollTop = r ? (+r) * (reader.scrollHeight - reader.clientHeight) : 0;
    }
    try { history.replaceState(null, '', '#' + CH[i].id); } catch(e) {}
  }
  document.getElementById('prev').onclick = () => go(Math.max(0, cur - 1));
  document.getElementById('next').onclick = () => go(Math.min(CH.length - 1, cur + 1));

  /* ---------- 检索 ---------- */
  const sEl = document.getElementById('search'), sIn = document.getElementById('sinput'), sRes = document.getElementById('sres');
  function openSearch(){ sEl.classList.add('on'); sIn.focus(); sIn.select(); }
  function closeSearch(){ sEl.classList.remove('on'); }
  document.getElementById('opensearch').onclick = openSearch;
  sEl.addEventListener('click', e => { if (e.target === sEl) closeSearch(); });

  function snippet(t, q){
    const i = t.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(t.slice(0, 120)) + '…';
    const a = Math.max(0, i - 45), b = Math.min(t.length, i + 120);
    return (a ? '…' : '') + esc(t.slice(a, i)) + '<b>' + esc(t.slice(i, i + q.length)) + '</b>' + esc(t.slice(i + q.length, b)) + '…';
  }
  let timer = null;
  sIn.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const q = sIn.value.trim();
      if (q.length < 2) { sRes.innerHTML = '<div class="tip">至少输入 2 个字符。</div>'; return; }
      const hits = [];
      for (const c of CH){
        for (const p of c.paras){
          if (p.en.toLowerCase().includes(q.toLowerCase()) || (p.zh && p.zh.includes(q))){
            hits.push({c, p});
            if (hits.length > 200) break;
          }
        }
        if (hits.length > 200) break;
      }
      if (!hits.length){ sRes.innerHTML = '<div class="tip">没有找到。</div>'; return; }
      sRes.innerHTML = hits.slice(0, 60).map(h => {
        const zh = h.p.zh ? snippet(h.p.zh, q) : '';
        const en = snippet(h.p.en, q);
        return `<a href="#${h.p.id}" data-ch="${CH.indexOf(h.c)}" data-id="${h.p.id}">
          <span class="loc">${h.c.titleZh} · 原书第 ${h.p.p} 页</span>
          ${zh ? `<div class="zh">${zh}</div>` : ''}
          <div style="color:var(--fg3)">${en}</div></a>`;
      }).join('');
      sRes.querySelectorAll('a').forEach(a => a.onclick = e => {
        e.preventDefault(); closeSearch();
        go(+a.dataset.ch, a.dataset.id);
      });
    }, 160);
  });

  document.addEventListener('keydown', e => {
    if (sEl.classList.contains('on')){
      if (e.key === 'Escape') closeSearch();
      return;
    }
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === 'ArrowLeft') go(Math.max(0, cur - 1));
    else if (e.key === 'ArrowRight') go(Math.min(CH.length - 1, cur + 1));
    else if (e.key === '/'){ e.preventDefault(); openSearch(); }
    else if (e.key === 'Escape') closeSearch();
  });

  /* ---------- 启动 ---------- */
  buildToc();
  const total = CH.reduce((s, c) => s + c.paras.length, 0);
  const done = CH.reduce((s, c) => s + c.paras.filter(p => p.zh).length, 0);
  sidefoot.innerHTML = `英汉对照阅读版 · 原文据 Scribner 2021 年版<br>已译 ${done} / ${total} 段（${Math.round(done/total*100)}%）`;
  let start = +(LS.getItem('rtw.last') || 0);
  const hash = location.hash.slice(1);
  if (hash){ const k = CH.findIndex(c => c.id === hash); if (k >= 0) start = k; }
  go(start || 0);
})();
</script>
</body>
