<title>统治海洋 · To Rule the Waves（英汉对照）</title>
<style>
:root{
  --bg:#14161a; --bg2:#1a1d22; --bg3:#22262c; --line:#2c3138;
  --fg:#e6e3dc; --fg2:#a8a49b; --fg3:#6f6b64;
  --accent:#c9a227; --accent2:#8a6f1a;
  --en:#d8d4cb; --zh:#eeeae2;
  --top:54px; --side:268px;
}
html[data-theme="light"]{
  --bg:#faf8f4; --bg2:#f2efe8; --bg3:#e8e4db; --line:#dbd6ca;
  --fg:#26231e; --fg2:#5c574e; --fg3:#8d877c;
  --accent:#8a6a12; --accent2:#c9a227;
  --en:#2b2823; --zh:#1d1b17;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg)}
body{font-family:"Helvetica Neue",-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- 顶栏 ---------- */
header{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:40;
  display:flex;align-items:center;gap:14px;padding:0 18px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand b{font-size:15px;letter-spacing:.04em;font-weight:600;white-space:nowrap}
.brand span{font-size:11.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--fg2)}
.seg button.on{background:var(--bg3);color:var(--fg)}
.iconbtn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--fg2);font-size:13px}
.iconbtn:hover{background:var(--bg3);color:var(--fg)}
.nav{display:flex;align-items:center;gap:6px;color:var(--fg2);font-size:12.5px}

/* ---------- 侧栏 ---------- */
aside{position:fixed;top:var(--top);left:0;bottom:0;width:var(--side);z-index:30;
  background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column}
.toc{overflow-y:auto;padding:12px 0 24px;flex:1}
.toc::-webkit-scrollbar,.reader::-webkit-scrollbar{width:9px}
.toc::-webkit-scrollbar-thumb,.reader::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:9px}
.toc .pt{padding:16px 18px 6px;font-size:10.5px;letter-spacing:.16em;color:var(--fg3);text-transform:uppercase}
.toc .pt i{font-style:normal;display:block;font-size:12.5px;letter-spacing:.05em;color:var(--fg2);margin-top:3px}
.toc a{display:flex;gap:9px;align-items:baseline;padding:7px 18px 7px 18px;text-decoration:none;color:var(--fg2);
  font-size:13px;line-height:1.45;border-left:2px solid transparent}
.toc a:hover{background:var(--bg3);color:var(--fg)}
.toc a.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--fg);border-left-color:var(--accent)}
.toc a .n{font-size:10.5px;color:var(--fg3);min-width:16px;font-variant-numeric:tabular-nums}
.toc a .t{flex:1}
.toc a .pct{font-size:9.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.sidefoot{padding:10px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--fg3);line-height:1.6}

/* ---------- 正文 ---------- */
.reader{position:fixed;top:var(--top);left:var(--side);right:0;bottom:0;overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:1500px;margin:0 auto;padding:0 46px 40vh}
.chhead{padding:64px 0 26px;border-bottom:1px solid var(--line);margin-bottom:8px}
.chhead .kicker{font-size:11px;letter-spacing:.18em;color:var(--accent);margin-bottom:14px}
.chhead h1{font-family:"Songti SC","Source Han Serif SC","Noto Serif CJK SC",serif;
  font-size:33px;line-height:1.35;margin:0 0 8px;font-weight:600;letter-spacing:.01em}
.chhead h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:17px;font-weight:400;color:var(--fg2);margin:0 0 4px;font-style:italic}
.chhead .meta{margin-top:16px;font-size:11.5px;color:var(--fg3);letter-spacing:.04em}

.parthead{padding:56px 0 10px}
.parthead .p1{font-size:11px;letter-spacing:.2em;color:var(--accent)}
.parthead .p2{font-family:"Songti SC","Source Han Serif SC",serif;font-size:26px;margin-top:8px;font-weight:600}

.row{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;padding:0;position:relative;
  border-radius:6px;transition:background .15s}
.row:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.row>div{padding:13px 6px 13px 0;position:relative}
.row .en{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:calc(var(--fs,17.5px) * .99);line-height:1.72;color:var(--en);letter-spacing:.005em}
.row .zh{font-family:"Songti SC","Source Han Serif SC","Noto Serif CJK SC",serif;
  font-size:var(--fs,17.5px);line-height:1.95;color:var(--zh);letter-spacing:.01em}
.row .pg{position:absolute;left:-34px;top:16px;font-size:9.5px;color:var(--fg3);
  font-variant-numeric:tabular-nums;opacity:0;transition:opacity .15s}
.row:hover .pg{opacity:1}
.row.flash{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.row.nozh .zh:after{content:"（待译）";color:var(--fg3);font-size:12px}
.row.sub{align-items:end;margin:34px 0 10px}
.row.sub .pg{visibility:hidden}
.row.sub .en{font-weight:600;font-size:calc(var(--fs,17.5px) * .96);color:var(--fg);letter-spacing:.01em}
.row.sub .zh{font-weight:600;font-size:calc(var(--fs,17.5px) * .98);color:var(--zh)}
.row.note{margin:6px 0 18px}
.row.note .pg{font-size:9.5px;color:var(--acc);letter-spacing:.1em;padding-top:4px}
.row.note .en,.row.note .zh{font-size:calc(var(--fs,17.5px) * .8);line-height:1.7;color:var(--fg2);opacity:.9}

/* 模式 */
body.mode-en .row{grid-template-columns:1fr}
body.mode-en .row .zh{display:none}
body.mode-zh .row{grid-template-columns:1fr}
body.mode-zh .row .en{display:none}
body.mode-zh .wrap{max-width:900px}

.notes{margin-top:40px;padding-top:20px;border-top:1px dashed var(--line)}
.notes h3{font-size:12px;letter-spacing:.14em;color:var(--fg3);font-weight:500;margin:0 0 12px}
.notes p{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:13px;line-height:1.7;color:var(--fg2);margin:0 0 8px}

.chfoot{display:flex;justify-content:space-between;gap:16px;margin-top:48px;padding-top:22px;border-top:1px solid var(--line)}
.chfoot button{padding:9px 16px;border:1px solid var(--line);border-radius:8px;color:var(--fg2);font-size:13px}
.chfoot button:hover{border-color:var(--accent);color:var(--fg)}

/* ---------- 搜索 ---------- */
#search{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(6px);display:none}
#search.on{display:block}
.sbox{max-width:760px;margin:110px auto 0;background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.sbox input{width:100%;padding:16px 20px;font-size:16px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);outline:none}
.sres{max-height:56vh;overflow-y:auto}
.sres a{display:block;padding:12px 20px;text-decoration:none;color:var(--fg2);border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}
.sres a:hover{background:var(--bg3)}
.sres a b{color:var(--accent);font-weight:500}
.sres .loc{font-size:10.5px;color:var(--fg3);letter-spacing:.06em;display:block;margin-bottom:3px}
.sres .zh{color:var(--fg);font-size:13.5px}
.tip{padding:14px 20px;font-size:11.5px;color:var(--fg3)}

@media (max-width:1080px){
  aside{display:none}
  .reader{left:0}
  .wrap{padding:0 22px 40vh}
  .row{grid-template-columns:1fr;gap:0}
  .row>div{padding:9px 0}
  .row .en{border-bottom:1px dashed var(--line);padding-bottom:12px}
}

<script>const BOOK = {"title":"To Rule the Waves","titleZh":"统治海洋","subtitle":"How Control of the World's Oceans Shapes the Fate of the Superpowers","subtitleZh":"世界海洋的控制权如何塑造超级大国的命运","author":"Bruce D. Jones","authorZh":"布鲁斯·D. 琼斯","chapters":[{"id":"prologue","label":"Prologue","labelZh":"","title":"A Box in the Jungle","titleZh":"序章　丛林里的一只箱子","part":null,"showPart":false,"partZh":"","partTitleZh":"","paras":[{"id":"prologue-001","p":1,"t":"p","en":"The heart of the Amazon is more than a thousand miles from the ocean. To get there, one must fly to Manaus, Brazil, in the very center of the rainforest. First established as a fort by Portuguese explorers in 1669, the outpost was of little account for its first century and a half until the industrial revolution created a demand for a plant brought back from the Amazon—rubber. Bendable, shapable, useful for thousands of purposes, rubber became an essential component in industrialization, and at the time could not be sourced anywhere but from the Amazon. In the race for profit that followed, German, Portuguese, and American businessmen vied for access to the Amazonian rubber tree, and Manaus become a hub of imperial commerce. The fossils of that period adorn the city to this day-from a seven-story mansion in the style of a Bavarian Schloss, a market building built as a replica of Paris's Les Halles, and the Teatro Amazonas, to a pink and white opera house topped by a dome covered with thirty-three thousand ceramic tiles painted the yellow, green, and blue of the Brazilian flag-one of the more surprising marvels of the late imperial age. It's a gritty town of wilderness and industry and eccentricity surrounded in every direction by over 1,500 miles of rainforest.","zh":"亚马孙雨林的心脏地带，离大洋有一千多英里。要抵达那里，得先飞到巴西的玛瑙斯，那地方正落在雨林的最深处。1669 年，葡萄牙探险者在此筑起一座堡垒；此后一个半世纪，这个前哨默默无闻，直到工业革命对一种从亚马孙带回的植物生出需求——橡胶。橡胶可弯可塑，用途数以千计，成了工业化不可或缺的原料，而当时除了亚马孙，别处无从获得。随之而来的逐利竞赛中，德国、葡萄牙和美国的商人争相打通获取亚马孙橡胶树的门路，玛瑙斯于是成了帝国商业的枢纽。那个时代留下的化石至今仍在装点这座城市：一幢巴伐利亚宫殿风格的七层宅邸、一座仿巴黎中央菜市场（Les Halles）建造的市场大楼，还有亚马孙剧院——一座粉白两色的歌剧院，穹顶铺着三万三千块瓷砖，漆成巴西国旗的黄、绿、蓝。这是帝国时代晚期最令人意外的奇观之一。这是一座粗粝的城，荒野、工业与怪癖杂糅一处，四望皆是绵延 1,500 多英里的雨林。"},{"id":"prologue-002","p":1,"t":"p","en":"The vastness of the rainforest is broken only by the Amazon River, which courses along the banks of Manaus, three miles wide and seven hundred feet deep-neither the widest nor the deepest stretch of the Amazon, but still moving an astonishing volume of water.* Manaus also borders another river, the Rio Negro, or Black River, which runs","zh":"雨林的浩莽只被亚马孙河划开一道。这条河从玛瑙斯城边流过，河面宽 3 英里，深 700 英尺——既不是亚马孙河最宽的一段，也不是最深的一段，水量却依然大得惊人。* 玛瑙斯还濒着另一条河——内格罗河（Rio Negro），意即黑河。它"},{"id":"prologue-003","p":1,"t":"n","en":"Across its epic span, the Amazon River carries more water than all of the rivers of Europe combined.","zh":"亚马孙河纵贯其史诗般的全程，所携水量超过欧洲所有河流的总和。"},{"id":"prologue-004","p":2,"t":"p","en":"1,400 miles southwest from the highlands of Colombia, emptying into the Amazon. Its name comes from the color of the water, a kind of translucent chocolate black, like someone had poured the world's supply of Coca-Cola into a riverbed. Where the two rivers meet and start to flow together at Manaus, a strange natural phenomenon occurs. For the space of three and a half miles, the two rivers flow through the same wide channel, but their waters do not mingle: they flow alongside each other, one chalky and the color of sand, the other thin and dark—two parallel streams of water surging, touching, occasional eddies swirling together, but not merging. This is caused by the radically different densities of the two bodies of water, the one full of vegetable residue accumulated as it runs through the upper stretches of the rainforest, the other scraped clean of anything other than minerals by its long descent down the mountains. In Manaus it is known as the \"Meeting of the Waters,\" though that hardly captures the wondrous oddity of the sight.","zh":"从哥伦比亚高地一路向西南蜿蜒 1,400 英里，最终注入亚马孙河。河名来自水色：一种半透明的巧克力黑，像是有人把全世界的可口可乐都倒进了河床。两条河在玛瑙斯相遇、开始并流之处，会出现一种奇特的自然现象。整整 3.5 英里的河段里，两条河共用一条宽阔河道，水却不相融：它们并肩而流，一条乳白如沙，一条清薄黝暗——两道平行的水流奔涌、相触，偶有漩涡纠缠在一处，却始终不混合。原因在于两股水体的密度相差悬殊：一股流经雨林上游，积满植物残渣；另一股从高山上长驱而下，除矿物质之外被冲刷得一干二净。玛瑙斯人称之为“河之相会”，可这名字远不足以道出那景象的奇崛。"},{"id":"prologue-005","p":2,"t":"p","en":"One may take a riverboat out to see the Meeting of the Waters, and the aquatic life it attracts. Of particular appeal is a subspecies of pink dolphins unique to the Amazon. They concentrate at the confluence of the two rivers, where the separate streams mingle and churn up an abundance of fish on which to feed. The giant Amazonian pirarucú, or arapaima, is a staple of the dolphins' diet, and of the cuisine found in the restaurants of Manaus.","zh":"可以乘河船出去看“河之相会”，也看它招来的水生动物。最吸引人的是亚马孙特有的一种粉色淡水豚亚种。它们聚在两条河的交汇处——两股水流在那里混杂、翻搅，把大量鱼群卷上水面，正好供它们捕食。巨型的亚马孙巨骨舌鱼（pirarucú，又称 arapaima）既是粉豚的主食，也是玛瑙斯各家餐馆里的一道家常菜。"},{"id":"prologue-006","p":2,"t":"p","en":"There, amid the whimsy of the remote city and splendor of the rainforest, I saw a familiar but wholly unexpected sight: a stack of sky-blue metal containers, neatly piled on a small container ship steaming its way upriver against the strong current. The boxes were instantly recognizable by their color and logo—a seven-pointed star painted white against the sky-blue backdrop—the symbol of Maersk, a shipping giant headquartered in Copenhagen, Denmark, a distance from Manaus of six thousand miles as the crow flies.","zh":"就在那里，在这座偏远小城的奇趣与雨林的壮丽之间，我看到一幅熟悉却又完全意想不到的景象：一摞天蓝色的金属集装箱，整整齐齐码在一艘小型集装箱船上，那船正顶着强劲的水流逆流而上。那些箱子凭颜色和标志一眼就能认出——天蓝底色上漆着一颗白色的七角星——马士基的标志。这家航运巨头总部设在丹麦哥本哈根，与玛瑙斯的直线距离有六千英里。"},{"id":"prologue-007","p":2,"t":"p","en":"That Maersk had a wide global reach did not surprise me, but to find some of its containers on the deck of a transport ship 1,500 miles up the Amazon was eye-opening. If there was ever a visible symbol of the total worldwide penetration of modern globalization, this was surely it. And the sight established for me something I had understood intellectually but not viscerally: that it is sea-based trade that is the primary driver of modern globalization. There in the heart of the rainforest was the evidence.","zh":"马士基的触角遍及全球，这我并不意外；但在深入亚马孙河 1,500 英里的一艘运输船甲板上看到它的集装箱，还是让我大开眼界。如果说现代全球化对世界的全面渗透需要一个看得见的象征，那一定就是它。这景象也让我确认了一件理智上明白、感受上却从未真切体会的事：海上贸易才是现代全球化的首要驱动力。证据就在雨林深处。"},{"id":"prologue-008","p":3,"t":"p","en":"Shipping containers are now a ubiquitous feature of the modern world. Once you start looking for them, you can't stop seeing them. Drive down the highways and byways of the United States or Europe and you notice these containers everywhere. The 18-wheeler is a storied part of the American history of continental trucking; but it's been displaced by the “prime mover\"—a flatbed truck onto which is latched one of these shipping containers. Containers have also remade rail: watch a train transport at a road crossing and you are bound to see the Maersk logo on container boxes stacked two high on these freight trains, alongside containers from Taiwan, Korea, South Africa, Germany, and many points beyond. 'There's a secondary market for containers for housing and industrial design. You can even buy used containers on Amazon. But at the core, they are an instrument of global trade—the most visible, but as it turns out far from the only, manifestation of the way bulk shipping has transformed the world economy—and is starting to transform world politics.","zh":"集装箱如今已是现代世界无处不在的物件。一旦开始留意，你就再也无法视而不见。开车走在美国或欧洲的大路小道上，你会发现这些箱子到处都是。18 轮大卡车曾是美国大陆公路货运史上传奇性的一页，如今已被“牵引头”取代——一辆平板卡车，扣上一只集装箱。集装箱也重塑了铁路：在道口看一列货车通过，你一定会看到堆叠两层的箱体上印着马士基的标志，旁边还有来自台湾、韩国、南非、德国以及更远地方的集装箱。集装箱另有二手市场，供住宅与工业设计之用，你甚至能在亚马逊网站上买到用过的集装箱。但归根结底，它们是全球贸易的工具——是大宗海运如何改造世界经济、并已开始改造世界政治的最醒目、却远非唯一的表现。"},{"id":"prologue-009","p":3,"t":"p","en":"The penetration of Western trade into central Brazil was just one part of a wider phenomenon that has been unfolding over the past three decades. Brazil was one of several important, populous countries—China and India being two essential others—that decided at the end of the Cold War to open up their economies and join the maelstrom of globalization. The entry of more than 2.5 billion people into the global economy has had dramatic effects. Many of those changes have been for the good. China, India, and Brazil between them pulled more than a half a billion people out of poverty and created a global middle class. Internationally, more than sixty countries were pulled out of poverty by the ever-further expansion of the world economy, and by China's huge appetite for natural resources and exports of cheap manufactured goods—a dynamic made possible by changes in global shipping. Having grown into an economic giant, China helped the United States navigate the global financial crisis, and Chinese growth helped the rest of the world recover from that shock. The Singaporean diplomat-turned-writer Kishore Mahbubani, one of the foremost chroniclers of the rise of Asia, made popular in his book The Great","zh":"西方贸易渗入巴西腹地，只是过去三十年间展开的一场更大变局的一角。冷战结束时，有几个重要的人口大国决定开放经济、投入全球化的漩涡，巴西是其中之一，中国和印度是另外两个关键角色。25 亿多人进入全球经济，带来的影响是剧烈的。其中许多变化是好的。中国、印度和巴西三国合力，把五亿多人拉出了贫困，也造就了一个全球中产阶层。在世界范围内，六十多个国家因世界经济的不断扩张而摆脱贫困，靠的是中国对自然资源的巨大胃口和廉价制成品的出口——这一态势之所以可能，全赖全球航运的变革。成长为经济巨人之后，中国帮助美国度过了全球金融危机，中国的增长也帮助世界其他地区从那次冲击中复苏。新加坡外交官出身的作家马凯硕（Kishore Mahbubani）是记述亚洲崛起最重要的作者之一，他在《伟大的"},{"id":"prologue-010","p":4,"t":"p","en":"Convergence the application of an old aphorism to the phenomenon of modern globalization: \"A rising tide lifts all boats.\"","zh":"融合》（The Great Convergence）一书中，把一句老话套用到现代全球化这一现象上，使之广为流传：“水涨船高。”"},{"id":"prologue-011","p":4,"t":"p","en":"The tides were also critical to a second part of the changing story of the global economy: energy. Here, too, Brazil played a key role, though not in the Amazon. For it was in the long gentle slopes of the continental shelf off of Brazil's eastern shore that deep-sea energy exploration first took hold outside of the United States. Pulling other countries into globalization meant huge economic growth, and that in turn put major pressure on the world's supplies of oil and gas. The plumbing of the ocean depths for new sources of those fuels has been a critical part of the changing patterns of trade and geopolitics in the past decade, from Brazil to the East China Sea to the Arctic Ocean.","zh":"潮水对全球经济变迁故事的第二部分——能源——同样至关重要。这里巴西也扮演了关键角色，只是不在亚马孙。正是在巴西东岸外大陆架那些平缓绵长的斜坡上，深海能源勘探第一次在美国之外扎下根来。把更多国家拉进全球化，意味着巨大的经济增长，而这又给世界的石油和天然气供应带来沉重压力。过去十年，从巴西到东海再到北冰洋，深入海底寻找这些燃料的新来源，已成为贸易与地缘政治格局变化的关键一环。"},{"id":"prologue-012","p":4,"t":"p","en":"But it was also in the tides that early signs appeared suggesting that all was not well with the rise—or more accurately, the return—of these giant nations. In 2009, China made a sweeping claim to a huge stretch of the South China Sea, asserting a historical right to waters claimed by several other nations and dominated by the US Navy since the end of World War II. It was a move that presaged a mounting competition between the United States and the rising power of China-a competition playing out first and foremost in Asia's contested waters.","zh":"但同样是在潮水之间，出现了最早的迹象，表明这些巨人国家的崛起——更准确地说，是回归——并非一切都好。2009 年，中国对南海一大片海域提出宽泛主张，称对这片水域拥有历史性权利；而这片水域另有多国提出主张，且自第二次世界大战结束以来一直由美国海军主导。这一步预示了美国与崛起的中国之间日益加剧的竞争——而这场竞争，首先并且主要是在亚洲那些争议水域上演。"},{"id":"prologue-013","p":4,"t":"p","en":"Between the mounting tensions in the South China Sea and the scale of global sea-based trade and energy discovery, I began to realize quite how central were transactions on and across the world's oceans to the texture of the changing times. Here, in the middle of the Amazonian rainforest, was a signifier of these global pressures, a stack of humble shipping containers, hidden in plain sight.","zh":"南海不断升温的紧张，加上全球海运贸易与能源发现的规模，让我开始真切意识到：发生在世界大洋之上、横跨大洋的往来，对时代肌理的塑造有多么核心。就在亚马孙雨林中央，立着这些全球压力的一个标记——一摞不起眼的集装箱，就藏在人人可见之处。"},{"id":"prologue-014","p":4,"t":"p","en":"This book looks at the struggle for political and economic power from the vantage point of the world's oceans.","zh":"本书从世界海洋的视角，考察政治与经济权力的争夺。"},{"id":"prologue-015","p":4,"t":"p","en":"Four simple facts organize inquiry into this topic. First, the world's oceans are rapidly becoming the most important zone of confrontation between the world's great military actors—the United States and China above all, but also Russia, Japan, India, and others. How these powers manage their naval rivalry will shape the next half century. Second, when we hear the word \"globalization\" we think of airplanes and high-tech information flows, but the reality is that more than 85 percent of all global commerce is a function of sea-based trade. That trade flows across the Atlantic and Pacific Oceans bound in bulk carriers and mega container ships. Third, the oceans are vital to modern communications; we rarely think about the oceans in connection to the internet or finance or our smartphones, but the reality is that more than 90 percent of global data flows along undersea cables. Fourth, oceans play a surprisingly central role in the realities of energy, and in the global fight over climate change. Today's energy exploration is a story of tapping the vast resources of the seabeds from the Gulf of Mexico to the high Arctic, even as the oceans play a critical role in the changes to our weather that increasingly shape how we live.","zh":"有四个简单的事实，可以组织起对这一主题的追问。第一，世界大洋正迅速成为全球军事大国之间最重要的对抗地带——首先是美国与中国，此外还有俄罗斯、日本、印度等国。这些大国如何处理彼此的海军竞争，将塑造今后半个世纪。第二，我们听到“全球化”这个词时，想到的是飞机和高科技信息流，但现实是：全球贸易的 85% 以上都是海运贸易。这些贸易装在散货船和巨型集装箱船上，横越太平洋与大西洋。第三，海洋对现代通信至关重要。我们很少把海洋与互联网、金融或自己的智能手机联系起来，但现实是：全球 90% 以上的数据沿着海底光缆流动。第四，海洋在能源现实和全球气候之争中，扮演着出人意料的核心角色。今天的能源勘探，是一部从墨西哥湾到北极高纬度地区开采海床巨大资源的故事；与此同时，海洋又在我们天气的变化中起着关键作用，而天气正越来越深地塑造着我们的生活方式。"},{"id":"prologue-016","p":5,"t":"p","en":"I decided to see for myself how these dynamics were unfolding. My job required me to travel extensively, and starting in early 2017, I added a series of side trips to better understand and to visualize this new age of oceans. I sailed a fast boat out of the mouth of the Pearl River into the hills of Hong Kong and its great natural harbor, to put myself in the minds of the merchantmen and sailors of the English East India Company when they wrestled that island away from China nearly two centuries ago, in an act that reshaped the global politics and economics of the time. The commandant of the Port of New York toured me through the Coast Guard facilities there and around that vital harbor. I inspected the world's most important counter-piracy coalition, operating out of Changi Naval Base in Singapore—also the gateway to the most important choke point in modern trade. A Chinese friend arranged for me to tour the vast container port on Donghai Island, south of Shanghai, the world's largest. In Hawaii, I inspected the most advanced Aegis-class destroyer in the Pacific Fleet—once again the first line of defense against an ambitious Asian power. In the northern Arctic I saw how all these dynamics—warming seas and cooling relations—are reshaping the modern world.","zh":"我决定亲眼去看看这些动向如何展开。我的工作需要频繁出差，从 2017 年初起，我在行程中添了一连串支线旅程，以便更好地理解、也更直观地看见这个海洋新时代。我乘快艇从珠江口驶入中国香港的群山与它那座天然良港，为的是设身处地体会英国东印度公司的商人与水手近两个世纪前从中国手中夺走那座岛屿时的心境——那一步重塑了当时的全球政治与经济。纽约港的港务司令带我参观了那里的海岸警卫队设施，以及这座至关重要的港湾。我考察了世界上最重要的反海盗联合机制，它的行动基地设在新加坡樟宜海军基地——那里也是现代贸易中最重要咽喉要道的门户。一位中国朋友安排我参观了上海以南东海岛上那座全球最大的集装箱码头。在夏威夷，我登上了太平洋舰队最先进的宙斯盾级驱逐舰——那同样是对一个雄心勃勃的亚洲强国设下的第一道防线。在北极圈以北，我看到所有这些动向——变暖的海洋与变冷的关系——如何重塑着现代世界。"},{"id":"prologue-017","p":5,"t":"p","en":"And for ten days in the summer of 2019, I sailed on what was then the world's largest trading ship—the Madrid Maersk—across the world's most contested waters, in the Western Pacific: the Singapore Strait, the South China Sea, the Philippine Sea, and the East China Sea. The notes from that voyage frame each part of this book.","zh":"2019 年夏天，我有十天时间乘上当时世界上最大的商船“马德里马士基号”，穿越世界上最受争夺的水域，即西太平洋：新加坡海峡、南海、菲律宾海和东海。那次航行留下的笔记，构成了本书每一部分的框架。"},{"id":"prologue-018","p":5,"t":"p","en":"As I traveled, I read everything from the epic histories of imperial battles at sea to the labor economics of ports to marine insurance statistics to the engineering reports of deep-sea energy discovery and the complex science of ocean chemistry. Everywhere I turned I discovered entire worlds of history and science and politics.","zh":"一路行走，一路读书。从帝国海上争霸的宏阔历史，到港口的劳动经济学，到海上保险的统计数字，到深海能源发现的工程报告，再到海洋化学这门复杂的科学，我什么都读。每转一个方向，我都发现一整片由历史、科学与政治构成的世界。"},{"id":"prologue-019","p":6,"t":"p","en":"Along the way I noted nuggets of history or modern life that seemed to illuminate patterns or politics not often discussed. Like the fact that the longest-running overseas military engagement in American history is neither the long war in Afghanistan nor even our seven-decadelong deployment to the demilitarized zone on the Korean Peninsula, but rather the near-century-long deployment of the US Navy in China, along the Yangtze River. Or the fact that to deploy troops to Afghanistan, the US armed services required the support of a Norwegian fleet of huge ferries, commercially owned and operated, that carry heavy equipment. That the use of nuclear weapons undersea is still an active part of the weapons planning of the world's major navies. Or that the testing of nuclear weapons at sea triggered some of the most important scientific study that would eventually result in careful documentation of what we now call climate change.","zh":"沿途我记下了一些历史或当代生活的碎片，它们似乎照亮了不常被谈起的格局或政治。比如：美国历史上持续时间最长的海外军事行动，既不是阿富汗的漫长战争，也不是我们在朝鲜半岛非军事区长达七十年的驻守，而是美国海军在中国长江沿岸近一个世纪的部署。又比如：为了向阿富汗投送部队，美国各军种需要一支挪威船队的支持——一支商业所有、商业运营、专门运送重型装备的巨型渡轮船队。再比如：水下使用核武器，至今仍是世界主要海军武器规划中活跃的一部分。还有：海上核试验催生了若干最重要的科学研究，这些研究最终促成了对我们今天称之为气候变化的审慎记录。"},{"id":"prologue-020","p":6,"t":"p","en":"As I read and as I traveled, I experienced a phenomenon that surprised me. While the studies of globalization, energy, and even naval warfare gave me much that explained the technical or tactical dimensions of contemporary struggles, they cast little light on the nature of the rivalry. Instead, the older histories of imperial contest, of piracy, of the early days of ocean science, seemed to illuminate much more. Patterns set in the Age of Steam but that waned in the twentieth century seemed to be reemerging from the backdrop of modern history. Dynamics of trade and travel that would have been familiar to scholars and explorers in the late 1800s seemed to hew closely to the newest patterns of post-Cold War globalization.","zh":"边读边行，我遇到一个让自己意外的现象。关于全球化、能源乃至海战的研究，给了我许多解释当代角力之技术或战术维度的东西，却很少照亮这场竞争本身的性质。反倒是那些更古老的记述——帝国争夺、海盗、海洋科学的发轫之初——似乎照亮得更多。蒸汽时代形成、又在 20 世纪消退的那些格局，仿佛正从现代史的底色里重新浮现。19 世纪末的学者与探险家会感到熟悉的贸易与旅行逻辑，似乎与冷战后全球化的最新图样严丝合缝。"},{"id":"prologue-021","p":6,"t":"p","en":"Like other books that examine the role of sea power in the lives of nations, this one reaches back to the intellectual tradition of President Theodore Roosevelt's friend and confidant Alfred Thayer Mahan, who first sketched the naval foundations for what would become America's global role. Mahan would have been disoriented by the Cold War, an era dominated by continental superpowers and nuclear rivalry. But he would recognize the world coming into being now, where the urge to protect maritime commerce is stoking a global naval arms race. Unlike books that rest solely on the tradition of Mahan, though, this one also tackles issues he could not have foreseen—like the vast role the oceans play in our changing climate.","zh":"与其它考察海权在国家命运中之作用的著作一样，本书也回溯到西奥多·罗斯福总统的挚友与心腹阿尔弗雷德·塞耶·马汉（Alfred Thayer Mahan）的思想传统——正是马汉最早为后来美国的全球角色勾画出海军根基。马汉若置身冷战，定会感到茫然：那是一个由大陆型超级大国与核对抗主导的时代。但他会认出正在成形的今日世界——在那里，保护海上贸易的冲动正点燃一场全球海军军备竞赛。不过，与那些完全立足于马汉传统的著作不同，本书也处理他无法预见的问题——比如海洋在我们变化中的气候里所扮演的巨大角色。"},{"id":"prologue-022","p":7,"t":"p","en":"This book, I should add, is not about the oceans as much as it is a book set on the oceans. They are the screen against which the dynamics of our time plays out, a backdrop against which the shadows of history reveal themselves. They are a lens through which to watch a core struggle—what we might describe as the geopolitics of globalization.","zh":"我还要补充一句：这本书与其说是写海洋，不如说是以海洋为场景。海洋是那块屏幕，我们时代的种种动向在它上面演映；是那道背景，历史的影子在它上面显形；也是一枚镜头，透过它可以观看一场核心的搏斗——我们或可称之为全球化的地缘政治。"},{"id":"prologue-023","p":7,"t":"p","en":"The oceans are a metaphor, too, for the way in which the patterns of world affairs ebb and wash across our lives. History is often told as a series of events, sequenced in time and space. At moments, though, history moves like the ocean themselves, with currents that span continental shelves and patterns of waves that unfold over time, reaching far beyond their originating shores. Sometimes it behaves like a tsunami, where an earthquake in one area sends a shock wave through an adjacent ocean, barely noticed as it ripples across the waters, ultimately to be felt at a distant shore first by a receding of the tide, just before a huge tidal surge crashes onto land, wreaking destruction.","zh":"海洋也是一个隐喻，喻示世界事务的格局如何像潮水一样涨落、漫过我们的生活。历史常被讲成一连串事件，在时间与空间里依次排开。然而在某些时刻，历史的运动就像海洋本身：洋流横贯大陆架，浪的形态随时间展开，远远越过它起浪的岸边。有时它像一场海啸——某处的地震把冲击波送进相邻的大洋，涟漪掠过水面时几乎无人察觉，最终却在遥远的岸上先以退潮的方式被人感知：潮水悄然退出，紧接着，巨大的潮涌轰然拍上陆地，造成毁灭。"},{"id":"prologue-024","p":7,"t":"p","en":"As we witness the epic scale of modern global trade, the mounting tensions of naval power, and the drama of climate change playing out in warming oceans, it's hard to resist the sensation that we are now at that moment just before such a tsunami, standing ashore when the tide has quietly flowed outward, far farther than normal—that eerie, quiet moment before the sea surges back in, destroying much of what we have come to know.","zh":"当我们目睹现代全球贸易的史诗规模、海军力量日益加剧的紧张，以及气候变化的戏剧在变暖的海洋中上演，很难不生出这样一种感觉：我们此刻正处在那样一场海啸到来之前的瞬间，站在岸上，看着潮水悄无声息地退去，退得比平常远得多——那是海水猛扑回来、摧毁我们所熟知的大部分事物之前，那个诡异而寂静的时刻。"}],"notes":[]},{"id":"pt1","label":"Part I Opening","labelZh":"部前小引","title":"Awaiting the Madrid, Tanjung Pelepas, Malaysia","titleZh":"开篇　在马来西亚丹戎帕拉帕斯等候“马德里”号","part":"Part I: News from the Future","showPart":true,"partZh":"第一部","partTitleZh":"来自未来的消息","paras":[{"id":"pt1-001","p":11,"t":"p","en":"Algeciras, Spain, at the mouth of the Mediterranean. Lisbon, Portugal, Europe's westernmost vantage point, from where Portuguese conquistadors set sail on their voyages of discovery and violence, from Brazil to India. Muscat, Oman, where the Arabian Sea narrows toward the Persian Gulf. Kolkata, once Calcutta, that great historic trading entrepôt on the northern tip of the Indian Ocean, in the Bay of Bengal. Canton, now Guangzhou, where China first opened itself to foreign trade. And Shanghai, at the mouth of the Yangtze River, lifeline of China's economy, once dynamic, then closed, now risen again. These great ports, which have so shaped our history, would have been familiar to any trader or sea captain from Europe to the Middle East to East Asia as early as at the turn of the seventeenth century. Today, together with the great modern American ports, they form the spine of the route plan of the world's cargo fleet—a fleet that sails not in dhows or schooners or clippers, but vast floating factories of steel and oil that sew together the world.","zh":"西班牙的阿尔赫西拉斯，地中海的出口。葡萄牙的里斯本，欧洲最西端的观景之地，葡萄牙的征服者正是从这里扬帆出海，踏上从巴西到印度的发现之旅，也是暴力之旅。阿曼的马斯喀特，阿拉伯海在此收窄，通往波斯湾。加尔各答，印度洋北端、孟加拉湾畔那座伟大的历史贸易中转港。广州，西文旧称 Canton，中国最早向对外贸易敞开大门的地方。还有上海，长江口上的上海，中国经济的命脉——它曾生气勃勃，后来封闭，如今再度崛起。这些伟大的港口深刻塑造了我们的历史。早在 17 世纪之交，从欧洲到中东再到东亚，任何一个商人和船长对它们都耳熟能详。今天，它们与美国的各大现代港口一道，构成了世界货运船队航线图的脊梁——这支船队不再靠独桅帆船、纵帆船或飞剪船航行，而是由一座座漂浮的钢铁与石油工厂组成，把整个世界缝合在一起。"},{"id":"pt1-002","p":11,"t":"p","en":"Many of these ships, though, will dock at a port that did not exist in the world of those earlier legions of traders. That port is in Tanjung Pelepas, at the tip of the Malay Peninsula. It is the southernmost city in mainland Asia; only the islands of the Indonesian archipelago lie farther south. It has a long history as a fishing village, dating back to the thirteenth century, when this stretch of the Malay Peninsula formed the outer edges of the Siam empire. Now it's the industrial centerpiece of modern Malaysia, one of those rare places where in a single gaze you can take in relics of the long past, the arc of recent development, and the shadows of the probable future.","zh":"不过，这些船中许多将靠泊一座港口——在昔日那一批批商人的世界里，它还不存在。这座港在丹戎帕拉帕斯，位于马来半岛的南端。它是亚洲大陆最南端的城市，再往南，就只有印度尼西亚群岛的岛屿了。它当渔村的历史很长，可上溯到 13 世纪，那时这一段马来半岛还是暹罗帝国的外缘。如今它是现代马来西亚的工业核心，也是少数几个能让人一眼看尽悠远往昔的遗存、晚近发展的弧线与可能未来的影子的地方。"},{"id":"pt1-003","p":11,"t":"p","en":"All this is best seen on the last remaining section of the city not given over to new-built apartment complexes or industrial warehouses. Guests and officials visiting the nearby port (or, occasionally, waiting to board a container ship like the giant Madrid Maersk) are often taken to a small stretch of coast off the old Jalan Sembilang road, where can be found a few remaining traditional restaurants and residences. Some of these are built on piers that reach forty feet out into the brackish waters where the Pulai River empties into the Johore Strait, at the northwestern tip of the long, shallow Java Sea. Even at low tide these waters lap up to the midpoint of the trunks of the mangrove trees and nearly cover the intertidal seagrass meadows that once lined far more of these shores. When the winds pick up and the tide is high, the waters rise to near the tips of the piers that have kept structures like these safe from the seas for several centuries. Standing on them, you can feel the visceral pull and power of the ocean as the tide pushes in and swells and briefly recedes and pushes in again, each movement of the water beneath your feet seeming to evoke long tides of history.","zh":"要看这一切，最好去城里仅存的那一段——尚未被新建公寓楼和工业仓库占满的地方。来附近港口访问的宾客与官员（偶尔还有等着登上集装箱船的人，比如那艘巨轮马德里马士基号），常被带到老森比朗路（Jalan Sembilang）旁的一小段海岸，那里还留着几家传统餐馆和民居。其中一些建在栈桥上，栈桥向水中伸出 40 英尺，伸进普莱河注入柔佛海峡处的半咸水里——那是狭长而浅的爪哇海的西北角。即便退潮，水也能漫到红树的树干中段，几乎盖住潮间带的海草床；这样的海草床从前在沿岸分布得远比现在广。起风涨潮时，水会涨到栈桥桥头附近——几百年来，正是这些栈桥护住了岸上这样的人家，使它们免遭海水侵扰。站在桥上，你能感到海洋那种直抵身体的牵引与力量：潮水推上来，涨起，稍退，又推上来；脚下每一次水的涌动，似乎都在唤起历史深处漫长的潮汐。"},{"id":"pt1-004","p":12,"t":"p","en":"It is often in the shallows that we best perceive the power of the oceans. In Simon Winchester's lyrical history of the Atlantic Ocean, he imagines that moment when humankind first walked from the inland plains to the coast and encountered the \"thrashing and thundering and roaring of an endless assault against the rocks that marked the margin of his habitat.\"1 This sense that the oceans are most powerful at the shore is an illusion, of course; in the deep waters of the oceans, the currents are far more powerful still, pushing billions of gallons along the ocean floor and across continents. But when you are amid the endless gray expanse of the high seas, it's hard to place their span in human scale. It's only when they break their power against the coasts that we can situate our own scale in the context of their immensity.","zh":"我们往往是在浅水处才最能体会海洋的力量。西蒙·温切斯特（Simon Winchester）那部文笔抒情的大西洋史里，想象了人类第一次从内陆平原走到海岸的那一刻：他听见“无休无止的冲击、拍打与轰鸣，撞在他栖居之地边缘的岩石上”。* 海洋在岸边最为有力，这种感觉当然是一种错觉；在大洋深处，洋流要强劲得多，把数十亿加仑的海水推过洋底、推过整片大陆。可当你置身公海那无边的灰色旷野之中，很难用人的尺度去丈量它的辽阔。只有当海水在岸边撞碎自己的力气，我们才能把自身的尺度安放进它的浩瀚之中。"},{"id":"pt1-005","p":12,"t":"p","en":"On the coast of Tanjung Pelepas, these last remaining traditional structures carry with them the echo of the peninsula's long, contested history. Like much of the Malay coast, it was wrested away from Siam by the Malaccan empire, then claimed by the Portuguese, and then the Dutch East India Company. The Anglo-Dutch Treaty of 1824 divided the peninsula, and the area surrounding Tanjung Pelepas fell to the British. Directly south, the view on the horizon is dominated by a living relic of that period, the Horsburgh Lighthouse, which guides shipping through the Singapore Strait. It is named for a hydrographer of the East India Company, who first charted these waters for London. Nearby, though just out of sight, is the Sembawang Naval Base, where for more than a century the Royal Navy solidified its hold on Asia until Japan displaced the British during World War II, part of their bid to control the flow of oil and rubber in Southeast Asia.","zh":"在丹戎帕拉帕斯的海岸上，这些仅存的传统屋舍带着半岛漫长而几经争夺的历史的回声。与马来海岸的许多地方一样，这片土地先被马六甲王国从暹罗手中夺走，继而由葡萄牙人宣示领有，再落到荷兰东印度公司手里。1824 年的《英荷条约》瓜分了半岛，丹戎帕拉帕斯一带归了英国。正南方的天际线上，矗立着那个时代一件活着的遗物——霍士堡灯塔（Horsburgh Lighthouse），它为往来新加坡海峡的船只指路。灯塔得名于东印度公司的一位水道测量师，他最早为伦敦方面绘制了这片海域的海图。不远处，只是望不见的地方，是三巴旺海军基地（Sembawang Naval Base）：一个多世纪里，皇家海军在此巩固了对亚洲的控制，直到二战期间日本取代英国——那是日本争夺东南亚石油与橡胶流向的努力的一部分。"},{"id":"pt1-006","p":13,"t":"p","en":"After the turmoil of war, and as the \"winds of change\" blew through the farthest reaches of the British Empire, Malaysia and Singapore bid jointly for independence. They then parted ways in 1964. Singapore rapidly developed—aided by the comforting presence of the American navy, now docked in the Sembawang facility—and turned into a modern financial powerhouse. But Malaysia languished, one of the least developed parts of East Asia. In the early 1990s, then, Malaysia's government decided to open its economy to globalization—just as Brazil and India and dozens of others countries were doing the same. And as part of this bid to open their economy, they took the essential step for any country seeking to enter globalization. They built a modern port.","zh":"战后的动荡过去，“变革之风”吹到英帝国最遥远的边陲，马来西亚与新加坡联手争取独立，随后又在 1964 年分道扬镳。新加坡发展迅速——有美国海军令人安心的存在为助（美军此时已进驻三巴旺基地），一跃成为现代金融重镇。马来西亚却停滞不前，是东亚最不发达的地区之一。于是到 1990 年代初，马来西亚政府决定向全球化开放本国经济——巴西、印度和几十个其他国家当时也在这么做。而在这场开放经济的努力中，他们迈出了任何想要加入全球化的国家都必须迈出的一步：建一座现代港口。"},{"id":"pt1-007","p":13,"t":"p","en":"What is known locally simply as PTP-the Port of Tanjung Pelepas-occupies nearly two thousand acres of waterfront property along the dredged shores of the Pulai River, with a further 1,500 acres given over to an adjacent free trade zone. It boasts fifty-eight Super Post-Panamax cranes (technically, ship-to-shore gantry cranes)—the largest in the world. Each weighs approximately 900 tons, stands 177 feet tall, and has a reach of more than 229 feet. These load containers from its holding yard, which is 745.6 square miles in size, and is able to host more than 120,000 shipping containers at one time—the same size as the ones I saw in the Amazon. The port has an apartment complex for its day laborers, a health service, the authority to issue its own regulations, and its own police force.","zh":"当地人口中简称 PTP 的丹戎帕拉帕斯港，沿普莱河疏浚过的岸线占地近 2,000 英亩，另有 1,500 英亩划作毗邻的自由贸易区。港区拥有 58 台超巴拿马型岸桥（严格说是船岸龙门吊）——世界上最大的岸桥。每台重约 900 吨，高 177 英尺（约 54 米），外伸距超过 229 英尺（约 70 米）。它们从面积 745.6 平方英里的堆场里吊装集装箱，堆场一次可容纳 12 万个以上的集装箱——和我亚马孙见到的那种箱子一样大小。港口为日结工人建了公寓区，配有医疗服务，有权自行颁行规章，还有自己的警察队伍。"},{"id":"pt1-008","p":13,"t":"p","en":"PTP received its first ship in October 1999. The Malaysia authorities had anticipated a relatively steady early growth, but got lucky when the world's shipping giant, then named Maersk SeaLand, decided to move its operations from Singapore to Tanjung Pelepas. Two years later, another large shipping company, Taiwan Evergreen Marine, followed. Tanjung Pelepas rode the ensuing wave of globalization, and by 2015 had entered the top twenty ports in the world by value. The port anchors a far larger complex of industrial developments, housing complexes, byways, and land reclamation projects that have led Tanjung Pelepas to be labeled Malaysia's Shenzhen (China's first special economic zone).","zh":"PTP 在 1999 年 10 月迎来第一艘船。马来西亚当局原本预计初期增长会较为平稳，结果却交了好运：世界航运巨头、当时名为马士基海陆（Maersk SeaLand）的公司决定把业务从新加坡迁到丹戎帕拉帕斯。两年后，另一家大型航运公司台湾长荣海运（Evergreen Marine）也跟了过来。丹戎帕拉帕斯乘上随之而来的全球化浪潮，到 2015 年已按货值跻身全球二十大港口。这座港口带动了一片远为庞大的工业开发、住宅区、辅路与填海造地，丹戎帕拉帕斯因此被人称作“马来西亚的深圳”（中国第一个经济特区）。"},{"id":"pt1-009","p":14,"t":"p","en":"The last remaining stretch of coast, though, did not fall to the port complex, but to a very different kind of development. Known as Forest City, it comprises a series of matched high-rise apartment buildings, twenty of them, an average of thirty-five stories tall. These are spread over four man-made islands, spanning 11.5 square miles of reclaimed land. The \\$100 billion complex of apartments is linked by a giant shopping mall, schools, and a medical facility. It even has its own beach, although the rising sea levels in the South China Sea threaten its longterm viability.","zh":"不过，最后剩下的那一段海岸没有归入港区，而是交给了另一种截然不同的开发项目。它叫森林城市（Forest City），由 20 栋规格统一的高层公寓组成，平均 35 层，分布在 4 座人工岛上，填海造地共 11.5 平方英里。这个造价 1,000 亿美元的公寓群，由一座巨型购物中心、几所学校和一家医疗机构串联起来。它甚至有自己的海滩——尽管南海不断上升的海平面威胁着它的长期存续。"},{"id":"pt1-010","p":14,"t":"p","en":"Throughout the project, the signage is in two languages: Malay and Mandarin. That reflects two facts: the anticipation of the owners that the majority of residents will be foreign, and most of them Chinese; and that the project itself is a Malaysia-China joint venture. The complex was built and financed in a partnership between the local Malay authorities and Country Garden Pacificview developers as part of China's Belt and Road Initiative. Their projection is that by 2050, when all phases of the project are complete, Forest City will host a whopping seven hundred thousand residents.","zh":"整个项目里，标牌一律使用两种语言：马来文和中文。这反映出两件事：业主预计大部分住户是外国人，其中多数是中国人；项目本身也是马中合资。这一建筑群由当地马来当局与碧桂园太平洋景（Country Garden Pacificview）开发商合作建造和融资，是中国“一带一路”倡议的一部分。他们预计，到 2050 年项目各期全部建成时，森林城市将容纳足足 70 万居民。"},{"id":"pt1-011","p":14,"t":"p","en":"Now it is largely empty. Chinese nationals own most of the alreadybuilt apartments, but few live there; complex rules about residency and foreign ownership complicate the transactions. But that hasn't stopped Country Garden Group from continuing to build out the project, with strong government backing. Malaysia is torn between its deep economic ties to China and its suspicion of China's anti-Muslim policies; it's unclear where their eventual loyalties will lie. But if Malaysia moves increasingly in China's direction, Country Garden Pacific stands hugely to profit, and China would gain influence in Tanjung Pelepas and its growing port.","zh":"如今这里大半空着。已建成的公寓多数为中国公民所有，但很少有人住在那里；关于居留资格和外资购房的繁琐规定让交易变得复杂。这并没有阻止碧桂园集团在政府大力支持下继续扩建。马来西亚一面与中国有着深厚的经济联系，一面又对中国的反穆斯林政策心存疑虑；它最终会倾向哪一边，尚不清楚。但假如马来西亚越来越向中国的方向靠拢，碧桂园太平洋景将获利甚巨，而中国也将在丹戎帕拉帕斯及其不断扩张的港口取得影响力。"},{"id":"pt1-012","p":14,"t":"p","en":"And so, standing on the shores of the Pulai River, in the gentle pull of the tides, we can see the echoes of Asia's long history, its violent encounter with Europe, the arc of its modern economic development, and the shadow of its likely future, where China's presence looms large. Just as we can see the competing realities of modern trade, embodied in the scale and dynamism of Port Tanjung Pelepas, and the continuing realities of Western naval power, encapsulated in the American presence in neighboring Sembawang. And if we look closely enough, we can see, too, in the rising tides and the erosion of the local shoreline, a whisper of the role the oceans are playing in our changing climatic future.","zh":"于是，站在普莱河岸上，在潮水轻柔的牵引中，我们能看见亚洲漫长历史的回声、它与欧洲的暴力相遇、现代经济发展的弧线，以及那很可能到来的未来所投下的影子——在那样一个未来里，中国的存在格外醒目。同样，我们也能看见现代贸易相互竞争的现实，它体现在丹戎帕拉帕斯港的规模与活力之中；以及西方海军力量延续至今的现实，它凝结在邻邦三巴旺的美军驻留之中。若看得足够仔细，还能在上涨的潮水与本地海岸的侵蚀里，听见一声低语，说的是海洋在我们正在改变的气候未来中扮演着何种角色。"},{"id":"pt1-013","p":15,"t":"p","en":"These glimpses of power dynamics past, and the rapidly changing future, are visible, too, in a very different locale on the other side of the globe; in the high north above the Arctic Circle.","zh":"这些关于往昔权力格局的一瞥，以及那迅速变化的未来，在地球另一端一个截然不同的地方同样可见：北极圈以北的高纬地区。"}],"notes":[]},{"id":"ch01","label":"Chapter 1","labelZh":"","title":"Secrets of the High North","titleZh":"第一章　高北地区的秘密","part":"Part I: News from the Future","showPart":false,"partZh":"第一部","partTitleZh":"来自未来的消息","paras":[{"id":"ch01-001","p":17,"t":"p","en":"In the high north, above the 69th parallel, the deep of winter brings weeks of total darkness, day after day, when the sun never rises and only artificial light breaks the omnipresent black. By late January, though, the change in the Earth's axis relative to the sun is just enough to create a unique phenomenon known as blue night. While the sun never does crest above the horizon during this period, for a few hours each day just enough of the sun's light spills into the atmosphere to warm the darkness. A form of twilight emerges. Land, sea, hill, and sky all take on a silvery-blue hue, like the entire area has been dipped in liquid pewter. The daunting beauty of this frozen terrain shimmers in the ambient light.","zh":"在极北之地，北纬69度线以北，隆冬带来连续数周的彻底黑暗，日复一日，太阳从不升起，唯有灯火能划破这无所不在的黑。然而到了1月下旬，地轴相对太阳的角度变化刚好够用，足以造出一种名为“蓝色夜晚”的独特现象。这段日子里太阳始终不越出地平线，但每天仍有几个小时，阳光恰好能溢进大气层，把黑暗焐暖。一种微明的光浮现出来，介于昼夜之间。陆地、海面、山峦与天空统统染上一层银蓝色，仿佛整片地方都被浸进了熔化的白镴。这片冰封大地的森然之美，就在这浮光里微微颤动。"},{"id":"ch01-002","p":17,"t":"p","en":"In the blue night, it is hard to tell where land ends and the sea begins. All the more so because at this latitude, the Arctic Ocean spends part of the year under a thick blanket of sheet ice, impenetrable by all but the staunchest icebreakers. Even its littoral Barents Sea, off the coast of Russia's northern tundra, is frequently made impassible by ice floes.","zh":"在蓝色夜晚里，很难分清陆地到哪里为止、海洋从哪里开始。在这个纬度上更是如此：北冰洋一年中有几个月都盖着一层厚厚的板冰，除了最坚固的破冰船，谁也穿不过去。就连紧贴俄罗斯北部冻原海岸的巴伦支海近岸海域，也常被浮冰堵得无法通航。"},{"id":"ch01-003","p":17,"t":"p","en":"The Norwegian Sea, southwest of the Barents, forms a kind of buffer between the cold, mineral-rich waters of the Arctic Ocean and those of the Atlantic, whose Gulf Stream currents start in the upwelling of the Southern Ocean, but are warmed on their way north by the heat of the Caribbean. The mixing of those waters plays a unique and consequential role in the flow of ocean currents worldwide, but they have a local effect as well, making the Norwegian Sea more navigable than its northern neighbors, ice-free year-round. It's still frigid, though, with an average temperature during the winter months around 37 degrees Fahrenheit, making it one of the coldest waters in the world that isn't trapped by ice. And during storms, high winds and thirty-foot swells pound against the mountainous coastline of the northern Finmark region, where the Scandinavian Peninsula arcs around its farther tip. The drama of the Norwegian Sea has given rise to legends, from the lore of the kraken sea monster to the epic tales of the maelstrom.'","zh":"挪威海位于巴伦支海西南，在富含矿物质的北冰洋冷水与大西洋海水之间充当一道缓冲。大西洋的墨西哥湾暖流起于南大洋的上升流，北上途中又被加勒比海的热量加温。两股水体的交汇在全球洋流格局中扮演着独特而关键的角色，对当地也有直接影响：挪威海比它北面的邻海更好走，终年不冻。水还是刺骨，冬季月均水温约37华氏度（约3摄氏度），是世界上海水最冷、却又不被封冻的海域之一。风暴一来，狂风裹着30英尺高的涌浪，狠狠拍向芬马克（Finmark）北部山地海岸——斯堪的纳维亚半岛的陆地正在那里绕向它最远的尖端。挪威海的壮阔景象催生了一连串传说，从海妖克拉肯（kraken）的故事，到关于大漩涡的史诗。*"},{"id":"ch01-004","p":18,"t":"p","en":"The waters are not much warmer in the long, deep fjords that cut inland off the Norwegian Sea, but the fjords do at least provide protection from waves and wind. They shelter remote fishing communities, Arctic research stations, the occasional small city—and Cold War secrets.","zh":"那些从挪威海切入内陆的狭长深峡湾里，水温也高不了多少，可峡湾至少能挡住风浪。它们庇护着偏远的渔村、北极科考站、偶尔一座小城——以及冷战的秘密。"},{"id":"ch01-005","p":18,"t":"p","en":"The largest city in the area, Tromsø, lies at 69.64 degrees north, 18.95 degrees east, nearly 200 miles north of the Arctic Circle. It hosts a population of around 70,000 and serves as a hub for scientific research on the Arctic. And for tourism: several times a day small planes land at the airport in nearby Langnes, bringing European, Russian, and now frequently Chinese tourists to the high north. They spill out of planes clad in outdoor gear and carrying heavy boots and ice crampons and will soon head out into the snow on late-night dogsleds (or, for the less adventurous, dinner cruises) to catch a sighting of the glimmering fire of the northern lights.","zh":"这一带最大的城市特罗姆瑟，位于北纬69.64度、东经18.95度，在北极圈以北近200英里（约320公里）。全城约7万人口，是北极科学研究的枢纽，也是旅游的门户：每天都有好几班小飞机降落在附近朗内斯（Langnes）的机场，把欧洲、俄罗斯以及如今越来越多的中国游客送到极北。他们一身户外装备挤出机舱，提着厚重的靴子和冰爪，很快就要踏进雪地，乘深夜的狗拉雪橇（不太爱折腾的，就去坐游船晚宴），去追寻北天那抹摇曳的极光。"},{"id":"ch01-006","p":18,"t":"p","en":"Tromsø is located near the bottom of the largest fjord in this section of the coast, the Kaldfjord—literal translation, the \"cold fjord.\" South of Tromsø, the smaller Balsfjorden runs for nearly sixty miles, broken at various intervals by still-smaller fjords that branch off from the main channel. These create highly protected deep-water inlets, secured from the winds by steep slopes on all four surrounding sides.","zh":"特罗姆瑟坐落在这一段海岸最大的峡湾——卡尔峡湾（Kaldfjord，字面意思就是“冷峡湾”）——的湾底附近。特罗姆瑟以南，小一些的巴尔斯峡湾（Balsfjorden）绵延近60英里，沿途每隔一段就有更小的峡湾从主水道分岔出去。这些峡湾造出一处处防护极严的深水内湾，四周陡坡四合，把风挡在外面。"},{"id":"ch01-007","p":18,"t":"p","en":"One such inlet lies fifteen miles south of Tromsø. The Ramfjorden forks east off of Balsfjord for three miles, and then curves sharply south to hit the mainland. Steep, high ridges protect it in every direction. Overhead to the south, the dramatic slope of the pyramid-shaped Piggtinden juts out from the surrounding Lyngen Alps, just visible in silvery relief.","zh":"其中一处内湾在特罗姆瑟以南15英里。拉姆峡湾（Ramfjorden）从巴尔斯峡湾向东分岔出去3英里，随即急转向南，直抵大陆。陡峭高耸的山脊从四面八方护住它。南面头顶，金字塔形的皮格峰（Piggtinden）从周围的吕恩根（Lyngen）群山中斜挑出来，在银光里只剩一道隐约的浮雕。"},{"id":"ch01-008","p":18,"t":"p","en":"*While the maelstrom depicted in Norse mythology and in Edgar Allan Poe's famous short story is legend, it's based on a real phenomenon—a series of powerful tidal eddies in the Norwegian Sea, including the Moskstraumen, one of the strongest whirlpools in the world. At maximum tide, it moves at sixteen knots and pushes more than ten million tons of water every hour through the narrow strait between the Lofoten Islands; it's one of the most dangerous pieces of water on the planet. (See Douglas Myles, The Great Waves: Tsunami (New York: McGraw-Hill, 1985).","zh":"*北欧神话与爱伦·坡那篇著名短篇小说里描写的大漩涡固然是传说，却自有其真实原型——挪威海中一系列强劲的潮汐涡流，其中包括莫斯克斯特劳门（Moskstraumen），世界上最强的漩涡之一。满潮时，它以16节的流速，每小时把逾一千万吨海水推过罗弗敦群岛（Lofoten）之间的狭窄水道，是地球上最危险的一片水域。（参看 Douglas Myles, The Great Waves: Tsunami, New York: McGraw-Hill, 1985。）"},{"id":"ch01-009","p":19,"t":"p","en":"If you cruise down the Ramfjorden, hugging close to shore, the blue night gives off just enough light to make out a small opening carved into the side of the mountain. Steer closer and you can see a tight tunnel, though the dark quickly swallows the little light that makes its way into this opening. A dark wall appears to indicate the end of the tunnel—even with limited visibility the smooth surface of the wall suggests something man-made rather than natural. But the swift current of the fjord makes anything more than a passing glance at this mysterious entrance hard to achieve.","zh":"沿拉姆峡湾贴着岸往下游走，蓝夜的微光恰好够你看清山体侧面凿出的一个小小开口。再靠近些，能看见一条狭窄的隧道，可那点钻进洞口的光很快就被黑暗吞掉。一堵黑墙似乎说明隧道到头了——即便视线如此有限，也看得出墙面平整，像是人工而非天然。只是峡湾的水流太急，想在这处神秘入口多看一眼都难。"},{"id":"ch01-010","p":19,"t":"p","en":"A similar opening is carved into the same mountain two thousand yards to the northeast. This one can be accessed by road, though, assuming you have the right security clearances. And this one doesn't stop at an iron wall. It opens into a tunnel that penetrates the mountain for almost a mile. At eight feet wide and eight feet high at its peak, it's only big enough for a single car. Above the tunnel are hundreds of thousands of tons of solid gabbro, a dark, coarse-grained igneous rock. Driving into it, you are hard-pressed to avoid deep claustrophobia.","zh":"同一座山上，往东北2,000码（约1,800米）处还凿着一个类似的开口。不过这个可以从公路进去——前提是你安全许可的级别够。这个也不以一堵铁墙收尾，而是通向一条几乎深入山体1英里的隧道。隧道最宽处8英尺、高8英尺，只容一辆车通过。头顶压着数十万吨坚硬的辉长岩，一种深色粗粒的火成岩。车往里开，很难不生出强烈的幽闭感。"},{"id":"ch01-011","p":19,"t":"p","en":"The road curves gently into the heart of the mountain, continuing for about a mile until it hits a T-junction. Turn left and you head deeper into the mountain for roughly one-fifth of a mile. Suddenly, the tunnel widens and the ceiling lifts and you find yourself in a large, well-lit chamber the size of a small airplane hangar. And the sense of enclosure gives way to one of astonishment as the dangerous secrets of the mountain reveal themselves. For there in front of you is not just another tunnel but a fully equipped submarine dock. This is no mere cavern: this is the Olavsvern naval base, a once-secret submarine facility carved into the very heart of the mountain.","zh":"路缓缓弯进山的腹心，一直延伸约1英里，直到碰上一条丁字路口。向左转，再往山体深处走大约五分之一英里。忽然，隧道变宽，顶棚升高，你发现自己站在一间灯火通明的大厅里，大小相当于一座小型飞机库。封闭感一下变成惊愕——大山那些危险的秘密在你面前摊开了。因为眼前不只是一条隧道，而是一座设备齐全的潜艇码头。这绝非普通洞窟：这里是奥拉夫斯文（Olavsvern）海军基地，一座曾经保密、直接从山的心脏里凿出来的潜艇设施。"},{"id":"ch01-012","p":19,"t":"p","en":"Turning into the chamber is like stumbling into the heart of the Cold War, or onto the set of a James Bond movie come to life. The enigmatic approach, the physical scale, and the bewildering revelation of a naval base inside a mountain combine to confound expectations and senses alike.","zh":"拐进这间大厅，就像一头撞进冷战的心脏，或者误入一部活过来的詹姆斯·邦德电影片场。诡秘的入口、实打实的体量、山腹里冒出一座海军基地的骇人真相，三者叠在一起，把人的预判和感官一并击穿。"},{"id":"ch01-013","p":19,"t":"p","en":"The base is organized around two major components. The first is a long tunnel that comes in from a discrete eastern opening, and then curves into a straight lane just under one thousand feet long. Off this main channel are eight storage chambers, ranging from 160 to 220 square yards. These chambers are carved into the rock of the mountain, into which were then built a series of cement sheds, designed to store ammunition. Inside the largest of them, a series of red metal racks stacked on top of one another—like oversize milk crates— served to store torpedoes. An overhead crane, operated by a large remote hanging from thick wires in the ceiling, helped move the heavy weapons. Two of the storage sheds in the facility have small pools built into the floors: torpedoes operate on highly flammable fuels, and the water in the pools can absorb and extinguish any sparks from the clash of metals as the heavy weapons undergo inspections or repairs. The chambers themselves are enclosed by heavy steel doors, painted yellow. Remarkable pieces of military infrastructure in their own right, they were purpose-built for the compound, forged out of three feet of solid steel and built to a convex curve—so that an explosion in any other part of the base would ricochet off the doors and back out into the main channel, protecting the munitions within.","zh":"基地由两大主体构成。第一条是一条长隧道，从东侧一个隐蔽的洞口进入，随后弯成一条不到1,000英尺长的直道。主巷道两侧开着8间储藏室，面积从160到220平方码不等。这些储藏室先在山岩里凿空，再在里面砌起一排水泥库房，用于存放弹药。最大的一间里，一排排红色金属货架层层摞起——像超大号的牛奶箱——用来存鱼雷。一台桥式吊车由挂在顶端粗钢索上的大遥控器操纵，负责搬运这些沉重的武器。设施中有两间库房在地面砌了小水池：鱼雷烧的是极易燃的燃料，重型武器检修或修理时金属相碰会迸出火花，池水可以把火花吸掉、扑灭。储藏室本身由厚重的钢门封住，门漆成黄色。这些门本身就是了不起的军事工程，专为这座营地打造：3英尺厚的实心钢锻成，做成外凸的弧面——这样基地其他部位若发生爆炸，冲击波会从门上弹开、折回主巷道，把里面的弹药保住。"},{"id":"ch01-014","p":20,"t":"p","en":"At the top of the channel is what is known innocuously as Hall 32—a large, empty chamber shaped like a dome cut in half. It's a vast blast chamber, curved and sweeping, designed to capture the shock waves from an explosion, turn them around, and send them shooting back out the tunnel toward the fjord. The blast would then hit the outer door by the eastern quay, a door made deliberately weak so that the pressure from the shock wave would be sufficient to blow it off its hinges, releasing the pressure out into the fjord, minimizing damage to the facility itself.","zh":"巷道尽头是名字起得平淡无奇的“32号厅”——一间巨大的空室，形状像把圆顶从中剖开。这是一座庞大的泄爆室，弧面舒展，用来兜住爆炸的冲击波，把它掉头，再顺着隧道朝峡湾方向甩出去。冲击波随后会撞上东码头旁的外门；那扇门是故意做弱的，好让冲击波的压力足以把门从铰链上掀掉，将压力泄进峡湾，使设施本身受的损伤降到最低。"},{"id":"ch01-015","p":20,"t":"p","en":"The second component is more impressive still. This is the submarine dock itself. It parallels the first channel and runs for one thousand feet inside the mountain. Unlike the first channel, though, this one is dug a farther twenty feet into the ground and flooded with seawater to just below dock level. A large metal door on a swivel operates like a canal door on the Erie or the Thames: sluices alongside the door can drain the water out of the rear portion of the dock, turning the chamber into a dry dock. On the ground under the water are a series of blocks of wood, like railroad ties, on which the base of a submarine can rest when the water is removed. Above, floodlights and cranes are set up to enable the ground crew to perform repairs or modifications to all parts of a waiting submarine. Powerful cabling enables electricpowered subs to recharge, while stores of fuel can reload their diesel counterparts. At the highest point in the channel, a cutout into the ceiling creates additional room for the base crew to effect repairs on a raised periscope.","zh":"第二部分更令人震撼。这就是潜艇码头本体。它与第一条巷道平行，在山体内延伸1,000英尺。但与第一条不同，这一条又往下挖了20英尺，灌满海水，水面刚好停在码头面之下。一扇带转轴的大金属门像伊利运河或泰晤士河上的闸门一样运作：门侧的闸槽能把码头后段的水排空，把整间洞室变成干船坞。水底地面上铺着一列木墩，形似铁路枕木，水排干后潜艇的艇底就搁在上面。上方架着泛光灯和吊车，地勤人员可以对停泊待修的潜艇各个部位动手修理或改装。粗大的电缆可为电动潜艇充电，油料储备则能给柴电潜艇补给。在巷道最高处，穹顶向上凹进一块，给基地人员检修升起状态的潜望镜多留了些空间。"},{"id":"ch01-016","p":21,"t":"p","en":"Close by are a series of crucial support chambers: a secure communications room, a powerful engine room, and an area marked CBRN CLEANING-that is, a room designed to wash and scrub anyone exposed to chemical, biological, radiological, or nuclear materials.","zh":"近旁是一系列关键的保障舱室：一间保密通信室、一间大功率机舱，以及一块标着“CBRN CLEANING”的区域——也就是一间专供冲洗、刷洗接触过化学、生物、放射性或核物质人员的房间。"},{"id":"ch01-017","p":21,"t":"p","en":"For many years, this facility was NATO's northernmost vantage point. Originally commissioned just before the outbreak of World War II, the facility was dug out to exacting standards over the course of almost forty years. The eventual result: inside the mountain, almost three hundred thousand square feet of blast-proof space, carefully ventilated, wholly secure. Above, a thousand feet of solid rock protects the base from airstrikes or even a nuclear attack. The world's most powerful bunker busting bombs would come nowhere close to penetrating the outer shell of the mountain. At the water entrance, the facility is protected on four sides by the two fjords that create its enclosure. The steep slopes protect from more than just wind. Neither a fighter jet nor even a modern cruise missile can flatten out fast enough, having crested the peak of the surrounding slopes (which rise from the fjord at a nearvertical pitch), to penetrate the small opening. A series of additional security measures that cannot be revealed here protect the base from underwater attack","zh":"许多年里，这座设施是北约最北的观察据点。它最初在第二次世界大战爆发前夕启用，此后近40年间按极严的标准一寸寸凿成。最终的结果是：山体内部近30万平方英尺的防爆空间，通风考究，绝对安全。头顶上千英尺厚的实心岩层，把基地护住，可挡空袭，甚至可挡核打击。世上威力最大的钻地弹，也远远打不穿这层山壳。在水上入口一侧，两道峡湾合围，四面护住设施。陡坡挡住的不只是风。战斗机乃至现代巡航导弹越过四周峰顶（那些山坡几乎垂直地从峡湾里拔起）之后，都来不及压平机身，钻不进那个小小的开口。此外还有一系列不便在此披露的安保措施，防范来自水下的攻击。"},{"id":"ch01-018","p":21,"t":"p","en":"The central purpose of the facility is the landing dock for submarines. Fully occupied, three full-size diesel submarines can be docked inside the chamber at one time. The wet dock is in fact large enough to berth even the largest nuclear-powered submarines in the NATO fleet, but for now the entrance to the cavern isn't wide enough to allow them in; there are plans to enlarge it. During the height of the Cold War, an additional, removable quay was floated just outside the entrance to the facility. Archived photographs from that era show the USS Hampton, the USS Albany, the USS Toledo, and unnamed Seawolf- and Los Angeles-class submarines docking at the external facility. It was at Olavsvern that the powerful US submarine fleet rested and refueled after shadowing Soviet submarines under the Arctic ice.","zh":"这座设施的核心用途，是供潜艇停靠的船坞。满员时，洞室内可同时停靠3艘全尺寸柴电潜艇。这座湿船坞其实大到足以容纳北约舰队中最大的核潜艇，只是眼下洞口还不够宽，它们进不来；已有扩建计划。冷战高峰期，设施入口外还浮着一座可拆卸的附加码头。那个年代的存档照片里，「汉普顿」号（USS Hampton）、「奥尔巴尼」号（USS Albany）、「托莱多」号（USS Toledo），以及几艘未具名的“海狼”级和“洛杉矶”级潜艇，都在这座外码头停靠过。正是在奥拉夫斯文，强大的美国潜艇部队在北极冰下跟踪苏联潜艇之后，得以休整、补给。"},{"id":"ch01-019","p":21,"t":"p","en":"At the core of the facility is a command center. Abandoned when the base was given up at the end of the Cold War, the remnants of","zh":"设施的核心是一间指挥中心。冷战结束时基地被弃置，这里随之荒废，残存的"},{"id":"ch01-020","p":22,"t":"p","en":"Norwegian and NATO battle plans are still visible on faint outlines of a map etched into the main planning wall. Discarded Norwegian Defense Ministry nautical charts still lie atop the central table, and still fill the map drawers along the rear wall. Adjacent, a command office with a large domed window overlooks the map room, and is connected to a dedicated communications chamber that still shows evidence of the kind of security measures that would enable the facility to receive NATO's most secure communications.","zh":"挪威与北约的作战计划，仍依稀可辨地勾画在主规划墙上蚀刻的地图轮廓里。挪威国防部废弃的航海图还摊在中央桌面上，后墙的图柜里也仍然塞得满满的。旁边是一间指挥办公室，一扇巨大的拱形窗俯视着地图室，办公室连着一间专用通信舱，那里至今留着种种安保设施的痕迹——正是这类设施，让基地能够接收北约最机密的通信。"},{"id":"ch01-021","p":22,"t":"p","en":"It's no longer a secret that during the Cold War the purpose of the Olavsvern submarine facility was to help keep track of the Soviet fleet. Its location was perfect. For most of the 1,650 miles of the Norwegian land mass, Finland lies between Russia and Norway—and served as a neutral buffer between the Soviet forces and NATO. At its very tip, though, Norway borders Russia directly, creating one of only two land borders between NATO and the Soviet Union. But this is nearimpassable terrain. The land trip to Tromsø from Murmansk, the largest town on Russia's northern-western edge, is an arduous fourteen-hour drive across the Finmark peninsula, a high mountain plateau whose roads are mere clefts in those high craggy peaks, blocked by ice and snow for most of the year; and so, easily defended. But Murmansk, and Russia's Northern Fleet, is only 590 nautical miles from Tromsø—just over a half-day sail for fast cruisers. If the Soviet Union was going to launch a sea-based invasion into NATO's north, it would have been in or around Tromsø that the attack would be most likely to start.\"","zh":"如今这已不是秘密：冷战期间，奥拉夫斯文潜艇设施的使命就是帮着盯住苏联舰队。它的位置堪称完美。挪威国土南北全长1,650英里，其中大部分地段是芬兰夹在俄罗斯与挪威之间，充当苏军与北约之间的中立缓冲。但到了最东端，挪威与俄罗斯直接接壤，形成北约与苏联之间仅有的两条陆地边界之一。可这一带几乎无法通行。从俄罗斯西北边缘最大的城市摩尔曼斯克（Murmansk）走陆路到特罗姆瑟，要在芬马克半岛上苦熬14个小时——那是一片高耸的山原，公路只是嶙峋高峰之间的一道道裂缝，一年里大半时间被冰雪封住，因而也易守难攻。可摩尔曼斯克和俄罗斯北方舰队距特罗姆瑟只有590海里——快速巡洋舰半天多一点就能开到。苏联若要从海上对北约北翼发动入侵，最可能的起点就在特罗姆瑟城内或附近。"},{"id":"ch01-022","p":22,"t":"p","en":"When the Cold War ended, and in the relative calm in the region that followed, neither NATO nor Norway had any use for the base. It fell into disuse, and in 2008 it was decommissioned. Most of the steel doors were removed, and the command facility abandoned, stripped of its secure communication gear. Eventually, the Norwegian Ministry of Defense sold it into private hands. For several years, a private operator used it to rent storage for pleasure craft owners, to protect their boats during the deep-winter months. Some of its roadways and its storage channels held marine craft, yachts, Ski-Doos, sleds, Jeeps, and even classic cars—including a 1956 cherry-red X-Type Jaguar in mint condition. Its weapon bays were converted into storage chambers, practice bases for deepwater diving, and machine-tooling workstations. One was even converted into a facility for training show dogs. The juxtaposition between the show dogs' jumping gear and the base's original purpose stands now like some form of parodying monument to the leisurely excesses of the post-Cold War world.","zh":"冷战结束，此后的地区局势相对平静，北约和挪威都用不上这座基地。它渐渐废弃，2008年正式退役。大部分钢门被拆走，指挥设施弃置不用，保密通信设备被拆了个精光。最后，挪威国防部把它卖给了私人。有几年，一家私营运营商拿它出租库房，供游艇主人在深冬存放船只。部分车道和储藏巷道里停着船艇、游艇、雪地摩托、雪橇、吉普车，甚至老爷车——其中一辆1956年的樱桃红X-Type捷豹，车况如新。武器舱改成了储藏室、深水潜水训练场和机床工位。有一间甚至被改成训练参展犬的场地。如今，训犬用的跳栏和基地原先的用途摆在一处，像一座带讽刺意味的纪念碑，纪念冷战后这个世界的闲逸与过剩。"},{"id":"ch01-023","p":22,"t":"n","en":"During World War II, it was to Tromsø that the Norwegian government exiled itself when the country fell to the Nazi invasion; and from Tromsø that King Haakon— together with fifty tons of gold, several warships, and over a thousand merchant ships—was evacuated from Norway by the Royal Navy, acting on Winston Churchill's last orders given as Lord Admiral of the Navy, before he ascended to the role of prime minister.","zh":"第二次世界大战期间，挪威被纳粹入侵而沦陷，挪威政府正是流亡到特罗姆瑟；也正是从特罗姆瑟，哈康国王（King Haakon）带着50吨黄金、数艘军舰和一千多艘商船，由皇家海军护送撤离挪威——这道命令出自温斯顿·丘吉尔就任首相之前、以海军大臣身份下达的最后一道指令。"},{"id":"ch01-024","p":23,"t":"p","en":"And then, in 2018, the Norwegian armed forces reacquired the base. In September 2019, the Norwegian Defense Logistics Organization signed a contract with a marine engineering firm to operate the facility and restore it to defense standards. The contracting arm of one of the world's largest maritime logistics companies, the Wilhelmsen Group, began a swift program of rehabilitation to bring it back to military specifications. The objective was to have the base operational in 2020. By 2019, the United States was in negotiations with Norway to sign a \"status of forces agreement\" that would allow the US Navy to resume its access to Olavsvern, for submarine deployments to the high north.","zh":"而后，2018年，挪威武装部队重新购回了这座基地。2019年9月，挪威国防后勤组织与一家海洋工程公司签约，由后者运营该设施，并将其恢复到防务标准。签约方是全球最大海事物流企业之一威尔森集团（Wilhelmsen Group）旗下的工程承包部门，它迅速启动整修计划，要让基地重新符合军用规范。目标是在2020年让基地恢复运转。到2019年，美国正与挪威谈判签署一份《部队地位协定》，以便美国海军重新使用奥拉夫斯文，向极北部署潜艇。"},{"id":"ch01-025","p":23,"t":"p","en":"The reasons why speak directly to the themes of this book.","zh":"其中的缘由，正好触及本书的主题。"},{"id":"ch01-026","p":23,"t":"p","en":"Over the past quarter century, we've become increasingly accustomed to the material benefits of a globalized economy, a world where production moves and flows seamlessly across national boundaries, in seemingly limitless quantities and at ever-lower costs. Where the new middle classes of Asia and Latin America can afford modern housing and air-conditioning and cars and hugely improved health care and sanitation. A world in which American working parents can readily afford to feed and clothe their families, and to purchase goods that were once luxuries, like flat-screen TVs and laptops, by buying the inexpensive goods milled and manufactured by those same Asian and Latin American middle classes. A world in which Africa's cities have become hubs of innovation, and 400 million citizens of the continent carry cell phones. It's also a world where American city dwellers can drive German, Korean, Japanese, and Italian cars, buy raspberries and kumquats and pineapples in the middle of winter, and work and play on smartphones that are almost certainly the most globally integrated consumer good ever produced. Of course, it is also a world where American cotton plantations have been supplanted, for good and ill, by growers in Bangladesh and Laos; where steel factories in Ohio have been displaced by industrial production in Vietnam and China; where \"American\" airplanes use Russian steel and British engines and German software. By the same token, this is a world in which American and European service firms, engineering firms, technology companies, and banks have reaped huge profits from the ever-larger flow of trade. It's a world, as we shall see, born of trade by sea.","zh":"过去25年间，我们对全球化经济带来的物质好处越来越习以为常：生产在国家边界之间顺畅流动，数量看上去没有上限，成本却一降再降。亚洲与拉丁美洲的新兴中产阶级买得起现代住房、空调、汽车，也享有大幅改善的医疗和卫生条件。美国的双职工父母轻轻松松就能让一家人吃饱穿暖，还能买下平板电视、笔记本电脑这类曾经的奢侈品——办法就是买那些由同一批亚洲、拉美中产阶级加工制造的便宜货。非洲的城市成了创新枢纽，全洲4亿人手里握着手机。美国的城里人可以开德国、韩国、日本、意大利的车，在隆冬买到覆盆子、金橘和菠萝，在智能手机上工作和消遣——那几乎可以肯定是有史以来全球化程度最高的消费品。当然，这也同样是一个美国棉田被孟加拉国和老挝的种植者取代（是祸是福姑且不论）的世界；是俄亥俄的钢厂被越南和中国的工业生产挤掉的世界；是“美国”飞机用着俄罗斯的钢材、英国的发动机和德国的软件的世界。同样地，这也是一个美欧的服务公司、工程公司、科技企业和银行从日益庞大的贸易流量中赚取巨额利润的世界。正如我们将会看到的，这是一个由海上贸易催生的世界。"},{"id":"ch01-027","p":24,"t":"p","en":"We've also become accustomed, over several decades, to relatively stable relations between the world's top military powers. Not free of tensions, to be sure, or of violence and war in the world's poorer regions; but a world in which the United States and its Western allies were free of existential threats; a world in which most countries, most of the time, could pursue their national ambitions and foreign policies free from the worry that one of the world's top military powers would seek to annex their territory, or that they would fall afoul of a militarized conflict between the world's nuclear powers. It was a world, as we will remember, characterized by the global reach of American military might—whose enabling feature was America's unrivaled bluewater navy.","zh":"几十年来，我们也习惯了世界顶级军事强国之间相对稳定的关系。当然并非没有紧张，世界较贫困的地区也并非没有暴力和战争；但那是一个美国及其西方盟友不受生存性威胁的世界；是一个大多数国家在大多数时候都能追求本国抱负和外交政策的世界——不必担心某个顶级军事强国图谋吞并自己的领土，也不必担心自己会撞进核大国之间的军事化冲突。我们还会记得，那是一个以美国军力的全球投送为标志的世界——而让它得以实现的，是美国无可匹敌的蓝水海军。"},{"id":"ch01-028","p":24,"t":"p","en":"And over a far longer period of time, we've become accustomed to the easy, inexpensive consumption of fossil fuels—the oil, the gas, and the coal that power the modern economy and every aspect of our lives—a practice made ever more possible, as we'll discover, by the seabased flow of oil, and now also of natural gas.","zh":"而在更长的时间里，我们也习惯了廉价、省事地消费化石燃料——驱动现代经济和我们生活方方面面的石油、天然气和煤炭。正如我们将要发现的，这种消费之所以越来越行得通，靠的是海上的石油运输，如今还包括天然气。"},{"id":"ch01-029","p":24,"t":"p","en":"As these economic and political dynamics of the last part of the twentieth century and the first phase of the twenty-first unfolded, they flowed together beside each other in relative harmony—relative comity between the world's most populous nations reflected in a deepening economic integration, and a sense of shared stakes and even a shared fate in the evolution of the natural world. But beneath the surface, older patterns of history-of rivalry, of distrust—were building strength. And over time, as these currents flowed beside each other, they began to intermingle—and to churn against one another.","zh":"20世纪后期与21世纪第一阶段这些经济和政治的动向展开之时，彼此并行、相对和睦地流动——世界人口最多的几个国家之间保持着一种相对的礼让，表现为不断深化的经济一体化，表现为在自然界的演变中休戚与共、甚至命运同系的感觉。但在水面之下，更古老的历史模式——竞争、猜疑——正在积蓄力量。随着时间推移，这些并行的水流开始彼此混融，并相互搅动起来。"},{"id":"ch01-030","p":25,"t":"p","en":"All these patterns are on display in the high north.","zh":"所有这些模式，都在极北之地一一上演。"},{"id":"ch01-031","p":25,"t":"p","en":"In 1845, at the height of British imperial adventurism, the Royal Navy commissioned the HMS Terror to find a route through the Arctic-the fabled \"northern route.\" It was a voyage that generated valuable scientific discovery—ever since, the ocean sciences have been a leading indicator of global power. But it failed to find a northern sea route, for the simple reason that there was none. For all of recorded history, the Arctic has been blocked year-round by a thick layer of sea ice. No longer. Just since 2000, the Arctic has warmed by an average of 2.7 degrees, which means that now for several months a year some of its waters are ice-free. The northern route so longed for by the British Crown has arrived.","zh":"1845年，大英帝国的冒险主义正值鼎盛，皇家海军派出「恐怖」号（HMS Terror）去寻找一条穿越北极的航道——传说中的“北方航线”。那次航行带来了宝贵的科学发现——自那以后，海洋科学一直是全球权力的先行指标。但它没能找到北方海路，理由很简单：那时根本没有。自有文字记载以来，北极终年被一层厚厚的海冰封死。如今不再如此。仅自2000年以来，北极平均升温2.7度，这意味着如今每年有几个月，部分海域不再结冰。英国王室苦盼的北方航线，终于来了。"},{"id":"ch01-032","p":25,"t":"p","en":"This is a disturbing harbinger of the state of the natural world, but it is also in many ways an economic boon. No longer impeded by yearround ice, in 2018, a flotilla of Chinese container vessels sailed the route from Shanghai to Hamburg, Germany—almost six thousand miles shorter than the traditional route across the Indian Ocean, through the Suez to the Mediterranean, out through the Pillars of Hercules and up the western coast of the Atlantic. In time, this new route may prove as consequential to global trade—and to the geopolitical relations that underpin it—as the opening of the Suez Canal. What's more, the shallow continental shelf off the Norwegian and Barents Seas is increasingly accessible for energy exploration. In 2019, the largest oil and gas find in the world was in the Yamal Peninsula, off Russia's Barents coastline. And, somewhat ironically, the newly ice-free waters are generating an increasing yield in the already bountiful Arctic fishing grounds.","zh":"这是自然界状况发出的一个令人不安的先兆，但在许多方面也是经济上的福音。2018年，一支中国集装箱船队不再受终年封冻的冰层阻挡，沿这条航线从上海驶往德国汉堡——比传统航线短了近六千英里；传统航线要横穿印度洋，经苏伊士运河进入地中海，从海格力斯之柱（直布罗陀海峡）驶出，再沿大西洋西岸北上。假以时日，这条新航线对全球贸易——以及对支撑全球贸易的地缘政治关系——的意义，也许不亚于苏伊士运河的开通。此外，挪威海与巴伦支海的浅层大陆架正变得愈来愈便于能源勘探。2019年，全球最大的油气发现位于俄罗斯巴伦支海沿岸的亚马尔半岛（Yamal Peninsula）。而颇具讽刺意味的是，新近不冻的海域，正让本就丰饶的北极渔场产量节节攀升。"},{"id":"ch01-033","p":25,"t":"p","en":"Yet for all the commercial prospects of the Arctic--indeed, partially because of those prospects—it's also emerged as a zone of military competition, as the world's naval powers vie for access and influence. Russia has moved important naval assets to its northern bases, from where it can threaten the Atlantic, while China has begun building a fleet of icebreakers to take advantage of the new northern route; and America is resuming its Cold War-era vigil underneath the residual sea ice. While much of the world's media attention has been in the warmer waters in the South China Sea, the cold waters of the north are yet another flash point in our rapidly changing world. It's but one part of a wider struggle this book charts—at the heart of which is a new global arms race, one that has navies playing the role that nuclear weapons played during the Cold War.","zh":"然而，尽管北极有如此多的商业前景——甚至部分正是因为这些前景——它同时也成了一片军事角逐之地，世界各海军强国都在争夺进入权与影响力。俄罗斯把重要的海军资产调往北方基地，从那里足以威胁大西洋；中国已着手建造一支破冰船队，好利用这条新的北方航线；美国则在恢复冷战年代在残存海冰之下的潜伏监视。世界媒体的目光大多投向南海温暖的水域，而北方的冷水，是这个急剧变化的世界里又一个引爆点。这不过是本书所要描绘的一场更大角逐的一部分——其核心是一场新的全球军备竞赛，在这场竞赛里，海军扮演的正是冷战时期核武器所扮演的角色。"},{"id":"ch01-034","p":26,"t":"p","en":"The Arctic is neither the sole nor even the most important exemplar of a changing climate; neither the sole nor the most tense flash point in the new global naval arms race; and not yet the most important new trade route on the high seas. But it is another of those rare places where we can witness how rapidly those patterns are changing, where we can see the relics of the past, the shape of the present, and the early signs of the future that awaits us. And once again the Olavsvern naval base will be the West's northernmost eye on that dangerous future.","zh":"北极既不是气候变化唯一的标本，甚至也不是最重要的标本；既不是新的全球海军军备竞赛中唯一的引爆点，也不是最紧张的那一个；它也还不是公海上最重要的新贸易航线。但它又是那样一处罕见之地：在这里，我们得以目睹那些格局变化得何等迅速，得以看见往昔的遗存、当下的形状，以及那个等着我们的未来的早期征兆。而奥拉夫斯文海军基地，将再一次成为西方眺望那个危险未来的最北之眼。"},{"id":"ch01-035","p":26,"t":"p","en":"The company contracted to rehabilitate the Olavsvern naval base is an interesting entity in its own right, and a brief consideration of its Norwegian parent company reveals the kind of linkages that exist between corporations and governments. That parent company is the publicly held Wilhelmsen Group, the largest maritime network operator in the world, with 2,200 locations around the globe, where it provides marine support services to companies and governments alike. Among its claims to fame, the Wilhelmsen Group is the world's largest operator of ro-ro boats.","zh":"承包奥拉夫斯文海军基地修复工程的那家公司，本身就是一个耐人寻味的实体；对它的挪威母公司略作考察，便能看出企业与政府之间存在着怎样的联结。这家母公司是公开上市的威尔森集团（Wilhelmsen Group），全球最大的海事网络运营商，在全世界2,200个地点为企业、也为政府提供海事支持服务。在它足以自夸的诸多名头中，有一条是：世界最大的滚装船（ro-ro）运营商。"},{"id":"ch01-036","p":26,"t":"p","en":"But what on earth is a ro-ro boat?","zh":"可滚装船究竟是个什么东西？"},{"id":"ch01-037","p":26,"t":"p","en":"\"Ro-ro\" is industry shorthand for \"roll on, roll off.\" Ro-ro ships are basically giant ferries, square-sided, mammoth in scale. They are purpose-designed to transport rolling vehicles, primarily cars, to destinations around the world-in that, they're a perfect reflection of a changed world of global economic production. Buy a car in the United States, and chances are high that the vehicle spent part of its life on one of the fifteen decks of a large ro-ro ship, being transported from Japan or Korea or Germany to one of a dozen major port complexes on the eastern and western seaboards. But ro-ro ships have more uses than simply transporting cars. They are also used to transport heavy machinery and equipment—including for the US military.","zh":"“Ro-ro”是行业里对“roll on, roll off”（开上开下）的简称。滚装船其实就是巨型渡轮，船体方正，体量大得惊人。它们专为运送可自行开动的车辆而造，主要是汽车，目的地遍及世界各地——在这一点上，它们正是一个已被改变的全球经济生产格局的完美写照。在美国买一辆车，这辆车十有八九曾在一艘大型滚装船15层甲板中的某一层上待过一段日子，从日本、韩国或德国运到东西海岸十几个大型港口枢纽中的某一个。但滚装船不止能运汽车。它们也用来运送重型机械和设备——包括为美军运送。"},{"id":"ch01-038","p":26,"t":"p","en":"The American military establishment likes to extol the virtues of its ability to put American power anywhere in the world, at short notice. Limited operations, like the deployment of Special Forces, can be handled by airplane or submarine. But any large-scale deployment involves getting huge amounts of military equipment—armored personnel carriers, tanks, light aircraft, helicopters—into position overseas. And for any purpose other than for a new invasion of Mexico or Canada, that involves large ships.","zh":"美国军方素喜夸耀自己能在短时间内把美国的力量投送到世界任何角落。像特种部队部署这类有限行动，飞机或潜艇就能办到。但任何大规模部署，都得把海量军事装备——装甲运兵车、坦克、轻型飞机、直升机——运到海外阵位。而除非是又要去入侵墨西哥或加拿大，否则这就非大船不可。"},{"id":"ch01-039","p":27,"t":"p","en":"The US Navy operates a fleet of its own logistics ships and ro-ro carriers. But when a major mobilization is underway, even the US Navy has to contract out to the commercial market. That included when the US military mobilized at scale to mount the deployment to Afghanistan in the wake of 9/11.","zh":"美国海军自己拥有一批后勤船和滚装运输船。但一旦大规模动员展开，就连美国海军也得向商业市场租船。9·11之后美军大举动员、部署阿富汗，就是其中一例。"},{"id":"ch01-040","p":27,"t":"p","en":"That deployment of American power to central Asia—literally on the other side of the globe from New York's Twin Towers—may have marked the apogee of American power. Let's, for the moment, leave aside any policy questions about the endurance or conduct of the war. The launch of the war was, from a purely logistical perspective, an extraordinary thing. At no prior point in human history has a state power been able to launch first pinprick strikes, then heavy bombing raids, and then large-scale infantry deployments, fully half a world away from its home borders—and then to sustain them for years. At the very least it was the most logistically impressive feat of power projection since D-Day—whatever the results of the encounter. All the more remarkable, then, that the majority of the equipment deployed to Kabul and Kandahar and points beyond was sailed there by the ro-ro ships of the Wilhelmsen Group.","zh":"那次把美国力量投送到中亚的行动——那片地方与纽约双子塔恰在地球的两面——也许标志着美国力量的顶点。关于这场战争能否持久、打得如何，种种政策问题暂且搁下。单从后勤角度看，这场战争的发动已属非同寻常。人类历史上从未有哪个国家，能够在本国边界之外整整半个地球的地方，先施点穴式打击，再行重型轰炸，继而投入大规模步兵——并且把这一切维持数年之久。无论这场交锋结果如何，它至少是诺曼底登陆以来力量投送上后勤层面最令人惊叹的壮举。而更令人称奇的是，运往喀布尔、坎大哈以及更远据点的装备，大部分是由威尔森集团的滚装船海运过去的。"},{"id":"ch01-041","p":27,"t":"p","en":"There are several factors that go into the question of whether the military or other users of very heavy equipment can use a given ro-ro ship. One is simple size. The largest ro-ro ships, for example the Wilhelmsen Group's MV Tønsberg, the world's largest, can be up to 900 feet long, 100 feet wide, and have a total weight of 75,000 gross tons. Second is the weight of the hull. On the heaviest ships, the high decks on these ro-ros can withstand up to one ton of pressure per square foot, which means they're capable of carrying an armored tank. And a third factor is the dock. Ro-ro ships come with their own docks, selfpropelled, mounted to the back of the ships, that enable them to port virtually anywhere in the world and off-load their weighty cargo. To drive a tank up the dock ramp requires a loading capacity of several hundred tons per square foot. A normal ro-ro ship ramp can handle 150 tons per square foot; the heaviest ro-ro carriers, like those used by the Wilhelmsen Group for the Afghanistan operation, can handle 500 tons per square foot.","zh":"军方或其他需要超重装备的用户能否动用某一艘滚装船，取决于几个因素。其一是尺寸。最大的滚装船，比如威尔森集团旗下、全球最大的“滕斯贝格”号（MV Tønsberg），船长可达900英尺（约274米），宽100英尺，总重75,000总吨。其二是船体的承重。在最重型的滚装船上，高层甲板每平方英尺可承受多达1吨的压力，这意味着它们装得下一辆装甲坦克。第三个因素是跳板。滚装船自带跳板，自带动力的跳板装在船尾，使它们几乎能在世界任何地方靠港，卸下沉重的货物。要让坦克开上跳板，需要每平方英尺数百吨的承载能力。普通滚装船的跳板每平方英尺可承150吨；最重型的滚装运输船，比如威尔森集团投入阿富汗行动的那些，每平方英尺可承500吨。"},{"id":"ch01-042","p":27,"t":"n","en":"The bulk of the equipment was loaded in Newport News, Virginia, and off-loaded in Pakistan, where it could move by road into Afghanistan.","zh":"大部分装备在弗吉尼亚州纽波特纽斯装船，在巴基斯坦卸下，再从那里经公路运入阿富汗。"},{"id":"ch01-043","p":28,"t":"p","en":"It's another hidden feature of the modern realities of ocean traffic that even the world's most powerful military relies on bulk shipping in the private sector to be able to deploy overseas. This is yet another way in which America's fate and the dynamics of international security are bound up in command of the oceans.","zh":"现代海洋运
