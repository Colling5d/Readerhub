"From the clogged Singapore Strait, at the southern end of the South China Sea, the shipping lanes flow north to the wide Vietnamese waters. The Malay Peninsula lies to the west, beyond visible range, and the storied island of Borneo to the east. The traffic and the congestion ease. Here, and for two to three days steaming north, by all appearances the South China Sea is an open, flowing body of water. Containers and tankers cruise the main channel with room to spare. For all of the volume of sea trade through this sea, its scale is such that, at many moments, only three or four vessels can be seen within a fifty-nauticalmile range. The dark blue waters are lightly flecked with white as gentle breezes blow across its expanse (except in typhoon season), and ships sailing its channels are chased by seabirds, mostly streaked shearwaters and white terns, that glide above the bow waves, occasionally diving into the waters to catch the fish churned up by the movement of the ships. From the bustle and claustrophobia of the Singapore Strait, the wide sea imparts a sense of space and calm.","zh":"从南海最南端拥塞的新加坡海峡出发，航道一路向北，进入越南宽阔的海域。马来半岛在视野之外的西边，充满传奇的婆罗洲在东边。船流与拥堵都缓和下来。从这里向北航行两三天，从一切外表看，南海都是一片开阔、流动的水域。集装箱船和油轮在主航道上行驶，彼此还留有余裕。尽管穿行这片海的贸易量如此之大，它的尺度仍然意味着，很多时候在50海里的范围内只能看到三四条船。深蓝的水面上点缀着细碎的白色，微风拂过辽阔的海面（台风季除外）；航行在航道上的船被海鸟追逐——多半是白额鹱和白燕鸥——它们滑翔在船头激起的浪花上方，不时俯冲入水，叼起被船只搅动的鱼。从新加坡海峡的喧闹与逼仄中出来，这片开阔的海给人一种空间感，一种平静。"},{"id":"ch07-087","p":161,"t":"p","en":"Appearances can be deceiving.","zh":"然而，表象往往骗人。"},{"id":"ch07-088","p":161,"t":"p","en":"At 01:58:27 in the morning of August 24, 2019, the quiet on the bridge of the Madrid Maersk was broken by an incoming message on what's known as the worldwide Enhanced Group Call system, broadcast through Inmarsat satellites. The header was \"Urgency EGC Received,\" and it was titled NAVAREA X1 WARNING: JAPAN SEA. It read, \"North Korea probably launched ballistic missile from North Korea, on 24 Aug. The launched ballistic missile estimated [sic] landed outside of Japanese EEZ in the Japan Sea. Vessels are requested to pay attention to further information and to keep clear when recognizing falling object. Vessels are requested to report related information to Japan Coast Guard.\"","zh":"2019年8月24日凌晨1时58分27秒，马德里马士基号驾驶台上的寂静被一条消息打破。消息经国际海事卫星组织（Inmarsat）的卫星播发，来自所谓的「全球增强群呼系统」（Enhanced Group Call）。抬头写着「收到紧急增强群呼」，标题是“航行警告区第十一区（NAVAREA XI）警告：日本海”。正文如下：“朝鲜可能于8月24日从朝鲜境内发射了一枚弹道导弹。该弹道导弹据估计落在日本海、日本专属经济区之外（原文如此）。请各船注意后续信息，发现坠落物时保持远离。请各船向日本海上保安厅报告有关情况。”"},{"id":"ch07-089","p":161,"t":"n","en":"Author's notes, Madrid Maersk, August 24, 2019.","zh":"作者笔记，马德里马士基号，2019年8月24日。"},{"id":"ch07-090","p":162,"t":"p","en":"There was an immediate domino effect across the seas along China's eastern coast—what it calls its \"Near Seas.\" Later that morning, a further EGC message warned of new naval maneuvers by the Philippine navy in the area off the coast of that country's archipelago, in the easternmost waters of the South China Sea. The Japan Maritime Self-Defense Force (Japan's navy) was put on high alert in the East China Sea. And in the early afternoon came warning of live-fire exercises by Taiwan's navy, just south of the narrow strait between the Chinese mainland and the island of Taiwan. At midday at Lat 22*37, Lon 119*44, west off the southern tip of the Taiwan Strait, five Taiwanese frigates, equipped with ship-to-ship missiles, raced across the bow of the Madrid, steaming at thirty knots in the direction of the Philippine Sea.","zh":"中国东部沿海的各个海域——中国所称的「近海」——随即起了一连串多米诺骨牌式的反应。当天上午稍晚，又一条增强群呼警告说，菲律宾海军将在该国群岛近岸、即南海最东端的水域举行新的军事演习。日本海上自卫队（日本的海军）在东海进入高度戒备。午后不久，又有警告传来：台湾海军将在实弹演习，位置就在中国大陆与台湾岛之间那条狭窄海峡的南口附近。正午时分，在北纬22度37分、东经119度44分，台湾海峡南端以西，五艘装有舰舰导弹的台湾护卫舰以30节航速从马德里马士基号船首前方横穿而过，驶向菲律宾海。"},{"id":"ch07-091","p":162,"t":"p","en":"And later that day, at a distance of two miles, an Aegis-class destroyer of the US Navy sailed northwest of the Madrid's position. It was shadowed by a Chinese frigate, equipped with ship-to-ship \"harpoon\" missiles, keeping a careful eye on the American vessel. Far from the expansive calm of the prior day, for the better part of an afternoon the Madrid, and two other container ships sailing nearby, found themselves uncomfortably positioned between the American and Chinese ships as they maneuvered to maintain close watch on one another.","zh":"当天傍晚，一艘美国海军宙斯盾级驱逐舰出现在马德里马士基号西北方向两英里处。一艘装有「鱼叉」舰舰导弹的中国护卫舰尾随其后，密切注视着这艘美国军舰。前一天那种辽阔的平静荡然无存。大半个下午，马德里马士基号和附近另外两艘集装箱船都尴尬地夹在中美两国军舰之间，看着它们来回机动、彼此盯防。"},{"id":"ch07-092","p":162,"t":"p","en":"And beneath the waters, a plethora of submarines—Chinese, American, Japanese, and Russian—maneuvered for position.'","zh":"而在水面之下，大批潜艇——中国的、美国的、日本的、俄罗斯的——也在抢占阵位。"},{"id":"ch07-093","p":162,"t":"p","en":"In recent years, the South China Sea has been the subject of a lot of discussion of US-China tensions. To be sure, for the Chinese navy to be actively patrolling in those waters and going nose-to-nose with the American navy represents a huge change in Chinese strategic thinking—a break with a nearly five-hundred-year tradition in Chinese foreign policy. It's a change that's reshaping the world as we know it.","zh":"近年来，南海成了讨论中美紧张关系时绕不开的题目。诚然，中国海军在这些水域积极巡逻、与美国海军面对面地对峙，意味着中国的战略思维发生了巨大变化——与中国外交政策近五百年的传统一刀两断。这一变化正在重塑我们熟悉的世界。"},{"id":"ch07-094","p":162,"t":"p","en":"But it goes well beyond that sea. 'The instant response to the communication of the North Korean missile test by Asian navies across the Japan Sea, the East China Sea, the Taiwan Strait, and the Philippine Sea tells us immediately that the dynamics of major power tension in Asia is not limited to the turbulent south. Rather, the whole of the Western Pacific is in play. The Western Pacific is becoming to today what East Germany was to the Cold War: the front line of tensions between the world's leading military powers.¹ Its deep waters have replaced the European heartland as the fault line of geopolitical tension.","zh":"但事态远不止于那片海。朝鲜试射导弹的消息一经传出，日本海、东海、台湾海峡、菲律宾海各处的亚洲海军立刻作出反应。这马上告诉我们：亚洲大国紧张关系的动力，并不局限于动荡的南方。整个西太平洋都已入场。今天的西太平洋，正在变成冷战时期的东德：世界主要军事强国紧张对峙的前线。* 它的深水区已经取代欧洲腹地，成为地缘政治紧张的断层线。"},{"id":"ch07-095","p":162,"t":"n","en":"In 2019, it was estimated that more than two hundred full-size submarines were operating in the East and South China Seas alone. Zhenhau Lu, \"US and China's Underwater Rivalry Fuels Calls for Submarine Code of Conduct to Cut Risk of Accidents,\" South China Morning Post, March 21, 2019.","zh":"2019年有估计认为，仅在东海和南海活动的全尺寸潜艇就超过两百艘。Zhenhua Lu，〈美中水下竞争推动制定潜艇行为准则以降低事故风险的呼声〉，《南华早报》，2019年3月21日。"},{"id":"ch07-096","p":163,"t":"p","en":"Some of the competing players, like Japan and Russia, are former imperial naval rivals in Asia. As is the United States, in effect: although the US has only had a global blue-water navy since the end of World War II, it has a far longer history in Asia's waters, where it has been sailing continuously since the mid-1820s, when US Navy schooners followed American merchant ships across the Pacific.² And tensions are not limited to the Western Pacific: the Indian, Arctic, and perhaps even Atlantic Oceans are once again the site of great power rivalries. Not only countries with a long naval tradition are vying for influence; the stakes are such that even India, which resisted developing its naval power through its long imperial and recent modern history, now finds itself scrambling to compete in the game of ports and bases.","zh":"这场角逐中的一些参与者，如日本和俄罗斯，本就是当年在亚洲争夺海权的老对手。美国实际上也是如此：虽然美国拥有全球性蓝水海军只是二战结束以后的事，但它在亚洲水域的历史要长得多——自19世纪20年代中期美国海军的纵帆船跟随美国商船横越太平洋起，它就一直在这一带航行。* 紧张也不限于西太平洋：印度洋、北冰洋，或许还有大西洋，再一次成为大国角逐的场所。争夺影响力的不只是那些有悠久海军传统的国家。利害如此之大，以至于连印度也在港口与基地的游戏中手忙脚乱地追赶——而在漫长的帝国时期和近现代史上，印度一向抗拒发展自己的海军力量。"},{"id":"ch07-097","p":163,"t":"p","en":"The most important new factor, of course, is China itself. Not since the mid-1500s has China been a power at sea. But in two short decades, it has rapidly changed the balance of naval power in Asia, and threatened it beyond. And in so doing, it's forced a critical debate in the United States—not just about how our navy should respond, but about what risks we are willing to take to defend the open seas and flow of trade worldwide.","zh":"当然，最重要的新变量是中国本身。自16世纪中叶以后，中国就再没有做过海上强国。但短短二十年里，它迅速改变了亚洲的海军力量平衡，并进而威胁到更远的地方。也正因如此，它迫使美国展开一场关键的辩论——争论的不只是我们的海军应当如何应对，还包括为了捍卫公海和全球贸易的流通，我们愿意承担什么样的风险。"},{"id":"ch07-098","p":163,"t":"p","en":"The US Naval War College, the institution over which Alfred Thayer Mahan presided and which trains the US Navy's elite officers, sits on Coasters Harbor Island in Narragansett Bay, in Newport, Rhode Island. Nearby, the town's historic wooden warehouses and colonial dwellings carry the legacy of its history as a major hub for whaling, and its Ocean Drive still sports the sprawling mansions that housed the Vanderbilts and the Astors and others of the country's wealthiest families during America's gilded age. The war college itself is more modest, though Luce Hall, built in 1892, carries something of the grandeur of the surrounding town.","zh":"美国海军军事学院坐落于罗得岛州纽波特市纳拉甘西特湾（Narragansett Bay）中的科斯特斯港岛（Coasters Harbor Island）。阿尔弗雷德·塞耶·马汉曾主持这所学院，美国海军的精英军官也在这里受训。不远处，镇上那些历史悠久的木结构仓库和殖民时期民居，仍带着它作为捕鲸重镇的历史遗痕；海景大道（Ocean Drive）两旁，依然矗立着一座座占地广阔的宅邸——美国的镀金时代，范德比尔特家族、阿斯特家族等国内最富有的家族就住在这里。学院本身要朴素一些，不过建于1892年的卢斯楼（Luce Hall）多少还带着几分周围小镇的气派。"},{"id":"ch07-099","p":163,"t":"p","en":"For several years, the Naval War College has hosted a biannual gathering of officers, commanders, and scholars designed to undertake a high-level assessment of its primary adversary. Throughout the Cold War, the focus of the college was the Soviet fleet. More recently, its focus has been China's People's Liberation Navy (PLAN).","zh":"几年来，海军军事学院每年两次邀集军官、指挥官和学者聚会，对学院的首要对手作一次高层评估。整个冷战期间，学院的焦点是苏联舰队。近些年，焦点变成了中国人民解放军海军（PLAN）。"},{"id":"ch07-100","p":164,"t":"p","en":"In May 2019, the conference convened with more than two hundred officers and scholars attending. There were frontline sailors from the US Korea fleet; from the American base in Yokosuka, Japan; from Pacific Fleet headquarters in Oahu-all in crisp white uniforms—and commanders in the greens and blues of navy headquarters. The major think tanks and universities of the United States were represented there as well. They were gathered to answer one question: Was China trying to build a genuinely global blue-water navy? And if so, were its purposes defensive or offensive?","zh":"2019年5月，会议召开，两百多名军官和学者到场。有来自美国驻韩舰队的，有来自日本横须贺美军基地的，有来自瓦胡岛太平洋舰队司令部的——都是身着笔挺白色制服的一线水兵；也有穿着绿色和蓝色军服的海军司令部指挥官。美国各大智库和大学也都派了代表。他们聚在一起，是为了回答一个问题：中国是否想建一支真正全球性的蓝水海军？如果是，其目的是防御还是进攻？"},{"id":"ch07-101","p":164,"t":"p","en":"In the corridors, the trappings of modern life were amply present in the iPads, laptops, and iPhones that everyone used to check on their home offices or home lives. But when the formal proceedings of the conference began, security rules required all concerned to store their electronic devices in nearby lockers. Inside, pen and paper replaced tablets. And between the setting, the uniforms, and the older mode of writing, the room was redolent of the history of the much older naval conferences that sought to shape the balance of power between imperial rivals.","zh":"走廊里，现代生活的装备随处可见：人人手里都是iPad、笔记本电脑和iPhone，用来查看本单位或家里的事。但会议的正式议程一开始，安保规定就要求所有人把电子设备存进附近的储物柜。会场之内，纸笔取代了平板电脑。会场、军服，再加上这种老派的书写方式，让整个房间弥漫着一种遥远的往事气息——让人想起那些年代久远的海军会议，它们曾试图塑造帝国对手之间的力量平衡。"},{"id":"ch07-102","p":164,"t":"p","en":"The question in front of the conference was simple: As China had developed into a global commercial power, with a network of commercial bases around the globe, would the Chinese navy follow? To the Pacific Fleet leadership in the room, the answer was obvious: absolutely, yes, China was trying to build a global navy, and challenge US supremacy. But for the careful scholars of the Naval War College's China Maritime Studies department, the answer was not so obvious. There was evidence in favor of that conclusion and against it. Their job, as they saw it, was to sift the evidence, challenge the obvious assertions, and let the data take them to a clear conclusion. Their methods were meticulous, involving detailed study of Chinese Communist Party documents, satellite analysis of Chinese shipyards, and an economic study of the cost to the Chinese treasury of building and maintaining an expanding fleet.","zh":"摆在会议面前的问题很简单：中国已经发展成一个全球商业强国，在全世界铺开了一张商业据点网络，那么中国海军会不会跟进？对在座的太平洋舰队领导层来说，答案显而易见：当然会，中国正在试图建一支全球海军，挑战美国的霸主地位。但对海军军事学院中国海事研究系那些审慎的学者而言，答案并不那么明显。支持这一结论的证据有，反对的证据也有。在他们看来，自己的职责是筛拣证据、质疑那些想当然的论断，让数据把他们带到明确的结论上去。他们的方法极为细致：细读中国共产党的文件，用卫星影像分析中国的船厂，并对建造和维护一支不断扩张的舰队给中国财政造成的成本作经济学研究。"},{"id":"ch07-103","p":164,"t":"p","en":"Mahan, when he was president of the college, argued that a genuine maritime power had to have a full array of assets in the form of maritime commerce, naval ships, and a network of naval bases. That China had developed as the world's leading maritime commercial power was obvious. As we'll see in what follows, equally obvious was that it was developing an ever more effective fleet of surface ships and submarines. But what about basing? Did China have the intention, or the capacity, to build out a network of mutually reinforcing bases across the Indian and Pacific Oceans, let alone farther afield? The scholars and naval officers in the conference debated fiercely how to interpret China's growing list of port acquisitions—from the east coast of Africa to the western Levant—and what would come next.","zh":"马汉在担任学院院长时曾论辩说，一个真正的海洋强国必须具备全套资产：远洋贸易、军舰，以及一个海军基地网络。中国已发展成为世界头号海洋商业强国，这一点显而易见。后面我们还会看到，同样显而易见的是，它正在打造一支越来越有战斗力的水面舰艇与潜艇部队。可基地呢？中国是否有意图、也有能力，在印度洋和太平洋上建成一个相互支撑的基地网络，更不用说更远的地方？与会学者和军官激烈争论：如何解读中国越来越长的港口获取清单——从非洲东海岸到黎凡特西部——以及下一步会是什么。"},{"id":"ch07-104","p":165,"t":"p","en":"To listen to the Naval War College debate was like watching the British Foreign Office write the Crowe Memorandum (see chapter 3) all over again, in real time. For as they debated over two days the question of China's motives, the following, fateful reality loomed: whatever China's current capacity, it would grow; and whatever China's current motives, they could change. China's current intentions might be limited to the defense of its sea-based trade; that stance would challenge the US Navy's conception of its own role in maintaining freedom of navigation around the world, but not necessarily core American interests. But what if Chinese intentions changed? What if China's and Russia's navies worked more closely together to challenge the US? And as the discussion continued, the inevitable conclusion began to emerge. To adapt the words of Crowe, “This is a matter in which the United States cannot safely run risks.\"","zh":"旁听海军军事学院的这场辩论，就像看着英国外交部把《克罗备忘录》（Crowe Memorandum，见第三章）当场重写一遍。因为在这两天关于中国动机的辩论中，一个决定性的现实始终笼罩着会场：无论中国现在的能力如何，它都会增长；无论中国现在的动机如何，它们都可能改变。中国当前的意图也许仅限于保护本国的海上贸易；这种立场会挑战美国海军对自身角色的设想——即维护全世界的航行自由——但未必触及美国的核心利益。可如果中国的意图变了呢？如果中俄两国海军更加紧密地联手对美发起挑战呢？随着讨论继续，一个无可回避的结论渐渐浮现。借用克罗的话说：“在这个问题上，美国不能冒险。”"},{"id":"ch07-105","p":165,"t":"p","en":"In what comes next, we'll first follow China's foray back to sea in the early 2000s, when it joined international efforts to counter a new version of an old threat to trade: piracy. Its efforts then seemed to presage the prospect that China would focus on cooperating with the established powers. But as its standing grew, so did its confidence, and so did its unease. And thus it turned to more expansive claims and naval ambitions, initially in its surrounding seas. As it deepened its network of ships and \"bases\" in the waters off its eastern shores, its ability to project power across the \"Near Seas” grew. But in the inimitable, escalatory logic of military affairs, as China's security deepened in the Near Seas, its vulnerability in the Far Seas became a greater preoccupation. And so, island by island, sea by sea, China's sense of its first line of defense crept outward—until it crossed into waters that the US Navy still sees as central to its own interests, and to America's defense. And what began as a tense but limited contest in the South China Sea has become a near-global naval arms race—a spiral of escalation that risks taking the world's two most important powers to war","zh":"接下来，我们先追随中国在21世纪初重返海洋的脚步——那时它加入了国际社会打击海盗的行动，那是贸易所面临的一个老威胁的新版本。当时的努力，似乎预示着一种前景：中国将专注于与既有大国合作。但随着地位上升，它的自信在增长，它的不安也在增长。于是它转向更宽泛的主张和更宏大的海军抱负，起初是在周边海域。随着它在东部沿海海域的舰船网络与「基地」网络不断加密，它向整个「近海」投送力量的能力也随之增强。但军事事务自有其独特的升级逻辑：中国在近海越安全，远海的脆弱就越成为它更大的心病。就这样，一个岛接着一个岛，一片海接着一片海，中国对自己第一道防线的设想不断向外爬——直到伸进美国海军至今仍视为自身利益所在、视为美国防务核心的水域。最初只是南海上一场紧张而有限的较量，如今已变成一场近乎全球性的海军军备竞赛——一个不断升级的螺旋，有可能把世界上两个最重要的大国推向战争。"}],"notes":[]},{"id":"ch08","label":"Chapter 8","labelZh":"","title":"Pirates of the Twenty-First Century","titleZh":"第八章　二十一世纪的海盗","part":"Part III: The Flag Follows the Trade","showPart":true,"partZh":"第三部","partTitleZh":"旗帜跟着贸易走","paras":[{"id":"ch08-001","p":167,"t":"p","en":"As soon as human beings began transporting valuable goods via ship, you can be sure there were criminals scheming to intercept those vessels and run off with the loot.","zh":"人类刚开始用船运送贵重货物，几乎就可以断定，已有罪犯在盘算着拦截这些船只、卷走财物。"},{"id":"ch08-002","p":167,"t":"p","en":"—Steven Johnson, The Enemy of All Mankind","zh":"——史蒂文·约翰逊，《全人类的公敌》（The Enemy of All Mankind）"},{"id":"ch08-003","p":167,"t":"p","en":"At the eastern edge of the island of Singapore, a large jetty juts out into Changi Bay, the deepwater harbor that lies between that city-state, its Malaysian neighbor, and the Batam Islands of Indonesia—all abutting the Singapore Strait, ten miles to the east. Strung along the jetty are the gray hulls of the Republic of Singapore Navy, its frigates and corvettes docked in close formation.\" Singapore is known for its highly efficient government, its key role in Asian finance—and for the frequent visitor, its Peranakan cuisine. It's also the location of the world's most advanced counter-piracy operation.","zh":"在新加坡岛的东端，一座大型突堤码头伸入樟宜湾。樟宜湾是夹在这个城邦国家、它那位马来西亚邻居与印度尼西亚巴淡岛（Batam）之间的深水港，三者全都濒临新加坡海峡，海峡就在以东十英里处。码头沿岸鳞次栉比地停着新加坡共和国海军的灰色舰体，护卫舰与轻型护卫舰密集地并排靠泊。* 新加坡以政府高效、在亚洲金融中地位关键而闻名，对常来的访客来说，还有土生华人（Peranakan）美食。这里也是世界上最先进的反海盗行动所在地。"},{"id":"ch08-004","p":167,"t":"p","en":"*They are not there alone, though: they are moored beside warships of the US Navy. And nearby is Sembawang Terminal, formerly a base of the Royal Navy, now headquarters of the innocuously named Logistics Group Western Pacific—in reality, a unit of the powerful Seventh Fleet. While there is officially no American base in Singapore, Sembawang Terminal in effect serves as an important forward station for the US Navy, and carries with it the rich legacy of America's presence in Asia: it's the direct descendant of the Yangtze Patrol, America's first naval deployment into China in 1854.","zh":"*不过它们并不孤单：紧挨着它们停泊的，是美国海军的军舰。不远处是三巴旺码头（Sembawang Terminal），从前是英国皇家海军的基地，如今是一个名字听来人畜无害的机构——西太平洋后勤群——的总部，而它实际上是强大的第七舰队旗下的一支部队。虽说官方上美国在新加坡并无基地，三巴旺码头实际上充当着美国海军一处重要的前沿站点，并承载着美国在亚洲存在所留下的丰厚遗产：它是长江巡逻队的直系后裔，那正是1854年美国首次向中国部署的海上力量。"},{"id":"ch08-005","p":168,"t":"p","en":"Singapore is another of those small locales, like Hong Kong, that has played an outsize role in the texture of modern history. It became a British colony in 1824 as part of London's effort to deepen its base of operations in Asia. In the 1920s and '30s it became a key transport hub for oil and rubber from the Malay Peninsula just to its north—both goods essential to the galloping industrial development of that period. Its role in the oil and rubber trade made it a key target when the Imperial Japanese Navy moved to outflank the 1941 British and American blockade of its imports, and in February 1942 Singapore became the site of the first major British defeat in Asia.","zh":"新加坡是又一个像香港那样的小地方，在现代历史的肌理中却扮演了远超其体量的角色。1824年，它成为英国殖民地，这是伦敦为加深其亚洲经营据点所做努力的一部分。20世纪20年代和30年代，它成了正北面马来半岛石油与橡胶的重要转运枢纽，而这两种商品对那个时代疾驰的工业发展都不可或缺。它在石油与橡胶贸易中的地位，使其成为日本帝国海军的重要目标——1941年英美封锁日本进口，日本海军转而南下迂回突破；1942年2月，新加坡成为英国在亚洲第一场重大败绩的发生地。"},{"id":"ch08-006","p":168,"t":"p","en":"After the war Singapore reverted to British colonial rule. In 1966 it declared independence from Britain together with Malaysia; and then two years later, it separated from Malaysia to become an independent country. It developed quickly, helped along by a highly efficient (although nondemocratic) government system, and a huge investment in the education of its population. By the 1980s, Singapore had turned itself into a significant hub for finance and trade in Asia.² It managed to grow at a sustained pace over the next four decades and by 2019 had an average per capita income of just over \\$64,000, making it the eighthrichest country in the world.³","zh":"战后，新加坡重归英国殖民统治。1966年，它与马来西亚一起宣布脱离英国独立；两年后，它又从马来西亚分离出来，成为独立国家。它发展迅速，得益于一套高效（虽不民主）的政府体制，以及对国民教育的大规模投入。到20世纪80年代，新加坡已把自己打造成亚洲重要的金融与贸易枢纽。² 此后四十年它保持了持续增长，到2019年人均收入略高于64,000美元，位居世界第八富有国家。³"},{"id":"ch08-007","p":168,"t":"p","en":"All this was deeply to the credit of Singapore's postwar leaders. But they were aided by geography. Singapore was almost destined to ride the wave of Asia's economic growth, for it sits adjacent to Asia's sea gate to the Middle East and Europe: the Malacca Strait.","zh":"这一切在很大程度上要记在新加坡战后领导人的功劳簿上。但他们也得到了地理的助力。新加坡几乎注定要乘上亚洲经济增长的浪潮，因为它紧邻亚洲通往中东与欧洲的海上门户：马六甲海峡。"},{"id":"ch08-008","p":168,"t":"p","en":"The Strait of Malacca runs for over six hundred miles, connecting the South China Sea to the easternmost part of the Indian Ocean. With the reentry of China into the global economy, it outstripped the Suez Canal as the most important economic choke point in the world.","zh":"马六甲海峡绵延六百多英里，把南海与印度洋最东端连接起来。随着中国重返全球经济，它超过苏伊士运河，成为世界上最重要的经济咽喉要道。"},{"id":"ch08-009","p":168,"t":"p","en":"The Malacca Strait has long been contested. Between 605 and 1025 CE, the Srivijaya empire, a kingdom that stretched over much of the Indonesian archipelago, dominated the trade in ivory, tin, camphor, nutmeg, and sandalwood through the strait to India and China.4 As the spice trade flourished in the 1400s, Arab and Omani merchants took control of the strait and fortified several trading towns around it. Then it fell to the Portuguese.⁵ Just over a century later, the Dutch wrenched it away and held it for one hundred years. At which point, inevitably, the British got into the act. They established a base at George Town, at the western edge of the strait (in what is currently Malaysia), and from there sought to dominate the Malacca trade.6","zh":"马六甲海峡历来是必争之地。公元605年至1025年间，疆域覆盖印度尼西亚群岛大部的三佛齐（Srivijaya）帝国，掌控着经此海峡运往印度和中国的象牙、锡、樟脑、肉豆蔻与檀香贸易。4 15世纪香料贸易繁盛之际，阿拉伯与阿曼商人控制了海峡，并沿海峡修筑起数座设防的商镇。随后海峡落入葡萄牙人之手。⁵ 仅仅一个多世纪后，荷兰人将它生生夺走，据有一百年。到了这个时候，英国人不可避免地登场了。他们在海峡西端的乔治市（George Town，今属马来西亚）建立基地，并以此为依托谋求主导马六甲贸易。6"},{"id":"ch08-010","p":169,"t":"p","en":"Unusually, the British didn't try to force the Dutch out of the region. They found they faced a common threat: pirates. So pernicious was the effect of piracy on the spice trade that the two bitter European enemies put aside their differences to combat the threat together. They signed the Anglo-Dutch Treaty, establishing what was called the British Straits Settlement and demarcating British and Dutch parts of the territory, each agreeing to patrol their part of the strait in a joint effort to weaken the damage caused by the pirates.?","zh":"不同寻常的是，英国人并没有试图把荷兰人赶出这一地区。他们发现彼此面对着一个共同的威胁：海盗。海盗对香料贸易的危害之大，竟让这两个欧洲宿敌搁置分歧、联手应对。他们签署《英荷条约》，建立所谓英属海峡殖民地，划分英属与荷属的地界，双方同意各自巡逻本方那一段海峡，合力削弱海盗造成的破坏。*"},{"id":"ch08-011","p":169,"t":"p","en":"Fast-forward to the turn of the twenty-first century, and little had changed except the size of the ships and the number of countries involved in the counter-piracy effort. As container traffic out of Asia began its steep growth, shipping in and around the Malacca Strait began to experience a surge in piracy, which for many decades had been somewhat dormant. The United States was so worried about the potential of a large terrorist attack in the strait that it proposed sending its own ships there.8","zh":"快进到21世纪之交，除了船舶的体量与参与反海盗行动的国家的数目之外，几乎什么都没变。随着从亚洲发出的集装箱运量开始陡增，马六甲海峡内外的航运也开始遭遇海盗活动的激增，而此前数十年海盗活动在相当程度上处于沉寂。美国十分担忧海峡内发生大规模恐怖袭击的可能，甚至提议派遣自己的军舰前往。8"},{"id":"ch08-012","p":169,"t":"p","en":"The Malacca Strait has three features that make it especially vulnerable to pirates. It's narrow: at its widest point, it's only twenty-five miles. It's shallow: for large stretches, it's merely eighty-nine feet deep and, at the edges, much shallower still-which means there are very narrow passages through which ships must sail, making it easy to target them. And it's remote: it is bordered by states that are made up of archipelagos, with distant capitals whose sovereign control on outlying islands is loose at best. Indonesia, the largest of the three border states, is comprised of literally thousands of islands, and its central authorities have long been comparatively weak and extremely remote. From Malacca Town to Indonesia's present-day capital city, Jakarta, for example, is a distance of over 621 miles by air, and half that again in nautical miles. In the vacancies and spaces thus created, piracy flourished.","zh":"马六甲海峡有三个特点，使它格外容易遭海盗袭扰。一是窄：最宽处只有25英里。二是浅：相当长的区段仅有89英尺深，靠边缘处还要浅得多——这意味着船舶必须穿行的航道极为狭窄，因而很容易被锁定为目标。三是偏远：沿岸国家都由群岛构成，首都遥远，对边远岛屿的主权管辖至多只是松散。三个沿岸国中最大的印度尼西亚由数千座岛屿组成，其中央当局长期相对软弱，且鞭长莫及。举例说，从马六甲市到印度尼西亚现今首都雅加达，空中距离超过621英里，若按海里计还要再远一半。海盗就在由此生出的空隙与空白里繁盛起来。"},{"id":"ch08-013","p":169,"t":"p","en":"The costs of piracy were potentially very great indeed. There's the immediate cost to any given shipowner whose vessel is detained, or whose crew is kidnapped by pirates—to say nothing of the risk of loss of life. But the economic costs go far, far beyond the individual ship at risk. The cost of piracy is hugely amplified by the effect on one of the oldest forms of international finance—maritime insurance.","zh":"海盗的代价可能极其高昂。对任何一位船东来说，船舶被扣押、船员被海盗绑架，都意味着直接损失，更不用说还有人命之虞。但经济代价远远超出那一艘遇险船舶本身。海盗的代价之所以被急剧放大，是因为它作用于一种最古老的国际金融形式——海事保险。"},{"id":"ch08-014","p":169,"t":"p","en":"Modern-day shipping firms have to worry about insuring their ships and cargoes against modern forms of loss—mostly accident, but also, suddenly, twenty-first-century piracy. That is, they have to pay premiums to the world's large shipping insurance agencies—the most important of which is Lloyd's of London.","zh":"现代航运公司必须为船舶与货物投保，以防范现代形式的损失——大多是事故，但忽然之间，还要防21世纪的海盗。也就是说，它们必须向世界大型航运保险机构支付保费，其中最重要的就是伦敦劳合社。"},{"id":"ch08-015","p":170,"t":"p","en":"Just as car insurance companies charge different premiums depending on crime and accident rates in the neighborhood in which you live, so do Lloyd's and other maritime insurance agents charge a premium for accident-prone shipping routes. And even more for sailing in areas where there is a risk of war damage. And when piracy spiked in the Malacca waters in 2005, Lloyd's declared Malacca to be a war risk zone.\" This led to a spike in insurance premiums.","zh":"正如汽车保险公司会按你居住街区的犯罪率与事故率收取不同的保费，劳合社及其他海事保险机构也会对事故多发的航运航线加收保费；在存在战争损害风险的航区航行，保费还要更高。2005年，马六甲海域海盗活动激增，劳合社宣布马六甲为战争风险区。* 这导致保费飙升。"},{"id":"ch08-016","p":170,"t":"p","en":"This was no trivial problem. Shipping is an intensely competitive business, with low margins, so costs like insurance premiums can have a major effect on profits and losses—and on the price of traded goods. And the spike in prices affected not only the small number of ships that actually encountered pirates, but all ships seeking to sail through the passage. And that was half the world's ships, carrying half the world's trade.9","zh":"这绝不是个小问题。航运是竞争极其激烈、利润率微薄的行业，像保费这样的成本能对盈亏、进而对贸易商品的价格产生重大影响。而且保费飙升影响的不只是真正遭遇海盗的少数船舶，而是所有试图穿越这条航道的船舶。那是全世界一半的船舶，承载着全世界一半的贸易。9"},{"id":"ch08-017","p":170,"t":"p","en":"It's not straightforward to project outward what it would mean for the world economy as a whole had insurance rates remained at \"war risk zone\" levels. But at the very least it would have added a premium to the trade that passed through those waters-which, again, was half of all world trade. If sustained, the economic consequences would have been in the hundreds of billions of dollars, perhaps more.¹º","zh":"若保险费率一直维持在“战争风险区”的水平，对整个世界经济意味着什么，很难直接推演出来。但至少，它会给经由这片水域的贸易加上一笔溢价——而那又是全世界贸易的一半。倘若持续下去，经济后果将以数千亿美元计，或许更多。10"},{"id":"ch08-018","p":170,"t":"p","en":"That was certainly the view of governments worldwide, who rallied to tackle the Malacca piracy problem, hoping to convince Lloyd's to remove the war risk designation. Much like the British and the Dutch came together to tackle the scourge of piracy in the nineteenth century, governments joined forces—literally—to confront their twenty-firstcentury counterparts in the 2006 Regional Cooperation Agreement on Combating Piracy and Armed Robbery Against Ships in Asia (Re-CAAP). Under the lead of the Singaporean navy, they formed what's known as the Maritime Security Task Force in 2009—a coalition of the littoral states. They increased patrols, shared information about pirates, and mounted joint raids—all designed to respond quickly to pirate attacks, especially kidnappings, and help deter new ones.1\"1","zh":"世界各国政府无疑正是这样看的，它们联手应对马六甲海盗问题，希望能说服劳合社撤销战争风险区的认定。就像19世纪英国人与荷兰人联手对付海盗之患那样，各国政府真的携起手来，通过2006年《亚洲地区反海盗及武装劫船合作协定》（Re-CAAP）共同面对21世纪的同行。在新加坡海军牵头下，它们于2009年组建了所谓海上安全特遣队——一支由沿岸国家组成的联盟。它们加强巡逻、共享海盗情报、开展联合突袭，一切都是为了对海盗袭击、尤其是绑架事件作出快速反应，并有助于吓阻新的袭击。11"},{"id":"ch08-019","p":170,"t":"p","en":"As they worked together, they discovered that modern states can wield a weapon that individual pirates cannot: big data.¹²","zh":"在合作过程中，它们发现现代国家握有一种单个海盗无从使用的武器：大数据。12"},{"id":"ch08-020","p":171,"t":"p","en":"Tucked away at the rear of Changi Naval Base is a nondescript building; seen from the outside, it might be a conference facility, or a training center. In fact, it hosts the Information Fusion Center, where Singaporean naval officers gather and integrate global shipping information and turn it into action items, especially for the three navies that actively patrol the straits. 'The heart of the Information Fusion Center is a war room, familiar from movies and TV shows, replete with multiple large screens conveying real-time global data and a bank of computers manned by Singaporean naval officers tracking the flowing information in real time. That data comes from companies, global databases, international institutions like the International Maritime Organization and NATO, and the commercial fleets of the two dozen countries that now form part of this coalition.","zh":"樟宜海军基地后方藏着一栋不起眼的建筑；从外面看，它可能是会议场所，也可能是培训中心。事实上，这里是信息融合中心，新加坡海军军官在此汇集、整合全球航运信息，并将其转化为行动事项，尤其是供三支在海峡积极巡逻的海军使用。信息融合中心的核心是一间作战室，就像电影和电视剧里常见的那样，配有多块大型屏幕，实时呈现全球数据，还有一排计算机终端，由新加坡海军军官值守，实时追踪奔流而来的信息。这些数据来自企业、全球数据库、国际海事组织与北约等国际机构，以及如今构成这一联盟的二十四个国家的商船队。"},{"id":"ch08-021","p":171,"t":"p","en":"In their offices, the leadership have their own personal maps of their area of operations, a huge screen full of global incidents data, and details of the ever more sophisticated efforts to use information technology and AI algorithms to track the flow of containers headed to the Malacca Strait. From the office windows, you can see the hulls of several dozen container ships of all sizes, from the modest to the massive, queued up, waiting for clearance.","zh":"在办公室里，领导层挂着各自所辖行动区域的专用地图，一块巨大的屏幕布满全球事件数据，还有种种日趋精密的工作的细节——用信息技术与人工智能算法追踪驶向马六甲海峡的集装箱流向。从办公室的窗户望出去，能看到数十艘大小不一、从中等吨位到超大型的集装箱船的船体，排着队等待放行。"},{"id":"ch08-022","p":171,"t":"p","en":"The volume of information processed at Changi is astonishing. At any given minute, the Information Fusion Center can pinpoint the location of any one of the ninety thousand ships that transit the Malacca Strait yearly—ships that between them carry millions of containers, millions of opportunities to smuggle terrorists, weapons of mass destruction, human beings, and other illicit goods into ports around the world.","zh":"樟宜处理的信息量惊人。在任意一分钟里，信息融合中心都能锁定每年通过马六甲海峡的9万艘船舶中任何一艘的位置——这些船合计运载着数百万只集装箱，也就意味着数百万个把恐怖分子、大规模杀伤性武器、人口和其他违禁品走私进世界各地港口的机会。"},{"id":"ch08-023","p":171,"t":"p","en":"The war room and data flow into the Information Fusion Center is one-half of its operation; the other half is a simple conference room. In that conference room sit naval attachés from the now twenty-four nations that have joined the effort. This is no small group of nations, either: together the twenty-four countries around the table represent almost 70 percent of the global GDP and global military spending. However, unlike, say, the naval war room of NATO or the EU, these nations are not allies; many of them are sharp rivals—India participates, for example, alongside Pakistan. (One of the more recent participants: China.)13","zh":"作战室与汇入信息融合中心的数据流只是它的一半；另一半是一间普通的会议室。会议室里坐着的，是如今已加入这项工作的二十四个国家派出的海军武官。这也不是一群无足轻重的国家：围坐在桌旁的二十四国，合计代表着全球GDP和全球军费开支的近70%。不过，与北约或欧盟的海军作战室不同，这些国家并非盟友，其中许多是尖锐的对手——比如印度参加，巴基斯坦也参加。（中国是较晚加入的参与者之一。）13"},{"id":"ch08-024","p":171,"t":"p","en":"This was the initial coalition to counter piracy; and it was highly successful. In 2006, just one year after it deployed it, Lloyd's removed the war risk designation. But the Malacca Straits, critical though they are, are a comparatively tiny piece of geography. Just as the Malacca piracy was coming under control, a far larger problem spawned-a new breed of pirates threatening a far larger swath of the world's oceans.","zh":"这就是最初的反海盗联盟，而且成效显著。2006年，也就是它部署一年之后，劳合社就撤销了战争风险区的认定。但马六甲海峡虽至关重要，在地理上却只是一小片。就在马六甲海盗得到控制的同时，一个更大的问题滋生出来——新一代海盗，威胁着世界上远为广阔的一片海洋。"},{"id":"ch08-025","p":172,"t":"h","en":"Pirates of the Indian Ocean","zh":"印度洋的海盗"},{"id":"ch08-026","p":172,"t":"p","en":"The Indian Ocean is smaller than the Pacific or the Atlantic, and yet even its scale is hard to envisage. At its narrowest point, it's just over six thousand miles wide, more than twice the entire width of the United States. It covers 27 million square miles of the Earth's surface and laps out at the edges of four continents: Asia in the north, Africa in the west, Australia in the east, and the Antarctic in the south (after it blends into the littoral Southern Ocean). Two billion people live along its coasts. Even a modern, high-speed ship takes nearly five and a half days to cross to the African or Middle Eastern coasts. During that period of time, it's exceedingly unlikely that it will encounter a single other ship or spot any form of human activity other than the people on the ship itself.","zh":"印度洋比太平洋或大西洋小，但即便如此，它的尺度仍难以想象。最窄处也有六千多英里宽，超过美国全境宽度的两倍。它覆盖地球表面2,700万平方英里，边缘拍打着四大洲：北面的亚洲、西面的非洲、东面的澳大利亚、南面的南极洲（在那里它与南大洋的沿岸水域融为一体）。20亿人生活在它的海岸线上。即便是一艘现代高速船，驶往非洲或中东海岸也需近五天半。在这段时间里，它极不可能遇到任何一艘别的船，也不可能见到船上人员之外的任何人类活动的迹象。"},{"id":"ch08-027","p":172,"t":"p","en":"That changes when ships get within a thousand miles of the coast of Zanzibar. And then, mile by mile, the odds of encountering another ship start to climb. And that is not a good thing.","zh":"船舶驶到距桑给巴尔海岸一千英里以内时，情况开始改变。此后，每前进一英里，遭遇另一艘船的几率就上升一分。而这并不是什么好事。"},{"id":"ch08-028","p":172,"t":"p","en":"To stand on Zanzibar's Indian Ocean coast is to be transported back to an earlier time. Zanzibar's soft white sand and its temperate waters, turquoise bleeding into aquamarine, rival the most spectacular of the Caribbean islands. Everywhere the scent of clove permeates the air. Clove trees were planted in Zanzibar in 1818 by the sultan of Oman, seeking to break the Indonesian monopoly on that most lucrative part of the spice trade.¹4 And the vibrant red of peppercorns covers field after field of inland farms.","zh":"站在桑给巴尔的印度洋海岸上，仿佛被带回了更早的年代。桑给巴尔柔软的白沙与温和的海水，由绿松石色渐次化入海蓝宝石色，可与加勒比最壮丽的岛屿媲美。空气中处处弥漫着丁香的气味。1818年，阿曼苏丹在桑给巴尔种下丁香树，意在打破印度尼西亚对香料贸易中这一最赚钱部分的垄断。14 内陆农田里，一片接一片铺满胡椒籽那鲜亮的红。"},{"id":"ch08-029","p":172,"t":"p","en":"Like almost every other territory we'll encounter in this book, the east coast of Africa has been the locus of fights between empires for control of trade.\" The most successful empire in the history of East Africa is perhaps the least well known—the Omani Empire, which from the early seventeenth century held sway over a swath of territory that stretched more than one thousand miles north and a similar distance south from its base in Muscat, Oman. From the Arabian Peninsula, the Omanis developed advanced seafaring technologies that allowed them to impose their presence and expand their trade in spices and slaves as far north as modern-day Iran, Gwadar port in Pakistan, and south across modern-day Somalia down through Kenya and Zanzibar (in modern-day Tanzania). So significant was the Omani Empire in the nineteenth century that the private secretary of the sultan of Oman, Ahmad bin Na’aman Al Kaabi, became the first Arab emissary to visit the United States, sailing from Zanzibar to New York in 1840, where he met with Vice President Richard Mentor Johnson.15","zh":"如同本书中我们将要遇到的几乎所有其他地方，非洲东海岸一直是各个帝国争夺贸易控制权之所。* 东非历史上最成功的帝国，或许也是最少为人知的——阿曼帝国。自17世纪初起，它以阿曼的马斯喀特为基地，把统治伸向北方一千多英里外的土地，向南也延伸大致相同的距离。阿曼人从阿拉伯半岛发展出先进的航海技术，借此确立自己的存在，并把香料与奴隶贸易向北拓展到今天的伊朗、巴基斯坦的瓜达尔港，向南跨越今天的索马里，一路经肯尼亚直抵桑给巴尔（今属坦桑尼亚）。阿曼帝国在19世纪地位之显赫，以至于阿曼苏丹的私人秘书艾哈迈德·本·纳阿曼·卡比（Ahmad bin Na’aman Al Kaabi）成为首位访问美国的阿拉伯使节——他于1840年从桑给巴尔航行到纽约，会见了副总统理查德·门特·约翰逊。15"},{"id":"ch08-030","p":172,"t":"n","en":"Readers interested in the history of the Omani empire should read Robert D. Kaplan's sweeping (and foresightful) account of the Indian Ocean, Monsoon: The Indian Ocean and the Future of American Power (New York: Random House, 2011).","zh":"想了解阿曼帝国历史的读者，可读罗伯特·D. 卡普兰关于印度洋的宏大（且富有先见）的记述：《季风：印度洋与美国权力的未来》（Monsoon: The Indian Ocean and the Future of American Power，纽约：兰登书屋，2011年）。"},{"id":"ch08-031","p":173,"t":"p","en":"Having defeated the Portuguese in Mombasa (then East Africa's major port city) in 1698, the Omanis established a new capital in the fabled city of Zanzibar in 1832, and moved the center of their operations from Muscat to Stone Town, on Zanzibar Island.16 To this day, Stone Town still largely reflects the architectural and cultural legacy of the Omani occupation. A maze of narrow, high-walled streets are enclosed by the three-story gray-stone houses that dominate the inner byways of the city. Anchoring the center of town is the Palace of Wonders, home of the second Sultan of Zanzibar, with its high clock tower—best viewed from the rooftop of the nearby Emerson Hotel, a favorite of western tourists in the early days of Zanzibar's development.* Huge mahogany doors, intricately carved, mark the entrances to the city's more important civic buildings. Its markets are festooned with kikoys woven in every color under the tropical sun, imports from India, as well as cheap plastic and polyester trade goods imported from China of the kind that now dominate every market in the Middle East. The ruins of Omani fortifications are still to be found on Zanzibar's east coast, from where dhows, still built on Omani designs, ply the fishing trade off East Africa's productive waters.","zh":"1698年在蒙巴萨（当时东非的主要港口城市）击败葡萄牙人之后，阿曼人于1832年在传说之城桑给巴尔建立新都，并把经营中心从马斯喀特迁到桑给巴尔岛上的石头城（Stone Town）。16 时至今日，石头城在很大程度上仍映照着阿曼统治留下的建筑与文化遗产。一座座三层灰石房屋围合出迷宫般狭窄、两侧高墙夹峙的街巷，主宰着城市内部的通道。镇中心的地标是奇迹宫（Palace of Wonders），桑给巴尔第二任苏丹的居所，带有一座高高的钟楼——从附近艾默生酒店（Emerson Hotel）的屋顶上观赏最佳，这家酒店在桑给巴尔开发早期是西方游客的最爱。* 一扇扇雕刻繁复的巨大桃花心木门，标示着城内较重要的公共建筑的入口。集市里挂满在热带阳光下织成、五颜六色的基科伊布（kikoy），它们来自印度；也有来自中国的廉价塑料与涤纶制品，就是如今充斥中东每一个市场的那一类。桑给巴尔东海岸仍能找到阿曼防御工事的废墟，从那里出发，依旧按阿曼式样建造的单桅三角帆船（dhow）出入于东非丰饶的水域，经营着渔业。"},{"id":"ch08-032","p":173,"t":"p","en":"The German East African colony of Tanganyika gained independence in 1961, and in 1964 joined with Zanzibar to form the modern nation of Tanzania. It's been largely at peace ever since. It's one of the poorest countries in the world, though, and for decades labored under a socialist government that married equal parts corruption and inefficiency. It gained a form of democracy in the 1990s, and by the mid-2000s had begun to develop economically. Its mainland port of Dar es Salaam (House of Peace) is now the second-largest on Africa's eastern coast.17","zh":"德属东非殖民地坦噶尼喀于1961年获得独立，1964年与桑给巴尔合并，组成现代国家坦桑尼亚。此后它大体上一直处于和平之中。不过，它是世界上最穷的国家之一，数十年来在一个把腐败与低效各占一半地掺在一起的社会主义政府下艰难挣扎。它在20世纪90年代获得了某种形式的民主，到2000年代中期开始经济发展。它在大陆上的港口达累斯萨拉姆（Dar es Salaam，意为“和平之家”）如今是非洲东海岸第二大港。17"},{"id":"ch08-033","p":173,"t":"n","en":"As this book was being finalized, the Omani government began a restoration of the Palace of Wonders, which went badly wrong; the clock tower and much of the original facade of the former Sultanate collapsed.","zh":"在本书定稿之际，阿曼政府开始修复奇迹宫，结果严重出错：钟楼连同前苏丹国建筑的原有立面大部分坍塌。"},{"id":"ch08-034","p":174,"t":"p","en":"But anyone navigating a large container ship past the island of Zanzibar into the Dar es Salaam port is not focused on Tanzania's growth. From the mid-2000s onward, the Zanzibari coast became famous once again, for a different kind of danger. This time, it was not a distant empire threatening the fishing dhows, but modern-day pirates threatening ocean liners and container ships.","zh":"但是，任何驾驶大型集装箱船绕过桑给巴尔岛驶入达累斯萨拉姆港的人，心思都不在坦桑尼亚的增长上。从2000年代中期起，桑给巴尔海岸再度出名，这一次是因为另一种危险。这一回威胁渔业三角帆船的不再是某个遥远的帝国，而是威胁远洋客轮与集装箱船的现代海盗。"},{"id":"ch08-035","p":174,"t":"p","en":"One of the more dramatic and consequential attacks off the Zanzibari coast came in 2011 when seven pirates in a small skiff attacked an oil and gas exploration ship, Ocean Rig Poseidon, owned by Brazil's Petrobras. It was part of a major Brazilian joint venture with Tanzania to explore new gas fields in Tanzania's territorial waters in the Indian Ocean. The attack, which injured several, was eventually repulsed by security guards on the ship and a Tanzanian rescue crew was quickly dispatched to the scene, eighty-two nautical miles off the coast from Dar es Salaam. In total, authorities had arrested eighteen pirates for attacks in Zanzibari waters that year—all of them Somali.18","zh":"桑给巴尔海岸外较为惊心动魄、也较有影响的袭击之一发生在2011年：7名海盗乘一艘小艇，袭击了巴西国家石油公司（Petrobras）旗下的油气勘探船「海洋钻探波塞冬」号（Ocean Rig Poseidon）。那是巴西与坦桑尼亚合作勘探坦桑尼亚在印度洋领海内新气田的一个大型合资项目的一部分。袭击造成数人受伤，最终被船上的保安击退，坦桑尼亚一支救援队迅速被派往事发海域，那里距达累斯萨拉姆海岸82海里。当年，当局在桑给巴尔水域共逮捕了18名海盗——全都是索马里人。18"},{"id":"ch08-036","p":174,"t":"p","en":"The Malacca pirates may have long tradition on their side, but today's most sophisticated pirates are Somali. They ply that ancient craft along a route that has almost exactly the same reach as the Omani Empire. From towns on the Somali coast, often using the ruins of Omani fortresses as their hub of operations, they sail in small dhows fitted with outboard motors, up and down the white-sand coasts of Somalia, Kenya, Tanzania, Yemen, and Oman, and as far across as the waters off the coast of Pakistan. Since 2008, they've conducted thousands of documented attacks.","zh":"马六甲海盗或许有悠久的传统撑腰，但当今最“专业”的海盗是索马里人。他们沿着一条与当年阿曼帝国疆域几乎完全重合的路线，操持着这门古老的营生。他们从索马里海岸上的城镇出发——常以阿曼要塞的废墟为活动据点——驾着装了舷外马达的小型三角帆船，沿着索马里、肯尼亚、坦桑尼亚、也门和阿曼的白沙海岸来回游弋，最远一直掠到巴基斯坦沿海水域。自2008年以来，他们已实施了数千起有记录的袭击。"},{"id":"ch08-037","p":174,"t":"p","en":"For Western audiences, Somali pirates made their popular debut in the 2013 movie Captain Phillips, based on a real incident. On the morning of April 8, 2009, the Maersk Alabama was en route to Mombasa, Kenya, when it was hijacked by pirates off the Somali coast. What this crew had going for it that the pirates’ previous targets did not was that its captain, Richard Phillips, was American. This was the first time in one hundred years that the US needed to rescue an American aboard a ship seized by pirates. The pirate crew that tackled the Alabama had to deal with the world's largest and most powerful naval force, the modern US Navy. On April 9, the USS Bainbridge intercepted the ship. Shortly thereafter, the Bainbridge crew boarded the Alabama, capturing most of the pirates and rescuing the crew. The captain escaped on a lifeboat, only to be tracked down and boarded by pirates again. On April 12, US Navy SEALS raided the lifeboat, freeing the captain, killing three pirates, and capturing the fourth, Abduwali Abdukadir Muse.19 Muse became the first pirate in a century to be tried in an American court.20","zh":"对西方观众而言，索马里海盗是在2013年的电影《菲利普斯船长》中为人熟知的，该片改编自真实事件。2009年4月8日清晨，「马士基·阿拉巴马」号（Maersk Alabama）正驶往肯尼亚蒙巴萨，在索马里海岸外被海盗劫持。这艘船的船员有一点是海盗此前下手的目标所没有的：船长理查德·菲利普斯是美国人。这是一个世纪以来美国第一次需要营救被海盗扣押船只上的美国人。袭击「阿拉巴马」号的那伙海盗，不得不面对世界上规模最大、实力最强的海上力量——现代美国海军。4月9日，「班布里奇」号（USS Bainbridge）拦截了该船。此后不久，「班布里奇」号的船员登上「阿拉巴马」号，俘获了大部分海盗，救出了船员。船长乘救生艇逃脱，却被追踪并再次遭海盗登艇。4月12日，美国海军海豹突击队突袭救生艇，救出船长，击毙三名海盗，俘获第四名——阿卜杜瓦利·阿卜杜卡迪尔·穆塞（Abduwali Abdukadir Muse）。19 穆塞成为一个世纪以来第一个在美国法庭受审的海盗。20"},{"id":"ch08-038","p":175,"t":"p","en":"Seen through a historical lens, this was a remarkable act by the United States—projecting naval power and protecting nationals from pirates half a world away from home shores.","zh":"从历史的镜头看，这是美国一次了不起的举动——在距离本土半个地球之外投射海军力量，保护本国公民免受海盗之害。"},{"id":"ch08-039","p":175,"t":"p","en":"Still, although the largest navy in the world by a substantial measure, even the US Navy cannot single-handedly patrol the entire breadth of the Indian Ocean. And so, just as the Royal Navy in its heyday had sought the help of the Dutch to tackle Malacca piracy, so the US Navy sought the help of its allies. And of some interesting partners.","zh":"尽管如此，美国海军即便在规模上远远领先，也无法独自巡逻整个印度洋的广阔水域。于是，正如鼎盛时期的皇家海军曾寻求荷兰人的帮助来应对马六甲海盗，美国海军也寻求盟友的帮助。以及一些颇有意思的伙伴。"},{"id":"ch08-040","p":175,"t":"h","en":"Counter-Piracy Coalition","zh":"反海盗联合阵线"},{"id":"ch08-041","p":175,"t":"p","en":"In 2005, the UN's International Maritime Organization, from its headquarters in London on the banks of the Thames, started warning of an increase in piracy attacks in the Gulf of Aden, which opens out into the Indian Ocean.²¹ There had been a handful of attacks in the previous decade, but then there was a sharp rise in 2005, to more than ten. That year, and in each of the subsequent two years, there were roughly a dozen attacks. Concern about them was amplified by the fact that Yemen, on the northern shore of the Gulf of Aden, was home to an Al Qaeda affiliate. A second Al Qaeda affiliate, Al Shabab, was gaining a foothold on Somali's anarchic soil.","zh":"2005年，联合国国际海事组织从其位于泰晤士河畔伦敦的总部开始发出警告：亚丁湾——这条通向印度洋的水道——的海盗袭击正在增多。²¹ 此前十年间，那里只发生过零星几起袭击；但到2005年，数字陡然上扬，超过十起。这一年，以及此后两年中的每一年，袭击都在十二起上下。这些袭击引起的担忧，又被另一件事放大：亚丁湾北岸的也门，正是基地组织一个分支的落脚地。基地组织的第二个分支——青年党（Al Shabab）——正在索马里这片无政府的土地上站稳脚跟。"},{"id":"ch08-042","p":175,"t":"p","en":"From 2007 to '08, the situation got worse. The number of attacks spiked to 51 in 2007 and then to 111 in 2008.22 The attacks spread from the Gulf of Aden out into the Indian Ocean. And in 2007, Somali pirates attacked a ship that was part of a World Food Programme convoy bringing food to relieve the crisis in Somalia—where an estimated 2 million to 3 million Somalis were facing starvation.23","zh":"2007年到2008年，局势进一步恶化。袭击数量2007年猛增到51起，2008年又升至111起。²² 袭击的范围从亚丁湾扩散到印度洋深处。2007年，索马里海盗还袭击了一艘属于世界粮食计划署运输船队的船只，那支船队运的是缓解索马里危机的粮食——当时估计有200万到300万索马里人正面临饥饿。²³"},{"id":"ch08-043","p":176,"t":"p","en":"Governments moved to respond, starting at the UN Security Council, where they issued a collective call to take swift action to protect the World Food Programme's ships and to tackle the mounting problem of piracy.24 This had international lawyers scrambling to figure out one of the oldest domains of international law, the law of piracy—largely a series of legal arrangements between the European powers from the eighteenth century, barely updated since the nineteenth.²5","zh":"各国政府开始行动，起点是联合国安理会：在那里，它们发出一致呼吁，要求迅速采取行动保护世界粮食计划署的船只，并解决日益严重的海盗问题。²⁴ 这让国际法学者们忙作一团，去梳理国际法中最古老的领域之一——海盗法。那大体上是18世纪欧洲列强之间的一系列法律安排，自19世纪以来几乎没有更新。²⁵"},{"id":"ch08-044","p":176,"t":"p","en":"To update the rule book for twenty-first-century piracy, the lawyers took two consequential steps. One of the bedrock principles of contemporary international law is that state sovereignty extends into the seas—that is to say, every state with a coastline is granted a twelvemile zone of exclusive sovereignty into what are called its “territorial waters.\" Other countries can sail through those waters through a provision known as “innocent passage,\" which (unusually for an international legal concept) actually explains the principle at stake: other states' vessels can pass through a sovereign state's exclusive waters if their presence in no way threatens or harms the state in question. What this meant, though, is that foreign navies couldn't legally sail into the territorial waters of Somalia to tackle the pirates because their actions weren't “innocent.\" So all the pirates had to do was retreat to that outer band of territorial waters twelve miles off the coast to be free from chase. For the fight against the Somali pirates, the UN Security Council waived that provision, giving any state willing to participate in the fight against piracy the right to enter Somali territorial waters to tackle the pirates. And it gave those states the right to use \"any and all means\" to repress the pirates—that is, the right to use force.26","zh":"为了让这本规则手册跟得上21世纪的海盗，法学家们迈出了影响深远的两步。当代国际法有一条基石原则：国家主权延伸入海——也就是说，每个拥有海岸线的国家，都对其岸外12海里的水域享有排他主权，这片水域被称为“领海”。其他国家可以依据一项名为“无害通过”的规定穿越这些水域；这个名称（在国际法概念里实属少见）本身就说清了要害所在：只要外国船舶的存在对该国不构成任何威胁或损害，它就可以通过一个主权国家的专属水域。可这就意味着，外国海军无法合法驶入索马里领海打击海盗，因为它们的行动算不上“无害”。海盗只要退到岸外12海里领海的外缘，就免受追捕。为了打击索马里海盗，联合国安理会中止了上述规定，授权任何愿意参与反海盗行动的国家进入索马里领海清剿海盗，并授权这些国家使用“一切手段”镇压海盗——也就是动用武力的权利。²⁶"},{"id":"ch08-045","p":176,"t":"p","en":"As it happened, there was already a set of ships patrolling in the Gulf of Aden. In the wake of 9/11, the United States had established what was known as the Combined Task Force 150 to guard against terrorist activity in the gulf. It drew together navies from core NATO allies like Germany and the UK, with other American security partners.27 Part of this unit was repurposed into Combined Task Force 151, with a counter-piracy mission focused on the Gulf of Aden.","zh":"巧的是，亚丁湾上原本就有一批军舰在巡逻。“9·11”之后，美国组建了所谓第150联合特遣队（Combined Task Force 150），防范该海湾的恐怖活动。它把德国、英国等北约核心盟国的海军，与美国其他的安全伙伴汇聚到一起。²⁷ 这支部队的一部分随后被改编为第151联合特遣队（Combined Task Force 151），任务是聚焦亚丁湾的反海盗行动。"},{"id":"ch08-046","p":176,"t":"p","en":"The Somali pirates' response was agile. Far from retreating from attacks in the Gulf of Aden, where CTF 151 was patrolling, they simply spread out their range of threat, moving farther into the Indian Ocean, south to Zanzibar, and north toward Oman and Pakistan. Pirate attacks continued to climb, as did the economic costs.","zh":"索马里海盗的应对相当灵活。他们并没有因为第151联合特遣队在亚丁湾巡逻就收手，而是把威胁范围铺得更开：向印度洋更深处推进，向南到桑给巴尔，向北抵近阿曼和巴基斯坦。海盗袭击持续攀升，经济代价也随之上升。"},{"id":"ch08-047","p":177,"t":"p","en":"The European Union stepped into the breach, deploying its own naval task force, Operation Atalanta (or Combined Task Force 465). Twenty-six European nations participated in Operation Atalanta.28 And then, to further extend the reach of patrols, NATO created a third task force, Operation Ocean Shield. Five NATO allies made up the core of Operation Ocean Shield: the United States, Denmark, Italy, Turkey, and the United Kingdom. Other countries—Ukraine, for example— participated in the force through alliance partnership arrangements.29","zh":"欧盟补上了这个缺口，派出自己的海军特遣队——“阿塔兰塔”行动（Operation Atalanta，亦称第465联合特遣队）。26个欧洲国家参加了“阿塔兰塔”行动。²⁸ 随后，为进一步扩大巡逻覆盖面，北约又组建了第三支特遣队——“海洋之盾”行动（Operation Ocean Shield）。五个北约盟国构成“海洋之盾”行动的核心：美国、丹麦、意大利、土耳其和英国。另有其他国家——例如乌克兰——通过联盟伙伴关系安排加入这支部队。²⁹"},{"id":"ch08-048","p":177,"t":"p","en":"But what really made the maritime operations off the coast of Somalia interesting is that several unusual partners joined in: the Republic of Korea and Turkey in Operation Ocean Shield; the United Arab Emirates, Bahrain, and Pakistan in Combined Task Force 151. And the navies of China and Russia started to patrol alongside NATO forces.30","zh":"但真正让索马里沿海的海上行动变得有意思的，是几个不寻常的伙伴也加入了进来：韩国和土耳其加入“海洋之盾”行动；阿联酋、巴林和巴基斯坦加入第151联合特遣队。而中国和俄罗斯的海军，也开始与北约部队并肩巡逻。³⁰"},{"id":"ch08-049","p":177,"t":"p","en":"It was a striking display. During the Cold War, the Western powers patrolled together and shared intelligence among themselves, but not beyond. And in the first period after the end of the Cold War, the Western powers took on a broader, global role. Now a series of non-Western powers were growing in influence—gaining power for the first time, or regaining it. What relationship they would have to the West, and to the established international system, was a key question. Here, they seemed poised to cooperate with the West.","zh":"这番景象相当醒目。冷战期间，西方列强一起巡逻，彼此共享情报，但绝不与圈外分享。冷战结束后的最初一段时期，西方列强承担起更广泛的全球角色。而此时，一批非西方国家的影响力正在上升——有的头一次获得力量，有的重新获得力量。它们与西方、与既有的国际体系将是何种关系，是一个关键问题。而在亚丁湾，它们似乎正准备与西方合作。"},{"id":"ch08-050","p":177,"t":"p","en":"At first, there were problems in coordination, and debates about what to do with the pirates once they were captured.³1 These details were ironed out, however, and combined with on-land efforts— including the UN and African Union helping to maintain security in Mogadishu's port, and EU naval patrols on Somali rivers—piracy began to drop off.* The counter-piracy effort began to work. Attacks fell slightly in 2010, and then dramatically in 2011.32","zh":"起初，协调上有些问题，各方还就抓获海盗后如何处置争论不休。³¹ 不过这些细节后来都理顺了，再加上陆上行动的配合——联合国和非洲联盟协助维持摩加迪沙港口的安全，欧盟的军舰在索马里内河上巡逻——海盗活动开始减少。* 反海盗行动开始见效：2010年袭击略有下降，到2011年则大幅下降。³²"},{"id":"ch08-051","p":177,"t":"n","en":"The European powers sailing in Operation Atalanta didn't want to jail the captured pirates in their own countries because of the high cost of doing so. The British special envoy for the piracy problem, the feisty Karen Pierce (later UK ambassador to the United Nations and then to the United States) had a simple if dramatic proposal: sink their ships. In the end, the Western powers decided on a different course, offering expanded aid to Kenya, the Seychelles, and Mauritius if those countries would try the","zh":"参加“阿塔兰塔”行动的欧洲列强不愿把抓获的海盗关进本国监狱，因为这样做成本太高。英国负责海盗问题的特使、泼辣的卡伦·皮尔斯（Karen Pierce，后来先后出任英国常驻联合国代表和驻美大使）提出过一个简单却惊人的方案：把他们的船凿沉。最终，西方列强选了另一条路：只要肯尼亚、塞舌尔和毛里求斯愿意审判"},{"id":"ch08-052","p":178,"t":"p","en":"This was more than an economic success. It seemed to hint at a world in which the shared interests of the United States, Europe, and the “rising powers\"—China, Russia, Turkey, India, Brazil, and others— would trump the historic instinct for competition among them. All these actors were participants in a single, integrated global economy forged by sea-based trade. It presaged a world where the major military powers could put aside older patterns of rivalry and cooperate for mutual economic gain.","zh":"这不只是经济上的成功。它似乎暗示着这样一个世界：美国、欧洲与“新兴大国”——中国、俄罗斯、土耳其、印度、巴西等——的共同利益，将压倒彼此竞争的历史本能。所有这些角色，都是同一个由海运贸易锻造出来的一体化全球经济的参与者。它预示着一个各大军事强国能够放下旧有的对抗模式、为共同的经济利益携手合作的世界。"},{"id":"ch08-053","p":178,"t":"p","en":"Or was it too good to be true?","zh":"还是说，这一切好得不像真的？"},{"id":"ch08-054","p":178,"t":"p","en":"Over time, the role of China in the counter-piracy operations began to be seen in a different light. Western naval planners worried that the Chinese were using these operations for a different purpose: to train the People's Liberation Navy to mount operations far from China's shores. The operations gave China extensive practice in mounting sorties, navigating through the tricky Malacca Strait, and testing their capacity to maintain effective communication between their ships and other parts of their defense apparatus, across the entire width of the Indian Ocean.* All of which was useful to the counter-piracy effort, to be sure. But in the minds of the West, the question began to arise: Was China's expanding role really only about protection of trade? Or was it developing naval capacity as part of a wider effort to project power contemplating, in fact, a more forceful return to the seas?³3","zh":"随着时间推移，中国在反海盗行动中的角色开始被放在另一种眼光下审视。西方海军的规划者担心，中国人是在借这些行动达成另一个目的：训练中国人民解放军海军在远离中国海岸的地方实施行动。这些行动给了中国大量练兵机会——组织出击，穿越难以对付的马六甲海峡，检验舰船与国防体系其他部分在跨越整个印度洋宽度时保持有效通信的能力。* 诚然，这一切对反海盗行动都有帮助。但在西方看来，一个问题开始浮现：中国不断扩大的角色，真的只是为了保护贸易吗？还是说，它在发展海军能力，作为更宏大的力量投射努力的一部分——实际上是在盘算着以更强硬的姿态重返海洋？³³"},{"id":"ch08-055","p":178,"t":"n","en":"Somali pirates in their courts and jail them in their territories, with the bulk of the trials and imprisonments happening in Kenya. See Jay Bahadur, The Pirates of Somalia: Inside Their Hidden World (New York: Vintage), 2012.","zh":"索马里海盗，并在本国境内关押他们，西方列强就向这些国家追加援助，实际的审判与监禁大部分在肯尼亚进行。见杰伊·巴哈杜尔（Jay Bahadur），《索马里海盗：他们隐秘世界的内幕》（The Pirates of Somalia: Inside Their Hidden World，纽约：Vintage出版社，2012年）。"},{"id":"ch08-056","p":178,"t":"n","en":"Fast-forward, and China's role has grown—and grown. As of 2018, China had conducted no less than thirty separate task groups (sorties), each involving multiple frigates or destroyers—including advanced ships like their Jiangkai II class guidedmissile frigates—to patrol the Gulf of Aden and the western edge of the Indian Ocean.","zh":"快进到今天，中国的角色越做越大。截至2018年，中国已派出不少于30个独立任务编队（批次），每个编队都编有多艘护卫舰或驱逐舰——包括江凯II级导弹护卫舰这类先进舰艇——赴亚丁湾和印度洋西缘巡逻。"}],"notes":[]},{"id":"ch09","label":"Chapter 9","labelZh":"","title":"The Near Seas","titleZh":"第九章　近海","part":"Part III: The Flag Follows the Trade","showPart":false,"partZh":"第三部","partTitleZh":"旗帜跟着贸易走","paras":[{"id":"ch09-001","p":179,"t":"p","en":"\"Historical experience tells us that countries that embrace the sea thrive, while states that spurn the sea decline.\"","zh":"“历史经验告诉我们，拥抱海洋的国家兴旺发达，摒弃海洋的国家则走向衰落。”"},{"id":"ch09-002","p":179,"t":"p","en":"—Xi Jingping, speech to the Chinese Politburu, 2013¹","zh":"——习近平，2013年对中共中央政治局的讲话¹"},{"id":"ch09-003","p":179,"t":"p","en":"In the modern period, each of the nations that has stood atop world affairs has faced the world from a capital on or near the seas. Venice forged its maritime empire from a lagoon within the Adriatic Sea. The Ottomans competed for power from the banks of the Golden Horn, separating the Bosphorus from the Marmara Sea. Portugal dominated the high seas from the port city of Lisbon, set on the westernmost ledge of the European continent and protected from the Atlantic currents only by the headlands at the mouth of the Tagus River. London is arrayed along the tidal flows of the Thames and lies a mere thirty miles from where the river opens to the English Channel and thence the North Sea. And even when America's first independent leaders moved the US Congress from the great port city of Philadelphia, it chose a site on the Potomac River merely twenty-five miles from Chesapeake Bay,' one of the world's great inland waterways, its brackish waters flowing swiftly out into the western Atlantic.","zh":"近代以来，凡是位居世界事务顶端的国家，其首都都临海或近海。威尼斯在亚得里亚海的一座潟湖上锻造出自己的海上帝国。奥斯曼人争夺权力，立足点是金角湾两岸——那道水湾把博斯普鲁斯海峡与马尔马拉海分隔开来。葡萄牙从港口城市里斯本出发称雄公海；里斯本坐落在欧洲大陆最西端的边缘，全凭特茹河口的海岬为它挡住大西洋的涌流。伦敦沿泰晤士河的潮水铺展开来，距河流汇入英吉利海峡、再通往北海之处，只有三十英里。就连美国独立之初的领袖们把国会从大港费城迁走时，选中的也是波托马克河畔的一处地方，距切萨皮克湾*仅二十五英里。那是世界著名的内河水道之一，微咸的水流湍急地涌向西大西洋。"},{"id":"ch09-004","p":179,"t":"n","en":"And once home to several notorious pirates. See Jamie L. H. Goodall, Pirates of the Chesapeake Bay: From the Colonial Era to the Oyster Wars (Charleston, SC: The History Press, 2020).","zh":"这里也曾是几个臭名昭著的海盗的老巢。见杰米·L. H. 古德尔（Jamie L. H. Goodall），《切萨皮克湾的海盗：从殖民时代到牡蛎战争》（Pirates of the Chesapeake Bay: From the Colonial Era to the Oyster Wars，南卡罗来纳州查尔斯顿：历史出版社，2020年）。"},{"id":"ch09-005","p":180,"t":"p","en":"Not so for China. Since the 1200s, the various dynasties and republics that have ruled the Middle Kingdom have placed their seat of governmental power in the city that evolved into modern Beijing.² Over time, China's rulers fortified the city, its defensive walls, and its moated innermost compound: the Forbidden City. Until the Chinese civil war in the 1920s, China ruled its Middle Kingdom from this highly defended bastion inside a walled city one hundred miles from the nearest coast.","zh":"中国则不然。自13世纪以来，先后统治这片“中央王国”的各个王朝与共和政权，都把政权的中枢设在那座后来演变为现代北京的城市。² 历代统治者不断加固这座城市、它的城墙，以及城中最内层那座带护城河的宫城——紫禁城。直到20世纪20年代的中国内战之前，中国一直在这座距最近海岸一百英里的城池里，从这座戒备森严的堡垒统治着它的天下。"},{"id":"ch09-006","p":180,"t":"p","en":"When the Communist Party under Mao Zedong completed their \"Long March\" and took Beijing, Mao stood in Tiananmen Square, across the road from the Forbidden Palace, to declare his victory. And although the essence of the Communist Party's movement was to overthrow the power structures of the imperial rulers of China (and the short-tenured republics that succeeded them), as a government it nonetheless installed itself immediately beside the Forbidden City—in the former imperial gardens and lakes, known as Zhongnanhai.³","zh":"毛泽东领导的共产党走完“长征”、夺取北平时，毛泽东站在天安门广场上——与紫禁城隔街相望——宣告胜利。共产党的运动，本质是要推翻中国帝制统治者（以及继之而起、寿命短暂的共和政权）的权力结构；但作为一个政府，它一进城就径直安顿在紫禁城边上——住进了昔日皇家的园林与湖沼，那地方叫中南海。³"},{"id":"ch09-007","p":180,"t":"p","en":"The formal entrance to Zhongnanhai, the Gate of China, is located opposite Tiananmen Square, but rarely used; it is opened only for the most formal and prominent of state visits. Visitors below the status of head of state enter the compound from the rear, off the back wall of the Forbidden City. The whole compound is set along the banks of a series of small lakes in central Beijing-the most proximate of which has the slightly confounding name \"the Middle Sea.\"","zh":"中南海的正门是中华门，正对天安门广场，但很少启用，只有最正式、最隆重的国事访问才打开。地位低于国家元首的访客，要从后面进，绕到紫禁城的北墙外入园。整个院落沿北京中心的一串小湖铺开，其中最靠前的那片湖，名字有点让人犯迷糊，叫作“中海”。"},{"id":"ch09-008","p":180,"t":"p","en":"Entering the compound, visitors are ushered inside to a large reception area. Here, there are several rooms that can be used to greet and entertain visiting ministers, dignitaries, CEOs, and the occasional scholar. Many of these are modern variants on older styles of greeting halls, furnished with cream-white carpets and plush leather armchairs, and with large paintings in the antique style adorning the main wall behind the leaders' seats. An inner room that can seat a maximum of twelve in each delegation is reserved for “private\" talks between the top leaders. Nearby are the official offices of the Party's leadership.","zh":"进了园子，访客被引到一处宽敞的会客厅。这里有好几个房间，用来迎候和款待来访的部长、政要、首席执行官，偶尔还有学者。其中不少是旧式厅堂的现代翻版：米白色地毯，厚实的皮质扶手椅，领导人座位背后的主墙上挂着大幅仿古画作。再往里有一间内室，每方最多可坐十二人，专供最高层领导人“私下”会谈。党的领导机关的办公处就在近旁。"},{"id":"ch09-009","p":180,"t":"p","en":"The most lavish building, reserved for use by the chairman and vice chairman and the other senior-most leaders of the Party, lies in the East Building Compound. It manages at the same time to convey the modern authority of China's central government and to appropriate the long history of the rulers they overthrow. A two-story building in the traditional style, with sloping ceramic tile roofs supported by curved beams and adorned by wood carvings, it was built originally by the Ming Dynasty and restored by the Qings. There are no modern decorations here. Intricately carved wood screens set off the main reception area from the rest of the hall. Wood columns painted in the traditional Chinese red, with vibrant yellows and blues as well, support the ceiling of the main hall. Chinese ancestor paintings are hung on several walls, adding to the sense of history. The only concession to modern style is the row of comfortable chairs made available to modern delegations. Officially known as Ziguang Hall, it also has an older, more redolent name: the Hall of Barbarian Tributes.","zh":"最奢华的一处建筑，专供主席、副主席和党内其他最高层领导人使用，位于东楼院内。它既要传达中国中央政府的现代权威，又要把那些被他们推翻的统治者的悠久历史据为己有。这是一座传统风格的两层建筑，弧形的梁架托起倾斜的琉璃瓦顶，梁上饰有木雕；它最初建于明代，清代曾加以重修。这里没有任何现代装饰。雕工繁复的木屏风把主会客厅与大厅其余部分隔开。木柱漆成传统的中国红，间以鲜亮的黄色和蓝色，撑起正厅的顶棚。几面墙上挂着中国的祖先画像，更添几分历史感。唯一的现代痕迹，是为现代代表团备下的一排舒适座椅。它的正式名称是紫光阁，另有一个更古老、也更耐人寻味的名字：蛮夷朝贡殿。"},{"id":"ch09-010","p":181,"t":"p","en":"To understand the evolution of China's relationship to naval power, it helps to put yourself in the mindset of one of its top leaders, contemplating China's place in the world from the highly secured compound of Zhongnanhai. From the boardwalk that flanks the offices of the most senior leaders of the Chinese Community Party, you look out over the gardens and the Middle Sea lake to the outer walls of the Forbidden City—and it's easy to feel the weight and solidity of one thousand years of continuous Chinese rule from this location.","zh":"要理解中国与海上力量的关系如何演变，不妨设身处地，进入中国某位最高领导人的心境：从中南海这座戒备森严的院落里，思量中国在世界上的位置。站在中共最高领导人办公处一侧的木栈道上，越过园林和中海湖面望去，目光尽头是紫禁城的外墙——站在这处地方，一千年绵延不断的中国统治，其分量与坚实感很容易就能体会得到。"},{"id":"ch09-011","p":181,"t":"p","en":"But as you look farther afield, all is uncertain. You find yourselffrom the 1980s onward—seeking to grow and to develop in a world whose global economic activity is dominated by the United States and its Western allies (all the more so since the end of the Cold War). You are trying to grow in a world in which you have become deeply dependent on the flow of mineral resources and energy resources from overseas and the sale of your manufactured goods to foreign markets. And as you worry about the security of that flow of sea trade, you confront the following, confounding geography.","zh":"但目光放远，一切都不确定。从20世纪80年代起，你所求的是在一个全球经济由美国及其西方盟友主导的世界里实现增长与发展（冷战结束后更是如此）。你要在其中谋求发展的这个世界，已经让你深深依赖海外矿产与能源的输入，依赖把制成品卖到国外市场。而当为这条海上贸易通道的安全忧心时，迎面撞上的是这样一套令人困惑的地理。"},{"id":"ch09-012","p":181,"t":"p","en":"When Chinese leaders journey from Beijing to Shanghai or Guangzhou or the other major Chinese coastal cities, they look out from them not to unbroken waters as the Portuguese, the English, or the Americans do. Rather, like the Germans, they look out to a set of highly constrained passages to the high seas.","zh":"中国领导人从北京去上海、广州或其他沿海大城市时，从那些城市望出去，看到的并不是葡萄牙人、英国人或美国人眼中那片一望无际的水域。他们看到的，是和德国人一样的处境：通往公海的通道只有那么几条，处处受制。"},{"id":"ch09-013","p":181,"t":"p","en":"China's modern economy is organized around three major economic zones. There's Beijing and the area around it, the Bohai Economic Rim, where Tanjin Port serves as Beijing's gateway to the Yellow Sea.4 There's the Yangtze River basin, where Shanghai serves as China's financial, technological, and export hub, and where Shanghai's Yangshan Port complex opens up into the East China Sea. And there's the Pearl River Delta, where Guangzhou (formerly Canton) and Hong Kong anchor China's economic activity in the south, exporting and importing its trade through the South China Sea. But on the other side of those seas are the Korean Peninsula and what China calls the \"first island chain\"- Japan, with its long string of islands from its southern coast almost the whole way to the Taiwan Sea; then Taiwan itself; and then the Philippine archipelago.","zh":"中国的现代经济围绕三大经济区组织起来。一是北京及周边地区，即环渤海经济圈，天津港是北京通往黄海的出海口。⁴ 二是长江流域，上海是中国的金融、技术与出口枢纽，上海的洋山港区由此通向东海。三是珠江三角洲，广州（旧称 Canton）和香港是中国南方经济活动的两大支点，其进出口贸易取道南海。可是在这些海的另一边，是朝鲜半岛，以及中国所说的“第一岛链”——日本，从它的南岸起，一长串岛屿几乎一直延伸到台湾以东的海域；然后是台湾本岛；再往外是菲律宾群岛。"},{"id":"ch09-014","p":182,"t":"p","en":"That peninsula and this string of islands fundamentally constrain Chinese maritime space. All the countries on those islands are American allies, or security partners. And all of them provide bases or basing rights to the US Navy—bringing what China calls \"the powerful enemy\" right to its maritime doorstep.* The resulting sense of constriction has profoundly shaped the evolution of Chinese strategic thinking.","zh":"那座半岛和这串岛屿，从根本上限制着中国的海洋空间。这些岛屿上的国家全是美国的盟友或安全伙伴，而且都为美国海军提供基地或基地使用权——把中国所说的“强敌”请到了自家海域的门口。* 由此生出的受困感，深刻塑造了中国战略思想的演变。"},{"id":"ch09-015","p":182,"t":"p","en":"As China consolidated itself in the 1980s and '90s, it began to have both sufficient confidence and wealth to reorient its security concepts beyond a posture of coastal defense. China's long, northern border with the Soviet Union (the “near enemy\") was more complicated, although its geopolitical rivalry with the USSR would soon ebb, leaving China with more resources to devote to naval activities. Indeed, on its eastern and southern shores, China began to believe that it could halt a potential foreign intrusion at the coastline. And over time, it began to have confidence about defending itself in the Near Seas—and even project its own power farther into those seas.⁵","zh":"20世纪80年代和90年代，中国在巩固自身的同时，开始具备足够的信心和财力，把安全观念从近岸防御的态势向外调整。中国北部与苏联接壤的漫长边界（“近敌”）情况更为复杂，不过它与苏联的地缘竞争很快会消退，从而腾出更多资源投入海上活动。确实，在东部和南部海岸，中国开始相信，它能把可能的外来入侵阻挡在海岸线上。随着时间推移，它有了在近海自卫的信心——甚至能把自身力量投送到更远的海域。⁵"},{"id":"ch09-016","p":182,"t":"p","en":"*Chinese scholars tend not to refer to Singapore as part of this first island chain, but it does bound the South China Sea at its southern end, and also provides the US Navy with the equivalent to basing rights, completing the encirclement of China's Near Seas.","zh":"*中国学者一般不愿把新加坡算进这条第一岛链，但新加坡确实在南海最南端为其划出边界，并且向美国海军提供了等同于基地使用权的便利，从而完成了对中国近海的合围。"},{"id":"ch09-017","p":183,"t":"h","en":"The Enclosing Seas","zh":"被围拢的海洋"},{"id":"ch09-018","p":183,"t":"p","en":"Governments of major powers are big, unwieldy things, shaped by heavy institutions that compete with one another for space and attention—almost as much in authoritarian systems as in democracies. But sometimes an individual can make an outsize difference in these institutions, and to the country's trajectory. One such man was Liu Huaqing, who served from 1982 to 1987 as commander of the Chinese PLAN, and for more than two decades worked from various positions of power to reshape China's naval strategy, leadership, personnel, and organizing concepts.6,*","zh":"大国的政府都是庞大而笨重的机器，由沉重的机构拼成，各机构彼此争夺地盘与注意力——在威权体制里几乎和在民主国家里一样。但有时，一个人能在这样的机构中、在一个国家的走向上，起到远超常人的作用。刘华清就是这样一个人。1982年到1987年，他担任中国人民解放军海军司令员；此后二十多年，他又在多个握有权力的岗位上，重塑了中国的海军战略、领导体系、人员构成与组织理念。⁶,*"},{"id":"ch09-019","p":183,"t":"p","en":"His thinking, perhaps oddly, drew heavily from the scholar who had shaped Roosevelt and the British admirals of the late 1800s—the aforementioned Alfred Thayer Mahan.7","zh":"说来也许有些奇怪，他的思想很大程度上取自那位塑造过罗斯福和19世纪末英国海军将领的学者——前面提到的阿尔弗雷德·塞耶·马汉。⁷"},{"id":"ch09-020","p":183,"t":"p","en":"What Carl von Clausewitz is to ground war, Mahan is to maritime strategy and naval conflict. In his classic text, The Influence of Sea Power Upon History, Mahan spelled out his theory of sea power. Mahan's insight begins with the centrality of geography and the notion that control of key choke points on the global map is indispensable to sea power and trade, and hence ultimately to a seafaring nation's livelihood. He highlights the importance of a network of bases and the ability to sail securely between them, establishing what he calls \"lines of communication\"8—now often referred to in naval parlance as the \"sea-lanes of communication.\"t","zh":"克劳塞维茨之于陆战，正如马汉之于海洋战略与海战。在经典著作《海权对历史的影响》中，马汉系统阐述了他的海权理论。他的洞见始于地理的中心地位：控制世界地图上的关键咽喉要道，对海权与贸易不可或缺，因而最终关乎一个海洋国家的生计。他强调基地网络的重要，强调能够在基地之间安全航行，并由此确立了所谓的“交通线”⁸——如今海军界常称之为“海上交通线”。"},{"id":"ch09-021","p":183,"t":"p","en":"This combination of useful harbors and the conditions of the communication between them constitute, as has been said, the main strategic out-","zh":"如前所述，良港与良港之间交通条件的这种结合，构成了主要的战略"},{"id":"ch09-022","p":183,"t":"p","en":"*He did not do so in isolation. Those not familiar with modern China might assume that because the regime is communist (and now increasingly authoritarian) that it supports no debate about its policy. In fact, China has for years allowed a fairly free-ranging debate about naval strategy within its services, academies, universities, and think tanks.","zh":"*他并非独自完成这一切。不熟悉现代中国的人也许会以为，既然这个政权是共产主义的（如今还日益威权），它就不会容许对其政策有任何争论。事实上，多年来中国一直允许在军中、院校、大学和智库之间，就海军战略展开相当自由的辩论。"},{"id":"ch09-023","p":183,"t":"p","en":"Mahan is also credited with coining the phrase “the global commons\"—the notion of a shared sea, available to all nations; this is a central tenet in modern American naval strategy. (See Michele Flournoy and Shawn Brimley, \"The Contested Commons,\" Proceedings, July 2009, https://www.usni.org/magazines/proceedings/2009/july/con tested-commons.)","zh":"一般认为，“全球公域”一词也是马汉首创，指的是各国共享、向所有国家开放的海洋；这是现代美国海军战略的核心信条之一。（见米歇尔·弗卢努瓦（Michele Flournoy）、肖恩·布里姆利（Shawn Brimley），《争夺中的公域》（“The Contested Commons”），《美国海军学会会刊》（Proceedings），2009年7月，https://www.usni.org/magazines/proceedings/2009/july/contested-commons。）"},{"id":"ch09-024","p":184,"t":"p","en":"lines of the situation. The navy, as the organized force linking the whole together, has been indicated as the principal objective of military effort.9","zh":"轮廓。海军作为把这一切联结起来的组织化力量，始终被视为军事努力的主要目标。⁹"},{"id":"ch09-025","p":184,"t":"p","en":"In short, national power depended on being able to control the key sea-lanes that connected a nation's commerce to overseas trade (the very opposite of China's situation in the 1990s). For Mahan, peacetime commerce was the true path to national prosperity and greatness. \"Military considerations are simply accessory and subordinate to other greater interests.\"io Naval competition, he argued, was a by-product of the efforts meant to generate national wealth and greatness. The purpose of a navy was to secure maritime commerce—in his view, the sine qua non of a nation's wealth and intrinsic power.","zh":"简而言之，国家实力取决于能否控制那些把本国商业与海外贸易连接起来的关键海上通道（这恰与20世纪90年代中国的处境相反）。在马汉看来，和平时期的商业才是通往国家繁荣与强盛的正途。“军事上的考量，只是附属于其他更重大利益的次要事项。”¹⁰ 他认为，海军竞争是谋求国家财富与强盛的努力带来的副产品。海军的使命是保障海上商业——在他看来，这是一国财富与内在实力的必要条件。"},{"id":"ch09-026","p":184,"t":"p","en":"That is not to say that Mahan's strategy wasn't martial, for it certainly was. He highlighted in particular the importance of forward naval stations and fleets and competition among nations for control of key geographical points. What's more, Mahan argued that a powerful nation had to have a string of bases across the geography it sought to protect, each within range of the next, so that its forward bases could be reinforced in times of war from bases within striking distance. It was similar concepts that underpinned much of America's expansion in the Pacific—from the annexation of Hawaii to the acquisition of Wake Island, and then the Marshall Islands, and Guam. These were the stepping-stones across the Pacific to America's ultimate forward naval bases in the Philippines and Japan.11","zh":"这并不是说马汉的战略不尚武——它当然是尚武的。他尤其强调前沿海军基地与舰队的重要，强调各国对关键地理要点的争夺。更进一步，马汉主张，一个强国必须在它想要保护的地域上拥有一连串基地，彼此都在对方的作战半径之内，这样战时前沿基地就能从打击距离内的基地得到增援。美国在太平洋的扩张，很大一部分正是建立在类似构想之上——从吞并夏威夷，到取得威克岛，再到马绍尔群岛和关岛。这些岛屿是横渡太平洋的踏脚石，一路通往美国在菲律宾和日本的最终前沿海军基地。¹¹"},{"id":"ch09-027","p":184,"t":"p","en":"In the US, Mahan's influence had waned in the decades after World War II. The writings of Halford Mackinder posited that “continental power\"—the economic productivity of controlling an industrial heartland—was more important than maritime power.12 This seemed to match the dynamics of competition between two massive land powers—the United States and the Soviet Union. China is a continental power, too, of course, and controls a large industrial heartland. But its growth strategy was dependent on trade, and that meant that it was dependent on the seas. As China's maritime trade grew—and grew ever more central to its overall national economic strength—Mahan's thinking about the relationship between growth and naval power began to shape Chinese naval strategy. 13","zh":"在美国，马汉的影响力在二战后的几十年里逐渐消退。哈尔福德·麦金德的著作提出，“陆权”——控制一个工业心脏地带所带来的经济产出——比海权更为重要。¹² 这似乎与两个庞大陆上强国——美国与苏联——之间的竞争态势相吻合。中国当然也是一个陆权国家，控制着广阔的工业心脏地带。但它的增长战略依赖贸易，而这就意味着它依赖海洋。随着中国海上贸易不断增长——并在其整体国民经济实力中占据越来越核心的位置——马汉关于增长与海军力量之关系的思考，开始塑造中国的海军战略。¹³"},{"id":"ch09-028","p":184,"t":"p","en":"Among the most important concepts that emerged at this time:","zh":"这一时期产生的最重要的构想之一，是这样的："},{"id":"ch09-029","p":185,"t":"p","en":"Chinese planners began to refer to their desire to have a “string of pearls\"—a network of reinforceable bases that they could use to protect their overseas interests. But for China to have a \"string of pearls,\" it had first to be able to mount effective naval operations within the first island chain. And it had to begin by developing a capacity to match the US Navy and its allies in the Near Seas.","zh":"中国的规划者开始提到，他们想要一串“珍珠”——一个可以相互增援的基地网络，用来保护海外利益。但中国要有一串“珍珠”，首先得能在第一岛链之内实施有效的海上行动；而这又必须从发展出在近海与美国海军及其盟友相匹敌的能力开始。"},{"id":"ch09-030","p":185,"t":"p","en":"And so China began to develop its naval muscles. Liu Huaqing laid out a seven-element plan to create a navy capable of defending Chinese interests in the near waters. It involved training of personnel; scientific education; acquisition of ports, logistics, and maintenance capacity; weapons modernization (over a twenty-year timeline); development of a nuclear submarine force; and eventual acquisition of an aircraft carrier.¹4","zh":"于是中国开始锻炼自己的海军肌肉。刘华清提出了一套包含七个方面的规划，要建设一支能够捍卫中国近海利益的海军：人员训练；科学教育；港口、后勤与维修能力的获取；武器装备现代化（周期二十年）；发展核潜艇力量；以及最终获得一艘航空母舰。¹⁴"},{"id":"ch09-031","p":185,"t":"p","en":"At the time, some critics within China dismissed his program as too ambitious. Looking back, it's striking to note that China accomplished every aspect of his program. And in doing so, he enabled China not merely to mount a defense of its coastline, but to project power across the expanse of the Near Seas—together, roughly 2 million square miles of ocean territory.","zh":"当时，中国国内一些批评者认为他的方案过于雄心勃勃，不值一提。回头再看，令人吃惊的是，这个方案的每一个方面中国都实现了。而在此过程中，他使中国不仅能够防守自己的海岸线，还能把力量投送到近海的广阔水域——这些海域加起来约有200万平方英里（约520万平方公里）。"},{"id":"ch09-032","p":185,"t":"p","en":"As it did so, China encountered not only its own geography, but its neighbors.*","zh":"在这一过程中，中国遭遇的不只是自己的地理，还有它的邻国。*"},{"id":"ch09-033","p":185,"t":"h","en":"The Cow's Tongue: China's Expansive Claim","zh":"牛舌线：中国的扩张性主张"},{"id":"ch09-034","p":185,"t":"p","en":"In March 2008, Zhang Zhenhua, a policy planner in China's Ministry of Foreign Affairs, met with staff from the US embassy in Beijing. His purpose: to explain the basis of his country's claim in the South China Sea. He brought with him a printed statement that read: “The dotted line of the South China Sea indicates the sovereignty of China over the islands in the South China Sea since ancient times and demonstrates the long-standing claims and jurisdiction practice over the waters of the South China Sea.\"15","zh":"2008年3月，中国外交部政策规划部门的张振华与美国驻华使馆人员会面。他的目的是说明本国南海主张的依据。他随身带了一份打印的说明，上面写着：“南海断续线表明中国自远古以来对南海诸岛拥有主权，并体现了中国对南海海域长期以来的主张与管辖实践。”¹⁵"},{"id":"ch09-035","p":185,"t":"n","en":"The material that follows concentrates on the areas of largest Chinese deployments over the last decade, namely the South and East China Seas and the Taiwan Strait. Readers will remember that we already encountered the last of the Near Seas, in chapter 2, when we covered sanctions-busting operations in the Yellow Sea, off the North Korean coast. The seventy-thousand-personnel-strong navy of the Republic of Korea (South Korea) is a factor to be reckoned with in those waters, and one that China must deal with as it crafts its Near Seas strategy.","zh":"以下材料集中讨论过去十年中国部署力量最多的区域，即南海、东海和台湾海峡。读者会记得，我们在第2章已经遇到过这几片近海中的最后一片——当时讲的是朝鲜沿海黄海上规避制裁的行动。大韩民国（韩国）那支七万人的海军，是这些水域中不可小觑的力量，也是中国在制定近海战略时必须应对的因素。"},{"id":"ch09-036","p":186,"t":"p","en":"The context was that the following year, 2009, was an important year for maritime issues. Ten years earlier, the UN Convention on the Law of the Sea had been adopted by many governments worldwide and come into force. At that time, the UN set a ten-year deadline for countries to file claims under the law for ownership of maritime territory. The rules allowed for countries to claim a twelve-mile exclusive zone along their continental shelf, and a two-hundred-mile economic zone (where they were granted privileged fishing and energy exploration rights) extending outward from their sea borders. Where states had outlying islands, those same rules would apply, but states had to show that they had meaningful control over those islands. As the clock ticked down toward the deadline for claims, an open question was: How would China portray its claims in the Near Seas?","zh":"背景是：接下来的一年，也就是2009年，对海洋事务而言是重要的一年。十年前，《联合国海洋法公约》已获世界许多国家通过并生效。当时，联合国给各国定下十年期限，要求它们依据该法提出对海洋领土的主张。规则允许各国主张沿大陆架的12海里专属海域，以及从其海界向外延伸的200海里经济区（在该区内享有优先的渔业与能源勘探权）。如果国家拥有离岛，同样的规则也适用，但该国必须证明自己对那些岛屿有实际控制。随着主张期限一天天逼近，一个悬而未决的问题是：中国将如何描述它在近海的主张？"},{"id":"ch09-037","p":186,"t":"p","en":"When China made its claim, America's China watchers were stunned. For the dotted line presented by Zhenhua—quickly circulated from the embassy to Washington—represented the oceanic version of a vast land grab by China. The dotted line depicted on his map has come to be known as the Cow's Tongue, for its shape. It represented a claim of some 1.4 million square miles of ocean.¹⁶ And within that huge expanse, China claimed specific sovereignty over a whole series of rocks, semi-islands, and “land features\" (things too small to count as an island) within the South China Sea.","zh":"中国提出这一主张时，美国的中国观察家们大吃一惊。因为张振华出示的那条断续线——很快从使馆传到了华盛顿——相当于中国在海上的一次大规模圈地。他地图上画出的那条线，因其形状，后来被称为“牛舌”。它主张的海洋面积约140万平方英里。¹⁶ 在这片辽阔海域之内，中国还对南海中一整串岩礁、半岛屿和“地物”（小到不足以算作岛屿的东西）主张具体主权。"},{"id":"ch09-038","p":186,"t":"p","en":"China's vast claim focused on land features in the Paracels, the Spratly Islands, and the Scarborough Shoal. These three features together comprise a kind of lo
