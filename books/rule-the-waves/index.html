he largest port in the world. In 2018, it was the location of over 40 million container drops-an astonishing number when considering that merely a decade earlier, the largest port in the US, Los Angeles, serviced just over 7 million containers. Even in 2018 it serviced only 9.5 million container drops. Yangshan was not only the largest port in the world: it was more than four times larger than its American competitors.","zh":"2017年，上海成为世界第一大港。2018年，这里的集装箱吊装量超过4,000万箱次——要知道，仅仅十年前，美国最大的港口洛杉矶港的吞吐量才刚过700万箱，而即便到了2018年，也只有950万箱次。洋山不仅是世界第一大港，其规模还是美国竞争对手的四倍有余。"},{"id":"ch06-038","p":133,"t":"p","en":"From Yangshan Port, containers now flow to every major economy in the world—150 of them. By 2017, Chinese GDP had grown to fully \\$12 trillion, a more than tenfold growth over that twenty-year period. In the annals of modern economics, it's a story of unparalleled success. By value, the most important trade is to the United States. In 2000, the year of China's entry into the WTO, the largest trading partners to the US were its neighbors, Canada and Mexico, and its ally Japan. No longer. In 2015, China became the largest trading partner of the United States.36","zh":"如今，集装箱从洋山港流向全球每一个主要经济体——足足150个。到2017年，中国国内生产总值已增至整整12万亿美元，二十年间的增幅超过十倍。在现代经济史上，这是一段无可比拟的成功故事。按贸易额计，中国最重要的贸易伙伴是美国。2000年，也就是中国加入世贸组织那一年，美国最大的贸易伙伴是它的邻国加拿大和墨西哥，以及盟友日本。如今已不复如此。2015年，中国成为美国最大的贸易伙伴。36"},{"id":"ch06-039","p":133,"t":"p","en":"Between the scale, the gray, the economic success, the forced displacement, the automation, the sheer engineering domination over the seas and hills, Shanghai and its new port are everything that's admirable and everything that's disturbing about modern China. Like the red star over the Bund, its fundamental contradictions are visible for all to see, its juggernaut scale intimidating by design, and its sophistication, its history, its culture numbed but unsuppressed. Shanghai looks set to be to the coming world what New York was to the golden age of American power-a dominant economic, technological, cultural, and trading giant, for good and for ill.³7","zh":"论规模，论那一片灰，论经济成就，论强制搬迁，论自动化，论对海洋与丘陵那种纯粹的工程征服，上海和它的新港既代表了现代中国一切值得钦佩之处，也代表了一切令人不安之处。就像外滩上空那颗红星，它的根本矛盾人人可见，它那势不可挡的规模是刻意做出来震慑人心的，而它的精致、它的历史、它的文化虽被麻痹，却未被压灭。上海之于未来的世界，看来正像纽约之于美国实力的黄金时代——一个在经济、技术、文化与贸易上都占主导地位的巨人，无论好坏。37"}],"notes":[]},{"id":"ch07","label":"Chapter 7","labelZh":"","title":"Global Supply Ships","titleZh":"第七章　全球供应链上的货轮","part":"Part II: To Contain the World, 1956-2017","showPart":false,"partZh":"第二部","partTitleZh":"围堵世界（1956—2017）","paras":[{"id":"ch07-001","p":134,"t":"p","en":"Old harbors were cauldrons of humanity, bustling centers of labor and commerce, of strife and corruption, pockets of cosmopolitanism where cultures met and clashed and merged. Modern container ports, instead, are industrial operations, all but devoid of humanity-and Yanghsan's fourth bay is literally devoid of people. Yet, a residue of their past vibrancy remains, in the colors and origins of the shipping containers stacked on their shores.","zh":"旧日的港湾是人的大熔炉，是劳工与商业、争斗与贪腐熙熙攘攘的中心，是一块块世界主义的飞地，各种文化在此相遇、碰撞、交融。而现代集装箱港口却是工业作业场，几乎见不到人影——洋山港的第四泊位，更是字面意义上的空无一人。不过，昔日那种生气仍留下一丝残迹，就藏在岸边堆叠的集装箱的颜色与来处里。"},{"id":"ch07-002","p":134,"t":"p","en":"There's the orange from Hapag-Lloyd of Germany; the bright yellow of Italy's Mediterranean Shipping Company; the orange-red of Japan's \"K\" Line; the eponymous color of Taiwan's Evergreen. The bright red of Hyundai and the reddish pinks of Kisac Global, both from Korea. OOCL's containers are red with white logos or the inverse; a plum blossom logo adorns all their boxes (perhaps evoking their early ties to Taiwan's Kuomintang). There's the creamy white of Hamburg Süd and the teal blue of Hanjin, the bright blue of Safmarine out of South Africa and the dark navy blue of Switzerland's CMA CGM. More anonymous containers in gray, brown, rust, and the occasional purple add to the visual effect. The names and logos tell the story of the truly global nature of the shipping trade. And in many ports around the world, the largest number of containers, by far, are light blue with a white sevenpointed star.","zh":"那里有德国赫伯罗特（Hapag-Lloyd）的橙色，意大利地中海航运（MSC）的亮黄，日本「K」线（川崎汽船）的橘红，还有台湾长荣（Evergreen）那种与名字相符的绿色。现代（Hyundai）的鲜红，以及同样出自韩国的基萨克环球（Kisac Global）的浅粉。东方海外（OOCL）的箱子或红底白标，或白底红标，每只箱子上都缀着一朵梅花（或许是在追念它早年与台湾国民党的渊源）。还有汉堡南美（Hamburg Süd）的乳白、韩进（Hanjin）的蓝绿，南非海安（Safmarine）的亮蓝，以及瑞士达飞（CMA CGM）的深藏青。此外还有更多不带标识的箱子，灰色、褐色、铁锈色，偶尔添上一抹紫，让这幅画面更加热闹。这些名字与标志讲述的，是航运贸易真正全球化的本性。而在世界许多港口，数量最多、且遥遥领先的，是那种浅蓝色、印着一颗白色七角星的箱子。"},{"id":"ch07-003","p":134,"t":"p","en":"When Maersk broke into the transatlantic trade in 1936 (just as Shanghai was about to fall into violence and one year before OOCL's predecessor was opening its doors), the company owned thirty-eight ships. Global exports were worth \\$21 billion.¹ In the intervening decades, global trade ballooned, and so did shipping. By 2016, there were over 55,000 merchant ships registered globally, in more than 150 nations, manned by more than 1,500,000 seafarers.² And notwithstanding the pace of the competition, Maersk maintained its position as the largest shipping company in the world. In 2018, Maersk alone employed 88,000 people in 135 different countries and its 794 ships made nearly 90,000 port calls a year—240 per day, or one every six minutes.³ Indeed, Maersk now sails just under one-fifth of all containers shipped worldwide.4 It is effectively a global supply ship to the new world economy.","zh":"1936年，马士基打入跨大西洋航线（其时上海即将陷入战乱，而东方海外前身开门营业还有一年），公司名下拥有38艘船。当时全球出口总额为210亿美元。1 此后几十年间，全球贸易急速膨胀，航运也随之膨胀。到2016年，全世界注册商船超过55,000艘，分属150多个国家，配备船员150多万人。2 尽管竞争如此激烈，马士基仍稳坐世界最大航运公司的位置。2018年，仅马士基一家就在135个国家雇用88,000人，旗下794艘船一年靠港近90,000次——平均每天240次，也就是每6分钟一次。3 事实上，如今全世界海运的集装箱中，由马士基承运的将近五分之一。4 它实质上就是新世界经济的补给舰。"},{"id":"ch07-004","p":135,"t":"p","en":"Maersk ships call on almost 350 ports around the world. But their largest destination by number of containers, by a huge measure: Yangshan Port. This highlights the essential fact that while China has returned to its historic place in the top ranks of world economies, its growth has not (as yet) created a separate economic sphere or a separate Asian-centered hub of economic activity. China has grown to its huge scale within the wider global economy.","zh":"马士基的船挂靠全球近350个港口。但若按集装箱数量计，它最大的目的地遥遥领先：洋山港。这一点凸显出一个根本事实：中国虽已重回世界顶级经济体的历史位置，但它的增长（至少迄今）并未造就一个独立的经济圈，也没有形成以亚洲为中心的独立经济枢纽。中国是在更广阔的全球经济之中，长成今天这个体量的。"},{"id":"ch07-005","p":135,"t":"p","en":"And that in turn leads to another essential point. That containerized shipping didn't just help increase the scale and volume of trade; it transformed its nature. \"Trade\" is now all about the flow of components in a global supply chain—components that sail in mega container ships like the ones operated by Maersk.","zh":"这又引出另一个根本论点：集装箱化航运不只是帮助贸易扩大了规模、增加了总量，它还改变了贸易的性质。今天所谓的「贸易」，讲的全是全球供应链上零部件的流动——那些零部件就装在马士基所运营的这种超大型集装箱船里漂洋过海。"},{"id":"ch07-006","p":135,"t":"h","en":"The Voyage of the Madrid Maersk","zh":"马德里马士基号的航程"},{"id":"ch07-007","p":135,"t":"p","en":"Maersk claimed the top spot in largest container ships in June 1996, with the delivery of the Regina Maersk. It was the first ship in the world to cross the threshold of 6,000 TEU.5,* And in 1997, the shipyards delivered the Sovereign Maersk, which beat the Regina by topping out at 8,000 TEU.6 In 2003, they briefly lost the top slot to OOCL. In 2006, the Emma Maersk took back the record from the OOCL Shenzhen; it was capable of carrying 14,700 TEU.7 In May 2010, the Ebba Maersk set the record at 15,011 TEU.8 And then, in 2011, Maersk ordered the first of its \"Triple-E\" class ships, the Maersk Mc-Kinney Møller, which was delivered on June 14, 2013, with a carrying capacity of 18,000 TEU.9 Within a couple of years, several other companies—CSM, MSC, COSCO—all took delivery of ships in the same TEU range. But Maersk kept the record for the top ship when it took delivery in 2017 of the Madrid Maersk, which became the first ship to break the 20,000 TEU barrier.¹0","zh":"1996年6月，「雷吉娜马士基号」（Regina Maersk）交付，马士基由此夺得世界最大集装箱船的头把交椅。它是全球第一艘跨过6,000标准箱门槛的船。5* 1997年，船厂交付「主权马士基号」（Sovereign Maersk），以8,000标准箱的规模超过了雷吉娜。6 2003年，头名一度被东方海外夺走。2006年，「艾玛马士基号」（Emma Maersk）从「东方海外深圳号」手中夺回纪录，载箱能力达14,700标准箱。7 2010年5月，「埃巴马士基号」（Ebba Maersk）以15,011标准箱刷新纪录。8 随后在2011年，马士基订造了首艘「三E级」船「马士基·麦金尼·穆勒号」（Maersk Mc-Kinney Møller），该船于2013年6月14日交付，载箱量18,000标准箱。9 不过两三年间，中国海运（CSM）、地中海航运（MSC）、中远（COSCO）等数家公司也相继接收了同一量级的船。而马士基把头名一直守到2017年——那年交付的「马德里马士基号」成为第一艘突破20,000标准箱大关的船。10"},{"id":"ch07-008","p":135,"t":"n","en":"When Marc Levinson wrote his landmark study on the economics of containerization, he was awed by the tremendous size to which container ships had then swelled: up to four thousand containers.","zh":"马克·莱文森（Marc Levinson）撰写他那部关于集装箱化经济学的里程碑式著作时，曾为集装箱船膨胀到的惊人规模而惊叹：最多能装4,000只集装箱。"},{"id":"ch07-009","p":136,"t":"p","en":"It lost the top slot in 2018, again to OOCL, which took possession of the OOCL Hong Kong. But Maersk insists that its ship is actually bigger: OOCL measures its carrying capacity under an assumption that each container it is carrying weighs an average of five thousand pounds; Maersk assumes a seven-thousand-pound average container. By this measure, the Madrid is still larger than the Hong Kong.","zh":"2018年，头名再度旁落，仍然是被东方海外夺走——「东方海外香港号」（OOCL Hong Kong）交付。但马士基坚持认为自己的船其实更大：东方海外计算载箱量时，假定每只箱子平均重5,000磅；马士基假定的是7,000磅。按这一标准，「马德里」仍大于「香港」。"},{"id":"ch07-010","p":136,"t":"p","en":"One way or another, the Madrid is a monster of a ship.","zh":"无论如何，「马德里」都是一头庞然巨舰。"},{"id":"ch07-011","p":136,"t":"p","en":"It is so large, in fact, that the brain doesn't quite process the imagery of the ship when it's first sighted offshore. From the base of the dock of Yangshan Port, a ship the size of the Madrid becomes visible a few minutes after it rounds the outer harbor islands, ten miles away. When the Madrid is fully loaded, containers stacked twelve high above its deck, she's an awesome sight; but a confounding one. From that distance, the mild U shape of the hull almost disappears under the scale of the rectangle that sits above it, composed of all the containers above the deck and the upper stories of the hull itself. One of the factors of the post-Suez search for scale in bulk carriers was the use of muchwider-hulled ships. The Madrid takes this to an entirely new level, with a hull that's fully 193 feet wide. Together the wide, deep hull of the ship and the volume of boxes above produce a visual image that doesn't translate in the mind's eye as a ship: it looks more like a large city block of apartment towers or a giant factory, solid and rectangular—but confusingly, moving slowly toward you. If you took an entire city block of back-to-back twelve-story apartment buildings, two buildings deep, and floated them out to sea, the overall bulk of that rectangular block would be slightly smaller than the Madrid. Only as it gets closer does the gentle U of the hull reveal itself, and you can understand that this floating behemoth is actually a ship. The huge volume of global trade, four times the size of the American economy, is evident in the sheer visual scale of the Madrid.","zh":"它大得如此离谱，以至于初次出现在海面上时，人的大脑根本无法处理这幅画面。从洋山港码头根部望去，「马德里」这个体量的船绕过港口外的小岛后，还要再过几分钟才能看清——那里离岸已有十英里。满载时，甲板上的集装箱码到十二层高，那景象令人震撼，也令人困惑。隔着这样的距离，船体那道柔和的U形几乎消失了，被上方巨大的矩形压得看不见——那矩形由甲板上所有集装箱和船体上层建筑构成。苏伊士运河危机之后，散货船为追求规模而做的探索中，有一项就是采用船体宽得多的船型。「马德里」把这一点推到了全新的境地：船体宽达193英尺（约59米）。又宽又深的船体，加上上方成堆的箱体，合起来形成的图像，在脑海中怎么也对不上「船」这个概念：它更像一个由公寓塔楼组成的大街区，或者一座巨型工厂，方正、坚实——却又让人困惑地朝你缓缓移来。若有哪个街区由背靠背的十二层公寓楼构成、进深两排，把它整个浮到海上去，这一整块的体量还略小于「马德里」。只有等它驶近，船体那道柔和的U形才显出轮廓，你才明白这头漂在水上的巨兽原来是一艘船。全球贸易的体量四倍于美国经济，而这一体量，单从「马德里」那纯粹的视觉规模上就一目了然。"},{"id":"ch07-012","p":137,"t":"p","en":"We've become used to thinking of aircraft carriers as the giants of the ocean. The largest aircraft carrier in the world currently under sail is the USS Nimitz, which displaces ninety-seven thousand tons of water when at sea—displacement of water being the main way in which naval ships are compared for scale.1 The Nimitz is indeed a substantial ship. But by contrast, the Madrid is more than twice its size, displacing fully 212,000 short tons of water when fully loaded.1² You could take two of the USS Nimitz, stack them side by side on the Madrid Maersk, and still have room left over for the Empire State Building.","zh":"我们习惯把航空母舰想成海洋上的巨人。目前在海上的世界最大航母是「尼米兹」号（USS Nimitz），出海时排水量97,000吨——排水量正是军舰比较规模的主要方式。1 「尼米兹」号确实是条大船。但相比之下，「马德里」的体量是它的两倍还多，满载时排水量整整212,000短吨。12 你可以把两艘「尼米兹」号并排摞到「马德里马士基号」上，剩下的地方还够再放一座帝国大厦。"},{"id":"ch07-013","p":137,"t":"p","en":"Climb the outer ladder onto the deck of the Madrid and what becomes apparent is that this is not just a ship; it's a floating factory. Containers are typically made of steel, with twenty-by-eight-by-eight-foot or forty-by-eight-by-eight-foot containers stacked on top of each other and held into place by bars separating each column. A typical twentyfoot container (1 TEU) has over 4,000 pounds of steel-so, if the Madrid were full, the containers alone would give her nearly 900 million pounds of steel, or 45,000 tons. As a point of comparison—the Burj Khalifa, the tallest building in the world, used 39,000 tons of steel in its construction.","zh":"顺着外侧的梯子爬上「马德里」的甲板，你立刻会明白：这不只是一艘船，它是一座漂在水上的工厂。集装箱通常用钢制成，20×8×8英尺或40×8×8英尺的箱子层层相叠，列与列之间用立柱隔开、固定。一只普通的20英尺箱（1标准箱）用钢超过4,000磅——所以若「马德里」装满，光箱子就为它添上近9亿磅钢材，即45,000吨。作个比较：世界第一高楼哈利法塔（Burj Khalifa）建造时用钢39,000吨。"},{"id":"ch07-014","p":137,"t":"p","en":"Another way to experience the size of the Madrid is simply to walk the bridge. For a fit person of average height and a speedy gait it takes a full seven minutes and nine hundred paces to circumnavigate the ship's deck, a distance of three thousand feet. This is roughly the same time it takes to walk eight and a half football fields. Or: take the containers off the ship and lay them flat, stacked two high, the way they're carried on a transport train. Most people have had the experience of coming to a stop at a railroad crossing when a freight train is rumbling by at full speed. It can take up to two minutes for a cargo train with one hundred wagons to pass a crossing. But it would take fifty of these trains to carry the same load as the Madrid. Stacked back-to-back, the containers on board the Madrid would run for 411,360 feet, or seventy-eight miles.","zh":"另一种体会「马德里」之大的办法，是干脆沿着船桥走上一圈。一个身材中等、腿脚利索的人，绕船甲板走满一圈要整整七分钟、九百步，距离3,000英尺。这大约相当于走过八个半美式橄榄球场的时间。或者：把船上的箱子卸下来平铺在地，摞成两层，就像货运列车装载的样子。多数人都有过这样的经历：在铁路道口停下来，看一列货车全速隆隆驶过。一列挂100节车厢的货运列车通过道口，最长要两分钟。但「马德里」一船的货，要五十列这样的火车才装得下。若把船上的箱子首尾相接排开，长度是411,360英尺，合78英里（约125公里）。"},{"id":"ch07-015","p":137,"t":"p","en":"But where the sheer enormity and the economic heft of the Madrid fully reveals itself is in the floor of the hold.","zh":"但「马德里」纯粹的庞大与它承载的经济分量，要到货舱底部才彻底显露出来。"},{"id":"ch07-016","p":137,"t":"p","en":"There are two different systems for stacking containers on a ship, above and below decks. Above decks, container ships feature a series of what are known as lashing towers—basically, a system of interlocking metal piping arrayed across the width of the ship and as high up as seven containers stacked one atop the other, to create a steel framework to which the stacked containers can be secured by crisscrossing aluminum poles. Each of these lashing towers is forty-four feet apart from the other, with just enough distance for an able-bodied seaman to operate in the narrow two-foot corridor thus created on either side of a forty-foot container. They're linked by a series of steel gangways and planks, bolted together between metal arches just taller than the height of an average man. Walking across these gangways, the experience is oddly like walking through an industrialized version of a cloister—the covered walkways with their arched ceilings, open on one side, that adorned old monasteries.","zh":"船上码箱有两套系统，甲板之上与甲板之下各一套。甲板之上，集装箱船设有一系列所谓的「绑扎塔」——大体上说，就是用一套彼此咬合的金属管架，横贯船宽排开，高到七层箱位，构成钢制框架，再用交叉的铝杆把堆叠的箱子牢牢固定其上。这些绑扎塔彼此相隔44英尺，留出的距离刚够一名健壮水手在40英尺集装箱两侧形成的两英尺窄道里作业。塔与塔之间由一系列钢制步桥和踏板相连，用螺栓固定在比常人略高的金属拱架之间。走在这些步桥上，感觉奇妙地像是走进一个工业版本的回廊——拱顶、一侧敞开、昔时装点着古老修道院的那种廊道。"},{"id":"ch07-017","p":138,"t":"p","en":"From the lowest level of the lashing towers, an able-bodied seaman can access the second storage system, in the hold. The U-shaped hull design means that, once the cargo floor doors are removed-—an industrial operation in its own right, as each of these bay doors weighs several tons-there's a perfect rectangular shape into which the containers can be placed. Underneath the lashing towers are a series of steel walls that divide the hull into bays, also forty-four feet wide, with guide channels arrayed across their width at 8.8-foot gaps, into which the containers can neatly fit—twelve on top of one another.","zh":"从绑扎塔的最底层，健壮水手可以进入第二套存放系统，也就是货舱内。U形船体设计意味着，舱口盖一旦吊走——这本身就是一项工业作业，每块舱盖都重达数吨——便露出一个完美的矩形空间，正好用来码箱。绑扎塔下方是一道道钢制舱壁，把船体分隔成若干货舱，宽同为44英尺，舱内横贯宽度排着导槽，槽距8.8英尺，集装箱可以严丝合缝地嵌进去——上下可叠十二层。"},{"id":"ch07-018","p":138,"t":"p","en":"To get to the bottom of one of these bays you first walk across the lowest gangway on a lashing tower to its center. From there, you swing yourself out into a porthole and, holding on to the rail, you lower your body into the ladder bay. A steep climb takes you to the first level down, below the hold but still above the waterline. Then the descent continues. Walk fifty feet to the side stair, which angles down at a pitch of sixty degrees, roughly twice as steep as normal stairs. On a ship you always walk forward as you descend, holding tight to the rails. Nine such staircases later, and you've walked down one hundred feet into the depth of the hold. Then you walk out of the arched doorways onto a metal floor—which on the Madrid is painted seafoam green.","zh":"要下到某个货舱的底部，你先沿绑扎塔最下层的步桥走到中央。然后从那里探身钻进一个舷窗，抓着栏杆把身体放下去，落进梯井。一段陡峭的攀爬把你带到下面第一层，那一层已在货舱之下，却仍在吃水线之上。随后还得继续往下。走上五十英尺，到侧面的楼梯，楼梯以六十度倾角向下，约为普通楼梯的两倍陡。在船上，下行时永远要面朝前方，手要抓牢扶手。这样走过九段楼梯，你已向下走了一百英尺，落进货舱深处。然后你从拱形门洞里走出来，踩上金属地板——「马德里」上这块地板漆成海沫绿。"},{"id":"ch07-019","p":138,"t":"p","en":"And from there you crane your neck upward to the very top of the steel hull, the lashing towers and the containers above it. An immense wall of containers, twenty-four high by twenty-four wide, confronts you, twelve of the containers below and twelve above the hold, the top box towering above you at a height of 220 feet. It's just slightly higher than the spire of Canterbury Cathedral—but twenty-five times wider.","zh":"从那里仰头望去，一直看到钢制船体的顶端、绑扎塔以及其上方的集装箱。一堵集装箱的巨墙迎面压来，二十四层高、二十四列宽，舱下十二层，舱上十二层，最上面那只箱子高悬在你头顶220英尺处。这比坎特伯雷大教堂（Canterbury Cathedral）的尖塔还略高一点——却要宽上二十五倍。"},{"id":"ch07-020","p":139,"t":"p","en":"The Madrid, and ships like her, are the juggernauts of modern commerce, cathedrals of globalization.","zh":"「马德里」以及她的同型船，是现代商业的巨兽，是全球化的大教堂。"},{"id":"ch07-021","p":139,"t":"p","en":"Her thousands of containers are not stacked randomly; there's a complex set of calculations that goes into where they are placed on board. The variables include their weight and where they are destined to be unloaded so that containers for a specific port can be concentrated in a single bay, allowing operators at the next port to direct the effort of the cranes that load and unload these containers. But just as important: Are they carrying dangerous goods? For these containers hold not just innocuous items like clothes and TVs. They also contain critical industrial goods, from components for nuclear reactors to explosive chemicals to farm engines to lithium batteries to printer's ink. The goods inside these containers power much of American and European heavy industry.","zh":"她那几千只箱子并非随意堆叠；箱子放在船上哪个位置，要经过一整套复杂的计算。变量包括箱重，也包括它们将在哪里卸下——这样，发往某一特定港口的箱子便能集中在同一个舱区，下一港的操作人员也好据此调度装卸用的吊机。但同样重要的一点是：箱里装的是不是危险品？因为这些箱子里装的可不只是衣服、电视机之类无害的东西。它们还装着关键的工业物资，从核反应堆部件到易爆化学品，从农机发动机到锂电池，再到印刷油墨。这些箱子里的货物，维系着大半个美欧重工业的运转。"},{"id":"ch07-022","p":139,"t":"p","en":"On the Madrid, the job of making sure these containers are stacked safely belongs to a young Polish officer, Chief Officer Marcin Kulas. When the ship arrives in Yangshan to load and unload, the port captain comes on board to discuss the manifests and help certify contents. Marcin sits in front of a computer with a large screen running Lode-Star software, in which the ship's full container stack is arrayed. Dangerous goods are marked red, safe ones marked green. A printout of the loading plan lies on the desk in front of him. It's Marcin's job to make sure he's cross-checked that the containers holding dangerous goods are properly distributed around the ship. The risk here is fire: many of these goods are flammable, and the specific contents require specific firefighting tools or chemicals. Fire in one container can easily start fire in the next, and if the chemical needed to douse the flames in the first isn't the same as what's needed for the second-or worse, can fuel that fire—you have a serious problem. So the distribution of dangerous goods containers is designed to limit the risk of a fire spreading. Officer Marcin pores over the details of this plan, double- and triplechecking the placement of every container. Like every other sailor on board, his first and often only thought is to get off the ship safely. He longs to be back home in Gdańsk with his wife and the son he adores, and the muscle cars that are his real passion in life.","zh":"在「马德里」上，确保这些箱子堆得安全的，是一位年轻的波兰籍大副马尔钦·库拉斯（Marcin Kulas）。船到洋山装卸时，港方船长会登船，核对舱单、协助认证箱内货物。马尔钦坐在大屏幕电脑前，运行Lode-Star软件，全船的集装箱堆放在屏幕上排开。危险品标红，安全品标绿。一份装载计划打印稿摊在他面前的桌上。马尔钦要亲自核对，确保装危险品的箱子在船上分布得当。这里的风险是火：这些货物中有许多易燃，而不同货物需要不同的灭火器材或药剂。一只箱子起火，极易引燃旁边的箱子；若扑灭第一只箱子所需的化学品与扑灭第二只所需的不同——更糟的是，反而会助长火势——那就麻烦大了。所以危险品箱的分布，本就是为了限制火势蔓延的风险。马尔钦大副细细琢磨计划的每一处细节，把每只箱子的位置核对两遍、三遍。和船上每个水手一样，他头一个念头、往往也是唯一的念头，就是平安离船。他盼着回到格但斯克（Gdańsk）的家里，回到妻子和他疼爱的儿子身边，回到他此生真正的挚爱——肌肉车。"},{"id":"ch07-023","p":140,"t":"p","en":"Marcin is but one member of a crew whose backgrounds reflect both the international nature of trade and the history of seafaring nations. He's joined in the Madrid crew by Peter Bodgan Murat, a surly but ultimately charming Russian who serves as the number two engineer on board. There's Peter Paul Handrick, who started his career with Hapag-Lloyd and happily retired from a life at sea to Germany, where he bought and restored an old house—only to see it consumed by fire the next year. He went back to sea for the simple reason that he needed to make money, and found himself aboard a Maersk ship after Hapag-Lloyd was acquired by the Danish company. There's Andrew Hughes, a young trainee engineer from Manchester who started life as a banker but found it so boring that he restarted his education and took a certificate in maritime studies. The able-bodied seamen who crew the ship, from shop floor to construction bay to engine room, hail from older ship-faring nations like India, Thailand, and the Philippines. Their leader is Richard Corporalz, a Filipino from Mindanao island whose thick beard, rolling mustache, and large earrings make him look like he's been planted on board for a film shoot about old-world piracy.","zh":"马尔钦只是船员中的一员，而他们的背景既映出贸易的国际性，也映出航海民族的历史。与他在「马德里」共事的，有彼得·博格丹·穆拉特（Peter Bogdan Murat），一个脾气阴郁、归根到底却很讨人喜欢的俄罗斯人，在船上做二管轮。还有彼得·保罗·汉德里克（Peter Paul Handrick），他出道于赫伯罗特，后来高高兴兴地从海上退休，回到德国买下一栋老房子亲手修缮——结果第二年房子就被火烧了。他重回海上，原因很简单：他需要挣钱；而赫伯罗特被这家丹麦公司收购后，他发现自己上了马士基的船。还有安德鲁·休斯（Andrew Hughes），曼彻斯特来的年轻实习轮机员，起初做银行职员，觉得那行太无聊，于是重新读书，拿下一张航海学证书。船上那些健壮水手——从机舱底层到装配舱，再到轮机舱——多来自印度、泰国、菲律宾这些老牌航海国家。他们的头儿是理查德·科波拉尔兹（Richard Corporalz），菲律宾棉兰老岛（Mindanao）人，一部浓密的络腮胡、两撇卷曲的八字胡，还戴着一对大耳环，看上去像是为了拍一部旧时代海盗电影才被安插到船上来的。"},{"id":"ch07-024","p":140,"t":"p","en":"The job of captaining these men and maneuvering this gargantuan ship through the troubled waters of the East and South China Seas, and later through the tangled Singapore Strait, belongs to Captain Mikkel Jensen, a modern-day Viking if there ever was one, replete with a tattoo of a dragon snaking across his muscular chest. The rest of his arms and torso are covered with the tattoos that sailors get to symbolize specific passages and voyages—an anchor to symbolize first passage across the Atlantic, a rigged ship for passage around the Cape of Good Hope, the dragon actually a marker of first passage to China. He stands five foot seven, with sandy-blond hair cut short, and eschews the formal shirt and long pants of the captain's dress uniform; he prefers khaki shorts and Teva sandals, and a white Maersk polo shirt.","zh":"率领这些人、驾驶这艘庞然大物穿过东海与南海的动荡水域、再穿过新加坡海峡那片纠缠的水道，是船长米克尔·延森（Mikkel Jensen）的职责。他若算不上当代维京人，那就没人算得上了：健壮的胸膛上盘着一条龙。双臂和躯干其余部分布满水手为纪念特定航段与航程而纹的图案——锚，代表首渡大西洋；张帆的船，代表绕好望角航行；那条龙，其实是首航中国的标记。他身高五英尺七英寸（约1.7米），沙金色短发剪得短短的，不穿船长制服那套正式衬衫长裤，偏爱卡其短裤、Teva凉鞋和一件白色马士基Polo衫。"},{"id":"ch07-025","p":140,"t":"p","en":"Captain Jensen was born in 1975 on the Danish island of Funen, where the Shipbuilding Company of 1916 was founded. He first encountered the sea not through his family, but through school. When he was just sixteen, a local ship captain came to talk to his high school class about careers at sea, and his imagination was captured by the oceans.","zh":"延森船长1975年生于丹麦菲英岛（Funen），1916造船公司（Shipbuilding Company of 1916）就创办于此。他与海的初次相遇不是通过家庭，而是通过学校。十六岁那年，一位本地船长来他中学班上讲海上职业，他的想象力就此被大洋攫住了。"},{"id":"ch07-026","p":141,"t":"p","en":"He set sail for the first time in January of 1995 as a ship's cook. He hurt his back in an early accident and decided the job of a cook was not for him. He applied to seaman's school, was rejected by Maersk, but accepted by and trained through the Faroe School of Navigation, where he earned his master's license. He landed a job at Esvast Shipping, sailing standby rescue vessels near the oil rigs in the North Sea—one of the most turbulent and dangerous bodies of water on the planet.¹³ It was extreme training in navigation. He did it for eight months and then applied to Maersk, and this time was accepted into the company, in April 2001. By 2012, at the ripe old age of thirty-six, he had become a captain, and in 2017 was given the command of one of Maersk's three flagship ultra-large container ships.","zh":"1995年1月，他第一次出海，在船上做厨师。早年一次事故中他伤了背，便认定厨师这活儿不适合自己。他报考海员学校，被马士基拒了，却被法罗航海学校（Faroe School of Navigation）录取并加以培养，在那里拿到船长执照。他在埃斯瓦斯特航运（Esvast Shipping）找到一份工作，在北海油田钻井平台附近驾驶待命救援船——那是地球上最狂暴、最危险的水域之一。13 那是极端的航海训练。他干了八个月，然后再次申请马士基，这一回被录用，时在2001年4月。到2012年，他在三十六岁这个「高龄」当上了船长；2017年，他受命指挥马士基三艘旗舰超大型集装箱船之一。"},{"id":"ch07-027","p":141,"t":"p","en":"Captains of these mega-containers are on call around the clock when aboard, so they work in shifts of several weeks at a time before being relieved by a co-captain. This means that they share a cabin, and so can't overly personalize it when aboard. What's more, you can't have anything on a ship that can't be bolted to a wall or closed inside a cabin during rough seas. So in Mikkel's cabin there are only these bare essentials: a picture of his wife, his muscle-building vitamins and supplements, and a Danish flag.","zh":"这类巨型集装箱船的船长在船上要全天候待命，因此一干就是连续数周一个班，再由一位同职船长接替。这意味着他们合住一间舱室，在船上没法把房间弄得太过个人化。何况在船上，任何东西都必须能拴在墙上、或在风浪大时收进柜里。所以米克尔的舱室里只有这几样最基本的东西：一张妻子的照片、他健身用的维生素和补剂，还有一面丹麦国旗。"},{"id":"ch07-028","p":141,"t":"p","en":"To be the captain of the Madrid is to be in charge of an enormously complex floating city of metal, electronics, legal arrangements, crew responsibilities, and up to \\$1 billion worth of cargo. But for Mikkel, first and foremost on his mind are things that seem almost prosaic, given the volume of cargo that he is responsible for delivering. \"At the start of every voyage, I have to think about two basic things first. Do I have enough fuel? And do I have enough food?\"","zh":"做「马德里」的船长，意味着掌管一座极其复杂的漂浮城市——金属、电子设备、法律安排、船员职责，以及价值高达10亿美元的货物。但对米克尔来说，他脑子里最先想到、也最要紧的，却是一些在如此货量面前显得近乎平淡的事。“每次开航，我都得先想两件最基本的事：油够不够？吃的够不够？”"},{"id":"ch07-029","p":141,"t":"p","en":"There's also the simple but enormously important business of checking and double-checking and triple-checking the draft of the ship as it enters and exits the shallow waters of ports, whose clearance can be as little as seven feet below the hull. The precise stacking of the containers shifts the weight of the ship. The weather, tides, the total weight of the cargo, its distribution; all these variables go into a complex calculation as to whether and how the ship can enter and moor at its berth. When leaving port, the captain is laser-focused on these maneuvers, using every modern and old-fashioned navigational aide at his disposal. In some places, it gets enormously complex and fraught to move through the narrow passage of a channel approaching a dock. \"It's a massive challenge; you have a couple of meters on either side, a couple of feet below you. Any mistake and you're going to end up running aground.\"","zh":"还有一件简单却极其重要的事：船进出港口浅水区时，要一遍、两遍、三遍地核对吃水——有些地方船底的富余水深只有七英尺。集装箱的精确堆叠会改变全船的重量分布。天气、潮汐、货物总重及其分布，所有这些变量都要纳入一套复杂计算，判断船能否进港、又该如何进港靠泊。离港时，船长全神贯注于这些操纵，用上他手边一切现代的和老式的导航手段。有些地方，要穿过通往码头的狭窄航道，极其复杂而凶险。“这是巨大的挑战：两侧各剩两米，底下只剩两英尺。一步走错，就得搁浅。”"},{"id":"ch07-030","p":142,"t":"p","en":"The minute Captain Mikkel maneuvers out of the inner harbor and heads out to open waters, his mind turns to his bigger fear.","zh":"米克尔船长刚把船挪出内港、驶向开阔水域，心思就转到他更大的那份恐惧上。"},{"id":"ch07-031","p":142,"t":"p","en":"For smaller ships, storms and the prospect of sinking at sea are an ever-present worry. But the sheer size of the Madrid and ships like her changes the equation. By most accounts, for a wave to sink a ship it has to rise to a height slightly longer than the ship itself. Under some circumstances, a ship that confronts such a wave may not be able to crest it and can be driven down into the hollow that forms underneath monster waves, flipped on its end. Scientists have theorized about the possibility of 190-foot waves, but no wave of that size has ever been reported in real conditions.¹4 The largest wave ever recorded at sea was around 140 feet.¹⁵5 At that height a wave confronting the Madrid would be barely more than a tenth of the length of the ship and pose no threat to its stability.16 A slightly greater concern is for the ship rolling on its beam. The same calculation applies. If a wave is taller than a ship is wide, it can, in theory, turn the vessel on its side as the ship rides up its face. This occurs only in very rare and extreme conditions, but it is conceivable.17 But even there, for the Madrid with its beam of 190 feet, no wave ever reported would be wide enough to roll the boat onto its side. Weather is not the enemy of the mega-container ships.","zh":"对小船来说，风暴和葬身海底的可能，是挥之不去的忧虑。但「马德里」以及同型船的庞大体量，把这道算式改写了。按多数说法，一道浪要想掀翻一条船，浪高得略超过船身长度。在某些情况下，船迎面撞上这样的浪，可能爬不上浪峰，反被压进巨浪底下形成的浪谷，整条船竖起来翻过去。科学家曾推论过190英尺高的浪是否存在，但真实海况中从未有过这种浪高的记录。14 海上实测到的最大浪高约为140英尺。15 这样的高度，对「马德里」来说不过相当于船身长度的十分之一多一点，动摇不了它的稳性。16 稍值得担心的，是船在横浪中的横摇。算法还是一样。如果浪高超过船宽，理论上，船在爬上浪面时就会被掀翻侧躺。这种情况只在极罕见、极端的海况下发生，但并非不可想象。17 可即便如此，「马德里」船宽190英尺，有记录的海浪没有一道高得过这个宽度，翻不动它。天气不是超大型集装箱船的敌人。"},{"id":"ch07-032","p":142,"t":"p","en":"When new crew or passengers board the Madrid, they're handed two keys. The first unlocks their cabin door in the fourteen-story accommodation tower that anchors the front third of the ship.' The second is designed to save their lives. Ships can flounder for a number of reasons. But for a modern container ship, the big fear is not breach or crash; it's fire.","zh":"新船员或乘客一登上「马德里」，就会领到两把钥匙。第一把开的是他们舱室的门，舱室就在船体前三分之一处那座十四层的上层建筑里。* 第二把钥匙，是用来救命的。船失事的原因有很多。但对一艘现代集装箱船而言，最怕的不是船体破口，也不是碰撞，而是火。"},{"id":"ch07-033","p":142,"t":"p","en":"Fire can start because of electrical trouble in the engine, because","zh":"火灾可能起于发动机的电气故障，"},{"id":"ch07-034","p":142,"t":"p","en":"*The placement of the accommodation tower in the front third of the ship was an important innovation of Maersk's Triple-E line ships. When the accommodation tower and bridge are at the rear of the ship, as is traditional, the need to have sight lines from the bridge over the prow of the ship limits the height of container stacks that are possible. By moving the bridge forward, Maersk was able to add three layers of container stacks to its ships.","zh":"*把上层建筑放在船体前三分之一处，是马士基「三E级」船的一项重要创新。按传统做法，上层建筑和驾驶台都在船尾，为了让驾驶台越过船首保持视线，集装箱堆码的高度就受到限制。把驾驶台前移之后，马士基的船得以多堆三层集装箱。"},{"id":"ch07-035","p":143,"t":"p","en":"the oily rags they use to clean the engine can combust when stacked together in their container bins, or because the dangerous cargo in the containers themselves can combust in the heat, which can rise as high as 129 degrees Fahrenheit when sailing through the South China Sea.18 The ship contains innumerable firefighting devices, foams, waters, and other materials designed to put out the fires for the specific kind of chemicals or other accelerants that could be found in the engine or in containers. A complex system of fire alarms runs across the entirety of the ship and through each of the container stacks so that the fire situation can be monitored 24/7 by the captain or his chief officers from the bridge. But in the end, fire is fire and all the preventive measures don't necessarily suffice to stop it from breaking out. And if a fire gets out of control, sometimes the only option the crew has is to abandon ship.","zh":"也可能起于擦机器用的油布——那些油布在箱子里堆在一处就会自燃；还可能是箱内的危险货物受热自燃。航行南海时，箱内温度可高到华氏129度（约54摄氏度）。18 船上配有数不清的消防器材：泡沫、水，以及针对发动机或集装箱内可能出现的各类化学品、助燃物而备的其他灭火材料。一套复杂的火警系统遍布全船，穿进每一列集装箱，船长或大副在驾驶台上就能全天候监控火情。可说到底，火就是火，再多的预防措施也未必挡得住它烧起来。而一旦火势失控，船员有时唯一的选择就是弃船。"},{"id":"ch07-036","p":143,"t":"p","en":"When they do, they use a survival boat made famous in the movie Captain Phillips, which showed the captain escaping the MV Maersk Alabama in the face of a pirate attack. Maersk ships, and many like them, carry rescue crafts that look more like submarines, forged of a single, cylindrical hard plastic shell and painted vibrant orange. These ships are loaded full of safety devices, twelve days' supply of water, and old-school navigation equipment.","zh":"弃船时，他们用的是一种救生艇，因电影《菲利普船长》（Captain Phillips）而闻名——片中船长正是面对海盗袭击，从「马士基·阿拉巴马」号（MV Maersk Alabama）上撤离的。马士基的船，以及许多同类的船，所配备的救生艇看上去更像潜艇：单体圆柱形硬塑料外壳，漆成扎眼的橙色。艇里塞满安全装置、够喝十二天的淡水，还有老式的导航设备。"},{"id":"ch07-037","p":143,"t":"p","en":"But before climbing into the escape craft, the crew do something else. They use the second key to unlock a large chest on the bridge beside the escape vessel that contains both life vests and ultra-modern survival suits. These are cherry-red neoprene suits that weigh almost ten pounds and are extraordinarily cumbersome to climb into. The basic procedure is to lay the suit flat on the deck, lie down beside it, and stuff yourself into it feet-first, the way you would into a sleeping bag. Pull the legs up and secure them around your feet. Make sure that there's no excess air or water in the boots. Then zip the suit up to midriff and, one by one, place your hands in the giant sleeves, working your fingers into the mitts. Then, fumbling through the thick neoprene, pull the hood over your head and zip the rest of the suit up to neck height. Now, encased in two inches of neoprene from head to toe, you can survive for up to twelve hours in 0 degree waters. Only then do you enter the escape vehicle. The hatch is closed, and the first officer pulls a lever inside the ship that releases it from an anchoring crane, and the escape ship descends at high speed along guy wires to sea level, where it's launched into the ocean. It's an intensely cumbersome procedure from start to finish, but Mikkel ensures that every crew member and every passenger is repeatedly drilled through all the necessary safety and evacuation procedures-especially when it comes to fire.","zh":"但在钻进救生艇之前，船员还要做一件事。他们用第二把钥匙打开驾驶台上一只大箱子——就在救生艇旁边——里面装着救生衣和最新式的保温救生服。那是樱桃红色的氯丁橡胶服，重近10磅，穿起来极其笨重。基本步骤是：把救生服平摊在甲板上，在旁边躺下，脚先伸进去，把自己一点点塞进去，像钻睡袋一样。把裤腿提上来，在脚上收紧。确认靴子里没有多余的空气或水。然后把拉链拉到腹部，再一只一只把手伸进那对巨大的袖子，把手指顶进连指手套。接着，隔着厚厚的氯丁橡胶摸索着把兜帽套上头，把剩下的拉链一直拉到脖根。至此，从头到脚裹在两英寸厚的氯丁橡胶里，你就能在0摄氏度的水里撑上十二个小时。做完这些，才可以进救生艇。舱盖关上，大副扳动艇内一根操纵杆，艇便从吊架上脱开，沿着导索高速下坠到海面，冲进水里。整个过程从头到尾笨重至极，但米克尔坚持让每一名船员、每一位乘客反复演练所有必要的安全与撤离程序——尤其是防火。"},{"id":"ch07-038","p":144,"t":"p","en":"On calm days at sea, Mikkel revels in his job. \"My favorite times are when the winds are completely quiet. The waters are still, and you can barely see a ripple. The ocean takes on a glassy quality, like you're sailing across ice. I can see every detail of the ship in the mirrored reflection of the water. For hours I can watch the sea like that, and I never get tired of it.\" Listening to him describe his love of the calm seas brings to mind a passage from Mark Twain's Atlantic travelogue: \"There is nothing like this serenity, this comfort, this peace, this deep contentment to be found anywhere on land. If I had my way I would sail on forever and never go live on the solid ground again.\"19","zh":"海上风平浪静的日子，米克尔对自己的工作如痴如醉。“我最喜欢的就是风完全停下来的时刻。水面纹丝不动，几乎看不见一丝涟漪。大海变得像玻璃一样，好像你正航行在冰面上。水里的倒影能把船上每一处细节照得清清楚楚。我可以这样一连看上几个小时，从不觉得腻。”听他讲对平静海面的这份钟爱，让人想起马克·吐温那部大西洋游记里的一段话：“陆地上找不到这样的宁静、这样的安适、这样的平和、这样深沉的满足。要依我的性子，我就永远在海上漂着，再也不到硬邦邦的陆地上住了。”19"},{"id":"ch07-039","p":144,"t":"p","en":"Much as he thrills to his job, when it's a simple matter of him and the ship and the crew, Mikkel is somewhat nostalgic for an older time in the industry. \"It used to be that when a captain came off the ship, they had to go immediately to see A. P. Møller [the old CEO], to tell him what we'd seen. To tell him of the way things were working on the front lines, how things were going in markets like Nigeria and Saudi Arabia and Brazil. But that was before we had global information. I guess it's not needed anymore. But there was something good about the old ways.\"","zh":"尽管他热爱这份工作，可只要事情单纯是他、船和船员之间的事，米克尔还是有点怀念这个行业的旧日时光。“从前船长一下船，必须马上去见 A.P. 穆勒（老总裁），向他报告我们看到了什么。告诉他前线上事情是怎么运转的，尼日利亚、沙特阿拉伯、巴西这些市场情况如何。可那是在我们有全球信息之前。如今大概是不需要了。但旧日那套做法，自有它的好处。”"},{"id":"ch07-040","p":144,"t":"p","en":"What particularly annoys him is micromanagement from afar. When a loud ping indicates a new email message from headquarters updating the course or causing him to change speeds or slow down or speed up or reroute, he'll break into a loud bout of swearing: “For helvede! (Goddamn it!)\" He bridles against the micromanagement of route planners and technicians more than seven thousand miles away. \"They have no idea what conditions we face, what it means to slow down a ship like this, the price we pay in wasted fuel. They change the times of when we arrive and when we leave on a whim, and everything we plan is blown away!\"","zh":"最叫他恼火的，是被人隔着大老远遥控指挥。一声响亮的提示音响起，表示总部来了新邮件，要他改航向，或者加速、减速、绕道，他就会劈头盖脸骂上一串：“For helvede！”（该死的！）他受不了七千多英里之外的航线计划员和技术人员在那边指手画脚。“他们根本不知道我们面对的是什么海况，不知道让这样一条船减速意味着什么，不知道我们白白烧掉多少油。他们一时兴起就改我们的到港时间和离港时间，我们做的一切计划全泡汤了！”"},{"id":"ch07-041","p":144,"t":"p","en":"He may rail against it, but he can't escape it. Even at night with the lights turned off, the quiet on the bridge is interrupted every few minutes by the high-pitched ping of a signal that a new message has been received. Some of these are dramatic, like a launch of new naval military maneuvers nearby; others are banal in their simplicity-an update from the company on bunkering procedures or new human resources rules. Some of the messages relay weather updates, many of them irrelevant to the ship's actual journey. The most important provide updates from ships passing through the channels ahead, or from port operators, updating plans and conditions on their voyage moving forward. Captain Mikkel may not like it, but this is a reality of modern shipping—the ever-present flow of data.","zh":"他可以骂，却躲不开。哪怕夜里关了灯，驾驶台上的安静每隔几分钟就会被一声尖细的提示音打破——又来了一条消息。有些事关重大，比如附近有新的海军军事演习；有些则简单到乏味——公司发来的加油程序更新，或者新的人力资源规定。有些是气象通报，其中许多与船的实际航程毫不相干。最要紧的，是前方正通过航道的船、或是港口运营商发来的消息，通报各自行程前方的计划与海况。米克尔船长也许不喜欢，但这就是现代航运的现实——数据永不停歇地流动。"},{"id":"ch07-042","p":145,"t":"p","en":"All this data flows to a series of computer terminals and VHF and satellite receivers at the epicenter of the ship, the bridge, two hundred feet above the deck. On a vessel the size of the Madrid, the lateral width of the bridge is simply enormous, over two hundred feet, the same width as the wingspan of a 747, with huge glass-encased wings that span out the entire width of the ship and just beyond, to allow the captain to see either side of the hull as they're maneuvering into port. In front and behind, huge windshield wipers clean each of the sixty windows, keeping them clear from rain and mist.'","zh":"所有这些数据，最终汇到船体正中——甲板上方200英尺处的驾驶台——的一排电脑终端和甚高频、卫星接收机上。在「马德里」这样的船上，驾驶台横向宽得惊人：超过200英尺，与一架波音747的翼展相当；两翼罩着巨大的玻璃，向两侧伸展，覆盖整个船宽还略略超出，好让船长在操船进港时能看见船体两侧。驾驶台前后都装着巨大的雨刷，为六十扇窗一一刮去雨水和雾气。*"},{"id":"ch07-043","p":145,"t":"p","en":"In the middle of the South China Sea, that view could not be more different than the clogged Singapore Strait. The South China Sea is the most important economic sea-lane of commerce in the world, and at midday, midweek, the busiest time for shipping, a 360-degree view from the bridge shows a calm, green-blue sea, flecked with the white foam churned up by the Madrid's bow—and with not a single ship in sight to the east, west, south, or north. For hours on end, the captain takes turns with the first officer, scanning the horizon with binoculars while he keeps a close eye on the radar, but no ships cross the Madrid's path for long parts of the day. So large, so wide, is even this bounded sea that the vastness of the world's oceanic trade shrinks to the size of a single ship surrounded in all directions by empty waters.","zh":"到了南海中部，眼前的景象与拥挤不堪的新加坡海峡判若两个世界。南海是全世界最重要的商业航道，而到了周中的正午、航运最繁忙的时段，从驾驶台环顾360度，只见一片平静的青蓝色海面，点缀着「马德里」船首犁起的白色泡沫——东、西、南、北，一条船也看不见。船长和大副轮流值守，一连几个小时举着望远镜扫视海平线，同时紧盯雷达，可一天里有大半时间，没有一条船横穿「马德里」的航线。即便是这样一片有边有界的海，也大得让世界海运贸易的浩瀚，缩成了一条孤船，四面皆是空荡荡的水。"},{"id":"ch07-044","p":145,"t":"p","en":"At the center of the bridge is the steering console, centered around a small steering wheel, a small joystick, and a throttle, much like those found in an airplane cockpit. The only old-fashioned part of the bridge is a telephone receiver that the captain can use to call specific crew members to the bridge or to sound the general alarm. Immediately in front of the steering console is a screen that shows the propulsion, direction, and drag: this gives the actual position of the ship in the water. It connects to a series of additional screens, which are in turn connected to satellite, email, and VHF, and all come together in what's called the Integrated Bridge System, which gives the captain a rich data picture of the seas around and ahead. That includes a gyrocompass, a depth sounder, a speed log, satellite navigation, radar, and the ECDIS—the Electronic Chart Display and Information System, a one-stop data-gathering system that shows the ship relative to sea features, currents, and surrounding ships. Those ships, and the Madrid, all continuously ping what's known as AIS data. Similar to the black box on airplanes, but more sophisticated, the Automatic Identification System constantly updates with the name, type, heading, and direction of every registered ship on the water—generating hundreds of millions of data points per minute, all computed and calculated and processed back into a real-time image of the sea traffic in front of the bridge.","zh":"驾驶台正中是操舵台，核心是一只小舵轮、一根小操纵杆和一个油门推杆，跟飞机驾驶舱里的东西很像。驾驶台上唯一的老式物件是一部电话听筒，船长可以用它把某个船员叫到驾驶台，或拉响全船警报。操舵台正前方是一块屏幕，显示推进、航向和阻力，也就是船在水中的实际位置。这块屏连着一系列屏幕，那些屏又连着卫星、邮件系统和甚高频，最后合成所谓的「综合驾驶台系统」（Integrated Bridge System），把船周围和前方海况汇成一幅丰富的数据图景。其中包括陀螺罗经、测深仪、计程仪、卫星导航、雷达，以及ECDIS——电子海图显示与信息系统，一套一站式的数据汇集系统，能显示本船相对于海域特征、洋流和周边船舶的位置。那些船和「马德里」一样，都在不停发送所谓的AIS数据。船舶自动识别系统（AIS）类似飞机上的黑匣子，但更精密，它持续更新水面上每一艘登记船舶的名称、类型、航向和方向——每分钟产生数亿个数据点，全部经计算处理，还原成驾驶台前方海上交通的实时图像。"},{"id":"ch07-045","p":145,"t":"n","en":"Captain Jensen is fastidious about cleanliness. During his first tour on the Madrid, he was frustrated by the frequent tracking of dirt onto the wings of the bridge. So he bought a small robotic vacuum cleaner that constantly moves up and down the floors, cleaning as it goes. But at night, it's easy to trip over the small black circular obiect. So now, the vacuum is adorned with a bright pink plastic pig—an incongruous feature on the otherwise pristine lines of the bridge.","zh":"延森船长对整洁近乎苛求。他第一次在「马德里」上值班时，总有人把脏东西带上驾驶台两翼的地板，让他很恼火。于是他买了一只小型扫地机器人，让它在地板上来回跑，边跑边扫。可到了夜里，那只黑色的小圆盘很容易绊人。所以现在，这只扫地机器人头上顶着一只亮粉色的塑料猪——在原本一尘不染的驾驶台上，显得格外突兀。"},{"id":"ch07-046","p":146,"t":"p","en":"This information should be enough but for this fact: most naval ships don't relay their AIS data. They are exempt, as ships don't have to share that data if doing so would undermine their security. And what's more, not all fishing ships have an AIS transponder; they're supposed to, but some don't.2º So the AIS data would ensure that you didn't bump into another container ship or oil tanker, but it wouldn't stop you from bumping into a naval frigate, or running a fishing trawler under your keel.\" So radar is still an essential tool for avoiding hitting ships in the night. This is data-enhanced radar, though: use the embedded mouse to right click on the radar signature of a ship and the screen displays a dotted line showing the ship's direction in time. The captain can see whether he's on course to pass or to intersect, at which point he'll execute a slight course correction. A slight tap on the joystick is all it takes.","zh":"这些信息本该够用了，可有个问题：大多数军舰不发送AIS数据。它们享有豁免——如果共享数据会损害自身安全，船舶就不必共享。更要紧的是，并非所有渔船都装了AIS应答器；按规定该装，有些就是没装。20 所以AIS数据能保证你不撞上另一艘集装箱船或油轮，却挡不住你撞上一艘海军护卫舰，或者让一条拖网渔船从你龙骨底下过。* 因此，雷达仍是防止夜间撞船的必备工具。不过这是经过数据增强的雷达：用内嵌的鼠标右键点一下某艘船的雷达回波，屏幕上就会显示一条虚线，标出该船随时间变化的航向。船长据此判断自己是从它旁边过去，还是会与它相交；若是后者，就稍稍修正一下航向。在操纵杆上轻轻一推就够了。"},{"id":"ch07-047","p":146,"t":"n","en":"The dangers of this were recognized in 2017, when two US Navy ships collided with civilian tankers in the space of nine weeks near Japan and Singapore, respectively. See Robert Faturechi, Megan Rose, and T. Christian Miller, \"Years of Warnings, Then Death and Disaster: How the Navy Failed Its Sailors,\" ProPublica, February 7, 2019.","zh":"这一风险在2017年得到印证：九周之内，两艘美国海军舰艇分别在日本和新加坡附近与民用油轮相撞。见 Robert Faturechi、Megan Rose 与 T. Christian Miller 合撰的《多年警告，终至死亡与灾难：海军如何辜负了它的水兵》，ProPublica，2019年2月7日。"},{"id":"ch07-048","p":147,"t":"p","en":"To be on the safe side, Mikkel also uses an older, more traditional piece of equipment: a pair of binoculars. Walk onto the bridge at any time of day, and a second officer or able-bodied seaman is standing in front of the windows just to the left of the captain, constantly scanning the horizon for ships or their lights, and tracking those positions to confirm that there's no error in the radar or AIS data.","zh":"为稳妥起见，米克尔还用着一件更老、更传统的装备：一副望远镜。一天里任何时候走上驾驶台，都会看见一名二副或一级水手站在窗前、紧挨着船长左侧，不停扫视海平线，寻找船只或船上的灯光，并把位置记下来，与雷达、AIS数据核对，确认没有差错。"},{"id":"ch07-049","p":147,"t":"p","en":"All this data is collected and collated at Maersk's global data management center, in Copenhagen. This center processes millions of pieces of data an hour, 24/7.","zh":"所有这些数据，都汇集到马士基设在哥本哈根的全球数据管理中心。那里每小时处理数百万条数据，全年无休。"},{"id":"ch07-050","p":147,"t":"p","en":"While the big numbers of the Madrid Maersk and the global container trade astound, their impact really lies in the contrast between these great numbers and small ones. The number twenty-three, for example. That is the number of souls, from captain to engineer to crew to cooks, who maneuver this gargantuan ship through its worldwide sail. When Peter Maersk steamed his SS Laura around the Baltic Sea in 1910, his ship could hold a maximum of 165,000 cubic feet of cargo, or the equivalent of 121 TEU. His ship had a crew of twenty-four. So the Madrid represents more than a 17,000 percent gain in the labor efficiency of cargo shipping—and that's before you factor in the huge gains of efficiency in the loading and unloading onto the ships and the transfer to truck and train of the same containers.","zh":"「马德里马士基号」和全球集装箱贸易的那些大数字固然惊人，但它们真正的分量，在于大数字与小数字之间的反差。比如23这个数。那是这条巨轮环球航行时船上的人员总数——从船长、轮机长到普通船员、厨师。1910年，彼得·马士基（Peter Maersk）驾驶他的「劳拉」号（SS Laura）航行波罗的海，那条船最多能装165,000立方英尺货物，合121标准箱，船员24人。也就是说，「马德里」在货运人力效率上提高了17,000%以上——这还没算上货物装卸、以及同一批集装箱转上卡车和火车所带来的巨大效率提升。"},{"id":"ch07-051","p":147,"t":"p","en":"Another small number: six inches by four inches by two inches deep, weighing in at eight pounds. That's the size of a locking clamp, a forged piece of metal engineered and painted yellow with two pull tabs inserted on each side. The locking clamp, as its name suggests, locks together the feet of a container box to the one below or to the lashing tower. For seven containers above the hold, the lashing towers provide a fixed metal structure to which aluminum ties can affix the containers. Above that, it's only the locking clamps that hold them together. For five stories of boxes above the lashing towers, these six-by-four metal clamps are the only thing holding together over \\$1 billion worth of cargo.","zh":"另一个小数字：6英寸×4英寸×2英寸，重8磅。这是一只锁紧器的尺寸。它是锻压金属件，漆成黄色，两侧各插着两个拉环。锁紧器（locking clamp）顾名思义，把一只集装箱的底角件与下面那只箱子、或与绑扎塔锁在一起。货舱以上七层箱子，靠绑扎塔提供固定的金属结构，再用铝制绑扎杆把箱子系住。再往上，就只有锁紧器在把它们连成一体。绑扎塔以上五层箱子，这些6×4英寸的金属卡扣，是唯一把价值超过10亿美元的货物连在一起的东西。"},{"id":"ch07-052","p":147,"t":"p","en":"*And the scale keeps growing. On the bridge of the Madrid, the crew were gossiping about the rumors that someone was going to unveil a 24,000 TEU ship. They were right: in September 2019, MSC sailed a ship carrying 23,736 TEU out of Tainjin, China.","zh":"*规模还在往上走。在「马德里」的驾驶台上，船员们议论纷纷，传说有人要推出24,000标准箱的船。他们没猜错：2019年9月，地中海航运（MSC）从中国天津驶出一条载箱23,736标准箱的船。"},{"id":"ch07-053","p":148,"t":"p","en":"The critical role of the clamp is evident when the ship enters harbor and the crew prepares to unload and load seven thousand containers in the course of twenty-four hours.21 These small metal devices are key—they are what allow the containers to fit securely on cargo trains or in the back of prime movers or transport trucks, which we now see everywhere on our roads and highways. They are what make intermodality—the ability to move seamlessly between modes of transport—a reality. In effect, this tiny metal object is what locks together modern globalization.","zh":"这些小卡扣的关键作用，在船进港、船员准备在24小时之内卸下并装上7,000只集装箱时就看得出来了。21 那些小金属件是枢纽——正是它们让集装箱能稳稳地坐上货运列车，或坐进牵引车、卡车的车厢，也就是如今公路上随处可见的那些车。正是它们让「多式联运」——在不同运输方式之间无缝转换——成为现实。实际上，正是这件小小的金属物件，把现代全球化锁在了一起。"},{"id":"ch07-054","p":148,"t":"h","en":"Beyond Free Trade","zh":"超越自由贸易"},{"id":"ch07-055","p":148,"t":"p","en":"The standard conception of free trade, from Adam Smith and David Ricardo on, is a simple one. A specific country-let's say Portugal—is good at producing a specific product, either because it has a special geography or growing conditions, like those that nurture Portugal's cork oaks, the trees from which cork is harvested and then used to produce its distinctive port wine. Another country, say England, could in theory plant cork oak trees and develop a related industry. But it would be extremely inefficient for it to do so; it doesn't have the right weather or the right soil. What it does have, in abundance, is efficient cloth production. So the more efficient thing is for Portugal to buy cloth from England and England to buy wine from Portugal. Both sides save substantially by doing so and also diversify the products available to their citizens. This kind of specialization and comparative advantage giving rise to trade in agriculture and manufactured goods were the essential ingredients in the earliest forms of trade, and in the large-scale growth in eighteenth- and nineteenth-century trade, from opium to tea to spices to iron ore.22","zh":"从亚当·斯密和大卫·李嘉图以来，自由贸易的标准构想很简单。某个国家——比如说葡萄牙——擅长生产某种产品，或者因为它有独特的地理和生长条件，比如那里滋养了葡萄牙的软木橡树，人们从树上采下软木，再用来酿造它特有的波特酒。另一个国家，比如英国，理论上也能种软木橡树、发展出相关产业。但那样做效率极低：它没有合适的气候，也没有合适的土壤。它真正富余的，是高效的织布业。所以更有效率的做法是：葡萄牙向英国买布，英国向葡萄牙买酒。双方都省下不少，也让自己国民能买到更多样的商品。这种专业化与比较优势所带来的农产品和制成品贸易，是最早的贸易形态、也是18、19世纪贸易大规模增长的基本要素——从鸦片到茶叶，从香料到铁矿石，都是如此。22"},{"id":"ch07-056","p":148,"t":"p","en":"This is still an important part of trade in agricultural goods. The Caribbean has comparative advantage in banana growing, and the Philippines in pineapples. So these countries grow massive quantities of those products and sell them to American and European markets that cannot grow them efficiently (or in some cases at all). And the market for transport in agricultural goods expanded after a further innovation in global container shipping, the refrigerated container (or “reefer,\" as it's somewhat oddly known in the shipping industry). Reefers allow for a huge variety of agricultural goods to be shipped around the world, in all seasons.23","zh":"在农产品贸易中，这一逻辑至今仍然重要。加勒比地区种香蕉有比较优势，菲律宾种菠萝有比较优势。于是这些国家大量种植，卖给无法高效种植（有些地方根本种不了）的美国与欧洲市场。而全球集装箱航运的又一项创新——冷藏集装箱（航运业里管它叫「reefer」，这名字有点古怪）——进一步扩大了农产品运输的市场。冷藏箱让种类繁多的农产品得以不分季节运往世界各地。23"},{"id":"ch07-057","p":149,"t":"p","en":"Maersk was among the early innovators in reefer technology and it's now an important part of their business model. The fact that you can buy fresh bananas (and mangoes and pineapples) in Safeway in the US in December is because Maersk and OOCL and Hapag-Lloyd and others take huge volumes of them from ports in the Caribbean to ports across the United States.24 Bananas are the fourth most valuable food product in the world, after wheat, rice, and milk.25 Writing about the global container trade in 2013, Rose George noted that a single container ship (at that time, the largest of them held 15,000 TEUs) could transport a whopping 746 million bananas on board a single container vessel.26 Now, the largest ship could carry more than 1.2 billion.","zh":"马士基是冷藏箱技术的早期创新者之一，这如今已是它商业模式的重要部分。你12月在美国西夫韦（Safeway）超市能买到新鲜香蕉（还有芒果、菠萝），是因为马士基、东方海外、赫伯罗特等公司把大量香蕉从加勒比各港运往美国各地港口。24 香蕉是世界第四大值钱的食物，排在小麦、大米和牛奶之后。25 罗丝·乔治（Rose George）2013年写全球集装箱贸易时提到，一艘集装箱船（当时最大的一艘能装15,000标准箱）单船就能运走7.46亿只香蕉。26 而如今，最大的船能装12亿只以上。"},{"id":"ch07-058","p":149,"t":"p","en":"But the more important part of the global economy doesn't work like this at all. When it comes to industrialized goods, in fact, the whole concept of “trade\" is outmoded. With containerization and computerization-and the marriage of the two pioneered by C. H. Tung in the 1980s—what happened was actually a fundamental shift in the way we produce manufactured goods the world over.27","zh":"但全球经济中更重要的那部分，根本不是这么运作的。就工业制成品而言，「贸易」这个概念本身已经过时了。有了集装箱化和计算机化——以及董建华（C. H. Tung）在20世纪80年代率先把两者结合起来——真正发生的，是我们生产制成品的方式在世界范围内的一次根本转变。27"},{"id":"ch07-059","p":149,"t":"p","en":"Containerization together with advances in shipping design and computer technology took the concept of “just in time\" production and made it global. Just-in-time manufacturing is an organizational and management theory that has its roots in Japan in the 1960s and '70s that aims to reduce inefficiencies in production systems and to improve the time from supply to delivery. To do this, it relies on producing items just as they are ordered. So, for example, instead of building a red Toyota Corolla and letting it sit in inventory until someone buys it, you wait until someone orders it and then very rapidly assemble it. And if they order a blue one, or one with a sunroof, or one with manual transmission, that's what you build. It's a way of being highly responsive to consumer demand. For this system to work, exact parts and supplies need to be delivered on short notice. The second part of this management philosophy was that it drew an important distinction between firms that built parts of goods and firms that assembled them into a finished product—it took specialization and moved it further up the production chain. This system was developed largely by Japanese firms for their domestic production. But with the combination of containerization and computerization, it was possible to take that model and make it global.28 And now much of what is manufactured is produced as part of a global just-in-time process that connects the US Midwest with Stuttgart, Germany, and Hanoi, Vietnam-and above all, China.","zh":"集装箱化，加上船舶设计和计算机技术的进步，把「准时制」生产的理念推向了全球。准时制生产是一套组织与管理理论，20世纪60、70年代发源于日本，目标是减少生产系统中的低效环节、缩短从供货到交付的时间。为此，它依赖「按单生产」：比如，不是先造好一辆红色丰田卡罗拉、放进库存等谁来买，而是等到有人下了订单，再迅速组装起来；对方要蓝色，要带天窗，要手动挡，那就照单去做。这是一种对消费者需求高度敏感的运作方式。这套系统要运转，零部件和物料必须在接到通知后短时间内送到。这一管理哲学还有另一层：它把「制造零件」的企业和「组装成品」的企业明确区分开来——把专业化分工进一步推到了产业链上游。这套系统主要是日本企业为本土生产而发展出来的。但集装箱化与计算机化结合之后，就有可能把这个模型推向全球。28 如今，大量制成品都是在一条全球性的准时制流程中生产出来的，这条流程把美国中西部与德国斯图加特、越南河内连在一起——尤其是与中国连在一起。"},{"id":"ch07-060","p":150,"t":"p","en":"You can see this dynamic in the cargo manifests and sailing routes of the world's great shipping companies: CSM, Safmarine, Evergreen, and of course OOCL and Maersk. The Maersk routes connect the world's manufacturing powerhouses in Asia and Africa to big consumer states in the West. Shanghai is its largest destination, by number of containers and by value of what's in them. And from there many head due east to Los Angeles and Long Beach, the twin hubs of the LA-area port. Or to Tacoma and Seattle, twin hubs of trade in the Northwest. But more of them sail south, through the East China Sea and the troubled waters of the Taiwan Strait, and into the world's most important waterway, the South China Sea.29 From there to the choked Singapore Strait and the dangerous Malacca Strait. And then across the vastness of the Indian Ocean, past the island of Perim and up the Red Sea to Suez. From there, they sail across the Mediterranean on to the ports of Rotterdam and Felixstowe, or on to routes across the Americas. The most profitable trip goes from Shanghai all the way to the East Coast of the United States—New York, Boston, and Charleston. This constant flow of containers feeds the European and American markets with a steady flow of manufacturing inputs, as well as assembled goods—part of the worldwide network of production that economists call the \"global supply chain.\"","zh":"从世界各大航运公司的载货清单和航线上，就能看到这股力量：CSM、萨非海运（Safmarine）、长荣海运（Evergreen），当然还有东方海外和马士基。马士基的航线把亚洲和非洲的制造业重镇与西方的大消费国连在一起。按集装箱数量计，也按箱内货物价值计，上海都是它最大的目的地。从上海出发，许多船向东直奔洛杉矶和长滩——洛杉矶地区港口群的两大枢纽；或者去塔科马和西雅图——西北部贸易的两大枢纽。但更多的船向南，穿过东海，穿过台湾海峡这片多事的水域，进入世界上最重要的一条水道——南海。29 再往前，是拥堵的新加坡海峡和危险的马六甲海峡。然后横渡浩瀚的印度洋，经过丕林岛，沿红海北上到苏伊士。从那里穿过地中海，驶往鹿特丹和费利克斯托，或者转入横跨美洲的航线。利润最高的航程，是从上海一路开到美国东海岸——纽约、波士顿、查尔斯顿。这条川流不息的集装箱之河，把制成品和源源不断的生产投入送进欧美市场——这就是经济学家所说的「全球供应链」，一张覆盖全球的生产网络。"},{"id":"ch07-061","p":150,"t":"p","en":"A lot of what America consumes today is produced this way. Take the iPhone—the signature product of America's most valuable company. This is an American-designed product, to be sure, and American owned; but there's very little about it that's American made. Its accelerometer (used to measure movement) is supplied by the German company Bosch, but manufactured in their plants in China, Korea, Japan, and Taiwan. The audio chip comes from Cirrus Logic, an American firm-that manufactures its components in the UK, China, Korea, Japan, and Singapore. The battery is made by Korea's Samsung in plants in more than eighty countries worldwide. The camera: Qualcomm, which is based in the US, but manufactured in Brazil, Australia, Indonesia, India, and East Asia. The gyroscope comes from Switzerland, the flash memory from Japan, the touchscreen controller from Israel, Greece, the Netherlands, Belgium, or France, the Wi-Fi chip from some of the countries already mentioned or Mexico, Canada, Thailand, Malaysia, the Philippines, Germany, Hungary, France, Italy, or Finland. The iconic glass screen is designed by an established American firm, Corning—but manufactured in plants in Australia, Belgium, Brazil, China, Denmark, France, Germany, Hong Kong, India, Israel, Japan, Korea, Malaysia, Mexico, the Philippines, Poland, Russia, Singapore, South Africa, Spain, Taiwan, the Netherlands, Turkey, the UK, and the United Arab Emirates.30 Overall, any given iPhone may have parts manufactured in more than thirty countries in Asia, Europe, Latin America, and the Middle East. And almost every component is transported by ship at some point along the production voyage.","zh":"今天美国人消费的很多东西，都是这样生产出来的。就说iPhone——美国市值最高那家公司的招牌产品。这无疑是美国设计、美国拥有的产品，但它身上「美国制造」的成分少得可怜。它的加速度计（用来测量运动）由德国博世公司供货，却产自博世在中国、韩国、日本和中国台湾的工厂。音频芯片来自美国公司凌云逻辑（Cirrus Logic），其元件在英国、中国、韩国、日本和新加坡制造。电池由韩国三星制造，工厂分布在全球八十多个国家。摄像头：高通，总部在美国，产地在巴西、澳大利亚、印度尼西亚、印度和东亚。陀螺仪来自瑞士，闪存来自日本，触摸屏控制器来自以色列、希腊、荷兰、比利时或法国，Wi-Fi芯片来自前面提到的若干国家，或者墨西哥、加拿大、泰国、马来西亚、菲律宾、德国、匈牙利、法国、意大利、芬兰。那块标志性的玻璃屏幕由美国老牌企业康宁（Corning）设计，却在澳大利亚、比利时、巴西、中国、丹麦、法国、德国、中国香港、印度、以色列、日本、韩国、马来西亚、墨西哥、菲律宾、波兰、俄罗斯、新加坡、南非、西班牙、中国台湾、荷兰、土耳其、英国和阿联酋的工厂里生产。30 总的算下来，任何一部iPhone的零件都可能产自亚洲、欧洲、拉美和中东的三十多个国家。而几乎每一个部件，在生产旅程的某个环节上都要经过海运。"},{"id":"ch07-062","p":151,"t":"p","en":"Similar patterns are reflected even in simple products. Think of Nutella. Imported from Italy, right? Yes, but produced with sugar from Brazil, India, Mexico, and Australia; palm oil from Indonesia and Malaysia; hazelnuts from Turkey, Argentina, Georgia, South Africa, Australia, or Serbia; cocoa from Côte d'Ivoire, Nigeria, and Ghana; lecithin from Brazil, India, and Italy; and vanillin, a synthetic version of vanilla, from China. (The milk is relatively local; it comes from Switzerland.)³¹ And those ingredients are put together in many different regionsfive factories in Europe, one in Russia, one in North America, two in South America, and one in Australia as of 2012. So, a jar of Nutella requires imports from at least eleven countries and is distributed to some seventy-five countries for sale.32,*","zh":"类似的图景，在不起眼的产品上也一样。比如能多益（Nutella）巧克力酱。意大利进口的，对吧？没错，可它的糖来自巴西、印度、墨西哥和澳大利亚；棕榈油来自印度尼西亚和马来西亚；榛子来自土耳其、阿根廷、格鲁吉亚、南非、澳大利亚或塞尔维亚；可可来自科特迪瓦、尼日利亚和加纳；卵磷脂来自巴西、印度和意大利；香兰素——香草的人工合成替代品——来自中国。（牛奶算是相对本地的，来自瑞士。）31 这些原料在好几个不同地区汇合加工——截至2012年，欧洲有5家工厂，俄罗斯1家，北美1家，南美2家，澳大利亚1家。所以，一罐能多益至少要用到11个国家的进口原料，再分销到约75个国家销售。32*"},{"id":"ch07-063","p":151,"t":"p","en":"All of this is made possible by high-volume, low-cost container shipping, which for economic purposes all but erases the comparative advantage of geography. In the past, shipping costs were a significant barrier to a producer in England competing with a producer in Pittsburgh for the Massachusetts market—but now the cost of shipping by container from Manchester to Boston is so small that it's easily competitive with the cost of trucking it across two states. And the same is true for a low-cost manufacturer in Malaysia, or Thailand, or Brazil. The Gap, a ubiquitous retailer, likes to emphasize its American identity in its advertisements and promotional efforts; the New York Times described it as being “as American as Mickey Mouse.\"33 In fact, Gap and Old Navy clothes are designed in San Francisco but manufactured in Southeast Asia—primarily in India, Vietnam, Cambodia, and Bangladesh, using Vietnamese and Laotian cotton—and then sent worldwide for consumption, in ever-larger container ships.34","zh":"这一切之所以可能，靠的是大批量、低成本的集装箱航运——就经济意义而言，它几乎抹平了地理带来的比较优势。过去，运输成本是一道高高的门槛：英格兰的厂商要跟匹兹堡的厂商争夺马萨诸塞市场，很难占上风。如今，从曼彻斯特用集装箱运到波士顿，运费之低，足以轻松压倒用卡车横穿两个州的成本。对马来西亚、泰国或巴西的低成本制造商来说，情况同样如此。无处不在的零售商盖璞（Gap）喜欢在广告和宣传中强调自己的美国身份；《纽约时报》说它「像米老鼠一样美国」。33 事实上，Gap和老海军（Old Navy）的服装在旧金山设计，却在东南亚制造——主要是印度、越南、柬埔寨和孟加拉国，用的是越南和老挝的棉花——然后装上越来越大的集装箱船，运往世界各地消费。34"},{"id":"ch07-064","p":151,"t":"n","en":"Sometimes this dynamic reaches absurd levels. A common Norwegian food is salmon. It's caught locally; but before you can purchase your meal in a Norwegian supermarket, a large amount of Norwegian salmon is frozen, shipped to China, fileted in factories there, and shipped back to Norway via Singapore or Tanjung Pelepas for consumer consumption. (It helps explain one of the strangest sights of contemporary globalization: ATMs dispensing filets of Norwegian salmon in shopping malls and hotel lobbies across Singapore.)","zh":"这种逻辑有时会走到荒诞的地步。三文鱼是挪威的日常食物，本是本地捕捞的；可你在挪威超市买到它之前，大量挪威三文鱼先被冷冻、运到中国、在中国工厂里切片，再经新加坡或丹戎帕拉帕斯港运回挪威供人食用。（这也解释了当代全球化最离奇的一幕：新加坡各地商场和酒店大堂的自动取款机里，吐出的是挪威三文鱼柳。）"},{"id":"ch07-065","p":152,"t":"p","en":"The sheer volume of what is imported this way is staggering. In 2018, the port of Los Angeles alone imported 579,405 TEUs of furniture; 373,934 TEUs of auto parts; 354,578 of clothing; 233,157 of footwear; and 218,554 of electronics.3⁵ That's only 18.5 percent of the total TEUs imported just into Los Angeles in a single year. But even those 1.7 million boxes carry an astonishing quantity of goods when you realize that a single forty-foot container can carry: two cars; 60 refrigerators; 200 mattresses; 400 flat-screen TVs; 1,500 cases of Coke; 4,000 boxes of shoes; 7,800 reams of paper; or 9,600 bottles of wine.36","zh":"这样进口的货物，数量之大令人咋舌。2018年，仅洛杉矶一港就进口了579,405标准箱的家具、373,934标准箱的汽车零部件、354,578标准箱的服装、233,157标准箱的鞋类、218,554标准箱的电子产品。35 而这还只占当年洛杉矶进口标准箱总量的18.5%。可即便只是这170万个箱子，其装载的货物也足以让人瞠目：一个40英尺集装箱，能装下两辆汽车；60台冰箱；200张床垫；400台平板电视；1,500箱可乐；4,000双鞋；7,800令纸；或者9,600瓶葡萄酒。36"},{"id":"ch07-066","p":152,"t":"p","en":"Thus is much of what is consumed in the United States reliant on a constant flow of containers into the American market. Whether it ends up scanned through the Central Examination Station in Elizabeth, New Jersey, or in one of the other major port complexes that dominate American trade, American consumption often starts with containerized flows. And this has transformed the American economy because the container revolution has all but erased shipping costs as a factor in modern production. In the words of Marc Levinson: \"Shipping costs no longer sheltered producers whose advantage was proximity to the customer. Even with customs duties and time delays, factories in Malaysia could deliver blouses to Macy's in Herald Square more cheaply than blouse manufacturers in the heart of New York's garment district.\"37 And so US manufacturing, with its relatively high labor costs, started losing out to low-cost manufacturers in Asia, Africa, and Latin America, as containerization enabled those countries to sell their products into the American market. And with this development went manufacturing jobs—roughly 2.4 million of them.38","zh":"于是，美国人消费的许多东西，都依赖于集装箱源源不断地流入美国市场。这些箱子最后或是在新泽西州伊丽莎白的中央查验站过机查验，或是进入其他几个主导美国贸易的大型港口群；不管走哪条路，美国的消费往往都始于集装箱的流动。这改变了美国经济，因为集装箱革命几乎消除了运输成本这一现代生产的变量。用马克·莱文森（Marc Levinson）的话说：“运输成本不再庇护那些靠贴近客户取胜的生产者。即便算上关税和延误，马来西亚的工厂把女式衬衫送到先驱广场梅西百货，也比纽约服装区腹地的衬衫厂商更便宜。”37 于是，劳动力成本相对高昂的美国制造业，开始败给亚洲、非洲和拉丁美洲的低成本制造商——集装箱化让这些国家得以把产品卖进美国市场。随之而去的，是制造业的岗位，大约240万个。38"},{"id":"ch07-067","p":153,"t":"p","en":"Containerization was a key ingredient in the Western economic boom of the 1970s and '80s, but by the 1990s and 2000s it was also a key driver in the deindustrialization of the American economy. Look at a container traveling on a train through the center of town or on a prime mover driving down Interstate 95 and you're seeing a manufacturing job that's gone to Asia, the hollowing out of western Pennsylvania and eastern Ohio, the decimation of the steel and auto industries of the northeast. This loss of manufacturing jobs in the United States is increasingly blamed on China's entry into the World Trade Organization, which was certainly a key factor, but China—and Vietnam and Malaysia and Taiwan and India—couldn't have absorbed US manufacturing jobs were it not for the connective tissue of the global supply ships that flow low-cost manufactured goods at low transportation cost into the American economy.39","zh":"集装箱化是20世纪70、80年代西方经济繁荣的关键要素；但到了90年代和21世纪，它也成了美国经济去工业化的关键推手。看着一只集装箱被火车载着穿过市中心，或被牵引车拖着驶上95号州际公路，你看到的就是一个流向亚洲的制造业岗位，是宾夕法尼亚西部和俄亥俄东部的空心化，是东北部钢铁和汽车工业的凋零。美国制造业岗位的流失，越来越多人归咎于中国加入世界贸易组织——这当然是一个关键因素；但若无全球货运船这张连接组织，以低廉的运输成本把廉价制成品送进美国经济，中国——以及越南、马来西亚、中国台湾和印度——也不可能吸收美国的制造业岗位。39"},{"id":"ch07-068","p":153,"t":"p","en":"This fact reveals the broader consequence for the United States of the containerization and shipping revolution, the worldwide spread of globalization, and the emergence of a global supply chain. But every one of those ships and every one of those containers has been accompanied by a very different kind of value proposition for the US economy, and specifically the financial firms that ring the New York harbor: nearly 90 percent of that flow in goods is traded in US dollars.4º When China sells farm engines to India, when India sells cotton to Brazil when Brazil sells soybeans to Germany, when Germany sells car parts to Russia, when Russia sells steel to the United States—all these goods are shipped around the world on container or bulk cargo ships, and all of them are paid for in US dollars. And as those countries grow, so do their global investments—much of which occurs in US dollars. Every single one of those dollars is processed by American financial firms, and roughly 70 percent of them are tracked by American accounting firms. And these American firms generate huge profits.","zh":"这一事实，揭示了集装箱化与航运革命、全球化的世界性扩散以及全球供应链的兴起，给美国带来的更深一层后果。但每一艘这样的船、每一只这样的箱子，同时也给美国经济带来了另一种完全不同的价值主张——尤其是环绕纽约港的那些金融公司：这股货物洪流中，近90%是以美元结算的。40 中国把农机卖给印度，印度把棉花卖给巴西，巴西把大豆卖给德国，德国把汽车零件卖给俄罗斯，俄罗斯把钢材卖给美国——所有这些货物都装在集装箱船或散货船上漂洋过海，而所有这些交易都用美元支付。这些国家越发展，它们的全球投资也越多——其中很大一部分同样以美元进行。每一块这样的美元，都要经美国金融公司之手处理；其中约70%由美国会计公司记账。这些美国公司赚得盆满钵满。"},{"id":"ch07-069","p":153,"t":"p","en":"What this highlights is that containerization has helped drive deep change in the American economy. In the 1930s, global trade was a fractional part of US economic activity. In the 1960s, the same was true. By the 1980s, the US economy was roughly 10 percent driven by global trade; an important change, but still a small amount by the standards of global economies. But fast-forward to 2015, and now fully 30 percent of the US economy is driven by the flow of global trade and the investment and services that it generates.41 In the words of President George W. Bush's undersecretary for policy at the US Department of Transportation: \"The U.S. intermodal freight system—now seamlessly integrated into the global supply chain—underpins the nation's economic growth and prosperity.\"","zh":"这凸显出一点：集装箱化推动了美国经济的深刻变化。20世纪30年代，全球贸易只占美国经济活动的一小部分。60年代依然如此。到80年代，美国经济约有10%由全球贸易驱动——这是重要的变化，但按全球各经济体的标准衡量，仍不算多。而快进到2015年，美国经济已有整整30%由全球贸易的流动、以及由此产生的投资和服务驱动。41 用乔治·W. 布什政府交通部主管政策的副部长的话说：“美国的联运货运体系——如今已无缝嵌入全球供应链——支撑着国家的经济增长与繁荣。”"},{"id":"ch07-070","p":154,"t":"p","en":"This is a critical part of a wider reality, which is that economic growth worldwide-whether it is recorded in China, India, Russia, Vietnam, Brazil, or elsewhere-has been matched by growth in American jobs in financing, accounting, logistics management, marketing, and design; collectively, the service industry. These are high-paying, high-education jobs. Against the 2.4 million manufacturing jobs lost to low-cost manufacturing in China and the rest of Asia, service jobs were created by the same phenomenon—just over 7 million of them.43","zh":"这只是更大图景的一部分，而这一点至关重要：世界各地的经济增长——无论记在中国、印度、俄罗斯、越南、巴西还是别处的账上——都伴随着美国在金融、会计、物流管理、市场营销和设计等领域岗位的增长；这些统称服务业。它们是高薪、高学历的岗位。与中国和亚洲其他地区低成本制造业夺走的240万个制造业岗位相对，同一现象也创造了服务业岗位——略多于700万个。43"},{"id":"ch07-071","p":154,"t":"p","en":"Watch a container move from rail to truck to ship and you may be watching the hollowing out of American manufacturing, but you're also watching the expansion of the American service sector, the creation of jobs in accounting, and huge net profits to the American economy. In 1947, American financial firms accounted for 10 percent of the profits recorded in the non-farm sectors of the American economy. Now, after seven decades of expanding trade, they account for fully 50 percent of the non-farm profits in the American economy.44,*","zh":"看着一只集装箱从铁路转到卡车、再转到船上，你看到的也许是美国制造业的空心化；但你同时看到的，是美国服务业的扩张、会计岗位的创造，以及美国经济的巨额净收益。1947年，美国金融公司占了美国经济非农部门利润的10%。经过70年贸易扩张，如今它们占了美国经济非农利润的整整50%。44*"},{"id":"ch07-072","p":154,"t":"p","en":"But-and the importance of this cannot be understated-those profits are enjoyed by a decreasingly small proportion of the American population. That is to say, globalized trade and investment and the accompanying financialization are a key driver of the growing inequality of the American economy. And that's creating tensions pushing back against globalization.","zh":"但是——这一点怎么强调都不过分——这些利润越来越集中于美国人口中一个不断缩小的部分。也就是说，全球化的贸易与投资、以及随之而来的金融化，是美国经济不平等加剧的关键推手。而这正在积聚张力，反过来冲击全球化。"},{"id":"ch07-073","p":154,"t":"p","en":"This financialization of the American economy, and the huge weight and power it gives to people who work within the two-mile radius of the Port of New York—and the Port of Seattle, the Port of Houston, the Port of Los Angeles—has torqued the politics of the United States. The consolidation of wealth and power of the major cities, and the financial class, versus the hollowing out of the American heartland, was a factor behind the global financial crisis, the lack of accountability from that crisis, and the rise of populist anger in America's rust belt and inland states.4⁵ It fed into the election of Donald Trump, the popularity of Bernie Sanders, the January 6, 2021, riot in Washington, DC, and the erosion of political support for America's expansive role in the world.46","zh":"美国经济的这种金融化，以及它赋予纽约港两英里半径内那些人的巨大权重和权力——西雅图港、休斯敦港、洛杉矶港也一样——已经扭曲了美国的政治。大城市与金融阶层财富和权力的集中，对照美国腹地的空心化，是全球金融危机、危机之后无人担责、以及锈带和内陆各州民粹怒火兴起的背后因素之一。45 它助推了唐纳德·特朗普的当选、伯尼·桑德斯的走红、2021年1月6日华盛顿特区的骚乱，以及美国在世界舞台上广泛角色的政治支持被一点点侵蚀。46"},{"id":"ch07-074","p":154,"t":"n","en":"Economists refer to this development as the “financialization\"” of the American economy.","zh":"经济学家把这一发展称为美国经济的「金融化」。"},{"id":"ch07-075","p":155,"t":"p","en":"After his 2016 election, President Trump was often seen carrying a map of his victory. It showed an enormous sea of red across the entire country, with a scattered set of small blue dots along the coast (and occasionally inland). Turn the map into 3-D, though, so that it reflects population concentration, and a very different picture emerges. There's Republican red across much of the country where it's largely flat, but in the forty or so places that spike up indicating large populations, the vast majority of them are Democratic blue.47 Cities now account for 84 percent of the GDP of the United States, and the difference between urban and rural in both politics and economics is a major feature of modern-day America.48 And the largest of these cities are closely linked to sea-based trade.","zh":"2016年当选之后，特朗普总统常被人看到随身带着一张他的胜选地图。图上整个国家是一片红色的海洋，沿海（偶尔也向内陆）散落着一些蓝色的小点。可要是把这张图做成三维的、让它反映人口密度，呈现出来的就是另一幅图景：大片地势平坦的地方是共和党的红，而在四十来个因人口密集而高高隆起的点上，绝大多数是民主党的蓝。47 如今城市占美国GDP的84%，城乡在政治和经济上的分野，是当代美国的一大特征。48 而这些城市中最大的几座，都与海运贸易紧密相连。"},{"id":"ch07-076","p":155,"t":"p","en":"Meanwhile, America's key role in global finance and the growing spread of global trade has created a key imbalance: one that pits globalized economics against America's international security roles. Why? If containerization, globalization, and financialization opened up an economic and political imbalance within the United States, it also created a second imbalance between the role that the US Navy plays in securing the flow of trade (and energy) across the world's oceans, and who profits from it.","zh":"与此同时，美国在全球金融中的关键角色，以及全球贸易的不断扩展，造成了一种关键的失衡：它让全球化的经济与美国的国际安全角色彼此对立。为什么？如果说集装箱化、全球化和金融化在美国内部撬开了经济与政治上的失衡，那么它同时也造成了第二种失衡：一边是美国海军为保障贸易（和能源）在全球海洋上流动所扮演的角色，另一边是从中获利的人。"},{"id":"ch07-077","p":155,"t":"p","en":"At the end of World War II, when the United States Navy took over from the Royal Navy in that critical global role, it was the US itself-then accounting for 50 percent of the world economy—and its wartime European allies that primarily profited from global trade.49 As Japan became a postwar ally and a democracy and entered global markets, it grew as well, as did, later, the Asian democracies and Asian allies—Korea, Taiwan, Singapore. The West as a whole profited from the flow of trade goods from New York to Rotterdam to Sydney to Yokohama. In short, the US Navy was securing the trade of its allies.50","zh":"第二次世界大战结束时，美国海军从英国皇家海军手中接过了这一关键的全球角色。当时主要从全球贸易中获益的，是美国自己——它那时占世界经济的一半——以及战时的欧洲盟友。49 随着日本成为战后盟友、成为民主国家并进入全球市场，它也发展起来；后来的亚洲民主国家和地区、亚洲盟友——韩国、中国台湾、新加坡——也是如此。整个西方都从纽约到鹿特丹、到悉尼、到横滨的货物流动中获益。简言之，美国海军保障的是盟友的贸易。50"},{"id":"ch07-078","p":155,"t":"p","en":"Those allies have grown rich during the ensuing several decades.","zh":"在此后几十年里，这些盟友都富了起来。"},{"id":"ch07-079","p":156,"t":"p","en":"Their growth is critically dependent on the role of the US Navy in protecting the sea-lanes of commerce. What role do these actors play in securing the high seas and protecting the flow of trade? What share of the cost do they bear?","zh":"它们的增长，关键取决于美国海军保护商业航道的角色。那么在维护公海安全、保护贸易流通方面，这些国家又扮演了什么角色？它们承担了多大份额的成本？"},{"id":"ch07-080","p":156,"t":"p","en":"What's more, as the entry of China and Russia into the WTO (and the opening of India and Brazil and Malaysia and many others) changed the geography of global commerce, so, too, did the dynamics of the relationship between trade and security begin to change. Fast-forward to the present day, and the US Navy is securing a flow of trade in goods and energy that profits China and Russia—hardly allies, increasingly adversaries.51 For how much longer will the United States agree to play the role of protecting the flow of sea-based trade for wealthy allies and potential enemies?","zh":"更进一步说，随着中国和俄罗斯加入世贸组织（以及印度、巴西、马来西亚等许多国家的开放）改变了全球商业的地理格局，贸易与安全之间关系的运作方式也开始变化。快进到今天：美国海军保障的货物与能源流动，正在让中国和俄罗斯获益——而这两个国家很难算盟友，越来越像对手。51 美国还愿意为富裕的盟友和潜在的敌人守护海上贸易通道多久？"},{"id":"ch07-081","p":156,"t":"p","en":"These issues were very much on C. H. Tung's mind in 2019. Indeed, they had been ever since US-China tensions began to flare up in the South China Sea. The trade war that started in 2017 was even worse. For OOCL, whose whole history had been about using the seas and Hong Kong to bring China back into the world and forge close ties with the West, this erosion of relations between China and the United States was disastrous, both politically and financially.","zh":"2019年，这些问题沉甸甸地压在董建华心头。事实上，自南海的中美紧张开始升温以来，它们就一直在他心里。2017年爆发的贸易战更是雪上加霜。对东方海外来说——它整部历史就是借海洋和中国香港，把中国重新带回世界、并与西方结下紧密纽带——中美关系的这种退化是灾难性的，无论在政治上还是财务上。"},{"id":"ch07-082","p":156,"t":"p","en":"What's more, the industry was changing. The technological advantages that had kept OOCL ahead of its competitors in the 1990s and early 2000s had spread across the industry. C. H. Tung watched his father's company lose its cutting edge. It was still the largest shipping firm in Asia, and in 2018 again deployed the largest ship in the world, the OOCL Hong Kong. But the dynamics of the industry were not on OOCL's side. \"We held our lead because of our technology. But when Maersk caught up with us in technology, they were so much bigger in scale, there was no way we could compete. I discussed it with our colleagues internally. We decided that over time there were only going to be five or six genuinely global shipping companies. And to compete at that scale, we were going to have to put in a huge amount of capital. I decided to sell instead.\"","zh":"更何况，这个行业本身也在变。20世纪90年代和21世纪初让东方海外领先于对手的技术优势，已经扩散到整个行业。董建华眼看着父亲的公司失去了锋芒。它仍然是亚洲最大的航运公司，2018年还再度投入了当时世界上最大的船——东方海外香港号。但行业的走势并不站在东方海外这一边。“我们靠技术保持领先。可当马士基在技术上追上来时，他们的规模比我们大得多，我们根本没法竞争。我在内部跟同事们讨论过。我们判断，假以时日，真正全球性的航运公司只会剩下五六家。要在那个体量上竞争，就必须投入巨额资本。所以我决定卖掉。”"},{"id":"ch07-083","p":156,"t":"p","en":"And sell he did, to COSCO Shipping Lines, out of Beijing. There are multiple ironies here. Tung's father fled Shanghai for Hong Kong to escape the takeover by the Communist Party of China. He turned his company and with it the Port of Hong Kong into the critical node of Western globalization in Asia. The return of Hong Kong to China critically aided China's penetration of the global market, and its economic rise. And the same factors that generated China's growth led to changes in the shipping industry that ultimately compelled OOCL to sell itself—to a company ultimately under the direction of the Communist Party of China.52","zh":"他确实卖了，卖给北京的中远海运集运（COSCO Shipping Lines）。这里的讽刺不止一层。董建华的父亲为躲避中国共产党的接管，从上海逃到香港。他把自己的公司——连同香港港——变成了西方全球化在亚洲的关键节点。香港回归中国，极大地帮助中国打入全球市场、实现经济崛起。而造就中国增长的那些同样的因素，又引发了航运业的变局，最终迫使东方海外把自身卖了出去——卖给一家最终受中国共产党领导的公司。52"},{"id":"ch07-084","p":157,"t":"p","en":"To C. H. Tung's generation, the quest for stability trumps all in international affairs—and that stability is essential, too, to Hong Kong's financial and commercial fortunes.53 It's a stability that, for many decades, was maintained by Beijing's respect for Hong Kong's separate system; it's now badly eroded by China's crackdown. And it was maintained by a broader stability in US-China relations.","zh":"对董建华这一代人来说，在国际事务中，对稳定的追求高于一切——而稳定对香港的金融与商业命运同样不可或缺。53 这种稳定，几十年来靠的是北京对香港独立制度的尊重；如今已被中国的严厉管控严重侵蚀。这种稳定，也靠中美关系的大体平稳来维系。"},{"id":"ch07-085","p":157,"t":"p","en":"Peace was the underlying condition for Hong Kong's growth. But peace is not where the United States and China are headed.","zh":"和平是香港发展的底层条件。但美国和中国正走向的，并不是和平。"},{"id":"ch07-086","p":161,"t":"p","en":
