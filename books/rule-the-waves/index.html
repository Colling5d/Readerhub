f energy security (and insecurity), see also Daniel Yergin, The New Map: Energy, Climate, and the Clash of Nations (New York: Penguin Press, 2020).","zh":"出自丹尼尔·耶金《能源重塑世界》（The Quest），第283页。关于能源安全（与不安全）格局变迁的生动记述，另见丹尼尔·耶金《新地图：能源、气候与国家的冲突》（The New Map: Energy, Climate, and the Clash of Nations，纽约：企鹅出版社，2020年）。"},{"id":"ch12-092","p":264,"t":"p","en":"It's a two-part confusion. First, it ignores the fact that the United States still imports huge quantities of oil; its level of imports is dropping, to be sure, but in 2018 the United States still imported 7,900,000 barrels of oil, just shy of China's 8,400,000. Less of that oil comes from the Persian Gulf than before, but since the four largest sources of American imports after Canada are Mexico, Saudi Arabia, Russia, and Colombia-with Iraq and Nigeria not far behind—the US is hardly in a position not to worry about stability of any sources of oil supply. Second, it ignores the fact that oil is priced globally: disruptions in one market instantly affect prices in another. So if major producers like Saudi Arabia are cut off from selling their oil overseas, prices will spike. And countries like Russia and Saudi Arabia can still very effectively manipulate the world price of oil.","zh":"这是双重混淆。第一，它无视了美国仍在大量进口石油这一事实；诚然，其进口量在下降，但2018年美国仍进口了790万桶石油，仅略低于中国的840万桶。其中来自波斯湾的石油比以前少了，但除加拿大外，美国进口的四大来源国是墨西哥、沙特阿拉伯、俄罗斯和哥伦比亚——伊拉克和尼日利亚紧随其后——因此美国远未到可以对任何石油供应来源的稳定高枕无忧的地步。第二，它无视了石油是全球定价这一事实：一个市场的动荡会立刻波及另一个市场的价格。因此，如果沙特阿拉伯这样的主要产油国被切断海外销路，油价就会飙升。而像俄罗斯和沙特阿拉伯这样的国家，仍然能够非常有效地操纵世界油价。"},{"id":"ch12-093","p":264,"t":"p","en":"And then there's a very different American vulnerability, tied to a very different dimension to the extraction of carbon from the seas. Wherever it's burned, oil and gas release carbon and that carbon reenters the atmosphere, and—as we increasingly understand—reenters the seas. And in so doing, it affects the salinity, the temperature, and the volume of the world's oceans—and that, in turn, is driving changes to our weather and our overall climate. These are changes that the United States can't insulate itself from, no matter how many walls it builds, how secure it feels, or how hard it tries to extract itself from globalization.","zh":"此外，美国还有一种截然不同的脆弱性，它与从海洋中开采碳的另一个极为不同的维度相联系。石油和天然气无论在哪里燃烧，都会释放碳，这些碳重新进入大气，并且——随着我们认识日深——重新进入海洋。在此过程中，它影响着世界海洋的盐度、温度和体量——而这又反过来推动着我们的天气和整体气候发生变化。这些变化，美国无法置身事外，无论它筑起多少高墙，无论它自觉多么安全，也无论它多么努力想把自己从全球化中抽身出来。"},{"id":"ch12-094","p":264,"t":"p","en":"Which takes us to the second part of the story of the salt of the oceans—and to very different kinds of engineering and ocean sciences associated with a very different set of questions about power in the modern world.","zh":"这就把我们带到「海洋之盐」这个故事的第二部分——也带到与另一类截然不同的工程技术和海洋科学面前，它们关乎现代世界中另一组截然不同的权力问题。"}],"notes":[]},{"id":"ch13","label":"Chapter 13","labelZh":"","title":"Oceanography and Power","titleZh":"第十三章　海洋学与权力","part":"Part IV: The Power of the Seas","showPart":false,"partZh":"第四部","partTitleZh":"海洋的力量","paras":[{"id":"ch13-001","p":265,"t":"p","en":"For most of this book, we've moved chronologically through history. Now we need to peer into the future. To do so, it's worth a brief look backward, to the founding of the science of oceanography by the US and Royal navies in the mid-nineteenth century. For the surprising fact is that just as the US Navy played a critical role in amplifying the technologies needed to extract carbon from the ocean floor, so, too, has it played a key role in understanding the consequences of what happens afterward, when that carbon is emitted into the atmosphere. Much of modern climate science owes its roots to early studies sponsored by the US Navy. And a focus on those studies does three useful things: it gives us an angle into the otherwise vastly complex world of climate science; it highlights that the essential facts about the way carbon emission was dangerously warming the planet were known to policy makers at the highest level—including American presidents—as early as the 1960s; and it points us to what the current science suggests are some of the most consequential dynamics in a changing climate, in the Arctic and Southern Oceans.","zh":"本书大半篇幅里，我们都沿着时间顺序在历史中行进。现在，我们得向未来张望了。要看清未来，不妨简短地回望一眼：19世纪中叶，美国海军与英国皇家海军如何共同奠定了海洋学这门科学。因为有一个出人意料的事实：美国海军在推广从海底开采碳所需的技术方面发挥了关键作用，同样，在理解此后所发生的后果——也就是碳被排入大气之后会发生什么——方面，它也扮演了重要角色。现代气候科学的大部分根基，都来自美国海军资助的早期研究。聚焦这些研究有三重好处：它给我们一个切口，得以进入本来极其复杂的气候科学世界；它凸显出一个基本事实——碳排放正在危险地让地球升温，而这一点早在20世纪60年代就为最高层决策者（包括美国总统）所知；它也把我们引向当今科学认为气候变化中最具影响的一些动力学过程，即发生在北冰洋与南大洋的那些过程。"},{"id":"ch13-002","p":265,"t":"h","en":"Of Oceanography and Power: The League of Extraordinary Gentlemen","zh":"海洋学与权力：非凡绅士联盟"},{"id":"ch13-003","p":265,"t":"p","en":"The iconic structure of the Scripps Institution of Oceanography is a modernist glass and redwood building whose windows open to a sweeping view of the Pacific. The building, in La Jolla, California, dates only to 1964, but the institute has its roots in a Marine Biological Association set up in San Diego in 1903 by the philanthropy of the Scripps family, notably Ellen Browning Scripps. It was renamed to honor Scripps in 1912 and became part of the University of California. It was the first independent American center for the study of the oceans, and still one of the world's most preeminent.\"","zh":"斯克里普斯海洋研究所最具标志性的建筑，是一座现代主义风格的玻璃与红杉木楼房，窗户朝外一开，太平洋的辽阔景色便尽收眼底。这幢楼位于加利福尼亚州拉霍亚（La Jolla），落成不过是1964年的事，但研究所的源头可以追溯到1903年在圣迭戈成立的一家海洋生物学会，那是由斯克里普斯家族——尤其是埃伦·布朗宁·斯克里普斯（Ellen Browning Scripps）——捐资设立的。1912年，学会为纪念斯克里普斯而更名，并成为加利福尼亚大学的一部分。它是美国第一家独立的海洋研究中心，至今仍是世界最负盛名的海洋研究机构之一。"},{"id":"ch13-004","p":266,"t":"p","en":"The foundations of oceanography are often most associated with the British Royal Navy and the Royal Society. In particular, we think of the voyages of the HMS Beagle, which in the 1830s brought Darwin to South America, and the HMS Challenger, which in the 1870s sailed purposefully to learn more about the deep seas. Between them, the two ships collected vast quantities of biological, zoological, and oceanographic science. Their reputation as groundbreaking voyages is well founded. The Challenger, in particular, generated findings about the ocean's floor that undergirded much of the science to come, as well as the laying of the aforementioned ocean cables upon which our digitized world relies. Other competitors for global power, from Spain to Russia, also participated in the study of the oceans. Germany's Meteor in the 1920s traversed the southern Atlantic no less than thirteen times, collecting a wide swath of data from salinity levels to samples of the ocean bottom. Ocean sciences become one of the symbols of international prowess in the competitive nineteenth century.1","zh":"海洋学的奠基，人们往往最常把它与英国皇家海军和皇家学会联系在一起。我们尤其会想到两艘船的航行：「贝格尔」号（HMS Beagle）在19世纪30年代把达尔文带到了南美洲；「挑战者」号（HMS Challenger）在19世纪70年代专程出海，为的是更深入地了解深海。两船合计，采集了海量的生物学、动物学与海洋学科学资料。它们作为开创性航行的声誉，可谓实至名归。尤其是「挑战者」号，它取得了大量关于海底的发现，为此后许多科学研究奠定了基础，也为前文提到的那些海底光缆的铺设奠定了基础——我们今日的数字化世界正是靠这些光缆运转。其他角逐全球霸权的国家，从西班牙到俄国，也参与了海洋研究。德国的「流星」号（Meteor）在20世纪20年代横穿南大西洋，前后多达13次，采集了从盐度到海底样本的大量数据。在竞争激烈的19世纪，海洋科学成了国家实力的象征之一。*"},{"id":"ch13-005","p":266,"t":"p","en":"But more than thirty years before the Challenger, the US Navy, seeking to deal itself a hand in the great game of oceanic exploration, launched its own, large-scale scientific voyage.² The US Exploring Expedition, comprised of the USS Vincennes, the Peacock, the Porpoise, the Sea Gull, the Flying Fish, the Oregon, and the Relief, sailed from 1838 to 1842. The expedition ended in infamy and the court martial of its controversial leader, Captain Charles Wilkes. Yet it brought back to the United States sufficient scientific material to form the basis of the Smithsonian collection.3 The Smithsonian's own account of the voyage conveys something of its scale and ambition:","zh":"然而，早在「挑战者」号出海三十多年前，美国海军为了在海洋探险这场大博弈中争得一席之地，也派出了自己的大型科学远航。* 美国探险考察队（US Exploring Expedition）由「文森斯」号、「孔雀」号、「海豚」号、「海鸥」号、「飞鱼」号、「俄勒冈」号和「救济」号组成，1838年启航，1842年返航。这次远航以声名狼藉收场，其颇具争议的领队查尔斯·威尔克斯（Charles Wilkes）上校还受到军事法庭审判。但它带回美国的科学材料，足以构成史密森学会（Smithsonian）藏品的基础。* 史密森学会自己对这次航行的记述，颇能传达其规模与雄心："},{"id":"ch13-006","p":266,"t":"p","en":"The vast crisscrossing track of the [Exploring Expedition] still takes one's breath away: first south to Cape Horn, with a side trip from there to the Antarctic, to the west coast of South America, then to Tahiti and the Fiji","zh":"「探险考察队」那条纵横交错的庞大航线，至今仍令人惊叹：先向南至合恩角，再从那里顺道折向南极，然后前往南美洲西海岸，随后是塔希提和斐济"},{"id":"ch13-007","p":266,"t":"n","en":"Along with the Woods Hole Oceanographic Institution, on the other side of the country, off Cape Cod, which was established in 1930.","zh":"可与伍兹霍尔海洋研究所并列而称。该所位于美国另一侧、科德角外海，成立于1930年。"},{"id":"ch13-008","p":267,"t":"p","en":"Islands and Australia, and from there a more extended exploration of Antarctica. The expedition then backtracked to Australia and New Zealand, to the Fiji and Hawaiian Islands, and from there to another of its prime objectives, the Pacific Northwest, in order to explore that coast and strengthen American claims to the Oregon Territory and the San Francisco Bay. Next, the ships sailed to Manila, Singapore, around Cape Town, and to New York, concluding the last all-sail circumnavigation of the world.ª","zh":"群岛和澳大利亚，再从那里对南极展开范围更大的考察。此后，考察队折返澳大利亚与新西兰，前往斐济群岛和夏威夷群岛，然后驶向它的另一个主要目标——太平洋西北部，以勘察那一带海岸，并强化美国对俄勒冈领地和旧金山湾的主张。接下来，船队驶往马尼拉、新加坡，绕过开普敦，最后抵达纽约，完成了世界上最后一次全帆力环球航行。*"},{"id":"ch13-009","p":267,"t":"p","en":"The voyage contributed 241 charts of the seas it sailed, as well as countless specimens, artifacts, drawings, and journals. Arguably, though, the most important contribution was the work it did in charting the contours of the Antarctic, providing much of the evidence that went into the recognition that Antarctica is a separate continent. And in identifying its contours, the scientists of the Ex-Ex—as the voyage was commonly known—also did much to map the contours of what we now know as the Southern Ocean.","zh":"这次航行留下了它所经海域的241幅海图，以及数不清的标本、器物、绘画和航海日志。不过，可以说它最重要的贡献，是在勘定南极轮廓方面所做的工作——正是这些工作提供了大量证据，使人们得以承认南极洲是一块独立的大陆。而「Ex-Ex」——人们对这次远航的俗称——的科学家们在辨明南极轮廓的同时，也为如今我们称作南大洋的那片海域勾画了大片轮廓。"},{"id":"ch13-010","p":267,"t":"p","en":"By the turn of the twentieth century, the United States, in the wake of the Spanish-American War and under the influence of Roosevelt and Mahan, had begun to engage more expansively in the research, expedition, and exploration that characterized imperial competition at the time. As America gained colonies in the Caribbean and the Pacific, its sense of internationalism grew. The spirit of the age was embodied in people like Isaiah Bowman, who led expeditions to chart large parts of South America, founded the American Geographical Society, and advised Woodrow Wilson on Europe's new borders during Versailles negotiations.⁵","zh":"到20世纪初，美国在美西战争之后、在罗斯福与马汉的影响之下，已开始更广泛地投身于研究、远征与探险——这些正是当时帝国角逐的标志性活动。随着美国在加勒比和太平洋获得殖民地，它的国际主义意识也随之生长。时代精神体现在以赛亚·鲍曼（Isaiah Bowman）这样的人身上：他率队勘测了南美洲的大片地区，创办了美国地理学会，还在凡尔赛谈判期间就欧洲的新边界为伍德罗·威尔逊出谋划策。*"},{"id":"ch13-011","p":267,"t":"p","en":"The sponsorship of science played an important part in that growing internationalism-and that prominently included the oceanographic sciences.* The most consequential oceanographer of the age was not British, but an American, Matthew Fontaine Maury. Among other distinctions, he was superintendent of the newly established Naval Observatory (which now serves as well as the residence of the American vice president). Maury conducted a series of studies of the movements of the oceans, and charted them carefully, and for many decades his magnum opus, The Physical Geography of the Sea, was the seminal text used by mariners of all stripes and all nations to aid their navigation and their science.","zh":"对科学的赞助，在这种日益生长的国际主义中占有重要位置——其中显眼地包括海洋科学。* 那个时代最具影响力的海洋学家不是英国人，而是一位美国人：马修·方丹·莫里（Matthew Fontaine Maury）。他身兼多项头衔，其中之一是新成立的海军天文台台长（该台如今也是美国副总统的官邸）。莫里对海水的运动做了一系列研究，并细致地绘制成图；此后数十年间，他的代表作《海洋自然地理》（The Physical Geography of the Sea）一直是各国、各类航海者用于辅助航行与科学研究的奠基之作。"},{"id":"ch13-012","p":267,"t":"n","en":"For a rich account of the role of exploration and geographical research in the formation of American internationalism at the turn of the century, see in particular Neil Smith, American Empire: Roosevelt's Geographer and the Prelude to Globalization (Berkeley: University of California Press, 2003).","zh":"关于世纪之交的探险与地理研究在美国国际主义形成过程中所起的作用，详尽论述尤见尼尔·史密斯（Neil Smith）《美利坚帝国：罗斯福的地理学家与全球化的前奏》（American Empire: Roosevelt's Geographer and the Prelude to Globalization，伯克利：加利福尼亚大学出版社，2003年）。"},{"id":"ch13-013","p":268,"t":"p","en":"Scripps was founded at this heady time. It quickly managed to attract some of the leading oceanographers from around the world, innovate a teaching program, and launch several research vessels, including one capable of deepwater oceanography. In 1936, the research director from Roald Amundsen's famous expedition to the North Pole, Harald Ulrik Sverdrup, became its director. And then, like the rest of the world, Scripps was pulled into the vast, all-consuming enterprise of World War II. The war saw a further deepening of the interaction between the national security establishment in Washington, the navy, and the oceanographic community.","zh":"斯克里普斯就诞生在这个令人振奋的年代。它很快网罗了一批世界顶尖的海洋学家，开创了一套教学计划，还陆续启用了几艘科考船，其中一艘能够从事深水海洋学研究。1936年，曾担任罗阿尔·阿蒙森（Roald Amundsen）著名北极远征队研究主管的哈拉尔德·乌尔里克·斯维尔德鲁普（Harald Ulrik Sverdrup）出任所长。再后来，和世界的其余部分一样，斯克里普斯也被卷入第二次世界大战那场浩大而吞噬一切的事业。战争使华盛顿的国家安全机构、海军与海洋学界之间的互动进一步加深。"},{"id":"ch13-014","p":268,"t":"h","en":"Walter Munk, the Office of Naval Research, and the Science of Surfing","zh":"冲浪科学：芒克与海军研究办公室"},{"id":"ch13-015","p":268,"t":"p","en":"The business of waging a world war fought across two oceans—and beneath them—would prove to be a huge boon to ocean science. Among its effects was the establishment of a powerful unit for research in the US Navy. As the war came to a close, the navy created an Office of Naval Research to keep up its support to the ocean sciences, and the ONR would emerge as the major sponsor of science in the United States and retain that role for two decades after the war.6","zh":"在两个大洋之上——以及之下——打一场世界大战，这件事给海洋科学带来了莫大的好处。其效应之一，是美国海军内部建立起一个实力雄厚的研究单位。战争临近结束时，海军设立了海军研究办公室（Office of Naval Research，ONR），以延续对海洋科学的支持；此后ONR崛起为美国科学界最大的资助者，并在战后二十年里一直保持这一地位。*"},{"id":"ch13-016","p":268,"t":"p","en":"It's unsurprising that the navy should want to understand the oceanic domain, or that the world's largest navy should emerge as a major driver of the ocean sciences. But the scale of impact of the US Navy in driving basic science research is truly far-reaching. Even the Royal Navy's infrastructure for research was but a minor fraction of that developed by the Office of Naval Research. One of the biggest players in this collaboration was Walter Munk, whom we encountered in Project Mohole. His first, and in some ways most consequential, interaction with the navy came twenty years earlier.","zh":"海军想要了解海洋这一领域，并不奇怪；世界上规模最大的海军成为海洋科学的主要推手，也不奇怪。但美国海军推动基础科学研究所造成的影响，其规模确实深远。就连英国皇家海军的研究基础设施，与海军研究办公室建起的那一套相比，也只是很小的一部分。这场合作中分量最重的人物之一是沃尔特·芒克（Walter Munk），我们在莫霍计划里见过他。而他与海军的第一次——从某些方面说也是影响最深远的一次——交集，还要早二十年。"},{"id":"ch13-017","p":268,"t":"p","en":"Munk had just joined the Scripps Institution as a PhD student, at the invitation of its storied director, Harald Sverdrup, when the war broke out. Like the rest of his colleagues, Munk joined the US Armed Forces. He was initially assigned to the US Army at Fort Lewis, but Sverdrup requested his recall to Scripps in 1941 to help with a new joint venture between Scripps and the US Navy Radio and Sound Laboratory. It was the week before Pearl Harbor. Munk worked at the new lab developing techniques for \"acoustic tomography\"—understanding how sound waves move through the ocean's waters, and using those sound waves to map their flow. While there, he learned of upcoming Allied landings in North Africa, but was struck by the paucity of the Allies' knowledge of local wave conditions. Munk took it upon himself to begin to work through some theories about wave formation and timing—what he would later refer to as the study of waves, wind, and swell. It would influence a generation of scholars afterward. At the time, its most important use was to help plan the timing of the D-Day invasion.","zh":"战争爆发时，芒克刚应传奇所长哈拉尔德·斯维尔德鲁普之邀，以博士生身份加入斯克里普斯研究所。和同事们一样，芒克参军入伍。他最初被分配到刘易斯堡（Fort Lewis）的美国陆军，但1941年，斯维尔德鲁普请求把他调回斯克里普斯，协助推进研究所与海军无线电与声学实验室（US Navy Radio and Sound Laboratory）的一项新合作。那是珍珠港事件前一周的事。芒克在新实验室里研发「声学层析成像」技术——即弄清声波如何在海洋的水体中传播，再利用这些声波测绘其流动。在实验室期间，他得知盟军即将在北非登陆，却震惊于盟军对当地海况了解之少。芒克便自行着手推演关于波浪生成与时序的若干理论——他后来称之为对浪、风与涌的研究。这一研究影响了此后一整代学者。而在当时，它最重要的用途是帮助确定诺曼底登陆日的时机。"},{"id":"ch13-018","p":269,"t":"p","en":"After the war, oceanographic scientists enjoyed ample resources, largely funded by the ONR. The 1950s head of the geophysics branch of the ONR, Gordon Lill (who led the American Miscellaneous Society, together with Roger Revelle), would later describe it: \"The sky was the limit. We were very adventuresome. Lots of stuff, equipment, was available as left-overs from World War II. You could get trucks, you could get jeeps, you could get airplanes, and you could get ships. Almost anything you wanted, there was some surplus store of it somewhere. You could get this stuff, and ship it out to the universities, and let the scientific community use it.\"7","zh":"战后，海洋科学家们手头资源充裕，大部分由ONR出资。20世纪50年代主持ONR地球物理分部的戈登·利尔（Gordon Lill，他与罗杰·雷维尔一道主持「美国杂学会」）后来这样描述：“那时候天高任鸟飞。我们非常敢闯。大量物资和设备都是二战的剩余物资，随手可得。你能弄到卡车，能弄到吉普，能弄到飞机，也能弄到船。几乎你想要什么，某处的剩余物资仓库里就有。你可以把这些东西弄来，运到大学去，交给科学界使用。”*"},{"id":"ch13-019","p":269,"t":"p","en":"Munk and his colleagues at Scripps were among those who made use of that support. He continued studying how waves are formed, and how they travel and change as they move across the length of the oceans. Waves, of course, are shaped by local wind conditions, as well as the precise formation of the coastal shelf where they are formed. But what Munk saw in his research is that these local conditions shaped only a small part of how waves traveled; that their movement across huge distances was explained more by the currents of the ocean--that a single wave might begin with dynamics more than a continent away from where it would ultimately crest.","zh":"芒克和他在斯克里普斯的同事，正是这批支持的受益者。他继续研究波浪如何生成，以及它们横越整个大洋时如何传播、如何变化。波浪当然受当地风况的塑造，也受其生成处海岸陆架具体形态的塑造。但芒克在研究中看到，这些本地条件只决定了波浪传播方式的一小部分；波浪跨越遥远距离的运动，更多要由洋流来解释——一道浪的起势，可能源于距它最终破碎处一个大陆之外的动力学过程。"},{"id":"ch13-020","p":269,"t":"p","en":"This line of Munk's research culminated in a famous 1956 study that was the first to show in detail how ocean dynamics in the Southern Pacific, six thousand miles away from Scripps, affected wave formation as distant as the California coast. It became the basis for Munk's most popular application—the ability of surfers to predict wave swells around the world. But not just that: Munk's work on wave transmission did much to illuminate the way that sound waves, moving across the ocean, were affected by the temperature and density of the water. Because sound waves are constant, this became an important mode for measuring the changing temperature of the oceans—what Munk would later call \"the sound of climate change.\"8","zh":"芒克这一路研究的高峰，是1956年那项著名研究：它首次详细展示了距斯克里普斯六千英里之遥的南太平洋洋流动力，如何影响远至加利福尼亚海岸的波浪生成。这一成果成了芒克最广为人知的一项应用的基础——冲浪者得以预测世界各地的涌浪。但意义不止于此：芒克关于波浪传播的研究，极大地揭示了声波穿行大洋时如何受到水温和密度的影响。由于声波是恒定的，这便成了一种测量海洋温度变化的重要手段——芒克后来称之为「气候变化之声」。*"},{"id":"ch13-021","p":270,"t":"p","en":"This important interplay between national security decision makers and scientists in the formation of climate science has attracted its own study at Scripps, most notably by David Victor, who is an adjunct professor of Climate, Atmospheric Science, and Physical Oceanography. Victor, whom we met in the preceding chapter, has an unusual pedigree for an energy and climate scholar. His PhD from MIT is in the political, not the natural, sciences, and for many years his primary academic affiliation was with Stanford Law School. The University of California in San Diego lured him away from Stanford to run a research lab on climate and energy policy. He's also a student of the ways in which national security authorities, elite scientific institutions, and governmental funders have interacted over the decades to shape the course of climate science.9,*","zh":"国家安全决策者与科学家在气候科学形成过程中的这种重要互动，本身也成了斯克里普斯的研究对象，其中尤以戴维·维克托（David Victor）的研究最为突出。他是气候、大气科学与物理海洋学的兼任教授。维克托我们在上一章见过，对一位能源与气候学者来说，他的出身颇不寻常：他在麻省理工学院拿的博士学位属于政治学而非自然科学，而且多年来他的主要学术身份在斯坦福法学院。加州大学圣迭戈分校把他从斯坦福挖来，主持一个气候与能源政策研究实验室。他也研究数十年来国家安全部门、顶尖科研机构与政府资助方如何相互作用，从而塑造了气候科学的走向。*"},{"id":"ch13-022","p":270,"t":"p","en":"The collaborations between the navy and Scripps deepened in the 1950s. By then, Woods Hole, founded in the 1930s on the other side of the continent, near Cape Cod and facing the Atlantic, was also doing important work with the navy, especially on sonar technologies and the ways that sonar could be used to track submarines hiding beneath the different layers of water that characterize the ocean depths. But by dint of geography, Scripps was more fully pulled into the next critical phase of naval science—atomic testing in the Pacific.","zh":"海军与斯克里普斯的合作在20世纪50年代进一步加深。那时，位于大陆另一侧、紧邻科德角、面向大西洋的伍兹霍尔（Woods Hole）也已在与海军开展重要合作，尤其是在声呐技术，以及如何用声呐追踪藏匿于深海不同水层之下的潜艇方面。但凭地利之便，斯克里普斯更彻底地被卷入了海军科学的下一个关键阶段——太平洋上的核试验。"},{"id":"ch13-023","p":270,"t":"p","en":"*He also surfs. A peripatetic character, David is often found flying himself from conference to briefing to speech on his own twin-prop airplane or on the red-eye out of San Diego. But when he's at Scripps, he likes to take advantage of the location and indulge his real passion: surfing. He's not alone: many of his colleagues also get out onto the breakers regularly. Walk through the corridors of Scripps and many of the offices have a surfboard tucked in amid the computers and scientific papers, and drying wet suits often adorn the gates and racks of the seaside campus.","zh":"*他也冲浪。戴维是个四处奔走的人，常常见他自己驾着双发螺旋桨小飞机，或搭乘从圣迭戈起飞的夜航航班，从一场会议赶往一次汇报、再赶往一场演讲。但一到斯克里普斯，他就喜欢借地利之便，纵情于真正的爱好：冲浪。他并不孤单——许多同事也经常下海逐浪。走在斯克里普斯的走廊里，许多办公室的电脑和科学论文之间都塞着一块冲浪板；这座海滨校园的门口和架子上，也常晾着湿漉漉的潜水服。"},{"id":"ch13-024","p":271,"t":"p","en":"In the mid-1950s, the United States began live testing of nuclear weapons, by exploding them on small islands and atolls, mostly in the Western Pacific. Munk was among a team of scientists tasked with studying the wave effects from those vast explosions. He worried that the explosion of nuclear weapons underwater could trigger tsunamis, and the work he did to measure their effects laid the early foundation for what is now the important work of the US National Oceanic and Atmospheric Administration (NOAA) and others to provide early warnings of tsunamis. Munk also realized that the atomic tests represented an opportunity to study wave dynamics, and the communication of force and of sound through the waves, under unique circumstances. David Victor recounts, \"Ironically, the tests-incredibly controversial at the time—proved to be very important to climate science. Basically they put a layer of radiocarbon in the water that had only one possible source-thermonuclear weapons. So when you saw that layer, you could tell the age of the water parcels you were examining. It's like you're an archaeologist in the oceans and suddenly you've been handed this very powerful tool to be able to know the age of the water parcels that allows you to piece out what the currents are.\"1o","zh":"20世纪50年代中期，美国开始进行核武器实弹试验，主要在西太平洋的小岛和环礁上引爆。芒克是受命研究这些巨大爆炸所产生波浪效应的科学家之一。他担心水下核爆可能引发海啸，而他为测量其效应所做的工作，为如今美国国家海洋和大气管理局（NOAA）等机构发布海啸预警的重要业务打下了早期基础。芒克也意识到，核试验提供了一个难得的机会，可以在独一无二的条件下研究波浪动力学，以及力量与声音如何通过波浪传递。戴维·维克托讲述道：“讽刺的是，那些试验——在当时极具争议——对气候科学却极为重要。它们基本上是在水里留下了一层放射性碳，而这层碳只有一个可能的来源——热核武器。所以，一旦看到那一层，你就能判断所检测水团的年龄。这就像你是一个海洋里的考古学家，突然有人递给你一件极为有力的工具，让你知道水团的年龄，从而能把洋流的来龙去脉拼出来。”*"},{"id":"ch13-025","p":271,"t":"p","en":"These studies were motivated, too, by an effort to understand a phenomenon that had fascinated Harald Sverdrup and others since the 1930s: how the chemistry of the oceans affects their currents. They knew that salt water absorbed carbon from the atmosphere. How much, how quickly, and with what effect was an item of scientific curiosity, not of central study, in this generation of oceanographers. But its exploration by Scripps scientists would prove to be one of the most consequential lines of scientific research.","zh":"这些研究还有一个动因：人们想弄明白一个自20世纪30年代起就令哈拉尔德·斯维尔德鲁普等人着迷的现象——海洋的化学性质如何影响洋流。他们知道，海水会吸收大气中的碳。但吸收多少、多快、又带来什么后果，对这一代海洋学家来说只是出于科学好奇的题目，而非核心课题。然而，斯克里普斯科学家对这一问题的探索，后来被证明是影响最为深远的科研脉络之一。"},{"id":"ch13-026","p":271,"t":"p","en":"From the early days of oceanography, one of the central preoccupations had been how currents and wind patterns in one part of the sea affected movements in another. This is the great puzzle of the oceans. For at the same time, the oceans and their seas exhibit highly localized and specific variations, and yet all oceanic waters ultimately flow into one another. Empty a can of paint into the Southern Ocean at Wilkes Point or into the Pacific Ocean at Hawaii, and eventually some trace of that will be found in the North Atlantic, the Norwegian Sea, or the far reaches of the Indian Ocean. Climate models now suggest that a complete circulation of the oceans' water occurs over roughly one thousand years.","zh":"自海洋学诞生之初，一个核心关切就是：一片海域的洋流与风型如何影响另一片海域的水体运动。这是海洋最大的谜题。因为海洋及其各个海区既表现出高度局地化、各不相同的差异，而所有海水最终又彼此连通。你在威尔克斯角（Wilkes Point）往南大洋里倒一罐颜料，或者在夏威夷往太平洋里倒一罐，终有一天，北大西洋、挪威海或印度洋的遥远海隅会发现它的些许痕迹。如今的气候模型显示，大洋水体完成一次完整循环，大约需要一千年。"},{"id":"ch13-027","p":272,"t":"p","en":"At the time of the early nuclear testing, most scientists believed that the majority of carbon dioxide released by the industrial burning of fossil fuels remained in the atmosphere. A study in 1957 by Munk's colleagues Roger Revelle and Hans Suess challenged that conclusion.\" The study is brief, merely nine pages long, and most of the text is taken up with mathematic equations and tables that recount their effort to measure the carbon captured in the shells of bicarbonates (mollusks, limpets, cockles, and the like) as well as seaweed-much as scientists measure the carbon captured in preserved wood and rocks. They take note of earlier studies of sea-level rise that estimated that most of the rise observed by then could be accounted for by naturally occurring glacial melt. But they began to worry about what's known as \"ocean mixing\"—the chemical process by which the colder, denser, saltier water of the deep ocean mingles with the warmer waters on the surface, impacting wave patterns. They reached the startling conclusion that \"most of the CO, released by artificial fuel combustion since the beginning of the industrial revolution must have been absorbed by the oceans.\"12","zh":"在早期核试验的年代，多数科学家认为，工业燃烧化石燃料所释放的二氧化碳，大部分仍留在大气中。1957年，芒克的同事罗杰·雷维尔与汉斯·苏斯（Hans Suess）的一项研究挑战了这一结论。* 那篇论文很短，只有九页，正文大半是数学方程式和表格，记述他们如何测量碳酸氢盐生物（软体动物、帽贝、鸟蛤之类）的壳体以及海藻所固定的碳——其方法很像科学家测量保存在木材和岩石中的碳。他们注意到，此前关于海平面上升的研究曾估计，当时观测到的上升幅度，大部分可以用自然发生的冰川消融来解释。但他们开始担心所谓的「海洋混合」——深层海洋更冷、更密、更咸的水与表层温暖海水相混，进而影响波浪形态的化学过程。他们得出了一个惊人的结论：“自工业革命开始以来，人为燃料燃烧所释放的二氧化碳，大部分必定已被海洋吸收。”*"},{"id":"ch13-028","p":272,"t":"p","en":"The paper concludes by describing the \"large scale geophysical experiment\" that human beings were involved in: by burning industrial quantities of fossil fuels, they noted, \"[w]ithin a few centuries we are returning to the atmosphere and oceans the concentrated organic carbon stored in sedimentary rocks over hundreds of millions of years.\"13","zh":"论文收尾时，描述了一场人类正在参与其中的「大规模地球物理实验」：他们指出，通过工业规模地燃烧化石燃料，“在几个世纪之内，我们就把沉积岩中储存了数亿年的浓缩有机碳，重新送回了大气和海洋。”*"},{"id":"ch13-029","p":272,"t":"p","en":"To Revelle and Suess, this was less a concern about what would later come to be known as global warming than it was a scientific curiosity. Much of the conclusion of the study is given over to a call for more research. They noted that the coming decades were likely to see large new quantities of carbon released into the atmosphere.¹4","zh":"对雷维尔和苏斯而言，这与其说是对后来被称为全球变暖的现象的忧虑，不如说是一种科学上的好奇。论文的结论部分大半篇幅都在呼吁开展更多研究。他们指出，未来几十年里，很可能会有大量新的碳被释放到大气中。*"},{"id":"ch13-030","p":272,"t":"p","en":"The turning point in the study of climate change came in 1957 to 1958, which had been deemed the International Geophysical Year. The brainchild of several American scientists, the year was a grand experiment in scientific cooperation—made all the more remarkable because it coincided with one of the tensest moments in the Cold War. Yet dozens of Soviet scientists joined their American and international colleagues in the first global study of the oceans. \"Suddenly\" David Victor recounted, \"you had all around the world these coordinated ships and ground stations doing systematic measurement of the atmosphere and the oceans.\" The research transformed the understanding of how the oceans and the atmosphere interacted in managing carbon. Among other things, it highlighted the importance of measuring temperature not just in a few discrete places, close to human habitation, but across the breadth of the oceans.\"","zh":"气候变化研究的转折点出现在1957至1958年，那一年被定为「国际地球物理年」。这一构想出自几位美国科学家，是科学合作的一次宏大实验——尤为难得的是，它恰逢冷战最紧张的时期之一。尽管如此，仍有数十位苏联科学家与美方及各国同行一道，参与了首次全球性海洋研究。戴维·维克托说：“突然间，全世界都有这些协同作业的船只和地面站，对大气和海洋进行系统测量。”这项研究改变了人们对海洋与大气如何相互作用、共同调节碳的认识。它还特别凸显出一点：温度测量不能只在人类居住地附近的少数孤立点位进行，而应覆盖整个大洋的广度。*"},{"id":"ch13-031","p":273,"t":"p","en":"Scripps scientists were also involved in studies of the interplay between carbon and the atmosphere. The most famous study was conducted by the Institute's Charles (Dave) Keeling at the Mauna Loa Observatory in Hawaii, where he installed measuring equipment, as well as in the South Pole. In Hawaii, he began systematic, regular testing of levels of carbon concentration. He observed what he described at the time as a possible worldwide rise in carbon concentration. Over subsequent decades, the steady upward rise in carbon concentrations measured at Mauna Loa has become known as “the Keeling Curve, and is foundational in atmospheric studies of climate change.","zh":"斯克里普斯的科学家也参与了碳与大气相互作用的研究。最著名的一项由该所的查尔斯·（戴夫·）基林（Charles (Dave) Keeling）主持，他在夏威夷的莫纳罗亚观象台安装了测量设备，在南极点也安装了一套。在夏威夷，他开始对碳浓度水平做系统、定期的测定。他观测到自己当时所说的「全球碳浓度可能正在上升」的现象。此后数十年间，莫纳罗亚测得的碳浓度持续攀升，这条曲线被称为「基林曲线」（Keeling Curve），成为气候变化大气研究的奠基性成果。"},{"id":"ch13-032","p":273,"t":"h","en":"Briefing the President, and Climate's Wrong Turn","zh":"向总统汇报与气候的歧途"},{"id":"ch13-033","p":273,"t":"p","en":"Looking back, it's astonishing to realize how much Munk and Revelle and their colleagues understood about the workings of carbon in the ocean and climate change by the late 1950s. Also astonishing is that even in those peak days of the Cold War, with its great anxiety about the Soviet Union, the signs of climate change and its consequences made it to the desk of the president of the United States.","zh":"回头看去，令人惊讶的是，到20世纪50年代末，芒克、雷维尔和他们的同事对碳在海洋中的运行机制以及气候变化已经懂得那么多。同样令人惊讶的是，即便在冷战的高峰时期、在对苏联的极度焦虑之中，气候变化的迹象及其后果也还是被送到了美国总统的案头。"},{"id":"ch13-034","p":273,"t":"p","en":"The connections came through the scientific advisory committees","zh":"这些信息是通过科学顾问委员会送达的"},{"id":"ch13-035","p":273,"t":"p","en":"*The scientists of the International Geophysical Year were not the only ones doing important measurements. The US Navy itself was undertaking important studies and measurements as it found itself patrolling virtually every eddy of the world's oceans. For example, as it chased Soviet submarines under the Arctic sheet ice, the navy's submarine fleet took careful, repeated measurements of the thickness of the ice. That was designed to inform its tracking of the Soviet fleet, but would prove consequential, too, in the study of climate effects of warming seas.","zh":"*国际地球物理年的科学家并不是唯一在做重要测量的人。美国海军自身也在开展重要的研究与测量——它几乎巡逻着世界大洋的每一处涡流。例如，在北极浮冰之下追逐苏联潜艇时，海军潜艇部队对冰层厚度做了细致、反复的测量。这本是为追踪苏联舰队提供依据，但后来也被证明对研究海洋变暖的气候效应意义重大。"},{"id":"ch13-036","p":274,"t":"p","en":"of the National Science Foundation and the president's science council. These linked the scientific community to the national security community and its decision makers. And in 1965, several of the leading Scripps scientists—including Munk, Revelle, and Keeling—would join a who's who of climate scientists in authoring a 1965 Presidential Scientific Advisory Council report on the oceans and climate that was briefed to President Johnson. It described a looming environmental crisis caused by the growing pattern of carbon emissions, and argued that unless there was a change in direction, \"measurable and perhaps marked\" climate change would likely occur by the end of the twentieth century.¹⁵ It was a remarkably prescient warning. But little came from it. Johnson was fixated that year on the escalation of the Vietnam War and on his Great Society social reform legislation and programs.","zh":"——也就是国家科学基金会和总统科学委员会的科学顾问委员会。这些机构把科学界与国家安全界及其决策者连接了起来。1965年，斯克里普斯几位顶尖科学家——包括芒克、雷维尔和基林——与一批气候科学界的头面人物联名，撰写了一份关于海洋与气候的总统科学顾问委员会报告，并向约翰逊总统作了汇报。报告描述了因碳排放格局不断加剧而迫近的环境危机，并指出，除非改弦更张，「可测量、甚至堪称显著」的气候变化很可能在20世纪末出现。* 那是一记极具先见之明的警告。但几乎什么也没有发生。那一年，约翰逊的心思全在越南战争的升级，以及他「伟大社会」的社会改革立法与各项计划上。"},{"id":"ch13-037","p":274,"t":"p","en":"In the 1970s, each of the presidents of the United States were further warned of the consequences of a changing climate. The oil price spike of 1973 might have concentrated presidential focus on the topic, but for the fact that by then the United States was wholly absorbed in extracting itself from the Vietnam War. After the 1976 election, Jimmy Carter's key presidential advisers, James Schlesinger and Gus Speth, warned in 1977 that the environmental problem was growing worse; perhaps Carter would have listened were his presidency not about to be torqued around the axle of the 1979–81 Iranian hostage crisis.","zh":"到了20世纪70年代，历任美国总统都进一步受到关于气候变化后果的警告。1973年的油价飙升本来或许能让总统把注意力集中到这个问题上，但那时美国已全身心投入从越南战争中脱身。1976年大选之后，吉米·卡特的核心顾问詹姆斯·施莱辛格（James Schlesinger）与格斯·斯佩思（Gus Speth）在1977年警告说，环境问题正在恶化；若不是卡特的总统任期即将被1979至1981年的伊朗人质危机死死缠住，他或许会听进去。"},{"id":"ch13-038","p":274,"t":"p","en":"Then, in the 1980s, seen from the vantage point of climate policy, the US split off from the world. Internationally, there was growing focus on the problem. Even Ronald Reagan's great friend and great conservative, UK prime minister Margaret Thatcher, focused on the climate issue:","zh":"接着，到了20世纪80年代，从气候政策的视角看，美国与世界分道扬镳。在国际上，对这一问题的关注日益升温。就连罗纳德·里根的密友、同样坚定的保守派、英国首相玛格丽特·撒切尔，也把注意力放在了气候问题上："},{"id":"ch13-039","p":274,"t":"p","en":"The threat to our world comes not only from tyrants and their tanks. It can be more insidious though less visible. The danger of global warming is as yet unseen, but real enough for us to make changes and sacrifices, so that we do not live at the expense of future generations. Our ability to come together to stop or limit damage to the world's environment will be perhaps the greatest test of how far we can act as a world community. No-one should under-estimate the imagination that will be required, nor the scientific effort, nor the unprecedented co-operation we shall have to show. We shall need statesmanship of a rare order.¹6","zh":"「威胁我们这个世界的，不只是暴君和他们的坦克。威胁可能更加隐蔽，虽不易察觉。全球变暖的危险尚未显形，却已足够真实，需要我们做出改变、付出牺牲，以免我们靠透支子孙后代过活。我们能否同心协力，阻止或限制对世界环境的破坏，或许将成为对我们能在多大程度上作为一个世界共同体行动的最大考验。谁都不要低估所需的想象力，不要低估所需的科学努力，也不要低估我们必须展现的前所未有的合作。我们需要一种罕见的政治家风范。*"},{"id":"ch13-040","p":275,"t":"p","en":"Unfortunately, President Reagan provided no such statesmanship. The most important moment of climate policy of his presidency came near its end, in 1988, when NASA scientist Jim Hansen provided startling testimony about the likely effects of climate change to the House of Representatives.17 The response of the White House was to try to edit his statement (which served only to draw more attention to it). But Reagan did little or nothing to advance serious climate policy.","zh":"遗憾的是，里根总统并没有拿出这样的政治家风范。他任内气候政策上最重要的时刻出现在任期将尽之时：1988年，美国国家航空航天局（NASA）科学家吉姆·汉森（Jim Hansen）向众议院作证，就气候变化的可能后果给出了令人震惊的证词。* 白宫的反应是试图删改他的证词（结果只是让更多人注意到它）。但里根在推进严肃的气候政策上几乎无所作为。"},{"id":"ch13-041","p":275,"t":"p","en":"Briefly in the 1990s, American politics shifted to a more constructive position. As Reagan's vice president, George Bush—that careful analyst—had always taken climate science seriously. In his presidential campaign, he committed himself to acting early on the climate issue. Although he never did host the major climate conference he once promised, he did agree to attend the landmark 1992 Earth Summit in Rio. That meeting kick-started deeper negotiations within what's known as the UN Framework Convention on Climate Change, the eventual result of which was the negotiation and signing in 1997 of the Kyoto Protocol on climate change, which mandated that industrialized nations would cut their emissions to 5 percent below the levels they had recorded in 1990. President Clinton signed the Protocol, the first global treaty designed to address reductions in carbon emissions.","zh":"20世纪90年代有过短暂的一段，美国政治转向了更具建设性的立场。乔治·布什作为里根的副总统，这位凡事细加分析的实干者，一向认真对待气候科学。在竞选中，他承诺要在气候问题上尽早行动。虽然终究没有主办他曾许诺的那场大型气候会议，他确实同意出席1992年在里约举行的、具有里程碑意义的地球峰会。那次会议推动了在《联合国气候变化框架公约》框架内更深入的谈判，最终结果是1997年谈判并签署《京都议定书》，其中规定工业化国家须在1990年记录水平的基础上将排放量削减5%。克林顿总统签署了这份议定书——这是第一份旨在削减碳排放的全球条约。"},{"id":"ch13-042","p":275,"t":"p","en":"Seen with hindsight, though, climate diplomacy took a wrong turn in Kyoto; it exempted the major developing countries. That fact seemed eminently fair—of the total excess carbon in the atmosphere in 1997, 90 percent had been put there by the industrialized nations; only reasonable, then, for the same nations to have the lion's share of responsibility for dealing with the problem. But it failed to account for what was about to happen, as Chinese industrialization began to take off. As thousands and then tens of thousands of bulk ships began taking raw materials into China and bringing industrialized goods out to Western markets, the process of industrial consumption of fossil fuels began to shift from the West to the East. Fast-forward, and by 2012 Chinese carbon emissions accounted for 73 percent of cumulative global emissions growth.18 Essentially, the West had outsourced its carbon emissions to China.","zh":"不过，事后回看，气候外交在京都拐错了弯：它把主要发展中国家豁免在外。这一点看上去极其公平——1997年大气中累积的过量碳，90%是工业化国家排放的；那么，由这些国家承担处理该问题的主要责任，也合情合理。但它没有计及即将发生的事情：中国的工业化开始起飞。当成千上万、继而数以万计的散货船开始把原材料运进中国、把工业制成品运往西方市场，化石燃料的工业消费过程便开始从西方转移到东方。快进到2012年，中国的碳排放已占全球累计排放增量的73%。* 说到底，西方把自己的碳排放外包给了中国。"},{"id":"ch13-043","p":275,"t":"p","en":"So, the Kyoto diplomacy left a giant loophole. And then came the second wrong turn: Bush's son, President George W. Bush, unsigned the Kyoto deal. Eventually, President Obama would return the United","zh":"于是，京都外交留下了一个巨大的漏洞。接着是第二个错误转向：布什的儿子、总统乔治·W. 布什撤销了对京都协议的签署。最终，把美国重新带回"},{"id":"ch13-044","p":276,"t":"p","en":"States to the UN climate arrangements, by signing the Paris Climate Accords in 2015; but a mere two years later, President Trump would announce America's withdrawal. His successor, Joseph Biden Jr., restored America's participation in the accords.","zh":"联合国气候安排的是奥巴马总统——他在2015年签署了《巴黎气候协定》；但仅仅两年之后，特朗普总统便宣布美国退出。他的继任者小约瑟夫·拜登又恢复了美国对该协定的参与。"},{"id":"ch13-045","p":276,"t":"p","en":"In short: between 1965, when the Scripps scientists warned President Johnson that we were facing an environmental catastrophe, and 2020, the world saw exactly four years when energy and climate policy was governed by a treaty that encompassed the United States, Europe, and China—far and away the world's largest energy users and thus carbon emitters.","zh":"简而言之：从1965年斯克里普斯科学家警告约翰逊总统我们正面临一场环境灾难，到2020年，这半个多世纪里只有整整四年，能源与气候政策是由一项同时涵盖美国、欧洲和中国的条约来规范的——这三方是全球遥遥领先的最大能源消费国，因而也是最大的碳排放国。"},{"id":"ch13-046","p":276,"t":"p","en":"And so, inexorably, emissions rose, and rose, and rose.","zh":"于是，排放量不可阻挡地上升，上升，再上升。"},{"id":"ch13-047","p":276,"t":"p","en":"Dismayed by the lack of policy action on their findings, one part of the ocean sciences community reacted by flirting with geoengineering--of deliberately manipulating the chemical interactions between the atmosphere and the oceans to manage the rate and the effects of carbon absorption by the seas.","zh":"自己的研究成果迟迟换不来政策行动，一部分海洋科学界人士为此深感沮丧，他们的反应是开始试探地球工程——即蓄意操控大气与海洋之间的化学互动，以管理海洋吸收碳的速率与后果。"},{"id":"ch13-048","p":276,"t":"p","en":"It was at this time that David Victor first came to Scripps, at the invitation of then director Roger Revelle. He recalls his first dinner with Walter Munk at Scripps, in 1990. It was a gathering of the type that happened in that period, but rarely now, when several of the giants of a given field get together simply to work together on whatever projects are on their mind. The conference happened to occur at the same time as the Iraq War, and more specifically that moment in the conflict when the retreating Iraqi army set fire to the Kuwaiti oil fields. That action had turned the Kuwaiti oil fields into a hellscape of spewing flames, fire gushing from oil geysers seemingly unstoppably. American scientists and engineers were rushed to Kuwait to help figure out how to stop the fires. And at Scripps, it occupied the dinner conversation of the gathering of scientists, who were among the first to turn to the still-controversial question of whether it was possible to manipulate the climate to mitigate the effects of a warming planet. Later, David would recall the session:","zh":"戴维·维克托正是在这个时候头一回来到斯克里普斯，是应时任所长罗杰·雷维尔之邀。他记得1990年在斯克里普斯与沃尔特·芒克共进的第一顿晚餐。那是一种在那个年代尚且常见、如今已难得一遇的聚会：某一领域的几位巨人凑在一起，只为就各自心里的课题协同工作。会议恰好与伊拉克战争同时，更确切地说，正赶上冲突中撤退的伊拉克军队点燃科威特油田的那一刻。那场纵火把科威特油田变成了一片喷吐火焰的地狱景象，火柱从油井中喷涌而出，似乎无法遏止。美国的科学家和工程师被紧急派往科威特，协助研究如何扑灭大火。而在斯克里普斯，这件事成了聚在一起的科学家们晚餐桌上的话题；他们属于最早触及那个当时仍具争议的问题的一批人：人类能否操控气候，以减轻地球变暖的影响。后来，戴维这样回忆那次会议："},{"id":"ch13-049","p":276,"t":"p","en":"Lots of the people at the meeting were calculating the climate effects of the Kuwaiti oil fires. But most of the meeting was spent on questions about how to manipulate the climate; geoengineering it got called later. Roger [Revelle] had a crazy scheme in mind to float Styrofoam balls in","zh":"「会上很多人都在计算科威特油井大火的气候效应。但会议大部分时间都花在如何操控气候的问题上；这后来被称作地球工程。罗杰［雷维尔］脑子里有个疯狂的计划：把聚苯乙烯泡沫球漂在"},{"id":"ch13-050","p":277,"t":"p","en":"the ocean and make the dark water brighter (and thus more reflective). That plan failed on several obvious grounds. But other people had other ideas. One guy wanted to dump iron in the oceans—someone did a calculation over lunch to show that might work, with the right other kinds of nutrients that would allow algae to bloom and suck CO2 from the water (and thus from the air). Wally Broecker was often at Scripps too—along with Walter, he was one of the best oceanographers of the last century. That was Scripps at the time—a gathering place for some of the most productive oceanographers of this century, free to exchange ideas. Including some pretty wild ones.19","zh":"海面上，让深色的海水变得更亮（从而反射更多阳光）。那个计划因几个显而易见的理由行不通。但别人另有主张。有个人想往海里撒铁——有人在午饭时算了一笔，说明只要配上合适的其他营养盐，这或许可行：让藻类大量繁殖，从水中（因而也从空气中）吸走二氧化碳。沃利·布勒克（Wally Broecker）也常来斯克里普斯——他和沃尔特一样，是上世纪最优秀的海洋学家之一。当年的斯克里普斯就是这样：那个时代最高产的一批海洋学家在此聚集，自由交换想法，其中不乏相当狂放的想法。*"},{"id":"ch13-051","p":277,"t":"p","en":"None of this went far, though, in part because the science was simply too unwieldy, and the potential risks of getting it wrong very great. To take just one example, a later study of the possibility of deliberately introducing cooling into the atmosphere acknowledged that one of the potential side effects was .. . worldwide nuclear winter.","zh":"不过这些设想都没有走远，部分原因是这门科学实在太笨重难驭，而一旦弄错，潜在风险又极大。仅举一例：后来有一项研究探讨了人为给大气降温的可能性，其中承认，潜在的副作用之一就是……全球性的核冬天。"},{"id":"ch13-052","p":277,"t":"p","en":"Two other strands of work were more serious and more sustained: a deep study of marine biology, and a large-scale effort to develop datarich computer models of the climate.","zh":"另有两条研究脉络更为严肃，也更为持久：一是对海洋生物的深入研究，二是大规模开发数据密集的气候计算机模型。"},{"id":"ch13-053","p":277,"t":"h","en":"Marine Biology, or the League of Extraordinary Women","zh":"海洋生物学：非凡女性联盟"},{"id":"ch13-054","p":277,"t":"p","en":"The first was the start of a serious and sustained effort in marine biology—a detailed, large-scale effort to chart the effects of changing ocean chemistry on the fish, mammals, and plant life supported by the oceans. Although figures like Jacques Cousteau are most famously associated with this phase of work, it was also driven by what we might describe as a league of extraordinary (and not so gentle) women. Most famous of these was Sylvia Earle, whose lifelong attachment to the oceans, willingness to break down gender barriers, and dedication to the careful documentation of ocean biology would ultimately see her become the first woman to serve as chief scientist to NOAA—which, by the time she served there, had become at least as important as if not somewhat more important than the navy's Office of Naval Research as a sponsor of oceanographic and climate science. Earle was also the first modern oceanographer to become a media celebrity, largely on the back of her risky diving expeditions. She agitated for and succeeded in establishing worldwide a number of marine sanctuaries. And she famously convinced the leadership of Google to add an oceans dimension to their groundbreaking mapping app, Google Earth.20","zh":"第一条是海洋生物学上一项严肃而持久的工作的开端——一项细致、大规模的工作，旨在测绘海洋化学变化对海洋所养育的鱼类、哺乳动物与植物生命的影响。虽然雅克·库斯托（Jacques Cousteau）这样的人物与这一阶段的工作联系得最为人熟知，推动它的还有一群我们不妨称之为“非凡（而且并不温婉）女性联盟”的人。其中最著名的是西尔维娅·厄尔（Sylvia Earle）。她终生眷恋海洋，勇于打破性别壁垒，致力于细致记录海洋生物，最终成为美国国家海洋和大气管理局（NOAA）第一位女性首席科学家——而到她任职时，该机构作为海洋学与气候科学的资助方，地位至少已与海军研究办公室相当，甚至略高一筹。厄尔也是第一位成为媒体名人的现代海洋学家，这主要得益于她那些冒险的潜水考察。她奔走呼吁，成功地在世界各地建立了一批海洋保护区。她还曾说服谷歌高层，在他们那款划时代的地图应用谷歌地球（Google Earth）中加入海洋维度，此事广为流传。*"},{"id":"ch13-055","p":278,"t":"p","en":"Earle was herself inspired by another important marine biologist, Rachel Carson. Carson would become better known for her book on chemical pollution on the land, Silent Spring. But her first and arguably more important work was The Sea Around Us-an elegant, even elegiac book about the science of the ocean domain. Although much of the science the book documents has been outstripped, The Sea Around Us still stands as one of the most compelling accounts of the scale, the sense, and the importance of the world's oceans; what Sylvia Earle, who wrote the introduction to the reissued 2018 edition, called her \"lyrical descriptions of the grand processes that underpin the existence of life on earth\"—for indeed, that is what the modern study of marine biology has revealed is at stake in the health of the oceans.21 Consider the opening passage of her account of the interplay between the surface waters and the deeper waters below:","zh":"厄尔本人则受到另一位重要海洋生物学家蕾切尔·卡森（Rachel Carson）的启发。卡森更广为人知的是她那本写陆地化学污染的《寂静的春天》（Silent Spring）。但她第一部、也可以说更重要的作品是《我们周围的海洋》（The Sea Around Us）——一本优雅、甚至带点挽歌气质的书，写的是海洋这门科学。尽管书中记录的许多科学内容此后已被超越，《我们周围的海洋》仍是关于世界海洋的规模、意义与重要性最有说服力的叙述之一；西尔维娅·厄尔为2018年再版写了导言，称之为“对支撑地球生命存在的那些宏大过程的抒情描写”——的确，现代海洋生物学研究揭示的恰恰是：海洋的健康所关乎的，正是这些宏大过程。* 不妨看看她描写表层水与下层深水如何相互作用的那段开篇："},{"id":"ch13-056","p":278,"t":"p","en":"Nowhere in all the sea does life exist in such bewildering abundance as in the surface waters. From the deck of a vessel you may look down, hour after hour, on the shimmering discs of jellyfish, their gently pulsating bells dotting the surface as far as you can see. Or one day you may notice early in the morning that you are passing through a sea that has taken on a brick-red color from billions upon billions of microscopic creatures, each of which contains an orange pigment granule. At noon you are still moving through red seas, and when darkness falls the waters shine with an eerie glow from the phosphorescent fires of yet more billions and trillions of these same creatures.22","zh":"「整个海洋中，生命的繁盛没有一处比得上表层水域那样令人迷乱。你可以一连几个小时从船舷向下望，看水母那微微闪光的圆盘，它们缓缓搏动的伞盖点缀着水面，一直铺到目力所及之处。又或者某天清晨，你会发现自己正驶过一片砖红色的海——那是无数亿万个微小生物染成的，每一个体内都含着一粒橙色色素。正午时分，你仍在红色的海面上航行；待到夜幕降临，海水又因更多亿万个同类生物发出的磷光而泛出幽幽的冷光。*"},{"id":"ch13-057","p":278,"t":"p","en":"Her book is perhaps the single best, most accessible account of the science of the seas, and in particular of the way the swirling, undulating currents of the deep waters of the oceans play with the surface waters, in what she calls “a series of delicately adjusted, interlocking relationships,\"23 to create the photosynthesis, and thus the plankton, and thus the oxygen and the protein that sustain much of human life. (Though her account contains no warnings about climate change.)","zh":"她这本书或许是关于海洋科学最好、最易读的一部叙述，尤其是关于深海翻涌起伏的洋流如何与表层水相互摆荡——她称之为“一系列精细调校、环环相扣的关系”*——由此产生光合作用，进而产生浮游生物，进而产生支撑人类大半生命的氧气与蛋白质。（不过她的叙述中没有任何关于气候变化的警告。）"},{"id":"ch13-058","p":279,"t":"p","en":"Somewhat less famous, but arguably the most influential marine biologist of the modern era, was Jane Lubchenco. After getting her PhD at Harvard, Lubchenco moved to Oregon State University, serving as the chair of the Department of Zoology. Although her research has been wide-ranging, her work on near-coastal marine ecology has proved particularly influential. In 1993, she was given the prestigious MacArthur “genius\" award.24 And then in 2009 she served as the first marine biologist to be president of the NOAA, as part of President Obama's \"Science Dream Team.\" In 2021, President Biden appointed her to a top-level position, coordinating science and climate issues within his White House's Office of Science and Technology Policy.","zh":"名气稍逊、却可以说是当代最有影响力的海洋生物学家，是简·卢布琴科（Jane Lubchenco）。在哈佛取得博士学位后，卢布琴科转到俄勒冈州立大学，出任动物学系主任。她的研究范围很广，而她在近岸海洋生态学方面的工作尤为有影响。1993年，她获得声望卓著的麦克阿瑟「天才」奖。* 2009年，她成为首位出任NOAA局长的海洋生物学家，是奥巴马总统「科学梦之队」的一员。2021年，拜登总统又任命她担任高层职务，在白宫科技政策办公室内统筹科学与气候事务。"},{"id":"ch13-059","p":279,"t":"p","en":"Lubchenco and other marine biologists like her helped the scientific community, and the public, start to understand the effects that climate change was having in real time on the world's environment. It was an endeavor focused on the highly local, the visible, the tactile; on the features of the oceans that can be felt on a human scale. Another part of the oceanographic community was going in an entirely different direction.","zh":"卢布琴科和像她这样的海洋生物学家，帮助科学界与公众开始理解气候变化此刻正在对世界环境造成的影响。这是一项聚焦于极度局地、可见、可触摸之物的努力；聚焦于那些在人所能感受的尺度上呈现的海洋特征。而海洋学界的另一部分人，正朝着完全不同的方向走去。"},{"id":"ch13-060","p":279,"t":"h","en":"The Modelers","zh":"气候模型构建者"},{"id":"ch13-061","p":279,"t":"p","en":"If the marine biologists dwelt on the detailed, lived effects of changing ocean chemistry in specific, real-world locales, another part of the oceanographic community went in an entirely different direction— seeking to model the oceans and the climate as a single, complex system. Ocean and atmospheric scientists started constructing mathematical models of the overall oceans—what became known as global circulation models.","zh":"如果说海洋生物学家所着力描绘的，是海洋化学变化在特定现实地点所产生的具体而切身的效应，那么海洋学界的另一部分人则走向了完全不同的方向：他们要把海洋与气候当作一个单一的复杂系统来建模。海洋与大气科学家开始为整个大洋构建数学模型——这就是后来所称的「全球环流模型」。"},{"id":"ch13-062","p":279,"t":"p","en":"Just as the world of naval warfare was transformed by the evolution of large-scale information technology, so were the climate sciences. This was a story of increased access to computing power, and of big data. To operate a mathematical model of a geophysical system of","zh":"正如海战世界被大规模信息技术的演进而改造，气候科学也是如此。这是一个算力更易获得、大数据兴起的故事。要运行一个地球物理系统的数学模型，"},{"id":"ch13-063","p":279,"t":"p","en":"*Lubchenco also led the White House team that dealt with the huge environmental fallout from the Deepwater Horizon disaster in 2010—a fire and breakdown of one of the world's largest oil rigs, in the Gulf of Mexico.","zh":"*卢布琴科还领导了白宫的工作团队，处理2010年「深水地平线」灾难造成的巨大环境后果——墨西哥湾一座世界最大级别石油钻井平台发生火灾并损毁。"},{"id":"ch13-064","p":280,"t":"p","en":"any complexity requires very large amounts of computing power. And just as part of the ocean sciences community was turning to mathematical modeling, powerful computing capacity became an accessible tool. For many years, the largest single users of computing power were those in the scientific and national security communities who were running simulations of nuclear weapons tests. But next were the climate modelers.","zh":"不论这系统多复杂，都需要极大量的算力。而正当海洋科学界的一部分人转向数学建模时，强大的计算能力恰好成了一种唾手可得的工具。许多年里，算力最大的单一用户是科学界和国家安全界那些运行核武器试验模拟的人。紧随其后的，就是气候建模者。"},{"id":"ch13-065","p":280,"t":"p","en":"Yet there was a lack of data. Until the early twenty-first century, the measurement of the temperature of the oceans was still incredibly episodic. When the Challenger, and the ships of the US Ex-Ex, sought to measure the temperature of the water, they would lower a bucket into the ocean, pull it up, and stick a thermometer into the water. Later, scientists realized that even the nature of the bucket mattered—leather, wood, and metal buckets all affected the temperature of the sampled water in different ways. The science got considerably more sophisticated in the 1980s and '90s, which saw ships sampling water in carefully constructed thermoses. But still, it was episodic and localized.","zh":"然而数据很缺乏。直到21世纪初，海洋温度的测量仍然极其零散。当年「挑战者」号和「美国探险考察队」的船只测水温时，是往海里放下一只桶，提上来，再把温度计插进水里。后来科学家才意识到，连桶的材质都有影响——皮革桶、木桶、金属桶取样，会以各自不同的方式影响所测水温。到20世纪80、90年代，这门技术精细了许多，船只开始用精心制作的保温瓶取样。但它仍然是零散的、局地的。"},{"id":"ch13-066","p":280,"t":"p","en":"That changed, starting around 2000, with the launching of what became known as the Argo system, a program, launched out of Scripps, that fields nearly four thousand remotely operated floats across the globe. These floats dot the world's oceans, providing near-live feedback on temperature and salinity. Once a float is dropped off by a delivery ship, every ten days, an internal battery pumps oil between a reservoir inside the float and an external bladder, making the float descend 1.24 miles. As it returns to the surface, it collects measurements of ocean properties. Once back on the surface, it uses satellites to relay the information to stations onshore.2⁵ In a second phase, Argo also deployed a number of autonomous submarines, which could dive to depths of around two thousand feet, generating for the first time a stream of consistent temperature data from the deeper waters.","zh":"大约从2000年起，随着「阿尔戈」（Argo）系统的启用，情况改变了。这一计划从斯克里普斯发起，在全球布设了近四千个遥控浮标。这些浮标散布在世界各大洋上，近乎实时地回传温度与盐度数据。浮标由补给船投放之后，每隔十天，内置电池便在浮标内胆与外部气囊之间泵送油液，使浮标下沉1.24英里（约2公里）。上浮途中，它采集海洋各项属性的测量数据；回到海面后，再通过卫星把信息中继到岸上站点。* 在第二阶段，阿尔戈还布放了一批自主潜航器，可下潜到约两千英尺深，首次为深层水域源源不断地提供了一致的温度数据。"},{"id":"ch13-067","p":280,"t":"p","en":"With large-scale computing power and big data now available to them, modelers could really get to work on what's called a “general circulation model.\"","zh":"有了大规模算力和大数据可用，建模者这才真正能够动手构建所谓的「通用环流模型」。"},{"id":"ch13-068","p":280,"t":"p","en":"Imagine a single square mile of surface water, perhaps one hundred feet deep. It has a specific chemistry and a specific salinity. It has waves and tides and current. It's interacting with sunlight, sometimes refracted through the clouds, and with the atmosphere as a whole. Simply to depict the dynamics of that single square mile already requires the interplay of multiple variables over time.","zh":"想象一平方英里的表层水，大约一百英尺深。它有特定的化学组成，也有特定的盐度；有波浪、潮汐和洋流。它与阳光——有时是穿过云层折射后的阳光——相互作用，也与整个大气相互作用。仅仅要把这一平方英里的动力学描绘出来，就已经需要多个变量随时间彼此作用。"},{"id":"ch13-069","p":281,"t":"p","en":"Now dive down. At two hundred feet, the chemistry and density are similar, although the temperature is dropping. The water here does not have surface waves, but it is moved by the waves above it, and the current below. Similar patterns hold if you capture a slice of the ocean at three hundred feet, at four hundred, at five hundred.","zh":"现在往下潜。到两百英尺处，化学组成与密度都相近，温度却在下降。这里的水没有表层波，但它被上方的波浪带动，也被下方的洋流推动。你在三百英尺、四百英尺、五百英尺处各取一片海水，情形大体类似。"},{"id":"ch13-070","p":281,"t":"p","en":"By around six hundred feet, the density and chemistry of the waters start to change. What's known as the thermocline layer has its own specific dynamics. Colloquially, it's called the \"twilight zone,\" because although it's substantially darker than at the surface, some light does still penetrate these waters. Now go deeper still: to three thousand feet; to twelve thousand feet; to eighteen thousand feet; and in some places where the ocean floor gives way to trenches, to as much as thirty-three thousand feet. You're measuring the denser, darker dynamics of the deep bottom waters, all the way to the ocean floor.'","zh":"到六百英尺上下，海水的密度与化学组成开始变化。所谓温跃层，有它自己的动力学。通俗地说，它叫「微光带」，因为这里虽然比表层暗得多，却仍有部分光线能透进来。再往深处去：三千英尺；一万二千英尺；一万八千英尺；在某些海底让位于海沟的地方，可深达三万三千英尺。你测量的是深层底水更稠密、更幽暗的动力学，一路量到海底。*"},{"id":"ch13-071","p":281,"t":"p","en":"You also need to go up; to incorporate the interaction with the atmosphere, general circulation models also need to “map” the atmosphere above the surface waters of the ocean.","zh":"你还得往上走。为了纳入与大气的相互作用，通用环流模型还需要把大洋表层水之上的大气「测绘」出来。"},{"id":"ch13-072","p":281,"t":"p","en":"Now you have an extraordinarily detailed and rich depiction of this one square mile of depth. It involves hundreds of thousands of pieces of data conveying a complex picture of that single slice of ocean, from the surface to the deep. But you need to repeat this exercise for every square mile of the ocean—all 139,434,000 of them. And now you have billions of pieces of data going into your model. But you're not done.","zh":"现在，你有了对这一平方英里水柱极其细致、丰富的描绘。它涉及数十万个数据点，呈现出这一片海水从表层到深处的复杂图景。但你必须对海洋的每一平方英里都重复这项作业——总共139,434,000平方英里。这样你的模型里就有了数以十亿计的数据。可你还没完。"},{"id":"ch13-073","p":281,"t":"p","en":"You need to make the data move. The oceans are not static. Every part of them is in constant slow motion. Surface winds create what are known as \"ocean gyres,\" which move large sections of the oceans around in a circular motion (the phenomenon first charted by Walter Munk). River runoffs change the chemistry of the water at its edges, as does glacial melt. There's also interaction with seaborne animal and plant life: phytoplankton is formed on the surface by a complex chemical process born when the deep, cold waters of the ocean bottom mix with the sun-warmed waters of the surface, giving rise to plankton blooms. Fish and sea mammals eat this plankton, and generate what biologists call \"marine snow\"—basically fish poop-which gradually sinks to the bottom, pulling with it large concentrations of chemicals. The middle layers of the oceans absorb this marine snow and become heavier and sink to the bottom. The sinking of the bottom waters pushes huge volumes of currents in every direction, creating what Rachel Carson called the great continental circulation.","zh":"你得让这些数据动起来。海洋不是静止的，它的每一部分都在不停地缓慢移动。表层风造出所谓的「大洋环流圈」，把大片海水以圆周运动的方式搬运开来（这一现象最早由沃尔特·芒克绘成图）。河流的径流改变着边缘海水的化学组成，冰川融水也是如此。还有与海洋动植物生命的互动：深海底部寒冷的海水与阳光晒暖的表层水混合，经由复杂的化学过程在表层生成浮游植物，进而形成浮游生物旺发。鱼类和海洋哺乳动物吃下这些浮游生物，排出生物学家所称的「海雪」——说白了就是鱼粪——它缓缓沉向海底，沿途带走大量浓缩的化学物质。海洋的中层吸收这些海雪之后变重，沉向海底。底水下沉又推动巨量的洋流向四面八方涌去，形成蕾切尔·卡森所说的那种贯通各大洲的宏大循环。"},{"id":"ch13-074","p":281,"t":"n","en":"The scientific terms for these layers are: the epipelagic zone (where sunlight penetrates, mostly along continental shelves); the mesopelagic zone (some light penetration); the bathypelagic zone (along the continental slope); the abyssopelagic zone (colloquially, the abyss), along the ocean basin; and the hadalpelagic zone, in the deep ocean trenches.","zh":"这些水层的科学名称分别是：海洋表层带（epipelagic zone，阳光可透入，多沿大陆架分布）；海洋中层带（mesopelagic zone，有部分光线透入）；海洋深层带（bathypelagic zone，沿大陆坡分布）；海洋深渊带（abyssopelagic zone，俗称深渊），沿大洋盆地分布；以及超深渊带（hadalpelagic zone），位于深海海沟之中。"},{"id":"ch13-075","p":282,"t":"p","en":"Now you have a model of the oceans and of their interactions with the atmosphere, and you can start to tinker and to test. Most important, you can test what happens if you keep adding carbon to the atmosphere at the same rate we are doing now, or if you slow or accelerate those emissions. You can model the effect on ocean salinity as it absorbs that carbon, and on temperature, and on its volume—for warm water takes more volume than cold.","zh":"现在你有了一个关于海洋及其与大气相互作用的模型，可以开始调参、试算。最重要的是，你可以检验：如果我们按眼下这个速度继续向大气排碳，会怎样；如果放慢或加快这些排放，又会怎样。你可以模拟海洋吸收这些碳之后盐度所受的影响、温度所受的影响，以及体积的变化——毕竟暖水占的地方比冷水多。"},{"id":"ch13-076","p":282,"t":"p","en":"And if you add all this up, and add to it the detailed findings of marine biology, what do you learn?","zh":"把这一切汇总起来，再加上海洋生物学的详尽发现，你能得出什么？"},{"id":"ch13-077","p":282,"t":"h","en":"What the Science Tells Us","zh":"科学告诉了我们什么"},{"id":"ch13-078","p":282,"t":"p","en":"First, that the oceans are complex. They're also not a single system, walled off from the rest of the world; they are in constant chemical interaction with the atmosphere, and the cryosphere—what scientists call the world of ice. They also interact with waters from rivers that run off from land and into the surrounding seas. All of this affects the chemistry of specific bodies of water—their temperature, their salinity, and the mix of carbon and other chemicals in the composition of surface waters.","zh":"第一，海洋是复杂的。它也不是一个自成一体、与世界其余部分隔开的系统；它与大气、与冰冻圈——科学家对「冰的世界」的称呼——时刻发生着化学互动。从陆地流入周边海域的河水，同样与它相互作用。这一切都影响着特定水域的化学性质：温度、盐度，以及表层水成分中碳与其他化学物质的配比。"},{"id":"ch13-079","p":282,"t":"p","en":"They also are in constant motion—not just at the surface, but in the deep currents. And the currents and the surface move at different speeds, and with different densities. This interplay between the chemical composition of the deep and the surface waters is key. The general model here is what's known as “thermohaline circulation\"—thermos referring to temperature, haline to salt. As a human being watching the seas and the oceans from the surface, we see wind moving waves, and the earliest study of the oceans focused on the interplay between waves, wind, and swell. But we've learned that the circulation of these great currents is far more important for the patterns of waves and swells and storms, and also, more consequentially, for the overall salinity of the ocean and for sea-level rise.","zh":"它们还始终在运动——不只是表层，深层洋流也在动。而洋流与表层的移动速度不同，密度也不同。深层水与表层水在化学组成上的这种相互作用至关紧要。这里的一般模型，就是所谓的「温盐环流」（thermohaline circulation）——thermo指温度，haline指盐。作为站在海面之上眺望大海的人，我们看到的是风推动波浪；最早的海洋研究，关注的也正是波浪、风与涌浪之间的相互作用。但我们后来认识到，这些巨大洋流的环流，对于波浪、涌浪与风暴的形态要重要得多；而更具后果的是，它对海洋的整体盐度、对海平面上升同样重要。"},{"id":"ch13-080","p":283,"t":"p","en":"When warm air in the atmosphere mingles with the surface waters of the oceans, CO2 in that area has a chemical reaction with the seawater molecules, generating carbonic acid. This immediately causes the CO2 to be absorbed into the oceans—basically sucking CO2 out of the air and into the seas. The CO2 capacity of the oceans is much higher than that of fresh water because of its saltiness. In the deep sea, also, large reservoirs of calcium carbonate sediments neutralize large amounts of that CO2 by partially dissolving it. Over time, literally over centuries, the mixing of this cold, salty water on the bottom and the less salty waters on the top changes the overall balance of salinity, temperature, and carbon concentration in the water. And the ocean's cold, salty water is heavier than the warmer, less salty surface waters, so it sinks to the bottom, forming cold, mineral-rich \"bottom waters.\" The force of that sinking of waters, billions of cubic gallons of it, pushes other waters around the world, causing the circulation of waters-a phenomenon known as convection.","zh":"当大气中的暖空气与海洋表层水混合，那一带的二氧化碳便与海水分子发生化学反应，生成碳酸。这使二氧化碳立刻被吸进海洋——说白了，就是把二氧化碳从空气中抽走，送进海里。由于含盐，海水容纳二氧化碳的能力远高于淡水。在深海中，大量碳酸钙沉积层也通过部分溶解，中和掉大量二氧化碳。随着时间推移——真的是以百年计——海底这层寒冷咸水与上层含盐较淡的水相混合，改变着水中盐度、温度与碳浓度的整体平衡。海洋中寒冷、含盐的水比温暖、盐度较低的表层水更重，于是沉向海底，形成寒冷而富含矿物质的「底水」。那数十亿立方加仑水体下沉所产生的力，推动世界各地的其他水体流动，由此形成水的环流——这一现象称为对流。"},{"id":"ch13-081","p":283,"t":"p","en":"This phenomenon is most powerful in the polar regions and in the North Atlantic. Off the coast of Maine and Canada, the surface waters sink to a depth of around 6,500 feet. There they meet a deepwater layer from the Arctic that has flowed south. Before that surface water sinks, it absorbs vast quantities of heat and carbon and other gases, pulling that down to the bottom waters and then to the seafloor. (Over millions of years, that will turn into oil and gas that we're now drilling from the ocean floor.) But in the time frame of a millennium, to penetrate the deep waters, that sinking carbon-rich water has to mix with the bottom waters, a chemical process known as abyssal mixing. All of this pulls the dense, cold waters of the polar regions southward.","zh":"这一现象在极地海域和北大西洋最为强劲。在缅因与加拿大近海，表层水下沉到约6,500英尺（约2,000米）深处。在那里，它们与一条自北极南下的深层水相遇。下沉之前，这些表层水吸收了大量的热、碳和其他气体，并把它们一并带向底水，再带到海底。（经过数百万年，这些物质会变成石油和天然气——正是我们今天从海底开采的东西。）但若以千年为尺度，这股下沉的富碳水要渗入深层水域，就必须与底水混合，这一化学过程称为深渊混合（abyssal mixing）。这一切把极地稠密、寒冷的海水向南牵引。"},{"id":"ch13-082","p":283,"t":"p","en":"Take all this together, and the effects are profound.","zh":"把这些放在一起看，其影响是深远的。"},{"id":"ch13-083","p":283,"t":"p","en":"For reasons that are not exactly apparent, the number 90 recurs throughout this book. Nearly 90 percent of trade flows by sea. Just over 90 percent of global data moves by undersea cables. And here's another: what the now massive climate models of the oceans and the atmosphere show us is that since 1970 the global ocean has taken up more than 90 percent of the excess heat in the climate system.2⁶ Over historical periods of time, the carbon concentration in the air and the carbon concentration in the water have to move into equilibrium. This can take centuries, but in the shorter term, there's an unfortunate effect. As we have increased the volume of CO2 put out into the atmosphere by the burning of fossil fuels, the rapid rate at which that CO2 is absorbed by the oceans means that the two bodies have come into disequilibrium and at present the oceans cannot absorb CO2 gas as rapidly as we're admitting it into the atmosphere.","zh":"出于某种并不十分清楚的原因，数字90在本书中反复出现。将近90%的贸易经海路运输。略高于90%的全球数据通过海底光缆传输。还有一个：如今那些庞大的海洋与大气气候模型告诉我们，自1970年以来，全球海洋吸收了气候系统中90%以上的多余热量。* 在历史上的长时间尺度上，空气中的碳浓度与水体中的碳浓度终究要趋于平衡。这可能需要几百年；但在短期内，有一个不幸的后果。随着化石燃料燃烧向大气排放的二氧化碳不断增加，海洋吸收这些二氧化碳的速度如此之快，以至于大气与海洋这两个体系已经失衡：目前，海洋吸收二氧化碳气体的速度，已赶不上我们把它排入大气的速度。"},{"id":"ch13-084","p":284,"t":"p","en":"While American politics have so far failed to develop a serious reaction to these findings, the US Navy-original sponsor of the underlying research—has not. The navy's leadership is well aware of its double exposure here. First, it's the frontline service that will have to deal with conflict in the world's energy choke points. Second, it has to worry about its own energy security—it's the largest energy consumer in the US Armed Forces, which is in turn the largest single energy consumer in the world.","zh":"美国政治至今未能对这些发现作出严肃回应，但美国海军——这些基础研究最初的资助者——没有。海军高层很清楚自己在这里的双重暴露。第一，它是前线军种，世界能源咽喉要道上一旦发生冲突，出头应对的就是它。第二，它还得操心自己的能源安全——它是美国武装力量中最大的能源消费部门，而美国武装力量又是世界上最大的单一能源消费者。"},{"id":"ch13-085","p":284,"t":"p","en":"The navy has taken several steps to respond. In 2009, the secretary of the navy announced the creation of what it called the Great Green Fleet—an homage to Roosevelt's Great White Fleet. The navy committed itself to using 50 percent less petroleum by 2015 and pledged that at least 50 percent of all the energy it consumed would come from non-fossil fuel sources by 2020. That year saw the maiden voyage of a carrier strike group using this mix of fuels and other energy conservation methods to demonstrate its potential.27","zh":"海军已采取若干应对措施。2009年，海军部长宣布组建所谓「大绿舰队」（Great Green Fleet）——向罗斯福的「大白舰队」致敬。海军承诺到2015年把石油用量削减50%，并保证到2020年，其消耗的全部能源中至少有50%来自非化石燃料。2020年，一支航母打击群使用这种混合燃料，并辅以其他节能手段，完成了处女航，以展示其潜力。*"},{"id":"ch13-086","p":284,"t":"p","en":"The navy has also supported policy research aimed at identifying the risk posed by climate change in its various mission areas. Admiral Samuel J. Locklear III, who served as the commander of what used to be simply known as Pacific Command (from 2012 to 2015), called climate change the threat most likely to “cripple the security environment, probably more likely than the other scenarios we talk about.\"28","zh":"海军还资助政策研究，以识别气候变化在其各任务领域造成的风险。海军上将塞缪尔·J. 洛克利尔三世（Samuel J. Locklear III）在2012至2015年间出任司令，那时这个机构还只叫「太平洋司令部」；他把气候变化称作最有可能「使安全环境陷入瘫痪」的威胁，“或许比我们谈论的其他情景都更有可能”。*"},{"id":"ch13-087","p":284,"t":"p","en":"And in 2019 the Department of Defense conducted a study of US naval bases' own exposure to rising sea levels. (The previous year, Camp Lejeune and Marine Corps Air Stations Cherry Point and New River had been hit hard by storm surges and flooding during Hurricane Florence.) In February 2019, it released the report showing that of seventy-nine mission-essential installations it reviewed, 67 percent were under current risk of flooding, with that number rising to 76 percent under the likely conditions twenty years out.29","zh":"2019年，国防部就美国海军基地自身面临的海平面上升风险做了一项研究。（前一年，勒琼军营以及海军陆战队樱桃角航空站和纽河航空站在飓风「弗洛伦斯」期间遭到风暴潮与洪水的重创。）2019年2月，国防部发布报告：在其审查的79处任务关键设施中，67%目前已有洪水风险；按二十年后可能的情形推算，这一比例将升至76%。*"},{"id":"ch13-088","p":285,"t":"p","en":"Even an institution as storied and steeped in tradition, though, can't entirely escape the pressures of politics, and in late 2019, under pressure from President Trump's White House, the navy closed down its climate change task force.","zh":"然而，即便是一个如此历史悠久、传统深厚的机构，也无法完全摆脱政治压力。2019年底，在特朗普总统白宫的压力下，海军关掉了自己的气候变化工作组。"},{"id":"ch13-089","p":285,"t":"p","en":"Still, the navy and NOAA between them continue to support and sustain a complex of oceanic, atmospheric, and climate research centers that continue to model the changing climate and its effects.","zh":"不过，海军与NOAA仍在一同支持并维持着一个由海洋、大气与气候研究中心组成的体系，这些中心持续对变化中的气候及其影响进行建模。"},{"id":"ch13-090","p":285,"t":"p","en":"This study of the oceans, and of their interplay with the atmosphere, has become an extraordinarily sophisticated enterprise—one of the most consequential artifacts of modern American power arrayed across a network of more than two hundred institutions, offices, and collaborations on every coast of the country. It's a collection of scientific capacity that would have been unimaginable to Captain Wilkes and the sailors of the US Ex-Ex.","zh":"对海洋、对海洋与大气相互作用的研究，已成为一项极其精密的工程——它是现代美国实力所造就的最具分量的产物之一，铺展在全国每一处海岸线上两百多个机构、办公室与合作网络之中。这样一套科学能力的集合，是威尔克斯上校和「Ex-Ex」的水兵们无法想象的。"},{"id":"ch13-091","p":285,"t":"p","en":"But despite the navy's and NOAA's excellence in this domain, the overall dominance of the US in the ocean sciences has begun to wane. A 2017 study showed the strongest growth in scientific output was in China, Iran, India, Brazil, the Republic of Korea, and Turkey, with China counting as the major new source of publications. Thus, not only are nations competing on the oceans and for their resources, but the origin of scientific study of the sea's properties now reflects the shifting dynamics of world power. Several of these nations, as we've seen, have stakes in naval competition; all of them have stakes in a changing climate.","zh":"然而，尽管海军与NOAA在这一领域表现出色，美国在海洋科学上的整体主导地位已开始衰退。2017年的一项研究显示，科研产出增长最快的是中国、伊朗、印度、巴西、韩国和土耳其，其中中国是新增论文的主要来源。于是，各国不仅在海洋上、为海洋资源而竞争；对海洋属性的科学研究出自何处，如今也映照出世界力量格局的变动。这些国家中有几个，如前所述，与海军竞争利害相关；而它们无一不与变化中的气候利害相关。"}],"notes":[]},{"id":"ch14","label":"Chapter 14","labelZh":"","title":"Hot Waters Rising","titleZh":"第十四章　热水上升","part":"Part IV: The Power of the Seas","showPart":false,"partZh":"第四部","partTitleZh":"海洋的力量","paras":[{"id":"ch14-001","p":286,"t":"p","en":"If oceanographic study has begun to spread beyond the West, so, too, have the locations of interest. One of particular consequence for two powers gaining their sea legs, China and India, is the Andaman Sea— which lies east of the Bay of Bengal, separated from those shallow waters by the Nicobar Islands, and bounded to the east by the long arc of the tropical forests of the Malay Peninsula, where our narrative started.","zh":"如果说海洋学研究已开始越出西方之外，那么受到关注的海域也是如此。对两个刚在海上站稳脚跟的大国——中国和印度——来说，尤其要紧的一处是安达曼海：它在孟加拉湾以东，由尼科巴群岛与那片浅水隔开，东边则以马来半岛热带雨林那道长长的弧线为界——我们的叙事正是从那里开始的。"},{"id":"ch14-002","p":286,"t":"h","en":"Thant House, Rangoon","zh":"仰光的吴丹故居"},{"id":"ch14-003","p":286,"t":"p","en":"Thant Myint-U, the noted historian of modern Burma, has documented the myriad ways in which these two Asian giants compete for resources and influence in what he's termed \"the new crossroads of Asia.\"¹ A peripatetic soul, in normal times Thant is hard to pin down, racing back and forth between Rangoon and Bangkok, with frequent trips to Singapore, New York, London, and Washington (usually clad in a bespoke gray suit seemingly cut from the same tailor that dresses C. H. Tung). Like most everyone else, Thant was grounded by the coronavirus pandemic, which hit Myanmar early in the Asian cycle.","zh":"缅甸现代史的知名学者吴丹敏（Thant Myint-U），曾详尽记录这两个亚洲巨人如何在他所称的「亚洲新十字路口」争夺资源与影响力。¹ 他是个坐不住的人，寻常日子很难约到：在仰光与曼谷之间来回奔波，又常跑新加坡、纽约、伦敦和华盛顿（身上总是一套定制的灰色西装，像是出自给董建华做衣服的那位裁缝之手）。和大多数人一样，疫情把他钉在了原地。新冠疫情在亚洲这一轮传播中来得早，缅甸很早就中了招。"},{"id":"ch14-004","p":286,"t":"p","en":"Thant spent much of the pandemic period in a small apartment overlooking downtown Rangoon. Most days, he would walk the three miles down Rangoon's central boulevard to the colonial bungalow and four acres of gardens that comprise Thant House, which belonged to his grandfather, U Thant, an educator, historian, diplomat, and minister in Burma's first independent government, who became the first secretary general of the United Nations from the developing world.","zh":"疫情期间，吴丹敏大多待在一间俯瞰仰光市中心的小公寓里。多数日子，他会沿着仰光的中央大道走上三英里，去那座由殖民时期平房和四英亩花园构成的「吴丹故居」。宅子原属他的外祖父吴丹（U Thant）——教育家、历史学家、外交家，缅甸独立后第一届政府的部长，后来成为联合国第一位来自发展中国家的秘书长。"},{"id":"ch14-005","p":286,"t":"p","en":"Thant carries something of his grandfather's legacy—an air, not quite of noblesse oblige (for political lineage in Burma does not come with landed wealth), but simply of a depth of comfort in his own skin, and a deep love of his country. Thant was the first “outsider\" to deal with the secretive SLORC regime, which ruled Burma with an iron fist, in its waning days. That time showed him the reality of the intense competition between India and China, which used both their money and savvy diplomacy to curry favor with the regime in Rangoon. (During COVID-19, Rangoon was an early recipient of Chinese supplies, advice, equipment, and financial support. India, for its part, plays to a shared history and cultural heritage, including during a much-publicized visit to the country by Indian prime minister Narendra Modi.)","zh":"吴丹敏身上带着几分外祖父的遗风——那种气度算不上贵人应尽的义务（缅甸的政治家世从不附带田产），而只是一种从容自在的笃定，和对自己国家的深爱。以铁腕统治缅甸、行事隐秘的国家恢复法律与秩序委员会（SLORC）走到穷途末路时，吴丹敏是第一个与之打交道的「外来者」。那段经历让他看清了印中两国竞争之激烈：双方都拿钱和精明的外交去笼络仰光政权。（新冠疫情期间，仰光是较早收到中国物资、建议、设备和资金支持的地方之一。印度则打共同记忆与文化遗产这张牌，印度总理纳伦德拉·莫迪那次广受报道的访缅之行便是如此。）"},{"id":"ch14-006","p":287,"t":"p","en":"The features that make Myanmar attractive to both China and India are two: large estimated reserves of energy, both onshore and off; and the country's long Andaman Sea peninsula. From China's position, access overland to Myanmar's coast would give them a new opening to the Indian Ocean, one that bypasses the Near Seas and the Malacca Strait—and the US fleet. But should China secure such a route, it would put India's navy on the front line of dealing with the PLAN. The Nicobar Islands are India's farthest outpost and the place that the Indian navy first encounters their Chinese counterparts as they sail out through the Malacca Straits. But both nations face a challenge in developing Myanmar's geography for strategic purposes—because both Myanmar and the Nicobar Islands face potential devastation from the changing climate. Of all the places in the world most likely to be profoundly harmed from rising sea levels and increased frequency of storms, the Bay of Bengal and the Nicobar Islands are the most likely to face sustained, wrenching change.","zh":"缅甸之所以同时吸引中国和印度，原因有二：一是陆上与海上据估都蕴藏着大量能源；二是它那条沿安达曼海延伸的狭长半岛。站在中国的角度，经陆路抵达缅甸海岸，等于为通往印度洋开了一个新口子，可以绕过近海诸海和马六甲海峡——也绕过美国舰队。可中国一旦打通这样一条通道，印度海军就会被推到与中国人民解放军海军正面相对的第一线。尼科巴群岛是印度最边远的前哨，也是印度海军经马六甲海峡出海时最先撞见中国同行的地方。但两国想把缅甸的地理条件用于战略目的，都面临一个难题：缅甸和尼科巴群岛都可能被变化中的气候摧毁。在世界上最易因海平面上升和风暴增多而深受其害的地方当中，孟加拉湾与尼科巴群岛最可能经历持久而剧烈的变局。"},{"id":"ch14-007","p":287,"t":"p","en":"One such storm struck on May 1, 2008, when what was officially known as an “Extremely Severe Cyclonic Storm Nargis\" blew across the Bay of Bengal, swamping several of the Nicobar Islands, and gathering speed. It hit the western shore of Myanmar on May 2. The US Navy/Air Force Joint Typhoon Warning Center estimated its maximum wind speeds at 130 miles per hour. Hitting the low-lying delta of the Irrawaddy River, it pushed a storm surge an unimaginable twentyfive miles inland. By morning, 138,000 people had been killed.","zh":"这样一场风暴在2008年5月1日袭来。官方定名为「特强气旋风暴纳尔吉斯」的它横扫孟加拉湾，淹掉尼科巴群岛中的数座岛屿，一路还在加速。5月2日，它撞上缅甸西海岸。美国海军与空军联合台风警报中心估计，其最大风速达每小时130英里。风暴扑向低洼的伊洛瓦底江三角洲，把风暴潮向内陆推了令人难以想象的二十五英里。到第二天早晨，已有138,000人丧生。"},{"id":"ch14-008","p":287,"t":"p","en":"It was not the first time the Bay of Bengal had been wrecked by a cyclone.² Nargis was not even the deadliest cyclone to visit the bay in recent times; in 1970, the Bhola cyclone swept through the Bay of Bengal, made landfall in eastern Bangladesh, and killed an estimated five hundred thousand souls. Still, the scale of devastation caused by Nargis was immense, and changed the course of Burma's history. In the wake of the devastation, the regime had no choice but to open the country to the hundreds of NGOs and dozens of UN agencies clamoring to help. It opened the floodgates of Western money and influence.","zh":"孟加拉湾并不是第一次被气旋摧毁。² 纳尔吉斯甚至算不上近年来造访这片海湾的最致命气旋：1970年，博拉气旋横扫孟加拉湾，在孟加拉国东部登陆，估计夺去了五十万人的性命。尽管如此，纳尔吉斯造成的破坏规模仍然极大，并且改变了缅甸的历史走向。灾后，军政权别无选择，只能向几百家争着要来救援的非政府组织和数十个联合国机构敞开国门。西方资金与影响力的大门就此洞开。"},{"id":"ch14-009","p":288,"t":"p","en":"Among other effects, it caused Thant to focus his attention, and that of his NGO, on a different kind of vulnerability that Myanmar faced; not just the new \"imperial\" competition from its giant neighbors, but from climate change.","zh":"影响之一是，吴丹敏把注意力——也把他那家非政府组织的注意力——转向了缅甸所面对的另一种脆弱：不只是庞邻带来的新的「帝国式」竞争，还有气候变化。"},{"id":"ch14-010","p":288,"t":"p","en":"Sea-level rise and storm surges are bad enough; but with advanced warnings, planning, and adaptive measures, the effects on human life and economic infrastructure can be mitigated. But Thant saw Myanmar experiencing a different phenomenon as well, a change in the patterns of the monsoon rains and alluvial flooding, one of the effects that arises from a complex, but by now well-mapped, interplay between melting sea ice in the world's poles and changing temperatures and salinity of waters worldwide.","zh":"海平面上升与风暴潮已经够糟；但若有提前预警、规划和适应性措施，它们对人命与经济基础设施的冲击是可以减轻的。然而吴丹敏看到，缅甸还在经历另一种现象：季风雨与冲积洪水的规律在变。这源自一场复杂、但如今已描绘得相当清楚的相互作用——地球两极融化的海冰，与全球海水温度和盐度的变化之间的相互作用。"},{"id":"ch14-011","p":288,"t":"p","en":"Throughout Myanmar's recorded history, monsoon flooding predictably hits what's known as the \"dry zone\" during the months of June through September. Moisture blown in from the Andaman Sea and the adjacent Arabian Sea accumulates in the highlands of the Himalayas and Myanmar's northern mountain ranges. Then the winds change course and pull that moisture down through Southeast Asia's great floodplains, the Ganges and the Irrawaddy, in normal years flooding as much as 40 percent of Myanmar's landmass. This creates the necessary conditions for growing rice—the primary source of caloric intake for 2.7 billion people in Asia, supplying as much as 58 percent of the energy intake of several of the region's populations. But the patterns of rain appeared to be shifting.","zh":"在有记载的缅甸历史中，每年6月到9月，季风洪水都会如约漫上所谓的「干旱区」。从安达曼海和邻近的阿拉伯海吹来的水汽，在喜马拉雅高地与缅甸北部山脉积聚；随后风向转变，把水汽沿东南亚两大洪泛平原——恒河与伊洛瓦底江——倾泻而下，正常年份可淹没缅甸多达40%的陆地。这为种稻造就了必要条件。稻米是亚洲27亿人的主要热量来源，在本地区若干人口中提供的能量摄入高达58%。但降雨的规律似乎在变。"},{"id":"ch14-012","p":288,"t":"p","en":"Myanmar was feeling the effects of a series of interlocking oceanic phenomena unraveled by a remarkable piece of oceanographic detective work undertaken by researchers at the Bigelow Laboratory for Ocean Sciences in East Boothbay Harbor, Maine, and at the Naval Postgraduate School, in Monterey, California, just up the coast from","zh":"缅甸感受到的，是一连串相互扣合的海洋现象所带来的影响。这些现象由一场精彩的海洋学「侦探工作」揭开，研究者来自缅因州东布斯贝港的比奇洛海洋科学实验室，以及加利福尼亚州蒙特雷的美国海军研究生院——后者就在沿海岸往北不远处的"},{"id":"ch14-013","p":289,"t":"p","en":"Scripps. At the Bigelow lab, a scholar named Joaquim Goés had funding from NASA to use satellite observations of chlorophyll and sea-surface temperature readings to develop a map of nitrate concentrations in the oceans—part of NASA's contribution to global circulation modeling. His mapping found unusually large blooms of phytoplankton in the Arabian Sea (on the other side of the Indian subcontinent from the Bay of Bengal and the Andaman Sea). That led to the
