ty to control the seas, and is","zh":"罗斯福为彰显美国海军日增的实力，常与阿尔弗雷德·塞耶·马汉会面。* 1890年，时任新成立的美国海军战争学院院长的马汉出版了《海权对历史的影响》（The Influence of Sea Power Upon History）。这部经典之作申论海上主导之要紧，指出强大的海军与强大的商船队两者皆不可缺。马汉的论证从这样一个观念出发：财富始于贸易，国际贸易有赖于海上商业——于是一国积累财富的能力，取决于它控制海洋的能力，也"},{"id":"ch03-109","p":78,"t":"n","en":"The two became so close that when Roosevelt left Washington, DC, to run the Rough Riders, Mahan moved into his home. Peter Karsten, \"The Nature of Influence': Roosevelt, Mahan and the Concept of Sea Power,\" American Quarterly 23, no. 4 (1971), 589.","zh":"两人过从之密，以至于罗斯福离开华盛顿去统领“莽骑兵”（Rough Riders）时，马汉索性搬进了他家。彼得·卡尔斯滕（Peter Karsten）：《“影响力的性质”：罗斯福、马汉与海权概念》，载《美国季刊》（American Quarterly）第23卷第4期（1971年），第589页。"},{"id":"ch03-110","p":79,"t":"p","en":"thus a function of the nation's sea power. He stressed building a bigger navy, building the Panama Canal, and acquiring overseas bases.93","zh":"正是国家海权所决定的。他强调要造更大的海军、开凿巴拿马运河、夺取海外基地。93"},{"id":"ch03-111","p":79,"t":"p","en":"Roosevelt took many of Mahan's policies to heart and began to demonstrate that to the world. The Russo-Japanese War and the launching of the HMS Dreadnought in 1906 helped spur a sense of urgency in growing the US fleet. Under Roosevelt's tenure, the Panama Canal's construction was initiated. And in 1907, Roosevelt sent a US Navy battle fleet across the globe to showcase America's growing naval power. Sixteen battleships, alongside escorts, and some fourteen thousand sailors took part in Roosevelt's \"Great White Fleet\"-so named because Roosevelt ordered that the ships be painted with white hulls, instead of the gray that most other navies were using. The Great White Fleet traveled the course of the seas, making stops in the Americas, the Mediterranean, and Asia. In particular, the voyage was meant to send a signal to the British and to Japan that the US Navy could now deploy around the world.94","zh":"罗斯福把马汉的不少主张记在心上，并开始向世界展示出来。日俄战争与1906年「无畏」号（HMS Dreadnought）的下水，都让人更急切地感到扩充美国舰队的必要。罗斯福任内，巴拿马运河动工。1907年，他派出一支美国海军战列舰队环航全球，炫耀美国日增的海上力量。16艘战列舰，加上护航舰只、约1.4万名水兵，参加了罗斯福的“大白舰队”（Great White Fleet）——得名之由，是罗斯福下令把舰体漆成白色，而不是多数国家海军所用的灰色。大白舰队沿世界航道航行，在美洲、地中海与亚洲各处停靠。这趟远航尤其意在向英国与日本传个信号：美国海军如今已能全球部署。94"},{"id":"ch03-112","p":79,"t":"p","en":"This voyage symbolized a new age in US naval presence and global reach. Then, with the onset of World War I in Europe, the US Navy continued to grow, and not just in vessels; also in people. By the end of World War I, the US Navy had almost five hundred thousand officers and enlisted personnel—the largest naval force in the world.95","zh":"这次远航象征着美国海上存在与全球触达的新时代。随后，欧洲一战爆发，美国海军继续壮大，不只在舰船上，也在人身上。到一战结束时，美国海军已有近50万名军官与士兵——世界上规模最大的海上力量。95"},{"id":"ch03-113","p":79,"t":"p","en":"In 1921 to 1922, in the wake of World War I, the world's greatest naval powers met in what came to be known as the Washington Naval Conference. The meeting was prompted by a drastic shift in the world's naval balance—the Japanese navy was growing, and while the British navy was still technically the world's largest by vessel number, it was becoming obsolete as its vessels aged, and the US had demonstrated its great naval capabilities during the war. Faced with the threat of a potential conflict, representatives of the United States, Japan, China, France, Britain, Italy, Belgium, the Netherlands, and Portugal sat down to try to restrain naval competition. The primary result of the conference was the Washington Naval Treaty, a landmark agreement that tried to prevent another naval arms race by limiting naval construction. It created a tonnage ratio for the countries, outlining the maximum weight of capital ships and aircraft carriers each of the five signatories—Britain, the US, Japan, France, and Italy—could have. The US and Britain were given the largest tonnage allowances—formally recognizing that the United States navy was as powerful as the British.9","zh":"1921年至1922年，一战刚过，世界各海军强国齐聚一堂，即后来所称的华盛顿海军会议。会议缘于世界海上力量对比的剧烈变动——日本海军正在壮大；英国海军按舰船数量算虽仍是世界第一，却随着舰龄老去而日趋过时；美国则在战争中展现了强大的海上能力。面对潜在冲突的威胁，美国、日本、中国、法国、英国、意大利、比利时、荷兰与葡萄牙的代表坐了下来，试图约束海军竞争。会议的首要成果是《华盛顿海军条约》（Washington Naval Treaty），一份里程碑式的协定，意在通过限制造舰来防止又一场海军军备竞赛。条约为各国定下吨位比例，规定五个签字国——英、美、日、法、意——各自可拥有的主力舰与航空母舰的最大吨位。美国与英国获得最大的吨位配额——这等于正式承认，美国海军已与英国海军一般强大。9"},{"id":"ch03-114","p":80,"t":"p","en":"After the war, however, America retreated to a recalcitrant position. Apart from the absence of a wide array of colonial presences (America did have some, beyond the Philippines, especially in the Caribbean), the US ended World War I as the largest global economy. But it had not yet chosen to take on the role of an ordering power or an activist power. The result was twenty years of confusion and retribution and positioning that directly contributed to the descent back into global carnage in the late 1930s.97","zh":"然而战后，美国又退回到一种不合作的姿态。除去缺少遍布各地的殖民地存在（美国在菲律宾之外也确实有一些，尤其是在加勒比），美国是以世界最大经济体的身份走出一战的。但它尚未选择去充当一个建立秩序的力量、一个积极有为的力量。结果是二十年的混乱、清算与彼此站队，直接助推了20世纪30年代后期世界重又坠入屠戮。97"},{"id":"ch03-115","p":80,"t":"p","en":"When the German war broke out in 1939, the American reaction at first was similar to that which kept it out of World War II, with this one critical difference: this President Roosevelt (fifth cousin of Teddy) was determined not to repeat the experience of World War I. Despite the intense political difficulties he encountered in Congress, Franklin Delano Roosevelt was open from the outset to bringing America into the war effort. He worked hard to convince Congress, by scheme and by schmoozing, to help supply Britain during the early phase of its fight with Germany. What emerged first from the interplay between FDR and Churchill, and FDR and Congress, was an executive decision by Roosevelt to agree to what became known as the \"destroyers for bases\" deal—an agreement to lend Britain forty of America's outdated battleships, in exchange for ninety-nine-year agreements on basing rights at British installations in the Bahamas and throughout the Western Hemisphere. Later came the Lend-Lease program by which the American industrial base supplied Britain with ships and matériel for its war effort.98","zh":"1939年德国战事爆发，美国最初的反应，与当年使它置身二战之外的那种反应相仿，只有一处关键的不同：这一位罗斯福（特迪的远房堂弟）决意不重蹈一战的覆辙。尽管在国会遭遇严重的政治困难，富兰克林·德拉诺·罗斯福从一开始就愿意把美国带入战争。他费尽心力，或以计谋，或以交情，说服国会在战事初起阶段援助英国对德作战。先是从罗斯福与丘吉尔、罗斯福与国会的往复之中，产生了罗斯福的一项行政决定：同意达成后来所称的“驱逐舰换基地”交易——出借四十艘美国陈旧战舰给英国，换取在巴哈马及整个西半球的英属设施上为期九十九年的基地使用权。随后是《租借法案》（Lend-Lease），美国工业基础借此向英国的战争努力供应舰船与物资。98"},{"id":"ch03-116","p":80,"t":"p","en":"It took a different naval power, Japan, to bring America into the war.","zh":"把美国拉进战争的，是另一个海上强国——日本。"},{"id":"ch03-117","p":80,"t":"p","en":"From the late 1920s onward, spurred in part by the shock of Commander Perry's excursion into Tokyo Harbor, Japan had been prosecuting an expansionist policy in Asia, taking Manchuria and eventually Shanghai and Nanking in a brutal campaign. Its expansionist role had put it increasingly into loggerheads with the British fleet in Asia. In the late 1930s, Britain began to blockade the Japanese resupply of both oil and rubber, critical elements for its war machine. Japan sought to bust the blockade using its increasingly powerful navy. Then war broke out in Europe and looked to spread across the British Empire. Fatefully, on December 7th and 8th, 1941, Japan launched what it believed would be a knockout blow against both Britain and the United States in Asia, simultaneously attacking British strongholds in Singapore and","zh":"自20世纪20年代后期起，日本在亚洲推行扩张政策，部分缘由是佩里准将闯入东京湾留下的震动：它先取满洲，随后在一场残暴的战事中拿下上海与南京。它的扩张角色使它日益同英国在亚洲的舰队针锋相对。30年代后期，英国开始封锁日本的石油与橡胶补给——这两样都是其战争机器的命脉。日本动用日益强大的海军，试图打破封锁。接着欧洲战火燃起，眼看就要烧遍整个大英帝国。1941年12月7日与8日，日本对其认定的英美在亚洲的致命一击付诸实施，同时进攻英国在新加坡与"},{"id":"ch03-118","p":81,"t":"p","en":"Hong Kong, and US positions in the Philippines, Wake Island, Guam, and Pearl Harbor, Hawaii. While the Japanese attack on Pearl Harbor killed thousands of American sailors and badly damaged the American Pacific Fleet, it famously did not manage to destroy the three US aircraft carriers that were not in the harbor at the time of the attack. They would become the centerpiece of US naval strategy in the Pacific.","zh":"中国香港的据点，以及美国在菲律宾、威克岛、关岛与夏威夷珍珠港的据点。日本对珍珠港的袭击杀死数千名美国水兵，重创美国太平洋舰队，却如众所周知的那样，未能摧毁当时不在港内的三艘美国航空母舰。这三艘航母后来成了美国太平洋海军战略的支柱。"},{"id":"ch03-119","p":81,"t":"h","en":"The Rise of Goliath","zh":"歌利亚的崛起"},{"id":"ch03-120","p":81,"t":"p","en":"After the attack on Pearl Harbor, the US Navy grew tremendously as it fought a two-front war. In Europe, it proved its value, especially in marine landings in Italy and Normandy, playing a key supporting role to US and other Allied ground troops. Meanwhile, in the Atlantic it had to grapple with the challenge of anti-submarine warfare, a vital effort in protecting the flow of convoys to supply the war in Europe.99 It was in the Pacific, though, that the navy really carried WWII, and where the advent of aircraft carriers and naval aviation took hold. The US Navy took the fight to the Japanese fleet in such famous battles as Midway, Coral Sea, and Guadalcanal, and enabled the Allies' “island hopping\" campaign that eventually broke Japanese supply lines and set the stage for victory against Japan.100","zh":"珍珠港遇袭之后，美国海军在两线作战中急剧壮大。在欧洲，它证明了自己的价值，尤其是在意大利与诺曼底的登陆战里，为美国及其他盟国地面部队提供了关键支援。与此同时，在大西洋，它必须应对反潜作战的挑战——那是保障船队畅行、支撑欧洲战事的一项至关重要的工作。99 然而真正让海军扛起二战的，是太平洋战场；航空母舰与海军航空兵也是在那里站稳了脚跟。中途岛、珊瑚海、瓜达尔卡纳尔岛等著名海战中，美国海军把仗打到了日本舰队跟前，并支撑起盟军的“跳岛”战役，最终切断了日本的补给线，为战胜日本铺平了路。100"},{"id":"ch03-121","p":81,"t":"p","en":"By the end of the war, the US Navy had added nearly 1,200 combatant ships—accounting for over 70 percent of the world's total combat vessels.101 More than that, it had practiced and demonstrated its ability (and willingness) to conduct global naval combat. Combined with the American role in the ground war in Europe, US conduct in World War II proved that it was the leading global power, on land and on water. It emerged from the war stronger than when it had entered it. America had defeated the second-most powerful navy of the day, Germany; it had also defeated the most powerful naval actor in Asia, Japan; it had done so with the help of a former naval contender, Russia. What's more, it had done so in close collaboration with what was in military and colonial terms the dominant global power of the day, Britain.","zh":"到战争结束时，美国海军新增了近1,200艘战斗舰艇——占世界战斗舰船总数的七成以上。101 不止如此，它还演练并展示了遂行全球海战的能力（以及意愿）。再加上美国在欧洲地面战中的角色，美国在二战中的表现证明，无论陆上还是水上，它都是首屈一指的世界强国。它走出战争时，比走进战争时更强。美国击败了当时第二强大的海军德国，也击败了亚洲最强大的海上力量日本；而它做这一切，得到了昔日海上竞争者俄国的帮助。更有甚者，它是在与当时军事与殖民意义上的全球头号强国英国的紧密协作中做到这些的。"},{"id":"ch03-122","p":81,"t":"p","en":"Over the course of its long dominance of the high seas, Britain had acquired a network of ports, bases, resupply depots, and fueling stations to power and support its global fleet; now it made much of that network available to the United States. The US Navy almost literally had the seas to itself. It quickly consolidated its position by solidifying its bases in Japan (Okinawa), the Philippines (Subic Bay), northern Europe (Iceland), and so on. And as it did so, it began to take over Britain's previously dominant position in the Middle East.102 Writing in 1947, British foreign minister Ernest Bevin noted, \"The US is in the position today where Britain was at the end of the Napoleonic Wars.\"103 America had replaced Britain as the dominant power on the world stage.","zh":"在长期主宰公海的岁月里，英国积攒起一张由港口、基地、补给站与加油站织成的网络，为其全球舰队提供给养与支撑；如今，它把这张网络的大部分向美国敞开。美国海军几乎真可以说是独享七海。它迅速巩固阵地：在日本（冲绳）、菲律宾（苏比克湾）、北欧（冰岛）等地夯实基地。与此同时，它开始接管英国此前在中东的主导地位。102 1947年，英国外交大臣欧内斯特·贝文（Ernest Bevin）写道：“美国今天的处境，正是英国在拿破仑战争结束时的处境。”103 在世界舞台上，美国已取代英国成为主导力量。"},{"id":"ch03-123","p":82,"t":"p","en":"As it did all of this, the United States—and specifically the US Navy—would take on two key roles, one inherited from the Royal Navy: as the global guarantor of the flow of trade and as the guarantor of the free flow of energy. These remain fundamental to the dynamics of American power to this day.104","zh":"在做这一切的同时，美国——具体说是美国海军——承担起两项关键角色，其中一项承自皇家海军：作为全球贸易流通的担保者，以及能源自由流通的担保者。这两项至今仍是美国力量运行的根本。104"},{"id":"ch03-124","p":82,"t":"p","en":"Two events-one summit and one war—exemplified and solidified this change. Both took place in the Suez Canal. The interplay between global power and command of the seas was central to both.","zh":"两件事——一场峰会、一场战争——为这一转变作了例证，也把它固定下来。两件事都发生在苏伊士运河。全球权力与制海权之间的相互作用，在两者中都是核心。"},{"id":"ch03-125","p":82,"t":"h","en":"Back to Suez","zh":"重返苏伊士运河"},{"id":"ch03-126","p":82,"t":"p","en":"The first was a summit between key leaders. It took place in secrecy, received little press or diplomatic coverage when it became known, and is neglected in accounts of how international order was forged in the wake of World War II. Yet it began a relationship central to geopolitics for seventy years.105 It shaped the fate of the Middle East, the global oil trade, and the projection of American power in the postwar world.","zh":"先是一场几位关键领袖之间的峰会。它会于秘密之中，消息传出后也很少得到媒体报道与外交界的关注，在讲述二战之后国际秩序如何铸成的著述里也常被忽略。然而它开启了一段此后七十年间居于地缘政治核心的关系。105 它塑造了中东的命运、全球石油贸易，以及战后美国力量的投送。"},{"id":"ch03-127","p":82,"t":"p","en":"The date was February 14, 1945, just days after US president Franklin D. Roosevelt's fateful talks in Yalta with Prime Minister Winston Churchill of Britain and Premier Joseph Stalin of the Soviet Union. The site was the USS Quincy, afloat in the Great Bitter Lake in the Sinai Peninsula, part of the Suez Canal system. On board, FDR and a delegation of admirals and advisers awaited their guest. Earlier, the USS Murphy had steamed to Jeddah, Saudi Arabia, to fetch him. It was a sign of the limited contact between the United States and Saudi Arabia at the time that the US Navy had no up-to-date chart of Jeddah's harbor, and little diplomatic presence in Saudi Arabia to secure one. The navy had to borrow a chart from the Arabian American Oil Company, better known as ARAMCO (and the Standard Oil Company of California before that).106","zh":"时间是1945年2月14日，距美国总统富兰克林·D. 罗斯福在雅尔塔与英国首相温斯顿·丘吉尔、苏联部长会议主席约瑟夫·斯大林那场决定命运的会谈不过数日。地点是「昆西」号（USS Quincy），停泊在西奈半岛的大苦湖上，属苏伊士运河体系的一部分。舰上，罗斯福与一队海军上将及顾问等候着他们的客人。此前，「墨菲」号（USS Murphy）已驶往沙特阿拉伯的吉达去接他。有一个细节颇能说明当时美沙接触之有限：美国海军手上没有一张吉达港的现行海图，美国在沙特的外交存在也少得无从取得一张。海军只好向阿拉伯-美国石油公司（Arabian American Oil Company，简称 ARAMCO，其前身为加利福尼亚标准石油公司）借了一张。106"},{"id":"ch03-128","p":83,"t":"p","en":"At Jeddah, the Murphy boarded its passengers—forty-eight men, seven sheep, and one large, ornate throne. Just before midday on the fourteenth, the Murphy rendezvoused with the Quincy, and this throne was hoisted across. Its owner was King Abdulaziz Ibn Saud, the founder of Saudi Arabia. This was the first and only meeting between the president and the king, and the first time that the king had left his country. In Jeddah, rumors flew that the king had absconded or been kidnapped by the Americans. The ladies of his harem went into ritual mourning at the thought their protector would never return.","zh":"在吉达，「墨菲」号载上它的乘客——四十八名男子、七只羊，还有一张硕大而华丽的宝座。十四日正午前不久，「墨菲」号与「昆西」号会合，那张宝座被吊运过去。宝座的主人是沙特阿拉伯的缔造者阿卜杜勒-阿齐兹·伊本·沙特国王。这是总统与国王第一次也是唯一一次会面，也是国王第一次离开自己的国家。吉达一时流言四起，说国王已经潜逃，或者被美国人绑走了。后宫的嫔妃们想到她们的庇护者再不会回来，便依礼举哀。"},{"id":"ch03-129","p":83,"t":"p","en":"The meeting between the two leaders lasted for four hours. Discussion focused on the fate of Jewish refugees from Europe and whether the king would support the notion of a Jewish homeland in Palestine (he did not). The two leaders also discussed agriculture—President Roosevelt offered to assist King Abdulaziz with the technology that would be needed to irrigate Saudi Arabia and generate an agricultural industry (an offer the king politely spurned, telling the president he was too old to become a farmer). Those policy issues may not have been advanced, but international politics is sometimes about personality, not policy. Roosevelt charmed the Saudi leader. He also convinced him that the United States was not looking for a relationship of dominance in the region, but one of openness and mutual support. The question of oil was not discussed.","zh":"两位领袖的会谈持续了四个小时。讨论集中在来自欧洲的犹太难民的命运，以及国王是否支持在巴勒斯坦建立一个犹太人家园的设想（他不支持）。两位领袖还谈到了农业——罗斯福总统提出，可以援助阿卜杜勒-阿齐兹国王所需的技术，用来灌溉沙特阿拉伯、办起一个农业产业（国王婉言谢绝了，说自己年纪太大，做不成农夫了）。这些政策议题也许并无进展，但国际政治有时靠的是人格，而非政策。罗斯福赢得了这位沙特领袖的好感。他还让对方相信，美国所求的不是在该地区的支配关系，而是开放与相互支持的关系。石油问题没有谈。"},{"id":"ch03-130","p":83,"t":"p","en":"And yet oil was the point of the meeting. The king knew very well what the president was subtly proposing. The United States had supplied much of the oil consumed by Allied forces during World War II, but the strain had been keenly felt, despite unprecedented cooperation between government and industry to keep supplies flowing. Roosevelt knew it was important for the United States to diversify its own supply and to resist British moves to shut American oil companies out of the Middle East. Within weeks of the meeting on Great Bitter Lake, the Saudis would grant ARAMCO their preferred path for a pipeline from the kingdom's main oil fields in Dhahran toward the Mediterranean, allowing the flow of Saudi oil to Europe and later the United States. Tapline (the Trans-Arabian pipeline) was operational by 1950; American investors provided the capital and the expertise and, in early years, at least, took the bulk of the profits.107 The United States, meanwhile, began construction of an airfield in Saudi Arabia, a visible show of its security commitment to the king.","zh":"然而石油正是这场会面的要害。国王心里很清楚总统在委婉地提议什么。二战期间，盟军消耗的石油很大一部分由美国供应，尽管政府与产业界空前合作以保证供应不断，压力仍感受得十分真切。罗斯福明白，美国必须使自身的供应多元化，并抵制英国把美国石油公司挤出中东的举动。大苦湖会面后不过数周，沙特方面便给了 ARAMCO 一条它中意的线路，铺设一条从达兰主要油田通往地中海的输油管道，让沙特石油流向欧洲，后来又流向美国。跨阿拉伯输油管道（Tapline）于1950年投入运营；美国投资者出资本、出技术，至少早年拿走了大部分利润。107 与此同时，美国开始在沙特修建一座机场，这是它对国王的安全承诺一次看得见的展示。"},{"id":"ch03-131","p":84,"t":"p","en":"Churchill reacted with fury when he discovered the American president was meeting the Saudis behind his back and hastily organized his own summit to re-exert control. But this went poorly after he drank and smoked cigars in the king's presence, underlining the image of British insensitivity and arrogance. King Abdulaziz was convinced that his country's future lay in partnership with a country that embraced the future, not one that was tied to a colonial past.108","zh":"丘吉尔发现美国总统背着自己与沙特人见面，勃然大怒，急忙安排了自己的峰会，想重新把握主动。但事情办得不妙：他在国王面前饮酒、抽雪茄，愈发坐实了英国人麻木而傲慢的形象。阿卜杜勒-阿齐兹国王由此确信，自己国家的未来在于同一个面向未来的国家结伴，而不是同一个困在殖民往昔里的国家。108"},{"id":"ch03-132","p":84,"t":"p","en":"These events represented the start of a strategic and economic partnership: an American guarantee of security for Saudi Arabia in exchange for Saudi de facto guarantees about the free flow of oil. It was a relationship that put the United States-for good and bad-at the heart of the Arab world and pushed Britain to the sidelines. The Saudis received reassurance that they would be protected from neighbors who coveted Saudi oil riches (a commitment that bore its greatest fruit when Iraq invaded Kuwait decades later). The United States gained a bulwark against Soviet influence in the Middle East, as its military provided a security guarantee to the region.109 Saudi willingness to act as a swing producer of oil, and US determination to secure Middle Eastern supplies, were fundamental to the architecture of global economics and international security in the late twentieth century and into the twenty-first. They bound together an authoritarian and secretive kingdom and the country that led the free world. And they gave the United States a critical role in global affairs, as the guarantor of the flow of oil to the economies of the West.110","zh":"这些事件标志着一场战略与经济伙伴关系的开端：美国为沙特提供安全担保，换取沙特对石油自由流通的事实上的保证。这段关系把美国——无论好坏——放到了阿拉伯世界的中心，把英国挤到了边上。沙特人得到了安抚：他们不会任由觊觎沙特石油财富的邻国欺凌（这项承诺在数十年后伊拉克入侵科威特时结出了最大的果实）。美国则在军事上为该地区提供安全担保，从而获得一道抵御苏联在中东影响的屏障。109 沙特愿意充任石油的机动生产者，美国决心保障中东的供应，这两点是20世纪后期直至21世纪全球经济架构与国际安全架构的基石。它们把一个专断而隐秘的王国与领导自由世界的国家绑在了一起。它们也让美国在全球事务中担起一个关键角色：西方各经济体石油供应的担保者。110"},{"id":"ch03-133","p":84,"t":"p","en":"And then even more dramatic events in the Suez Canal would crystalize the shift from British to American hegemony in world affairs.","zh":"此后，苏伊士运河上更为戏剧性的事变，把世界事务中从英国霸权向美国霸权的转移彻底定了型。"},{"id":"ch03-134","p":84,"t":"p","en":"During World War II, Britain had closed the Suez Canal to enemy trade, and the access to the canal was a major strategic advantage for the Allied powers, hampering Germany. The canal reopened after the war, and trade resumed. But the patterns of fighting had shifted more than just the relative power of the United States. The end of the Second World War was also the beginning of the end of the system of European colonial dominance. In 1947, desirous of hastening the British","zh":"二战期间，英国对敌方贸易关闭了苏伊士运河，而运河的通行权是盟国的一大战略优势，令德国备受掣肘。战后运河重新开放，贸易恢复。但战争格局的变动，改变的不只是美国的相对实力。第二次世界大战的结束，也是欧洲殖民支配体系走向终结的开端。1947年，急于加快英国"},{"id":"ch03-135","p":85,"t":"p","en":"Empire's exit from India, Viceroy Mountbatten brought India's independence forward to August 15, 1947, partitioning the country along religious lines (and sparking mass violence and migration along the way) while doing so. This liberation was quickly followed by the granting of independence by their respective colonial powers to Burma (1948), Indonesia (1949), and Libya (1951)—often under immense international pressure. What British prime minister Harold Macmillan once called \"the winds of change\" blew through Europe's colonial possessions in Africa, Latin America, the Caribbean, and Asia. And those winds also blew through the Middle East, and into Cairo, where in 1952 a revolution overthrew King Farouk and ejected the British army, returning Egypt to its status as a fully independent nation.111","zh":"帝国撤出印度的步伐，蒙巴顿勋爵（Viceroy Mountbatten）把印度的独立提前到1947年8月15日，并在仓促之间按宗教界线把这片次大陆分割开来（沿途激起了大规模的暴力与迁徙）。这场解放之后，缅甸（1948年）、印度尼西亚（1949年）、利比亚（1951年）相继由各自的殖民宗主国准许独立——往往是在巨大的国际压力之下。英国首相哈罗德·麦克米伦后来所称的“变革之风”，吹遍了欧洲在非洲、拉丁美洲、加勒比与亚洲的殖民地。这股风也吹过中东，吹进开罗：1952年，一场革命推翻了法鲁克国王，赶走了英国军队，埃及重又成为完全独立的国家。111"},{"id":"ch03-136","p":85,"t":"p","en":"The Suez Canal, however, remained under international control, and still subject to the international agreements established in the Convention of Constantinople. That state of affairs held for the first decade after World War II. But as the revolutionary leader Gamal Abdel Nasser consolidated power in Egypt, the equation began to change. Nasser had been an integral part of the 1952 revolution, but only took over as president in 1954, as part of a three-year transitional arrangement. In 1956 he was elected to the presidency. And in July of that year he announced that he had decided to nationalize the canal.","zh":"然而苏伊士运河仍处于国际共管之下，仍受《君士坦丁堡公约》所立各项国际协定的约束。这种局面维持了二战后的头十年。但随着革命领袖贾迈勒·阿卜杜勒·纳赛尔在埃及集权，等式开始变化。纳赛尔是1952年革命的中坚人物，但直到1954年才依一项三年过渡安排接任总统。1956年，他当选总统。同年7月，他宣布已决定将运河收归国有。"},{"id":"ch03-137","p":85,"t":"p","en":"Nasser's decision sparked a full-blown international crisis. In London, Prime Minister Anthony Eden consulted with his influential foreign secretary, Baron Selwyn-Lloyd, and his parliament. Eden found that the country, otherwise divided on foreign policy, was united on the view that Egypt could not be allowed to nationalize the canal. Most fundamentally—a theme we will come back to-the closure of the canal risked interrupting the flow of oil from Saudi Arabia to London, which would in turn imperil the British economy. France, too, was affected by the risk—like England, its economy had also become dependent on the flow of oil from the Middle East, via the Suez.11² London and Paris began to conspire on their response.","zh":"纳赛尔的这一决定引发了全面爆发的国际危机。伦敦，首相安东尼·艾登与他颇具影响力的外交大臣塞尔温-劳埃德男爵（Baron Selwyn-Lloyd）商议，也与议会商议。艾登发现，这个国家在外交政策上素来分歧，此刻却一致认为：不能任由埃及把运河国有化。最根本的一点——也是我们后文还要回到的主题——运河一旦关闭，从沙特阿拉伯运往伦敦的石油就可能中断，英国经济也就要跟着遭殃。法国同样被这一风险牵动——与英国一样，它的经济也已依赖经苏伊士而来的中东石油。112 伦敦与巴黎开始密谋对策。"},{"id":"ch03-138","p":85,"t":"p","en":"Another player in the game was Israel, newly forged as an independent nation in 1946, and already once attacked by the Arab states, literally days into its birth as a nation. Its enmity with the Arab states, and above all with Egypt, continued unabated. It saw in Nasser's nationalism and his desire to establish full Egyptian sovereignty in the canal a direct threat to its own survival.113 In secret, the United Kingdom, France, and Israel plotted to deal with Nasser's challenge.","zh":"这场博弈里还有一方：以色列。它1946年才建成为独立国家，立国不过数日便遭阿拉伯国家攻击。它与阿拉伯国家、尤其是与埃及的敌意从未稍减。它从纳赛尔的民族主义、从他要在运河上确立埃及完全主权的意愿中，看到了对自身生存的直接威胁。113 英国、法国与以色列秘密策划，要对付纳赛尔的挑战。"},{"id":"ch03-139","p":86,"t":"p","en":"In October 1956, when Nasser repeated his threat of nationalization, Israel moved quickly to block his action, sending several tens of thousands of Israeli troops into the Sinai Peninsula to gain control of the eastern bank of the Suez Canal. As they had secretly agreed, the next day the UK and France called for a cease-fire. And when, within twenty-four hours, Egypt had not responded, the UK and France also moved forces into the Sinai Peninsula. Operation Musketeer saw tens of thousands of British and French troops join Israeli troops in the Sinai.114","zh":"1956年10月，纳赛尔重提国有化的威胁，以色列迅速出手阻止，把数万以军开进西奈半岛，夺取苏伊士运河东岸。次日，英法如事先密约，呼吁停火。埃及二十四小时内未作回应，英法随即也把军队开进西奈半岛。“火枪手行动”（Operation Musketeer）中，数万英法军队与以军在西奈会合。114"},{"id":"ch03-140","p":86,"t":"p","en":"What Eden had not counted on was the scale and fury of the Soviet reaction. A decade after their wartime alliance, the US and UK had already moved into a Cold War with the Soviet Union. The Suez Crisis was one of the first moments when the Cold War might have escalated into actual conflict. Soviet Premier Nikita Khrushchev had been courting a relationship with Nasser in Egypt, and he saw the UK's move as a design to block Russian advances, which it partially was. In a fury, Khrushchev threatened a nuclear response in Western Europe.115","zh":"艾登没有料到的是苏联反应的规模与烈度。战时同盟过去才十年，美英已与苏联进入冷战。苏伊士危机是冷战最早有可能升级为真正冲突的时刻之一。苏联部长会议主席尼基塔·赫鲁晓夫一直在笼络埃及的纳赛尔，他把英国的举动看作阻挠俄国推进的图谋——其中也确实有几分是。赫鲁晓夫大怒，威胁要在西欧动用核武器。115"},{"id":"ch03-141","p":86,"t":"p","en":"The Soviet reaction meant that the Suez Crisis in turn became an American problem. The United States had ended World War II as the largest power in the world, the largest economy in the world, and with the largest navy in the world, and so it, too, had vital stakes in the Suez—as it did in deterring and containing Soviet reactions. And so the critical player quickly became US President Dwight D. Eisenhower. If Eden was surprised by Khrushchev's reaction, he was shocked by Eisenhower's. Against the opposition of the Democrats in Congress and of his own secretary of state, Dean Acheson, Eisenhower threatened to sanction the UK, France, and Israel if they didn't back down from their dangerous stance. The UK and France relatively quickly withdrew their forces. Some months later, so, too, did Israel, although only after securing Eisenhower's backing for an Egyptian guarantee that Egypt would preserve Israeli interests in the Sinai and the surrounding waters.","zh":"苏联的反应，使苏伊士危机反过来变成了美国的问题。美国是带着世界头号强国、头号经济体与头号海军的身份走出第二次世界大战的，因此苏伊士对华盛顿同样利害攸关——正如威慑并遏制苏联的反应对它利害攸关一样。于是，关键的玩家很快换成了美国总统德怀特·D. 艾森豪威尔。艾登对赫鲁晓夫的反应是意外，对艾森豪威尔的反应则是震惊。艾森豪威尔不顾国会民主党人与他自己那位国务卿迪安·艾奇逊的反对，扬言英国、法国和以色列若不从危险的立场上退下来，美国就要对它们实施制裁。英法两国撤军还算快。几个月后以色列也撤了，但撤之前先换来了艾森豪威尔的支持，让埃及作出保证：埃及将维护以色列在西奈及周边水域的利益。"},{"id":"ch03-142","p":86,"t":"p","en":"The episode is widely viewed by historians of the period as that moment when what remained of Britain's imperial influence collapsed, and the full weight of Americas global muscle became apparent.16 Soviet Premier Khrushchev backed down, although he did secure a UK/ French withdrawal from the Sinai. At the recently established United Nations, the Security Council agreed to deploy a neutral force to the peninsula to help keep the peace—the birth of modern peacekeeping. And Egypt ended the episode with international recognition of its ownership of the canal, although also with conditionalities on that ownership.\" A new international convention oversaw the deployment of a UN Emergency Force to the Sinai and guaranteed free passage in the Suez Canal.117","zh":"研究这一时期的历史学家普遍把这一刻看作英国残存的帝国影响力就此崩塌、美国全球实力的全部分量显露无遗的转折点。16 苏联部长会议主席赫鲁晓夫退了让，不过他也确实换来了英法从西奈撤军。在成立不久的联合国，安理会同意向该半岛派出一支中立部队协助维持和平——现代维和行动由此诞生。埃及则为这场危机收了个尾：国际社会承认运河归它所有，尽管这项所有权也附有条件。一项新的国际公约对联合国紧急部队开赴西奈作了安排，并保障苏伊士运河的自由通行。117"},{"id":"ch03-143","p":87,"t":"p","en":"America came out of the Suez episode firmly established as the global power, willing and able (by dint of its naval reach) to deploy military force to the other side of the world, including to secure its interests in the free flow of oil and the free flow of trade.118 As Lincoln Paine wrote, \"As was true of Portugal in the sixteenth century, the US fleet exists to project power and safeguard trade, not to fight fleets of comparable capabilities because there are none.\"119 And the US Navy inherited, bought, or borrowed (in some cases, by applying considerable pressure) several of Britain's network of bases and fueling stations—from Diego Garcia, in the midst of the Indian Ocean, to Sembawang naval facility, in Singapore.","zh":"经过苏伊士这一场，美国稳稳坐实了全球强国的地位：它有意愿，也有能力（凭借海军所能触及的范围）把军事力量投送到世界的另一端，其中也包括以此保障它在石油自由流通与贸易自由流通上的利益。118 正如林肯·佩恩（Lincoln Paine）所写：“一如16世纪的葡萄牙，美国舰队的存在是为了投送力量、护卫贸易，而不是为了同能力相当的舰队交战，因为这样的舰队根本不存在。”119 美国海军还继承、购买或借用（有几处是靠施加了相当大的压力）了英国基地与加油站网络中的若干处——从印度洋中部的迪戈加西亚（Diego Garcia），到新加坡的三巴旺（Sembawang）海军设施。"},{"id":"ch03-144","p":87,"t":"p","en":"But if the Suez Crisis solidified America's role as the hegemon in world affairs, it did something else as well. It fired a warning shot across the bows of the global shipping business and the countries that depended on it. The closure of the canal for eight months was a major blow to global trade. Restrictions not just on the flow of oil but on the flow of industrial goods through the Suez caused a major downturn in global trade during the months of the closure. Global business let out a huge sigh of relief when the canal was reopened in March of 1956.120","zh":"然而苏伊士危机在巩固美国世界事务霸主地位的同时，还做了另一件事：它朝全球航运业以及依赖航运的各国船首，放了一响警告炮。运河一关八个月，对全球贸易是一记重击。受限的不只是石油的流通，还有经苏伊士往来的工业品，闭关期间全球贸易因此大幅下滑。1956年3月运河重新开放，全球商界长舒了一口气。120"},{"id":"ch03-145","p":87,"t":"p","en":"Much worse was to come.","zh":"更糟的还在后头。"},{"id":"ch03-146","p":87,"t":"p","en":"*In this, while Egypt lost the war militarily, it won politically: not the last time this pattern would eventuate in the West's Middle East wars.","zh":"*就此而言，埃及在军事上输掉了战争，在政治上却赢了：这种格局在西方历次中东战争中还将一再上演，这并非最后一次。"}],"notes":[]},{"id":"pt2","label":"Part II Opening","labelZh":"部前小引","title":"On the Madrid's Monkey Island, Singapore Strait","titleZh":"开篇　马六甲海峡，“马德里”号的猴岛","part":"Part II: To Contain the World, 1956-2017","showPart":true,"partZh":"第二部","partTitleZh":"围堵世界（1956—2017）","paras":[{"id":"pt2-001","p":91,"t":"h","en":"On the Madrid’s Monkey Island, Singapore Strait","zh":"新加坡海峡：马德里马士基号的猴岛"},{"id":"pt2-002","p":91,"t":"p","en":"The best vantage point from any ship at sea is what's known by mariners as a monkey island. In the days of sail, the monkey island was usually a small platform or basket, large enough to hold a man, lashed two-thirds up the main mast, a place from where sailors could scan the horizon by telescope or the naked eye. On modern ships, it's simply the roof above the captain's bridge, the highest point on the ship, accessed by a set of steep metal stairs off the bridge deck. It's still used for navigation, though, as this is where a ship's radar towers and radio antennas and satellite beacons are housed. When standing atop the monkey island of the Madrid Maersk, an ultra-large container ship, you're looking out over the oceans from a height of 230 feet, and you command an unbroken view of the surrounding seas.","zh":"海上任何一艘船，最好的观景点都是水手们所说的“猴岛”（monkey island）。帆船时代，猴岛通常是绑在主桅三分之二高处的一只小平台或吊篮，刚够容下一个人，水手就在那里用望远镜或肉眼扫视海平线。到了现代船上，它不过是驾驶台顶上那层露天平台，是整艘船的最高处，从驾驶台甲板攀一段陡直的铁梯才能上去。不过它至今仍用于导航——船上的雷达塔、无线电天线和卫星信标都架设在这里。站在马德里马士基号这艘超大型集装箱船的猴岛顶上，你便在 230 英尺（约 70 米）的高处眺望大洋，四下的海面一览无余，毫无遮拦。"},{"id":"pt2-003","p":91,"t":"p","en":"At the mouth of the Singapore Strait, where the warm waters of the South China Sea mingle with those of the Java Sea, that's a view that's absolutely choked with ships. Hundreds of them, from small fishing junks to large oil tankers to giant container vessels. All of them maneuvering for space in the narrow channel of the strait, eighty-two feet deep in the shipping channel. On any given day, more than two thousand merchant vessels of all classes transit these waters.","zh":"在新加坡海峡的入口，南海温暖的海水与爪哇海的水在此交汇，眼前的海面被船只塞得水泄不通。成百上千艘——从挂着风帆的小渔船，到大型油轮，再到巨型集装箱船。它们全都在海峡狭窄的航道里争抢空间，主航道水深 82 英尺（约 25 米）。平日里，每天都有 2,000 多艘各类商船穿行这片水域。"},{"id":"pt2-004","p":91,"t":"p","en":"At night, each of them displays both running and signal lights, green on the starboard side and red at port, to reveal direction; white on the masthead, to show position. From the bridge below comes a steady stream of navigational commands from the Singaporean Coast Guard, their English calm and precise, unflustered by the constant punctuation of urgent and angry calls from ship captains jostling for advantage. Far from the calm seas, it's a view more reminiscent of looking down from an office tower to the angry honking and snarl of New York City rush hour traffic. From there, ships sail past the vibrant lights of Singapore's downtown towers, northeast into the South China Sea, or southwest into the Malacca Strait. In any given hour, more than one hundred ships carrying cargo worth several tens of billions of dollars maneuver around Horsburgh Lighthouse. What the Suez Canal was to the late nineteenth century, the Singapore Strait is to the twenty-first: the most important waterway in the world, the critical artery of the world economy.","zh":"入夜，每艘船都亮起航行灯和信号灯：右舷绿灯、左舷红灯，标示航向；桅顶白灯，标示位置。下方驾驶台里，新加坡海岸警卫队的航行指令源源不断，那英语平静而精确，任凭争抢有利位置的船长们不断插进急促恼怒的呼叫，也丝毫不乱。这哪里是平静的海面——那景象更像从写字楼高处俯瞰纽约高峰时段的车流，愤怒的喇叭声与堵作一团的喧嚣混成一片。船只从那里驶过，掠过新加坡市中心摩天楼群的璀璨灯火，向东北进入南海，或向西南进入马六甲海峡。任何一个小时里，都有 100 多艘船载着价值数百亿美元的货物，绕着霍士堡灯塔机动航行。苏伊士运河之于 19 世纪晚期，正如新加坡海峡之于 21 世纪：世界上最重要的水道，世界经济的命脉。"},{"id":"pt2-005","p":92,"t":"p","en":"The transition from Suez to Singapore is the story of not one but several revolutions: in the technologies of global shipping and trade; in relations between world powers; in the geography of the world economy; and in the nature of trade itself. Along the way, these changes would bring China back into the top ranks of global economic power, transform the American economy, and start to strain the relationship between America and the world around it.","zh":"从苏伊士到新加坡的这一转变，讲的不止一场革命，而是好几场革命：全球航运与贸易技术的革命；世界大国之间关系的革命；世界经济地理的革命；以及贸易本身性质的革命。一路下来，这些变化把中国重新推回全球经济强国的前列，重塑了美国经济，也开始让美国与外部世界的关系趋于紧张。"}],"notes":[]},{"id":"ch04","label":"Chapter 4","labelZh":"","title":"Western Tide Rising","titleZh":"第四章　西方潮涨","part":"Part II: To Contain the World, 1956-2017","showPart":false,"partZh":"第二部","partTitleZh":"围堵世界（1956—2017）","paras":[{"id":"ch04-001","p":93,"t":"p","en":"Sea power helped the British forge their empire and, with it, the nature of the modern world. Sea power was a critical feature in the articulation of America's new global role, in the wake of World War II. And it was a crisis in 1956 at that era's most important seaway, the Suez Canal, that symbolized and solidified the shift in world power from London to Washington, removing the last vestiges of more than a century of British domination of the high seas and high politics.¹ The Suez Crisis crystalized the emergence of an expansive phase of American power and its new roles of securing the free flow of energy and protecting global trade.","zh":"海权帮助英国缔造了帝国，也一并塑造了现代世界的面貌。第二次世界大战之后，海权又是美国确立其新的全球角色的一个关键要素。而1956年，在当时最重要的航路——苏伊士运河——上爆发的一场危机，则象征并最终固化了世界权力由伦敦向华盛顿的转移，把英国一个多世纪以来对公海与高层政治的支配所残留的最后痕迹涤荡干净。1 苏伊士危机使美国力量的一个扩张阶段就此登场，也使它的两项新角色——保障能源的自由流通、护卫全球贸易——凝定成形。"},{"id":"ch04-002","p":93,"t":"p","en":"It also marked the onset of one of the most dangerous phases of the Cold War, when the Soviet Union widened its gaze beyond its own security and its Eastern European buffer zone to the wider expanse of Europe, and then beyond—to a global competition for allegiances and resources. Although naval competition was a part of that titanic struggle, it was not at the forefront of the US-Soviet rivalry; nuclear missiles displaced naval power as the primary instrument of great power security rivalry.","zh":"它也标志着冷战最危险阶段之一的开始：苏联把目光从自身安全与东欧缓冲区移开，投向更广阔的欧洲，继而投向更远处——一场争夺盟友与资源的全球竞争。海军竞争固然是那场规模空前的搏斗的一部分，却并未居于美苏对抗的前列；核导弹取代海军力量，成了大国安全对抗的首要工具。"},{"id":"ch04-003","p":93,"t":"p","en":"But in world economic affairs, seafaring was about to become even more crucial. For the Suez Crisis, and the year 1956 more generally, was also an inflection point in global shipping, one that would gradually and then radically transform the world economy. The changes that followed would drive the huge economic gains of the West in the 1970s, 1980s, and 1990s.","zh":"但在世界经济事务中，航海即将变得更为关键。因为苏伊士危机、乃至整个1956年，也是全球航运的一个拐点——它先缓慢、继而彻底地改造了世界经济。随之而来的种种变化，推动了西方在20世纪70、80、90年代那场巨大的经济增长。"},{"id":"ch04-004","p":94,"t":"p","en":"So far in this book, we've watched empires and states and navies stitch together the world around us, as well as the state-sanctioned \"companies\" of the seventeenth and eighteenth centuries—those semiprivate entities like the East India Company, organized for trade and profit, but wielding the legal authority to make war and forge their own colonies. In the end, they proved to be extensions of the Crown, more than private interests. But in the post-World War II world, it was not only states that reshaped world trade. Private companies and entrepreneurs now played a critical role.","zh":"本书至此，我们看到帝国、国家与海军如何把周遭的世界缝合起来，也看到17、18世纪那些国家特许的“公司”——诸如东印度公司这类半公半私的实体：为贸易与利润而设，却握有开战、自建殖民地的法定权力。到头来，它们更像是王权的延伸，而非私人利益的代表。但在二战之后的世界里，重塑世界贸易的已不只是国家。私人公司与企业家此时扮演了关键角色。"},{"id":"ch04-005","p":94,"t":"p","en":"In this chapter and the next, we'll encounter two companies on opposite sides of the world—both family-owned, both passed from father to son, both born on the precipice of war—that exemplify a world transformed.","zh":"本章与下一章，我们将遇到两家分处世界两端的公司——皆为家族所有，皆由父传子，皆诞生于战争一触即发的悬崖边上——它们正是这个被改天换地的世界的写照。"},{"id":"ch04-006","p":94,"t":"p","en":"The first of them was born in the Baltic trade, in a Europe about to be thrust into global conflict.","zh":"其中第一家诞生于波罗的海贸易之中，诞生在一个即将被卷入全球冲突的欧洲。"},{"id":"ch04-007","p":94,"t":"h","en":"Modern-Day Vikings","zh":"现代的维京人"},{"id":"ch04-008","p":94,"t":"p","en":"There is a photograph from 1837 of the International Settlement in Canton, where foreigners were first allowed to engage in structured trade with the Chinese. In the foreground are the proud flags of the countries represented there, the great trading empires of the day: Britain, of course; Holland, France, Russia, Sweden; and the United States. And one from a trading empire we haven't encountered yet—the flag of the ancient kingdom of Denmark, a white cross on a red field, recognizable even in a black-and-white photograph. In the mid-1800s, Denmark was still a kingdom of some significance, and a trading power as well.² Though its power would fade in the early twentieth century, the lineage survives to this day—not in the Danish state, but in the form of what became from the 1970s onward one of the world's most significant global trading companies.","zh":"有一张1837年的照片，拍的是广州的商馆区（International Settlement），那是外国人最早获准与中国人进行有章可循的贸易的地方。前景是一面面骄傲的旗帜，属于在此驻留的各国——当时那些伟大的贸易帝国：英国自不必说，还有荷兰、法国、俄国、瑞典，以及美国。另有一面旗，属于一个我们尚未谋面的贸易帝国——古老丹麦王国的旗帜，红底白十字，即便在黑白照片里也一眼可辨。19世纪中叶，丹麦仍是一个颇有分量的王国，也是一个贸易强国。2 它的国力在20世纪初渐渐衰微，这一脉却延续至今——不在丹麦这个国家身上，而在一种形态之中：从20世纪70年代起，它成了世界上最重要的全球贸易公司之一。"},{"id":"ch04-009","p":94,"t":"p","en":"Broad Street (Bredgade) in Copenhagen's historic port district is populated by antiques stores and art galleries, faced in the city's classical limestone architecture, and Lutheran churches. Nearby are the dignified courtyards and imperial splendor of the Amalienborg Palace, home to the Danish royal family since the mid-1700s. Amid the limestone, an unusual building stands out. This edifice, with its gray and redbrick facade, interlaced with sandstone, rises to a set of steeples topped by gold-plated, onion-shaped domes. This is the Alexander Nevsky Church of Copenhagen. Built between 1881 and 1883 with funds provided personally by Tsar Alexander III, it served to celebrate his marriage to the Danish-born Maria Feodorovna, daughter of Denmark's Christian IX. The marriage ties between the Russian and Danish courts, and the presence of the Alexander Nevsky Church, whose architecture mirrors that of seventeenth-century Muscovite styles, is a vivid reminder of Copenhagen's past as a hub for the Baltic trade (and Denmark's past as a buffer state between Russia and Germany), at a time when the cold waters of the Baltic Sea played a central part in the lives of empires.3","zh":"哥本哈根历史悠久的港区里，宽街（Bredgade）两旁林立着古董店与画廊，门面是这座城市古典的石灰岩建筑，还有几座路德宗教堂。不远处，便是阿马林堡宫（Amalienborg Palace）那气派的庭院与皇家的恢弘——自18世纪中叶以来，这里一直是丹麦王室的居所。在一片石灰岩之间，一幢与众不同的建筑格外显眼。这座建筑以灰砖与红砖为立面，间以砂岩，向上收束成一组尖塔，塔顶覆着镀金的洋葱形穹顶。这便是哥本哈根的亚历山大·涅夫斯基教堂（Alexander Nevsky Church）。它建于1881年至1883年间，经费由沙皇亚历山大三世亲自拨付，为的是纪念他与丹麦出身的玛丽亚·费奥多罗芙娜（Maria Feodorovna）的婚事——她是丹麦国王克里斯蒂安九世之女。俄、丹两国王室之间的联姻，连同这座亚历山大·涅夫斯基教堂的存在——其建筑仿效17世纪莫斯科公国的风格——生动地提醒着人们：哥本哈根曾是波罗的海贸易的枢纽（也提醒人们，丹麦曾是夹在俄国与德国之间的缓冲国）；那是一个波罗的海的冰冷海水在诸帝国生活中占据中心地位的时代。3"},{"id":"ch04-010","p":95,"t":"p","en":"When the Alexander Nevsky Church was built in the late 1880s, Russia was one of the largest economies in the world, in league with Britain and Germany and the United States.4 The Baltic Sea was the critical artery of Russia's trade with the West, served by the port of St. Petersburg, then its capital and most important economic center.⁵ From the Baltic, Russian ships could sail West toward rich English markets. But to get there they first encountered the Øresund, the narrow strait between modern-day Denmark and Sweden that separates the Baltic Sea from the North Sea, home to Britain's ports. In the very coldest winters, the surface waters of the Øresund freeze over; but not solidly so, and strong currents break the ice sheet apart and push large shards up against the Danish coast, which pile together under the pressure of the waves. Each wave of ice shards push the earlier ones upward, and they crush ever closer together, pointing out at all angles, like someone shattered a giant sheet of glass across the shores. But most years, the Øresund is passable year-round.","zh":"亚历山大·涅夫斯基教堂建成于19世纪80年代后期，彼时俄国是世界最大的经济体之一，与英国、德国、美国并驾齐驱。4 波罗的海是俄国与西方贸易的关键动脉，圣彼得堡港为其服务——圣彼得堡当时是俄国首都，也是最重要的经济中心。5 从波罗的海出发，俄国船只可以西行，驶向富庶的英国市场。但要到达那里，它们先得经过厄勒海峡（Øresund）：今日丹麦与瑞典之间那道狭窄的海峡，把波罗的海与北海分隔开来，而北海沿岸正是英国的港口所在。在最冷的几个冬天，厄勒海峡的表层海水会结冰；但冻不结实，强劲的水流把冰盖击碎，将大块碎冰推向丹麦海岸，碎冰在浪涛的挤压下堆叠起来。一波碎冰把前一波顶起，越挤越紧，四面八方地翘着尖角，仿佛有人把一整块巨玻璃打碎，散落在岸边。但大多数年份，厄勒海峡全年皆可通航。"},{"id":"ch04-011","p":95,"t":"p","en":"Copenhagen sits on the Øresund and has historically controlled passage through it. Copenhagen was thus an essential hub between ports in Russia, Sweden, and Poland, and the vital port of London. Navigating this trade route was essential to imperial Russia (as well as imperial Germany).6 The Baltic would also play a crucial role in the First and Second World Wars, as British (and later American) ships sailing out of ports in the south of England sought to limit German egress from the Baltic Sea to the Atlantic.","zh":"哥本哈根坐落在厄勒海峡之畔，历史上一直控制着海峡的通行。因此，哥本哈根成了俄国、瑞典、波兰各港口与伦敦这个要害港口之间的必经枢纽。对俄罗斯帝国（以及德意志帝国）而言，掌握这条贸易航路至关重要。6 波罗的海在第一次与第二次世界大战中同样举足轻重：英国（后来还有美国）的舰船从英格兰南部港口驶出，力图封堵德国人由波罗的海通往大西洋的出口。"},{"id":"ch04-012","p":96,"t":"p","en":"Trade in the Baltics had historically been conducted on sailing cutters, until in the early 1800s the advent of steamships began to transform the business. Trading ships docked and recorded their trade in the old harbor center of Copenhagen, two blocks away from the Alexander Nevsky Church. One person who worked there and saw the switch from sail to steam being made was a young Danish seaman named Peter Maersk Møller. Having sailed for twenty years on other people's cutters, he decided to take advantage of the changing dynamics of the business and strike out on his own. In 1886, he bought a British-built steamship, the SS Laura, and began carrying cargo across the Baltics for clients in each of the major ports. His log from the period is housed in a small modern museum in the old customs port area of Copenhagen, around the corner from the Alexander Nevsky Church, and next door to the old customs building, where Møller had his first job as a clerk. His small, precise handwriting records the locations of his trips and the details of his cargo. In 1890, the ship made sixty-nine port calls to twenty different locations, ranged across Denmark, Germany, Latvia, and Sweden, carrying grains, bran, animal forage, hemp, rapeseed, rye, limestone, and wooden railway sleepers.","zh":"波罗的海的贸易历来靠帆船进行，直到19世纪初，汽船的出现开始改变这门生意。商船在哥本哈根老港区靠泊、登记交易，那里距亚历山大·涅夫斯基教堂只有两个街区。在这里工作、亲眼看着帆船被汽船取代的人当中，有一位年轻的丹麦海员，名叫彼得·马士基·穆勒（Peter Maersk Møller）。他替别人驾了二十年帆船，决定趁这门生意格局变动之际，自己闯一番事业。1886年，他买下一艘英国造的汽船「劳拉」号（SS Laura），开始为各大港口的客户运送货物，往来于波罗的海各地。他那个时期的航海日志，如今收藏在哥本哈根老海关港区的一座小型现代博物馆里——就在亚历山大·涅夫斯基教堂转过街角处，紧挨着老海关大楼，穆勒的第一份工作便是在那里当职员。他那细小而工整的字迹，记下了每一次航行的地点与货物的详情。1890年，这艘船挂靠二十个不同地点，共六十九个港次，遍及丹麦、德国、拉脱维亚与瑞典，运载谷物、麸皮、牲口饲料、大麻、油菜籽、黑麦、石灰岩和木制铁路枕木。"},{"id":"ch04-013","p":96,"t":"p","en":"By 1904, business was good enough that he and his son, A. P. Møller, incorporated the Svendborg Steamship Company, in a small town of the same name that borders the other major passageway between the Baltic and North Seas, on the southern coast of Denmark's Funen island. The company's first ship was a British-built steamer, the 2,200- ton cargo ship Svendborg. It was painted with what became one of the best-known symbols in international business, the seven-sided white star on a light blue background.'","zh":"到1904年，生意已相当红火，他与儿子A. P. 穆勒（A. P. Møller）一道，在斯文堡（Svendborg）注册成立了斯文堡汽船公司（Svendborg Steamship Company）。斯文堡是与此同名的一座小镇，位于丹麦菲英岛（Funen）南岸，濒临波罗的海与北海之间的另一条主要通道。公司的第一艘船是一艘英国造的汽船，即2,200吨的货船「斯文堡」号。船身上漆着的图案，后来成了国际商界最著名的标志之一：浅蓝底色上的一颗七角白星。*"},{"id":"ch04-014","p":96,"t":"p","en":"Eight years later, in 1912, A. P. Møller decided to get a license to build his own ships, and incorporated the Dampskibsselskabet af 1912, the Steamship Company of 1912. That year sounds like it would have been a bad time to expand the business, as Europe was about to descend into the continental slaughter that was the Great War. But while wars disrupt civic life and many parts of the business world, they also drive economic activity. Simply put, armies on the march consume huge quantities of energy, weapons, food, and clothes, and need to receive them in real time wherever they are located. For the businesses that supply such goods, war creates huge demand. The same is true for the businesses that transport those goods—including shipping companies. The Great War was mainly fought on the continent, but it entailed troop and goods movements around the whole of the Baltic and the coasts of Europe as far southeast as Turkey. Supplying the war effort proved to be an important part of the Steamship Company's business from 1914 to 1918.","zh":"八年后，1912年，A. P. 穆勒决定取得自造船许可，注册成立了“1912年汽船公司”（Dampskibsselskabet af 1912）。1912年听上去像是个不宜扩张生意的年头——欧洲即将陷入那场大陆上的屠戮，即第一次世界大战。但战争在打乱社会生活和商界许多领域的同时，也驱动着经济活动。道理很简单：行进的军队要消耗大量能源、武器、食物与衣物，而且无论驻扎何处，都得实时得到补给。对供应这类物资的商家来说，战争制造了巨大的需求。运送这些物资的商家——航运公司也在其中——同样如此。一战主要在欧洲大陆进行，却牵动了整个波罗的海及欧洲沿岸、直到东南方土耳其一带的兵员与货物调动。为战争供货，从1914年到1918年一直是这家汽船公司业务的重要部分。"},{"id":"ch04-015","p":96,"t":"n","en":"According to a letter Peter Maersk Møller wrote to his wife, the symbol represented a star that had appeared to him one night amid an otherwise cloudy sky, when he prayed for her to recover from a serious illness she had at the time. Author's notes, Maersk Museum, Copenhagen, April 2018.","zh":"据彼得·马士基·穆勒写给妻子的一封信，这个标志所代表的是一颗星：她当年身患重病，他为她康复而祈祷，某个夜里，满天阴云中独独现出这颗星。作者笔记，马士基博物馆，哥本哈根，2018年4月。"},{"id":"ch04-016","p":97,"t":"p","en":"At the end of the war, Peter Maersk Møller and his son took the bold decision to open their own shipyards. They chose a site on a canal near the major city of Odense on the same island where they had started their company. Like Svendborg, Odense is located on the sealane that connects the Baltic and the North Sea, on Denmark's large central island. The Odense shipyard delivered the company's first selfbuilt ship in 1920 and their first diesel ship one year later. The shipyards would eventually help to transform what was then still operating as the Svendborg Shipping and Steamship Companies, a small familyowned business, into the global giant that it is today. Now known as the A. P. Møller-Maersk company, it's the largest shipping company in the world, with a fleet of more than seven hundred ships.?","zh":"战争结束时，彼得·马士基·穆勒与儿子做了一个大胆的决定：开办自己的船厂。他们选址在欧登塞（Odense）这座大城附近的一条运河边，仍在这座当初创办公司的岛上。与斯文堡一样，欧登塞也坐落在连接波罗的海与北海的航路上，位于丹麦中部的大岛之上。欧登塞船厂于1920年交付了公司第一艘自造船，一年后又交付了第一艘柴油船。这些船厂最终帮助这家当时还以斯文堡航运公司与斯文堡汽船公司之名经营的小型家族企业，蜕变成今日的全球巨头。它如今名为A. P. 穆勒-马士基公司（A. P. Møller-Maersk），是世界上最大的航运公司，船队拥有七百多艘船。7"},{"id":"ch04-017","p":97,"t":"p","en":"The interwar years were a period of growth and territorial expansion for Maersk. In 1919, they opened their first overseas office, in New York City, which was then, and for the next half century, the key hub of global shipping and trade. World War I left London, previously the key hub of international trade, weakened; and as it recovered from the war, it also had to compete with an emerging market in New York. America had become the largest economy in the world, had the largest navy, and a stock market second only to London's. In 1923, the city also produced one-twelfth of all US manufacturing—and more to the point for a shipping firm, half of all imports and exports out of the United States transited New York Harbor. Oceangoing steamers went through the port every twenty minutes.8 For a company with international ambitions, New York was a vital port of call.","zh":"两次大战之间的岁月，是马士基成长与扩张版图的时期。1919年，他们在纽约开设了第一家海外办事处——纽约当时、以及此后半个世纪，都是全球航运与贸易的关键枢纽。第一次世界大战使伦敦这个昔日的国际贸易枢纽元气大伤；伦敦在战后恢复的同时，还得同纽约这个新兴市场一争高下。美国已成为世界最大的经济体，拥有最庞大的海军，股市规模也仅次于伦敦。1923年，纽约一城就生产了全美制造业产值的十二分之一——而对一家航运公司来说更要紧的是，美国全部进出口货物有一半经由纽约港。远洋汽船每二十分钟就有一艘进出该港。8 对一家怀有国际抱负的公司而言，纽约是必到的重要停靠港。"},{"id":"ch04-018","p":97,"t":"p","en":"Shortly after the opening in New York came a key breakthrough. In that era, global trade had two dimensions: the flow of agriculture and natural resources from the colonies to the “center\" (the colonial powers, as well as the United States), and trade in industrial goods between the industrial powers—in Europe, especially, but also with the United States and Japan. As part of the second type of trade, Maersk managed to land a prime contract-transporting car parts for the Ford Motor Company to the port of Yokohama in Japan, where Ford had assembly factories.* It was their first set-route delivery. On the back of it, they grew the business further, and in 1928 opened what was known as the Maersk Line, operating a transpacific route through Baltimore by way of the Panama Canal. At that stage, six ships were sailing the route for the company. By 1937, that number had swelled to forty-six ships on all of their routes combined.","zh":"纽约办事处开设后不久，一项关键突破随之而来。那个年代，全球贸易有两个维度：一是农产品与自然资源从殖民地流向“中心”（即各殖民宗主国以及美国），二是工业国之间的工业品贸易——尤以欧洲内部为主，也包括同美国、日本的贸易。在第二类贸易中，马士基拿下了一份大合同：为福特汽车公司（Ford Motor Company）把汽车零件运往日本横滨港，福特在那里设有装配厂。* 这是他们头一条固定航线的运输业务。借此，他们进一步拓展生意，于1928年开办了后来所称的“马士基航运”（Maersk Line），经营一条自巴尔的摩出发、取道巴拿马运河的跨太平洋航线。当时，公司有六艘船跑这条航线。到1937年，公司各条航线船舶的总数已增至四十六艘。"},{"id":"ch04-019","p":98,"t":"p","en":"The years of World War II proved more complicated for Maersk than had the Great War.† A day before Denmark was invaded and surrendered to the Nazis, A. P. Møller decreed that if Denmark was invaded, all of their ships outside Danish waters were to report directly to the New York office.9 Maersk ran their fleet out of New York for the rest of the war, and from June 1941 onward, much of the fleet served as a support element to the United States Navy, called up as the US took control of foreign ships to support the war effort. More than half of the Maersk fleet was lost during the war. But Møller also owned the largest share in a weapons factory in Denmark, and during the Nazi occupation, both the weapons factory and the Odense yard were used by the Germans. After the war, the company was fined for this, though their service to the Allied war effort was also highlighted.10","zh":"对马士基而言，第二次世界大战的岁月比第一次大战更为复杂。† 就在丹麦遭入侵、向纳粹投降的前一天，A. P. 穆勒下令：一旦丹麦被入侵，公司在丹麦水域之外的所有船只一律直接向纽约办事处报到。9 战争余下的岁月里，马士基把船队交由纽约调度；自1941年6月起，随着美国为支援战争而征用外国船只，这支船队的大部分都编入美国海军，充作辅助力量。马士基船队有一半以上在战争中损失。但穆勒同时握有丹麦一家兵工厂的最大股份；纳粹占领期间，这家兵工厂与欧登塞船厂都为德国人所用。战后，公司因此被处以罚款，不过它为盟国战争所作的服务也得到了表彰。10"},{"id":"ch04-020","p":98,"t":"p","en":"After the war, the Odense shipyard began a brisk shipbuilding program to bring the fleet back up to prewar levels; a mark they hit by 1956. They also expanded their tanker business. Between 1946 and 1966, it was actually tanker traffic and oil transport that led the growth of the company. By the mid-1950s, Maersk tankers were among the largest fleets carrying Saudi oil into the European and American markets—in effect, realizing the deal struck between FDR and King Saud in 1944. But what really propelled the company from the ranks of a middle-tier firm to the top of the global food chain was that it was among the first to be able to apply new shipping technologies, changes to ship design, and techniques for transport that would become the cornerstone of the growth of the Western economies from the 1970s onward.","zh":"战后，欧登塞船厂启动了一项紧锣密鼓的造船计划，要把船队恢复到战前水平；到1956年，这个目标实现了。他们同时扩张油轮业务。1946年至1966年间，真正带动公司成长的其实是油轮运输与石油运输。到20世纪50年代中期，马士基的油轮已成为把沙特石油运往欧美市场的最大船队之一——实际上，这正是1944年罗斯福与沙特国王那笔交易落了地。但真正把这家公司从二流企业之列推上全球食物链顶端的，是它率先运用了新的航运技术、新的船舶设计，以及新的运输方法——这些后来成了20世纪70年代以后西方经济增长的基石。"},{"id":"ch04-021","p":98,"t":"n","en":"It's a striking reminder that what we think of as a contemporary reality—global supply chains that cross continents—got its start well before the Second World War.","zh":"这提醒我们一件值得注意的事：我们视为当代现实的跨洲全球供应链，早在第二次世界大战之前就已发端。"},{"id":"ch04-022","p":98,"t":"n","en":"Briefly, it looked as if the straits between Denmark and Sweden would become an early naval battleground between Britain and Germany, when Churchill asked the Sea Lord to begin preparations for a Royal Navy blockade of German ships sailing south from Sweden and Norway, carrying vital iron ore supplies. The Sea Lord explained to Churchill the substantial logistical and political difficulties involved in such a blockade, and the idea was jettisoned.","zh":"曾有一度，丹麦与瑞典之间的海峡眼看就要成为英德两国早期的海上战场：丘吉尔要求第一海务大臣着手准备，由皇家海军封锁从瑞典、挪威南下的德国船只，那些船载着至关重要的铁矿石。第一海务大臣向丘吉尔说明，这样的封锁在后勤与政治上都困难重重，这个主意遂被放弃。"},{"id":"ch04-023","p":99,"t":"h","en":"The Advent of Bulk Shipping and Containerization","zh":"散货航运与集装箱化的兴起"},{"id":"ch04-024","p":99,"t":"p","en":"Trading by sea had been underway for more than a millennium, and through that time the essential way that goods were handled at sea had barely changed. Goods were loaded by hand or pulley and later by crane into the cargo hold of a ship. Loose goods, like coal or wheat, were shoveled or troweled into the holds of cargo bays. Foodstuffs or furniture or machine parts were packed into a variety of crates transported and stored on a dock and then loaded into the cargo hold as best they fit. Crates for packing came in an endless variety of shapes and sizes, to package a bushel of tomatoes or a piano or a small truck or crates of bananas or coffee or rubber. Goods had to be carefully loaded to protect against damage during the voyage; damage to goods in transport was a major factor in shipping costs. And even before being loaded onto ships, they would be delivered to ports around the world, where they would wait at quayside for the right ship and for stevedores—often for weeks.\" Stevedores would then work to load and unload these crates; and then began the labor of repackaging and reloading the goods for transportation on land. Modern cranes and forklifts eased the labor challenge, but in broad terms these techniques for packing a ship remained largely unchanged from what Ibn Battuta would have seen in the early fourteenth century.12","zh":"海上贸易已运行了一千多年，而在这漫长的岁月里，货物在海上装卸的基本方式几乎一成未变。货物靠人力或滑轮装上船，后来改用起重机吊进货舱。煤、小麦这类散货，则用铁锹或铲子铲进货舱。食品、家具、机器零件则装进各式各样的板条箱，运到码头堆放，再尽量塞进货舱。包装箱的形状与尺寸千奇百怪，花样无穷，为的是装下一蒲式耳西红柿、一架钢琴、一辆小卡车，或是一箱箱香蕉、咖啡、橡胶。货物必须小心装载，以防航程中受损；运输途中的货损，是航运成本中的一大项。而且，货物在上船之前，先要被运到世界各地的港口，在码头边等候合适的船、等候装卸工——往往一等就是好几个星期。11 接下来，装卸工才动手把这些板条箱装上卸下；随后又要费一番工夫重新打包、重新装载，以便在陆上转运。现代起重机与叉车减轻了这番劳苦，但大体而言，这套装船的手艺，与14世纪初伊本·白图泰（Ibn Battuta）所见相差无几。12"},{"id":"ch04-025","p":99,"t":"p","en":"That was all about to change, transformed both by scale and by standardization. Just as standardization took cars from the world of bespoke European motors for the elite to Henry Ford's mass industrialization, so standardization of containers took us from a world where trade was a modest portion of the world's economic activity to a world where sea-based trade was the dominant feature of every part of our economic lives.","zh":"这一切即将改变，改变来自两个方面：规模与标准化。正如标准化把汽车从欧洲为精英量身定制的少数车型，带入亨利·福特的大规模工业化生产，集装箱的标准化也把我们从一个贸易只占世界经济活动一小部分的世界，带进一个海上贸易主导着我们经济生活各个领域的世界。"},{"id":"ch04-026","p":100,"t":"p","en":"It was a change with many sources. The first was a technological shift so rudimentary and significant that in hindsight it is hard to comprehend why it hadn't happened earlier. It was, quite simply, a rectangular metal container; a box. In the words of the economist Marc Levinson, whose careful study of the economics of shipping first documented the huge economic impact of the introduction of containerization, this innovation was “a development that had sweeping consequences for workers and consumers all around the globe.\"13","zh":"这场变革的来源不止一处。第一个来源是一项技术转变，它简单得出奇，意义却大得惊人，事后回看，简直难以理解为何它没有更早发生。说白了，那不过是一只长方形的金属容器，一个箱子。用经济学家马克·莱文森（Marc Levinson）的话说——他对航运经济作过细致研究，最早记录下集装箱化的引入所带来的巨大经济影响——这是“一场对全球各地劳动者与消费者都产生深远影响的变革”。13"},{"id":"ch04-027","p":100,"t":"p","en":"The earliest innovations in the path toward containerization started in the nineteenth century. As early as 1837, James O'Connor, a Pittsburgh-based shipping executive, tested a kind of container that could move smoothly between train and ship; but he was blocked from developing it by interstate commerce regulators.14 Later in the century, British and French railways tried using wooden crates to move furniture, transferring the containers from the railcars to horse-drawn carts.¹⁵ From there, different engineers and company owners had varying ideas about how to ship most efficiently, and by the beginning of World War II, the US and many European countries had developed some partial container systems. Critically, then, the US Army began using wooden crates on trains as a technique for speeding the delivery of supplies.6 It would experiment further with such techniques during World War II. But the real breakthrough came during the Korean War.","zh":"通往集装箱化的最早一批创新，始于19世纪。早在1837年，匹兹堡的航运高管詹姆斯·奥康纳（James O'Connor）就试验过一种能在火车与轮船之间平稳转运的容器；但州际商业监管机构不许他继续研发。14 到那个世纪的后半叶，英法两国的铁路公司尝试用木箱运送家具，把箱子从火车车厢转到马车上。15 此后，不同的工程师与公司老板对如何最高效地运输各有各的想法；到第二次世界大战爆发时，美国与许多欧洲国家都已开发出若干不完整的集装箱系统。尤为关键的是，美国陆军开始把木箱装上火车，用来加快物资的运送。16 二战期间，陆军又对这类做法作了进一步试验。但真正的突破发生在朝鲜战争期间。"},{"id":"ch04-028","p":100,"t":"p","en":"As the US Army continued to experiment, it developed what became known as CONEX, or the container express system—a series of standardized crates that could fit one on top of another, three high. That became its go-to technique for organizing the logistics of shipping the goods that the army needed from the United States to the Korean Peninsula, where it was fighting the Korean War (and where it was, as a consequence, establishing a large American logistical hub and base in Asia, supplied by the Korean port of Busan).17 The American involvement in the Korean War and the troop presence that remained in Korea, constantly being supplied by the United States, became the essential first plank in the now massive trade between the US and Asia. And much of it flowed across the Pacific in the standard-size boxes of the evolving container system.","zh":"美国陆军在不断试验中，开发出后来所称的“康乃克斯”（CONEX），即“集装箱快运系统”——一系列标准化的箱子，可层层叠放，最高三层。这成了它组织后勤的首选办法：把军队所需的物资从美国运往朝鲜半岛，它正在那里打朝鲜战争（也因此在那里建起一座庞大的美军后勤枢纽与基地，由韩国釜山港供给）。17 美国卷入朝鲜战争，以及战后驻留韩国、由美国源源不断补给的美军，成了如今美亚之间庞大规模贸易至关重要的第一块基石。而这其中的很大一部分，都以集装箱系统不断演进中的标准尺寸箱，横越太平洋。"},{"id":"ch04-029","p":101,"t":"p","en":"As yet, this innovation was limited to the army and did not affect commercial traffic. Shortly after the end of the Korean War, though, two sets of events occurred that began to take this from a specialized innovation to a global industrial revolution.","zh":"此时，这项创新还只限于军队，尚未影响商业运输。但朝鲜战争结束后不久，两方面的事件相继发生，开始把它从一项专用创新变成一场全球工业革命。"},{"id":"ch04-030","p":101,"t":"p","en":"The first of these was the Suez Crisis, which caused shipping owners to start looking for bulk solutions that could absorb the great cost of the Suez closure. That would begin a transformation in shipping design, first in the area of bulk carriers and oil transport ships, that would over time change the economics of the transport in industrial goods. Coincidentally, at the same time, an American trucking executive, Malcolm McLean, began to agitate for commercial solutions that mirrored CONEX.","zh":"其一是苏伊士危机，它促使船东们开始寻求规模化的解决办法，以消化运河关闭带来的巨大成本。这开启了船舶设计上的一场变革，最先是在散货船与石油运输船领域，久而久之，改变了工业品运输的经济账。无巧不成书，与此同时，美国一位卡车运输业高管马尔科姆·麦克莱恩（Malcolm McLean）开始四处奔走，力推效仿“康乃克斯”的商业方案。"},{"id":"ch04-031","p":101,"t":"p","en":"McLean was an American trucking entrepreneur and faced recurrent problems in long delays of his goods quayside at US ports. His shipments were getting held up, raising his shipping company's costs, and he wanted to get around this. His first innovation built on the CONEX concept but took it further, and he put his trucks directly onto ships that would then travel between North Carolina, New York, and Rhode Island—circumventing heavy East Coast traffic. He quickly realized, however, that that was inefficient; the trucks took more space than the goods they were carrying needed, and once on the ship his trucks couldn't be used for other loads.18","zh":"麦克莱恩是一位美国卡车运输企业家，他的货物在美国港口码头常常长时间滞留，这问题一再出现。他的货屡屡被耽搁，推高了公司的成本，他想绕开这一关。他的第一项创新建立在“康乃克斯”的概念之上，又更进一步：他把自家卡车直接开上船，让船在北卡罗来纳、纽约与罗得岛之间往返——绕开东海岸拥堵的陆路交通。但他很快意识到，这办法效率不高：卡车占的地方比它所载货物所需的空间大得多，而且卡车一上了船，就没法再去装别的货了。18"},{"id":"ch04-032","p":101,"t":"p","en":"Instead, on April 26, 1956, he put fifty-eight trailer vans—the back part of the truck, or just the container—onto a retrofitted tanker ship named Ideal X and sailed it from Elizabeth, New Jersey, to Houston, Texas. His Sea-Land Service, as it came to be called, would become the first company to successfully move containers seamlessly from land to sea and back—effectively establishing the world's first container shipping company.¹9 More specifically, he was the first to develop commercially feasible techniques for what became known as intermodality\"\\_-simply, the ability to move seamlessly between two or more modes of transportation, rail, truck, and sea.","zh":"于是，1956年4月26日，他把五十八节拖车车厢——即卡车的后部，或者干脆说，就是集装箱——装上一条由油轮改装的船「理想X」号（Ideal X），从新泽西州伊丽莎白驶往得克萨斯州休斯敦。他这家后来得名“海陆服务公司”（Sea-Land Service）的企业，成为第一家成功把集装箱从陆上无缝运到海上、再运回陆地的公司——实际上也就创立了世界上第一家集装箱航运公司。19 更确切地说，他是第一个为后来所称的“多式联运”开发出商业上可行技术的人——说白了，就是让货物能在两种或两种以上运输方式（铁路、卡车、海运）之间无缝转运。"},{"id":"ch04-033","p":101,"t":"p","en":"Containerization did not catch on easily, though. The shipping industry was deep-rooted in tradition and entrenched interests. Levinson, in his study of the impact of containerization on shipping costs, shows how containerization encountered significant resistance from traditional interests—from unions of longshoremen who risked losing their jobs, to port operators who were going to have to spend millions to retool their infrastructure. Some simply did not understand the innovation; others were worried about how long it would really last, and the impact it would make. Port facilities also needed to be amended—to accept containers in volume, they needed bigger holding lots, a major capital investment. Changing the industry standard wasn't easy.20","zh":"不过，集装箱化并未轻易被人接受。航运业深深扎根于传统与既得利益之中。莱文森在研究集装箱化对航运成本的影响时指出，集装箱化遭到传统利益方的强烈抵制——从面临失业的码头装卸工工会，到不得不斥资数百万美元改造基础设施的港口运营商。有些人根本不理解这项创新；另一些人则担心它能维持多久、能带来多大改变。港口设施也需要改造——要大量接收集装箱，就得有更大的堆场，这是一笔重大的资本投入。改变行业标准并不容易。20"},{"id":"ch04-034","p":102,"t":"p","en":"McLean kept on innovating. By 1961 he had taken ships that were decommissioned from transport use in World War Il and refitted them to hold a larger number of containers—as many as 476 containers on a single ship. It was described at the time as a behemoth.21","zh":"麦克莱恩不断创新。到1961年，他已把二战中退出运输用途的船只加以改装，用来装载更多集装箱——单船最多可装476个。当时人们称之为“巨兽”。21"},{"id":"ch04-035","p":102,"t":"p","en":"Throughout the 1960s, containerization began to creep across different parts of the industry; slowly. An important factor was first domestic and then international negotiations about the standard size of the containers. If the industry as a whole was going to invest in the ships, container yards, cranes, and related adaptations necessary to adopt containerization, it was going to have to settle on an agreed size for the containers—so that every part of the industry could adapt to the same changes. But in the early days, there was no standard size of containers. Though containers were growing in use, everyone seemed to use different dimensions: in Europe, for example, the containers were usually wooden crates 4 to 5 feet tall; the US Army's CONEX boxes were steel and 8.5 feet by 6 feet 10.5 inches. Their design was different, too: some containers were meant to be moved by cranes with hooks; others had slots so they could be moved by forklifts.22 This posed a challenge to the “intermodality\" that made container shipping potentially so revolutionary: if containers couldn't be moved from one company's ships to another's rail to another's truck with ease, each company would need to have a host of sizes for each customer's needs, and they would have to pick modes of transport based on which could fit whatever container was being shipped.","zh":"整个20世纪60年代，集装箱化缓慢地向行业各处渗透。一个关键因素，是围绕集装箱标准尺寸的谈判：先在美国国内，继而扩展到国际上。整个行业若要为采用集装箱化而投资于船舶、集装箱堆场、起重机及相关改造，就必须就集装箱的尺寸达成一致——这样产业链各环节才能适应同一套变化。但在早期，集装箱并无标准尺寸。尽管集装箱用得越来越多，各家似乎各用各的规格：比如在欧洲，集装箱通常是4到5英尺高的木箱；美国陆军的“康乃克斯”箱则是钢制的，8.5英尺×6英尺10.5英寸。设计也各不相同：有些箱子要靠带钩的起重机吊运，有些则开了槽口，可用叉车搬运。22 这就给“多式联运”出了难题——而多式联运正是集装箱运输之所以可能带来革命的原因：如果集装箱无法方便地从一家公司的船转到另一家的铁路、再转到第三家的卡车，那么每家公司就得为每位客户备齐各种尺寸，还得看哪种运输方式装得下某个箱子，再据此选择运输方式。"},{"id":"ch04-036","p":102,"t":"p","en":"It wasn't until the 1960s that standardization really began to take place. This came, first, through domestic negotiations within the United States, and then through international negotiations involving the US and the major European economies. The International Maritime Organization published global standards for containers that specified terminology, dimensions, markings, loading, and more. It helped created the version of the container we know today: eight feet wide by eight feet six inches high with a length of twenty feet. This container is now the industry standard reference, with volumes of shipping being measured in twenty-foot equivalent units, or TEUs.23 (Though most ships now carry a majority of double-length boxes, forty feet long, that count for two TEUs.24)","zh":"直到20世纪60年代，标准化才真正开始。它先经由美国国内的谈判，继而经由美国与欧洲主要经济体之间的国际谈判。国际海事组织发布了集装箱的全球标准，对术语、尺寸、标记、装载等作出规定。它促成了我们今天所知的这种集装箱：宽8英尺、高8英尺6英寸、长20英尺。这种箱子如今是行业的基准单位，航运量以“标准箱”（TEU）计量。23（不过现在多数船舶所载以40英尺长的双倍长度箱为主，一个算两个标准箱。24）"},{"id":"ch04-037","p":103,"t":"p","en":"What followed was the ever-wider adoption of standardized containers. Ports began adapting their technology and their physical geography to allow for containerization. Port operators with a combination of foresight and capital made early moves in this direction and reaped handsome rewards. Rotterdam was an example. It had been decimated by German bombings during World War II, and by the 1950s was in the process of rebuilding and refurbishing its infrastructure. Betting on future trends, the managers of the Rotterdam port decided to plunge into the new container model, setting aside land and building the European Container Terminus with ten berths (and room for more). Rotterdam would quickly pass London as the top European port, and would later overtake New York as the world's largest port (by tonnage).2⁵ In the same year that Rotterdam received its first container ship, Hong Kong—a small port by world standards—decided to examine the option of containerization of its own port infrastructure.2⁶ The decision to do so would eventually help make Hong Kong the largest port in the world.","zh":"随之而来的是标准集装箱日益广泛的采用。各港口开始改造技术、改造自身的地理条件，以适应集装箱化。有远见又有资本的港口运营商早早动手，收获了丰厚的回报。鹿特丹便是一例。二战期间，它被德国的轰炸夷为废墟；到20世纪50年代，正处在重建与翻新基础设施的过程之中。鹿特丹港的管理者们押注未来趋势，决定全力投入这种新的集装箱模式，划出土地，建起拥有十个泊位（还留有余地）的欧洲集装箱码头。鹿特丹很快超越伦敦，成为欧洲第一大港，后来又超过纽约，成为世界最大港口（按吨位计）。25 就在鹿特丹迎来第一艘集装箱船的同一年，香港——以世界标准看只是个小港——决定研究对自身港口基础设施实行集装箱化的方案。26 这一决定最终帮助香港成为世界最大的港口。"},{"id":"ch04-038","p":103,"t":"p","en":"While these innovations were taking hold, there was still a way to go toward general adoption of containers. For example: in 1966 Maersk commissioned a planning study of shipping trends, and while it predicted growth in containerized shipping, that growth was not by its account so large as to warrant new investments in ships adapted to containerization. In the immediate term, the firm continued to focus on pallet-based shipping.","zh":"在这些创新渐成气候的同时，集装箱的普遍采用仍有很长的路要走。例如，1966年马士基委托进行了一项航运趋势规划研究，研究虽预测集装箱航运将会增长，但按其估算，增幅尚不足以证明有必要投资建造适应集装箱化的新船。短期内，公司仍专注于托盘化运输。"},{"id":"ch04-039","p":103,"t":"p","en":"But then, once again, geopolitics would help transform trade.","zh":"但随后，地缘政治再一次推动了贸易的变革。"},{"id":"ch04-040","p":103,"t":"p","en":"There's an odd gap in Levinson's otherwise persuasive study of the way in which containerization, intermodality, and standardization drove the transformation in shipping in the 1960s and '70s. By the late 1960s, as these innovations were gaining an ever-larger foothold, Levinson's study notes with puzzlement that shipping costs were still not going down. But the explanation, likely, does not lie in the domain of the economics of transport, but in the essential fact that the Suez Canal was closed again, this time for years.","zh":"莱文森那部颇有说服力的研究，论述集装箱化、多式联运与标准化如何在20世纪60、70年代推动航运业转型，其中却有一处奇怪的空白。到60年代末，这些创新已占据越来越大的地盘，莱文森的研究却不无困惑地指出：航运成本仍未下降。而原因很可能不在运输经济学的范畴，而在于一个基本事实：苏伊士运河又一次关闭了，这一次一关就是好几年。"},{"id":"ch04-041","p":104,"t":"p","en":"This second, longer closure came about more or less the same way the first one had: an Egyptian threat of nationalization, followed by a military clash with Israel. In this case, Egypt's threats to further nationalize the canal triggered the Six-Day War, which ran between June 5 and 10, 1967, and saw Israel strike deep into the heart of both Egyptian and Syrian territory, ending up in control of the Golan Heights and the Sinai Peninsula. Although Israel won the war swiftly and decisively, nonetheless the canal ended up closed, both mined by Egypt and blocked by ships sunk by the Israeli air force. It would stay that way until two years after the end of a follow-on war, the Yom Kippur War of 1973, which played out very differently. That war saw Egypt, Syria, and Jordan combining forces for a surprise attack on Israel, which caught it off guard; Israel only recovered and survived by means of a massive program of airlift and resupply by the United States. The canal would remain closed until 1975, following a two-year program of de-mining and ship-clearing led by the United States in the aftermath of the war.*","zh":"这第二次、也是更长久的一次关闭，来龙去脉与第一次大致相同：埃及威胁要将运河收归国有，随后与以色列发生军事冲突。这一次，埃及进一步国有化运河的威胁引爆了“六日战争”——1967年6月5日至10日，以色列深入埃及与叙利亚腹地实施打击，最终控制了戈兰高地与西奈半岛。以色列虽然迅速而决定性地赢得了战争，运河却终究还是关闭了：埃及在河中布雷，以色列空军又炸沉船只堵塞航道。这种状态一直持续到又一场战争结束两年之后——1973年的“赎罪日战争”，而那一仗的走向截然不同。在那场战争中，埃及、叙利亚与约旦合力突袭以色列，令其措手不及；以色列全靠美国大规模空运补给才缓过劲来、得以幸存。战后，美国主导了为期两年的排雷与清障作业，运河直到1975年才重新开放。*"},{"id":"ch04-042","p":104,"t":"p","en":"The Suez closure would drive shipping prices higher and create still more pressure on the owners of oil tankers and bulk carrier ships to develop larger, more efficient shipping designs.27 And the OPEC oil embargo accompanying the 1973 Yom Kippur War caused a huge spike in the price of oil—the first of the major oil shocks to the West's economies.28","zh":"苏伊士运河的关闭推高了航运价格，也给油轮与散货船船东带来更大压力，迫使他们开发更大、更高效的船型。27 而与1973年赎罪日战争相伴的欧佩克石油禁运，令油价暴涨——这是西方经济遭遇的第一次重大石油冲击。28"},{"id":"ch04-043","p":104,"t":"p","en":"At the time that crisis hit, container shipping had spread even farther, in large part because of the second geopolitical factor: the Vietnam War.","zh":"危机袭来之时，集装箱航运已扩散得更远，这在很大程度上要归功于第二个地缘政治因素：越南战争。"},{"id":"ch04-044","p":104,"t":"p","en":"Throughout McLean's turbulent career, he had found that a relationship with the US military was an important source of both contracts and support for his innovations. Even in the early phase of the SeaLand company, the large numbers of American troops in Germany and the need to supply them created huge logistical demands for the","zh":"在麦克莱恩跌宕起伏的职业生涯中，他发现与美国军方的关系是合同与创新支持的重要来源。即便在“海陆”公司的初创阶段，驻德美军人数众多、需要持续补给，也向美国陆军提出了庞大的后勤需求。"},{"id":"ch04-045","p":104,"t":"n","en":"When the canal was closed in 1967, fifteen ships were caught in the Great Bitter Lake. The ships would stay there until the reopening of the canal in 1975. While the crews would be relieved and changed in and out, the ships would stay, eventually getting covered in desert sand—thus ending up with the name the Yellow Fleet. Only two would ever sail on their own again.","zh":"1967年运河关闭时，有十五艘船被困在大苦湖，一直滞留到1975年运河重新开放。船员轮换下船，船只却留了下来，最终被沙漠的沙尘覆盖，因而得了“黄船队”之名。只有两艘后来还曾自行航行。"},{"id":"ch04-046","p":105,"t":"p","en":"US Army, from which McLean profited. In the late 1960s, the Soviet invasion of Czechoslovakia led to a buildup of American forces in Europe, and they needed to be constantly supplied by goods from the United States—a growing percentage of which was shipped by container.29 But when this relationship would really come to fruition was during Vietnam.","zh":"而麦克莱恩正是从美国陆军身上赚到了钱。20世纪60年代末，苏联入侵捷克斯洛伐克，美国在欧洲增兵，需要不断从国内运货补给——其中由集装箱运输的比例越来越大。29 但这层关系真正开花结果，是在越南战争期间。"},{"id":"ch04-047","p":105,"t":"p","en":"The huge cost of flowing goods to Vietnam led the army to be searching for solutions. McLean engaged in continuous negotiations with them to get them to adopt containerization, which they eventually did at Cam Ranh Bay in Vietnam and Subic Bay in the Philippines (one of the early prizes of the American colonial conquest of the Philippines). The large-scale use of containers by the US Army for supplying the Vietnam War made containerized shipping the go-to option for global trade.30","zh":"把物资运往越南的巨额成本，迫使陆军四处寻找办法。麦克莱恩与他们反复谈判，促使他们采用集装箱化，最终在越南的金兰湾与菲律宾的苏比克湾落了地（苏比克湾是美国殖民征服菲律宾的早期战利品之一）。美国陆军为供应越南战争而大规模使用集装箱，使集装箱运输成为全球贸易的首选方式。30"},{"id":"ch04-048","p":105,"t":"p","en":"Then came a further evolution, in somewhat circuitous fashion. The first Suez Crisis had caused the bulk carrier and oil tanker industry to drive for larger ships. A 2013 report by the World Trade Organization put it simply: \"Suddenly faced with the expense of transporting oil, coal, iron ore and other bulk commodities over much greater distances, the shipping industry decided to invest in huge, specialized bulk carriers as well as in the harbor facilities needed to handle these new vessels.\"31 The need to find efficient ways around the Suez closure led to innovations in shipping design. Specifically, the tanker industry developed larger, more cost-effective ships.","zh":"接着又发生了一次演进，过程颇为迂回。第一次苏伊士危机促使散货船与油轮行业追求更大的船。世界贸易组织2013年的一份报告说得很直白：“突然间要面对把石油、煤炭、铁矿石及其他大宗商品运往远得多的地方的成本，航运业决定投资建造巨型专业化散货船，并投资建设装卸这些新船所需的港口设施。”31 绕开苏伊士关闭、另寻高效航路的需要，催生了船舶设计上的创新。具体而言，油轮行业发展出了更大、成本更低的船型。"},{"id":"ch04-049","p":105,"t":"p","en":"The basic design of most ships resembles a rib cage laid flat. Most essential is the keel: a long, single beam that runs from the very front of the ship to the very rear—from bow to stern. Off the keel are a series of ribs, evenly spaced along the length of the keel, and rising up on each side—port and starboard, or left and right—to just above where the waterline will be. The ribs are then encased in a hull: wood or fiberglass or steel sheets that enclose the entire area below the water's surface, trapping air and creating buoyancy. What keeps a large, steel ship afloat is the buoyancy of the water trapped below sea level. But all of that wood or steel and air below water creates a heavy drag, slowing the ship.³² So for most of the eighteenth and nineteenth centuries, the effort in marine engineering was to find tighter shapes for the hull— ever steeper V shapes that while remaining stable and buoyant would reduce drag in the water and allow ships to sail faster. This was true of both naval and commercial vessels.","zh":"大多数船舶的基本结构，就像一个平放的胸腔。最要紧的是龙骨：一根贯通首尾的长梁，从船头直到船尾。龙骨上立着一列肋骨，沿龙骨的长度均匀分布，向两侧（左舷与右舷，也就是左右两边）升到水线稍上一点的位置。肋骨外面再包上船壳：木板、玻璃钢或钢板，把水面以下的整个空间封起来，留住空气，产生浮力。一艘巨大的钢船之所以浮得起来，靠的就是海平面以下那部分封闭空间所提供的浮力。但水下的这些木料或钢材连同空气，也造成了沉重的阻力，拖慢船速。32 因此，在18、19世纪的大部分时间里，船舶工程所做的努力，是给船壳找出更瘦削的线型——越来越陡的V形，既保持稳定与浮力，又减少水中的阻力，让船跑得更快。军舰与商船皆然。"},{"id":"ch04-050","p":106,"t":"p","en":"With the Suez Crisis, that changed. The basic innovation for tanker designers after the crisis was to move away from the V-shaped hulls, toward a U-shaped hull, with wider beams-the beam being the measure of the ship from side to side.³3 U-shaped hulls made ships slower, but more stable at longer lengths; and slower was an acceptable tradeoff for the tanker industry.34 At the time, more than 50 percent of oil imports to Europe came from the Middle East, and while a tanker could travel just 6,200 miles from the Persian Gulf to Britain through the Suez, with its closure that trip grew to 10,000 miles, as the tankers had to navigate around the Cape of Good Hope. Larger ships changed the price equation—if they carried larger loads, these ships would still be as cost-effective as shipping through the Suez, despite the longer route. A 1968 article argued that a 200,000-ton ship going around the cape could save 34 percent in costs compared to an 80,000-ton tanker going through the Suez. An oil analyst in New York wrote, \"The supertankers are not going to replace the Suez Canal, but they're going to go a long way to letting the industry live without the Suez.","zh":"苏伊士危机之后，这一切变了。危机之后，油轮设计师的基本创新是弃用V形船底，转向U形船底，船宽也更大——船宽指船体两侧之间的距离。33 U形船底让船变慢，但在更长的船体上更为稳定；而对油轮业来说，慢一点是可以接受的代价。34 当时，欧洲的石油进口有一半以上来自中东，油轮从波斯湾经苏伊士运河到英国只有6,200英里；运河一关，船得绕好望角，里程增至10,000英里。更大的船改变了价格算式——只要装得更多，即便绕远路，成本效益仍可与走苏伊士相当。1968年的一篇文章提出，一艘20万吨的船绕好望角，比一艘8万吨的油轮走苏伊士运河可节省34%的成本。纽约一位石油分析师写道：“超级油轮不会取代苏伊士运河，但它们将大有助于让这个行业在没有苏伊士运河的情况下活下去。”"},{"id":"ch04-051","p":106,"t":"p","en":"In the 1960s and early'70s, the container industry, unlike the tanker industry, was still using older standards for ship design, with V-shaped hulls designed to reduce drag in the water, and therefore allow for faster speeds. But faster speeds meant greater fuel consumption. The oil price spike in 1973 hit the container shipping industry hard.36","zh":"20世纪60年代到70年代初，集装箱行业与油轮业不同，仍在沿用旧的船舶设计标准：V形船底，目的是减少水中阻力，从而提高航速。但航速越高，油耗越大。1973年的油价暴涨，沉重打击了集装箱航运业。36"},{"id":"ch04-052","p":106,"t":"p","en":"What followed was a merger of two sets of innovations: the innovations in containerization and intermodality that had been driven by the US Army and McLean, and the innovations in U-shaped shipping design that had been driven by Suez and oil prices. The fusion of the two gave birth to the early antecedents of today's mega-container carriers.","zh":"接下来发生的是两套创新的汇流：一套是美国陆军与麦克莱恩推动的集装箱化与多式联运，另一套是苏伊士运河与油价推动的U形船体设计。两者的融合，孕育出今日巨型集装箱船的早期雏形。"},{"id":"ch04-053","p":106,"t":"p","en":"*On March 23, 2021, the Taiwanese container ship Ever Given ran aground in the Suez Canal, where it became stuck. Several hundred ships waiting to transit the canal were kept waiting for six days, while local authorities struggled to tow or otherwise dislodge the ship. The event generated a huge outpouring of social media comments about the fragility of global supply lines.","zh":"*2021年3月23日，台湾的集装箱船「长赐」号（Ever Given）在苏伊士运河搁浅，卡在那里动弹不得。数百艘等着过河的船被耽搁了六天，当地主管部门想尽办法拖拽，设法让它脱困。此事在社交媒体上引发大量评论，人们纷纷议论全球供应链何其脆弱。"},{"id":"ch04-054",
