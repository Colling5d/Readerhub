<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReaderHub · 在线阅读馆</title>
<style>
  :root{--bg:#faf8f4;--card:#fff;--ink:#2b2b2b;--mute:#7a766c;--accent:#8a4422;--line:#e6e1d6}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Source Serif Pro",Georgia,"Songti SC","Noto Serif CJK SC",serif;background:var(--bg);color:var(--ink)}
  header{padding:40px 24px 12px;text-align:center;background:linear-gradient(180deg,#fff,var(--bg))}
  header h1{margin:0 0 6px;font-size:28px;letter-spacing:1px}
  header p{margin:0;color:var(--mute);font-size:14px}
  .wrap{max-width:980px;margin:0 auto;padding:8px 20px 60px}
  .count{font-size:13px;color:var(--mute);margin:8px 2px 16px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;align-items:stretch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .12s ease,box-shadow .12s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
  .card h2{margin:0 0 4px;font-size:19px;line-height:1.35;flex:0 0 auto}
  .card .author{font-size:13px;color:var(--accent);font-style:italic;margin:0 0 10px;flex:0 0 auto}
  .card .desc{font-size:13.5px;color:var(--mute);line-height:1.7;margin:0;flex:1 1 auto}
  .card .meta{margin-top:auto;padding-top:14px;font-size:12px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap}
  .tag{background:#f1ece2;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px}
  .tag.lang{background:#8a4422;border-color:#8a4422;color:#fff}
  .empty{color:var(--mute);text-align:center;padding:60px 0;font-size:15px}
  footer{text-align:center;color:var(--mute);font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <h1>ReaderHub · 在线阅读馆</h1>
  <p>中英对照电子书库 —— 句子级跨语言对应高亮、笔记标注与全文检索，每本书一个独立页面。</p>
</header>
<div class="wrap">
  <div class="count" id="count"></div>
  <div id="grid"></div>
</div>
<footer>由 books/ 目录下的 metadata.json 自动生成 · <a id="githubLink" href="#" style="color:var(--accent)">仓库</a></footer>

<script>
// ---- 从 books/*/metadata.json 自动生成书籍卡片 ----
var BOOKS = [
  {
    "id": "cultures-colliding",
    "title": "Cultures Colliding",
    "subtitle": "American Missionaries, Chinese Resistance, and the Rise of Modern Institutions in China",
    "author": "John R. Haddad",
    "description": "《文化碰撞：美国传教士、中国抵抗与现代制度在中国的兴起》——一部中英对照的精读之作。从前言、导论直到十二章正文与结论，逐句双语呈现，附句子级跨语言对齐高亮，适合细读、摘录与对照研习。",
    "tags": ["history", "china", "missions"],
    "featured": true,
    "lang": "en-zh",
    "chapterCount": 17,
    "updated": "2024-09-30"
  },
  {
    "id": "chinese-americans-shared-history",
    "title": "Chinese and Americans: A Shared History",
    "subtitle": "《中国人与美国人——一部共有的历史》",
    "author": "Xu Guoqi 徐国琦",
    "description": "徐国琦以\"共同的历史\"视角，讲述中美两国从蒲安臣使团、留美幼童、戈鲲化，到古德诺、杜威与体育外交等相互塑造的篇章。全书英汉对照，含前言、六章正文、结语、注释、术语表、参考书目、致谢与索引，逐句双语呈现并附句子级跨语言对齐。", 
    "tags": ["history", "china", "america", "diplomacy", "shared-history"],
    "featured": true,
    "lang": "en-zh",
    "chapterCount": 15,
    "updated": "2024-10-04"
  },
  {
    "id": "fighting-cultural-front",
    "title": "Fighting on the Cultural Front",
    "subtitle": "U.S.-China Relations in the Cold War",
    "author": "Hongshan Li 李洪山",
    "description": "李洪山著《文化战线上的战斗：冷战时期的美中关系》——系统考察冷战时期美国与新中国如何在文化战线上展开争夺：从迪尔斯的新闻访华禁令、富布莱特学者与新闻记者的访华，到图书期刊流通与对华人的文化吸引，细致呈现两国超越武力的文化与意识形态交锋。全书英汉对照，含导言、八章正文、结语与注释，逐句双语呈现并附句子级跨语言对齐。",
    "tags": ["history", "china", "america", "cold-war", "culture", "diplomacy"],
    "featured": true,
    "lang": "en-zh",
    "chapterCount": 12,
    "updated": "2024-10-04"
  },
  {
    "id": "objectifying-china",
    "title": "Objectifying China, Imagining America",
    "subtitle": "Chinese Commodities in Early America",
    "author": "Caroline Frank 卡罗琳·弗兰克",
    "description": "卡罗琳·弗兰克著《物化中国，想象美国：早期美国生活中的中国商品》——以海外陶瓷、瓷器、茶叶、漆器家具等中国商品在早期殖民地北美的流通与消费为线索，论证北美殖民者通过消费中国物产在脑中建立起对中国的想象。全书英汉对照，含导言、五章正文、结语与注释，逐句双语呈现并附句子级跨语言对齐。",
    "tags": ["history", "china", "america", "trade", "material-culture", "colonial"],
    "featured": true,
    "lang": "en-zh",
    "chapterCount": 8,
    "updated": "2024-10-04"
  }
  /* __BOOKS__ */
];

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

// 把 lang 编码映射成可读的语言标签（不局限中英双语，可按书自定义）
function langLabel(lang){
  if(!lang) return '';
  var m = {'zh':'中文','en':'英文','en-zh':'中英','zh-en':'中英','en-cn':'中英',
           'fr':'法语','de':'德语','ja':'日语','ko':'韩语','es':'西班牙语','ru':'俄语'};
  return m[String(lang).toLowerCase()] || String(lang);
}

var grid = document.getElementById('grid');
if(!BOOKS || !BOOKS.length){
  grid.innerHTML = '<div class="empty">书库为空。<br>把阅读器放进 <b>books/&lt;book-id&gt;/index.html</b> 并添加 metadata.json 即可显示。</div>';
}else{
  // optional featured ordering
  BOOKS.sort(function(a,b){return (b.featured?1:0)-(a.featured?1:0)});
  grid.innerHTML = BOOKS.map(function(b){
    var lang = langLabel(b.lang);
    var langBadge = lang ? '<span class="tag lang">'+esc(lang)+'</span>' : '';
    var tags = (b.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('');
    var meta = (langBadge + tags);
    return '<a class="card" href="books/'+encodeURIComponent(b.id)+'/" >'+
      '<h2>'+esc(b.title)+'</h2>'+
      (b.author?'<div class="author">'+esc(b.author)+'</div>':'')+
      (b.description?'<p class="desc">'+esc(b.description)+'</p>':'')+
      (meta?'<div class="meta">'+meta+'</div>':'')+'</a>';
  }).join('');
}
document.getElementById('count').textContent = '共 ' + BOOKS.length + ' 本';
document.getElementById('githubLink').href = 'https://github.com/Colling5d/ReaderHub';
</script>
</body>
</html>
