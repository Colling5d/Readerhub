<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《明史》中的宦官传 · 俄汉对照</title>
<style>
  :root{
    --bg:#f7f5f0;
    --panel:#ffffff;
    --ink:#2b2b2b;
    --ink-soft:#6b6b6b;
    --accent:#8a3b2e;
    --accent-soft:#efe5df;
    --line:#e2ddd4;
    --sidebar-w:290px;
    --lang-head:#f0ebe2;
    --zh:#7a1313;
    --en:#133b7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,serif;
    font-size:17px;
    line-height:1.85;
  }
  .app{display:flex;height:100vh;overflow:hidden}

  /* ===== Sidebar ===== */
  .sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:#fbfaf7;
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .sidebar .brand{
    padding:18px 18px 14px;
    border-bottom:1px solid var(--line);
    background:var(--accent);
    color:#fff;
  }
  .sidebar .brand h1{font-size:19px;margin:0 0 2px;letter-spacing:.5px}
  .sidebar .brand p{font-size:12px;margin:0;opacity:.85;line-height:1.4}
  .toc{flex:1;overflow-y:auto;padding:10px 0 30px}
  .toc .toc-top{
    font-size:12px;color:var(--ink-soft);text-transform:uppercase;
    letter-spacing:1.5px;padding:8px 18px;
  }
  .toc-group{margin-bottom:4px}
  .toc-item{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:7px 18px;cursor:pointer;font-size:14.5px;font-family:inherit;
    color:var(--ink);border-left:3px solid transparent;line-height:1.35;
  }
  .toc-item:hover{background:var(--accent-soft)}
  .toc-item .sub{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:1px}
  .toc-item.active{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
  .toc-item.active .sub{color:var(--accent)}
  .toc-sep{border-top:1px solid var(--line);margin:8px 14px}

  /* ===== Search ===== */
  .search-box{position:relative;padding:12px 14px;border-bottom:1px solid var(--line)}
  .search-box #search-input{
    width:100%;box-sizing:border-box;padding:9px 11px;
    border:1px solid #d8d0c0;border-radius:6px;background:#fff;
    font-size:13.5px;font-family:inherit;color:var(--ink);outline:none;
  }
  .search-box #search-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(160,120,70,.15)}
  .search-results{
    position:absolute;left:14px;right:14px;top:calc(100% - 4px);
    background:#fff;border:1px solid #ddd4c2;border-radius:8px;
    box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:50;
    max-height:min(46vh,420px);overflow-y:auto;display:none;
  }
  .search-results.open{display:block}
  .search-results .sr-head{
    font-size:11px;color:var(--ink-soft);text-transform:uppercase;
    letter-spacing:1px;padding:8px 12px 4px;border-bottom:1px solid var(--line);
  }
  .sr-item{padding:7px 12px;cursor:pointer;border-bottom:1px solid #f1ece2}
  .sr-item:hover{background:var(--accent-soft)}
  .sr-item .sr-meta{font-size:11px;color:var(--ink-soft);margin-bottom:2px}
  .sr-item .sr-meta b{color:var(--accent);font-weight:600}
  .sr-item .sr-text{font-size:12.5px;line-height:1.45;color:var(--ink)}
  .sr-item .sr-text mark{background:#ffe9a8;color:#5a3d00;border-radius:2px;padding:0 1px}
  .sr-empty{padding:12px;font-size:12.5px;color:var(--ink-soft);text-align:center}

  /* ===== Main ===== */
  .main{flex:1;display:flex;overflow:hidden}
  .col{flex:1;overflow-y:auto;padding:0 44px 120px}
  .col.en{border-right:1px solid var(--line)}
  .col-head{
    position:sticky;top:0;z-index:5;padding:16px 44px;
    background:var(--lang-head);border-bottom:1px solid var(--line);
    font-size:13px;letter-spacing:2px;text-transform:uppercase;
    font-family:"Helvetica Neue",Arial,sans-serif;font-weight:600;
  }
  .col.zh .col-head{color:var(--zh)}
  .col.en .col-head{color:var(--en)}
  .article{max-width:760px;margin:0 auto}
  .chapter-title{
    font-size:28px;font-weight:700;line-height:1.35;margin:36px 0 6px;
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,serif;
  }
  .chapter-sub{font-size:16px;color:var(--ink-soft);margin:0 0 28px;font-style:italic}
  .p{margin:0 0 1.25em;text-align:justify}
  .p.title{font-size:22px;font-weight:700;margin:2.2em 0 .6em;color:var(--accent)}
  .col.zh .p.title{color:var(--zh)}
  .col.en .p.title{color:var(--en)}
  .p.txt-marker{color:var(--ink-soft);font-size:13px;text-align:center;letter-spacing:3px;margin:3em 0}
  .notes-head,.bib-head{
    font-size:24px;font-weight:700;margin:34px 0 16px;
  }
  .note{font-size:15px;line-height:1.7;margin:0 0 .9em;color:#3a3a3a}

  /* Para-level follow: highlight the matched paragraph in the paired column */
  [data-lang] {transition:background-color .18s ease}
  [data-lang]:hover{background:rgba(180,160,120,.10);cursor:pointer;border-radius:3px}

  /* EN column serif italic look */
  .col.en{font-family:"Source Serif Pro",Georgia,serif;font-size:16.5px;color:#1f1f1f}
  .col.en .p{line-height:1.7}

  /* Scrollbar */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfc8bc;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  /* Progress */
  @media (max-width:1200px){
    .sidebar{--sidebar-w:240px;width:240px;flex-basis:240px}
    .col{padding:0 28px 100px}
    .col-head{padding:14px 28px}
  }
  @media (max-width:900px){
    /* ---- 手机上保持 中英左右两栏对照 ---------------- */
    html,body{height:100%;overscroll-behavior:none}
    html{-webkit-text-size-adjust:100%}
    html,body{margin:0}
    .app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
    body{background:var(--bg)}

    /* 侧边栏：顶部紧凑（宽度方向不占正文） */
    .sidebar{position:relative;transform:none;width:100%;flex:none;max-height:44vh;min-height:0;
             border-right:none;border-bottom:1px solid var(--line);overflow-y:auto;
             box-shadow:none}
    .sidebar .brand{padding:8px 12px}
    .sidebar .brand h1{font-size:16px}
    .sidebar .brand p{font-size:11px}
    .toc{padding:4px 0 12px}
    .toc-item{padding:5px 12px;font-size:13px}
    .search-box{padding:8px 12px}
    .search-results{max-height:150px}

    /* 主体：左右两栏，各占一半，自有滚动 */
    .main{flex:1;display:flex;min-height:0;overflow:hidden}
    .col{flex:1 1 0;min-width:0;width:auto;height:auto;position:static;
         overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 90px;
         -webkit-user-select:text;-webkit-touch-callout:none}
    .col .p{-webkit-user-select:text;user-select:text}
    .col.en{border-right:1px solid var(--line)}
    .col-head{position:static;font-size:12px;padding:8px 10px}
    .col .p{font-size:13.5px;line-height:1.6;text-align:justify;margin:0 0 .55em;hyphens:auto}
    .col.en .p{font-size:12.5px;line-height:1.55}
    .chapter-title{font-size:19px;margin:16px 0 3px}
    .chapter-sub{font-size:12px;margin-bottom:12px;line-height:1.4}
    .article{max-width:100%}

    /* 笔记面板 / 工具栏 小屏适配 */
    #note-panel{left:10px;right:10px;width:auto;top:auto;bottom:12px;max-height:60vh}
    #note-toolbar{max-width:97vw;flex-wrap:wrap}
    #note-toast{bottom:16px}
    .makenote{bottom:14px;right:14px}
  }

  /* ===== 笔记：画线/高亮 ===== */
  .hlmark{padding:0 1px;border-radius:2px}
  .ulnote{text-decoration:underline;text-decoration-thickness:2px;-webkit-text-decoration-color:#e8504a;text-decoration-color:#e8504a}
  #note-toolbar{position:fixed;display:none;z-index:9999;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.16);padding:6px 8px;gap:4px;font-family:inherit}
  #note-toolbar .nt{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:4px;border:1px solid var(--line);cursor:pointer;margin:0 2px;font-size:12px;color:#555;background:#fff}
  #note-toolbar .nt:hover{border-color:var(--accent)}
  #note-toolbar .nt.ul{width:auto;padding:0 8px;font-weight:bold;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#e8504a}
  #note-toolbar .nt.colors{width:auto;padding:0 4px}
  #note-toolbar .hlc{width:18px;height:18px;border-radius:3px;border:1px solid rgba(0,0,0,.18);cursor:pointer;margin:0 1px;display:inline-block}
  #note-toolbar .nt.cpy{width:auto;padding:0 9px;font-size:12px}
  /* 句子高亮：临时（选中句子时） */
  .senthl{background:#f5e660;border-radius:2px;padding:0 1px}
  /* 跨语言对应句高亮 */
  .peer-sent{background:#a7d3ff;border-bottom:2px solid #2f6fb3;border-radius:2px;cursor:pointer}
  .makenote{position:fixed;bottom:22px;right:22px;z-index:9998;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:13px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);font-family:inherit}
  .makenote:hover{filter:brightness(1.1)}
  #note-panel{position:fixed;top:16px;right:16px;width:320px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);z-index:10000;display:none;font-family:inherit;font-size:13px}
  #note-panel.np-open{display:block}
  #note-panel .np-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
  #note-panel .np-head b{font-size:15px}
  #note-panel .np-head button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:2px 6px}
  #note-panel .np-item{border-bottom:1px solid var(--line);padding:9px 14px;cursor:pointer}
  #note-panel .np-item:hover{background:#faf7f2}
  #note-panel .np-item .np-meta{font-size:11px;color:var(--mute);margin-bottom:3px;display:flex;gap:6px;align-items:center}
  #note-panel .np-text{line-height:1.55;color:var(--ink);word-break:break-word}
  #note-panel .np-empty{padding:24px;color:var(--mute);text-align:center}
  #note-toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;z-index:10001;opacity:0;transition:opacity .25s;pointer-events:none}
  #note-toast.nt-show{opacity:1}
  /* sync jump */
  .go-en,.go-zh{cursor:pointer;color:var(--accent)}

  /* ===== 目录折叠交互 (SIDEBAR-TOGGLE) ===== */
  /* 贴在侧栏右缘的竖向把手（经典折叠面板样式），不会遮挡任何内容 */
  .sidebar-toggle{
    position:fixed;z-index:9990;top:50%;
    left:calc(var(--sidebar-w) - 15px);transform:translateY(-50%);
    width:22px;height:52px;border-radius:0 8px 8px 0;
    border:1px solid var(--line);border-left:none;
    background:#fbfaf7;color:var(--accent);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;line-height:1;padding:0;
    box-shadow:2px 0 6px rgba(0,0,0,.06);
    transition:left .22s ease, background .15s ease, color .15s ease;
  }
  .sidebar-toggle:hover{background:var(--accent);color:#fff}
  /* 折叠后把手贴到最左 */
  .app.sidebar-collapsed .sidebar-toggle{left:0}

  /* 侧栏折叠动画 */
  .sidebar{transition:margin-left .22s ease}
  .app.sidebar-collapsed .sidebar{margin-left:calc(-1 * var(--sidebar-w))}

  /* 手机端：顶栏折叠，把手改为右上角小圆钮 */
  @media (max-width:900px){
    .sidebar-toggle{
      top:8px;right:8px;left:auto;transform:none;
      width:30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.4);
      background:rgba(0,0,0,.2);color:#fff;box-shadow:none;font-size:14px;
    }
    .sidebar-toggle:hover{background:rgba(0,0,0,.35);color:#fff}
    .app.sidebar-collapsed .sidebar-toggle{left:auto;right:8px;background:var(--accent);border-color:transparent}
    /* 手机上折叠=顶栏收起 */
    .app.sidebar-collapsed .sidebar{max-height:0;min-height:0;border-bottom:none;overflow:hidden}
  }

  /* ===== 阅读主题 / 字体 / 章节 HUD (READER-THEME-HUD) ===== */

  /* --- 主题：通过 data-theme 覆盖 CSS 变量 --- */
  html[data-theme="sepia"]{
    --bg:#f3ead8;
    --panel:#faf3e3;
    --ink:#43382a;
    --ink-soft:#7d6f58;
    --accent:#8a5a2b;
    --accent-soft:#ece0c6;
    --line:#ddcfb0;
    --lang-head:#ebdfc5;
    --zh:#7a3a13;
    --en:#3a4a2f;
  }
  html[data-theme="dark"]{
    --bg:#1d2024;
    --panel:#26292e;
    --ink:#dfe3e8;
    --ink-soft:#98a0aa;
    --accent:#c98b6b;
    --accent-soft:#33383f;
    --line:#3a3f46;
    --lang-head:#2b2f35;
    --zh:#e6a08a;
    --en:#8fb6e8;
  }
  html[data-theme="night"]{
    --bg:#0e0f11;
    --panel:#16181b;
    --ink:#c9ccd1;
    --ink-soft:#7d838c;
    --accent:#b0785c;
    --accent-soft:#202327;
    --line:#26292e;
    --lang-head:#181a1d;
    --zh:#d99a84;
    --en:#84a9d6;
  }
  html[data-theme="dark"],html[data-theme="night"]{color-scheme:dark}
  html[data-theme="dark"] body,html[data-theme="night"] body{background:var(--bg);color:var(--ink)}
  html[data-theme="dark"] .sidebar,html[data-theme="night"] .sidebar{background:var(--panel)}
  html[data-theme="dark"] .sidebar .brand,html[data-theme="night"] .sidebar .brand{color:#fff}
  html[data-theme="dark"] .search-box #search-input,
  html[data-theme="night"] .search-box #search-input{background:var(--bg);color:var(--ink);border-color:var(--line)}
  html[data-theme="dark"] .search-results,
  html[data-theme="night"] .search-results{background:var(--panel);border-color:var(--line)}
  html[data-theme="dark"] .sr-item,html[data-theme="night"] .sr-item{border-bottom-color:var(--line)}
  html[data-theme="dark"] .sr-item:hover,html[data-theme="night"] .sr-item:hover{background:var(--accent-soft)}
  html[data-theme="dark"] .col.en,html[data-theme="night"] .col.en{color:var(--ink)}
  html[data-theme="dark"] .note,html[data-theme="night"] .note{color:var(--ink-soft)}
  html[data-theme="dark"] #note-toolbar,html[data-theme="dark"] #note-panel,
  html[data-theme="night"] #note-toolbar,html[data-theme="night"] #note-panel{background:var(--panel);color:var(--ink);border-color:var(--line)}
  html[data-theme="dark"] #note-panel .np-head,html[data-theme="night"] #note-panel .np-head{background:var(--panel);border-bottom-color:var(--line)}
  html[data-theme="dark"] #note-panel .np-item:hover,html[data-theme="night"] #note-panel .np-item:hover{background:var(--accent-soft)}
  html[data-theme="dark"] #note-toolbar .nt,html[data-theme="night"] #note-toolbar .nt{background:var(--bg);color:var(--ink);border-color:var(--line)}
  html[data-theme="dark"] .sidebar-toggle,html[data-theme="night"] .sidebar-toggle{background:var(--panel);color:var(--accent)}
  html[data-theme="dark"] ::-webkit-scrollbar-thumb,html[data-theme="night"] ::-webkit-scrollbar-thumb{background:#4a4f57}
  html[data-theme="sepia"] .sidebar{background:#faf3e3}

  /* ===================================================================
     趣味主题（与首页 add_home_theme.py 保持一致）：配色 + 纹样 + 装饰
     阅读器变量集：--bg --panel --ink --ink-soft --accent --accent-soft
                   --line --lang-head --zh --en
     =================================================================== */

  /* 动漫 */
  html[data-theme="anime"]{
    --bg:#fdf2f6;--panel:#ffffff;--ink:#3b2c3a;--ink-soft:#6f5266;
    --accent:#e26d9c;--accent-soft:#fbe0ec;--line:#f3d3e0;
    --lang-head:#fbe7f0;--zh:#a83a66;--en:#255f80;
    --rv-radius:18px;
    --rv-pattern:
      radial-gradient(circle at 12% 18%, rgba(255,183,206,.55) 0 6px, transparent 7px),
      radial-gradient(circle at 82% 62%, rgba(170,208,255,.5) 0 5px, transparent 6px),
      radial-gradient(circle at 40% 84%, rgba(255,214,102,.45) 0 4px, transparent 5px),
      radial-gradient(circle at 66% 12%, rgba(255,183,206,.4) 0 4px, transparent 5px);
    --rv-pattern-size:520px 520px,460px 460px,600px 600px,480px 480px;
  }
  /* 像素 */
  html[data-theme="pixel"]{
    --bg:#1a1c2c;--panel:#2b2d42;--ink:#f4f4f4;--ink-soft:#a7acce;
    --accent:#41e0a0;--accent-soft:#22303a;--line:#3b3f5c;
    --lang-head:#222436;--zh:#86f0c2;--en:#8fb6e8;
    --rv-radius:0px;--rv-font:"Courier New",ui-monospace,monospace;
    --rv-pattern:
      linear-gradient(rgba(65,224,160,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(65,224,160,.09) 1px, transparent 1px);
    --rv-pattern-size:22px 22px;color-scheme:dark;
  }
  /* 赛博朋克 */
  html[data-theme="cyber"]{
    --bg:#07070f;--panel:#101024;--ink:#d8e6ff;--ink-soft:#95a2d0;
    --accent:#00e5ff;--accent-soft:#161a3a;--line:#2a2f5c;
    --lang-head:#131634;--zh:#7df3ff;--en:#ff9ce8;
    --rv-radius:6px;--rv-font:ui-monospace,"SFMono-Regular",Menlo,monospace;
    --rv-pattern:
      repeating-linear-gradient(0deg, rgba(0,229,255,.07) 0 1px, transparent 1px 42px),
      repeating-linear-gradient(90deg, rgba(255,0,200,.07) 0 1px, transparent 1px 42px);
    --rv-pattern-size:auto;color-scheme:dark;
  }
  /* 水墨 */
  html[data-theme="ink"]{
    --bg:#f6f3ec;--panel:#fbf9f3;--ink:#20201d;--ink-soft:#57544b;
    --accent:#9c2b25;--accent-soft:#ece5d8;--line:#d8d2c4;
    --lang-head:#efe9dc;--zh:#8a2a22;--en:#3f4a55;
    --rv-radius:4px;--rv-font:"STKaiti","Kaiti SC","KaiTi",serif;
    --rv-pattern:
      radial-gradient(ellipse 55% 38% at 8% 12%, rgba(40,40,40,.07), transparent 70%),
      radial-gradient(ellipse 42% 30% at 92% 82%, rgba(40,40,40,.055), transparent 72%),
      radial-gradient(ellipse 30% 22% at 72% 22%, rgba(156,43,37,.05), transparent 70%);
    --rv-pattern-size:auto;
  }
  /* 森林 */
  html[data-theme="forest"]{
    --bg:#f1f5ee;--panel:#ffffff;--ink:#243024;--ink-soft:#5b6a55;
    --accent:#3f7d4f;--accent-soft:#e0eede;--line:#cfe0cb;
    --lang-head:#e8f2e5;--zh:#2f6a3c;--en:#4a5f7a;
    --rv-radius:14px;--rv-font:"Yuanti SC","PingFang SC",serif;
    --rv-pattern:
      radial-gradient(circle at 20% 30%, rgba(104,160,104,.14) 0 14px, transparent 15px),
      radial-gradient(circle at 70% 70%, rgba(104,160,104,.1) 0 20px, transparent 21px),
      radial-gradient(circle at 88% 18%, rgba(160,140,90,.12) 0 10px, transparent 11px);
    --rv-pattern-size:600px 600px,700px 700px,500px 500px;
  }
  /* 海洋 */
  html[data-theme="ocean"]{
    --bg:#eef6fb;--panel:#ffffff;--ink:#14313f;--ink-soft:#4d7183;
    --accent:#1273a8;--accent-soft:#dcecf6;--line:#c9e0ee;
    --lang-head:#e3f1f9;--zh:#0d5f8a;--en:#2b6a8f;
    --rv-radius:16px;--rv-font:"Yuanti SC","PingFang SC",serif;
    --rv-pattern:
      repeating-radial-gradient(circle at 50% 120%, rgba(18,115,168,.07) 0 2px, transparent 2px 26px);
    --rv-pattern-size:auto;
  }
  /* 复古报纸 */
  html[data-theme="news"]{
    --bg:#f2ede1;--panel:#fbf7ec;--ink:#23211c;--ink-soft:#5c5849;
    --accent:#8c2d22;--accent-soft:#e7e0d1;--line:#cbc3b0;
    --lang-head:#eee8da;--zh:#8c2d22;--en:#3f4a55;
    --rv-radius:2px;--rv-font:"Times New Roman",Georgia,serif;
    --rv-pattern:
      repeating-linear-gradient(90deg, rgba(60,55,40,.05) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(0deg, rgba(60,55,40,.05) 0 1px, transparent 1px 4px);
    --rv-pattern-size:auto;
  }
  /* 糖果 */
  html[data-theme="candy"]{
    --bg:#fff7f0;--panel:#ffffff;--ink:#3d2f3a;--ink-soft:#6f5866;
    --accent:#e85c37;--accent-soft:#ffe6de;--line:#ffd0bf;
    --lang-head:#fff0ea;--zh:#b23a1a;--en:#255f80;
    --rv-radius:20px;--rv-font:"Yuanti SC","PingFang SC",serif;
    --rv-pattern:
      repeating-conic-gradient(from 0deg at 20% 25%, rgba(255,196,102,.16) 0deg 8deg, transparent 8deg 45deg),
      repeating-conic-gradient(from 0deg at 78% 72%, rgba(120,200,255,.14) 0deg 10deg, transparent 10deg 50deg);
    --rv-pattern-size:auto;
  }
  /* 热血漫画 */
  html[data-theme="manga"]{
    --bg:#fbfbfb;--panel:#ffffff;--ink:#111111;--ink-soft:#4a4a4a;
    --accent:#e0a800;--accent-soft:#f5eccd;--line:#d8d8d8;
    --lang-head:#f2f2f2;--zh:#8a5f00;--en:#333333;
    --rv-radius:4px;--rv-font:"Impact","Haettenschweiler","Arial Black",sans-serif;
    --rv-pattern:radial-gradient(circle at 1px 1px, rgba(0,0,0,.16) 1.2px, transparent 0);
    --rv-pattern-size:13px 13px;
  }
  /* 樱花夜 */
  html[data-theme="sakura"]{
    --bg:#1b1430;--panel:#241a3d;--ink:#f0e6ff;--ink-soft:#b3a5d6;
    --accent:#ff9ecb;--accent-soft:#312348;--line:#3a2c58;
    --lang-head:#211838;--zh:#ffb6d5;--en:#b9a7ff;
    --rv-radius:16px;
    --rv-pattern:
      radial-gradient(circle at 16% 22%, rgba(255,158,203,.22) 0 5px, transparent 6px),
      radial-gradient(circle at 68% 58%, rgba(180,160,255,.2) 0 4px, transparent 5px),
      radial-gradient(circle at 42% 82%, rgba(255,158,203,.16) 0 6px, transparent 7px);
    --rv-pattern-size:420px 420px,520px 520px,600px 600px;color-scheme:dark;
  }
  /* 蒸汽波 */
  html[data-theme="vapor"]{
    --bg:#241b4a;--panel:#2e2360;--ink:#f7e9ff;--ink-soft:#c3b3f0;
    --accent:#ff77e1;--accent-soft:#3a2a6b;--line:#453678;
    --lang-head:#2a1f57;--zh:#ffa4ec;--en:#8fd8ff;
    --rv-radius:8px;--rv-font:"Trebuchet MS","PingFang SC",sans-serif;
    --rv-pattern:
      repeating-linear-gradient(0deg, rgba(0,229,255,.13) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(255,119,225,.13) 0 1px, transparent 1px 34px);
    --rv-pattern-size:auto;color-scheme:dark;
  }

  /* --- 侧栏跟随主题面板色（原书硬编码 #fbfaf7，这里统一改为 --panel） --- */
  html[data-theme] .sidebar{background:var(--panel)}

  /* --- 趣味主题：所有暗色系通用覆盖（保持正文可读） --- */
  html[data-theme="pixel"] body,html[data-theme="cyber"] body,
  html[data-theme="sakura"] body,html[data-theme="vapor"] body{background:var(--bg);color:var(--ink)}
  html[data-theme="pixel"] .sidebar,html[data-theme="cyber"] .sidebar,
  html[data-theme="sakura"] .sidebar,html[data-theme="vapor"] .sidebar{background:var(--panel)}
  html[data-theme="pixel"] .sidebar .brand,html[data-theme="cyber"] .sidebar .brand,
  html[data-theme="sakura"] .sidebar .brand,html[data-theme="vapor"] .sidebar .brand{color:var(--ink)}
  html[data-theme="pixel"] .search-box #search-input,html[data-theme="cyber"] .search-box #search-input,
  html[data-theme="sakura"] .search-box #search-input,html[data-theme="vapor"] .search-box #search-input{
    background:var(--bg);color:var(--ink);border-color:var(--line)}
  html[data-theme="pixel"] .search-results,html[data-theme="cyber"] .search-results,
  html[data-theme="sakura"] .search-results,html[data-theme="vapor"] .search-results{
    background:var(--panel);border-color:var(--line)}
  html[data-theme="pixel"] .sr-item:hover,html[data-theme="cyber"] .sr-item:hover,
  html[data-theme="sakura"] .sr-item:hover,html[data-theme="vapor"] .sr-item:hover{background:var(--accent-soft)}
  html[data-theme="pixel"] #note-toolbar,html[data-theme="cyber"] #note-toolbar,
  html[data-theme="sakura"] #note-toolbar,html[data-theme="vapor"] #note-toolbar,
  html[data-theme="pixel"] #note-panel,html[data-theme="cyber"] #note-panel,
  html[data-theme="sakura"] #note-panel,html[data-theme="vapor"] #note-panel{
    background:var(--panel);color:var(--ink);border-color:var(--line)}
  html[data-theme="pixel"] #note-panel .np-item:hover,html[data-theme="cyber"] #note-panel .np-item:hover,
  html[data-theme="sakura"] #note-panel .np-item:hover,html[data-theme="vapor"] #note-panel .np-item:hover{
    background:var(--accent-soft)}
  html[data-theme="pixel"] .sidebar-toggle,html[data-theme="cyber"] .sidebar-toggle,
  html[data-theme="sakura"] .sidebar-toggle,html[data-theme="vapor"] .sidebar-toggle{
    background:var(--panel);color:var(--accent)}
  html[data-theme="pixel"] ::-webkit-scrollbar-thumb,html[data-theme="cyber"] ::-webkit-scrollbar-thumb,
  html[data-theme="sakura"] ::-webkit-scrollbar-thumb,html[data-theme="vapor"] ::-webkit-scrollbar-thumb{
    background:#4a4f57}
  html[data-theme="pixel"] .col.en,html[data-theme="cyber"] .col.en,
  html[data-theme="sakura"] .col.en,html[data-theme="vapor"] .col.en{color:var(--ink)}

  /* --- 趣味主题：纹样背景层（固定在正文之后） --- */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:var(--rv-pattern,none);background-size:var(--rv-pattern-size,auto);
    opacity:.95;
  }
  /* 保证正文在纹样之上 */
  .app,.sidebar,.main,.article{position:relative;z-index:1}

  /* --- 趣味主题：装饰（圆角 / 字体族 / 阴影） --- */
  html[data-theme="anime"] .sidebar,html[data-theme="forest"] .sidebar,
  html[data-theme="ocean"] .sidebar,html[data-theme="candy"] .sidebar,
  html[data-theme="sakura"] .sidebar{box-shadow:inset -1px 0 0 var(--line)}
  html[data-theme="pixel"] body{font-family:"Courier New",ui-monospace,monospace}
  html[data-theme="ink"] .chapter-title,html[data-theme="ink"] .p.title{letter-spacing:3px}
  html[data-theme="news"] .chapter-title{letter-spacing:1px;text-transform:uppercase}
  html[data-theme="manga"] .hlmark,html[data-theme="manga"] .senthl{box-shadow:0 0 0 1px #111}
  html[data-theme="cyber"] .chapter-title{text-shadow:0 0 10px rgba(0,229,255,.55),0 0 20px rgba(255,0,200,.35)}
  html[data-theme="cyber"] .reader-settings-btn{background:var(--accent);color:#07070f;border-color:var(--accent);
    box-shadow:0 0 14px rgba(0,229,255,.6)}
  html[data-theme="pixel"] .reader-settings-btn,html[data-theme="pixel"] .reader-settings .rs-opt,
  html[data-theme="pixel"] .reader-settings .rs-sw{border-radius:0}
  html[data-theme="pixel"] .reader-settings-btn{box-shadow:3px 3px 0 #0f1020}
  html[data-theme="manga"] .reader-settings-btn{box-shadow:3px 3px 0 #111}

  /* --- 字体族切换：--reader-font 由 JS 设置 --- */
  body{font-family:var(--reader-font, "Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,serif)}
  .chapter-title,.chapter-sub,#note-panel,.makenote,.toc-item,.search-box{font-family:var(--reader-font, inherit)}
  /* EN 栏保留衬线，但跟随所选字体族（楷/黑体时也统一） */
  body[data-font="sans"] .col.en{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}

  /* --- 字号：--reader-scale 缩放两栏正文 --- */
  .col{font-size:calc(17px * var(--reader-scale,1))}
  .col.en{font-size:calc(16.5px * var(--reader-scale,1))}
  .col.en .p{font-family:inherit}
  .chapter-title{font-size:calc(28px * var(--reader-scale,1))}
  .chapter-sub{font-size:calc(16px * var(--reader-scale,1))}
  .p.title{font-size:calc(22px * var(--reader-scale,1))}
  .note{font-size:calc(15px * var(--reader-scale,1))}

  /* --- 目录当前章节：强化高亮 --- */
  .toc-item.active{background:var(--accent-soft)!important;border-left-color:var(--accent)!important;
    color:var(--accent);font-weight:700}

  /* --- 设置面板（齿轮） --- */
  .reader-settings-btn{
    position:fixed;z-index:9991;bottom:22px;left:22px;
    width:auto;padding:10px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--accent);cursor:pointer;font-family:inherit;
    font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.18);
  }
  .reader-settings-btn:hover{filter:brightness(1.06)}
  .reader-settings{
    position:fixed;z-index:10002;bottom:70px;left:22px;width:340px;
    max-height:78vh;overflow:auto;
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.28);
    padding:14px 16px 16px;display:none;font-family:var(--reader-font,inherit);font-size:13px;
  }
  .reader-settings.open{display:block}
  .reader-settings h4{margin:0 0 10px;font-size:13px;letter-spacing:1px;color:var(--accent);
    text-transform:uppercase}
  .reader-settings .rs-row{margin-bottom:14px}
  .reader-settings .rs-row:last-child{margin-bottom:0}
  .reader-settings .rs-label{font-size:11px;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.5px}
  .reader-settings .rs-opts{display:flex;flex-wrap:wrap;gap:6px}
  .reader-settings .rs-opt{
    padding:5px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer;
    background:var(--bg);color:var(--ink);font-size:12.5px;font-family:inherit;line-height:1.2;
  }
  .reader-settings .rs-opt:hover{border-color:var(--accent)}
  .reader-settings .rs-opt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .reader-settings .rs-swatches{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:15px}
  .reader-settings .rs-sw{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);
    cursor:pointer;position:relative;overflow:hidden}
  .reader-settings .rs-sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .reader-settings .rs-sw span{position:absolute;bottom:-15px;left:-4px;right:-4px;text-align:center;
    font-size:10px;color:var(--ink-soft);white-space:nowrap}
  .reader-settings .rs-sw .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:16px;line-height:1}

  /* --- 当前章节 HUD（侧栏折叠时出现）：紧凑、自动隐去、不遮挡 --- */
  .chapter-hud{
    position:fixed;z-index:9992;top:10px;right:14px;transform:translateY(-10px);
    max-width:min(60vw,420px);
    background:color-mix(in srgb, var(--panel) 82%, transparent);
    -webkit-backdrop-filter:saturate(1.2) blur(6px);backdrop-filter:saturate(1.2) blur(6px);
    color:var(--ink-soft);border:1px solid var(--line);
    border-radius:999px;padding:3px 12px;font-size:12px;line-height:1.5;
    font-family:var(--reader-font,inherit);
    box-shadow:0 3px 12px rgba(0,0,0,.10);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chapter-hud .ch-hud-tag{color:var(--accent);font-weight:600;flex:none;opacity:.85}
  .chapter-hud .ch-hud-name{overflow:hidden;text-overflow:ellipsis;max-width:42vw}
  /* 仅在侧栏折叠时可见/可交互 */
  .app.sidebar-collapsed ~ .chapter-hud{pointer-events:auto}
  .app.sidebar-collapsed ~ .chapter-hud.ch-hud-show{opacity:1;transform:translateY(0)}
  .chapter-hud:hover{opacity:1!important;color:var(--ink);border-color:var(--accent)}

  /* 手机端：设置按钮与 HUD 适配 */
  @media (max-width:900px){
    .reader-settings-btn{bottom:14px;left:14px;padding:8px 12px;font-size:12px}
    .reader-settings{left:10px;right:10px;width:auto;bottom:58px}
    .chapter-hud{top:8px;right:10px;bottom:auto;max-width:calc(100vw - 100px);font-size:11px;padding:3px 10px}
    .chapter-hud .ch-hud-name{max-width:52vw}
  }

  /* ===== 脚注悬浮提示 (FOOTNOTE-TOOLTIP) ===== */
  .fnmark{cursor:help;color:var(--accent);font-weight:600;padding:0 1px}
  .fnmark:hover{text-decoration:underline;text-underline-offset:2px}
  #fn-tip{
    position:fixed;z-index:10060;max-width:min(440px,82vw);
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.28);
    padding:10px 13px;font-size:13px;line-height:1.65;
    font-family:var(--reader-font,inherit);
    display:none;pointer-events:none;
  }
  #fn-tip.on{display:block}
  #fn-tip .fn-tip-num{font-size:11px;color:var(--accent);font-weight:700;
    letter-spacing:.6px;margin-bottom:5px}
  #fn-tip .fn-tip-body{max-height:42vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
  #fn-tip .fn-tip-alt{color:var(--ink-soft,#8a8a8a);font-style:italic}

  /* ===== 笔记删除 + 批量导出 (NOTES-EXPORT) ===== */
  #note-panel .np-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  #note-panel .np-tools button{background:none;border:none;cursor:pointer;font-size:13px;
    padding:2px 6px;font-family:inherit}
  #note-panel .np-tools button.exp{color:var(--accent)}
  #note-panel .np-tools button.clr{color:#c0392b}
  #note-panel .np-meta .np-del{margin-left:auto;flex:0 0 auto;border:none;background:none;
    color:#b9b3a8;cursor:pointer;font-size:13px;line-height:1;padding:0 4px;font-family:inherit}
  #note-panel .np-meta .np-del:hover{color:#c0392b}
  /* 导出选择浮层 */
  #np-export{position:fixed;z-index:10030;background:var(--panel,#fff);color:var(--ink,#2b2b2b);
    border:1px solid var(--line,#e6e1d6);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.24);
    padding:6px;display:none;font-family:var(--reader-font,inherit)}
  #np-export.on{display:block}
  #np-export button{display:block;width:100%;text-align:left;background:none;border:none;
    cursor:pointer;padding:8px 12px;border-radius:7px;font-size:13px;color:inherit;font-family:inherit;
    white-space:nowrap}
  #np-export button:hover{background:var(--accent-soft,rgba(138,68,34,.09))}
  #np-export .np-exp-sep{height:1px;background:var(--line,#e6e1d6);margin:5px 4px}

  /* ===== 语言栏显示切换 (LANG-TOGGLE) ===== */
  .lang-toggle{
    position:fixed;z-index:9993;bottom:22px;left:50%;transform:translateX(-50%);
    display:inline-flex;align-items:center;gap:2px;padding:3px;
    border-radius:999px;
    background:var(--panel,#fbfaf7);border:1px solid var(--line,#e6e1d6);
    box-shadow:0 6px 18px rgba(0,0,0,.18);
    font-family:var(--reader-font,inherit);
  }
  .lang-toggle .lt-btn{
    border:0;background:transparent;color:var(--ink,#2b2b2b);
    font-family:inherit;font-size:12.5px;line-height:1;white-space:nowrap;
    padding:6px 13px;border-radius:999px;cursor:pointer;
    transition:background .15s ease,color .15s ease;
  }
  .lang-toggle .lt-btn:hover{background:rgba(180,160,120,.20)}
  .lang-toggle .lt-btn.on{background:var(--accent,#b99a5b);color:#fff}
  .lang-toggle .lt-sep{width:1px;height:14px;background:var(--line,#e6e1d6);opacity:.7}

  /* 栏头右上角常驻的「隐藏 / 显示」小按钮（最容易发现的位置） */
  .lt-head-btn{
    float:right;margin:-1px 0 0 12px;padding:2px 11px;
    border:1px solid var(--line,#e6e1d6);border-radius:999px;
    background:var(--panel,#fbfaf7);color:var(--ink,#2b2b2b);
    font-family:inherit;font-size:11px;line-height:1.7;
    letter-spacing:0;text-transform:none;white-space:nowrap;cursor:pointer;
    transition:background .15s ease,color .15s ease;
  }
  .lt-head-btn:hover{background:var(--accent,#b99a5b);color:#fff;border-color:transparent}
  .lt-head-btn.on{background:var(--accent,#b99a5b);color:#fff;border-color:transparent}

  /* 隐藏某一栏：display:none 用 !important 压过 #enpane 之类的 id 选择器 */
  body.rh-hide-en #scroll-en,
  body.rh-hide-en .col.en,
  body.rh-hide-en #enpane{display:none !important}
  body.rh-hide-zh #scroll-zh,
  body.rh-hide-zh .col.zh,
  body.rh-hide-zh #zhpane{display:none !important}

  /* 三栏版面：隐藏一栏后另一栏自动放宽 */
  body.rh-hide-en #zhpane,
  body.rh-hide-zh #enpane{flex:1 1 46%}
  body.rh-hide-en #enpane,
  body.rh-hide-zh #zhpane{flex:0 0 0}

  @media (max-width:900px){
    .lang-toggle{bottom:14px;padding:2px;gap:1px}
    .lang-toggle .lt-btn{font-size:11.5px;padding:5px 9px}
  }
</style>
</head>
<body>
<div class="app">

    <button class="sidebar-toggle" id="sidebar-toggle" title="隐藏 / 显示目录（快捷键 \\）" aria-label="隐藏或显示目录">&#9776;</button>
<!-- ======= SIDEBAR / TOC ======= -->
  <aside class="sidebar">
    <div class="brand">
      <h1>《明史》中的宦官传</h1>
      <p>皮斯佐夫 · 完整<br>中文译文由 ECNU 云端模型生成</p>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="检索全文 …" autocomplete="off" spellcheck="false">
      <div class="search-results" id="search-results"></div>
    </div>
    <nav class="toc" id="toc"></nav>
  </aside>

  <!-- ======= MAIN READING AREA ======= -->
  <main class="main">
    <section class="col en" id="scroll-en">
      <header class="col-head">Русский · 俄文原文</header>
      <div class="article" id="article-en"></div>
    </section>
    <section class="col zh" id="scroll-zh">
      <header class="col-head">中文翻译 · ECNU 云端模型生成</header>
      <div class="article" id="article-zh"></div>
    </section>
  </main>
</div>


  <div id="note-toolbar"></div>
  <button class="makenote" id="note-open" title="查看笔记">📝 笔记</button>
  <div id="note-panel"></div>
  <div id="note-toast"></div>
<script>
/* ============ BOOK DATA (injected by build) ============ */
const EN = /*__EN__*/[{"id":"sec1","title":"Текст","paras":[{"type":"subh","text":"Печатная страница 79 · Страница исходного PDF 1","role":"source-page","page":1},{"type":"subh","role":"heading","page":1,"printed":79,"id":"p0001.000","text":"К. М. ПИСЦОВ"},{"type":"subh","role":"heading","page":1,"printed":79,"id":"p0001.001","text":"НА ОДНОГО ПОЛЕЗНОГО – СТО ЗЛОВРЕДНЫХ. БИОГРАФИИ ЕВНУХОВ В «ИСТОРИИ МИН»*"},{"type":"text","role":"text","page":1,"printed":79,"id":"p0001.002","text":"Цель работы – анализ раздела «Биографии придворных евнухов» в «Мин ши». Традиционная китайская историография крайне негативно относится к придворным евнухам. В статье рассмотрены жизнеописания менее известных евнухов – не злодеев и негодяев, а преданных подданных, честно исполнявших свой долг. В тексте «Мин ши» наиболее полно изложены жизнеописания самых одиозных временщиков эпохи Мин, заслуживающих однозначного порицания, но в биографиях «хороших» евнухов отрицательная оценка также присутствует, хотя и в более скрытой форме."},{"type":"text","role":"text","page":1,"printed":79,"id":"p0001.003","text":"Ключевые слова: эпоха Мин, придворные евнухи, «Мин ши», традиционная китайская историография."},{"type":"text","role":"text","page":1,"printed":79,"id":"p0001.004","text":"Негативное отношение традиционной китайской историографии к придворным евнухам достаточно хорошо известно. Пожалуй, наиболее ярко такие взгляды выражены в «Мин ши» («История [династии] Мин»). В тексте этого исторического сочинения на евнухов в значительной степени возложена ответственность за гибель династии (Мин ши 1958: 28962/770), а сами они наделены убийственной характеристикой: «...хотя среди них и встречались мудрые... но на одного полезного приходилось сто зловредных» (Там же: 31462/3270). Разумеется, вызывает интерес приводимый в «Мин ши» фактический материал, на основании которого авторы этого исторического сочинения приходят к столь неутешительному выводу."},{"type":"note","role":"note","page":1,"printed":79,"id":"p0001.005","text":"Историческая психология и социология истории 1/2023 79–89 DOI: 10.30884/ipsi/2023.01.05"},{"type":"note","role":"note","page":1,"printed":79,"id":"p0001.006","text":"* Для цитирования: Писцов, К. М. 2023. На одного полезного – сто зловредных. Биографии евнухов в «Истории Мин». Историческая психология и социология истории 1: 79–89. DOI: 10.30884/ipsi/2023.01.05."},{"type":"note","role":"note","page":1,"printed":79,"id":"p0001.007","text":"For citation: Pistsov, K. M. 2023. For One Useful Person, There are a Hundred Harmful Ones. Biographies of Eunuchs in “The History of the Ming”. Istoricheskaya psikhologiya i sotsiologiya istorii = Historical Psychology &amp; Sociology 1: 79–89 (in Russian). DOI: 10.30884/ipsi/2023.01.05."},{"type":"subh","text":"Печатная страница 80 · Страница исходного PDF 2","role":"source-page","page":2},{"type":"text","role":"text","page":2,"printed":80,"id":"p0002.000","text":"В одной из предыдущих работ автор данных строк обратил внимание на то, как в главе, посвященной описанию официального костюма придворных евнухов, авторы «Мин ши» нарисовали увлекательную картину узурпации власти, осуществленной представителями этой специфической придворной группы (Писцов 2020). В настоящей статье предметом анализа станут данные из раздела «Биографии», который в составе «Мин ши» (как и любой династийной истории) играет исключительно важную роль."},{"type":"text","role":"text","page":2,"printed":80,"id":"p0002.001","text":"Раздел «Биографии придворных евнухов» (общим объемом два цзюаня) содержит 27 основных жизнеописаний и более 12 дополнительных (подчиненный характер последних подчеркнут в издании «Соинь bona эршисы ши» тем, что в оглавлении их заголовки выделены уменьшенным размером шрифта) (Мин ши 1958: 3270/31462, 3285/31477). Фактическое число упомянутых в тексте персоналий превышает сумму основных и вспомогательных биографий раздела. Объем статьи не позволяет рассмотреть все эти жизнеописания, тем более что некоторые из их героев уже известны отечественному читателю. Существует сокращенный перевод на русский язык биографии Лю Цзиня (?–1510) из сочинения XVII в. «Мин ши цзи ши бэньмо» («Полное описание событий истории династии Мин») (Симоновская, Лепешинский 1960: 110–123), жизненный путь Вэй Чжунсяня (1568–1627) тоже отражен в отечественной литературе (Воскресенский 2002). Это два наиболее известных евнуха-злодея эпохи Мин. Специальная книга и многочисленные статьи посвящены судьбе знаменитого флотоводца, военачальника и дипломата Чжэн Хэ (1371–1433) (Свет 1960; 1955: 120–123; Дубровская 2022 и др.). Поэтому в данной статье будут рассмотрены несколько биографий придворных евнухов, вовсе неизвестных или малоизвестных большинству читателей. Причем, поскольку негативные стороны института евнухов и его отдельных представителей известны достаточно хорошо, основное внимание на этот раз будет уделено тем немногочисленным «мудрым» и «полезным» деятелям, которые, по словам составителей «Мин ши», встречались в сто раз реже, чем «зловредные»*."},{"type":"text","role":"text","page":2,"printed":80,"id":"p0002.002","text":"Пример принципиальности и преданности государю – биография Хэ Дина (?–1497/1498, второе имя Вэньдин). Хэ Дин служил при дворе в период Хун-чжи (1488–1506) и, согласно тексту «Мин ши», занимал относительно невысокое положение в иерархии ев-"},{"type":"note","role":"note","page":2,"printed":80,"id":"p0002.003","text":"* Автор принципиально воздержался от дополнения текста «Мин ши» сведениями из других источников, единственное исключение – даты жизни в скобках после имен действующих лиц, указанные в соответствии с информацией справочника «Dictionary of Ming Biography» (Goodrich, Fang Chaoying 1976)."},{"type":"subh","text":"Печатная страница 81 · Страница исходного PDF 3","role":"source-page","page":3},{"type":"text","role":"text","page":3,"printed":81,"id":"p0003.000","text":"нухов-чиновников: его должность чжании соответствовала основному шестому рангу. Его первое деяние, зафиксированное в «Мин ши», свидетельствует о государственном уме: ХЭ Дин подал доклад с предложением упразднить систему назначения и перемещения чиновников в особом порядке, осуществляемых непосредственно императорским указом. Дальнейшее содержание биографии посвящено конфликту ХЭ Дина с братьями императрицы Чжан. Следует отметить, что царствовавший тогда император Сяо-цзун, вероятно, единственный император в истории Китая, у которого была лишь одна супруга, что, конечно, объясняет особое влияние, которое она оказывала на своего мужа. Шурин императора Чжан Хэлин вместе со своим младшим братом часто посещал дворец. Однажды на пиру, когда император вышел в уборную, пьяный Чжан Хэлин схватил оставленную государствен шапку и надел на собственную голову. Подобный легкомысленный поступок в традиционных обществах мог расцениваться как серьезное преступление. Неудивительно, что ХЭ Дин был возмущен. В другой раз Чжан стал подглядывать за полог в покоях императора, ХЭ Дин схватился за дагуа (разновидность оружия, представляющая собой желез с навершием в форме тыквы. – К. П.), намереваясь немедленно наказать нарушителя порядка. Почему это намерение осталось неисполненным, «Мин ши» не уточняет, но ХЭ Дин подал доклад, обвиняющий братьев Чжан в непочтительности и нарушении норм взаимоотношений между государствен и подданными. Узнав о происшедшем, императрица разгневалась, император стал на сторону супруги, и ХЭ Дин был заключен в тюрьму Цзиньи-вэй (Императорской гвардии). Будучи спрошен о возможных подстрекателях, ХЭ Дин подтвердил, что таковые были, и на требование назвать их имена ответил: «Конфущий и Мэн-цзы» (Мин ши 1958: 31470/3278). Этим ответом ХЭ Дин давал понять, что действовал в полном соответствии с заветами основателей конфуцианского учения. Несколько крупных чиновников подавали доклады государствю с просьбой о помиловании ХЭ Дина, но император из-за императрицы отвечал отказом. В конце концов императрица Чжан послала влиятельного евнуха Ли Гуана забить ХЭ Дина батогами насмерть. Тут император пожалел о своем погибшем слуге и удостоил ХЭ Дина эпитафии, текст которой вырезали на каменной стеле. Далее следует своеобразное резюме, в котором рассказано о добросовестных и законопослушных евнуках Дэн Юане, Май Сю, Цзянь Чжуне и Лю Цине, успешно выполнявших военные миссии, и бескорыстном советнике Сяо Цзине, служившем на протяжении двух царствований. В рассказе о Сяо Цзине приведен императорский отзыв о нем, позволяющий полу-"},{"type":"subh","text":"Печатная страница 82 · Страница исходного PDF 4","role":"source-page","page":4},{"type":"text","role":"text","page":4,"printed":82,"id":"p0004.000","text":"чить представление об одном из качеств образцового придворного евнуха: «Сяо Цзин – тот, с кем Мы советуемся, но он еще никогда не пробовал воспользоваться этим, чтобы [добиться] власти» (Мин ши 1958: 31470/3278). Однако далее сказано, что императорского доверия добились лишь Ли Гуан и Цзян Цун, которые, как известно из их собственных биографий (Там же: 31470/ 3278–31471/3279), в конечном счете оказались этого доверия недостойны, что оставляет негативное впечатление."},{"type":"text","role":"text","page":4,"printed":82,"id":"p0004.001","text":"Перед нами классическая биография истинного конфуцианца, пожертвовавшего жизнью во имя своих убеждений. В качестве аналогии можно вспомнить биографию министра Ли Шилу, который критиковал основателя минской империи Чжу Юаньчжана за чрезмерное (с точки зрения убежденного ученого-конфуцианца) пристрастие к буддизму и заплатил жизнью за свои убеждения (Мартынов 1974: 319). Хэ Дин тоже погиб, отстаивая конфуцианские принципы, хотя объектом критики стало поведение не императора, а его ближайшего окружения."},{"type":"text","role":"text","page":4,"printed":82,"id":"p0004.002","text":"Следует отметить, что столкновения придворных евнухов и родственников императора по женской линии можно считать одной из характерных особенностей политической борьбы при дворе в эпоху Мин. Такими конфликтами отмечена, в частности, и карьера упомянутых выше временщиков Лю Цзиня и Вэй Чжунсяня. При желании можно увидеть в этом противостоянии борьбу двух принципов управления – аристократического и бюрократического (при последнем, в конкретных исторических условиях средневекового Китая или, к примеру, Византии, возникали благоприятные условия для роста могущества евнухов). Но подобное противопоставление могло носить лишь очень ограниченный характер, поскольку политический вес аристократии в минском Китае (за исключением ближайших родственников императора) обычно был незначительным."},{"type":"text","role":"text","page":4,"printed":82,"id":"p0004.003","text":"Около 60 лет разделяют Хэ Дина и Ли Фана, годы службы которого пришлись на периоды Лун-цин (1567–1573) и Вань-ли (1573–1620). Служебное положение Ли Фана было значительно выше: он занимал в Департаменте дворцовых чиновников пост тайцзяня, соответствующий основному четвертому рангу (высший ранг, предусмотренный для должностей, занимаемых придворными евнухами). Ли Фан пользовался доверием императора Му-цзуна, ценившего его способности, и неоднократно подавал доклады, как обличая злоупотребления отдельных лиц, так и выдвигая предложения о сокращении количества сверхштатных должностей, уменьшении нормы дополнительных заготовок провизии и стройматериалов для двора. После вступления на трон малолетнего императора"},{"type":"subh","text":"Печатная страница 83 · Страница исходного PDF 5","role":"source-page","page":5},{"type":"text","role":"text","page":5,"printed":83,"id":"p0005.000","text":"Шэнь-цзуна его фаворитами стали евнухи Тэн Сян, Мэн Чжун и Чэнь Хун, изыскивавшие различные способы развлечь монарха. Однажды они построили Черепашью гору из фонарей и вовлекли императора в пирушку, продолжавшуюся всю ночь (вероятно, это событие имело место под Новый год, поскольку Черепашья гора – конструкция из фонарей, воспроизводящая очертания морского животного, – являлась одним из атрибутов новогодних торжеств. – К. П.). Ли Фан выступил с горячим увещеванием против подобного времяпрепровождения государя, чем вызвал недовольство мальчика-императора. Пользуясь случаем, Тэн Сян с товарищами оклеветали Ли Фана, и тот вынужден был оставить должность. Затем Ли Фана наказали батогами и заключили в тюрьму Ведомства наказаний в ожидании разбирательства. На запрос сановников относительно вины император ответил: «[Ли] Фан служил Нам без [должной] почтительности, следует заточить его» (Мин ши 1958: 31477/3285). После заключения Ли Фана императорские фавориты, по свидетельству «Мин ши», совсем распустились, описание их бесчинств занимает большую часть дальнейшего текста биографии. А Ли Фан провел в тюрьме почти полтора года, после чего был сослан в солдаты в Южную столицу (Там же)."},{"type":"text","role":"text","page":5,"printed":83,"id":"p0005.001","text":"Жизнеописание Чэнь Цзюя (1539–1608), вероятно, самая яркая биография «хорошего» евнуха в «Мин ши» (Там же: 31484/3292–31485/3293). Если крушение Ли Фана пришлось на самое начало годов Вань-ли, то пик карьеры Чэня датируется приблизительно серединой этого периода. Чэнь Цзюй, отличавшийся справедливостью и мягкостью, служил в ключевом ведомстве дворцовой администрации – Департаменте церемониала, занимая важную должность бинби тайцзянь, а с 26-го года Вань-ли (1598 г.) возглавил Дунчан (тайную полицию). Его служба на этих ответственных постах значительно осложнялась тем, что это было время борьбы за назначение наследника престола. Драгоценная супруга Чжэн, пользовавшаяся особой любовью императора, замышляла поставить наследником своего сына в обход старшего императорского сына, рожденного одной из дворцовых служанок. Император, кажется, был склонен поддержать устремления своей фаворитки. Но у старшего сына тоже были влиятельные сторонники среди сановников и придворных. Подобная обстановка, конечно, благоприятствовала интригам и борьбе партий при дворе. Первым поручением Чэнь Цзюя, упомянутым в «Мин ши», был поиск книг для императора. Среди книг, которые Чэнь Цзюй поднес монарху, оказалось сочинение крупного чиновника Люй Куня (1536–1618) «Гуйфан тушо» («Иллюстрированное повествование о правилах домашнего пове-"},{"type":"subh","text":"Печатная страница 84 · Страница исходного PDF 6","role":"source-page","page":6},{"type":"text","role":"text","page":6,"printed":84,"id":"p0006.000","text":"дения») – своеобразное наставление для женщин. Император подарил эту книгу драгоценной супруге Чжэн, которая снабдила наставление собственным предисловием, и в таком виде сочинение было отпечатано с досок. В это же время появилось написанное неизвестным лицом послесловие к книге, в котором утверждалось, что драгоценная супруга планирует добиться для своего сына титула наследника, для чего вступила в сговор с Люй Кунем и другими лицами. По прошествии трех лет наследником все-таки был провозглашен старший сын, но, как показывает дальнейшее изложение, успокоения при дворе не наступило. В конце 31-го года Ваньли (1603) во дворце и у ворот усадеб некоторых сановников был найден памфлет, неизвестный автор которого утверждал, что драгоценная супруга планирует переменить наследника престола и с этой целью вовлекла в заговор ряд придворных. Чэнь Цзюй представил экземпляр этого подметного письма императору, который страшно разгневался и приказал Чэню и руководству Цзиньи-вэй непременно найти автора. Было задержано большое число подозреваемых, дело грозило перерасти в масштабный процесс. В этих условиях, насколько можно судить по тексту «Мин ши», Чэнь Цзюй не столько проявил себя гениальным детективом в духе судьи Ди из рассказов ван Гулика, сколько сумел устраниться от кипящих вокруг интриг, грозящих превратить расследование в повод для сведения личных счетов. Вскоре был схвачен столичный житель Цзяо Шэнгуан, который шантажировал богатого купца, сочинив от его имени стихи, в которых, в частности, упоминалась драгоценная супруга Чжэн. Хотя от Цзяо даже под пытками не удалось добиться признания в составлении памфлета, на основании косвенных улик его авторство представлялось вероятным. Чэнь Цзюй не был уверен в виновности Цзяо, но считал, что тот все равно уже заслужил казнь. В то же время, учитывая гнев императора, затягивание розыска обернулось бы вовлечением множества заведомо невиновных лиц. Цзяо был признан виновным и казнен, а остальные подозреваемые отпущены."},{"type":"text","role":"text","page":6,"printed":84,"id":"p0006.001","text":"С 33-го года Вань-ли (1605) Чэнь Цзюй заведовал Департаментом церемониала (наивысший пост, возможный для придворного евнуха) и по-прежнему возглавлял Дунчан, пытаясь в критических ситуациях смягчить участь тех, на кого пал императорский гнев. На другой год Чэнь получил указ провести инспекцию тюрем, в результате было освобождено большое число узников. Через год Чэнь Цзюй скончался. Император посвятил ему кумирню и удостоил имени «Чистый и преданный»."},{"type":"subh","text":"Печатная страница 85 · Страница исходного PDF 7","role":"source-page","page":7},{"type":"text","role":"text","page":7,"printed":85,"id":"p0007.000","text":"В резюме биографии еще раз подчеркиваются достижения Чэнь Цзюя: «...злоупотребляющих властью стало мало, дошло до того, что тюрьма Дунчана заросла травой... императорский двор и страна [находились] во взаимном согласии» (Мин ши 1958: 31484/3292–31485/3293). И тем не менее завершается данный текст пассажем, начисто перечеркивающим эту идиллию: евнухи, которых командировали производить закупки для двора, бесчинствовали при попустительстве императора, из-за чего «сердца народа негодовали, [это] вскоре привело к войнам и смутам» (Там же: 31485/3293)."},{"type":"text","role":"text","page":7,"printed":85,"id":"p0007.001","text":"За биографией Чэнь Цзюя следует жизнеописание Ван Аня (?–1621), что оправдано и хронологией, и логикой повествования. Взлет карьеры Ван Аня начинается, когда по рекомендации Чэнь Цзюя его назначают товарищем по учебе старшего императорского сына. В атмосфере интриг, связанных с борьбой за титул наследника, Ван Ань успешно защищает своего августейшего «однокашника» от происков драгоценной супруги Чжэн. Когда его подопечный вступает на трон как император Гуан-цзун, то назначает Ван Аня на высокий пост бинби Департамента церемониала и прислушивается к его советам, направленным на оздоровление политической обстановки. Ван Ань пользуется уважением высших сановников. После безвременной кончины Гуан-цзуна его любимая супруга по фамилии Ли из корыстных побуждений взяла его малолетнего наследника под свою опеку. Именно Ван Ань играет ключевую роль в нейтрализации ее интриг, возведении наследника на трон и устранении Ли с политической сцены. Соответственно, новый император Си-цзун испытывает к Ван Аню благодарность и доверие. Но тут вдруг выясняется неспособность Ван Аня разбираться в людях, которая вкупе со слабым здоровьем, не позволявшим регулярно являться к императору, оказывается для него фатальной. Сначала Ван Ань верит бесконечным похвалам своего подчиненного Вэй Чао, которые тот расточает в адрес друга – евнуха Вэй Чжунсяня, недавно поступившего на дворцовую службу. Ван выказывает расположение Вэй Чжунсяню на ранней стадии его карьеры. Потом два Вэя вызывают гнев Ван Аня, соперничая за благосклонность императорской кормилицы, урожденной Кэ. Это приводит к изгнанию Вэй Чао, а Вэй Чжунсянь и урожденная Кэ «питают злобу» к Ван Аню, вероятно, осознав исходящую от него опасность. Когда император предлагает Ван Аню возглавить Департамент церемониала, тот отказывается. Урожденная Кэ убеждает императора принять прошение Ван Аня об отставке, а еще колеблющегося Вэй Чжунсяня провоцирует на решительные действия, припугнув печальным примером императорской супруги Ли. В результате кле-"},{"type":"subh","text":"Печатная страница 86 · Страница исходного PDF 8","role":"source-page","page":8},{"type":"text","role":"text","page":8,"printed":86,"id":"p0008.000","text":"ветнических обвинений Ван Ань отправляется в ссылку и погибает от рук евнуха Лю Чао – ставленника Вэй Чжунсяня и урожденной Кэ. Но даже после смерти Ван Аня Вэй Чжунсян использует его имя в политической борьбе. Лишь после вступления на трон последнего минского императора Сы-цзуна (сместившего Вэй Чжунсяня) с Ван Аня посмертно снимают несправедливые обвинения, в его честь воздвигают кумирню и жалуют посмертное имя «Блистательный и преданный» (Мин ши 1958: 31485/3293)."},{"type":"text","role":"text","page":8,"printed":86,"id":"p0008.001","text":"Безупречным подданным, безусловно, проявил себя Ван Чэнъэнь (?–1644), дослужившийся до поста бинби-тайцзяня (четвертый основной ранг) в Департаменте церемониала. В роковые дни, когда к Пекину подошла армия повстанцев под водительством Ли Цзычэна, император Сы-цзун возложил на Ван Чэнъэня командование столичным гарнизоном. Ван, используя артиллерию, сорвал попытку повстанцев подкопать городскую стену. Когда город все же пал, Ван остался рядом с императором и покончил с собой сразу после самоубийства государя. За свою преданность Ван Чэнъэнь удостоился посмертных почестей и со стороны наследников минской династии, обосновавшихся в Нанкине, и со стороны новой, маньчжурской по происхождению, династии, воцарившейся в Пекине после отступления повстанцев (Там же: 3143/3301)."},{"type":"text","role":"text","page":8,"printed":86,"id":"p0008.002","text":"Логическим продолжением рассказа о Ван Чэнъэне служит биография Фан Чжэнхуа, который погиб от рук повстанцев, защищая по приказу императора Сы-цзуна какой-то город в столичной области. В последних строках биографии Фан Чжэнхуа перечислены имена еще четырех придворных евнухов, отдавших жизнь за династию (Гао Шимин, Ли Фэн, Чжу Сянъчжан и Чжан Гоюань – все они занимали довольно высокие посты в придворной иерархии). После переноса столицы в Нанкин наследники минской династии основали Кумирню почитания преданных слуг и принесли жертвы в честь названных лиц (причем главное место среди них было отведено Ван Чэнъэню). Но, может быть, из желания снизить патетику финала, авторы завершают биографию Фан Чжэнхуа (и, соответственно, весь раздел «Биографии придворных евнухов») курьезным эпизодом: в число преданных слуг, удостоенных почитания южноминским двором, почему-то оказался включен также глава Дунчана Ван Чжисинь, добровольно капитулировавший перед повстанцами, но позже замученный ими из-за своего огромного богатства (Там же: 31493/3301). Можно усмотреть в таком финале стремление авторов завершить повествование негативным примером поведения высокопоставленного евнуха и подвергнуть скрытой критике южноминский двор за неспособность давать верные"},{"type":"subh","text":"Печатная страница 87 · Страница исходного PDF 9","role":"source-page","page":9},{"type":"text","role":"text","page":9,"printed":87,"id":"p0009.000","text":"оценки событиям. Критика не совсем справедливая, поскольку сами авторы «Мин ши» признают (в биографии Гао Цицяня), что трудно разобраться в деталях некоторых событий, сопровождавших взятие Пекина повстанцами (Мин ши 1958: 31493/3301)."},{"type":"text","role":"text","page":9,"printed":87,"id":"p0009.001","text":"Ознакомившись с жизнеописаниями нескольких евнухов, перейдем к общим выводам. Разумеется, авторы «Мин ши» не ставили себе цель изложить биографии всех придворных евнухов эпохи Мин. Это было бы технически невозможно, как невозможно было представить, например, биографии всех министров (тем более всех чиновников), служивших династии на протяжении почти трех столетий ее правления. В этом отношении составители любой династийной истории неизбежно прибегали к определенному «масштабированию» изображения, и в масштабе один к одному – точное соответствие числа персоналий в истории и на страницах исторического сочинения – обычно могли быть представлены лишь монархи (впрочем, и тут необходимы некоторые оговорки). Следовательно, речь изначально шла лишь об избранных биографиях придворных евнухов. При этом включены в соответствующую главу оказались жизнеописания не только злодеев и негодяев, но также преданных государствю и стране подданных, честно исполнявших свой долг и жертвующих жизнью во имя высоких принципов."},{"type":"text","role":"text","page":9,"printed":87,"id":"p0009.002","text":"Подобный стремящийся к известной «объективности» подход был взят на вооружение еще отцом китайской историографии Сыма Цянем (Крюков 1972: 61–63) и затем стал обычным для династийных историй, хотя можно задаться вопросом, не превратился ли он впоследствии лишь в формализованный историографический прием. Этот подход, присущий традиционной китайской историографии, анализирует Б. Г. Доронин, особенно подробно – на примере описания крестьянских восстаний в династийных историях (Доронин 2002: 184–187). Трудно представить, чтобы потенциальный читатель «Мин ши» с легкостью поверил, что все евнухи при императорском дворе были исключительно злокозненны, и при этом на протяжении без малого 300 лет никто не заметил аномальности подобного положения. Авторы «Мин ши» рисуют более сложную и потому более убедительную картину, соответствующую предложенной концепции. Составителями «Биографий придворных евнухов» был задействован, по-видимому, довольно широкий арсенал приемов, призванных закрепить в сознании читателя картину, соответствующую сформулированной ими общей концепции. Часть этих приемов была проанализирована в отечественной исследовательской литературе (Там же: 187–195, 209–224)."},{"type":"subh","text":"Печатная страница 88 · Страница исходного PDF 10","role":"source-page","page":10},{"type":"text","role":"text","page":10,"printed":88,"id":"p0010.000","text":"Негативная оценка роли, сыгранной придворными евнухами в судьбе династии Мин, предельно четко сформулирована в предисловии к собранию их биографий (Мин ши 1958: 31462/3270). В самом же тексте биографий эта оценка «растворена», то проступая в форме скрытых намеков, то кристаллизуясь со всей безапелляционностью. Биографии откровенно одиозных личностей, конечно, давали наибольший простор для порицания, но и в биографиях «хороших» евнухов тот же подход, похоже, присутствует в более мягкой форме. По ходу повествования привлекаются факты злоупотреблений если не самих героев, то их противников. Лаконичность биографий положительных личностей, упоминание об их конфликтах с окружением, а порой и их трагический финал, вероятно, призваны внедрить в сознание читателя представление об исключительности, нетипичности и обреченности подобных героев в придворном мире."},{"type":"text","role":"text","page":10,"printed":88,"id":"p0010.001","text":"Как мы помним, в биографии преданного и прямого Хэ Дина упомянуты добросовестные и законопослушные евнухи-военачальники Дэн Юань, Май Сю, Цзянь Чжун и Лю Цин и образцовый советник Сяо Цзин. Однако далее сказано, что императорского доверия добились лишь Ли Гуан и Цзян Цун, которые в конечном счете оказались этого доверия недостойны, что оставляет общее негативное впечатление. В биографии принципиального Ли Фана более трети общего объема текста посвящено перечислению злоупотреблений, творимых тремя императорскими фаворитами – евнухами Тэн Сяном, Мэн Чуном и Чэнь Хуном, что, вкупе с печальной судьбой главного героя повествования, пострадавшего из-за интриг этих временщиков, вновь порождает мрачную картину. Показательно также, что доклады, которые подают преданные трону и интересам страны Хэ Дин и Ли Фан, вызывают неприязнь их коллег, и из дальнейшего повествования становится понятным, почему: предложение Хэ Дина противоречило интересам Ли Гуана, инициативы Ли Фана, по-видимому, грозили положить конец злоупотреблениям Тэн Сяна. Робким проблеском надежды в этом мраке мелькает биография Чэнь Цзюя, твердо сторонящегося интриг и пользующегося уважением императора Шэнь-цзуна. Но впечатляющий перечень достижений Чэня завершается пессимистическим пассажем о евнухах-закупщиках, терроризирующих население при попустительстве императора. И сумеречная атмосфера снова сгущается, подготовливая закономерное появление на сцене Вэй Чжунсяня."},{"type":"text","role":"text","page":10,"printed":88,"id":"p0010.002","text":"Нельзя не отметить также тот едва ли случайный факт, что обладателями наиболее пространных жизнеописаний оказались Лю Цзинь и Вэй Чжунсянь – наиболее одиозные временщики эпохи"}]},{"id":"sec2","title":"Литература","paras":[{"type":"subh","text":"Печатная страница 89 · Страница исходного PDF 11","role":"source-page","page":11},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.000","text":"Мин. В определенной степени это способствовало тому, чтобы из всех героев раздела именно эти персоналии лучше всего запомнились читателю. Показательно, что авторы современного историкоюмористического комикса «Китайские евнухи» для выпуска, посвященного эпохе Мин, отобрали (из примерно четырех десятков жизнеописаний, представленных в «Мин ши») лишь биографии четырех наиболее зловредных евнухов, включая, разумеется, Лю Цзиня и Вэй Чжунсяня (Wang Yongsheng, Chi Sheng 1994). Данный пример читательского восприятия династийной истории может в определенной степени свидетельствовать об успехе стратегии, избранной авторами «Мин ши», и о достижении ими поставленной цели."},{"type":"subh","role":"heading","page":11,"printed":89,"id":"p0011.001","text":"Литература"},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.002","text":"Воскресенский, Д. Н. 2002. Придворные скопцы в истории и литературе Китая. В: Воскресенский, Д. Н., Усов, В. Н. (сост.), Книга дворцовых интриг. Евнухи у кормила власти в Китае. М.: Наталис, с. 13–132."},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.003","text":"Доронин, Б. Г. 2002. Историография императорского Китая XVII XVIII вв. СПб.: Филол. факультет СПбГУ."},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.004","text":"Дубровская, Д. В. 2022. Naviget, Haec Summa Est, или Последний квест адмирала Чжэн Хэ. Восточный курьер 2: 78–98. DOI: 10.18254/S268684310021474-9."},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.005","text":"Крюков, М. В. 1972. Сыма Цянь и его «Исторические записки». В: Сыма Цянь, Исторические записки (Ши цзи). Т. I. М.: Наука."},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.006","text":"Мартынов, А. С. 1974. Конфуцианство, буддизм и двор в эпоху Мин. В: Васильев, Л. С. (отв. ред.), История и культура Китая, с. 307–324. М.: Наука; ГРВЛ."},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.007","text":"Мин ши (История [династии] Мин). 1958. Шанхай: Шанъу иньшугуань (на кит. яз.)."},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.008","text":"Писцов, К. М. 2020. Место подглавы «Костюм евнухов» в общей концепции «Истории Мин». Общество и государство в Китае. Т. Л. Ч. 1. М.: ИВ РАН, с. 186–199. DOI: 10.31696/2227-3816-2020-50-1-186-199."},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.009","text":"Свет, Я. М. 1955. По следам путешественников и мореплавателей Востока. М.: Гос. изд-во географической лит-ры."},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.010","text":"Свет, Я. М. 1960. За кормой сто тысяч ли. М.: Гос. изд-во географической лит-ры."},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.011","text":"Симоновская, Л. В., Лепешинский, К. В. (ред.). 1960. Хрестоматия по истории Китая в Средние века (XV–XVII вв.). М.: Изд-во Моск. ун-та."},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.012","text":"Goodrich, L. C., Fang Chaoying (eds.). 1976. Dictionary of Ming Biography, 1368–1644. Vol. 1–2. New York: Columbia University Press."},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.013","text":"Wang Yongsheng, Chi Sheng (eds.). 1994. Chinese Eunuchs. Inside Stories of the Chinese Court. Vol. 3. Singapore: Asiapac."}]}];
const ZH = /*__ZH__*/[{"id":"sec1","title":"正文","paras":[{"type":"subh","text":"原刊第 79 页 · 源 PDF 第 1 页","role":"source-page","page":1},{"type":"subh","role":"heading","page":1,"printed":79,"id":"p0001.000","text":"К. М. 皮斯佐夫"},{"type":"subh","role":"heading","page":1,"printed":79,"id":"p0001.001","text":"一个有用的对一百个有害的。《明史》中的宦官传记*"},{"type":"text","role":"text","page":1,"printed":79,"id":"p0001.002","text":"本文旨在分析《明史》中的“宦官传”部分。中国传统史学对宫廷宦官持极其负面的态度。文章考察了较少为人所知的宦官——并非恶棍歹徒，而是忠实履行职责的忠臣——的生平。在《明史》文本中，最为详尽地记述了明代最声名狼藉、理应受到一致谴责的权阉的生平，但在“好”宦官的传记中，负面评价同样存在，尽管形式更为隐蔽。"},{"type":"text","role":"text","page":1,"printed":79,"id":"p0001.003","text":"关键词：明代，宫廷宦官，《明史》，中国传统史学。"},{"type":"text","role":"text","page":1,"printed":79,"id":"p0001.004","text":"中国传统史学对宫廷宦官的负面态度是众所周知的。或许，这种观点在《明史》中表达得最为鲜明。在这部历史著作的文本中，宦官在很大程度上被归咎于王朝的灭亡（《明史》1958：28962/770），而他们本身也被赋予了致命的评语：“……其间虽间有贤者……然利一而害百也”（同上：31462/3270）。当然，《明史》作者们据以得出如此令人遗憾结论的实际材料，引起了人们的兴趣。"},{"type":"note","role":"note","page":1,"printed":79,"id":"p0001.005","text":"历史心理学与历史社会学 1/2023 79–89 DOI: 10.30884/ipsi/2023.01.05"},{"type":"note","role":"note","page":1,"printed":79,"id":"p0001.006","text":"* 引用格式：皮斯佐夫，К. М. 2023。《一个有用的对一百个有害的。《明史》中的宦官传记》。《历史心理学与社会学》第1期：79–89。DOI: 10.30884/ipsi/2023.01.05。"},{"type":"note","role":"note","page":1,"printed":79,"id":"p0001.007","text":"引用格式：Pistsov, K. M. 2023. For One Useful Person, There are a Hundred Harmful Ones. Biographies of Eunuchs in “The History of the Ming”. Istoricheskaya psikhologiya i sotsiologiya istorii = Historical Psychology &amp; Sociology 1: 79–89 (in Russian). DOI: 10.30884/ipsi/2023.01.05."},{"type":"subh","text":"原刊第 80 页 · 源 PDF 第 2 页","role":"source-page","page":2},{"type":"text","role":"text","page":2,"printed":80,"id":"p0002.000","text":"在先前的一篇著作中，本文作者曾注意到，《明史》的作者们在描述宫廷宦官正式服饰的章节中，描绘了一幅这一特殊宫廷群体篡夺权力的引人入胜的图景（皮斯佐夫 2020）。本文的分析对象将是“列传”部分的数据，该部分在《明史》中（如同在任何一部断代史中一样）扮演着极其重要的角色。"},{"type":"text","role":"text","page":2,"printed":80,"id":"p0002.001","text":"《宦官传》（共两卷）收录了27篇主要传记和超过12篇附传（《缩印百衲本二十四史》在目录中以缩小字号突出附传的从属性质）（《明史》1958：3270/31462，3285/31477）。文中提及的人物实际数量超过该卷主要传记与附传之和。本文篇幅不允许逐一考察所有这些传记，况且其中一些传主已为国内读者所熟知。十七世纪著作《明史纪事本末》（《明代历史事件全述》）中刘瑾（？–1510）的传记已有俄文节译本（西蒙诺夫斯卡娅、列佩申斯基 1960：110–123），魏忠贤（1568–1627）的生平亦见于国内文献（沃斯克列先斯基 2002）。这是明代最著名的两个宦官恶人。关于著名航海家、军事统帅和外交家郑和（1371–1433）的生平，已有专著和大量论文（斯韦特 1960；1955：120–123；杜布罗夫斯卡娅 2022 等）。因此，本文将考察几篇对大多数读者来说完全陌生或鲜为人知的宦官传记。此外，由于宦官制度及其个别代表的负面方面已为人所熟知，本次将主要关注那少数“明智”和“有用”的人物——据《明史》编纂者所言，这类人物的出现频率比“有害”之徒低一百倍*。"},{"type":"text","role":"text","page":2,"printed":80,"id":"p0002.002","text":"何鼎（？–1497/1498，字文鼎）的传记是原则性与忠于君主的典范。何鼎在弘治年间（1488–1506）供职于宫廷，据《明史》记载，他在宦官-官员等级体系中地位相对不高——"},{"type":"note","role":"note","page":2,"printed":80,"id":"p0002.003","text":"* 作者原则上不引用其他史料补充《明史》文本，唯一例外是人物名后括号内的生卒年份，系依据《明代名人传》（Goodrich, Fang Chaoying 1976）的信息标注。"},{"type":"subh","text":"原刊第 81 页 · 源 PDF 第 3 页","role":"source-page","page":3},{"type":"text","role":"text","page":3,"printed":81,"id":"p0003.000","text":"他的长随一职对应正六品。他在《明史》中记载的第一项事迹即显示出治国之才：何鼎上奏建议废除由皇帝直接下旨特别任命和调动官员的制度。传记的后续内容则记述了何鼎与张皇后兄弟的冲突。应当指出，当时在位的孝宗皇帝可能是中国历史上唯一只有一位配偶的皇帝，这自然解释了她对丈夫的特殊影响力。皇帝的妻兄张鹤龄与其弟经常出入宫禁。一次宴饮中，皇帝起身如厕，醉酒的张鹤龄抓起皇帝留下的冠冕戴在自己头上。这种轻率之举在传统社会中可被视为重罪。何鼎感到愤怒不足为奇。另一次，张氏窥视皇帝寝宫帘幕，何鼎抓起骨朵（一种顶端呈葫芦形的铁制武器——К. П.），打算立即惩处这个破坏秩序的人。为何此意未得执行，《明史》未作说明，但何鼎上奏弹劾张氏兄弟不敬及破坏君臣关系准则。皇后得知此事后大怒，皇帝站在妻子一边，何鼎被投入锦衣卫（皇帝亲军）监狱。当被问及可能的指使者时，何鼎确认有此等人，并在被要求说出其姓名时答道：“孔子与孟子”（《明史》1958：31470/3278）。何鼎以此回答表明，他的行动完全符合儒家学说创始人的遗训。几位大臣上奏皇帝请求宽恕何鼎，但皇帝因皇后之故拒绝。最终，张皇后派有权势的宦官李广将何鼎杖毙。此时皇帝对死去的仆从感到惋惜，赐予何鼎墓志铭，其文刻于石碑之上。接下来是一段独特的总结，记述了尽职守法、成功完成军事任务的宦官邓原、麦秀、简中和刘清，以及历侍两朝、廉洁无私的顾问萧敬。在关于萧敬的叙述中引用了皇帝对他的评价，使读者得以半—"},{"type":"subh","text":"原刊第 82 页 · 源 PDF 第 4 页","role":"source-page","page":4},{"type":"text","role":"text","page":4,"printed":82,"id":"p0004.000","text":"窥典范宦官品质之一斑：“萧敬，是朕咨询之人，但他从未试图借此[谋取]权力”（《明史》1958：31470/3278）。然而下文又说，只有李广和蒋琮获得了皇帝的信任，而据他们本人的传记可知（同上：31470/3278–31471/3279），他们最终辜负了这份信任，这留下了负面印象。"},{"type":"text","role":"text","page":4,"printed":82,"id":"p0004.001","text":"我们面对的是一篇真正的儒家信徒为其信念献身的经典传记。作为类比，可以想起大臣李仕鲁的传记，他批评明朝开国皇帝朱元璋过分（从坚定的儒家学者角度看）崇信佛教，并为其信念付出了生命（马丁诺夫 1974：319）。何鼎同样为捍卫儒家原则而死，尽管批评的对象不是皇帝本人的行为，而是其近臣的行为。"},{"type":"text","role":"text","page":4,"printed":82,"id":"p0004.002","text":"应当指出，宦官与外戚的冲突可视为明代宫廷政治斗争的特征之一。上述权宦刘瑾和魏忠贤的仕途也以此类冲突为标志。如有意，可从中看到两种管理原则——贵族原则与官僚原则——的斗争（在后一种原则下，具体到中世纪中国的历史条件，或如拜占庭，为宦官势力的增长创造了有利条件）。但这种对立只能具有非常有限的性质，因为在明代中国，贵族（皇帝近亲除外）的政治分量通常微不足道。"},{"type":"text","role":"text","page":4,"printed":82,"id":"p0004.003","text":"何鼎与李芳相隔约六十年，李芳的任职时间跨越隆庆（1567–1573）和万历（1573–1620）两朝。李芳的官职地位要高得多：他在司礼监担任太监，对应正四品（宦官所任职务中规定的最高品级）。李芳受到穆宗皇帝的信任，皇帝赏识其才能，他多次上奏，既揭露个别人的舞弊行为，又提出裁减超编职位、减少宫廷额外储备粮食和建筑材料定额的建议。在年幼的皇帝登基之后——"},{"type":"subh","text":"原刊第 83 页 · 源 PDF 第 5 页","role":"source-page","page":5},{"type":"text","role":"text","page":5,"printed":83,"id":"p0005.000","text":"神宗登基后，他的宠臣变成了宦官滕祥、孟冲和陈洪，他们想方设法取悦君主。有一次，他们用灯笼搭建了一座龟山，并引诱皇帝参加通宵宴饮（此事可能发生在新年前夕，因为龟山——一种再现海兽轮廓的灯笼构造——是新年庆典的装饰之一。——皮斯佐夫注）。李芳激烈谏阻皇帝此类消遣，引起了小皇帝的不满。滕祥等人趁机诬陷李芳，李芳被迫离职。随后李芳被杖责并关入刑部监狱等候审理。当大臣们询问其罪过时，皇帝回答：“[李]芳侍奉朕无[应有的]恭敬，应将其囚禁”（《明史》1958：31477/3285）。据《明史》记载，李芳入狱后，皇帝的宠臣们更加肆无忌惮，对他们不法行为的描述占据了传记后续文本的大部分。而李芳在狱中度过了近一年半，之后被发配到南京充军（同上）。"},{"type":"text","role":"text","page":5,"printed":83,"id":"p0005.001","text":"陈矩（1539–1608）的传记可能是《明史》中“好”宦官最鲜明的传记（同上：31484/3292–31485/3293）。如果说李芳的垮台发生在万历初年，那么陈矩仕途的顶峰大约在这一时期的中叶。陈矩以公正温和著称，供职于宫廷行政的关键部门——司礼监，担任重要的秉笔太监一职，并于万历二十六年（1598年）执掌东厂（秘密警察）。他在这些要职上的工作因正值争立太子之际而大为复杂。深受皇帝宠爱的郑贵妃图谋绕过皇帝长子（由一宫女所生）而立自己的儿子为太子。皇帝似乎倾向于支持宠妃的意愿。但长子在大臣和近臣中也有有影响力的支持者。这种局面自然有利于宫廷中的阴谋和党争。陈矩在《明史》中记载的第一项任务是替皇帝寻书。陈矩呈献给君主书籍中，有大官吕坤（1536–1618）的著作《闺范图说》（《家庭行为规范图解叙—"},{"type":"subh","text":"原刊第 84 页 · 源 PDF 第 6 页","role":"source-page","page":6},{"type":"text","role":"text","page":6,"printed":84,"id":"p0006.000","text":"述》）——一部独特的女性训诫书。皇帝将此书赐予郑贵妃，贵妃为训诫作序，该书便以此形式刻版印行。与此同时，出现了一篇不知何人所写的该书跋文，声称贵妃计划为其子谋取太子名位，为此与吕坤等人勾结。三年后，长子终究被立为太子，但如下文所述，宫廷并未平静。万历三十一年（1603年）末，在宫中及一些官员宅邸门前发现了匿名揭帖，其不知名的作者声称贵妃计划更换太子，并为此纠集了一批近臣。陈矩将这份匿名信的副本呈交皇帝，皇帝勃然大怒，命陈矩和锦衣卫首领务必查出作者。大量嫌疑人被拘押，案件有演变成大规模审判之势。在此情况下，从《明史》文本可以判断，陈矩与其说表现出高罗佩小说中狄法官式的天才侦探才能，不如说得以置身于沸腾的阴谋之外，这些阴谋有可能使调查变成清算私怨的借口。不久，京城居民焦生光被捕，他敲诈一富商，以其名义作诗，诗中特别提到了郑贵妃。尽管对焦生光即使施以酷刑也未能迫使其承认撰写揭帖，但根据间接证据，其作者身份似乎可能性很大。陈矩不确定焦生光有罪，但认为他无论如何已该处死。同时，考虑到皇帝的愤怒，拖延侦查将导致许多显然无辜的人被牵连。焦生光被认定有罪并处决，其余嫌疑人获释。"},{"type":"text","role":"text","page":6,"printed":84,"id":"p0006.001","text":"自万历三十三年（1605年）起，陈矩掌管司礼监（宦官所能担任的最高职位），并仍执掌东厂，试图在危急情况下减轻那些遭受皇帝雷霆之怒者的命运。次年，陈矩奉命巡视监狱，结果大量囚犯获释。一年后，陈矩去世。皇帝为他建祠，并赐名“清忠”。"},{"type":"subh","text":"原刊第 85 页 · 源 PDF 第 7 页","role":"source-page","page":7},{"type":"text","role":"text","page":7,"printed":85,"id":"p0007.000","text":"传记的结语再次强调陈矩的功绩：“……擅权者少，至东厂狱中草生……朝廷与天下[相互]和睦”（《明史》1958：31484/3292–31485/3293）。然而，此文结尾却以一段完全抹去这幅田园景象的话收束：被派为宫廷采办的宦官在皇帝纵容下胡作非为，以致“民心愤怨，[这]不久便导致战乱”（同上：31485/3293）。"},{"type":"text","role":"text","page":7,"printed":85,"id":"p0007.001","text":"在陈矩的传记之后，紧接着是王安（？–1621）的传记，这在时间顺序和叙事逻辑上都是合理的。王安仕途的起步，源于陈矩的推荐，他被任命为皇长子的伴读。在围绕储位争夺的阴谋氛围中，王安成功保护了他的这位尊贵“同窗”，使其免受郑贵妃的算计。当他的侍读对象即位为光宗时，任命王安为礼部尚书，并听取他旨在整顿政治局势的建议。王安受到高级官员的尊敬。光宗英年早逝后，他宠爱的李姓妃子出于私利，将年幼的皇太子置于自己的监护之下。正是在王安的关键作用下，李妃的阴谋被化解，皇太子得以登基，李妃也被逐出政治舞台。因此，新皇帝熹宗对王安怀有感激和信任之情。然而，此时却暴露出王安识人不明，加之身体虚弱无法定期朝见皇帝，这两点对他而言是致命的。起初，王安轻信其下属魏朝对其朋友——刚入宫不久的宦官魏忠贤——的无尽吹捧。王安在魏忠贤仕途早期便对其表示好感。后来，魏朝与魏忠贤因争夺皇帝乳母客氏的宠信而惹怒了王安。这导致魏朝被驱逐，而魏忠贤和客氏则对王安“怀恨在心”，或许他们意识到了来自王安的威胁。当皇帝提议由王安执掌礼部时，他拒绝了。客氏说服皇帝批准王安的辞职请求，并以李妃的悲惨先例恐吓犹豫不决的魏忠贤，促使其采取果断行动。结果，因诬-"},{"type":"subh","text":"原刊第 86 页 · 源 PDF 第 8 页","role":"source-page","page":8},{"type":"text","role":"text","page":8,"printed":86,"id":"p0008.000","text":"陷，王安被流放，并死于魏忠贤和客氏的党羽、宦官刘朝之手。即便在王安死后，魏忠贤仍利用他的名字进行政治斗争。直到最后一位明朝皇帝思宗（即位后罢黜了魏忠贤）登基，王安才在死后被平反，朝廷为他建立祠庙，并赐谥号“忠显”（《明史》1958年版：31485/3293）。"},{"type":"text","role":"text","page":8,"printed":86,"id":"p0008.001","text":"王承恩（？–1644）无疑是一位完美的臣子，他官至礼部尚书（正四品）。在李自成率领的起义军逼近北京的危急时刻，思宗皇帝将指挥京城卫戍部队的重任托付给王承恩。王承恩利用火炮，挫败了起义军挖掘城墙的企图。当城市最终陷落时，王承恩陪伴在皇帝身边，并在皇帝自缢后立即随之自尽。因其忠诚，王承恩获得了来自退守南京的明朝宗室以及起义军撤退后在北京建立的新满族王朝的死后哀荣（同上：3143/3301）。"},{"type":"text","role":"text","page":8,"printed":86,"id":"p0008.002","text":"王承恩传记的逻辑延续是范正华的生平，他奉思宗之命守卫京畿地区某城，死于起义军之手。在范正华传记的末尾，列举了另外四位为王朝殉难的宫廷宦官的名字（高时明、李凤、朱象张和张国元——他们均在宫廷等级中担任相当高的职位）。首都迁至南京后，明朝宗室建立了“忠仆祠”，并为上述人物举行祭祀（其中王承恩位居首位）。但是，作者们或许是为了淡化结局的悲壮色彩，以一则轶事结束了范正华的传记（从而也结束了整个“宦官传”部分）：在受到南明朝廷尊崇的忠仆名单中，不知为何竟包括了东厂首领王之心，他虽向起义军自愿投降，但后来却因巨额财富而被起义军折磨致死（同上：31493/3301）。人们可以认为，这样的结局体现了作者们试图以一位高级宦官的负面行为作为叙事的结尾，并隐晦地批评南明朝廷缺乏对事件做出正确"},{"type":"subh","text":"原刊第 87 页 · 源 PDF 第 9 页","role":"source-page","page":9},{"type":"text","role":"text","page":9,"printed":87,"id":"p0009.000","text":"判断的能力。这种批评并不完全公允，因为《明史》的作者们自己承认（在高起潜的传记中），起义军攻占北京期间伴随的一些事件细节难以厘清（《明史》1958年版：31493/3301）。"},{"type":"text","role":"text","page":9,"printed":87,"id":"p0009.001","text":"在了解了数位宦官的生平之后，我们转向总体结论。当然，《明史》的作者们并不打算为明代所有宫廷宦官立传。这在技术上是不可行的，正如无法为统治近三个世纪的王朝中所有的大臣（更不用说所有官员）立传一样。在这方面，任何断代史的编纂者都不可避免地采用某种“缩放”手法来描绘历史，只有在君主身上，才通常能实现一比一的精确对应，即历史人物数量与史书篇幅的完全匹配（不过，即便在这里也需要一些限定条件）。因此，从一开始，这里涉及的仅仅是精选的宫廷宦官传记。与此同时，被纳入相应章节的不仅是奸臣恶徒的生平，还有那些忠于国家、恪尽职守并为崇高理想献身的忠臣的生平。"},{"type":"text","role":"text","page":9,"printed":87,"id":"p0009.002","text":"这种追求某种“客观性”的方法，早在中国史学之父司马迁那里便已采用（Крюков 1972: 61–63），随后成为历代正史的惯用手法，尽管人们不禁要问，它后来是否已沦为一种程式化的史学技巧。Б. Г. 多罗宁（Доронин）对这种传统中国史学固有的方法进行了分析，尤其详细地考察了历代正史中对农民起义的描述（Доронин 2002: 184–187）。很难设想，《明史》的潜在读者会轻易相信，宫廷中的所有宦官都纯属奸恶之徒，且在近三百年的时间里竟无人察觉这种状况的反常。《明史》的作者们描绘了一幅更为复杂、因而也更具说服力的图景，以契合其提出的理念。《宦官传》的编纂者显然运用了一套相当广泛的手法，旨在将符合其总体理念的图景固定在读者意识中。其中部分手法已在我国研究文献中加以分析（同上：187–195, 209–224）。"},{"type":"subh","text":"原刊第 88 页 · 源 PDF 第 10 页","role":"source-page","page":10},{"type":"text","role":"text","page":10,"printed":88,"id":"p0010.000","text":"对宫廷宦官在明朝命运中所扮演角色的负面评价，在宦官传记集的前言中表述得极为明确（《明史》1958：31462/3270）。而在传记正文中，这一评价则“溶解”于其中，时而以隐晦暗示的形式显现，时而又以毫不含糊的决绝态度凝定下来。声名狼藉人物的传记当然为谴责提供了最大空间，但在“好”宦官的传记中，同样的态度似乎也以更温和的形式存在。随着叙述的展开，所援引的滥用职权事实即使不是传主本人的，也是其对手的。正面人物传记的简略、对其与周围环境冲突的提及，以及有时他们的悲剧结局，大概都旨在向读者意识中灌输这样一种观念：此类人物在宫廷世界中是特殊的、非典型的、注定要失败的。"},{"type":"text","role":"text","page":10,"printed":88,"id":"p0010.001","text":"如我们所知，在忠诚直率的何鼎传记中，提到了尽职守法的宦官将领邓原、麦秀、简忠和刘清，以及模范谏臣萧敬。然而，接下来又说，只有李广和蒋琮获得了皇帝的信任，而他们最终辜负了这份信任，这给人留下了总体的负面印象。在刚正的李芳传记中，超过三分之一的篇幅用于列举三位皇帝宠臣——宦官滕祥、孟冲和陈洪——所犯的滥用职权行为，加之叙述主角因这些权贵的阴谋而遭受的悲惨命运，再次营造出一幅阴暗的画面。同样值得注意的是，何鼎和李芳为朝廷和国家利益所上的奏章引起了同僚的反感，而从后续叙述中可以明白原因：何鼎的建议违背了李广的利益，李芳的举措似乎有可能终结滕祥的滥用行为。在这片黑暗中，陈矩的传记闪现出一丝微弱的希望之光，他坚定地远离阴谋，受到神宗皇帝的尊重。但对陈矩成就的令人印象深刻的列举，以一段关于宦官采购者在皇帝纵容下恐吓民众的悲观段落告终。暮色般的气氛再次凝聚，为魏忠贤合乎规律地登场做好了准备。"},{"type":"text","role":"text","page":10,"printed":88,"id":"p0010.002","text":"还不能不注意到一个几乎并非偶然的事实：拥有最详尽传记的是刘瑾和魏忠贤——那个时代最臭名昭著的权贵。"}]},{"id":"sec2","title":"文献","paras":[{"type":"subh","text":"原刊第 89 页 · 源 PDF 第 11 页","role":"source-page","page":11},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.000","text":"明。这在一定程度上促使该章节的所有人物中，正是这些人物最让读者铭记。值得注意的是，现代历史幽默漫画《中国宦官》的作者们为明代专辑（从《明史》所载约四十篇传记中）只挑选了四个最恶毒的宦官传记，其中自然包括刘瑾和魏忠贤（Wang Yongsheng, Chi Sheng 1994）。这个读者对朝代史的接受实例，可以在一定程度上证明《明史》作者们所选策略的成功，以及他们实现了既定目标。"},{"type":"subh","role":"heading","page":11,"printed":89,"id":"p0011.001","text":"文献"},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.002","text":"沃斯克列先斯基，Д. Н. 2002。《中国历史与文学中的宫廷宦官》。载：沃斯克列先斯基，Д. Н.、乌索夫，В. Н.（编），《宫廷阴谋之书。中国权力巅峰的宦官》。莫斯科：纳塔利斯出版社，第13–132页。"},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.003","text":"多罗宁，Б. Г. 2002。《17—18世纪中华帝国史学史》。圣彼得堡：圣彼得堡国立大学语文系出版社。"},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.004","text":"杜布罗夫斯卡娅，Д. В. 2022。Naviget, Haec Summa Est，或郑和海军上将的最后探索。《东方信使》第2期：第78–98页。DOI: 10.18254/S268684310021474-9。"},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.005","text":"克留科夫，М. В. 1972。司马迁及其《史记》。载：司马迁，《史记》。第1卷。莫斯科：科学出版社。"},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.006","text":"马丁诺夫，А. С. 1974。明代儒教、佛教与宫廷。载：瓦西里耶夫，Л. С.（主编），《中国历史与文化》，第307–324页。莫斯科：科学出版社；东方文献总编辑部。"},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.007","text":"《明史》。1958。上海：商务印书馆（中文）。"},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.008","text":"皮斯佐夫，К. М. 2020。《明史》总体构想中“宦官服饰”分章的位置。《中国社会与国家》。第50卷第1部分。莫斯科：俄罗斯科学院东方学研究所，第186–199页。DOI: 10.31696/2227-3816-2020-50-1-186-199。"},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.009","text":"斯韦特，Я. М. 1955。《追寻东方旅行家和航海家的足迹》。莫斯科：国家地理文献出版社。"},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.010","text":"斯韦特，Я. М. 1960。《船尾之后十万里》。莫斯科：国家地理文献出版社。"},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.011","text":"西蒙诺夫斯卡娅，Л. В.、列佩申斯基，К. В.（编）。1960。《中世纪中国历史文选（15—17世纪）》。莫斯科：莫斯科大学出版社。"},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.012","text":"Goodrich, L. C., Fang Chaoying (eds.). 1976. Dictionary of Ming Biography, 1368–1644. Vol. 1–2. New York: Columbia University Press."},{"type":"text","role":"text","page":11,"printed":89,"id":"p0011.013","text":"Wang Yongsheng, Chi Sheng (eds.). 1994. Chinese Eunuchs. Inside Stories of the Chinese Court. Vol. 3. Singapore: Asiapac."}]}];

/* ============ Build sidebar TOC ============ */
const tocNav = document.getElementById('toc');
const groupTitles = {
  'frontmatter': '卷首 · Front Matter',
  'main': '正文 · Main Text',
  'back': '附录 · Back Matter'
};
const tocOrder = ["sec1","sec2"];

function tocLabel(s){ return {"sec1":["正文",""],"sec2":["文献",""]}[s.id]; }

let activeGroup = 'main';
tocOrder.forEach(id=>{
  const s = EN.find(x=>x.id===id);
  if(!s) return;
