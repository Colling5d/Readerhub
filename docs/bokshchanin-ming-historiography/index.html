/* ============ BOOK DATA (injected by build) ============ */
const EN = /*__EN__*/[{"id":"sec1","title":"Текст","paras":[{"type":"subh","text":"С. 71–82 печатного выпуска · Страница исходного PDF 1","role":"source-page","page":1},{"type":"subh","role":"heading","page":1,"printed":null,"id":"p0001.000","text":"История Китая в период Мин (1368-1644) в отечественной историографии"},{"type":"text","role":"text","page":1,"printed":null,"id":"p0001.001","text":"Бокщанин А.А."},{"type":"text","role":"text","page":1,"printed":null,"id":"p0001.002","text":"Общество и государство в Китае. XXXVII научная конференция. Москва, 2007. С. 71–82."},{"type":"text","role":"text","page":1,"printed":null,"id":"p0001.003","text":"История Китая подразделяется как самими китайцами, так и зарубежными исследователями на периоды царствования сменявших друг друга или параллельно существовавших правящих династий. Это традиционное деление было воспринято и российскими китаеведами, но в 20-е гг. XX в. в советском востоковедении возникла неудовлетворенность таким «царистским» подходом. Тем не менее, попытки найти другие критерии периодизации исторического прошлого Китая не увенчались успехом, и тому были объективные причины. Во-первых, династийная периодизация сопрягается с глубинными аспектами традиционной китайской культуры. При имевших место с глубокой древности сменах правящих режимов, осуществлявшихся, как правило, с применением силы, возникла необходимость их рационального объяснения и оправдания в глазах современников и потомком. Помимо апелляции к воле Неба – Верховного божества, на вооружение была взята разработанная мыслителем Цзоу Янем (305– 240 гг. до н.э.) теория борьбы и последовательной смены «пяти стихий» или же «сил» (五德 y дэ), связанных с «пятью первоэлементами» (五行 у син) - землей, деревом, металлом, огнем и водой, в основе чего лежит взаимодействие противоположных космологических сил - Инь и Ян (темного и светлого, мужского и женского и т.д.). В результате династийные периоды стали рассматриваться как отдельные этапы общеисторического процесса (см. подробнее 1, с. 139-140). Во-вторых, и, как представляется, это наиболее важно для исследователя, традиционное китайское историописание было непосредственно привязано к «династийной» последовательности исторического процесса. Поэтому изучать историк Китая по династийным периодам наиболее удобно, что, естественно, не должно влиять на представления исследователя о целостности пройденного Китаем длительного пути исторического развития. Разумеется также, что история Китая после свержения монархии и связанных с ней порядков после Синьхайской революции 1911 г. требует иной периодизации."},{"type":"text","role":"text","page":1,"printed":null,"id":"p0001.004","text":"При изучении исследователями различных династийных периодов наибольшее внимание привлекает последний из них – время династии Цин (1644-1911). Свидетельством тому, среди прочего, является осуществляемый в настоящее время в КНР проект создания многотомной (ориентировочно до 30 томов) истории названного периода, а также выход в свет в нашей стране коллективного труда «Новая история Китая» (М., 1972), капитальной работы О.Е. Непомнина «История Китая. Эпоха Цин» (М., 2005) и целого ряда монографий других отечественных ученых. Это вполне закономерно, поскольку именно в этот период наряду с сохранением многих устоявшихся за многие века порядков вызревают те новые явления в жизни китайского государства и общества, которые открывают в XX в. совершенно новую страницу в истории страны. Предшествующему периоду – династии Мин – в его общем и целом уделяется гораздо меньше внимания. Однако следует учитывать, что маньчжурская династия Цин, завоевав Китай, взяла на вооружение очень многие черты и порядки, сложившиеся в предшествующий период Мин. Недаром в китайской исследовательской литературе имеется немало работ, посвященных времени обеих династий (Мин и Цин), как некоему единому этапу в развитии страны."},{"type":"subh","text":"С. 71–82 печатного выпуска · Страница исходного PDF 2","role":"source-page","page":2},{"type":"text","role":"text","page":2,"printed":null,"id":"p0002.000","text":"Об интересе отечественных китаеведов к истории Китая периода Мин свидетельствует перевод на русский язык С. Линовцевым на рубеже XVIII-XIX вв. официально утвержденной китайскими властями «Истории династии Мин» (Мин ши), к сожалению, так и оставшийся в рукописи. Первые попытки дать обобщающую характеристику отдельным периодам истории Китая, в том числе и периоду Мин, относятся лишь к 20-м годам XX в. Причем этот период характеризовался тогда в контрастном сравнении с предшествующим, когда Китай был завоеван монголами и находился под властью монгольской правящей династии Юань (1271–1368). В частности, К.А. Харнский в изданной в 1927 г. работе «Китай с древнейших времен до наших дней» подходит к оценке периодов Юань и Мин с позиций становления в мировой практике «торгового капитализма». Он пишет: «Юаньский период был, несомненно, периодом роста торгового капитализма. Следующий, Минский период... не был в этом отношении шагом вперед. Наоборот, тогда... произошло движение вспять. Минский период был критическим периодом китайской истории. До него Китай стоял впереди Европы. После него он оказался позади» (2, с. 213). В связи с этим К.А. Харнский характеризует период Мин как «трагические для Китая столетия», «двести лет гниения» и, наконец, как «худшие годы Китайской империи» (последнее – применительно к концу периода Мин, конец XVI – начало XVII вв.; см. [2, с. 218, 229, 233])."},{"type":"text","role":"text","page":2,"printed":null,"id":"p0002.001","text":"Однако К.А. Харнский оговаривает, что кризисные явления в Китае в период Мин проявились отнюдь не сразу после воцарения новой династии. В годы становления новой династии и особенно в первой четверти XV в., когда предпринимались грандиозные экспедиции китайского флота подруководством Чжэн Хэ, доходившего до Аравии и Африки и «созидавшие империю за морями», еще «ничто не предвещало предстоящего упадка» (2, с. 218). Наоборот, «к концу первой четверти XX в. Минская империя по внешности процветала. Ее слава гремела от Байкала и Енисея до экватора и от Японии до Африки. Если бы Китай сумел тогда закрепить свои успехи, он затмил бы Монгольскую империю и императорский Рим, и других претендентов на мировое господство. Но он не закрепил своих успехов, и закрепить их не мог. А не мог потому, что внутри его была червоточина, которая все расширялась и все больше разъедала его государственный организм... — сказывалось растущее разорение крестьян» (2, с. 15–16). Последнее обусловливалось, по мнению К.А. Харнского, нараставшим перераспределением земли в пользу крупных землевладельцев, сановников и родичей императорского дома, ростом налогового бремени, постепенным разложением правящей верхушки. В частности, одна из глав книги озаглавлена «Мертвые души на троне» и красочно повествует о ничтожности личности многих императоров, занимавших престол в период Мин (2, с. 239–241). Характерно также, что первый период существования сменившей династию Мин маньчжурской династии Цин (1644–1911) определяется К.А. Харнским как «Век могущества Китая» (2, с. 245)."},{"type":"text","role":"text","page":2,"printed":null,"id":"p0002.002","text":"К отмеченным выше оценкам в какой-то степени близка характеристика периода Мин у Г.И. Сафарова, работы которого публиковались в конце 20-х – начале 30-х годов. В его «Очерках по истории Китая» Минский период рассматривается вместе с предшествующим периодом завоевания Китая монголами и правления здесь монгольской династии Юань (3, с.125–178), но в то же время противопоставлен последнему. В своих работах Г.И. Сафаров исходит из того положения, что в XIII-XIV вв. в Китае наблюдается «торговый подъем, впервые отделивший торговый, купеческий капитал от ростовщического», который господствовал в стране до этого времени в силу господства феодализма в земельных отношениях (4, с. 268) «При монголах, – как считает автор, – впервые [в истории Китая – А.Б.] ремесло приобрело независимый рынок сбыта, внешний рынок. До сих пор оно работало лишь на феодальные потребление, в качестве придатка крестьянской домашней промышленности» (4, с. 269). Тогда же китайский торговый, купеческий капитал все больше обращается к производству. Именно монгольское правление, считает Г.И.Сафаров, «создало территориальный фундамент для развития китайской торговли в международном масштабе, расширило ее внутренние рамки... но не смогло справиться с противоречиями между феодализмом и торговым капитализмом, выросшими на новой исторической ступени» (4, с. 274). Последнее обуславливалось тем, что городское развитие в Китае шло другим путем, чем на Западе. Китай в этом отношении следовал той же дорогой, что и вся Азия... В Китае город только однажды поднялся на борьбу против феодализма, когда носителем его оказались завоеватели – монголы. Но тогда была исключительная обстановка. На протяжении же большей части китайской истории город был не противовесом феодализму, а его опорой. Наступивший после свержения монгольского господства в Китае период Мин характеризуется Г.И. Сафаровым в целом как «новая феодализация» и «новое усиление феодальной эксплуатации» (4, с. 274; 3, с. 160). Причины этого видятся автору не только в отмеченном положении китайского города и «варварских способах эксплуатации рабочей силы» и «хищнического истощения земли», но и во внешних, привходящих факторах. Таковыми он считает образование в Средней Азии империи Тимура в конце XIV в., а затем усиление турецкого господства на Ближнем Востоке в XV-XVI вв., что оборвало начавшие до этого успешно развиваться связи между Китаем и Западом. Фактором, приведшим отчасти к «возврату Китая в состояние средневековой замкнутости называется также открытие европейцами Америки и постепенный перенос основной заинтересованности европейского торгового капитала с Востока на Запад, а также усиление японского пиратства у берегов Китая, что побуждало минское правительство прибегать к политике ограничения внешних морских сношений» (3, с. 160-163; 4, с. 274–276). В результате, как полагал Г.И.Сафаров, солидаризируясь с англоязычным китайским автором Чжун Сусе, «...Китай вступил в период внутреннего беспорядка, парализовавшего внешнюю торговлю. Доступ в Небесную империю – как сухопутный, так и морской – был загражден... Транзитные пути (по суше – А.Б.) стали непроходимыми вследствие войны между сторонниками Мин и монголами» (4, с. 276–277). Г.И. Сафаров, опять-таки солидаризируясь с названным китайским автором, считает, что «беспримерная активность китайцев в южных морях» в начале XV в., т.е. экспедиции китайского флота под руководством Чжэн Хэ, «была не совсем такой, чтобы благоприятствовать торговым отношениям с Западом... Пользуясь своим преобладающим положением, Китай успешно расширял свои торговые сношения с прибрежными странами, лежащими на юг от него... Но, к несчастью, торговые отношения Китая с западным миром находились в состоянии застоя весь XV век» (4, с. 277)."},{"type":"subh","text":"С. 71–82 печатного выпуска · Страница исходного PDF 3","role":"source-page","page":3},{"type":"text","role":"text","page":3,"printed":null,"id":"p0003.000","text":"Появление на Дальнем Востоке первых европейских «авантюристов» в начале XVI в., по мнению Г.И. Сафарова, способствовало оживлению отмеченных отношений. Но поведение пришельцев, занимавшихся больше пиратством, чем торговлей, лишь подталкивало Китай к самоизоляции, к «возврату в состояние средневековой замкнутости» (3, с. 162–163). Ограничение и упадок торговли вели к ее превращению в «придаток феодального и ростовщического господства. Это была новая феодализация Китая – и в области земельных отношений, и в области торговли и ремесла, и в области внешних сношений, составлявших самую сильную сторону монгольской эпохи. В области управления и политической идеологии Минская эпоха ознаменовалась новым возвратом к «классическим образцам», «к „самобытным“ началам бюрократически организованного феодализма и к конфуцианству» (3, с. 164-165)."},{"type":"subh","text":"С. 71–82 печатного выпуска · Страница исходного PDF 4","role":"source-page","page":4},{"type":"text","role":"text","page":4,"printed":null,"id":"p0004.000","text":"Г.И. Сафаров считал также, что эпоха Мин характеризовалась «острым кризисом барщинного хозяйства, проявившегося в процессе все большего дробления землепользования при господстве крупного землевладения». Это дополнялось злоупотреблениями со стороны властей, а также появлением во второй половине XV в. «царских хуторов» – крупных землевладений вместе с находившимися там крестьянами, принадлежавших членам правящего императорского дома. Фаворитизм и разложение правящей верхушки также способствовали нараставшему общему кризису. «Стгнившая по гаремам верхушка представляла собой пустышку с выхолощенной волей, лишенную ума» (3, с. 177). Среди явлений, обострявших социальные противоречия в стране в период Мин, Г.И. Сафаров, солидаризируясь с Э. Паркером, отмечает увеличение здесь такого явления, как рабство: «В период Минской династии... обычай накоплять большое количество рабов в частных семьях снова получил распространение» (4, с. 286). Все это в совокупности привело к широкому народному восстанию, и «Минская династия позорно кончилась, не сумев даже защитить себя хотя бы одним жестом» (3, с. 177)."},{"type":"text","role":"text","page":4,"printed":null,"id":"p0004.001","text":"Принципиально иной подход к оценке места периода Мин в истории Китая обозначился в послевоенные годы. Н.И. Конрад в вышедшем в 1957 г. томе III «Всемирной истории», отмечал, что монгольские завоевания в целом и завоевание Китая в частности вызвали «гигантские разрушения... Завоеванная страна фактически была предоставлена произволу отдельных монгольских военачальников, управлявших теми или иными районами и беспощадно эксплуатировавших китайское население» (5, с. 525–530). Хотя аппарат управления Китаем был оставлен ими прежним, но, в целом, он был изъят из рук самих китайцев и частично передоверен чужеземцам из центральноазиатских районов, служившим монгольскому двору. При хане Хубилае (1260–1294) были предприняты шаги в сторону нормализации положения в стране на прежних китайских основах, но «эффект от подобных мероприятий был, однако, не велик»; «монгольская знать, осевшая в Китае, захватывала земли с работавшими на них крестьянами и старалась только выжать как можно больше доходов. О развитии сельского хозяйства она и не помышляла... Положение крестьян в поместьях резко ухудшилось. Крестьяне утрачивали даже те остатки личной свободы, которые они сохраняли в позднетанское и сунское время (IX-XIII вв. - А.Б.)» (5, с. 529–530)."},{"type":"text","role":"text","page":4,"printed":null,"id":"p0004.002","text":"Что же касается развития китайской внешней торговли при монгольской династии Юань, то Н.И. Конрад отмечает, что она была передана монголами «в руки объединенных в компании мусульманских купцов, преимущественно персов и таджиков», а обустройство и налаживание путей сообщения с зарубежными странами обуславливалось главным образом военно-стратегическими, а не экономическими соображениями (5, с. 525). Кроме того китайские торгово-ремесленные объединения были обязаны бесплатно отдавать монгольским властям часть своих товаров (5, с. 530). Все это обусловило общий упадок страны (5, с. 531)."},{"type":"text","role":"text","page":4,"printed":null,"id":"p0004.003","text":"В связи с вышеизложенным Н.И. Конрад считает вполне закономерным то недовольство, которое существовало во всех слоях китайского общества в период Юань и со временем вылилось в широкое повстанческое движение. Отсюда, говоря о воцарении династии Мин, изгнавшей монгольские власти из Китая, он пишет: «Так было свергнуто монгольское иго, тяготевшее над китайским народом около столетия» (5, с. 533). Характеризуя начальный этап периода Мин, Н.И. Конрад отмечает «существенные изменения», проведенные в административно-управленческой системе страны, и реорганизацию армии в конце XIV в. при первом минском императоре Чжу Юаньчжане, а также успехи в освоении морских торговых путей в начале XV в. в результате экспедиций китайского флота под руководством Чжэн Хэ, равно как и прочие успехи во внешней политике страны, укрепление ее могущества. Констатируются также сдвиги в управлении деревенским сектором экономики, приводившие к проникновению туда торгового капитала из города, что вело как к усилению товарно-денежных отношений в деревне, так и к усилению эксплуатации основной массы крестьянства (5, с. 535–536). Делается также вывод и о появлении в Китае «элементов капиталистического производства» и появлении в стране сил, которые уже с XVI в. подтачивали сложившийся здесь феодальный строй (5, с. 537; 6, с. 318)."},{"type":"subh","text":"С. 71–82 печатного выпуска · Страница исходного PDF 5","role":"source-page","page":5},{"type":"text","role":"text","page":5,"printed":null,"id":"p0005.000","text":"Вторая половина периода Мин (XVI – сер. XVII вв.) во «Всемирной истории» (т. IV) освещается Л.И. Думаном. Здесь отмечается, что Китай того времени представлял собой обширную и могучую державу, оказывающую политическое и культурное влияние на сопредельные края. В стране шло развитие производительных сил и в области ремесла и товарного производства, и в прогрессе техники земледелия и денежных отношений. Наблюдались рост городов и интенсификация внутренней торговли, освоение китайскими колонистами района Южных морей, расширение внешней морской торговли с зарубежными странами. Новыми достижениями в период Мин обогатилась и китайская материальная и духовная культура. Поэтому можно говорить о появлении в данное время в стране элементов новых, капиталистических отношений. Но в то же время здесь продолжали действовать факторы, тормозившие общественное развитие. В первую очередь это сохранившаяся высокая степень эксплуатации основной массы населения - крестьян, процесс перераспределения земли и рост крупной земельной собственности политической и социальной верхушки общества, сохранение подконтрольной властям общинной организации в деревне и в городе, наличие и расширение казенного, управляемого государственными властями производства. Неблагоприятными для Китая факторами во внешнеполитической ситуации оставались нападения «японских пиратов», появление в начале XVI в. у берегов Китая первых европейских конкистадоров, обострение вооруженной борьбы со вновь усилившимся в середине XVI в. давлением со стороны монголов и, наконец, все нараставшая опасность со стороны объединившихся в конце XVI - начале XVII вв. союза маньчжурских племен. Постепенное обострение классовых противоречий, связанное о усилением эксплуатации как сельского, так и городского население, внутренние противоречия в среде господствующих слоев общества породили во второй четверти XVII в. мощное народное антиправительственное движение, похоронившее империю Мин, что в свою очередь облегчило маньчжурским завоевателям установить в Китае свою власть (7, с. 618–649)."},{"type":"text","role":"text","page":5,"printed":null,"id":"p0005.001","text":"Приход к власти в Китае после падения династии Мин маньчжурских завоевателей расценивается как весьма негативное явление, отбросившее страну назад, поскольку сопровождалось разрушением производительных сил страны, массовым истреблением китайского населения, гибелью многих городов (8, с. 304). Касаясь же более раннего, Минского периода истории, и, в частности, XVI - XVII вв., Л.В. Симоновская отмечает, что он оставался к середине 60-х гг. XX в. еще довольно мало изучен исследователями: недостаточно выявленными и спорными оставались основные закономерности и специфические черты в жизни китайского общества того времени, не было ясности в трактовке отдельных китайских терминов, встречающихся в тогдашних исторических источниках (9, с. 3)."},{"type":"text","role":"text","page":5,"printed":null,"id":"p0005.002","text":"Характеризуя этот период истории Китая, Л.В. Симоновская исходит из позиции, близкой к оценкам, высказанным И.Н. Конрадом и Л.И. Думаном, отмечавшим наличие в минском Китае как положительных тенденций, так и отрицательных явлений. Производительные силы в сельском хозяйстве Китая к XVI-XVII вв. достигли большой высоты. Производилось большое количество самых различных продовольственных культур, зерновых, овощей и фруктов, продуктов"},{"type":"subh","text":"С. 71–82 печатного выпуска · Страница исходного PDF 6","role":"source-page","page":6},{"type":"text","role":"text","page":6,"printed":null,"id":"p0006.000","text":"животноводства, чая, сахара, специй, растительного масла и т.д. Урожайность была высокой, выше, чем в европейских странах. Из технических культур, помимо замечательных китайских шелков, к описанному времени широкое распространение получил хлопчатник, а на юге страны еще и табак. Заметный прогресс наблюдался и в городских ремеслах, была усовершенствована техника плавки железа, применялись довольно совершенные для своего времени механизмы – подъемные, прессовочные и т.д. Значительной высоты достигло строительное мастерство, производство оружия. Оставалось традиционно высоким китайское художественное ремесло. На новую высоту поднялось кораблестроительное дело. Расширилась добыча различных руд, каменного угля и соли. Интенсивно развивалась внутренняя торговля. Наряду с городами – административными центрами, появились и своеобразные города – посады, где торговля ограничивалась и контролировалась властями меньше, чем в первых. Несмотря на все ограничения и дотошный контроль со стороны государственных властей, развивалась и частная морская торговля. Появились отдельные признаки складывания единого всекитайского рынка. В городах развивалась научная мысль, пополнявшая практические знания, процветало искусство и литературное творчество."},{"type":"text","role":"text","page":6,"printed":null,"id":"p0006.001","text":"Отмеченные явления, по мнению Л.В. Симоновской, позволяют утверждать, что конец XIV – начало XV вв. были временем экономического расцвета и подъема культуры. Китая, несмотря на то, что государственный аппарат и военная организация империи Мин строились по образцу существовавших здесь прежних феодальных империй, со сравнительно большим, чем прежде, усилением централизации (11, с. 90)."},{"type":"text","role":"text","page":6,"printed":null,"id":"p0006.002","text":"Этот вывод противопоставляется той негативной оценке, которая дается Л.В. Симоновской временам господства в Китае монгольской власти. Та эпоха характеризуется как «монгольское иго», итогом которого были разорение страны и упадок экономики, ярко обозначившийся к середине XIV в. (12, с. 156–158; 13, с. 124–127). Что же касается характеристики китайского общества XV-XVII вв. в целом, то оно определяется как позднефеодальное, где уже имеются элементы разложения феодальных порядков и появляются элементы развития новой, капиталистической формации (14, с. 49–50)."},{"type":"text","role":"text","page":6,"printed":null,"id":"p0006.003","text":"Из мешавших дальнейшему прогрессивному развитию страны факторов называется опять-таки чрезмерная эксплуатация основных производителей – крестьян, а также сохранявшаяся во многом рутинная техника сельскохозяйственного производства. Росло налоговое бремя, шло перераспределение земли в пользу крупных земельных собственников. Развитию городского ремесла препятствовала жесткая система регламентации и учета со стороны властей. Ограничивалась внешняя торговля. Было утрачено приобретенное в начале периода Мин преимущество Китая на морских торговых путях в Индийском океане. Политический строй страны сохранял черты восточной деспотии, к чему добавлялось усиливавшееся разложение и коррумпированность правящей верхушки (10, с. 48, 51, 57, 61, 63–64). Все это вместе взятое, наряду с неудачей попыток встать на путь могущих облегчить общее положение реформ, и определяло нарастание кризиса, приведшего к широкому народному восстанию и падению династии Мин под ударами вторгнувшихся с севера маньчжуров (12, с. 137)."},{"type":"text","role":"text","page":6,"printed":null,"id":"p0006.004","text":"Э.Г. Стужина на примере анализа китайского ремесла и промыслов XIV-XVIII вв. приходит к выводу, что в означенное время здесь имела место отчетливо выраженная, хотя и медленная, трансформация в поступательном направлении. Причем наиболее заметно это движение именно в XVI - первой половине XVII веков, то есть во времена империи Мин. Применительно к этому"},{"type":"subh","text":"С. 71–82 печатного выпуска · Страница исходного PDF 7","role":"source-page","page":7},{"type":"text","role":"text","page":7,"printed":null,"id":"p0007.000","text":"периоду можно говорить о зарождении здесь капиталистических отношений. Но в конце XVII - XVIII веках, то есть, во времена империи Цин, эта тенденция встречает все больше преград и препятствий, а в середине XVIII в. во время маньчжурского завоевания вообще прерывается на некоторое время (15, с. 222)."},{"type":"text","role":"text","page":7,"printed":null,"id":"p0007.001","text":"Н.И.Фомина в целом присоединяется к мнению, высказанному Л.В. Симоновской и Э.П. Стужиной, отмечая при этом, что наиболее заметные ростки нового наблюдались в конце XVI – начале XVII веков не по всей стране, а прежде всего в юго-восточных провинциях страны, наиболее развитых в социально-экономическом отношении. Соответственно, маньчжурское завоевание, погубившее империю Мин, расценивается Н.И. Фоминой как принесшее стране «консервацию наиболее застойных экономических форм, усугублявшихся усилением политического и национального гнета (16, с. 36–40, 227)."},{"type":"text","role":"text","page":7,"printed":null,"id":"p0007.002","text":"Л.А. Боровкова, говоря о предыстории появления династии Мин, подчеркивает сугубо разрушительную роль монгольского завоевания Китая, особенно тяжело сказавшегося на судьбе северных районов страны. Приход к власти основателя династии Мин Чжу Юаньчжана был обеспечен не только общенародным недовольством чужеземным господством, но и поддержкой нового властителя господствующими слоями китайского общества, прежде всего из южной части страны. После же приходя к власти, Чжу Юаньчжан и его ближайшее окружение восстановили «старые формы и методы угнетения крестьянства» (17, с. 6, 175–176)."},{"type":"text","role":"text","page":7,"printed":null,"id":"p0007.003","text":"Н.П. Свистунова констатирует обострение социально-экономических противоречий в монголо-китайской империи Юань в первой половине XIV в. и отмечает, что господство монгольских завоевателей вызывало недовольство всех слоев китайского народа (18, с. 14). После же воцарения династии Мин в политике новых властей в основной сфере хозяйства - аграрной наблюдаются неоднозначные процессы. С одной стороны, возрастают и укрепляются фонды государственной земли, с другой – дан (после первоначальных ограничений) простор для роста крупной земельной частной собственности, с третьей – наблюдается дальнейшее расширение свободных крестьянских земельных владений (18, с. 34–36, 69, 71–73). Анализ же финансовой политики минских властей приводит автора к выводу, что с последней четверти XV в. быстро растет задолженность государственной казны, купеческое сословие все более эксплуатируется властями (прежде всего местными). В правящих чиновных кругах растет коррупция, наблюдается неспособность правительства справляться с насущными делами, всесилие и бесконтрольность придворных клик (19, с. 23)."},{"type":"text","role":"text","page":7,"printed":null,"id":"p0007.004","text":"В.В. Малявин отмечает, что главной целью пришедшего к власти первого императора из династии Мин было создание прочного централизованного государства, полностью послушного его воле. В результате китайский абсолютизм поднялся на не известную прежде высоту. Одновременно был усилен непосредственный государственный контроль над основной массой населения. Вместе с тем, тогда же была создана в стране стройная военная организация, и в течение XV-XVI веков Китай в целом переживал экономический подъем (20, с. 23, 26). Однако последующее усиление эксплуатации крестьянских масс, ведшее к их обнищанию, вело к подрыву финансовой базы страны. Это привело к медленному, но неуклонному упадку империи Мин. Ее положение в XVI в. осложнялось и обострением внешнеполитической ситуации: нараставшим давлением со стороны монголов, процветанием пиратства на морском побережье, нападениями консолидировавшихся на северных рубежах маньчжуров. Все это, в сочетании с усиливающимися с 20-х годов XVII в. восстаниями внутри страны, привело к гибели Минской державы (20, с. 27)."},{"type":"subh","text":"С. 71–82 печатного выпуска · Страница исходного PDF 8","role":"source-page","page":8},{"type":"text","role":"text","page":8,"printed":null,"id":"p0008.000","text":"О.Е. Непомнин в работе, посвященной более позднему периоду в истории Китая, касается и основных моментов в развитии страны в XV–XVII веках. Здесь отмечается, что с середины XVI в. в Китае наблюдается рост производительных сил: достигают расцвета целый ряд промыслов – шелкоткачества и производства фарфора, бумаги, а также добыча полезных ископаемых, судостроение, производство сахара и масел, книгопечатание. Новации наблюдаются и в технике ремесленного производства. К XVII в. определяется специализация разных районов и городов на производстве той или иной продукции. Прогрессирует сама структура городского ремесла: появляются довольно крупные предприятия и наемный труд. В XVI–XVII вв. происходит подъем городской экономики. Можно также говорить о некотором раскрепощении (в переносном смысле - А.Б.) крестьян и ремесленников с приходом к власти династии Мин. Все это позволяет констатировать возникновение ростков капиталистического производства еще в 60–е – 70–е годы XVI в., в первую очередь в юго-восточных районах страны. Отмеченные качественные сдвиги в городах влияли на прогресс в сельском хозяйстве, в частности, расширялись посевы технических культур, совершенствовалась агротехника, сельскохозяйственные орудия, увеличивалась продуктивность. В отдельных районах оно втягивалось в орбиту товарно-денежного хозяйства (21, с. 23–27)."},{"type":"text","role":"text","page":8,"printed":null,"id":"p0008.001","text":"Вместе с тем в совместной работе О.Е. Непомнина с В.Б. Меньшиковым отмечается, что ни в начале XVI в., ни в последующие два столетия сравнительно регулярное общение европейских стран с Китаем не оказывало на последний никакого сколько-нибудь серьезного воздействия. Отрицательную роль здесь играла изоляционистская политика пекинских властей. Внешняя торговля оставалась неразвитой. Поэтому «экспорт» в Китай товарно-денежных отношений капиталистического типа «не накладывался на соответствующие процессы естественного саморазвития китайского общества и, понятно, не мог их стимулировать» (22, с. 51)."},{"type":"text","role":"text","page":8,"printed":null,"id":"p0008.002","text":"В вышедшем в 1998 г. учебнике для студентов профильных ВУЗов «Истории Китая», воцарение династии Мин определяется той негативной ситуацией, в которой оказалась страна под властью монгольских завоевателей. Автор раздела о монгольском владычестве в Китае – 3.Г.Лапина – считает, что само развитие процветавшей прежде страны было повернуто вспять: значительно сократилось население (к середине 30-х годов XIII в., на севере империи – в 10 раз), экономика пришла в упадок, образовался большой разрыв в культурных традициях правящего и привилегированного монгольского меньшинства с основной массой китайского народа, китайская политическая элита была отстранена от управления, основная масса исконного населения подвергалась всевозможным ограничениям. Наблюдавшееся с годами постепенное приобщение монгольской элиты к китайской культуре и управленческим порядкам в целом не изменило общей ситуации, и к середине XIV в. империя Юань пришла в полный упадок, приведший ее к падению (23, с. 232–234, 236, 240)."},{"type":"text","role":"text","page":8,"printed":null,"id":"p0008.003","text":"В разделе о самом периоде Мин, его автор, А.А. Писарев, подчеркивает особую роль основателя династии Чжу Юаньчжана в становлении и последующем функционировании новых порядков в стране. В их основу были положены принципы, выработанные еще во времена правления в Китае династии Тан (618–907). Но наряду с этим сохраняется и влияние некоторых образцов периода Юань. Основатель стремился всемерно укрепить монаршую власть и опереться на деревенскую общину наделенных землей крестьян. Вместе с тем, он испытывал недоверие к высшему слою чиновной знати, что выливалось в беспрецедентные по своей массовости в истории страны репрессий против правящей элиты. Альтернативную опору в верхах Чжу Юаньчжан пытался найти в лице своих многочисленных сыновей, которым он стал раздавать под надзор и управление уделы в разных частях страны (23, с. 243–244, 248)."},{"type":"subh","text":"С. 71–82 печатного выпуска · Страница исходного PDF 9","role":"source-page","page":9},{"type":"text","role":"text","page":9,"printed":null,"id":"p0009.000","text":"В начальное время периода Мин в стране, как отмечает автор, поднимается на новую высоту культура земледелия и его продуктивность, растут города, совершенствуется строительное дело и многие другие отрасли ремесленной промышленности, развиваются внешние связи. Однако примерно со второй половины XV в. подъем постепенно сменяется упадком, и причиной чему явились, как и в прежние времена, перераспределение земли, рост расходов государства и связанное с этим повышение налогов, а также рост населения, обгонявший возможности его обеспечения, и деформация власти, выражавшаяся в возобладании при дворе временщиков, усилении коррумпированности всех звеньев управленческого аппарата, неудаче попыток поправить положение с помощью реформ. В начале же XVII в. в стране наблюдается глубокий внутренний кризис, усугублявшийся внешней угрозой со стороны маньчжуров (23, с. 249–256, 260). Время же после падения империи Мин (конец XVII – XVIII вв.) характеризуется как этап постепенного возрождения Китая после тяжелых потерь, вызванных предшествующими внутренними смутами и нашествием маньчжуров (23, с. 267)."},{"type":"text","role":"text","page":9,"printed":null,"id":"p0009.001","text":"В обобщающем труде «История Востока», история Китая в период Мин (автор А.А. Бокщанин) подразделяется на два раздела: конец XIV–XV вв., и XVI – середина XVII вв. Здесь отмечается, что приход к власти нового правительства в 1368 г. сопровождался целым рядом реформ: центрального и местного административного управления, военного командования и армии, спецслужб и цензорского надзора, в результате чего все нити управления страной сосредоточились непосредственно в руках императора, но со временем достигшее в конце XIV в. своего апогея единовластие постепенно снова вошло в рамки определенных ограничений, выработанных многовековой китайской традицией. Мелкокрестьянское хозяйство, закрепленное реестровым учетом конца XIV в., постепенно сужалось в ходе все усиливавшегося процесса перераспределения земли. Однако вплоть до конца XV в. в стране не возникало сколько-нибудь существенной кризисной ситуации в аграрном строе. Отмечается развитие ремесленных промыслов, в частности, появление крупных мастерских, управлявшихся частными хозяевами, возникновение своеобразных цеховых организаций ремесленников и торговцев. Вместе с тем отмечается, что китайское общество оставалось, как и прежде, жестко иерархическим и стратифицированным. Несмотря на ликвидацию в конце XIV в. наиболее одиозных порядков, привнесенных монгольским владычеством, уже к концу упомянутого столетия выявилась невозможность поддержания избранного основателем династии Мин курса: постепенно ослабевала самодержавность власти императора, росли налоги, шло перераспределение земли. Однако вплоть до конца XV в. негативные процессы не приводили империю к сколько-нибудь явному кризису (24, т. II, с. 529, 534, 536, 538, 542, 545)."},{"type":"text","role":"text","page":9,"printed":null,"id":"p0009.002","text":"После означенного рубежа можно проследить начавшуюся деформацию власти: уклонение императоров от своих обязанностей, фаворитизм, появление и противоборство в правящих верхах различных группировок и клик склоки и интриги при «малых дворах» (в удельных владениях императорских родичей), разложение армии. Растут расходы казны, увеличиваются налоги. В процессе перераспределения земли растет крупная земельная собственность. Но вместе с тем крепнет и набирает силу городская экономика, повышается роль и состоятельность городской торгово-промышленовой верхушки, развиваются кредитно-денежные отношения, расширяются внешне торговые связи, сохраняется и дополняется высокий уровень духовной и материальной культуры Китая. В целом в XVI - начале XVII вв. страна переживала сложный и во многом противоречивый период в своей истории. Говорить о нарастании социально-политического"}]},{"id":"sec2","title":"Литература","paras":[{"type":"subh","text":"С. 71–82 печатного выпуска · Страница исходного PDF 10","role":"source-page","page":10},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.000","text":"кризиса в полном смысле этого слова можно лишь с 20-х гг. XVII в. Можно ли было найти выход из складывавшегося положения, сказать трудно, тем более, что дальнейший ход развития был существенно изменен маньчжурским завоеванием (24, т. III, с. 268–272, 277–289, 293, 300–301)."},{"type":"subh","role":"heading","page":10,"printed":null,"id":"p0010.001","text":"Литература"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.002","text":"1. Рубин В.А. Личность и власть в древнем Китае. М., 1999."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.003","text":"2. Харнский К. Китай с древнейших времен до наших дней. Хабаровск - Владивосток, 1927."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.004","text":"3. Сафаров Г.И. Очерки истории Китая. ОГИЗ, 1933."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.005","text":"4. Сафаров Г.И. Классы и классовая борьба в китайской истории. М.-Л., 1928."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.006","text":"5. Конрад Н.И. Народы Китая, Кореи, Японии и Индии в борьбе в монгольскими завоевателями. «Всемирная история», т. 3, М., 1957."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.007","text":"6. Конрад Н.И. Культура. - «Всемирая история», т. 5, М., 1958."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.008","text":"7. Думан Л.И. Китай в XVI-XVII веках. -»Всемирная история», т. 4, М., 1958"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.009","text":"8. Симоновская Л.В. Китай под властью маньчжурской династии. – «Всемирная история», т. 5, М., 1958."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.010","text":"9. Симоновская Л.В. Антифеодальная борьба китайских крестьян в XVII веке. М., 1966."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.011","text":"10. Симоновская Л.В. Великая крестьянская война в Китае (1628-1645). М., 1958."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.012","text":"11. Симоновская Л.В. Зренбург Г.Б., Юрьев М.Ф. Очерки истории Китая. М., 1956."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.013","text":"12. История стран Азии и Африки в средние века. Под ред. Л.В. Симоновской и Ф.М. Ацамба. М., 1968."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.014","text":"13. «История Китая с древнейших времен до наших дней, под ред. Л.В. Симоновской и"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.015","text":"М.Ф. Юрьева. М., 1974."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.016","text":"14. Симоновская Л.В. Основные черты истории средневекового Китая. - «Преподавание истории в школе», 1951, № 4."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.017","text":"15. Стужина Э.П. Китайское ремесло в XVI-XVIII веках. М., 1970"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.018","text":"16. Фомина Н.И. Борьба против Цинов на Юго-Востоке Китая (середина XVII в.). М., 1974."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.019","text":"17. Боровкова Л.А. Восстание «Красных войск» в Китае. М., 1971."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.020","text":"18. Свистунова Н.П. Аграрная политика династии Мин (XIV век). М., 1966."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.021","text":"19. Свистунова Н.П. Установления о соли и чае. М., 1975."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.022","text":"20. Крюков М.В., Малявин В.В., Софронов М.В. Этническая история китайцев на рубеже Средневековья и Нового времени. М., 1987."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.023","text":"21. Непомнин О.Е. Генезис капитализма в сельском хозяйстве Китая. М., 1966."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.024","text":"22. Непомнин О.Е., Меньшиков В.Б. Синтез в переходном обществе. Китай на грани веков. М., 1999."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.025","text":"23. «История Китая» под ред. А.В. Меликсетова. М., 1998."},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.026","text":"24. «История Востока», т. II, М., 1995; т. III, М., 1999."},{"type":"subh","text":"С. 71–82 печатного выпуска · Страница исходного PDF 11","role":"source-page","page":11},{"type":"text","role":"text","page":11,"printed":null,"id":"p0011.000","text":"Ст. опубл.: Общество и государство в Китае: XXXLII научная конференция: К 100-летию со дня рождения Л.И.Думана / Ин-т востоковедения; сост. и отв. ред. С.И.Блюмхен. – М.: Вост. лит., 2007. – 352 с. – ISBN 5-02-018544-2 (в обл.). С. 71-82."}]}];
const ZH = /*__ZH__*/[{"id":"sec1","title":"正文","paras":[{"type":"subh","text":"原刊第 71–82 页 · 转制 PDF 第 1 页","role":"source-page","page":1},{"type":"subh","role":"heading","page":1,"printed":null,"id":"p0001.000","text":"俄罗斯史学中的明代中国史（1368—1644）"},{"type":"text","role":"text","page":1,"printed":null,"id":"p0001.001","text":"阿·阿·鲍克夏宁"},{"type":"text","role":"text","page":1,"printed":null,"id":"p0001.002","text":"《中国社会与国家》第三十七次学术会议，莫斯科，2007年，第71—82页。"},{"type":"text","role":"text","page":1,"printed":null,"id":"p0001.003","text":"无论中国人自己还是外国研究者，都把中国历史划分为相继更替或并行存在的各个统治王朝的时期。俄国汉学家也接受了这种传统分期，但20世纪20年代，苏联东方学对这种“王朝史观”产生了不满。尽管如此，寻找中国历史过去其他分期标准的尝试并未成功，这有其客观原因。第一，王朝分期与传统中国文化的深层方面相关联。自远古以来，统治政权的更替通常借助武力实现，因此有必要同时代人和后人合理地解释和辩护这种更替。除了诉诸上天——最高神祇——的意志外，还采用了思想家邹衍（公元前305—前240年）提出的“五德”或“五力”（五德 у дэ）相争与依次更替的理论，五德与“五行”（五行 у син）——土、木、金、火、水——相关联，其基础是对立的宇宙力量——阴与阳（暗与明、男与女等）——的相互作用。结果，王朝时期被视为总体历史过程的各个阶段（详见1，第139—140页）。第二，而且在我看来这对研究者最为重要，中国传统史学直接依附于历史过程的“王朝”序列。因此，按王朝时期研究中国历史最为方便，这自然不应影响研究者对中国所走过的漫长历史发展道路之整体性的认识。当然，1911年辛亥革命推翻君主制及与之相关的秩序之后的中国历史，也需要另一种分期。"},{"type":"text","role":"text","page":1,"printed":null,"id":"p0001.004","text":"在研究各个王朝时期时，研究者最关注的是最后一个时期——清朝（1644—1911）。其证明之一是，中华人民共和国目前正在实施编纂该时期多卷本（预计约30卷）历史的项目，以及我国出版的集体著作《中国近代史》（莫斯科，1972年）、О.Е.涅波姆宁的巨著《中国史·清代》（莫斯科，2005年）和其他俄国学者的多部专著。这完全合乎规律，因为正是在这一时期，在保留许多延续数百年之久的秩序的同时，中国国家和社会生活中那些在20世纪揭开国家历史全新一页的新现象逐渐成熟。对前一时期——明朝——总体上关注要少得多。然而应当考虑到，满清王朝征服中国后，采纳了前一明朝时期形成的许多特征和秩序。难怪中国研究文献中有不少著作把两个王朝（明和清）时期视为国家发展的某种统一阶段。"},{"type":"subh","text":"原刊第 71–82 页 · 转制 PDF 第 2 页","role":"source-page","page":2},{"type":"text","role":"text","page":2,"printed":null,"id":"p0002.000","text":"俄国汉学家对明朝时期中国史的兴趣，可由С.利诺夫采夫在18—19世纪之交把中国官方钦定的《明史》译成俄文为证，可惜该译稿一直停留在手稿状态。首次尝试对包括明朝时期在内的中国历史各个时期作概括性描述，仅始于20世纪20年代。而且当时对这一时期的描述是与前一时期——中国被蒙古人征服并处于蒙古统治王朝元朝（1271—1368）治下——作对比。具体而言，К.А.哈尔恩斯基在1927年出版的《中国从远古至今》一书中，从世界实践中“商业资本主义”形成的角度评价元和明两个时期。他写道：“元朝时期无疑是商业资本主义增长的时期。接下来的明朝时期……在这方面并未前进。相反，当时……发生了倒退。明朝时期是中国历史的危急时期。在此之前，中国领先于欧洲。在此之后，它落在了后面”（2，第213页）。据此，К.А.哈尔恩斯基把明朝时期描述为“中国的悲剧性世纪”、“两百年的腐烂”，最后是“中华帝国最糟糕的岁月”（后者指明朝末期，16世纪末至17世纪初；见[2，第218、229、233页]）。"},{"type":"text","role":"text","page":2,"printed":null,"id":"p0002.001","text":"然而К.А.哈尔恩斯基附带说明，明朝时期中国的危机现象绝非在新王朝登基后立即显现。在新王朝建立之年，特别是在15世纪头25年，即中国舰队在郑和率领下进行远达阿拉伯和非洲、“在海外创建帝国”的宏伟远征之时，“还没有任何迹象预示即将到来的衰落”（2，第218页）。相反，“到15世纪头25年末，明帝国表面上繁荣昌盛。它的声威从贝加尔湖和叶尼塞河传到赤道，从日本传到非洲。如果中国当时能够巩固自己的成就，它就会使蒙古帝国、帝制罗马以及其他觊觎世界霸权的竞争者黯然失色。但它没有巩固自己的成就，也无法巩固。无法巩固是因为其内部有蛀孔，这蛀孔不断扩大，越来越腐蚀它的国家机体……——农民日益破产的影响”（2，第15—16页）。据К.А.哈尔恩斯基看来，后者是由土地日益向大土地所有者、大臣和皇室宗亲重新分配、税负加重、统治上层逐渐腐化所致。具体而言，书中有一章题为“王座上的死魂灵”，生动叙述了明朝时期许多在位的皇帝人格之渺小（2，第239—241页）。同样具有代表性的是，К.А.哈尔恩斯基把取代明朝的满清王朝（1644—1911）存在的第一个时期定为“中国强盛世纪”（2，第245页）。"},{"type":"text","role":"text","page":2,"printed":null,"id":"p0002.002","text":"Г.И.萨法罗夫的明朝时期描述在某种程度上接近上述评价，其著作发表于20年代末至30年代初。在他的《中国史纲要》中，明朝时期与前一时期——蒙古人征服中国及蒙古王朝元朝在此统治——一并考察（3，第125—178页），但同时与后者相对照。Г.И.萨法罗夫在其著作中出发点是：13—14世纪中国出现“商业高涨，首次使商业资本、商人资本与高利贷资本分离”，后者此前因封建主义在土地关系中的统治而在国内占主导（4，第268页）。“在蒙古人统治下——作者认为——[中国历史上——А.Б.]手工业首次获得了独立的销售市场，即外部市场。在此之前，它只为封建消费服务，作为农民家庭工业的附属品”（4，第269页）。当时中国的商业资本、商人资本也越来越多地转向生产。Г.И.萨法罗夫认为，正是蒙古统治“为中国贸易在国际规模上的发展创造了地域基础，扩大了其内部范围……但未能解决在新的历史阶段上成长起来的封建主义与商业资本主义之间的矛盾”（4，第274页）。后者是由于中国城市发展走的是与西方不同的道路。中国在这方面走的是整个亚洲同样的道路……在中国，城市只有一次奋起反抗封建主义，当时其载体是征服者——蒙古人。但那时是特殊形势。在中国历史的大部分时间里，城市不是封建主义的对立面，而是其支柱。Г.И.萨法罗夫把蒙古统治被推翻后在中国到来的明朝时期总体上描述为“新的封建化”和“封建剥削的新加强”（4，第274页；3，第160页）。作者认为其原因不仅在于上述中国城市的状况以及“野蛮的劳动力剥削方式”和“对土地的掠夺性耗尽”，还在于外部的、附带的因素。他认为这些因素是14世纪末在中亚形成的帖木儿帝国，以及随后15—16世纪土耳其统治在近东的加强，这中断了此前已开始顺利发展的中国与西方之间的联系。部分导致“中国回到中世纪封闭状态”的因素，还包括欧洲人发现美洲以及欧洲商业资本的主要兴趣逐渐从东方转向西方，以及日本海盗在中国沿海的加剧，这促使明政府采取限制对外海上交往的政策”（3，第160—163页；4，第274—276页）。结果，正如Г.И.萨法罗夫与英语中国作者钟苏色（音）一致认为的那样，“……中国进入了内部混乱时期，使对外贸易瘫痪。进入天朝的通道——无论陆路还是海路——都被封锁……过境路线（陆路——А.Б.）因明支持者与蒙古人之间的战争而变得无法通行”（4，第276—277页）。Г.И.萨法罗夫再次与上述中国作者一致认为，“15世纪初中国人在南海史无前例的活跃”，即中国舰队在郑和率领下的远征，“并不完全有利于与西方的贸易关系……中国利用其优势地位，成功扩大了与位于其南方的沿海国家的贸易往来……但不幸的是，整个15世纪中国与西方世界的贸易关系处于停滞状态”（4，第277页）。"},{"type":"subh","text":"原刊第 71–82 页 · 转制 PDF 第 3 页","role":"source-page","page":3},{"type":"text","role":"text","page":3,"printed":null,"id":"p0003.000","text":"据Г.И.萨法罗夫看来，16世纪初首批欧洲“冒险家”在远东的出现促进了上述关系的活跃。但外来者的行为——他们更多从事海盗活动而非贸易——只是促使中国走向自我孤立，走向“回到中世纪封闭状态”（3，第162—163页）。贸易的限制和衰落导致其变成“封建和高利贷统治的附属品。这是中国新的封建化——无论在土地关系领域，还是在贸易和手工业领域，以及在构成蒙古时代最强方面的对外关系领域。在管理和政治意识形态领域，明朝时期则以新的回归‘经典范本’、回归‘独特的’官僚组织封建主义本源和儒家学说为标志”（3，第164—165页）。"},{"type":"subh","text":"原刊第 71–82 页 · 转制 PDF 第 4 页","role":"source-page","page":4},{"type":"text","role":"text","page":4,"printed":null,"id":"p0004.000","text":"Г.И.萨法罗夫还认为，明朝时期的特征是“劳役经济尖锐危机，表现为在大土地所有制统治下土地使用日益细分的进程”。此外还有当局的滥用职权，以及15世纪下半叶出现“皇庄”——连同那里农民的 large 土地占有，属于统治皇室的成员。宠幸和统治上层的腐化也促成了日益加剧的普遍危机。“在后宫中腐烂的上层是一具意志被阉割、丧失理智的空壳”（3，第177页）。在明朝时期加剧国内社会矛盾的现象中，Г.И.萨法罗夫与Э.帕克一致指出奴隶制现象的增多：“在明朝时期……在私人家庭中积聚大量奴隶的习俗再次流行”（4，第286页）。所有这些合在一起导致了广泛的人民起义，“明朝可耻地终结了，甚至未能以哪怕一个姿态来保护自己”（3，第177页）。"},{"type":"text","role":"text","page":4,"printed":null,"id":"p0004.001","text":"战后年代，对明朝在中国历史中地位的评估出现了原则不同的进路。Н.И.康拉德在1957年出版的《世界通史》第三卷中指出，蒙古征服总体而言、尤其是对中国的征服，造成了“巨大的破坏……被征服的国家实际上任由个别蒙古军事长官恣意妄为，他们管辖着各个地区，无情地剥削中国居民”（5，第525—530页）。尽管他们保留了中国原有的管理机构，但总体而言，这一机构已从中国人自己手中被夺走，部分被转交给服务于蒙古宫廷的中亚地区外来者。在忽必烈汗（1260—1294）时期，曾采取措施，按照中国原有基础使国内状况正常化，但“此类措施的效果却并不大”；“在中国定居下来的蒙古贵族夺取了土地以及耕种这些土地的农民，只图榨取尽可能多的收入。他们根本无意发展农业……庄园中农民的状况急剧恶化。农民甚至丧失了他们在晚唐和宋代（9—13世纪——А.Б.）所保留的那点人身自由的残余”（5，第529—530页）。"},{"type":"text","role":"text","page":4,"printed":null,"id":"p0004.002","text":"至于蒙古元朝时期中国对外贸易的发展，Н.И.康拉德指出，它被蒙古人交到了“联合为商团的穆斯林商人，主要是波斯人和塔吉克人”手中，而与外国交通路线的开辟和调整主要出于军事战略考虑，而非经济考虑（5，第525页）。此外，中国的工商团体必须无偿将自己的一部分商品交给蒙古当局（5，第530页）。这一切导致了国家的普遍衰落（5，第531页）。"},{"type":"text","role":"text","page":4,"printed":null,"id":"p0004.003","text":"鉴于上述情况，Н.И.康拉德认为，元代中国社会各阶层中存在的不满完全合乎规律，这种不满随时间推移演变为广泛的起义运动。因此，在谈到将蒙古当局逐出中国的明朝建立时，他写道：“蒙古桎梏就这样被推翻了，它压迫中国人民近一个世纪”（5，第533页）。在描述明初阶段时，Н.И.康拉德指出，14世纪末在明朝第一位皇帝朱元璋治下，国家的行政管理体系进行了“重大变革”，军队进行了重组，15世纪初中国船队在郑和率领下的远航开辟了海上贸易航线，取得了成功，国家对外政策也取得了其他成就，国力得到加强。他还指出，农村经济部门的管理发生了转变，城市的商业资本渗入其中，这既加强了农村的商品货币关系，也加强了对基本农民群众的剥削（5，第535—536页）。他还得出结论，中国出现了“资本主义生产的因素”，国内出现了从16世纪起就已侵蚀当地形成的封建制度的力量（5，第537页；6，第318页）。"},{"type":"subh","text":"原刊第 71–82 页 · 转制 PDF 第 5 页","role":"source-page","page":5},{"type":"text","role":"text","page":5,"printed":null,"id":"p0005.000","text":"明朝后半期（16世纪至17世纪中叶）在《世界通史》（第四卷）中由Л.И.杜曼阐述。书中指出，当时的中国是一个辽阔而强大的国家，对毗邻地区施加政治和文化影响。国内生产力在手工技艺和商品生产方面、在农业技术和货币关系进步方面都在发展。城市在增长，国内贸易在加强，中国移民开发南海地区，与国外的海上对外贸易在扩大。中国的物质文化和精神文化在明代也增添了新成就。因此可以说，当时国内出现了新的、资本主义关系的因素。但与此同时，阻碍社会发展的因素仍在起作用。首先是基本居民群众——农民——仍保留着高程度的剥削，土地重新分配和社会政治上层的大地产在增长，城乡保留着受当局控制的村社组织，存在着并扩大着由国家政权管理的官营生产。对外政策形势中对中国不利的因素仍然是“日本海盗”的袭击，16世纪初中国沿海出现第一批欧洲征服者，16世纪中叶与重新加强的蒙古压力进行武装斗争加剧，最后是16世纪末至17世纪初联合起来的满洲部落联盟日益增长的威胁。阶级矛盾逐渐加剧，这与对城乡居民剥削的加强有关，社会统治阶层内部的矛盾在17世纪第二个四分之一时期引发了强大的反政府人民运动，埋葬了明帝国，这反过来又使满洲征服者更容易在中国建立自己的政权（7，第618—649页）。"},{"type":"text","role":"text","page":5,"printed":null,"id":"p0005.001","text":"明朝覆亡后满洲征服者在中国掌权，被视为极为负面的事件，使国家倒退，因为它伴随着国家生产力的破坏、对中国居民的大规模屠杀、许多城市的毁灭（8，第304页）。至于更早的明代历史，特别是16—17世纪，Л.В.西蒙诺夫斯卡娅指出，到20世纪60年代中期，这段历史仍被研究者研究得相当少：当时中国社会生活的基本规律和特有特征仍揭示不足且有争议，对当时历史文献中出现的某些中文术语的解释也不明确（9，第3页）。"},{"type":"text","role":"text","page":5,"printed":null,"id":"p0005.002","text":"在描述中国历史的这一时期时，Л.В.西蒙诺夫斯卡娅的出发点接近于И.Н.康拉德和Л.И.杜曼所表达的评价，他们指出明代中国既有积极趋势，也有消极现象。到16—17世纪，中国农业中的生产力达到了很高水平。生产了大量各种各样的粮食作物、谷物、蔬菜和水果、产品"},{"type":"subh","text":"原刊第 71–82 页 · 转制 PDF 第 6 页","role":"source-page","page":6},{"type":"text","role":"text","page":6,"printed":null,"id":"p0006.000","text":"畜产品、茶、糖、香料、植物油等。收成很高，高于欧洲国家。在经济作物方面，除了出色的中国丝绸外，到所述时期棉花广泛传播，而在南方还有烟草。城市手工业也取得了显著进步，炼铁技术得到改进，使用了当时相当完善的机械——起重、压制等。建筑技艺、武器生产达到了很高水平。中国的工艺美术传统上保持高水平。造船业提高到新的高度。各种矿石、煤和盐的开采扩大了。国内贸易密集发展。除了作为行政中心的城市外，还出现了独特的城市——关厢，那里的贸易受当局限制和控制比前者少。尽管国家政权有一切限制和严密监督，私人海上贸易仍在发展。出现了形成统一全中国市场的个别迹象。城市中科学思想发展，充实了实用知识，艺术和文学创作繁荣。"},{"type":"text","role":"text","page":6,"printed":null,"id":"p0006.001","text":"据Л.В.西蒙诺夫斯卡娅认为，上述现象使人可以断言，14世纪末至15世纪初是经济繁荣和文化高涨的时期。尽管明帝国的国家机构和军事组织是按照此地先前存在的封建帝国的模式建立的，中央集权化程度相对比以往更大（11，第90页）。"},{"type":"text","role":"text","page":6,"printed":null,"id":"p0006.002","text":"这一结论与Л.В.西蒙诺夫斯卡娅对蒙古政权在中国统治时期所给的负面评价相对立。那个时代被描述为“蒙古桎梏”，其结果是国家的破坏和经济的衰落，到14世纪中叶已明显显现（12，第156—158页；13，第124—127页）。至于对15—17世纪中国社会的总体描述，则被定性为晚期封建社会，其中已有封建秩序解体的因素，并出现了新的、资本主义形态发展的因素（14，第49—50页）。"},{"type":"text","role":"text","page":6,"printed":null,"id":"p0006.003","text":"在阻碍国家进一步进步发展的因素中，再次提到对主要生产者——农民——的过度剥削，以及农业生产中在许多方面仍保留的守旧技术。税负加重，土地重新分配有利于大土地所有者。城市手工业的发展受到当局严格规范和登记制度的阻碍。对外贸易受到限制。中国在明初获得的在印度洋海上贸易航线上的优势丧失了。国家的政治制度保留了东方专制制度的特征，此外还有统治上层日益加剧的腐化和贪污（10，第48、51、57、61、63—64页）。所有这一切，加上试图走上可能缓解总体状况的改革之路的失败，决定了危机的加剧，导致广泛的人民起义和明朝在从北方入侵的满洲人打击下覆亡（12，第137页）。"},{"type":"text","role":"text","page":6,"printed":null,"id":"p0006.004","text":"Э.Г.斯图日娜以分析14—18世纪中国手工业和工场手工业为例得出结论：在上述时期，这里发生了明显表现出的、尽管缓慢的向前演进。而且这一运动在16世纪至17世纪上半期，即明帝国时期最为明显。就这一"},{"type":"subh","text":"原刊第 71–82 页 · 转制 PDF 第 7 页","role":"source-page","page":7},{"type":"text","role":"text","page":7,"printed":null,"id":"p0007.000","text":"时期而言，可以说这里产生了资本主义关系。但在17世纪末至18世纪，即清帝国时期，这一趋势遇到越来越多的障碍和阻碍，而在18世纪中叶满洲征服期间，则一度完全中断（15，第222页）。"},{"type":"text","role":"text","page":7,"printed":null,"id":"p0007.001","text":"Н.И.福米娜总体上同意Л.В.西蒙诺夫斯卡娅和Э.П.斯图日娜所表达的意见，同时指出，最明显的新事物萌芽在16世纪末至17世纪初并非遍及全国，而首先是在社会经济关系最发达的东南各省。因此，葬送明帝国的满洲征服被Н.И.福米娜评价为给国家带来了“最停滞的经济形式的固化，这种固化因政治压迫和民族压迫的加强而加剧”（16，第36—40、227页）。"},{"type":"text","role":"text","page":7,"printed":null,"id":"p0007.002","text":"Л.А.博罗夫科娃在谈到明朝出现的前史时，强调蒙古征服中国的纯破坏性作用，这对国家北部地区的命运尤为沉重。明朝奠基者朱元璋掌权，不仅依靠全民对外来统治的不满，也依靠中国社会统治阶层、首先是南方地区对新统治者的支持。然而掌权之后，朱元璋及其近臣恢复了“压迫农民的旧形式和方法”（17，第6、175—176页）。"},{"type":"text","role":"text","page":7,"printed":null,"id":"p0007.003","text":"Н.П.斯维斯图诺娃指出，14世纪上半期蒙古—中国元帝国社会经济矛盾加剧，并指出蒙古征服者的统治引起中国各族人民所有阶层的不满（18，第14页）。而在明朝建立后，新政权在主要经济领域——农业——的政策中出现了并非单一的过程。一方面，国有土地总量增加和巩固；另一方面，在最初限制之后，大土地私有制获得了发展空间；第三方面，自由农民的土地占有进一步扩大（18，第34—36、69、71—73页）。对明朝当局财政政策的分析使作者得出结论：从15世纪最后四分之一时期起，国库欠债迅速增长，商人阶层越来越受当局（首先是地方当局）剥削。统治官僚圈中贪污腐败加剧，政府无力应付紧迫事务，宫廷朋党权势无边且不受监督（19，第23页）。"},{"type":"text","role":"text","page":7,"printed":null,"id":"p0007.004","text":"В.В.马利亚温指出，取得政权的明朝第一位皇帝的主要目标是建立一个完全听命于其意志的稳固的中央集权国家。其结果是中国的专制制度上升到了前所未有的高度。与此同时，加强了对基本居民群众的直接国家控制。在此同时，当时在国内还建立了严整的军事组织，而在15—16世纪，中国总体上经历了经济高涨（20，第23、26页）。然而随后对农民群众剥削的加强导致其贫困化，进而破坏了国家的财政基础。这导致了明帝国的缓慢但不可阻挡的衰落。其在16世纪的地位还因对外政治形势的恶化而变得复杂：来自蒙古人的压力日益增大，沿海海盗活动猖獗，在北部边境联合起来的满洲人的进攻。所有这一切，加上17世纪20年代起国内日益加剧的起义，导致了明王朝的灭亡（20，第27页）。"},{"type":"subh","text":"原刊第 71–82 页 · 转制 PDF 第 8 页","role":"source-page","page":8},{"type":"text","role":"text","page":8,"printed":null,"id":"p0008.000","text":"О.Е.涅波姆宁在其关于中国历史较晚时期的著作中，也涉及了15—17世纪国家发展的主要方面。书中指出，从16世纪中叶起，中国的生产力有所增长：一系列手工业——丝织业和瓷器、纸张生产，以及矿产开采、造船、糖和油的生产、印刷术——达到繁荣。手工业技术中也出现了革新。到17世纪，不同地区和城市在生产某种产品上的专业化得以确定。城市手工业的结构本身也在进步：出现了相当规模的企业和雇佣劳动。在16—17世纪，城市经济呈现高涨。还可以说明朝掌权后，农民和手工业者获得了一定程度的解放（转义上的——А.Б.）。所有这一切使得人们能够确认，资本主义生产的萌芽早在16世纪60—70年代就已出现，首先是在国家的东南地区。城市中上述质的变化影响了农业的进步，特别是经济作物播种面积扩大，农艺、农具得到改进，生产率提高。在某些地区，农业被卷入商品货币经济的轨道（21，第23—27页）。"},{"type":"text","role":"text","page":8,"printed":null,"id":"p0008.001","text":"与此同时，在О.Е.涅波姆宁与В.Б.缅希科夫的合著中指出，无论是在16世纪初，还是在随后的两个世纪里，欧洲国家与中国相对定期的交往对后者都没有产生任何较为严重的影响。北京当局的孤立主义政策在这里起了负面作用。对外贸易仍不发达。因此，资本主义类型的商品货币关系向中国的“输出”“并未叠加到中国社会自然自我发展的相应过程之上，显然也不可能刺激这些过程”（22，第51页）。"},{"type":"text","role":"text","page":8,"printed":null,"id":"p0008.002","text":"在1998年出版的高等专业院校学生教材《中国史》中，明朝的建立被归结为蒙古征服者统治下国家所处的负面境地。关于蒙古在中国统治部分作者——З.Г.拉皮娜——认为，原本繁荣的国家的发展本身被逆转：人口大幅减少（到13世纪30年代中期，帝国北部减少了十分之九），经济陷入衰落，统治的和享有特权的蒙古少数派与广大中国人民之间在文化传统上形成了巨大断裂，中国政治精英被排除在管理之外，原住民的基本群众遭受种种限制。多年来观察到的蒙古精英逐渐接触中国文化和行政管理秩序，总体上并未改变总的情况，到14世纪中叶，元帝国完全衰落，导致其覆亡（23，第232—234、236、240页）。"},{"type":"text","role":"text","page":8,"printed":null,"id":"p0008.003","text":"在关于明朝时期本身的部分，其作者А.А.皮萨列夫强调了王朝奠基者朱元璋在确立和随后运作国家新秩序中的特殊作用。这些秩序的基础是早在唐朝（618—907）统治中国时期形成的原则。但与此同时，元朝时期某些范本的影响也保留下来。奠基者力图全力加强君主权力，并依靠分得土地的农民村社。与此同时，他对官僚贵族的上层不信任，这表现为该国历史上规模空前的对统治精英的镇压。朱元璋试图在其众多儿子身上找到上层中的替代支柱，他开始把国内各地的封地分给他们监督和管理（23，第243—244、248页）。"},{"type":"subh","text":"原刊第 71–82 页 · 转制 PDF 第 9 页","role":"source-page","page":9},{"type":"text","role":"text","page":9,"printed":null,"id":"p0009.000","text":"正如作者所指出的，在明朝初期，国家的耕作文化及其生产率上升到新的高度，城市增多，建筑业和许多其他手工业部门得到完善，对外联系得到发展。然而大约从15世纪下半叶起，高涨逐渐为衰落所取代，其原因与以往时代一样，是土地的重新分配、国家开支的增长以及与此相关的赋税提高，还有人口增长超过了供养能力的可能性，以及权力的变形，表现为宫廷中权臣得势、管理机关各个环节腐败加剧、通过改革改善状况的尝试失败。而在17世纪初，国家出现深刻的内部危机，因满洲人的外部威胁而加剧（23，第249—256、260页）。明帝国灭亡后的时期（17世纪末—18世纪）则被描述为中国在经历先前内乱和满洲人入侵造成的沉重损失后逐渐复兴的阶段（23，第267页）。"},{"type":"text","role":"text","page":9,"printed":null,"id":"p0009.001","text":"在综合性著作《东方史》中，明朝时期的中国历史（作者А.А.鲍克夏宁）分为两编：14世纪末—15世纪，以及16世纪—17世纪中叶。书中指出，1368年新政府掌权伴随着一系列改革：中央和地方行政管理、军事指挥和军队、特工部门和监察机构，其结果是国家管理的所有线索直接集中在皇帝手中，但随着时间的推移，在14世纪末达到顶点的专制独裁逐渐又重新进入中国数百年传统所形成的某些限制的框架之内。14世纪末通过户籍登记固定下来的小农经济，在日益加强的土地重新分配过程中逐渐缩小。然而直到15世纪末，国家在农业制度中并未出现任何较为严重的危机局面。书中指出了手工业的发展，特别是出现了由私人业主经营的大型作坊，产生了独特的手工业者和商人行会组织。与此同时指出，中国社会仍和以往一样是严格等级化和阶层化的。尽管14世纪末消除了蒙古统治带来的最令人反感的制度，但到上述世纪末，已显露出维持明朝奠基者所选路线的不可行性：皇帝的专制权力逐渐削弱，赋税增长，土地重新分配进行。然而直到15世纪末，负面进程并未使帝国陷入任何明显的危机（24，第II卷，第529、534、536、538、542、545页）。"},{"type":"text","role":"text","page":9,"printed":null,"id":"p0009.002","text":"在上述界限之后，可以追踪到已开始的权力变形：皇帝逃避自己的职责、宠臣政治、统治上层中出现各种集团和派系并相互争斗、“小朝廷”（皇帝亲属的封地）中的倾轧和阴谋、军队的腐化。国库开支增长，赋税增加。在土地重新分配过程中，大土地所有制增长。但与此同时，城市经济也在巩固和壮大，城市工商业上层的角色和财力提高，信贷货币关系发展，对外贸易联系扩大，中国高度发达的精神文化和物质文化得以保留和补充。总体而言，在16世纪—17世纪初，国家经历了其历史上复杂且在许多方面充满矛盾的时期。谈论社会政治危机的加剧"}]},{"id":"sec2","title":"参考文献","paras":[{"type":"subh","text":"原刊第 71–82 页 · 转制 PDF 第 10 页","role":"source-page","page":10},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.000","text":"严格意义上的社会政治危机只能从17世纪20年代算起。能否找到摆脱正在形成的局面的出路，很难说，更何况进一步的发展进程因满洲征服而发生了重大改变（24，第III卷，第268—272、277—289、293、300—301页）。"},{"type":"subh","role":"heading","page":10,"printed":null,"id":"p0010.001","text":"参考文献"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.002","text":"1. 鲁宾 В.А. 《古代中国的人格与权力》。莫斯科，1999年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.003","text":"2. 哈尔恩斯基 К. 《中国从远古至今》。哈巴罗夫斯克—符拉迪沃斯托克，1927年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.004","text":"3. 萨法罗夫 Г.И. 《中国历史概要》。ОГИЗ，1933年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.005","text":"4. 萨法罗夫 Г.И. 《中国历史中的阶级和阶级斗争》。莫斯科—列宁格勒，1928年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.006","text":"5. 康拉德 Н.И. 《中国、朝鲜、日本和印度人民反对蒙古征服者的斗争》。《世界历史》，第3卷，莫斯科，1957年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.007","text":"6. 康拉德 Н.И. 《文化》。《世界历史》，第5卷，莫斯科，1958年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.008","text":"7. 杜曼 Л.И. 《16—17世纪的中国》。《世界历史》，第4卷，莫斯科，1958年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.009","text":"8. 西蒙诺夫斯卡娅 Л.В. 《满洲王朝统治下的中国》。《世界历史》，第5卷，莫斯科，1958年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.010","text":"9. 西蒙诺夫斯卡娅 Л.В. 《17世纪中国农民的反封建斗争》。莫斯科，1966年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.011","text":"10. 西蒙诺夫斯卡娅 Л.В. 《中国伟大的农民战争（1628—1645）》。莫斯科，1958年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.012","text":"11. 西蒙诺夫斯卡娅 Л.В.、兹伦堡 Г.Б.、尤里耶夫 М.Ф. 《中国历史概要》。莫斯科，1956年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.013","text":"12. 《中世纪亚洲和非洲国家史》。Л.В.西蒙诺夫斯卡娅和Ф.М.阿察姆巴主编。莫斯科，1968年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.014","text":"13. 《中国从远古至今的历史》，Л.В.西蒙诺夫斯卡娅和"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.015","text":"М.Ф.尤里耶夫主编。莫斯科，1974年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.016","text":"14. 西蒙诺夫斯卡娅 Л.В. 《中世纪中国历史的基本特征》。《学校历史教学》，1951年，第4期。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.017","text":"15. 斯图日娜 Э.П. 《16—18世纪的中国手工业》。莫斯科，1970年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.018","text":"16. 福米娜 Н.И. 《中国东南部反对清朝的斗争（17世纪中叶）》。莫斯科，1974年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.019","text":"17. 博罗夫科娃 Л.А. 《中国的“红巾军”起义》。莫斯科，1971年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.020","text":"18. 斯维斯图诺娃 Н.П. 《明朝的农业政策（14世纪）》。莫斯科，1966年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.021","text":"19. 斯维斯图诺娃 Н.П. 《盐茶条例》。莫斯科，1975年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.022","text":"20. 克留科夫 М.В.、马利亚温 В.В.、索夫罗诺夫 М.В. 《中世纪与近代之交中国人的民族史》。莫斯科，1987年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.023","text":"21. 涅波姆宁 О.Е. 《中国农业中资本主义的起源》。莫斯科，1966年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.024","text":"22. 涅波姆宁 О.Е.、缅希科夫 В.Б. 《过渡社会中的综合。世纪之交的中国》。莫斯科，1999年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.025","text":"23. 《中国史》，А.В.梅利克谢托夫主编。莫斯科，1998年。"},{"type":"text","role":"text","page":10,"printed":null,"id":"p0010.026","text":"24. 《东方史》，第II卷，莫斯科，1995年；第III卷，莫斯科，1999年。"},{"type":"subh","text":"原刊第 71–82 页 · 转制 PDF 第 11 页","role":"source-page","page":11},{"type":"text","role":"text","page":11,"printed":null,"id":"p0011.000","text":"文章发表于：《中国的社会与国家：第三十七届学术会议：纪念Л.И.杜曼诞辰100周年》/ 东方学研究所；编者和责任编辑С.И.布柳姆亨。— 莫斯科：东方文献出版社，2007年。— 352页。— ISBN 5-02-018544-2（平装）。第71—82页。［在线原文书目信息误写会议届数，据出版社目录校正。］"}]}];

/* ============ Build sidebar TOC ============ */
const tocNav = document.getElementById('toc');
const groupTitles = {
  'frontmatter': '卷首 · Front Matter',
  'main': '正文 · Main Text',
  'back': '附录 · Back Matter'
};
const tocOrder = ["sec1","sec2"];

function tocLabel(s){ return {"sec1":["正文",""],"sec2":["参考文献",""]}[s.id]; }

let activeGroup = 'main';
tocOrder.forEach(id=>{
  const s = EN.find(x=>x.id===id);
  if(!s) return;
  const isFront = ['frontmatter'].includes(id);
  let label = tocLabel(s);
  const btn = document.createElement('button');
  btn.className = 'toc-item';
  if(isFront){
    btn.innerHTML = '<span>Front Matter · 卷首</span>';
  } else if(id==='notes'){
    btn.innerHTML = '<span>Notes · 注释</span>';
  } else if(id==='backmatter'){
    btn.innerHTML = '<span>Bibliography · 参考文献</span>';
  } else if(id==='introduction'){
    btn.innerHTML = '<span>Introduction · 导言</span>';
  } else if(id==='conclusion'){
    btn.innerHTML = '<span>Conclusion · 结语</span>';
  } else {
    if(typeof label==='object'){
      btn.innerHTML = `<span>${label[0]}</span><span class="sub">${label[1]}</span>`;
    } else {
      btn.innerHTML = `<span>${label}</span>`;
    }
  }
  // group separators
  if(id==='intro' || id==='notes'){
    const sep = document.createElement('div');
    sep.className='toc-sep';
    tocNav.appendChild(sep);
  }
  btn.addEventListener('click',()=>goTo(id));
  tocNav.appendChild(btn);
});

/* ============ Full-text search ============ */
function secTitle(id){
  const map={"sec1":"正文","sec2":"参考文献"};
  return map[id] || id;
}
// Build a search index once: for each section, for each para, keep en+zh text
let searchIndex = null;
function buildSearchIndex(){
  searchIndex = EN.map(sec=>{
    const zsec = ZH.find(x=>x.id===sec.id) || {paras:[]};
    const zhMap = {};
    zsec.paras.forEach((z,i)=>zhMap[i]=z&&z.text?z.text:'');
    const items = sec.paras.map((p,i)=>{
      const en = (typeof p==='object'?p.text:p)||'';
      const zh = zhMap[i]||'';
      return {i, en, zh, type:(typeof p==='object'?p.type:'text')};
    });
    return {id:sec.id, title:secTitle(sec.id), items};
  });
}
function countMatches(q, text){
  if(!q || !text) return 0;
  let c=0, idx=text.toLowerCase().indexOf(q.toLowerCase());
  while(idx!==-1){ c++; idx=text.toLowerCase().indexOf(q.toLowerCase(), idx+q.length); }
  return c;
}
function highlight(text, q){
  if(!q) return esc(text);
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  let out='', last=0, idx=lower.indexOf(ql);
  while(idx!==-1){
    out += esc(text.slice(last,idx)) + `<mark>${esc(text.slice(idx,idx+ql.length))}</mark>`;
    last = idx+ql.length;
    idx = lower.indexOf(ql, last);
  }
  out += esc(text.slice(last));
  return out;
}
function snippet(text, q, maxLen){
  maxLen = maxLen||120;
  if(!q) return (text.length>maxLen? text.slice(0,maxLen)+'…': text);
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  let pos = lower.indexOf(ql);
  if(pos===-1) pos = 0;
  else pos = Math.max(0, pos - maxLen/3);
  let s = text.slice(pos, pos+maxLen);
  return (pos>0?'…':'')+s+(pos+maxLen<text.length?'…':'');
}
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchTimer=null, searchOpen=false;
function closeSearch(onClicking){
  searchOpen=false;
  searchResults.classList.remove('open');
  if(!onClicking) searchInput.blur();
}
function runSearch(){
  const q = searchInput.value.trim();
  if(!q){ closeSearch(); return; }
  if(!searchIndex) buildSearchIndex();
  // gather matches across all sections, cap overall
  const MAX_TOTAL = 60, PER_SEC = 14;
  let results = [], total=0;
  for(const sec of searchIndex){
    if(total>=MAX_TOTAL) break;
    let hit={sec, items:[]};
    for(const it of sec.items){
      const cm = countMatches(q, it.en);
      const cz = countMatches(q, it.zh);
      if(cm||cz){ hit.items.push(it); }
      if(hit.items.length>=PER_SEC){ break; }
    }
    total += hit.items.length;
    if(hit.items.length) results.push(hit);
  }
  searchResults.innerHTML='';
  if(!results.length){
    searchResults.innerHTML = '<div class="sr-empty">未找到相关内容</div>';
  } else {
    const head=document.createElement('div');
    head.className='sr-head';
    head.textContent = `${total} 处匹配 · ${q}`;
    searchResults.appendChild(head);
    results.forEach((hit,k)=>{
      // section header row
      const sh=document.createElement('div');
      sh.className='sr-item';
      sh.style.cursor='default';
      sh.innerHTML = `<div class="sr-meta" style="font-size:11.5px;color:var(--accent);font-weight:600">▸ ${esc(hit.sec.title)}</div>`;
      searchResults.appendChild(sh);
      hit.items.forEach((it)=>{
        const row=document.createElement('div');
        row.className='sr-item';
        row.innerHTML =
          `<div class="sr-meta"><b>${esc(hit.sec.title)}</b> · 段 ${it.i+1}</div>` +
          `<div class="sr-text">${highlight(snippet(it.en,q),q)}</div>` +
          (it.zh?`<div class="sr-text" style="color:#6a6044">${highlight(snippet(it.zh,q),q)}</div>`:'');
        row.addEventListener('click',(ev)=>{ ev.stopPropagation(); openResult(hit.sec.id, it.i); });
        searchResults.appendChild(row);
      });
    });
  }
  searchResults.classList.add('open');
  searchOpen=true;
}
function openResult(sectionId, paraIdx){
  closeSearch(true);
  goTo(sectionId);
  // align both scroll containers to that paragraph (滚动定位，不加整段高亮)
  setTimeout(()=>{
    ['en','zh'].forEach(lang=>{
      const pair = colPair(lang);
      const top = paraScrollTop(pair, paraIdx);
      if(top !== null){
        pair.scroll.scrollTop = Math.max(0, top);
      }
    });
  }, 30);
}
searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(runSearch, 200);
});
searchInput.addEventListener('focus',()=>{ if(searchInput.value.trim()) runSearch(); });
document.addEventListener('click',(e)=>{ if(searchOpen && !e.target.closest('.search-box')) closeSearch(); });
searchInput.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ closeSearch(); } });

/* ============ Render ============ */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function paraHTML(p, lang){
  const t = p.text || '';
  const cls = p.type==='title' ? 'p title' : (p.type==='note' ? 'note' : 'p');
  return `<p class="${cls}" data-lang="${lang}">${t}</p>`;
}

let current = null;
function goTo(id){
  current = id;
  const enEl = document.getElementById('article-en');
  const zhEl = document.getElementById('article-zh');
  const sec = EN.find(x=>x.id===id);
  const zsec = ZH.find(x=>x.id===id) || {paras:[]};

  const zmap = {};
  zsec.paras.forEach((z,i)=>zmap[i]=z.text||'');

  // clear
  enEl.innerHTML=''; zhEl.innerHTML='';

  const titleMap={"sec1":"正文 · Текст","sec2":"参考文献 · Литература"};

  const h = document.createElement('div');
  h.innerHTML = `<p class="chapter-title">${titleMap[id]||sec.title}</p><p class="chapter-sub">${esc(sec.title)}</p>`;
  enEl.appendChild(h.cloneNode(true));
  zhEl.appendChild(h.cloneNode(true));

  sec.paras.forEach((p,i)=>{
    enEl.insertAdjacentHTML('beforeend', paraHTML(p,'en'));
    const zt = zmap[i];
    // Mirror structure in Chinese (same para index i, so the two columns always align 1:1)
    let zhHtml;
    if(p.type==='title'){
      zhHtml = `<p class="p title" data-lang="zh">${esc(zt||'')}</p>`;
    } else if(p.type==='note'){
      zhHtml = `<p class="note" data-lang="zh">${esc(zt||'')}</p>`;
    } else if(zt){
      zhHtml = `<p class="p" data-lang="zh">${esc(zt)}</p>`;
    } else {
      // Reference sections (Notes/Bibliography/Index) are citations & entries:
      // mirror the source text so the page reads complete (no blank placeholders)
      const mirror = (id==='notes' || id==='backmatter') ? (p.text||'') : '';
      if(mirror){
        zhHtml = `<p class="p" style="color:#3a3a3a" data-lang="zh">${esc(mirror)}</p>`;
      } else {
        zhHtml = `<p class="p" style="color:#b6b0a6" data-lang="zh">（尚未翻译）</p>`;
      }
    }
    // stamp the paragraph index so the paired column can jump to the exact spot
    zhHtml = zhHtml.replace('<p ', '<p data-i="'+i+'" ');
    zhEl.insertAdjacentHTML('beforeend', zhHtml);
    // stamp index on the just-inserted EN paragraph too
    const enP = enEl.lastElementChild;

  if(scZ) scZ.scrollTop = 0;
}
function labelOf(id){

}

/* ============ Scroll sync: scrolling one column precisely parks the
   other column on the SAME paragraph (matched by data-i) ============ */
// Pairs of (scroll container, content container) for each column.
// In the real layout the SCROLL container is the <section class="col">
// (overflow-y:auto); the <div id="article-*"> is just content inside it.
function colPair(lang){
  return {
    scroll: document.getElementById(lang==='en'?'scroll-en':'scroll-zh'),
    content: document.getElementById(lang==='en'?'article-en':'article-zh')
  };
}
// Height of the sticky column header (so a paragraph's first line isn't hidden under it).
function headerOff(pair){
  var h = pair.scroll.querySelector('.col-head');
  if(!h) return 0;
  try{
    var cs = getComputedStyle(h).position;
    if(cs==='sticky' || cs==='fixed') return h.offsetHeight;
  }catch(e){}
  return 0;
}
// Absolute top (in scroll pixels) of a paragraph within its scroll container.
function paraScrollTop(pair, i){
  var tgt = pair.content.querySelector('[data-i="'+i+'"]');
  if(!tgt) return null;
  var sRect = pair.scroll.getBoundingClientRect();
  var pRect = tgt.getBoundingClientRect();
  // Align the paragraph's FIRST LINE just below the sticky header (so it's visible),
  // instead of tucking it underneath and showing later lines.
  return (pRect.top - sRect.top) + pair.scroll.scrollTop - headerOff(pair);
}
// Index of the paragraph currently at the top area of the scroll container.
// 平滑滚动到目标列（用于句级对齐时把对侧滚到对应句所在段）。
var animActive = false;  // 是否正在播放平滑滚动动画
var animCancel = null;   // 取消动画的令牌
var SAVED_POS = null;    // last reading position (section + both scroll tops)

// Smoothly scroll a column to targetTop.
function smoothGoto(scrollEl, targetTop){
  var start = scrollEl.scrollTop;
  var delta = Math.max(0, targetTop) - start;
  if(Math.abs(delta) < 3){ return; }
  if(animCancel) animCancel.cancelled = true;
  var tok = {cancelled:false}; animCancel = tok;
  animActive = true;
  var dur = Math.min(280, 150 + Math.abs(delta)*0.05);
  var t0 = null;
  function step(ts){
    if(tok.cancelled){ animActive = false; return; }
    if(t0 === null) t0 = ts;
    var p = Math.min(1, (ts - t0)/dur);
    var ease = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
    scrollEl.scrollTop = start + delta*ease;
    if(p < 1){ requestAnimationFrame(step); }
    else { animActive = false; animCancel = null; }
  }
  requestAnimationFrame(step);
}
// 仅滚动目标列到该段（不加整段高亮），用于句级对齐时只突出对应句
function scrollToPara(otherLang, i){
  var other = colPair(otherLang);
  var top = paraScrollTop(other, i);
  if(top === null) return;
  smoothGoto(other.scroll, top);
}


/* ================= 笔记：选中画线 / 高亮 ================= */
var BOOK_KEY = 'readerhub_notes_bokshchanin-ming-historiography';

function articleFor(lang){ return document.getElementById(lang==='en'?'article-en':'article-zh'); }
function escText(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* 重新渲染一个段落的标记（textContent 是原始未标记文本，稳定） */

var TEMP = null;   // 当前本栏选中句 {lang,i,from,to}

/* 底层按句号切分一段文本（不用于展示，仅用于定位"选中的那一句"） */
function splitSentences(text){
  // 底层按句末标点切分（不用于展示）；支持中英文句末标点 + 紧随的引号/括号
  text=String(text);
  var list=[], start=0, i;
  function flush(end){ var t=text.slice(start,end); if(t){ list.push({start:start,end:end,text:t}); } start=end; }
  for(i=0;i<text.length;i++){
    var c=text[i];
    if('.!?；。！？…'.indexOf(c)>=0){
      var j=i+1;
      while(j<text.length && /[\"''””』」）)\]’”]/.test(text[j])) j++;
      flush(j); i=j-1;
    }
  }
  if(start<text.length) flush(text.length);
  return list;
}
var __SENT_CACHE = {};
function sentsFor(lang,i){
  var key=lang+':'+i;
  if(__SENT_CACHE[key]) return __SENT_CACHE[key];
  var el=articleFor(lang).querySelector('[data-i="'+i+'"]');
  var list = el ? splitSentences(el.textContent) : [];
  __SENT_CACHE[key]=list;
  return list;
}
function sentenceAt(lang, i, from){
  var list=sentsFor(lang,i);
  for(var k=0;k<list.length;k++){ if(from>=list[k].start && from<=list[k].end){ return list[k]; } }
  for(var j=list.length-1;j>=0;j--){ if(list[j].start<=from){ return list[j]; } }
  return list[0];
}

/* 清除所有临时句子高亮 + 跨语言对应高亮 */
function clearTempHL(){
  TEMP=null; PEER=null;
  var marks=document.querySelectorAll('.senthl,.peer-sent');
  for(var k=0;k<marks.length;k++){ var p=marks[k].closest('[data-i]'); if(p) renderMarks(p); }
}
function renderMarks(el){
  if(!el || el.getAttribute('data-i')==null) return;
  var lang=el.getAttribute('data-lang'), i=el.getAttribute('data-i');
  var list=NOTES.filter(function(n){return n.lang===lang && n.i===+i;})
                .sort(function(a,b){return a.from-b.from;});
  var text=el.textContent, html='', pos=0;
  list.forEach(function(n){
    var f=Math.max(pos,n.from), t=Math.min(text.length,n.to);
    if(f>pos) html+=escText(text.slice(pos,f));
    if(t>f){
      if(n.type==='hl') html+='<mark class="hlmark" style="background:'+n.color+'">'+escText(text.slice(f,t))+'</mark>';
      else html+='<u class="ulnote">'+escText(text.slice(f,t))+'</u>';
    }
    pos=Math.max(pos,t);
  });
  // 临时句子高亮（本栏选中句，可叠加在持久标记之上）
  if(TEMP && TEMP.lang===lang && TEMP.i===+i){
    var f=Math.max(pos,TEMP.from), t=Math.min(text.length,TEMP.to);
    if(f>pos) html+=escText(text.slice(pos,f));
    if(t>f) html+='<mark class="senthl">'+escText(text.slice(f,t))+'</mark>';
    pos=Math.max(pos,t);
  }
  // 跨语言对应句高亮（另一栏对齐到的那些句）
  if(PEER && PEER.lang===lang && PEER.i===+i){
    var pr=PEER.ranges.slice().sort(function(a,b){return a[0]-b[0];});
    pr.forEach(function(rg){
      var f=Math.max(pos,rg[0]), t=Math.min(text.length,rg[1]);
      if(f>pos) html+=escText(text.slice(pos,f));
      if(t>f) html+='<mark class="peer-sent">'+escText(text.slice(f,t))+'</mark>';
      pos=Math.max(pos,t);
    });
  }
  if(pos<text.length) html+=escText(text.slice(pos));
  el.innerHTML=html;
}
function renderAllMarks(){
  ['en','zh'].forEach(function(lang){
    var art=articleFor(lang);
    if(!art) return;
    var set={};
    NOTES.forEach(function(n){ if(n.lang===lang) set[n.i]=1; });
    for(var k in set){ var el=art.querySelector('[data-i="'+k+'"]'); if(el) renderMarks(el); }
  });
}

/* 点 (node,off) 在段落内的字符偏移（用 Range 计文本长度，自然兼容嵌套 mark） */
function pointOffsetInPara(para, node, off){
  try{
    var r=document.createRange();
    r.selectNodeContents(para);
    r.setEnd(node, off);
    return r.toString().length;
  }catch(e){ return 0; }
}

/* 从当前选区构建一条笔记；要求选区落在同一段内 */
function buildNote(){
  var sel=window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return null;
  var r=sel.getRangeAt(0);
  var root=r.commonAncestorContainer.nodeType===1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  var lang = root.closest('#article-en') ? 'en' : (root.closest('#article-zh') ? 'zh' : null);
  if(!lang) return null;
  var startPara=r.startContainer.nodeType===3 ? r.startContainer.parentElement : r.startContainer.closest('[data-i]');
  var endPara=r.endContainer.nodeType===3 ? r.endContainer.parentElement : r.endContainer.closest('[data-i]');
  if(!startPara || !endPara || startPara!==endPara) return null;
  var a=pointOffsetInPara(startPara, r.startContainer, r.startOffset);
  var b=pointOffsetInPara(endPara, r.endContainer, r.endOffset);
  var from=Math.min(a,b), to=Math.max(a,b);
  if(to-from<=0) return null;
  return {lang:lang, i:+startPara.getAttribute('data-i'), from:from, to:to,
          text:startPara.textContent.slice(from,to)};
}

/* 工具栏显隐 */
function moveNoteToolbar(){
  var sel=window.getSelection(), tb=document.getElementById('note-toolbar');
  if(!sel.rangeCount||sel.isCollapsed){ tb.style.display='none'; return; }
  var r=sel.getRangeAt(0), rect=r.getBoundingClientRect();
  tb.style.left=Math.max(8, Math.min(window.innerWidth-tb.offsetWidth-8, rect.left+rect.width/2-tb.offsetWidth/2))+'px';
  tb.style.top=Math.max(8, rect.top-tb.offsetHeight-10)+'px';
  tb.style.display='flex';
}

function bindToolbar(){

function copySelection(){
  var sel=window.getSelection();
  var txt = (sel && !sel.isCollapsed) ? sel.toString()
          : (TEMP ? currentSentenceText() : '');
  if(!txt){ showToast('没有可复制的内容'); return; }
  var ok=false;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ showToast('已复制 '+txt.length+' 字'); },
      function(){ fallbackCopy(txt); });
    ok=true;
  } else { fallbackCopy(txt); }
  if(ok) window.getSelection().removeAllRanges();
  hideToolbar();
}
function currentSentenceText(){
  if(!TEMP) return '';

function fallbackCopy(txt){
  try{
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('已复制 '+txt.length+' 字');
  }catch(e){ showToast('复制失败'); }
}

function applyNote(type,color){
  var note=buildNote();
  window.getSelection().removeAllRanges();
  hideToolbar();
  if(!note){ showToast('请在同一段内选择文字'); return; }
  if(type==='ul'){ note.type='ul'; note.color=null; }
  else { note.type='hl'; note.color=color||HL_COLORS[0].hex; }
  var idx=findNoteIndex(note);
  if(idx>=0) NOTES.splice(idx,1);
  NOTES.push(note);
  saveNotes();
  var el=articleFor(note.lang).querySelector('[data-i="'+note.i+'"]');
  if(el) renderMarks(el);
  showToast((type==='ul'?'已划线':'已高亮'+(colorName(note.color)||''))+'，已保存到笔记');
  refreshPanel();
}
function findNoteIndex(n){
  for(var i=0;i<NOTES.length;i++){ var x=NOTES[i];
    if(x.lang===n.lang&&x.i===n.i&&x.from===n.from&&x.to===n.to) return i; }
  return -1;
}
function colorName(hex){ var r=''; HL_COLORS.forEach(function(c){ if(c.hex===hex) r=c.name; }); return r; }
function noteText(n){
  var el=articleFor(n.lang).querySelector('[data-i="'+n.i+'"]');
  return el? el.textContent.slice(n.from,n.to) : '';
}

function sentIdxAt(offs, pos){
  if(!offs) return -1;
  for(var k=0;k<offs.length;k++){ if(pos>=offs[k][0] && pos<=offs[k][1]) return k; }
  for(var j=offs.length-1;j>=0;j--){ if(offs[j][0]<=pos) return j; }

}
function writeStoredPos(){
  if(!current) return;
  var scE = document.getElementById('scroll-en');
  var scZ = document.getElementById('scroll-zh');
  try{
    localStorage.setItem(POS_KEY, JSON.stringify({

  function getCollapsed(){
    try{ return localStorage.getItem(KEY) === '1'; }catch(e){ return false; }
  }
  function setCollapsed(v){
    app.classList.toggle('sidebar-collapsed', !!v);
    try{ localStorage.setItem(KEY, v ? '1' : '0'); }catch(e){}
    var btn = document.getElementById('sidebar-toggle');
    if(btn){
      btn.innerHTML = v ? '&#10095;' : '&#10094;';   // 折叠时 ›（展开），展开时 ‹（收起）
      btn.setAttribute('aria-expanded', String(!v));
    }
  }
  // 初始
  setCollapsed(getCollapsed());
  var btn = document.getElementById('sidebar-toggle');
  if(btn){
    btn.addEventListener('click', function(e){ e.stopPropagation(); setCollapsed(!app.classList.contains('sidebar-collapsed')); });
  }
  // 快捷键：反斜杠 \  切换
  document.addEventListener('keydown', function(e){
    if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
    if(e.key === '\\' || e.key === '|'){ setCollapsed(!app.classList.contains('sidebar-collapsed')); }
  });
})();

  function topAnchorGi(scrollEl, contentEl){
    var y = scrollEl.scrollTop + headerOff(scrollEl) + 8;

    if(!ps.length) return null;
    var best = null;
    // 二分查找最后一个 offsetTop <= y 的段落
    var lo = 0, hi = ps.length - 1;
    while(lo <= hi){

                   .sort(function(a,b){ return a.from-b.from; });

      if(f>pos) html += escText(text.slice(pos,f));
