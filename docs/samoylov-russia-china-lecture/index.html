let activeGroup = 'main';
tocOrder.forEach(id=>{
  const s = EN.find(x=>x.id===id);
  if(!s) return;
  const isFront = ['frontmatter'].includes(id);
  let label = tocLabel(s);
  const btn = document.createElement('button');
  btn.className = 'toc-item';
  if(isFront){
    btn.innerHTML = '<span>Front Matter · 卷首</span>';
  } else if(id==='notes'){
    btn.innerHTML = '<span>Notes · 注释</span>';
  } else if(id==='backmatter'){
    btn.innerHTML = '<span>Bibliography · 参考文献</span>';
  } else if(id==='introduction'){
    btn.innerHTML = '<span>Introduction · 导言</span>';
  } else if(id==='conclusion'){
    btn.innerHTML = '<span>Conclusion · 结语</span>';
  } else {
    if(typeof label==='object'){
      btn.innerHTML = `<span>${label[0]}</span><span class="sub">${label[1]}</span>`;
    } else {
      btn.innerHTML = `<span>${label}</span>`;
    }
  }
  // group separators
  if(id==='intro' || id==='notes'){
    const sep = document.createElement('div');
    sep.className='toc-sep';
    tocNav.appendChild(sep);
  }
  btn.addEventListener('click',()=>goTo(id));
  tocNav.appendChild(btn);
});

/* ============ Full-text search ============ */
function secTitle(id){
  const map = {
    "peter": "彼得一世与俄国汉学的开端",
    "kyakhta": "恰克图贸易",
    "mission": "俄国驻北京传教团",
    "chinoiserie": "俄国版「中国风」",
    "tea": "茶",
    "perlov": "佩尔洛夫——俄国的「茶王」",
    "crossyears": "中俄「主题年」" };
  return map[id] || id;
}
// Build a search index once: for each section, for each para, keep en+zh text
let searchIndex = null;
function buildSearchIndex(){
  searchIndex = EN.map(sec=>{
    const zsec = ZH.find(x=>x.id===sec.id) || {paras:[]};
    const zhMap = {};
    zsec.paras.forEach((z,i)=>zhMap[i]=z&&z.text?z.text:'');
    const items = sec.paras.map((p,i)=>{
      const en = (typeof p==='object'?p.text:p)||'';
      const zh = zhMap[i]||'';
      return {i, en, zh, type:(typeof p==='object'?p.type:'text')};
    });
    return {id:sec.id, title:secTitle(sec.id), items};
  });
}
function countMatches(q, text){
  if(!q || !text) return 0;
  let c=0, idx=text.toLowerCase().indexOf(q.toLowerCase());
  while(idx!==-1){ c++; idx=text.toLowerCase().indexOf(q.toLowerCase(), idx+q.length); }
  return c;
}
function highlight(text, q){
  if(!q) return esc(text);
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  let out='', last=0, idx=lower.indexOf(ql);
  while(idx!==-1){
    out += esc(text.slice(last,idx)) + `<mark>${esc(text.slice(idx,idx+ql.length))}</mark>`;
    last = idx+ql.length;
    idx = lower.indexOf(ql, last);
  }
  out += esc(text.slice(last));
  return out;
}
function snippet(text, q, maxLen){
  maxLen = maxLen||120;
  if(!q) return (text.length>maxLen? text.slice(0,maxLen)+'…': text);
  const lower=text.toLowerCase(), ql=q.toLowerCase();
  let pos = lower.indexOf(ql);
  if(pos===-1) pos = 0;
  else pos = Math.max(0, pos - maxLen/3);
  let s = text.slice(pos, pos+maxLen);
  return (pos>0?'…':'')+s+(pos+maxLen<text.length?'…':'');
}
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchTimer=null, searchOpen=false;
function closeSearch(onClicking){
  searchOpen=false;
  searchResults.classList.remove('open');
  if(!onClicking) searchInput.blur();
}
function runSearch(){
  const q = searchInput.value.trim();
  if(!q){ closeSearch(); return; }
  if(!searchIndex) buildSearchIndex();
  // gather matches across all sections, cap overall
  const MAX_TOTAL = 60, PER_SEC = 14;
  let results = [], total=0;
  for(const sec of searchIndex){
    if(total>=MAX_TOTAL) break;
    let hit={sec, items:[]};
    for(const it of sec.items){
      const cm = countMatches(q, it.en);
      const cz = countMatches(q, it.zh);
      if(cm||cz){ hit.items.push(it); }
      if(hit.items.length>=PER_SEC){ break; }
    }
    total += hit.items.length;
    if(hit.items.length) results.push(hit);
  }
  searchResults.innerHTML='';
  if(!results.length){
    searchResults.innerHTML = '<div class="sr-empty">未找到相关内容</div>';
  } else {
    const head=document.createElement('div');
    head.className='sr-head';
    head.textContent = `${total} 处匹配 · ${q}`;
    searchResults.appendChild(head);
    results.forEach((hit,k)=>{
      // section header row
      const sh=document.createElement('div');
      sh.className='sr-item';
      sh.style.cursor='default';
      sh.innerHTML = `<div class="sr-meta" style="font-size:11.5px;color:var(--accent);font-weight:600">▸ ${esc(hit.sec.title)}</div>`;
      searchResults.appendChild(sh);
      hit.items.forEach((it)=>{
        const row=document.createElement('div');
        row.className='sr-item';
        row.innerHTML =
          `<div class="sr-meta"><b>${esc(hit.sec.title)}</b> · 段 ${it.i+1}</div>` +
          `<div class="sr-text">${highlight(snippet(it.en,q),q)}</div>` +
          (it.zh?`<div class="sr-text" style="color:#6a6044">${highlight(snippet(it.zh,q),q)}</div>`:'');
        row.addEventListener('click',(ev)=>{ ev.stopPropagation(); openResult(hit.sec.id, it.i); });
        searchResults.appendChild(row);
      });
    });
  }
  searchResults.classList.add('open');
  searchOpen=true;
}
function openResult(sectionId, paraIdx){
  closeSearch(true);
  goTo(sectionId);
  // align both scroll containers to that paragraph (滚动定位，不加整段高亮)
  setTimeout(()=>{
    ['en','zh'].forEach(lang=>{
      const pair = colPair(lang);
      const top = paraScrollTop(pair, paraIdx);
      if(top !== null){
        pair.scroll.scrollTop = Math.max(0, top);
      }
    });
  }, 30);
}
searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(runSearch, 200);
});
searchInput.addEventListener('focus',()=>{ if(searchInput.value.trim()) runSearch(); });
document.addEventListener('click',(e)=>{ if(searchOpen && !e.target.closest('.search-box')) closeSearch(); });
searchInput.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ closeSearch(); } });

/* ============ Render ============ */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function paraHTML(p, lang){
  const t = p.text || '';
  const cls = p.type==='title' ? 'p title' : (p.type==='note' ? 'note' : 'p');
  return `<p class="${cls}" data-lang="${lang}">${t}</p>`;
}

let current = null;
function goTo(id){
  current = id;
  const enEl = document.getElementById('article-en');
  const zhEl = document.getElementById('article-zh');
  const sec = EN.find(x=>x.id===id);
  const zsec = ZH.find(x=>x.id===id) || {paras:[]};

  const zmap = {};
  zsec.paras.forEach((z,i)=>zmap[i]=z.text||'');

  // clear
  enEl.innerHTML=''; zhEl.innerHTML='';

  const titleMap={
    "peter": "彼得一世与俄国汉学的开端 · Peter I & the Beginning of Chinese Studies in Russia",
    "kyakhta": "恰克图贸易 · The Kyakhta Trade",
    "mission": "俄国驻北京传教团 · The Russian Ecclesiastical Mission in Beijing",
    "chinoiserie": "俄国版「中国风」 · The Russian Version of Chinoiserie",
    "tea": "茶 · Tea",
    "perlov": "佩尔洛夫——俄国的「茶王」 · The Perlovs, \"Tea Kings\" of Russia",
    "crossyears": "中俄「主题年」 · Russia–China Cross Years" };

  // Section title
  const h = document.createElement('div');
  h.innerHTML = `<p class="chapter-title">${titleMap[id]||sec.title}</p><p class="chapter-sub">${esc(sec.title)}</p>`;
  enEl.appendChild(h.cloneNode(true));
  zhEl.appendChild(h.cloneNode(true));

  sec.paras.forEach((p,i)=>{
    enEl.insertAdjacentHTML('beforeend', paraHTML(p,'en'));
    const zt = zmap[i];
    // Mirror structure in Chinese (same para index i, so the two columns always align 1:1)
    let zhHtml;
    if(p.type==='title'){
      zhHtml = `<p class="p title" data-lang="zh">${esc(zt||'')}</p>`;
    } else if(p.type==='note'){
      zhHtml = `<p class="note" data-lang="zh">${esc(zt||'')}</p>`;
    } else if(zt){
      zhHtml = `<p class="p" data-lang="zh">${esc(zt)}</p>`;
    } else {
      // Reference sections (Notes/Bibliography/Index) are citations & entries:
      // mirror the source text so the page reads complete (no blank placeholders)
      const mirror = (id==='notes' || id==='backmatter') ? (p.text||'') : '';
      if(mirror){
        zhHtml = `<p class="p" style="color:#3a3a3a" data-lang="zh">${esc(mirror)}</p>`;
      } else {
        zhHtml = `<p class="p" style="color:#b6b0a6" data-lang="zh">（尚未翻译）</p>`;
      }
    }
    // stamp the paragraph index so the paired column can jump to the exact spot
    zhHtml = zhHtml.replace('<p ', '<p data-i="'+i+'" ');
    zhEl.insertAdjacentHTML('beforeend', zhHtml);
    // stamp index on the just-inserted EN paragraph too
    const enP = enEl.lastElementChild;
    if(enP) enP.setAttribute('data-i', i);
  });

  // active state
  document.querySelectorAll('.toc-item').forEach(el=>{
    el.classList.toggle('active', el.textContent.includes(labelOf(id)));
  });
  var scE = document.getElementById('scroll-en');
  var scZ = document.getElementById('scroll-zh');
  if(scE) scE.scrollTop = 0;
  if(scZ) scZ.scrollTop = 0;
}
function labelOf(id){
  const s = EN.find(x=>x.id===id);
  return s? s.title : id;
}

/* ============ Scroll sync: scrolling one column precisely parks the
   other column on the SAME paragraph (matched by data-i) ============ */
// Pairs of (scroll container, content container) for each column.
// In the real layout the SCROLL container is the <section class="col">
// (overflow-y:auto); the <div id="article-*"> is just content inside it.
function colPair(lang){
  return {
    scroll: document.getElementById(lang==='en'?'scroll-en':'scroll-zh'),
    content: document.getElementById(lang==='en'?'article-en':'article-zh')
  };
}
// Height of the sticky column header (so a paragraph's first line isn't hidden under it).
function headerOff(pair){
  var h = pair.scroll.querySelector('.col-head');
  if(!h) return 0;
  try{
    var cs = getComputedStyle(h).position;
    if(cs==='sticky' || cs==='fixed') return h.offsetHeight;
  }catch(e){}
  return 0;
}
// Absolute top (in scroll pixels) of a paragraph within its scroll container.
function paraScrollTop(pair, i){
  var tgt = pair.content.querySelector('[data-i="'+i+'"]');
  if(!tgt) return null;
  var sRect = pair.scroll.getBoundingClientRect();
  var pRect = tgt.getBoundingClientRect();
  // Align the paragraph's FIRST LINE just below the sticky header (so it's visible),
  // instead of tucking it underneath and showing later lines.
  return (pRect.top - sRect.top) + pair.scroll.scrollTop - headerOff(pair);
}
// Index of the paragraph currently at the top area of the scroll container.
// 平滑滚动到目标列（用于句级对齐时把对侧滚到对应句所在段）。
var animActive = false;  // 是否正在播放平滑滚动动画
var animCancel = null;   // 取消动画的令牌
var SAVED_POS = null;    // last reading position (section + both scroll tops)

// Smoothly scroll a column to targetTop.
function smoothGoto(scrollEl, targetTop){
  var start = scrollEl.scrollTop;
  var delta = Math.max(0, targetTop) - start;
  if(Math.abs(delta) < 3){ return; }
  if(animCancel) animCancel.cancelled = true;
  var tok = {cancelled:false}; animCancel = tok;
  animActive = true;
  var dur = Math.min(280, 150 + Math.abs(delta)*0.05);
  var t0 = null;
  function step(ts){
    if(tok.cancelled){ animActive = false; return; }
    if(t0 === null) t0 = ts;
    var p = Math.min(1, (ts - t0)/dur);
    var ease = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
    scrollEl.scrollTop = start + delta*ease;
    if(p < 1){ requestAnimationFrame(step); }
    else { animActive = false; animCancel = null; }
  }
  requestAnimationFrame(step);
}
// 仅滚动目标列到该段（不加整段高亮），用于句级对齐时只突出对应句
function scrollToPara(otherLang, i){
  var other = colPair(otherLang);
  var top = paraScrollTop(other, i);
  if(top === null) return;
  smoothGoto(other.scroll, top);
}


/* ================= 笔记：选中画线 / 高亮 ================= */
var BOOK_KEY = 'readerhub_notes_samoylov-russia-china-lecture';
var HL_COLORS = [
  {name:'黄',hex:'#ffe58a'},
  {name:'青',hex:'#a9e9ee'},
  {name:'粉',hex:'#ffc0cb'},
  {name:'绿',hex:'#b8e8ae'},
  {name:'橙',hex:'#ffd9a8'}
];
var NOTES = loadNotes();
function loadNotes(){ try{ return JSON.parse(localStorage.getItem(BOOK_KEY))||[]; }catch(e){ return []; } }
function saveNotes(){ try{ localStorage.setItem(BOOK_KEY, JSON.stringify(NOTES)); }catch(e){ showToast('笔记保存失败'); } }
function articleFor(lang){ return document.getElementById(lang==='en'?'article-en':'article-zh'); }
function escText(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* 重新渲染一个段落的标记（textContent 是原始未标记文本，稳定） */

var TEMP = null;   // 当前本栏选中句 {lang,i,from,to}
var PEER = null;   // 当前跨语言对应句高亮 {lang,i,ranges:[[s,e],...]}

/* 底层按句号切分一段文本（不用于展示，仅用于定位"选中的那一句"） */
function splitSentences(text){
  // 底层按句末标点切分（不用于展示）；支持中英文句末标点 + 紧随的引号/括号
  text=String(text);
  var list=[], start=0, i;
  function flush(end){ var t=text.slice(start,end); if(t){ list.push({start:start,end:end,text:t}); } start=end; }
  for(i=0;i<text.length;i++){
    var c=text[i];
    if('.!?；。！？…'.indexOf(c)>=0){
      var j=i+1;
      while(j<text.length && /[\"''””』」）)\]’”]/.test(text[j])) j++;
      flush(j); i=j-1;
    }
  }
  if(start<text.length) flush(text.length);
  return list;
}
var __SENT_CACHE = {};
function sentsFor(lang,i){
  var key=lang+':'+i;
  if(__SENT_CACHE[key]) return __SENT_CACHE[key];
  var el=articleFor(lang).querySelector('[data-i="'+i+'"]');
  var list = el ? splitSentences(el.textContent) : [];
  __SENT_CACHE[key]=list;
  return list;
}
function sentenceAt(lang, i, from){
  var list=sentsFor(lang,i);
  for(var k=0;k<list.length;k++){ if(from>=list[k].start && from<=list[k].end){ return list[k]; } }
  for(var j=list.length-1;j>=0;j--){ if(list[j].start<=from){ return list[j]; } }
  return list[0];
}

/* 清除所有临时句子高亮 + 跨语言对应高亮 */
function clearTempHL(){
  TEMP=null; PEER=null;
  var marks=document.querySelectorAll('.senthl,.peer-sent');
  for(var k=0;k<marks.length;k++){ var p=marks[k].closest('[data-i]'); if(p) renderMarks(p); }
}
function renderMarks(el){
  if(!el || el.getAttribute('data-i')==null) return;
  var lang=el.getAttribute('data-lang'), i=el.getAttribute('data-i');
  var list=NOTES.filter(function(n){return n.lang===lang && n.i===+i;})
                .sort(function(a,b){return a.from-b.from;});
  var text=el.textContent, html='', pos=0;
  list.forEach(function(n){
    var f=Math.max(pos,n.from), t=Math.min(text.length,n.to);
    if(f>pos) html+=escText(text.slice(pos,f));
    if(t>f){
      if(n.type==='hl') html+='<mark class="hlmark" style="background:'+n.color+'">'+escText(text.slice(f,t))+'</mark>';
      else html+='<u class="ulnote">'+escText(text.slice(f,t))+'</u>';
    }
    pos=Math.max(pos,t);
  });
  // 临时句子高亮（本栏选中句，可叠加在持久标记之上）
  if(TEMP && TEMP.lang===lang && TEMP.i===+i){
    var f=Math.max(pos,TEMP.from), t=Math.min(text.length,TEMP.to);
    if(f>pos) html+=escText(text.slice(pos,f));
    if(t>f) html+='<mark class="senthl">'+escText(text.slice(f,t))+'</mark>';
    pos=Math.max(pos,t);
  }
  // 跨语言对应句高亮（另一栏对齐到的那些句）
  if(PEER && PEER.lang===lang && PEER.i===+i){
    var pr=PEER.ranges.slice().sort(function(a,b){return a[0]-b[0];});
    pr.forEach(function(rg){
      var f=Math.max(pos,rg[0]), t=Math.min(text.length,rg[1]);
      if(f>pos) html+=escText(text.slice(pos,f));
      if(t>f) html+='<mark class="peer-sent">'+escText(text.slice(f,t))+'</mark>';
      pos=Math.max(pos,t);
    });
  }
  if(pos<text.length) html+=escText(text.slice(pos));
  el.innerHTML=html;
}
function renderAllMarks(){
  ['en','zh'].forEach(function(lang){
    var art=articleFor(lang);
    if(!art) return;
    var set={};
    NOTES.forEach(function(n){ if(n.lang===lang) set[n.i]=1; });
    for(var k in set){ var el=art.querySelector('[data-i="'+k+'"]'); if(el) renderMarks(el); }
  });
}

/* 点 (node,off) 在段落内的字符偏移（用 Range 计文本长度，自然兼容嵌套 mark） */
function pointOffsetInPara(para, node, off){
  try{
    var r=document.createRange();
    r.selectNodeContents(para);
    r.setEnd(node, off);
    return r.toString().length;
  }catch(e){ return 0; }
}

/* 从当前选区构建一条笔记；要求选区落在同一段内 */
function buildNote(){
  var sel=window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return null;
  var r=sel.getRangeAt(0);
  var root=r.commonAncestorContainer.nodeType===1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  var lang = root.closest('#article-en') ? 'en' : (root.closest('#article-zh') ? 'zh' : null);
  if(!lang) return null;
  var startPara=r.startContainer.nodeType===3 ? r.startContainer.parentElement : r.startContainer.closest('[data-i]');
  var endPara=r.endContainer.nodeType===3 ? r.endContainer.parentElement : r.endContainer.closest('[data-i]');
  if(!startPara || !endPara || startPara!==endPara) return null;
  var a=pointOffsetInPara(startPara, r.startContainer, r.startOffset);
  var b=pointOffsetInPara(endPara, r.endContainer, r.endOffset);
  var from=Math.min(a,b), to=Math.max(a,b);
  if(to-from<=0) return null;
  return {lang:lang, i:+startPara.getAttribute('data-i'), from:from, to:to,
          text:startPara.textContent.slice(from,to)};
}

/* 工具栏显隐 */
function moveNoteToolbar(){
  var sel=window.getSelection(), tb=document.getElementById('note-toolbar');
  if(!sel.rangeCount||sel.isCollapsed){ tb.style.display='none'; return; }
  var r=sel.getRangeAt(0), rect=r.getBoundingClientRect();
  tb.style.left=Math.max(8, Math.min(window.innerWidth-tb.offsetWidth-8, rect.left+rect.width/2-tb.offsetWidth/2))+'px';
  tb.style.top=Math.max(8, rect.top-tb.offsetHeight-10)+'px';
  tb.style.display='flex';
}
function hideToolbar(){ var tb=document.getElementById('note-toolbar'); if(tb) tb.style.display='none'; }

function bindToolbar(){
  var tb=document.getElementById('note-toolbar');
  HL_COLORS.forEach(function(c){
    var b=document.createElement('span');
    b.title='高亮·'+c.name; b.className='nt hlc'; b.style.background=c.hex;
    (function(hex){ b.onmousedown=function(ev){ ev.preventDefault(); applyNote('hl',hex); }; })(c.hex);
    tb.appendChild(b);
  });
  var ul=document.createElement('span');
  ul.title='画线'; ul.textContent='划线'; ul.className='nt ul';
  ul.onmousedown=function(ev){ ev.preventDefault(); applyNote('ul',null); };
  tb.appendChild(ul);
  var cp=document.createElement('span');
  cp.title='复制选中内容'; cp.textContent='复制'; cp.className='nt cpy';
  cp.onmousedown=function(ev){ ev.preventDefault(); copySelection(); };
  tb.appendChild(cp);
}
function copySelection(){
  var sel=window.getSelection();
  var txt = (sel && !sel.isCollapsed) ? sel.toString()
          : (TEMP ? currentSentenceText() : '');
  if(!txt){ showToast('没有可复制的内容'); return; }
  var ok=false;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ showToast('已复制 '+txt.length+' 字'); },
      function(){ fallbackCopy(txt); });
    ok=true;
  } else { fallbackCopy(txt); }
  if(ok) window.getSelection().removeAllRanges();
  hideToolbar();
}
function currentSentenceText(){
  if(!TEMP) return '';
  var el=articleFor(TEMP.lang).querySelector('[data-i="'+TEMP.i+'"]');
  return el ? el.textContent.slice(TEMP.from,TEMP.to) : '';
}
function fallbackCopy(txt){
  try{
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('已复制 '+txt.length+' 字');
  }catch(e){ showToast('复制失败'); }
}

function applyNote(type,color){
  var note=buildNote();
  window.getSelection().removeAllRanges();
  hideToolbar();
  if(!note){ showToast('请在同一段内选择文字'); return; }
  if(type==='ul'){ note.type='ul'; note.color=null; }
  else { note.type='hl'; note.color=color||HL_COLORS[0].hex; }
  var idx=findNoteIndex(note);
  if(idx>=0) NOTES.splice(idx,1);
  NOTES.push(note);
  saveNotes();
  var el=articleFor(note.lang).querySelector('[data-i="'+note.i+'"]');
  if(el) renderMarks(el);
  showToast((type==='ul'?'已划线':'已高亮'+(colorName(note.color)||''))+'，已保存到笔记');
  refreshPanel();
}
function findNoteIndex(n){
  for(var i=0;i<NOTES.length;i++){ var x=NOTES[i];
    if(x.lang===n.lang&&x.i===n.i&&x.from===n.from&&x.to===n.to) return i; }
  return -1;
}
function colorName(hex){ var r=''; HL_COLORS.forEach(function(c){ if(c.hex===hex) r=c.name; }); return r; }
function noteText(n){
  var el=articleFor(n.lang).querySelector('[data-i="'+n.i+'"]');
  return el? el.textContent.slice(n.from,n.to) : '';
}

/* 笔记面板 */
function togglePanel(){
  var p=document.getElementById('note-panel');
  p.classList.toggle('np-open');
  if(p.classList.contains('np-open')) refreshPanel();
}
function refreshPanel(){
  var p=document.getElementById('note-panel');
  var html='<div class="np-head"><b>📝 我的笔记 ('+NOTES.length+')</b><span>';
  html+='<button id="np-clear" style="color:#c0392b">清除全部</button> <button id="np-close" style="color:var(--accent)">关闭</button></span></div>';
  if(!NOTES.length) html+='<div class="np-empty">还没有笔记。<br>在正文里选中文字，即可「高亮」或「划线」。</div>';
  else{
    var shown={};
    for(var i=NOTES.length-1;i>=0;i--){
      var n=NOTES[i];
      var key=n.lang+':'+n.i;
      shown[key]=(shown[key]||0)+1;
      if(shown[key]>1) continue;           // 同一段只列一条（可合并）
      var t=noteText(n)||'…';
      var lang=n.lang==='en'?'英':'中';
      var mark=n.type==='hl'
        ? '<span style="background:'+n.color+'">&nbsp;&nbsp;&nbsp;</span>'
        : '<span style="text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#e8504a">&nbsp;&nbsp;&nbsp;</span>';
      html+='<div class="np-item" data-lang="'+n.lang+'" data-i="'+n.i+'">'
           +'<div class="np-meta"><b>段 '+n.i+'</b><span style="color:var(--mute)">'+lang+'</span>'+mark
           +(n.type==='ul'?'<span style="font-size:10px;color:#888">划线</span>':'<span style="font-size:10px;color:#888">高亮</span>')
           +'</div><div class="np-text">'+escText(t)+'</div></div>';
    }
  }
  p.innerHTML=html;
}
function clearAllNotes(){
  var b=document.createElement('button');
  b.style.cssText='background:none;border:none;color:#c0392b;cursor:pointer;font-size:13px;padding:2px 6px';
  b.textContent='确认全部清除？'; b.id='np-clear-act';
  b.onclick=function(){
    NOTES=[]; saveNotes(); renderAllMarks(); refreshPanel(); showToast('已清除全部笔记');
  };
