/* ============ BOOK DATA (injected by build) ============ */
const EN = /*__EN__*/[{"id": "peter", "title": "Пётр I и начало изучения Китая в России", "paras": [{"type": "text", "text": "Петр Первый организовал в Санкт-Петербурге Академию наук и университет, а также первый музей в России – Кунсткамеру. Он положил начало научному изучению Китая и китайского языка в России (указ 1700 года о преподавании китайского языка). По его инициативе были созданы китайские кабинеты во дворце Монплезир и в Большом Петергофском дворце. В петровское время китайское искусство и «китайский стиль» стали очень популярны в Петербурге. Предметы китайского искусства коллекционировали не только Петр Первый, но и его сподвижники: Меншиков, Апраксин и др. С расширением русско-китайской торговли в Россию попадало все больше китайских вещей."}]}, {"id": "kyakhta", "title": "Кяхтинская торговля", "paras": [{"type": "text", "text": "Этому способствовало подписание Кяхтинского договора и начало кяхтинской торговли чаем и другими товарами. Кяхтинская торговля, достигшая своего расцвета в середине XVIII – первой половине XIX века, сыграла колоссальную роль в распространении китайского искусства и эстетики в России. В отличие от стран Западной Европы, доставлявших восточные товары исключительно морским путем, Россия обладала уникальным сухопутным коридором — Великим чайным путем, ключевым узлом которого стала пограничная торговая слобода Кяхта. Через это легальное «окно» в Российскую империю непрерывно поступали подлинные шедевры китайских мастеров: фарфор, лаковые изделия, расписные веера, элитные шелка и свитки. Прямой импорт аутентичных вещей заложил основу для формирования знаменитых восточных коллекций в интерьерах русских императорских резиденций, таких как Монплезир, Ораниенбаум и Царское Село."}, {"type": "text", "text": "Регулярность и доступность кяхтинских поставок стали мощным катализатором моды на стиль «шинуазри» (китайщину) среди отечественной аристократии. Это увлечение вышло далеко за рамки коллекционирования: русские архитекторы, художники и ремесленники начали создавать собственные самобытные стилизации. Выдающимся примером этого влияния стал Китайский дворец Антонио Ринальди в Ораниенбауме, а Императорский фарфоровый завод стал регулярно выпускать изделия с восточными мотивами. При этом сухопутный характер торговли обеспечил уникальный для Европы эффект — постепенную демократизацию китайского стиля. Недорогая посуда, ткани и предметы быта проникали в среду сибирского купечества, горожан и зажиточного крестьянства, постепенно интегрируя восточные орнаменты в народные промыслы и городской костюм."}, {"type": "text", "text": "Кяхтинская торговля, достигшая своего расцвета в середине XVIII – первой половине XIX века, сыграла колоссальную роль в распространении китайского искусства и эстетики в России. В отличие от стран Западной Европы, доставлявших восточные товары исключительно морским путем, Россия обладала уникальным сухопутным коридором — Великим чайным путем, ключевым узлом которого стала пограничная торговая слобода Кяхта."}, {"type": "text", "text": "Долгие годы торговля здесь носила исключительно беспошлинный бартерный характер. Из России китайские купцы охотно выменивали сибирскую пушнину (соболя, песца, лисицу, белку), которая составляла основу отечественного экспорта, а также юфть (высококачественную выделанную кожу), сукно и металлические изделия. В обмен на это в Российскую империю непрерывно поступал широчайший ассортимент уникальных товаров из империи Цин."}, {"type": "text", "text": "Главным коммерческим товаром Кяхты являлся китайский чай — как дорогой рассыпной байховый, так и прессованный кирпичный. Но помимо чая, купцы везли огромное количество предметов декоративно-прикладного искусства, текстиля и диковинок. Купеческие обозы доставляли в Россию изысканный шелк-сырец, сученый шелк, бархат и прочную хлопчатобумажную ткань «китайку». Вместе с тканями границу пересекали подлинные шедевры китайских мастеров: тончайший фарфор, глиняная посуда, лаковые шкатулки, расписные веера и ширмы. На российских рынках также появлялись экзотический сахар-леденец, восточные пряности (например, бадьян), табак, китайская тушь для каллиграфии, благовония."}, {"type": "text", "text": "Регулярность и доступность кяхтинских поставок стали мощным катализатором моды на стиль «шинуазри» (китайщину) среди отечественной аристократии. Это увлечение вышло далеко за рамки коллекционирования: русские архитекторы, художники и ремесленники начали создавать собственные самобытные стилизации. Выдающимся примером этого влияния стал Китайский дворец Антонио Ринальди в Ораниенбауме, а Императорский фарфоровый завод стал регулярно выпускать изделия с восточными мотивами."}, {"type": "text", "text": "Важнейшим аспектом кяхтинской торговли стало формирование уникальной «чайной эстетики». Удерживая монополию на поставку китайского чая, Кяхта фактически подарила России культуру чаепития. Это, в свою очередь, сформировало колоссальный спрос на сопутствующее прикладное искусство — от росписи фарфоровых чайных сервисов до появления знаменитых сюжетов в русской жанровой живописи, воспевающих купеческие чаепития."}, {"type": "text", "text": "Соседство двух небольших городов: русской Кяхты и китайского Маймайчэна способствовало развитию прямых контактов русских и китайских купцов и культурному обмену. Там даже сложился особый язык общения – кяхтинский (маймайчэнский) говор, где русские слова были перемешаны с китайскими."}, {"type": "text", "text": "Кяхта и Маймайчэн на протяжении почти двух столетий представляли собой своеобразное двуединство, симбиоз элементов русской и китайской культур. Петер Симон Паллас (1741-1811), доктор медицины, ученый-естествоиспытатель, географ и путешественник, действительный член Петербургской академии наук, по личному указанию Екатерины II в 1768-1774 гг. возглавил комплексную экспедицию для изучения различных областей Российского государства. В его записках содержатся очень любопытные наблюдения, касающиеся вопросов российско-китайской торговли и положения дел в Кяхте и Маймайчэне. Тщательно анализируя все, что касалось вопросов торгово-экономических связей Российской империи, он указал города, которые в то время играли ключевую роль в торговле России с Китаем: Красноярск – «все, что российские купцы на торг к китайцам ни отвозят, проходит через оный город» и Томск – «множество тут закупают простых соболей и другой в Китай похожей рухляди»"}]}, {"id": "mission", "title": "Российская Духовная Миссия в Пекине", "paras": [{"type": "text", "text": "Российская Духовная Миссия в Пекине и ее роль в процессе социокультурного взаимодействия России и Китая."}, {"type": "text", "text": "Российская Духовная Миссия действовала в Китае более двух веков. Все эти годы ее сотрудники вели проповедь Православия в Пекине и других районах Китая, осуществляли большую работу по переводу богослужебных книг на китайский и маньчжурский языки, переводили на русский язык сочинения по истории, культуре и современному положению Китая, выполняли различные дипломатические поручения, а начиная с 1917 года, приняли на себя труд по духовному окормлению и моральной поддержке многочисленной русской диаспоры, образовавшейся на территории Китая после революции и гражданской войны в России."}, {"type": "text", "text": "В настоящее время назрела настоятельная необходимость приступить к изучению широкого спектра вопросов, связанных с определением места и роли Пекинской Духовной Миссии в развитии духовных связей между народами России и Китая, в процессе социокультурного взаимодействия и в диалоге двух великих культур – российской и китайской."}, {"type": "text", "text": "Можно выделить несколько направлений исследования роли Российской Духовной миссии в процессе социокультурного взаимодействия России и Китая, требующих детального изучения и углубленного анализа: 1) место и роль сотрудников Миссии в процессе развития духовных связей между народами России и Китая, 2) роль и значение трудов сотрудников Пекинской Духовной Миссии в процессе знакомства России с Китаем и Китая с Россией, 3) значение Миссии в деле формирования взаимных образов России и Китая, 4) научно-просветительская деятельность Пекинской Миссии как неотъемлемая часть социокультурного взаимодействия России и Китая."}, {"type": "text", "text": "Начальники и сотрудники Пекинской Духовной Миссии внесли огромный вклад в научное изучение Китая. Имена Бичурина (отца Иакинфа), Кафарова, Васильева сейчас известны любому китаеведу."}, {"type": "text", "text": "Российская Духовная Миссия стала поистине уникальным фактором социокультурного взаимодействия России и Китая, на протяжении всего своего существования внося огромный вклад в эти процессы. Ее роль оказалась в этом смысле даже более значимой, чем роль миссии иезуитов в процессе социокультурного взаимодействия Китая и Запада. Прежде всего, это объясняется постоянным (абсолютно без каких-либо перерывов) присутствием русских миссионеров в столице Цинской империи и их непосредственными контактами с представителями различных слоев китайского общества. Миссия стала постоянно действующим институтом процесса взаимодействия и транслятором российского культурного кода, в то время, как миссия иезуитов так и не смогла создать свое постоянное представительство в китайской столице, и ее успехи в большей степени зависели от активности и авторитета отдельных личностей. Безусловно, индивидуальные заслуги и достижения Маттео Риччи, Адама Шаля, Фердинанда Вербиста в деле распространения отдельных компонентов западной культуры в Китае были очень существенными, но в сложившихся условиях зависимости от личностного фактора нельзя говорить о вполне сформировавшемся канале социокультурного взаимодействия. Напротив, Российская Духовная Миссия, несмотря на казалось бы меньшие достижения в деле обращения китайцев в христианскую веру, выполняла коммуникационные функции постоянно и планомерно."}]}, {"id": "chinoiserie", "title": "Русская версия «шинуазри»", "paras": [{"type": "text", "text": "Российско-китайское взаимодействие в сфере искусства: русская версия «шинуазри»."}, {"type": "text", "text": "Развитие русско-китайской торговли и наполнение российского рынка китайскими товарами, в свою очередь, стимулировали зарождение и рост интереса и к китайскому искусству, что, с другой стороны, было обусловлено эстетическими представлениями, формировавшимися в России XVIII века под воздействием идей, приходивших из Западной Европы."}, {"type": "text", "text": "В конце XVII и в XVIII вв. в Западной Европе возникло своеобразное течение в искусстве, инкорпорировавшее элементы китайского (или шире — восточноазиатского) искусства в европейскую архитектуру, прикладное искусство и интерьеры. В Голландии началось производство фаянса, подражавшего китайскому фарфору, французский фаянс расписывался «на восточный манер». В Европе возникла мода на «китайские» кабинеты, украшенные лаковыми панно и китайской живописью (как подлинной, так и подражаниями)."}, {"type": "text", "text": "Это течение в западноевропейском искусстве, получившее название chinoiserie (рус. «шинуазри», «китайщина»), в свою очередь, воздействовало на формирование у европейцев искаженно-романтизированного представления о Китае как о некой экзотической стране, где жизнь народа такова, как она изображается на фарфоровых вазах. Восточное искусство оказало влияние на развитие стиля рококо в Европе, а в XIX в. способствовало появлению «эклектики» в искусстве Запада."}, {"type": "text", "text": "Примером использования китайских мотивов при создании русских интерьеров XVIII в. могут служить восточный и западный Китайские кабинеты в Большом Петергофском дворце. Архитектор Ж.-Б.-М. Валлен-Деламот, декорируя эти помещения, использовал подлинные китайские ширмы, завезенные в Россию еще при Петре I, дополнив их различными декоративными элементами, навеянными китайскими образцами. Стены в каждом из кабинетов были закрыты панно из черного лака, расписанными композициями в духе китайской живописи на фоне малинового шелка в восточном кабинете и золотистого — в западном."}, {"type": "text", "text": "Китайские кабинеты поражают зрителя обилием золота и серебра, великолепным собранием фарфора, эмалей и лаковых изделий. Изображения порхающих птиц и бабочек, извивающихся драконов и людей в необычных одеждах должны были создавать образ далекой экзотической страны. Согласно проекту, стены в каждом из кабинетов были закрыты панно из черного лака, расписанными композициями в духе китайской живописи на фоне малинового шелка в Восточном кабинете и золотистого - в Западном. Роспись панно посвящена нескольким темам: производство шелка, уборка риса, сельская жизнь. В Восточном кабинете привлекает внимание расположенное на южной стене многофигурное панно «Маньчжурский военный сбор». Для украшения стен были"}, {"type": "text", "text": "использованы подлинные китайские ширмы, расписанные золотом и серебром по черному лаковому фону."}, {"type": "text", "text": "Отделка Китайских кабинетов отличается яркостью и нарядностью, они украшены золочеными скульптурами драконов и фантастических птиц, а также орнаментальной резьбой. Паркет в Китайских кабинетах считается самым сложным в Большом дворце, он набран из тысяч кусочков цветного дерева редких пород в виде затейливых узорных сплетений. Внутреннее убранство кабинетов дополняют выставленные там подлинные китайские вещи XVIII-XIX вв.: фарфор, лаковые шкатулки, изделия из эмали, выполненные в Гуанчжоу, а также мебель (стол красного лака и др.). Русский живописец Федор Власов с помощниками выполнил роспись дверей Китайских кабинетов и оконных проемов. Русские мастера расписали плафон, поверхность которого напоминала изысканный фарфор, а изображенные на нем сказочная птица феникс и дракон свидетельствуют о хорошем понимании сюжетов и приемов китайской живописи."}, {"type": "text", "text": "Подлинным китайским шелком XVIII в., украшенным традиционным рисунком, отделаны стены Диванной и Коронной гостиных Большого дворца. Там же установлены изящные вазы китайской работы. Очень интересен натуральный китайский шелк, расписанный акварелью, на стенах Коронной гостиной. Этот шелк появился там в начале XX века, однако в Петербург он попал еще при Петре Великом. После «подновления» в начале прошлого века он стал использоваться вновь. Сюжет росписи нужно признать очень редким. Здесь подробнейшим образом изображается процесс производства фарфора в знаменитом центре китайского фарфорового производства - Цзиндэчжэне. На стенах можно увидеть изготовление форм, огромные печи для обжига, роспись готовых изделий и процесс их транспортировки. Шелк, покрывающий стены Диванной – также подлинная работа китайских мастеров периода правления династии Цин. Однако сюжеты росписи иные. Это в основном сцены из повседневной жизни Китая того времени: люди сидят в своих домиках и беседуют, идут на рыбалку, наблюдают за выступлением бродячего актера, делают покупки."}, {"type": "text", "text": "Не меньший след «шинуазри» оставил и в другой загородной императорской резиденции – в Царском Селе. В «китайском стиле» была выдержана Голубая гостиная в Екатерининском дворце. Появились своеобразные «китайские уголки» в Екатерининском и Александровском парках. В 1778-1779 гг. придворный архитектор В.И.Неелов построил причудливый Китайский театр. В 1778-1786 гг. среди живописных прудов по проекту Ю. М. Фельтена была сооружена Китайская, или Скрипучая, беседка с затейливо (по-китайски) загнутыми краями крыши, украшенной драконами, вызывающая воспоминания о романтических постройках в парках Китая. А в 1782-1796 гг. по проекту архитекторов Ч.Камерона и В.И.Неелова была выстроена декоративная Китайская деревня, предназначенная для приема знатных гостей."}, {"type": "text", "text": "Главное архитектурное сооружение царскосельского архитектурного ансамбля - Екатерининский дворец – летняя резиденция многих российских монархов. Он был построен в 1751-1756 гг. архитектором Растрелли при императрице Елизавете, и «китайский стиль» оставил существенный след в его убранстве. Среди парадных помещений дворца в первоначальном виде, как отмечали современники, наибольший интерес представлял центральный, или «средний старый зал с китайским убором», то есть отделанный в китайском стиле. Стены зала имели затейливое убранство. Там была размещена большая коллекция китайского, японского и саксонского фарфора. Общее количество специальных полочек и стоявших на них фарфоровых изделий достигало четырехсот сорока восьми. В 1780 г. на месте Китайского зала была сооружена парадная лестница."}, {"type": "text", "text": "И все-таки летняя резиденция российских государей в те времена не могла оставаться без помещений в китайском стиле. В 1780-х годах переделка внутренних покоев Екатерининского дворца была поручена архитектору Чарльзу Камерону. Екатерина II предоставила ему неограниченные возможности, включая использование самых дорогих материалов. В результате появилось несколько великолепных залов и комнат, а на половине наследника престола Павла Петровича (будущего императора Павла I) по проекту Камерона была создана Голубая, или, как ее чаще и по праву называют, Китайская гостиная. Это одно из самых нарядных помещений дворца. Красота и очарование гостиной обусловлены тем, что стены ее покрыты декоративным голубым шелком с набивным рисунком сплетающихся синих цветов и стеблей. Для отделки Камерон использовал очень дорогой китайский шелк, дополнив создаваемое им впечатление легкости и изящества золоченым резным обрамлением панелей и стен каминов."}, {"type": "text", "text": "Так называемая Китайская деревня – это, пожалуй, одно из самых удивительных мест в пригородах Петербурга. Она находится в Александровском парке, вплотную примыкающем к Екатерининскому парку, и занимающем площадь в 200 га. Оба парка сильно отличаются друг от друга по своему характеру. Александровский парк был создан на основе большого лесного массива."}, {"type": "text", "text": "Увлечение в России XVIII века китайским искусством в полной мере сказалось при постройке ряда сооружений в Александровском парке. Появление в Царском Селе комплекса зданий Китайской деревни обычно связывают с именем архитектора Камерона. Однако установлено, что проект был создан еще в начале 1770-х годов, то есть за несколько лет до его приезда в Россию. В связи с этим некоторые искусствоведы склонны считать, что разработка проекта Китайской деревни как основного ядра всего Китайского комплекса Александровского парка принадлежала"}, {"type": "text", "text": "блистательному архитектору Антонио Ринальди – активному стороннику внедрения китайского искусства в культуру Петербурга второй половины XVIII века. Ч. Камерон и В. И. Неелов на практике воплотили в жизнь замыслы выдающегося синтезатора искусства Востока и Запада и проникновенного интерпретатора китайского искусства."}, {"type": "text", "text": "Композиционным центром ансамбля был павильон-обсерватория, увенчанный сильно вынесенной и круто изогнутой крышей и башней-фонариком. Этот павильон находился в центре восьмиугольной площади, окруженный одноэтажными домиками. На площадь вела короткая улочка, застроенная домами в китайском стиле. Первоначально предполагалось, что при въезде на эту улочку в соответствии с китайскими традициями будет построена въездная арка с двускатной кровлей. На чертежах и в модели можно увидеть также восьмиярусную башню-пагоду, характерную для китайских архитектурных комплексов. Таким образом, при воплощении проекта в жизнь не удалось осуществить всех задуманных планов, и облик деревни стал менее китайским, чем это могло бы быть. Из планировавшихся восемнадцати домиков Камерон построил лишь десять."}, {"type": "text", "text": "Домики Китайской деревни по распоряжению императора Александра I предоставлялись чиновникам высоких разрядов для проживания летом. Так в 1822 г. статскому советнику Н. М. Карамзину (известному русскому писателю и автору «Истории государства Российского») были отведены для «жительства его с семейством» два китайских домика."}, {"type": "text", "text": "Н.М.Карамзину понравилась жизнь в Китайской деревне, он любил сравнивать свое пребывание там с воображаемым посещением Китая. 19 мая 1822 г. он написал: «Мы уже 10 дней в Китае: чисто и красиво». Там его часто навещал живший по соседству поэт В.А.Жуковский. Также заезжал к Карамзину в Китайскую деревню перед своим отъездом в Персию известный писатель, дипломат и знаток Востока А.С.Грибоедов. Н.М.Карамзин"}, {"type": "text", "text": "наслаждался уютом и уединением жизни в Китайской деревне, неоднократно отмечая в письмах к друзьям, что ему там особенно хорошо работалось."}, {"type": "text", "text": "В Александровском парке Царского Села также были сооружены беседки в китайском стиле (Большой каприз и «Скрипучая»), несколько «китайских» мостиков и знаменитый Китайский театр."}, {"type": "text", "text": "Проект Китайского театра был разработан архитектором Антонио Ринальди, который мечтал создать в Царском Селе архитектурный шедевр, соединивший в себе достижения китайского, европейского и русского искусства, как это ему удалось сделать в Ораниенбауме. Из всех построек «китайского комплекса» внешний облик театра, по-видимому, имел больше всего сходства с подлинными китайскими постройками. В отделке помещений были использованы подлинные китайские панно XVII-XVIII вв. из черного лака с золотым рисунком. Зрительный зал и сцену украшали вырезанные из дерева фигуры китайцев. Повсюду были развешаны гирлянды, бусы из шариков и колокольчики. И над всем этим великолепием парили драконы. Деревянные столбы, поддерживавшие перекрытия между ярусами, были украшены ярко раскрашенными спиралями из фольги и картона, увенчанными выполненными из папье-маше фигурками китайцев. Освещался зрительный зал большой золоченой бронзовой люстрой в виде чаши, украшенной живописью в китайском стиле, китайскими колокольчиками и десятью драконами. К великому сожалению, Китайский театр сгорел во время Великой Отечественной войны (в результате обстрела города немецко-фашистскими войсками 15 сентября 1941 г.) и больше не восстанавливался."}, {"type": "text", "text": "Своего рода квинтэссенцией внедрения «китайского стиля» в русскую архитектуру стал Китайский дворец, воздвигнутый по проекту Антонио Ринальди в 1762 - 1768 гг. в Ораниенбауме. Многие искусствоведы считают его одним из самых гармоничных произведений русской архитектуры XVIII века. При его создании А.Ринальди сумел творчески подойти к использованию традиционных мотивов китайского искусства, не стремясь полностью подражать ему, но учтя при этом европейское и русское восприятие его своеобразного духа. Это позволило зодчему создать одно из самых замечательных своих творений, где его талант сумел раскрыться с наибольшей полнотой и выразительностью."}, {"type": "text", "text": "Не случайно, дворец называли «подлинным чудом полного чудес XVIII века» и по производимому им впечатлению сравнивали с «музыкальной сонатой». Легкое и изящное здание органично соединило в себе элементы барокко, классицизма и китайского стиля. Китайский дворец – это, в полном смысле слова, летняя резиденция, сочетающая в себе черты, сближающие дворцовое здание с парковым павильоном. Так же, как и в китайских загородных дворцах, по замыслу Ринальди парковый пейзаж вокруг Китайского дворца органично соединяется с дворцовыми залами, здание буквально сливается с природой. Перед ним по-прежнему растут мощные дубы – ровесники дворца."}, {"type": "text", "text": "Этот Дворец сравнивали с причудливой деревянной шкатулкой, украшенной инкрустацией, росписью и лепкой. В узоре наборного паркета использован китайский геометрический орнамент. Взглянув наверх, можно увидеть золоченые фигурки свившихся в полете дракона и птицы феникс, символизирующих в Китае единство двух начал природы – мужского и женского (ян и инь)."}, {"type": "text", "text": "Среднюю часть потолка Большого китайского кабинета занимает плафон, расписанный итальянским художником Бароцци – «Союз Европы и Азии», несущий в себе большую идейную нагрузку. Азию олицетворяет китайский юноша, а Европу – девушка европейского вида. Плафон должен был символизировать расширение торговых, политических и культурных связей европейских государств со странами Азии в XVIII в, и"}, {"type": "text", "text": "подчеркивать то место, какое должна занимать в этих связях Россия, выступавшая в роли своеобразного моста между Востоком и Западом."}, {"type": "text", "text": "В убранстве Малого китайского кабинета Ринальди активно заимствовал декоративные элементы китайского искусства, в то же время не пытаясь полностью подражать им. При отделке стен была использована шелковая обивка со старинной китайской росписью."}, {"type": "text", "text": "В залах дворца собрана большая коллекция китайского фарфора периода Мин и Цин, а также резной и расписной лак."}, {"type": "text", "text": "Установление регулярной торговли между Россией и Китаем, а также ввоз китайских изделий через страны Западной Европы не только повысили интерес к Китаю в России, но и наложили отпечаток на русское художественно-ремесленное производство, в котором также стали появляться китайские мотивы. Этот интерес сохранился и в XIX в. В данном смысле показательна продукция Императорского фарфорового завода, а также фарфоровые изделия частных заводов Гарднера, Батенина и др. Русские мастера иногда даже специально направлялись в Китай в составе торговых караванов для обучения у китайских специалистов «финифтяного дела художествам»."}, {"type": "text", "text": "Распространение предметов китайского искусства в России и увлечение «шинуазри» способствовали повышению интереса к Китаю в нашей стране. Можно с уверенностью утверждать, что именно в XVIII в. был сделан решающий шаг в деле начала диалога двух культур, значительную роль в этом процессе сыграло китайское изобразительное и декоративное искусство."}]}, {"id": "tea", "title": "Чай", "paras": [{"type": "text", "text": "Чай"}, {"type": "text", "text": "С конца XVIII в. среди товаров, приобретавшихся русскими у китайцев, значительно увеличивается доля чая, постепенно становившегося все более важной статьей китайского экспорта в целом и превращавшегося в неотъемлемую часть процесса социокультурного взаимодействия, меняя вкусы и потребности значительной части населения. Важнейшим аспектом кяхтинской торговли стало формирование уникальной «чайной эстетики». Удерживая монополию на поставку китайского чая, Кяхта фактически подарила России культуру чаепития. Это, в свою очередь, сформировало колоссальный спрос на сопутствующее прикладное искусство — от росписи фарфоровых чайных сервисов до появления знаменитых сюжетов в русской жанровой живописи, воспевающих купеческие чаепития."}, {"type": "text", "text": "Согласно традиционно принятой версии, впервые к царскому двору чай был доставлен из Монголии в 1638 г. послом царя Михаила Федоровича Василием Старковым. Непосредственно из Китая чай был привезен в Россию двадцать лет спустя, уже ко двору царя Алексея Михайловича, русским посланником – боярским сыном Иваном Перфильевым. В XVII в. чай использовали в основном как лекарственное средство"}, {"type": "text", "text": "Знаменитое наблюдение о том, что в России китайский чай намного вкуснее, чем в Западной Европе, французский писатель Александр Дюма-отец зафиксировал в своем фундаментальном труде «Большой кулинарный словарь» (Le Grand Dictionnaire de Cuisine). Это гастрономическое открытие литератор сделал во время своего масштабного путешествия по Российской империи, которое длилось с 1858 по 1859 год. Будучи страстным гурманом и кулинаром, Дюма детально изучал кулинарные привычки местных жителей на всем пути от Санкт-Петербурга до Кавказа. Повсюду сталкиваясь с самоварами, он пришел к категоричному выводу: «Самый лучший чай пьют в Петербурге и вообще повсюду в России»."}, {"type": "text", "text": "Секрет превосходного вкуса русского чая Дюма объяснил исключительно особенностями логистики середины XIX века. В то время существовало два принципиально разных способа доставки чая из Поднебесной, которые кардинально влияли на качество деликатного продукта:"}, {"type": "text", "text": "- Западноевропейский маршрут (Морской путь): В Англию, Францию и другие страны Европы чай везли кораблями вокруг Африки. Чайный лист обладает свойством мгновенно впитывать посторонние запахи и влагу. За долгие месяцы пути в сырых, душных и солоноватых трюмах морских судов чай неизбежно «задыхался», теряя свой тонкий первозданный аромат и приобретая специфический привкус."}, {"type": "text", "text": "- Российский маршрут (Сухопутный кяхтинский путь): В Россию чай доставляли караванами исключительно по суше — через пограничную Кяхту и бескрайнюю Сибирь. Путешествуя на сухом морозном воздухе, чайный лист не подвергался воздействию морской сырости. Напротив, в пути он бережно просушивался, полностью сохраняя свой аутентичный букет и эфирные масла."}, {"type": "text", "text": "Благодаря кяхтинской торговле в российские столицы и провинции поступал элитный, абсолютно свежий «караванный чай». Помимо исключительного качества самого напитка, Александра Дюма поразил и размах чайной культуры. Он с удивлением отмечал, что в России нет ни одного дома без самовара, а также зафиксировал уникальную местную традицию: мужчины предпочитали пить горячий чай из прозрачных стеклянных стаканов, в то время как женщины пили его из изящных фарфоровых чашек."}, {"type": "text", "text": "В 1850-е годы российские купцы привозили через Кяхту колоссальные объемы чая. Настоящими фаворитами той эпохи, которые ценились на вес золота и создавали тот самый неповторимый вкус «русского караванного чая», были следующие уникальные китайские сорта:"}, {"type": "text", "text": "- Цветочные чан (Пекой / Байховые чан): Это была главная и самая дорогая страсть русской аристократии. Слово «байховый» происходит от китайского бай хоза («белые реснички»). Это означало, что чай состоял из нежнейших, едва распустившихся почек чайного листа с белым ворсом. Эти чан обладали невероятно тонким, сладковатым цветочным ароматом. Именно они составляли до 70% элитного импорта Кяхты."}, {"type": "text", "text": "- Жемчужный (Ханский) чай: Особый, элитный сорт зеленого чая, скрученный в плотные шарики, напоминающие жемчужины. Он давал легкий, прозрачный настой и ценился за уникальные тонизирующие свойства."}, {"type": "text", "text": "- Жёлтый «Императорский» чай: Редчайший и самый дорогой сорт. В самом Китае он долгое время был доступен только императорскому двору. Русские купцы буквально выменивали его на самую ценную сибирскую пушинну (соболей и горностаев)."}, {"type": "text", "text": "- Лян-син и Ма-ю-кон: Популярные в купеческой и дворянской среде черные (в китайской классификации — красные) чаи с глубоким, бархатистым вкусом."}, {"type": "text", "text": "Для менее обеспеченных сословий Кяхта поставляла «кирпичный» (прессованный) чай. Его спрессовывали в тяжелые плитки для удобства транспортировки. Этот чай часто варили по сибирским и азиатским рецептам — с добавлением соли, молока и масла."}, {"type": "text", "text": "Смешиваясь в пути на верблюжьих спинах, элитные китайские черные сорта (такие как легендарный Кимун) невольно впитывали тонкий аромат дыма от вечерних караванных костров. Так родился знаменитый на весь мир купаж «Русский караван» (Russian Caravan) — чай с едва уловимым благородным «копченым» привкусом, который и сегодня подается в лучших чайных домах Европы и Азии."}, {"type": "text", "text": "Китайский сорт Кимун (Цимэнь Хун Ча / 祁门红茶) стал «позвоночником» и незаменимой основой для знаменитых европейских и русских чайных купажей (в первую очередь, легендарного «Русского каравана») благодаря уникальному набору вкусовых, химических и исторических свойств."}, {"type": "text", "text": "Его исключительное положение на мировом рынке обусловлено четырьмя ключевыми причинами:"}, {"type": "text", "text": "1. Уникальный профиль «Цимэньской купели» (Keemun Fragrance)"}, {"type": "text", "text": "Кимун входит в тройку самых ароматных чаёв мира. Его парфюмерный, глубокий букет получил в международной титестерской практике официальное название «цимэньский аромат». Он сочетает в себе ноты спелых фруктов, вяленой сливы, лёгкие винные оттенки и тона благородной древесины (сосны). Из-за этой сложной, бархатистой палитры европейцы уважительно окрестили Кимун «Бургундией среди чаёв». Столь богатый собственный вкус делал его идеальной основой (базой), которая не терялась при смешивании с другими сортами."}, {"type": "text", "text": "2. Феноменальная сочетаемость со смолистым дымом Lapsang Souchong"}, {"type": "text", "text": "В классическом купаже «Русский караван» (Russian Caravan) Кимун соединяют со знаменитым копченым чаем Лапсанг Сушонг (Zheng Shan Xiao Zhong / 正山小种)."}, {"type": "text", "text": "Если Лапсанг дает мощный, резкий, дегтярный аромат соснового дыма, то Кимун выступает в роли «сглаживающего» элемента."}, {"type": "text", "text": "- Плотное, сладковато-мальтовое «тело» Кимуна идеально балансирует дымную агрессию, создавая благородный, мягкий, «уютный» вкус караванного костра без излишней горечи. [3. Стойкость к европейским и русским чайным традициям"}, {"type": "text", "text": "В отличие от Китая, где чай пьют исключительно в чистом виде, в России и Европе (особенно в Англии) сформировалась традиция обильных чайных застолий. Чай стали пить."}, {"type": "text", "text": "С добавлением молока или сливок (британская традиция)."}, {"type": "text", "text": "С лимоном, сахаром, медом или вприкуску с густым вареньем (русская традиция)."}, {"type": "text", "text": "- Большинство деликатных китайских чаев (например, зеленые или легкие белые) полностью теряют свои свойства, если добавить в них молоко или лимон. Кимун же обладает высокой экстрактивностью и плотностью. Даже при добавлении молока или сахара он не становится водянистым, сохраняя свой характерный глубокий вкус и красивый рубиново-красный цвет настоя."}, {"type": "text", "text": "4. Исторический экспортный генезис"}, {"type": "text", "text": "Хотя уезд Цимэнь (провинция Аньхой) производил чай веками, технологию именно красного (черного) чая там довели до идеала сравнительно поздно — в 1875 году. Создатели сорта изначально ориентировались на бурно растущий спрос со стороны европейских купцов. В результате Кимун создавался как «чай новой формации». Он сочетал в себе утонченность китайского сырья и неприхотливость к долгой транспортировке. Он быстро вытеснил более старые, грубые сорта и прочно занял место главного экспортного фаворита, став эталоном качественного черного чая в России и на Западе."}]}, {"id": "perlov", "title": "Перловы — «чайные короли» России", "paras": [{"type": "text", "text": "Можно констатировать, что чайная торговля не только способствовала расширению торгово-экономических связей России и Китая, но и создавала условия для появления новых форм культурного взаимовлияния. В этом смысле очень показательна деятельность крупнейших русских чаеторговцев – купцов Перловых."}, {"type": "text", "text": "Неоценимой заслугой этой купеческой семьи стала популяризация чая в России и его широкое распространение среди простого народа. Алексей Иванович Перлов в 1787 г. открыл в Москве (в Торговых рядах на Красной площади) лавки для розничной торговли чаем и стал приучать москвичей к потреблению чая. Его сын – Василий Перлов в начале XIX в. организовал фирму «В. Перлов с сыновьями»."}, {"type": "text", "text": "Благодаря умелой торговой политике и получению через Кяхту лучших сортов китайского чая, Перловы вышли на передовой уровень чаеторговли. Во-первых, они использовали и развили прием конкурента-чаеторговца А. Губкина — нормировку чая (приказчики продавали чай только по сортам, и только по установленным для каждого сорта ценам). Чай отвешивался покупателям в любых, даже самых мизерных, количествах. Во-вторых, для популяризации чая как полезного напитка Перловы стали использовать расписные жестяные и алюминиевые чайницы, содержавшие легко запоминающиеся поучительные изречения о чае (наподобие современных слоганов), вроде: «Чай не пьешь — откуда силы?»¹. В-третьих, Василий Перлов отдавал много сил борьбе с подделками, наводнявшими чайный рынок."}, {"type": "text", "text": "В итоге, Перловы стали поистине «чайными королями» России,"}, {"type": "text", "text": "Сергей Васильевич Перлов (младший сын Сергея Ивановича) в 1869 г., отделившись от старшей ветви семьи (в результате чего в Москве появились две фирмы Перловых, конкурировавшие между собой), основал собственное Товарищество чайной торговли «Сергей Васильевич Перлов и Ко», которое и обосновалось в доме на Мясницкой вместе со своей чаеразвесочной фабрикой. В 1890-93 гг. это здание заново отстроил архитектор Р.И.Клейн. С.В.Перлов, страстно увлекавшийся искусством Китая, разместил в жилых помещениях свою коллекцию китайской живописи и фарфора. Там проходили музыкальные вечера и домашние спектакли."}, {"type": "text", "text": "Весной 1896 г., когда в Москве готовились к коронации императора Николая II и ожидали приезда иностранных делегаций, московские чаеторговцы очень рассчитывали на встречу с посланником китайского императора Ли Хунчжаном, надеясь получить поддержку планам расширения торговли с Китаем. Когда все готовились к визиту, Сергею Перлову пришла в голову идея передекорировать свой дом на Мясницкой в китайском духе. Он пригласил молодого архитектора Карла Гиппиуса, который, не тронув самого дома, переделал его фасад и интерьер магазина в причудливом китайском стиле: на фасаде появились дракончики, зонтики, восточные фонарики, орнаменты, а увенчала «чайный домик» миниатюрная башенка в виде пагоды. Интерьер магазина обогатился деревянными прилавками с фигурной позолоченной резьбой и громадными фарфоровыми китайскими вазами. «Дубовый паркет был устлан напольным китайским ковром ручной работы, а у дверей стояли две раскрашенные деревянные фигуры китайцев, как бы приглашавших зайти в магазин» $^{ii}$ ."}, {"type": "text", "text": "С.В.Перлов надеялся, что высокопоставленный китайский гость, пораженный подобным отношением к Китаю, обязательно остановится именно у него. Однако Ли Хунчжан отдал предпочтение старшей ветви рода Перловых. 5 мая 1896 года его встречали на 1-й Мещанской и поднесли в дар серебряное блюдо и фигурную солонку. В ответ китайский посланник пожаловал хозяину, Николаю Семеновичу Перлову, почетный орден Двойного Дракона второй степени."}, {"type": "text", "text": "Однако дом на Мясницкой, так и не увидевший Ли Хунчжана, стал не просто уникальной достопримечательностью Москвы, которую ее жители окрестили «китайской шкатулкой», но смог превратиться в своего рода символ социокультурного взаимодействия России и Китая конца XIX века, в котором переплелись взаимные торговые интересы и культурные влияния."}, {"type": "text", "text": "В 1893 г. в Российскую империю прибыл китайский чаевод (в русских источниках его имя пишется, как Лау Джон-джау, настоящая фамилия - Лю), который привез с собой 10 тысяч черенков чайных кустов и несколько сот пудов семян. Он прожил в нашей стране до 1926 г., руководя работами по разведению и производству чая. Получал правительственные награды как от царского, так и от советского правительства. С царским орденом на груди он изображен на ставшей в последнее время известной фотокарточке, сделанной основоположником цветной фотографии в России С.М.Прокудиным-Горским в 1914 г. Его сын – Лю Цзэжун (Лю Шаочжоу, Лау Сиучжау, 1892-1970) окончил Санкт-Петербургский университет, после Октябрьской революции возглавлял Союз китайских рабочих в России, был автором воспоминаний о встречах с В.И.Лениным $^{iii}$ ."}]}, {"id": "crossyears", "title": "Перекрестные годы России и Китая", "paras": [{"type": "text", "text": "«Перекрестные» (тематические) годы России и Китая — это уникальный дипломатический и гуманитарный формат, созданный для системного сближения двух государств. Вместо точечных визитов страны на один-два года полностью фокусируются на конкретной сфере взаимодействия, проводя сотни совместных выставок, фестивалей, научных конференций и масштабных гастролей."}, {"type": "text", "text": "Хронологический список перекрестных годов"}, {"type": "text", "text": "Начиная со второй половины 2000-х годов, Россия и Китай на государственном уровне реализовали уже десять масштабных двухлетних программ:"}, {"type": "text", "text": "Период проведения"}, {"type": "text", "text": "2006–2007 гг."}, {"type": "text", "text": "Официальное название тематического цикла"}, {"type": "text", "text": "2009–2010 гг."}, {"type": "text", "text": "Национальные годы России и Китая"}, {"type": "text", "text": "Перекрёстные годы русского и китайского языков"}, {"type": "text", "text": "2012 – 2013 гг. Перекрестные годы туризма"}, {"type": "text", "text": "2014 – 2015 гг. Перекрестные годы молодежных обменов"}, {"type": "text", "text": "2016 – 2017 гг. Перекрестные годы обменов между СМИ (масс-медиа)"}, {"type": "text", "text": "2018 – 2019 гг. Перекрестные годы межрегионального сотрудничества"}, {"type": "text", "text": "2020 – 2021 гг. Перекрестные годы научно-технического и инновационного сотрудничества"}, {"type": "text", "text": "2022 – 2023 гг. Перекрестные годы сотрудничества в области физической культуры и спорта"}, {"type": "text", "text": "2024 – 2025 гг. Перекрестные Годы культуры России и Китая"}, {"type": "text", "text": "2026 – 2027 гг. Перекрестные Годы сотрудничества в области образования"}, {"type": "text", "text": "Значение для взаимодействия культур двух стран"}, {"type": "text", "text": "Регулярное проведение тематических годов вывело культурное сотрудничество между Россией и Китаем на принципиально новый уровень, решив сразу несколько стратегических задач:"}, {"type": "text", "text": "• Преодоление стереотипов и культурных барьеров: Тематические годы (особенно Года языков, туризма и культуры) помогли уйти от поверхностного восприятия чужой страны. Взаимное открытие традиционного искусства, современной литературы, кинематографа и кулинарных традиций сблизило менталитет двух народов."}, {"type": "text", "text": "- Масштабная интеграция классического и народного искусства: Благодаря Годам культуры (2024–2025) состоялись грандиозные перекрестные проекты: гастроли Большого театра и оркестра имени Осипова в Китае, совместные выставки Музеев Московского Кремля и Национального музея Китая, а также фестивали традиционного китайского искусства в крупных городах России."}, {"type": "text", "text": "- Формирование общего образовательного и научного пространства: В рамках Годов языков и текущих Годов образования (2026–2027) кратно увеличилось количество профильных кафедр, совместных университетов (например, МГУ-ППИ в Шэньчжэне) и языковых школ. Растет число студентов, изучающих русский и китайский языки, что напрямую готовит будущую переводческую и академическую элиту для обеих стран."}, {"type": "text", "text": "- Связи между молодым поколением: Перекрестные годы молодежных обменов заложили долгосрочную основу для горизонтальных связей. Школьники, студенты, молодые ученые, предприниматели и спортсмены получают возможность прямого общения в рамках волонтерских лагерей, форумов и соревнований, формируя прочный человеческий фундамент добрососедства."}, {"type": "text", "text": "- Децентрализация сотрудничества: Программы «межрегионального сотрудничества» позволили установить побратимские и культурные связи не только между Москвой, Санкт-Петербургом и Пекином, но и вовлекли в культурный обмен отдаленные провинции Китая и регионы Сибири, Дальнего Востока, Поволжья и Урала."}, {"type": "text", "text": "Итог: Перекрестные годы превратили российско-китайское гуманитарное взаимодействие из разных официальных приемов в непрерывный, живой и глубокий процесс межкультурного диалога, который охватывает миллионы обычных граждан обеих стран."}, {"type": "text", "text": "Инициатива направлена на расширение двустороннего сотрудничества в сфере образования, науки и университетских обменов. В рамках проекта планируют развивать совместные образовательные программы, академическую мобильность, научные исследования, обмены школьников, студентов и преподавателей."}, {"type": "text", "text": "По информации на май 2026 года, российская часть плана событий включает 103 проекта. Они направлены на развитие высшего, среднего профессионального и школьного образования, популяризацию русского языка в Китае и китайского языка в России, а также укрепление научного и молодёжного сотрудничества."}]}];
const ZH = /*__ZH__*/[{"id": "peter", "title": "Пётр I и начало изучения Китая в России", "paras": [{"type": "text", "text": "彼得一世在圣彼得堡创办了科学院和大学，以及俄罗斯第一座博物馆——珍奇屋。他开创了俄罗斯对中国和中国语言进行科学研究之先河（1700年关于教授汉语的法令）。在他的倡议下，蒙普莱西尔宫和大彼得霍夫宫中设立了“中国书房”。在彼得时代，中国艺术和“中国风格”在彼得堡非常流行。收藏中国艺术品的不仅有彼得一世，还有他的追随者：缅希科夫、阿普拉克辛等人。随着俄中贸易的扩大，越来越多的中国物品流入俄罗斯。"}]}, {"id": "kyakhta", "title": "Кяхтинская торговля", "paras": [{"type": "text", "text": "这得益于《恰克图条约》的签订以及恰克图茶叶和其他商品贸易的开启。恰克图贸易在18世纪中叶至19世纪上半叶达到鼎盛，在将中国艺术和美学传播到俄罗斯方面发挥了巨大作用。与仅通过海路运送东方商品的西欧国家不同，俄罗斯拥有一条独特的陆路走廊——伟大的茶叶之路，其关键枢纽便是边境贸易集镇恰克图。通过这扇合法的“窗口”，中国工匠的真正杰作源源不断地流入俄罗斯帝国：瓷器、漆器、彩绘扇、上等丝绸和卷轴画。真品的直接进口为在俄罗斯皇室居所——如蒙普莱西尔宫、奥拉宁鲍姆和皇村——的内部陈设中形成著名的东方收藏奠定了基础。"}, {"type": "text", "text": "恰克图供货的规律性和可及性成为本国贵族中“中国风”（шинуазри）时尚的强大催化剂。这种热衷远远超出了收藏的范围：俄罗斯建筑师、艺术家和工匠开始创造自己独特的仿作。这种影响的杰出典范是安东尼奥·里纳尔迪在奥拉宁鲍姆建造的中国宫，而皇家瓷器厂则开始定期生产带有东方母题的产品。与此同时，贸易的陆路性质造就了一种在欧洲独一无二的效果——中国风格的逐渐大众化。廉价的器皿、织物和日常用品渗入西伯利亚商界、市民和富裕农民之中，逐渐将东方纹样融入民间工艺和城市服饰。"}, {"type": "text", "text": "恰克图贸易在18世纪中叶至19世纪上半叶达到鼎盛，对中国的艺术与美学在俄罗斯的传播起到了巨大作用。与仅通过海路运送东方商品的西欧国家不同，俄罗斯拥有一条独特的陆上走廊——伟大的茶叶之路，而边境贸易集镇恰克图则成为这条走廊的关键枢纽。"}, {"type": "text", "text": "多年来，这里的贸易完全带有免税易货的性质。中国商人乐于从俄罗斯换取西伯利亚毛皮（紫貂、北极狐、狐狸、松鼠），毛皮构成了俄国出口的基础，此外还有尤夫季皮（高品质鞣制皮革）、呢绒和金属制品。作为交换，来自清帝国的品类极为丰富的独特商品源源不断地输入俄罗斯帝国。"}, {"type": "text", "text": "恰克图的主要商业商品是中国茶——既有昂贵的散装红茶，也有压制的砖茶。但除了茶叶之外，商人们还运来了大量工艺美术品、纺织品和新奇物品。商队把精致的生丝、捻丝、天鹅绒和结实的棉布“中国布”运入俄罗斯。与织物一同跨越边境的还有中国工匠的真正杰作：极精细的瓷器、陶器、漆盒、彩绘扇子和屏风。俄罗斯市场上还出现了异域风味的冰糖、东方香料（例如八角）、烟草、中国书法墨、熏香。"}, {"type": "text", "text": "恰克图供货的规律性和可获取性，成为本国贵族阶层中“中国风”（китайщина）时尚的强大催化剂。这种迷恋远远超出了收藏的范围：俄罗斯建筑师、画家和工匠开始创造自己独特的风格化作品。这种影响的一个杰出例证是奥拉宁鲍姆由安东尼奥·里纳尔迪设计的中国宫，而皇家瓷器厂则开始定期生产带有东方纹样的制品。"}, {"type": "text", "text": "恰克图贸易最重要的方面之一是独特“茶美学”的形成。恰克图凭借对中国茶叶供应的垄断，实际上把饮茶文化赠予了俄罗斯。这反过来又催生了对相关实用艺术的巨大需求——从彩绘瓷茶具到俄罗斯风俗画中颂扬商人饮茶的著名题材的出现。"}, {"type": "text", "text": "两座小城的毗邻——俄罗斯的恰克图与中国的买卖城——促进了俄中商人之间直接接触的发展和文化交流。那里甚至形成了一种特殊的交际语言——恰克图（买卖城）方言，其中俄语词与汉语词混杂在一起。"}, {"type": "text", "text": "恰克图与买卖城在近两个世纪里构成了一种独特的两重一体，即俄罗斯文化与中国文化诸要素的共生体。彼得·西蒙·帕拉斯（1741—1811），医学博士、博物学家、地理学家和旅行家，圣彼得堡科学院正式院士，根据叶卡捷琳娜二世的亲自指示，于1768—1774年间率领一支综合考察队，对俄罗斯国家的各个地区进行研究。他的札记中包含了关于俄中贸易问题以及恰克图和买卖城状况的极为有趣的观察。在仔细分析一切与俄罗斯帝国贸易经济联系有关的问题时，他指出了当时在俄罗斯对华贸易中发挥关键作用的城市：克拉斯诺亚尔斯克——“俄罗斯商人运往中国人那里进行贸易的一切货物，都要经过该城”；以及托木斯克——“此地大量收购普通貂皮和其他运往中国的类似毛皮”。"}]}, {"id": "mission", "title": "Российская Духовная Миссия в Пекине", "paras": [{"type": "text", "text": "俄罗斯驻北京传教士团及其在俄中社会文化互动过程中的作用。"}, {"type": "text", "text": "俄罗斯传教士团在中国活动了二百多年。在这些岁月里，其成员在北京和中国其他地区进行东正教布道，开展了将宗教礼仪书籍译成汉语和满语的大量工作，将有关中国历史、文化及现状的著作译成俄语，执行各种外交任务；而自1917年起，又承担起对俄国革命和内战之后在中国境内形成的庞大俄罗斯侨民群体进行精神关怀和道义支持的重任。"}, {"type": "text", "text": "当前，迫切需要着手研究一系列广泛的问题，这些问题涉及确定北京传教士团在俄中两国人民精神联系发展中的地位与作用、在社会文化互动过程中的地位与作用，以及在俄罗斯文化与中国文化这两个伟大文化的对话中的地位与作用。"}, {"type": "text", "text": "可以划分出若干研究俄罗斯传教士团在俄中社会文化互动过程中作用的方向，这些方向需要细致研究和深入分析：1）传教士团成员在俄中两国人民精神联系发展过程中的地位与作用；2）北京传教士团成员的著作在俄罗斯认识中国和中国认识俄罗斯过程中的作用与意义；3）传教士团在形成俄罗斯与中国的相互形象方面的意义；4）北京传教士团的科学教育活动作为俄中社会文化互动不可分割的一部分。"}, {"type": "text", "text": "北京传教士团的历任团长和成员为中国的科学研究作出了巨大贡献。比丘林（亚金夫神父）、卡法罗夫、瓦西里耶夫的名字如今为任何一位汉学家所熟知。"}, {"type": "text", "text": "俄罗斯东正教传教团成为俄中社会文化互动中一个真正独特的因素，在其整个存在期间都为这些进程作出了巨大贡献。在这一意义上，它的作用甚至比耶稣会传教团在中西社会文化互动进程中的作用更为重要。首先，这可以用俄国传教士持续不断地（绝对没有任何间断地）驻扎在清帝国首都，并与中国社会各阶层代表直接接触来解释。传教团成为互动进程中一个常设机构，也是俄罗斯文化密码的传播者；而耶稣会传教团却始终未能在中国首都建立自己的常设代表机构，其成就更大程度上取决于个别人士的积极性和威望。毫无疑问，马泰奥·里奇、亚当·沙尔、费迪南德·维尔比斯特在向中国传播西方文化某些组成部分方面的个人功绩和成就是非常重要的，但在当时依赖个人因素的条件下，还不能说已经形成了完全成熟的社会文化互动渠道。相反，俄罗斯东正教传教团尽管在使中国人皈依基督教方面成就看似较小，却持续而有计划地履行着传播交流功能。"}]}, {"id": "chinoiserie", "title": "Русская версия «шинуазри»", "paras": [{"type": "text", "text": "艺术领域的俄中互动：中国风（chinoiserie）的俄罗斯版本。"}, {"type": "text", "text": "俄中贸易的发展以及中国市场商品对俄国市场的充实，反过来又刺激了对中国艺术的兴趣的产生和增长；而另一方面，这也受到了18世纪俄国在来自西欧思想影响下形成的审美观念的制约。"}, {"type": "text", "text": "在17世纪末和18世纪，西欧艺术中出现了一种独特的流派，它将中国（或更广义地说——东亚）艺术的元素融入欧洲建筑、实用艺术和室内装饰之中。荷兰开始生产仿效中国瓷器的彩陶，法国彩陶则按“东方风格”加以彩绘。欧洲兴起了一股对“中国式”书房的时尚，这些书房以漆板和中国绘画（既有真迹，也有仿作）装饰。"}, {"type": "text", "text": "这一在西欧艺术中获得“chinoiserie”（俄语称“шинуазри”、“китайщина”，即“中国风”）之名的流派，反过来又影响了欧洲人对中国那种被扭曲且浪漫化的想象的形成——将中国视为某种异国情调的国家，那里民众的生活就如同瓷器花瓶上所描绘的那样。东方艺术对欧洲洛可可风格的发展产生了影响，而在19世纪又促成了西方艺术中“折衷主义”的出现。"}, {"type": "text", "text": "在18世纪俄罗斯室内装饰的营造中运用中国母题的一个例子，是大彼得霍夫宫中的东、西两个“中国书房”。建筑师让-巴蒂斯特-米歇尔·瓦伦-德拉莫特在装饰这些厅室时，使用了早在彼得一世时期便已运抵俄罗斯的真正的中国屏风，并以各种受中国样品启发的装饰元素加以补充。每间书房的墙壁都覆以黑漆镶板，上面绘有中国绘画风格的构图，东侧书房以深红色丝绸为底，西侧书房则以金色丝绸为底。"}, {"type": "text", "text": "中国厅以其大量的金银装饰、精美的瓷器、珐琅和漆器收藏令观者惊叹。翩飞的禽鸟与蝴蝶、蜿蜒的龙以及身着奇装异服的人物形象，本应营造出一个遥远异国情调的国度的意象。按照设计，每个中国厅的墙壁都用黑漆镶板覆盖，板上绘有中国绘画风格的构图，东厅以绛红色丝绸为底，西厅则以金黄色丝绸为底。镶板绘画涉及几个主题：丝绸生产、稻田耕作、乡村生活。在东厅，南墙上那幅多人物镶板《满洲军事集会》引人注目。为装饰墙壁，曾"}, {"type": "text", "text": "使用真正的中国屏风，在黑漆底上以金银描绘。"}, {"type": "text", "text": "中国厅的装饰以鲜艳华丽见长，饰有镀金的龙与神鸟雕塑，以及装饰性雕刻。中国厅的拼花地板被认为是整个大宫殿中最复杂的，它由数千块珍稀树种的彩色木片拼成，呈现出精巧繁复的花纹交织。陈列在那里的18—19世纪真正的中国物品进一步充实了各厅的内部陈设：瓷器、漆盒、广州制作的珐琅制品，以及家具（红漆桌等）。俄罗斯画家费奥多尔·弗拉索夫携助手完成了中国厅门和窗洞的彩绘。俄罗斯匠师绘制了天花板灯饰画，其表面宛如精致的瓷器，上面所绘的童话凤凰与龙表明他们对中国绘画的题材与技法有很好的理解。"}, {"type": "text", "text": "大宫殿的沙发厅和加冕客厅的墙壁用装饰着传统图案的18世纪真正的中国丝绸裱糊。那里还摆放着精致的中国制花瓶。加冕客厅墙上那幅绘有水彩画的天然中国丝绸非常引人注目。这种丝绸于20世纪初出现在那里，然而它早在彼得大帝时期就已传入彼得堡。在上世纪初“翻新”之后，它又重新被使用。其彩绘题材应被认为极为罕见。这里极其详尽地描绘了著名中国瓷器生产中心——景德镇的瓷器生产过程。在墙上可以看到制坯、巨大的烧窑、成品彩绘及其运输过程。覆盖沙发厅墙壁的丝绸同样是清代中国工匠的真品。不过彩绘题材有所不同。这主要是当时中国日常生活的场景：人们坐在自家小屋里交谈，去钓鱼，观看流浪艺人的表演，购物。"}, {"type": "text", "text": "“中国风”在另一座郊外皇家离宫——皇村——也留下了不小的痕迹。叶卡捷琳娜宫中的蓝色客厅即采用“中国风格”。叶卡捷琳娜公园和亚历山大公园中出现了别具一格的“中国角”。1778—1779年，宫廷建筑师В.И.涅耶洛夫建造了一座奇特的中国剧院。1778—1786年，在风景如画的池塘之间，按Ю.М.费尔滕的设计建造了中国亭，又称“吱嘎亭”，其屋顶边缘奇特（按中国方式）上翘，饰有龙纹，令人联想到中国园林中的浪漫建筑。而在1782—1796年，按建筑师Ч.卡梅伦和В.И.涅耶洛夫的设计建造了装饰性的中国村，用于接待贵宾。"}, {"type": "text", "text": "皇村建筑群的主要建筑——叶卡捷琳娜宫——是许多俄罗斯君主的夏季离宫。它由建筑师拉斯特雷利在女皇伊丽莎白在位期间于1751—1756年建造，“中国风格”在其装饰中留下了重要痕迹。据同时代人记载，在宫殿最初的整套华丽厅室中，最引人注目的是中央的，即“带有中国装饰的中间旧厅”，也就是以中国风格装修的厅堂。该厅墙壁装饰精巧。那里陈列着大量中国、日本和萨克森瓷器。专用小搁架及其上摆放的瓷器总数达四百四十八件。1780年，在中国厅的位置上建造了正门楼梯。"}, {"type": "text", "text": "然而，即便如此，当时俄国君主的夏季行宫也不可能没有中国风格的厅室。18世纪80年代，叶卡捷琳娜宫内部居所的改建被委托给建筑师查尔斯·卡梅伦。叶卡捷琳娜二世赋予他不受限制的条件，包括使用最昂贵材料的可能。其结果是出现了若干壮丽的厅堂和房间，而在皇位继承人保罗·彼得罗维奇（未来的皇帝保罗一世）的那一半住所中，按卡梅伦的设计建成了蓝色客厅，或者更常见且更名副其实地称之为中国客厅。这是宫殿中最华丽的厅室之一。客厅之美与魅力在于，其墙壁覆以带有缠结蓝色花朵与茎蔓印花图案的装饰性蓝色丝绸。为进行装饰，卡梅伦使用了非常昂贵的中国丝绸，并以镀金雕刻的镶板与壁炉墙边框，增强了他所营造的轻盈与优雅之感。"}, {"type": "text", "text": "所谓的中国村，也许是彼得堡近郊最令人惊叹的地方之一。它位于紧邻叶卡捷琳娜公园、占地200公顷的亚历山大公园内。两座公园在性质上彼此差异很大。亚历山大公园是在大片森林的基础上建成的。"}, {"type": "text", "text": "18世纪俄国对中国艺术的迷恋，在亚历山大公园一系列建筑的建设中得到了充分体现。皇村中国村建筑群的出现，通常与建筑师卡梅伦的名字联系在一起。然而已经确定，该设计早在18世纪70年代初便已制定，也就是在他来到俄国之前数年。因此，一些艺术史家倾向于认为，作为亚历山大公园整个中国建筑群核心的中国村设计方案的制定，属于"}, {"type": "text", "text": "献给杰出的建筑师安东尼奥·里纳尔迪——他是将中国艺术引入18世纪下半叶彼得堡文化的积极拥护者。Ч.卡梅伦和В.И.涅耶洛夫在实践中将这位东方与西方艺术的卓越综合者、中国艺术的深刻阐释者的构想付诸实现。"}, {"type": "text", "text": "建筑群的结构中心是一座观象台亭，其顶部覆盖着大幅出挑、急剧弯曲的屋顶，并设有灯笼式塔楼。这座亭子位于八角形广场的中心，周围环绕着单层小屋。一条短街通向广场，街道两侧建有成中国风格的房屋。最初设想，在这条街的入口处，按照中国传统的做法，将建造一座带双坡屋顶的入口拱门。在图纸和模型中还可以看到一座八层宝塔，这是中国建筑群的典型特征。由此可见，在项目付诸实施时，未能实现所有设想中的计划，村庄的面貌也就没有本来可能呈现的那样具有中国风情。在计划建造的十八座小屋中，卡梅伦只建造了十座。"}, {"type": "text", "text": "中国村的小屋根据亚历山大一世的谕令，拨给高级官员夏季居住。就这样，在1822年，拨给四等文官Н.М.卡拉姆津（著名俄国作家、《俄罗斯国家史》的作者）两座中国小屋，供其“携家眷居住”。"}, {"type": "text", "text": "Н.М.卡拉姆津喜欢中国村的生活，他喜欢把自己在那里的居留比作想象中的中国之行。1822年5月19日他写道：“我们已在中国待了10天：干净而美丽。”住在附近的诗人В.А.茹科夫斯基常去那里拜访他。著名作家、外交家和东方学家А.С.格里鲍耶陀夫在启程前往波斯之前，也曾到中国村拜访卡拉姆津。Н.М.卡拉姆津"}, {"type": "text", "text": "他享受中国村生活的舒适与幽静，并在给朋友的信中多次指出，他在那里工作得特别好。"}, {"type": "text", "text": "在皇村的亚历山大公园里，也建造了中国风格的亭子（“大任性”和“吱嘎亭”）、几座“中国”小桥以及著名的中国剧院。"}, {"type": "text", "text": "中国剧院的设计方案由建筑师安东尼奥·里纳尔迪制定，他梦想在皇村创造一座融合中国、欧洲和俄罗斯艺术成就的建筑杰作，正如他在奥拉宁鲍姆所成功做到的那样。在“中国建筑群”的所有建筑中，剧院的外观看来与真正的中国建筑最为相似。室内装饰采用了17至18世纪真正的中国黑漆描金镶板。观众厅和舞台以木雕的中国人像装饰。到处悬挂着花环、串珠和铃铛。而在这一切华丽之上，龙在翱翔。支撑各层之间楼板的木柱，饰有色彩鲜艳的锡箔和纸板螺旋饰，顶部装有纸塑的中国人小雕像。观众厅由一盏巨大的镀金青铜吊灯照明，其形如杯盏，饰有中国风格的绘画、中国铃铛和十条龙。令人极为遗憾的是，中国剧院在伟大卫国战争期间（1941年9月15日因德军法西斯部队炮击该城）被焚毁，且再未重建。"}, {"type": "text", "text": "中国宫殿堪称“中国风格”融入俄罗斯建筑的一种典型结晶，它由安东尼奥·里纳尔迪设计，于1762至1768年间在奥拉宁鲍姆建成。许多艺术学家认为它是18世纪俄罗斯建筑中最和谐的作品之一。在创作过程中，А.里纳尔迪能够创造性地运用中国传统艺术母题，并不追求完全模仿，同时又顾及了欧洲和俄罗斯对其独特精神的感受。这使这位建筑师得以创作出他最杰出的作品之一，其才华在其中得以最充分、最鲜明地展现。"}, {"type": "text", "text": "难怪人们将这座宫殿称为“充满奇迹的18世纪的真正奇迹”，并按其给人的印象将其比作“音乐奏鸣曲”。这座轻盈优雅的建筑有机地融合了巴洛克、古典主义和中国风格的元素。中国宫殿就其实质而言是一座夏季离宫，兼具使宫殿建筑与园林亭榭相近的特征。正如中国的郊外宫殿一样，按照里纳尔迪的构思，中国宫殿周围的园林景致与宫殿厅堂有机地融为一体，建筑简直与自然融为一体。它面前至今仍生长着粗壮的橡树——与宫殿同龄。"}, {"type": "text", "text": "这座宫殿曾被人比作一只奇巧的木匣，饰有镶嵌、彩绘与浮雕。拼花地板的图案采用了中国几何纹样。抬头仰望，可以看到贴金的盘旋飞舞的龙与凤鸟塑像，它们在中国象征着自然两种本原——男与女（阳与阴）的统一。"}, {"type": "text", "text": "大中国书房天花板的中央部分是一幅由意大利画家巴罗齐绘制的顶棚画——《欧洲与亚洲的联盟》，承载着很大的思想内涵。亚洲由一个中国少年象征，欧洲则由一位欧洲相貌的少女象征。这幅顶棚画本应象征18世纪欧洲各国与亚洲国家之间贸易、政治和文化联系的扩大，并"}, {"type": "text", "text": "强调在这些联系中俄罗斯应当占据的位置，它扮演着东西方之间一座独特桥梁的角色。"}, {"type": "text", "text": "在小中国厅的装饰中，里纳尔迪积极借鉴了中国艺术的装饰元素，同时并未试图完全模仿它们。墙面装饰采用了带有中国古代彩绘的丝绸裱糊。"}, {"type": "text", "text": "宫殿各厅中收藏了大量明清时期的中国瓷器，以及雕漆和彩绘漆器。"}, {"type": "text", "text": "俄罗斯与中国之间定期贸易的建立，以及中国商品经西欧国家的输入，不仅提高了俄罗斯对中国的兴趣，而且对俄罗斯艺术手工业生产留下了印记，其中也开始出现中国母题。这种兴趣在19世纪依然延续。从这个意义上说，皇家瓷器厂的产品，以及加德纳、巴捷宁等私营工厂的瓷器制品，都颇具代表性。俄罗斯工匠有时甚至被专门派往中国，随贸易商队同行，向中国专家学习“珐琅彩绘艺术”。"}, {"type": "text", "text": "中国艺术品在俄罗斯的传播以及对“中国风”的迷恋，促进了我国对中国的兴趣的增长。可以确信地说，正是在18世纪，两种文化对话的开端迈出了决定性的一步，而中国的造型艺术与装饰艺术在这一过程中发挥了重要作用。"}]}, {"id": "tea", "title": "Чай", "paras": [{"type": "text", "text": "茶"}, {"type": "text", "text": "从18世纪末起，在俄国人从中国人那里购买的商品中，茶叶的比重大幅增加，它逐渐成为整个中国出口中越来越重要的一项，并变为社会文化互动进程中不可分割的一部分，改变着相当一部分居民的口味与需求。恰克图贸易最重要的方面是形成了独特的“茶之美学”。恰克图在保持对中国茶叶供应垄断的同时，实际上赠予了俄罗斯饮茶文化。这反过来又催生了对相关实用艺术的巨大需求——从彩绘瓷制茶具到俄罗斯风俗画中歌颂商人饮茶的著名题材的出现。"}, {"type": "text", "text": "按照传统上公认的说法，茶最早是在1638年由沙皇米哈伊尔·费奥多罗维奇派往蒙古的使臣瓦西里·斯塔尔科夫运抵皇宫的。直接来自中国的茶则是在二十年后，即已经到沙皇阿列克谢·米哈伊洛维奇宫廷时期，由俄国使节——贵族子弟伊万·佩尔菲利耶夫带回俄国的。在17世纪，茶主要被用作药物。"}, {"type": "text", "text": "法国作家大仲马在其奠基性著作《大烹饪词典》（Le Grand Dictionnaire de Cuisine）中记录了这样一个著名观察：在俄国，中国茶比在西欧要可口得多。这一美食发现是这位文人在1858年至1859年间对俄罗斯帝国进行大规模旅行时作出的。作为一个狂热的美食家和烹饪爱好者，大仲马在从圣彼得堡到高加索的整个旅途中细致地考察了当地居民的饮食习惯。处处都遇到茶炊的他得出了一个斩钉截铁的结论：“最好的茶是在彼得堡乃至整个俄国各地饮用的。”"}, {"type": "text", "text": "大仲马将俄国茶卓越口感的秘密完全归因于19世纪中叶物流的特点。当时存在两种本质上不同的从中国运送茶叶的方式，它们对这种精致产品的质量产生了根本性影响："}, {"type": "text", "text": "- 西欧路线（海路）：运往英国、法国及其他欧洲国家的茶叶由船只绕行非洲运送。茶叶具有瞬间吸收异味和湿气的特性。在漫长的数月航程中，置身于潮湿、闷热且带咸味的船舱里，茶叶不可避免地会“窒息”，失去其细腻的原始香气，并带上一种特殊的味道。"}, {"type": "text", "text": "- 俄罗斯路线（陆上恰克图之路）：运往俄罗斯的茶叶仅通过陆路以商队形式运送——经由边境的恰克图和无边无际的西伯利亚。在干燥寒冷的空气中旅行，茶叶未受到海上湿气的影响。相反，它在途中被精心晾干，完全保留了其原真的香气和精油。"}, {"type": "text", "text": "得益于恰克图贸易，优质且绝对新鲜的“商队茶”进入俄罗斯的都城和外省。除了饮品本身的卓越品质外，亚历山大·杜马还对茶文化的规模感到惊叹。他惊讶地指出，在俄罗斯没有一户人家是没有茶炊的，并记录下当地独特的传统：男人喜欢用透明的玻璃杯喝热茶，而女人则用精致的瓷杯饮茶。"}, {"type": "text", "text": "19世纪50年代，俄罗斯商人通过恰克图运来了数量惊人的茶叶。那个时代真正备受青睐、价值连城并造就了那种独一无二的“俄罗斯商队茶”风味的，是以下几种独特的中国茶："}, {"type": "text", "text": "——花香茶（白毫／白毫花香茶）：这是俄罗斯贵族最主要、最昂贵的嗜好。“白毫”一词源自汉语“白毫”（“白色的细毛”）。这意味着该茶由最细嫩的、刚刚舒展的、带有白色茸毛的茶树嫩芽制成。这些花香茶具有异常细腻、微甜的花香。正是它们占到了恰克图高档进口茶叶的70%。"}, {"type": "text", "text": "——珠茶（汗茶）：一种特殊的高档绿茶，被搓成紧实的、类似珍珠的圆球。它泡出的茶汤清淡、透亮，并以其独特的提神功效而备受珍视。"}, {"type": "text", "text": "——黄色“御用”茶：最稀有、最昂贵的品种。在中国本土，它长期仅供皇室享用。俄罗斯商人实际上是用最珍贵的西伯利亚毛皮（紫貂和白鼬）来交换它。"}, {"type": "text", "text": "——良兴与马玉琨：在商人和贵族阶层中广受欢迎的黑茶（按中国分类为红茶），口感醇厚如丝绒。"}, {"type": "text", "text": "对于较为贫困的阶层，恰克图供应“砖茶”（压制茶）。为便于运输，它被压成沉重的砖块。这种茶常按西伯利亚和亚洲的配方熬煮——加盐、牛奶和黄油。"}, {"type": "text", "text": "在驼背上长途运输的过程中，中国的优质红茶（如传奇般的祁门红茶）不自觉地吸收了傍晚商队篝火散发的淡淡烟香。于是，举世闻名的拼配茶「俄罗斯商队」（Russian Caravan）便由此诞生——这是一种带有几乎难以察觉的高贵「烟熏」味的茶，至今仍供应于欧洲和亚洲最好的茶馆中。"}, {"type": "text", "text": "中国茶种祁门红茶（Цимэнь Хун Ча / 祁门红茶）凭借其独特的口感、化学及历史特性，成为著名的欧洲和俄罗斯拼配茶（首先是传奇般的「俄罗斯商队」）的「脊梁」和不可替代的基础。"}, {"type": "text", "text": "它在世界市场上的特殊地位由四个关键原因决定："}, {"type": "text", "text": "1. “祁门香”的独特风味（Keemun Fragrance）"}, {"type": "text", "text": "祁门红茶跻身世界三大最香茶叶之列。其香气馥郁、深邃的韵味，在国际评茶实践中获得了正式名称——“祁门香”。它融合了成熟水果、干李子（西梅干）的香调、淡淡的酒香以及高贵木材（松木）的气息。正因这种复杂而丝绒般的香气谱系，欧洲人怀着敬意将祁门红茶誉为“茶中勃艮第”。如此丰富的自身风味，使其成为理想的底茶（基底），在与其它品种拼配时也不会失去自身特色。"}, {"type": "text", "text": "2. 与正山小种树脂般烟熏味的非凡融合性"}, {"type": "text", "text": "在经典的“俄罗斯商队”拼配茶（Russian Caravan）中，祁门红茶与著名的烟熏茶正山小种（Lapsang Souchong，Zheng Shan Xiao Zhong / 正山小种）相拼配。"}, {"type": "text", "text": "如果说正山小种散发出强烈、锐利、带有焦油气息的松烟香，那么祁门红茶则扮演着“柔化”元素的角色。"}, {"type": "text", "text": "——祁门红茶紧实、带甜润麦芽味的“茶体”完美平衡了烟熏的侵略感，营造出商队篝火般高贵、柔和、“温馨”的滋味，而无过度苦涩。[3. 对欧洲与俄罗斯茶传统的坚守"}, {"type": "text", "text": "与只喝清茶的中国不同，在俄罗斯和欧洲（尤其是英国）形成了丰盛茶宴的传统。茶开始被饮用。"}, {"type": "text", "text": "加牛奶或奶油（英国传统）。"}, {"type": "text", "text": "加柠檬、糖、蜂蜜，或就着浓果酱含糖而饮（俄罗斯传统）。"}, {"type": "text", "text": "——大多数精细的中国茶（例如绿茶或清淡的白茶）如果加入牛奶或柠檬，就会完全失去其特性。而祁门红茶则具有很高的浸出物含量和浓度。即使加入牛奶或糖，它也不会变得淡薄如水，仍能保持其特有的醇厚滋味和美丽的宝石红色茶汤。"}, {"type": "text", "text": "4. 历史出口起源"}, {"type": "text", "text": "尽管祁门县（安徽省）产茶已有数百年历史，但正是在那里，红茶（黑茶）的工艺被完善到理想状态的时间相对较晚——在1875年。该品种的创制者最初就瞄准了欧洲商人迅速增长的需求。其结果是，祁门红茶被创制为一种“新型茶”。它兼具中国原料的精致与对长途运输的适应性。它迅速取代了更古老、更粗糙的品种，并稳固地占据了主要出口宠儿的地位，成为俄罗斯和西方优质红茶的典范。"}]}, {"id": "perlov", "title": "Перловы — «чайные короли» России", "paras": [{"type": "text", "text": "可以确认，茶叶贸易不仅促进了俄中经贸联系的扩展，而且为新的文化相互影响形式的出现创造了条件。从这个意义上说，俄国最大的茶商——佩尔洛夫商人家族的活动极具代表性。"}, {"type": "text", "text": "这个商人家族不可估量的功绩在于，使茶在俄国得到普及，并在普通民众中广泛传播。阿列克谢·伊万诺维奇·佩尔洛夫于1787年在莫斯科（红场上的贸易市场）开设了茶叶零售商铺，并开始使莫斯科人养成饮茶的习惯。他的儿子瓦西里·佩尔洛夫于19世纪初创办了“瓦·佩尔洛夫父子”公司。"}, {"type": "text", "text": "凭借娴熟的贸易政策以及通过恰克图获得中国茶叶的上等品种，佩尔洛夫家族跻身茶叶贸易的前沿水平。第一，他们采用并发展了竞争对手——茶商阿·古布金的方法——茶叶分级定量（店员只按等级出售茶叶，且只按为每一等级规定的价格出售）。茶叶可以按任意数量、甚至最小的数量称售给顾客。第二，为了将茶作为有益饮品加以推广，佩尔洛夫家族开始使用绘有图案的马口铁和铝制茶叶罐，上面印有易于记住的关于茶的说教性格言（类似现代广告语），例如：“不喝茶——哪来的力气？”¹。第三，瓦西里·佩尔洛夫投入大量精力与充斥茶叶市场的假货作斗争。"}, {"type": "text", "text": "最终，佩尔洛夫家族真正成为了俄国的“茶叶之王”，"}, {"type": "text", "text": "谢尔盖·瓦西里耶维奇·佩尔洛夫（谢尔盖·伊万诺维奇的小儿子）于1869年从家族的长房一支中分离出来（其结果是在莫斯科出现了两家彼此竞争的佩尔洛夫商号），创立了自己的茶叶贸易公司“谢尔盖·瓦西里耶维奇·佩尔洛夫公司”，该公司连同其茶叶分装厂一起落户于米亚斯尼茨卡亚街上的一栋房屋中。1890—1893年间，建筑师Р.И.克莱因重新建造了这座建筑。С.В.佩尔洛夫酷爱中国艺术，将自己的中国绘画和瓷器收藏陈设在居室内。那里还举办过音乐晚会和家庭戏剧演出。"}, {"type": "text", "text": "1896年春，当莫斯科正筹备皇帝尼古拉二世的加冕典礼并等待外国代表团到来之际，莫斯科的茶商们非常指望能与中国皇帝的使臣李鸿章会面，希望借此为其扩大对华贸易的计划争取支持。当所有人都在为这次来访做准备时，谢尔盖·佩尔洛夫想到要把自己在米亚斯尼茨卡亚街上的宅邸按中国风格重新装饰一番。他邀请了年轻建筑师卡尔·吉皮乌斯，后者在不改动房屋本身的情况下，将宅邸的立面和店铺内部改造成奇特的中国风格：立面上出现了小龙、伞、东方灯笼、纹样，而一座形似宝塔的微型小塔则为这座“茶屋”画上了句号。店铺内部则因带有鎏金雕花木制柜台和巨大的中国瓷瓶而更显富丽。“橡木拼花地板被铺上了手工制作的中国地毯，门旁立着两尊彩绘木雕中国人像，仿佛在邀请人们走进店铺” $^{ii}$ 。"}, {"type": "text", "text": "С.В.佩尔洛夫曾希望，这位对中国受到如此礼遇而深受感动的中国贵宾，一定会下榻在他那里。然而李鸿章却更青睐佩尔洛夫家族的长支。1896年5月5日，人们在第一梅尚斯卡亚街迎接了他，并献上银盘和造型盐罐作为礼物。作为回赠，这位中国使臣授予主人尼古拉·谢苗诺维奇·佩尔洛夫二级双龙荣誉勋章。"}, {"type": "text", "text": "然而，这座位于米亚斯尼茨卡亚街、终究未能见到李鸿章的宅邸，不仅成为莫斯科一处独特的景观，被市民称为“中国匣子”，而且还得以变成某种象征——19世纪末俄中社会文化互动的象征，其中交织着彼此的贸易利益与文化影响。"}, {"type": "text", "text": "1893年，一位中国茶农来到俄罗斯帝国（在俄文史料中其名写作刘峻周，本姓刘），随身带来了1万株茶树枝条和数百普特茶籽。他在我国一直生活到1926年，指导茶叶的培育与生产工作。他曾获得沙皇政府和苏联政府颁发的政府奖赏。在一张近来变得知名的照片上，他胸前佩戴着沙皇勋章；这张照片由俄国彩色摄影奠基人С.М.普罗库金-戈尔斯基摄于1914年。他的儿子刘泽荣（刘绍周，劳秀周，1892—1970）毕业于圣彼得堡大学，十月革命后领导过俄国中国工人联合会，并撰写了回忆与В.И.列宁会面的著作$^{iii}$。"}]}, {"id": "crossyears", "title": "Перекрестные годы России и Китая", "paras": [{"type": "text", "text": "俄中“交叉”（主题）年是一种独特的外交与人文形式，旨在系统性地推动两国相互接近。两国并非进行点状式的访问，而是在一到两年内完全聚焦于某一具体合作领域，举办数百场联合展览、节庆、学术会议及大型巡演。"}, {"type": "text", "text": "交叉年时间顺序一览"}, {"type": "text", "text": "自2000年代后半期以来，俄中两国已在国家层面实施了十项大规模两年期计划："}, {"type": "text", "text": "举办时期"}, {"type": "text", "text": "2006—2007年"}, {"type": "text", "text": "主题系列的正式名称"}, {"type": "text", "text": "2009—2010年。"}, {"type": "text", "text": "俄中国家年"}, {"type": "text", "text": "俄语和汉语互办语言年"}, {"type": "text", "text": "2012—2013年 旅游年"}, {"type": "text", "text": "2014—2015年 青年交流年"}, {"type": "text", "text": "2016—2017年 媒体交流年"}, {"type": "text", "text": "2018—2019年 地区间合作主题交流年"}, {"type": "text", "text": "2020—2021年 科技与创新合作主题交流年"}, {"type": "text", "text": "2022—2023年 体育与运动领域合作主题交流年"}, {"type": "text", "text": "2024—2025年 俄中文化互鉴年"}, {"type": "text", "text": "2026—2027年 教育领域合作互鉴年"}, {"type": "text", "text": "对两国文化互动的意义"}, {"type": "text", "text": "主题年的定期举办将俄中文化合作提升到了全新的水平，一举解决了多项战略任务："}, {"type": "text", "text": "• 克服刻板印象与文化壁垒：主题年（尤其是语言年、旅游年和文化年）有助于摆脱对他国的表面化认知。对传统艺术、当代文学、电影艺术和饮食传统的相互发现拉近了两国人民的心态。"}, {"type": "text", "text": "——古典与民间艺术的大规模融合：得益于文化年（2024—2025年），举办了一系列规模宏大的交叉项目：大剧院和奥西波夫乐团在中国的巡演、莫斯科克里姆林宫博物馆与中国国家博物馆的联合展览，以及中国传统文化节在俄罗斯各大城市的举办。"}, {"type": "text", "text": "——共同教育与科学空间的形成：在语言年及当前教育年（2026—2027年）框架内，专业教研室、联合大学（例如深圳的中俄联合大学）及语言学校的数量成倍增长。学习俄语和汉语的学生人数不断增加，这直接为两国培养未来的翻译与学术精英。"}, {"type": "text", "text": "——青年一代之间的联系：青年交流互办年活动为横向联系奠定了长期基础。中小学生、大学生、青年学者、企业家和运动员有机会在志愿者营地、论坛和比赛框架内直接交流，从而构筑起牢固的睦邻人文基础。"}, {"type": "text", "text": "——合作的去中心化：“区域间合作”方案不仅使莫斯科、圣彼得堡与北京之间建立起友好城市和文化联系，还使中国偏远省份以及西伯利亚、远东、伏尔加河流域和乌拉尔地区参与到文化交流中来。"}, {"type": "text", "text": "总结：主题年将俄中人文交流从各种官方活动转变为持续、生动而深入的文化间对话进程，涵盖两国数百万普通公民。"}, {"type": "text", "text": "该倡议旨在扩大教育、科学和高校交流领域的双边合作。项目框架内计划发展联合教育项目、学术流动、科学研究以及中小学生、大学生和教师交流。"}, {"type": "text", "text": "据2026年5月的消息，活动计划的俄方部分包括103个项目。它们旨在发展高等教育、中等职业教育和中小学教育，在中国推广俄语、在俄罗斯推广汉语，以及加强科学和青年合作。"}]}];;

    ],
    "tea": [

        "茶"
    ],

        "佩尔洛夫——俄国的「茶王」"
